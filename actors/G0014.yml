description:
  en: |-
    A military-political movement (the Armed Forces of South Russia) that advocated the restoration of a "one and indivisible" Russia.
    In 1918–1920 it conducted combat operations on the territory of Ukraine against both the Bolsheviks and the Ukrainian People's Republic (UNR), denying Ukraine's right to independence.
  uk: |-
    Військово-політичний рух (Збройні сили Півдня Росії), що виступав за реставрацію «єдиної та неподільної» Росії.
    У 1918–1920 роках вів бойові дії на території України як проти більшовиків, так і проти УНР, заперечуючи право України на незалежність.
  ru: |-
    Военно-политическое движение (Вооруженные силы Юга России), выступавшее за реставрацию «единой и неделимой» России.
    В 1918–1920 годах вело боевые действия на территории Украины как против большевиков, так и против УНР, отрицая право Украины на независимость.
