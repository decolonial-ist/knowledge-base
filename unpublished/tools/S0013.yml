description:
  en: |-
    Period of activity: 1699–1711 (as the Near Chancellery); functionally — from the mid-17th century through the system of Prikazes.

    Type of instrument: The monarch's personal administrative apparatus and central agencies.

    A transitional instrument from the medieval "petitioning" (chelobitye) to regular imperial dictate.
    Within colonial practices, the Chancellery provided the legal basis for the absorption of autonomies, converting treaty-based relations into unilateral monarchical decrees.
    It served as a "factory of meanings" where formulations about "eternal subjecthood" and "treason" were produced.

    It includes the Little Russian Prikaz and the Near Chancellery of Peter I. This instrument allowed the monarch to govern the Hetmanate promptly, bypassing the cumbersome Boyar Duma, and paved the way for the creation of the Senate (S0014) and the final unification of the empire.
  uk: |-
    Період активності: 1699–1711 рр. (як Ближня канцелярія); функціонально — із середини XVII століття через систему Приказів.

    Тип інструмента: Особистий адміністративний апарат монарха та центральні відомства.

    Перехідний інструмент від середньовічного «чолобиття» до регулярного імперського диктату.
    У межах колоніальних практик Канцелярія забезпечувала юридичну базу для поглинання автономій, переводячи договірні відносини у площину односторонніх монарших указів.
    Вона слугувала «фабрикою смислів», де створювалися формулювання про «вічне підданство» та «зраду».

    Включає Малоросійський приказ і Ближню канцелярію Петра I. Цей інструмент дозволив монархові оперативно управляти Гетьманщиною в обхід громіздкої Боярської думи, готуючи ґрунт для створення Сенату (S0014) та остаточної уніфікації імперії.
  ru: |-
    Период активности: 1699–1711 гг. (как Ближняя канцелярия); функционально — с середины XVII века через систему Приказов.

    Тип инструмента: Личный административный аппарат монарха и центральные ведомства.

    Переходный инструмент от средневекового «челобитья» к регулярному имперскому диктату.
    В рамках колониальных практик Канцелярия обеспечивала юридическую базу для поглощения автономий, переводя договорные отношения в плоскость односторонних монарших указов.
    Она служила «фабрикой смыслов», где создавались формулировки о «вечном подданстве» и «измене».

    Включает в себя Малороссийский приказ и Ближнюю канцелярию Петра I. Этот инструмент позволил монарху оперативно управлять Гетманщиной в обход громоздкой Боярской думы, подготавливая почву для создания Сената (S0014) и окончательной унификации империи.
