name:
  en: Restriction of Internal Migration - Propiska
  uk: Обмеження внутрішньої міграції - Прописка
  ru: Ограничение внутренней миграции - Прописка
contributors: []
description:
  en: |-
    Propiska is a system of registration at one's place of permanent residence that was used in the Russian Empire and was extensively developed in the USSR to control the movement of the population.
    The propiska made it possible to control population movement, to encourage the resettlement of groups useful to the empire onto the traditional territories of colonized peoples, and to prevent peoples expelled in the course of ethnic cleansings from returning to their places of traditional residence.
  uk: |-
    Прописка — це система реєстрації за місцем постійного проживання, що використовувалася в Російській імперії та набула широкого розвитку в СРСР для контролю за переміщенням населення.
    Прописка дозволяла контролювати переміщення населення, заохочувати переселення потрібних імперії груп на традиційні території колонізованих народів, а також запобігати поверненню народів, виселених під час етнічних чисток, до місць традиційного проживання.
  ru: |-
    Прописка - это система регистрации по месту постоянного проживания, использовавшаяся в Российской империи и получившая широкое развитие в СССР для контроля перемещения населения.
    Прописка позволяла контролировать перемещение населения, поощрять переселение нужных империи групп на традиционные территории колонизированных народов, а также предотвращать возвращение народов, выселенных в ходе этнических чисток, в места традиционного проживания.
