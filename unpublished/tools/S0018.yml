description:
  ru: |-
    Верховный тайный совет — высшее совещательное государственное учреждение Российской империи в 1726—1730 годах в составе 6-8 человек.
    Создан императрицей Екатериной I как совещательный орган, решал важнейшие государственные вопросы.
    Ключевую позицию в Совете изначально занимал Александр Меншиков, а после его опалы (в 1727 году) — князья Долгоруковы и Голицыны.
  en: |-
    The Supreme Privy Council was the highest deliberative state institution of the Russian Empire in 1726–1730, comprising 6–8 members.
    Created by Empress Catherine I as an advisory body, it decided the most important matters of state.
    The key position in the Council was initially held by Alexander Menshikov, and after his fall from favor (in 1727) by the princes Dolgorukov and Golitsyn.
  uk: |-
    Верховна таємна рада — вищий дорадчий державний орган Російської імперії у 1726–1730 роках у складі 6–8 осіб.
    Створена імператрицею Катериною I як дорадчий орган, вирішувала найважливіші державні питання.
    Ключову позицію в Раді спочатку посідав Олександр Меншиков, а після його опали (1727 року) — князі Долгорукови та Голіцини.
