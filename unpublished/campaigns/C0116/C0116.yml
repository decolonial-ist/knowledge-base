  ru: |-
    С апреля по сентябрь 2022 года Российская Федерация держала Изюм на Харьковщине, пытая и убивая жителей: после освобождения города в лесу нашли массовое захоронение, а на момент отчёта следствия 122 извлечённых тела оставались неопознанными(Citation: 524)(Citation: 221).

    Комиссия ООН зафиксировала на Харьковщине ту же систему, что и на севере: казни без судебного разбирательства в 17 населённых пунктах Черниговской, Харьковской, Киевской и Сумской областей и отмечает «широко распространённую практику пыток и бесчеловечного обращения со стороны российских властей в отношении лиц, задержанных ими» в том числе в Харьковской области(Citation: 221).
    Масштаб разрушений в самом Изюме комиссия отмечает особо: её «поразили масштабы разрушений в городах Харьков, Чернигов и Изюм»(Citation: 221).
    После отхода российских войск в сентябре 2022 года следствие начало эксгумацию массового захоронения в лесу под городом.
    Начальник следственного управления полиции Харьковской области Сергей Болвинов сообщил, что получены ДНК-профили всех погибших и следствие ждёт обращений родственников; на момент публикации отчёта 122 тела оставались неопознанными(Citation: 524).
