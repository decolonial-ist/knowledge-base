  ru: |-
    Массовое захоронение в лесу под освобождённым Изюмом.
    После отхода российских войск в сентябре 2022 года началась эксгумация; начальник следственного управления полиции Харьковской области Сергей Болвинов сообщил, что получены ДНК-профили всех погибших и следствие ожидает обращений родственников, а 122 тела на момент отчёта оставались неопознанными(Citation: 524).
    Комиссия ООН описывает ту же систему на Харьковщине: казни без надлежащего судебного разбирательства были задокументированы в 17 населённых пунктах Черниговской, Харьковской, Киевской и Сумской областей(Citation: 221).
