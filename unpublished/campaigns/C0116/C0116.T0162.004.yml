description:
  ru: |-
    Пытки задержанных в оккупированном городе.
    Комиссия ООН формулирует вывод так: она выявила «широко распространённую практику пыток и бесчеловечного обращения со стороны российских властей в отношении лиц, задержанных ими» в Черниговской, Донецкой, Харьковской, Херсонской, Киевской, Сумской и Запорожской областях Украины; большинство жертв составляли мужчины, пытали и гражданских, и военнопленных(Citation: 221).
    Комиссия отмечает, что по мере укрепления контроля над территориями в местах лишения свободы, по её формулировке, «систематически применялись более разнообразные, но схожие методы пыток»(Citation: 221).
