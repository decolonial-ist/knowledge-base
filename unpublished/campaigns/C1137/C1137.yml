description:
  en: |-
    NOT CONFIRMED BY A DOCUMENT OF THE ACT.
    A cross-section of Tsitsianov's administration (1802-1806) with respect to the Nokhchi.
    All findings are either a declaration of method without an act of its application (letters of Tsitsianov and Vorontsov from AKAK vol. 2), or a specific act without an accessible primary source (Shepelev's expedition of June 25, 1803 — known only via Ibragimov through Wikipedia; absent from AKAK vols. 1-2, absent from Potto vols. 1-2, absent from Dubrovin vol. 4 and Gordin).
    Under the project's evidentiary floor (intent does not equal action; an act requires a primary source), not a single procedure stands firm.
    The campaign has been entered in red as groundwork for future verification against the RGVIA archive (formerly TsGVIA) or the works of Sh.
    B. Akhmadov / T. Kh.
    Ibragimov.
  uk: |-
    НЕ ПІДТВЕРДЖЕНО ДОКУМЕНТОМ АКТА.
    Зріз ціціановського управління (1802-1806) щодо Нохчі.
    Усі знахідки — або декларація методу без акта його застосування (листи Ціціанова та Воронцова з АКАК т. 2), або конкретний акт без доступного першоджерела (похід Шепелєва 25 червня 1803 — відомий лише за Ібрагімовим через Вікіпедію; в АКАК тт. 1-2 відсутній, у Потто тт. 1-2 відсутній, у Дубровіна т. 4 та Гордіна відсутній).
    За доказовим порогом проєкту (намір не дорівнює дії; акт вимагає першоджерела) жодна процедура не стоїть твердо.
    Кампанію внесено червоним як заділ для майбутньої перевірки за архівом РДВІА (кол.
    ЦДВІА) або за працями Ш. Б. Ахмадова / Т. Х. Ібрагімова.
  ru: |-
    НЕ ПОДТВЕРЖДЕНО ДОКУМЕНТОМ АКТА.
    Срез цициановского управления (1802-1806) по нохчи.
    Все находки - либо декларация метода без акта его применения (письма Цицианова и Воронцова из АКАК т. 2), либо конкретный акт без доступного первоисточника (поход Шепелева 25 июня 1803 - известен только по Ибрагимову через Википедию; в АКАК тт. 1-2 отсутствует, у Потто тт. 1-2 отсутствует, у Дубровина т. 4 и Гордина отсутствует).
    По доказательственному полу проекта (намерение не равно действию; акт требует первоисточника) ни одна процедура не встает твердо.
    Кампания внесена красным как задел для будущей проверки по архиву РГВИА (бывш.
    ЦГВИА) или по работам Ш. Б. Ахмадова / Т. Х. Ибрагимова.
    Test.
