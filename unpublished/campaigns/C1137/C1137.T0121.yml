description:
  ru: |-
    НЕ ПОДТВЕРЖДЕНО КАК АКТ.
    Первоисточник имеется (АКАК т. 2, письмо генерала Цицианова князю Чарторыйскому от 10 марта 1804 года), но он содержит ДЕКЛАРАЦИЮ МЕТОДА, а не акт его применения: уничтожение посевов летом и угон скота зимой и осенью названы вернейшими средствами принуждения чеченцев к подчинению.
    Кого, где и когда лишили хлеба этим методом - документ не сообщает.
    По доказательственному полу проекта намерение/доктрина не равно совершенному действию, поэтому техника твердо НЕ встает.
    Внесено красным: требует документа, фиксирующего конкретный акт уничтожения хлеба у нохчи.
  en: |-
    NOT CONFIRMED AS AN ACT.
    A primary source exists (AKAK vol. 2, General Tsitsianov's letter to Prince Czartoryski of March 10, 1804), but it contains a DECLARATION OF METHOD, not an act of its application: the destruction of crops in summer and the driving off of livestock in winter and autumn are named the surest means of subduing Chechens.
    Whom this method deprived of grain, where, and when — the document does not say.
    Under the project's evidentiary standard, intent/doctrine does not equal a committed act, so the technique firmly does NOT stand.
    Entered in red: requires a document recording a specific act of destruction of the Nokhchi's grain.
  uk: |-
    НЕ ПІДТВЕРДЖЕНО ЯК АКТ.
    Першоджерело є (АКАК т. 2, лист генерала Ціціанова князю Чарторийському від 10 березня 1804 року), але воно містить ДЕКЛАРАЦІЮ МЕТОДУ, а не акт його застосування: знищення посівів улітку та відгін худоби взимку й восени названі найпевнішими засобами примусу Чеченців до підпорядкування.
    Кого, де і коли позбавили хліба цим методом — документ не повідомляє.
    За доказовим полем проєкту намір/доктрина не дорівнює вчиненій дії, тому техніка твердо НЕ підтверджується.
    Внесено червоним: потребує документа, що фіксує конкретний акт знищення хліба у Нохчі.
