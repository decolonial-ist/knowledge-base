name:
  ru: Установка марионеточного правительства через фиктивные выборы (1995–1996)
  en: Installation of a puppet government through sham elections (1995–1996)
  uk: Встановлення маріонеткового уряду через фіктивні вибори (1995–1996)
description:
  ru: 'Проведение псевдовыборов главы республики (Д. Завгаева) в условиях оккупации, военного времени, отсутствия списков избирателей и жесткого ограничения свободы передвижения(Citation: 27).'
  en: 'The holding of pseudo-elections for the head of the republic (D. Zavgaev) under conditions of occupation and wartime, in the absence of voter rolls, and under severe restrictions on freedom of movement(Citation: 27).'
  uk: 'Проведення псевдовиборів глави республіки (Д. Завгаєва) в умовах окупації, воєнного часу, відсутності списків виборців і жорсткого обмеження свободи пересування(Citation: 27).'
