description:
  en: |-
    Infrastructural strangulation of the region.
    Imposition of financial sanctions and the severing of air, rail, and road links with the republic(Citation: 26).
  uk: |-
    Інфраструктурне удушення регіону.
    Запровадження фінансових санкцій, перекриття повітряного, залізничного та автомобільного сполучення з республікою(Citation: 26).
  ru: |-
    Инфраструктурное удушение региона.
    Введение финансовых санкций, перекрытие воздушного, железнодорожного и автомобильного сообщения с республикой(Citation: 26).
