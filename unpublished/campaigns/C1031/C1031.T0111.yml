description:
  ru: 'Принудительное размещение мирных жителей перед бронетехникой в Самашках (март 1996) и использование больных и медперсонала для прикрытия отхода федеральных войск из больницы №9 Грозного (август 1996)(Citation: 27).'
  en: 'Forced placement of civilians in front of armored vehicles in Samashki (March 1996) and the use of patients and medical staff to cover the withdrawal of federal troops from Hospital No. 9 in Grozny (August 1996)(Citation: 27).'
  uk: 'Примусове розміщення мирних жителів перед бронетехнікою в Самашках (березень 1996) та використання хворих і медперсоналу для прикриття відходу федеральних військ з лікарні №9 Грозного (серпень 1996)(Citation: 27).'
