name:
  ru: Использование «живого щита» и заложников (1995–1996)
  en: Use of "human shields" and hostages (1995–1996)
  uk: Використання «живого щита» і заручників (1995–1996)
description:
  ru: 'Систематическая практика захвата мирных жителей для шантажа и обмена, а также использование невооруженных людей (включая женщин, детей и врачей) для тактического прикрытия военной техники и личного состава(Citation: 27).'
  en: 'The systematic practice of seizing civilians for blackmail and exchange, as well as the use of unarmed people (including women, children, and doctors) as tactical cover for military equipment and personnel(Citation: 27).'
  uk: 'Систематична практика захоплення мирних жителів для шантажу та обміну, а також використання беззбройних людей (зокрема жінок, дітей і лікарів) для тактичного прикриття військової техніки та особового складу(Citation: 27).'
