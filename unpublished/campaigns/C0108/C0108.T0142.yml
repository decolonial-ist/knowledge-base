  ru: |-
    Выдавливание населения с правого берега Днепра через непрерывный дроновый террор.
    Комиссия ООН заключила: масштаб и интенсивность ударов, разрушение домов и базовой инфраструктуры, охота на любой транспорт и нападения на аварийные и спасательные службы, по оценке комиссии, «сделали затронутые районы непригодными для жизни и не оставили многим жителям иного выбора, кроме бегства»; повторяющиеся удары, распространение роликов и записи, призывающие уезжать, комиссия описывает как «скоординированную государственную политику российских властей, направленную на то, чтобы вынудить население Херсонщины покинуть эту территорию»(Citation: 515).
