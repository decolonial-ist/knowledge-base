  ru: |-
    Превращение повседневной жизни города в смертельный риск.
    Комиссия ООН установила: обстоятельства ударов, видеозаписи и прямые угрозы в текстовых публикациях показывают, что российские силы и те, кто их поддерживает, по формулировке комиссии «совершали акты или угрозы насилия с главной целью посеять террор среди гражданского населения»(Citation: 515).
    Врач херсонской больницы описывает происходящее так: «Они просто гоняются и охотятся за гражданскими, которые идут на работу или выгуливают собак.
    Они сбрасывают взрывчатку с дронов, будто это видеоигра»(Citation: 515).
