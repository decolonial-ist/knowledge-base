description:
  ru: |-
    Удары по машинам скорой помощи, чтобы отрезать раненых от помощи.
    Комиссия ООН зафиксировала: «машины скорой помощи, пользующиеся особой защитой по международному праву, становились целями и поражались дронами, чтобы не дать им добраться до пострадавших, подвергшихся нападению ранее»(Citation: 515).
    Житель села Станислав рассказал, как в ноябре 2024 года дрон сбросил взрывчатку рядом с ним, тяжело ранив ногу, а затем, по его свидетельству, «дрон сбросил два взрывных устройства на машину скорой помощи», приехавшую его спасать(Citation: 515).
