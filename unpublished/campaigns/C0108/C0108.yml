name:
  ru: '«Человеческое сафари»: охота на гражданских Херсонщины (с 2024)'
  en: '“Human Safari”: Hunting Civilians in Kherson Province (from 2024)'
  uk: '«Людське сафарі»: полювання на цивільних Херсонщини (з 2024)'
description:
  ru: |-
    С июля 2024 года Российская Федерация с помощью малых дронов охотится на гражданских жителей Херсонщины вдоль правого берега Днепра: комиссия ООН насчитала около 150 убитых и сотни раненых в Херсоне и 16 населённых пунктах и квалифицировала эти удары как преступление против человечности в форме убийства(Citation: 515).

    Атаки идут по полосе больше ста километров вдоль правого берега Днепра и устроены одинаково: операторы ведут цель по видео в реальном времени и сбрасывают взрывчатку на людей, которые заведомо видны как гражданские.
    Комиссия описывает: «операторы дронов использовали видеопоток, передаваемый в реальном времени камерами дронов, наводились на цели, которые выглядели гражданскими, и сбрасывали на них взрывчатку»(Citation: 515).
    Отдельно бьют по машинам скорой помощи, чтобы они не доехали до уже раненых: житель села Станислав рассказал комиссии, как дрон сбросил взрывчатку рядом с его мопедом, а когда приехала скорая и ему оказывали помощь, произошло следующее: «дрон сбросил два взрывных устройства на машину скорой помощи»(Citation: 515).
    Врач херсонской больницы описывает это так: «Они просто гоняются и охотятся за гражданскими, которые идут на работу или выгуливают собак.
    Они сбрасывают взрывчатку с дронов, будто это видеоигра»(Citation: 515).
    Комиссия построила выводы на 300 с лишним видео самих атак, более чем 600 текстовых записях в телеграм-каналах и 91 разговоре с пострадавшими, свидетелями, местной властью и медиками; публикацию видео убийств она отнесла к военному преступлению в виде посягательства на человеческое достоинство(Citation: 515).
    Совокупность ударов, распространение роликов и записи, прямо призывающие жителей уезжать, комиссия оценивает как «скоординированную государственную политику российских властей, направленную на то, чтобы вынудить население Херсонщины покинуть эту территорию»(Citation: 515).
