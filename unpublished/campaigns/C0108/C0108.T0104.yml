description:
  ru: |-
    Целенаправленное убийство гражданских Херсонщины сбросами с дронов.
    Комиссия ООН заключила, что с июля 2024 года российские силы систематически убивают и калечат гражданских на полосе более ста километров вдоль правого берега Днепра, и квалифицировала это как преступление против человечности в форме убийства; по официальным данным, в Херсоне и 16 населённых пунктах убито около 150 гражданских и сотни ранены(Citation: 515).
    Комиссия описывает механику: «операторы дронов использовали видеопоток, передаваемый в реальном времени камерами дронов, наводились на цели, которые выглядели гражданскими, и сбрасывали на них взрывчатку»(Citation: 515).
