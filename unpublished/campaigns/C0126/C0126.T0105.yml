  ru: |-
    Разрушение энергетической системы страны как связного объекта.
    Управление ООН по правам человека описывает результат так: удары «снизили мощность генерации электроэнергии и привели к длительным веерным отключениям, затронувшим домохозяйства, больницы, школы и другие жизненно важные службы», а нарушения водоснабжения и канализации дополнительно ударили по повседневной жизни(Citation: 530).
    Про октябрь 2025 года управление сообщает: российские силы «возобновили масштабные скоординированные удары по энергетическим объектам по всей стране»(Citation: 358).
