description:
  ru: |-
    Планомерное выбивание генерации и теплоснабжения перед зимой.
    Управление ООН по правам человека насчитало за период с октября 2025 по март 2026 года «не менее 423 ударов по объектам генерации, передачи и распределения электроэнергии, а также не менее 74 ударов по теплоэлектроцентралям и другой инфраструктуре отопления»(Citation: 530).
    За зиму 2023-2024 годов оно же фиксирует: «повреждение объектов энергетической инфраструктуры оставило многие прифронтовые общины без электричества и отопления в зимние месяцы»(Citation: 516).
    Практику подтвердил Путин 8 декабря 2022 года: «Много шума по поводу наших ударов по энергетической инфраструктуре соседней страны.
    Да, мы это делаем»(Citation: 243).
