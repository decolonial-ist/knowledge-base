  ru: |-
    Лишение гражданского населения тепла в разгар зимы как давление на страну.
    Глава мониторинговой миссии ООН по правам человека в Украине Даниэль Белл подводит итог зимы 2025-2026 годов: «Потеря электричества и отопления зимой сказалась на здоровье, безопасности и способности людей поддерживать достаточный жизненный уровень, особенно для пожилых людей, людей с инвалидностью и семей с детьми»(Citation: 530).
    Сотни тысяч гражданских пережили перебои с отоплением в периоды сильных холодов(Citation: 530).
