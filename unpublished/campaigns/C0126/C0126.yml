name:
  ru: Война против энергосистемы (с 2022)
  en: War on the Power Grid (from 2022)
  uk: Війна проти енергосистеми (з 2022)
description:
  ru: |-
    С октября 2022 года Российская Федерация волнами массированных ракетных и дроновых ударов выбивает украинскую генерацию, передачу электроэнергии и теплоснабжение, чтобы оставить гражданское население без света и тепла зимой: только с октября 2025 по март 2026 года нанесено не менее 423 ударов по объектам электроэнергетики и не менее 74 - по теплоэлектроцентралям и другой инфраструктуре отопления(Citation: 530)(Citation: 243).

    Метрополия объяснила эту практику открыто. 8 декабря 2022 года Путин на встрече с военными в Кремле подтвердил удары словами: «Много шума по поводу наших ударов по энергетической инфраструктуре соседней страны.
    Да, мы это делаем», - и тут же перечислил, кого считает начавшим: тех, кто ударил по Крымскому мосту, подорвал линии электропередачи от Курской АЭС и перекрыл воду Донецку(Citation: 243).
    Управление ООН по правам человека фиксирует последствия по зимам.
    За зиму 2023-2024 годов «повреждение объектов энергетической инфраструктуры оставило многие прифронтовые общины без электричества и отопления в зимние месяцы»(Citation: 516).
    Про октябрь 2025 года управление сообщает: российские силы «возобновили масштабные скоординированные удары по энергетическим объектам по всей стране, вызвав аварийные отключения электроэнергии и веерные отключения по всей стране», причём отключения длились по несколько суток и лишали жителей воды, отопления, возможности хранить и готовить еду и пользоваться лифтами в многоэтажных домах(Citation: 358).
    За период с октября 2025 по март 2026 года управление насчитало «не менее 423 ударов по объектам генерации, передачи и распределения электроэнергии, а также не менее 74 ударов по теплоэлектроцентралям и другой инфраструктуре отопления», после которых сотни тысяч гражданских остались без отопления в сильные морозы(Citation: 530).
    Глава мониторинговой миссии ООН Даниэль Белл формулирует итог: «Потеря электричества и отопления зимой сказалась на здоровье, безопасности и способности людей поддерживать достаточный жизненный уровень, особенно для пожилых людей, людей с инвалидностью и семей с детьми»(Citation: 530).
