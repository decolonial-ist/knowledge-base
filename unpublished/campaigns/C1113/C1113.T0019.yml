description:
  ru: 'Оккупационная администрация Московского Царства ввела крупную группировку регулярных войск: историк М. М. Ибрагимов указывает, что «в 1604 году им было направлено на Кавказ 10 000 стрельцов»(Citation: 86), а историк Е. Н. Кушева отмечает, что «поход 1604-1605 гг. был предпринят весьма значительными силами»(Citation: 83).'
  en: 'The occupation administration of the Tsardom of Muscovy brought in a large grouping of regular troops: historian M. M. Ibragimov points out that «in 1604 he dispatched 10 000 streltsy to the Caucasus»(Citation: 86), while historian E. N. Kusheva notes that «the campaign of 1604-1605 was undertaken with quite considerable forces»(Citation: 83).'
  uk: 'Окупаційна адміністрація Московського царства ввела велике угруповання регулярних військ: історик М. М. Ібрагімов вказує, що «у 1604 році ним було направлено на Кавказ 10 000 стрільців»(Citation: 86), а історик Е. Н. Кушева зазначає, що «похід 1604-1605 рр. був здійснений вельми значними силами»(Citation: 83).'
