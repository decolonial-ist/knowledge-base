description:
  ru: |-
    Вывоз детей с оккупированных территорий в Россию.
    Международный уголовный суд установил, что президент Российской Федерации Владимир Путин, по формулировке суда, «предположительно несёт ответственность за военное преступление в виде незаконной депортации населения (детей) и незаконного перемещения населения (детей) с оккупированных территорий Украины в Российскую Федерацию», и выдал 17 марта 2023 года ордер на его арест, а также на арест уполномоченной при президенте по правам ребёнка Марии Львовой-Беловой(Citation: 219).
    Йельская лаборатория гуманитарных исследований задокументировала сеть и описывает её так: она «удерживала не менее 6000 детей из Украины», с установленными ролями и подтверждённым расположением 43 объектов(Citation: 527).
