  ru: Депортация украинских детей (с 2022)
description:
  en: ''
  uk: ''
  ru: |-
    С 2022 года Российская Федерация вывозит украинских детей с оккупированных территорий в свою сеть лагерей и учреждений: исследователи Йельской лаборатории задокументировали не менее 6000 детей в сети из 43 объектов с политическим перевоспитанием и передачей в приёмные семьи, а Международный уголовный суд 17 марта 2023 года выдал за это ордера на арест Путина и уполномоченной по правам ребёнка Львовой-Беловой(Citation: 527)(Citation: 219).

    Международный уголовный суд формулирует состав так: Владимир Путин, президент Российской Федерации, «предположительно несёт ответственность за военное преступление в виде незаконной депортации населения (детей) и незаконного перемещения населения (детей) с оккупированных территорий Украины в Российскую Федерацию», и такое же обвинение предъявлено Марии Львовой-Беловой, уполномоченной при президенте Российской Федерации по правам ребёнка(Citation: 219).
    Йельская лаборатория гуманитарных исследований описывает механику: федеральное правительство Российской Федерации «управляет масштабной систематической сетью лагерей и других учреждений, которая удерживала не менее 6000 детей из Украины», роли 43 объектов установлены и их расположение подтверждено, при этом «не менее 32 (78%)» объектов вовлечены в систематическое политическое перевоспитание(Citation: 527).
    Комиссия ООН отмечает, что выдача российского гражданства и передача детей в приёмные семьи, по её оценке, «создаёт рамки, из-за которых некоторым детям придётся в итоге остаться в Российской Федерации»(Citation: 221).
