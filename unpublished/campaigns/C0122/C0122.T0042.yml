  ru: |-
    Политическое перевоспитание вывезенных детей.
    Йельская лаборатория гуманитарных исследований установила, что «не менее 32 (78%)» объектов сети вовлечены в систематическое политическое перевоспитание детей из Украины(Citation: 527).
    Комиссия ООН добавляет, что выдача российского гражданства и передача детей в приёмные семьи, по её оценке, «создаёт рамки, из-за которых некоторым детям придётся в итоге остаться в Российской Федерации»(Citation: 221).
