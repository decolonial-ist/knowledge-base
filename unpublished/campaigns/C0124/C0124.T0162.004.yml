description:
  ru: |-
    Отказ раненым в помощи после взрыва.
    Администрация колонии не тушила пожар и не оказывала медицинской помощи, из-за чего многие раненые умирали от кровопотери и болевого шока; лишь через три часа оккупационная администрация допустила к помощи пленных с медицинским опытом, и только к тем, кто сумел выбраться наружу сам.
    Эвакуацию начали только утром и вели грузовиками, из-за чего часть раненых погибла в дороге(Citation: 528).
