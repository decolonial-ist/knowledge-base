description:
  ru: |-
    Гибель военнопленных в бараке, куда их перевели накануне отдельно от остальных.
    Накануне взрыва, 27 июля 2022 года, почти двести бойцов бригады «Азов» перевели в наспех отремонтированное помещение в промзоне Волновахской исправительной колонии, а вечером 28 июля построили, проверили по списку и по одному завели в барак, запретив выходить наружу; около 23:15 взрыв прозвучал за пределами колонии, ближе к полуночи - второй, уже внутри, после чего барак обрушился и начался пожар.
    Погибли не менее 53 украинских защитников, ещё около 130 получили ранения разной тяжести(Citation: 528).
