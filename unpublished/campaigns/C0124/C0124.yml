  ru: |-
    В ночь на 29 июля 2022 года Российская Федерация убила взрывом в бараке Волновахской исправительной колонии в Оленовке не менее 53 украинских военнопленных - защитников «Азовстали», которых накануне отдельно перевели в это помещение; ещё около 130 получили ранения, а администрация колонии не тушила пожар и не оказывала помощь(Citation: 528).

    Накануне, 27 июля 2022 года, почти двести бойцов бригады «Азов» перевели в наспех отремонтированное помещение в промзоне колонии.
    Вечером следующего дня их построили, проверили по списку и по одному завели в барак, запретив выходить на улицу.
    Около 23:15 взрыв прозвучал за пределами колонии, а ближе к полуночи - второй, уже внутри помещения; барак обрушился, начался пожар.
    Все, кто находился в той части барака, где произошёл взрыв и горело пламя, погибли; в другой части люди получили тяжёлые ранения и ожоги, оттуда слышались крики, но войти внутрь было уже невозможно.
    Администрация колонии при этом не тушила пожар и не оказывала медицинской помощи, поэтому многие раненые умирали от кровопотери и болевого шока.
    Лишь через три часа после взрыва оккупационная администрация допустила к помощи пленных с медицинским опытом - и только к тем, кто сумел выбраться наружу сам.
    Эвакуацию пострадавших начали только утром и вели грузовиками, из-за чего часть раненых погибла в дороге(Citation: 528).
