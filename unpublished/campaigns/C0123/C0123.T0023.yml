  ru: |-
    Сеть фильтрационных пунктов и мест содержания на оккупированной территории.
    Комиссия ООН фиксирует: «Незаконное лишение свободы начиналось на контрольно-пропускных или фильтрационных пунктах, укомплектованных российскими вооружёнными силами, или прямо на улицах», и отмечает следующее: «задержание часто было предвестником пыток и казни»(Citation: 221).
    Йельская лаборатория гуманитарных исследований в докладе «Система фильтрации: картирование операций России по содержанию под стражей в Донецкой области» установила состав этой сети, включая исправительные колонии как места длительного содержания и объект фильтрации в Оленовке(Citation: 224).
