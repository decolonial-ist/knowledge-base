description:
  en: ''
  uk: ''
  ru: |-
    С первых недель вторжения Российская Федерация пропускает жителей оккупированных территорий через фильтрацию: на контрольно-пропускных и фильтрационных пунктах людей досматривают, раздевают догола и изымают, а исследователи Йельской лаборатории картировали сеть мест содержания в Донецкой области, включая колонию в Оленовке(Citation: 221)(Citation: 224).

    Комиссия ООН описывает вход в систему: «Незаконное лишение свободы начиналось на контрольно-пропускных или фильтрационных пунктах, укомплектованных российскими вооружёнными силами, или прямо на улицах», а также при подомовых обысках и на рабочих местах; комиссия добавляет: «задержание часто было предвестником пыток и казни»(Citation: 221).
    Комиссия отдельно зафиксировала «ситуации, когда российские власти требовали принудительного раздевания догола в местах содержания под стражей, а также на контрольно-пропускных и фильтрационных пунктах»(Citation: 221).
    Йельская лаборатория гуманитарных исследований в докладе «Система фильтрации: картирование операций России по содержанию под стражей в Донецкой области» разметила эту сеть, включая исправительные колонии, служащие местами длительного содержания, и объект фильтрации в Оленовке(Citation: 224).
    Миссия ОБСЕ приводит свидетельство о принудительно перемещённых, которых «сначала привезли в какие-то фильтрационные лагеря в России возле украинской границы», а часть затем увезли на Сахалин(Citation: 327).
