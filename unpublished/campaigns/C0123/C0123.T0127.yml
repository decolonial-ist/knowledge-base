  ru: |-
    Вывоз прошедших фильтрацию вглубь Российской Федерации.
    Миссия ОБСЕ приводит свидетельство о том, что перемещённых «сначала привезли в какие-то фильтрационные лагеря в России возле украинской границы», а некоторых затем довезли до острова Сахалин(Citation: 327).
    Комиссия ООН отдельно рассматривала случаи, когда российские вооружённые силы перемещали задержанных внутри Украины или депортировали их в Российскую Федерацию, где часть содержали в следственных изоляторах Брянской и Курской областей(Citation: 221).
