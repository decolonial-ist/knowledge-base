  ru: Пыточная оккупация Балаклеи (2022)
description:
  en: ''
  uk: ''
  ru: |-
    Полгода 2022 года Российская Федерация руками военных и сотрудников ФСБ держала в оккупированной Балаклее на Харьковщине две пыточные - в райотделе полиции и в типографии напротив: правозащитники насчитали не менее 18 замученных и пропавших без вести жителей, а полиция установила убийство юриста сельхозпредприятия, задушенного в пыточной(Citation: 522)(Citation: 523).

    Правозащитники Медийной инициативы за права человека описывают положение так: «Замученных и пропавших без вести у нас пока 18 человек»(Citation: 522).
    Задержанных держали в камерах райотдела полиции - в тесноте и духоте, по семеро на два лежака, - и в помещении типографии «БалДрук» через дорогу, где были устроены такие же ямы для содержания людей; горожанка Юлия Дробышева, безуспешно искавшая брата Виктора Прощина, подытоживает: «Это были два основных места содержания людей»(Citation: 522).
    Житель города Руслан Волобуев, которого задержали 18 июня и с мешком на голове завели в камеру номер один, рассказывает, что избиениями и пытками руководил сотрудник ФСБ с позывным «Ирбис», что после жестоких избиений задержанным отказывали в любой медицинской помощи и приводит итог: «у нас двоих людей вынесли на носилках, они умерли»(Citation: 522).
    Начальник следственного управления полиции Харьковской области Сергей Болвинов сообщил следующее: в пыточной, устроенной в отделе полиции, «пытали и задушили юриста одного из сельхозпредприятий»; тело замученного вывозила из пыточной ритуальная служба и хоронила на кладбище(Citation: 523).
