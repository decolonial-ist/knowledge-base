description:
  ru: |-
    Две пыточные в оккупированном городе - в райотделе полиции и в типографии напротив.
    Житель Балаклеи Руслан Волобуев, задержанный 18 июня 2022 года и с мешком на голове заведённый в камеру номер один, где на двух лежаках было уже семеро человек, рассказал правозащитникам, что избиениями и пытками руководил сотрудник ФСБ с позывным «Ирбис», что после избиений задержанным отказывали в любой медицинской помощи и приводит итог: «у нас двоих людей вынесли на носилках, они умерли»(Citation: 522).
    Начальник следственного управления полиции Харьковской области Сергей Болвинов сообщил следующее: в пыточной, устроенной в отделе полиции, «пытали и задушили юриста одного из сельхозпредприятий»(Citation: 523).
