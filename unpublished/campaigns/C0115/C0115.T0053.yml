description:
  ru: |-
    Исчезновение жителей города в двух местах содержания.
    Правозащитники Медийной инициативы за права человека подытоживают: «Замученных и пропавших без вести у нас пока 18 человек»(Citation: 522).
    Горожанка Юлия Дробышева почти ежедневно ходила в райотдел полиции, пока там незаконно держали её брата Виктора Прощина, которого затем увезли в неизвестном направлении; она же описывает устройство системы: «Это были два основных места содержания людей» - отдел полиции и типография «БалДрук» через дорогу(Citation: 522).
    Часть увезённых, по предварительным данным городской власти, вывезли в Изюм и Купянск(Citation: 522).
