description:
  ru: |-
    Многолетний непрерывный обстрел второго по величине города Украины.
    Управление ООН по правам человека в отчёте за период с 1 декабря 2023 года по 29 февраля 2024 года констатирует: «Харьков был одним из населённых пунктов, по которым российские вооружённые силы наносили больше всего ракетных ударов и ударов барражирующими боеприпасами»(Citation: 516).
    Обстрелы города продолжаются с 24 февраля 2022 года, то есть и после того, как линия фронта отодвинулась от городской черты(Citation: 517)(Citation: 516).
