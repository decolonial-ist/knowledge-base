description:
  ru: |-
    Обстрел жилых кварталов Харькова кассетными боеприпасами.
    Human Rights Watch установила: 28 февраля 2022 года российские силы выпустили кассетные боеприпасы «не менее чем по трём жилым районам Харькова, второго по величине города Украины», убив «как минимум трёх гражданских»(Citation: 517).
    Организация разобрала 40 видеозаписей и фотографий и поговорила с двумя очевидцами, установив применение суббоеприпасов, доставленных реактивными снарядами 9М55К системы «Смерч», и оценила удары как неизбирательные нападения, способные составлять военные преступления(Citation: 517).
