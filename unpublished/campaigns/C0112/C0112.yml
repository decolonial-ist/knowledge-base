name:
  ru: Обстрелы Харькова (с 2022)
  en: Shelling of Kharkiv (from 2022)
  uk: Обстріли Харкова (з 2022)
description:
  ru: |-
    С первых дней вторжения Российская Федерация руками артиллерии, ракетных войск и авиации бьёт по жилым кварталам Харькова: уже 28 февраля 2022 года кассетные боеприпасы легли не менее чем в трёх жилых районах города, а к 2024 году Харьков остаётся одним из городов, по которым российские силы наносят больше всего ракетных и дроновых ударов(Citation: 517)(Citation: 516).

    Правозащитная организация Human Rights Watch зафиксировала: 28 февраля 2022 года российские силы выпустили кассетные боеприпасы «не менее чем по трём жилым районам Харькова, второго по величине города Украины», и эти удары «убили как минимум трёх гражданских»(Citation: 517).
    Вывод строился на разговорах с двумя очевидцами и разборе 40 видеозаписей и фотографий, показавших применение суббоеприпасов, доставленных российскими реактивными снарядами 9М55К к системе «Смерч»; организация оценила эти удары как неизбирательные нападения, которые могут составлять военные преступления(Citation: 517).
    Обстрелы не прекратились с отходом российских войск от города: Управление ООН по правам человека в отчёте за зиму 2023-2024 годов отмечает, что «Харьков был одним из населённых пунктов, по которым российские вооружённые силы наносили больше всего ракетных ударов и ударов барражирующими боеприпасами»(Citation: 516).
