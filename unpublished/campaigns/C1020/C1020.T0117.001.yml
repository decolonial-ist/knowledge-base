description:
  en: |-
    The mass use of the Ukrainian population for the physical and demographic consolidation of the imperial borders in the Caucasus: waves of organized resettlement followed one another - "the resettlement of the Black Sea Cossack Host (25 thousand people) to the Kuban" under Catherine II, then the replenishment of 1802–04 and the resettlements of 1806–09 and 1809–11(Citation: 195).
    The government transferred state peasants and odnodvortsy from the Sloboda-Ukrainian and other gubernias into the Cossack estate and resettled them to the Line: in 1804 odnodvortsy were resettled, forming the stanitsa of Voronezhskaya, and later Little Russian Cossacks from the Poltava and Chernihiv gubernias(Citation: 51).
  uk: |-
    Масове використання українського населення для фізичного та демографічного закріплення імперських кордонів на Кавказі: хвилі організованих переселень ішли одна за одною - «переселення Чорноморського козацького війська (25 тис. осіб) на Кубань» за Катерини II, потім поповнення 1802–04 та переселення 1806–09 і 1809–11(Citation: 195).
    Уряд переводив казенних селян та однодворців зі Слобідсько-Української та інших губерній у козацький стан і переселяв на Лінію: у 1804 році переселили однодворців, які утворили станицю Воронезьку, а пізніше - малоросійських козаків з Полтавської та Чернігівської губерній(Citation: 51).
  ru: |-
    Массовое использование украинского населения для физического и демографического закрепления имперских границ на Кавказе: волны организованных переселений шли одна за другой - «переселение Черноморского казацкого войска (25 тыс. человек) на Кубань» при Екатерине II, затем пополнение 1802–04 и переселения 1806–09 и 1809–11(Citation: 195).
    Правительство переводило казенных крестьян и однодворцев из Слободско-Украинской и других губерний в казачье сословие и переселяло на Линию: в 1804 году переселили однодворцев, образовавших станицу Воронежскую, а позже - малороссийских казаков из Полтавской и Черниговской губерний(Citation: 51).
