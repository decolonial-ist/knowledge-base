description:
  ru: |-
    Украинские крестьяне массово и принудительно изымались из своих сел для пополнения регулярной армии, воевавшей на Кавказе: рекрутчина «осуществлялась путём принудительного набора от всех податных сословий», причем «в Украине рекрутчина вступила в силу после окончательной ликвидации её политической автономии в 1780-х гг.»(Citation: 196).
    Норма изъятия доходила «с 1 тыс. душ в разные годы от 5-ти до 10-ти рекрутов», а служба до 1834 года длилась 25 лет(Citation: 196).
  en: |-
    Ukrainian peasants were massively and forcibly taken from their villages to replenish the regular army fighting in the Caucasus: recruit conscription "was carried out by compulsory levy from all taxable estates," and "in Ukraine recruit conscription took effect after the final liquidation of its political autonomy in the 1780s"(Citation: 196).
    The extraction quota reached "from 5 to 10 recruits per 1 thousand souls in various years," and until 1834 the term of service was 25 years(Citation: 196).
  uk: |-
    Українських селян масово і примусово вилучали з їхніх сіл для поповнення регулярної армії, що воювала на Кавказі: рекрутчина «здійснювалася шляхом примусового набору від усіх податних станів», причому «в Україні рекрутчина набула чинності після остаточної ліквідації її політ. автономії в 1780-х рр.»(Citation: 196).
    Норма вилучення сягала «із 1 тис. душ у різні роки від 5-ти до 10-ти рекрутів», а служба до 1834 року тривала 25 років(Citation: 196).
