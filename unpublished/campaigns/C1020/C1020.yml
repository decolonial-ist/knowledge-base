name:
  ru: Экономическое выдавливание и демографическая накачка Кавказа (1809–1825)
  en: Economic Squeezing-Out and Demographic Pumping of the Caucasus (1809–1825)
  uk: Економічне видавлювання та демографічне накачування Кавказу (1809–1825)
description:
  ru: |-
    Системная кампания империи по созданию демографического перевеса на Кавказе за счет украинского ресурса.
    Украинские земли стали важнейшим источником пополнения как казачьих, так и регулярных войск: началом стало «переселение Черноморского казацкого войска (25 тыс. человек) на Кубань», а в «в 1809—11 переселено ок. 24 тыс. лиц мужского и 19 тыс. женского пола для укрепления южной границы»(Citation: 195).
    Параллельно создавались условия для массового переселения казенных крестьян на Кавказскую линию для ее удержания(Citation: 51).
  en: |-
    A systematic campaign by the empire to create a demographic preponderance in the Caucasus at the expense of Ukrainian resources.
    Ukrainian lands became the most important source of replenishment for both Cossack and regular troops: it began with "the resettlement of the Black Sea Cossack Host (25 thousand people) to the Kuban," and in "1809–11 about 24 thousand males and 19 thousand females were resettled to strengthen the southern border"(Citation: 195).
    In parallel, conditions were created for the mass resettlement of state peasants to the Caucasian Line in order to hold it(Citation: 51).
  uk: |-
    Системна кампанія імперії зі створення демографічної переваги на Кавказі за рахунок українського ресурсу.
    Українські землі стали найважливішим джерелом поповнення як козацьких, так і регулярних військ: початком стало «переселення Чорноморського козацького війська (25 тис. осіб) на Кубань», а в «1809—11 переселено бл. 24 тис. осіб чоловічої і 19 тис. жіночої статі для зміцнення пд. кордону»(Citation: 195).
    Паралельно створювалися умови для масового переселення казенних селян на Кавказьку лінію для її утримання(Citation: 51).
