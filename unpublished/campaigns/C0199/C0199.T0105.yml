description:
  ru: |-
    Планомерное разрушение города осадой и ударами с воздуха, моря и суши.
    Комиссия ООН подытоживает: «Мариуполь был одним из наиболее пострадавших городов: по оценкам, там были убиты тысячи людей, а обширные части города разрушены»(Citation: 221).
    Мониторинговая миссия ООН сообщает, что к 26 марта 2022 года в осаждённом Мариуполе было повреждено не менее 126 многоэтажных жилых домов, а 65 разрушено(Citation: 327).
