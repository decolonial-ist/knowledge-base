description:
  ru: |-
    Удары по роддому и по драмтеатру с надписью «ДЕТИ».
    Миссия ОБСЕ по удару 9 марта 2022 года заключает: «больница была разрушена российским ударом.
    Исходя из российских объяснений, удар должен был быть преднамеренным»(Citation: 327).
    По удару 16 марта 2022 года миссия фиксирует: «то, что разрушение театра, который был чётко обозначен как укрывающий детей надписями с обеих сторон и в котором укрывались многие гражданские, было преднамеренным, столь же неоспоримо»(Citation: 327).
    В театре укрывались до 1300 человек, около 150 вышли своими силами, 300 признаны погибшими(Citation: 327).
