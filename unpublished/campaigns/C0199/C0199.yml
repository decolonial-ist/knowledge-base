name:
  ru: Блокада и разрушение Мариуполя (2022)
  en: Siege and Destruction of Mariupol (2022)
  uk: Блокада і знищення Маріуполя (2022)
description:
  ru: |-
    С 24 февраля по 20 мая 2022 года Российская Федерация с помощью армии, авиации и флота подвергла блокаде и разрушала полумиллионный Мариуполь.
    Погибли многие тысячи жителей, авиаудары пришлись по роддому и по драмтеатру, в подвалах которого укрывались до 1300 человек, а к концу марта в городе было разрушено множество многоэтажных жилых домов (Citation: 221)(Citation: 327).
    Согласно экспертам организации Action on Armed Violence, соотношение погибших гражданских лиц и военных в Мариуполе в 2022 году составило 19:1 - самое высокое среди широко освещавшихся конфликтов последних пятнадцати лет(Citation: 532).

    Согласно комиссии ООН, «Мариуполь был одним из наиболее пострадавших городов: по оценкам, там были убиты тысячи людей, а обширные части города разрушены»(Citation: 221).
    Миссия ОБСЕ разобрала два удара отдельно.
    Первый - 9 марта 2022 года по мариупольскому роддому и детской больнице: «больница была разрушена российским ударом»(Citation: 327).
    Второй - 16 марта 2022 года по драматическому театру в центре города, у которого с обеих сторон было крупными быквами написано «ДЕТИ»; согласно комиссии ООН, «то, что разрушение театра, который был чётко обозначен как укрывающий детей надписями с обеих сторон и в котором укрывались многие гражданские лица, было преднамеренным, столь же неоспоримо»(Citation: 327).
    В театре укрывались до 1300 человек; после удара около 150 вышли своими силами, а 300 признаны погибшими, причём судьбу остальных установить не удалось из-за осады города и состояния выживших(Citation: 327).
