  ru: |-
    Систематическое разграбление историко-культурного наследия и массовый вывоз музейных фондов.
    Министр культуры Украины оценивает потерю так: «один миллион семьсот тысяч предметов нашего культурного наследия были похищены с оккупированных территорий - включая археологические артефакты и музейные коллекции.
    Российская Федерация незаконно присвоила их, грубо нарушив все нормы международного права»(Citation: 230).
    Совет Европы характеризует эти атаки на культурное наследие как имеющие «геноцидное измерение»(Citation: 230).
