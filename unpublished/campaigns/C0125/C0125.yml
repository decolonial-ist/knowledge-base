name:
  ru: Разграбление оккупированных территорий (с 2022)
  en: Plunder of the Occupied Territories (from 2022)
  uk: Пограбування окупованих територій (з 2022)
description:
  ru: |-
    С 2022 года Российская Федерация руками оккупационных администраций вывозит с занятых территорий зерно и промышленное сырьё: за 2022-2025 годы незаконно вывезено почти 15 миллионов тонн украинского зерна стоимостью около 6,8 миллиарда долларов, а из захваченного Мариуполя морем вывозили металл(Citation: 529)(Citation: 320).

    Отраслевые данные фиксируют объём: «С 2022 по 2025 годы с временно оккупированных районов Украины было незаконно вывезено почти 15 миллионов тонн украинского зерна, стоимость которого оценивается в 6,8 миллиарда долларов США»(Citation: 529).
    Вывоз промышленного сырья начался сразу после захвата портового Мариуполя: 4 июня 2022 года в порт зашло второе российское судно для вывоза металла, и компания-владелец заводов заявила, что, похищая украинский металл, Россия совершает международное военное преступление(Citation: 320).
    Изъятие ресурсов идёт рядом с вывозом музейных фондов из оккупированных городов(Citation: 525).
