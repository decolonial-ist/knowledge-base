  ru: |-
    Насильственное удержание населения целого села: Черниговский районный суд 11 марта 2024 года заочно осудил 15 военнослужащих войсковой части 55115 (55-я отдельная мотострелковая бригада из Кызыла, Тыва) на 12 лет каждому; суд постановил: «підсудні протягом 28 днів насильно утримували у шкільному підвалі 368 мешканців села Ягідне на Чернігівщині навесні 2022 року»(Citation: 513).
    Среди удерживаемых в подвале площадью 197 квадратных метров было 68 детей(Citation: 514).
