name:
  ru: 'Ягодное: концлагерь в школьном подвале (2022)'
  en: 'Yahidne: A Concentration Camp in a School Basement (2022)'
  uk: 'Ягідне: концтабір у шкільному підвалі (2022)'
description:
  ru: |-
    В марте 2022 года Российская Федерация руками военнослужащих войсковой части 55115 - 55-й отдельной мотострелковой бригады (горной) из Кызыла (Тыва) - согнала 368 жителей села Ягодное на Черниговщине, включая 68 детей, в подвал школы площадью 197 квадратных метров и удерживала их там 28 дней, разместив в самой школе свой штаб; от нехватки воздуха и отказа в медицинской помощи умерли десять пожилых людей(Citation: 513)(Citation: 514).

    Заняв село Ягодное под Черниговом в начале марта 2022 года, российские военные под угрозой оружия свели в школьный подвал всё население: «368 людей, з яких дітей було 68»(Citation: 514).
    Люди месяц стояли и сидели вплотную в помещении площадью 197 квадратных метров без света, вентиляции и туалета; среди детей началась эпидемия ветрянки.
    Комиссия ООН зафиксировала итог: «из-за нечеловеческих условий содержания в школьном подвале умерли десять пожилых людей, а остальные заключенные, в том числе дети, были вынуждены находиться в одном помещении с телами умерших»(Citation: 221).
    Школа над подвалом всё это время была военным объектом: «У самій школі вони облаштували штаб: на поверхах були їхні медики, жили самі військові, тут був їхній зв'язок, а на ніч на подвір'ї ставили військову техніку та бензовози»(Citation: 514).
    Черниговский районный суд 11 марта 2024 года заочно осудил 15 военнослужащих в/ч 55115 на максимальные по статье 12 лет каждому; суд постановил: «підсудні протягом 28 днів насильно утримували у шкільному підвалі 368 мешканців села Ягідне»(Citation: 513).
