  ru: |-
    Пытки работников захваченной атомной станции.
    Комиссия ООН прямо перечисляет их среди категорий, к которым применялись пытки: жертвами становились «местные чиновники, сотрудники правоохранительных органов, работники Запорожской АЭС, а также гражданские лица, придерживающиеся проукраинских взглядов»(Citation: 221).
    Сотрудники станции упоминаются комиссией и среди тех, кого российские власти удерживали в местах лишения свободы(Citation: 221).
