name:
  ru: Захват Запорожской АЭС и ядерный шантаж (с 2022)
  en: Seizure of the Zaporizhzhia Nuclear Plant and Nuclear Blackmail (from 2022)
  uk: Захоплення Запорізької АЕС та ядерний шантаж (з 2022)
description:
  ru: |-
    С 4 марта 2022 года Российская Федерация удерживает Запорожскую АЭС - крупнейшую атомную станцию Европы: военные операции на площадке и вокруг неё создали риск серьёзной ядерной аварии, а работников станции пытали(Citation: 221).

    Комиссия ООН фиксирует: «Запорожская атомная электростанция остаётся под контролем вооружённых сил Российской Федерации», а «военные операции вблизи или на территории Запорожской атомной электростанции в Энергодаре подвергли её значительной опасности, создав риск серьёзного ядерного инцидента»(Citation: 221).
    Персонал станции оказался в числе тех, к кому применялись пытки: комиссия перечисляет жертв так: «местные чиновники, сотрудники правоохранительных органов, работники Запорожской АЭС, а также гражданские лица, придерживающиеся проукраинских взглядов»(Citation: 221).
    Разрушение Каховской плотины 6 июня 2023 года лишило станцию источника воды для охлаждающих прудов(Citation: 222).
