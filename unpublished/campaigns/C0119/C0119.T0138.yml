description:
  ru: |-
    Силовой захват атомных объектов и удержание крупнейшей станции Европы как источника ядерной угрозы.
    Украинский регулятор в срочном письме генеральному директору МАГАТЭ сообщал: «российские пехотные подразделения двигались прямо к площадке крупнейшей атомной электростанции Украины», а ситуацию назвал «критической»; в тот же день МАГАТЭ зафиксировало, что «большое число российских танков и пехоты „прорвалось через блокпост“ к городу Энергодару в нескольких километрах от Запорожской атомной электростанции»(Citation: 218).
    Комиссия ООН фиксирует итог: «Запорожская атомная электростанция остаётся под контролем вооружённых сил Российской Федерации», а «военные операции вблизи или на территории Запорожской атомной электростанции в Энергодаре подвергли её значительной опасности, создав риск серьёзного ядерного инцидента»(Citation: 221).
    Разрушение Каховской плотины 6 июня 2023 года дополнительно лишило станцию источника воды для охлаждающих прудов(Citation: 222).
    Той же практикой 24 февраля 2022 года была захвачена Чернобыльская АЭС: Украина уведомила МАГАТЭ, что «российские силы взяли под контроль объекты государственного специализированного предприятия „Чернобыльская АЭС“» в зоне отчуждения(Citation: 321).
    Комиссия ООН отмечает озабоченность «неприемлемой ядерной риторикой, используемой российскими официальными лицами»(Citation: 221).
