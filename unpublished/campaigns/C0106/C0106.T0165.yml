  ru: 'Обстрелы эвакуационных маршрутов и огонь по гражданским машинам на Киевщине: комиссия ООН задокументировала «18 таких случаев в феврале–марте 2022 года, в результате которых были убиты 14 мужчин, 8 женщин, 3 мальчика и 1 девочка», и отмечает, что часть нападений «были преднамеренными, например когда солдаты открывали огонь по гражданским автомобилям, которые не представляли для них никакой опасности, поскольку они останавливались или уезжали от них»(Citation: 221). 6 марта 2022 года миномётный обстрел переправы у Романовки убил как минимум восемь эвакуирующихся из Ирпеня, среди них Татьяну Перебийнис и её детей - Никиту и Алису(Citation: 510)(Citation: 511).'
