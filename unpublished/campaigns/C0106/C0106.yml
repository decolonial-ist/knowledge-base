  ru: |-
    В марте 2022 года Российская Федерация руками штурмовавших Ирпень частей била миномётным и артиллерийским огнём по маршрутам эвакуации гражданских: 6 марта 2022 года у переправы в Романовке погибли как минимум восемь эвакуирующихся, включая Татьяну Перебийнис с двумя детьми, а всего за время боёв за город погибло до трёхсот гражданских(Citation: 510)(Citation: 512).

    Ирпень стал горлышком эвакуации северо-западных пригородов Киева: после подрыва моста люди уходили пешком по настилу под разрушенным пролётом у Романовки. 6 марта 2022 года по этому маршруту ударили миномёты: городской голова Ирпеня Александр Маркушин сообщил о гибели как минимум восьми гражданских за день(Citation: 510).
    Среди погибших - бухгалтер Татьяна Перебийнис и её дети, 18-летний Никита и 9-летняя Алиса; муж и отец Сергей Перебийнис рассказал о гибели семьи, которую снял фотокорреспондент на месте обстрела(Citation: 511).
    Комиссия ООН выявила закономерность таких нападений: «18 таких случаев в феврале–марте 2022 года, в результате которых были убиты 14 мужчин, 8 женщин, 3 мальчика и 1 девочка», большинство - в Киевской области; комиссия отмечает: «жертвы были одеты в гражданскую одежду, не были вооружены и находились за рулем гражданских автомобилей, некоторые из которых имели на стеклах таблички, указывающие, что внутри находятся дети»(Citation: 221).
    К освобождению города 28 марта 2022 года, по данным городского головы, погибло 200-300 гражданских; убитых во время боёв хоронили прямо во дворах и парках(Citation: 512).
