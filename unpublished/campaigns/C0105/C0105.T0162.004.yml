  ru: 'Пытки задержанных жителей Бучи для добычи сведений об украинских военных: Ирпенский городской суд в августе 2023 года заочно осудил девятерых военнослужащих Российской Федерации на сроки от 11 до 12 лет по статье о нарушении законов и обычаев войны - они многократно задерживали, допрашивали и избивали жителя Бучи, мастера по ремонту электроники, добиваясь сведений о позициях украинских военных; отдававший приказы командир Андрей Бизяев получил 12 лет(Citation: 508).'
