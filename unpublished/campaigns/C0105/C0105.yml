name:
  en: The Bucha Massacre (2022)
  uk: Різанина в Бучі (2022)
  ru: Резня в Буче (2022)
description:
  en: ''
  uk: ''
  ru: |-
    С 27 февраля по 31 марта 2022 года Российская Федерация, оккупировав Бучу под Киевом силами 64-й отдельной мотострелковой бригады и других частей, убивала, пытала и насиловала жителей города: за 33 дня оккупации Бучанская громада потеряла 561 человека, среди них 12 детей(Citation: 506)(Citation: 507).

    Российские войска вошли в Бучу 27 февраля 2022 года; после освобождения город стал первым местом, где мир увидел масштаб расправ над гражданскими людьми на оккупированных территориях.
    Городской совет Бучи подводит итог: «За 33 дня оккупации ми потеряли 561 жителя нашей громады.
    Среди них – 12 детей.»(Citation: 506).
    Комиссия ООН зафиксировала казни «на территории 17 населенных пунктов в Черниговской, Харьковской, Киевской и Сумской областях», причём «наибольшее число казней было совершено в Киевской области, в том числе в городе Буча», и подтвердила казнь: «65 мужчин, 2 женщин и 14-летнего мальчика»; «наиболее распространенным способом убийства был выстрел в голову с близкого расстояния», часть жертв найдена со связанными руками(Citation: 221).
    Украинские журналисты-расследователи поимённо назвали командиров 64-й мотострелковой бригады(Citation: 507).
    Россия ответила на мировую огласку резни поощрением военных преступников: 18 апреля 2022 года, через две с половиной недели после освобождения Бучи, Путин присвоил 64-й бригаде почётное наименование гвардейской с формулировкой: «за массовый героизм и отвагу, стойкость и мужество, проявленные личным составом бригады в боевых действиях по защите Отечества и государственных интересов в условиях вооруженных конфликтов»(Citation: 509).
