description:
  ru: |-
    Казни жителей оккупированной Бучи военнослужащими вооружённых сил Российской Федерации.
    Комиссия ООН зафиксировала казни «на территории 17 населенных пунктов в Черниговской, Харьковской, Киевской и Сумской областях», причём «наибольшее число казней было совершено в Киевской области, в том числе в городе Буча», и подтвердила казнь: «65 мужчин, 2 женщин и 14-летнего мальчика»; комиссия отмечает: казням «часто предшествовали задержание, допросы, пытки или жестокое обращение», а «наиболее распространенным способом убийства был выстрел в голову с близкого расстояния»; часть жертв найдена со связанными руками(Citation: 221).
    Итог 33 дней оккупации по данным городского совета Бучи: «ми втратили 561 жителів нашої громади.
    Серед них – 12 дітей»(Citation: 506).
