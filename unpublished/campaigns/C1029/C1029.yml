name:
  ru: Военная интервенция и неизбирательный террор (1994–1996)
  en: Military intervention and indiscriminate terror (1994–1996)
  uk: Воєнна інтервенція та невибірковий терор (1994–1996)
description:
  ru: |-
    Прямой ввод регулярной армии РФ на территорию Ичкерии.
    Кампания сопровождалась ковровыми бомбардировками жилых кварталов, массовыми убийствами мирного населения и использованием запрещенных видов вооружений(Citation: 26)(Citation: 27).
  en: |-
    Direct deployment of the regular army of the Russian Federation onto the territory of Ichkeria.
    The campaign was accompanied by carpet bombing of residential quarters, mass killings of the civilian population, and the use of prohibited types of weapons(Citation: 26)(Citation: 27).
  uk: |-
    Пряме введення регулярної армії РФ на територію Ічкерії.
    Кампанія супроводжувалася килимовими бомбардуваннями житлових кварталів, масовими вбивствами мирного населення та використанням заборонених видів озброєнь(Citation: 26)(Citation: 27).
