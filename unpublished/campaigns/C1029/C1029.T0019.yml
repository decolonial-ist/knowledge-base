description:
  en: 'Direct deployment of troops of the Russian Ministry of Defense and Ministry of Internal Affairs into the territory of Ichkeria on December 11, 1994, from three directions, on the basis of Yeltsin''s secret Decree No. 2137s(Citation: 26).'
  uk: 'Пряме введення військ Міноборони та МВС Росії на територію Ічкерії 11 грудня 1994 року з трьох напрямків на підставі таємного Указу Єльцина №2137с(Citation: 26).'
  ru: 'Прямой ввод войск Минобороны и МВД России на территорию Ичкерии 11 декабря 1994 года с трех направлений на основании секретного Указа Ельцина №2137с(Citation: 26).'
