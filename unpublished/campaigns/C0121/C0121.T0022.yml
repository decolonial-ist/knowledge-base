  ru: |-
    Растянутая на годы кампания ударов по тылу.
    Управление ООН по правам человека в отчёте за период с 1 декабря 2023 года по 29 февраля 2024 года отмечает, что «Харьков был одним из населённых пунктов, по которым российские вооружённые силы наносили больше всего ракетных ударов и ударов барражирующими боеприпасами», и подтверждает жертвы среди гражданских в четырнадцати областях Украины и в городе Киеве - от Черкасской и Хмельницкой до Львовской и Одесской(Citation: 516).
