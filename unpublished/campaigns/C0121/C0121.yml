description:
  ru: |-
    Всю войну Российская Федерация наносит ракетные и дроновые удары по заведомо гражданским объектам в городах вдали от линии фронта: 27 июня 2023 года ракета попала в переполненный ресторан в центре Краматорска и убила 13 человек, включая четырёх девочек, а Харьков остаётся одним из городов, по которым таких ударов наносится больше всего(Citation: 222)(Citation: 516).

    Управление ООН по правам человека описывает удар 27 июня 2023 года так: «ракета попала в переполненный ресторан в центре Краматорска, убив 13 гражданских, включая 4 девочек, и ранив ещё 38 гражданских, включая восьмимесячную девочку»(Citation: 222).
    Девятью днями позже, по свидетельству того же отчёта, 6 июля 2023 года «ракетный удар убил 10 гражданских и ранил 42, включая двух девочек, попав в жилой дом во Львове»(Citation: 222).
    Практика не прекратилась и позже: в отчёте за период с 1 декабря 2023 года по 29 февраля 2024 года управление отмечает, что «Харьков был одним из населённых пунктов, по которым российские вооружённые силы наносили больше всего ракетных ударов и ударов барражирующими боеприпасами», а жертвы среди гражданских были подтверждены в четырнадцати областях Украины и в городе Киеве(Citation: 516).
