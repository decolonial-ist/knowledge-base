name:
  en: Institutional terror and filtration camps (1994–1996)
  uk: Інституційний терор і фільтраційні табори (1994–1996)
  ru: Институциональный террор и фильтрационные лагеря (1994–1996)
description:
  en: |-
    Creation of an unlawful network of official and shadow ("zindans") filtration points for the mass detention of the civilian population.
    The campaign was accompanied by systematic torture and extrajudicial executions(Citation: 27).
  uk: |-
    Створення незаконної мережі офіційних і тіньових («зіндани») фільтраційних пунктів для масового утримання цивільного населення.
    Кампанія супроводжувалася систематичними катуваннями та позасудовими стратами(Citation: 27).
  ru: |-
    Создание незаконной сети официальных и теневых («зинданы») фильтрационных пунктов для массового содержания гражданского населения.
    Кампания сопровождалась систематическими пытками и внесудебными казнями(Citation: 27).
