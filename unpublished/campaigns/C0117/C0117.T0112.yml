  ru: |-
    Вывоз собрания областного краеведческого музея при отступлении.
    Сотрудник отдела хранения и учёта фондов музея Анна Скрипка описывает потерю так: «если у нас по цифрам было 13,5 тысяч музейных предметов, то по крайней мере последняя цифра, которую я видела, - это 10 тысяч»(Citation: 525).
    Из музейного собрания вынесли золото, оружие и награды вермахта(Citation: 525).
