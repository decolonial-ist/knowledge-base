  ru: |-
    Длительное незаконное удержание жителей оккупированного областного центра.
    Комиссия ООН обнаружила места содержания под стражей и описывает их так: «где российские власти содержали большое количество людей в течение длительного времени», в том числе в Херсонской области; процедурные требования не соблюдались, родственников не уведомляли, а причины лишения свободы надлежащим образом не сообщались(Citation: 221).
