  ru: Оккупация и освобождение Херсона (2022)
description:
  en: ''
  uk: ''
  ru: |-
    С марта по ноябрь 2022 года Российская Федерация держала Херсон - единственный захваченный за войну областной центр - руками военных и спецслужб: горожан похищали и пытали, а отступая, оккупанты вывезли почти всё собрание областного краеведческого музея(Citation: 221)(Citation: 525).

    Комиссия ООН установила, что российские власти держали большое количество людей длительные сроки в местах лишения свободы Черниговской, Донецкой, Харьковской, Херсонской, Киевской и Запорожской областей, и перечисляет жертв пыток: «местные чиновники, сотрудники правоохранительных органов, работники Запорожской АЭС, а также гражданские лица, придерживающиеся проукраинских взглядов»(Citation: 221).
    Уходя из города в ноябре 2022 года, оккупационные силы вывезли музейные фонды: по словам сотрудника отдела хранения и учёта фондов краеведческого музея Анны Скрипки, потеря выглядит так: «если у нас по цифрам было 13,5 тысяч музейных предметов, то по крайней мере последняя цифра, которую я видела, - это 10 тысяч»(Citation: 525).
    Вынесли, в частности, золото, оружие и награды вермахта из музейного собрания(Citation: 525).
