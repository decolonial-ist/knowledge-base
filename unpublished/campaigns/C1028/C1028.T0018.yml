description:
  ru: 'Вербовка ФСК кадровых военнослужащих Кантемировской и Таманской дивизий и снабжение оппозиции десятками танков для штурма Грозного 26 ноября 1994 года(Citation: 26).'
  en: 'Recruitment by the FSK of career servicemen of the Kantemirovskaya and Tamanskaya divisions and supplying the opposition with dozens of tanks for the assault on Grozny on November 26, 1994(Citation: 26).'
  uk: 'Вербування ФСК кадрових військовослужбовців Кантемирівської та Таманської дивізій і постачання опозиції десятків танків для штурму Грозного 26 листопада 1994 року(Citation: 26).'
