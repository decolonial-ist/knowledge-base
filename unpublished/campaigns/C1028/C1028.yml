name:
  ru: Прокси-война и политическая дестабилизация (1993–1994)
  en: Proxy war and political destabilization (1993–1994)
  uk: Проксі-війна та політична дестабілізація (1993–1994)
description:
  ru: 'Создание марионеточного правительства (Временного совета ЧР), массовый подкуп элит и снабжение вооруженной оппозиции тяжелой техникой, завершившееся ноябрьским штурмом Грозного с участием кадровых российских военных(Citation: 26).'
  en: 'Creation of a puppet government (the Provisional Council of the Chechen Republic), mass bribery of elites, and the supply of heavy equipment to the armed opposition, culminating in the November assault on Grozny with the participation of regular Russian servicemen(Citation: 26).'
  uk: 'Створення маріонеткового уряду (Тимчасової ради ЧР), масовий підкуп еліт і постачання озброєній опозиції важкої техніки, що завершилося листопадовим штурмом Грозного за участю кадрових російських військових(Citation: 26).'
