  ru: |-
    Ракетные удары по жилым кварталам и историческому центру города в глубоком тылу.
    Управление ООН по правам человека зафиксировало: «6 июля ракетный удар убил 10 гражданских и ранил 42, включая двух девочек, попав в жилой дом во Львове»(Citation: 222).
    Ранее, 18 апреля 2022 года, по городу выпустили четыре крылатые ракеты воздушного базирования: глава Львовской областной военной администрации Максим Козицкий сообщил о гибели семерых мирных жителей, четверо из которых работали на станции техобслуживания, и об одиннадцати пострадавших, среди них ребёнок(Citation: 518).
