  ru: Удары по Львову (с 2022)
description:
  en: ''
  uk: ''
  ru: |-
    С апреля 2022 года Российская Федерация бьёт крылатыми ракетами по Львову - городу в глубоком тылу у польской границы: 18 апреля 2022 года удары убили семерых жителей, 6 июля 2023 года ракета попала в жилой дом и убила десятерых, а 4 сентября 2024 года в историческом центре погибла Евгения Базилевич с тремя дочерьми(Citation: 518)(Citation: 222)(Citation: 519).

    18 апреля 2022 года по Львову выпустили четыре крылатые ракеты воздушного базирования; глава Львовской областной военной администрации Максим Козицкий сообщил на брифинге, что погибли семеро мирных жителей, четверо из них - работники станции техобслуживания, и ещё одиннадцать человек пострадали, среди них ребёнок(Citation: 518).
    Управление ООН по правам человека фиксирует следующий удар: «6 июля ракетный удар убил 10 гражданских и ранил 42, включая двух девочек, попав в жилой дом во Львове»(Citation: 222).
    Утром 4 сентября 2024 года удар по историческому центру города убил семерых человек и ранил 66, из них десятерых детей; в своей квартире погибли Евгения Базилевич и её дочери - двадцатиоднолетняя Ярина, восемнадцатилетняя Дарина и семилетняя Эмилия, - из всей семьи выжил только отец, Ярослав Базилевич(Citation: 519).
    Офис генерального прокурора Украины сообщил группе российских командиров о подозрении в нарушении законов и обычаев войны за этот удар(Citation: 519).
