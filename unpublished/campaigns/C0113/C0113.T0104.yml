  ru: |-
    Гибель целой семьи при ударе по историческому центру Львова.
    Утром 4 сентября 2024 года удар убил семерых человек и ранил 66, в том числе десятерых детей; в своей квартире погибли Евгения Базилевич и три её дочери - двадцатиоднолетняя Ярина, восемнадцатилетняя Дарина и семилетняя Эмилия, а выжил из семьи только отец, Ярослав Базилевич(Citation: 519).
    Офис генерального прокурора Украины сообщил группе российских командиров о подозрении в нарушении законов и обычаев войны за этот удар по историческому центру Львова(Citation: 519).
