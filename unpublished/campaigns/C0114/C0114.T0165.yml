  ru: |-
    Удар крылатыми ракетами по центру тылового города в разгар рабочего дня.
    Около 10:45 14 июля 2022 года ракеты «Калибр», выпущенные с подводной лодки в Чёрном море, легли в центре Винницы, поразив бывший Дом офицеров и соседние гражданские здания - медицинский центр, офисы, магазины и жилые дома(Citation: 520).
    Украинская сторона сообщила о 23 погибших, включая троих детей, и более чем двухстах раненых(Citation: 521).
    Одной из погибших была четырёхлетняя Лиза Дмитриева, возвращавшаяся с матерью с занятия у логопеда(Citation: 520).
