name:
  ru: Ракетный удар по Виннице (2022)
  en: Missile Strike on Vinnytsia (2022)
  uk: Ракетний удар по Вінниці (2022)
description:
  ru: |-
    14 июля 2022 года Российская Федерация ударила крылатыми ракетами «Калибр» с подводной лодки в Чёрном море по центру Винницы - города в сотнях километров от линии фронта: в будний полдень погибли 23 человека, включая троих детей, среди них четырёхлетняя Лиза Дмитриева(Citation: 520)(Citation: 521).

    Ракеты легли около 10:45 в центре города, поразив бывший Дом офицеров - советской постройки концертный зал - и соседние гражданские здания: медицинский центр, офисы, магазины и жилые дома(Citation: 520).
    Украинская сторона сообщила о 23 погибших, включая троих детей, и более чем двухстах раненых(Citation: 521).
    Одной из погибших была четырёхлетняя Лиза Дмитриева: в момент удара она возвращалась с матерью с занятия у логопеда(Citation: 520).
    Метрополия объяснила удар военной необходимостью: министерство обороны Российской Федерации заявило, что его силы атаковали в городе «офицерский клуб», - тот самый концертный зал, который в советское время считался офицерским клубом(Citation: 521).
