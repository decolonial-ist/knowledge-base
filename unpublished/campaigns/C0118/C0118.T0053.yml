description:
  ru: |-
    Похищение избранного городского головы и других представителей местной власти. 11 марта 2022 года группа из десяти российских военных увезла мэра Мелитополя Ивана Фёдорова, надев ему на голову пластиковый мешок; он описывает это так: «Это довольно тяжёлое испытание, когда семь часов тебя возят с мешком на голове, не понимая, где, куда, - тем людям, которые тебя возят, ты совсем не доверяешь»(Citation: 526). 16 марта его освободили(Citation: 526).
    Комиссия ООН отмечает, что российские власти удерживали людей, «влиятельных в своих сообществах, чтобы принудить их и местных жителей к сотрудничеству»(Citation: 221).
