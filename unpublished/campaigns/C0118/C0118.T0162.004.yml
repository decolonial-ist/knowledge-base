description:
  ru: |-
    Пытки в местах содержания под стражей на оккупированной части области.
    Комиссия ООН обнаружила места, где российские власти содержали большое количество людей длительное время, в том числе в Запорожской области, и формулирует: «процедурные требования для задержания не выполнялись», а условия содержания «были неизменно бесчеловечными»(Citation: 221).
    Комиссия перечисляет жертв пыток: «местные чиновники, сотрудники правоохранительных органов, работники Запорожской АЭС, а также гражданские лица, придерживающиеся проукраинских взглядов»(Citation: 221).
