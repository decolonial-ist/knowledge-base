name:
  ru: Оккупационный режим Запорожской области (с 2022)
  en: The Occupation Regime in Zaporizhzhia Province (from 2022)
  uk: Окупаційний режим Запорізької області (з 2022)
description:
  ru: |-
    С весны 2022 года Российская Федерация правит захваченной частью Запорожской области через военные комендатуры и назначенные администрации: 11 марта 2022 года десять военных с пластиковым мешком на голове увезли мэра Мелитополя Ивана Фёдорова, а пытки в области стали системой, доставшейся местным чиновникам, правоохранителям и работникам Запорожской АЭС(Citation: 526)(Citation: 221).

    Мэра Мелитополя Ивана Фёдорова, который называл город украинским и не сдавал его, 11 марта 2022 года увезла группа из десяти военных, надев ему на голову пластиковый мешок; сам он вспоминает: «Это довольно тяжёлое испытание, когда семь часов тебя возят с мешком на голове, не понимая, где, куда, - тем людям, которые тебя возят, ты совсем не доверяешь»(Citation: 526). 16 марта его освободили(Citation: 526).
    Комиссия ООН зафиксировала в Запорожской области ту же систему, что и в других занятых регионах: места длительного содержания под стражей, где «процедурные требования для задержания не выполнялись», а условия содержания «были неизменно бесчеловечными»; жертвами пыток комиссия называет следующих: «местные чиновники, сотрудники правоохранительных органов, работники Запорожской АЭС, а также гражданские лица, придерживающиеся проукраинских взглядов»(Citation: 221).
