  ru: |-
    Юридическое оформление отторжения четырёх областей.
    Комиссия ООН излагает: «30 сентября 2022 года Путин и де-факто власти четырёх областей подписали „договоры" об их присоединении»(Citation: 221).
    Генеральная Ассамблея ООН постановила, что попытка присоединения не имеет законной силы и не может служить основанием для какого-либо изменения статуса Донецкой, Луганской, Херсонской и Запорожской областей(Citation: 226).
