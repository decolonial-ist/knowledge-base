  ru: |-
    Голосование под контролем оккупационных администраций как оформление захвата.
    Генеральная Ассамблея ООН констатирует: «незаконные так называемые референдумы были организованы с 23 по 27 сентября 2022 года в этих регионах» как попытка оправдать изменение статуса украинских территорий, и постановляет, что они не имеют законной силы(Citation: 226).
    Комиссия ООН фиксирует, что эти «так называемые референдумы» провели российские власти на оккупированных территориях четырёх областей(Citation: 221).
