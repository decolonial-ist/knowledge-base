name:
  en: Sham Referendums and the Annexation of Four Provinces (2022)
  uk: Псевдореферендуми та анексія чотирьох областей (2022)
  ru: Псевдореферендумы и аннексия четырёх областей (2022)
description:
  en: ''
  uk: ''
  ru: |-
    В сентябре-октябре 2022 года Российская Федерация руками оккупационных администраций провела в занятых частях Донецкой, Луганской, Херсонской и Запорожской областей «референдумы» о вхождении в её состав и объявила эти области своими; Генеральная Ассамблея ООН признала такое присоединение не имеющим силы(Citation: 221)(Citation: 226).

    Комиссия ООН излагает ход событий: «В сентябре российские власти на оккупированных территориях Донецкой, Херсонской, Луганской и Запорожской областей провели так называемые референдумы о вхождении этих областей в состав Российской Федерации. 30 сентября 2022 года Путин и де-факто власти четырёх областей подписали „договоры" об их присоединении»(Citation: 221).
    Генеральная Ассамблея ООН отметила следующее: «незаконные так называемые референдумы были организованы с 23 по 27 сентября 2022 года в этих регионах» как попытка оправдать изменение статуса территорий, и постановила, что они не имеют законной силы и не могут служить основанием для изменения статуса этих областей(Citation: 226).
