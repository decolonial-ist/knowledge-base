  ru: |-
    Лишение миллиона человек питьевой воды на годы вперёд.
    Управление ООН по правам человека установило, и формулирует так: разрушение плотины «нарушило снабжение питьевой водой и услуги канализации для миллиона человек», подорвав их право на воду, жильё, образование и здоровье, а исчезновение водохранилища, служившего источником для обширной оросительной сети, надолго сократит производство продовольствия и доходы аграриев(Citation: 222).
