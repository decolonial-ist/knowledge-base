name:
  en: Destruction of the Kakhovka Dam and Ecocide of the Lower Dnipro (2023)
  uk: Підрив Каховської ГЕС та екоцид пониззя Дніпра (2023)
  ru: Подрыв Каховской ГЭС и экоцид низовьев Днепра (2023)
description:
  en: ''
  uk: ''
  ru: |-
    6 июня 2023 года Российская Федерация, чьи войска удерживали Каховскую ГЭС с 24 февраля 2022 года, разрушила плотину: за трое-четверо суток вниз по Днепру ушло 18 кубических километров воды, затопив не менее 80 населённых пунктов, погибли десятки жителей обоих берегов, а низовья Днепра как экосистема перестали существовать(Citation: 222).

    Управление ООН по правам человека фиксирует: «6 июня 2023 года плотина Каховской ГЭС была разрушена полностью.
    Она находилась под контролем российских вооружённых сил с 24 февраля 2022 года»(Citation: 222).
    Освободившиеся 18 кубических километров воды затопили не менее 80 населённых пунктов ниже по течению.
    Управление установило личности 15 погибших гражданских - восьми женщин и семи мужчин - в оккупированных Олешках, Голой Пристани, Корсунке, Солонцах и Кардашинке; люди гибли, тонув, от переохлаждения и травм, причём пожилые и люди с инвалидностью пострадали непропорционально, потому что не могли выбраться из собственных домов(Citation: 222).
    По данным МВД Украины, на подконтрольной Украине территории затопление убило 34 гражданских, а оккупационные власти Херсонщины сообщили о 55 погибших на занятом берегу(Citation: 222).
    Разрушение затронуло свыше 37 тысяч домов, 37 учебных заведений и около 11 медицинских учреждений, оставило без питьевой воды и канализации миллион человек, уничтожило более 11 тысяч гектаров леса и повредило природные комплексы, среди которых пять территорий Рамсарского списка и двенадцать объектов Изумрудной сети; исчезновение водохранилища лишило воды оросительную сеть и охлаждающие пруды Запорожской АЭС(Citation: 222).
