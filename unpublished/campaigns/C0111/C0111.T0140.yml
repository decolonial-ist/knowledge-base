description:
  ru: |-
    Уничтожение экосистемы низовьев Днепра сбросом воды из разрушенной плотины.
    Управление ООН по правам человека фиксирует, что затопление «уничтожило более 11 тысяч гектаров леса и повредило природные местообитания, химически загрязнив их и вызвав необратимые последствия для биологического разнообразия»; среди пострадавших территорий - пять объектов Рамсарского списка водно-болотных угодий международного значения и двенадцать объектов Изумрудной сети Бернской конвенции(Citation: 222).
    Исчезновение водохранилища лишило воды обширную оросительную сеть и охлаждающие пруды Запорожской АЭС(Citation: 222).
