  ru: |-
    Разрушение плотины, удерживавшейся российскими войсками, и затопление восьмидесяти населённых пунктов.
    Управление ООН по правам человека установило: «6 июня 2023 года плотина Каховской ГЭС была разрушена полностью.
    Она находилась под контролем российских вооружённых сил с 24 февраля 2022 года», а её разрушение высвободило 18 кубических километров воды за трое-четверо суток и затопило не менее 80 населённых пунктов ниже по течению(Citation: 222).
    Пострадали свыше 37 тысяч домов, 37 учебных заведений и около 11 медицинских учреждений(Citation: 222).
