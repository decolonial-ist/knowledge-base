description:
  ru: |-
    Гибель жителей обоих берегов Днепра при затоплении.
    Управление ООН по правам человека установило личности 15 погибших гражданских - восьми женщин и семи мужчин - в оккупированных Олешках, Голой Пристани, Корсунке, Солонцах и Кардашинке, и отмечает: они погибли «главным образом в результате утопления, переохлаждения или физических травм»; пожилые люди и люди с инвалидностью пострадали непропорционально из-за ограниченной подвижности, а некоторые погибли потому, что не смогли покинуть свой дом(Citation: 222).
    По данным МВД Украины на подконтрольной территории погибли 34 гражданских, оккупационные власти Херсонщины сообщили о 55 погибших на занятом берегу(Citation: 222).
