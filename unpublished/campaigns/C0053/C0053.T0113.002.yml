description:
  ru: |-
    Вытеснение языка из научной сферы: «Приказ Министерства образования СССР о написании и защите диссертаций только на русском языке.
    Утверждение только в Москве»(Citation: 531) – по-русски защищались даже диссертации по украинскому языку и литературе.
  en: |-
    The displacement of the language from scholarship: "The order of the USSR Ministry of Education on writing and defending dissertations only in Russian.
    Approval only in Moscow"(Citation: 531) – even dissertations on the Ukrainian language and literature had to be defended in Russian.
  uk: |-
    Витіснення мови з наукової сфери: «Наказ Міністерства освіти СРСР про написання і захист дисертацій лише російською мовою.
    Затвердження тільки в Москві»(Citation: 531) – російською захищалися навіть дисертації з української мови та літератури.
