name:
  ru: Создание фиктивных угнетенных групп (DEPRECATED)
  en: Creation of Fictitious Oppressed Groups (DEPRECATED)
  uk: Створення фіктивних пригноблених груп (DEPRECATED)
contributors: []
description:
  ru: |-
    Агрессоры могут использовать пропагандистские и агентурные сети для конструирования искусственных политических, языковых или религиозных меньшинств внутри целевого региона, якобы подвергающихся системной дискриминации.
    Формирование ложного нарратива о притеснениях позволяет колонизатору дестабилизировать общество изнутри, спровоцировать социальный раскол и создать легитимный предлог для внешнего вмешательства под видом защиты «угнетаемой» группы.
  en: |-
    Aggressors may use propaganda and agent networks to construct artificial political, linguistic, or religious minorities within a target region that are allegedly subjected to systemic discrimination.
    Forming a false narrative of persecution allows the colonizer to destabilize society from within, provoke a social split, and create a legitimate pretext for external intervention under the guise of protecting the "oppressed" group.
  uk: |-
    Агресори можуть використовувати пропагандистські та агентурні мережі для конструювання штучних політичних, мовних чи релігійних меншин усередині цільового регіону, які нібито зазнають системної дискримінації.
    Формування хибного наративу про утиски дозволяє колонізатору дестабілізувати суспільство зсередини, спровокувати соціальний розкол і створити легітимний привід для зовнішнього втручання під виглядом захисту «пригнобленої» групи.
