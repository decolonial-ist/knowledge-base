name:
  en: False Compromise / Entrapment (DEPRECATED)
  uk: Фальшивий компроміс/пастка (DEPRECATED)
  ru: Ложный компромисс/ловушка (DEPRECATED)
contributors: []
description:
  en: |-
    Aggressors may initiate sham peace negotiations, offer security guarantees, or declare humanitarian corridors solely for the purpose of deceiving the opponent.
    The use of diplomatic ruses and false promises allows the colonizer to lull the vigilance of the Indigenous people, compel them to lay down arms, abandon fortified positions, or move into open terrain, after which the agreements are treacherously violated and the resistance forces are subjected to destruction or capture.
  uk: |-
    Агресори можуть ініціювати фіктивні мирні переговори, пропонувати гарантії безпеки або оголошувати гуманітарні коридори виключно з метою обману опонента.
    Використання дипломатичних хитрощів і неправдивих обіцянок дає колонізаторові змогу приспати пильність корінного народу, змусити його скласти зброю, залишити укріплені позиції або вийти на відкриту місцевість, після чого домовленості віроломно порушуються, а сили спротиву зазнають знищення або захоплення.
  ru: |-
    Агрессоры могут инициировать фиктивные мирные переговоры, предлагать гарантии безопасности или объявлять гуманитарные коридоры исключительно с целью обмана оппонента.
    Использование дипломатических уловок и ложных обещаний позволяет колонизатору усыпить бдительность коренного народа, вынудить его сложить оружие, покинуть укрепленные позиции или выйти на открытую местность, после чего договоренности вероломно нарушаются, а силы сопротивления подвергаются уничтожению или захвату.
