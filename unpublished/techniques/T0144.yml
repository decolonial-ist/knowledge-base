name:
  ru: Создание вторичного/негативного образа в кино, литературе и визуальной пропаганде
  en: Creation of a Secondary/Negative Image in Cinema, Literature, and Visual Propaganda
  uk: Створення вторинного/негативного образу в кіно, літературі та візуальній пропаганді
contributors: []
description:
  ru: |-
    Метрополия может поощрять, а в случае тотатитарной метрополии - предписывать создание негативного или вторичного образа представителей колонизированных народов в кино, литературе и визуальной пропаганде.
    Так, например, сюжетно выпуклые, ведущие роли практически всегда достаются представителям "титульной" нации империи, в то время как представители других народов в основном занимают подчиненные, вспомогательные или откровенно отрицательные позиции.
    Так, например, роли коллаборационистов в советском кино занимали в основном украинцы, а роль командиров патризанских отрядов - русские или русскоязычные.
    То же касается и образов представителей республик СССР в визуальной пропаганде: на плакатах страшим братом всегда был русский, которого окружали представители республик в национальных одеждах.
  en: |-
    The metropole may encourage — and, in the case of a totalitarian metropole, mandate — the creation of a negative or secondary image of members of colonized peoples in cinema, literature, and visual propaganda.
    For example, prominent, leading roles almost always go to representatives of the empire's 'titular' nation, while members of other peoples mostly occupy subordinate, auxiliary, or openly negative positions.
    Thus, for instance, the roles of collaborators in Soviet cinema were mostly given to Ukrainians, while the roles of partisan unit commanders went to Russians or Russian speakers.
    The same applies to the images of representatives of the USSR republics in visual propaganda: on posters, the 'elder brother' was always a Russian, surrounded by representatives of the republics in national dress.
  uk: |-
    Метрополія може заохочувати, а у випадку тоталітарної метрополії — приписувати створення негативного або вторинного образу представників колонізованих народів у кіно, літературі та візуальній пропаганді.
    Так, наприклад, сюжетно виразні, головні ролі майже завжди дістаються представникам «титульної» нації імперії, тоді як представники інших народів здебільшого посідають підпорядковані, допоміжні або відверто негативні позиції.
    Так, наприклад, ролі колабораціоністів у радянському кіно виконували переважно Українці, а ролі командирів партизанських загонів — Росіяни або російськомовні.
    Те саме стосується й образів представників республік СРСР у візуальній пропаганді: на плакатах старшим братом завжди був Росіянин, якого оточували представники республік у національному вбранні.
