description:
  en: |-
    An instrument of foreign-policy pressure and manipulation.
    It is applied by the colonizers in the international arena toward sovereign (or formally independent) states until their complete absorption.
    It includes negotiation processes, the imposition of enslaving treaties, the creation of legal traps, external economic blockades, international blackmail, and collusion with third countries on the partition of others' territories.
  uk: |-
    Інструмент зовнішньополітичного тиску та маніпуляцій.
    Застосовується колонізаторами на міжнародній арені щодо суверенних (або формально незалежних) держав до моменту їхнього повного поглинання.
    Включає переговорні процеси, нав'язування кабальних договорів, створення правових пасток, зовнішні економічні блокади, міжнародний шантаж і змови з третіми країнами про поділ чужих територій.
  ru: |-
    Инструмент внешнеполитического давления и манипуляций.
    Применяется колонизаторами на международной арене по отношению к суверенным (или формально независимым) государствам до момента их полного поглощения.
    Включает в себя переговорные процессы, навязывание кабальных договоров, создание правовых ловушек, внешние экономические блокады, международный шантаж и сговоры с третьими странами о разделе чужих территорий.
