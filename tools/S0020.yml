name:
  en: Controlled Opposition
  uk: Підконтрольна опозиція
  ru: Подконтрольная оппозиция
contributors: []
description:
  en: |-
    Legal political parties, movements, or factions within the colonized society that are covertly or openly sponsored, directed, and comprehensively supported by the aggressor state.
    They are used as a proxy instrument for destabilization, for the procedural seizure of power from within, and for legitimizing external interference under the guise of a domestic political process.
  uk: |-
    Легальні політичні партії, рухи або фракції всередині колонізованого суспільства, які таємно чи відкрито спонсоруються, скеровуються та всебічно підтримуються державою-агресором.
    Використовуються як проксі-інструмент для дестабілізації, процедурного захоплення влади зсередини та легітимізації зовнішнього втручання під виглядом внутрішнього політичного процесу.
  ru: |-
    Легальные политические партии, движения или фракции внутри колонизируемого общества, которые тайно или явно спонсируются, направляются и всесторонне поддерживаются государством-агрессором.
    Используются как прокси-инструмент для дестабилизации, процедурного захвата власти изнутри и легитимизации внешнего вмешательства под видом внутреннего политического процесса.
