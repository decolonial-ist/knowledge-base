name:
  en: Government
  uk: Уряд
  ru: Правительство
contributors: []
description:
  en: |-
    An instrument of internal administration and institutional coercion.
    It comes into use once a territory has already been stripped of international subjecthood and de facto turned into an internal colony.
    It encompasses the work of the metropole's entire state and bureaucratic apparatus: the issuance of discriminatory laws and decrees, changes to administrative borders, systematic cultural and educational assimilation, social engineering, and the legal formalization of control (through population censuses or imitation referendums).
  uk: |-
    Інструмент внутрішнього адміністрування та інституційного примусу.
    Починає застосовуватися тоді, коли територія вже позбавлена міжнародної суб'єктності й де-факто перетворена на внутрішню колонію.
    Охоплює роботу всього державного та бюрократичного апарату метрополії: видання дискримінаційних законів і указів, зміну адміністративних кордонів, системну культурну та освітню асиміляцію, соціальну інженерію, а також юридичну легалізацію контролю (через переписи населення чи імітацію референдумів).
  ru: |-
    Инструмент внутреннего администрирования и институционального принуждения.
    Начинает применяться тогда, когда территория уже лишена международной субъектности и де-факто превращена во внутреннюю колонию.
    Охватывает работу всего государственного и бюрократического аппарата метрополии: издание дискриминационных законов и указов, изменение административных границ, системную культурную и образовательную ассимиляцию, социальную инженерию, а также юридическую легализацию контроля (через переписи населения или имитацию референдумов).
