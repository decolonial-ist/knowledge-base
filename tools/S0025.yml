name:
  ru: Военизированные поселенцы
  en: Militarized Settlers
  uk: Воєнізовані поселенці
contributors: []
description:
  ru: |-
    Инструмент демографической и силовой экспансии, объединяющий военную службу с сельскохозяйственным трудом и физическим освоением территорий.
    Применяется государством для создания вооруженного буфера на фронтире, вытеснения коренного населения с их земель, а также для радикального снижения расходов на содержание многотысячной армии.
    Поселенцы переводятся на самообеспечение, прикрепляются к земле и находятся под тотальным контролем военного командования.
    Исторические инкарнации: иррегулярные казачьи войска (терские, гребенские, кубанские), а также институт военных поселений, масштабно развернутый в Российской империи Александром I под руководством графа А. А. Аракчеева.
    Внедряя эту систему, император опирался на европейский опыт: за образец брались прусская кантональная система комплектования армии (Kantonssystem), в рамках которой страна была разделена на военные округа, и солдатская служба совмещалась с возделыванием земли, в том числе и на захваченных после раздела Польши территориях.
  en: |-
    An instrument of demographic and military expansion that combines military service with agricultural labor and the physical settlement of territories.
    It is employed by the state to create an armed buffer on the frontier, to displace Indigenous populations from their lands, and to radically reduce the cost of maintaining an army of many thousands.
    The settlers are shifted to self-sufficiency, bound to the land, and placed under the total control of the military command.
    Historical incarnations: the irregular Cossack hosts (Terek, Greben, Kuban), as well as the institution of military settlements deployed on a large scale in the Russian Empire by Alexander I under the direction of Count A. A. Arakcheyev.
    In introducing this system, the emperor drew on European experience: the model was the Prussian cantonal system of army recruitment (Kantonssystem), under which the country was divided into military districts and a soldier's service was combined with cultivating the land, including on the territories seized after the partition of Poland.
  uk: |-
    Інструмент демографічної та силової експансії, що поєднує військову службу із сільськогосподарською працею та фізичним освоєнням територій.
    Застосовується державою для створення озброєного буфера на фронтирі, витіснення корінного населення з його земель, а також для радикального зниження витрат на утримання багатотисячної армії.
    Поселенців переводять на самозабезпечення, прикріплюють до землі та тримають під тотальним контролем військового командування.
    Історичні інкарнації: іррегулярні козачі війська (терські, гребінські, кубанські), а також інститут військових поселень, масштабно розгорнутий у Російській імперії Олександром I під керівництвом графа О. А. Аракчеєва.
    Запроваджуючи цю систему, імператор спирався на європейський досвід: за зразок бралася прусська кантональна система комплектування армії (Kantonssystem), у межах якої країна була поділена на військові округи, а солдатська служба поєднувалася з обробітком землі, зокрема й на захоплених після поділу Польщі територіях.
