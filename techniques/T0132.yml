name:
  en: Infiltration of Local Political Structures
  uk: Впровадження своїх людей у місцеві політичні структури
  ru: Внедрение в местные политические структуры
contributors: []
description:
  en: |-
    The aggressor deliberately infiltrates its agents and loyalists into the victim's already existing, legitimate representative bodies, parties, or congresses.
    This makes it possible to hijack the governance of the structure from within, sabotage its work, or force it to make decisions in the aggressor's interests.
  uk: |-
    Агресор цілеспрямовано впроваджує своїх агентів і лоялістів у вже наявні, легітимні представницькі органи, партії чи з'їзди жертви.
    Це дозволяє перехопити управління структурою зсередини, саботувати її роботу або змусити ухвалювати рішення в інтересах агресора.
  ru: |-
    Агрессор целенаправленно внедряет своих агентов и лоялистов в уже существующие, легитимные представительные органы, партии или съезды жертвы.
    Это позволяет перехватить управление структурой изнутри, саботировать ее работу или заставить принимать решения в интересах агрессора.
