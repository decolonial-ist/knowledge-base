name:
  en: Imposition of Alien Governance
  uk: Встановлення чужорідного управління
  ru: Установление чужеродного управления
contributors: []
description:
  en: |-
    The occupation administration artificially deprives subordinated societies of the right to self-governance, appointing loyal representatives of foreign elites over them.
    Unlike the creation of puppet governments (T0037), this technique does not aim to simulate a civil conflict or to create the appearance of a legitimate local authority.
    The use of alien overseers is employed by the metropole for open domination, the destruction of the Indigenous people's traditional social ties, and the uninterrupted mobilization of resources.
  uk: |-
    Окупаційна адміністрація штучно позбавляє підпорядковані суспільства права на самоврядування, призначаючи над ними лояльних представників чужоплемінних еліт.
    На відміну від створення маріонеткових урядів (T0037), ця техніка не має на меті симулювати громадянський конфлікт чи створити видимість легітимної місцевої влади.
    Використання чужорідних наглядачів метрополія застосовує для відкритого домінування, руйнування традиційних соціальних зв'язків корінного народу та безперебійної мобілізації ресурсів.
  ru: |-
    Оккупационная администрация искусственно лишает подчиненные общества права на самоуправление, назначая над ними лояльных представителей иноплеменных элит.
    В отличие от создания марионеточных правительств (T0037), эта техника не преследует цель симулировать гражданский конфликт или создать видимость легитимной местной власти.
    Использование чужеродных надсмотрщиков применяется метрополией для открытого доминирования, разрушения традиционных социальных связей коренного народа и бесперебойной мобилизации ресурсов.
