name:
  en: Predatory Raids
  uk: Розбійницькі набіги
  ru: Разбойные набеги
contributors: []
description:
  en: |-
    Aggressors may organize armed attacks on the settlements of an Indigenous people for the purpose of looting, seizing material valuables, driving off livestock, and taking civilians captive.
    This practice depletes the demographic and economic potential of the colonized society, deprives people of the resources needed for survival, and creates a zone of constant physical threat around the metropole's installations.
  uk: |-
    Агресори можуть організовувати збройні напади на населені пункти корінного народу з метою грабежу, вилучення матеріальних цінностей, викрадення худоби та захоплення мирних жителів у полон.
    Подібна практика виснажує демографічний та економічний потенціал колонізованого суспільства, позбавляє людей ресурсів для виживання та створює зону постійної фізичної загрози навколо об'єктів метрополії.
  ru: |-
    Агрессоры могут организовывать вооруженные нападения на населенные пункты коренного народа с целью грабежа, изъятия материальных ценностей, угона скота и захвата мирных жителей в плен.
    Подобная практика истощает демографический и экономический потенциал колонизируемого общества, лишает людей ресурсов для выживания и создает зону постоянной физической угрозы вокруг объектов метрополии.
