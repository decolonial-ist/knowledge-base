name:
  ru: Цензура
  en: Censorship
  uk: Цензура
contributors: []
description:
  ru: |-
    Агрессоры могут вводить жесткий контроль над всеми формами публичного высказывания, книгопечатанием и средствами массовой информации.
    Запрет на выпуск литературы без санкции назначенных цензоров, фильтрация информации и репрессии против независимых авторов позволяют колонизатору монополизировать информационное пространство.
    Это предотвращает распространение инакомыслия и обеспечивает безальтернативное навязывание колонизируемому обществу государственной идеологии агрессора.
  en: |-
    Aggressors may impose strict control over all forms of public expression, book printing, and mass media.
    Banning the publication of literature without the sanction of appointed censors, filtering information, and repressing independent authors allow the colonizer to monopolize the information space.
    This prevents the spread of dissent and ensures that the aggressor's state ideology is imposed on the colonized society without alternative.
  uk: |-
    Агресори можуть запроваджувати жорсткий контроль над усіма формами публічного висловлювання, книгодрукуванням і засобами масової інформації.
    Заборона видавати літературу без санкції призначених цензорів, фільтрація інформації та репресії проти незалежних авторів дозволяють колонізатору монополізувати інформаційний простір.
    Це запобігає поширенню інакодумства та забезпечує безальтернативне нав'язування колонізованому суспільству державної ідеології агресора.
