name:
  ru: Ограничение географии расселения
  en: Restriction of Settlement Geography
  uk: Обмеження географії розселення
contributors: []
description:
  ru: |-
    Колониальные власти нередко используют юридический или административный запрет на расселение в местах традиционного проживания или на переселение.
    Подобная практика используется для предотвращение доступа коренного населения к важным для колонизаторов ресурсам. напр., рекам; для принуждения коренного населения к эмиграции из-за отсутствия экономических и социальных перспектив и дороговизны жилья; для создания условий для миграции предпочтительных для империи групп на новые территории; наконец, для снижения возможности организованного сопротивления.
  en: |-
    Colonial authorities often impose legal or administrative bans on settling in places of traditional residence or on resettlement.
    This practice is used to prevent the Indigenous population from accessing resources important to the colonizers, e.g., rivers; to force the Indigenous population into emigration due to the absence of economic and social prospects and the high cost of housing; to create conditions for the migration of groups preferred by the empire to the new territories; and, finally, to reduce the capacity for organized resistance.
  uk: |-
    Колоніальна влада нерідко використовує юридичну або адміністративну заборону на розселення в місцях традиційного проживання чи на переселення.
    Подібна практика застосовується для запобігання доступу корінного населення до важливих для колонізаторів ресурсів, напр., річок; для примушення корінного населення до еміграції через відсутність економічних і соціальних перспектив та дорожнечу житла; для створення умов для міграції бажаних для імперії груп на нові території; нарешті, для зниження можливості організованого спротиву.
