name:
  en: Deportation
  uk: Депортація
  ru: Депортация
contributors: []
description:
  en: |-
    Aggressors may resort to the forcible mass expulsion of Indigenous peoples from their historical territories to remote regions.
    This practice physically neutralizes the potential for local guerrilla or political struggle and destroys the social structure of the people, freeing up lands for subsequent settlement by settlers loyal to the colonizer.
  uk: |-
    Агресори можуть вдаватися до насильницького масового виселення корінних народів з їхніх історичних територій у віддалені регіони.
    Ця практика фізично нейтралізує потенціал для партизанської чи політичної боротьби на місцях, а також руйнує соціальну структуру народу, вивільняючи землі для подальшого заселення лояльними до колонізатора переселенцями.
  ru: |-
    Агрессоры могут прибегать к насильственному массовому выселению коренных народов с их исторических территорий в отдаленные регионы.
    Эта практика физически нейтрализует потенциал для партизанской или политической борьбы на местах, а также разрушает социальную структуру народа, высвобождая земли под последующее заселение лояльными колонизатору переселенцами.
