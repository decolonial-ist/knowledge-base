name:
  ru: Создание марионеточных религиозных институтов
  en: Creation of Puppet Religious Institutions
  uk: Створення маріонеткових релігійних інститутів
contributors: []
description:
  ru: |-
    Агрессоры могут учреждать собственные, полностью подконтрольные религиозные должности и структуры для колонизируемого общества и назначать на них нанятых или завербованных духовных лиц.
    Вместо захвата существующих институтов создаётся параллельный, лояльный империи религиозный авторитет, через который колонизатор пытается перехватить духовную легитимность у лидеров сопротивления и направить проповедь на подчинение народа.
    В отличие от захвата религиозных институтов (T0100), существующие институты не подчиняются, а подменяются назначенцем; в отличие от религиозной ассимиляции (T0116), работа ведётся внутри религии колонизируемого народа, а не переводом его в конфессию метрополии.
  en: |-
    Aggressors may establish their own fully controlled religious posts and structures for the colonized society and appoint hired or recruited clergy to them.
    Instead of capturing existing institutions, a parallel religious authority loyal to the empire is created, through which the colonizer attempts to seize spiritual legitimacy from resistance leaders and direct preaching toward the people's subjugation.
    Unlike Seizure of Religious Institutions (T0100), existing institutions are not subordinated but replaced by an appointee; unlike Religious Assimilation (T0116), the work is carried out within the colonized people's own religion, rather than by converting it to the metropole's confession.
  uk: |-
    Агресори можуть засновувати власні, повністю підконтрольні релігійні посади і структури для колонізованого суспільства та призначати на них найнятих або завербованих духовних осіб.
    Замість захоплення наявних інститутів створюється паралельний, лояльний імперії релігійний авторитет, через який колонізатор намагається перехопити духовну легітимність у лідерів опору і спрямувати проповідь на підпорядкування народу.
    На відміну від захоплення релігійних інститутів (T0100), наявні інститути не підпорядковуються, а підмінюються призначенцем; на відміну від релігійної асиміляції (T0116), робота ведеться всередині релігії колонізованого народу, а не переведенням його до конфесії метрополії.
