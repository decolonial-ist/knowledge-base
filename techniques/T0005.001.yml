name:
  en: ''
  uk: ''
  ru: Выдача нападения за оборону
contributors: []
description:
  en: ''
  uk: ''
  ru: |-
    В рамках присвоения статуса жертвы агрессоры могут словами объявлять нападение обороной: называть колонизируемый народ угрозой существованию страны (исследователи называют это секьюритизацией), приписывать ему теракты без доказательств, обвинять его в том, что готовят сами (исследователи геноцида называют это «обвинением в зеркале»), называть вторжение защитой граждан.
    Так колонизатор получает согласие метрополии на войну, не меняя фактов на земле.
