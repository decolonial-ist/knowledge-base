name:
  ru: Оккупация как спасение
  en: Occupation as Salvation
  uk: Окупація як порятунок
contributors: []
description:
  ru: |-
    В рамках навязывания своей картины реальности агрессоры могут объявлять вторжение и оккупацию спасением захваченных: «наведением порядка», «защитой населения», «освобождением» или «цивилизаторской миссией».
    Так колонизатор оправдывает своё господство в глазах метрополии, коренного народа и всего мира.
  en: |-
    As part of the imposition of its own picture of reality, aggressors may declare the invasion and occupation to be the salvation of the conquered: "restoring order", "protecting the population", "liberation" or a "civilizing mission".
    This is how the colonizer justifies its domination in the eyes of the metropole, the Indigenous people and the whole world.
  uk: |-
    У межах нав'язування власної картини реальності агресори можуть оголошувати вторгнення та окупацію порятунком захоплених: «наведенням порядку», «захистом населення», «визволенням» або «цивілізаторською місією».
    Так колонізатор виправдовує своє панування в очах метрополії, корінного народу й усього світу.
