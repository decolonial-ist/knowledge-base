name:
  en: Deprivation of Drinking Water
  uk: Позбавлення питної води
  ru: Лишение питьевой воды
contributors: []
description:
  en: |-
    Aggressors may deliberately destroy water supply infrastructure (water utilities, pumping stations, dams) or physically block access to natural sources.
    Disabling this critical life-support system is used to create catastrophic sanitary and epidemiological conditions and to break the population's capacity for defense.
  uk: |-
    Агресори можуть навмисно знищувати інфраструктуру водопостачання (водоканали, насосні станції, греблі) або фізично блокувати доступ до природних джерел.
    Виведення з ладу критичної системи життєзабезпечення застосовується для створення катастрофічних санітарно-епідеміологічних умов і зламу обороноздатності населення.
  ru: |-
    Агрессоры могут преднамеренно уничтожать инфраструктуру водоснабжения (водоканалы, насосные станции, плотины) либо физически блокировать доступ к природным источникам.
    Выведение из строя критической системы жизнеобеспечения применяется для создания катастрофических санитарно-эпидемиологических условий и слома обороноспособности населения.
