name:
  en: Creation of Agents of Influence
  uk: Створення агентури впливу
  ru: Создание агентуры влияния
contributors: []
description:
  en: |-
    Aggressors may deliberately recruit, bribe, or ideologically motivate ordinary members of the local population, marginalized groups, and criminal elements to create a covert network of loyal operatives in the target territory.
    Forming a controlled agent network, including provocateurs, street militants, informers, and saboteurs, allows the colonizer to organize artificial mass riots, exert physical pressure on civilian activists, gather intelligence, and destabilize the socio-political situation within the colonized society before the start of an open intervention.
  uk: |-
    Агресори можуть цілеспрямовано вербувати, підкуповувати або ідеологічно мотивувати рядових представників місцевого населення, маргіналізовані групи та кримінальні елементи для створення прихованої мережі лояльних виконавців на цільовій території.
    Формування підконтрольної агентури, що включає провокаторів, вуличних бойовиків, інформаторів і диверсантів, дає колонізаторові змогу організовувати штучні масові заворушення, здійснювати фізичний тиск на цивільних активістів, збирати розвідувальні дані та дестабілізувати суспільно-політичну обстановку всередині колонізованого суспільства перед початком відкритої інтервенції.
  ru: |-
    Агрессоры могут целенаправленно вербовать, подкупать или идеологически мотивировать рядовых представителей местного населения, маргинализированные группы и криминальные элементы для создания скрытой сети лояльных исполнителей на целевой территории.
    Формирование подконтрольной агентуры, включающей провокаторов, уличных боевиков, информаторов и диверсантов, позволяет колонизатору организовывать искусственные массовые беспорядки, осуществлять физическое давление на гражданских активистов, собирать разведывательные данные и дестабилизировать общественно-политическую обстановку внутри колонизируемого общества перед началом открытой интервенции.
