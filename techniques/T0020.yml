name:
  ru: Организация переворота
  en: Staging a Coup
  uk: Організація перевороту
contributors: []
description:
  ru: |-
    Агрессоры могут инициировать, спонсировать и тайно координировать насильственную смену власти в колонизируемом обществе.
    Путем свержения легитимного правительства силами внутренней оппозиции, радикальных групп или завербованных военных колонизатор искусственно создает политический кризис.
    Это позволяет ему оперативно установить марионеточный режим без необходимости начинать открытую полномасштабную военную интервенцию.
  en: |-
    Aggressors may initiate, sponsor, and covertly coordinate a violent change of power in the colonized society.
    By overthrowing the legitimate government using the forces of internal opposition, radical groups, or recruited military officers, the colonizer artificially creates a political crisis.
    This allows it to swiftly install a puppet regime without having to launch an open, full-scale military intervention.
  uk: |-
    Агресори можуть ініціювати, спонсорувати та таємно координувати насильницьку зміну влади в колонізованому суспільстві.
    Шляхом повалення легітимного уряду силами внутрішньої опозиції, радикальних груп або завербованих військових колонізатор штучно створює політичну кризу.
    Це дозволяє йому оперативно встановити маріонетковий режим без необхідності розпочинати відкриту повномасштабну воєнну інтервенцію.
