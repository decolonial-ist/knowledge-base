name:
  en: Construction of Fortresses
  uk: Зведення фортець
  ru: Возведение крепостей
contributors: []
description:
  en: |-
    Aggressors may build fortresses, ostrogs (stockaded forts), and chains of defensive lines (military lines) on the territories of Indigenous peoples.
    This infrastructure physically cuts the local population off from vital resources (for example, lowland pastures), blocks communications, and serves as a protected staging ground for the permanent stationing of occupation troops and the subsequent resettlement of colonists from the metropole.
  uk: |-
    Агресори можуть будувати фортеці, остроги та ланцюги оборонних рубежів (військові лінії) на територіях корінних народів.
    Ця інфраструктура фізично відрізає місцеве населення від життєво важливих ресурсів (наприклад, рівнинних пасовищ), блокує комунікації та слугує захищеним плацдармом для постійного розміщення окупаційних військ і подальшого переселення колоністів із метрополії.
  ru: |-
    Агрессоры могут строить крепости, остроги и цепи оборонительных рубежей (военные линии) на территориях коренных народов.
    Эта инфраструктура физически отрезает местное население от жизненно важных ресурсов (например, равнинных пастбищ), блокирует коммуникации и служит защищенным плацдармом для постоянного размещения оккупационных войск и последующего переселения колонистов из метрополии.
