name:
  ru: Ресурсная эксплуатация
  en: Resource Exploitation
  uk: Ресурсна експлуатація
contributors: []
description:
  ru: |-
    Агрессоры могут устанавливать бесконтрольный и истощающий режим использования природных богатств, инфраструктурных объектов и производственного потенциала захваченного региона.
    Выкачивание полезных ископаемых, незаконная добыча ресурсов и использование продовольственных резервов в интересах метрополии лишает коренной народ экономической базы для самостоятельного существования и перенаправляет все богатства региона на обогащение колонизатора.
  en: |-
    Aggressors may establish an uncontrolled and exhausting regime of exploitation of the natural riches, infrastructure facilities, and productive potential of the seized region.
    Pumping out mineral resources, illegal resource extraction, and using food reserves in the interests of the metropole deprives the Indigenous people of the economic base for independent existence and redirects all the region's wealth toward the enrichment of the colonizer.
  uk: |-
    Агресори можуть встановлювати безконтрольний і виснажливий режим використання природних багатств, інфраструктурних об'єктів і виробничого потенціалу захопленого регіону.
    Викачування корисних копалин, незаконний видобуток ресурсів і використання продовольчих резервів в інтересах метрополії позбавляє корінний народ економічної бази для самостійного існування та перенаправляє всі багатства регіону на збагачення колонізатора.
