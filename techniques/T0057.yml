name:
  ru: Эксплуатация труда
  en: Labor Exploitation
  uk: Експлуатація праці
contributors: []
description:
  ru: |-
    Агрессоры могут принудительно привлекать местное население к тяжелым, опасным или неоплачиваемым работам в интересах метрополии.
    Данная техника служит прямому извлечению выгоды за счет использования бесплатной или предельно дешевой рабочей силы для реализации государственных мегапроектов, военных или промышленных нужд колонизатора.
    Одновременно эта практика применяется для нейтрализации защиты: изъятие трудоспособного населения из экономики региона и работа в условиях, сопряженных с высокой смертностью, физически истощает общество и снижает его демографический потенциал.
  en: |-
    Aggressors may forcibly conscript the local population into heavy, dangerous, or unpaid labor in the interests of the metropole.
    This technique serves the direct extraction of benefits through the use of free or extremely cheap labor for the implementation of the colonizer's state megaprojects and military or industrial needs.
    At the same time, this practice is used for the neutralization of defenses: the removal of the able-bodied population from the region's economy and labor under conditions associated with high mortality physically exhaust the society and reduce its demographic potential.
  uk: |-
    Агресори можуть примусово залучати місцеве населення до важких, небезпечних або неоплачуваних робіт в інтересах метрополії.
    Ця техніка слугує прямому отриманню вигоди завдяки використанню безоплатної або гранично дешевої робочої сили для реалізації державних мегапроєктів, воєнних чи промислових потреб колонізатора.
    Водночас ця практика застосовується для нейтралізації захисту: вилучення працездатного населення з економіки регіону та праця в умовах, пов'язаних із високою смертністю, фізично виснажують суспільство і знижують його демографічний потенціал.
