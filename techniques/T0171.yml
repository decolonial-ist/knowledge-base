  ru: Преследование за рубежом
contributors: []
description:
  en: ''
  uk: ''
  ru: |-
    Агрессоры могут находить и убивать участников сопротивления и других людей колонизированного народа за пределами захваченной земли: силами спецслужб и наёмников, через запросы о выдаче и давление на чужие государства.
    Убийства без наказания мстят за сопротивление, запугивают остальных, чтобы те не вставали на защиту, и показывают, что колонизатор достанет везде.
