name:
  en: Destruction of the Natural Landscape
  uk: Руйнування природного ландшафту
  ru: Разрушение природного ландшафта
contributors: []
description:
  en: |-
    Aggressors may deliberately alter or destroy the natural landscape of the target region (for example, by carrying out large-scale felling of centuries-old forests or destroying natural barriers).
    This is done to deprive the Indigenous people of natural cover, to prevent mobile guerrilla warfare, to seize resources needed for survival (firewood, building materials), and to completely destroy the traditional physical space.
  uk: |-
    Агресори можуть цілеспрямовано змінювати або знищувати природний ландшафт цільового регіону (наприклад, здійснюючи масштабну вирубку багатовікових лісів чи знищення природних бар'єрів).
    Це робиться для позбавлення корінного народу природних укриттів, запобігання маневреній партизанській війні, а також вилучення ресурсів для виживання (дров, будівельних матеріалів) і повного руйнування традиційного фізичного простору.
  ru: |-
    Агрессоры могут целенаправленно изменять или уничтожать природный ландшафт целевого региона (например, проводя масштабную вырубку многовековых лесов или уничтожение природных барьеров).
    Это делается для лишения коренного народа естественных укрытий, предотвращения маневренной партизанской войны, а также изъятия ресурсов для выживания (дров, строительных материалов) и полного разрушения традиционного физического пространства.
