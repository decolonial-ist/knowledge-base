name:
  en: Administrative Corruption and Extortion
  uk: Адміністративна корупція та здирництво
  ru: Административная коррупция и вымогательство
contributors: []
description:
  en: |-
    Aggressors may use their military-administrative apparatus and monopoly position in seized or colonized territories to create a system of shadow levies and systematic extortion.
    Representatives of the occupation administration artificially erect bureaucratic, logistical, and legal barriers, forcing the Indigenous population to pay unregulated bribes to exercise basic rights — to conduct trade, to move freely, or to keep their property.
    This practice is used for the direct extraction of benefits through the illegal enrichment of the metropole's apparatus at the expense of the local population's resources.
    At the same time, it serves as an instrument of institutional consolidation of control, as it turns arbitrariness into the norm and demonstrates to the colonized society its absolute lack of rights before the aggressor's officials.
  uk: |-
    Агресори можуть використовувати свій військово-адміністративний апарат і монопольне становище на захоплених або колонізованих територіях для створення системи тіньових поборів і систематичного вимагання.
    Представники окупаційної адміністрації штучно зводять бюрократичні, логістичні та правові бар'єри, змушуючи корінне населення платити нерегламентовані хабарі за реалізацію базових прав — ведення торгівлі, свободу пересування чи збереження майна.
    Ця практика застосовується для прямого отримання вигоди шляхом нелегального збагачення апарату метрополії за рахунок ресурсів місцевого населення.
    Водночас вона слугує інструментом інституційного закріплення контролю, оскільки перетворює свавілля на норму й демонструє колонізованому суспільству його абсолютне безправ'я перед чиновниками агресора.
  ru: |-
    Агрессоры могут использовать свой военно-административный аппарат и монопольное положение на захваченных или колонизируемых территориях для создания системы теневых поборов и систематического вымогательства.
    Представители оккупационной администрации искусственно возводят бюрократические, логистические и правовые барьеры, принуждая коренное население платить нерегламентированные взятки за реализацию базовых прав - ведение торговли, свободу передвижения или сохранение имущества.
    Данная практика применяется для прямого извлечения выгоды путем нелегального обогащения аппарата метрополии за счет ресурсов местного населения.
    Одновременно она служит инструментом институционального закрепления контроля, так как превращает произвол в норму и демонстрирует колонизируемому обществу его абсолютное бесправие перед чиновниками агрессора.
