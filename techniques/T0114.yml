name:
  ru: Образовательная ассимиляция
  en: Educational Assimilation
  uk: Освітня асиміляція
contributors: []
description:
  ru: |-
    Агрессоры могут использовать систему образования на захваченных территориях как базовый инструмент переформатирования идентичности детей и молодежи.
    Целенаправленная замена образовательной среды, учебных стандартов и языка обучения позволяет колонизатору воспитывать следующие поколения коренного народа в парадигме безусловной лояльности к метрополии.
  en: |-
    Aggressors may use the education system in seized territories as a fundamental instrument for reformatting the identity of children and youth.
    The deliberate replacement of the educational environment, curricular standards, and language of instruction allows the colonizer to raise the next generations of the Indigenous people in a paradigm of unconditional loyalty to the metropole.
  uk: |-
    Агресори можуть використовувати систему освіти на захоплених територіях як базовий інструмент переформатування ідентичності дітей та молоді.
    Цілеспрямована заміна освітнього середовища, навчальних стандартів і мови навчання дає колонізаторові змогу виховувати наступні покоління корінного народу в парадигмі безумовної лояльності до метрополії.
