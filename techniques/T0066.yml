name:
  ru: Продажа территории
  en: Sale of Territory
  uk: Продаж території
contributors: []
description:
  ru: |-
    Агрессоры могут осуществлять коммерческие сделки по передаче захваченных земель вместе с проживающим на них коренным народом под контроль третьих государств в обмен на финансовую компенсацию.
    При реализации подобной дипломатическо-экономической операции территория рассматривается колонизатором сугубо как ликвидный актив для пополнения собственной казны, а суверенитет, права и национальные интересы местного общества полностью и демонстративно игнорируются.
  en: |-
    Aggressors may conduct commercial transactions transferring seized lands, together with the Indigenous people living on them, to the control of third states in exchange for financial compensation.
    In carrying out such a diplomatic-economic operation, the colonizer treats the territory purely as a liquid asset for replenishing its own treasury, while the sovereignty, rights, and national interests of the local society are completely and demonstratively ignored.
  uk: |-
    Агресори можуть здійснювати комерційні угоди з передачі захоплених земель разом із корінним народом, що на них проживає, під контроль третіх держав в обмін на фінансову компенсацію.
    Під час реалізації такої дипломатично-економічної операції колонізатор розглядає територію суто як ліквідний актив для поповнення власної скарбниці, а суверенітет, права та національні інтереси місцевого суспільства повністю й демонстративно ігноруються.
