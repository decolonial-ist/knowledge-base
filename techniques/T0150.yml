name:
  en: Comprehensive Reconnaissance of Territories
  uk: Комплексна розвідка територій
  ru: Комплексная разведка территорий
contributors: []
description:
  en: |-
    Aggressors deliberately organize the collection of strategic, geographic, demographic, and economic data on target territories.
    Within this technique, the colonizer sends diplomats, merchants, explorers, or specialized expeditions to determine the population size of a potential object of colonization, assess its defensive capacity and infrastructure, and survey mineral deposits and natural resources.
    The information obtained is used by the metropole to plan a subsequent seizure by force, the establishment of control, or economic exploitation.
    The colonizer's emissaries often attempt to win over the population with gifts it values (for example, glass beads resembling objects used as money and perceived as foreign currency) or through mutually beneficial trade exchange.
    In some cases, people are drawn into participation in rituals that the colonizer later construes as a declaration of allegiance.
  uk: |-
    Агресори цілеспрямовано організовують збір стратегічних, географічних, демографічних та економічних даних про цільові території.
    У межах цієї техніки колонізатор надсилає дипломатів, купців, дослідників або спеціалізовані експедиції для з'ясування чисельності населення потенційного об'єкта колонізації, оцінки його обороноздатності та інфраструктури, а також розвідки корисних копалин і природних ресурсів.
    Отриману інформацію метрополія використовує для планування подальшого силового захоплення, встановлення контролю або економічної експлуатації.
    Часто емісари колонізатора намагаються прихилити до себе населення за допомогою цінних для нього подарунків (наприклад, скляних намистин, що нагадують предмети, які використовуються як гроші, та сприймаються як іноземна валюта) або взаємовигідного торговельного обміну.
    У деяких випадках людей залучають до участі в ритуалах, які колонізатор згодом трактує як декларацію підданства.
  ru: |-
    Агрессоры целенаправленно организуют сбор стратегических, географических, демографических и экономических данных о целевых территориях.
    В рамках этой техники колонизатор посылает дипломатов, купцов, исследователей или специализированные экспедиции для выявления численности населения потенциального объекта колонизации, оценки его обороноспособности и инфраструктуры, а также разведки полезных ископаемых и природных ресурсов.
    Полученная информация используется метрополией для планирования последующего силового захвата, установления контроля или экономической эксплуатации.
    Зачастую эмиссары колонизатора пытаются расположить к себе население с помощью ценных для него подарков (например, стеклянные бусы, напоминающие используемые в качестве денег предметы и воспринимаемые как иностранная валюта) или взаимовыгодного торгового обмена.
    В некоторых случаях имеет место привлечение людей к участию в ритуалах, которые потом воспринимаются колонизатором как декларация подданства.
