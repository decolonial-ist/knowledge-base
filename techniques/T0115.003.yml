tactics:
- TA0005
name:
  en: Cultural Chauvinism
  uk: Культурний шовінізм
  ru: Культурный шовинизм
contributors: []
description:
  en: |-
    As part of cultural assimilation, aggressors may systematically impose, through state institutions and media, the idea of the unconditional superiority of the metropole's culture over the culture of the colonized society.
    Cultivating a contemptuous attitude toward the art, traditions, and customs of the local population instills in it an inferiority complex, stimulating mass voluntary renunciation of one's own roots for the sake of successful integration into the aggressor's society.
  uk: |-
    У межах культурної асиміляції агресори можуть системно нав'язувати через державні інституції та медіа ідею беззаперечної вищості культури метрополії над культурою колонізованого суспільства.
    Культивування зневажливого ставлення до мистецтва, традицій і звичаїв місцевого населення формує в нього комплекс меншовартості, стимулюючи масову добровільну відмову від власного коріння заради успішної інтеграції в суспільство агресора.
  ru: |-
    В рамках культурной ассимиляции агрессоры могут системно навязывать через государственные институты и медиа идею безоговорочного превосходства культуры метрополии над культурой колонизируемого общества.
    Культивирование пренебрежительного отношения к искусству, традициям и обычаям местного населения формирует у него комплекс неполноценности, стимулируя массовый добровольный отказ от своих корней ради успешной интеграции в общество агрессора.
