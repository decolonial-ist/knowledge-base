name:
  ru: Тотальное уничтожение инфраструктуры
  en: Total Destruction of Infrastructure
  uk: Тотальне знищення інфраструктури
contributors: []
description:
  ru: |-
    Агрессоры могут преднамеренно и массированно разрушать населённые пункты коренного народа - жилые дома, больницы, школы, культовые здания, системы жизнеобеспечения - вплоть до полного уничтожения.
    Народ лишается жилья, хозяйства и физической среды жизни на своей земле.
  en: |-
    Aggressors may deliberately and massively destroy the settlements of an indigenous people - homes, hospitals, schools, houses of worship, life-support systems - up to complete destruction.
    The people are deprived of housing, livelihood, and the physical environment of life on their own land.
  uk: |-
    Агресори можуть навмисно й масовано руйнувати населені пункти корінного народу - житлові будинки, лікарні, школи, культові споруди, системи життєзабезпечення - аж до повного знищення.
    Народ позбавляється житла, господарства і фізичного середовища життя на своїй землі.
