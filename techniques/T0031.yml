name:
  en: Restriction of Sovereignty
  uk: Обмеження суверенітету
  ru: Ограничение суверенитета
contributors: []
description:
  en: |-
    Aggressors may impose terms that radically curtail the political rights and independence of a local government.
    Through a categorical ban on conducting an independent foreign policy, depriving an Indigenous people of the right to freely elect their leaders, and direct interference in domestic legislation, the aggressor methodically transforms a self-governing entity into a fully controlled, rightless province.
  uk: |-
    Агресори можуть нав'язувати умови, що радикально урізають політичні права та незалежність місцевого уряду.
    Шляхом категоричної заборони на ведення самостійної зовнішньої політики, позбавлення корінного народу права вільно обирати своїх лідерів і прямого втручання у внутрішнє законодавство агресор планомірно перетворює самоврядне утворення на повністю підконтрольну, безправну провінцію.
  ru: |-
    Агрессоры могут навязывать условия, радикально урезающие политические права и независимость местного правительства.
    Путем категорического запрета на ведение самостоятельной внешней политики, лишения коренного народа права свободно избирать своих лидеров и прямого вмешательства во внутреннее законодательство, агрессор планомерно трансформирует самоуправляемое образование в полностью подконтрольную, бесправную провинцию.
