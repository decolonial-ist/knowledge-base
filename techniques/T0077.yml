name:
  en: Punitive Expeditions
  uk: Каральні експедиції
  ru: Карательные экспедиции
contributors: []
description:
  en: |-
    Aggressors may conduct targeted armed raids against the local population of settlements that offer resistance.
    During punitive expeditions, mass arrests, destruction of residential infrastructure, and demonstrative terror are carried out, which serves the immediate neutralization of defenses by physically suppressing pockets of resistance and intimidating the society.
  uk: |-
    Агресори можуть проводити цілеспрямовані збройні рейди проти місцевого населення населених пунктів, які чинять опір.
    Під час каральних експедицій здійснюються масові арешти, руйнування житлової інфраструктури та показовий терор, що слугує негайній нейтралізації захисту, фізично придушуючи осередки опору та залякуючи суспільство.
  ru: |-
    Агрессоры могут проводить целенаправленные вооруженные рейды против местного населения населенных пунктов, оказывающих сопротивление.
    В ходе карательных экспедиций осуществляются массовые аресты, разрушение жилой инфраструктуры и показательный террор, что служит немедленной нейтрализации защиты, физически подавляя очаги сопротивления и запугивая общество.
