name:
  en: Deprivation of Electricity and Heating
  uk: Позбавлення електрики та опалення
  ru: Лишение электричества и отопления
contributors: []
description:
  en: |-
    Aggressors may systematically destroy energy infrastructure facilities, thermal power plants, and power transmission lines to create conditions incompatible with normal life.
    Mass deprivation of basic necessities serves as a form of collective punishment aimed at physically and psychologically breaking the society's will to resist.
  uk: |-
    Агресори можуть систематично руйнувати об'єкти енергетичної інфраструктури, теплоелектростанції та лінії електропередачі для створення умов, несумісних із нормальною життєдіяльністю.
    Масове позбавлення базових благ є формою колективного покарання, спрямованого на те, щоб фізично й психологічно зламати волю суспільства до опору.
  ru: |-
    Агрессоры могут систематически разрушать объекты энергетической инфраструктуры, теплоэлектростанции и линии электропередач для создания условий, несовместимых с нормальной жизнедеятельностью.
    Массовое лишение базовых благ выступает формой коллективного наказания, направленной на то, чтобы физически и психологически сломить волю общества к сопротивлению.
