name:
  ru: Коллективные наказания
  en: Collective Punishment
  uk: Колективні покарання
contributors: []
description:
  ru: |-
    Агрессоры могут применять коллективные наказания: за действия отдельных лиц расправе подвергается вся община - на сёла и округа налагаются денежные взыскания, войска ставятся на постой за счёт жителей, семьи и родственники высылаются, жилища сносятся, берутся заложники.
    Запрет закреплён во всех ключевых кодификациях права войны: статья 50 Гаагского положения о законах и обычаях сухопутной войны (1899, 1907) не допускает общих взысканий с населения за деяния единичных лиц; статья 33 IV Женевской конвенции (1949) прямо запрещает «коллективные наказания, равно как и всякие меры запугивания или террора»; Дополнительный протокол II к Женевским конвенциям (1977) распространяет запрет на немеждународные вооружённые конфликты, а свод обычного международного гуманитарного права МККК (2005, норма 103) фиксирует его для любых конфликтов.
  en: |-
    Aggressors may apply collective punishment: for the actions of individuals, reprisals fall on the entire community - villages and districts are subjected to monetary levies, troops are quartered at the residents' expense, families and relatives are exiled, dwellings are demolished, hostages are taken.
    The prohibition is entrenched in every key codification of the law of war: Article 50 of the Hague Regulations on the Laws and Customs of War on Land (1899, 1907) forbids general penalties imposed on the population for the acts of individuals; Article 33 of the Fourth Geneva Convention (1949) expressly prohibits "collective penalties and likewise all measures of intimidation or of terrorism"; Additional Protocol II to the Geneva Conventions (1977) extends the prohibition to non-international armed conflicts, and the ICRC study of customary international humanitarian law (2005, Rule 103) records it for conflicts of any kind.
  uk: |-
    Агресори можуть застосовувати колективні покарання: за дії окремих осіб розправі піддається вся громада - на села й округи накладаються грошові стягнення, війська ставляться на постій коштом жителів, сім'ї та родичі висилаються, житла зносяться, беруться заручники.
    Заборону закріплено в усіх ключових кодифікаціях права війни: стаття 50 Гаазького положення про закони і звичаї сухопутної війни (1899, 1907) не допускає загальних стягнень з населення за діяння одиничних осіб; стаття 33 IV Женевської конвенції (1949) прямо забороняє «колективні покарання, а так само всякі заходи залякування або терору»; Додатковий протокол II до Женевських конвенцій (1977) поширює заборону на неміжнародні збройні конфлікти, а звід звичаєвого міжнародного гуманітарного права МКЧХ (2005, норма 103) фіксує її для будь-яких конфліктів.
