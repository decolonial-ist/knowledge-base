name:
  en: Deprivation of Agency
  uk: Позбавлення суб'єктності
  ru: Лишение субъектности
contributors: []
description:
  en: |-
    Aggressors may deliberately deny an Indigenous people the right to independent political, legal, and historical existence.
    At the ideological level, this manifests in the dissemination of narratives about the colonized society's lack of agency, which serves the legitimization of domination.
    At the diplomatic and administrative level, the technique is implemented through the unilateral abolition of sovereignty, the annulment or rewriting of previously concluded international treaties, and the shift of relations from equal footing to a format of direct diktat, which ensures the institutional seizure of governance and the legal consolidation of the occupation.
  uk: |-
    Агресори можуть цілеспрямовано відмовляти корінному народові в праві на самостійне політичне, правове та історичне існування.
    На ідеологічному рівні це проявляється в трансляції наративів про несамостійність колонізованого суспільства, що слугує легітимізації домінування.
    На дипломатичному й адміністративному рівні техніка реалізується через одностороннє скасування суверенітету, анулювання або переписування раніше укладених міжнародних договорів і переведення відносин із рівноправних у формат прямого диктату, що забезпечує інституційне захоплення управління та юридичне закріплення окупації.
  ru: |-
    Агрессоры могут целенаправленно отказывать коренному народу в праве на самостоятельное политическое, правовое и историческое существование.
    На идеологическом уровне это проявляется в трансляции нарративов о несамостоятельности колонизируемого общества, что служит легитимизации доминирования.
    На дипломатическом и административном уровне техника реализуется через одностороннее упразднение суверенитета, отмену или переписывание ранее заключенных международных договоров и перевод отношений из равноправных в формат прямого диктата, что обеспечивает институциональный захват управления и юридическое закрепление оккупации.
