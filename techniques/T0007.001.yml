name:
  ru: Ложь о собственных действиях
  en: Lies about Its Own Actions
  uk: Брехня про власні дії
contributors: []
description:
  ru: |-
    В рамках навязывания своей картины реальности агрессоры могут отрицать или искажать свои действия: заявлять, что преступлений не было, выдавать мирных жителей, которых они убили, за бойцов, уменьшать число жертв, приписывать свои преступления другим или самим жертвам.
    Так колонизатор уходит от ответственности.
  en: |-
    As part of the imposition of its own picture of reality, aggressors may deny or distort their actions: claim that there were no crimes, present the civilians they killed as fighters, understate the number of victims, attribute their crimes to others or to the victims themselves.
    This is how the colonizer evades responsibility.
  uk: |-
    У межах нав'язування власної картини реальності агресори можуть заперечувати або спотворювати свої дії: заявляти, що злочинів не було, видавати мирних жителів, яких вони вбили, за бійців, применшувати число жертв, приписувати свої злочини іншим або самим жертвам.
    Так колонізатор уникає відповідальності.
