- TA0005
name:
  en: Replacement of the Native Language's Alphabet
  uk: Зміна абетки рідної мови
  ru: Смена алфавита родного языка
contributors: []
description:
  en: |-
    As part of cultural assimilation, aggressors may forcibly change the graphic basis (alphabet) of the local population's language.
    Converting the script of the Indigenous people to the metropole's alphabet artificially cuts new generations off from the body of previously published national literature, historical documents, and cultural heritage, while simultaneously facilitating linguistic unification and creating the false impression of illiteracy and the absence of a written tradition before the arrival of the colonizers.
  uk: |-
    У межах культурної асиміляції агресори можуть примусово змінювати графічну основу (абетку) мови місцевого населення.
    Переведення писемності корінного народу на абетку метрополії штучно відтинає нові покоління від масиву раніше виданої національної літератури, історичних документів і культурної спадщини, водночас полегшуючи процес мовної уніфікації та створюючи хибне враження неписьменності й безписемності до приходу колонізаторів.
  ru: |-
    В рамках культурной ассимиляции агрессоры могут принудительно изменять графическую основу (алфавит) языка местного населения.
    Перевод письменности коренного народа на алфавит метрополии искусственно отсекает новые поколения от массива ранее изданной национальной литературы, исторических документов и культурного наследия, одновременно облегчая процесс языковой унификации и создания ложного впечатление безграмотности и бесписьменности до прихода колонизаторов.
