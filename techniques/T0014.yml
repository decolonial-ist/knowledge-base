name:
  ru: Спонсирование внутренних радикальных группировок
  en: Sponsoring Domestic Radical Groups
  uk: Спонсорування внутрішніх радикальних угруповань
contributors: []
description:
  ru: |-
    Агрессоры могут тайно финансировать, обучать, вооружать и информационно поддерживать маргинальные или радикальные группировки внутри колонизируемого общества.
    Искусственная эскалация внутренних конфликтов и разжигание насилия извне ослабляет правоохранительную систему коренного народа, дестабилизирует регион и создает для колонизатора удобный предлог для внешнего вмешательства под видом миротворческой операции или восстановления порядка.
  en: |-
    Aggressors may covertly finance, train, arm, and provide informational support to marginal or radical groups within the colonized society.
    The artificial escalation of internal conflicts and the incitement of violence from outside weakens the law-enforcement system of the Indigenous people, destabilizes the region, and creates a convenient pretext for the colonizer's external intervention under the guise of a peacekeeping operation or the restoration of order.
  uk: |-
    Агресори можуть таємно фінансувати, навчати, озброювати та інформаційно підтримувати маргінальні чи радикальні угруповання всередині колонізованого суспільства.
    Штучна ескалація внутрішніх конфліктів і розпалювання насильства ззовні послаблює правоохоронну систему корінного народу, дестабілізує регіон і створює для колонізатора зручний привід для зовнішнього втручання під виглядом миротворчої операції чи відновлення порядку.
