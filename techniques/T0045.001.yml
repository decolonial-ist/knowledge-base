name:
  en: Destruction of Shrines and Necropolises
  uk: Знищення святинь і некрополів
  ru: Уничтожение святынь и некрополей
contributors: []
description:
  en: |-
    Aggressors may destroy shrines and necropolises: burn and demolish churches and mosques, raze holy places, turn gravestones into building material.
    A blow at the places of prayer and memory strikes at the community's very ability to remain itself.
    This is prohibited by the Hague Regulations (Article 27), the 1954 Hague Convention for the Protection of Cultural Property and the Rome Statute (Article 8(2)(b)(ix)) - the very charge on which the International Criminal Court delivered its first conviction for the destruction of cultural objects (the Al Mahdi case on Timbuktu, 2016).
  uk: |-
    Агресори можуть знищувати святині та некрополі: палити і зносити храми й мечеті, руйнувати святі місця, пускати надгробки на будматеріал.
    Удар по місцях молитви і пам'яті б'є по здатності громади залишатися собою.
    Це заборонено Гаазьким положенням (стаття 27), Гаазькою конвенцією про захист культурних цінностей (1954) і Римським статутом (стаття 8(2)(b)(ix)) - саме за цим складом Міжнародний кримінальний суд виніс перший вирок за руйнування культурних об'єктів (справа аль-Магді щодо Тімбукту, 2016).
  ru: |-
    Агрессоры могут уничтожать святыни и некрополи: жечь и сносить храмы и мечети, разрушать святые места, пускать надгробия на стройматериал.
    Удар по местам молитвы и памяти бьёт по способности общины оставаться собой.
    Это запрещено Гаагским положением (статья 27), Гаагской конвенцией о защите культурных ценностей (1954) и Римским статутом (статья 8(2)(b)(ix)) - именно по этому составу Международный уголовный суд вынес первый приговор за разрушение культурных объектов (дело аль-Махди по Тимбукту, 2016).
