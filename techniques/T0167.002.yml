description:
  ru: 'Агрессоры могут объявлять или подписывать перемирие и нарушать его: подтягивать войска и занимать позиции за время паузы или продолжать нападения, пока оно держится только на бумаге.'
  en: 'Aggressors may declare or sign a ceasefire and break it: bring up troops and take up positions during the pause, or continue the attacks while the ceasefire holds only on paper.'
  uk: 'Агресори можуть оголошувати або підписувати перемир''я й порушувати його: підтягувати війська й займати позиції під час паузи або продовжувати напади, поки воно тримається лише на папері.'
