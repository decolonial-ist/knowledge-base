name:
  en: Annexation of Territories
  uk: Анексія територій
  ru: Аннексия территорий
contributors: []
description:
  en: |-
    Aggressors may carry out the forcible and unilateral annexation of another state's territory.
    Such actions are accompanied by the complete abolition of the sovereignty of the captured entity and the final integration of its lands into the occupier's legal and economic space through the issuance of corresponding manifestos or the staging of sham electoral procedures.
  uk: |-
    Агресори можуть здійснювати насильницьке та одностороннє приєднання території іншої держави.
    Такі дії супроводжуються повним скасуванням суверенітету захопленого утворення та остаточною інтеграцією його земель у правове та економічне поле окупанта шляхом видання відповідних маніфестів або проведення фіктивних електоральних процедур.
  ru: |-
    Агрессоры могут осуществлять насильственное и одностороннее присоединение территории другого государства.
    Подобные действия сопровождаются полной отменой суверенитета захваченного образования и окончательной интеграцией его земель в правовое и экономическое поле оккупанта посредством издания соответствующих манифестов или проведения фиктивных электоральных процедур.
