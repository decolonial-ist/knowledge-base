name:
  en: Transport Blockade
  uk: Транспортна блокада
  ru: Транспортная блокада
contributors: []
description:
  en: |-
    Aggressors may deliberately cut off air, rail, sea, and road connections with the target region.
    The physical isolation of the territory from the outside world allows the colonizer to paralyze the logistics of the Indigenous people, interrupt deliveries of vitally important goods, and deprive the society of the ability to receive external aid or coordinate its actions with allies.
  uk: |-
    Агресори можуть цілеспрямовано перекривати повітряне, залізничне, морське й автомобільне сполучення з цільовим регіоном.
    Фізична ізоляція території від зовнішнього світу дає колонізаторові змогу паралізувати логістику корінного народу, перервати постачання життєво важливих вантажів і позбавити суспільство можливості отримувати зовнішню допомогу чи координувати свої дії із союзниками.
  ru: |-
    Агрессоры могут целенаправленно перекрывать воздушное, железнодорожное, морское и автомобильное сообщение с целевым регионом.
    Физическая изоляция территории от внешнего мира позволяет колонизатору парализовать логистику коренного народа, прервать поставки жизненно важных грузов и лишить общество возможности получать внешнюю помощь или координировать свои действия с союзниками.
