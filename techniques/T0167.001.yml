name:
  ru: Ложные гарантии безопасности
  en: False Guarantees of Safety
  uk: Фальшиві гарантії безпеки
contributors: []
description:
  ru: |-
    Агрессоры могут обещать сохранить жизнь, свободу или имущество тем, кто сложит оружие, сдастся, придёт с повинной или вернётся домой.
    Затем колонизатор арестовывает, высылает или убивает поверивших.
  en: |-
    Aggressors may promise that those who lay down their arms, surrender, turn themselves in or return home will keep their lives, freedom or property.
    The colonizer then arrests, deports or kills those who believed it.
  uk: |-
    Агресори можуть обіцяти зберегти життя, свободу або майно тим, хто складе зброю, здасться, прийде з повинною або повернеться додому.
    Потім колонізатор заарештовує, висилає або вбиває тих, хто повірив.
