name:
  en: Expulsion and Barring of Foreign Missions
  uk: Видворення та недопуск зовнішніх місій
  ru: Выдворение и недопуск внешних миссий
contributors: []
description:
  en: |-
    Aggressors may expel independent international observers, human rights defenders, foreign diplomats and journalists from the seized land, or deny them access to it and to the people in their power: close missions, refuse entry, leave requests unanswered.
    This is how the colonizer creates an information blockade, conceals the scale of its crimes and deprives the Indigenous people of international protection.
  uk: |-
    Агресори можуть видворяти із захопленої землі незалежних міжнародних спостерігачів, правозахисників, дипломатів іноземних держав і журналістів або не допускати їх туди та до людей у своїй владі: закривати місії, відмовляти у в'їзді, не відповідати на запити.
    Так колонізатор створює інформаційну блокаду, приховує масштаби злочинів і позбавляє корінний народ міжнародного захисту.
  ru: |-
    Агрессоры могут выдворять с захваченной земли независимых международных наблюдателей, правозащитников, дипломатов иностранных государств и журналистов или не допускать их туда и к людям в своей власти: закрывать миссии, отказывать во въезде, не отвечать на запросы.
    Так колонизатор создаёт информационную блокаду, скрывает масштабы преступлений и лишает коренной народ международной защиты.
