name:
  ru: Работорговля
  en: Slave Trade
  uk: Работоргівля
contributors: []
description:
  ru: |-
    Агрессоры или назначенные ими наместники могут осуществлять коммерческую продажу представителей принудительно подчиненного коренного народа в рабство.
    Подобная практика используется как для прямого незаконного обогащения оккупационного аппарата, так и для физического истощения демографического потенциала колонизируемого общества путем перманентного изъятия и вывоза людей за пределы их исторического проживания.
  en: |-
    Aggressors, or the governors they appoint, may carry out the commercial sale of members of a forcibly subjugated Indigenous people into slavery.
    This practice is used both for the direct illegal enrichment of the occupation apparatus and for the physical depletion of the colonized society's demographic potential through the permanent removal and export of people beyond the lands of their historical residence.
  uk: |-
    Агресори або призначені ними намісники можуть здійснювати комерційний продаж представників примусово підкореного корінного народу в рабство.
    Подібна практика використовується як для прямого незаконного збагачення окупаційного апарату, так і для фізичного виснаження демографічного потенціалу колонізованого суспільства шляхом перманентного вилучення та вивезення людей за межі території їхнього історичного проживання.
