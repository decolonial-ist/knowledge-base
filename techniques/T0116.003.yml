name:
  ru: Запрет богослужений на родном языке
  en: Ban on Worship in the Native Language
  uk: Заборона богослужінь рідною мовою
contributors: []
description:
  ru: |-
    В рамках религиозной ассимиляции агрессоры могут категорически запрещать использование языка коренного народа в религиозных обрядах, священных текстах и духовном образовании.
    Вытеснение местного языка из сакральной сферы закрепляет его статус как второсортного, разрывает духовную связь поколений и ускоряет лингвистическое поглощение колонизируемого общества.
  en: |-
    As part of religious assimilation, aggressors may categorically prohibit the use of the indigenous people's language in religious rites, sacred texts, and spiritual education.
    Displacing the local language from the sacred sphere cements its status as second-rate, severs the spiritual bond between generations, and accelerates the linguistic absorption of the colonized society.
  uk: |-
    У межах релігійної асиміляції агресори можуть категорично забороняти використання мови корінного народу в релігійних обрядах, священних текстах і духовній освіті.
    Витіснення місцевої мови із сакральної сфери закріплює її статус як другосортної, розриває духовний зв'язок поколінь і пришвидшує лінгвістичне поглинання колонізованого суспільства.
