name:
  ru: Фиктивные договоры
  en: Sham Treaties
  uk: Фіктивні договори
contributors: []
description:
  ru: |-
    Агрессоры могут использовать дипломатические соглашения как инструмент юридической ловушки для коренного народа.
    Заключая договор о протекторате или союзе, колонизатор изначально отказывается брать на себя симметричные обязательства, используя текст соглашения исключительно для урезания прав местного населения.
    Это создает легальную базу для последующего одностороннего вмешательства и демонтажа независимых институтов без формального объявления войны.
  en: |-
    Aggressors may use diplomatic agreements as an instrument of legal entrapment for an Indigenous people.
    When concluding a treaty of protectorate or alliance, the colonizer refuses from the outset to assume symmetrical obligations, using the text of the agreement solely to curtail the rights of the local population.
    This creates a legal basis for subsequent unilateral interference and the dismantling of independent institutions without a formal declaration of war.
  uk: |-
    Агресори можуть використовувати дипломатичні угоди як інструмент юридичної пастки для корінного народу.
    Укладаючи договір про протекторат чи союз, колонізатор від самого початку відмовляється брати на себе симетричні зобов'язання, використовуючи текст угоди виключно для урізання прав місцевого населення.
    Це створює легальну базу для подальшого одностороннього втручання та демонтажу незалежних інституцій без формального оголошення війни.
