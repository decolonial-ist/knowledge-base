name:
  en: Imposition of Asymmetric Bilingualism and Optionality
  uk: Нав'язування асиметричної двомовності та факультативності
  ru: Навязывание асимметричного двуязычия и факультативности
contributors: []
description:
  en: |-
    As part of educational assimilation, aggressors may create administrative conditions under which the study of the metropole's language becomes strictly mandatory, while the native language is relegated to the status of a secondary elective.
    The artificial creation of organizational barriers to studying the local language instills in young people a perception of their native speech as marginal and unprestigious, encouraging mass voluntary abandonment of its study.
  uk: |-
    У межах освітньої асиміляції агресори можуть створювати адміністративні умови, за яких вивчення мови метрополії стає суворо обов'язковим, а рідна мова переводиться в статус другорядного факультативу.
    Штучне створення організаційних бар'єрів для вивчення місцевої мови формує в молоді сприйняття рідної мови як маргінальної та непрестижної, стимулюючи масову добровільну відмову від її вивчення.
  ru: |-
    В рамках образовательной ассимиляции агрессоры могут создавать административные условия, при которых изучение языка метрополии становится строго обязательным, а родной язык переводится в статус второстепенного факультатива.
    Искусственное создание организационных барьеров для изучения местного языка формирует у молодежи восприятие родной речи как маргинальной и непрестижной, стимулируя массовый добровольный отказ от ее изучения.
