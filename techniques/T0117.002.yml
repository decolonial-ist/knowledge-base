name:
  ru: Поощрение смешанных браков
  en: Encouragement of Mixed Marriages
  uk: Заохочення змішаних шлюбів
contributors: []
description:
  ru: |-
    В рамках демографической ассимиляции агрессоры могут использовать административные, экономические и идеологические стимулы для поощрения брачных союзов между представителями коренного народа и переселенцами из метрополии.
    Целенаправленное стимулирование смешанных браков ускоряет процесс размывания национальной идентичности местного населения, так как следующие поколения в таких семьях, как правило, воспитываются в языковой и культурной парадигме доминирующего государства-колонизатора.
  en: |-
    As part of demographic assimilation, aggressors may use administrative, economic, and ideological incentives to encourage marital unions between members of the indigenous people and settlers from the metropole.
    Deliberate promotion of mixed marriages accelerates the erosion of the local population's national identity, since subsequent generations in such families are, as a rule, raised in the linguistic and cultural paradigm of the dominant colonizing state.
  uk: |-
    У межах демографічної асиміляції агресори можуть використовувати адміністративні, економічні та ідеологічні стимули для заохочення шлюбних союзів між представниками корінного народу та переселенцями з метрополії.
    Цілеспрямоване стимулювання змішаних шлюбів пришвидшує процес розмивання національної ідентичності місцевого населення, оскільки наступні покоління в таких сім'ях, як правило, виховуються в мовній і культурній парадигмі домінантної держави-колонізатора.
