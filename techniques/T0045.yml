- TA0005
name:
  en: Destruction of Historical Memory
  uk: Знищення історичної пам'яті
  ru: Уничтожение исторической памяти
contributors: []
description:
  en: |-
    Aggressors may deliberately destroy the physical and intellectual objects that shape national identity: museums, architectural monuments, cultural institutions, archives and written heritage, shrines and necropolises.
    Erasing material evidence of the past and forcibly removing national symbols from public space allows the colonizer to create a cultural vacuum, which is subsequently filled, with no alternative, by the artificial narratives of the metropole.
  uk: |-
    Агресори можуть цілеспрямовано руйнувати фізичні та інтелектуальні об'єкти, що формують національну ідентичність: музеї, пам'ятки архітектури, культурні інституції, архіви та писемну спадщину, святині й некрополі.
    Стирання матеріальних свідчень минулого і примусове вилучення національних символів із публічного простору дає колонізаторові змогу створити культурний вакуум, який згодом безальтернативно заповнюється штучними наративами метрополії.
  ru: |-
    Агрессоры могут целенаправленно разрушать физические и интеллектуальные объекты, формирующие национальную идентичность: музеи, памятники архитектуры, культурные институты, архивы и письменное наследие, святыни и некрополи.
    Стирание материальных свидетельств прошлого и принудительное изъятие национальных символов из публичного пространства позволяет колонизатору создать культурный вакуум, который впоследствии безальтернативно заполняется искусственными нарративами метрополии.
