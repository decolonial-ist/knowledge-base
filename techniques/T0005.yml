name:
  en: Aggressor Claiming Victim Status
  uk: Привласнення статусу жертви агресором
  ru: Присвоение статуса жертвы агрессором
contributors: []
description:
  en: ''
  uk: ''
  ru: |-
    Агрессоры могут менять роли местами и выставлять своё нападение обороной: объявлять колонизируемый народ угрозой самому существованию метрополии, приписывать ему нападения, устраивать или допускать такие нападения сами.
    Так колонизатор оправдывает вторжение перед метрополией и миром и перекладывает вину за войну на колонизируемых.
