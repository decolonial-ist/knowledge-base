name:
  ru: Присвоение статуса жертвы агрессором
  en: Aggressor Claiming Victim Status
  uk: Привласнення статусу жертви агресором
contributors: []
description:
  ru: |-
    Агрессоры могут использовать пропагандистские инструменты для инверсии ролей, выставляя собственные наступательные действия как вынужденную меру самообороны.
    Заявляя о фиктивных угрозах со стороны местного населения или внешних сил, агрессор конструирует ложный нарратив, в котором он выступает исключительно защитником собственных интересов или безопасности.
    Это позволяет морально оправдать вторжение и переложить вину за эскалацию насилия на колонизируемое общество.
  en: |-
    Aggressors may use propaganda instruments to invert roles, presenting their own offensive actions as a forced measure of self-defense.
    By claiming fictitious threats from the local population or external forces, the aggressor constructs a false narrative in which it acts solely as a defender of its own interests or security.
    This makes it possible to morally justify the invasion and shift the blame for the escalation of violence onto the colonized society.
  uk: |-
    Агресори можуть використовувати пропагандистські інструменти для інверсії ролей, подаючи власні наступальні дії як вимушений захід самооборони.
    Заявляючи про фіктивні загрози з боку місцевого населення чи зовнішніх сил, агресор конструює хибний наратив, у якому він виступає виключно захисником власних інтересів чи безпеки.
    Це дає змогу морально виправдати вторгнення та перекласти провину за ескалацію насильства на колонізоване суспільство.
