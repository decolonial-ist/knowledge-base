name:
  ru: Дегуманизация
  en: Dehumanization
  uk: Дегуманізація
contributors: []
description:
  ru: |-
    Агрессоры могут использовать пропагандистские практики для лишения представителей колонизируемого народа человеческих черт.
    Жертва целенаправленно маркируется уничижительными ярлыками (например, «нелюди», «боевики», «нацисты», «фашисты», «террористы»), что призвано снять психологические и моральные барьеры у оккупационных войск и легитимизировать любые зверства в глазах общества агрессора, приводя к полной утрате эмпатии.
  en: |-
    Aggressors may use propaganda practices to strip members of the colonized people of their human features.
    The victim is deliberately marked with derogatory labels (e.g., “subhumans,” “militants,” “Nazis,” “fascists,” “terrorists”), which is intended to remove psychological and moral barriers among the occupation troops and to legitimize any atrocities in the eyes of the aggressor's society, leading to a complete loss of empathy.
  uk: |-
    Агресори можуть використовувати пропагандистські практики для позбавлення представників колонізованого народу людських рис.
    Жертва цілеспрямовано маркується принизливими ярликами (наприклад, «нелюди», «бойовики», «нацисти», «фашисти», «терористи»), що має зняти психологічні та моральні бар'єри в окупаційних військ і легітимізувати будь-які звірства в очах суспільства агресора, призводячи до повної втрати емпатії.
