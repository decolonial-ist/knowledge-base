name:
  en: Linguistic Assimilation
  uk: Лінгвістична асиміляція
  ru: Лингвистическая ассимиляция
contributors: []
description:
  en: |-
    Aggressors may deliberately displace and marginalize the native language of the Indigenous people, replacing it with the language of the metropole.
    The systematic narrowing of the local language's sphere of use in public, cultural, and everyday life allows the colonizer to sever the bond between generations, deprive the colonized society of the most important marker of national identity, and accelerate the process of its cultural absorption.
  uk: |-
    Агресори можуть цілеспрямовано витісняти й маргіналізувати рідну мову корінного народу, замінюючи її мовою метрополії.
    Системне звуження сфери вживання місцевої мови в публічному, культурному та побутовому просторі дає колонізаторові змогу розірвати зв'язок поколінь, позбавити колонізоване суспільство найважливішого маркера національної ідентичності та прискорити процес його культурного поглинання.
  ru: |-
    Агрессоры могут целенаправленно вытеснять и маргинализировать родной язык коренного народа, заменяя его языком метрополии.
    Системное сужение сферы применения местного языка в публичном, культурном и бытовом пространстве позволяет колонизатору разорвать связь поколений, лишить колонизируемое общество важнейшего маркера национальной идентичности и ускорить процесс его культурного поглощения.
