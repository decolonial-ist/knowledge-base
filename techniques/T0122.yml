name:
  ru: Медицинская и гуманитарная блокада
  en: Medical and Humanitarian Blockade
  uk: Медична та гуманітарна блокада
contributors: []
description:
  ru: |-
    Агрессоры могут целенаправленно блокировать доступ мирного населения к медицинской помощи, медикаментам и гуманитарной помощи и препятствовать работе медицинских и гуманитарных миссий.
    Это максимизирует потери среди гражданских лиц и раненых, истощая ресурсы колонизируемого общества и подавляя его способность к сопротивлению.
  en: |-
    Aggressors may deliberately block civilians' access to medical care, medicines, and humanitarian aid, and obstruct the work of medical and humanitarian missions.
    This maximizes losses among civilians and the wounded, depleting the resources of the colonized society and suppressing its capacity for resistance.
  uk: |-
    Агресори можуть цілеспрямовано блокувати доступ мирного населення до медичної допомоги, ліків та гуманітарної допомоги і перешкоджати роботі медичних та гуманітарних місій.
    Це максимізує втрати серед цивільних осіб і поранених, виснажуючи ресурси колонізованого суспільства та придушуючи його здатність до опору.
