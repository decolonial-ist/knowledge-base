name:
  ru: Убийство пленных и задержанных
  en: Killing of Prisoners and Detainees
  uk: Вбивство полонених і затриманих
contributors: []
description:
  ru: |-
    Агрессоры могут убивать пленных и задержанных - людей, уже находящихся в их власти: без суда, по спискам, «при попытке к бегству».
    Преднамеренное убийство военнопленного - «серьёзное нарушение» III Женевской конвенции (статья 130), гражданского лица в руках стороны - IV конвенции (статья 147); убийство любого задержанного вне боя запрещено общей статьёй 3 Женевских конвенций.
  en: |-
    Aggressors may kill prisoners and detainees - people already in their power: without trial, by lists, «while attempting to escape».
    The wilful killing of a prisoner of war is a «grave breach» of the Third Geneva Convention (Article 130), of a civilian in a party's hands - of the Fourth Convention (Article 147); the killing of any detainee outside combat is prohibited by Common Article 3 of the Geneva Conventions.
  uk: |-
    Агресори можуть вбивати полонених і затриманих - людей, які вже перебувають у їхній владі: без суду, за списками, «при спробі втечі».
    Умисне вбивство військовополоненого - «серйозне порушення» III Женевської конвенції (стаття 130), цивільної особи в руках сторони - IV конвенції (стаття 147); вбивство будь-якого затриманого поза боєм заборонено спільною статтею 3 Женевських конвенцій.
