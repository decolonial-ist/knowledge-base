name:
  en: Economic Control
  uk: Економічний контроль
  ru: Экономический контроль
contributors: []
description:
  en: |-
    Aggressors may establish a complete monopoly over financial flows, taxes, and trade operations in the seized territories.
    Placing the region's economy under the colonizer's manual control allows it to redirect all collected funds into its own treasury, deprive the Indigenous people of economic independence, and rigidly tie their livelihood to the metropole.
    This phenomenon manifested most vividly in the USSR, where all aspects of the economy were subordinated to the state, and all legal economic activity, up until the last few years of Soviet rule, was planned and regulated by the USSR's Gosplan from Moscow.
  uk: |-
    Агресори можуть встановлювати повну монополію над фінансовими потоками, податками й торговельними операціями на захоплених територіях.
    Переведення економіки регіону під ручне управління колонізатора дає йому змогу перенаправити всі зібрані кошти до своєї скарбниці, позбавити корінний народ економічної самостійності та жорстко прив'язати його життєзабезпечення до метрополії.
    Найяскравіше це явище проявилося в СРСР, де всі аспекти економіки були підпорядковані державі, а вся легальна економічна діяльність аж до останніх кількох років радянської влади планувалася й регулювалася Держпланом СРСР із Москви.
  ru: |-
    Агрессоры могут устанавливать полную монополию над финансовыми потоками, налогами и торговыми операциями на захваченных территориях.
    Перевод экономики региона под ручное управление колонизатора позволяет ему перенаправить все собираемые средства в свою казну, лишить коренной народ экономической самостоятельности и жестко привязать его жизнеобеспечение к метрополии.
    Наиболее ярко это явление проявилось в СССР, где все аспекты экономики были подчинены государству, вся легальная экономическая деятельность вплость до последних нескольких лет советской власти планировалась и регулировалась Госпланом СССР из Москвы.
