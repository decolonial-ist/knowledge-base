description:
  en: ''
  uk: ''
  ru: |-
    Агрессоры могут принуждать беженцев вернуться на захваченную землю: лишать их еды, жилья и регистрации там, где они укрылись, сносить их лагеря и вывозить людей обратно под надзор оккупантов.
    Так колонизатор выдаёт войну за оконченную и возвращает людей под свой контроль.
