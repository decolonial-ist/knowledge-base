name:
  en: Erasure and Renaming of Place Names
  uk: Стирання та перейменування топонімів
  ru: Стирание и переименование топонимов
contributors: []
description:
  en: |-
    Aggressors may carry out the deliberate replacement of the historical geographic names, street names, city names, and region names of the Indigenous people with toponyms tied to the culture, ideology, and history of the metropole.
    Erasing the original names allows the colonizer to visually and mentally integrate the seized lands into its state space, and to deprive the colonized society of the physical markers of its national identity and historical memory.
  uk: |-
    Агресори можуть здійснювати цілеспрямовану заміну історичних географічних назв, найменувань вулиць, міст і регіонів корінного народу на топоніми, пов'язані з культурою, ідеологією та історією метрополії.
    Стирання оригінальних назв дає колонізаторові змогу візуально й ментально інтегрувати захоплені землі у свій державний простір, а також позбавити колонізоване суспільство фізичних маркерів його національної ідентичності та історичної пам'яті.
  ru: |-
    Агрессоры могут осуществлять целенаправленную замену исторических географических названий, наименований улиц, городов и регионов коренного народа на топонимы, связанные с культурой, идеологией и историей метрополии.
    Стирание оригинальных названий позволяет колонизатору визуально и ментально интегрировать захваченные земли в свое государственное пространство, а также лишить колонизируемое общество физических маркеров его национальной идентичности и исторической памяти.
