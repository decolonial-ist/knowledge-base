name:
  en: Religious Assimilation
  uk: Релігійна асиміляція
  ru: Религиозная ассимиляция
contributors: []
description:
  en: |-
    Aggressors may deliberately destroy, substitute, or integrate the spiritual institutions and beliefs of an indigenous people into their own dominant religious system.
    Using religion as an instrument of unification allows the colonizer to establish a rigid ideological dictate, destroy the independent spiritual authorities of the local population, and impose submission upon it through the sacralization of the aggressor's power.
  uk: |-
    Агресори можуть цілеспрямовано руйнувати, підміняти або інтегрувати духовні інституції та вірування корінного народу у власну домінантну релігійну систему.
    Використання релігії як інструменту уніфікації дозволяє колонізатору встановити жорсткий ідеологічний диктат, знищити незалежні духовні авторитети місцевого населення та нав'язати йому покору через сакралізацію влади агресора.
  ru: |-
    Агрессоры могут целенаправленно разрушать, подменять или интегрировать духовные институты и верования коренного народа в собственную доминирующую религиозную систему.
    Использование религии как инструмента унификации позволяет колонизатору установить жесткий идеологический диктат, уничтожить независимые духовные авторитеты местного населения и навязать ему покорность через сакрализацию власти агрессора.
