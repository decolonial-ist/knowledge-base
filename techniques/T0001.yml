name:
  en: Imposition of a Backwardness Narrative
  uk: Нав'язування образу відсталості
  ru: Навязывание образа отсталости
contributors: []
description:
  en: |-
    Aggressors may systematically disseminate a narrative that the culture, way of life, and social organization of an Indigenous people are primitive and undeveloped.
    Constructing an image of backwardness serves the legitimization of domination, making it possible to justify occupation and repression with the fabricated necessity of bringing progress and “civilization.”
  uk: |-
    Агресори можуть системно транслювати наратив про те, що культура, побут і соціальний устрій корінного народу є примітивними та нерозвиненими.
    Конструювання образу відсталості слугує легітимізації домінування, дозволяючи виправдовувати окупацію та репресії вигаданою необхідністю нести прогрес і «цивілізацію».
  ru: |-
    Агрессоры могут системно транслировать нарратив о том, что культура, быт и социальное устройство коренного народа являются примитивными и неразвитыми.
    Конструирование образа отсталости служит легитимизации доминирования, позволяя оправдывать оккупацию и репрессии вымышленной необходимостью нести прогресс и «цивилизацию».
