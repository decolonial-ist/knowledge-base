name:
  ru: Принудительная мобилизация
  en: Forced Mobilization
  uk: Примусова мобілізація
contributors: []
description:
  ru: |-
    Агрессоры могут принудительно забирать представителей коренного народа в ряды собственных вооруженных сил для участия в боевых действиях (в том числе против их собственных соотечественников).
    Эта техника применяется для извлечения выгоды за счет использования местного населения в качестве бесплатного человеческого ресурса.
    Одновременно она служит целям нейтрализации защиты: отправляя мужчин на далекие фронты, колонизатор целенаправленно истощает демографический и военный потенциал региона, лишая общество способности к самообороне.
  en: |-
    Aggressors may forcibly conscript members of the Indigenous people into their own armed forces to take part in combat operations (including against their own compatriots).
    This technique is used to extract benefits by exploiting the local population as a free human resource.
    At the same time, it serves the purposes of neutralizing defenses: by sending men to distant fronts, the colonizer deliberately depletes the region's demographic and military potential, depriving the society of its capacity for self-defense.
  uk: |-
    Агресори можуть примусово забирати представників корінного народу до лав власних збройних сил для участі в бойових діях (зокрема проти їхніх власних співвітчизників).
    Ця техніка застосовується для отримання вигоди шляхом використання місцевого населення як безоплатного людського ресурсу.
    Водночас вона слугує цілям нейтралізації захисту: відправляючи чоловіків на далекі фронти, колонізатор цілеспрямовано виснажує демографічний і військовий потенціал регіону, позбавляючи суспільство здатності до самооборони.
