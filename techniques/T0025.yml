name:
  en: Information Isolation
  uk: Інформаційна ізоляція
  ru: Информационная изоляция
contributors: []
description:
  en: |-
    Aggressors may block communication channels, independent media, and access to external sources of information.
    Creating an information vacuum ensures the neutralization of defenses by depriving the society of the ability to coordinate resistance, and also allows the aggressor to conceal the scale of the war crimes being committed.
  uk: |-
    Агресори можуть блокувати канали зв'язку, незалежні ЗМІ та доступ до зовнішніх джерел інформації.
    Створення інформаційного вакууму забезпечує нейтралізацію захисту шляхом позбавлення суспільства можливості координувати опір, а також дозволяє агресору приховати масштаби скоюваних воєнних злочинів.
  ru: |-
    Агрессоры могут блокировать каналы связи, независимые СМИ и доступ к внешним источникам информации.
    Создание информационного вакуума обеспечивает нейтрализацию защиты путем лишения общества возможности координировать сопротивление, а также позволяет агрессору скрыть масштабы совершаемых военных преступлений.
