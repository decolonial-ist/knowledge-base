name:
  en: Sexualized Violence
  uk: Сексуалізоване насильство
  ru: Сексуализированное насилие
contributors: []
description:
  en: |-
    Aggressors may use sexualized violence as a weapon: rape during punitive operations and sweep operations, sexual torture of detainees, the treatment of captive women as spoils.
    Such violence targets more than the victim - it terrorizes and humiliates the entire community.
    Rape, sexual slavery and any other form of sexual violence is a war crime and a crime against humanity (Articles 7(1)(g) and 8(2)(b)(xxii) of the Rome Statute; Article 27 of the Fourth Geneva Convention).
  uk: |-
    Агресори можуть застосовувати сексуалізоване насильство як зброю: зґвалтування під час каральних операцій і зачисток, сексуальні тортури затриманих, перетворення полонянок на здобич.
    Таке насильство спрямоване не тільки на жертву - воно тероризує і принижує всю громаду.
    Зґвалтування, сексуальне рабство і будь-які інші форми сексуального насильства - воєнний злочин і злочин проти людяності (статті 7(1)(g) і 8(2)(b)(xxii) Римського статуту; стаття 27 IV Женевської конвенції).
  ru: |-
    Агрессоры могут применять сексуализированное насилие как оружие: изнасилования при карательных операциях и зачистках, сексуальные пытки задержанных, обращение пленниц в добычу.
    Такое насилие направлено не только на жертву - оно терроризирует и унижает всю общину.
    Изнасилование, сексуальное рабство и любые другие формы сексуального насилия - военное преступление и преступление против человечности (статьи 7(1)(g) и 8(2)(b)(xxii) Римского статута; статья 27 IV Женевской конвенции).
