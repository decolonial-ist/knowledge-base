name:
  en: Extermination on a Territorial Basis
  uk: Винищення за територіальною ознакою
  ru: Истребление по территориальному признаку
contributors: []
description:
  en: |-
    Aggressors may carry out the physical extermination of a population not on the basis of the victims' political views or ethnicity, but totally — solely by virtue of their presence in a given territory.
    To wipe pockets of resistance off the face of the earth, carpet bombing of residential areas, deliberate mass shootings of residents, and other methods may be employed.
  uk: |-
    Агресори можуть здійснювати фізичне знищення населення не за принципом політичних поглядів чи етнічної належності жертв, а тотально — виключно за фактом їхнього перебування на певній території.
    Для стирання осередків опору з лиця землі можуть застосовуватися килимові бомбардування житлових кварталів, навмисні масові розстріли мешканців тощо.
  ru: |-
    Агрессоры могут осуществлять физическое уничтожение населения не по принципу политических взглядов или этнической принадлежности жертв, а тотально - исключительно по факту их нахождения на определенной территории.
    Для стирания очагов сопротивления с лица земли могут применяться ковровые бомбардировки жилых кварталов, преднамеренные массовые расстрелы жителей и др.
