name:
  en: Impunity of Perpetrators
  uk: Безкарність виконавців
  ru: Безнаказанность исполнителей
contributors: []
description:
  en: |-
    Aggressors may guarantee their soldiers, police officers and officials impunity for crimes against the Indigenous people: hide the guilty, imitate investigations, pardon them through amnesties and reward them.
    This is how the colonizer drives the perpetrators to new crimes and shows the victims that the law does not protect them.
  uk: |-
    Агресори можуть гарантувати своїм солдатам, поліцейським і чиновникам безкарність за злочини проти корінного народу: переховувати винних, імітувати розслідування, прощати амністіями й нагороджувати.
    Так колонізатор штовхає виконавців на нові злочини, а жертвам показує, що закон їх не захищає.
  ru: |-
    Агрессоры могут гарантировать своим солдатам, полицейским и чиновникам безнаказанность за преступления против коренного народа: прятать виновных, имитировать расследования, прощать амнистиями и награждать.
    Так колонизатор толкает исполнителей на новые преступления, а жертвам показывает, что закон их не защищает.
