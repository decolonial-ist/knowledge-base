name:
  en: Torture and Abuse
  uk: Катування та знущання
  ru: Пытки и истязания
contributors: []
description:
  en: |-
    Aggressors may apply systematic physical and psychological violence against detained members of the local population, prisoners of war, and political activists.
    The use of brutal interrogations, beatings, and the creation of torturous conditions of detention serves not only the purposes of inquiry but also the total psychological breaking of the society's will, paralyzing its capacity for organized resistance.
  uk: |-
    Агресори можуть застосовувати систематичне фізичне та психологічне насильство щодо затриманих представників місцевого населення, військовополонених і політичних активістів.
    Застосування жорстоких допитів, побиттів і створення катівських умов утримання слугує не лише цілям дізнання, а й тотальному психологічному зламу волі суспільства, паралізуючи його здатність до організованого опору.
  ru: |-
    Агрессоры могут применять систематическое физическое и психологическое насилие по отношению к задержанным представителям местного населения, военнопленным и политическим активистам.
    Применение жестоких допросов, избиений и создание пыточных условий содержания служит не только целям дознания, но и тотальному психологическому слому воли общества, парализуя его способность к организованному сопротивлению.
