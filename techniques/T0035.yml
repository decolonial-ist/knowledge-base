name:
  ru: Принудительная паспортизация
  en: Forced Passportization
  uk: Примусова паспортизація
contributors: []
description:
  ru: |-
    Агрессоры могут массово навязывать свое гражданство и выдавать документы государственного образца метрополии жителям оккупированных территорий.
    Принуждение коренного народа к получению новых паспортов под угрозой лишения базовых прав, медицинской помощи или имущества позволяет колонизатору искусственно интегрировать население в свое правовое поле, перевести его в статус собственных подданных и обосновать дальнейшее удержание региона «защитой своих граждан».
  en: |-
    Aggressors may mass-impose their citizenship and issue the metropole's state-standard documents to residents of occupied territories.
    Coercing the Indigenous people into obtaining new passports under threat of losing basic rights, medical care, or property allows the colonizer to artificially integrate the population into its legal framework, convert them into the status of its own subjects, and justify the continued retention of the region as the "protection of its citizens."
  uk: |-
    Агресори можуть масово нав'язувати своє громадянство та видавати документи державного зразка метрополії жителям окупованих територій.
    Примушування корінного народу до отримання нових паспортів під загрозою позбавлення базових прав, медичної допомоги чи майна дає колонізаторові змогу штучно інтегрувати населення у своє правове поле, перевести його в статус власних підданих та обґрунтувати подальше утримання регіону «захистом своїх громадян».
