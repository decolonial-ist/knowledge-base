name:
  ru: Культивирование логики превосходства
  en: Cultivation of a Logic of Superiority
  uk: Культивування логіки вищості
contributors: []
description:
  ru: |-
    Агрессоры могут проводить системную идеологическую обработку собственного населения, формируя культ исключительности и мессианства.
    В рамках такой парадигмы культура колонизатора провозглашается высокой и несущей прогресс, в то время как культура колонизируемых народов целенаправленно маргинализируется, представляется отсталой, вторичной или вовсе не имеющей права на самостоятельное существование.
    Это служит базовым идеологическим оправданием для последующего доминирования.
  en: |-
    Aggressors may conduct systematic ideological indoctrination of their own population, cultivating a cult of exceptionalism and messianism.
    Within this paradigm, the colonizer's culture is proclaimed superior and a bearer of progress, while the culture of the colonized peoples is deliberately marginalized and portrayed as backward, derivative, or altogether lacking the right to independent existence.
    This serves as the basic ideological justification for subsequent domination.
  uk: |-
    Агресори можуть проводити системну ідеологічну обробку власного населення, формуючи культ винятковості та месіанства.
    У межах такої парадигми культура колонізатора проголошується високою та такою, що несе прогрес, тоді як культура колонізованих народів цілеспрямовано маргіналізується, подається як відстала, вторинна або взагалі така, що не має права на самостійне існування.
    Це слугує базовим ідеологічним виправданням для подальшого домінування.
