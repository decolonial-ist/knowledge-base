name:
  en: Implantation of Officials and Military Personnel
  uk: Підселення чиновників і військових
  ru: Подселение чиновников и военных
contributors: []
description:
  en: |-
    Aggressors may carry out the mass relocation of their administrative and military apparatus to colonized territories.
    Stationing regular military garrisons and appointing loyal officials from the metropole allows the colonizer to establish strict physical and bureaucratic oversight, preemptively suppress nascent resistance on the ground, and integrate the region into its own state system, displacing local institutions of self-governance.
  uk: |-
    Агресори можуть здійснювати масове переміщення свого адміністративного та військового апарату на колонізовані території.
    Розміщення регулярних військових гарнізонів і призначення лояльних чиновників з метрополії дозволяє колонізатору встановити жорсткий фізичний і бюрократичний нагляд, превентивно придушити паростки опору на місцях та інтегрувати регіон у свою державну систему, витісняючи місцеві інституції самоврядування.
  ru: |-
    Агрессоры могут осуществлять массовое перемещение своего административного и военного аппарата на колонизируемые территории.
    Размещение регулярных военных гарнизонов и назначение лояльных чиновников из метрополии позволяет колонизатору установить жесткий физический и бюрократический надзор, превентивно подавить ростки сопротивления на местах и интегрировать регион в свою государственную систему, вытесняя местные институты самоуправления.
