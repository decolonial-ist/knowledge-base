name:
  en: ''
  uk: ''
  ru: Нападения под чужим флагом
contributors: []
description:
  en: ''
  uk: ''
  ru: |-
    В рамках присвоения статуса жертвы агрессоры могут устраивать или допускать нападения на собственных граждан и приписывать их колонизируемому народу: закладывать взрывчатку руками спецслужб, выдавать пойманных на месте своих сотрудников за учения, называть виновных до расследования.
    Историки называют это действиями под чужим флагом и инсценированным поводом к войне.
    Кровь своих граждан даёт колонизатору повод к вторжению, который не оспаривают ни метрополия, ни другие государства.
