name:
  ru: Истребление по признаку идентичности
  en: Extermination Based on Identity
  uk: Винищення за ознакою ідентичності
contributors: []
description:
  ru: |-
    Агрессоры могут осуществлять целенаправленное физическое уничтожение людей исключительно на основании их национальной, культурной или политической принадлежности.
    Массовые репрессии, внесудебные казни интеллигенции и системный террор преследуют двойную цель: немедленно подавить активное сопротивление и превентивно ликвидировать социальную базу, способную сохранять и передавать национальный код в будущем.
  en: |-
    Aggressors may carry out the targeted physical extermination of people solely on the basis of their national, cultural, or political affiliation.
    Mass repressions, extrajudicial executions of the intelligentsia, and systematic terror pursue a dual goal: to immediately suppress active resistance and to preemptively eliminate the social base capable of preserving and transmitting the national code into the future.
  uk: |-
    Агресори можуть здійснювати цілеспрямоване фізичне знищення людей виключно на підставі їхньої національної, культурної чи політичної належності.
    Масові репресії, позасудові страти інтелігенції та системний терор мають подвійну мету: негайно придушити активний опір і превентивно ліквідувати соціальну базу, здатну зберігати та передавати національний код у майбутньому.
