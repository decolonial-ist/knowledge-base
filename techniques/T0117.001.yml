name:
  en: Migratory Replacement
  uk: Міграційне заміщення
  ru: Миграционное замещение
contributors: []
description:
  en: |-
    As part of demographic assimilation, aggressors may carry out large-scale, state-sponsored resettlement of loyal citizens from the metropole to the territories of the colonized society, while simultaneously encouraging or coercing the local population to emigrate.
    Artificially populating the region with colonists changes the electoral, cultural, and linguistic balance, providing a reliable base of social support for the occupation regime.
  uk: |-
    У межах демографічної асиміляції агресори можуть здійснювати масштабне, спонсороване державою переселення лояльних громадян із метрополії на території колонізованого суспільства, водночас стимулюючи або примушуючи місцеве населення до еміграції.
    Штучне заселення регіону колоністами змінює електоральний, культурний і мовний баланс, забезпечуючи надійну базу соціальної підтримки для окупаційного режиму.
  ru: |-
    В рамках демографической ассимиляции агрессоры могут осуществлять масштабное, спонсируемое государством переселение лояльных граждан из метрополии на территории колонизируемого общества, одновременно стимулируя или принуждая местное население к эмиграции.
    Искусственное заселение региона колонистами меняет электоральный, культурный и лингвистический баланс, обеспечивая надежную базу социальной поддержки для оккупационного режима.
