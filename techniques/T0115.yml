name:
  en: Cultural Assimilation
  uk: Культурна асиміляція
  ru: Культурная ассимиляция
contributors: []
description:
  en: |-
    Aggressors may apply comprehensive measures to displace and replace the unique cultural codes of the Indigenous people with the standards and traditions of the metropole.
    The artificial dissolution of the local culture within the aggressor's dominant culture makes it possible to sever historical continuity, deprive the colonized society of its national identity, and ensure its irreversible mental merger with the colonizing state.
  uk: |-
    Агресори можуть застосовувати комплексні заходи з витіснення та заміщення унікальних культурних кодів корінного народу стандартами і традиціями метрополії.
    Штучне розчинення локальної культури в домінантній культурі агресора дає змогу розірвати історичну спадкоємність, позбавити колонізоване суспільство його національної ідентичності та забезпечити його незворотне ментальне злиття з державою-колонізатором.
  ru: |-
    Агрессоры могут применять комплексные меры по вытеснению и замещению уникальных культурных кодов коренного народа стандартами и традициями метрополии.
    Искусственное растворение локальной культуры в доминирующей культуре агрессора позволяет разорвать историческую преемственность, лишить колонизируемое общество его национальной идентичности и обеспечить его необратимое ментальное слияние с государством-колонизатором.
