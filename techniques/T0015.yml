name:
  en: Bribery of Elites
  uk: Підкуп еліт
  ru: Подкуп элит
contributors: []
description:
  en: |-
    Aggressors may use systemic corruption and the distribution of privileges, titles, and large-scale financial resources to win over members of the target state's top leadership, intelligentsia, and military ranks.
    This technique permeates every stage of colonization: from preparation for seizure (recruiting agents of influence) to the seizure of governance (sabotage during defense) and institutional consolidation (buying the loyalty of a puppet government).
    By encouraging the personal ambitions of the elite at the expense of national interests, the colonizer destroys the local population's capacity for organized resistance.
  uk: |-
    Агресори можуть використовувати системну корупцію, роздачу привілеїв, титулів і масштабних фінансових коштів для переманювання на свій бік представників вищого керівництва, інтелігенції та військових чинів цільової держави.
    Ця техніка пронизує всі етапи колонізації: від підготовки до захоплення (вербування агентури впливу) до захоплення управління (саботаж під час оборони) та інституційного закріплення (купівля лояльності маріонеткового уряду).
    Заохочуючи особисті амбіції еліти на шкоду національним інтересам, колонізатор руйнує здатність місцевого населення до організованого опору.
  ru: |-
    Агрессоры могут использовать системную коррупцию, раздачу привилегий, титулов и масштабных финансовых средств для переманивания на свою сторону представителей высшего руководства, интеллигенции и военных чинов целевого государства.
    Эта техника пронизывает все этапы колонизации: от подготовки к захвату (вербовка агентуры влияния) до захвата управления (саботаж при обороне) и институционального закрепления (покупка лояльности марионеточного правительства).
    Поощряя личные амбиции элиты в ущерб национальным интересам, колонизатор разрушает способность местного населения к организованному сопротивлению.
