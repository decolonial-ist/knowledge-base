name:
  ru: Финансовая дискриминация педагогов
  en: Financial Discrimination Against Teachers
  uk: Фінансова дискримінація педагогів
contributors: []
description:
  ru: |-
    В рамках образовательной ассимиляции агрессоры могут устанавливать неравные условия оплаты труда, поощряя учителей, преподающих на языке метрополии, и искусственно занижая ставки или лишая надбавок преподавателей местного языка.
    Создание финансового неравенства выдавливает национальные кадры из системы образования и экономически принуждает школы переходить на стандарты колонизатора.
  en: |-
    As part of educational assimilation, aggressors may establish unequal pay conditions, rewarding teachers who teach in the language of the metropole while artificially lowering the pay rates of, or withholding bonuses from, teachers of the local language.
    The creation of financial inequality squeezes national cadres out of the education system and economically coerces schools into adopting the colonizer's standards.
  uk: |-
    У межах освітньої асиміляції агресори можуть установлювати нерівні умови оплати праці, заохочуючи вчителів, які викладають мовою метрополії, і штучно занижуючи ставки або позбавляючи надбавок викладачів місцевої мови.
    Створення фінансової нерівності видавлює національні кадри із системи освіти та економічно примушує школи переходити на стандарти колонізатора.
