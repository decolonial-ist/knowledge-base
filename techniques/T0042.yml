name:
  ru: Переписывание школьных программ
  en: Rewriting of School Curricula
  uk: Переписування шкільних програм
contributors: []
description:
  ru: |-
    Агрессоры могут осуществлять системную замену образовательных стандартов на оккупированных территориях, принудительно внедряя учебные материалы и методички, созданные в метрополии.
    Навязывание новых программ по истории, литературе и языку позволяет колонизатору воспитывать следующие поколения местного населения в парадигме безусловной лояльности к государству-агрессору, стирая их национальную память и формируя искусственную идентичность.
  en: |-
    Aggressors may carry out the systematic replacement of educational standards in occupied territories, forcibly introducing textbooks and teaching materials produced in the metropole.
    Imposing new curricula in history, literature, and language allows the colonizer to raise successive generations of the local population in a paradigm of unconditional loyalty to the aggressor state, erasing their national memory and forming an artificial identity.
  uk: |-
    Агресори можуть здійснювати системну заміну освітніх стандартів на окупованих територіях, примусово впроваджуючи навчальні матеріали та методички, створені в метрополії.
    Нав'язування нових програм з історії, літератури та мови дозволяє колонізатору виховувати наступні покоління місцевого населення в парадигмі безумовної лояльності до держави-агресора, стираючи їхню національну пам'ять і формуючи штучну ідентичність.
