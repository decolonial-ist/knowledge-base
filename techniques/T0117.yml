name:
  en: Demographic Assimilation
  uk: Демографічна асиміляція
  ru: Демографическая ассимиляция
contributors: []
description:
  en: |-
    Aggressors may deliberately alter the demographic and ethnic composition of a seized region in order to dissolve the indigenous people in a mass of settlers.
    Artificial transformation of the population structure allows the colonizer to marginalize the colonized society on its own land, strip it of its status as the demographic majority, and suppress its potential for national revival in future generations.
  uk: |-
    Агресори можуть цілеспрямовано змінювати демографічний та етнічний склад захопленого регіону для розчинення корінного народу в масі переселенців.
    Штучна трансформація структури населення дозволяє колонізатору маргіналізувати колонізоване суспільство на його власній землі, позбавити його статусу демографічної більшості та придушити потенціал до національного відродження в майбутніх поколіннях.
  ru: |-
    Агрессоры могут целенаправленно изменять демографический и этнический состав захваченного региона для растворения коренного народа в массе переселенцев.
    Искусственная трансформация структуры населения позволяет колонизатору маргинализировать колонизируемое общество на его собственной земле, лишить его статуса демографического большинства и подавить потенциал к национальному возрождению в будущих поколениях.
