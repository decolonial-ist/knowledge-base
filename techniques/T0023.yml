name:
  en: Filtration Camp System
  uk: Система фільтраційних таборів
  ru: Система фильтрационных лагерей
contributors: []
description:
  en: |-
    Aggressors may create a network of official or shadow temporary detention facilities for the mass screening, interrogation, and sorting of civilians.
    Isolating a significant part of the local population in closed zones not regulated by law allows the colonizer to identify and physically eliminate potential participants in resistance, as well as to carry out total psychological terror against the colonized society.
  uk: |-
    Агресори можуть створювати мережу офіційних або тіньових пунктів тимчасового утримання для масової перевірки, допитів і сортування цивільних осіб.
    Ізоляція значної частини місцевого населення в закритих зонах, не регламентованих правом, дає колонізаторові змогу виявляти та фізично усувати потенційних учасників опору, а також здійснювати тотальний психологічний терор проти колонізованого суспільства.
  ru: |-
    Агрессоры могут создавать сеть официальных или теневых пунктов временного содержания для массовой проверки, допросов и сортировки гражданских лиц.
    Изоляция значительной части местного населения в закрытых зонах, не регламентированных правом, позволяет колонизатору выявлять и физически устранять потенциальных участников сопротивления, а также осуществлять тотальный психологический террор против колонизируемого общества.
