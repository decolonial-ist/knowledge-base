name:
  ru: Навязывание своей картины реальности
  en: Imposition of Its Own Picture of Reality
  uk: Нав'язування власної картини реальності
contributors: []
description:
  ru: |-
    Агрессоры могут подменять факты о колонизации своим рассказом: отрицать или искажать собственные действия, выдавать захват за благо для захваченных.
    Колонизатор навязывает свою версию пропагандой, чтобы оправдать своё господство в глазах метрополии, коренного народа и всего мира.
  en: |-
    Aggressors may replace the facts of colonization with their own story: deny or distort their own actions, present the conquest as a benefit to the conquered.
    The colonizer imposes its version through propaganda to justify its domination in the eyes of the metropole, the Indigenous people and the whole world.
  uk: |-
    Агресори можуть підміняти факти про колонізацію власною розповіддю: заперечувати або спотворювати власні дії, видавати захоплення за благо для захоплених.
    Колонізатор нав'язує свою версію пропагандою, щоб виправдати своє панування в очах метрополії, корінного народу й усього світу.
