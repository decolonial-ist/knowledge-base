name:
  en: Rewriting of History
  uk: Переписування історії
  ru: Переписывание истории
contributors: []
description:
  en: |-
    Aggressors may initiate the creation and mass dissemination of artificial historical concepts designed to substantiate their claim to foreign territories.
    Constructing a new historical canon, in which facts are distorted and the chronology of events is tailored to the interests of the metropole, allows the aggressor to retroactively legalize the occupation, convincing both its own population and the local one of the historical inevitability and legality of the absorption.
  uk: |-
    Агресори можуть ініціювати створення та масштабне поширення штучних історичних концепцій, покликаних обґрунтувати їхнє право на чужі території.
    Конструювання нового історичного канону, в якому факти викривляються, а хронологія подій підганяється під інтереси метрополії, дозволяє агресору легалізувати окупацію заднім числом, переконуючи як власне, так і місцеве населення в історичній неминучості та законності поглинання.
  ru: |-
    Агрессоры могут инициировать создание и масштабное распространение искусственных исторических концепций, призванных обосновать их право на чужие территории.
    Конструирование нового исторического канона, в котором факты искажаются, а хронология событий подгоняется под интересы метрополии, позволяет агрессору легализовать оккупацию задним числом, убеждая как собственное, так и местное население в исторической неизбежности и законности поглощения.
