name:
  ru: Формирование идеологии великодержавного шовинизма (1864–1876)
  en: Formation of the Ideology of Great-Power Chauvinism (1864–1876)
  uk: Формування ідеології великодержавного шовінізму (1864–1876)
description:
  ru: |-
    На фоне масштабных территориальных захватов империя концептуализирует свое превосходство над колонизированными народами.
    Идеолог Катков формулирует: «признать какой-либо элемент в качестве особой нации не значит предоставить ему свободу, но дать ему власть, сообщить ему обязательную силу.
    В признании нации решается вопрос о власти, о правительстве, о государстве»(Citation: 208) – признание украинцев нацией исключалось как вопрос власти.
  en: |-
    Against the backdrop of large-scale territorial conquests, the empire conceptualizes its superiority over the colonized peoples.
    The ideologue Katkov formulates: "to recognize some element as a distinct nation does not mean granting it freedom, but giving it power, endowing it with binding force.
    In the recognition of a nation the question of power, of government, of the state is decided"(Citation: 208) – the recognition of Ukrainians as a nation was ruled out as a question of power.
  uk: |-
    На тлі масштабних територіальних загарбань імперія концептуалізує свою вищість над колонізованими народами.
    Ідеолог Катков формулює: «визнати якийсь елемент як особливу націю не означає надати йому свободу, але дати йому владу, надати йому обов'язкової сили.
    У визнанні нації вирішується питання про владу, про уряд, про державу»(Citation: 208) – визнання українців нацією виключалося як питання влади.
