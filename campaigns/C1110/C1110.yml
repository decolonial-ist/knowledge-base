name:
  en: Founding and Fortification of the Terek Town (1588–1623)
  uk: Закладення та зміцнення Терського міста (1588–1623)
  ru: Закладка и укрепление Терского города (1588–1623)
description:
  en: |-
    The occupation administration of the Tsardom of Muscovy established a new military base at the mouth of the Terek River to control the adjacent territories, including the lands of the Nokhchi.
    Historian E. N. Kusheva writes that the base "was built in 1588–1589... by Mikhailo Burtsev and Kelar Protasyev... the main force of its garrison consisted of streltsy armed with 'fire combat' — pishchal firearms"(Citation: 83).
    The base's infrastructure was systematically expanded: historians A. S. Kulikov and V. A. Runov note that "by the beginning of the 17th century... the Terek fortified town had turned into a rather powerful fortress.
    Its artillery numbered 40 large guns, and its garrison — more than a thousand streltsy and Cossacks"(Citation: 65).
    To hold its positions, the administration brought in additional military personnel: historian I. Kh.
    Tkhamokova notes that "in 1589, soon after the town was built, 800 streltsy and Cossacks were to be sent there from Astrakhan, but the Astrakhan voivode sent only 600 men"(Citation: 85).
    A permanent military contingent on state provision was entrenched in this territory: historian I. Kh.
    Tkhamokova cites a tsar's decree according to which "in 1623, 'upon the petition of the Terek and Greben Cossacks,' a tsar's decree was sent to the Terek ordering the payment of salaries to 30 atamans and 470 rank-and-file Cossacks"(Citation: 85).
  uk: |-
    Окупаційна адміністрація Московського царства заснувала нову військову базу в гирлі річки Терек для контролю над прилеглими територіями, включно із землями Нохчі.
    Історикиня Е. Н. Кушева пише, що базу «ставили її у 1588–1589 рр...
    Михайло Бурцев і Келар Протасьєв... у його гарнізоні основну силу становили стрільці, озброєні „вогняним боєм", пищалями»(Citation: 83).
    Інфраструктура бази планомірно розширювалася: історики А. С. Куліков і В. А. Рунов зазначають, що «на початку XVII століття...
    Терське містечко перетворилося на доволі потужну фортецю.
    Її артилерія налічувала 40 великих гармат, а гарнізон — понад тисячу стрільців і Козаків»(Citation: 65).
    Для утримання позицій адміністрація підселяла додаткові військові кадри: історикиня І. Х. Тхамокова зазначає, що «1589 р., невдовзі після того, як місто було збудовано, туди мали прислати з Астрахані 800 стрільців і Козаків, але астраханський воєвода прислав лише 600 осіб»(Citation: 85).
    На цій території закріплювався постійний військовий контингент на державному утриманні: історикиня І. Х. Тхамокова цитує царський указ, згідно з яким «1623 р. „за чолобиттям терських і гребінських Козаків" на Терек було надіслано царський указ про видачу платні 30 отаманам і 470 рядовим Козакам»(Citation: 85).
  ru: |-
    Оккупационная администрация Московского Царства основала новую военную базу в устье реки Терек для контроля над прилегающими территориями, включая земли нохчи.
    Историк Е. Н. Кушева пишет, что базу «ставили ее в 1588-1589 гг...
    Михайло Бурцев и Келарь Протасьев... в его гарнизоне основную силу составляли стрельцы, вооруженные «огненным боем», пищалями»(Citation: 83).
    Инфраструктура базы планомерно расширялась: историки А. С. Куликов и В. А. Рунов отмечают, что «в начале XVII века...
    Терский городок превратился в достаточно мощную крепость.
    Ее артиллерия насчитывала 40 крупных орудий, а гарнизон – более тысячи стрельцов и казаков»(Citation: 65).
    Для удержания позиций администрация подселяла дополнительные военные кадры: историк И. Х. Тхамокова отмечает, что «в 1589 г., вскоре после того, как город был построен, туда должны были прислать из Астрахани 800 стрельцов и казаков, но астраханский воевода прислал только 600 человек»(Citation: 85).
    На этой территории закреплялся постоянный военный контингент на государственном обеспечении: историк И. Х. Тхамокова цитирует царский указ, согласно которому «в 1623 г. «по челобитью терских и гребенских казаков» на Терек был послан царский указ о выдаче жалованья 30 атаманам и 470 рядовым казакам»(Citation: 85).
