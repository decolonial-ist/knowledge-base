description:
  en: |-
    A permanent military contingent maintained at state expense was stationed in the territory: historian I. Kh.
    Tkhamokova quotes a tsar's decree according to which «in 1623, «upon the petition of the Terek and Greben Cossacks», a tsar's decree was sent to the Terek ordering the payment of salaries to 30 atamans and 470 rank-and-file Cossacks»(Citation: 85).
    New personnel were also sent in to hold the positions: historian I. Kh.
    Tkhamokova notes that «in 1589, soon after the town was built, 800 streltsy and Cossacks were to be sent there from Astrakhan, but the Astrakhan voivode sent only 600 men»(Citation: 85).
  uk: |-
    На території закріплювався постійний військовий контингент на державному утриманні: історик І. Х. Тхамокова цитує царський указ, згідно з яким «у 1623 р. «за чолобитною терських і гребінських козаків» на Терек було надіслано царський указ про видачу жалування 30 отаманам і 470 рядовим козакам»(Citation: 85).
    Для утримання позицій також надсилали нові кадри: історик І. Х. Тхамокова зазначає, що «у 1589 р., невдовзі після того, як місто було збудоване, туди мали прислати з Астрахані 800 стрільців і козаків, але астраханський воєвода прислав лише 600 осіб»(Citation: 85).
  ru: |-
    На территории закреплялся постоянный военный контингент на государственном обеспечении: историк И. Х. Тхамокова цитирует царский указ, согласно которому «в 1623 г. «по челобитью терских и гребенских казаков» на Терек был послан царский указ о выдаче жалованья 30 атаманам и 470 рядовым казакам»(Citation: 85).
    Для удержания позиций также присылались новые кадры: историк И. Х. Тхамокова отмечает, что «в 1589 г., вскоре после того, как город был построен, туда должны были прислать из Астрахани 800 стрельцов и казаков, но астраханский воевода прислал только 600 человек»(Citation: 85).
