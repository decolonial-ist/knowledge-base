description:
  en: 'The occupation administration systematically brought in regular troops to maintain the garrison: historians A. S. Kulikov and V. A. Runov note that in the early 17th century «the garrison numbered more than a thousand streltsy and Cossacks»(Citation: 65).'
  uk: 'Окупаційна адміністрація системно вводила регулярні війська для утримання гарнізону: історики А. С. Куліков і В. А. Рунов зазначають, що на початку XVII століття «гарнізон – понад тисяча стрільців і козаків»(Citation: 65).'
  ru: 'Оккупационная администрация системно вводила регулярные войска для удержания гарнизона: историки А. С. Куликов и В. А. Рунов отмечают, что в начале XVII века «гарнизон – более тысячи стрельцов и казаков»(Citation: 65).'
