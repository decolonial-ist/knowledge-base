description:
  ru: |-
    Подготовка к ликвидации Гетманщины через губернскую реформу, куда искусственно вписывались казацкие города.
    Москва планировала «городи Малороссийские в свою область отбирати»(Citation: 4)(Citation: 3).
  en: |-
    Preparation for the liquidation of the Hetmanate through the gubernia reform, into which Cossack towns were artificially inscribed.
    Moscow planned "to take the Little Russian towns into its own domain"(Citation: 4)(Citation: 3).
  uk: |-
    Підготовка до ліквідації Гетьманщини через губернську реформу, до якої штучно вписувалися козацькі міста.
    Москва планувала «городи Малоросійські у свою область відбирати»(Citation: 4)(Citation: 3).
