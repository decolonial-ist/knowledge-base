description:
  en: 'Preparation for dismantling the autonomy during the reforms of 1707: by Orlyk''s account, the Cossack starshyna expected the empire to be preparing "to turn the Cossacks into a regular army… to break the rights and liberties of the Host"(Citation: 4)(Citation: 3).'
  uk: 'Підготовка демонтажу автономії під час реформ 1707 року: за свідченням Орлика, козацька старшина очікувала, що імперія готується «Козаків у регулярне військо перемінити… права і вольності військові поламати»(Citation: 4)(Citation: 3).'
  ru: 'Подготовка демонтажа автономии в ходе реформ 1707 года: по свидетельству Орлика, казацкая старшина ожидала, что империя готовится «Козаков в регулярное войско переменити… права и вольности войсковые поломати»(Citation: 4)(Citation: 3).'
