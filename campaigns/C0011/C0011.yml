name:
  ru: Интеграционные реформы Петра I и Северная война (1700–1708)
  en: Integration Reforms of Peter I and the Great Northern War (1700–1708)
  uk: Інтеграційні реформи Петра I та Північна війна (1700–1708)
description:
  ru: |-
    Системная эксплуатация потенциала Гетманщины в тяжелой войне и одновременный запуск административного поглощения (реформы 1707 года).
    Отправляемые на дальние фронты казаки были «целорочною военною службою утружденный, знужнелыи, опешалыи, изнищалыи».
    Планы перекройки автономии Орлик передавал со слов старшины: империя готовилась «Козаков в регулярное войско переменити... права и вольности войсковые поломати» и «городи Малороссийские в свою область отбирати»(Citation: 4).
  en: |-
    Systematic exploitation of the Hetmanate's potential in a grueling war combined with the simultaneous launch of administrative absorption (the reforms of 1707).
    The Cossacks dispatched to distant fronts were «wearied, destitute, left horseless, and ruined by year-round military service».
    Orlyk relayed the starshyna's account of the plans to recut the autonomy: the empire was preparing «to convert the Cossacks into a regular army... to break the military rights and liberties» and «to take the Little Russian towns into its own domain»(Citation: 4).
  uk: |-
    Системна експлуатація потенціалу Гетьманщини у важкій війні та одночасний запуск адміністративного поглинання (реформи 1707 року).
    Козаки, яких відправляли на далекі фронти, були «цілорічною військовою службою утруджені, знужнілі, опішалі, знищені».
    Плани перекроювання автономії Орлик передавав зі слів старшини: імперія готувалася «Козаків у регулярне військо перемінити... права і вольності військові поламати» та «городи малоросійські у своє володіння відбирати»(Citation: 4).
