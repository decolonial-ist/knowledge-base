description:
  ru: |-
    Отправка казацких полков на дальние театры боевых действий (страны Балтии, Польша), что вело к их истощению.
    Войска были «целорочною военною службою утружденный, знужнелыи, опешалыи, изнищалыи»(Citation: 4)(Citation: 3).
  en: |-
    The dispatch of Cossack regiments to distant theaters of war (the Baltic lands, Poland), which led to their exhaustion.
    The troops were "wearied by year-round military service, impoverished, dismounted, destitute"(Citation: 4)(Citation: 3).
  uk: |-
    Відправлення козацьких полків на далекі театри бойових дій (країни Балтії, Польща), що вело до їхнього виснаження.
    Війська були «цілорічною військовою службою утруджений, знужнілий, опішалий, знищілий»(Citation: 4)(Citation: 3).
