description:
  ru: 'Удушение экономики автономии через систему военного постоя регулярной армии: «А когда на квартерах зимовых компанія и сердюки стоят... 24 человека людей посполитых едного компанійца без всяих вымыслов кормят»(Citation: 4)(Citation: 3).'
  en: 'The strangulation of the autonomy''s economy through the system of billeting the regular army: "And when the kompaniytsi and serdiuks stand in winter quarters... 24 commoners feed a single kompaniyets without any excuses"(Citation: 4)(Citation: 3).'
  uk: 'Удушення економіки автономії через систему військового постою регулярної армії: «А коли на зимових квартирах компанія і сердюки стоять... 24 особи посполитих одного компанійця без жодних вимислів годують»(Citation: 4)(Citation: 3).'
