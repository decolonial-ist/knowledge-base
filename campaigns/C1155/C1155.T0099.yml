description:
  ru: |-
    В августе - сентябре 1832 корпусный командир Розен принуждал сёла Чечни и Ичкерии к выдаче аманатов под прямой угрозой истребления.
    Розен доносил военному министру Чернышёву о селе Мискит: «когда им объявлено было, что в случае малейшего сопротивления вся деревня, хлеба и сено будут истреблены, то они немедленно представили аманатов»(Citation: 105).
    Итог Розен подвёл там же: заложническим подчинением охвачено «Чеченских и Ичкеринских селений более 80-ти»(Citation: 105).
  en: |-
    In August–September 1832, corps commander Rosen coerced the villages of Chechnya and Ichkeria into handing over amanats (hostages) under direct threat of extermination.
    Rosen reported to Minister of War Chernyshev regarding the village of Miskit: “when it was announced to them that in the event of the slightest resistance the entire village, the grain and the hay would be exterminated, they immediately presented amanats”(Citation: 105).
    Rosen summed up the result in the same report: subjugation through hostage-taking covered “more than 80 Chechen and Ichkerian villages”(Citation: 105).
  uk: |-
    У серпні – вересні 1832 року корпусний командир Розен примушував села Чечні та Ічкерії до видачі аманатів (заручників) під прямою загрозою знищення.
    Розен доносив військовому міністрові Чернишову про село Міскіт: «коли їм було оголошено, що в разі найменшого опору все село, хліб і сіно будуть знищені, вони негайно представили аманатів»(Citation: 105).
    Підсумок Розен підбив там само: заручницьким підкоренням охоплено «Чеченських та Ічкеринських селищ понад 80»(Citation: 105).
