description:
  ru: |-
    С 22 августа по конец сентября 1832 корпусный командир Розен провёл поход по Чечне и Ичкерии (горной юго-восточной части чеченской земли) в отместку народу за восстание и применяя единую схему: селение, не выполнившее условий, истреблялось.
    Розен признал схему в рапорте военному министру Чернышёву: селения, «не могши согласиться между собою насчёт освобождения пленных наших, наказаны истреблением жилищ и пашень»(Citation: 105).
    Историк Д. А. Хожаев писал: «Летом и осенью 1832 года войска генерала Розена прошлись по Чечне, оставляя за собой смерть и разрушение»(Citation: 95).
  en: |-
    From August 22 to the end of September 1832, corps commander Rosen conducted a campaign through Chechnya and Ichkeria (the mountainous southeastern part of the Chechen land) in retribution against the people for the uprising, applying a uniform scheme: a village that failed to meet the conditions was exterminated.
    Rosen acknowledged the scheme in a report to Minister of War Chernyshev: the villages, “being unable to agree among themselves on the release of our prisoners, have been punished by the destruction of dwellings and plowed fields”(Citation: 105).
    Historian D. A. Khozhaev wrote: “In the summer and autumn of 1832, the troops of General Rosen swept through Chechnya, leaving death and destruction in their wake”(Citation: 95).
  uk: |-
    З 22 серпня до кінця вересня 1832 року корпусний командир Розен провів похід Чечнею та Ічкерією (гірською південно-східною частиною чеченської землі) як помсту народові за повстання, застосовуючи єдину схему: селище, що не виконало умов, знищували.
    Розен визнав цю схему в рапорті військовому міністрові Чернишову: селища, «не змігши погодитися між собою щодо звільнення наших полонених, покарані знищенням осель і ріллі»(Citation: 105).
    Історик Д. А. Хожаєв писав: «Улітку та восени 1832 року війська генерала Розена пройшлися Чечнею, залишаючи за собою смерть і руйнування»(Citation: 95).
