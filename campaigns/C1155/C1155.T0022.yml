description:
  ru: |-
    23 августа 1832 при штурме Герменчука войска корпусного командира Розена сожгли заживо около 60 окружённых защитников села во главе с муллой Абдурахманом, отказавшихся сдаться.
    Розен доносил военному министру Чернышёву: группа «в числе около 60-ти чел. ... предводительствуемая... муллою Абдур-Рахманом, была отрезана и окружена нами в одном большом доме»(Citation: 105).
    Имперский историк Волконский, писавший по донесениям Розена, признаёт способ расправы: «генерал-маиор Вольховский приказал набросать в трубы горящие дрова и сено.
    Это подействовало... большая же часть с муллою Абдурахманом погибла в пламени, продолжая петь стихи корана»(Citation: 116).
    Демонстративное сожжение людей заживо служило устрашению всей Чечни; Волконский признаёт расчёт: разгром Герменчука «должен был самым удручающим образом подействовать на чеченцев»(Citation: 116).
  en: |-
    On August 23, 1832, during the storming of Germenchuk, the troops of corps commander Rosen burned alive about 60 encircled defenders of the village, led by Mullah Abdurakhman, who had refused to surrender.
    Rosen reported to Minister of War Chernyshev: a group “numbering about 60 men ... led by ...
    Mullah Abdur-Rakhman, was cut off and surrounded by us in one large house”(Citation: 105).
    The imperial historian Volkonsky, writing on the basis of Rosen’s dispatches, acknowledges the method of the massacre: “Major General Volkhovsky ordered burning firewood and hay to be thrown into the chimneys.
    This had its effect... while the greater part, together with Mullah Abdurakhman, perished in the flames, continuing to chant verses of the Quran”(Citation: 116).
    The demonstrative burning of people alive served to terrorize all of Chechnya; Volkonsky acknowledges the calculation: the destruction of Germenchuk “was bound to have the most crushing effect on the Chechens”(Citation: 116).
  uk: |-
    23 серпня 1832 року під час штурму Герменчука війська корпусного командира Розена спалили живцем близько 60 оточених захисників села на чолі з муллою Абдурахманом, які відмовилися здатися.
    Розен доносив військовому міністрові Чернишову: група «числом близько 60 чол. ... очолювана... муллою Абдур-Рахманом, була відрізана й оточена нами в одному великому будинку»(Citation: 105).
    Імперський історик Волконський, який писав за донесеннями Розена, визнає спосіб розправи: «генерал-майор Вольховський наказав накидати в димарі палаючі дрова та сіно.
    Це подіяло... більша ж частина з муллою Абдурахманом загинула в полум’ї, продовжуючи співати вірші корану»(Citation: 116).
    Демонстративне спалення людей живцем слугувало залякуванню всієї Чечні; Волконський визнає розрахунок: розгром Герменчука «мав найгнітючішим чином подіяти на Чеченців»(Citation: 116).
