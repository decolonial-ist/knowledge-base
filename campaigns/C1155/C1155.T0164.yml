description:
  ru: |-
    В походе августа - сентября 1832 войска корпусного командира Розена присваивали имущество и скот жителей разоряемых сёл.
    Имперский историк Волконский писал: имущество 50 семейств, укрывшихся в лесу близ Маиртупа, «досталось в добычу отряду», а у Центороя «отбито 6 лошадей и 50 штук рогатого скота»(Citation: 116).
    Розен доносил военному министру Чернышёву, что 15 сентября у села Дунген-юрт кавалерия «отбила 140 баранов и 9 штук рогатого скота»(Citation: 105).
  en: |-
    In the campaign of August - September 1832 the troops of corps commander Rosen appropriated the property and livestock of the residents of the villages being devastated.
    The imperial historian Volkonsky wrote: the property of 50 families who had taken refuge in the forest near Mairtup "fell as booty to the detachment", and near Tsentoroy "6 horses and 50 head of cattle were seized"(Citation: 116).
    Rosen reported to Minister of War Chernyshev that on September 15, near the village of Dungen-yurt, the cavalry "seized 140 sheep and 9 head of cattle"(Citation: 105).
  uk: |-
    У поході серпня - вересня 1832 року війська корпусного командира Розена привласнювали майно та худобу жителів розорюваних сіл.
    Імперський історик Волконський писав: майно 50 родин, що сховалися в лісі поблизу Маїртупа, «дісталося загонові як здобич», а біля Центороя «відбито 6 коней і 50 голів рогатої худоби»(Citation: 116).
    Розен доносив військовому міністрові Чернишову, що 15 вересня біля села Дунген-юрт кавалерія «відбила 140 баранів і 9 голів рогатої худоби»(Citation: 105).
