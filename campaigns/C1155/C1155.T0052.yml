description:
  ru: 'По итогам похода августа - сентября 1832 войска корпусного командира Розена взыскали с чеченских сёл подати и штрафы деньгами и скотом: Розен доносил военному министру Чернышёву, что всего за поход «подати и штрафа деньгами и скотом уплачено... около 5-ти т. р. с. [пяти тысяч рублей серебром]»(Citation: 105).'
  en: 'Following the campaign of August - September 1832, the troops of corps commander Rosen exacted tribute and fines in money and livestock from the Chechen villages: Rosen reported to Minister of War Chernyshev that in total over the campaign "tribute and fines in money and livestock have been paid... about 5 th. r. s. [five thousand rubles in silver]"(Citation: 105).'
  uk: 'За підсумками походу серпня - вересня 1832 року війська корпусного командира Розена стягнули з чеченських сіл податі та штрафи грошима й худобою: Розен доносив військовому міністрові Чернишову, що загалом за похід «податі та штрафу грошима й худобою сплачено... близько 5-ти т. р. с. [п’яти тисяч рублів сріблом]»(Citation: 105).'
