name:
  en: Extermination of 61 settlements of lowland Chechnya and mountainous Ichkeria by Rosen's troops, burning alive of the defenders of Germenchuk, and extortion of hostages from 80 villages (1832)
  uk: Винищення 61 селища рівнинної Чечні та гірської Ічкерії військами Розена, спалення живцем захисників Герменчука та вимагання заручників від 80 сіл (1832)
  ru: Истребление 61 селения равнинной Чечни и горной Ичкерии войсками Розена, сожжение заживо защитников Герменчука и вымогание заложников от 80 сёл (1832)
description:
  en: |-
    In August 1832, corps commander Rosen led a ten-thousand-strong detachment on a campaign through Chechnya and Ichkeria — the mountainous southeastern part of Chechen land, into which imperial troops had never before penetrated.
    The historian D. A. Khozhaev wrote: "Rosen's ten-thousand-strong tsarist detachment invaded mountainous Ingushetia and Chechnya, ablaze with the fire of a people's war of liberation.
    Despite the steadfast resistance of the inhabitants of mountainous Chechnya, who courageously defended every inch of their land, the tsarist troops destroyed several dozen auls and hamlets"(Citation: 95).
    On August 22, after crossing the Argun River, the villages of Belgatoy and Dzhan-yurt were annihilated.
    On August 23, Germenchuk — the richest village of Chechnya, numbering 600 households — was taken by storm.
    Rosen reported to Minister of War Chernyshev: "more than 100 bodies were left by them in the village itself," while a group "numbering about 60 men, for the most part people sent by Kazi-Mulla to hearten the inhabitants of Germenchuk," led by Mullah Abdurakhman, "was cut off and surrounded by us in one large house"(Citation: 105).
    The surrounded men refused to surrender and, on the order of General Volkhovsky, were burned alive.
    The imperial historian Volkonsky, writing from Rosen's dispatches, admits: "Major General Volkhovsky ordered burning firewood and hay to be thrown into the chimneys.
    This had its effect... but the greater part, together with Mullah Abdurakhman, perished in the flames, continuing to sing verses of the Quran"(Citation: 116).
    For two days "the troops annihilated the houses of the village of Germenchuk"; on August 26, Shali was destroyed "with the exception of 11 households that had paid the fine and the tribute"(Citation: 116).
    Rosen himself acknowledged the pattern of the campaign: the villages, "having been unable to agree among themselves on the release of our prisoners, were punished by the annihilation of their dwellings and plowlands, for which purpose, on the 27th and 28th of this past August, Colonel Shumsky was dispatched...
    He annihilated Alkhan-yurt, Sala-yurt, Katar-yurt, Lyalsin-yurt, Nazari-yurt, Uzden-yurt, Uruzbey-yurt, and Khyzin-Erzo-yurt"(Citation: 105).
    Further annihilated were Anzeli-yurt and Chingaroy-yurt, the crops and dwellings of Avtury, Said-yurt, the plowlands and houses of Geldigen, Anto-yurt, Askhor-yurt, Taba-yurt, and Kudish-yurt; Mairtup was burned, and in Ichkeria — Shoni, Tsentoroy, Belgatoy, the hamlet of Khamer, Ali-yurt, Bey-Bulat-yurt, Bachin-yurt, Khelboyn-yurt; Benoy was burned(Citation: 116)(Citation: 105)(Citation: 95).
    Rosen summed up the results in his report to Chernyshev of September 27, 1832: "In all, up to the present time, more than 80 Chechen and Ichkerian villages have submitted, a quarter of which had never been in dependence on us; 30 of our prisoners, men and women, have been returned; tribute and fines in money and livestock have been paid... about 5 th. r. s. [five thousand rubles in silver]. 61 unsubmitted villages have been annihilated, many of which, after punishment, declared their submission and fulfilled all demands"(Citation: 105).
  uk: |-
    У серпні 1832 року корпусний командир Розен повів десятитисячний загін у похід Чечнею та Ічкерією — гірською південно-східною частиною чеченської землі, куди імперські війська доти не проникали.
    Історик Д. А. Хожаєв писав: «Десятитисячний царський загін Розена вторгся в гірську Інгушетію та Чечню, охоплену вогнем народно-визвольної війни.
    Попри стійкий опір жителів гірської Чечні, які мужньо відстоювали кожну п'ядь землі, царські війська знищили кілька десятків аулів і хуторів»(Citation: 95). 22 серпня після переправи через річку Аргун винищено села Белгатой і Джан-юрт. 23 серпня штурмом узято Герменчук — найбагатше село Чечні на 600 дворів.
    Розен доповідав військовому міністрові Чернишову: «у самому селі залишено ним понад 100 тіл», а група «числом близько 60 осіб, здебільшого з людей, присланих Казі-Муллою для підбадьорення герменчуцьких жителів», на чолі з муллою Абдурахманом «була відрізана й оточена нами в одному великому будинку»(Citation: 105).
    Оточені відмовилися здатися і за наказом генерала Вольховського були спалені живцем.
    Імперський історик Волконський, який писав за донесеннями Розена, визнає: «генерал-майор Вольховський наказав накидати в димарі палаючих дров і сіна.
    Це подіяло... більша ж частина з муллою Абдурахманом загинула в полум'ї, продовжуючи співати вірші корану»(Citation: 116).
    Два дні «війська винищували будинки с.
    Герменчука», 26 серпня знищено Шалі «за винятком 11-ти дворів, що заплатили штраф і податі»(Citation: 116).
    Схему походу Розен визнав сам: селища, «не змігши погодитися між собою щодо звільнення полонених наших, покарані винищенням жител і ріллі, для чого, 27-го і 28-го минулого серпня, відряджено було полк.
    Шумського...
    Ним винищено Алхан-юрт, Сала-юрт, Катар-юрт, Лялсін-юрт, Назарі-юрт, Уздень-юрт, Урузбей-юрт і Хизін-Ерзо-юрт»(Citation: 105).
    Далі винищено Анзелі-юрт і Чингарой-юрт, посіви та житла Автурів, Саїд-юрт, ріллю й будинки Гельдігена, Анто-юрт, Асхор-юрт, Таба-юрт, Кудіш-юрт, спалено Маїртуп, в Ічкерії — Шоні, Центорой, Белгатой, хутір Хамер, Алі-юрт, Бей-Булат-юрт, Бачин-юрт, Хелбойн-юрт; спалено Беной(Citation: 116)(Citation: 105)(Citation: 95).
    Підсумок Розен підбив у рапорті Чернишову від 27 вересня 1832: «Усього дотепер підкорилося Чеченських та Ічкеринських селищ понад 80, з яких четверта частина ніколи не перебувала в залежності від нас; полонених наших повернуто 30 чоловіків і жінок; податей і штрафу грошима та худобою сплачено... близько 5-ти т. р. с. [п'яти тисяч рублів сріблом].
    Винищено непокірних селищ 61, з яких багато після покарання виявили покірність і виконали всі вимоги»(Citation: 105).
  ru: |-
    В августе 1832 года корпусный командир Розен повёл десятитысячный отряд в поход по Чечне и Ичкерии - горной юго-восточной части чеченской земли, куда имперские войска до того не проникали.
    Историк Д. А. Хожаев писал: «Десятитысячный царский отряд Розена вторгся в горную Ингушетию и Чечню, пылающую огнём народно-освободительной войны.
    Несмотря на стойкое сопротивление жителей горной Чечни, мужественно отстаивавших каждую пядь земли, царские войска уничтожили несколько десятков аулов и хуторов»(Citation: 95). 22 августа после переправы через реку Аргун истреблены сёла Белгатой и Джан-юрт. 23 августа взят штурмом Герменчук - богатейшее село Чечни в 600 дворов.
    Розен доносил военному министру Чернышёву: «в самой деревне оставлено им более 100 тел», а группа «в числе около 60-ти чел., большею частью из людей, присланных Кази-Муллою для ободрения Герменчукских жителей», во главе с муллой Абдурахманом «была отрезана и окружена нами в одном большом доме»(Citation: 105).
    Окружённые отказались сдаться и по приказу генерала Вольховского были сожжены заживо.
    Имперский историк Волконский, писавший по донесениям Розена, признаёт: «генерал-маиор Вольховский приказал набросать в трубы горящие дрова и сено.
    Это подействовало... большая же часть с муллою Абдурахманом погибла в пламени, продолжая петь стихи корана»(Citation: 116).
    Два дня «войска истребляли дома с.
    Герменчука», 26 августа уничтожено Шали «за исключением 11-ти дворов, заплативших штраф и подати»(Citation: 116).
    Схему похода Розен признал сам: селения, «не могши согласиться между собою насчёт освобождения пленных наших, наказаны истреблением жилищ и пашень, для чего, 27-го и 28-го прошедшего августа, командирован был полк.
    Шумский...
    Им истреблены Алхан-юрт, Сала-юрт, Катар-юрт, Лялсин-юрт, Назари-юрт, Уздень-юрт, Урузбей-юрт и Хызин-Ерзо-юрт»(Citation: 105).
    Далее истреблены Анзели-юрт и Чингарой-юрт, посевы и жилища Автуров, Саид-юрт, пашни и дома Гельдигена, Анто-юрт, Асхор-юрт, Таба-юрт, Кудиш-юрт, сожжён Маиртуп, в Ичкерии - Шони, Центорой, Белгатой, хутор Хамер, Али-юрт, Бей-Булат-юрт, Бачин-юрт, Хелбойн-юрт; сожжён Беной(Citation: 116)(Citation: 105)(Citation: 95).
    Итог Розен подвёл в рапорте Чернышёву от 27 сентября 1832: «Всего по сие время покорилось Чеченских и Ичкеринских селений более 80-ти, из коих четвертая часть никогда не находилась в зависимости нашей; пленных наших возвращено 30 мужчин и женщин; подати и штрафа деньгами и скотом уплачено... около 5-ти т. р. с. [пяти тысяч рублей серебром].
    Истреблено непокорившихся селений 61, из коих многие после наказания изъявили покорность и исполнили все требования»(Citation: 105).
