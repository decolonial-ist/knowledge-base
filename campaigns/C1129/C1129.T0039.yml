description:
  ru: 'Дипломатический аппарат Российской империи привлекал лояльные силы соседних народов для совместных вооруженных акций против обществ нохчи: историк Ш. Б. Ахмадов констатирует, что в состав военной экспедиции 1722 года входил «вооруженный отряд калмыков, посланный Аюка-ханом по просьбе царя, в количестве 3730 чел.»(Citation: 66).'
  en: |-
    The diplomatic apparatus of the Russian Empire enlisted loyal forces of neighboring peoples for joint armed actions against the Nokhchi societies: historian Sh.
    B. Akhmadov states that the 1722 military expedition included "an armed detachment of Kalmyks, sent by Ayuka Khan at the tsar's request, numbering 3,730 men"(Citation: 66).
  uk: 'Дипломатичний апарат Російської імперії залучав лояльні сили сусідніх народів для спільних збройних акцій проти товариств Нохчі: історик Ш. Б. Ахмадов констатує, що до складу воєнної експедиції 1722 року входив «збройний загін Калмиків, посланий Аюка-ханом на прохання царя, у кількості 3730 осіб»(Citation: 66).'
