description:
  ru: |-
    Регулярная армия Российской империи ввела вооруженные контингенты для подавления сопротивления в регионе: историк Ш. Б. Ахмадов фиксирует, что «23 июля 1722 г. царский отряд во главе с генералом Ветерани... приблизился к с.
    Эндери»(Citation: 66).
  en: |-
    The Regular Army of the Russian Empire deployed armed contingents to suppress resistance in the region: historian Sh.
    B. Akhmadov records that "on July 23, 1722, a tsarist detachment headed by General Veterani... approached the village of Enderi"(Citation: 66).
  uk: |-
    Регулярна армія Російської імперії ввела збройні контингенти для придушення опору в регіоні: історик Ш. Б. Ахмадов фіксує, що «23 липня 1722 р. царський загін на чолі з генералом Ветерані... наблизився до с.
    Ендері»(Citation: 66).
