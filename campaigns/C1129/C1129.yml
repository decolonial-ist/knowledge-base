name:
  ru: Подавление восстания, военная интервенция и принудительное оформление подданства (1722)
  en: Suppression of the Uprising, Military Intervention, and Forced Formalization of Subjecthood (1722)
  uk: Придушення повстання, воєнна інтервенція та примусове оформлення підданства (1722)
description:
  ru: |-
    В 1722 году Российская империя применила регулярную армию для физического подавления вооруженного сопротивления коренного населения.
    Причиной восстания стала экономическая политика оккупационной администрации: историк Ш. Б. Ахмадов констатирует, что «горские народы по-прежнему мотивировали свое недовольство дискриминационными мерами администрации города Терки по отношению к торгующим горцам»(Citation: 66).
    В результате этого давления «чеченские и эндерийские владельцы и их подвластные отказались присягнуть в покорности царским властям»(Citation: 66).
    В ответ метрополия организовала карательные меры: в рамках Персидского похода Петра I правительство направило войска на территории, где проживали общества нохчи.
    Историк Ш. Б. Ахмадов фиксирует, что «23 июля 1722 г. царский отряд во главе с генералом Ветерани... приблизился к с.
    Эндери»(Citation: 66).
    Из-за сопротивления горцев последовал новый удар: он указывает, что 4 августа 1722 года по указу Петра I «повторно совершена была карательная экспедиция против восставших чеченцев и андреевцев»(Citation: 66).
    Военное давление сопровождалось тотальным уничтожением инфраструктуры: исследователь констатирует, что один из царских отрядов «пришел к Эндери и полностью его разорил и сжег, оставив после себя только пепел»(Citation: 66), а в ходе августовского рейда было «Уничтожено 3 тыс. домов и сожжены хлеба в полях»(Citation: 94).
    Операция осуществлялась в сговоре с третьей стороной: Ахмадов дополняет, что в состав сил входил «вооруженный отряд калмыков, посланный Аюка-ханом по просьбе царя, в количестве 3730 чел.»(Citation: 66).
    Радикальное насилие привело к юридическому подчинению приграничных территорий нохчи: историк Я. З. Ахмадов констатирует, что после поражения местные князья дали присягу, ««включив в оное в первый раз и своих чеченцев»»(Citation: 94).
  en: |-
    In 1722, the Russian Empire employed the regular army for the physical suppression of the armed resistance of the Indigenous population.
    The uprising was caused by the economic policy of the occupation administration: historian Sh.
    B. Akhmadov states that “the mountain peoples continued to motivate their discontent by the discriminatory measures of the administration of the town of Terki toward trading Highlanders”(Citation: 66).
    As a result of this pressure, “the Chechen and Enderi lords and their subjects refused to swear an oath of submission to the tsarist authorities”(Citation: 66).
    In response, the metropole organized punitive measures: within the framework of Peter I’s Persian campaign, the government dispatched troops to the territories inhabited by Nokhchi communities.
    Historian Sh.
    B. Akhmadov records that “on July 23, 1722, a tsarist detachment led by General Veterani... approached the village of Enderi”(Citation: 66).
    Because of the Highlanders’ resistance, a new strike followed: he points out that on August 4, 1722, by decree of Peter I, “a punitive expedition was carried out a second time against the insurgent Chechens and the Enderi people”(Citation: 66).
    Military pressure was accompanied by the total destruction of infrastructure: the researcher states that one of the tsarist detachments “came to Enderi and completely ravaged and burned it, leaving nothing but ashes behind”(Citation: 66), while in the course of the August raid “3,000 houses were destroyed and the grain in the fields was burned”(Citation: 94).
    The operation was carried out in collusion with a third party: Akhmadov adds that the forces included “an armed detachment of Kalmyks numbering 3,730 men, sent by Ayuka Khan at the tsar’s request”(Citation: 66).
    The radical violence led to the legal subordination of the borderland territories of the Nokhchi: historian Ya.
    Z. Akhmadov states that after the defeat the local princes swore an oath, “‘including in it, for the first time, their Chechens as well’”(Citation: 94).
  uk: |-
    У 1722 році Російська імперія застосувала регулярну армію для фізичного придушення збройного опору корінного населення.
    Причиною повстання стала економічна політика окупаційної адміністрації: історик Ш. Б. Ахмадов констатує, що «гірські народи, як і раніше, мотивували своє невдоволення дискримінаційними заходами адміністрації міста Терки щодо Горців, які торгували»(Citation: 66).
    Внаслідок цього тиску «чеченські та ендерійські володарі та їхні підвладні відмовилися присягнути в покорі царській владі»(Citation: 66).
    У відповідь метрополія організувала каральні заходи: в межах Перського походу Петра I уряд направив війська на території, де проживали спільноти Нохчі.
    Історик Ш. Б. Ахмадов фіксує, що «23 липня 1722 р. царський загін на чолі з генералом Ветерані... наблизився до с.
    Ендері»(Citation: 66).
    Через опір Горців послідував новий удар: він вказує, що 4 серпня 1722 року за указом Петра I «повторно було здійснено каральну експедицію проти повсталих Чеченців та ендерійців»(Citation: 66).
    Військовий тиск супроводжувався тотальним знищенням інфраструктури: дослідник констатує, що один із царських загонів «прийшов до Ендері та повністю його розорив і спалив, залишивши після себе лише попіл»(Citation: 66), а під час серпневого рейду було «Знищено 3 тис. будинків і спалено хліба на полях»(Citation: 94).
    Операція здійснювалася у змові з третьою стороною: Ахмадов додає, що до складу сил входив «озброєний загін Калмиків, посланий Аюка-ханом на прохання царя, у кількості 3730 осіб»(Citation: 66).
    Радикальне насильство призвело до юридичного підпорядкування прикордонних територій Нохчі: історик Я. З. Ахмадов констатує, що після поразки місцеві князі склали присягу, «„включивши до неї вперше і своїх Чеченців“»(Citation: 94).
