description:
  ru: 'Принудительное введение языка метрополии в школы: постановление СНК СССР и ЦК ВКП(б) от 13 марта 1938 года № 324 «Об обязательном изучении русского языка в школах национальных республик и областей» предписало «ввести преподавание русского языка, как предмета изучения в школах национальных республик и областей, с 1-го сентября 1938 г.» - со II класса во всех нерусских начальных школах и с III класса в неполных средних и средних(Citation: 423).'
  en: 'The compulsory introduction of the metropole''s language into schools: the resolution of the USSR Council of People''s Commissars and the Central Committee of the VKP(b) of 13 March 1938 No. 324 "On the Compulsory Study of the Russian Language in the Schools of the National Republics and Regions" ordered "to introduce the teaching of the Russian language as a subject of study in the schools of the national republics and regions from September 1, 1938" - from the 2nd grade in all non-Russian primary schools and from the 3rd grade in incomplete secondary and secondary schools(Citation: 423).'
  uk: 'Примусове запровадження мови метрополії до шкіл: постанова РНК СРСР і ЦК ВКП(б) від 13 березня 1938 року № 324 «Про обов''язкове вивчення російської мови в школах національних республік і областей» приписала «ввести викладання російської мови як предмета вивчення в школах національних республік і областей з 1 вересня 1938 р.» - з II класу в усіх неросійських початкових школах і з III класу в неповних середніх та середніх(Citation: 423).'
