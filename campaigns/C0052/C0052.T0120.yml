description:
  en: |-
    The targeted physical annihilation of the national cultural elite.
    The official turn was sealed by the resolution of the Central Committee of the VKP(b) and the Council of People's Commissars "On Grain Procurements in Ukraine, the North Caucasus, and the Western Region" of 14 December 1932, signed by Stalin and Molotov: Ukrainization was declared to have been carried out "mechanically," which, in the resolution's own words, "made it easier for bourgeois-nationalist elements, Petliurites and the like to create their legal covers, their counter-revolutionary cells and organizations"(Citation: 461).
    The term "Executed Renaissance" denotes precisely "the repressive policy of communist Moscow aimed at the physical destruction of the Ukrainian intellectual elite of the 1920s–30s (more broadly – of the entire nationally conscious Ukrainian intelligentsia) and the tabooing of its creative achievements"(Citation: 196).
  uk: |-
    Цілеспрямоване фізичне знищення національної культурної еліти.
    Офіційний розворот закріпила постанова ЦК ВКП(б) і Раднаркому «Про хлібозаготівлі на Україні, Північному Кавказі та в Західній області» від 14 грудня 1932 року за підписами Сталіна й Молотова: українізацію оголошено проведеною «механічно», що, за текстом постанови, «полегшило буржуазно-націоналістичним елементам, петлюрівцям та ін. створення своїх легальних прикриттів, своїх контрреволюційних осередків та організацій»(Citation: 461).
    Термін «розстріляне відродження» й означає «репресивн[у] політик[у] комуніст.
    Москви, спрямован[у] на фізичне знищення укр. інтелектуальної еліти 1920—30х рр. (ширше — усієї національно свідомої інтелігенції української) й табуювання її творчих здобутків»(Citation: 196).
  ru: |-
    Целенаправленное физическое уничтожение национальной культурной элиты.
    Официальный разворот закрепило постановление ЦК ВКП(б) и Совнаркома «О хлебозаготовках на Украине, Северном Кавказе и в Западной области» от 14 декабря 1932 года за подписями Сталина и Молотова: украинизация объявлена проведённой «механически», что, по тексту постановления, «облегчило буржуазно-националистическим элементам, петлюровцам и проч. создание своих легальных прикрытий, своих контрреволюционных ячеек и организаций»(Citation: 461).
    Термин «расстрелянное возрождение» и означает «репрессивн[ую] политик[у] коммунистической Москвы, направленн[ую] на физическое уничтожение украинской интеллектуальной элиты 1920—30-х гг. (шире — всей национально сознательной украинской интеллигенции) и табуирование её творческих достижений»(Citation: 196).
