description:
  en: 'Depriving the autonomy of control over its own administrative and economic life: "direct control over the military-administrative and financial-economic life of Ukraine passed into the hands of the tsarist voivodes"(Citation: 24) – the sovereign functions of the hetman''s authority passed to representatives of the metropole.'
  uk: 'Позбавлення автономії контролю над власним адміністративним і господарським життям: «до рук царських воєвод переходило безпосереднє управління військово-адм. і фінансово-госп. життям України»(Citation: 24) – суверенні функції гетьманської влади переходили до представників метрополії.'
  ru: 'Лишение автономии контроля над собственной административной и хозяйственной жизнью: «в руки царских воевод переходило непосредственное управление военно-административной и финансово-хозяйственной жизнью Украины»(Citation: 24) – суверенные функции гетманской власти переходили к представителям метрополии.'
