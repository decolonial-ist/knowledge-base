description:
  ru: 'Расширение военной оккупации автономии: помимо усиления гарнизонов Киева, Чернигова, Переяслава и Нежина, «российские военные гарнизоны во главе с воеводами вводились в Полтаву, Кременчуг, Новгород-Северский, Остёр, Канев и другие города, а также в Кодак в Вольностях Войска Запорожского низового»(Citation: 24) – содержание войск возлагалось на украинских налогоплательщиков.'
  en: 'Expansion of the military occupation of the autonomy: in addition to reinforcing the garrisons of Kyiv, Chernihiv, Pereiaslav, and Nizhyn, "Russian military garrisons headed by voivodes were introduced into Poltava, Kremenchuk, Novhorod-Siverskyi, Oster, Kaniv, and other cities, as well as into Kodak in the Liberties of the Zaporozhian Host"(Citation: 24) – the upkeep of the troops was placed on Ukrainian taxpayers.'
  uk: 'Розширення військової окупації автономії: крім посилення залог Києва, Чернігова, Переяслава та Ніжина, «рос. військ. залоги на чолі з воєводами вводилися до Полтави, Кременчука, Новгорода-Сіверського, Остра, Канева та ін. міст, а також до Кодака у Вольностях Війська Запорозького низового»(Citation: 24) – утримання військ покладалося на українських платників податків.'
