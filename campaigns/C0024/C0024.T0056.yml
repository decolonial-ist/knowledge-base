description:
  ru: |-
    Прямое изъятие экономических ресурсов автономии: «Сбор налогов с украинского населения (за исключением казацкого сословия) возлагался на царскую администрацию.
    Собранные средства направлялись в царскую казну»(Citation: 24).
  en: |-
    Direct extraction of the autonomy's economic resources: "The collection of taxes from the Ukrainian population (except for the Cossack estate) was entrusted to the tsarist administration.
    The collected funds were channeled into the tsar's treasury"(Citation: 24).
  uk: |-
    Пряме вилучення економічних ресурсів автономії: «Збирання податків з укр. населення (за винятком козац. стану) покладалося на царську адміністрацію.
    Зібрані кошти залучалися до царської скарбниці»(Citation: 24).
