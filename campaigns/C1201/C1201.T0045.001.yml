description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские военные разрушали мечети и кладбища бомбёжками, а при облавах в сёлах оскверняли мечети, жгли их, разоряли могилы и гробницу святого.

    При бомбёжках 1999-2000 годов российские войска разрушили мечети в Гой-Чу, селе к юго-западу от Грозного, и в горных сёлах, а в Грозном и в сёлах на равнине - другие места молитвы(Citation: 1470).
    После захвата сёл оккупанты устраивали в них облавы: окружали село, обыскивали дома и мечети, задерживали мужчин (подробнее: «Террор»).

    К 10 декабря 1999 года российские войска при захвате Горагорска, села на севере Ичкерии, разрушили мечеть до фундамента(Citation: 1635).
    К 11 декабря оккупанты, захватившие Алхан-Юрт, село к юго-западу от Грозного, разбили кладбище и продырявили купол мечети(Citation: 1635).
    Начальник штаба Воронов командовал тогда российским 15-м мотострелковым полком, который захватил село, а российские офицеры у села объясняли, что на кладбище «были окопы боевиков» (так россияне называли Вооружённые силы Ичкерии)(Citation: 1581)(Citation: 1635).

    После штурма Гой-Чу в марте 2000 года российские танки разравнивали могилы в селе(Citation: 3308).
    В августе 2000 года российские военные при облаве в Гехи, селе к юго-западу от Грозного, разрушили на сельском кладбище около 200 могил и надгробий.
    Командующий внутренними войсками МВД России (предшественники современной Росгвардии) Тихомиров и генералы внутренних войск Лабунец и Недобитко руководили облавой с командного пункта у села(Citation: 1581). 26 августа при облаве в Турты-Хуторе, селе на юго-востоке Ичкерии, российские военные вошли в сельскую мечеть, не сняв грязной обуви, и унесли брезент и носилки для похорон, а из мечети у верхнего кладбища - брезент.
    Облавой командовал начальник Курчалоевского временного отдела российской милиции Занин(Citation: 1503). 22 декабря 2000 года солдаты оккупационных войск при облаве в Аргуне, городе к востоку от Грозного, сожгли мечеть(Citation: 1581).

    4 августа 2001 года российские военные при облаве в Старых Атагах, селе к югу от Грозного, обстреляли, а потом сожгли небольшую мечеть на Учительской улице.
    По словам сельчан, генерал Плотников руководил этой облавой(Citation: 1512). 16-27 августа 2001 года российские военные при облаве в Аллерое, селе на востоке Ичкерии, испражнялись на ковры сельской мечети и взломали в ней пол, будто искали оружие.
    Оккупанты взломали и гробницу святого Аббас-хаджи, а на её стенах оставили надписи, оскорбляющие чеченцев и мусульман(Citation: 1581). 27 сентября - 6 октября 2001 года при облаве в Старых Атагах и трёх соседних сёлах, на которую приехал генерал внутренних войск Богдановский, российские военные сожгли в Старых Атагах ещё одну мечеть (подробнее: «Террор»).
    О соседнем Чири-Юрте источники расходятся: одни пишут, что оккупанты сожгли там мечеть, другие - медресе, мусульманскую школу(Citation: 1512)(Citation: 1581).

    30 декабря 2001 года российские войска окружили Цоцин-Юрт, село к востоку от Грозного, и до 3 января 2002 года обыскивали дома.
    Командующий оккупационными войсками Молтенской руководил облавой (подробнее: «Террор»)(Citation: 1581).
    Анна Политковская, обозреватель «Новой газеты», приехала в село после облавы и 28 января 2002 года писала о сельской мечети: «Солдаты пошли и в мечеть...
    А может, это были и офицеры...
    Стащили в кучу ковры, утварь, книги, Коран, конечно, и свои «кучи» сверху наложили».
    После облавы чеченки села отмыли мечеть(Citation: 1774).

    28 января - 5 февраля 2002 года при облаве в Старых Атагах, на которой был командующий оккупационными войсками Молтенской, российские военные все восемь суток испражнялись на ковры сельской мечети(Citation: 1783)(Citation: 1581). 1 февраля оккупанты унесли с сельского кладбища ванну, в которой обмывают умерших перед похоронами, сожгли погребальные носилки и забрали лопаты для рытья могил(Citation: 1783).
    Зимой 2005 года при облаве в Зумсое, горном селе на юге Ичкерии, откуда оккупанты вынуждали чеченцев уйти, российские военные осквернили мечеть (подробнее: «Депортация»)(Citation: 2036).

    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году описали 136 облав 1999-2005 годов.
    В 16 из них российские военные оскверняли, грабили или разрушали мечети, кладбища, школы и больницы(Citation: 1581).

    Оккупанты оскверняли мечети и кладбища в основном при облавах, а с конца 2002 года облавы стали реже (подробнее: «Террор»)(Citation: 1581). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
