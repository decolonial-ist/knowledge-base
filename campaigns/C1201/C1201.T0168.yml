  ru: |-
    Потерпев поражение в Первой Русско-Чеченской войне, Россия подписала с Чеченской Республикой Ичкерия фиктивный мир в Хасавюрте в 1996 году и в Москве в 1997 году, а с весны 1999 года тайно перебрасывала войска к границам Ичкерии и называла её власть и армию «бандитами» и «террористами»(Citation: 27)(Citation: 667)(Citation: 825).
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября российская армия вторглась в Ичкерию(Citation: 27).
    Россия всю войну выводила российских военных и милиционеров из-под ответственности за преступления против чеченцев, а командиров награждала.

    В Ичкерии российские военные и милиционеры действовали по федеральному закону № 130-ФЗ «О борьбе с терроризмом» от 25 июля 1998 года.
    По этому закону участники «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии) не отвечали за причинённый вред, а сведения о сотрудниках спецподразделений были секретными(Citation: 759)(Citation: 777).

    Российские солдаты и милиционеры снимали знаки различия, прятали лица под масками и ездили на машинах без номеров, чтобы чеченцы не могли их опознать(Citation: 770). 27 марта 2002 года командующий оккупационными войсками Молтенской приказом № 80 велел военным представляться, вешать номера на машины и не носить масок «без оперативной необходимости»(Citation: 946).
    В мае 2002 года правозащитники «Мемориала» описали облавы в пяти сёлах, и ни в одном военные приказ не исполняли(Citation: 954).

    Российские военные и милиционеры приезжали в Ичкерию из регионов России на 90 суток, потом уезжали домой, и следователи их не находили(Citation: 1590).
    Российская гражданская прокуратура Чеченской Республики не имела права допрашивать военных и входить в воинские части.
    Военная прокуратура оккупационных войск в Ханкале, их главной базе на восточной окраине Грозного, отказывала в делах, не находя в действиях военных состава преступления(Citation: 1512)(Citation: 759).

    Следователи возбуждали дела спустя недели и месяцы, а удары артиллерии по сёлам записывали как неосторожное обращение с оружием.
    Через два месяца следователи приостанавливали дела, будто не могли установить, кого обвинить, даже когда знали номера машин и частей(Citation: 1210)(Citation: 1581).
    Правительство России отказывалось передать Европейскому суду по правам человека материалы этих дел, ссылаясь на тайну следствия(Citation: 759)(Citation: 777).

    Депутаты в Москве постановлениями от 13 декабря 1999 года № 4784-II ГД, от 6 июня 2003 года № 4125-III ГД и от 22 сентября 2006 года № 3498-4 ГД объявили амнистии российским военным и милиционерам за преступления в Ичкерии.
    Под амнистии попадали пытки и превышение полномочий(Citation: 1210)(Citation: 1562)(Citation: 795)(Citation: 796).

    Суды давали российским военным за преступления против мирных чеченцев в Ичкерии в основном условные сроки и штрафы.
    По данным заместителя генерального прокурора России Шепеля, к середине 2005 года приговоры получили 103 военных: восьмерых оправдали, 20 амнистировали, реальный срок дали 27, большинство из них убили мирных чеченцев в свободное от службы время(Citation: 286).

    7 октября 1999 года российские лётчики бомбили Элистанжи, горное село на юго-востоке Ичкерии, и убили 48 мирных чеченцев (подробнее: «Неизбирательные нападения»).
    Российские прокуроры не возбудили дела(Citation: 1581). 21 октября российские войска ударили ракетами по рынку, роддому, почтамту и мечети в Грозном, убив около 140 горожан (подробнее: «Неизбирательные нападения»). 22 января 2007 года военная прокуратура оккупационных войск отказала в возбуждении дела.
    В мае 2007 года первый заместитель военного прокурора Калита написал правозащитникам, что на рынке взорвался «нелегальный склад оружия»(Citation: 1581). 29 октября 1999 года российские лётчики обстреляли ракетами колонну беженцев на трассе у Шаами-Юрта и убили, по данным Международного комитета Красного Креста, 25 чеченцев (подробнее: «Неизбирательные нападения»).
    Военные прокуроры завели дело через полгода, 3 мая 2000 года, а 5 мая 2004 года прекратили его «за отсутствием состава преступления в действиях пилотов»(Citation: 1581).

    С 1 по 17 декабря 1999 года российские войска генерала Шаманова убили в Алхан-Юрте, селе к юго-западу от Грозного, не меньше 18 мирных чеченцев (подробнее: «Массовые убийства гражданских»)(Citation: 770)(Citation: 1581). 11 декабря группа сельчан пришла к генералу Шаманову, который стоял между Алхан-Юртом и соседним селом Кулары, и просила остановить убийства.
    Марет Мудалова и Липа Ассуева из этой группы 13 декабря рассказали Human Rights Watch, что через десять минут генерал их прогнал.
    По словам одной из женщин, Шаманов кричал: «Вы, чертовы чеченцы, убирайтесь отсюда, или я вас расстреляю на месте»(Citation: 770). 24 декабря исполнявший обязанности генерального прокурора России Устинов после встречи с председателем правительства Путиным сказал журналистам, что прокуратура не установила умышленных убийств мирных чеченцев в селе(Citation: 1581). 28 декабря президент России Ельцин дал Шаманову звание Героя России и назвал действия армии в Ичкерии безупречными(Citation: 770). 31 декабря главный военный прокурор России Дёмин объявил, что оснований для уголовного преследования нет(Citation: 770). 15 января 2000 года Путин, уже исполнявший обязанности президента, сказал в интервью телеканалу ОРТ: «Генералов там не за что наказывать – они награждены.
    Они получили звания Героя России, и получили заслуженно»(Citation: 1581). 10 марта Дёмин сказал представителям Human Rights Watch, что дело закрыли за отсутствием доказательств(Citation: 770).
    Прокуроры не обвинили никого из российских военных за убийства в Алхан-Юрте(Citation: 1450)(Citation: 1581).

    4 декабря 1999 года президент России Ельцин указом дал звание Героя России командующему оккупационными войсками Казанцеву «за мужество и героизм… и умелое руководство войсками в ходе ликвидации незаконных вооруженных формирований» (так Россия называла Вооружённые силы Ичкерии)(Citation: 1581). 5 февраля 2000 года российские солдаты и омоновцы, бойцы милицейского спецназа, убили в Новых Алдах, посёлке на южной окраине Грозного, не меньше 46 мирных чеченцев (подробнее: «Массовые убийства гражданских»), а 3 марта военная прокуратура оккупационных войск отказала в возбуждении дела, о чём «Мемориалу» написал заместитель военного прокурора Долженко(Citation: 948)(Citation: 1581).
    Прокуроры отстранили следователя Генеральной прокуратуры России Мурдалова, выдавшего семьям справки о вине военных и милиционеров.
    До 2006 года прокуроры десять раз приостанавливали дело, а обвинение предъявили одному омоновцу Бабину.
    Следователи его не задержали, и Бабин скрылся от следствия, хотя продолжал давать интервью газетам(Citation: 949)(Citation: 1697)(Citation: 1581).
    Полковник Кукарин командовал солдатами 245-го полка и петербургскими омоновцами, которые убивали чеченцев в Новых Алдах. 29 февраля 2000 года исполнявший обязанности президента России Путин дал Кукарину звание Героя России «за мужество и героизм, проявленные при ликвидации незаконных вооруженных формирований» (так Россия называла Вооружённые силы Ичкерии)(Citation: 2379).
    За убийства в Новых Алдах до сих пор никого не наказали(Citation: 2379).
    Милиционеры держали и пытали Алаудина Садыкова в изоляторе при отделе милиции Октябрьского района Грозного с 5 марта по 24 мая 2000 года (подробнее: «Пытки и истязания»). 16 марта 2007 года следователи обвинили начальника изолятора Банина в превышении полномочий за эти пытки, а через четыре дня прекратили дело по амнистии 2006 года(Citation: 782)(Citation: 286). 27 марта 2000 года полковник Буданов, командир 160-го танкового полка, похитил, изнасиловал и задушил 18-летнюю Эльзу Кунгаеву из Танги-Чу, села к юго-западу от Грозного (подробнее: «Сексуализированное насилие»)(Citation: 1439).
    Врач российской армии нашёл на теле следы изнасилования, но военные прокуроры обвинили Буданова только в похищении, убийстве и превышении полномочий(Citation: 1439). 25 июля 2003 года российский окружной военный суд в Ростове-на-Дону дал Буданову 10 лет, признав смягчающим обстоятельством то, что он воевал в Ичкерии, а в декабре 2008 года суд освободил его досрочно(Citation: 1535)(Citation: 1531).

    2 января 2001 года Зелимхан Мурдалов пропал без вести после того, как милиционеры из Ханты-Мансийского округа в Сибири задержали его в Октябрьском районе Грозного и пытали; тела не нашли (подробнее: «Похищение людей»)(Citation: 1590)(Citation: 815).
    В 2004 году милиция Ханты-Мансийского округа вернула на службу Лапина, обвиняемого в этих пытках, и наградила медалью с поздравлением от президента России(Citation: 1940). 29 марта 2005 года суд в Грозном дал Лапину 11 лет за пытки Зелимхана Мурдалова и поддельные подписи в деле о наркотиках, которое милиционеры завели на задержанного, но за исчезновение Зелимхана Мурдалова не осудил(Citation: 2007)(Citation: 286). 11 января 2002 года спецназовцы военной разведки России из группы капитана Ульмана остановили рейсовую машину у села Дай в Шатойском районе на юге Ичкерии, убили шестерых мирных чеченцев и сожгли тела (подробнее: «Убийство пленных и задержанных»)(Citation: 1778).
    Дважды присяжные оправдывали спецназовцев, а 14 июня 2007 года российский окружной военный суд в Ростове-на-Дону дал четверым от 9 до 14 лет, но трое к тому времени скрылись(Citation: 1955)(Citation: 2009)(Citation: 1581).

    29 декабря 2004 года президент России Путин дал звание Героя России первому заместителю председателя оккупационного правительства республики Кадырову-младшему, чьи силовики похищали и пытали чеченцев.
    Human Rights Watch писала, что так Россия одобрила методы Кадырова-младшего(Citation: 819)(Citation: 1581).

    2 апреля 2003 года Парламентская ассамблея Совета Европы в резолюции 1323 написала, что российские солдаты продолжают совершать преступления, потому что почти всегда остаются безнаказанными, и призвала обсудить международный трибунал.
    Трибунал так и не создали(Citation: 788)(Citation: 1188).
    Европейский комитет по предупреждению пыток в заявлении 13 марта 2007 года сообщил, что из 245 жалоб на насилие над задержанными чеченцами с 2000 по 2006 год следователи возбудили 12 дел(Citation: 939).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева подсчитали, что из 2198 мирных чеченцев, которых российские военные и милиционеры убили в Ичкерии с 1999 по 2002 год, к апрелю 2003 года следователи раскрыли убийства 22, а из исчезновений - ни одного(Citation: 1581).
    К сентябрю 2009 года Европейский суд по правам человека вынес 115 решений по делам из Ичкерии.
    Почти во всех суд признал Россию виновной в исчезновениях, казнях, пытках и в том, что она их не расследовала.
    Human Rights Watch изучила 33 таких дела и не нашла ни одного привлечённого к ответственности оккупанта(Citation: 1174).

    16 апреля 2009 года уполномоченный по правам человека оккупационной администрации Нухажиев в специальном докладе сообщил, что российская прокуратура республики завела 2027 дел о похищении 2826 чеченцев.
    Следователи приостановили 1873 из них «за неустановлением лиц, причастных к похищению людей», а 74 передали военным прокурорам(Citation: 1195)(Citation: 295).
