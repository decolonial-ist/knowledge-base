description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты проводили на захваченной земле Ичкерии «референдум» и «выборы», чтобы записать республику в состав России и выдать своих ставленников за избранных чеченцами.

    12 декабря 2002 года президент России Путин указом № 1401 утвердил порядок референдума по конституции и законам о выборах, которые для Чеченской Республики написали чиновники в Москве (подробнее: «Установка новой системы управления»)(Citation: 941).
    Голосовать могли только граждане России, списки избирателей составляли по сведениям назначенных оккупантами глав администраций, а в воинских частях - по сведениям командиров.
    Агитировать разрешили только партиям и объединениям, которые зарегистрировались не позже чем за полгода до референдума(Citation: 842).

    14 октября 2002 года председатель оккупационного правительства Ильясов объявил итог переписи: 1 088 000 человек.
    В ноябре 2002 года гуманитарная организация Danish Refugee Council обошла дома и насчитала около 700 тысяч человек.
    Правозащитник «Мемориала» Александр Черкасов пишет, что почти 400 тысяч записанных в перепись несуществующих людей стали запасом голосов для референдума и выборов 2003 года(Citation: 1328).

    Назначенные оккупантами главы администраций, директора школ и предприятий вместе с военными комендантами собирали подписи за референдум и обязывали чеченцев идти на участки.
    В Наурском районе на севере республики подписи брали при выдаче пенсий и детских пособий.
    В Урус-Мартановском районе к юго-западу от Грозного по домам ходили вооружённые милиционеры оккупационной администрации, а в Курчалоевском районе к юго-востоку от Грозного руководители предприятий сами ставили подписи за работников(Citation: 941).
    Организация по безопасности и сотрудничеству в Европе (ОБСЕ) и Парламентская ассамблея Совета Европы (ПАСЕ) не наблюдали за голосованиями 2003 года (подробнее: «Выдворение внешних миссий»)(Citation: 941).

    26 марта 2000 года, на выборах президента России, подконтрольная оккупантам избирательная комиссия республики назвала 460 тысяч избирателей, хотя за месяц до этого член Центральной избирательной комиссии России Даниленко говорил о 200-250 тысячах.
    Комиссия объявила, что проголосовали больше 70% избирателей, а в Грозном - 97%(Citation: 1328). 20 августа 2000 года, в день выборов депутата российского парламента, оккупанты на блокпостах не пропускали людей без особых пропусков комендатуры, которые выдавал лично военный комендант республики Бабичев.
    Таких пропусков не было даже у кандидатов(Citation: 1690).

    11 декабря 2002 года в Гудермесе, втором по величине городе республики, «съезд чеченского народа», где председательствовал глава оккупационной администрации Кадыров, единогласно проголосовал за референдум.
    Никто не избирал делегатов: их отобрали районные администрации и российская партия «Единство», которая привезла их нанятым самолётом из Москвы(Citation: 1845)(Citation: 941).

    29 января 2003 года ПАСЕ в резолюции 1315 выразила озабоченность, что к 23 марта необходимых условий для референдума, скорее всего, не будет.
    Ассамблея потребовала обеспечить людям безопасность, составить точные списки избирателей и дать проголосовать беженцам в Ингушетии(Citation: 285). 8 февраля 2003 года в школе № 1 в Курчалое, районном центре к юго-востоку от Грозного, военный комендант района, командир 33-й бригады внутренних войск МВД России, начальники милиции и директора школ составили план, как привести на референдум как можно больше людей.
    В этот день детей распустили с уроков по домам(Citation: 941).

    Перед референдумом 23 марта 2003 года партия «Единая Россия» и министерство образования оккупационной администрации раздали школам Грозного открытки «Напиши президенту», чтобы дети на уроках писали Путину в поддержку референдума.
    Кукаев, директор 7-й школы и председатель участковой избирательной комиссии № 377, в интервью Анне Политковской, опубликованном в «Новой газете» 17 марта 2003 года, сказал: «Мы не давили, не подумайте...
    Мы просто направляли, нацеливали».
    Открытки «Референдуму — да, войне — нет» ушли в Кремль, а открытки детей «Путин, кончай нас убивать!» и «Ведь здесь гибнет невинный народ, а не террористы!» задержали в кабинетах директоров или сожгли(Citation: 1866). 16 марта Путин в обращении по телевидению призвал граждан республики «сделать правильный выбор».
    С 18 марта по 1 апреля правозащитники и журналисты не узнали ни об одном задержании или убийстве, а со 2 апреля российские военные снова похищали и убивали чеченцев почти каждый день (подробнее: «Террор»)(Citation: 1581).

    23 марта 2003 года улицы Грозного опустели.
    Члены комиссий не проверяли регистрацию по месту жительства, и журналисты ради опыта голосовали по нескольку раз.
    На участке № 361 в столице сотрудники «Мемориала» за полчаса увидели меньше десяти избирателей, а члены комиссии заявили, что к полудню проголосовало большинство из 831 избирателя участка.
    В селе Гойты к югу от Грозного комиссия насчитала 120% избирателей по списку(Citation: 941).
    Центральная избирательная комиссия России объявила, что проголосовали 89% из 540 тысяч избирателей, которых насчитали по переписи, и 95,37% из них - «за»(Citation: 1328).
    ПАСЕ и ОБСЕ итогов не признали(Citation: 941).
    Принятая конституция записала республику «в составе Российской Федерации» (подробнее: «Аннексия территорий»)(Citation: 794).

    До «выборов» «президента» 5 октября 2003 года не дошёл ни один сильный соперник главы оккупационной администрации Кадырова. 11 сентября депутат российского парламента Аслаханов снял кандидатуру и объявил, что накануне Путин по телефону предложил ему должность своего помощника(Citation: 1475).
    Верховный суд республики снял с выборов предпринимателя Сайдуллаева, а предприниматель Джабраилов намекал, что отказался от участия после беседы с руководителем администрации Путина Волошиным(Citation: 941).
    Заместитель председателя одной из участковых комиссий в Заводском районе Грозного рассказал Анне Политковской в интервью «Новой газете», опубликованном 4 декабря 2003 года, что за два-три дня до голосования избирательная комиссия республики велела дать явку 90%, а Кадырову - около 80%.
    На участок пришли 80 человек, за Кадырова проголосовали 22.
    После обеда председатель комиссии опускал в урны бюллетени небольшими пачками, беря их по очереди у девяти членов комиссии.
    Комиссия заранее получила паспортные данные избирателей из паспортных столов милиции.
    В протокол записали 876 избирателей и 780 голосов за Кадырова.
    На вопрос, почему никто в комиссии не возражал, заместитель председателя ответил: «Кадыров был заказан, и каждый знал, что лично от него ничего не зависит»(Citation: 1929).
    Подконтрольная России избирательная комиссия республики объявила, что Кадыров набрал около 82% голосов при явке 85%(Citation: 941).
    В ноябре 2003 года Комитет ООН по правам человека выразил озабоченность сообщениями, что на этих выборах нарушили часть требований статьи 25 Международного пакта о гражданских и политических правах, которая защищает право граждан на честные выборы(Citation: 1445).

    В июле 2004 года, перед «выборами» нового «президента» после убийства главы оккупационной администрации Кадырова 9 мая, подконтрольная России избирательная комиссия признала недействительным паспорт Сайдуллаева, где местом рождения стояла «Республика Чечня», а Алханову, министру внутренних дел республики и ставленнику Кремля, такой же паспорт поменяли накануне регистрации(Citation: 941). 29 августа 2004 года комиссия объявила Алханова «президентом» с 73,67% голосов при явке больше 80%, хотя на участке № 406 в Грозном правозащитники к 13:15 не застали ни одного избирателя, а 7 октября ПАСЕ в резолюции 1402 заявила, что эти выборы не отвечали основным требованиям демократических выборов(Citation: 941).

    27 ноября 2005 года, на «выборах» оккупационного парламента, председатели комиссий в Грозном называли правозащитникам числа проголосовавших в несколько раз больше счёта наблюдателей (на участке № 361 - 400 против 45), а в Шатойском районе на юге республики 2700 из примерно 10 тысяч избирателей были российскими военными(Citation: 941). 3 декабря избирательная комиссия республики объявила явку 69,59%, а «Единой России» - 60,65% голосов(Citation: 941).

    Правозащитники «Мемориала» и ещё четырёх организаций в январе 2006 года писали, что референдум и выборы в республике свелись к массовым подделкам итогов(Citation: 941).
    Правозащитники International Federation for Human Rights и «Мемориала» в 2007 году писали, что организаторы выборов опирались на грубую силу, а фиктивными выборами прикрывали назначение руководства республики из Москвы(Citation: 286).

    2 марта 2007 года оккупационный парламент, избранный на «выборах» 2005 года, по предложению Путина утвердил главой оккупационной администрации председателя оккупационного правительства Кадырова-младшего, который с 15 февраля временно исполнял эти обязанности (подробнее: «Марионеточное правительство»)(Citation: 895)(Citation: 286).
