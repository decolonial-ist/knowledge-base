  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты и оккупационная администрация Кадырова ставили во главе мусульманского духовенства республики своих людей, а те звали бойцов Вооружённых сил Ичкерии сложить оружие и объявляли им «джихад».

    Президент Аслан Масхадов снял Кадырова с поста муфтия, главы мусульманского духовенства Ичкерии, а Кадыров продолжал называть себя муфтием и осенью 1999 года перешёл на сторону оккупантов (подробнее: «Выращивание коллаборационистской элиты»)(Citation: 1503)(Citation: 1671). 8 июня 2000 года Россия поставила бывшего муфтия главой оккупационной администрации (подробнее: «Марионеточное правительство»)(Citation: 1676).

    В июле 2000 года глава оккупационной администрации Кадыров рассказал обозревателю «Новой газеты» Анне Политковской, что собрал всех имамов республики и сказал им: «Я не могу быть и муфтием, и главой.
    Изберите нового».
    Кадыров добавил, что хотел бы видеть муфтием Шамаева, главу духовенства Шатойского района на юге Ичкерии(Citation: 1676).
    Осенью Шамаев стал муфтием. 16 октября 2000 года новый муфтий объяснил сотруднику правозащитного центра «Мемориал» в Шатое, что недавно «назначен» и выберет в каждом из 19 районов кадия, мусульманского судью.
    О Кадырове Шамаев сказал правозащитнику: «Это самая лучшая кандидатура, которую мог подобрать Президент Российской Федерации В.В.Путин на пост главы республики».
    Муфтий видел задачу духовенства в том, чтобы молодые чеченцы, ушедшие воевать в леса, сложили оружие.
    Про Шатой муфтий добавил в разговоре с правозащитником: «Если бы в Шатое не было нормально настроенного к России духовенства, то многие российские матери оплакивали бы сегодня своих сыновей»(Citation: 1503).

    Глава оккупационной администрации Кадыров требовал от мулл звать односельчан голосовать за конституцию на устроенном Россией «референдуме» 23 марта 2003 года (подробнее: «Имитация народного волеизъявления»).
    До лета 2003 года, чтобы проверить, кто ему не подчинится, Кадыров велел сдвинуть мусульманский пост на неделю, и большинство мулл послушались(Citation: 1927). 21 июня 2003 года российские военные похитили в Дышне-Ведено, селе на юго-востоке Ичкерии, 77-летнего религиозного старейшину Сайд-Магомеда Исакова, который не звал односельчан голосовать и прилюдно отказался поститься по указке Кадырова.
    Семья уверена, что за похищением стоят люди Кадырова, а к ноябрю 2003 года старейшину так и не нашли (подробнее: «Нейтрализация оппозиции»)(Citation: 1927).
    В 2003 году в Автурах, селе к юго-востоку от Грозного, по требованию Кадырова открыли филиал исламского института, который он опекал лично.
    Оккупационная администрация в Грозном дала деньги на эту мусульманскую школу, а светской школе села денег не дала(Citation: 1908).

    В конце февраля 2004 года в Гудермесе, городе к востоку от Грозного, глава оккупационной администрации Кадыров и муфтий Шамаев объявили «джихад» Вооружённым силам Ичкерии перед строем службы безопасности Кадырова, батальона «Восток», который российская военная разведка создала в 42-й дивизии, и батальона спецназа этой разведки. 29 февраля эти силовики захватили в заложники родственников министра обороны Ичкерии Магомеда Хамбиева, и 8 марта Магомед Хамбиев сдался (подробнее: «Захват заложников»)(Citation: 1581).

    4 августа 2005 года муфтий республики Мирзаев, который в мае сменил Шамаева, собрал мулл всех районов и зачитал решение о «джихаде» «ваххабитам и террористам»(Citation: 3129)(Citation: 2014).
    На совещании были командир батальона «Восток» Ямадаев, первый заместитель председателя оккупационного правительства Кадыров-младший и министр внутренних дел оккупационной администрации Алханов.
    Анна Политковская писала в «Новой газете» 18 августа 2005 года: «Все без исключения муллы, из всех районов республики, проголосовали за джихад».
    По её словам, решение у муфтия прежде всего «пробивал» Кадыров-младший, и теперь силовики могли убивать без суда тех, кого подозревали в «терроризме и ваххабизме».
    В ночь на 5 августа в станице Шелковской, на северо-востоке Ичкерии, вооружённые люди увезли и убили учителя арабского языка и основ ислама Вахамби Сатиханова, а односельчане винят в убийстве бойцов батальона «Восток» (подробнее: «Запрет религиозной практики коренного народа»).
    Генеральная прокуратура, МВД и Верховный суд России не осудили объявление «джихада», и никто не отстранил министра Алханова от должности(Citation: 2014).

    24 июля 2008 года в Гудермесе глава оккупационной администрации Кадыров-младший упрекнул назначенных муфтия и районных кадиев, что молодёжь уходит воевать в леса, а не слушает их проповеди, и велел им знать, кто ходит в мечети (подробнее: «Запрет религиозной практики коренного народа»).
    Кадыров-младший напомнил, что дал им охрану и печатает книги о «традиционном исламе»(Citation: 944).
