  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Командующие оккупационными войсками не выпускали чеченцев из республики, которую бомбили и обстреливали российские войска, а оставшихся в окружённом Грозном объявили врагами, и российские солдаты их убивали.

    С 25 сентября 1999 года командование оккупационными войсками закрывало чеченцам выход из республики (подробнее: «Транспортная блокада»)(Citation: 1581).
    С октября по декабрь 1999 года командующий российскими войсками в Ичкерии Казанцев с генералами приказывали обстреливать сёла, города и колонны беженцев и не выпускать людей из-под огня (подробнее: «Неизбирательные нападения»)(Citation: 1581). 11 января 2000 года Казанцев приказал не выпускать из республики мужчин от 10 до 60 лет(Citation: 1581)(Citation: 766).
    Российские солдаты, захватывая кварталы Грозного, считали бойцами Вооружённых сил Ичкерии тех, кто остался в городе, и расстреливали горожан (подробнее: «Массовые убийства гражданских»)(Citation: 1581).

    22 октября 1999 года, на следующий день после ракетного удара оккупантов по центральному рынку Грозного, российские войска закрыли пункт пропуска «Кавказ-1», почти единственный выход беженцев из Ичкерии в Ингушетию.
    Военные открыли пост 2 ноября и снова закрыли 3 декабря (подробнее: «Транспортная блокада»)(Citation: 1581).
    Анна Политковская, корреспондент «Новой газеты», писала, что 29 октября спросила коменданта поста Хрулёва, по какому закону он действует.
    Хрулёв ответил журналистке: «У меня – приказ.
    Мой закон – приказ»(Citation: 1581).
    С 22 октября по 1 ноября, пока выход был закрыт, российские лётчики и артиллеристы убили в республике не меньше 86 мирных чеченцев и ранили не меньше 146(Citation: 1581).

    В декабре 1999 года командование оккупационными войсками в листовках объявило чеченцам в Грозном, что все, кто останется в городе после 11 декабря, будут уничтожены(Citation: 1529).
    С декабря 1999 года по январь 2000 года российские войска бомбили и обстреливали Грозный, где, по оценке корреспондента Радио Свобода, оставались около 40-45 тысяч человек, и убили там тысячи мирных чеченцев(Citation: 1489)(Citation: 1581).
    С января по март 2000 года военные генерала Шаманова на пункте пропуска «Юг» к югу от Грозного задерживали чеченских мужчин, выходивших по объявленному коридору из Шатойского района в горах на юге Ичкерии(Citation: 1581).

    19 января 2000 года российские солдаты захватывали Катаяму, посёлок на северо-западе Грозного.
    Военные вывели из подвала шестерых горожан, не стали смотреть документы, загнали их обратно и бросили в подвал гранаты со слезоточивым газом.
    Потом солдаты по одному выводили прятавшихся из подвала и расстреляли из пулемёта, в том числе чеченцев Касыма Решиева и мужчину из Шатоя, села на юге Ичкерии(Citation: 760)(Citation: 279).
    Елена Гончарук, которая выжила с ранением в грудь, рассказала правозащитникам «Мемориала», что перед расстрелом солдаты сказали тем, кого вывели из подвала: «Зачем вы здесь остались?
    Раз вы решили остаться, то вы боевики [так россияне называли бойцов Вооружённых сил Ичкерии]. …
    Ваш город восстановлению не подлежит, мы его сравняем с землей и вас вместе с ним»(Citation: 1581).

    3 мая 2000 года российская прокуратура Грозного завела дело о массовом убийстве в Катаяме солдатами 205-й бригады. 4 октября 2007 года Европейский суд по правам человека по жалобе Елены Гончарук признал Россию ответственной за это нападение и за то, что его не расследовали(Citation: 760).

    5 февраля 2000 года в Новых Алдах, посёлке на южной окраине Грозного, российские омоновцы и солдаты убили не меньше 46 мирных чеченцев, оставшихся в своих домах(Citation: 1581).

    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что с сентября 1999 по март 2000 года российские военные нападали на «гражданское население Чечни как таковое» и выбирали жертв без разбора, по одному признаку - люди жили в Ичкерии.
    По их выводу, командующий Казанцев, командующий российскими войсками на западе Ичкерии Шаманов, комендант пункта пропуска «Кавказ-1» Хрулёв и командующий российской авиацией на Северном Кавказе генерал Михайлов сознательно создавали условия, рассчитанные на уничтожение части чеченцев.
    Пока командование оккупационными войсками не выпускало людей или выпускало их с перерывами, российские лётчики и артиллеристы, по подсчёту авторов, убили не меньше 1002 мирных чеченцев, включая умерших от ран, и ранили не меньше 461.
    По словам авторов, на деле жертв гораздо больше(Citation: 1581).

    Российские войска завершили захват Ичкерии к концу марта 2000 года(Citation: 1581).
    После этого оккупанты стали выбирать жертв среди чеченцев по селу, полу и возрасту, например мужчин при облавах (подробнее: «Террор»)(Citation: 1581). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
