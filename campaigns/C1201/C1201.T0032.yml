  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские чиновники и милиционеры не регистрировали чеченцев, высылали их из Москвы и не выдавали им документов, а тюремное ведомство России отправляло осуждённых чеченцев в дальние колонии.

    21 сентября 1999 года исполнявший обязанности главы правительства Москвы Шанцев постановлением № 875 велел милиции разыскивать приезжих, не получивших новую регистрацию, держать их в отделах и высылать из города(Citation: 694). 28 сентября мэр Москвы Лужков распоряжением № 1057 разрешил миграционной службе принимать заявления на статус беженца или вынужденного переселенца только от тех, кто полгода прожил в Москве с регистрацией у близких родственников.
    Без регистрации и статуса чеченские беженцы оставались без пенсий, медицинской помощи и школы(Citation: 694).

    Сотрудники московской милиции неофициально рассказали правозащитникам «Мемориала» и «Гражданского содействия», что начальник милиции Москвы Куликов устно приказал задерживать и не регистрировать приезжих с Кавказа, в первую очередь чеченцев.
    Милиция регистрировала почти всех приезжих русских, а недавно приехавшим чеченцам отказывала, даже если у них были все документы(Citation: 694).

    Милиционеры отбирали у чеченцев свидетельства о регистрации или ставили на них штамп об отмене.
    По словам начальника паспортного отдела московской милиции Серова, задержанный без регистрации подписывал обязательство уехать из Москвы за три дня, а не уехавшего высылали приказом начальника районного отдела милиции(Citation: 694).

    Весной 2000 года МВД России письмом запретило «в целях пресечения бегства террористов» (так россияне называли защитников Ичкерии) оформлять новые документы «лицам, имеющим регистрацию на территории Чеченской Республики».
    Без паспорта больницы не принимали чеченцев, а оккупанты на блокпостах не пропускали их обратно в Ичкерию(Citation: 1661).

    В 2001 году журналистка «Новой газеты» Анна Политковская писала, что МВД России особой инструкцией запретило выдавать чеченцам загранпаспорта(Citation: 1759).

    При обысках сёл Ичкерии, которые российские силовики официально называли «специальными операциями по проверке регистрации людей по месту жительства», военные и милиционеры задерживали чеченцев, у которых в паспорте стояла регистрация в другом месте или паспорт заменяла справка (подробнее: «Система фильтрационных лагерей»)(Citation: 1512).

    10 марта 2006 года в России вступил в силу закон «О противодействии терроризму».
    По этому закону российские силовики на время «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии) могли ограничивать права людей, прослушивать телефоны, читать переписку и отключать связь, а предельного срока у таких ограничений не было(Citation: 286).
    В Чеченской Республике этот режим действовал до 16 апреля 2009 года(Citation: 901).

    Законом от 9 мая 2005 года № 47-ФЗ Россия разрешила тюремному ведомству (ФСИН) самому выбирать колонию для осуждённых по ряду статей, а законом от 19 июля 2007 года № 142-ФЗ - отправлять осуждённых в любой регион, а не в ближайший.
    ФСИН отправляла подавляющее большинство осуждённых в Чеченской Республике в отдалённые северные регионы России(Citation: 1194).

    7 октября 1999 года МЧС России сообщило, что зарегистрировало в Ингушетии, подконтрольной России республике к западу от Ичкерии, 43 582 из больше чем 146 тысяч чеченцев, которые туда бежали(Citation: 696).
    В октябре отделение Федеральной миграционной службы России там не принимало у чеченских беженцев заявлений на статус вынужденного переселенца, без которого они не получали пособий(Citation: 924). 8 ноября 1999 года трое милиционеров отдела «Марьинский парк» в Москве забрали паспорт у чеченца Руслана Истамалова и задержали его за то, что у него нет паспорта.
    Наутро милиционеры вернули Руслану Истамалову паспорт, оштрафовали за «мелкое хулиганство» и отпустили(Citation: 694).

    11 января 2000 года командующий Объединённой группировкой российских войск Казанцев объявил, что беженцами будут считаться только дети до 10 лет, старики старше 60 лет и женщины, а командование оккупационными войсками запретило выпускать из Ичкерии мужчин от 10 до 60 лет (подробнее: «Транспортная блокада»)(Citation: 1494)(Citation: 1476).
    В мае 2000 года командир роты Омского кадетского корпуса, военной школы Министерства обороны России в Сибири, не допустил до экзаменов четверых подростков-чеченцев за то, что они чеченцы. 25 мая их отправили домой без документов, и до дома они добрались только 9 июня(Citation: 1692).

    В феврале 2001 года Россия перестала регистрировать чеченцев, которые бежали в Ингушетию, и считала их не беженцами, а приехавшими на заработки (подробнее: «Принудительное возвращение беженцев»)(Citation: 1381).

    23 октября 2002 года группа чеченцев захватила заложников в театральном центре на Дубровке в Москве.
    После этого чеченцам в паспортных столах московской милиции говорили об устном приказе не регистрировать их «ни при каких обстоятельствах».
    Работник паспортной службы милиции подтвердил этот приказ правозащитникам «Гражданского содействия».
    Начальник одного из паспортных столов негласно велел своим сотрудникам регулярно обходить адреса, где жили чеченцы.
    Милиционеры проверяли документы на улицах и в метро, а чеченцев без регистрации увозили в отделы, обыскивали, фотографировали, снимали отпечатки пальцев и отбирали деньги. 30 октября около 15 милиционеров увезли Аэлиту Шидаеву из кафе, где она работала, в отдел «Марьинский парк».
    Семь часов милиционеры запугивали её, чтобы она призналась в связях с теми, кто захватил заложников, и, по словам её матери, пытались порвать её свидетельство о регистрации: «Нам здесь чеченцы не нужны».
    К ночи её отпустили, потому что мать подняла журналистов и правозащитников.
    Мать Аэлиты, Макка Шидаева, 14 ноября рассказала Human Rights Watch: «…мы убежали… в Москву, от этого беспредела, который творится в Чечне… все, что происходит в Чечне, уже началось в Москве».
    Милиция трижды отказала Зареме Дадаевой продлить регистрацию, а директор школы велела не приводить её детей на уроки без регистрации и потом извинилась. 3 декабря, после вмешательства «Гражданского содействия», начальник отдела милиции зарегистрировал её семью.
    Милиционеры штрафовали хозяев квартир за чеченцев без регистрации и требовали их выселить. 24 февраля 2003 года Human Rights Watch написала в записке для Комитета ООН по ликвидации расовой дискриминации, что в подавляющем большинстве случаев чеченцы без регистрации в Москве не могли оформить свой статус(Citation: 283).

    С декабря 2005 года администрация колонии ИК-5 в Нижнем Тагиле, городе на Урале, три месяца держала в одиночных камерах молодых чеченцев и объявила, что так будет «с чеченцами до конца срока».
    Директор ФСИН Калинин отказал перевести их в колонии ближе к Ичкерии, а одного из них ФСИН отправила в колонию для особо опасных преступников с несколькими судимостями(Citation: 2063).

    Правозащитники Amnesty International в декабре 1999 года писали, что война в Ичкерии и преследование чеченцев московскими чиновниками и милицией говорят об участии правительства России в «кампании по наказанию целой этнической группы»(Citation: 694).
    В марте 2003 года Комитет ООН по ликвидации расовой дискриминации написал, что его беспокоят сообщения о том, как в России через регистрацию ущемляют в правах людей отдельных народов и отказывают чеченцам, бежавшим из Ичкерии, в статусе вынужденного переселенца(Citation: 784).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали о «систематической практике дискриминации этнических чеченцев, проживавших в регионах России».
    По их словам, чеченцам отказывали в статусе вынужденного переселенца и в регистрации, а милиционеры запугивали хозяев жилья и работодателей(Citation: 1581).

    7 октября 2008 года Зубово-Полянский районный суд в Мордовии, подконтрольной России республике в Поволжье, удовлетворил семь из восьми просьб осуждённых о досрочном освобождении.
    Заре Муртазалиевой, чеченке, приговорённой в Москве в 2005 году к восьми годам по обвинению в подготовке теракта, суд отказал, потому что она «виновной себя… не признала» и у неё было 13 взысканий от администрации колонии(Citation: 1193).
