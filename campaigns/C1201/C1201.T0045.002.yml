  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты уничтожали архивы, библиотеки и книги чеченцев.

    Российские лётчики бомбёжками Грозного в 1999-2000 годах ещё сильнее повредили государственный архив Чеченской Республики, почти уничтоженный в первую войну(Citation: 1470).
    К концу сентября 2000 года, после двух войн, в Грозном из 30 библиотек осталось шесть, а в Национальной библиотеке Чеченской Республики, самой большой на Северном Кавказе, из 2,5 миллиона книг уцелели не больше двух тысяч(Citation: 1470).

    При облавах в сёлах российские военные взрывали сейфы школ и сельских администраций.
    Солдаты уничтожали школьные архивы и записи о рождениях, браках и смертях(Citation: 814)(Citation: 1803).
    Оккупанты разоряли школьные библиотеки, оскверняли Коран и изымали у чеченцев религиозную литературу (подробнее: «Запрет религиозной практики коренного народа»)(Citation: 814)(Citation: 1774)(Citation: 1581).

    3 июля 2001 года российские военные и милиционеры командующего оккупационными войсками Молтенского блокировали Ассиновскую, станицу на западе Ичкерии.
    Оккупанты начали там «зачистку» (так россияне называли обыски домов и задержания чеченцев).
    Солдаты окружили школу № 1, взорвали классы и два сейфа и забрали из сейфов аттестаты выпускников (подробнее: «Мародерство»).
    Директор школы Медина Гудиева в жалобе в администрацию станицы писала: «Весь школьный архив уничтожили, личные дела сотрудников и учащихся, классные журналы, протоколы…
    В библиотеке и столовой тоже все разломали и разграбили».
    Солдаты сказали директору, что выполняют приказ.
    По подсчёту главы администрации станицы, без аттестатов остались 48 выпускников(Citation: 814).

    С 30 декабря 2001 года по 3 января 2002 года при облаве в Цоцин-Юрте, селе к востоку от Грозного, российские военные свалили в мечети в кучу книги и Коран и испражнились на них (подробнее: «Уничтожение святынь и некрополей»)(Citation: 1581)(Citation: 1774).

    С 21 мая по 11 июня 2002 года войска генерала Броницкого держали в блокаде Мескер-Юрт, село к юго-востоку от Грозного (подробнее: «Террор»)(Citation: 1581).
    Военные взломали сейфы в здании сельской администрации, на глазах у её работников сожгли архив и унесли сельскую кассу(Citation: 1473).
    Анна Политковская, побывавшая в селе, писала в «Новой газете» 1 июля 2002 года: «уничтожили весь сельский архив: кто когда в Мескер-Юрте родился, умер, женился.
    И теперь никто никогда не сможет получить справку, что дед его когда-то тут появился на свет или сам он...»
    В сельской амбулатории оккупанты расстреляли бланки свидетельств о рождении.
    Учитель математики Нажмуддин Магамадов рассказал журналистке: «Хотели пройти в школьную библиотеку, но я встал на дверях и сказал: „Сначала расстреляйте меня“».
    Военные не вошли в библиотеку, и она уцелела(Citation: 1803).

    В 2001-2002 годах оккупанты уничтожали архивы и библиотеки при облавах в сёлах, а с конца 2002 года облавы стали реже (подробнее: «Террор»)(Citation: 1581). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
