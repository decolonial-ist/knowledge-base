  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия объявила «перемирие» на праздники православных и мусульман, а оккупационные войска наступали на центр Грозного и бомбили горное село Махкеты.

    31 декабря 1999 года, в день, когда Путин стал исполняющим обязанности президента России после отставки Ельцина, Россия объявила «перемирие» на православное Рождество, 7 января, и до конца Рамадана, священного месяца мусульман, 8 января 2000 года(Citation: 765)(Citation: Newsline - January 10, 2000 2000).

    4 января 2000 года российская армия начала новое наступление на центр Грозного, куда ещё не прорвалась (подробнее: «Военная интервенция»).
    На следующий день Вооружённые силы Ичкерии контратаковали оккупантов на северной окраине Грозного и освободили часть Ханкалы, посёлка на восточной окраине города(Citation: 765). 5 января Россия отвергла предложение президента Ичкерии Аслана Масхадова о трёхдневном прекращении огня(Citation: 765).
    В тот же день Манилов, первый заместитель начальника Генерального штаба России, сказал в Москве агентству Reuters, что перемирия быть не может(Citation: Newsline - January 6, 2000 2000). 6 января генерал Шаманов, командующий западной группировкой оккупационных войск, открыто выступил против «перемирия» на Рождество, к которому призывал Путин(Citation: 2196). 7 января генерал Трошев, командующий восточной группировкой оккупационных войск, объявил в Моздоке, городе в подконтрольной России Северной Осетии, что штурм Грозного приостановили, но не прекратили. 8 января российские военные сказали агентству Reuters, что их войска у Грозного меняют расстановку(Citation: Newsline - January 10, 2000 2000).
    В тот же день исполняющий обязанности президента России Путин объявил короткую паузу в бомбёжках Грозного, по его словам, ради Рамадана(Citation: 2196).
    Андрей Бабицкий, корреспондент Радио Свобода, 8 января записал в дневнике в Грозном: «Говорят, что объявлено рождественское перемирие.
    Но в самом центре Грозного, на площади Минутка, из самоходных артиллерийских орудий были обстреляны жилые массивы»(Citation: 1581).
    Неизвестно, сколько таких обстрелов совершили оккупационные войска в Грозном с 31 декабря 1999 по 8 января 2000 года.
    Через девять дней, 17 января 2000 года, оккупанты снова начали штурмовать Старопромысловский район столицы(Citation: 1581).

    5 января 2000 года, в дни «перемирия», российские лётчики бомбили Махкеты, горное село на юго-востоке Ичкерии, и убили 21 чеченца (подробнее: «Неизбирательные нападения»)(Citation: 1581).

    16-20 января 2000 года исполняющий обязанности президента России Путин объяснил делегации Парламентской ассамблеи Совета Европы, что не видит смысла объявлять прекращение огня, потому что Вооружённые силы Ичкерии воспользуются им и укрепят позиции.
    По словам Путина, в «перемирие» на Рождество и Рамадан защитники внезапно атаковали российские войска(Citation: 765). 14 января 2005 года президент Ичкерии Аслан Масхадов приказал защитникам прекратить нападения на оккупантов.
    Россия ответила заочным арестом, а 8 марта 2005 года сотрудники ФСБ убили Аслана Масхадова (подробнее: «Переговоры как прикрытие нападения»)(Citation: 2002)(Citation: 2017). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
