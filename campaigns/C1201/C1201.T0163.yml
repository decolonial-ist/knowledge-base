  ru: |-
    Потерпев поражение в Первой Русско-Чеченской войне, Россия подписала с Чеченской Республикой Ичкерия фиктивный мир в Хасавюрте в 1996 году и в Москве в 1997 году, а с весны 1999 года тайно перебрасывала войска к границам Ичкерии и называла её власть и армию «бандитами» и «террористами»(Citation: 27)(Citation: 667)(Citation: 825).
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября российская армия вторглась в Ичкерию(Citation: 27).
    Оккупанты тайно закапывали, взрывали, уродовали и выставляли напоказ тела убитых ими чеченцев, продавали их семьям, а тела тех, кого Россия объявила «террористами», по закону не отдавали родным.

    Российские военные, милиционеры и сотрудники ФСБ увозили задержанных чеченцев в свои части, а убитых тайно закапывали на территории частей и рядом(Citation: 1188).
    Правозащитники «Мемориала» находили тела пропавших без вести у расположения войск возле Старых Атагов и Дуба-Юрта, сёл к югу от Грозного, и в садах у Урус-Мартана, города к юго-западу от столицы.
    Позже такие могилы находили у Ханкалы, главной базы оккупационных войск на восточной окраине города(Citation: 1188).

    Чтобы родные не опознали убитых, оккупанты взрывали и сжигали тела.
    Российские военные называли «сникерсами» тротиловые шашки, которые подрывали на теле задержанного чеченца, а такую казнь - «расстрелом со сникерсами».
    Правозащитники насчитали не меньше 45 таких изуродованных тел ранее задержанных чеченцев, которых родные всё же опознали(Citation: 1581).

    Российские офицеры и солдаты требовали с семей убитых деньги или оружие за тело или за место могилы.
    К Ханкале родные попадали только через посредников, которые торговали задержанными и телами убитых(Citation: 1564).

    11 декабря 2002 года президент России Путин подписал закон № 170-ФЗ, который запретил отдавать семьям тела людей, объявленных убитыми при попытке теракта, и сообщать место их могилы.
    Закон не требовал решения суда о вине и распространялся на всех, кого ещё не похоронили(Citation: 1567). 20 марта 2003 года правительство России постановлением № 164 велело хоронить таких людей на месте смерти, а родным сообщать только, в каком загсе получить свидетельство о смерти(Citation: 791).

    29 октября 1999 года у станицы Горячеисточненская к северу от Грозного российская артиллерия обстреляла колонну машин с беженцами (подробнее: «Ложный коридор»)(Citation: 1581).
    Чеченцы не успели забрать часть тел.
    На четвёртый день российские военные свалили эти тела и сгоревшие машины в яму на бывшем асфальтовом заводе и укатали бронетехникой.
    В июне 2000 года яму вскрыли(Citation: 1581)(Citation: 1602).
    В декабре 1999 года в Алхан-Юрте, селе к юго-западу от Грозного, офицеры 15-го полка российской армии, которым тогда командовал начальник штаба Воронов, пять дней не давали мулле Хаджи-Вахе Мурадову похоронить сына Ису, убитого российскими солдатами.
    Российские офицеры разрешили похоронить Айнди Альтемирова, обезглавленного на позиции российских войск у села, только через три дня после убийства(Citation: 770)(Citation: 1581).

    17 января 2000 года на блокпосту 160-го танкового полка у Дуба-Юрта российские военные расстреляли раненого Рамзана Базаева (подробнее: «Убийство пленных и задержанных»).
    Российский подполковник с блокпоста потребовал за тело 5000 долларов, и село выкупило тело за 1500(Citation: 1210). 27 января российские военные увезли из Старых Атагов трёх братьев Гириевых и ещё одного чеченца в часть 138-й бригады российской армии. 14 июня их тела со следами пыток нашли закопанными слоями на месте, где солдаты этой части 30 января копали экскаватором траншею(Citation: 1210).

    С февраля 2000 года у Танги-Чу, села к юго-западу от Грозного, стояла группировка оккупационных войск «Запад» под командованием генерала Шаманова: 245-й мотострелковый и 160-й танковый полки и части 100-й дивизии внутренних войск МВД России (предшественников современной Росгвардии)(Citation: 1210). 2 февраля 2000 года при «зачистке» (так россияне называли обыски домов и задержания чеченцев) Алхан-Калы, села к западу от Грозного, российские военные увезли из мечети тела больше 30 бойцов Вооружённых сил Ичкерии, которых чеченцы уже подготовили к мусульманскому погребению.
    Так же военные забрали тела из мечетей и с кладбищ Шаами-Юрта, Катыр-Юрта и Гехи-Чу(Citation: 1210)(Citation: 1503).
    Виса Кунгаев из Танги-Чу 1 августа 2000 года рассказал правозащитникам «Мемориала», что в феврале его односельчанка Зула Магомадова видела, как военные стаскивали к краю поля, где стояли войска, трупы, привязанные проволокой к бронетехнике. 19 июля чеченцы из Танги-Чу вскрыли яму 3 на 15 метров за блокпостом 100-й дивизии в двух километрах от села.
    Под брезентом в три слоя лежали 74 тела, в основном увезённые военными из мечетей Алхан-Калы, Шаами-Юрта и Гехи-Чу.
    Родные опознали 18 человек.
    Хазан из Шаами-Юрта нашла в яме брата, которого российские военные задержали на окраине села в феврале, когда он шёл за водой.
    По словам Висы Кунгаева, у села были ещё семь ям, и одну из них, с семью телами, военные не давали вскрыть: «Военные в обмен на это требуют 23 автомата»(Citation: 1503). 22 апреля 2009 года уполномоченный по правам человека оккупационной администрации Нухажиев попросил военных следователей расследовать эти захоронения, но следователи дел не возбудили(Citation: 1194).

    5 февраля 2000 года российские солдаты и бойцы ОМОНа при «зачистке» Новых Алдов, посёлка на южной окраине Грозного, сжигали тела убитых ими чеченцев в подвалах, а убитым клали паспорта на лица и в рот (подробнее: «Массовые убийства гражданских»)(Citation: 817)(Citation: 280)(Citation: 951).
    В ночь на 27 марта 2000 года командир 160-го танкового полка Буданов задушил 18-летнюю Эльзу Кунгаеву, дочь Висы Кунгаева из Танги-Чу, и приказал подчинённым тайно закопать тело (подробнее: «Сексуализированное насилие»)(Citation: 1581)(Citation: 1535).
    Российские следователи обвинили подчинённых Буданова в надругательстве над телом и прекратили дело против них по амнистии (подробнее: «Безнаказанность исполнителей»)(Citation: 1581). 15 сентября 2000 года российские контрактники задержали на блокпосту у Джалки, села к востоку от Грозного, трёх чеченцев. 20 сентября родные нашли их тела в лесу: на одну могилу убийцы положили мёртвую собаку, на другую - голову коровы, а рядом поставили мину с натянутой проволокой, которая ранила двоих чеченцев, искавших пропавших без вести(Citation: 1210)(Citation: 1503).

    24 февраля 2001 года в дачном посёлке «Здоровье» меньше чем в километре от Ханкалы нашли тела 51 человека, среди них не меньше 16 чеченцев, пропавших без вести после задержания российскими силовиками (подробнее: «Убийство пленных и задержанных»)(Citation: 813). 10 марта 2001 года российская прокуратура Чеченской Республики, которой руководил Чернов, без объявления похоронила 34 неопознанных тела, не сохранив ни одежды, ни верёвок, ни пуль(Citation: 813). 15 мая 2001 года российские военные вытащили из реки в Алхан-Кале обезглавленное тело Абдурахмана Лорсанова, которого они задержали 29 апреля, положили его на дороге и грозили прохожим так же поступить с остальными чеченцами(Citation: 1581)(Citation: 778).

    С 21 мая по 11 июня 2002 года при облаве в Мескер-Юрте, селе к юго-востоку от Грозного, российские военные генерала Броницкого взорвали тела трёх убитых ими сельчан(Citation: 1473)(Citation: 1581). 4 июня солдаты выбросили из машины на окраине села тело Адама Темерсултанова, которого 30 мая увели из мечети(Citation: 1462).
    В декабре 2002 года российские военные увели из дома в Самашках, селе на западе Ичкерии, двух братьев Хаджиалиевых, а 19 декабря отец собрал на поле у фермы их останки: военные обезглавили его сыновей и взорвали тела. 6 ноября 2008 года Европейский суд по правам человека признал, что братьев убили российские военные(Citation: 1174).

    8 марта 2005 года в селе Толстой-Юрт к северу от Грозного сотрудники ФСБ России убили Аслана Масхадова, избранного президента Ичкерии (подробнее: «Переговоры как прикрытие нападения»)(Citation: 791)(Citation: 1483).
    В тот же день оккупанты увезли тело в Ханкалу, а российские телеканалы показали снимки тела с голым торсом(Citation: 791).
    Вечером представитель российского оперативного штаба на Северном Кавказе генерал Шабалкин сказал агентству «Интерфакс», что выдача тела родным «не стоит в повестке вообще»: «Есть вступивший в силу и действующий закон, запрещающий выдавать тела террористов»(Citation: 1483). 25 марта следователь Генеральной прокуратуры России постановил похоронить тело и поручил похороны оккупационному правительству. 29 марта вдова и дети Аслана Масхадова попросили отдать им тело. 4 апреля Хазиков, исполнявший обязанности начальника управления Генеральной прокуратуры России на Северном Кавказе, отказал, сославшись на российский закон о борьбе с терроризмом и постановление № 164(Citation: 791). 6 июня 2013 года Европейский суд по правам человека признал, что Россия нарушила право семьи на уважение частной и семейной жизни: запрет навсегда отрезал вдову с детьми от могилы.
    Россия так и не отдала семье тело и не назвала место захоронения(Citation: 791).

    14 сентября 2005 года силовики Кадырова-младшего отрезали голову у тела защитника Ичкерии Шамиля-Хаджи Мускиева после боя в Аргуне и выставили её на трубе у моста в Цоцин-Юрте, селе к востоку от Грозного.
    Два дня силовики не давали хоронить тела Шамиля-Хаджи Мускиева и его брата(Citation: 286).
    В ночь на 27 июля 2006 года силовики под руководством Гаибова, помощника председателя оккупационного правительства Кадырова-младшего, убили в засаде у Курчалоя, села к юго-востоку от Грозного, защитника Ичкерии Хож-Ахмеда Душаева.
    Подчинённые Гаибова выставили голову Хож-Ахмеда Душаева на газовой трубе у отдела милиции и больше двух часов снимали её на телефоны(Citation: 286).

    Организация «Врачи без границ» в докладе 22 ноября 2000 года назвала вымогательство и торговлю трупами среди последствий террора российских войск против мирных чеченцев(Citation: 1381).

    В ноябре 2008 года заместитель министра здравоохранения России Скворцова ответила уполномоченному по правам человека Нухажиеву, что создавать в республике лабораторию для опознания тел нецелесообразно, и сослалась на нехватку денег и специалистов(Citation: 1195)(Citation: 1167).
