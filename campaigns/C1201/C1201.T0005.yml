description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия выдавала вторжение за вынужденную оборону от «террористов», а вину за взрывы жилых домов в российских городах и за войну перекладывала на Ичкерию.

    23 сентября 1999 года президент России Ельцин секретным указом № 1255с создал для «контртеррористических операций» (так Россия до 16 апреля 2009 года называла свою войну против независимой Ичкерии) Объединённую группировку из войск всех российских силовых ведомств (подробнее: «Военная интервенция»)(Citation: 672)(Citation: 901).
    Российское руководство объявляло, что защищает целостность России и борется с терроризмом(Citation: 1441).
    Председатель правительства, а затем президент России Путин, министр иностранных дел Иванов, руководители ФСБ говорили об угрозе России из Ичкерии российским агентствам и телеканалам, делегатам Парламентской ассамблеи Совета Европы (ПАСЕ), журналистам на пресс-конференциях за рубежом(Citation: 1548)(Citation: 765)(Citation: 1381).

    23 сентября 1999 года, через два дня после начала бомбёжек Грозного, глава пресс-службы ФСБ России Зданович сказал в передаче «Герой дня» на телеканале НТВ, что ФСБ установила всех, кто взорвал жилые дома в Буйнакске, Москве и Волгодонске: «Ни одного этнического чеченца среди них нет».
    Зданович добавил, что исполнители, скорее всего, скрылись в Ичкерии(Citation: 1557). 24 сентября президент Ичкерии Аслан Масхадов призвал Россию прекратить бомбёжки, а 25 сентября отверг её обвинения и попросил международные организации прислать наблюдателей, чтобы те убедились, что баз вооружённых групп в республике нет.
    По сообщению «Независимой газеты» от 25 сентября, Вооружённые силы Ичкерии получили приказ не стрелять по российским бомбардировщикам(Citation: 1463)(Citation: 1465). 27 сентября председатель правительства России Путин после встречи с президентом Ельциным, по сообщению агентства РИА «Новости», сказал о людях, которые, по его словам, проходили военную подготовку в Ичкерии: «Когда они увидели, что Россия способна эффективно защищаться, то нанесли удары по нашим городам - Владикавказу, Буйнакску, Москве и Волгодонску.
    Сейчас мы уже вынуждены защищать жизнь наших граждан - нам не оставили выбора»(Citation: 1548).
    В январе 2000 года бывший председатель правительства России Степашин рассказал «Независимой газете», что войска вышли бы к реке Терек на севере Ичкерии, даже если бы взрывов в Москве не было (подробнее: «Военная интервенция»)(Citation: 698).

    23 октября 1999 года российские войска перекрыли главную дорогу из Ичкерии в подконтрольную России Ингушетию, последний путь, по которому чеченцы бежали от бомбёжек и обстрелов. 24 октября представитель ФСБ объяснил перекрытие дороги тем, что под видом беженцев в Ингушетию проникают террористы (подробнее: «Транспортная блокада»)(Citation: 931).

    17 января 2000 года исполняющий обязанности президента России Путин сказал делегации ПАСЕ, что взрывы домов в августе и сентябре 1999 года убили 1500 человек.
    В хронике событий в докладе ПАСЕ сказано, что взрывы в Москве и Волгодонске убили 293 человека(Citation: 765). 27 января министр иностранных дел России Иванов сказал депутатам ПАСЕ в Страсбурге, что Россия защищает свою границу с Европой от нападений террористов, которые угрожают всем европейцам(Citation: 1381). 20 марта исполняющий обязанности президента Путин заявил в Грозном, что если Россия уйдёт из республики, там появится плацдарм для нападения на Россию(Citation: 1540). 23 октября 2000 года президент России Путин назвал нападение вооружённых групп на подконтрольный России Дагестан летом 1999 года «неприкрытой и ничем не спровоцированной агрессией» против России(Citation: 825).

    14 июля 2001 года исполнявший обязанности командующего оккупационными войсками Молтенской заявил, что жёсткость облав в селе Серноводск и станице Ассиновской на западе Ичкерии спровоцировали сельчане (подробнее: «Карательные экспедиции»). 18 июля президент России Путин объяснил облавы тактикой радикалов, которые, по его словам, вызывают ответный удар по мирным чеченцам(Citation: 814).
    После терактов в США 11 сентября 2001 года президент России и чиновники Кремля стали выдавать войну в Ичкерии за часть мировой борьбы с терроризмом, которую возглавили США(Citation: 1381)(Citation: 816).

    15 января 2002 года президент России Путин сравнил руководство Ичкерии с афганскими талибами и заявил, что Россия вправе применять против него все средства, если законных не хватит(Citation: 1381). 27 марта 2002 года командующий оккупационными войсками Молтенской в приказе № 80 написал, что преступления российских военных против мирных чеченцев служат «поводом для ведения информационной войны против России»(Citation: 946).
    Заместитель генерального прокурора России Колмогоров в ответе депутату российского парламента Куликову, опубликованном 14 мая 2002 года, приписал взрывы домов в Москве и Волгодонске бойцам Вооружённых сил Ичкерии, хотя ни один из названных в письме людей не был чеченцем(Citation: 1104). 23 октября 2002 года группа чеченцев захватила заложников в театральном центре на Дубровке в Москве, руководство Ичкерии осудило захват, а 26 октября спецназ ФСБ пустил в зал газ и убил всех 40 захватчиков (подробнее: «Убийство пленных и задержанных»)(Citation: 1114)(Citation: 1581). 28 октября президент России Путин заявил, что международный терроризм «наглеет», и пригрозил ударами «по всем местам, где находятся сами террористы»(Citation: 1493).

    Парламентская ассамблея Совета Европы в докладе 4 апреля 2000 года писала, что руководство России объявило Ичкерию центром международного терроризма и угрозой России и Европе, а применение армии в таком масштабе оправдывало запасами оружия у защитников(Citation: 1446).
    В рекомендации Европейского парламента от 26 февраля 2004 года сказано, что изображать войну как столкновение террористов с силами правопорядка - значит её искажать(Citation: 551).
    Правозащитники «Мемориала» в 2005 году писали, что российское руководство выдавало борьбу с похищениями и захватом заложников за одно из главных оправданий нового вторжения, а российские войска брали заложников (подробнее: «Захват заложников»)(Citation: 820).
    Human Rights Watch в марте 2005 года писала, что Россия пытается представить войну в Ичкерии вкладом в мировую борьбу с терроризмом(Citation: 819).

    Правозащитники «Мемориала» пишут, что причастность чеченцев к взрывам домов в сентябре 1999 года не доказана: за взрывы в Москве и Волгодонске российский суд в 2004 году приговорил к пожизненному заключению двух карачаевцев(Citation: 27).
    В 2009 году правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева писали, что Россия объявила поводами войны взрывы и нападение вооружённых групп на Дагестан, а все утверждения о причастности к взрывам чеченских командиров держатся только на признаниях обвиняемых(Citation: 1581).

    В сообщении государственного агентства РИА «Новости» 16 апреля 2009 года, в день отмены режима «контртеррористической операции», сказано, что российские войска «вошли в Чечню, выбив из соседнего Дагестана вторгшиеся туда отряды».
    О бомбёжках Грозного с 21 сентября 1999 года в сообщении не сказано(Citation: 292).
