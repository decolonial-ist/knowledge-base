description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия обещала бойцам Вооружённых сил Ичкерии безопасность и амнистию за сдачу, а оккупанты расстреливали тех, кто сдался.

    В декабре 1999 года командование оккупационными войсками обещало в листовках безопасность бойцам Вооружённых сил Ичкерии, которые сдадут оружие, а депутаты в Москве объявили им амнистию (подробнее: «Ложные гарантии безопасности»)(Citation: 1504)(Citation: 1562).
    Оккупанты обыскивали сдавшихся у своих позиций, переписывали и снимали на видео(Citation: 1581).
    Российские телеканалы показывали сдавшихся бойцов, которые потом пропали без вести(Citation: 1210).
    Военные убивали часть сдавшихся на месте сдачи, а остальных увозили на свои базы и в тюрьмы (подробнее: «Убийство пленных и задержанных»)(Citation: 1581).

    4 марта 2000 года бойцы Вооружённых сил Ичкерии прорвались в Гой-Чу, село к юго-западу от Грозного.
    С 7 по 20 марта российские войска штурмовали и почти полностью разрушили село (подробнее: «Неизбирательные нападения»)(Citation: 1129)(Citation: 1581)(Citation: 1474).
    Военные через мегафоны обещали амнистию защитникам, оставшимся в селе, и предложили им сдаться(Citation: 1474). 20 марта около полудня защитники, окружённые в разрушенных домах на окраине, начали сдаваться под гарантию безопасности от командования объединённой группировки российских войск.
    Генерал Лабунец, командующий внутренними войсками МВД России (предшественниками современной Росгвардии) на Северном Кавказе, принимал сдачу в первые часы(Citation: 1581).
    На видеозаписях российских военных к их позициям выходят не меньше 100 человек, а тяжелораненого Тауса Богураева, бывшего главу Наурского района Ичкерии, выносят из развалин на одеяле(Citation: 1581)(Citation: 1210).
    Генерал Трошев, первый заместитель командующего российскими войсками в Ичкерии, писал о сдавшихся в воспоминаниях: «Рассчитывали, наверное, что, вырвавшись из села, уйдут от возмездия»(Citation: 1129).
    Около 16:30 военные отделили 25 сдавшихся, отвели в соседний овраг и велели лечь на склоне.
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева пишут, что трое или четверо военных «открыли огонь из автоматов и пулемета сначала по ногам, затем – и по телам пленных».
    Стрелявшие убили на месте 12 или 13 человек, большинство остальных ранили.
    Четверых уцелевших, среди них Беслана Бучигова, военные заставили копать могилу, сказав, что она будет общей с расстрелянными.
    Получив приказ по рации, стрелявшие увели выживших обратно к остальным сдавшимся(Citation: 1581).

    В начале апреля 2000 года российские военные пустили в Гой-Чу сельчан и родных сдавшихся.
    Сельчане нашли в овраге тела расстрелянных и похоронили их на кладбище соседнего села Гойское(Citation: 1210)(Citation: 1581).
    Военные сняли на видео живыми среди сдавшихся Беслана Сардалова, Арсена Дудаева, Асламбека Ахмадова, Хасана Чучиева и Магомеда Нальгиева, а позже их нашли убитыми.
    Мёртвым нашли и Беслана Бучигова, который копал могилу в овраге.
    Тело Тауса Богураева со следами пыток и отрубленной головой лежало у села (подробнее: «Надругательство над мёртвыми»)(Citation: 1581)(Citation: 1210).
    В двух разрушенных домах у места сдачи нашли восемь тел в одном и десять в другом.
    Сельчане и российские спасатели, которые выносили тела, считали расстрелянных сдавшимися(Citation: 1210).
    Военные увезли живых сдавшихся в Ханкалу, главную базу оккупационных войск на восточной окраине Грозного, и посадили в две тесные машины для перевозки заключённых.
    Там их пытали.
    Не меньше десяти человек умерли в этих машинах от давки и духоты (подробнее: «Убийство пленных и задержанных»)(Citation: 1581).
    До тюрем в Таганроге и Новочеркасске военные довезли живыми 48 сдавшихся.
    Двенадцать из них освободили по амнистии, и родные говорят, что заплатили за это выкуп.
    Суды в Ростове-на-Дону приговорили больше двадцати сдавшихся к трём с половиной годам заключения за то, что они воевали в Вооружённых силах Ичкерии(Citation: 1581).

    Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году подсчитали, что из 237 бойцов Вооружённых сил Ичкерии, которые оказались во власти оккупантов, не меньше 35 сдавшихся российские военные казнили без суда(Citation: 1581).
    Правозащитники «Мемориала» в 2012 году писали, что в феврале и марте 2000 года российские войска захватили или приняли сдачу сотен бойцов Ичкерии, и многих из них военные убили или держали в таких условиях, что люди умирали.
    «Мемориал» внёс в свою книгу о пропавших без вести и убитых чеченцах сдавшихся в Гой-Чу, которых военные убили сразу или в первые пять суток в Ханкале(Citation: 1210).

    Расстрелы сдавшихся, которые описали правозащитники, пришлись на бои в феврале и марте 2000 года(Citation: 1581).
    К концу марта российские войска захватили города и сёла республики, а Вооружённые силы Ичкерии, вынужденные отступить, к лету перешли к партизанской войне(Citation: 1581).
    Российские силовики пытали и убивали бойцов, захваченных в плен в этой войне (подробнее: «Убийство пленных и задержанных»). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
