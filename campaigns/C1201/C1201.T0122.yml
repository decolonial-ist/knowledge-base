description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты не пускали к чеченцам врачей и гуманитарную помощь, держали раненых на блокпостах и врывались в больницы.

    1 октября 1999 года правительство России приостановило поставки продовольственной помощи США и Европейского союза в Ичкерию(Citation: 810).
    В октябре - декабре 1999 года оккупанты закрыли границу Ичкерии для беженцев и гуманитарных грузов (подробнее: «Транспортная блокада»)(Citation: 1581).
    До захвата Грозного в феврале 2000 года правительство России не пускало в республику гуманитарные организации, а раздачу помощи на Северном Кавказе поручило министерству России по чрезвычайным ситуациям(Citation: 1381)(Citation: 767).

    До апреля 2000 года Россия брала с гуманитарных грузов налоги и таможенные пошлины.
    Правительство России запрещало организациям помощи радиосвязь(Citation: 766).
    С апреля 2000 года по соглашению ООН и России эти организации работали в Ичкерии только под охраной оккупационных войск(Citation: 1377). 30 мая 2001 года оккупационное правительство республики «резолюцией № 22» урезало работу международных организаций в Ичкерии (подробнее: «Выдворение внешних миссий»)(Citation: 1377).

    Солдаты на российских блокпостах по двое-трое суток не выпускали раненых чеченцев в Ингушетию(Citation: 1647).
    С четырёх часов дня посты закрывались, и вечером до больницы было не доехать(Citation: 1381).
    В 95 из 136 облав, которые изучили правозащитники, оккупанты окружали село, и больные выходили к врачам, только заплатив военным (подробнее: «Террор»)(Citation: 1581).

    Оккупанты захватывали больницы под свои части, врывались в палаты и увозили раненых, которых считали бойцами Вооружённых сил Ичкерии.
    Чеченцы боялись идти в больницы, потому что там их арестовывали(Citation: 1381).

    В октябре 1999 года на закрытой оккупантами границе с Ингушетией без помощи врачей умерли не меньше четырёх чеченцев(Citation: 1581).
    В том же месяце российские солдаты несколько суток не выпускали раненых чеченцев из Нового Шароя, села к западу от Грозного, и оставили без ноги 18-летнего Алихана Авторханова(Citation: 1647).
    В конце октября у Шаами-Юрта, села на трассе Ростов - Баку, российские лётчики убили в колонне чеченских беженцев двух сотрудников чеченского отделения Красного Креста в машинах с эмблемой(Citation: 694).
    В ноябре оккупанты стреляли в психиатрической больнице Закан-Юрта, села к западу от Грозного, по чеченским врачам под знаком красного креста и ранили троих(Citation: 694)(Citation: 786).
    В том же месяце солдаты на российском блокпосту на границе с Ингушетией больше суток не пропускали чеченских беженцев с раненой девятилетней девочкой, и девочка умерла(Citation: 1581).
    В декабре части МВД и Минобороны России месяц не пропускали помощь и пенсии в Чири-Юрт, село к югу от Грозного, где жили около 12 тысяч чеченцев(Citation: 1643).

    В январе 2000 года российская охрана следственного изолятора в Чернокозове, селе на севере республики, не лечила задержанную Зуру Битиеву с двусторонней пневмонией(Citation: 775).

    2 февраля 2000 года российские войска окружили больницу в Алхан-Кале, селе к западу от Грозного.
    Там врачи сельской больницы и госпиталя Вооружённых сил Ичкерии во главе с министром здравоохранения Ичкерии Умаром Хамбиевым лечили десятки тяжелораненых защитников.
    Военные вывели раненых к автобусам, в 200 метрах от села остановили колонну, выбросили из автобусов одеяла, тёплую одежду и бинты, срывали с раненых повязки и били по ранам.
    В бункере у Толстой-Юрта, села к северу от Грозного, раненых несколько суток держали без еды и лечения, и больше десяти из них умерли.
    Военные увезли остальных раненых вместе с врачами в фильтрационные лагеря (подробнее: «Система фильтрационных лагерей»)(Citation: 1503)(Citation: 281)(Citation: 786).

    17 февраля 2000 года российская военная прокуратура отпустила девять медиков, а 18 февраля оккупанты выпустили Умара Хамбиева с бригадой из лагеря под домашний арест в Гудермесе, городе к востоку от Грозного(Citation: 1565)(Citation: 1377).
    Эльберд Саиев, раненый защитник, в августе 2000 года, выйдя по амнистии, рассказал правозащитникам «Мемориала», что в Георгиевске, городе на юге России, российские врачи отрезали ему ногу без наркоза и издевались: «Зачем она тебе, все равно ведь расстреляем…»
    Вскоре Эльберд Саиев уехал из России(Citation: 1503).

    В феврале 2000 года в Катыр-Юрте, селе к юго-западу от Грозного, российские солдаты по приказу генерала Шаманова не выпускали раненых чеченцев из-под бомб, и двое умерли, один из них 12-летний мальчик(Citation: 278)(Citation: 762).
    В марте в поле у Гой-Чу, села к юго-западу от Грозного, где российские военные держали 6500 чеченцев, умерли без больницы и лекарств новорождённый и девочка восьми месяцев(Citation: 1581).
    В конце июня солдаты на российском блокпосту пять дней держали колонну Датского совета по беженцам, который больше всех раздавал чеченцам еду, и вынудили совет приостановить работу в Ичкерии(Citation: 1381).
    В сентябре российские военные и милиционеры отказались вернуть чеченцам единственную больницу Шатойского района в горах на юге Ичкерии(Citation: 1503).
    В том же месяце российские силовики увезли из больницы Старых Атагов, села к югу от Грозного, раненого в голову Эдилбека Исаева(Citation: 1210).
    В декабре нейрохирург российского военного госпиталя в Моздоке, городе в подконтрольной России Северной Осетии, потребовал 40 000 рублей с Саид-Али Юнусова из Махкетов, села на юго-востоке Ичкерии, и раненый умер(Citation: 1724).

    В феврале 2001 года у Ойсхары, села к востоку от Грозного, сотрудники МВД России с вышки комендатуры ранили водителя Саид-Ахмеда Арсакаева, и он умер, потому что врачи сослались на «указание» не лечить раненных пулями без сотрудников комендатуры(Citation: 1581).
    В апреле шесть оккупантов закололи раненого Аслана Айдамирова в реанимации больницы Урус-Мартана, города к юго-западу от Грозного(Citation: 1581).
    С мая правительство России постановлением № 163 лишило чеченских беженцев в лагерях Ингушетии еды международных организаций, а обещанной своей не дало(Citation: 814).
    В том же месяце на блокпосту в Грозном российский военный тяжело ранил Арби Исраилова, сотрудника Международного комитета Красного Креста, и комитет приостановил работу в Ичкерии(Citation: 1581).
    В июне больше ста оккупантов выгнали из больницы Старых Атагов чеченских врачей, рожениц, матерей с новорождёнными и унесли лекарства(Citation: 1581).
    В декабре умер Тимур Исмаилов, которого российские военные пытали в Автурах, селе к юго-востоку от Грозного, а врачи в соседнем городе Шали побоялись принять(Citation: 1581).

    В январе 2002 года при облаве в Старых Атагах российские военные не пропустили рожавшую Лизу Юшаеву в больницу в 300 метрах, и ребёнок родился мёртвым(Citation: 1779).

    В августе 2003 года сотрудники ФСБ и российские военные в масках увезли из больницы станицы Слепцовская в подконтрольной России Ингушетии избитого Анзора Сулейманова и ещё четверых чеченцев(Citation: 1536).

    В декабре 1999 года организация «Врачи без границ» отнесла отказ пропускать медицинскую и гуманитарную помощь к военным преступлениям или преступлениям против человечности, которые совершала Россия в Ичкерии(Citation: 1381).
    В докладе организации «Врачи без границ» 22 ноября 2000 года сказано, что солдаты на блокпостах не пропускают больных и раненых, а оккупанты захватили не меньше трёх больниц и поликлиник(Citation: 1381).
