description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты разрушали музеи и театры Грозного и средневековые башни в горах Ичкерии.

    Российские лётчики бомбили, а артиллеристы обстреливали Грозный и сёла Ичкерии вместе с музеями, театрами и домами культуры(Citation: 1470).
    К концу сентября 2000 года не уцелело ни одного учреждения культуры, которое служило всей республике, а в горных Шатойском, Шаройском и Итум-Калинском районах не осталось ни одного(Citation: 1470).

    Оккупанты жили в средневековых башнях XV-XVII веков в горах на юге Ичкерии и не пускали к ним специалистов по охране памятников(Citation: 1470).

    При бомбёжках российские войска разрушали мечети, среди них мечеть в Гой-Чу, селе к юго-западу от Грозного (подробнее: «Уничтожение святынь и некрополей»)(Citation: 1470).
    Оккупанты повредили и государственный архив республики (подробнее: «Сожжение книг и архивов»)(Citation: 1470).

    В 1999-2000 годах российские войска бомбёжками и обстрелами Грозного сильно повредили экспонаты Объединённого государственного музея, которые не вывезли из города.
    Этот музей собрали после первой войны из предметов, уцелевших в разрушенных краеведческом и художественном музеях(Citation: 1470).
    Оккупанты тяжело повредили театр и концертный зал на проспекте Победы в Грозном, уцелевшие в первую войну, и Чеченский драматический театр, который восстановили в Ичкерии в 1998 году(Citation: 1470).

    В 1999-2000 годах российские военные выстрелом из танка пробили большую дыру в средневековой башне в Ушкалое, горном селе на юге Ичкерии, и обстреляли верх башни у въезда в Шатой, районный центр в горах к югу от Грозного(Citation: 1470).

    1 сентября 2000 года с 10 до 14 часов российские лётчики бомбили окрестности Суракоя и Нижалоя, сёл в горном Шаройском районе на юге Ичкерии.
    В хронике правозащитного центра «Мемориал» со слов очевидцев сказано, что в небе всё время было до восьми самолётов: «Парами они заходили на отдельно стоящие жилые строения, кошары [загоны для овец], башенные комплексы [группы средневековых башен] и, сначала обстреляв их ракетами, затем сбрасывали бомбы».
    Чеченцы бежали из этих сёл ещё осенью 1999 года, в начале войны, поэтому лётчики никого не убили(Citation: 1503).

    В апреле 2001 года чеченская организация «Лам» писала, что за две войны России против Ичкерии российские войска разрушили в республике театры, музеи и библиотеки, а Грозный вместе с памятниками и историческими зданиями лежал в руинах(Citation: 1443).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали о войне России против Ичкерии: «Имеются свидетельства преднамеренного разрушения памятников истории, не являвшихся военными объектами»(Citation: 1581).

    К концу марта 2000 года российские войска захватили города и сёла Ичкерии(Citation: 1581).
    После этого оккупанты прекратили массированные бомбёжки и обстрелы городов, при которых гибли музеи и театры Грозного (подробнее: «Неизбирательные нападения»)(Citation: 1581).
    Дальше российские войска били в основном по горным сёлам, где стоят средневековые башни(Citation: 1581).
    Российские военные уничтожали архивы и библиотеки при облавах в сёлах (подробнее: «Сожжение книг и архивов»)(Citation: 1581). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
