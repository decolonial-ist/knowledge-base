description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты охраняли незаконный вывоз чеченской нефти и оборудования разрушенных заводов, а российская государственная нефтяная компания «Роснефть» забрала добычу нефти в Ичкерии и продавала её за границу.

    Летом 2000 года российские военные вместе с поставленной оккупантами чеченской милицией охраняли тех, кто воровал нефть из магистрального нефтепровода у Аргуна, города к востоку от Грозного.
    Воры пробивали в трубе отверстия и сливали нефть в земляные ямы(Citation: 1681).
    Вокруг Грозного нефть добывали и перерабатывали под охраной оккупантов(Citation: 1236).

    Контрактники оккупационных войск охраняли грузовики, на которых по ночам, в комендантский час, увозили оборудование полуразрушенных нефтеперерабатывающих заводов Грозного в подконтрольную России Северную Осетию и в Ставропольский край(Citation: 1681).

    В ноябре 2000 года комиссия правительства России по восстановлению республики во главе с вице-премьером Христенко объявила, что в Ичкерии снова создадут государственную компанию по добыче нефти(Citation: 1214).
    Весной и летом 2001 года «Роснефть» создала дочернюю компанию «Грознефтегаз», которая добывала и перевозила нефть республики.
    «Роснефти» досталось больше половины акций «Грознефтегаза», а оккупационному правительству республики - остальные 49%.
    Федеральное предприятие «Чеченнефтехимпром» получило всё имущество нефтяной отрасли и в 2002 году отдало объекты добычи во временную аренду «Роснефти», у которой были права на добычу и управление ею(Citation: 1490).

    Осенью 2003 года поставленное Россией МВД республики создало из силовиков службы безопасности главы оккупационной администрации Кадырова «нефтяной полк» милиции на 2-2,5 тысячи человек, которым долго командовал Делимханов (подробнее: «Выращивание коллаборационистской элиты»)(Citation: 286).
    Полк охранял места добычи и нефтепроводы «Чеченнефтехимпрома», сопровождал нефть, которую вывозили на экспорт(Citation: 1490).

    С 2004 года «Роснефть» отправляла чеченскую нефть по трубопроводу и железной дороге к нефтяному терминалу у Новороссийска, порта на Чёрном море, откуда её продавали за границу(Citation: 1490).
    В 2005 году нефть давала 98,4% всего промышленного производства республики, а действующих нефтеперерабатывающих заводов в ней не было.
    Выручка от проданной нефти шла на особый счёт Министерства промышленности и энергетики России.
    Деньги числились за бюджетом республики, но были заморожены, и расходовало их министерство в Москве(Citation: 1235).
    Министерство держало в тайне, по какой цене продавало нефть и сколько денег получало.
    Часть выручки оседала в офшорных фирмах(Citation: 1490).

    Летом 2000 года у Цацан-Юрта, села в Курчалоевском районе на востоке Ичкерии, два месяца горела нефтяная скважина № 7.
    Мужчины Цацан-Юрта во главе с Али Абуевым, бывшим главой села, заглушили скважину распиленной цистерной.
    Всякий раз, когда чеченцы протестовали против воров нефти, оккупанты приходили с облавами в сёла у скважин.
    При очередной облаве в Цацан-Юрте оккупанты арестовали бывшего главу села.
    Полковники республиканского управления российского МВД говорили Анне Политковской, журналистке «Новой газеты», что Али Абуев - «друг Хаттаба», арабского командира, воевавшего за Ичкерию, и что Али Абуеву сидеть, пока идёт война.
    На вопрос о доказательствах полковники отвечали: «У нас — спецсообщения агентов».
    Анна Политковская 31 июля 2000 года писала, что после ареста Али Абуева «скважина вспыхнула, земля вокруг нее оказалась изрыта амбарами [ямами для ворованной нефти], материализовались „самовары“» (так называли самодельные установки для перегонки нефти).
    На выезде из Цацан-Юрта, на виду у российского блокпоста, снова работал рынок, где нефть продавали оптом.
    В конце июля 2000 года Али Абуев оставался под арестом(Citation: 1681).

    В декабре 2000 года на рассвете из Грозного выходили колонны машин с бензином из подпольных установок и грузовиков с металлом разобранных заводов.
    Колонны шли под охраной российских военных, приехавших в командировку, в форме без знаков различия и в масках(Citation: 1709).
    В 2001 году, по данным представительства оккупационной администрации Кадырова в Москве, половину добытой в республике нефти увозили на подпольные заводы в Дагестане, Кабардино-Балкарии и Северной Осетии, подконтрольных России, а машины с нефтью по ночам сопровождали военные оккупационных войск(Citation: 1227).

    Правозащитники «Мемориала» и ещё четырёх организаций в 2005 году писали, что продажу бензина и нефтепродуктов в республике контролировали вооружённые группы на службе России(Citation: 941).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что несколько лет всё ценное, что оставалось на нефтеперерабатывающих заводах Грозного после бомбёжек, прежде всего металл, «организованно вывозилось из республики под прикрытием военных властей»(Citation: 1581).

    В 2007 году добычей чеченской нефти по-прежнему управляла «Роснефть»: по её данным, «Грознефтегаз» добыл на 248 скважинах 2,14 млн тонн нефти, по ценам того времени не меньше чем на 1 млрд 404 млн долларов(Citation: 1490).
