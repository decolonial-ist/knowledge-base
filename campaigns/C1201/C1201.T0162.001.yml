  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские руководители, генералы и поставленные Россией главы администрации объявляли, что бойцов Вооружённых сил Ичкерии и оставшихся в Грозном горожан не пощадят, а командиры велели солдатам убивать всех.

    Командование оккупационными войсками объявляло в листовках и приказах, что пощады не будет(Citation: 1581).
    Президент России, генералы и главы оккупационной администрации повторяли это журналистам(Citation: 1541)(Citation: 1676).
    Командиры устно приказывали солдатам убивать всех.
    Исполнители перед расправой говорили о приказе тем, кого собирались убить(Citation: 1581).

    6 декабря 1999 года российские лётчики сбросили на Грозный листовки, адресованные «тем, кто обороняет Грозный».
    В них командование оккупационными войсками велело уйти из города до 11 декабря: «Лица, оставшиеся в городе, будут считаться террористами и бандитами [так россияне называли бойцов Вооружённых сил Ичкерии].
    Их будут уничтожать артиллерия и авиация. ...
    Все, кто не покинул город, будут уничтожены».
    Штаб российских войск объявил через агентство «Интерфакс», что Грозный будут бомбить самолёты дальней авиации с бомбами, которые уничтожают всё живое на нескольких квадратных километрах.
    Правление российского общества «Мемориал» в тот же день написало в обращении к правительству России и международным организациям: «Сегодня все, кто окажется не в состоянии покинуть Грозный до 11 декабря, заранее зачисляются в „террористы и бандиты“»(Citation: 1529).

    7 декабря президент США Клинтон осудил ультиматум.
    В этот день командующий российскими войсками в Ичкерии Казанцев объявил, что листовки - предупреждение бойцам Ичкерии, а не горожанам(Citation: 1581). 9 декабря президент России Ельцин в Пекине, на встрече с председателем Китая Цзян Цзэминем, сказал о Клинтоне: «Он, видимо, на секунду, на минуту, на полминуты забыл, что такое Россия, что Россия владеет полным арсеналом ядерного оружия»(Citation: 2205). 11 декабря Евросоюз пригрозил пересмотреть торговлю с Россией и её финансирование, если Москва не отзовёт ультиматум.
    Россия отказалась от угрозы общего штурма Грозного, где оставались от 12 000 мирных горожан по оценке российских военных до 40 000 по оценке правительства Ичкерии(Citation: 765).
    Российские лётчики продолжали бомбить город (подробнее: «Истребление по территориальному признаку»)(Citation: 1581).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году пришли к выводу, что этими листовками командование пообещало никого не оставить в живых и убивать оставшихся в городе мирных людей как бойцов.
    Они писали, что российские военные потом так и убивали мирных жителей Грозного(Citation: 1581).

    19 января 2000 года в Старопромысловском районе на северо-западе Грозного российские военные вывели людей из подвала, сказали, что пришли «с приказом смести все, что растет и движется», и расстреляли среди них двух чеченцев (подробнее: «Массовые убийства гражданских»)(Citation: 1581)(Citation: 760). 5 февраля 2000 года в Новых Алдах, посёлке на южной окраине Грозного, солдаты срочной службы говорили чеченцам, что у них «приказ всех убивать», а следом идут омоновцы, бойцы милицейского спецназа.
    В тот день омоновцы и солдаты убили в посёлке не меньше 46 чеченцев (подробнее: «Массовые убийства гражданских»)(Citation: 280)(Citation: 951). 20 марта 2000 года исполнявший обязанности президента России Путин в Грозном объявил, что бойцов Вооружённых сил Ичкерии надо «добивать»: «Кто не спрятался в пещерах - я не виноват»(Citation: 1541).
    В июле 2000 года глава оккупационной администрации Кадыров объявил, что не будет просить Москву о прощении для 20-30 % бойцов Ичкерии: «Они подлежат только уничтожению»(Citation: 1676).

    8 августа 2000 года на поле у Гехи, села к юго-западу от Грозного, командующий внутренними войсками МВД России (предшественниками современной Росгвардии) на Северном Кавказе Лабунец, по словам выживших, велел показательно расстрелять задержанных чеченцев «за пять „наших“» - за подрыв российского бронетранспортёра(Citation: 1998).
    Среди них были братья Али и Умар Мусаевы: в 2007 году Европейский суд по правам человека признал Россию ответственной за их смерть под стражей (подробнее: «Убийство пленных и задержанных»)(Citation: 781). 15 ноября 2000 года в Курчалое, селе на востоке Ичкерии, российские солдаты задержали по подозрению в подрыве автобуса и избили четверых чеченцев, рабочих местного хозяйства.
    На доклад по рации солдатам ответили: «Расстрелять всех!», но другой голос отменил приказ, и ночью рабочих отпустили (подробнее: «Пытки и истязания»)(Citation: 1503).
    В декабре 2000 года назначенный Россией мэр Грозного Гантамиров сказал о командирах Вооружённых сил Ичкерии Руслане Гелаеве, Шамиле Басаеве и Хаттабе: «Эти люди должны быть уничтожены.
    Они не могут быть взяты даже в плен»(Citation: 1710).

    3 июня 2001 года командующий Северо-Кавказским военным округом Трошев предложил публично казнить пленных бойцов Вооружённых сил Ичкерии: «собрал бы всех на площади, вздернул бы бандита и пусть висит, и пусть все видят!»(Citation: 1581).
    Президент России Путин на вопрос об этих словах ответил: «Трошева можно понять», и Трошев остался в должности(Citation: 1130).

    11 января 2002 года группа спецназа российской военной разведки под командой капитана Ульмана на дороге из Дая в Нохчи-Келой, сёла на юге Ичкерии, остановила рейсовую машину.
    По приказу, который майор Перелевский передал по рации, спецназовцы убили шестерых мирных чеченцев (подробнее: «Убийство пленных и задержанных»)(Citation: 1778)(Citation: 1955).
    Перелевский сказал, что передал приказ заместителя командующего российскими войсками в Ичкерии Плотникова, а тот это отрицал(Citation: 1581).
    Начальник армейской разведки военной комендатуры Шатойского района Невмержицкий рассказал корреспонденту «Новой газеты» Анне Политковской, как бойцов спецназа «настращали в Ханкале», главной базе оккупационных войск на восточной окраине Грозного: «Все в горах бандиты.
    Вали всех, кого увидишь!
    Прикроем»(Citation: 1778).
    В 2004 и 2005 годах присяжные военного суда в Ростове-на-Дону оправдали Ульмана, Калаганского, Перелевского и Воеводина как исполнявших приказ(Citation: 1955)(Citation: 1581).
    В 2007 году Северо-Кавказский окружной военный суд осудил всех четверых, но Ульман, Калаганский и Воеводин скрылись до приговора(Citation: 1581).
    Плотникова к суду не привлекли (подробнее: «Безнаказанность исполнителей»)(Citation: 2009).

    6 августа 2002 года российские военные забрали из дома в Центорое, горном селе на юго-востоке Ичкерии, 25-летнего Магомеда Алиева.
    Вечером военные сказали его отцу Малику Алиеву: «У нас такой приказ — всех „ваших“ от двадцати пяти расстреливать», и в тот же день расстреляли сына (подробнее: «Убийство пленных и задержанных»)(Citation: 1854).

    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева писали, что командование оккупационными войсками только из-за давления других стран не исполнило до конца часть своих приказов против мирных чеченцев, а войска всю войну воевали по этим приказам(Citation: 1581).

    В мае 2007 года вице-премьер оккупационной администрации Кадырова-младшего Делимханов и министр внутренних дел этой администрации Алханов собрали около сотни силовиков и столько же родственников молодых чеченцев, ушедших в лес воевать с оккупантами.
    Делимханов предупредил, что пойманным «голову отрежут», а их семьям снисхождения не будет(Citation: 287).
