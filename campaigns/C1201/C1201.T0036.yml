  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты ставили на захваченной земле Ичкерии свои органы управления вместо избранного руководства республики и подчиняли их президенту России.

    15 октября 1999 года президент России Ельцин указом № 1380 ввёл должность заместителя председателя правительства России - полномочного представителя правительства в Чеченской Республике, который направлял в республике работу российских министерств, в том числе по созданию там органов власти(Citation: 768).
    Кошман получил эту должность (подробнее: «Марионеточное правительство»).
    Представительство работало в захваченном Гудермесе, втором по величине городе Ичкерии(Citation: 1643)(Citation: 765).

    С декабря 1999 года российские войска ставили в захваченных районах и самых крупных сёлах Ичкерии военные комендатуры.
    Комендатуры правили чеченцами, и границ их полномочий никто не определил(Citation: 1210).

    С 2000 года МВД России держало рядом с комендатурами временные отделы внутренних дел, которые выполняли в республике работу районных отделов внутренних дел(Citation: 286).
    В них служили только российские милиционеры, командированные из регионов России (подробнее: «Подселение чиновников и военных»).
    С лета 2000 года МВД создавало и районные отделы из чеченских милиционеров, но настоящая власть в районах оставалась у временных отделов(Citation: 1210).

    8 июня 2000 года президент России Путин указом № 1071 упразднил представительство правительства России и создал оккупационную администрацию Чеченской Республики, рядом с которой работали отделения российских министерств.
    Президент России назначал и снимал главу оккупационной администрации, а глава отчитывался перед ним и правительством России(Citation: 840). 12 июня 2000 года Путин назначил главой оккупационной администрации Кадырова (подробнее: «Марионеточное правительство»)(Citation: 1210).

    В ноябре 2000 года Путин поручил заново создать в республике суды.
    Чтобы суды заработали быстро, судей в них брали временно, без указа президента России о назначении(Citation: 1891).
    Суды заработали в январе 2001 года(Citation: 1210).

    19 января 2001 года Путин указом № 52 дал главе оккупационной администрации право создавать органы власти республики, назначать глав районов и сёл.
    Полномочный представитель президента России на юге России получил право контролировать оккупационную администрацию.
    Её глава издавал указы только на основании законов, указов президента и постановлений правительства России(Citation: 840).

    22 января 2001 года президент России Путин указом № 61 передал руководство войной директору ФСБ Патрушеву(Citation: 790)(Citation: 1549).
    Региональный оперативный штаб, которому подчинялись российские войска и спецслужбы в Ичкерии, возглавил заместитель директора ФСБ Угрюмов(Citation: 790)(Citation: 1581).

    С конца 2001 года МВД России передавало районной милиции Чеченской Республики, где служили в основном чеченцы, работу временных отделов.
    В 2003 году МВД расформировало временные отделы (подробнее: «Выращивание коллаборационистской элиты»)(Citation: 959)(Citation: 286).

    В конце 2002 года чиновник президента России Парамонов написал в Москве конституцию Чеченской Республики, а его коллеги Нигородова и Бондарева - законы о выборах её президента и парламента.
    Авторы не привлекали к этой работе чиновников оккупационной администрации республики, а отдали им готовые тексты(Citation: 941). 23 марта 2003 года Россия провела конституцию через «референдум» (подробнее: «Имитация народного волеизъявления»)(Citation: 794).

    13 октября 2003 года Путин указом № 1214 отменил с 19 октября указ о временной оккупационной администрации и ввёл в республике новую систему органов власти(Citation: 840).

    15 февраля 2006 года президент России Путин указом «О мерах по противодействию терроризму» создал Национальный антитеррористический комитет во главе с директором ФСБ.
    Решения комитета были обязательны для силовых ведомств России(Citation: 286).

    В конце ноября 1999 года собрание села избрало Ису Мадаева главой Чири-Юрта, крупного села Шалинского района в предгорьях у Аргунского ущелья.
    В декабре Иса Мадаев три недели просил российских командиров привезти в село людей из представительства Кошмана, представителя правительства России, чтобы те помогли беженцам из гор, укрывшимся в Чири-Юрте.
    Назначенный Россией глава Шалинского района в Чири-Юрт так и не приехал.
    Помощник Кошмана Джамалханов приехал на бронетранспортёре вместе с российскими полковниками.
    На вопрос Исы Мадаева, считают ли они себя «новой властью», полковники ответили «да».
    Джамалханов уехал, и с тех пор представительство Кошмана на просьбы села не отвечало.
    После Нового года Иса Мадаев выбрался в Москву искать деньги на гуманитарную помощь и рассказал об этом Анне Политковской в интервью «Новой газете», опубликованном 10 января 2000 года: «Разве гражданское правительство может ездить на бронетранспортерах?!»(Citation: 1643)

    15 января 2000 года в Старых Атагах, селе напротив Чири-Юрта на другом берегу Аргуна, оккупанты открыли отделение милиции из сводного отряда милиционеров Санкт-Петербурга (подробнее: «Подселение чиновников и военных»).
    Отделение подчинялось военной комендатуре Грозненского района в Толстой-Юрте, селе в 15 километрах к северу от Грозного(Citation: 1512)(Citation: 765).

    Правозащитники «Мемориала» пишут, что роль гражданских органов в республике в 2000 году была «незначительной, если не сказать ничтожной».
    По их словам, военная комендатура республики в Грозном во главе с генералом Бабичевым не контролировала военных и спецслужбы, подчинённые Региональному оперативному штабу и Объединённой группировке российских войск.
    Российский штаб и группировка стояли в Ханкале, пригороде Грозного.
    Правозащитники называют Ханкалу фактической столицей республики того времени(Citation: 1210).

    16 апреля 2009 года Национальный антитеррористический комитет объявил, что дальше силовые ведомства России будут действовать в Чеченской Республике «в соответствии с общим порядком, действующим в других регионах страны» (подробнее: «Военная интервенция»)(Citation: 901).
