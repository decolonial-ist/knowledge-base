description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты объявляли чеченцам «гуманитарные коридоры» для выхода из-под бомбёжек, а потом разворачивали беженцев, обстреливали их колонны на дорогах и задерживали мужчин на выходе.

    «Коридоры» объявляли российские государственные телеканалы и командование оккупационных войск в листовках, а министры и генералы обещали, что по мирным чеченцам бить не будут(Citation: 277)(Citation: 1464). 25 сентября 1999 года командующий российскими войсками на западе Ичкерии генерал Шаманов приказал закрыть выход из республики, и людей выпускали только через пункты пропуска оккупантов (подробнее: «Транспортная блокада»)(Citation: 1581).
    Оккупанты обстреливали и те дороги из Грозного, которые сами объявили безопасными для выхода(Citation: 279).

    На пунктах пропуска у коридоров российские военные задерживали чеченских мужчин, и те пропадали без вести (подробнее: «Похищение людей»)(Citation: 1581)(Citation: 1210).
    Тех, кто не ушёл из Грозного к назначенному сроку, командование оккупационных войск во главе с Казанцевым грозило считать врагами и уничтожить (подробнее: «Отказ в пощаде»)(Citation: 1581).

    26 октября 1999 года российские государственные СМИ объявили, что 29 октября откроют «гуманитарный коридор» для выхода из Ичкерии в подконтрольную России Ингушетию через пункт пропуска «Кавказ-1» на трассе Ростов - Баку(Citation: 1512). 28 октября оккупанты на пункте развернули Медку Исаеву из Грозного с родными и сказали, что коридор откроют завтра. 29 октября у пункта выстроилась колонна беженцев длиной около 12 километров.
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева пишут, что около 11 часов утра комендант пункта полковник Хрулёв объявил, что коридор в этот день не откроют, и велел беженцам возвращаться в Грозный(Citation: 1581).
    Беженцы рассказывали, что комендант пообещал им безопасную дорогу(Citation: 277).

    29 октября около двух часов дня экипажи двух российских штурмовиков Су-25 атаковали колонну у села Шаами-Юрт на этой трассе.
    Накануне вечером офицер управления полётами оккупационных войск передал лётчикам задачу не пускать к Грозному тяжёлые машины, а самого офицера о коридоре не известили.
    Экипажи несколькими заходами выпустили по колонне 12 неуправляемых ракет и прямыми попаданиями разбили грузовик Чеченского комитета Красного Креста, автобус и КамАЗ с беженцами(Citation: 277).
    По данным Международного комитета Красного Креста, лётчики убили 25 чеченцев и ранили больше 70.
    Среди убитых были дети Медки Исаевой Илона и Саид-Магомед, её невестка Асма Магомедова, Киса Асиева и двое сотрудников Красного Креста, а Медку Исаеву ранили в руку(Citation: 277).
    Тоусари Эсмурзаева, которая в те дни ехала по трассе, 13 ноября 1999 года рассказала Amnesty International в больнице Галашек, села в подконтрольной России Ингушетии: «Автобусы горели на дороге к границе, у села Шаами-Юрт… и горели люди.
    Самолёты обстреливали дорогу»(Citation: 694). 24 февраля 2005 года Европейский суд по правам человека признал, что Россия нарушила право на жизнь Медки Исаевой, её детей и двух других беженок, подавших жалобу вместе с ней.
    Суд написал, что следствие не сделало ничего, чтобы выяснить причину «полного отсутствия согласованности между публичными объявлениями о „безопасном выходе“ для гражданских лиц и очевидным отсутствием каких-либо соображений об этом у военных при планировании и выполнении задания»(Citation: 277).
    Российские военные следователи, прекратившие дело 5 мая 2004 года, после этого решения его не возобновили (подробнее: «Безнаказанность исполнителей»)(Citation: 1581).

    29 октября 1999 года, в день объявленного коридора, артиллеристы оккупационных войск у станицы Горячеисточненская к северу от Грозного обстреляли колонну из 30 машин с беженцами под белыми флагами и убили не меньше 24 чеченцев, ехавших из Аргуна и Старой Сунжи.
    Ещё семеро умерли от ран в больнице(Citation: 1581).
    Источники расходятся в дате и счёте: уполномоченный по правам человека при оккупационной администрации Кадырова-младшего пишет, что российские военные расстреляли колонну там 29 сентября и убили около 300 чеченцев(Citation: 1194).

    6 декабря 1999 года командование оккупационных войск в листовках, которые российские лётчики сбросили на Грозный, велело мирным горожанам уйти до 11 декабря только через один пункт пропуска, в станице Первомайская(Citation: 1504)(Citation: 765).
    Первый заместитель начальника Генерального штаба российской армии Манилов назвал этот маршрут «действительно безопасным»(Citation: 1515).
    С 12 по 14 декабря оккупанты обстреливали в Грозном дороги к объявленным местам выхода и разбили гражданские машины и автобусы(Citation: 1581).

    8 января 2000 года, когда российские войска обещали открыть коридоры для выхода из Грозного, солдаты внутренних войск МВД России (предшественники современной Росгвардии) на блокпосту в Черноречье, посёлке, через который чеченцы выходили из Грозного на юго-запад, надели мешки на головы двоим чеченцам.
    Военные увезли обоих на бронетранспортёре, и они пропали без вести(Citation: 1210). 10 января центральные российские телеканалы объявили коридор для выхода чеченцев из Шатойского района в горах на юге Ичкерии, а командование оккупационных войск обещало безопасность тем, кто выйдет 13-14 января(Citation: 1581)(Citation: 1210).
    С первого дня коридора до 6 марта военные генерала Шаманова на пункте пропуска «Юг» между Дуба-Юртом и Чири-Юртом, сёлами к югу от Грозного, задержали не меньше 20 выходивших чеченцев и убили четверых из них, а 16 пропали без вести (подробнее: «Похищение людей»)(Citation: 1581).

    4 февраля 2000 года российские войска генерала Шаманова бомбили Катыр-Юрт, село к юго-западу от Грозного, которое оккупанты объявили «зоной безопасности».
    Около трёх часов дня бомбёжка стихла, и чеченцы стали уходить из села: им сказали, что военные дали безопасный выход.
    Около половины четвёртого лётчики разбомбили машины беженцев на дороге, убив мужчину 23 лет и трёх сестёр 15, 13 и 6 лет (подробнее: «Неизбирательные нападения»)(Citation: 278). 8 марта российские войска генералов Трошева, Герасимова и Лабунца держали на поле у Гой-Чу, села к юго-западу от Грозного, чеченцев из этого села(Citation: 1581).
    Военные пообещали им после проверки паспортов открыть коридор в соседний Урус-Мартан, но 9 марта коридора не дали (подробнее: «Использование людей как «живого щита»»)(Citation: 1563).

    В июне 2000 года генерал Шаманов, в декабре 1999 года командовавший российскими войсками на западе Ичкерии, объяснял гибель не меньше 18 мирных чеченцев, которых его войска убили с 1 по 17 декабря 1999 года в Алхан-Юрте, селе к юго-западу от Грозного (подробнее: «Массовые убийства гражданских»)(Citation: 770).
    По его словам, мирным давали «коридор» «не на один день, а на неделю», а после этого оставаться в селе «уже была их воля»(Citation: 1670).

    В декабре 1999 года организация «Врачи без границ» по рассказам беженцев писала, что объявления России о «гуманитарных коридорах» - «не больше чем пропаганда»(Citation: 1381).
    Александр Черкасов из «Мемориала» в 2004 году писал: «Дороги, объявленные „гуманитарными коридорами“, уместнее было бы назвать „коридорами смерти“: число людей, погибших в населенных пунктах и при выходе из них, было сравнимо»(Citation: 1328).

    «Гуманитарные коридоры» оккупанты объявляли, пока захватывали города и сёла республики.
    К концу марта 2000 года российские войска захватили их, а Вооружённые силы Ичкерии, вынужденные отступить, к лету перешли к партизанской войне(Citation: 1581).
    Выводить мирных чеченцев из-под штурма стало неоткуда, и объявлять коридоры оккупантам стало незачем. 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
