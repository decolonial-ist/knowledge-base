  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты бомбили и обстреливали города и сёла Ичкерии, убивая чеченцев в домах, на рынках, на дорогах(Citation: 1581).

    27 сентября 1999 года председатель правительства России Путин объявил, что российская авиация бьёт по всей территории республики(Citation: 1548). 2 октября газета «Коммерсантъ» со ссылкой на Генеральный штаб российской армии сообщила о плане бить авиацией и артиллерией по городам, сёлам и горам(Citation: 1570).

    Российские лётчики сбрасывали на сёла неуправляемые бомбы на парашютах весом 250 и 500 килограммов, каждая из которых поражает всё вокруг больше чем на километр, и стреляли неуправляемыми ракетами(Citation: 278)(Citation: 277).
    Российские артиллеристы били по жилым кварталам из реактивных систем залпового огня «Град», «Ураган» и ТОС-1 «Буратино», которые не могут бить прицельно.
    Российские военные стреляли по городам ракетами «земля - земля», которые разбрасывают десятки малых бомб перед ударом(Citation: 1581).

    Российские лётчики работали в режиме «свободной охоты» и сами выбирали, по какой машине или дому бить(Citation: 277)(Citation: 1581).
    Правозащитники «Мемориала» пишут, что, подходя к селу, российские артиллеристы обстреливали окраины, чтобы запугать сельчан и проверить, ответят ли защитники(Citation: 1512).
    Старейшины просили российских командиров не бить по сёлам, где не было бойцов Вооружённых сил Ичкерии, но оккупанты всё равно обстреливали эти сёла(Citation: 694).
    С середины 2000 года российские артиллеристы обстреливали леса вокруг сёл, а по праздникам и перед сменой частей - и сами сёла(Citation: 1503).

    27 сентября 1999 года, когда дети на перемене играли во дворе школы, российские лётчики ударили ракетами и бомбами по школе № 1 в Старой Сунже, посёлке на восточной окраине Грозного, и убили 12 сельчан, из них восьмерых детей(Citation: 1581).
    С 1 по 3 октября российская авиация бомбила жилые кварталы Урус-Мартана, города к юго-западу от Грозного, и убила не меньше 14 горожан, а здания, где стояли защитники, не пострадали(Citation: 1581). 7 октября российские лётчики ковровой бомбардировкой превратили в развалины участок 300 на 800 метров в Элистанжи, селе на юго-востоке Ичкерии, и убили 48 чеченцев, считая умерших от ран к 21 октября.
    Военных объектов ни в селе, ни вокруг не было(Citation: 1581)(Citation: 923). 19 октября оккупанты выпустили по Гехи, селу к юго-западу от Грозного, две ракеты «земля - земля» и убили семерых чеченцев(Citation: 1581).

    21 октября 1999 года оккупанты выпустили с военного полигона «Тарское» под Владикавказом, городом в подконтрольной России Северной Осетии, ракеты «земля - земля» по центру Грозного, где тогда оставались сотни тысяч горожан.
    Ракеты разорвались над Центральным рынком, у единственного работавшего роддома, главной почты и мечети в посёлке Калинина(Citation: 1581).
    Малика Юнусова, которая торговала на рынке с мужем и выжила с переломом руки, рассказала правозащитникам «Мемориала»: «Там все подряд, проходящие, стоящие, торгующие, — все лежали.
    Один на второго падал.
    Трое лежали на моем муже.
    Они все трое умерли, а он остался живой»(Citation: 771).
    Оккупанты убили около 140 горожан, среди них 13 рожениц и 15 новорождённых, и ранили больше 200(Citation: 1581).
    Источники расходятся: правозащитники «Мемориала» пишут о 100-120 убитых и около 400 раненых.
    Об ударе они писали: «По сути, это было военное преступление»(Citation: 771). 22 января 2007 года российская военная прокуратура отказалась возбудить дело (подробнее: «Безнаказанность исполнителей»)(Citation: 1581).

    29 октября 1999 года, когда командование оккупационных войск объявило безопасный выход из Грозного, экипажи двух российских штурмовиков несколько часов били ракетами по колонне беженцев на трассе из Грозного в Ингушетию у села Шаами-Юрт (подробнее: «Ложный коридор»).
    Источники расходятся: российские следователи насчитали 16 убитых, Международный комитет Красного Креста - 25(Citation: 277)(Citation: 1581).
    В тот же день российские артиллеристы у станицы Горячеисточненская к северу от Грозного обстреляли 30 машин с беженцами под белыми флагами и убили не меньше 24 чеченцев из Аргуна и Старой Сунжи, ещё семеро умерли в больнице(Citation: 1581).
    С 6 ноября по 1 декабря российские войска обстреливали и бомбили Алхан-Юрт, село к юго-западу от Грозного, и, по данным Human Rights Watch, убили 11 сельчан(Citation: 770).

    5 января 2000 года российские лётчики с четырёх самолётов сбросили вакуумные бомбы на Махкеты, горное село на юго-востоке Ичкерии, и убили 21 чеченца, среди них детей и стариков(Citation: 1581). 9 января первый заместитель командующего российскими войсками в Ичкерии генерал Трошев приказал ударить ракетой «земля - земля» по двору у российской военной комендатуры в Шали, городе к юго-востоку от Грозного, который командование оккупационных войск объявило «зоной безопасности».
    На площади рядом старики получали пенсии, и, по данным «Мемориала», российские военные убили больше 150 горожан(Citation: 1129)(Citation: 1581).

    Оккупанты объявили «зоной безопасности» Катыр-Юрт, село к юго-западу от Грозного.
    К февралю 2000 года там собралось от 18 до 25 тысяч человек, среди них беженцы(Citation: 278). 4 февраля в село прорвались бойцы Вооружённых сил Ичкерии, вынужденные уйти из окружённого российскими войсками Грозного.
    В тот же день командир дивизии внутренних войск МВД России (предшественники современной Росгвардии) Недобитко вызвал штурмовую авиацию, а российские артиллеристы били по селу из «Града» и «Урагана».
    Командующий российскими войсками на западе Ичкерии генерал Шаманов вместе с командиром дивизии спланировал удар и до 7 февраля руководил им на месте(Citation: 278)(Citation: 1581).
    Около 150 чеченцев прятались в подвале дома в переулке Чкалова.
    Около полудня 4 февраля российские лётчики сбросили на этот дом бомбу на парашюте и убили 11 из них(Citation: 762).
    Елизавета, уроженка Катыр-Юрта, вышла из села и 7 февраля рассказала по телефону Радио Свобода: «Сутки, с пятницы на субботу, то есть с утра пятницы до утра субботы бомбили, бомбили все село…
    Трупов море.
    Дети, мужчины, женщины, старики»(Citation: 1578).
    Источники расходятся в числе убитых: российские следователи насчитали 46, «Новая газета» - не меньше 167, а у главы администрации села свидетель видел список из 272 имён(Citation: 278). 24 февраля 2005 года Европейский суд по правам человека в решении по жалобе Зары Исаевой из Катыр-Юрта написал, что главной целью российских военных должна была быть защита жизни людей и что «массовое использование неизбирательного оружия находится в вопиющем противоречии с этой целью»(Citation: 278)(Citation: 1210).
    Российская военная прокуратура дважды прекращала дело, в последний раз в июне 2007 года «за отсутствием состава преступления»(Citation: 1174).

    6-8 февраля 2000 года через Гехи-Чу, село к юго-западу от Грозного, уходили защитники Грозного.
    Российские войска обстреливали село и убили не меньше 24 сельчан(Citation: 1581). 17 и 20 февраля российские лётчики бомбили Асланбек-Шерипово, село в горах на юге Ичкерии, где не было защитников, и убили 32 чеченца(Citation: 1581).
    С 7 по 20 марта российские войска били из ТОС-1 «Буратино» по Гой-Чу, селу к юго-западу от Грозного, и почти полностью разрушили его(Citation: 1129).
    По данным Human Rights Watch, из села не смогли уйти по меньшей мере сто мирных чеченцев, и правозащитники считают, что оккупанты убили их при обстреле(Citation: 1450).

    16 июля 2000 года российские артиллеристы обстреляли из миномётов Агишты, село на юго-востоке Ичкерии, и убили восьмерых сельчан(Citation: 1581). 20 декабря российские военные с блокпоста на улице Садовой в Грозном обстреляли из миномётов университет, педагогический институт, школу № 8 и убили семерых горожан(Citation: 1503). 28 июня 2001 года экипажи двух российских вертолётов у въездов в Элистанжи и Ведено обстреляли ракетами легковые машины, убив троих чеченцев(Citation: 1581).

    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева насчитали с 1999 по 2005 год не меньше 1386 мирных чеченцев, которых российские военные убили огнём в 326 нападениях.
    Авторы пишут, что знают в лучшем случае о 5-10 % жертв, и считают такие удары частью общей стратегии командования оккупационных войск: запугать чеченцев(Citation: 1581).
    Российские суды осудили исполнителей только двух из 255 ударов, которые правозащитники считают прямыми нападениями на мирных чеченцев (подробнее: «Безнаказанность исполнителей»)(Citation: 1581). 27 января 2000 года Парламентская ассамблея Совета Европы осудила «неизбирательное и несоразмерное применение силы» российскими войсками(Citation: 284). 20 апреля 2001 года Комиссия ООН по правам человека «решительно осудила» продолжающееся «несоразмерное и неизбирательное применение силы российскими военными»(Citation: 785).

    8 апреля 2004 года российские лётчики на штурмовиках бомбили Ригахой, горный хутор у границы с подконтрольным России Дагестаном, и убили Майдат Цинцаеву и пятерых её детей. 16 августа 2005 года российская военная прокуратура закрыла дело, объявив, что семья подорвалась на снаряде, который хранила дома(Citation: 1447).

    К концу марта 2000 года российские войска захватили города и сёла Ичкерии, а Вооружённые силы Ичкерии, вынужденные отступить, к лету перешли к партизанской войне(Citation: 1581).
    В захваченных сёлах стояли оккупационные войска и оккупационная администрация, бить по этим сёлам оккупантам стало незачем, и массированные бомбёжки и обстрелы городов и сёл прекратились (подробнее: «Установка новой системы управления»).
    Дальше оккупанты били в основном по горным сёлам и по машинам на дорогах.
    Правозащитники насчитали 83 таких нападения, в которых оккупанты убивали или ранили мирных чеченцев, в 2001 году, 12 - в 2002 году и 10 - в 2005 году(Citation: 1581). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
