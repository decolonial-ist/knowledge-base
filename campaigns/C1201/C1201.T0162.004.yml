  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские военные, милиционеры, а затем силовики оккупационной администрации Кадырова били и пытали задержанных чеченцев.

    С ноября 1999 года оккупанты пытали задержанных чеченцев на блокпостах, в фильтрационном лагере в Моздоке, городе в подконтрольной России Северной Осетии, и в Чернокозове, бывшей колонии на севере Ичкерии (подробнее: «Система фильтрационных лагерей»)(Citation: 281).

    При «зачистках» (так россияне называли обыски домов и задержания чеченцев) российские военные неделями держали чеченцев в ямах при воинских частях, по колено в воде, где узник не мог ни лечь, ни сесть(Citation: 1581).
    Милиционеры из российских регионов, которых МВД России присылало во временные отделы внутренних дел в Грозном и районах, пытали чеченцев в изоляторах этих отделов(Citation: 1581)(Citation: 1210).
    С 2002 года сотрудники оперативно-розыскного бюро № 2 (ОРБ-2), отдела розыска МВД России в Грозном, пытали там чеченцев(Citation: 938).
    Силовики оккупационной администрации Кадырова держали похищенных чеченцев в тайных тюрьмах и пытали их (подробнее: «Система фильтрационных лагерей»)(Citation: 1554).

    Оккупанты избивали задержанных чеченцев, пытали током от полевого телефона, подвешивали, душили пакетом или противогазом и жгли(Citation: 1581)(Citation: 939).
    Пытку током российские военные называли «звонком Масхадову» (по имени президента Ичкерии Аслана Масхадова)(Citation: 1581).

    Оккупанты пытали чеченцев, требуя признаться, что те воевали, и назвать бойцов Вооружённых сил Ичкерии и тайники с оружием.
    Силовики задерживали и пытали знакомых, которых называл узник, а назвавший становился осведомителем - так российские силовые ведомства создавали сеть агентов(Citation: 1581).
    Отпуская узников, оккупанты грозили им расправой за жалобы(Citation: 814)(Citation: 281).

    21 ноября 1999 года на блокпосту «Кавказ-1» на границе Ичкерии с подконтрольной России Ингушетией российские омоновцы избили двух задержанных чеченцев из Самашек, села на западе Ичкерии, а утром отправили их в фильтрационный лагерь в Моздоке(Citation: 694)(Citation: 1491).
    Комендантом блокпоста был полковник Хрулёв(Citation: 1491).
    В январе и феврале 2000 года российская охрана лагеря в Чернокозове била задержанных чеченцев дубинками по пяткам, требуя подписать признание, и клала им на спину раскалённые кирпичи(Citation: 281).

    2 февраля 2000 года российские войска вывезли из больницы в Алхан-Кале, селе к западу от Грозного, десятки тяжелораненых бойцов Вооружённых сил Ичкерии, срывали с них повязки и били по ранам (подробнее: «Убийство пленных и задержанных»).
    Российские врачи в Георгиевске, городе на юге России, ампутировали бойцу Эльберду Саиеву ногу без наркоза, а в августе 2000 года его выпустили по амнистии, когда родные заплатили 7000 долларов(Citation: 1503)(Citation: 281). 27 февраля 2000 года при «зачистке» в Гикало, посёлке под Грозным, оккупанты увезли 14 чеченцев в Октябрьский временный отдел внутренних дел Грозного, где служили милиционеры из Ханты-Мансийского округа.
    На допросе милиционеры отрезали уши Мураду Гелаеву и Сулейману Сериеву.
    Остальных 12 чеченцев позже отпустили, и они рассказали об этом следствию.
    Мурад Гелаев и Сулейман Сериев пропали без вести (подробнее: «Похищение людей»)(Citation: 1210)(Citation: 1581). 15 июля 2010 года Европейский суд по правам человека признал Мурада Гелаева погибшим, а Россию ответственной за его гибель.
    Тело не нашли(Citation: 1210).

    5 марта 2000 года милиционеры Октябрьского отдела задержали Алаудина Садыкова, учителя из Грозного, который раздавал горожанам воду.
    В подвале отдела начальник изолятора Банин прожёг ему ладонь раскалённым штырём, выбил прикладом зубы и заставил съесть его же волосы(Citation: 286)(Citation: 782). 11 марта командир взвода милиции Нагайцев отрезал ему левое ухо, а милиционер Абдулов снимал это на видео(Citation: 286)(Citation: 782).
    В октябре 2003 года Алаудин Садыков рассказал Анне Политковской, журналистке «Новой газеты», что следователь российской прокуратуры Криворотов ответил ему: «Да тебе просто лишнее мясо отрезали»(Citation: 1919). 24 мая 2000 года милиционеры отпустили Алаудина Садыкова без уха и 11 зубов, с четырьмя сломанными рёбрами(Citation: 782).
    Следователи 37 раз приостанавливали и возобновляли дело, а в 2007 году прекратили дело начальника изолятора Банина по амнистии (подробнее: «Безнаказанность исполнителей»). 7 октября 2010 года Европейский суд по правам человека признал, что Алаудина Садыкова пытали, и назвал отрезанное ухо «особенно тяжкой и отвратительной формой жестокого обращения»(Citation: 782).

    8-10 августа 2000 года солдаты российского 245-го полка и пензенские омоновцы задержали 57 чеченцев из Гехи, села к юго-западу от Грозного, и пытали их током в палатке в поле у кладбища, а командующий внутренними войсками МВД России на Северном Кавказе генерал Лабунец бил одного из задержанных ногой в пах(Citation: 1503)(Citation: 1589)(Citation: 1503).
    Оккупанты отпускали чеченцев за деньги, четверых убили, ещё один пропал без вести (подробнее: «Убийство пленных и задержанных»)(Citation: 1589)(Citation: 781)(Citation: 1210).

    21-23 января 2001 года при облаве в Аргуне, городе к востоку от Грозного, оккупанты держали больше 50 задержанных чеченцев раздетыми на бетонном полу зернохранилища при 20 градусах мороза и пытали электрошокером. 26 января российский военный комендант Чеченской Республики Бабичев освободил их после протестов горожан(Citation: 1581).
    С февраля 2001 по сентябрь 2002 года российские войска провели в сёлах Ичкерии не меньше 82 облав, задерживали чеченцев не меньше 14 520 раз и пытали или жестоко избивали не меньше 8218 задержанных (подробнее: «Террор»)(Citation: 1581). 16 июня 2001 года при облаве в Курчалое, селе к юго-востоку от Грозного, российские военные задержали около 120 чеченцев, подвешивали их на деревьях и давили им пальцы плоскогубцами.
    Семерых оккупанты не отпустили. 21 июня на бывшей ферме в нескольких километрах от села чеченцы нашли пять изуродованных тел.
    Родные опознали Хасана Чимаева и двух чеченских милиционеров, ещё два тела опознать не смогли (подробнее: «Убийство пленных и задержанных»).
    Двое остальных к концу июня сидели в районном отделе милиции(Citation: 1502).

    С 21 мая по 11 июня 2002 года в фильтрационном лагере у Мескер-Юрта, села к юго-востоку от Грозного, российские военные генерала Броницкого стачивали задержанным чеченцам зубы напильником, резали им спины ножом и поджигали раны(Citation: 1581)(Citation: 1473).
    Оккупанты убили узника Адама Темерсултанова, ещё 16 задержанных пропали без вести (подробнее: «Система фильтрационных лагерей»)(Citation: 1462). 16-22 августа 2002 года российские военные из 45-го полка спецназа воздушно-десантных войск трое суток держали 67 чеченцев из села Тевзана на юго-востоке Ичкерии в палатке над ямой и пытали током.
    Перед приездом комиссии оккупационного правительства военные угрозами заставили узников сказать, что с ними обращаются нормально.
    После протестов чеченских женщин из шести сёл оккупанты отпустили почти всех(Citation: 1581).

    С апреля по июль 2003 года силовики Кадырова-младшего, начальника службы безопасности оккупационной администрации, держали Умара Исраилова, бойца Вооружённых сил Ичкерии, на базе в Центорое, селе к юго-востоку от Грозного, и часто пытали его при своём начальнике(Citation: 1581)(Citation: 940).
    Чтобы избежать худших пыток, Умар Исраилов согласился перейти в эту службу, а летом 2004 года бежал за границу(Citation: 940). 27 ноября 2004 года силовики Кадырова-младшего, к тому времени первого заместителя председателя оккупационного правительства, похитили в Грозном Шарпуди Исраилова, отца Умара Исраилова, и увезли в Центорой (подробнее: «Захват заложников»).
    В спортзале восемь силовиков привязали его к тренажёру и бильярдному столу, били прикладом и палкой, пытали током от полевого телефона, спрашивая, где сын.
    Шарпуди Исраилов видел, как Кадыров-младший пытал других задержанных.
    Силовики больше 300 дней держали Шарпуди Исраилова в подвале базы «Вега» под Гудермесом и 4 октября 2005 года отпустили, велев молчать: официально задержания не было(Citation: 940). 13 января 2009 года в Вене (Австрия) Богатыров из группы Кальтенбруннера, сторонника Кадырова-младшего среди чеченцев Австрии, пытался похитить Умара Исраилова, чтобы выдать его оккупационной администрации.
    Умар Исраилов вырвался, и Богатыров застрелил его (подробнее: «Преследование за рубежом»)(Citation: 945). 24 октября 2023 года Европейский суд по правам человека признал, что Шарпуди Исраилова пытали, «чтобы узнать, где находится его сын, Умар Исраилов, и убедить того вернуться в Чеченскую Республику»(Citation: 940).

    В сентябре 2005 года силовики Кадырова-младшего из полка милиции имени Ахмата Кадырова увезли из Новых Атагов, села к югу от Грозного, шестерых чеченцев и пытали их током и подвешиванием, требуя признаться в убийстве милиционера.
    Силовики через несколько дней выбросили двоих избитыми, а четверых суд 28 августа 2006 года осудил на год, будто они служили в Вооружённых силах Ичкерии (подробнее: «Фабрикация преступников»)(Citation: 286).
    В январе 2006 года сотрудники ОРБ-2 в Грозном трое суток пытали током и избивали Мехти Мухаева из Зумсоя, горного села на юге Ичкерии, а 1 и 2 февраля снова били, требуя не отказываться от показаний. 17 августа 2006 года суд осудил его по выбитым показаниям (подробнее: «Фабрикация преступников»)(Citation: 286).

    13 ноября 2006 года правозащитники Human Rights Watch заявили в Женеве, что в официальных и тайных тюрьмах Ичкерии пытки «являются обыденным явлением»(Citation: 1575). 13 марта 2007 года Европейский комитет по предупреждению пыток заявил, что любой задержанный, который сразу не признался в том, в чём его подозревали, был «в непосредственной опасности жестокого обращения»(Citation: 939).
    Правозащитники в докладе «Международный трибунал для Чечни» насчитали, что с 1999 по 2005 год российские силовики пытали чеченцев или жестоко обращались с ними не меньше 10 304 раз, в 1632 случаях - с тяжёлыми увечьями.
    Авторы доклада не нашли ни одного уголовного дела о пытках при облавах (подробнее: «Безнаказанность исполнителей»)(Citation: 1581).

    В середине сентября 2008 года силовики оккупационной администрации Кадырова-младшего похитили Петимат, которая шла искать сына, в Центорое Ножай-Юртовского района на юго-востоке Ичкерии, били её дубинками по ногам и пытали током.
    На 11-й день следователи районного отдела российской милиции отпустили Петимат, а 3 декабря 2008 года суд осудил её условно (подробнее: «Фабрикация преступников»)(Citation: 287).
