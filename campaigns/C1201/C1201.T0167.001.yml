  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия обещала бойцам Вооружённых сил Ичкерии амнистию за сданное оружие, а мирным чеченцам - безопасность дома и свободу после проверки, но оккупанты похищали, сажали в тюрьмы и убивали тех, кто им поверил.

    6 декабря 1999 года войска генерала Казанцева, командующего российскими войсками на Северном Кавказе, разбросали над Грозным несколько тысяч листовок «Пропуск»(Citation: 1504)(Citation: 1512).
    В листовках оккупанты обещали свободу, безопасность и помощь врачей бойцам Вооружённых сил Ичкерии, которые сдадут оружие(Citation: 1504).

    13 декабря 1999 года депутаты в Москве постановлением № 4784-II ГД объявили амнистию тем, кто прекратит сопротивление и сдаст оружие до февраля 2000 года, кроме обвинённых в убийстве, похищении человека и нападении на российских милиционеров(Citation: 1562)(Citation: 1210).
    К апрелю 2000 года Россия продлила срок амнистии до 15 мая(Citation: 766).

    Оккупанты амнистировали только тех, кто сдавал оружие, а те, у кого оружия не было, покупали автомат, чтобы его сдать(Citation: 1448)(Citation: 1456).
    Российский военный комендант района и начальник районного отдела ФСБ подписывали справку об амнистии, а следователь ФСБ и прокурор района - постановление об отказе заводить уголовное дело(Citation: 1581).

    Российские офицеры обещали чеченцам, которые прятались от обстрелов или уходили из сёл, что их не тронут дома или отпустят после проверки документов(Citation: 279)(Citation: 1210).

    6 июня 2003 года депутаты в Москве постановлением № 4125-III ГД объявили новую амнистию тем, кто сдастся до 1 сентября 2003 года(Citation: 795)(Citation: 1536).
    Россия поручила оккупационной администрации Кадырова решать, кого амнистировать.
    Администрация амнистировала сдавшихся, если они шли служить в её силовые подразделения, а отказавшихся её силовики преследовали, похищали и убивали (подробнее: «Принудительная мобилизация»)(Citation: 286)(Citation: 1581).

    27 декабря 1999 года российский офицер пообещал чеченской семье на окраине Старопромысловского района Грозного, что обстрелов больше не будет. 28 декабря, когда мать и дочь из этой семьи вернулись домой, восемь или девять российских солдат убили обеих из автоматов и подожгли дом (подробнее: «Массовые убийства гражданских»)(Citation: 279).

    23 января 2000 года российские внутренние войска МВД (предшественники современной Росгвардии) задержали в Грозном Сулеймана Медова, и генерал Трошев, первый заместитель командующего российскими войсками в Ичкерии, пообещал отпустить его после проверки документов.
    Солдаты избили его и бросили в яму, охранники три месяца били его в изоляторах в Ичкерии и на юге России, а 3 мая отпустили со справкой об амнистии (подробнее: «Пытки и истязания»)(Citation: 1581). 23 февраля Юсуп Сатабаев сдался российским военным у Мартан-Чу, села к юго-западу от Грозного, и 27 июля следователь прекратил его дело по амнистии.
    Милиция соседнего города Урус-Мартан оставила его под арестом «за бродяжничество», 13 августа он пропал без вести, а 22 августа его тело нашли у Гой-Чу, села к юго-западу от Грозного (подробнее: «Убийство пленных и задержанных»)(Citation: 1210). 6 марта 2000 года на посту у Дуба-Юрта, села к югу от Грозного, российский офицер пообещал отпустить после проверки документов 12 чеченцев, уходивших из горного села Улус-Керт на юге Ичкерии, и ни один из них не вернулся домой (подробнее: «Похищение людей»)(Citation: 1210).

    13 марта 2000 года российские солдаты 245-го полка полковника Юдина на посту у Мартан-Чу задержали троих бойцов Вооружённых сил Ичкерии, которые спустились с гор без оружия.
    Военные пообещали им амнистию за добровольную сдачу и узнали, где в горах прячутся другие бойцы.
    Затем солдаты увезли всех троих, и они пропали без вести(Citation: 1581). 14 марта двое чеченцев из Мартан-Чу, которые служили на посту вместе с российскими военными, нашли в горах группу бойцов, рассказали об амнистии и пригрозили ударами артиллерии и авиации, если бойцы не выйдут до 15 часов.
    У Романа Берснукаева не было оружия, и двое из Мартан-Чу сказали, что амнистию ему дадут, только если он сдаст оружие(Citation: 1448).
    Он раздобыл автомат и с девятью другими бойцами, среди них Исламом Дубаевым, вышел к посту(Citation: 1448).
    Военные накормили их, а через 20 минут связали им руки и увезли на грузовике в штаб группировки российских войск «Запад» у села Танги-Чу(Citation: 1581).
    С 13 по 15 марта у Мартан-Чу сдался 21 человек, и 11 из них пропали без вести(Citation: 1210).

    Штаб «Запад» передал восьмерых сдавшихся в районный отдел ФСБ в Урус-Мартане. 17 марта 2000 года генерал Наумов, военный комендант Урус-Мартановского района, вместе с Фоминым, начальником районного отдела ФСБ, подписал справки об амнистии Исламу Дубаеву, Роману Берснукаеву, Адаму Абубакарову и Исе Идрисову, после чего все четверо пропали без вести(Citation: 1210).
    Родные вскоре вызволили ещё двоих.
    Российские следователи сразу после амнистии обвинили Мовсара Бекаева и Мурада Юсупхаджиева в похищениях людей, а освободили их только летом 2001 года, когда суды отвергли обвинения(Citation: 1581).
    Начальник отдела ФСБ Фомин отдал Ризвану Дубаеву, отцу Ислама Дубаева, копию справки об амнистии и сказал, что сын, наверное, снова ушёл в горы(Citation: 1210).
    После амнистии Адама Абубакарова не освободили, а исполнявший обязанности прокурора Урус-Мартановского района Илюшенко 2 ноября 2000 года ответил его отцу в письме № 744, что сына амнистировали, и добавил: «В своем объяснении А. И. Абубакаров указал, что в дальнейшем после фильтрации планирует выехать к родственникам» (речь о проверке в фильтрационном лагере)(Citation: 1581). 11 февраля 2010 года Европейский суд по правам человека признал Россию ответственной за гибель Ислама Дубаева и Романа Берснукаева.
    Суд написал, что справки об амнистии от 17 марта 2000 года «недостаточны, чтобы освободить правительство от ответственности за судьбу задержанных, которых в последний раз видели живыми в его руках»(Citation: 1448).
    Судьба Адама Абубакарова, Исы Идрисова и остальных пропавших без вести неизвестна(Citation: 1210)(Citation: 1581).

    20 марта 2000 года в Гой-Чу войска генерала Герасимова через мегафоны обещали амнистию окружённым защитникам, а после сдачи военные расстреляли 12 или 13 сдавшихся (подробнее: «Убийство сдающихся»)(Citation: 1129)(Citation: 1474)(Citation: 1581). 28 апреля двое братьев из села Галайты на юго-востоке Ичкерии получили амнистию. 26 декабря российские силовики увезли их из дома в воинскую часть у села Центорой, и братья пропали без вести(Citation: 1210). 5 мая 2000 года районный отдел ФСБ в Шали, городе к юго-востоку от Грозного, амнистировал Адама Чимаева, служившего в МВД Ичкерии. 3 декабря российские силовики задержали его на посту у Шали, а в феврале 2001 года родители нашли его тело в массовом захоронении у Грозного и выкупили его у силовиков за 3000 долларов (подробнее: «Надругательство над мёртвыми»)(Citation: 1210). 6 мая 2000 года около 20 бойцов ОМОНа, милицейского спецназа из Пензы, арестовали Зелимхана Эльмурсаева, хотя его мать отдала российскому коменданту автомат, чтобы сына амнистировали.
    Бойцы ОМОНа избивали его, требуя признаться в боях за Гой-Чу, и 13 мая отпустили, когда он подписал, что его не пытали (подробнее: «Пытки и истязания»)(Citation: 786).

    Летом 2000 года Магомед Вахидов, в 1999 году мэр Урус-Мартана при правительстве Ичкерии, получил амнистию и вернулся домой. 20 июля 2001 года российские силовики задержали его, а 31 июля его тело со следами пыток нашли в садах к востоку от Урус-Мартана (подробнее: «Убийство пленных и задержанных»)(Citation: 1581). 2 декабря 2000 года российские омоновцы арестовали в Гвардейском, селе на севере Ичкерии, четверых амнистированных чеченцев и порвали их справки об амнистии.
    Родные выкупили каждого за 200-400 долларов (подробнее: «Захват заложников»)(Citation: 1503).

    В июне 2003 года глава администрации Дуба-Юрта передал жене Хамзата Тушаева, что его амнистируют за сданное оружие, а 12 июня Хамзат Тушаев купил автомат и сдал его в ФСБ по Чеченской Республике.
    В марте 2006 года милиция Шали держала его по делу об участии в армии Ичкерии, а 8 июня 2006 года он пришёл по вызову в прокуратуру в правительственном комплексе в Грозном и пропал без вести за охраняемым входом (подробнее: «Похищение людей»)(Citation: 1456).
    В сентябре 2004 года Бислан Баширов пришёл с повинной в ФСБ, сдал оружие, и следователи ФСБ освободили его от уголовной ответственности. 25 октября сотрудники отдела МВД России в Урус-Мартане увезли его из дома и пытали током, пока он не оговорил себя, а российский Верховный суд Чеченской Республики осудил его (подробнее: «Фабрикация преступников»)(Citation: 286).
    В марте 2005 года силовики Кадырова-младшего, первого заместителя председателя оккупационного правительства, пообещали родным Ильмана Хадисова отпустить его после допроса, и дядя отвёл его к силовикам. 13 мая силовики привезли тело Ильмана Хадисова в милицию Гудермеса, города к востоку от Грозного, и объявили, что убили его в бою (подробнее: «Ложь о собственных действиях»)(Citation: 1581).

    Human Rights Watch в 2003 году со ссылкой на Московскую Хельсинкскую группу писала: «большинство из 500 человек, сложивших оружие с 1999 г., были убиты или пропали без вести»(Citation: 1536).
    Правозащитники «Мемориала» и Международной федерации за права человека в 2006 году писали, что почти любого бойца, воевавшего против российских войск, можно было вывести из-под амнистии(Citation: 286).
    Правозащитники «Мемориала» в 2012 году писали, что амнистия не защищала от нового ареста, а «для многих оформление амнистии на деле означало исчезновение»(Citation: 1210).
    Имена амнистированных, которых российские силовики похитили или убили в 1999-2000 годах, есть в книге «Мемориала» о пропавших без вести чеченцах(Citation: 1210).

    22 сентября 2006 года депутаты в Москве постановлением № 3498-4 ГД объявили ещё одну амнистию тем, кто сдаст оружие, а право решать, кого амнистировать, получило МВД Чеченской Республики, подконтрольное председателю оккупационного правительства Кадырову-младшему(Citation: 796)(Citation: 286).
