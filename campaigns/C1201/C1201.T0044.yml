  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты обстреливали школы и вузы Ичкерии, занимали их здания под свои отделы, а студентов задерживали на блокпостах, при облавах на сёла и в университете.

    Российские военные и милиционеры занимали уцелевшие школы под отделы милиции, комендатуры и жильё для себя(Citation: 1683)(Citation: 1503)(Citation: 1886).
    Российские войска бомбёжками и обстрелами разрушили или повредили все до одной из больше чем 60 школ и интернатов Грозного, а в горах за две войны - почти все школы (подробнее: «Тотальное уничтожение инфраструктуры»)(Citation: 1470).

    Оккупанты убили при нападениях десятки чеченских студентов университета (подробнее: «Неизбирательные нападения»)(Citation: 1443).
    Ещё десятки пропали без вести после того, как российские военные незаконно задержали их при «зачистках» (так россияне называли обыски домов и задержания чеченцев) (подробнее: «Похищение людей»)(Citation: 1443).
    На блокпостах солдаты оккупационных войск постоянно задерживали чеченских студентов, поэтому родители провожали взрослых детей на занятия и обратно(Citation: 1443).

    Когда в октябре 1999 года начались бои, в Чеченском государственном университете в Грозном, где учились 8500 студентов, отменили занятия(Citation: 1443).

    В 2000 году сотрудники временного отдела российской милиции Октябрьского района Грозного заняли здание единственной в республике школы-интерната для глухих детей на улице Павла Мусорова.
    Здание построили специально для этой школы, и оно уцелело при бомбёжках(Citation: 1886)(Citation: 1581).
    В школе стоял ОМОН из Ханты-Мансийского округа в Сибири, а в январе 2001 года начальником отдела был Кондаков(Citation: 1173).
    Сотрудники отдела пытали в бывшей школе похищенных чеченцев (подробнее: «Пытки и истязания»), и соседи ушли из своих домов(Citation: 1886).

    Учителя школы для глухих ходили к милиционерам и спрашивали, когда здание освободят.
    Анна Политковская писала в «Новой газете» в июне 2003 года, что милиционеры отвечали им: «Нужно распоряжение министра [российского МВД] Грызлова».
    Педагоги искали знакомых в Москве, чтобы добиться такого распоряжения, а милиционеры над ними насмехались.
    Совет учителей школы решил: «С детьми туда идти нельзя».
    В июне 2003 года 68 глухих детей со всей республики учились в шести комнатах частного дома, который нашла учительница Светлана Голечко(Citation: 1886).
    Милиционеры ушли из здания школы 26 мая 2006 года.
    На следующий день рабочие оккупационной администрации Грозного начали сносить здание и вскоре снесли его вместе с камерами в подвале, где милиционеры держали узников(Citation: 1581).

    В марте 2000 года университет снова открылся, но оккупационные войска часто обстреливали его здание.
    Бывало, что российские солдаты вырывали студентов из рук плачущих родителей и незаконно задерживали(Citation: 1443).
    В 2000 году родители боялись отправлять детей учиться в Грозный, и вузы набрали первокурсников почти без конкурса(Citation: 1470).

    В июле 2000 года ОМОН из Санкт-Петербурга, которым командовал Сидоров, жил в школе № 18 на улице Ленина у площади Минутка в Грозном и к 1 сентября выезжать не собирался(Citation: 1683).
    Стены всех трёх этажей школы были исписаны надписью «Всем волкам — собачья смерть» и матом о том, что надо сделать с чеченцами, чтобы их не было (подробнее: «Дегуманизация»)(Citation: 1683). 1 сентября 2000 года в Грозном открылась 41 школа, по неофициальным данным - 37, и почти ни в одной не было оконных рам и отопления(Citation: 1470).
    В Шатое, районном центре в горах на юге Ичкерии, учебный год в тот день начался в палатках, потому что российские военные с милиционерами держали комендатуру с отделом милиции в зданиях средней школы и школы-интерната (подробнее: «Подселение чиновников и военных»)(Citation: 1503). 20 декабря 2000 года военные с российского блокпоста на улице Садовой в Грозном обстреляли из миномётов университет и педагогический институт, убив семерых горожан, среди них пятерых студентов педагогического института (подробнее: «Неизбирательные нападения»)(Citation: 1503).

    К апрелю 2001 года в Грозненском нефтяном институте из 600 преподавателей, которые работали там до первой войны, осталось 234, а студентов - меньше половины довоенного числа.
    Институт сократил занятия из-за комендантского часа и угрозы российских артиллерийских обстрелов(Citation: 1443).
    В мае 2001 года российские военные из отряда, стоявшего у Хоттуни, села Веденского района на юго-востоке Ичкерии, обстреляли из всех видов оружия школу в соседних Махкетах и почти уничтожили школьную библиотеку(Citation: 1751).

    12 ноября 2001 года оккупационные войска на бронетранспортёрах оцепили здание Чеченского государственного университета в Грозном.
    Несколько часов военные в масках выводили студентов из аудиторий, ставили к стене, обыскивали, ругались матом и оскорбляли их как чеченцев и мусульман.
    Солдаты оскорбили декана юридического факультета, который не дал задержать своего сына, а декана финансово-экономического факультета избили.
    Оккупанты увезли семерых студентов в Ханкалу, главную базу оккупационных войск на восточной окраине Грозного.
    После массовых протестов военные отпустили шестерых, не меньше двоих - сильно избитыми, а судьба седьмого, по данным «Мемориала», осталась неизвестной(Citation: 1581).
    В докладе Парламентской ассамблеи Совета Европы сказано, что 3 декабря 2001 года ректор университета подтвердил делегации ассамблеи: сообщения о «нарушениях прав человека федеральными силами [российскими войсками] и незаконных задержаниях» действительно поступали(Citation: 959).

    1 июня 2002 года, в день, когда школьники писали экзаменационное сочинение, российские военные при облаве в Мескер-Юрте, селе к юго-востоку от Грозного, разорили школу № 2 и разбросали экзаменационные билеты по кабинету директора.
    За 21 день облавы оккупанты ещё 14 раз приходили в школу портить двери и бить окна, а дети так и не сдали экзамены (подробнее: «Террор»)(Citation: 1803).

    Чеченская организация «Лам» писала в сентябре 2000 года, что в горных сёлах выросло не одно поколение детей без образования и вернулась неграмотность(Citation: 1470).
    В апреле 2001 года в бюллетене «Лама» сказано, что за две войны России против Ичкерии российские войска бомбёжками и обстрелами разрушили в республике школы с лабораториями, оборвав культурную преемственность целого поколения чеченцев(Citation: 1443).

    В январе 2005 года силовики Кадырова-младшего, первого заместителя председателя оккупационного правительства, которые насильно забирали подростков Веденского района в свой отряд, заняли школы в двух сёлах района и закрыли двери перед учителями и учениками (подробнее: «Принудительная мобилизация»)(Citation: 2003).
