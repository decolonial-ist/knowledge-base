  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия набирала из перешедших на её сторону чеченцев вооружённые отряды, платила их бойцам и награждала командиров, а те воевали против Ичкерии и преследовали чеченцев.

    С осени 1999 года командующие оккупационными войсками договаривались с чеченскими командирами о переходе на сторону России и создавали из местных чеченцев вооружённые отряды («отряды самообороны»).
    Эти отряды стояли на блокпостах, патрулировали вместе с российскими солдатами и сопровождали колонны российских войск(Citation: 1129).

    В 2000 году глава оккупационной администрации Кадыров создал службу безопасности из своих родственников и односельчан.
    ФСБ России курировала службу, российское государство давало ей деньги, а остальное бойцы собирали поборами (подробнее: «Административная коррупция и вымогательство»).
    Сначала в службе было несколько десятков человек, а к 2004 году - больше 1,5 тысячи(Citation: 286).

    Бойцов набирали через амнистии Государственной думы 2003 и 2006 годов.
    Силовики службы безопасности пытками и угрозами семьям заставляли пленных бойцов Вооружённых сил Ичкерии и сдавшихся вступать в неё (подробнее: «Принудительная мобилизация»)(Citation: 286).
    Вступившим давали машины и постоянный доход, а при массовой безработице в службу шли и молодые чеченцы, которые не воевали(Citation: 286).

    Осенью 2003 года оккупанты в основном из людей службы безопасности создали полк поставленного Россией МВД республики для охраны нефтяных промыслов и нефтепроводов («нефтяной полк») на 2-2,5 тысячи человек, а в июле 2004 года - полк патрульной милиции имени Ахмата Кадырова на 1125 человек.
    Остальные люди службы безопасности перешли в Антитеррористический центр, из которого весной 2006 года Москва сделала батальоны «Север» и «Юг» внутренних войск МВД России (предшественники современной Росгвардии)(Citation: 286).
    К 2005 году выходцы из службы безопасности заняли почти все ключевые должности в МВД республики(Citation: 941).

    Российская военная разведка в 2003-2005 годах превратила отряды Какиева и Ямадаевых, чеченских командиров на службе России, в батальоны «Запад» и «Восток» 42-й дивизии Министерства обороны России, подчинённые напрямую Генеральному штабу российской армии(Citation: 286)(Citation: 941).
    Командиры батальонов каждый месяц докладывали командиру 42-й дивизии Суровикину о своих рейдах, а каждое представление к награде подтверждали фото- и видеоотчётами(Citation: 1581).

    В октябре 1999 года российские войска окружили Гудермес, второй по величине город Ичкерии.
    Командующий восточной группировкой оккупационных войск Трошев вёл переговоры с братьями Ямадаевыми, командирами отрядов в городе, и с Кадыровым, которого президент Ичкерии Аслан Масхадов в том же месяце снял с поста муфтия, главы мусульманского духовенства Ичкерии, и объявил вне закона.
    Трошев писал в мемуарах о Кадырове: «Обещал помочь выдворить бандитов [так россияне называли Вооружённые силы Ичкерии].
    Его слова не разошлись с делом»(Citation: 1129).
    Двое из братьев Ямадаевых перешли на сторону оккупантов, и 12 ноября 1999 года российские войска захватили Гудермес без боя(Citation: 1129)(Citation: 941)(Citation: 1442).
    В июне 2000 года Россия поставила Кадырова главой оккупационной администрации республики (подробнее: «Марионеточное правительство»).
    После того как 9 мая 2004 года Кадыров погиб от взрыва на стадионе в Грозном, Путин указом от 10 мая посмертно дал ему звание Героя России, а на следующий день передал звезду на хранение Кадырову-младшему, первому заместителю председателя оккупационного правительства(Citation: 1130).
    Один из перешедших братьев Ямадаевых стал заместителем российского военного коменданта республики, а потом депутатом Государственной думы России.
    Другой с марта 2002 года командовал ротой специального назначения при военной комендатуре республики, которая участвовала в облавах и похищениях чеченцев(Citation: 286).
    В марте 2003 года защитники Ичкерии убили командира роты взрывом в Веденском районе на юго-востоке республики, а 22 марта, накануне «референдума» о конституции республики, президент России Путин посмертно наградил его званием Героя России(Citation: 286)(Citation: 1869).
    Третий брат, который в 1999 году ушёл из Гудермеса в горы, перешёл к оккупантам и с 2003 года командовал этой ротой, а затем батальоном «Восток»(Citation: 1129)(Citation: 286).
    Командир «Востока» Ямадаев в 2005 году получил звание Героя России (подробнее: «Безнаказанность исполнителей»)(Citation: 2014), а с 2004 по 2008 год учился в Военной академии имени Фрунзе(Citation: 1581).

    30 ноября 1999 года Гантамиров, бывший глава Грозного, помилованный президентом России Ельциным, чтобы собрать отряд из своих сторонников (подробнее: «Марионеточное правительство»), создал в Ачхой-Мартане, селе к юго-западу от Грозного, «штаб вооруженных сил Чеченской Республики» и отряд милиции особого назначения (ОМОН)(Citation: 769)(Citation: 687). 8 декабря отряд Гантамирова вместе с российской армией захватил Урус-Мартан, город к юго-западу от Грозного, а с 26 декабря штурмовал Грозный вместе с российскими милиционерами и внутренними войсками(Citation: 1464)(Citation: 1129).
    В конце 1999 года российская военная разведка собрала в Надтеречном районе на севере Ичкерии роту специального назначения под командованием Какиева из его прежних бойцов, их родственников и друзей(Citation: 286). 18 июля 2000 года у Аргуна, города к востоку от Грозного, по трассе ехала колонна машин без номеров с автоматами и миномётом, и российские офицеры называли её «новым чеченским ОМОНом, только что нами созданным по желанию Кремля»(Citation: 1675).

    26 ноября 2001 года Россия поставила начальником милиции Чеченской Республики чеченца Пешхоева(Citation: 959).
    В мае 2003 года администрация президента России, по данным «Новой газеты», назначила командиром чеченского ОМОНа Колханова, начальника охраны главы оккупационной администрации Кадырова(Citation: 1880).

    В октябре 2004 года представитель президента России на юге России Козак назначил Кадырова-младшего, первого заместителя председателя оккупационного правительства, своим «советником по силовым структурам»(Citation: 1985). 29 декабря 2004 года Путин дал Кадырову-младшему звание Героя России (подробнее: «Безнаказанность исполнителей»)(Citation: 1581).
    После этого Москва выделила службе безопасности дополнительные деньги и позволила ей расширяться(Citation: 941).
    Весной 2005 года Эшиев, командир Вооружённых сил Ичкерии, сдался со своими бойцами под гарантии Кадырова-младшего, и тот поставил его начальником отделения Антитеррористического центра в Веденском районе, где Эшиев раньше воевал против российских войск. 10 ноября 2005 года, в День милиции, Эшиеву вручили медаль, хотя с 7 сентября его разыскивали за убийство в Грозном(Citation: 286).

    Правозащитники «Мемориала» в 2005 году писали, что передача войны в руки чеченских силовиков («чеченизация») выгодна Москве: командиры Вооружённых сил Ичкерии, которых убивают чеченцы, не обретают в глазах людей образ «мученика и борца за свободу, павшего от рук чужеземцев», а в республике возникает «новая страта [слой] людей, зависимых от российской власти».
    Кровная месть, по их словам, «„повязывает кровью“ новые республиканские силовые структуры с поддерживающей их федеральной властью».
    Правозащитники писали, что российское государство давало этим структурам снабжение, деньги, политическую поддержку и «гарантии безнаказанности»(Citation: 820).
    В докладе «Мемориала» и ещё четырёх правозащитных организаций 2005 года сказано: «…федеральный центр [российское руководство] делегировал [передал] право на незаконное насилие прежде всего этим структурам»(Citation: 941).
    Международная федерация за права человека и «Мемориал» в 2007 году писали, что многие отряды состоят из бывших бойцов, «силой или шантажом переведенных в стан их бывшего противника», а «в абсолютном большинстве этих чеченских структур работают представители российских силовых ведомств»(Citation: 286).
    Авторы доклада Международного трибунала для Чечни в 2009 году писали, что Россия создавала или контролировала службу безопасности главы оккупационной администрации Кадырова и Антитеррористический центр, а их бойцы фактически действовали от имени российского государства(Citation: 1581).

    15 февраля 2007 года, в день отставки Алханова с поста главы оккупационной администрации, Путин указом № 171 наградил его орденом «За заслуги перед Отечеством» IV степени «за большой вклад в… укрепление российской государственности и конституционного строя» и назначил заместителем министра юстиции России(Citation: 896)(Citation: 898).
