description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты и силовики оккупационной администрации Кадырова заставляли сдавшихся бойцов Вооружённых сил Ичкерии каяться перед камерой, а родителей ушедших к сопротивлению - звать сыновей домой по телевидению и отрекаться от них.

    6 июня 2003 года депутаты в Москве постановлением № 4125-III ГД пообещали не судить по амнистии тех, кто сдастся до 1 сентября 2003 года (подробнее: «Ложные гарантии безопасности»)(Citation: 795).
    Россия отдала решение, кого амнистировать, оккупационной администрации Кадырова, а в 2006 году - министерству внутренних дел этой администрации(Citation: 286).

    Оккупационная администрация Кадырова снимала на камеру, как сдавшийся по амнистии 2003 года отдаёт оружие, рассказывает, где и с кем воевал, и подписывает бумаги о раскаянии.
    Из сдавшихся не пропадали без вести только те, кто шёл служить Кадырову-младшему, начальнику службы безопасности оккупационной администрации (подробнее: «Принудительная мобилизация»)(Citation: 1909).

    В 2007-2008 годах главы районов оккупационной администрации и районная оккупационная милиция под угрозой для всей семьи (подробнее: «Принудительная выдача беглых и повстанцев») заставляли родителей ушедших к вооружённому сопротивлению звать сыновей домой перед камерой телевидения и публично отрекаться от них(Citation: 287).

    8 марта 2004 года министр обороны Ичкерии Магомед Хамбиев сдался подчинённым начальника службы безопасности оккупационной администрации Кадырова-младшего, чтобы спасти родственников, которых они захватили в заложники (подробнее: «Захват заложников»)(Citation: 1518). 12 марта Магомед Хамбиев заявил на пресс-конференции в Гудермесе, городе к востоку от Грозного, что эта служба его родных в заложники не брала, а в ноябре 2005 года признал, что говорил это, спасая жизнь семьи(Citation: 286).

    10 июня 2004 года первый заместитель председателя оккупационного правительства Кадыров-младший в Центорое, своём родном селе к юго-востоку от Грозного, показал журналистке Анне Политковской начальника охраны Аслана Масхадова Шаа Турлаева.
    Силовики держали Шаа Турлаева там под охраной.
    Переводчик Кадырова-младшего, называвший себя Николаем Ивановичем, выдавал каждые три слова Шаа Турлаева за несколько фраз о вреде Аслана Масхадова(Citation: 1962).
    К октябрю 2008 года Турлаев вошёл в ближайшее окружение Кадырова-младшего, и прокуратура Австрии назвала Турлаева заказчиком убийства Умара Исраилова в Вене 13 января 2009 года (подробнее: «Преследование за рубежом»)(Citation: 2162).

    8 марта 2005 года, в день, когда российские силовики убили Аслана Масхадова (подробнее: «Переговоры как прикрытие нападения»), Кадыров-младший объявил, что от президента Ичкерии хотели, чтобы тот «принес извинения чеченскому народу»(Citation: 1483).

    В 2006 году двое сыновей чеченца из Тевзаны, села на юго-востоке Ичкерии, ушли к вооружённому сопротивлению.
    Районный отдел милиции оккупационной администрации постоянно вызывал отца, показывал ему фотографию сыновей с бойцами в лесу и грозил, что за них расплатится вся семья и что семью могут убить.
    Зимой 2007 года отец публично отрёкся от сыновей в мечети. 5 декабря 2008 года около 30 вооружённых силовиков этой администрации в камуфляже приехали к дому семьи на шести машинах.
    Силовики положили отца и мать лицом на пол, закрыли во втором доме, облили первый дом бензином и подожгли (подробнее: «Коллективные наказания»). 19 марта 2009 года отец рассказал Human Rights Watch: «По нашим традициям они мне больше не сыновья.
    Думал, так легче станет.
    Не помогло!»
    Семья живёт в единственной уцелевшей комнате, а о сыновьях родители с весны 2006 года ничего не знают(Citation: 287).

    6 августа 2008 года в Аргуне, городе к востоку от Грозного, после выступления главы оккупационной администрации города Темирбаева перед имамом и силовиками родители ушедших к сопротивлению записали на камеру для телевидения призыв к сыновьям сложить оружие (подробнее: «Принудительная выдача беглых и повстанцев»)(Citation: 944). 9 августа глава оккупационной администрации Кадыров-младший объявил, что некоторые родные бойцов «публично отказываются от своих родственников, но тайно помогают им»(Citation: 287).

    16 августа 2008 года мэр Грозного Хучиев перед камерой телевидения предложил родственникам бойцов обратиться к сыновьям (подробнее: «Принудительная выдача беглых и повстанцев»).
    Грозненское телевидение показало, как плачущие родные умоляли сыновей вернуться домой(Citation: 287).

    В 2007 году правозащитники «Мемориала» и Международной федерации за права человека писали, что бывшему бойцу, чтобы избежать суда, было достаточно присягнуть на верность Кадырову-младшему (подробнее: «Принудительная мобилизация»)(Citation: 286).

    В начале марта 2009 года на встрече руководства Шалинского района, начальника районной милиции Даудова и прокурора Сербиева с молодёжью в Шали, городе к юго-востоку от Грозного, Юсуп Эбишев, чей сын ушёл к сопротивлению, сказал, что за уход молодёжи в лес отвечает всё общество.
    Юсуп Эбишев не стал плакать и унижаться, как родители, которых показывали по телевизору. 12 марта силовики Кадырова-младшего второй раз за полгода подожгли дом во дворе Эбишевых (подробнее: «Коллективные наказания»)(Citation: 943)(Citation: 287).
