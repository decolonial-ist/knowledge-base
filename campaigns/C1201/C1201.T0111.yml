description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты, а позже и силовики оккупационной администрации Кадырова прикрывались в бою мирными чеченцами.

    Российские военные выводили чеченцев из подвалов, брали задержанных на облавах и прикрывались ими при штурме сёл, при обысках домов, чтобы бойцы Вооружённых сил Ичкерии не стреляли(Citation: 1581)(Citation: 1478)(Citation: 817).
    Оккупанты вели чеченцев под прицелом перед танками, сажали на бронетранспортёры или за руль машин в своих колоннах, оставляли на поле между своими позициями и селом, где были защитники(Citation: 1478)(Citation: 820)(Citation: 1512).

    В феврале 2000 года в Новых Алдах, посёлке на южной окраине Грозного, российские солдаты при обыске пустили перед собой пожилую чеченку Абу Маашеву(Citation: 817).
    В том же месяце при обысках в Гехи-Чу, селе к юго-западу от Грозного, российские войска генерала Шаманова прикрывались толпой примерно из 40 чеченских мужчин, среди них стариков и подростков 12-13 лет(Citation: 1581).

    5 марта 2000 года, на следующий день после прорыва защитников Ичкерии в Гой-Чу, село к юго-западу от Грозного, чеченцы под огнём артиллерии и вертолётов оккупантов вышли из села к российскому блокпосту(Citation: 1129).
    Военные загнали их за ограду участка, позади которой стояли позиции войск.
    Оккупанты не выпускали оттуда до 9 марта около 6500 чеченцев всех возрастов, всё население села, оставив их на линии огня.
    С 5 по 9 марта по полю из села не стреляли ни разу, а российские войска с позиций за оградой без перерыва обстреливали Гой-Чу из танков и реактивных систем залпового огня, которые не могут бить прицельно (подробнее: «Неизбирательные нападения»).
    Тех, кто выходил за ограду за дровами, солдаты загоняли обратно огнём из автоматов и пулемётов.
    Военные не пустили роженицу в больницу и не дали сельским врачам съездить за лекарствами, из-за чего умерли двое детей (подробнее: «Медицинская и гуманитарная блокада»).
    На поле умерли 32-летний Ами Килаев, 62-летний мужчина из семьи Цуцураевых и Абдурахман Гелаев, у которого остановилось сердце, когда солдаты попытались отделить мужчин от женщин. 8 марта пьяные военные стреляли из автоматов над толпой и ранили четверых.
    Солдаты увели из толпы шесть или семь мужчин, двоих из них потом нашли застреленными в Урус-Мартане, городе к юго-западу от Грозного (подробнее: «Похищение людей»)(Citation: 1581).

    Апти Бисултанов, чеченский поэт из Гой-Чу, 12 марта 2006 года рассказал в берлинской телепередаче «Страна и люди», как солдаты обращались с его матерью: «Это пушечное мясо [российские солдаты] держало на снегу мою постельную больную мать… ежедневно подходило… ещё приговаривало, пристрелить её или нет».
    Она умерла в 2005 году в подконтрольной России Ингушетии: «Не имела права быть похоронена рядом со своим мужем из-за того, что я её сын, я разделяю идею чеченской независимости.
    Её пришлось тайно похоронить»(Citation: 3308).

    9 марта 2000 года военные от имени командования оккупационных войск потребовали от главы администрации Гой-Чу увести людей с поля обратно в село под обстрел(Citation: 1581).
    Салман Бохарчиев из Гой-Чу 19 апреля 2000 года рассказал на видео правозащитникам Виктору Попкову и Станиславу Божко: «Нам советовали: ни в коем случае не выход из села, а только в село».
    Люди решили прорываться: «Пусть нас в таком случае убивают всех.
    Вот мы к этому и пришли, и тронулись»(Citation: 1563).
    Солдаты на блокпосту не стали стрелять, а горожане Урус-Мартана прислали автобусы и машины, на которых развезли людей из Гой-Чу по своим домам.
    В 2009 году правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева писали, что за то, что войска пять дней держали чеченцев живым щитом, отвечают генералы Трошев, Герасимов и Лабунец, которые руководили российскими войсками у Гой-Чу(Citation: 1581).

    В сентябре 2000 года российские военные в бою с защитниками Ичкерии прикрывались чеченцами в Верхних Курчалях, селе на юго-востоке Ичкерии(Citation: 1503).
    В сентябре 2001 года у Старых Атагов, села к югу от Грозного, солдаты 48-го полка внутренних войск МВД России (предшественников современной Росгвардии) заставили чеченца из села вести в колонне полка микроавтобус с его женой и четырьмя детьми, а ещё троих сельчан посадили на бронетранспортёр(Citation: 1512).

    30 декабря 2001 года российские войска под руководством командующего оккупационными войсками Молтенского устроили облаву в Цоцин-Юрте, селе к востоку от Грозного, и задержали около ста сельчан (подробнее: «Террор»).
    В этот день трое бойцов Вооружённых сил Ичкерии укрылись во дворе одного из домов, и оккупанты окружили двор.
    Солдаты привезли к месту боя Мусу Исмаилова и Идриса Закриева, задержанных утром, и штурмовали дом, прикрываясь ими(Citation: 1581).
    Военные убили в бою всех троих бойцов, а 3 января 2002 года выдали родным тела обоих задержанных чеченцев с ножевыми ранами и отрезанными ушами (подробнее: «Надругательство над мёртвыми»)(Citation: 1581).

    12 января 2002 года в Знаменском, селе на севере Ичкерии, правозащитница «Мемориала» Наталья Эстемирова сказала командующему Молтенскому на его встрече с правозащитниками: «Как говорят свидетели, Закриев и Исмаилов во время штурма не погибли, но их тела потом были увезены военнослужащими».
    Молтенской ответил ей: «Вы говорите что-то неправдоподобное»(Citation: 1559).

    В мае 2006 года в станице Нестеровская в подконтрольной России Ингушетии силовики Кадырова-младшего обстреливали дом, укрывшись за машиной, в багажнике которой лежал связанный 19-летний чеченец Ризван Хайхароев из Бамута, села на западе Ичкерии(Citation: 286).

    В бюллетене «Мемориала» 2005 года сказано, что российские войска «прибегали к захвату заложников, которых использовали, в частности, в качестве „живого щита“»(Citation: 820).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что российские войска не меньше двух раз прикрывались целыми толпами мирных чеченцев, в Гехи-Чу и Гой-Чу(Citation: 1581).
    Неизвестно, сколько таких преступлений совершили оккупационные войска и силовики оккупационной администрации с сентября 1999 года по май 2006 года.
