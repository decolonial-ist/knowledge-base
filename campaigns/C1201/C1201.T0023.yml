description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты незаконно задерживали чеченцев на блокпостах и при облавах на сёла, а потом без обвинений держали их в фильтрационных лагерях, тюрьмах и ямах при воинских частях.

    4 октября 1999 года министр внутренних дел России Рушайло после совещания у председателя правительства Путина объявил, что Россия устраивает фильтрационные лагеря на всех пропускных пунктах у границы Ичкерии и там, где жили беженцы из республики.
    Сотрудники МВД, ФСБ и Федеральной миграционной службы проверяли людей(Citation: 1581).

    На пропускном пункте «Кавказ-1» на границе Ичкерии и подконтрольной России Ингушетии оккупанты сверяли паспорта всех мужчин со списком тех, кто воевал в 1994-1996 годах.
    Сотрудники ФСБ допрашивали задержанных, а потом отправляли в фильтрационный лагерь в Моздоке, городе в подконтрольной России Северной Осетии(Citation: 694)(Citation: 1491).

    Внутренние войска МВД России (предшественники современной Росгвардии) окружали сёла, а военные и милиционеры задерживали чеченцев при «зачистках» (так россияне называли обыски домов и задержания чеченцев).
    Подозрение вызывали мужской возраст, ранение, след от приклада на плече или борода(Citation: 1581).

    Российские военные держали чеченцев в ямах и тюремных машинах на базах своих частей.
    Других везли в изоляторы российской милиции в районах Ичкерии или в следственные тюрьмы Минюста России в Ичкерии, Ставропольском крае на юге России и Северной Осетии(Citation: 1568).
    При облавах военные ставили временный фильтрационный лагерь у села: в поле, на ферме, в цехе или в карьере(Citation: 1581).

    В лагерях российские охранники и следователи избивали задержанных чеченцев, пытали током, добиваясь признаний (подробнее: «Пытки и истязания»)(Citation: 1581).
    Сотрудники МВД России не сообщали семьям, куда увезли задержанных чеченцев.
    С 1999 по 2005 год не меньше 1209 задержанных чеченцев пропали без вести (подробнее: «Похищение людей»)(Citation: 1568)(Citation: 1581).

    Оккупанты отпускали узников под расписку, что претензий нет, по амнистии или за выкуп родных (подробнее: «Захват заложников»)(Citation: 1512)(Citation: 1581).
    По данным МВД России, с января по конец мая 2000 года российские силовики арестовали в республике больше 10 тысяч чеченцев.
    Из них министерство назвало бойцами Вооружённых сил Ичкерии и их помощниками чуть больше тысячи(Citation: 281).

    С ноября 1999 года МВД России держало задержанных чеченцев в изоляторе в бывшей колонии строгого режима в Чернокозове, селе на севере Ичкерии. 22 декабря 1999 года министр внутренних дел Рушайло приказом № 1077 записал изолятор приёмником для бродяг и попрошаек, хотя везли туда всех, кого военные сочли подозрительными(Citation: 1581).

    28 января 2000 года внутренние войска МВД России оцепили Старые Атаги, село к югу от Грозного, и задержали около 60 сельчан и беженцев, большинство - без объяснений.
    Военные увезли их в наручниках в изолятор российской милиции в бывшей школе-интернате Урус-Мартана, города к юго-западу от Грозного, и там омоновцы из Пензы прогнали их сквозь строй с дубинками.
    На следующий день оккупанты отправили большинство из них в Чернокозово.
    Мовлади, 40 лет, после освобождения рассказал правозащитникам «Мемориала»: «В нашей камере № 18, рассчитанной на десять мест, было 37 человек…
    Одуревшие от водки охранники подвергали заключенных зверским пыткам и избиениям, включив на полную громкость магнитофон»(Citation: 1512).
    Родные выкупили Мовлади через 27 дней.
    Гелисхан, 27 лет, после освобождения рассказал «Мемориалу»: «Нас, вообще не причастных ни к чему людей, забирают и под пытками заставляют подписывать непонятные нам бумаги…
    В конце концов нас подводят под „амнистию“, и получается, что мы воевали, но к нам проявили милосердие, помиловали»(Citation: 1512).
    Задержанные из Старых Атагов провели в Урус-Мартане и Чернокозове от нескольких дней до двух месяцев, за часть из них родные заплатили выкуп.
    После освобождения несколько человек долго лечились, а один чеченец - Асламбек Сосламбеков - вскоре умер(Citation: 1512).

    В начале февраля 2000 года Минюст России сделал изолятор в Чернокозове следственной тюрьмой и прислал охрану из подконтрольной России Кабардино-Балкарии.
    Министерство вывезло большинство узников в тюрьмы Ставропольского края и Владикавказа, столицы Северной Осетии(Citation: 775)(Citation: 1568). 4 марта глава делегации Европейского комитета по предупреждению пыток Зденек Гаек сказал заместителю министра юстиции России Калинину, что с декабря 1999 года по начало февраля 2000 года охрана Чернокозова избивала многих узников по пути к следователям и обратно, а следователи об этом знали(Citation: 955).
    По официальным данным, с ноября 1999 по апрель 2000 года через изолятор прошли 933 человека(Citation: 1581).

    По сообщению агентства «Интерфакс», 15 февраля 2000 года Сайдуллаев, глава созданной в Москве марионеточной администрации («Госсовета»), попросил Россию прислать комиссию расследовать, как в фильтрационных лагерях, в том числе в Чернокозове, омоновцы с контрактниками российских войск избивали и пытали задержанных чеченцев.
    В тот же день помощник исполнявшего обязанности президента России Ястржембский назвал сообщения о пытках в Чернокозове пропагандой Ичкерии(Citation: 1524). 8 августа 2000 года российские войска и милиция устроили облаву в Гехи, селе к юго-западу от Грозного, и поставили фильтрационный лагерь в палатках у кладбища.
    Командующий внутренними войсками МВД России Тихомиров руководил облавой на месте (подробнее: «Пытки и истязания»)(Citation: 1581)(Citation: 1210).
    В августе 2000 года российская милиция в Урус-Мартане держала в изоляторе четверых чеченцев, записав их задержанными «за бродяжничество». 13 августа начальник районной милиции Шигаев сказал матерям задержанных чеченцев, что этих четверых забрали военные.
    Все четверо пропали без вести (подробнее: «Похищение людей»)(Citation: 1589)(Citation: 1210). 10 декабря 2000 года люди в масках из российских силовых ведомств задержали в Радужном, Побединском и Долинском, сёлах к северу от Грозного, 21 сельчанина и держали их в ямах в Ханкале, главной базе оккупационных войск на восточной окраине Грозного.
    Восемнадцать из них силовики отпустили, а тела троих родные нашли 21 февраля 2001 года в дачном посёлке «Здоровье» у Ханкалы (подробнее: «Убийство пленных и задержанных»)(Citation: 1210)(Citation: 813).

    17 августа 2001 года при облаве в Аллерое, селе на востоке Ичкерии, российские военные задержали двух братьев Алсултановых.
    Военные держали их в лагере «Титаник» между Аллероем и Центороем, а потом передали сотруднику ФСБ Барышеву, и с тех пор братья пропали без вести (подробнее: «Похищение людей»)(Citation: 286).

    3-7 января 2002 года при облаве в Аргуне, городе к востоку от Грозного, военные командующего оккупационными войсками Молтенского поставили фильтрационный лагерь в карьере и держали там 187 горожан под открытым небом в мороз.
    Оккупанты убили двоих из них, ещё двое пропали без вести(Citation: 1581).
    С 21 мая по 11 июня 2002 года российские военные генерала Броницкого держали в фильтрационном лагере у Мескер-Юрта, села к юго-востоку от Грозного, чеченцев, которых забрали из домов и мечети. 4 июня военные выбросили из машины тело узника Адама Темерсултанова, а в 2016 году Европейский суд по правам человека признал, что Россия отвечает за его смерть и за смерть ещё 16 пропавших без вести узников(Citation: 1462)(Citation: 1581).

    В мае 2003 года делегация Европейского комитета по предупреждению пыток застала в оперативно-розыскном бюро № 2, отделе розыска МВД России в Грозном, 17 узников, некоторых держали по нескольку месяцев.
    Этого бюро не было ни в одном официальном списке мест лишения свободы(Citation: 938).
    С конца 2003 года российские войска стали реже устраивать облавы на сёла и почти перестали ставить лагеря у сёл, а силовики оккупационной администрации Кадырова держали похищенных чеченцев в тайных тюрьмах на своих базах(Citation: 286). 3 ноября 2004 года МВД России закрытым приказом № 709 оформило камеры бюро № 2 в Грозном как изолятор(Citation: 1554).
    В 2004-2005 годах силовики оккупационной администрации держали в подвале базы «Вега» под Гудермесом, городом к востоку от Грозного, больше ста узников, среди них Шарпуди Исраилова, отца бойца Вооружённых сил Ичкерии (подробнее: «Пытки и истязания»)(Citation: 940).
    Правозащитники Human Rights Watch к 2006 году описали не меньше десяти таких тюрем, среди них две базы в Центорое, селе к юго-востоку от Грозного, и «Вега»(Citation: 1554)(Citation: 940).

    Правозащитники «Мемориала» весной 2000 года писали, что фильтрационные лагеря нужны России, чтобы искать бойцов армии Ичкерии, вербовать осведомителей и запугивать всех, кто против оккупантов(Citation: 1568). 25 апреля 2000 года Комиссия ООН по правам человека в резолюции выразила глубокую озабоченность сообщениями о грубых и массовых нарушениях прав человека, особенно в фильтрационных лагерях(Citation: 1444).
    Международный трибунал для Чечни, общественная инициатива российских правозащитников, насчитал за 1999-2005 годы не меньше 20 234 незаконных задержаний.
    По выводу трибунала, российские силовики массово и системно незаконно задерживали, пытали, казнили и похищали мирных чеченцев, что считается преступлением против человечности(Citation: 1581).
    «Мемориал» собрал 384 справки о чеченцах, которых российские силовики задержали с октября 1999 по декабрь 2000 года.
    Потом эти люди пропали без вести или их нашли убитыми(Citation: 1210).

    2 мая 2006 года делегация Европейского комитета по предупреждению пыток нашла в Центорое, на базе силовиков оккупационной администрации, две запертые комнаты, которые совпадали с описаниями бывших узников.
    В феврале 2007 года Генеральная прокуратура России ответила комитету, что её сотрудники в Чеченской Республике не нашли доказательств, что в Центорое незаконно держали людей, и о тайных тюрьмах не знают(Citation: 939).
