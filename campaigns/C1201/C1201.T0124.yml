  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия отключила Ичкерию от своих электросетей и газопроводов, а российские военные разбивали обстрелами сельские газопроводы и линии электропередачи.

    2 октября 1999 года газета «Коммерсантъ» со ссылкой на Генеральный штаб российской армии писала, что генералы рассчитывали разрушить в Ичкерии большинство электростанций (подробнее: «Тотальное уничтожение инфраструктуры»)(Citation: 1570).

    Осенью 1999 года Россия прекратила подавать электроэнергию и газ в Ичкерию по своим линиям электропередачи и газопроводам.
    Свет в республике был только в немногих домах, где хозяева держали генераторы(Citation: 1512). 23 декабря 1999 года бывший председатель правительства России Степашин сказал в эфире телеканала НТВ, что Путин выполняет его программу мер против Ичкерии с отключением электроэнергии, которую Степашин предложил в марте 1999 года на посту министра внутренних дел(Citation: 825).

    С 1 октября 1999 года в Грозном, столице Ичкерии, не было электричества и газа.
    Из-за этого Чеченский комитет Красного Креста закрыл пункты питания для стариков и инвалидов, а хлеб для 12 000 стариков пёк на дизельном топливе(Citation: 277).
    В докладе правозащитников «Мемориала», которые 9-13 октября опрашивали беженцев, сказано: «9-я горбольница [городская больница] в Грозном обесточена (ток подается от генератора).
    Нет газа, а значит, нет и отопления»(Citation: 923).
    Иса Мунаев, военный комендант Ичкерии, рассказал корреспонденту газеты «Коммерсантъ» Мусе Мурадову в интервью, которое вышло 20 октября: «Газ и свет отключили по приказу из Москвы…
    Российские военные специально разбомбили высоковольтные опоры, подающие электричество из Ингушетии».
    По словам коменданта, защитники Грозного пустили в часть жилых кварталов местный газ, а больницы и насосы водопровода собирались перевести на дизельные генераторы(Citation: 1216).
    Руслан Исаев, глава Чеченского комитета Красного Креста, 16 ноября 1999 года ответил на запрос Главной военной прокуратуры России, что с 20 октября российские лётчики сильно бомбили Грозный и 27 октября комитет остановил всю работу(Citation: 277).
    В конце октября сотрудники организации The HALO Trust сообщили Amnesty International, что вся Ичкерия осталась без газа и электричества(Citation: 695).
    В пресс-релизе Human Rights Watch 6 декабря 1999 года сказано, что в Грозном по меньшей мере с начала ноября нет электричества, газа и тепла(Citation: 928).

    Старые Атаги, село к югу от Грозного, осенью 1999 года остались без газа и электричества.
    Сельчане ездили за дровами в лес за 10-12 километров по трассе на Шатой, по которой била российская авиация.
    В докладе «Мемориала» о селе сказано: «Летчики устраивали настоящую охоту за любыми едущими за пределами населенных пунктов автомобилями, тракторами». 30 октября 1999 года российский лётчик ударил по грузовику Хусейна Шахгириева, который вёз домой дрова, и убил его (подробнее: «Неизбирательные нападения»). 29 декабря пресс-служба министерства обороны России сообщила, что в селе «центральная районная больница подключена к магистральному газоснабжению».
    Газ в Старых Атагах появился только в конце января 2000 года, а электричество - во второй половине апреля(Citation: 1512).

    После захвата Чири-Юрта, села к югу от Грозного, 12 декабря 1999 года части МВД и министерства обороны России не выпускали чеченцев из блокированного села, в том числе в лес за дровами для печей (подробнее: «Транспортная блокада»).
    К 10 января 2000 года света в Чири-Юрте так и не было(Citation: 1643).

    3 января 2001 года российские военные на проверке документов в Старых Атагах унесли из универмага дизельный генератор Сайдаша Кушалиева, который давал ток части села и больнице, когда электричество отключали (подробнее: «Мародерство»). 23 мая 2001 года делегация села рассказала Казанцеву, представителю российского президента на юге России, что за полтора года оккупанты обстрелами 18 раз серьёзно повредили сельский газопровод и семь раз - линию электропередачи.
    Представитель президента обещал не допускать обстрелов, но в июне российские войска стали чаще стрелять по селу по ночам.
    Перед облавой 27 сентября 2001 года оккупанты отключили газ и свет в Старых Атагах, Новых Атагах, Чири-Юрте и Дуба-Юрте, а потом на десять дней блокировали эти сёла (подробнее: «Террор»).
    На облаву приехали не меньше семи российских генералов, среди них генерал внутренних войск Богдановский(Citation: 1512).

    В июле 2002 года оккупационная администрация отключила газ, электричество и воду в двух лагерях чеченских беженцев в Знаменском, селе на севере Ичкерии, и сняла палатки.
    Её чиновники предложили людям переехать во временное жильё в Грозном, где часто не было условий для жизни (подробнее: «Принудительное возвращение беженцев»)(Citation: 816).

    С осени 1999 года Россия держала без света и газа всю Ичкерию, пока захватывала республику(Citation: 1512). 22 февраля 2000 года председатель правительства России Путин распоряжением № 272-р выделил деньги на восстановление электростанций, линий электропередачи и газопроводов в Чеченской Республике(Citation: Распоряжение Правительства Российской Федерации от 22 февраля 2000 г. № 272-р «О реализации первоочередных мер по восстановлению объектов топливно-энергетического комплекса, расположенных на территории Чеченской Республики» 2000).
    Газета «Коммерсантъ» в 2004 году писала, что подачу электроэнергии возобновили сразу, как прекратились крупные бои(Citation: 3126).
    Дальше оккупанты отключали свет и газ отдельным сёлам перед облавами, а оккупационная администрация - лагерям беженцев. 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
