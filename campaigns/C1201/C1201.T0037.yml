  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия ставила в Ичкерии подконтрольных себе руководителей республики, правительства и районов, а потом меняла их решениями Кремля.

    15 октября 1999 года президент России Ельцин указом № 1380 назначил представителем правительства России в Ичкерии Кошмана, который в 1995-1996 годах возглавлял правительство в оккупационной администрации Завгаева.
    Кошман создавал в захваченных районах оккупационные органы управления и милицию (подробнее: «Установка новой системы управления»)(Citation: 768)(Citation: 687)(Citation: 814).

    8 июня 2000 года президент России Путин указом № 1071 создал оккупационную администрацию Чеченской Республики, главу которой назначал и снимал только президент России (подробнее: «Установка новой системы управления»)(Citation: 840).
    Москва назначала руководство республики, а главами районов ставила сторонников России, которые служили при Завгаеве в 1995-1996 годах(Citation: 1210)(Citation: 1503).
    В 2000 году эти гражданские органы почти ничего не решали, а военные и спецслужбы подчинялись штабу оккупантов в Ханкале, пригороде Грозного (подробнее: «Установка новой системы управления»)(Citation: 1210).

    С 2003 года Россия оформляла своих ставленников «выборами» под оккупацией (подробнее: «Имитация народного волеизъявления»)(Citation: 941).
    Москва передала силовикам оккупационной администрации Кадырова значительную часть похищений и пыток(Citation: 286).
    Большинство силовых подразделений республики создали на основе личной охраны главы этой администрации (подробнее: «Выращивание коллаборационистской элиты»)(Citation: 1554).

    В ноябре 1999 года президент России Ельцин помиловал Гантамирова, бывшего главу Грозного, осуждённого на шесть лет за хищение бюджетных денег, чтобы тот возглавил марионеточную оппозицию(Citation: 769).
    В декабре 1999 года помощник Кошмана Джамалханов приехал в Чири-Юрт, село в Шалинском районе, на бронетранспортёре с российскими полковниками и уехал, не ответив на просьбы села помочь беженцам (подробнее: «Установка новой системы управления»)(Citation: 1643).

    Командующий оккупационными войсками Трошев писал в мемуарах: «В конце весны 2000 года, согласовав вопрос с моим руководством, я написал Президенту РФ В. Путину докладную записку с предложением назначить Кадырова главой администрации республики»(Citation: 1129).
    Кадыров при президентах Джохаре Дудаеве и Аслане Масхадове был муфтием, главой мусульманского духовенства Ичкерии, а осенью 1999 года перешёл на сторону оккупантов(Citation: 1503)(Citation: 1129). 8 июня, в день указа № 1071, секретарь Совета безопасности России Иванов, по сообщению агентства «Интерфакс», объявил, что президент поставил администрацию республики под свой полный контроль(Citation: 1381). 12 июня Путин указом № 1100 назначил Кадырова главой оккупационной администрации(Citation: 841).
    Двенадцать из 18 глав районов, назначенных оккупантами, написали Путину, что будут саботировать указ, если его не изменят.
    Сотрудники прежней временной администрации написали в Кремль, что не могут работать под Кадыровым, и уехали из республики(Citation: 1671).
    Москва указ не изменила, и 20 июня Кадырова ввели в должность(Citation: 1671)(Citation: 1381).
    Часть местных глав администраций в знак протеста ушла в отставку(Citation: 1381).
    К концу июня работать под Кадыровым согласились трое из 18 глав районов(Citation: 1671).
    Президент Ичкерии Аслан Масхадов в интервью Анне Политковской для «Новой газеты» в мае 2001 года сказал, что Москва «призывает в свои ряды национал-предателей, марионеток»(Citation: 1740).

    В октябре 2000 года представитель Путина на юге России Казанцев перед телекамерами назначил Гантамирова главой администрации Грозного(Citation: 1704).
    В январе 2001 года председателем оккупационного правительства стал Ильясов, бывший глава правительства Ставропольского края(Citation: 814).
    По словам Ильясова, глава оккупационной администрации Кадыров хотел видеть на этом посту чеченца, «но президент выбрал меня»(Citation: 1723). 5 июля 2001 года главы администраций станицы Ассиновской и села Серноводск на западе республики подали в отставку, потому что на время облав российские военные закрыли их в кабинетах (подробнее: «Карательные экспедиции»).
    Ильясов уговорил обоих остаться(Citation: 814).

    5 октября 2003 года Россия объявила Кадырова «избранным» «президентом»(Citation: 941). 13 октября Путин указом № 1214 с 19 октября отменил указ о назначении Кадырова главой оккупационной администрации(Citation: 841). 9 мая 2004 года глава оккупационной администрации Кадыров погиб от взрыва на стадионе в Грозном.
    В тот же день Путин принял в Кремле перед телекамерами Кадырова-младшего, начальника службы безопасности убитого Кадырова. 10 мая исполняющий обязанности главы оккупационной администрации Абрамов назначил Кадырова-младшего первым заместителем председателя оккупационного правительства(Citation: 1956). 29 августа 2004 года Россия объявила «избранным» «президентом» министра внутренних дел республики Алханова, кандидата Кадырова-младшего, за которым остался контроль над вооружёнными людьми(Citation: 941)(Citation: 1962). 28 февраля 2006 года председатель оккупационного правительства Абрамов объявил об отставке и попросил поставить на своё место первого заместителя Кадырова-младшего, который весной 2006 года занял этот пост(Citation: 2042)(Citation: 287).

    15 февраля 2007 года президент России Путин указом № 172 принял «отставку… по собственному желанию» главы оккупационной администрации Алханова и временно поставил на этот пост председателя оккупационного правительства Кадырова-младшего(Citation: 895).
    В тот же день Путин назначил Алханова заместителем министра юстиции России и наградил орденом «За заслуги перед Отечеством» (подробнее: «Выращивание коллаборационистской элиты»)(Citation: 898).
    Human Rights Watch пишет, что отставка Алханова, «судя по всему», была вынужденной(Citation: 287). 1 марта на встрече с Кадыровым-младшим в своей резиденции Ново-Огарёво под Москвой Путин сказал, как записано в стенограмме Кремля: «мною принято решение – предложить Вашу кандидатуру в качестве кандидата на должность Президента Чеченской Республики… я надеюсь, что депутаты парламента Чечни меня поддержат»(Citation: 843). 2 марта оккупационный парламент утвердил Кадырова-младшего главой оккупационной администрации(Citation: 286).

    Правозащитники «Мемориала» и ещё четырёх организаций в докладе 2005 года пишут, что Москве был нужен человек, который «был бы способен к жестким силовым действиям против своих земляков».
    Весь «политический процесс» в республике, по их словам, прикрывал политику «чеченизации», то есть попытку «столкнуть в смертельной схватке местных жителей»(Citation: 941).
    Международная федерация за права человека и «Мемориал» в 2007 году писали, что «чеченизация» позволила выдавать войну России против Ичкерии за спор между самими чеченцами.
    По их словам, «чеченизация» помогала отвести от Москвы критику правозащитников и других государств(Citation: 286).
    Одд Гуннар Скагестад, бывший глава миссии Организации по безопасности и сотрудничеству в Европе в Ичкерии, в 2008 году писал, что российские оккупанты поставили бывшего муфтия Кадырова «президентом»(Citation: 1441).
    Правозащитники «Мемориала» в 2010 году писали, что Москва десять лет выстраивала в республике «лояльную федеральному центру власть», и там установился «режим абсолютной личной власти одного человека»(Citation: 27).

    В апреле 2007 года Кадыров-младший вступил в должность главы оккупационной администрации(Citation: 287).
