  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Президент России Путин через своих представителей обещал Ичкерии переговоры о мире, а российские военные искали президента Ичкерии Аслана Масхадова, пока ФСБ не убила его.

    Казанцев, представитель Путина на юге России, а позже сотрудники администрации Путина вели переговоры с Ахмедом Закаевым, представителем президента Ичкерии Аслана Масхадова.
    Сотрудники администрации передавали свои слова через швейцарского депутата Парламентской ассамблеи Совета Европы Андреаса Гросса(Citation: 1571)(Citation: 2017).
    Пока шли разговоры, российские прокуроры добивались ареста тех, с кем Россия вела переговоры, а армия и ФСБ искали Аслана Масхадова, чтобы задержать или убить(Citation: 1925)(Citation: 2017).

    27 сентября 1999 года председатель правительства России Путин назвал «целесообразной» встречу руководителей северокавказских регионов с Асланом Масхадовым, но провести её предложил, когда «это будет выгодно России»(Citation: 1548). 7 октября, через восемь дней после вторжения, Путин заявил, что война пойдёт до победы, и отказался от переговоров (подробнее: «Лишение субъектности»)(Citation: 27).

    18 ноября 2001 года Ахмед Закаев прилетел в Москву на переговоры с Казанцевым, и, по его словам, за три часа разговора российская сторона предложила Ичкерии только сдаться(Citation: 1925)(Citation: 1798).
    В конце ноября генерал Трошев, командующий российскими войсками на Северном Кавказе, объявил, что армия ищет Аслана Масхадова на юго-востоке Ичкерии, куда командование оккупационных войск перебросило дополнительные части(Citation: 1571). 13 ноября 2003 года лондонский суд отказал России в выдаче Ахмеда Закаева и отметил, что российское правительство вело с ним переговоры, хотя у прокуроров уже был ордер на его арест (подробнее: «Фабрикация преступников»)(Citation: 1925).

    Анна Политковская, журналистка «Новой газеты», писала, что с ноября 2004 года сотрудники администрации Путина давали Андреасу Гроссу, депутату Совета Европы, гарантии: «мы дозрели до мира».
    Ахмед Закаев передавал эти обещания Аслану Масхадову(Citation: 2017). 14 января 2005 года Аслан Масхадов приказал Вооружённым силам Ичкерии прекратить нападения на оккупантов до 22 февраля, а 23 февраля продлил приказ(Citation: 2017)(Citation: 2002).
    Три дня после публикации приказа, до 6 февраля, защитники его выполняли.
    В пресс-релизе командование оккупационных войск назвало обстановку «в основном, спокойной»(Citation: 1553).
    Аслан Масхадов в ответах газете «Коммерсантъ» в начале февраля 2005 года объяснил: «Это попытка продемонстрировать приверженность к миру и призвать российское руководство к разуму… мой призыв в первую очередь обращен именно к президенту России»(Citation: 1553).
    Пока Вооружённые силы Ичкерии не нападали, Генеральная прокуратура России через суд добилась заочного ареста Аслана Масхадова(Citation: 2002).

    Аслан Масхадов, по показаниям свидетеля по делу о его убийстве, ждал скорых переговоров с Путиным и стал пользоваться мобильным телефоном.
    По сообщениям с этого телефона российские спецслужбы нашли его в Толстой-Юрте, селе к северу от Грозного(Citation: 2017). 8 марта 2005 года спецназ ФСБ России, ночью прилетевший из Москвы, взорвал вход в подвал дома, где укрывался Аслан Масхадов, и убил его(Citation: 2017)(Citation: 791).
    Оккупанты увезли тело в Ханкалу, главную базу оккупационных войск на восточной окраине Грозного, и так и не отдали семье (подробнее: «Надругательство над мёртвыми»)(Citation: 791).
    Вечером 8 марта директор ФСБ Патрушев доложил Путину об убийстве, и Путин велел ему: «В случае подтверждения этих данных всех участников мероприятия [убийства] представьте к государственной награде» (подробнее: «Безнаказанность исполнителей»)(Citation: 797).

    13 марта 2005 года председатель Кабардино-Балкарского правозащитного центра Валерий Хатажуков в комментарии агентству REGNUM писал, что Аслан Масхадов на месяц прекратил боевые действия и этим доказал, что руководит сопротивлением: «Мировая практика знает мало таких примеров, когда противная сторона [Россия] в подобных ситуациях отказывалась от любых переговоров»(Citation: 1092).

    17 июня 2006 года сотрудники ФСБ и МВД России убили в Аргуне, городе к востоку от Грозного, президента Ичкерии Абдул-Халима Садулаева, преемника Аслана Масхадова (подробнее: «Нейтрализация оппозиции»)(Citation: 27). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
