description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты закрывали чеченцам выход из республики, перекрывали дороги блокпостами и держали сёла в кольце.

    25 сентября 1999 года командующий группировкой российских войск «Запад» генерал Шаманов передал по телефону в МВД подконтрольных России соседних регионов приказ закрыть проезд машин и проход людей из Ичкерии в Ингушетию и Северную Осетию.
    Источники расходятся: одни пишут о 25 сентября, другие - о 29 сентября(Citation: 1581)(Citation: 924).
    МВД Дагестана и Северной Осетии закрыли границы, а президент Ингушетии Аушев приказ не исполнил, и через Ингушетию за несколько месяцев вышли больше 300 тысяч чеченцев(Citation: 1581)(Citation: 924).

    С начала октября 1999 года российские военные и милиционеры на постах, ссылаясь на приказ, не выпускали из Ингушетии дальше в Россию чеченцев и всех, у кого была регистрация в Грозном(Citation: 684)(Citation: 696).

    Внутри республики оккупанты поставили блокпосты на всех дорогах, на въездах в сёла и выездах из них, у мостов и на перекрёстках Грозного.
    Посты из бетонных плит, мешков с песком и колючей проволоки служили для проверки документов и задержаний.
    Оккупанты увозили часть чеченцев, задержанных на постах, и те пропадали без вести (подробнее: «Похищение людей»)(Citation: 1503).
    В начале 2000 года на 50 километрах дороги от границы Ингушетии до Грозного стояли около 18 таких постов(Citation: 1381).
    В январе 2003 года докладчик Парламентской ассамблеи Совета Европы Рудольф Биндиг насчитал 28 укреплённых блокпостов на 40 километрах этой дороги(Citation: 285).

    К 2001 году самолёты в республику не летали(Citation: 1723).
    Российские военные закрыли для машин дороги, которые считали стратегическими, и грунтовые дороги между соседними сёлами, минировали их и обстреливали машины чеченцев, которые там появлялись.
    При облавах оккупанты на часы или дни останавливали всякое движение в районе и называли это режимом «стоп-колеса»(Citation: 1503).

    Военный комендант Урус-Мартановского района Гаджиев приказом № 260 от 10 сентября 2001 года запретил чеченцам в районе выходить на улицу и ездить по ночам, с 25 сентября - с 20 часов до 6 утра.
    Военные и милиционеры могли стрелять в нарушителей без предупреждения (подробнее: «Массовые убийства гражданских»)(Citation: 1581).
    Из 136 облав 1999-2005 годов, которые изучили правозащитники, в 95 оккупанты перекрывали въезд и выезд, а в 72 из них окружали всё село (подробнее: «Террор»)(Citation: 1581).

    В начале октября 1999 года российские милиционеры на границе Ичкерии с подконтрольной России Северной Осетией пропускали русских, а чеченцев разворачивали на север республики, где шли бои(Citation: 684). 11 октября российские военные на посту трассы Ростов - Баку на границе Ингушетии и Северной Осетии ставили бетонные укрепления с колючей проволокой и не выпускали из Ингушетии беженцев из Грозного(Citation: 1542).

    22 октября 1999 года, на следующий день после ракетного удара по центральному рынку Грозного, российские войска полностью закрыли границу Ичкерии с Ингушетией.
    Для чеченцев с юго-запада республики почти единственным выходом оставалась трасса Ростов - Баку с пунктом пропуска «Кавказ-1», комендантом которого генерал Шаманов назначил полковника Хрулёва(Citation: 1581).
    Олег Кусов, корреспондент Радио Свобода, 25 октября рассказал в эфире с поста на этой трассе у станицы Ассиновская на западе Ичкерии, что внутренние войска МВД России (предшественники современной Росгвардии) сменили там ингушских милиционеров, вкопали у дороги танки и поставили в поле бронемашины: «Контроль заключается в том, что по трассе запрещено передвигаться любым способом в обе стороны».
    Солдаты объясняли журналисту, что приказ должен перекрыть выход из республики бойцам Вооружённых сил Ичкерии(Citation: 1566). 29 октября комендант поста Хрулёв развернул в Грозный колонну беженцев, которым российские государственные СМИ обещали в этот день «гуманитарный коридор», и российские лётчики ударили по ней на трассе (подробнее: «Ложный коридор»)(Citation: 1581).

    30 октября Хрулёв снова не пропустил беженцев, сославшись на то, что не приехали таможенники и санитарная служба. 1 ноября у закрытого поста под открытым небом ждали около 5 тысяч человек, и без медицинской помощи там умерли не меньше четырёх чеченцев. 2 ноября российские военные открыли пост для выхода из Ичкерии(Citation: 1581)(Citation: 1512).
    Андрей Бабицкий, корреспондент Радио Свобода, 3 ноября рассказал в эфире с блокпоста, что очередь беженцев растянулась на 17 километров: «Вдоль дороги, насколько хватит взгляда, стоит врытая в землю российская бронетехника…
    Дула направлены в толпу, которая жмется к колючей проволоке с той, ичкерийской стороны».
    В этот день российские военные на посту пропустили в Ингушетию 1300 человек(Citation: 1505).

    4 ноября 1999 года оккупанты на пунктах пропуска не выпускали в Ингушетию мужчин, которых считали способными воевать(Citation: 1581). 2 декабря российские войска закрыли дорогу из Грозного в Гойты, село к югу от города, одну из последних, по которым в Грозный возили хлеб(Citation: 926). 3 декабря комендант Хрулёв опять закрыл «Кавказ-1», объяснив это гибелью своих солдат под Урус-Мартаном, городом к юго-западу от Грозного(Citation: 1581). 12 декабря оккупанты окружили Чири-Юрт, село к югу от Грозного, и не выпускали чеченцев за линию своих блокпостов (подробнее: «Медицинская и гуманитарная блокада»)(Citation: 1643).

    Командующий Объединённой группировкой российских войск на Северном Кавказе Казанцев 11 января 2000 года в Моздоке, городе в подконтрольной России Северной Осетии, заявил, по данным агентства ИТАР-ТАСС: «…сейчас беженцами будут считаться дети в возрасте до 10 лет, старики старше 60 лет и женщины».
    По словам генерала, остальных будут задерживать и проверять, а с 10 января в захваченных районах Ичкерии ездить и ходить в темноте можно только с особыми пропусками(Citation: 1494).
    Казанцев приказал не пропускать через границу Ичкерии в обоих направлениях мужчин и мальчиков от 10 до 60 лет(Citation: 1476).
    Хасин Радуев, корреспондент Радио Свобода, 14 января рассказал в эфире с «Кавказа-1», что за три дня у колючей проволоки скопилось больше пяти тысяч человек: «На деле это означало, что целые семьи провели несколько холодных дней и ночей под открытым небом»(Citation: 1555).

    14 января российские военные на «Кавказе-1» после тщательного досмотра стали пропускать почти всех(Citation: 1555).
    Источники расходятся: постовые рассказывали, что запрет в этот день сняло командование Объединённой группировки, а президент Ингушетии Аушев это опроверг(Citation: 1573).
    Human Rights Watch в июне 2000 года писала, что командование отменило запрет под международным давлением, но ограничения на поездки чеченцев, особенно мужчин, сохранились(Citation: 280). 6 апреля 2000 года Парламентская ассамблея Совета Европы отметила отмену этого приказа как незаконного(Citation: 766).

    12 февраля 2000 года командование оккупационных войск перекрыло в обоих направлениях пункт пропуска «Кавказ-1» на границе с Ингушетией перед несколькими тысячами чеченцев, которые хотели вернуться в разбомблённые сёла Ачхой-Мартановского района.
    Командующий группировкой российских войск «Запад» генерал Шаманов объяснял это тем, что под видом беженцев уходят бойцы Вооружённых сил Ичкерии, хотя, по словам беженцев, бойцы ушли оттуда раньше(Citation: 1479). 2 апреля 2000 года на окраине Толстой-Юрта, села к северу от Грозного, российские военные убили Саид-Магомеда Хасуева, объяснив, что он нарушил запрет ездить в темноте, хотя, по словам сельчан, он вернулся домой до 20 часов, когда запрет начинал действовать (подробнее: «Массовые убийства гражданских»)(Citation: 1581).

    В первой половине 2001 года оккупационные войска на несколько месяцев оцепили Махкеты, Товзени, Хоттуни и Сельментаузен, сёла Веденского района на юго-востоке Ичкерии, где жили не меньше 25 тысяч чеченцев(Citation: 1724)(Citation: 1751). 17 сентября 2001 года российские военные закрыли Грозный блокпостами по периметру, а около 11:30 большинство постов перестали пропускать и пеших.
    Оккупанты сняли блокаду не раньше чем через неделю(Citation: 1760)(Citation: 1761).

    7 января 2002 года в Урус-Мартане, городе к юго-западу от Грозного, российские военные после 22 часов крикнули «Стой!»
    Сайд-Магомеду Джамалханову, который вышел от соседей, и застрелили остановившегося (подробнее: «Массовые убийства гражданских»)(Citation: 1581).

    Парламентская ассамблея Совета Европы 4 ноября 1999 года потребовала от России держать открытой границу Ичкерии с Ингушетией(Citation: 699), а 27 января 2000 года - дать всем желающим уйти из республики безопасно, «независимо от их пола и возраста»(Citation: 284).
    Human Rights Watch в октябре 2000 года писала, что тысячи чеченцев «не отваживаются выходить за пределы своего населенного пункта, даже за медицинской помощью»(Citation: 281).
    В январе 2002 года Верховный комиссар ООН по делам беженцев Рууд Любберс призвал правительство России прекратить облавы и сократить число блокпостов(Citation: 816).

    В марте 2007 года Россия возобновила авиасообщение между Грозным и Москвой(Citation: 1235).
