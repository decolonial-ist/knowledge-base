  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты разрушали города и сёла Ичкерии вместе с заводами, школами и больницами, а разрушенное отказались восстанавливать.

    27 сентября 1999 года председатель правительства России Путин, по сообщению агентства РИА «Новости», объявил, что российские войска будут «уничтожать инфраструктуру» республики(Citation: 1548). 2 октября газета «Коммерсантъ» со ссылкой на Генеральный штаб российской армии написала, что генералы рассчитывают разрушить большую часть электростанций, нефтезаводов, мостов и плотин и к зиме поставить Вооружённые силы Ичкерии в невыносимые условия(Citation: 1570).

    При «зачистках» (так россияне называли обыски домов и задержания чеченцев) российские военные поджигали и взрывали дома, хозяев которых не застали(Citation: 1581).
    По данным Human Rights Watch, за 2000 год российские солдаты умышленно сожгли тысячи домов по всей Ичкерии(Citation: 1450).

    Правозащитники «Мемориала» пишут, что российские военные сознательно разрушали в сёлах дороги, мосты и линии электропередачи, которые сельчане чинили сами(Citation: 1503).
    По данным международной организации «Врачи без границ», к ноябрю 2000 года российские бомбёжки полностью разрушили в республике 10 больниц и 11 поликлиник(Citation: 1381).

    24 сентября 1999 года российские лётчики разбомбили гражданский аэропорт Грозного, столицы Ичкерии, и с этого дня бомбили город регулярно(Citation: 1581).
    С ноября российские военные несколько месяцев бомбили цеха машиностроительного завода «Красный молот», где до войны работали 5 тысяч человек(Citation: 1678).
    К началу декабря российская авиация и артиллерия полностью разрушили пригород Грозного Соляная Балка(Citation: 928). 9-13 марта 2000 года специальный комитет Парламентской ассамблеи Совета Европы (ПАСЕ) во главе с британским депутатом Фрэнком Джаддом побывал в Грозном.
    В докладе 4 апреля Джадд написал, что центр города «полностью и систематически разрушен» и члены комитета не увидели ни одного целого здания.
    Из примерно 400 тысяч горожан 1991 года в Грозном оставались около 15 тысяч(Citation: 1446).
    Кенни Глак, координатор организации «Врачи без границ» на Северном Кавказе, в интервью этой организации в 2000 году сказал: «Они [российские войска] нацелились на огромный город и полностью разрушили огромный город — город на 400 000 человек»(Citation: 1381). 6 апреля 2000 года ПАСЕ в рекомендации 1456 осудила «полное и бессмысленное разрушение города Грозного»(Citation: 766).
    В июле 2000 года, когда в Грозном не работало ни одно из 34 крупных предприятий, глава профсоюза рабочих «Красного молота» Саид Магомедов сказал журналистке «Новой газеты» Анне Политковской: «Я хочу варить сталь…
    Передайте это Москве.
    Я не бандит»(Citation: 1678).

    14 февраля 2000 года представитель правительства России в Ичкерии Кошман, по сообщению Радио Свобода, заявил, что Грозный в этом году восстанавливать не будут, а деньги на восстановление должна найти сама республика из своего бюджета.
    Кошман предложил закрыть разрушенный город для въезда(Citation: 2115).
    К апрелю Россия объявила Грозный «закрытым городом» до 1 мая(Citation: 1446).
    В конце апреля 2000 года комиссия правительства России во главе с Маршевым, первым заместителем главы российского ведомства по строительству, предложила избранному президенту Путину и первому заместителю председателя правительства Касьянову восстановить Грозный для 200-230 тысяч горожан.
    По подсчётам Маршева, в Грозном уцелело 12-15 % частного жилья и не больше 8-9 % городского(Citation: 1666).
    В сентябре 2000 года чеченская организация «Лам» писала, что из 6,5 млн квадратных метров жилья Грозного 4,5 млн полностью разрушены или тяжело повреждены(Citation: 1236).
    В апреле 2002 года, по сводке «Лама», правительство России почти ничего не сделало для восстановления жилья в Грозном, а больницы и поликлиники города в основном стояли в руинах(Citation: 1237).

    29 октября 1999 года российские военные полностью разрушили больницу в Шалажи, селе к юго-западу от Грозного(Citation: 695). 2 ноября российские лётчики бомбили Аргун, город к востоку от Грозного, и разрушили там почти все предприятия и сооружения, на которых держалась жизнь города(Citation: 1581).
    С 1 по 15 декабря, после захвата Алхан-Юрта, села к юго-западу от Грозного, российские солдаты грабили и жгли дома сельчан (подробнее: «Мародерство»). 17 декабря представитель правительства России в Ичкерии Кошман признал, что в селе разрушено всё, кроме одной улицы(Citation: 770).

    4-7 февраля 2000 года российские войска бомбили и обстреливали Катыр-Юрт, село к юго-западу от Грозного (подробнее: «Неизбирательные нападения»).
    Глава комиссии по разрушениям при оккупационной администрации насчитал в селе 530 сожжённых или разрушенных без возможности восстановления домов(Citation: 282). 5 февраля около 30 российских контрактников жгли дома в Новых Алдах, посёлке на южной окраине Грозного, со словами «Сравняем Чечню с землей» и, по оценке очевидца, сожгли около 100 (подробнее: «Массовые убийства гражданских»)(Citation: 280).
    С 22 февраля по 11 марта солдаты из колонн российской военной техники, проходивших через опустевший Дуба-Юрт, село к югу от Грозного, грабили и поджигали дома чеченцев (подробнее: «Мародерство»)(Citation: 1684).

    С 7 по 20 марта 2000 года российские войска генерала Герасимова штурмовали Гой-Чу, село к юго-западу от Грозного, и почти полностью разрушили его (подробнее: «Неизбирательные нападения»)(Citation: 1129).
    В октябре 2001 года в село вернулись около 150 семей: домов не было ни у кого, компенсаций не получил никто(Citation: 1764). 14 июля 2000 года при 29-й с начала войны «зачистке» Гордали, села на юго-востоке Ичкерии, российские военные сожгли 20 домов и не давали их тушить(Citation: 1503). 17 ноября при «зачистке» Сельментаузена, села на юго-востоке Ичкерии, оккупанты взорвали гранатами второй этаж школы и дом Вахи Тесаева, жившего в подконтрольной России Ингушетии(Citation: 1503).
    В ночь на 10 декабря российская артиллерия разрушила хранилище фруктов государственного хозяйства имени Мичурина в Урус-Мартановском районе, единственное здание хозяйства, уцелевшее в двух войнах(Citation: 1503).

    3 июля 2001 года при «зачистке» Ассиновской, станицы на западе Ичкерии, российские солдаты взорвали классы, мастерские и столовую школы № 1, а в больнице - кабинеты врачей, палаты и склады(Citation: 814).
    В апреле 2002 года при двух «зачистках» Алхан-Калы, села к западу от Грозного, войска генерала Броницкого, который командовал облавами в сёлах, разрушили восстановленные фанерный цех, птицефабрику, больницу и здание администрации, взорвали цеха элеватора и деревообрабатывающего комбината(Citation: 1581)(Citation: 952)(Citation: 953).
    С 21 мая по 11 июня 2002 года при «зачистке» Мескер-Юрта, села к юго-востоку от Грозного, военные Броницкого взорвали здание сельской администрации и разорили школу(Citation: 1581)(Citation: 1473).
    Летом 2002 года экипажи российских вертолётов разрушили начальную школу в Центорое, селе на юго-востоке Ичкерии, а 10 октября снова обстреляли село.
    После обстрела российские военные подожгли то, что осталось от дома Алавди Кудусова, почти 80-летнего бывшего директора сельской школы, и в октябре сыновья увезли его из села(Citation: 1854).

    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева насчитали с 1999 по 2005 год не меньше 119 случаев, когда российские военные уничтожали дома, машины и скот чеченцев, из них 35 - при облавах, 52 - при задержаниях.
    Авторы пишут, что командование приказывало жечь пустые дома, полагая, что их хозяева могут воевать в рядах сопротивления.
    Они называют уничтожение домов местью хозяевам и способом запугать остальных сельчан, то есть террором против мирных чеченцев(Citation: 1581). 2 апреля 2003 года ПАСЕ в резолюции 1323 написала, что города и сёла Чеченской Республики превращены в руины(Citation: 788).

    Российские войска разрушали города и сёла Ичкерии бомбёжками и обстрелами, пока захватывали республику, до конца марта 2000 года (подробнее: «Неизбирательные нападения»)(Citation: 1581).
    Дальше оккупанты жгли и взрывали дома, школы и больницы при облавах в сёлах.
    С весны 2003 года облавы стали редкими, а после лета 2005 года прекратились: правозащитники считают, что командование оккупационных войск поняло, что массовый террор приводит к защитникам Ичкерии всё новых мстителей.
    Правозащитники насчитали 28 облав, при которых оккупанты уничтожали дома и имущество чеченцев, в 2001 году, 17 - в 2002 году и 2 - в 2003 году(Citation: 1581).
    В 2004-2009 годах силовики оккупационной администрации жгли дома семей бойцов сопротивления (подробнее: «Коллективные наказания»)(Citation: 820)(Citation: 287).

    4 июля 2003 года правительство России во главе с Касьяновым постановлением № 404 назначило за утраченное жильё и имущество компенсацию не больше 350 тысяч рублей на семью и только тем, кто жил в республике (подробнее: «Принудительное возвращение беженцев»)(Citation: 1224)(Citation: 1194). 31 августа 2004 года Федеральное агентство по строительству России приказом № 98 создало группу специалистов, чтобы обследовать разрушенные дома и составить их перечень.
    Группа так и не утвердила полный список и распустилась, а тысячи заявлений на компенсацию остались без движения. 7 мая 2008 года Министерство финансов России письмом назвало возобновление работы группы нецелесообразным(Citation: 1194).
