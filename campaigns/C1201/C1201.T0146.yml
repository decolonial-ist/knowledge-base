description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты брали с чеченцев деньги за проход блокпостов, за паспорта, за то, чтобы не увозить их на проверку, а российские чиновники и их ставленники присваивали деньги на восстановление республики и компенсации за разрушенные дома.

    Российские войска поставили на дорогах Ичкерии плотную сеть блокпостов, местами почти на каждом километре(Citation: 281).
    На многих постах российские силовики, присланные из разных регионов России, открыто брали деньги, прежде всего с водителей автобусов и грузовиков, и не досматривали машину того, кто заплатил(Citation: 1252).
    Когда движение по району закрывали на часы или дни, проехать можно было, заплатив на посту больше, чем там обычно брали(Citation: 1503).

    При «зачистках» (так россияне называли обыски домов и задержания чеченцев) российские военные и милиционеры отправляли чеченских мужчин на допросы в фильтрационные лагеря, но во многих случаях от этого можно было откупиться(Citation: 1503).
    Уже задержанных чеченцев оккупанты отпускали за деньги или оружие, которое родные часто покупали у российских военных (подробнее: «Захват заложников»)(Citation: 1512).

    Родные задержанных чеченцев платили охране российских тюрем на Северном Кавказе, чтобы заглянуть в журнал регистрации, и посредникам, которые предлагали узнать, где держат их близкого(Citation: 1589).
    Российские военные часто отдавали семьям тела убитых ими чеченцев только за выкуп (подробнее: «Надругательство над мёртвыми»)(Citation: 1581).

    Глава оккупационной администрации Кадыров создал комиссии, которые распределяли компенсации за разрушенное жильё, назначенные правительством России в июле 2003 года (подробнее: «Тотальное уничтожение инфраструктуры»)(Citation: 1194)(Citation: 1927).
    ФСБ России курировала службу безопасности Кадырова, а силовики этой службы собирали поборы с предпринимателей и торговцев (подробнее: «Выращивание коллаборационистской элиты»)(Citation: 286).

    Осенью 1999 года российские милиционеры на одном из постов на границе с подконтрольной России Северной Осетией брали с чеченцев, бежавших от войны, по 1000 рублей с мужчины и по 500 с женщины за проход(Citation: 695).
    В конце 1999 года российские солдаты на посту «Октябрьский» на дороге в Моздок, город в Северной Осетии, где стоял штаб оккупационных войск, брали за проход 100 рублей с пешего, 500-600 с легковой машины и 1000 «за провоз трупа»(Citation: 1631). 13 декабря 1999 года контрактники внутренних войск МВД России заставили Шаарани Автаева, которого оккупанты выгнали из Алхан-Юрта, села к юго-западу от Грозного, заплатить 200 рублей, чтобы на 5-10 минут отвезти его к сожжённому дому(Citation: 770).

    Весной 2000 года в Ассиновской, станице на западе Ичкерии, у сотен чеченцев-беженцев не было паспортов, а милиционеры поставленного Россией районного отдела милиции выдавали их только за взятку(Citation: 1661). 3 июля 2000 года российские военные на блокпосту в Урус-Мартане, городе к юго-западу от Грозного, уложили на землю чеченца с сыном, избили сына прикладами и забрали 2400 рублей, из которых 1000 вернули после жалобы офицеру(Citation: 1503).
    Летом 2000 года в Старых Атагах, селе к югу от Грозного, немногие чеченцы собрали остаток урожая со своих полей - те, кто выторговал у оккупантов разрешение за деньги и спиртное(Citation: 1512). 12 декабря 2000 года российские военные на блокпосту на Старопромысловском шоссе в Грозном написали на бетонных блоках: «ЗАПЛАТИ НАЛОГИ!
    И ЕЗЖАЙ СПОКОЙНО!»(Citation: 1709).

    6 февраля 2001 года российские солдаты на блокпосту у Ассиновской потребовали 500 рублей с Ширвани Вашаева из Ачхой-Мартана, села к юго-западу от Грозного, а когда Ширвани Вашаев предложил 30, избили его и оставили себе машину с кормом для скота.
    На следующий день родные выкупили машину(Citation: 1581). 1-5 июля 2001 года при облаве в Серноводске, селе на западе Ичкерии, российские военные назначили плату за то, чтобы не задержать: 200 рублей с прописанных в селе, 500 с беженцев и 1000 с тех, у кого просрочен паспорт (подробнее: «Карательные экспедиции»)(Citation: 1581).
    В конце декабря 2001 года в Старых Атагах российские военные группировки генерала Богдановского с милиционерами при военном и районном прокурорах объявляли, что забирают на проверку мужчин от 15 до 55 лет, намекая, что дело решит около тысячи рублей «за голову»(Citation: 1581).
    Сельчане отказались выйти на проверку за село, и 28 декабря военные проверили паспорта у мечети и отпустили всех (подробнее: «Террор»)(Citation: 1512).
    С 30 декабря 2001 года по 3 января 2002 года при облаве в Цоцин-Юрте, селе к востоку от Грозного, военные, которыми руководил командующий оккупационными войсками Молтенской, под угрозой погрома брали с хозяев «дань», обычно от 5 до 7 тысяч рублей (подробнее: «Террор»)(Citation: 1581).

    8 января 2002 года Исаев, служащий представительства оккупационной администрации в Москве, сказал, что около 700 млн рублей из денег правительства России на восстановление республики до неё не дошли: деньги шли через дирекцию по восстановлению в Москве и фирмы-подрядчики, которые покупали за рубль и продавали республике за два(Citation: 1227). 12 января 2002 года командующий оккупационными войсками Молтенской признал, что на блокпостах «бандит [так россияне называли бойцов Вооружённых сил Ичкерии] едет, дал взятку, проехал.
    Человек едет, взятки не дает, его мурыжить начинают»(Citation: 1559). 11 июня 2002 года, в последний день облавы в Мескер-Юрте, селе к юго-востоку от Грозного, российские войска генерала Броницкого собрали с сельчан «дань» по 1500 рублей с молодых и по 1000 со старших(Citation: 1473), а с 11 по 24 июня при облаве в Чечен-Ауле, селе к югу от Грозного, требовали у хозяев 500 рублей за то, чтобы не выбить ворота бронетехникой(Citation: 1581).

    18 февраля 2003 года, за месяц до референдума о конституции республики, заместитель главы оккупационной администрации Старопромысловского района Грозного Шахгиреев велел директорам школ внести в фонд референдума по 2000 рублей, а с каждого учителя собрать по 50(Citation: 941). 16 марта 2003 года президент России Путин перед референдумом сказал, что блокпосты «должны заниматься не поборами с гражданского населения», и до конца месяца российские военные на блокпостах не брали денег за проезд(Citation: 1581).
    Летом 2003 года начальник службы безопасности Кадыров-младший велел директорам рынков собрать с торговок по 500 долларов в предвыборный фонд главы оккупационной администрации Кадырова.
    Торговки отказались выходить на рынок, пока сумму не снизят, но силовики службы безопасности пригрозили женщинам, начавшим протест, «вырезать семьи», и торговки сдали деньги(Citation: 1905).
    Осенью 2003 года комиссии по компенсациям вычёркивали чеченцев из списков и возвращали туда за процент с выплаты, а российские суды и прокуратура заявлений о компенсациях не принимали.
    В Автурах, селе к юго-востоку от Грозного, единственной женщине, которой дали компенсацию, выплатили 175 тысяч рублей из положенных 350, остальное оставили себе чиновники(Citation: 1927).

    В конце октября 2003 года на посту «Кавказ» на трассе Ростов - Баку, на границе Ичкерии и подконтрольной России Ингушетии, бойцы курского ОМОНа брали за проход по 10 рублей с человека и 50 с машины.
    Солдат на въезде останавливал все машины, кричал на водителей и грозил автоматом, а потом стал подпускать к себе тех, кто вложил купюры в паспорт.
    Омоновцы не унижали чиновников оккупационной администрации Кадырова с удостоверениями Регионального оперативного штаба российских силовиков, а остальных чеченцев обыскивали и отбирали у них деньги.
    С тех, чей паспорт вызывал вопросы при проверке по базе данных поста, брали 50 рублей, и большинство чеченцев платили сразу, чтобы паспорт не проверяли.
    Анна Политковская, журналистка «Новой газеты», записала, что омоновцы отвечали чеченцам, которые возмущались поборами: «Чтобы приехать сюда, мы платим начальству 2 тысячи долларов — делимся прибылью.
    Все знают дома — едем на заработки».
    На территории воинской части у поста стояли новые легковые машины, которые омоновцы отобрали у чеченцев или купили за бесценок, чтобы со сменой увезти в Россию (подробнее: «Мародерство»)(Citation: 1924).

    В 2005 году чиновники оккупационной администрации заставляли учителей и врачей «жертвовать» деньги на день рождения Кадырова-младшего, первого заместителя председателя оккупационного правительства, на памятник покойному Кадырову и празднование Дня Победы(Citation: 941).
    В начале декабря 2005 года чиновники районной оккупационной администрации Грозного собрали с предпринимателей проспекта Победы, главной улицы города, по 150-300 тысяч рублей на пластиковые окна и плитку, а с врачей Грозного - по 3000 рублей с отделения.
    Окна вставили в выгоревшие дома без крыш(Citation: 941).

    В ежегодном докладе Human Rights Watch о 2000 годе сказано: «На сотнях российских блокпостов по всей Чечне процветало вымогательство»(Citation: 1450).
    Правозащитники «Мемориала» и ещё четырёх организаций в 2005 году писали о вооружённых группах на службе России: «Все, что приносит доход, попадает под контроль членов профедеральных [подконтрольных России] вооруженных групп»(Citation: 941).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что грабежи, вымогательство и захват заложников ради выкупа «сопровождали едва ли не каждую карательную операцию», а высшее командование российских войск если не поощряло их, то позволяло(Citation: 1581).

    Летом 2006 года председатель оккупационного правительства Кадыров-младший собирал с сотрудников МЧС республики «дань» в Фонд имени Ахмата Кадырова - по 3-4 тысячи рублей с каждой зарплаты(Citation: 2057).
