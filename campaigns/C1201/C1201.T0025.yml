description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты лишали чеченцев связи, пускали журналистов и наблюдателей только туда, куда их везли российские военные, а свидетелей своих преступлений запугивали, чтобы те молчали.

    25 сентября 1999 года командующий группировкой российских войск «Запад» Шаманов приказом, переданным по телефону, велел российской милиции соседних регионов не выпускать чеченцев из Ичкерии.
    Только милиция подконтрольной России Ингушетии не исполнила приказ (подробнее: «Транспортная блокада»)(Citation: 1503).
    На единственном открытом пункте пропуска из Ингушетии российские пограничники не пускали в республику журналистов, а российские военные отбирали у въезжающих чеченцев видео- и фотокамеры(Citation: 694).

    1 октября 1999 года председатель правительства России Путин распоряжением № 1538-р создал Российский информационный центр (Росинформцентр) (подробнее: «Цензура»)(Citation: 1543).
    Росинформцентр выдавал всем журналистам аккредитацию - разрешение работать в зоне войны - и лишал её тех, кто ездил по республике сам или говорил с военными.
    Пресс-служба Минобороны России возила журналистов на съёмки на несколько часов(Citation: 1544). 26 июля 2001 года командование оккупационных войск запретило журналистам ездить без сотрудника пресс-службы МВД, даже если у них были все аккредитации и разрешения(Citation: 1510).
    Россия пускала иностранных журналистов в Ичкерию только групповыми поездками, а к 2003 году - под военным конвоем и присмотром сотрудников администрации президента России(Citation: 1446)(Citation: 1848).

    Российские военные возили международных наблюдателей в кольце вооружённой охраны: журналист не мог к ним подойти, а чеченцам приходилось говорить с ними при охранниках(Citation: 1454)(Citation: 1848).
    Силовики оккупационной администрации Кадырова при задержаниях предупреждали родных, что за огласку расправятся с остальной семьёй, а освобождённым велели никому не рассказывать о случившемся (подробнее: «Террор»).
    По опросу «Мемориала», с мая по ноябрь 2005 года о преступлениях против себя отказывались рассказать правозащитникам 30% пострадавших чеченцев в сёлах и почти 80% в Грозном(Citation: 1581).

    24-26 сентября 1999 года российские лётчики разрушили телецентр Грозного, бомбили телебашню и оборвали в городе стационарную и мобильную телефонную связь (подробнее: «Уничтожение локальных медиа»)(Citation: 1465)(Citation: 1463).
    Андрей Бабицкий, корреспондент Радио Свобода, 18 ноября в эфире своего радио ответил руководителю Росинформцентра Маргелову: «Она [Россия] широко распахнула двери в военный гарнизон в Моздоке [городе в подконтрольной России Северной Осетии], в подразделения в Дагестане и на левом берегу Терека, и закрыла ту сторону» (речь о части Ичкерии, которую не захватили российские войска)(Citation: 1508).
    Лема Маштаев, водитель из Грозного, ушёл из города 1 декабря и рассказал Human Rights Watch: «Телевидения и радио нет, а если и были батарейки, то давно сели.
    В городе никто ничего не знает»(Citation: 928). 6 декабря российские лётчики сбросили на Грозный листовки, в которых командование оккупационных войск во главе с Казанцевым пригрозило уничтожить всех, кто не уйдёт из города до 11 декабря (подробнее: «Отказ в пощаде»)(Citation: 1529)(Citation: 1581). 8 декабря правозащитники Human Rights Watch написали, что неясно, многие ли в Грозном знают об этом ультиматуме, потому что большинство горожан неделями заперты в подвалах под огнём российской авиации и артиллерии(Citation: 926).

    21 октября 1999 года московские милиционеры задержали Майрбека Вачагаева, представителя президента Ичкерии Аслана Масхадова.
    Майрбек Вачагаев помог иностранным журналистам попасть в Элистанжи, село на юго-востоке Ичкерии, после удара российских войск по селу.
    Правозащитники Amnesty International писали, что улики против него, вероятно, сфабриковали за эту помощь (подробнее: «Фабрикация преступников»)(Citation: 694).
    С 1 по 17 декабря 1999 года солдаты 15-го мотострелкового полка убили в Алхан-Юрте, селе к юго-западу от Грозного, не меньше 18 мирных чеченцев (подробнее: «Массовые убийства гражданских»)(Citation: 770).
    Российские военные пускали в село только журналистов, которых привезла пресс-служба оккупационных войск из Моздока(Citation: 1635).

    16 января 2000 года бойцы ОМОНа из Пензы с сотрудником ФСБ задержали на выезде из Грозного Андрея Бабицкого, корреспондента Радио Свобода, который без аккредитации снимал войну в городе.
    Затем его отдали начальнику управления ФСБ в Урус-Мартане Фомину, и сотрудники ФСБ больше месяца держали его под стражей, пока 23 февраля Андрей Бабицкий не сбежал в подконтрольном России Дагестане(Citation: 1104). 4 августа 2000 года российские военные на блокпосту задержали японского журналиста Масааки Хаяси, хотя документы у него были в порядке, и велели ему покинуть Ичкерию до комендантского часа(Citation: 1503).

    В первой половине 2001 года российские войска оцепили Махкеты, Товзени, Хоттуни и Сельментаузен, сёла на юго-востоке Ичкерии, и на несколько месяцев отрезали от внешнего мира живших там не меньше 25 000 чеченцев; телефонной связи там не было (подробнее: «Транспортная блокада»)(Citation: 1724)(Citation: 1751). 20 февраля 2001 года у Хоттуни офицеры, назвавшиеся сотрудниками ФСБ, задержали Анну Политковскую, журналистку «Новой газеты», и забрали её кассеты с записями и плёнки.
    Анна Политковская собирала жалобы чеченцев этих четырёх сёл на то, что военные держали задержанных в ямах на территории своей части(Citation: 1721). 22 февраля военный прокурор Грозного Бибиков принял у неё на проверку аккредитацию и заявление о краже вещей, но и через месяц военная прокуратура не вернула журналистке ни документа, ни вещей(Citation: 1730). 1 марта 2001 года в Гудермесе, городе к востоку от Грозного, представитель президента России по правам человека Каламанов вырвал у Саид-Алви Лулуева заявление на имя Хиль-Роблеса, комиссара Совета Европы по правам человека, о похищении жены.
    В июне 2000 года российские военные увезли на бронетранспортёре от рынка в Грозном жену Саид-Алви Лулуева. 4 марта 2001 года родные опознали её останки среди тел в дачном посёлке «Здоровье» у Ханкалы, главной базы оккупационных войск на восточной окраине Грозного (подробнее: «Убийство пленных и задержанных»)(Citation: 1728). 1 августа 2001 года около 300 чеченцев вышли на митинг на трассу Грозный - Шатой у Старых Атагов, села к югу от Грозного.
    Российские военные на двух бронетранспортёрах стреляли поверх их голов и отобрали видеокамеры у двух журналистов.
    Чеченцы отбили активистов, которых военные пытались задержать, и стояли на трассе до вечера(Citation: 1512).

    Правозащитники «Мемориала» пишут, что одной из целей, ради которых командование оккупационных войск закрыло границу Ичкерии, было оставить войну без свидетелей(Citation: 1503).
    ПАСЕ 27 января 2000 года потребовала от России дать российским и иностранным журналистам свободный доступ в Ичкерию(Citation: 284).
    Human Rights Watch в 2001 году писала, что руководство России жёстко ограничило доступ в зону войны(Citation: 1450).
    Комитет ООН против пыток 23 ноября 2006 года отметил, что Россия не разрешает публиковать доклады Европейского комитета по предупреждению пыток о Чеченской Республике, и рекомендовал разрешить(Citation: 793).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что Путин ограничивал работу журналистов и не давал сведениям о войне выйти за пределы Ичкерии (подробнее: «Выдворение внешних миссий»)(Citation: 1581).

    В конце декабря 2002 года охранники главы оккупационной администрации Кадырова возили председателя комиссии по правам человека при президенте России Памфилову по пунктам временного размещения беженцев в Грозном.
    Чеченцы при охранниках молчали на вопрос, выселяли ли их насильно(Citation: 1850).
