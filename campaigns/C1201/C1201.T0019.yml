  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские войска захватили равнину, Грозный и горы Ичкерии, а потом оставили в республике постоянные гарнизоны.

    Российское правительство, которое в 1999 году возглавлял Степашин, с марта готовило план наступления на Ичкерию и наметило выход к реке Терек на август и сентябрь(Citation: 698). 23 сентября 1999 года президент России Ельцин секретным указом № 1255с создал Объединённую группировку войск из частей всех силовых ведомств России и подчинил их приказам одного командующего(Citation: 672)(Citation: 901).
    К концу сентября Россия собрала у границы Ичкерии до 90 тысяч солдат и около 400 танков(Citation: 2380).
    В декабре 1994 года, в начале первого открытого вторжения, в российских колоннах было от 14 972 до почти 24 тысяч человек(Citation: 2380)(Citation: 2381).
    Газета «Коммерсантъ» в 2001 году писала, что в сентябре 1999 года в Вооружённых силах Ичкерии было 15-20 тысяч бойцов(Citation: 2380).
    Генеральный штаб российской армии, которым руководил Квашнин, запланировал сначала захватить север Ичкерии до Терека(Citation: 1570)(Citation: 1581).
    Затем оккупанты окружали и захватывали Грозный и другие города равнины, а с середины декабря 1999 года наступали в горы на юге(Citation: 1129).

    Перед штурмом российские войска обстреливали города и сёла из артиллерии, а лётчики их бомбили с воздуха (подробнее: «Неизбирательные нападения»)(Citation: 1581).
    В мае 2000 года Россия сформировала 42-ю армейскую дивизию для постоянного размещения в Чеченской Республике (подробнее: «Подселение чиновников и военных»)(Citation: 1129). 22 января 2001 года президент России Путин указом № 61 передал руководство войной директору ФСБ Патрушеву (подробнее: «Установка новой системы управления»)(Citation: 790)(Citation: 1549).

    К 20 октября 1999 года российские войска захватили север Ичкерии с высотами на правом берегу Терека и обстреливали окрестности Грозного(Citation: 1216). 24 октября генерал Трошев, командующий восточной группировкой российских войск, приказал наступать на Гудермес, второй по величине город Ичкерии, и за несколько дней оккупанты окружили город(Citation: 1129).
    К концу октября под оккупацией была треть республики(Citation: 765).
    В начале ноября министр обороны России Сергеев назвал целью войны возвращение Ичкерии в состав России(Citation: 1381). 12 ноября оккупанты захватили Гудермес(Citation: 1442).

    1 декабря 1999 года российские войска захватили Алхан-Юрт, село к юго-западу от Грозного (подробнее: «Массовые убийства гражданских»)(Citation: 770).
    В начале декабря оккупанты окружили Грозный(Citation: 765). 8 декабря российская армия вместе с отрядом Гантамирова, перешедшего к оккупантам, захватила Урус-Мартан, город к юго-западу от Грозного (подробнее: «Выращивание коллаборационистской элиты»).
    Город был пуст и в основном разрушен(Citation: 1464). 12 декабря российские войска захватили Ханкалу на восточной окраине Грозного, где потом стояла главная база оккупационных войск(Citation: 281). 14 декабря оккупанты захватили Шали, город к юго-востоку от Грозного, и из крупных городов Ичкерии свободной осталась только столица. 20 декабря российские войска захватили Черноречье, район на юге Грозного(Citation: 765).

    26 декабря 1999 года российская группировка «Особый район города Грозный» под командованием генерала Булгакова начала штурм окружённого Грозного(Citation: 1129).
    Иса Мунаев, военный комендант Ичкерии, ещё 20 октября сказал корреспонденту газеты «Коммерсантъ» Мусе Мурадову: «Российские генералы не могут простить себе поражение в прошлой чеченской войне…
    Но город мы не сдадим»(Citation: 1216).
    Генерал Трошев, командовавший восточной группировкой оккупантов, писал о тех днях: «Москве хотелось поскорее услышать доклад о захвате чеченской столицы»(Citation: 1129).
    В штурме участвовали около 20 тысяч человек, из них 13 700 российских военных, 3800 бойцов внутренних войск МВД (предшественников современной Росгвардии) и 1700 бойцов ОМОНа, милицейского спецназа и милиционеров.
    Защитники Грозного отбили первые атаки, и командование Объединённой группировки во главе с Казанцевым решило бить по городу авиацией и артиллерией (подробнее: «Неизбирательные нападения»)(Citation: 1129).
    В начале января 2000 года Вооружённые силы Ичкерии атаковали оккупантов вокруг Грозного и на время освободили Алхан-Калу, Гудермес, Аргун и Шали(Citation: 281). 18 января оккупанты захватили мост через Сунжу, реку в центре Грозного, а 19 января защитники сражались в развалинах домов у площади Минутка(Citation: 1467).

    В конце января штаб российской Объединённой группировки, которой командовал Казанцев, ложными переговорами по радио и через агентов подсказывал защитникам «бреши» в кольце окружения.
    На стыках полков, окружавших Грозный, оккупанты поставили дополнительные минные поля.
    В ночь на 30 января больше 600 защитников пошли по этим полям на прорыв у Старой Сунжи, пригорода Грозного.
    Генерал Трошев писал, что оккупанты убили около 300 из них(Citation: 1129).
    Правительство России сообщило Европейскому суду по правам человека, что всего из Грозного прорвались больше тысячи бойцов Вооружённых сил Ичкерии под командованием Руслана Гелаева(Citation: 278).
    Выжившие ушли на юго-запад, в горы(Citation: 773). 6 февраля российские войска захватили развалины Грозного, а 7 февраля 2000 года исполнявший обязанности президента России Путин объявил, что войска контролируют весь город(Citation: 1129)(Citation: 279).

    6 февраля защитники, вышедшие из Грозного, пришли в Гехи-Чу, село к юго-западу от столицы. 6-8 февраля группировка «Запад» генерала Шаманова бомбила и штурмовала село (подробнее: «Неизбирательные нападения»)(Citation: 1581). 10 февраля оккупационные войска захватили Итум-Кале, районный центр на юге Ичкерии у границы с Грузией, а затем Веденское ущелье на юго-востоке(Citation: 1129).
    К 29 февраля группировка «Центр» генерала Булгакова захватила Шатойский район к югу от Грозного.
    В этот день защитники, которые уходили из района на восток, разгромили у села Улус-Керт роту российских десантников из Пскова(Citation: 1581).

    4 марта 2000 года бойцы Вооружённых сил Ичкерии прорвались в Гой-Чу, село к юго-западу от Грозного.
    С 7 по 20 марта российские войска генерала Герасимова штурмовали и почти полностью разрушили село (подробнее: «Неизбирательные нападения»), а командир защитников Руслан Гелаев вырвался из окружения(Citation: 1129).

    22 января 2001 года президент России Путин объявил о частичном выводе войск, но оставил в республике 42-ю дивизию численностью около 15 тысяч человек и бригаду МВД в 6-7 тысяч человек(Citation: 1549). 4 мая министр обороны России Иванов сказал, что из Ичкерии ушли около пяти тысяч военных, а «дальнейших планов по сокращению» нет(Citation: 1546).
    Правозащитники Human Rights Watch писали, что в 2001 году в республике стояли больше 75 000 российских военных(Citation: 1451).

    28 января 2003 года Рудольф Биндиг, докладчик Парламентской ассамблеи Совета Европы, писал, что в Ичкерии стоят 80 000 военных и милиционеров из России, один на шестерых взрослых граждан республики(Citation: 285).
    В феврале 2006 года Алханов, глава оккупационной администрации, назвал 36-38 тысяч российских военных в республике(Citation: 286).

    27 января 2000 года Парламентская ассамблея Совета Европы в рекомендации 1444 потребовала от России немедленно прекратить огонь и без предварительных условий начать переговоры с избранным руководством Ичкерии(Citation: 284).
    В докладе Human Rights Watch 2002 года сказано, что после весны 2000 года «на смену захвату или защите территории приходят преднамеренные удары по гражданскому населению»(Citation: 814).

    К концу марта 2000 года российские войска захватили города и сёла Ичкерии, и Вооружённые силы Ичкерии были вынуждены отступить.
    К лету защитники оправились от тяжёлых потерь и при поддержке мирных чеченцев начали партизанскую войну(Citation: 1581).
    Дальше оккупанты отвечали на нападения защитников облавами на сёла (подробнее: «Карательные экспедиции»)(Citation: 1581).
    Чеченцы, мстившие за эти облавы, уходили к партизанам(Citation: 1581).
    На 16 апреля 2009 года в республике постоянно стояли 42-я дивизия министерства обороны России и 46-я бригада внутренних войск МВД, а Объединённую группировку войск Россия не распустила(Citation: 901).
    В этот день директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
