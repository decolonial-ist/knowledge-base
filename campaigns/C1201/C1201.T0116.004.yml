description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские военные, охрана тюрем и изоляторов, а позже оккупационная администрация Кадырова запрещали чеченцам молиться, держать пост и собираться на обряды у мечетей.

    В тюрьмах, фильтрационных лагерях и изоляторах при отделах российской милиции охрана запрещала задержанным чеченцам молиться (подробнее: «Система фильтрационных лагерей»)(Citation: 1957)(Citation: 2063).
    Охранники издевались над теми из них, кто держал пост в Рамадан, священный месяц мусульман(Citation: 813)(Citation: 1503).
    На облавах российские военные отправляли чеченцев с бородой в фильтрационные лагеря, а на допросах следователи считали бороду уликой(Citation: 1210)(Citation: 2019).

    С 12 апреля 2000 года Министерство юстиции России держало в следственном изоляторе в Чернокозове, селе на севере Ичкерии, заключённого, которого журналистка Анна Политковская назвала Арсби.
    Отряд спецназа министерства из Воронежа охранял там задержанных чеченцев.
    Спецназовцы запрещали заключённым молиться, и те молились тайно, по очереди, спиной к глазку в двери.
    В мае 2004 года Арсби рассказал Анне Политковской для «Новой газеты»: «Как-то нас выгнали из камер и требуют: „Кричите: Аллах — свинья!“.
    Кричали…»
    В 2004 году Арсби жил беженцем в одной из европейских столиц(Citation: 1957).

    14 сентября 2000 года чеченцы Самашек, села на западе Ичкерии, собрались у мечети в центре села на поминки по односельчанам, убитым в двух войнах России против Ичкерии.
    По мусульманскому обычаю на таких поминках режут жертвенных животных и раздают мясо бедным и сиротам.
    Российская военная комендатура Ачхой-Мартановского района и временный отдел российской милиции района прислали главе оккупационной администрации села предостережение: «Никаких массовых мероприятий на территории села не проводить».
    Затем российские военные на бронетехнике и грузовиках разогнали собравшихся чеченцев, давали понять, что применят оружие, и грозили снести мечеть(Citation: 1503).

    В декабре 2000 года в изоляторе временного отдела российской милиции Октябрьского района Грозного милиционеры, присланные из Ханты-Мансийского округа в Сибири, заставили задержанного чеченца, который держал пост в Рамадан, съесть кусок свиного сала, запретного для мусульман (подробнее: «Пытки и истязания»).
    Через 22 дня родные выкупили его, продав машину (подробнее: «Захват заложников»)(Citation: 1503).
    В Ханкале, главной базе оккупационных войск на восточной окраине Грозного, российские военные в декабре 2000 года отделили от других задержанных двоих чеченцев из сёл Радужное и Долинский к западу от Грозного, потому что те держали пост и не брали воду. 21 февраля 2001 года родные нашли их тела со связанными руками и ранами от выстрелов в голову в дачном посёлке у Ханкалы (подробнее: «Убийство пленных и задержанных»)(Citation: 813)(Citation: 1589). 23 декабря 2000 года на облаве в посёлке Катаяма на северо-западе Грозного российские военные заводили служебных собак в комнаты, где молились старики, хотя чеченцы просили этого не делать(Citation: 1503).

    16-27 августа 2001 года на облаве в Аллерое, селе на востоке республики, российские военные отобрали у студента теологического института всю религиозную литературу, а листы Корана потом нашли в туалете(Citation: 1581).

    В 2004 году старший следователь прокуратуры Ленинского района Грозного Дукаев спрашивал дежурного изолятора районного отдела милиции, к какому «идеологическому движению» принадлежал арестованный студент Михаил Владовских «по его бороде и сбритым усам».
    В 2005 году Верховный суд Чеченской Республики оправдал студента: обвинение держалось только на показаниях другого арестованного, которого милиционеры пытками заставили оговорить себя и его (подробнее: «Фабрикация преступников»)(Citation: 2019).

    В ночь на 5 августа 2005 года в станице Шелковской, на северо-востоке Ичкерии, вооружённые люди в камуфляже забрали из дома учителя арабского языка и основ ислама Вахамби Сатиханова, а к утру убили его: десять ножевых ран, переломанные пальцы (подробнее: «Убийство пленных и задержанных»).
    Односельчане обвинили в убийстве бойцов батальона «Восток», созданного российской военной разведкой в 42-й дивизии: эти бойцы и раньше угрожали учителю за то, как он преподавал арабский язык(Citation: 2014).
    С декабря 2005 года администрация колоний Свердловской области, на Урале, запрещала осуждённому чеченцу Исламу Сусханову молиться, а за молитву надевала на него наручники и сажала в штрафной изолятор.
    В 2006 году российская тюремная служба перевела его в колонию для особо опасных рецидивистов (подробнее: «Правовая сегрегация населения»)(Citation: 2063).

    Правозащитники, авторы доклада «Международный трибунал для Чечни», в 2009 году писали, что очевидцы очень многих, если не большинства, преступлений российских военных рассказывают, как те оскорбляли веру чеченцев и оскверняли святыни.
    Авторы призвали собрать эти свидетельства как доказательства того, что военные преследовали чеченцев за народ и веру(Citation: 1581).

    24 июля 2008 года в Гудермесе, городе к востоку от Грозного, глава оккупационной администрации Кадыров-младший потребовал от руководства мусульман республики и районных мусульманских судей знать, кто ходит в мечети и о чём там говорит, и велел запретить молодёжи оставаться в мечетях после молитвы (подробнее: «Создание марионеточных религиозных институтов»)(Citation: 944).
