  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия лишала чеченских беженцев в Ингушетии еды, жилья, регистрации, сносила их лагеря и вывозила людей обратно в Ичкерию, где шла война.

    К 6 декабря 1999 года 239 804 чеченца бежали от бомбёжек в Ингушетию, подконтрольную России республику к западу от Ичкерии(Citation: 767).
    В декабре 1999 года в миграционной службе Ингушетии вывесили «Список населенных пунктов освобожденных районов Чеченской Республики для размещения вынужденных переселенцев» - 20 сёл и станиц Ичкерии, куда штаб оккупационных войск собирался селить беженцев.
    Командующий Объединённой группировкой российских войск Казанцев подписал список, а согласовали генерал Бабичев, комендант захваченных районов («зоны безопасности»), заместители командующего от МВД Чекалин и Палков и заместитель от МЧС Байрамов(Citation: 1640).

    3 марта 2001 года правительство России постановлением № 163 взялось само кормить беженцев в Ингушетии, и с 1 мая международные организации перестали раздавать еду в лагерях.
    Беженцы обещанной еды не получили(Citation: 814).
    В 2001 году миграционная служба Ингушетии по указанию российских ведомств перестала регистрировать новых беженцев из Ичкерии.
    Без регистрации люди не получали статуса, пособий, а часто и помощи; к началу 2002 года таких было от 20 до 50 тысяч(Citation: 1381)(Citation: 814).

    29 мая 2002 года министр России по делам Чеченской Республики Елагин, полпред президента России в Южном федеральном округе Казанцев, президент Ингушетии Зязиков и глава оккупационной администрации Кадыров подписали план из 20 пунктов: к октябрю 2002 года вернуть всех беженцев из Ингушетии в Ичкерию.
    Права остаться план не давал(Citation: 1381)(Citation: 1818).
    В октябре 2002 года Федеральная миграционная служба России при перерегистрации лишила статуса около 40 тысяч беженцев в Ингушетии(Citation: 1381). 4 июля 2003 года правительство России постановлением № 404 назначило компенсацию за потерянное жильё - 350 тысяч рублей, но только постоянно живущим в Ичкерии(Citation: 1536).

    Миграционные службы России и Ингушетии, МЧС, комитет по делам беженцев оккупационного правительства при поддержке ФСБ исключали людей из списков на помощь, отключали в лагерях газ, свет, воду.
    У лагерей стояли российские воинские части и ОМОН.
    Тем, кто отказывался подписать заявление о «добровольном» возвращении, чиновники грозили арестом по сфабрикованному обвинению и «зачистками» (так россияне называли обыски домов и задержания чеченцев)(Citation: 1536)(Citation: 1381).

    В декабре 1999 года под нажимом вице-премьера России Кошмана, полпреда правительства в Чеченской Республике, лагерь чеченских беженцев в вагонах прицепили к локомотиву и против воли людей оттащили из Ингушетии на шесть километров в Серноводск, село на западе Ичкерии.
    Источники расходятся: одни пишут о 36 вагонах, другие - о 47 вагонах с 2250 беженцами.
    Половина людей схватила детей, выпрыгнула из вагонов на ходу и осталась в Ингушетии без регистрации.
    Вагоны встали между двумя российскими воинскими частями, и с начала января в них нечем было топить(Citation: 1640)(Citation: 1642).
    Анна Политковская в «Новой газете» 27 декабря 1999 года привела слова руководителя Федеральной миграционной службы России Каламанова о переезде вагонов: «Зачем копья ломать?
    Ведь это ТОЛЬКО шесть километров.
    К тому же все ближе и ближе к ИХ домам...»
    Беженцам в палаточных лагерях, которые не хотели уезжать, коменданты перестали давать хлеб и суп(Citation: 1640).

    29 декабря 1999 года семья, которую сотрудники миграционной службы уговорили словами «там уже все спокойно, зона безопасности», вернулась из лагеря беженцев в Ассиновской, станице на западе Ичкерии, домой в Мартан-Чу, село к юго-западу от Грозного. 3 января 2000 года российские танкисты, стоявшие лагерем на окраине села, где не было боёв, выстрелом из танка по дому убили мать, её грудного сына, семилетнюю дочь и 18-летнюю тётю детей, а пятилетняя дочь осталась сиротой (подробнее: «Массовые убийства гражданских»)(Citation: 1647).

    С 4 июня 2002 года оккупационная администрация снимала палатки чеченских беженцев в лагере в Знаменском, селе на севере Ичкерии, закрывала туалеты, грозила отключить газ, воду, свет и лишить пособий, чтобы люди переехали во временное жильё в Грозном («пункты временного размещения»).
    Администрация закрыла лагерь 7 июля, через две недели после того, как Россия дала спецпредставителю генерального секретаря ООН Отунну «прямые и твёрдые заверения», что беженцев не будут возвращать против воли(Citation: 2170)(Citation: 1381).
    В начале августа 2002 года директор совхоза «Альтиевский» на окраине Назрани, города в Ингушетии, срезал кабель и оставил без света 1500 чеченских беженцев, которые жили на бывших фермах.
    Президент Ингушетии Зязиков требовал от руководителей хозяйств, чтобы те создавали беженцам невыносимые условия(Citation: 1818).

    В начале сентября 2002 года чеченские беженцы из палаточного лагеря у Аки-Юрта, села на севере Ингушетии, написали в ООН, ОБСЕ, Совет Европы и послам европейских стран, что не хотят переезжать. 19 сентября МВД Ингушетии несколько часов допрашивало троих их представителей. 22-23 сентября сотрудники миграционной службы и МЧС разобрали в лагере две палатки.
    В ноябре чиновники из Москвы и оккупационной администрации твердили, что 1 декабря лагерь закроют, а рядом в здании школы встал отряд ОМОН.
    В последние дни ноября грузовики и автобусы МЧС и миграционной службы вывозили людей в Ичкерию. 1 декабря российские милиционеры из МВД Ингушетии и ОМОН стали снимать палатки тех, кто отказался уехать, а 2 декабря чиновники закрыли лагерь.
    По данным Датского совета по беженцам, в лагере жили 1700 человек, по данным миграционной службы - 700, и деньги на жильё в Ичкерии предложили только этим 700.
    В декабре 2002 года правозащитники «Мемориала» назвали закрытие лагеря депортацией в сталинской традиции(Citation: 1381). 10 декабря координатор ООН по гуманитарным вопросам в России Фредерик Лайонс сказал агентству Reuters, что беженцев «по сути принудили вернуться»: «им создали более тяжёлые условия и оказывали на них психологическое давление»(Citation: 285).
    По подсчёту Ивиньского, докладчика Парламентской ассамблеи Совета Европы, большинство уехали в Ичкерию, 127 человек поселились у семей в Аки-Юрте, 371 - во временных поселениях рядом, около 60 - в других местах Ингушетии(Citation: 285).

    В конце января 2003 года вице-премьер Ингушетии Махаури объявил незаконными временные дома для беженцев, которые строила организация «Врачи без границ», и прокурор Сунженского района Ингушетии приказал снести к 26 марта 180 готовых домов.
    Правительство Ингушетии остановило строительство ещё 1020 домов, а готовые стояли пустыми до августа(Citation: 1381). 14 августа 2003 года председатель оккупационного правительства Попов на пресс-конференции в Москве назначил 1 октября крайним сроком закрытия лагерей, за четыре дня до «выборов» «президента»(Citation: 1536).
    В середине августа 2003 года миграционные службы переселили около 200 человек из лагеря «Белла» в Слепцовской, станице в Ингушетии, в пункт временного размещения на бывшем складе химикатов для полей, а заболевших отправили обратно в лагерь, где их палатки уже сняли(Citation: 1536). 1 октября 2003 года чиновники Ингушетии закрыли «Беллу», где в январе жили 3200 человек(Citation: 1381)(Citation: 1377).

    В феврале 2004 года министр России по делам Чеченской Республики Ильясов доложил президенту России Путину по телевидению, что к 1 марта все беженцы будут переселены.
    В лагере «Сацита» в Ингушетии чиновники в феврале отключили воду тем, кто не хотел переезжать в лагерь в Ичкерии(Citation: 1942)(Citation: 1939).

    Парламентская ассамблея Совета Европы 27 января 2000 года потребовала от России воздерживаться от любых принудительных возвращений в Ичкерию(Citation: 284), а 29 января 2003 года - никогда не применять прямую или косвенную силу и давление, чтобы заставить беженцев вернуться против воли(Citation: 285).
    По опросу организации «Врачи без границ» в лагерях Ингушетии в феврале 2003 года, 98 % беженцев не хотели возвращаться, и 93 % из них боялись за жизнь семьи(Citation: 1381).
    Комитет ООН по правам человека 4 ноября 2003 года отметил сообщения о давлении на беженцев в лагерях Ингушетии, чтобы те вернулись(Citation: 1445).
    Александр Черкасов из «Мемориала» в 2004 году писал, что с декабря 1999 года шло возвращение беженцев, «подчас принудительное», в «зоны безопасности», где в январе - феврале 2000 года в городе Шали и сёлах Закан-Юрт, Шаами-Юрт, Катыр-Юрт от бомбёжек и обстрелов «погибли сотни вернувшихся туда мирных жителей».
    По его словам, призывы к «добровольному возвращению» беженцев из Ингушетии «лицемерны и преступны»(Citation: 1328).
    В августе 2004 года организация «Врачи без границ» писала, что российские чиновники перевозят людей из Ингушетии в Ичкерию против их воли(Citation: 1381).

    Российские чиновники и сотрудники оккупационной администрации обещали беженцам из «Спутника», большого палаточного лагеря в Ингушетии, компенсацию за потерянное жильё и грозили лишить помощи, а 1 апреля 2004 года закрыли лагерь, четвёртый за полгода.
    В конце мая беженцы «Сациты», последнего палаточного лагеря в Ингушетии, который собирались закрыть в начале июня, рассказали делегатам Amnesty International, что чиновники уговаривали их уехать обещаниями и угрозами.
    Одни вернулись в Ичкерию, другие отказались и остались в Ингушетии(Citation: 2080). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
