description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия объявила, что избранные в 1997 году президент и парламент Ичкерии незаконны, отказывалась вести с ними переговоры и мешала другим государствам принимать их представителей.

    С осени 1999 года Россия перестала признавать соглашения в Хасавюрте, которыми она и Ичкерия в 1996 году закончили первую войну, и Договор о мире от 12 мая 1997 года.
    Россия отказалась признавать выборы президента и парламента Ичкерии в январе 1997 года, хотя тогда признала их итоги.
    Выборы прошли под руководством Организации по безопасности и сотрудничеству в Европе (ОБСЕ)(Citation: 1441).

    23 сентября 1999 года президент России Ельцин секретным указом № 1255с, изданным по российскому закону «О борьбе с терроризмом», отнёс Ичкерию к «Северо-Кавказскому региону Российской Федерации» (подробнее: «Военная интервенция»)(Citation: 672). 8 июня 2000 года президент России Путин указом № 1071 записал, что в республике нет законодательства и органов, «предусмотренных Конституцией Российской Федерации», и поставил над ней администрацию с главой, которого назначал сам (подробнее: «Установка новой системы управления»)(Citation: 840).

    Председатель правительства, а с 2000 года президент России Путин, его министры и представители отказывались говорить с президентом Ичкерии Асланом Масхадовым.
    Российские руководители допускали переговоры только о сдаче оружия и только с теми, кто признаёт Ичкерию частью России(Citation: 1577)(Citation: 1446)(Citation: 1488).
    Министерство иностранных дел России протестовало, когда правительства других государств принимали представителей президента Ичкерии(Citation: 1381).
    Генеральная прокуратура России требовала выдать этих представителей как преступников (подробнее: «Преследование за рубежом»)(Citation: 1925).

    Президент Ичкерии Аслан Масхадов в интервью, которое журнал «Коммерсантъ Власть» опубликовал 21 сентября 1999 года, сказал: «В мае 1997 года мы с президентом России Борисом Ельциным подписали мирный договор между Чечней и РФ…
    К сожалению, за два прошедших года практически не выполнен ни один из пунктов этого договора…
    И вот Москва вновь фактически аннулировала все договоренности»(Citation: 688). 29 сентября председатель правительства России Путин объявил, что границы с Ичкерией у России нет, и отказался обсуждать её статус(Citation: 27). 1 октября Путин встретился в Москве с депутатами парламента, который избрали в 1996 году при ставленнике Москвы Завгаеве.
    Полномочия этих депутатов истекли в 1998 году (подробнее: «Марионеточное правительство»)(Citation: 687).
    После встречи председатель правительства, по сообщению газеты «Коммерсантъ», заявил журналистам: «Это единственный орган власти Чеченской республики, избранный по российским законам.
    Все остальные органы власти, мягко говоря, нельзя считать легитимными, поскольку они не избирались по законам Российской Федерации»(Citation: 810)(Citation: 1570). 7 октября Путин объявил, что война пойдёт до победы, и отказался от переговоров(Citation: 27).

    В октябре 1999 года Россия отвергла посредничество президента Грузии Шеварднадзе, о котором просил Аслан Масхадов. 29 ноября министр иностранных дел России Иванов отказался от посредничества председателя ОБСЕ Воллебека(Citation: 765). 15 декабря представитель правительства России в республике Кошман заявил, что переговоров с Асланом Масхадовым не будет, а политические переговоры начнутся «лишь после уничтожения бандформирований» (так Россия называла Вооружённые силы Ичкерии)(Citation: 1577).

    17 января 2000 года российские руководители во главе с исполняющим обязанности президента России Путиным сказали в Москве делегации Парламентской ассамблеи Совета Европы (ПАСЕ), что у Ичкерии нет надёжного собеседника, способного выполнять договорённости, а переговоры возможны только с руководством республики, которое Россия поставит после конца боёв(Citation: 765). 5 февраля 2000 года в Новых Алдах, посёлке на южной окраине Грозного, российские солдаты увели Шамхана Байгираева, потому что его водительское удостоверение выдали в мае 1999 года, при независимой Ичкерии. 10 февраля его обгоревшее тело нашли в подвале (подробнее: «Массовые убийства гражданских»)(Citation: 280).

    24 октября 2001 года Казанцев, представитель Путина на юге России, объявил, что на встрече с Ахмедом Закаевым, представителем президента Ичкерии, будут говорить только о разоружении Вооружённых сил Ичкерии(Citation: 1488). 18 ноября на встрече в Москве Казанцев, по словам Ахмеда Закаева, предложил Ичкерии только сдаться (подробнее: «Переговоры как прикрытие нападения»)(Citation: 1798).

    15 февраля 2002 года министр иностранных дел России Иванов в Париже пожаловался министру иностранных дел Франции Ведрину, что во Франции принимают посланцев Аслана Масхадова.
    За такие встречи министерство иностранных дел России вызывало послов Франции и Великобритании(Citation: 1381).
    В конце октября 2002 года, после Всемирного чеченского конгресса в Копенгагене, датская полиция по запросу России арестовала Ахмеда Закаева (подробнее: «Фабрикация преступников»).
    Посол России в Дании Бордюжа назвал конгресс «оскорбительным для всего российского народа» и объявил, что Путин отменил визит в Данию, а Россия не приедет на саммит «Россия - ЕС» в Копенгагене(Citation: 1831).

    23 марта 2003 года Россия провела в Ичкерии голосование за конституцию, в первой статье которой республику записали «в составе Российской Федерации» (подробнее: «Имитация народного волеизъявления»)(Citation: 794).
    В сентябре 2003 года на суде в Лондоне о выдаче Ахмеда Закаева эксперт Генеральной прокуратуры России Бессарабов согласился, что Ельцин признал избранного президента Аслана Масхадова и подписал с ним договор о мире, но эксперт назвал Ичкерию «частью РФ»(Citation: 1915). 13 ноября 2003 года лондонский суд отказал России в выдаче (подробнее: «Фабрикация преступников»)(Citation: 1925).

    Утром 3 сентября 2004 года, на третий день после того, как вооружённая группа захватила школу в Беслане, городе в подконтрольной России Северной Осетии, Аслан Масхадов заявил, что готов приехать и вести переговоры с теми, кто захватил школу, и просил для себя только безопасного коридора(Citation: 1581).
    Президент России Путин коридора не объявил, а днём российские силовики, которыми руководили заместители директора ФСБ Проничев, Тихонов и Анисимов, штурмовали школу(Citation: 2035)(Citation: 1581).
    В октябре 2004 года Россия согласилась на «круглый стол» ПАСЕ о политическом положении в республике при условии, что туда не допустят никого, кто не признаёт «территориальную целостность Российской Федерации». 21 марта 2005 года первое заседание в Страсбурге прошло без представителей Ичкерии(Citation: 941).

    В январе 2005 года Ахмед Закаев, представитель Аслана Масхадова, не смог прилететь в Хельсинки на встречи о мире, куда его пригласили финские депутаты: по требованию России его бы там арестовали (подробнее: «Преследование за рубежом»)(Citation: 2000)(Citation: 2001). 8 марта 2005 года спецназ ФСБ России убил Аслана Масхадова, президента Ичкерии, избранного в 1997 году (подробнее: «Переговоры как прикрытие нападения»)(Citation: 791).

    Парламентская ассамблея Совета Европы 4 ноября 1999 года в резолюции 1201 поддержала мирный диалог российского руководства с демократически избранным президентом Ичкерии(Citation: 699). 27 января 2000 года ПАСЕ в рекомендации 1444 призвала Россию немедленно начать политический диалог без предварительных условий с избранным руководством Ичкерии.
    В рекомендации 1456 от 6 апреля 2000 года сказано, что Россия этого не сделала(Citation: 284)(Citation: 766).
    В рекомендации Европейского парламента от 26 февраля 2004 года сказано, что отсутствию диалога о войне в Ичкерии нет ни моральных, ни политических оправданий, а Европейский союз готов стать посредником(Citation: 551).

    22 сентября 2006 года депутаты в Москве объявили амнистию за преступления, совершённые «на территориях субъектов Российской Федерации, находящихся в пределах Южного федерального округа», и так записали Ичкерию в число субъектов России(Citation: 796).
