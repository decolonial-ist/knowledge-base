  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские силовики насиловали чеченок при облавах на сёла и на блокпостах, а задержанных чеченцев и чеченок - в фильтрационных лагерях.

    При «зачистках» (так россияне называли обыски домов и задержания чеченцев) российские солдаты насиловали чеченок в домах и подвалах, а изнасилованных, как правило, убивали(Citation: 786).
    На блокпостах военные задерживали чеченок за мелочь в паспорте, держали в металлических контейнерах или вагончиках и насиловали(Citation: 281)(Citation: 1503).

    В фильтрационных лагерях охранники, следователи и омоновцы, бойцы российского милицейского спецназа, насиловали задержанных чеченцев и чеченок, среди них подростков, в том числе дубинками (подробнее: «Система фильтрационных лагерей»)(Citation: 281)(Citation: 958).
    Охранники пытали узников током по половым органам, а изнасилованных мужчин звали женскими именами(Citation: 281)(Citation: 812).
    С 2004 по 2006 год сотрудники оперативно-розыскного бюро № 2 МВД России в Грозном на допросах грозили задержанным изнасилованием, выбивая признания (подробнее: «Фабрикация преступников»)(Citation: 1554).

    В первые две недели декабря 1999 года российские солдаты-контрактники изнасиловали не меньше трёх чеченок в Алхан-Юрте, селе к юго-западу от Грозного, а сельчане прятали дочерей в яме во дворе(Citation: 770). 12 января 2000 года пьяные российские солдаты ворвались в дом Зайрбека Матаева в Джалке, селе к востоку от Грозного.
    Его жена с тремя детьми пряталась в комнате.
    Солдаты стреляли в эту комнату и изнасиловали жену Зайрбека Матаева.
    Дело возбудили, но российские военные уговорами и угрозами заставили Матаевых отказаться от иска(Citation: 1503). 17 января шестеро российских военных в Ташкале, посёлке в Грозном, связали отца и сына Бахаевых, у них на глазах изнасиловали жену и двух сестёр сына, а потом расстреляли женщин вместе с сыном.
    Отец похоронил их в родовом селе Гельдаген к востоку от Грозного и жаловаться оккупантам не стал(Citation: 1581).

    24 января 2000 года российские военные задержали 19-летнюю чеченку, три дня насиловали её в палатке в Ханкале, главной базе оккупационных войск на восточной окраине Грозного, и 31 января отвезли в изолятор в Чернокозове, селе на севере Ичкерии.
    Через 18 дней военные отпустили её домой(Citation: 281).
    В последнюю неделю января российские солдаты на пропускном пункте «Кавказ-1» на границе с подконтрольной России Ингушетией задержали двух чеченок, Алису и Майю (имена изменены), будто фото в паспорте не похоже, избили и изнасиловали обеих, а потом отпустили(Citation: 281)(Citation: 1581).
    В январе или феврале охранники изолятора в Чернокозове четыре дня держали в камере 14-летнюю девочку, которая заплатила за свидание с матерью-узницей, и около десяти охранников её насиловали(Citation: 812).

    5 февраля 2000 года российские контрактники и омоновцы обыскивали Новые Алды, посёлок на южной окраине Грозного, и убивали чеченцев (подробнее: «Массовые убийства гражданских»)(Citation: 280).
    Четыре чеченки пошли проверить свои дома.
    Двенадцать контрактников захватили их и по очереди насиловали.
    Одну женщину солдат убил, сев ей на голову, двух задушили, когда те закричали, а четвёртую бросили, сочтя мёртвой. 9 февраля родственница нашла её в подвале, а тела троих убитых контрактниками женщин, 35, 32 и 29 лет, похоронила во дворе.
    Выжившая уехала из Ичкерии(Citation: 280)(Citation: 1581).
    Марха Татаева из Новых Алдов рассказала правозащитникам «Мемориала», как в этот день контрактник хотел её расстрелять, а другой солдат его остановил: «Пусть девка спрячется.
    А то эти найдут ее, перетрахают [изнасилуют] и убьют все равно».
    Марха Татаева спряталась и выжила(Citation: 817).
    Женщины рассказали правозащитникам Human Rights Watch о шести изнасилованиях в посёлке 5 февраля.
    В докладе организации сказано, что изнасилований могло быть больше: о них молчат из-за позора(Citation: 280).

    15 февраля 2000 года Сайдуллаев, глава созданной в Москве марионеточной администрации («Госсовета»), по сообщению агентства «Интерфакс», сказал, что омоновцы и контрактники российских войск в фильтрационных лагерях, в том числе в Чернокозове, избивали, пытали задержанных и совершали над ними «насилие» (подробнее: «Система фильтрационных лагерей»)(Citation: 1524).

    В ночь на 27 марта 2000 года солдаты 160-го танкового полка по приказу командира полка Буданова увезли из дома в Танги-Чу, селе к юго-западу от Грозного, 18-летнюю Эльзу Кунгаеву.
    Буданов избил и задушил её в своём фургоне в лагере полка, а солдаты тайно закопали тело (подробнее: «Надругательство над мёртвыми»)(Citation: 1439)(Citation: 1530). 28 марта армейский судмедэксперт Ляненко записал, что примерно за час до смерти девушку изнасиловали предметом(Citation: 1797)(Citation: 1439).
    Генерал Вербицкий, заместитель командующего группировкой оккупационных войск «Запад», сказал сельчанам, что Буданов изнасиловал и задушил Эльзу Кунгаеву.
    Военные прокуроры обвинили Буданова только в похищении, убийстве и превышении полномочий.
    Виса Кунгаев, отец Эльзы Кунгаевой, в феврале 2001 года сказал правозащитникам Human Rights Watch: «Они отняли самое главное обвинение»(Citation: 1439).
    Прокуроры вменили одному из трёх солдат, закопавших тело, надругательство над трупом, и правозащитники Human Rights Watch писали, что так изнасилование хотели выдать за действие после смерти(Citation: 1439).
    Суд назначил новую экспертизу, и эксперты Российского центра судебно-медицинской экспертизы написали, что разрывы «возникли посмертно»(Citation: 1797).
    В декабре 2008 года, когда суд досрочно освободил Буданова (подробнее: «Безнаказанность исполнителей»), правозащитник Сергей Ковалёв сказал Радио Свобода: «В будановском приговоре записано, что он приговорен за похищение и убийство.
    Это неправда, потому что этот мерзавец изнасиловал, а потом убил женщину»(Citation: 1531).

    6 мая 2000 года омоновцы задержали в Урус-Мартане, городе к юго-западу от Грозного, 20-летнего Зелимхана (имя изменено) и два часа били у ямы, требуя подписать, что он воевал.
    В изоляторе в бывшем интернате Урус-Мартана четверо или пятеро омоновцев по приказу следователя изнасиловали его дубинками и прикладами, а 13 мая отпустили за 300 долларов(Citation: 958). 17 июля 2000 года российские военные на блокпосту в Черноречье, на выезде из Грозного, задержали чеченку, потому что в паспорте не было второй фотографии.
    Восемь пьяных оккупантов двое суток насиловали в вагончике её и ещё двух женщин, пока на третье утро женщин не выпустили чеченцы в камуфляже(Citation: 1503)(Citation: 1581).

    31 июля 2000 года пьяные российские солдаты с бронетранспортёра у площади «Минутка» в Грозном больше часа избивали и насиловали 19-летнюю Зарему (имя изменено).
    Подъехавший командир остановил их(Citation: 1503).
    В начале сентября 2000 года четверо российских военных на окраине Наурской, станицы на севере Ичкерии, кастрировали 55-летнего пастуха Умалта Исраилова и изнасиловали палкой. 8 сентября люди собрались у военной комендатуры станицы и потребовали судить военных.
    Комендант поговорил с пастухом наедине, и Умалт Исраилов сказал собравшимся, что над ним никто не глумился(Citation: 1503).

    В начале февраля 2001 года российские младшие офицеры в лагере на базе 45-го и 119-го десантных полков у Хоттуни, села на юго-востоке Ичкерии, на допросах насиловали задержанных чеченцев.
    Изнасилованные узники выжили, и одного из них оккупанты отпустили за выкуп(Citation: 1721).
    В ночь на 5 мая 2001 года российские военные ворвались в дом на улице Никитина в Грозном, убили хозяина и его 13-летнего брата.
    Военные увезли 19-летнюю жену и 16-летнюю сестру хозяина, изнасиловали, а утром прохожие нашли девушек без сознания у разрушенного цирка, где стояло управление МВД России по Чеченской Республике(Citation: 1581). 2-4 июля 2001 года при облаве в Серноводске, селе на западе Ичкерии, российские военные насиловали задержанных мужчин; источники расходятся: медики организации «Врачи без границ» писали о 60 случаях, «Новая газета» - о 68 мужчинах, заявивших об изнасиловании(Citation: 1381)(Citation: 1752). 12 июля двое из них пытались покончить с собой, один умер(Citation: 1752).

    С 28 января по 5 февраля 2002 года при облаве в Старых Атагах, селе к югу от Грозного, российские военные брали с семей 300 и 500 рублей, серьги и цепочки, чтобы не насиловать девушек(Citation: 1783).
    Сельчане ночами дежурили и сорвали не меньше двух попыток изнасилования(Citation: 1512).
    В 2003 году сотрудники российской ФСБ в бывшем интернате Урус-Мартана два дня пытали током 35-летнюю чеченку Зейнап и изнасиловали бутылкой, требуя признаться в убийстве четырёх милиционеров.
    Зейнап подписала признание, и судья Урус-Мартановского суда Яндаров осудил её, будто она служила в Вооружённых силах Ичкерии (подробнее: «Фабрикация преступников»)(Citation: 1924).

    6 апреля 2000 года Парламентская ассамблея Совета Европы в рекомендации 1456 назвала изнасилования чеченских женщин и девушек жестоким средством войны(Citation: 766). 8 июня 2000 года Amnesty International сообщила, что в фильтрационных лагерях узников - мужчин, женщин и детей - «постоянно и систематически» пытают, в том числе насилуют(Citation: 958).
    В выводах Комитета ООН против пыток в мае 2002 года сказано: «Утверждения о жестоком сексуальном насилии необычно часты»(Citation: 783).
    В 2004 году врачи британского Фонда помощи жертвам пыток обследовали 35 беженцев из Ичкерии, и десять чеченцев из них рассказали, что их изнасиловали российские военные или милиционеры.
    Правозащитники в докладе «Международный трибунал для Чечни» пишут, что не могут установить масштаб изнасилований: в чеченском обществе о них не говорят(Citation: 1581).

    В марте 2006 года сотрудники оперативно-розыскного бюро № 2 МВД России в Грозном задержали братьев Сулима и Саламбека (имена изменены) и угрозой изнасиловать жену Саламбека у него на глазах заставили его признаться во взрыве автобуса, которого он не совершал.
    В августе 2006 года суд освободил обоих братьев, а пытки расследовать не стал(Citation: 1554).
