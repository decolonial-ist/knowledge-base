    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские военные подняли свой флаг над захваченным Грозным, а оккупационная администрация открыла памятник кремлёвскому ставленнику, развешивала портреты Кадыровых и дала центральной улице Грозного имя президента России Путина.

    При захвате Грозного российские военные поднимали флаг России(Citation: 1581).
    С 2005 года оккупационная администрация развешивала по всей республике портреты Кадырова, своего погибшего главы, и Кадырова-младшего, первого заместителя председателя оккупационного правительства(Citation: 311)(Citation: 941).

    В конце января 2000 года, когда оккупанты захватили площадь «Минутка» в Октябрьском районе Грозного, командир 6-й роты 245-го мотострелкового полка Новичков поднял над ней российский флаг(Citation: 1581).

    17 февраля 2005 года председатель оккупационного правительства Абрамов сообщил агентству «Интерфакс», что в центре Грозного поставят памятник Кадырову, главе оккупационной администрации: «правительство Чечни уже объявило открытый конкурс на проект памятника Кадырову»(Citation: 2166).
    Кадыров погиб при взрыве на стадионе «Динамо» 9 мая 2004 года, и президент России Путин объявил его героем(Citation: 1977).
    Чиновники оккупационной администрации собирали деньги на памятник с учителей и врачей (подробнее: «Административная коррупция и вымогательство»)(Citation: 941). 20 августа 2005 года в центре Грозного открыли памятник Кадырову работы скульптора Церетели(Citation: 1532).

    24 мая 2006 года председатель оккупационного правительства Кадыров-младший распоряжением № 241 к 55-летию Кадырова велел развесить уличные щиты и транспаранты со своими словами «Я продолжу дело отца до победного конца»(Citation: 2049).

    5 октября 2008 года глава оккупационной администрации Кадыров-младший указом назвал проспект Победы, центральную улицу Грозного, проспектом Владимира Путина (подробнее: «Стирание и переименование топонимов»).
    На фасадах домов вдоль него повесили таблички с новым именем(Citation: 1481).
