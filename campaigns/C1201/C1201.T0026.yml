  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Лётчики оккупационных войск разрушили телецентр Ичкерии и убили двух чеченских операторов телевидения, российские силовики похитили журналиста чеченской газеты, а МВД подконтрольной России Ингушетии оставило без типографии еженедельник «Чеченское общество».

    Российские генералы называли телецентр и телевизионную башню Грозного целями ударов, а лётчики бомбили их.
    К маю 2000 года единственной чеченской газетой остался «Грозненский рабочий», который выходил малым тиражом в Ингушетии на международные гранты и почти не доходил до Ичкерии(Citation: 1381).

    По сообщению агентства ИТАР-ТАСС, 24 сентября 1999 года российские лётчики ударили по телевизионной башне Грозного(Citation: 930). 25 сентября российская авиация разрушила государственный телецентр Ичкерии.
    Командующий военно-воздушными силами России Корнуков в тот день сказал журналистам, что лётчики будут бомбить, пока им отдают приказы командиры и председатель правительства России(Citation: 1465). 26 сентября начальник Главного оперативного управления Генерального штаба российской армии Балуевский назвал телецентр среди целей авиации(Citation: 1548).
    В докладе правозащитников «Мемориала» осенью 1999 года сказано: «В Грозном в конце сентября – начале октября федеральная авиация [российская авиация] в течение нескольких дней пыталась разрушить телебашню.
    В результате многочисленных попаданий в районе «56 участок» погибли 18 человек, среди раненых было по крайней мере 10 детей до 7 лет»(Citation: 923).

    29 октября 1999 года российские лётчики ударили ракетами по колонне беженцев у села Шаами-Юрт на трассе из Грозного в Ингушетию (подробнее: «Ложный коридор»).
    С колонной ехали чеченские операторы Шамиль Гигаев из независимой грозненской телекомпании «Нохчо» и Рамзан Межидов, который снимал для московского телеканала «ТВ Центр».
    Когда первая ракета попала в автобус с беженцами, операторы вышли с камерами снимать.
    Лётчики следующей ракетой смертельно ранили обоих(Citation: 1466).
    Камера и кассета Рамзана Межидова после удара не уцелели(Citation: 277).

    4 февраля 2000 года российские военные, по предположению правозащитников «Мемориала» - из 205-й мотострелковой бригады, при обысках в Заводском районе Грозного увели из подвала жилого дома журналиста газеты «Грозненский рабочий» Саид-Ахмеда Бицалова.
    Он пропал без вести, как и двое мужчин, которых увели вместе с ним (подробнее: «Похищение людей»)(Citation: 1210).

    1 декабря 1999 года международная организация защиты журналистов Committee to Protect Journalists написала президенту России Ельцину об «очевидном пренебрежении российских военных безопасностью журналистов» и об ударах по мирным людям, похожих на «преднамеренную стратегию»(Citation: 1466).

    30 июля 2004 года директор полиграфического комбината «Ингушетия» в Назрани по устному указанию МВД Ингушетии отказался печатать чеченский еженедельник «Чеченское общество», а другой типографии у газеты не было (подробнее: «Цензура»)(Citation: 1973).
