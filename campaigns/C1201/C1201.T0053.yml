  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские военные, милиционеры, сотрудники ФСБ, а позже силовики оккупационной администрации похищали чеченцев и скрывали от родных их судьбу.

    В 2000-2003 годах похитителями чаще всего были российские военные из армии и внутренних войск МВД (предшественников современной Росгвардии), сотрудники ФСБ и милиционеры, которых МВД присылало из регионов России(Citation: 1188).
    С 2003-2004 годов всё чаще похищали силовики оккупационной администрации - служба безопасности Кадырова-младшего и «нефтяной полк», а также батальоны «Восток» и «Запад» 42-й дивизии министерства обороны России(Citation: 1209).

    11 января 2000 года командующий оккупационными войсками Казанцев приказал задерживать на границе Ичкерии мужчин от 10 до 60 лет (подробнее: «Транспортная блокада»)(Citation: 1581).
    Российские солдаты задерживали чеченцев на блокпостах, проверяя паспорта по спискам подозреваемых.
    При «зачистках» (так россияне называли обыски домов и задержания чеченцев) войска на несколько дней окружали село, ходили по домам и уводили чеченцев(Citation: 1209).

    Ночью российские военные в масках и без знаков различия приезжали к домам на бронетранспортёрах без номеров и увозили чеченцев(Citation: 815).
    С конца 2002 года избирательные налёты на отдельные дома всё чаще заменяли массовые облавы(Citation: 1581).

    Российские силовики не записывали задержание, а российские комендатуры и воинские части отвечали родным, что никого не задерживали(Citation: 1581).
    Иногда пресс-служба оккупационных войск объявляла похищенного задержанным или убитым «боевиком» (так россияне называли бойцов Вооружённых сил Ичкерии) (подробнее: «Ложь о собственных действиях»)(Citation: 1581).

    Российские военные держали похищенных в ямах в Ханкале, главной базе оккупационных войск на восточной окраине Грозного, в камерах временных отделов милиции и на базах воинских частей(Citation: 1210).
    Силовики оккупационной администрации прятали похищенных на своих базах в Центорое, селе к юго-востоку от Грозного, и в Гудермесе, городе к востоку от Грозного (подробнее: «Система фильтрационных лагерей»)(Citation: 1554).

    Часто силовики отпускали похищенных за выкуп (подробнее: «Захват заложников»)(Citation: 1188).
    В 2000-2003 годах большинство похищенных пропадали без вести, а тела части из них родные находили со следами пыток в могилах у мест, где стояли российские части (подробнее: «Убийство пленных и задержанных»)(Citation: 1188).
    С 2003 года силовики чаще передавали похищенных следователям по делам об участии в «незаконных вооружённых формированиях» (так Россия называла Вооружённые силы Ичкерии) (подробнее: «Фабрикация преступников»)(Citation: 1581).
    Силовики похищали чеченцев и на несколько дней, чтобы выбить сведения о бойцах и завербовать осведомителей.
    Таких временных исчезновений, по оценке «Мемориала», во много раз больше, чем бесследных(Citation: 1210)(Citation: 1188).

    2 декабря 1999 года российские солдаты на блокпосту у Ачхой-Мартана, села к юго-западу от Грозного, задержали имама Раджа Межидова с двумя учениками и через Моздок, город в подконтрольной России Северной Осетии, отправили в подвал школы в селе Гехи, где пленных держали милиционеры Гантамирова, который воевал вместе с российскими войсками(Citation: 1527). 10 декабря милиционеры Гантамирова расстреляли имама в лесу, а оба ученика пропали без вести(Citation: 1663).

    Командование оккупационными войсками объявило «гуманитарный коридор» на 13-14 января 2000 года для выхода мирных чеченцев из Шатойского района в горах на юге Ичкерии (подробнее: «Ложный коридор»)(Citation: 1210). 13 января российские военные на блокпосту «Юг» между Чири-Юртом и Дуба-Юртом, сёлами к югу от Грозного, задержали Виситу Арсанукаева, Сайд-Магомеда Дельмуханова, Хусейна Дидаева и Ваху Титаева, которые ехали в горы за своим имуществом.
    Через час полковник, в котором свидетели позже узнали командира 160-го танкового полка Буданова, увёз всех четверых.
    Рамзан Дидаев, сын Хусейна Дидаева, рассказал правозащитникам «Мемориала», что на вопрос, куда их увозят, полковник ответил: «Туда, откуда не возвращаются»(Citation: 1210). 17 января военные поста оставили у себя раненого Рамзана Базаева из Дуба-Юрта, пообещав оказать ему первую помощь, и расстреляли его (подробнее: «Убийство пленных и задержанных»)(Citation: 1581). 25 февраля чеченцы из Танги-Чу, села к юго-западу от Грозного, нашли у кладбища тела Виситы Арсанукаева, Хусейна Дидаева и Вахи Титаева со следами пыток, а Сайд-Магомеда Дельмуханова так и не нашли(Citation: 1210).

    С середины февраля 2000 года у поста стоял 276-й мотострелковый полк, которым командовал полковник Никитин(Citation: 1210). 18 февраля военные поста задержали Хаси Башаева, Хусейна Баснукаева и Руслана Кайхарова, которые везли раненых чеченок с детьми.
    Раненым военные сказали, что по приказу не пропускают мужчин от 15 до 60 лет.
    Все трое пропали без вести, а их машины позже нашли на месте поста раздавленными гусеницами и закопанными(Citation: 1581). 6 марта к посту пришли чеченцы, которые уходили из горного села Улус-Керт на юге Ичкерии, и старший офицер, назвавшийся «Сан Саныч», задержал 12 мужчин.
    Раиса Маликова и Марха Ясуева, которые шли с ними, рассказали правозащитникам «Мемориала», что «Сан Саныч» отвёз женщин к соседнему блокпосту и сказал им: «Ваши мужики нам не нужны, их сейчас отпустят после проверки документов».
    Все 12 мужчин пропали без вести(Citation: 1210)(Citation: 1581).
    С 13 января по 6 марта 2000 года военные поста задержали не меньше 20 чеченцев, четверых из них убили после пыток, а 16 пропали без вести(Citation: 1581).

    17 мая 2000 года около 20 российских военных на бронетранспортёрах увели из дома в Шали, городе к юго-востоку от Грозного, Руслана Алихаджиева, председателя парламента Ичкерии в 1997-1999 годах. 25 мая представитель Генштаба России Манилов назвал его среди задержанных, 21 сентября заместитель генерального прокурора Бирюков объявил его похищенным «неизвестными», а Европейский суд по правам человека (ЕСПЧ) в 2007 году признал Руслана Алихаджиева погибшим после задержания российскими военными(Citation: 1581)(Citation: 1438).

    2 января 2001 года сотрудники Октябрьского временного отдела милиции в Грозном похитили Зелимхана Мурдалова(Citation: 1581).
    Суд в Грозном осудил оперуполномоченного этого отдела Лапина за пытки и поддельные подписи в деле о наркотиках, а не за исчезновение Зелимхана Мурдалова (подробнее: «Безнаказанность исполнителей»)(Citation: 1497).

    24 февраля 2001 года в дачном посёлке «Здоровье» у Ханкалы нашли 51 тело, и родные опознали среди них чеченцев, пропавших без вести после задержания российскими войсками (подробнее: «Убийство пленных и задержанных»)(Citation: 813).

    С 21 мая по 11 июня 2002 года при облаве в Мескер-Юрте, селе к юго-востоку от Грозного, российские военные держали в фильтрационном лагере у села не меньше 17 чеченцев: Адама Темерсултанова убили, остальные 16 пропали без вести (подробнее: «Система фильтрационных лагерей»)(Citation: 1462).

    19 января 2004 года люди, которых в селе называют «русскими», ночью увели из дома в Катыр-Юрте, селе к юго-западу от Грозного, Милану Оздоеву, вдову защитника Ичкерии, и она пропала без вести.
    За месяц до этого Евсеев, назвавшийся сотрудником ФСБ, велел её матери следить за дочерью(Citation: 2058).
    В ночь на 27 марта 2004 года вооружённые люди на двух бронетранспортёрах и восьми машинах увезли из Дуба-Юрта, села к югу от Грозного, восьмерых чеченцев, а российский военный комендант Шалинского района записал в рапорте, что их задержали российские военные и отвезли в Ханкалу. 9 апреля тела всех восьмерых нашли со следами пыток у Сержень-Юрта, села к юго-востоку от Грозного(Citation: 286)(Citation: 1440).

    8 июня 2006 года Хамзат Тушаев из Дуба-Юрта пришёл по вызову в прокуратуру в правительственном комплексе в Грозном, прошёл охраняемый пропускной пункт и пропал без вести.
    ЕСПЧ в 2011 году признал, что его задержали представители государства, и счёл его погибшим(Citation: 286)(Citation: 1456).

    В середине сентября 2008 года силовики оккупационной администрации похитили чеченку Петимат в Центорое Ножай-Юртовского района, селе на юго-востоке Ичкерии, когда она шла искать сына.
    Силовики пытали Петимат током, а на 11-й день следователи российской милиции отпустили её (подробнее: «Пытки и истязания»)(Citation: 287).

    Правозащитники «Мемориала» пишут, что за войну пропали без вести от трёх до пяти тысяч чеченцев, которых похитили российские силовики(Citation: 1188).
    Комитет министров Совета Европы, который следит за исполнением решений ЕСПЧ, в 2021 году сообщил, что из примерно 650 пропавших без вести, по чьим делам ЕСПЧ осудил Россию, нашли только двоих(Citation: 1449).
    Human Rights Watch в 2005 году и «Мемориал» в 2012 году назвали эти исчезновения преступлениями против человечности, потому что российские силовики похищали чеченцев по всей республике и по заведённому порядку(Citation: 819)(Citation: 1210).
    Поимённые списки пропавших без вести составили «Мемориал» - 384 человека за октябрь 1999 - 2000 год - и Human Rights Watch - 113 человек за сентябрь 1999 - февраль 2001 года(Citation: 1210)(Citation: 1589).

    Российские суды вынесли по делам об исчезновениях считанные приговоры.
    С 2003 года руководство оккупационной администрации обещало создать комиссию по розыску похищенных, но так её и не создало(Citation: 1210).
    По докладу уполномоченного по правам человека оккупационной администрации Нухажиева от 16 апреля 2009 года, российская прокуратура республики с начала войны завела дела о похищении 2826 чеченцев(Citation: 1195)(Citation: 295).
