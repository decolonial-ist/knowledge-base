  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Руководители России, российские генералы и силовики всю войну называли армию Ичкерии «бандитами», её руководство - «террористами», а мирных чеченцев - «чурками» и «чеченскими тварями».

    23 сентября 1999 года президент России Ельцин секретным указом № 1255с поставил силовым ведомствам задачу - «уничтожение незаконных вооруженных формирований» (так Россия называла Вооружённые силы Ичкерии)(Citation: 672). 22 января 2001 года президент России Путин указом № 61 поручил силовикам пресекать на Северном Кавказе деятельность «террористических» организаций и групп(Citation: 790).

    24 сентября 1999 года председатель правительства России Путин сказал, что российские самолёты бьют в Ичкерии по базам «террористов» и Россия будет преследовать их везде: «в сортире их замочим» (убьём)(Citation: 772). 6 декабря 1999 года российские лётчики сбросили на Грозный листовки командования оккупационных войск во главе с Казанцевым, в которых оставшихся в городе объявили «террористами и бандитами» и пригрозили уничтожить артиллерией и авиацией (подробнее: «Отказ в пощаде»)(Citation: 1581)(Citation: 1529).

    11 декабря 1999 года командующий Западной группировкой российских войск генерал Шаманов грозил расстрелять на месте «чертовых чеченцев» из Алхан-Юрта, села к юго-западу от Грозного, где его солдаты убивали сельчан (подробнее: «Безнаказанность исполнителей»)(Citation: 1581)(Citation: 770).

    4 февраля 2000 года российские солдаты окружили Новые Алды, посёлок на южной окраине Грозного, и проверили у чеченцев паспорта(Citation: 764). 5 февраля бойцы милицейского спецназа из Санкт-Петербурга и солдаты 6-й роты 245-го полка российской армии ходили по дворам посёлка.
    Асет Чадаева, чеченка из Новых Алдов, рассказала правозащитникам «Мемориала», как солдаты первым делом крикнули на её улице: «Отмечай им, Серый, зеленкой лбы, чтобы стрелять удобнее было»(Citation: 817).
    Боец 6-й роты сказал российскому журналисту Олегу Блоцкому: «А чего их, чеченов, жалеть-то?
    Они же нас не жалеют!»(Citation: 1581).
    В этот день оккупанты убили в посёлке не меньше 46 мирных чеченцев (подробнее: «Массовые убийства гражданских»)(Citation: 951).
    Правозащитники «Мемориала» в докладе о Новых Алдах в июле 2000 года написали, что пропаганда российских чиновников и силовых ведомств против чеченцев стирала грань между бойцами и мирными людьми, «заранее оправдывала преступников»(Citation: 817).

    Российские чиновники, генералы, солдаты, от президента до рядового на обыске, называли президента Ичкерии Аслана Масхадова «международным террористом»(Citation: 797), армию Ичкерии - «бандитами»(Citation: 1540) и «бандформированиями»(Citation: 1603), а мирных чеченцев - «чечмеками», «чурками»(Citation: 1581) и «чеченскими тварями»(Citation: 1581).
    Командующий 58-й российской армией генерал Шаманов в июне 2000 года называл жену бойца Ичкерии «бандиткой», а о его ребёнке сказал, что тот «тоже» бандит(Citation: 1670).

    8 августа 2000 года, после взрыва в подземном переходе на Пушкинской площади в Москве, мэр города Лужков сказал: «На сто процентов это — Чечня»(Citation: 1104).
    После взрыва московские милиционеры в облаве задержали и избили чеченцев(Citation: 1450).

    В начале 2001 года отряд российских милиционеров из Ханты-Мансийского округа в Западной Сибири, в котором служил Лапин, пытал арестованных чеченцев во временном отделе милиции Октябрьского района Грозного (подробнее: «Пытки и истязания»).
    На стене там висел лозунг «Чем больше чеченцев мы уничтожим, тем лучше будем спать»(Citation: 1922). 28 марта 2001 года сотрудники управления по борьбе с организованной преступностью и спецназа милиции Московской области ворвались в общежитие чеченской театральной студии «Нахи» в Химках под Москвой и три часа держали на полу в белье студентов-чеченцев, называя их «грязными чичами», «обезьянами», «моджахедами, которых надо резать».
    К полудню милиционеры увезли юношей на допрос в управление, а вечером отпустили без обвинений(Citation: 1733).

    24 августа 2006 года российская газета «Известия» после драки чеченских беженцев в бельгийском городе Остенде назвала чеченцев «волками» и «хищниками»(Citation: 631). 2 сентября 2006 года толпа в Кондопоге, городе в Карелии, жгла и грабила магазины, палатки и машины чеченцев, а глава Карелии Катанандов назвал своей целью «выгнать отсюда» чеченскую молодёжь, которая, по его словам, «нас не уважает».
    Спецназ милиции из Петрозаводска вывез семьи чеченцев под охраной в безопасное место(Citation: 631).

    Правозащитники из Human Rights Watch писали в докладе за 2000 год, что московская милиция получила «карт-бланш» (полную свободу действий), чтобы терроризировать чеченцев: с осени 1999 года милиционеры увезли в отделения больше 20 тысяч чеченцев и не меньше 50 из них отдали под суд по подброшенным наркотикам и патронам(Citation: 1450).
    В марте 2003 года Комитет ООН по ликвидации расовой дискриминации выразил обеспокоенность сообщениями, что российские силовики избирательно преследуют чеченцев(Citation: 784).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что чеченцы стали «самой демонизированной в общественном сознании большинства россиян этнической группой», а слово «чеченец» превратилось в ругательство.
    По их словам, ненависть к чеченцам росла на фоне военной истерии, которую разжигали российские руководители.
    Правозащитники сочли, что слова и действия командующего Объединённой группировкой российских войск Казанцева, генерала Шаманова и полковника Хрулёва показывают намерение преследовать чеченцев как народ(Citation: 1581).

    16 апреля 2009 года Кадыров-младший, глава оккупационной администрации, объявил, что отменой режима «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии) руководство России подтвердило: «гнездо терроризма разгромлено»(Citation: 901).
