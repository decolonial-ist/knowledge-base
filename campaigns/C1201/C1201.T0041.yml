    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия держала в захваченной Ичкерии постоянные гарнизоны, ставила в районах военные комендатуры и присылала туда российских милиционеров и чиновников.

    15 октября 1999 года президент России Ельцин указом № 1380 назначил представителем правительства России в Чеченской Республике Кошмана, заместителя министра путей сообщения России (подробнее: «Марионеточное правительство»)(Citation: 768)(Citation: 687).
    Правозащитники Human Rights Watch пишут, что к марту 2000 года администрацию республики возглавлял человек из Москвы, а руководящие должности получали этнические русские(Citation: 287).

    Рядом с военными комендатурами, которые российские войска с декабря 1999 года ставили в захваченных районах и самых крупных сёлах (подробнее: «Установка новой системы управления»), МВД России создавало временные отделы внутренних дел вместо районной милиции, а в крупных сёлах - поселковые отделения.
    Там служили милиционеры, командированные из регионов России, пока в 2003 году МВД не расформировало временные отделы(Citation: 1210)(Citation: 286).

    В мае 2000 года Россия сформировала для постоянного размещения в республике 42-ю дивизию, около 15 тысяч военных(Citation: 1129).
    В сентябре руководство МВД России решило с 1 октября держать там постоянно 46-ю бригаду внутренних войск (предшественников современной Росгвардии) до 10 тысяч человек(Citation: 1503).

    В 2000 году военные строители Министерства обороны России по государственному заказу возводили постоянные городки для войск на базе в Ханкале, на восточной окраине Грозного, и казармы 42-й дивизии со штабом в станице Калиновской Наурского района на севере республики.
    Заместитель министра обороны России Косован курировал эти работы(Citation: 1746).

    В январе 2001 года президент России Путин поставил председателем оккупационного правительства Ильясова, бывшего главу правительства Ставропольского края на юге России (подробнее: «Марионеточное правительство»).
    Новый председатель оккупационного правительства позвал отвечать за силовые структуры полковника Эма, командовавшего полком в войне против Ичкерии, а вторым заместителем - Алексинцева, своего заместителя в Ставропольском крае(Citation: 1723).

    В конце 1999 года руководство нижегородской милиции отправляло своих сотрудников создавать районную милицию в захваченном Гудермесе, втором по величине городе Ичкерии, а тем, кто не хотел ехать, предлагало увольняться(Citation: 1489).
    В марте 2000 года временный отдел внутренних дел в Урус-Мартане, городе к юго-западу от Грозного, возглавил полковник МВД Шигаев из Пензенской области, а в отделе Старопромысловского района Грозного служили милиционеры из Свердловской области(Citation: 1448)(Citation: 1589)(Citation: 774). 12 мая 2000 года милиционеры из Ханты-Мансийского округа сменили состав временного отдела Октябрьского района Грозного, в подвалах которого потом пытали задержанных чеченцев (подробнее: «Пытки и истязания»)(Citation: 782)(Citation: 286).

    1 сентября 2000 года школьники Шатоя, районного центра в горах на юге Ичкерии, начали учебный год в шести палатках в парке, без света, полов и печей.
    Российские военные и милиционеры, командированные в Шатой, заняли трёхэтажную среднюю школу и школу-интернат.
    Там стояли военная комендатура района с временным отделом внутренних дел.
    Оккупанты отказались освободить и больницу, единственную на весь горный район, и врачи с больными работали в частном доме (подробнее: «Медицинская и гуманитарная блокада»)(Citation: 1503).

    2 сентября российские артиллеристы полчаса обстреливали Шаро-Аргун, горное село Шаройского района, и ранили шестерых чеченцев, из них двоих детей (подробнее: «Неизбирательные нападения»).
    В тот же день чеченцы из Шаро-Аргуна приехали в Шатой с жалобой к военному коменданту района.
    Очевидцы рассказали правозащитникам «Мемориала», что комендант сказал приехавшим: «Я за артиллерию не отвечаю.
    Вы что думаете, я здесь царь и Бог?»
    Встречу комендант закончил словами: «И что вы все ходите и жалуетесь, неужели за год не привыкли к обстрелам и бомбежкам?
    Пора бы уже привыкнуть»(Citation: 1503).

    С 2001 года военные строители Министерства обороны России возводили в Борзое, горном селе Шатойского района, военный городок для войск, которые оставались там постоянно.
    В городке разместились части ФСБ, МВД и военная прокуратура гарнизона(Citation: 1931). 4 июня 2001 года министр внутренних дел России Грызлов объявил, что МВД пришлёт в Ичкерию ещё от тысячи до полутора тысяч своих сотрудников к 6500 бойцам 46-й бригады, стоявшей в аэропорту «Северный» в Грозном(Citation: 1484).

    27 ноября 2005 года, в день «выборов» оккупационного парламента, из 1503 избирателей участка № 313 в Шатое 502 были российскими военными (подробнее: «Имитация народного волеизъявления»)(Citation: 941).
    МВД России ответило Европейскому комитету по предупреждению пыток, что все 35 сотрудников изолятора в здании оперативно-розыскного бюро № 2 МВД России в Грозном, где пытали задержанных чеченцев, командированы из МВД и управлений внутренних дел регионов России.
    Комитет опубликовал этот ответ 13 марта 2007 года (подробнее: «Пытки и истязания»)(Citation: 939).

    16 января 2002 года политический комитет Парламентской ассамблеи Совета Европы в докладе призвал Россию значительно сократить число войск в республике и держать их в казармах(Citation: 959). 2 апреля 2003 года ассамблея в резолюции 1323 рекомендовала, насколько позволит обстановка, держать российские войска в казармах или вывести их из Чеченской Республики совсем(Citation: 788).

    В начале августа 2006 года президент России Путин распорядился в 2007-2008 годах поэтапно вывести из республики части внутренних войск и армии, которые стояли там временно.
    Постоянно в Ичкерии остались 42-я дивизия, 46-я бригада внутренних войск, а в горных районах - пограничники ФСБ(Citation: 286).
