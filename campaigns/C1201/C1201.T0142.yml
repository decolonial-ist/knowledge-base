description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские чиновники и милиционеры выдворяли чеченцев, бежавших от войны, из регионов России, а в Ичкерии не пускали их домой в Грозный и не выпускали из сёл без паспортов.

    Осенью 1999 года глава Кабардино-Балкарии Коков запретил чеченцам въезд в эту подконтрольную России республику к западу от Ичкерии, а милиция перекрыла её границу.
    Калов, глава республиканского отделения Федеральной миграционной службы России, не регистрировал беженцев и письменных отказов не давал.
    Служба Калова выдворяла тех, кто пробирался в республику, в Назрань и Моздок, города в подконтрольных России Ингушетии и Северной Осетии.
    Москва не остановила руководство республики(Citation: 1634).

    Весной 2000 года МВД России письмом запретило оформлять новые документы чеченцам с регистрацией в Ичкерии, и без паспорта их не выпускали через блокпосты в Ингушетию и не пускали назад (подробнее: «Правовая сегрегация населения»)(Citation: 1661).

    14 февраля 2000 года представитель правительства России в Чеченской Республике Кошман предложил объявить Грозный закрытым городом, куда пускают только по разрешению(Citation: 2115).
    Россия закрыла Грозный до 1 мая 2000 года(Citation: 1446).

    С 29 ноября по 1 декабря 1999 года начальник 1-го отдела милиции Нальчика, столицы Кабардино-Балкарии, Отаров и начальник паспортной службы города Мамбетов устроили облавы на чеченских беженцев.
    Руководство республики во главе с Коковым велело почти 10 тысячам чеченских беженцев уехать до 1 января 2000 года.
    Беженка Тамара Чагаева рассказала журналистке «Новой газеты» Анне Политковской: «Теперь же городская милиция устраивает облавы с участием ОМОНа…
    Некоторых беженцев сразу же, на подготовленных автобусах, вывозят за пределы республики».
    Глава миграционной службы Калов объяснил журналистке: «Быть добрым к беженцам и таким образом провалить свою землю?
    Мы этого не допустим»(Citation: 1634).
    Руководство Кабардино-Балкарии отменило выселение, потому что в Грозном шли бои, и назначило беженцам новый срок - 1 апреля 2000 года(Citation: 1655).

    Суд в Нальчике решил выселить чеченцев, которые бежали от войны 1994-1996 годов и жили в пансионатах «Дружба» и «Октябрь».
    Утром 5 июля 2000 года нальчикский ОМОН окружил пансионаты и при судебных приставах выселил оттуда 416 семей.
    Милиционеры выбрасывали вещи беженцев из окон седьмого-восьмого этажей и ранили 16-летнюю девушку, которая пыталась им помешать.
    Нескольких человек после выселения увезли в больницу.
    Выселенные остались у костров вокруг пансионатов, входы в которые круглосуточно перекрыл ОМОН.
    Темура Хасанова из Грозного, чья семья из десяти человек жила в «Дружбе» с 1996 года, рассказала Анне Политковской: «…мы ждем одного — когда разрешат вернуться обратно.
    Нам идти некуда.
    Наш сосед Расул Гамаев в день выселения специально отправился в Грозный — узнать, можно ли все-таки вернуться домой.
    А ему федералы [российские военные] на постах сказали, что город опять на неопределенное время закрыт и есть приказ: никого не пускать»(Citation: 1673).

    К февралю 2001 года начальник паспортной службы Веденского района, офицер МВД, уже несколько месяцев не принимал документы на паспорта из Махкетов, села на юго-востоке Ичкерии.
    Без паспортов не могли выехать из села 250 чеченцев, в основном юноши 14-18 лет(Citation: 1724).

    В начале ноября 2002 года паспортный стол милиции в Подмосковье отказал в регистрации чеченке, которая жила там с детьми с 2000 года, и велел ей за десять дней вернуться в Ичкерию.
    Милиция оштрафовала хозяев её квартиры и велела выселить семью, а 20 января 2003 года паспортный стол снова отказал чеченке в регистрации (подробнее: «Правовая сегрегация населения»)(Citation: 283). 17 января 2003 года милиционеры отдела «Левобережный» в Москве задержали чеченца Рамзана Закаева, который бежал от войны с женой и детьми, и в тот же день судья Головинского суда Москвы Новикова постановила выдворить его из России за жизнь без регистрации.
    Московская милиция до 7 апреля 2003 года не выпускала его из-под стражи, а затем выдворила в Казахстан, гражданином которого он был, и жена с тремя детьми остались в Москве(Citation: 2074).
