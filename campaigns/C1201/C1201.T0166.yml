  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские военные, милиционеры и следователи, а затем силовики оккупационной администрации Кадырова подбрасывали чеченцам оружие и наркотики, выбивали признания, по которым сажали в тюрьмы, а руководителей Ичкерии объявляли преступниками.

    При обысках российские военные и милиционеры подбрасывали чеченцам оружие и взрывчатку, а «находки» снимали на видео(Citation: 952)(Citation: 1503).
    По подсчёту «Мемориала» и «Гражданского содействия», после сентября 1999 года московская милиция завела дела не меньше чем на 50 чеченцев, подбросив им наркотики и патроны, а суды признали большинство из них виновными(Citation: 1450).

    Российские следователи вели дела чеченцев по статьям Уголовного кодекса России об «участии в незаконном вооружённом формировании» (так Россия называла службу в Вооружённых силах Ичкерии), бандитизме, терроризме и хранении оружия(Citation: 286)(Citation: 1193).
    За первые пять месяцев 2000 года МВД России арестовало в Ичкерии больше 10 тысяч чеченцев, а бойцами Вооружённых сил Ичкерии и их пособниками назвало больше тысячи(Citation: 281).

    Сотрудники оперативно-розыскного бюро № 2 (ОРБ-2) МВД России в Грозном заучивали с задержанными чеченцами подробности признания, а нанятого родными адвоката пускали только после подписи показаний(Citation: 286).
    Сотрудники бюро заранее готовили признания в убийствах и взрывах с датами, местами и именами пострадавших или давали задержанному чеченцу самому выбрать статью.
    За отказ от показаний сотрудники снова везли задержанного чеченца в бюро (подробнее: «Пытки и истязания»)(Citation: 1554).

    Пресс-служба группировки российских войск и генералы показывали задержанных чеченцев по телевидению как «боевиков» и «полевых командиров» (так россияне называли бойцов Вооружённых сил Ичкерии)(Citation: 1503)(Citation: 1502).

    До 2005 года силовики после выбитых признаний обычно убивали задержанных чеченцев, а с 2005 года стали массово передавать их следователям и суду (подробнее: «Убийство пленных и задержанных»)(Citation: 1581).
    Отпуская чеченцев без доказательств вины, оккупанты выдавали им справки амнистированных участников «незаконных вооруженных формирований»(Citation: 281).

    В октябре 1999 года милиционеры в Москве подбросили пистолет Майрбеку Вачагаеву, представителю президента Ичкерии(Citation: 694)(Citation: 1485).
    В январе 2000 года в Старых Атагах, селе к югу от Грозного, оккупанты задержали около 60 чеченцев, и милиционеры пытками заставляли их подписывать, что они бойцы Вооружённых сил Ичкерии(Citation: 1512).
    В феврале российские следователи завели дело о «вооружённом мятеже», а в марте заочно обвинили по нему Аслана Масхадова, избранного президента Ичкерии(Citation: 791).
    В марте милиционеры в Грозном «нашли» взрывчатку у Алаудина Садыкова(Citation: 782), в апреле в Ачхой-Мартане, селе к юго-западу от Грозного, при обыске в доме двух братьев объявили уликами военные шинели и кассеты с интервью Шамиля Басаева(Citation: 776).

    В сентябре 2000 года российские военные пытали Хамида Беклаева в полку у Танги-Чу, села к юго-западу от Грозного, а телеканал НТВ показал его как «известного полевого командира»(Citation: 1503).
    В январе 2001 года милиционеры в Грозном завели дело о наркотиках на Зелимхана Мурдалова и подделали его подписи(Citation: 1457)(Citation: 1805).
    В апреле 2002 года сотрудники ФСБ пытками заставили Ислама Хасуханова, начальника военной инспекции при правительстве Ичкерии, подписать чистые бланки «приказов и боевых распоряжений Масхадова»(Citation: 1898)(Citation: 1871).

    В конце октября 2002 года датская полиция по запросу России арестовала в Копенгагене Ахмеда Закаева, представителя президента Ичкерии.
    В запросе Генеральная прокуратура России обвиняла его в захвате заложников в театре на Дубровке в Москве и в убийстве священника Сергея Жигулина, хотя священник был жив(Citation: 1925).
    В ноябре 2002 года вооружённые люди в масках увезли Дук-Ваху Душуева с блокпоста, около шести дней держали в яме с водой и пытали током.
    По его словам, это были сотрудники ФСБ. 2 декабря 2002 года в управлении ФСБ в Грозном Дук-Ваха Душуев подписал у следователя прокуратуры Криворотова готовые показания, будто Ахмед Закаев приказал похитить священников.
    Эти показания Дук-Ваха Душуев повторил на камеру российского телеканала НТВ(Citation: 1895). 8 декабря заместитель генерального прокурора России Фридинский попросил Великобританию выдать Ахмеда Закаева по обвинениям в бандитизме, терроризме, убийствах и захвате заложников (подробнее: «Преследование за рубежом»)(Citation: 1849).

    До суда в Лондоне российская прокуратура сняла обвинения в захвате театра и убийстве священника(Citation: 1925). 24 июля 2003 года Дук-Ваха Душуев рассказал суду на Боу-стрит о допросах: «„Вы резали головы российским солдатам!“ Когда я говорил, что этого не было, они говорили: „А какая разница?“»(Citation: 1895). 13 ноября 2003 года судья Тимоти Вокмэн отказал России в выдаче, признал всех свидетелей обвинения солгавшими и заключил, что Россия преследует Ахмеда Закаева за национальность и политические взгляды(Citation: 1925). 29 ноября 2003 года Великобритания дала ему убежище(Citation: 1501).

    В сентябре 2005 года силовики Кадырова-младшего похитили шестерых чеченцев из Новых Атагов, села к югу от Грозного, и пытками выбивали у четверых признание в убийстве милиционера(Citation: 286).
    В том же месяце в Самашках, селе на западе Ичкерии, милиционеры «нашли» свёрток на чердаке Эдильбека Накраева, дождавшись ухода понятых(Citation: 286).
    В декабре 2005 года российские силовики пытками в Ханкале, у восточной окраины Грозного, заставили чеченца оговорить себя и ещё одного чеченца из Зумсоя, горного села на юге Ичкерии(Citation: 286).
    В 2006 году сотрудники ОРБ-2 пытали током Ризвана Эльбиева, требуя оговорить Ахмеда Закаева(Citation: 286)(Citation: 27).

    Российские суды дали по таким делам Исламу Хасуханову 12 (подробнее: «Фиктивные суды»)(Citation: 1898)(Citation: 1871), Эдильбеку Накраеву 6(Citation: 286), Майрбеку Вачагаеву три года с освобождением по амнистии(Citation: 1485), а четверым чеченцам из Новых Атагов - по году(Citation: 286).

    Весной 2000 года «Мемориал» писал, что оккупанты задерживают случайных чеченцев, а единственным доказательством против них становится признание, которое можно получить «лишь путем запугивания, избиений и пыток»(Citation: 1568).
    В 2007 году «Мемориал» и Международная федерация прав человека (FIDH) назвали ОРБ-2 структурой, «использующей пытки с целью выбивания ложных признаний и фабрикации уголовных дел»(Citation: 286).
    В 2009 году авторы доклада «Международный трибунал для Чечни» писали, что тысячи бывших бойцов Вооружённых сил Ичкерии осуждены на долгие сроки только за участие в боях(Citation: 1581).

    Через девять лет после вторжения, в середине сентября 2008 года, силовики оккупационной администрации Кадырова-младшего похитили в Центорое, селе на юго-востоке Ичкерии, Петимат, которая шла искать сына (подробнее: «Пытки и истязания»).
    Отпуская её на 11-й день, следователь милиции Ножай-Юртовского района дал ей подписать протокол, будто мёд, масло, чай и мужскую одежду она несла сыну и его отряду. 3 декабря 2008 года районный суд приговорил её к году условно за «пособничество»(Citation: 287).
