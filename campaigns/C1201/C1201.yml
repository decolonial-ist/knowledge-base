  ru: Вторая Русско-Чеченская война (1999–2009)
description:
  en: ''
  uk: ''
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Почти десять лет оккупанты бомбили города и сёла Ичкерии, убивали и похищали мирных чеченцев, держали их в фильтрационных лагерях, а с 2003 года их похищали и пытали ещё и силовики оккупационной администрации Кадырова.

    23 сентября 1999 года президент России Ельцин секретным указом № 1255с создал Объединённую группировку войск из частей всех силовых ведомств (подробнее: «Военная интервенция»)(Citation: 672).
    К концу сентября Россия собрала у границы Ичкерии до 90 тысяч солдат против 15-20 тысяч бойцов Вооружённых сил Ичкерии(Citation: 2380). 24 сентября председатель правительства России Путин на пресс-конференции в Астане сказал, что российские самолёты бьют в Ичкерии по базам «террористов» и Россия будет преследовать их везде: «в сортире их замочим» (убьём)(Citation: 772). 29 сентября Путин объявил, что границы с Ичкерией у России нет, и отказался обсуждать её статус. 7 октября председатель правительства объявил, что война пойдёт до победы, и отказался от переговоров (подробнее: «Лишение субъектности»)(Citation: 27). 15 октября 1999 года Ельцин указом № 1380 назначил представителем правительства России в Ичкерии Кошмана, который создавал в захваченных районах оккупационные органы управления и милицию (подробнее: «Установка новой системы управления»)(Citation: 768)(Citation: 687)(Citation: 814).

    21 октября 1999 года оккупанты ударили ракетами «земля - земля» по Центральному рынку, роддому, главной почте и мечети в Грозном, убив около 140 горожан (подробнее: «Неизбирательные нападения»)(Citation: 1581).
    На следующий день Путин на пресс-конференции в Хельсинки сказал о рынке: «Это база оружия, склад оружия» (подробнее: «Ложь о собственных действиях»)(Citation: 923).
    В октябре российские войска окружили Гудермес, второй по величине город Ичкерии.
    Командующий восточной группировкой оккупантов Трошев вёл переговоры с братьями Ямадаевыми, командирами отрядов в городе, и с бывшим муфтием Ичкерии Кадыровым.
    Двое из братьев перешли на сторону оккупантов, и 12 ноября российские войска захватили Гудермес без боя (подробнее: «Выращивание коллаборационистской элиты»)(Citation: 1129)(Citation: 1442).

    1 декабря 1999 года российские войска захватили Алхан-Юрт, село к юго-западу от Грозного, и до 17 декабря убили там не меньше 18 мирных чеченцев(Citation: 770). 6 декабря российские лётчики сбросили на Грозный листовки, в которых командование оккупационными войсками предупредило: «Лица, оставшиеся в городе, будут считаться террористами и бандитами [так россияне называли бойцов Вооружённых сил Ичкерии].
    Их будут уничтожать артиллерия и авиация» (подробнее: «Отказ в пощаде»)(Citation: 1529). 26 декабря российские войска начали штурм окружённого Грозного.
    Защитники отбили первые атаки, и командование Объединённой группировки во главе с Казанцевым решило бить по городу авиацией и артиллерией. 11 января 2000 года Казанцев приказал не пропускать через границу Ичкерии мужчин и мальчиков от 10 до 60 лет (подробнее: «Транспортная блокада»)(Citation: 1476).

    5 февраля 2000 года омоновцы, бойцы милицейского спецназа из Санкт-Петербурга, и солдаты 6-й роты 245-го полка российской армии ходили по дворам Новых Алдов, посёлка на южной окраине Грозного, и расстреливали чеченцев(Citation: 1581)(Citation: 280).
    Малика Лабазанова, чеченка из Новых Алдов, рассказала правозащитникам «Мемориала» о солдате, который забрал у неё серьги: «…он кричит, что убивать приказано всех»(Citation: 817).
    «Мемориал» поимённо назвал 46 чеченцев, которых оккупанты убили в посёлке (подробнее: «Массовые убийства гражданских»)(Citation: 951). 6 февраля российские войска захватили развалины Грозного(Citation: 1129).
    С 7 по 20 марта оккупанты штурмовали и почти полностью разрушили Гой-Чу, село к юго-западу от Грозного, куда прорвались защитники. 20 марта российские военные отвели в овраг 25 защитников, сдавшихся под гарантию безопасности, убили на месте 12 или 13 из них, а большинство остальных ранили (подробнее: «Убийство сдающихся»)(Citation: 1581).
    К концу марта 2000 года российские войска захватили города и сёла Ичкерии, и Вооружённые силы Ичкерии были вынуждены отступить.
    К лету защитники оправились от тяжёлых потерь и при поддержке мирных чеченцев начали партизанскую войну(Citation: 1581).

    8 июня 2000 года президент России Путин указом № 1071 создал оккупационную администрацию Чеченской Республики, главу которой назначал и снимал только президент России(Citation: 840). 12 июня Путин указом № 1100 назначил главой оккупационной администрации Кадырова (подробнее: «Марионеточное правительство»)(Citation: 841). 22 января 2001 года Путин указом № 61 передал руководство войной директору ФСБ Патрушеву(Citation: 790)(Citation: 1549).

    Оккупанты отвечали на нападения защитников облавами на сёла (подробнее: «Карательные экспедиции»)(Citation: 1581).
    При «зачистках» (так россияне называли обыски домов и задержания чеченцев) российские части блокировали село и свозили мужчин в фильтрационный лагерь(Citation: 1581). 27 марта 2002 года командующий оккупационными войсками Молтенской приказом № 80 велел устраивать облавы только с его личного разрешения(Citation: 946). 21 мая 2002 года войска генерала Броницкого блокировали Мескер-Юрт, село к юго-востоку от Грозного.
    Сельчане рассказали правозащитникам «Мемориала», что на требование исполнять приказ № 80 военные ответили представителям сельской администрации: «Молтенской нам не указ, мы действуем по приказу Путина»(Citation: 1473).
    В ночь на 30 ноября 2002 года, по данным правозащитников, российские военные убили Малику Умажеву, главу администрации Алхан-Калы, села к западу от Грозного, в отместку за слова о преступлениях оккупантов (подробнее: «Нейтрализация оппозиции»)(Citation: 953)(Citation: 778)(Citation: 285).
    По подсчёту правозащитников Станислава Дмитриевского, Богдана Гварели и Оксаны Челышевой, в 136 самых жестоких облавах и расправах 1999-2005 годов оккупанты незаконно задерживали сельчан и горожан не меньше 16 245 раз, пытали или жестоко избивали не меньше 8919 задержанных, убили не меньше 328, а не меньше 254 пропали без вести(Citation: 1581).
    С конца 2002 года облав стало меньше.
    Правозащитники предполагают: командование оккупационных войск поняло, что облавы пополняют Вооружённые силы Ичкерии всё новыми мстителями(Citation: 1581).
    В ноябре 2002 года президент России Путин велел заменить облавы в сёлах задержаниями в отдельных домах («адресными операциями»)(Citation: 1581).

    23 марта 2003 года Россия провела под оккупацией голосование по конституции, написанной для республики в Москве.
    Центральная избирательная комиссия России объявила, что проголосовали 89% избирателей, а 95,37% из них - «за» (подробнее: «Имитация народного волеизъявления»)(Citation: 1328).
    В первой статье конституции сказано: «Чеченская Республика (Нохчийн Республика) есть демократическое правовое государство в составе Российской Федерации» (подробнее: «Аннексия территорий»)(Citation: 794). 5 октября 2003 года Россия объявила главу оккупационной администрации Кадырова «избранным» «президентом»(Citation: 941).
    Заместитель председателя участковой комиссии в Грозном рассказал Анне Политковской в интервью «Новой газете» 4 декабря 2003 года, что на участок пришли 80 человек, а в протокол записали 780 голосов за Кадырова.
    На вопрос, почему никто в комиссии не возражал, заместитель председателя ответил: «Кадыров был заказан, и каждый знал, что лично от него ничего не зависит»(Citation: 1929).

    С 2003 года, кроме российских военных, чеченцев похищали и пытали силовики оккупационной администрации Кадырова(Citation: 286).
    Эти силовики держали похищенных чеченцев в тайных тюрьмах на своих базах в Центорое, селе к юго-востоку от Грозного, и в Гудермесе (подробнее: «Система фильтрационных лагерей»)(Citation: 1554). 9 мая 2004 года глава оккупационной администрации Кадыров погиб от взрыва на стадионе в Грозном, и первым заместителем председателя оккупационного правительства стал его сын Кадыров-младший, начальник службы безопасности(Citation: 1956). 29 августа 2004 года Россия объявила «избранным» «президентом» министра внутренних дел оккупационной администрации Алханова, а контроль над вооружёнными людьми остался у Кадырова-младшего (подробнее: «Выращивание коллаборационистской элиты»)(Citation: 941)(Citation: 1962).
    Правозащитники «Мемориала» и других организаций в докладе 2005 года пишут, что «политический процесс» в республике прикрывал политику «чеченизации», то есть попытку «столкнуть в смертельной схватке местных жителей»(Citation: 941). 15 февраля 2007 года Путин указом № 172 принял «отставку… по собственному желанию» Алханова и назначил Кадырова-младшего, к тому времени председателя оккупационного правительства, временно исполнять обязанности главы оккупационной администрации(Citation: 895). 2 марта оккупационный парламент утвердил Кадырова-младшего главой оккупационной администрации (подробнее: «Марионеточное правительство»)(Citation: 286).

    13 февраля 2004 года в Дохе, столице Катара, российские спецслужбы убили Зелимхана Яндарбиева, который в 1996-1997 годах исполнял обязанности президента Ичкерии. 30 июня суд Катара приговорил к пожизненному заключению офицеров российской военной разведки Белашкова и Богачёва, а в декабре Катар отправил их в Москву, где их встретили как героев и выпустили на свободу (подробнее: «Преследование за рубежом»)(Citation: 1101)(Citation: 3121)(Citation: 1100).
    Анна Политковская писала, что с ноября 2004 года сотрудники администрации Путина через депутата Совета Европы Андреаса Гросса обещали Ичкерии мир. 14 января 2005 года президент Ичкерии Аслан Масхадов приказал Вооружённым силам Ичкерии прекратить нападения на оккупантов(Citation: 2017). 8 марта 2005 года спецназ ФСБ России убил Аслана Масхадова в Толстой-Юрте, селе к северу от Грозного (подробнее: «Переговоры как прикрытие нападения»)(Citation: 2017)(Citation: 791).
    Вечером того же дня директор ФСБ Патрушев на рабочей встрече доложил Путину об убийстве, и Путин велел ему: «В случае подтверждения этих данных всех участников мероприятия [убийства] представьте к государственной награде»(Citation: 797). 17 июня 2006 года сотрудники ФСБ и МВД России убили в Аргуне, городе к востоку от Грозного, президента Ичкерии Абдул-Халима Садулаева(Citation: 27).

    4 октября 1999 года министр внутренних дел России Рушайло после совещания у председателя правительства Путина объявил, что Россия устраивает фильтрационные лагеря на всех пропускных пунктах у границы Ичкерии (подробнее: «Система фильтрационных лагерей»)(Citation: 1581).
    По данным МВД России, с января по конец мая 2000 года российские силовики арестовали больше 10 тысяч чеченцев, а бойцами Вооружённых сил Ичкерии и их помощниками министерство назвало чуть больше тысячи(Citation: 281).
    В лагерях российские охранники и следователи избивали задержанных чеченцев, пытали током, добиваясь признаний (подробнее: «Пытки и истязания»)(Citation: 1581). 24 февраля 2001 года в дачном посёлке «Здоровье» у Ханкалы, главной базы оккупационных войск на восточной окраине Грозного, нашли тела 51 человека, среди них не меньше 16 чеченцев, пропавших без вести после задержания оккупантами (подробнее: «Убийство пленных и задержанных»)(Citation: 813).
    Правозащитники «Мемориала» пишут, что за вторую войну пропали без вести от трёх до пяти тысяч чеченцев, которых похитили российские силовики (подробнее: «Похищение людей»)(Citation: 1188).

    Российские чиновники и генералы называли президента Ичкерии Аслана Масхадова «международным террористом»(Citation: 797), армию Ичкерии - «бандитами»(Citation: 1540), «бандформированиями»(Citation: 1603), а мирных чеченцев - «чурками» и «чеченскими тварями» (подробнее: «Дегуманизация»)(Citation: 1581).

    Правозащитники «Мемориала» пишут, что Россия не вела счёт убитым мирным чеченцам.
    В 2004 году правозащитники оценили число убитых за вторую войну от 10 до 20 тысяч, а вместе с пропавшими без вести после задержания - от 15 до 24 тысяч(Citation: 1328).
    Источники расходятся: президент Ичкерии Аслан Масхадов, по данным Радио Свобода в декабре 2004 года, говорил о 250 тысячах мирных чеченцев, которых российские войска убили за обе войны(Citation: 2377).
    В августе 2005 года Джабраилов, глава оккупационного парламента, назвал 150-160 тысяч погибших за обе войны(Citation: 2114), а Кадыров-младший, к тому времени глава оккупационной администрации, в интервью «Российской газете» 7 апреля 2009 года сказал, не уточнив, за какие годы: «мы потеряли 300 000 человек»(Citation: 2378).
    Станислав Дмитриевский и соавторы по документам насчитали 2335 мирных чеченцев, которых российские силовики убили с 1999 по 2005 год, из них 1386 - бомбёжками и обстрелами.
    Авторы назвали убийства мирных чеченцев российскими войсками преступлениями против человечности (подробнее: «Массовые убийства гражданских»)(Citation: 1581). 27 января 2000 года Парламентская ассамблея Совета Европы осудила «неизбирательное и несоразмерное применение силы» российскими войсками(Citation: 284).
    Human Rights Watch в 2005 году и «Мемориал» в 2012 году назвали исчезновения чеченцев преступлениями против человечности, потому что российские силовики похищали чеченцев по всей республике и по заведённому порядку(Citation: 819)(Citation: 1210).

    Депутаты в Москве постановлениями от 13 декабря 1999 года № 4784-II ГД, от 6 июня 2003 года № 4125-III ГД и от 22 сентября 2006 года № 3498-4 ГД объявили амнистии российским военным и милиционерам за преступления в Ичкерии.
    Под амнистии попадали пытки и превышение полномочий (подробнее: «Безнаказанность исполнителей»)(Citation: 1210)(Citation: 1562)(Citation: 795)(Citation: 796). 28 декабря 1999 года президент России Ельцин дал генералу Шаманову, чьи войска убивали в Алхан-Юрте, звание Героя России(Citation: 770).
    Путин, уже исполнявший обязанности президента, 15 января 2000 года сказал в интервью телеканалу ОРТ: «Генералов там не за что наказывать – они награждены»(Citation: 1581). 29 декабря 2004 года Путин дал звание Героя России первому заместителю председателя оккупационного правительства Кадырову-младшему, чьи силовики похищали и пытали чеченцев.
    Human Rights Watch писала, что так Россия одобрила методы Кадырова-младшего(Citation: 819)(Citation: 1581). 16 апреля 2009 года уполномоченный по правам человека оккупационной администрации Нухажиев сообщил, что российская прокуратура республики завела 2027 дел о похищении 2826 чеченцев и приостановила 1873 из них «за неустановлением лиц, причастных к похищению людей»(Citation: 1195)(Citation: 295).

    16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
