  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты разрушали сооружения водопровода и обстреливали чеченцев у последних источников воды.

    По данным газеты «Коммерсантъ» от 2 октября 1999 года, Генеральный штаб российской армии рассчитывал разрушить в Ичкерии плотины и другие сооружения, без которых люди не могут жить (подробнее: «Тотальное уничтожение инфраструктуры»)(Citation: 1570).
    Российские лётчики попали бомбами в Старосунженский водозабор, откуда в Грозный шла вода(Citation: 1666).

    Лётчики, артиллеристы и танкисты оккупационных войск били по колодцам, родникам, водохранилищам и по чеченцам, которые шли к ним за водой (подробнее: «Неизбирательные нападения»)(Citation: 928).
    В конце октября 1999 года сотрудники британской организации The HALO Trust, которая убирает мины, сообщили Amnesty International, что вся Ичкерия осталась без воды(Citation: 695).

    С начала ноября 1999 года в Грозном не работал водопровод, и чеченцы ходили за водой под бомбами и обстрелами в Черноречье, район на юге города, за четыре километра. 22 ноября в Катаяме, посёлке на северо-западе Грозного, экипаж российского танка обстрелял 20-летнего Руслана Картоева, когда он вёз воду на тачке, и ранил его осколком в правую ногу.
    В начале декабря 1999 года Руслан Картоев рассказал Human Rights Watch в подконтрольной России Ингушетии: «Они нас видели: мы были не в военной форме, везли воду на тачках».
    Он рассказал и о колодцах в соседнем посёлке Соляная Балка, по которым стреляли российские военные: «Они знают, что люди ходят туда за водой, поэтому и стреляли»(Citation: 928).

    29 ноября 1999 года российские лётчики сбросили две бомбы на Грозненское водохранилище в Черноречье, последнее место в городе, где ещё набирали воду.
    Ночью 30 ноября Магомет Усманов из Черноречья с семьёй ушёл от обстрелов пешком через лес в Гойты, село к югу от Грозного, а в начале декабря 1999 года рассказал Human Rights Watch: «Теперь люди боятся ходить за водой: приходится переходить дорогу и идти по открытому месту»(Citation: 928).

    В декабре 1999 года и январе 2000 года в Новых Алдах, посёлке на южной окраине Грозного, не работал водопровод, и чеченцы ходили за водой под обстрелом к роднику у дамбы водохранилища в Черноречье.
    В эти месяцы российский лётчик сбросил у дамбы бомбу на машину с 18-летним парнем и пустил ракету в мужчину с двумя детьми семи и десяти лет, убив всех четверых чеченцев(Citation: 817).

    В апреле 2000 года горожане в Грозном возили воду издалека, из тех мест, где она ещё была, а под городом, в селе Лермонтова, больше 60 сельчан заболели брюшным тифом из-за заражённого источника(Citation: 1381).
    В сентябре 2000 года водопровод Грозного всё ещё не работал, и чеченцы пили воду без очистки(Citation: 1236).

    23 мая 2001 года делегация Старых Атагов, села к югу от Грозного, рассказала представителю президента России Казанцеву, что российские военные захватили здание, откуда в село качали воду, и разрушили оборудование, поэтому чеченцы пили воду из оросительных канав (подробнее: «Лишение электричества и отопления»)(Citation: 1512).

    Российские войска бомбили и обстреливали водопровод и чеченцев у воды, пока захватывали Ичкерию, до конца марта 2000 года (подробнее: «Неизбирательные нападения»)(Citation: 1581).
    Международный комитет Красного Креста восстановил в Грозном станцию водопровода № 1 и с 1 декабря 2000 года раздавал горожанам очищенную воду из двух баков(Citation: 3124).
    В июле 2002 года этой воды хватало примерно на 37 тысяч человек(Citation: 3123).
