description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты посылали чеченцев под огонь выносить тела убитых российских военных, чтобы не рисковать своими солдатами.

    Зимой 1999-2000 года оккупационные войска штурмовали Грозный.
    Российские солдаты и омоновцы, бойцы милицейского спецназа, приходили в подвалы, где прятались чеченцы.
    Под угрозой оружия военные забирали оттуда в основном мужчин и стариков, чтобы послать вместо себя выносить тела убитых сослуживцев из-под огня снайперов(Citation: 279).

    С 27 декабря 1999 года по 10 января 2000 года оккупанты шесть раз приходили за людьми в бомбоубежище, где прятались 40-45 человек, на улице Пугачёва в Старопромысловском районе на северо-западе Грозного(Citation: 279)(Citation: 1581).
    Источники расходятся в дате первого прихода: одни пишут о 27 декабря, другие - о 28-29 декабря. 27 декабря военные заставили мужчин из бомбоубежища собрать тела шести российских солдат, убитых в подбитом бронетранспортёре(Citation: 279). 1 января 2000 года омоновцы, которые стояли в бывшем общежитии рядом с бомбоубежищем, увели оттуда мужчин младше 50 лет, среди них Ису Гайтиева, чтобы те собирали тела(Citation: 1581).
    Солдаты сказали родным, что никого не забирали(Citation: 279).
    Позже мужчин нашли расстрелянными на улице Пугачёва у дома № 144 (подробнее: «Убийство пленных и задержанных»)(Citation: 1581). 7 января военные увели четверых стариков и пожилую женщину выносить из детского сада тела пятерых российских солдат.
    Через три с лишним часа все пятеро вернулись и рассказали, что по ним несколько раз стреляли снайперы(Citation: 279).

    В докладе Human Rights Watch февраля 2000 года по рассказу Фатимы Тангиевой, которая пряталась в этом бомбоубежище с сестрой Зайнап Тангиевой, сказано: «В одном из случаев омоновцы дали обитателям подвала пять минут на решение, кто пойдет за убитыми, угрожая забросать людей гранатами в случае отказа»(Citation: 279).
    Авторы доклада пишут: «Представляется, что солдаты использовали мирных жителей, заставляя их подбирать тела убитых товарищей, чтобы самим избежать риска попасть под постоянный огонь … снайперов или подорваться на ловушке у трупа»(Citation: 279).
    Вечером 10 января солдаты снова пришли за людьми и хотели забрать 74-летнего Исмаила Гадаборшева, дядю Зайнап Тангиевой, но сочли его слишком старым.
    Чтобы его не забрали в следующий приход, Исмаил Гадаборшев ушёл ночевать к её родителям, в дом на улице Державина(Citation: 279).
    В ту ночь российские военные убили там его, родителей Зайнап Тангиевой и их соседку, а дом подожгли (подробнее: «Массовые убийства гражданских»)(Citation: 1581).

    Human Rights Watch в докладе февраля 2000 года потребовала от правительства России запретить войскам заставлять мирных чеченцев собирать тела убитых солдат, потому что это подвергает людей опасности(Citation: 279).
