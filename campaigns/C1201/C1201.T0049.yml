description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупационная администрация Кадырова пытками, захватом родных или обещанием амнистии загоняла в свои силовые подразделения пленных и сдавшихся бойцов Вооружённых сил Ичкерии, посылала их против бывших товарищей, а позже забирала туда подростков.

    По амнистии, которую депутаты в Москве объявили 6 июня 2003 года постановлением № 4125-III ГД, эта администрация прощала только тех, кто шёл служить в её силовые подразделения, а остальным грозила тюрьмой (подробнее: «Ложные гарантии безопасности»)(Citation: 795)(Citation: 1905)(Citation: 286).
    Когда срок амнистии кончился, Кадыров-младший, начальник службы безопасности оккупационной администрации, стал сам объявлять амнистированными тех, кто сдал оружие и присягнул служить ему.
    Присягнувших оказалось намного больше, чем тех, кого простили по амнистии депутатов, а у тех, кто не присягнул, не осталось возможности жить в республике открыто(Citation: 286).

    Силовики службы безопасности пытали пленных, раненых и сдавшихся бойцов Вооружённых сил Ичкерии и угрожали расправиться с их семьями, заставляя вступать в службу.
    С 2004 года служба безопасности брала в заложники родственников бойцов, чтобы те сдались (подробнее: «Захват заложников»).
    Сдавшимся снова предлагали служить у Кадырова-младшего.
    Тех, кто отказывался, силовики похищали и убивали без суда(Citation: 286).

    Согласившимся давали оружие и записывали их бойцами стрелковых рот при российских военных комендатурах(Citation: 1905).
    Перешедших силовики брали на облавы, чтобы пролитая кровь отрезала им путь назад, а потом посылали в родное село или район, где они воевали, выслеживать и убивать бывших товарищей(Citation: 286).

    Силовиков было больше, чем по бумагам: летом 2003 года в охране главы оккупационной администрации Кадырова официально числился 61 человек, вместе с приданными ротами - 1200, а сами они называли себя войском в три, а то и в пять тысяч человек, набранным в основном из сдавшихся(Citation: 1905).
    Весной 2006 года Россия сделала из этих подразделений батальоны «Север» и «Юг» внутренних войск МВД России (предшественники современной Росгвардии) (подробнее: «Выращивание коллаборационистской элиты»).
    Бывшие бойцы Ичкерии, которых силой или шантажом перевели к Кадырову-младшему, стали российскими солдатами(Citation: 286).

    Умар Исраилов из Мескер-Юрта, села к юго-востоку от Грозного, с 2001 года воевал в Вооружённых силах Ичкерии.
    В апреле 2003 года силовики по приказу Кадырова-младшего, начальника службы безопасности оккупационной администрации, захватили Умара Исраилова и три месяца тайно держали в Центорое, родном селе Кадырова-младшего, где стояла база службы.
    Силовики допрашивали и пытали Умара Исраилова, часто при своём начальнике (подробнее: «Пытки и истязания»).
    Потом Кадыров-младший предложил ему служить у себя, и Умар Исраилов согласился, чтобы избежать худших пыток(Citation: 940).
    В докладе «Мемориала» и других правозащитных организаций 2005 года его история рассказана под изменённым именем Хамзат: «Впоследствии [в апреле 2004 года] Хамзат был назначен командиром подразделения СБ [службы безопасности] в своем родном селе для выявления своих бывших товарищей»(Citation: 941).
    Летом 2004 года Умар Исраилов тайно уехал с женой за границу под чужим именем(Citation: 940).
    После его бегства силовики Кадырова-младшего больше десяти месяцев держали в заложниках его отца Шарпуди Исраилова, чтобы заставить сына вернуться, и отпустили 4 октября 2005 года (подробнее: «Захват заложников»). 13 января 2009 года в Вене Умара Исраилова застрелили люди, которые хотели выдать его оккупационной администрации.
    Её к тому времени возглавлял Кадыров-младший (подробнее: «Преследование за рубежом»)(Citation: 945).

    С 20 января 2005 года силовики Кадырова-младшего, первого заместителя председателя оккупационного правительства, стояли в Ведено, селе на юго-востоке Ичкерии, и насильно забирали в свой отряд подростков, а родителям объясняли, что так дети не уйдут к защитникам Ичкерии(Citation: 2003).

    Правозащитники Human Rights Watch в 2006 году писали, что силовики оккупационной администрации задерживали бывших и действующих бойцов Вооружённых сил Ичкерии и вместо суда «с помощью пыток и угроз внесудебной казни вынуждали вступать в ряды „кадыровцев“»(Citation: 1554).
    Международная федерация за права человека и «Мемориал» в 2007 году писали, что у каждого, кто воевал против России, оставалось три пути: «либо идти в ряды кадыровских формирований и получать относительную гарантию безопасности, либо уходить в горы или подполье, либо просто ожидать, когда „неизвестные вооруженные люди“ увезут их в неизвестном направлении»(Citation: 286).
    Авторы доклада Международного трибунала для Чечни в 2009 году писали, что амнистии с 2003 года не возвращали бойцов Вооружённых сил Ичкерии к мирной жизни, а заставляли их воевать дальше, теперь против своих, а отказавшихся преследовали вплоть до похищения и убийства(Citation: 1581).

    Сдавшиеся по амнистии, которую депутаты в Москве объявили 22 сентября 2006 года постановлением № 3498-4 ГД, снова пополняли подразделения Кадырова-младшего, председателя оккупационного правительства (подробнее: «Ложные гарантии безопасности»)(Citation: 796)(Citation: 286).
