description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты, а позже силовики оккупационной администрации устраивали облавы на чеченские сёла и города, грозили расправой сёлам и семьям, а убитых ими чеченцев выставляли напоказ, чтобы запугать остальных.

    Командиры оккупационных войск грозили сёлам обстрелами и облавами на встречах со старейшинами и по местному телевидению(Citation: 1512)(Citation: 1503).
    В январе 2000 года командование оккупационными войсками запретило чеченцам в захваченных сёлах выходить вечером из домов даже во двор, и солдаты расстреливали нарушителей на месте (подробнее: «Массовые убийства гражданских»)(Citation: 1647).

    Штаб оккупационных войск и Региональный оперативный штаб, через который с 2001 года войной руководила ФСБ, планировали облавы.
    Повод для большинства облав правозащитникам неизвестен (подробнее: «Карательные экспедиции»)(Citation: 1581).
    Российские части блокировали село целиком и свозили чеченских мужчин в фильтрационный лагерь у окраины.
    Генералы, а иногда и командующий оккупационными войсками, руководили облавой из штаба у села(Citation: 1581).

    Внутренние войска МВД России (предшественники современной Росгвардии), милиция и российская армия вели облаву вместе.
    Части разных ведомств делили задачи: окружение, задержание чеченских мужчин по возрасту, охрану фильтрационного лагеря и допросы с пытками (подробнее: «Пытки и истязания»).
    Выйти из окружённого села можно было, только заплатив военным(Citation: 1581).

    На рубеже 2001 и 2002 годов командование оккупационных войск собрало особую группировку, которая шла облавами от села к селу.
    Её ядром стали подразделения внутренних войск, среди них 46-я бригада, а командовали генералы министерства обороны России Богдановский, затем Броницкий.
    За все годы войны самую жестокую «зачистку» (так россияне называли обыски домов и задержания чеченцев) оккупанты устроили в Цоцин-Юрте, селе к востоку от Грозного, не меньше 13 раз, в городе Аргуне и в Старых Атагах, селе к югу от Грозного, - не меньше девяти раз.
    Командиры получали за облавы повышения, отчитываясь о числе задержанных чеченцев, военные по контракту и милиционеры - надбавки за каждый день облавы, а солдаты грабили дома и брали выкуп (подробнее: «Мародерство»)(Citation: 1581).

    Силовики Кадырова-младшего при незаконных арестах предупреждали родных, что за рассказ о задержании расправа ждёт всю семью, а отпущенным велели молчать, если те не хотят снова пропасть без вести.
    Сотрудники российской милиции в республике советовали родным похищенных подождать с заявлением, и родные забирали поданные заявления в обмен на обещание отпустить родственника(Citation: 1581).

    18 ноября 1999 года российские лётчики на двух истребителях пошли в пике на Старые Атаги, но не ударили, и чеченки с детьми в панике бросились в подвалы(Citation: 1512). 13 декабря российские командиры пригрозили старейшинам Старых Атагов сровнять село с землёй, если оттуда выстрелят хоть раз(Citation: 1512).

    В январе 2000 года российские военные оцепили Старые Атаги и задержали около 60 чеченцев(Citation: 1581).
    В феврале чеченка рассказала журналисту Виктору Попкову, что генерал Шаманов, командующий западной группировкой оккупационных войск, пригрозил чеченкам, что их сёла, сыновья и дети будут гореть, пока сыновья поддерживают защитников Ичкерии(Citation: 1478).
    С августа 2000 по январь 2001 года оккупанты устроили не меньше 27 облав и задержали не меньше 926 мирных чеченцев(Citation: 1581).
    В октябре 2000 года военная комендатура Урус-Мартана, города к юго-западу от Грозного, пригрозила городу жёсткими облавами за трёх застреленных российских военных, и горожане начали уезжать(Citation: 1503).
    В ноябре российские военные под угрозой обстрела вызвали к себе главу администрации Алхан-Юрта, села к юго-западу от Грозного, и обстреляли окраины, хотя глава приехал(Citation: 1503).
    В декабре бойцы ОМОНа, милицейского спецназа из Красноярска, избили чеченских парней из дома № 131 на улице Богдана Хмельницкого в Грозном и пригрозили снести дом(Citation: 1503). 26 декабря военный комендант Гаджиев на облаве в посёлке Кирова на окраине Грозного кричал: «Пока я здесь, ваши люди будут пропадать», а военные увезли Мовсара Габзаева, Мусу Дадаева и Лом-Али Ясуева, чьи изуродованные тела нашли 7 января(Citation: 1210).

    15 мая 2001 года в Алхан-Кале, селе к западу от Грозного, российские военные положили на дорогу обезглавленное тело задержанного Абдурахмана Лорсанова и заявляли прохожим, что сделают то же самое с остальными чеченцами (подробнее: «Надругательство над мёртвыми»)(Citation: 1581).
    В июне российские военные на двух бронетранспортёрах наставили автоматы на митинг родных похищенных чеченцев на Театральной площади в Грозном(Citation: 1744).
    В августе оккупанты блокировали Аллерой, село на востоке республики, и задержали почти всех чеченских мужчин старше 14 лет(Citation: 1581).
    С 27 сентября по 6 октября российские войска блокировали Старые Атаги, Новые Атаги, Чири-Юрт и Дуба-Юрт, сёла к югу от Грозного, отключив чеченцам газ и свет(Citation: 1512).
    В декабре несколько тысяч российских военных генерала Богдановского блокировали Автуры, село к юго-востоку от Грозного, и задержали больше 60 чеченцев(Citation: 1581).

    С 24 декабря 2001 года по 7 января 2002 года группировка генерала Богдановского прошла облавами по Чечен-Аулу, Старым Атагам и Цоцин-Юрту, сёлам к югу и востоку от Грозного, а затем по Аргуну, городу к востоку от столицы.
    В Старых Атагах сельчане отказались идти на проверку за село, трое суток стояли на улицах с вилами и топорами, и военные проверили документы у мечети, никого из них не задержав. 30 декабря группировка перешла в Цоцин-Юрт, и облавой там руководил командующий оккупационными войсками Молтенской.
    Солдаты привезли около ста сельчан в мастерские без крыши на окраине, больше суток держали на морозе и пытали.
    Задержанных Мусу Исмаилова и Идриса Закриева военные вели перед собой при штурме двора, где укрылись бойцы Вооружённых сил Ичкерии.
    Родным военные вернули их тела с отрезанными ушами (подробнее: «Использование людей как «живого щита»»).
    Всего оккупанты убили не меньше пятерых задержанных чеченцев, считая этих двоих, не меньше семи пропали без вести, а остальных отпустили, многих за выкуп. 7 января сельчане нашли на окраине взорванные останки ещё троих, среди них задержанного Алхазура Саидселимова(Citation: 1581)(Citation: 1774). 3-7 января группировка задержала в Аргуне, по данным самих оккупантов, 187 горожан, двоих из них военные убили, ещё двое пропали без вести (подробнее: «Система фильтрационных лагерей»)(Citation: 1581).

    12 января 2002 года в Знаменском, селе на севере Ичкерии, правозащитница «Мемориала» Наталья Эстемирова на встрече с командованием оккупационных войск сказала о Цоцин-Юрте: «Адресной [проверкой отдельных домов] трудно назвать проверку, когда полностью блокируется село и все мужское население подвергается, скажем так, проверке».
    Молтенской ответил ей: «Я сам в это время на вертолете летал по кругу и наблюдал…
    Я не думаю, что кто-то из невинных пострадал»(Citation: 1559). 28 февраля Черняев, первый заместитель прокурора республики из российской прокуратуры, сообщил, что по Цоцин-Юрту завели семь дел о разбое и три об исчезновениях и убийствах, но никого не привлекли(Citation: 1581).

    С 28 января по 5 февраля 2002 года российские войска пытали больше 40 чеченцев в фильтрационном лагере у Старых Атагов(Citation: 1581).
    В марте глава оккупационной администрации Кадыров предложил вместо облав забирать подозреваемых из домов по ночам, как это делал советский НКВД (предшественник современной ФСБ), чтобы люди боялись(Citation: 1784). 27 марта командующий оккупационными войсками Молтенской приказом № 80 велел устраивать облавы в чеченских сёлах только с его разрешения(Citation: 946).
    В апреле группировка генерала Броницкого дважды окружала Алхан-Калу, село к западу от Грозного, и убила пятерых чеченцев, задержанных и отпущенных(Citation: 1581).
    С 21 мая по 11 июня войска Броницкого держали в блокаде Мескер-Юрт, село к юго-востоку от Грозного, и на требование администрации села исполнять приказ № 80 ответили им: «Молтенской нам не указ, мы действуем по приказу Путина»(Citation: 1473).
    В июне группировка Броницкого блокировала Чечен-Аул, село к югу от Грозного, и убила не меньше десяти мирных чеченцев(Citation: 1581).
    В сентябре российские войска при облаве в Цоцин-Юрте похитили девять чеченцев(Citation: 1581).

    В конце мая 2003 года на блокпосту внутренних войск МВД России и ФСБ у Старых Атагов висел плакат: «Ну что, вы еще воюете?
    Или взрываете?
    Тогда мы идем к вам.
    Спецназ»(Citation: 1881). 18 декабря Аминат Эпендиева из Урус-Мартана сказала в прямом эфире президенту России Путину, что в районе похищены 203 человека, а в 2004 году следователь Айдамиров из российской прокуратуры её разыскивал(Citation: 286). 18 марта 2004 года российские военные пригрозили матери Тимура Хамбулатова в станице Савельевской на севере Ичкерии убить всю семью, если она заявит о его задержании(Citation: 1967). 23 марта начальник Наурского районного отдела ФСБ Хумаров пригрозил за два часа снести станицу, когда чеченцы и их русские соседи вышли на дорогу и не пропускали военные колонны(Citation: 1967).
    В январе 2005 года российские военные ударили ракетами с вертолётов по Зумсою, горному селу на юге Ичкерии, и похитили четверых чеченцев, среди них 15-летнего подростка(Citation: 1581). 13 сентября силовики полка милиции Ясаева, подчинённые Кадырову-младшему, первому заместителю председателя оккупационного правительства, похитили не меньше шести чеченцев в Новых Атагах, селе к югу от Грозного(Citation: 286).

    14 сентября 2005 года в Аргуне в бою с российскими силовиками погибли защитники Ичкерии, среди них двое братьев Мускиевых.
    Силовики, стоявшие в Цоцин-Юрте, родном селе Мускиевых, привезли тела братьев на окраину села(Citation: 2018).
    По словам сельчан, силовик по имени Хизир отрезал голову Шамилю-Хаджи Мускиеву, потому что считал его виновным в убийстве брата и матери Хизира.
    Вечером силовики выставили голову на трубе у пешеходного моста через реку Хулхулау (подробнее: «Надругательство над мёртвыми»).
    В докладе «Мемориала» и Международной федерации за права человека сказано, что голову выставили «для всеобщего обозрения и устрашения»(Citation: 286).
    Анна Политковская писала в «Новой газете» 26 сентября 2005 года, что силовики «сгоняли всех смотреть — в назидание», а в толпе было много детей и подростков.
    Ни милиция оккупационной администрации, ни российские прокуроры этого не остановили(Citation: 2018).

    23 сентября 2005 года Ясаев, командир полка милиции, пригрозил расправой в мечети Новых Атагов сельчанам, которые требовали вернуть похищенных(Citation: 286).
    Ночью 27 июля 2006 года силовики Гаибова, помощника председателя оккупационного правительства Кадырова-младшего, убили защитника Ичкерии Хож-Ахмеда Душаева на окраине Курчалоя, села к юго-востоку от Грозного, и выставили его голову на газовой трубе у отдела милиции(Citation: 286).

    В ноябре 2000 года организация «Врачи без границ» в докладе «Chechnya: the Politics of Terror» писала, что в захваченных районах российская армия установила режим террора и превратила республику в огромное гетто, где каждый блокпост грозит смертью(Citation: 1381).
    Правозащитники «Мемориала» в 2002 году писали, что среди российских военных и милиционеров в Ичкерии было широко распространено мнение, что их прислали навести ужас на всё население республики, чтобы никто не поддерживал защитников Ичкерии, а это и есть террор(Citation: 1512).
    В январе 2003 года Рудольф Биндиг, докладчик Парламентской ассамблеи Совета Европы, писал, что часть российских войск продолжает запугивать и терроризировать мирных чеченцев(Citation: 285).
    В 2005 году Human Rights Watch писала, что в районах под контролем силовиков Кадырова-младшего люди боятся жаловаться и не заявляют об исчезновении родных, опасаясь за остальных членов семьи(Citation: 819).

    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году описали 136 самых жестоких облав и расправ 1999-2005 годов и составили их таблицу по месяцам.
    По их подсчёту, при этих облавах оккупанты незаконно задерживали сельчан и горожан не меньше 16 245 раз, одного человека могли задержать несколько раз.
    Оккупанты пытали или жестоко избивали и унижали не меньше 8919 сельчан и горожан и убили не меньше 328, а не меньше 254 пропали без вести.
    Авторы пишут, что облавами, захватом заложников, бомбёжками и обстрелами российские силовики прежде всего хотели терроризировать мирных чеченцев, и им известны два приговора за эти облавы, оба без реального срока(Citation: 1581).
    С 18 марта по 1 апреля 2003 года, когда Россия проводила референдум о конституции, записавшей Ичкерию в состав России, авторам не стало известно ни одного задержания, убийства или обстрела, а со 2 апреля российские силовики снова задерживали, убивали и обстреливали почти каждый день.
    По выводу авторов, командование могло остановить и возобновить насилие, а значит, им управляло.
    В докладе сказано, что к началу 2007 года свидетели почти перестали подтверждать правозащитникам сведения о преступлениях(Citation: 1581).

    Оккупанты устраивали самые массовые облавы с начала 2001 по сентябрь 2002 года(Citation: 1581).
    С осени 2002 года облав стало меньше.
    Правозащитники предполагают, что командование оккупационных войск поняло, что облавы пополняют Вооружённые силы Ичкерии всё новыми мстителями(Citation: 1581).
    В ноябре 2002 года президент России Путин заявил, что облавы в сёлах надо заменить задержаниями в отдельных домах («адресными операциями»)(Citation: 1581).
    По таблице правозащитников, самых жестоких облав было 63 в 2001 году, 25 - в 2002 году, восемь - в 2003 году, пять - в 2004 году и две - в 2005 году.
    После лета 2005 года правозащитники таких облав не фиксировали(Citation: 1581).
    Российские силовики продолжили похищать, пытать и убивать чеченцев при таких задержаниях (подробнее: «Похищение людей»)(Citation: 1581).
