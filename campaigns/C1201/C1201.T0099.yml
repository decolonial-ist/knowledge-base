  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты брали чеченцев в заложники и отпускали их за деньги, оружие или российских пленных, а родственников бойцов Вооружённых сил Ичкерии держали, пока те не сдадутся.

    Российские военные и сотрудники ФСБ задерживали чеченцев при «зачистках» (так россияне называли обыски домов и задержания чеченцев), держали в фильтрационных лагерях, а отпускали за выкуп родных (подробнее: «Система фильтрационных лагерей»).
    Посредники - местные милиционеры или агенты российских спецслужб - приходили к родным и называли цену(Citation: 281).
    Правозащитники в докладе «Международный трибунал для Чечни» насчитали 152 случая, когда российские силовики отпустили задержанных чеченцев за деньги(Citation: 1581).

    Не реже, чем деньги, российские военные требовали за задержанного чеченца автомат.
    Родные покупали оружие у российских военных и милиционеров, в том числе у тех, кто держал их родственника, а сотрудники МВД отчитывались этим оружием о разоружении Ичкерии(Citation: 1512)(Citation: 1581).
    Сотрудники ФСБ и начальство фильтрационных лагерей требовали от родных вызволить российского военного из плена у защитников Ичкерии(Citation: 812)(Citation: 1512).
    В Ханкале, главной базе оккупационных войск на восточной окраине Грозного, российские военные в 2000-2001 годах держали заложников ради выкупа и продавали родным тела казнённых (подробнее: «Надругательство над мёртвыми»)(Citation: 1581).

    С 2004 года силовики оккупационной администрации всё чаще захватывали родственников бойцов Ичкерии.
    Это делали служба безопасности Кадырова-младшего, полк патрульной милиции имени Ахмата Кадырова и «нефтяной полк» милиции(Citation: 286)(Citation: 2011).
    Силовики держали заложников в незаконных тюрьмах в Центорое, селе на юго-востоке Ичкерии, и на базах в Гудермесе, городе к востоку от Грозного(Citation: 940).

    9 июня 2004 года первый заместитель председателя оккупационного правительства Кадыров-младший публично пригрозил родственникам бойцов Ичкерии (подробнее: «Коллективные наказания»)(Citation: 286). 29 октября 2004 года генеральный прокурор России Устинов предложил депутатам в Москве узаконить «контрзахват» - задержание родственников тех, кого Россия называла террористами.
    Депутаты закон не приняли, но руководство России от слов Устинова не отказалось(Citation: 1581).
    По данным «Мемориала», в начале 2004 года силовики захватывали родственников бойцов ежемесячно, а после выступления генерального прокурора - почти еженедельно(Citation: 820).

    Сотрудники МВД России в 2000-2005 годах брали в заложники родных задержанных чеченцев, чтобы выбить признания (подробнее: «Фабрикация преступников»)(Citation: 1193).

    16 января 2000 года российские силовики задержали в Знаменском, селе к северо-западу от Грозного, 21-летнего чеченца, которого Amnesty International назвала «Мусой», и отвезли в фильтрационный лагерь в Чернокозове на севере Ичкерии.
    Начальство лагеря потребовало 4000 рублей и двух российских пленных, и 5 февраля, когда мать добилась их освобождения, «Мусу» отпустили(Citation: 812).
    В начале апреля 2000 года российские силовики увезли Ибрагима Джабраилова в фильтрационный лагерь в Урус-Мартане, городе к юго-западу от Грозного.
    Охранники лагеря потребовали выкуп, на 10-е сутки родные заплатили и забрали его избитым, а через 16 дней он умер(Citation: 1669). 16 июля 2000 года российские военные задержали в станице Червлённая к северо-востоку от Грозного 12-летнего пастуха Марата Ахтаева.
    Через шесть дней военные отпустили мальчика за 1000 долларов и стоимость двух автоматов с пистолетом(Citation: 1503).

    С 30 августа по 1 сентября 2000 года солдаты внутренних войск МВД России (предшественников современной Росгвардии) устроили «зачистку» в Черноречье, районе на юге Грозного.
    По словам одного из их офицеров, солдаты задержали там 200 чеченцев.
    Военные держали их в трёх пустых цистернах у автозаправки, а через сутки больше 17 из них увезли в ямы у Танги-Чу, села к юго-западу от Грозного, и продержали там от полутора до пяти суток (подробнее: «Пытки и истязания»).
    Большинство задержанных чеченцев оккупанты отпустили, немалую часть - за автоматы.
    Ризван, чеченец из Черноречья, которого держали в яме у Танги-Чу вместе с братом Апти, рассказал правозащитникам «Мемориала»: «Потом мне сказали, чтобы я пошел за автоматами, а брата оставили заложником».
    Ризван принёс автоматы, и на следующий день военные отпустили Апти.
    Хамзат, чеченец, задержанный в Черноречье, рассказал «Мемориалу», что отец выкупал его дважды, и передал слова солдат о части, которая бросала людей в ямы: «Им якобы надо выполнить план по сбору оружия у людей».
    Последними в цистернах остались 17 чеченцев из соседнего посёлка Новые Алды, у которых не было денег на оружие.
    Солдаты избили их и по дороге к центру Грозного на ходу выбросили из машин.
    У всех отпущенных военные требовали подписать расписку: «Никаких претензий не имею»(Citation: 1503).

    10 ноября 2000 года военные 15-го полка российской армии не застали в Ахкинчу-Борзое, селе на востоке Ичкерии, бывшего телохранителя президента Ичкерии Аслана Масхадова и попытались увезти братьев телохранителя, мальчиков 12 и 14 лет.
    Вместо мальчиков пошёл их 62-летний отец, которого военные два дня держали в яме, а потом отпустили за выкуп(Citation: 1503). 29 апреля 2001 года российские военные увезли из Алхан-Калы, села к западу от Грозного, десять чеченцев, и посредник с Ханкалы требовал по 1000 долларов за каждого.
    Сделка сорвалась, тело одного из десятерых нашли изуродованным, девять пропали без вести, и в 2007 году Европейский суд по правам человека признал Россию ответственной за смерть Султана Исаева, одного из них(Citation: 778). 28 июня 2001 года российские военные увезли у Региты, села на востоке Ичкерии, учителя и ещё одного чеченца, пообещав сельчанам отпустить их, когда придут те, кого военные ищут.
    Оба пропали без вести(Citation: 1581).

    Грачев, начальник уголовного розыска милиции Шали, города к юго-востоку от Грозного, пометил в справке о похищениях, что четырёх чеченцев, похищенных там в ноябре и декабре 2003 года, служба безопасности главы оккупационной администрации Кадырова вернула «за выкуп»(Citation: 1581). 29 февраля 2004 года силовики этой администрации и батальон «Восток» российской военной комендатуры под командованием Ямадаева захватили в горных сёлах на юго-востоке Ичкерии от 40 до 200 родственников министра обороны Ичкерии Магомеда Хамбиева, грозя им расправой. 8 марта Магомед Хамбиев сдался, и силовики отпустили большинство заложников(Citation: 1581)(Citation: 286). 27 ноября 2004 года силовики Кадырова-младшего, первого заместителя председателя оккупационного правительства, увезли в Центорой Шарпуди Исраилова, а их начальник по телефону пригрозил его сыну, бойцу Ичкерии Умару Исраилову, уехавшему за границу, убить отца, если тот не вернётся.
    Силовики держали Шарпуди Исраилова больше десяти месяцев и отпустили 4 октября 2005 года (подробнее: «Пытки и истязания»)(Citation: 940).

    3 декабря 2004 года силовики Кадырова-младшего увезли из домов в Грозном и в станице Первомайской к северо-западу от Грозного сестру президента Ичкерии Аслана Масхадова Бучу Абдулкадырову, его братьев Лечу Масхадова, Лему Масхадова, племянника Ихвана Магомедова и дальнего родственника Адама Рашиева.
    Бойцы блокпоста батальона «Запад» российской военной разведки остановили одну из колонн, но заместитель командира батальона позвонил Кадырову-младшему, убедился, что приказ отдал он, и пропустил колонну. 28 декабря силовики увезли племянницу Аслана Масхадова Хадижат Сатуеву, её мужа Усмана Сатуева и их родственника Мовлида Агуева(Citation: 942)(Citation: 819).

    В январе 2005 года Мовлида Агуева нашли в изоляторе милиции под обвинением в участии в Вооружённых силах Ичкерии(Citation: 819). 31 января прокурор Чеченской Республики Кравченко и глава Регионального оперативного штаба российских силовиков Еделев признали, что родственники президента Ичкерии «контр-похищены» (так российские силовики называли захват родственников тех, кого объявили террористами)(Citation: 2001).
    Остальных семерых силовики пять месяцев держали в бетонной камере три на три метра и отпустили 31 мая 2005 года, почти через три месяца после того, как сотрудники ФСБ России убили Аслана Масхадова(Citation: 286)(Citation: 791). 27 июля 2005 года заместитель генерального прокурора России Шепель сказал на конференции в Кисловодске: «родственники Масхадова были освобождены в результате проведенной специальной операции».
    Российская прокуратура объявила, что похитителей не установила, и приостановила дело(Citation: 286).

    В начале мая 2005 года бойцы «нефтяного полка» под командованием Делимханова увезли трёх братьев Черсиевых, чтобы сдался их родственник, а силовики Кадырова-младшего - 70-летнего отца командира Вооружённых сил Ичкерии Доку Умарова(Citation: 2011)(Citation: 286).
    Силовики пять месяцев держали старика и братьев Черсиевых в подвале базы в Гудермесе и отпустили осенью 2005 года(Citation: 940)(Citation: 1554).

    Правозащитники «Мемориала» в 2005 году писали, что захваты родственников бойцов в заложники в 2004 году стали системой при участии, поддержке и под прикрытием России, и собрали примеры захватов по датам в приложении к своему докладу(Citation: 820).
    Комитет ООН против пыток в выводах по России от 23 ноября 2006 года записал среди поводов для озабоченности: «сообщения о распространенной практике задержания родственников лиц, подозреваемых в терроризме»(Citation: 793).
    Авторы доклада «Международный трибунал для Чечни» в 2009 году назвали освобождение задержанных чеченцев за выкуп захватом заложников и написали, что эта практика носила массовый характер, а захваты родственников бойцов продолжались и при подготовке доклада(Citation: 1581).

    17 сентября 2005 года силовики Кадырова-младшего, первого заместителя председателя оккупационного правительства, похитили в Грозном 16-летнего Руслана Яндаркаева и потребовали за него гранатомёт и бойца Ичкерии, а отец выкупил сына за 50 000 рублей, взятых в долг(Citation: 941).
