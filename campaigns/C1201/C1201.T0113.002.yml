description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты записали в конституцию Чеченской Республики, что учреждения и суды республики работают на русском языке.

    В независимой Ичкерии чеченский язык был государственным, а русский - языком общения между народами республики(Citation: 633).
    В конце 2002 года чиновник президента России Парамонов написал в Москве проект конституции Чеченской Республики (подробнее: «Установка новой системы управления»)(Citation: 941).

    Анна Политковская в «Новой газете» 20 марта 2003 года, за три дня до голосования по конституции, привела из статьи 10 проекта: «Языком межнационального общения и официального делопроизводства в ЧР [Чеченской Республике] является русский язык».
    В статье 99 проекта записано: «Судопроизводство в ЧР [Чеченской Республике] ведется на русском языке».
    Анна Политковская писала: «Никакого чеченского языка в качестве первого и главного не предусмотрено».
    Докка Ицлаев, руководитель консультационного пункта правозащитного центра «Мемориал», назвал это в её статье «политикой, выходящей за рамки приличия»(Citation: 1867). 23 марта 2003 года оккупанты провели эту конституцию через «референдум» (подробнее: «Имитация народного волеизъявления»)(Citation: 941).
    По статье 10 принятого текста государственные языки республики - чеченский и русский, а документы учреждений ведутся на русском(Citation: Chechnya - Constitution (ICL, status 27 March 2003) 2003).
    По статье 99 суды ведут дела на русском, а тот, кто не знает этого языка, получает переводчика и право выступать в суде на родном языке(Citation: Chechnya - Constitution (ICL, status 27 March 2003) 2003).

    7 октября 2004 года Парламентская ассамблея Совета Европы в резолюции 1402 призвала Россию признать чеченский язык в общественной жизни республики и расширить его применение(Citation: 2165).
    Fédération internationale des ligues des droits de l'Homme (FIDH) и «Мемориал» в докладе 2007 года писали, что нередко чеченцы не понимают русского языка, на котором ведутся уголовные дела.
    Без юриста такие люди не могут обжаловать решения следователей и прокуроров(Citation: 286).
