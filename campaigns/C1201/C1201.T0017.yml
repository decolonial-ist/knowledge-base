description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия записала Ичкерию в свой состав указами своего президента и конституцией, которую написали в Москве и провели голосованием под оккупацией.

    23 сентября 1999 года президент России Ельцин секретным указом № 1255с назвал войну против Ичкерии «контртеррористическими операциями» на территории «Северо-Кавказского региона Российской Федерации» (подробнее: «Военная интервенция»)(Citation: 672). 8 июня 2000 года президент России Путин указом № 1071 записал, что у «Чеченской Республики как субъекта [региона] Российской Федерации» нет своих законов.
    По указу президент и правительство России действовали в республике по своей конституции и федеральным законам (подробнее: «Установка новой системы управления»)(Citation: 840).

    29 сентября 1999 года, в день вторжения, председатель правительства России Путин сказал об Ичкерии: «это — Российская Федерация» (подробнее: «Лишение субъектности»)(Citation: 27).

    В конце 2002 года чиновник администрации президента России Парамонов написал в Москве конституцию для республики (подробнее: «Установка новой системы управления»)(Citation: 941). 12 декабря 2002 года президент России Путин указом № 1401 записал, что референдум по ней проходит по Конституции России и федеральным законам(Citation: 842).
    Анна Политковская, журналистка «Новой газеты», 20 марта 2003 года писала о тексте конституции: «Суть проекта, понятно, в том, что Чечня — навечно в составе России… после «всенародного голосования» все движения в сторону суверенитета будут преследоваться по всей строгости Основного Закона [конституции], и никакой международный трибунал уже не сможет помочь президенту [Ичкерии Аслану] Масхадову»(Citation: 1867). 23 марта 2003 года Россия провела голосование под оккупацией и объявила конституцию принятой (подробнее: «Имитация народного волеизъявления»)(Citation: 941).
    В первой статье конституции сказано: «Чеченская Республика (Нохчийн Республика) есть демократическое правовое государство в составе Российской Федерации».
    Территория республики по этой статье «составляет неотъемлемую часть территории Российской Федерации»(Citation: 794).
    Путин, как писала французская газета Le Monde 29 марта 2003 года, заявил, что референдум снял последнюю угрозу отделения от России(Citation: 1381).
