  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские судьи приговаривали чеченцев за службу в Вооружённых силах Ичкерии и по признаниям, выбитым пытками, а защита на этих процессах была для вида.

    В 2001-2002 годах в поставленных оккупантами судах Чеченской Республики дела вёл один судья и по уголовным делам мог дать не больше пяти лет.
    Верховный суд России отправлял дела с более тяжёлыми статьями в суды Ставрополя, Ростова-на-Дону, Пятигорска и Волгограда на юге России и Махачкалы в подконтрольном России Дагестане(Citation: 1512).

    Адвокаты на этих процессах уговаривали обвиняемых чеченцев признать всё, а прокуроры угрожали их семьям, чтобы те не жаловались(Citation: 1991).
    По делам о бандитизме, терроризме и хранении оружия судьи почти дословно переписывали текст обвинения в приговор(Citation: 2019).

    31 августа 2000 года московские милиционеры задержали чеченца Алимпашу Джабраилова, привезли в суд и оставили у двери зала.
    Через несколько минут милиционеры объявили ему, что его осудили, не назвав статьи, а через трое суток отпустили(Citation: 1700).

    В 2001 году командующий российскими войсками Северо-Кавказского военного округа Трошев требовал судить бойцов Вооружённых сил Ичкерии «гласно, публично (если хотите — показательно)», вплоть до расстрела(Citation: 1129). 25 декабря 2001 года судья Верховного суда Дагестана Унжолов дал Салману Радуеву, командиру Вооружённых сил Ичкерии, пожизненный срок за взрыв на вокзале Пятигорска в 1997 году, хотя за этот взрыв Ставропольский краевой суд ещё в 1999 году осудил Ваху Джафарова.
    Генеральный прокурор России Устинов поддерживал на процессе обвинение.
    Унжолов дал 15 лет Турпал-Али Атгериеву, бывшему заместителю председателя правительства Ичкерии, который умер 20 августа 2002 года в тюрьме Екатеринбурга на Урале, а 14 декабря 2002 года Салман Радуев - в колонии в Соликамске (подробнее: «Нейтрализация оппозиции»)(Citation: 1534)(Citation: 1469).

    20 апреля 2002 года сотрудники ФСБ похитили в Шали, городе к юго-востоку от Грозного, Ислама Хасуханова, начальника военной инспекции и оперативного штаба при президенте Ичкерии Аслане Масхадове, и пытками заставили Ислама Хасуханова подписать чистые бланки «приказов» (подробнее: «Фабрикация преступников»)(Citation: 1898).
    Следователь ФСБ Черепнев, который руководил пытками, пригласил к нему адвоката только через полгода после ареста(Citation: 1898)(Citation: 1871).
    С 14 января по 25 февраля 2003 года Верховный суд Северной Осетии, подконтрольной России, судил его в закрытом режиме и не пустил в зал свидетелей и родных.
    Обвинение предъявило суду только копии копий приказов Аслана Масхадова, которые Ислам Хасуханов заверял подписью «Копия верна», хотя все районные отделы ФСБ в Чеченской Республике ответили следователю, что терактов по распоряжениям Ислама Хасуханова не было.
    Судья Джиоев почти дословно переписал в приговор текст обвинения и записал в нём, что подсудимый подписывал протоколы допросов «под психологическим и физическим давлением со стороны работников ФСБ».
    Джиоев отказал Исламу Хасуханову в медицинской экспертизе и дал 12 лет колонии строгого режима без права на амнистию.
    В последнем слове Ислам Хасуханов сказал суду: «То, что происходит в Чечне, считаю грубейшим нарушением прав людей»(Citation: 1898).
    В жалобе в Верховный суд России он писал: «я не могу и не должен обвиняться по этим документам только из-за того, что там стоит моя резолюция: «Копия верна»»(Citation: 1871).

    В декабре 2002 года судья Старопромысловского районного суда Грозного арестовал на 10 суток Дук-Ваху Душуева, которого сотрудники ФСБ пытками заставили оговорить Ахмеда Закаева, представителя президента Ичкерии.
    Судья ни о чём не спросил избитого, а в тюрьме Дук-Ваха Душуев провёл два месяца (подробнее: «Фабрикация преступников»)(Citation: 1895).
    В 2003 году сотрудники ФСБ в Урус-Мартане, городе к юго-западу от Грозного, пытками выбили у 35-летней чеченки Зейнап признание, будто она служила в Вооружённых силах Ичкерии (подробнее: «Сексуализированное насилие»).
    Назначенный адвокат посоветовал ей признать вину, и судья городского суда Яндаров осудил её(Citation: 1924).

    В сентябре 2004 года судья подконтрольного России Верховного суда Чеченской Республики Солтамурадов дал Зауру Мусиханову из Урус-Мартана девять лет за нападение в июне 2002 года, хотя он ушёл к защитникам Ичкерии только в августе 2002 года, на десять дней, а потом сам пришёл в милицию.
    В мае 2005 года судьи Верховного суда России под председательством Галиуллина утвердили приговор и добавили в него убийство милиционеров в Мартан-Чу, селе к юго-западу от Грозного, которого в первом приговоре не было(Citation: 2009).

    8 марта 2005 года спецназ ФСБ России убил Аслана Масхадова, избранного президента Ичкерии, в Толстой-Юрте, селе к северу от Грозного, и захватил четверых чеченцев, которые были с ним в доме (подробнее: «Переговоры как прикрытие нападения»).
    Подконтрольный России Верховный суд Чеченской Республики судил их за бандитизм, «вооружённый мятеж» и хранение оружия.
    Все четверо вину не признали, а путаницу в своих словах объяснили пытками на следствии, травмой при штурме и газом, который спецназ пустил в подвал.
    К концу октября 2005 года обвинение не представило суду ни одного документа, а свидетелями против подсудимых вызвало сестру одного и мать другого, и те против них не свидетельствовали(Citation: 2023). 4 декабря 2005 года судья Мадаев дал Вахиду Мурдашеву 15 лет, Висхану Хаджимуратову - 7, Скандарбеку Юсупову - 6, Илясу Ирисханову - 5,5 года(Citation: 791)(Citation: 2030)(Citation: 3127).
    Обвинение огласило экспертизу, по которой выстрел, якобы смертельный, сделали из пистолета Висхана Хаджимуратова, племянника Аслана Масхадова.
    Висхан Хаджимуратов вину не признал, суд не осудил его за убийство, а вскрытие тела президента так и не обнародовали.
    Анна Политковская в декабре 2005 года писала в «Новой газете», что процесс создавал легенду: «федералы [российские силовики] практически ни при чем, это сами чеченцы убили своего лидера»(Citation: 2030).

    В марте 2006 года районный суд в Ачхой-Мартане, селе к юго-западу от Грозного, дал двум братьям-чеченцам по два с половиной года за «участие в незаконном вооружённом формировании» (так Россия называла службу в Вооружённых силах Ичкерии).
    Сотрудники отделения оперативно-розыскного бюро № 2 МВД России в Урус-Мартановском районе выбили у братьев признания пытками, а старший брат доказывал билетом, что в день нападения, в котором его обвиняли, был в Казахстане(Citation: 286). 28 августа 2006 года Верховный суд Чеченской Республики признал, что силовики оккупационной администрации выбили часть признаний у четверых чеченцев из Новых Атагов, села к югу от Грозного, в подвале своего полка милиции имени Ахмата Кадырова.
    Суд оправдал их в убийстве милиционера, но дал каждому год за «участие в незаконном вооружённом формировании» (подробнее: «Фабрикация преступников»)(Citation: 939)(Citation: 286).

    В 2000 году Human Rights Watch писала, что из 35 опрошенных чеченцев, бывших задержанных, адвоката предложили только одному(Citation: 281).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что тысячи чеченцев получили долгие сроки только за то, что воевали в Вооружённых силах Ичкерии.
    По их словам, из-за пыток на следствии и предвзятости российских судов многие приговоры, скорее всего, несправедливы, и часть из них суды вынесли по сфабрикованным обвинениям(Citation: 1581).

    3 декабря 2008 года районный суд в Ножай-Юрте дал Петимат из Центороя, села на юго-востоке Ичкерии, год условно за «пособничество» бойцам Вооружённых сил Ичкерии по протоколу, который она подписала под стражей, не читая (подробнее: «Фабрикация преступников»)(Citation: 287).
