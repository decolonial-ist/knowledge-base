  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия не пускала в Ичкерию международных наблюдателей, правозащитников и иностранных журналистов, выдавила из республики миссию Организации по безопасности и сотрудничеству в Европе (ОБСЕ) и прятала от проверяющих узников.

    С осени 1999 года российские пограничники на «Кавказе-1», единственном открытом пункте пропуска между Ичкерией и подконтрольной России Ингушетией, не пропускали независимых наблюдателей(Citation: 694).
    Россия раз за разом отказывала правозащитникам Human Rights Watch во въезде в республику, и они расспрашивали чеченцев в Ингушетии(Citation: 280)(Citation: 815).
    К 2003 году Россия пускала иностранных журналистов только под военным конвоем (подробнее: «Информационная изоляция»)(Citation: 1848).

    Сотрудники международных организаций ездили по Ичкерии под вооружённой охраной правительства России (подробнее: «Информационная изоляция»)(Citation: 1454).
    В 2003 году каждую поездку гуманитарной машины по республике ФСБ разрешала документом, где были указаны дата, время, маршрут и имена пассажиров(Citation: 1381).

    30 мая 2001 года оккупационное правительство республики во главе с Ильясовым приняло «резолюцию № 22» об условиях работы и проживания международных организаций в Ичкерии(Citation: 1377).
    По этой резолюции местные сотрудники и организации отвечали за поступки иностранных гуманитариев(Citation: 1381).

    Перед приездом проверяющих силовики оккупационной администрации Кадырова вывозили узников со своих баз или по нескольку часов держали их в машинах неподалёку(Citation: 1554).

    В конце сентября 1999 года Россия заявила протест, что Группа содействия, постоянная миссия ОБСЕ в Ичкерии, в своих докладах выходит за рамки полномочий.
    Группа, которая с декабря 1998 года работала из Москвы, свела доклады к минимуму(Citation: 1441).
    В начале ноября 1999 года Россия развернула делегацию ОБСЕ, которая пыталась попасть в Ичкерию(Citation: 1381).

    С 16 по 20 января 2000 года министр внутренних дел России Рушайло не отходил от делегации Парламентской ассамблеи Совета Европы на Северном Кавказе, и делегация не смогла узнать, что происходит на пунктах пропуска из зоны войны(Citation: 765). 25 или 26 февраля оккупанты перевезли около 300 чеченцев, почти всех узников изолятора в Чернокозове, селе на севере Ичкерии, в тюремные вагоны на станции Червлённая (подробнее: «Система фильтрационных лагерей»).
    Через несколько дней в изолятор приехал Европейский комитет по предупреждению пыток, который проверяет тюрьмы стран Совета Европы(Citation: 281).
    В марте 2000 года Россия согласилась пустить экспертов Совета Европы только в аппарат Каламанова, представителя президента России по правам человека в Ичкерии(Citation: 1446).

    3 апреля 2000 года Россия не пустила Мэри Робинсон, Верховного комиссара ООН по правам человека, в изолятор в бывшем интернате Урус-Мартана, города к юго-западу от Грозного, где российские милиционеры пытали задержанных чеченцев(Citation: 281). 21-22 апреля послы Португалии, Франции и представитель Европейского союза в России ждали на «Кавказе-1» российский вертолёт, который должен был отвезти их в Ичкерию.
    Вертолёт так и не прилетел(Citation: 1381). 25 апреля 2000 года Комиссия ООН по правам человека в резолюции 2000/58 призвала Россию пустить в республику сотрудников международных организаций и пятерых докладчиков комиссии(Citation: 1444).
    До октября 2000 года Россия не пустила ни одного докладчика(Citation: 281), а до конца 2002 года не пригласила докладчиков по пыткам и по казням без суда(Citation: 786)(Citation: 785)(Citation: 816).

    4 августа 2000 года российские военные на блокпосту задержали японского журналиста Масааки Хаяси с документами в порядке, отпустили меньше чем за полчаса до комендантского часа и велели до него покинуть Ичкерию (подробнее: «Информационная изоляция»)(Citation: 1503). 29 ноября оккупанты на «Кавказе-1» три часа не отпускали местную бригаду международной медицинской организации «Врачи без границ» и отобрали у сотрудницы из Старых Атагов, села к югу от Грозного, записи бесед с пациентами. 3 декабря офицер ФСБ в Назрани, городе в Ингушетии, сказал ей, что она уже совершила государственную измену, и требовал доносить на координатора организации, но сотрудница отказалась(Citation: 1381).

    29 мая 2001 года российский военный на блокпосту в Грозном тяжело ранил Арби Исраилова, сотрудника Международного комитета Красного Креста, и комитет приостановил работу в Ичкерии (подробнее: «Медицинская и гуманитарная блокада»)(Citation: 1581).
    Россия 14 месяцев обещала вернуть Группу содействия ОБСЕ, но тянула с гарантиями безопасности. 15 июня 2001 года группа открыла офис в Знаменском, селе на севере Ичкерии, которое контролировали российские войска(Citation: 1441)(Citation: 1451). 28 июня Россия ответила Европейскому комитету по предупреждению пыток, что расследования жестокого обращения с задержанными чеченцами - не его дело, и 10 июля комитет впервые выступил с публичным заявлением о России из-за отказа сотрудничать(Citation: 956).

    10 июля 2002 года ФСБ сообщила координатору ООН по безопасности, что поездки иностранных сотрудников в Ичкерию надо прекратить из-за угрозы похищений, и 29 июля ООН бессрочно приостановила работу в республике(Citation: 1381).

    В ноябре 2002 года Россия предложила изменить задачи Группы содействия ОБСЕ, единственной постоянной международной миссии в Ичкерии(Citation: 1441).
    Полномочия группы истекали 31 декабря 2002 года: в декабре 2001 года государства ОБСЕ по требованию России сделали их годичными(Citation: 816). 3 января 2003 года председатель ОБСЕ, министр иностранных дел Нидерландов Яап де Хоп Схеффер, объявил в Гааге, что из-за российских предложений миссия с 1 января не работает и её надо закрыть до 21 марта(Citation: 918).
    Анна Политковская, журналистка «Новой газеты», 9 января 2003 года писала, что правительство России не первый месяц добивалось ухода ОБСЕ с одной мыслью: «война закончена — забудьте»(Citation: 1848). 18 января министр иностранных дел России Иванов написал председателю ОБСЕ, что для наблюдения за референдумом о конституции Чеченской Республики 23 марта постоянная миссия не нужна(Citation: 1441).
    К 21 марта 2003 года группу закрыли, и постоянных международных миссий в республике не осталось(Citation: 286).

    В январе 2003 года глава российского парламента Селезнёв запретил делегации Европейского парламента поездку в Ичкерию и Ингушетию.
    Это был третий визит такой делегации, который отменила Россия(Citation: 1855). 21 мая 2003 года ФСБ рекомендовала сотрудникам ООН и международных организаций не ездить по Ичкерии(Citation: 1377).
    В мае 2003 года делегация Европейского комитета по предупреждению пыток застала в изоляторе оперативно-розыскного бюро № 2 МВД России в Грозном 17 запуганных узников-чеченцев.
    В публичном заявлении комитета 10 июля, втором о России, сказано, что узников специально предупредили молчать(Citation: 938).

    В январе 2004 года Россия закрыла аппарат представителя президента России по правам человека в Ичкерии, при котором работали эксперты Совета Европы, и они, вывезенные весной 2003 года после нападения на их конвой, в республику не вернулись(Citation: 286).
    Осенью 2004 года Россия, сославшись на российские законы, перестала пускать Международный комитет Красного Креста к чеченцам, которых держали в тюрьмах из-за войны, и комитет прекратил посещения.
    К июню 2006 года сотрудники комитета почти два года не видели этих узников(Citation: 286). 1 мая 2006 года милиционеры оккупационной администрации не пустили делегацию Европейского комитета по предупреждению пыток в Центорой, село к юго-востоку от Грозного, где силовики Кадырова-младшего, главы оккупационного правительства, держали чеченцев в тайной тюрьме.
    Делегация попала в село 2 мая, а за сутки силовики вывезли из тюрьмы всех узников и многих отпустили (подробнее: «Система фильтрационных лагерей»)(Citation: 286)(Citation: 1581).

    В докладе к резолюции 1315 Парламентской ассамблеи Совета Европы 29 января 2003 года сказано, что российские военные преследуют, запугивают и избивают чеченцев, а журналистам и сотрудникам международных организаций почти невозможно попасть в Ичкерию, поэтому «большинство этих преступлений остаётся незамеченным, и мир о них не слышит»(Citation: 285).
    В публичном заявлении Европейского комитета по предупреждению пыток 13 марта 2007 года сказано: «Российские власти неизменно отказываются всерьёз обсуждать с Комитетом главные вопросы.
    Это можно назвать только отказом от сотрудничества»(Citation: 939).
    В докладе российских правозащитников «Международный трибунал для Чечни» 2009 года сказано, что все описанные в нём расправы над чеченцами 1999-2000 годов российские войска устроили, когда в Ичкерии не могла работать ни одна международная или правозащитная организация, а захват горных сёл не расследовал никто(Citation: 1581).

    Правительство России пригласило Манфреда Новака, докладчика ООН по пыткам, на Северный Кавказ, в том числе в Ичкерию, с 9 по 20 октября 2006 года.
    Незадолго до поездки правительство сообщило ему, что внезапные посещения мест заключения и беседы с узниками наедине противоречат российским законам. 4 октября Манфред Новак заявил, что поездка в таком виде невозможна, и отложил её(Citation: 286)(Citation: 1554).
