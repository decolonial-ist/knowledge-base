  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские военные, милиционеры, сотрудники ФСБ, а затем силовики оккупационной администрации Кадырова без суда убивали задержанных чеченцев.

    Оккупанты задерживали чеченцев на блокпостах, при «зачистках» (так россияне называли обыски домов и задержания чеченцев) и ночью в домах, не записывая задержаний (подробнее: «Похищение людей»)(Citation: 1188).
    Российские силовики убивали задержанных в ямах в Ханкале, главной базе оккупационных войск на восточной окраине Грозного, на базах воинских частей и в изоляторах временных отделов милиции(Citation: 1210).

    15 декабря 2000 года начальник Генштаба России Квашнин объявил в газете «Красная звезда» план создать в каждом районе Ичкерии спецподразделения для «уничтожения боевиков» (так россияне называли бойцов Вооружённых сил Ичкерии)(Citation: 1581). 24 мая 2001 года исполнявший обязанности командующего оккупационными войсками Молтенской приказом № 145 поставил войскам на облавах задачу выявлять, задерживать и «ликвидировать» бойцов Вооружённых сил Ичкерии и их командиров(Citation: 1512).

    Оккупанты расстреливали задержанных чеченцев со связанными руками и завязанными глазами, добивая выстрелом в голову, или велели им бежать и стреляли вслед(Citation: 1188)(Citation: 1210).
    Прежде чем убить задержанных чеченцев, российские военные пытали их (подробнее: «Пытки и истязания»).
    Военные часто взрывали тела убитых, чтобы родные не смогли их опознать (подробнее: «Надругательство над мёртвыми»)(Citation: 1210).
    Силовики оккупационной администрации Кадырова расстреливали узников своих тайных тюрем и выдавали их за бойцов Вооружённых сил Ичкерии, убитых в бою(Citation: 286).

    Авторы доклада «Международный трибунал для Чечни» насчитали, что из 2335 чеченцев, которых российские силовики убили в Ичкерии с 1999 по 2005 год, 484 убили после задержания(Citation: 1581).

    20 декабря 1999 года российские военные задержали на блокпосту у Старых Атагов, села к югу от Грозного, трёх чеченцев. 11-13 сентября 2000 года их тела со связанными руками и пулями в голове нашли у села(Citation: 1210). 17 января 2000 года российские военные на блокпосту «Юг» у Дуба-Юрта, села к югу от Грозного, пытали раненого Рамзана Базаева, требуя признаться, что служил в Вооружённых силах Ичкерии, и расстреляли его(Citation: 1210). 2 февраля 2000 года в Алхан-Кале, селе к западу от Грозного, генерал Баранов, начальник штаба оккупационных войск, перед камерами журналистов приказал солдатам «пристрелить» раненого бойца Вооружённых сил Ичкерии Хаджи-Мурата Яндиева, которого вывезли из сельской больницы(Citation: 1174).
    Солдаты увели его, и в 2006 году Европейский суд по правам человека (ЕСПЧ) признал Россию ответственной за его убийство, а тело так и не нашли(Citation: 773).

    8-10 августа 2000 года при облаве в Гехи, селе к юго-западу от Грозного, российские военные и пензенские милиционеры задержали 57 чеченцев, четверых из них казнили, а ещё один пропал без вести(Citation: 1581). 11 августа российский телеканал НТВ показал тело задержанного Али Мусаева как убитого «боевика», а в 2007 году ЕСПЧ признал Россию ответственной за смерть Али и Умара Мусаевых под стражей(Citation: 1210)(Citation: 781). 8 сентября 2000 года российские силовики задержали двух чеченцев, а в тот же день вывели их с завязанными глазами у карьера под Грозным, велели бежать, подорвали гранатой и подожгли(Citation: 1210).

    В ночь на 10 декабря 2000 года российские силовики увели из домов в Алхан-Юрте, селе к юго-западу от Грозного, братьев Рамзана и Рустама Рисхановых и Тасу Тимарова.
    Ваха Рисханов, отец братьев, со слов узников ямы в Ханкале рассказал правозащитникам «Мемориала»: «в ту ночь их всех троих вывели наружу, больше в яму они не вернулись… 10 декабря их взяли, а 20-го, считай, казнили»(Citation: 1210). 21 февраля 2001 года родные пропавших без вести нашли первые тела в дачном посёлке «Здоровье» в километре от Ханкалы, который с декабря 1999 года был под контролем российских войск(Citation: 813).
    С 24 февраля в посёлке и рядом нашли тела 51 человека(Citation: 813). 6 марта родные опознали среди них Рамзана Рисханова, Рустама Рисханова и Тасу Тимарова со связанными руками, повязками на глазах, следами пыток током(Citation: 1210).
    Всего опознали 19 убитых, и не меньше 16 из них до этого задержали российские силовики(Citation: 813). 10 марта российская прокуратура Чеченской Республики без объявления похоронила 34 неопознанных тела (подробнее: «Надругательство над мёртвыми»)(Citation: 813).

    23 декабря 2000 года российские милиционеры задержали в Грозном двух 15-летних чеченцев, отвезли их в отдел милиции Октябрьского района, а 5 января 2001 года прокурор Грозного Пономарев нашёл их тела с выколотыми глазами на территории отдела(Citation: 1210). 11-14 марта 2001 года при облаве в Аргуне, городе к востоку от Грозного, оккупанты задержали около 170 чеченцев и отпустили без обвинений всех, кроме одиннадцати, которые пропали без вести.
    Патруль нашёл тела четверых из них с пулями в затылок на территории российского 71-го полка, что правительство России признало в ЕСПЧ, а в 2002 году у Аргуна нашли останки ещё двоих(Citation: 1581). 19-25 июня 2001 года при облаве в Алхан-Кале российские войска не отпустили 26 задержанных: взорванные тела 12 из них нашли у села, 14 пропали без вести(Citation: 1581).

    11 января 2002 года на дороге из Дая в Нохчи-Келой, сёла в горах на юге Ичкерии, группа спецназа военной разведки России (ГРУ) капитана Ульмана остановила рейсовый УАЗ, проверила документы и высадила шестерых чеченцев(Citation: 1778)(Citation: 1951).
    По приказу майора Перелевского, заместителя командира отряда ГРУ, спецназовцы пытали их, а потом убили Зайнап Джаватханову, беременную мать семерых детей, директора школы Сайд-Магомеда Аласханова, завуча Абдул-Вахаба Сатабаева, лесника Шахбана Бахаева, водителя Хамзата Тубурова и Магомеда Мусаева.
    Спецназовцы облили тела бензином и сожгли в машине(Citation: 1778)(Citation: 1872).
    Пресс-центр оккупационных войск сообщил, что убиты шесть «боевиков».
    В феврале 2002 года Лариса Шабазова, сестра мужа Зайнап Джаватхановой, сказала Анне Политковской, журналистке «Новой газеты»: «Мы хоронили пепел».
    После убийства в Нохчи-Келое остались 28 сирот(Citation: 1778).
    В 2007 году военный суд осудил Ульмана, Перелевского и ещё двоих, но трое из четверых скрылись до приговора (подробнее: «Безнаказанность исполнителей»)(Citation: 1581).

    2-5 марта 2002 года военные 34-й бригады внутренних войск МВД России (предшественников современной Росгвардии) увели в Аргуне четверых чеченцев. 4 марта их тела с пулевыми ранами нашли во дворе военной комендатуры, а 5 марта пресс-служба внутренних войск объявила, что разведчики «уничтожили банду»(Citation: 1581). 4 июня 2002 года российские военные выбросили из машины у Мескер-Юрта, села к юго-востоку от Грозного, тело узника фильтрационного лагеря Адама Темерсултанова (подробнее: «Система фильтрационных лагерей»)(Citation: 1462).

    26 октября 2002 года спецназ ФСБ штурмовал театральный центр на Дубровке в Москве, где с 23 октября группа чеченцев держала заложников.
    Спецназовцы пустили в зал газ и убили всех 40 захватчиков. 19 женщин из них, потерявших сознание от газа, спецназовцы застрелили в креслах(Citation: 1581). 4 ноября 2003 года Комитет ООН по правам человека с тревогой отметил, что убийство захватчиков никто не расследовал независимо и беспристрастно, и призвал Россию провести такое расследование(Citation: 1445).

    8 февраля 2003 года у Капустино в Наурском районе на севере Ичкерии пастух нашёл в пяти могилах тела семи мужчин с отрубленными головами или перерезанным горлом, а родные опознали пятерых, которых люди в камуфляже увезли из домов и с дорог в июне - ноябре 2002 года.
    Авторы доклада «Международный трибунал для Чечни» пишут, что их убило российское спецподразделение(Citation: 1581).

    В мае 2005 года силовики Кадырова-младшего, первого заместителя председателя оккупационного правительства, держали Хамида Акуева на базе «Вега» под Гудермесом, городом к востоку от Грозного. 9 мая эти силовики привезли его тело и ещё семь в отдел милиции Курчалоевского района и объявили, что убили всех в бою у Аллероя, села на востоке Ичкерии(Citation: 286)(Citation: 1581). 13 мая 2005 года силовики оккупационной администрации во главе с Асуевым, начальником её силовой структуры в Старопромысловском районе Грозного, выдали за убитого «боевика» Хамзата Гайтукиева, которого в тот же день похитили из дома(Citation: 1581).

    20 апреля 2001 года Комиссия ООН по правам человека в резолюции 2001/24 «решительно осудила» казни без суда в Чеченской Республике(Citation: 785).
    В январе 2002 года правозащитник Олег Орлов сказал на пресс-конференции «Мемориала» в Москве, что российские силовики ведут против чеченцев террор «по типу "эскадронов смерти"» (так называют тайные группы, которые убивают людей без суда)(Citation: 1227).
    В 2009 году авторы доклада «Международный трибунал для Чечни» написали, что российские силовики казнили задержанных чеченцев как часть политики государства, и назвали эти казни преступлениями против человечности.
    По их подсчёту, по делам об исчезновениях и казнях задержанных российские суды осудили только пятерых милиционеров Асуева, а милиционера Лапина - лишь за пытки и поддельные подписи в деле о наркотиках (подробнее: «Безнаказанность исполнителей»)(Citation: 1581).
    Правозащитники «Мемориала» составили поимённый перечень чеченцев, которых российские силовики задержали с октября 1999 по 2000 год, а потом убили или скрыли их судьбу(Citation: 1210).

    31 мая 2006 года бойцы 2-го полка милиции особого назначения оккупационной администрации во главе с Дадаевым похитили в станице Нестеровская в подконтрольной России Ингушетии Ризвана Хайхароева из Бамута, села на западе Ичкерии.
    Милиционеры связали его, положили в багажник, а потом застрелили в затылок(Citation: 286).

    С 2003 года тела задержанных чеченцев, убитых российскими силовиками, находили гораздо реже.
    Правозащитники пишут, что после находки тел в посёлке «Здоровье» силовики тщательнее прятали следы, а задержанные чеченцы чаще пропадали без вести (подробнее: «Похищение людей»)(Citation: 1581).
    По их подсчёту, после задержания российские силовики убили 151 чеченца в 2000 году, 129 - в 2002 году, 14 - в 2003 году и 19 - в 2005 году(Citation: 1581). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
