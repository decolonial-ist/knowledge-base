description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты, а позже силовики оккупационной администрации Кадырова карали целые сёла за нападения защитников Ичкерии, а семьи - за родных, которые воевали за независимость Чеченской Республики.

    Командующий восточной группировкой оккупационных войск Трошев писал, что осенью 1999 года войска окружали село и вызывали его главу, старейшин, духовных лиц и учителей.
    Командиры требовали от них поручиться, что из села не будут стрелять по российским солдатам(Citation: 1129).

    За нападения защитников Ичкерии у села российские военные карали всё село (подробнее: «Карательные экспедиции»)(Citation: 1581).
    Оккупанты взрывали и жгли дома чеченских семей, часто тех, в которых кто-то воевал(Citation: 1227)(Citation: 820).

    С 2004 года силовики Кадырова-младшего жгли дома родственников бойцов сопротивления и брали родных в заложники, чтобы бойцы сдались (подробнее: «Захват заложников»)(Citation: 820).
    Силовики приезжали ночью, выгоняли семью из дома, сдвигали мебель в кучу, обливали дом привезённым бензином и поджигали.
    Потом милиционеры оккупационной администрации заставляли семьи подписывать, что пожар начался от свечи или угольков из печи(Citation: 287).

    В декабре 1999 года российские лётчики бомбили Алхазурово, село к юго-западу от Грозного, и убили четверых мирных чеченцев за то, что представители села не смогли выехать к командованию оккупационных войск(Citation: 1581).

    В феврале 2000 года российские войска бомбили Катыр-Юрт, село к юго-западу от Грозного: по выводу Европейского суда по правам человека, чеченцев в селе «наказали» за то, что военные сочли нежеланием сотрудничать(Citation: 278).
    В июле после подрыва российской боевой машины пехоты у Шуани, села на юго-востоке Ичкерии, оккупанты грозили убивать за каждого своего пятерых чеченцев(Citation: 1503).
    В августе в Турты-Хуторе, селе на юго-востоке Ичкерии, российские военные жгли и забрасывали гранатами дома чеченцев, которых не застали, и российский командир сказал, что таков приказ(Citation: 1581).

    В марте 2001 года в Ачхой-Мартане, селе к юго-западу от Грозного, после подрыва милицейского мусоровоза российские милиционеры из Воронежской области взорвали пустой дом чеченской семьи и разрушили или повредили около 40 домов вокруг(Citation: 1581).
    В июле за подрыв фугаса у Серноводска, села на западе Ичкерии, российские войска задержали сотни чеченцев там и в соседней станице Ассиновской (подробнее: «Карательные экспедиции»)(Citation: 814).
    В конце года в Урус-Мартане, городе к юго-западу от Грозного, и соседнем селе Алхан-Юрт оккупанты после покушения на российского военного коменданта района взорвали пять домов чеченских семей, в части которых кто-то воевал(Citation: 1227).

    В ноябре 2002 года, после того как над Ханкалой, главной базой оккупационных войск на восточной окраине Грозного, сбили российский вертолёт, оккупанты убили чеченку в ходе обстрела соседнего посёлка и взорвали в нём два пятиэтажных дома(Citation: 1581).

    В мае 2004 года на поминках в Гудермесе, городе к востоку от Грозного, глава оккупационной администрации Кадыров пообещал наказывать всех родственников бойцов сопротивления и их соседей(Citation: 820).
    В том же месяце в Аллерое, селе на востоке Ичкерии, силовики Кадырова-младшего сожгли дома двух чеченских семей, чьи сыновья воевали против оккупантов(Citation: 820).
    В июне первый заместитель председателя оккупационного правительства Кадыров-младший сказал в интервью НТВ, что родственников бойцов сопротивления будут «наказывать»(Citation: 820).
    В сентябре после захода бойцов сопротивления в Аллерой силовики Кадырова-младшего сожгли там семь домов чеченцев, родственников этих бойцов(Citation: 943).
    В декабре в Ойсхаре, посёлке к востоку от Гудермеса, силовики Кадырова-младшего выгнали 75-летнего чеченца, чей сын воевал за независимость Ичкерии, с женой, дочерью и четырьмя малолетними внуками, а дом сожгли(Citation: 820).

    В августе 2008 года в Аргуне, городе к востоку от Грозного, силовики Кадырова-младшего сожгли дом одной из 17 чеченских семей, которым глава оккупационной администрации города Темирбаев велел уехать из-за сыновей, ушедших к вооружённому сопротивлению(Citation: 944)(Citation: 943)(Citation: 287).

    7 августа 2008 года 21-летний сын Юсупа Эбишева ушёл из Шали, города к юго-востоку от Грозного, к вооружённому сопротивлению.
    Милиционеры оккупационной администрации в Шали дали отцу две недели, чтобы вернуть сына домой. 9 августа глава оккупационной администрации Кадыров-младший сказал министрам на совещании оккупационного правительства в эфире телеканала «Грозный»: «те семьи, у которых родственники в лесу, являются соучастниками преступления, они террористы…».
    В ночь на 28 августа около десяти силовиков Кадырова-младшего в масках вытащили брата и племянника Юсупа Эбишева из дома во дворе, облили стены бензином и бросили в окно факел.
    Соседи помогли семье потушить огонь(Citation: 287)(Citation: 943).

    В марте 2009 года глава оккупационной администрации Шалинского района, начальник районной милиции Даудов и российский прокурор района Сербиев собрали в доме культуры встречу с молодёжью.
    Юсуп Эбишев сказал там, что за уход молодёжи к вооружённому сопротивлению отвечают не только родители, но и всё общество, а все следующие выступавшие спорили с ним. 12 марта двое вооружённых силовиков Кадырова-младшего в масках снова подожгли дом во дворе Эбишевых(Citation: 943)(Citation: 287). 16 марта 2009 года Юсуп Эбишев рассказал Human Rights Watch: «Наказали меня так за мои слова, за то, что я плакать не стал, унижаться, как родители эти, которых по телевизору показывают».
    От дома остались стены и крыша, а сын Юсупа Эбишева так и не вернулся домой(Citation: 287).

    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что многие облавы в ответ на подрывы и нападения у села носили черты коллективных наказаний.
    По их выводу, с 2004 года российские силовики и силовики Кадырова-младшего системно преследовали родственников бойцов: брали их в заложники, убивали и жгли дома(Citation: 1581).
    «Мемориал» составил список 26 поджогов домов семей бойцов с июля 2008 по март 2009 года, с сёлами и фамилиями(Citation: 943).
    В 2014 году Human Rights Watch написала, что коллективное наказание семей бойцов было отличительной чертой российской политики в Ичкерии всё десятилетие, а Россия ничего не сделала, чтобы остановить поджоги(Citation: 1009).
