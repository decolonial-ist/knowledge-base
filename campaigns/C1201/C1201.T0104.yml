  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты расстреливали мирных чеченцев в домах, во дворах и подвалах, на дорогах и у блокпостов.

    Российские войска окружали захваченные сёла и кварталы Грозного и никого оттуда не выпускали(Citation: 770)(Citation: 764).
    При «зачистках» (так россияне называли обыски домов и задержания чеченцев) оккупанты убивали тех, кого застали дома(Citation: 280)(Citation: 763).
    Солдаты поджигали дома с живыми людьми и бросали гранаты в подвалы, где прятались семьи(Citation: 280)(Citation: 279)(Citation: 817).
    Убийцы грабили дома и требовали у тех, кто ещё был жив, денег и золота (подробнее: «Мародерство»)(Citation: 1581).

    Солдаты на блокпостах стреляли в беженцев, которые не остановились по первому требованию(Citation: 1512)(Citation: 1581).
    Российский военный комендант Урус-Мартановского района Гаджиев приказом № 260 от 10 сентября 2001 года ввёл комендантский час.
    С 25 сентября Гаджиев установил его с 20:00 до 6:00 и напомнил, что российские военные и милиционеры по нарушителям «имеют право применять оружие без предупреждения»(Citation: 1581).
    С 2000 года российские силовики в масках приезжали по ночам на бронетранспортёрах или машинах без номеров и расстреливали чеченцев в их домах(Citation: 1749)(Citation: 1917)(Citation: 285).
    Оккупанты записывали убитых чеченцев в бойцов Вооружённых сил Ичкерии (подробнее: «Ложь о собственных действиях»)(Citation: 1503).

    1 декабря 1999 года солдаты 15-го мотострелкового полка, которым командовал начальник штаба полка Воронов, захватили Алхан-Юрт, село к юго-западу от Грозного.
    По данным Human Rights Watch, за две с лишним недели оккупанты убили в селе не меньше 18 мирных сельчан, грабили и поджигали дома(Citation: 770)(Citation: 1581). 3 декабря российские военные в масках у Гойт, села к югу от Грозного, расстреляли из автоматов и пулемёта колонну беженцев под белыми флагами.
    Из почти 50 чеченцев выжили семеро, все раненые(Citation: 1581).
    С 22 декабря 1999 года по конец января 2000 года солдаты 205-й мотострелковой бригады и 21-й бригады внутренних войск МВД России (предшественников современной Росгвардии) расстреливали чеченцев в домах и подвалах захваченного Старопромысловского района на северо-западе Грозного(Citation: 1581)(Citation: 279). 19-21 января 2000 года российские военные на улице Шефской в Грозном расстреляли девятерых членов семьи Зубаевых, среди них двух семилетних девочек(Citation: 1210). 20 января солдаты 160-го танкового полка с блокпоста «Юг» у Дуба-Юрта, села к югу от Грозного, обстреляли похоронную процессию, убили двоих и ранили десятки чеченцев(Citation: 1581)(Citation: 1210).

    4 февраля 2000 года российские солдаты окружили Новые Алды, посёлок на южной окраине Грозного, где не было бойцов Вооружённых сил Ичкерии.
    Военные проверили паспорта и велели чеченцам оставаться по домам, поскольку на следующий день будет «зачистка»(Citation: 764)(Citation: 817). 5 февраля омоновцы из Санкт-Петербурга под командой Абакумова и солдаты 6-й роты 245-го мотострелкового полка, которой командовал Новичков, ходили по дворам и расстреливали чеченцев(Citation: 1581)(Citation: 280).
    На перекрёстке Хопёрской и Воронежской улиц бойцы Новичкова убили девятерых, среди них четверых Мусаевых, Альви Ганаева и двух его сыновей(Citation: 1581)(Citation: 764).
    Малика Лабазанова, чеченка из Новых Алдов, рассказала правозащитникам «Мемориала», как солдат в белом камуфляже посмеялся над её 300 рублями и забрал серьги: «…он кричит, что убивать приказано всех».
    Оккупанты убили Ахмеда Абулханова во дворе, Зину и Хусейна Абдулмежидовых - в доме.
    Солдат, которому велели убить Малику Лабазанову, выстрелил в потолок, и она выжила(Citation: 817)(Citation: 764).

    Асет Чадаева, медсестра из Новых Алдов, рассказала «Мемориалу», что российский командир велел ей хоронить убитых: «Тут ребята в запарке ваших стариков уложили».
    Она назвала количество убитых в посёлке: «Всего в тот день мы недосчитались 114 человек.
    Найдено 82 трупа»(Citation: 817).
    Источники расходятся: «Мемориал» поимённо назвал 46 чеченцев, убитых в посёлке, Human Rights Watch насчитала не меньше 60 жертв в Новых Алдах и соседнем Черноречье(Citation: 951)(Citation: 280).
    В апреле 2000 года следователь Генеральной прокуратуры России Мурдалов написал в справках родным убитых, что «сотрудниками подразделений МО [Министерства обороны] и МВД РФ в ходе проверки паспортного режима было совершено массовое убийство мирных жителей»(Citation: 950)(Citation: 949). 26 июля 2007 года Европейский суд по правам человека признал, что чеченцев в Новых Алдах убили военные и омоновцы, которые 5 февраля обыскивали посёлок.
    Правительство России признало в суде участие петербургского ОМОНа и больше 50 убитых(Citation: 764).
    К 2009 году никого из убийц не осудили (подробнее: «Безнаказанность исполнителей»)(Citation: 1581).

    7 февраля 2000 года при обысках в Гехи-Чу, селе к юго-западу от Грозного, военные западной группировки российских оккупационных войск под командой генерала Шаманова расстреляли 13 мирных чеченцев, среди них пятерых беженцев у мечети, четверых братьев Исраиловых и двоих, в том числе подростка, - за купленные на рынке солдатские ботинки(Citation: 1500)(Citation: 1581). 12 февраля российские военные на лесной дороге из Бачи-Юрта в Ялхой-Мохк, сёла к юго-востоку от Грозного, расстреляли машину с пятью чеченцами, среди них семилетнюю девочку.
    Оккупанты перебили раненым руки и убили их выстрелами в лоб(Citation: 1503)(Citation: 1581). 30 июня военные с российского бронетранспортёра на дороге к Чечен-Аулу, селу к югу от Грозного, застрелили одного чеченца, а потом расстреляли машину и убили ещё троих(Citation: 1503). 14 декабря 2000 года российские спецназовцы в Алхан-Кале, селе к западу от Грозного, убили из оружия с глушителем семью Исмаиловых: отца, мать и двух дочерей.
    В 2001 году военный суд приговорил двоих спецназовцев - Магонова к 15 годам заключения, Суханова к 18 годам(Citation: 1503).

    17 апреля 2001 года бойцы подразделения под командой подполковника Каменюки, заместителя командира батальона 22-й бригады спецназа российской военной разведки, у Нижнего Аллероя, села к юго-востоку от Грозного, расстреляли пастуха, его сына и двух племянников.
    Взрослого убили выстрелом в лоб, детей - в виски(Citation: 1735)(Citation: 3120). 30 апреля 2001 года российские силовики в масках ходили по домам Тевзаны, села на юго-востоке Ичкерии, и расстреляли семерых чеченцев.
    Среди убитых были 78-летний старик и 17-летний юноша(Citation: 1749)(Citation: 1581). 27 сентября 2003 года на рассвете российские силовики в масках ворвались в дом в Чечен-Ауле и расстреляли двух пожилых чеченцев и их сыновей(Citation: 1917).

    16 ноября 2005 года солдаты по контракту российской воинской части 98311 Кривошонок и Зинчук с сослуживцами остановили машину для проверки документов, убили троих мирных чеченцев и пытались убить свидетеля.
    В мае 2006 года военный суд в Грозном приговорил Зинчука к 18 годам заключения, Кривошонка - к 7 годам(Citation: 1581).

    Правозащитники «Мемориала» пишут, что Россия не вела счёт убитым мирным чеченцам(Citation: 1328).
    В 2004 году они сами оценили число убитых за войну от 10 до 20 тысяч, а вместе с пропавшими без вести после задержания - от 15 до 24 тысяч(Citation: 1328).
    Источники расходятся: президент Ичкерии Аслан Масхадов, по данным Радио Свобода в декабре 2004 года, говорил о 250 тысячах мирных чеченцев, которых российские войска убили за обе войны(Citation: 2377).
    В августе 2005 года Джабраилов, глава оккупационного парламента, назвал 150-160 тысяч погибших за обе войны(Citation: 2114), а Кадыров-младший, к тому времени глава оккупационной администрации, в интервью «Российской газете» 7 апреля 2009 года сказал, не уточнив, за какие годы: «мы потеряли 300 000 человек»(Citation: 2378).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что в Алхан-Юрте, Старопромысловском районе Грозного, Новых Алдах и Гехи-Чу российские военные убивали людей потому, что те были чеченцами, и что за этими убийствами стоял взгляд на всех мирных чеченцев как на врагов.
    Они назвали убийства мирных чеченцев российскими войсками преступлениями против человечности.
    Станислав Дмитриевский и соавторы по документам насчитали 2335 мирных чеченцев, которых российские силовики убили с 1999 по 2005 год: 1386 - бомбёжками и обстрелами, 484 - после задержания, 465 - в других обстоятельствах.
    Из 154 убийств, которые российские военные и силовики совершили с 2000 по 2005 год вне облав, задержаний, бомбёжек и обстрелов, правозащитники нашли приговоры не меньше чем по пяти (подробнее: «Безнаказанность исполнителей»)(Citation: 1581).

    Российские войска устраивали массовые расправы над мирными чеченцами в захваченных сёлах и кварталах Грозного с декабря 1999 по февраль 2000 года, пока захватывали Ичкерию(Citation: 1581).
    С конца 2002 года облавы с убийствами в сёлах стали реже (подробнее: «Террор»)(Citation: 1581).
    Российские силовики продолжили убивать и похищать чеченцев по одному, ночью у них дома (подробнее: «Похищение людей»)(Citation: 1581).
    Вне облав, задержаний, бомбёжек и обстрелов правозащитники насчитали 73 убийства мирных чеченцев российскими силовиками в 2001 году, 2 - в 2004 году и 8 - в 2005 году(Citation: 1581). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
