  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия вернула столице Ичкерии имя российской крепости Грозной, а оккупационная администрация дала главным улицам Грозного имена президента России Путина и главы оккупационной администрации Кадырова.

    В январе 1997 года исполнявший обязанности президента Ичкерии Зелимхан Яндарбиев объявил о переименовании Грозного в Джохар-Галу в честь первого президента Ичкерии Джохара Дудаева, а в марте 1998 года парламент Ичкерии закрепил имя Джохар поправкой к конституции(Citation: 1532)(Citation: 1569).
    Захватив республику, Россия снова называла столицу Грозным - именем крепости, которую российский генерал Ермолов основал в 1818 году, чтобы закрыть горцам выход с гор на равнину(Citation: 1532).
    По российскому закону «О наименованиях географических объектов» от 18 декабря 1997 года № 152-ФЗ Москва даёт новое имя столице республики только отдельным федеральным законом(Citation: 1532)(Citation: Федеральный закон от 27 октября 2008 г. № 191-ФЗ «О внесении изменений в Федеральный закон «О наименованиях географических объектов»» 2008).

    Глава оккупационной администрации Кадыров погиб 9 мая 2004 года, а к декабрю 2005 года эта администрация дала его имя главному проспекту Грозного, бывшему проспекту Ленина(Citation: 1532)(Citation: 1231).
    Администрация решила дать это имя центральным улицам всех городов и районных центров республики(Citation: 1532).
    К 2020 году улицы имени Кадырова были почти во всех сёлах и городах республики(Citation: 311).

    14 декабря 2005 года депутаты оккупационного парламента единогласно решили просить президента России Путина переименовать Грозный в Ахмадкалу в честь бывшего главы оккупационной администрации Кадырова(Citation: 941)(Citation: 1532).
    Депутат российского парламента Бабурин в тот же день сказал агентству РИА «Новости»: «Если будет восстанавливаться город, имеющий свою историю, он должен носить свое историческое название и это должен быть город Грозный»(Citation: 1532).
    Гришин, руководивший комитетом депутатов по делам регионов, сказал агентству РИА «Новости»: «Этот вопрос касается Чечни и чеченского народа, но также он касается и всей России»(Citation: 1532).
    Против выступили исполнявший обязанности председателя оккупационного правительства Кадыров-младший и Путин, и Грозный не переименовали(Citation: 941).

    К апрелю 2006 года оккупационная администрация переименовала парк культуры имени Кирова в Грозном в парк Кадырова(Citation: 1183).

    5 октября 2008 года глава оккупационной администрации Кадыров-младший указом назвал проспектом Владимира Путина центральную улицу Грозного - проспект Победы, который при Ичкерии носил имя Авторханова(Citation: 1481)(Citation: 2177)(Citation: 27)(Citation: 986).
    Поставленный Россией мэр Грозного Хучиев сказал агентству «Интерфакс», что так отмечены «выдающиеся заслуги Путина в деле борьбы с терроризмом» (так Россия называла свою войну против независимой Ичкерии)(Citation: 1481).
    Кадыров-младший при подписании указа сказал агентству «Интерфакс»: «Как чеченец, как мусульманин заявляю, что готов, если потребуется, умереть за Владимира Путина»(Citation: 1481).
    Источники расходятся: по другим данным, имя Авторханова носил проспект Ленина(Citation: 941).
