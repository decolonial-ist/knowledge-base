  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Офицеры российской военной разведки и посланцы оккупационной администрации Кадырова-младшего убивали чеченцев за границей, а российские прокуроры требовали от других государств выдать бежавших.

    Генеральная прокуратура России обвиняла руководителей Ичкерии и бежавших чеченцев в «терроризме» или «бандитизме», объявляла их в розыск через Интерпол, международную организацию полиций, и просила государства, где они укрылись, выдать их (подробнее: «Фабрикация преступников»)(Citation: 27)(Citation: 1849)(Citation: 940). 6 марта 2006 года президент России Путин подписал федеральный закон № 35-ФЗ «О противодействии терроризму».
    Закон позволил российским войскам и ФСБ действовать против тех, кого Россия называла террористами, и за её границами(Citation: 1101).

    В августе 2002 года пятеро чеченцев сдались грузинским пограничникам, а 4 октября, к встрече президента России Путина с президентом Грузии Шеварднадзе 6 октября в Кишинёве, столице Молдовы, Грузия без суда выдала их российской ФСБ(Citation: 1829)(Citation: 3122). 18 февраля 2004 года суд в Ставрополе приговорил четверых из них к срокам от полутора до десяти лет заключения, но приговор отменили, и весной 2005 года дела всех пятерых ещё шли(Citation: 3122).
    В конце октября 2002 года датская полиция по запросу России арестовала в Копенгагене Ахмеда Закаева, представителя президента Ичкерии, но Дания отказалась его выдать. 13 ноября 2003 года суд в Лондоне отказал России в выдаче Ахмеда Закаева, и Великобритания дала ему убежище (подробнее: «Фабрикация преступников»)(Citation: 1849)(Citation: 1925)(Citation: 1501).

    13 февраля 2004 года в Дохе, столице Катара, российские спецслужбы убили взрывом Зелимхана Яндарбиева, который в 1996-1997 годах исполнял обязанности президента Ичкерии, а в 1999-2002 годах представлял её в исламских странах.
    С 2003 года он жил в Катаре, где ему не грозила выдача России.
    С сентября 1999 года Россия добивалась через Интерпол его ареста, а позже называла его организатором захвата заложников в московском театре на Дубровке в октябре 2002 года(Citation: 929)(Citation: 27)(Citation: 1101).
    Полиция Катара арестовала в Дохе первого секретаря российского посольства Фетисова, Белашкова и Богачёва, трёх офицеров российской военной разведки (ГРУ), и обвинила их в том, что они подложили бомбу.
    Россия послала в Катар секретаря Совета безопасности Иванова требовать освобождения офицеров, а президент Путин звонил эмиру.
    В московском аэропорту «Шереметьево» российские силовики задержали двух граждан Катара.
    В марте 2004 года Катар отпустил в Россию Фетисова, у которого был дипломатический иммунитет, а 30 июня суд Катара приговорил Белашкова и Богачёва к пожизненному заключению.
    В декабре 2004 года Катар отправил осуждённых в Москву отбывать срок, а Россия освободила граждан Катара(Citation: 1101)(Citation: 3121)(Citation: Глава МИД Катара напомнит Путину о «долгах» по делу Зелимхана Яндарбиева 2006).
    В Москве обоих офицеров ГРУ встретили как героев и выпустили на свободу(Citation: 1100).
    Лекарев, бывший офицер советского КГБ (предшественника современной ФСБ), в 2007 году сказал в фильме австралийской программы Dateline «Who Killed Litvinenko?»: «Арестованные после этой акции сказали, что получили взрывное устройство дипломатической почтой, а это значит, что Россия использует терроризм как государственную политику»(Citation: 1100).
    Александр Литвиненко, бывший офицер ФСБ, 11 марта 2005 года сказал в интервью «Голосу Америки»: «они [российские спецслужбы] взорвали Яндарбиева в Катаре»(Citation: 1094).
    В 2016 году британское расследование гибели Александра Литвиненко назвало убийство Зелимхана Яндарбиева самым известным политическим убийством, которое Россия в те годы совершила за своими границами(Citation: 1101).

    Финские депутаты пригласили Ахмеда Закаева, представителя президента Ичкерии Аслана Масхадова, в Хельсинки на встречи о мире 20 и 21 января 2005 года.
    Ахмед Закаев не прилетел, потому что министр юстиции Финляндии Коскинен не гарантировал ему безопасности от российских спецслужб. 1 февраля министр подтвердил, что по требованию России Ахмеда Закаева арестовали бы(Citation: 2000)(Citation: 2001).
    В начале августа 2006 года украинская милиция арестовала в Крыму Беслана Гадаева, чеченца, который жил там беженцем, и Украина выдала его по запросу России.
    В российском отделе милиции Грозненского района Ичкерии его пытали и заставили признаться в трёх убийствах, которых он не совершал, а российский суд приговорил его к 19 годам заключения (подробнее: «Пытки и истязания»)(Citation: 2067)(Citation: 3125).

    В 2003 году силовики Кадырова-младшего, тогда начальника службы безопасности оккупационной администрации, захватили Умара Исраилова, бойца Вооружённых сил Ичкерии, и пытками заставили его служить в охране Кадырова-младшего (подробнее: «Принудительная мобилизация»)(Citation: 940).
    Умар Исраилов бежал из Ичкерии, с 2005 года жил в Австрии и пожаловался в Европейский суд по правам человека на Кадырова-младшего.
    В июле 2007 года Россия попросила Австрию выдать его по обвинению в «терроризме», и Австрия отказала(Citation: 940)(Citation: 945).
    В июне 2008 года в Вене посланец Кадырова-младшего Курмакаев уговаривал Умара Исраилова вернуться в Ичкерию и отозвать жалобу, обещая работу и деньги. 10 июня Курмакаев рассказал австрийской полиции, что служит в отделе оккупационной администрации, который возвращает бежавших за границу чеченцев.
    По словам Курмакаева, глава оккупационной администрации Кадыров-младший велел привезти Умара Исраилова(Citation: 940)(Citation: 945).
    В конце 2008 года Кальтенбруннер, знакомый Кадырова-младшего, собрал в Австрии группу, которая с 15 декабря следила за домом Умара Исраилова.
    Группа собиралась похитить его, вывезти через Чехию и Польшу в Россию и передать оккупационной администрации, а если не выйдет - убить. 13 января 2009 года у супермаркета в Вене участники группы Богатыров и Ешуркаев напали на Умара Исраилова.
    Он вырвался, и Богатыров застрелил его в спину.
    Умар Исраилов умер в больнице(Citation: 945). 24 октября 2023 года Европейский суд по правам человека признал, что Россия «не приложила минимальных усилий», чтобы помочь Австрии расследовать убийство.
    Генеральная прокуратура России так и не допросила Кадырова-младшего и других свидетелей, о которых просил венский суд (подробнее: «Безнаказанность исполнителей»)(Citation: 940).
