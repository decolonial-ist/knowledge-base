  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские спецслужбы, военные, а потом и силовики оккупационной администрации Кадырова убивали, похищали или сажали руководителей Ичкерии, её переговорщиков, противников войны, а также глав сёл, которые защищали односельчан от облав.

    22 сентября 1999 года Россия отправила в Интерпол, международную полицейскую организацию, список тех, кого назвала организаторами нападения на подконтрольный России Дагестан в августе 1999 года, и внесла в него Зелимхана Яндарбиева, бывшего исполнявшего обязанности президента Ичкерии(Citation: 929). 2 марта 2000 года российские следователи по делу № 59027 о «вооружённом мятеже» заочно обвинили Аслана Масхадова, избранного президента Ичкерии, и объявили его в розыск(Citation: 791).

    15 марта 2000 года начальник Генерального штаба России Квашнин объявил, что российские войска будут убивать или захватывать руководителей Вооружённых сил Ичкерии(Citation: 1603).
    Спецподразделения ФСБ и МВД России через осведомителей узнавали, в каком доме прячется командир защитников, и ехали его захватить или убить(Citation: 1129).

    25 июля 2002 года Россия приняла закон № 114-ФЗ «О противодействии экстремистской деятельности», в котором экстремизмом названа любая деятельность против территориальной целостности России, а значит, и борьба за независимость Ичкерии(Citation: 286).
    С 2002 года служба безопасности главы оккупационной администрации Кадырова преследовала сторонников Ичкерии и неформальных лидеров сёл, которые могли агитировать против него на выборах(Citation: 1824).

    21 октября 1999 года российские милиционеры задержали в Москве Майрбека Вачагаева, представителя президента Ичкерии, и обвинили в хранении оружия, а 9 июня 2000 года суд в Москве дал ему три года и освободил по амнистии (подробнее: «Фабрикация преступников»)(Citation: 931)(Citation: 1485).

    25 января 2000 года около 20 российских военных назвали по имени и увели из дома в Калиновской, станице на севере Ичкерии, Зуру Битиеву, участницу антивоенных протестов, и её сына Идриса Идуева.
    В фильтрационном лагере в Чернокозове, селе на севере республики, российские охранники били её прикладами, а на допросах спрашивали о «марше мира» на Москву, в котором она участвовала, и о том, кто его оплатил (подробнее: «Пытки и истязания»). 17 февраля охрана отправила Зуру Битиеву без сознания в больницу (подробнее: «Медицинская и гуманитарная блокада»), а 26 февраля отпустила сына без обвинений. 25 апреля 2000 года Зура Битиева пожаловалась в Европейский суд по правам человека.
    В ночь на 21 мая 2003 года 11 человек в форме спецназа ворвались в её дом, заклеили ей рот скотчем и застрелили Зуру Битиеву, её мужа Рамзана Идуева, сына Идриса Идуева и брата Абубакара Битиева.
    Европейский суд в 2007 году признал, что семью казнили без суда представители российского государства, и написал, что убийство Зуры Битиевой после её жалобы в суд, так и не раскрытое, «неизбежно оказало «сдерживающее воздействие» [удерживало от жалоб] на других нынешних и будущих заявителей в Суд»(Citation: 775).

    2 февраля 2000 года российские войска арестовали в больнице Алхан-Калы, села к западу от Грозного, Умара Хамбиева, министра здравоохранения Ичкерии, а после лагеря и домашнего ареста в Гудермесе Умар Хамбиев восемь месяцев скрывался в горном селе (подробнее: «Медицинская и гуманитарная блокада»)(Citation: 1381)(Citation: 1377).
    В марте 2000 года российские спецслужбы объявили, что захватили Салмана Радуева, командира Вооружённых сил Ичкерии(Citation: 1576). 25 декабря 2001 года Верховный суд Дагестана дал ему пожизненный срок, и 14 декабря 2002 года Салман Радуев умер в колонии в Соликамске на Урале (подробнее: «Фиктивные суды»)(Citation: 1534)(Citation: 1469). 17 мая 2000 года российские военные увели из дома в Шали, городе к юго-востоку от Грозного, Руслана Алихаджиева, председателя парламента Ичкерии в 1997-1999 годах, который, по словам матери, в 1999 году пытался организовать переговоры о мире, и Европейский суд в 2007 году возложил на Россию ответственность за его смерть (подробнее: «Похищение людей»)(Citation: 1438).

    25 февраля 2001 года в Урус-Мартане, городе к юго-западу от Грозного, около десяти вооружённых сотрудников российских силовых структур в масках зарезали у порога дома Мусу Мадаева.
    В 1994-1996 годах Муса Мадаев устраивал митинги за вывод российских войск, а потом трижды отказался сотрудничать с российскими силовиками, которые его задерживали(Citation: 1581). 1 мая 2001 года Сайхан Чукаев, глава администрации Гелдагана, села к востоку от Грозного, обвинил военного коменданта района полковника Кислова в исчезновении своего сына.
    Тем же вечером приехавшие на машине люди застрелили Сайхана Чукаева и ехавшего с ним чеченца, очевидцы узнали среди нападавших коменданта, а 26 мая и в начале июня российские военные убили троих братьев Сайхана Чукаева(Citation: 1581). 13 декабря 2001 года оккупанты на блокпосту у Аргуна, города к востоку от Грозного, обстреляли машину и застрелили Луизу Бетергериеву, сотрудницу Общества российско-чеченской дружбы(Citation: 816).

    20 апреля 2002 года сотрудники ФСБ похитили в Шали Ислама Хасуханова, который в конце 1999 года от имени Аслана Масхадова добивался переговоров с российскими военными. 25 февраля 2003 года суд во Владикавказе, городе в подконтрольной России Северной Осетии, дал ему 12 лет (подробнее: «Фиктивные суды»)(Citation: 1810)(Citation: 1898)(Citation: 1871).

    С 25 по 30 апреля 2002 года при облаве в Алхан-Кале российские военные под командой генерала Броницкого девять раз обыскивали дом Малики Умажевой, главы администрации села, и требовали подписать акт, в котором убитых военными и задержанных сельчан записали в бойцы Вооружённых сил Ичкерии (подробнее: «Ложь о собственных действиях»)(Citation: 953). 23 мая подполковник Никитин, начальник отдела ФСБ в Грозненском районе, написал главе оккупационной администрации района Жамалдаеву, что протесты сельчан при облавах ведёт Малика Умажева, и попросил «рассмотреть вопрос об отстранении с занимаемой должности»(Citation: 1847).
    Летом 2002 года Малика Умажева рассказала журналистке «Новой газеты» Анне Политковской, как расстреляли Рамзана Гасаева, одного из трёх прежних глав села, убитых с начала войны: «В семь вечера, когда село было перекрыто военными полностью, включая улицы и переулки…
    Убийцы подъехали на мотоцикле, расстреляли Рамзана и укатили через все их «кольца»!»(Citation: 1843). 9 сентября 2002 года Жамалдаев уволил Малику Умажеву(Citation: 1847).
    В ночь на 30 ноября 2002 года четверо российских военных со снайперскими винтовками ворвались в её дом с криком «Где ваххабиты?», увели Малику Умажеву в сарай, пообещав её племянницам, что она вернётся, и застрелили её(Citation: 1581).
    Источники расходятся: одни пишут о ночи на 30 ноября, другие - о 1 декабря(Citation: 1847).
    В докладе Парламентской ассамблеи Совета Европы в январе 2003 года сказано, что три международные и одна российская правозащитные организации обвиняют в убийстве российские войска и связывают его с её публичными словами о преступлениях военных (подробнее: «Безнаказанность исполнителей»)(Citation: 285).

    13 февраля 2004 года в Дохе, столице Катара, российские спецслужбы, как пишут правозащитники «Мемориала», убили взрывом Зелимхана Яндарбиева, бывшего главу Ичкерии (подробнее: «Преследование за рубежом»)(Citation: 27). 8 марта 2005 года в Толстой-Юрте, селе к северу от Грозного, спецназ ФСБ убил Аслана Масхадова, избранного президента Ичкерии (подробнее: «Переговоры как прикрытие нападения»)(Citation: 791). 4 июля 2005 года у села Бугарой на юге Ичкерии трое вооружённых людей в масках с удостоверениями российской военной разведки в упор застрелили Абдул-Азима Янгульбаева, главу администрации соседнего села Зумсой, который весной передал прокурорам и правозащитникам рапорт бойца российского спецназа, где названы офицеры группы, обстрелявшей дома в Зумсое и убившей одного чеченца.
    Глава Регионального оперативного штаба российских силовиков Еделев в тот же день назвал убийство «провокацией переодетых бандитов» (подробнее: «Ложь о собственных действиях»)(Citation: 1581).

    17 июня 2006 года в Аргуне сотрудники ФСБ и МВД при проверке дома, на который указал осведомитель, убили гранатой Абдул-Халима Садулаева, президента Ичкерии после Аслана Масхадова(Citation: 27).

    26 февраля 2004 года Европейский парламент в рекомендации Совету ЕС выразил тревогу из-за исчезновений и убийств заявителей в Европейский суд и их родных(Citation: 551).
    В ноябре 2006 года правозащитный центр European Human Rights Advocacy Centre сообщил комитету Парламентской ассамблеи Совета Европы о 23 случаях расправ с заявителями из России, от угроз до убийства заявителей и их близких.
    Угрожали российские военные, милиционеры, сотрудники ФСБ и прокуроры, и ни одно убийство заявителей не раскрыто(Citation: 1209).
    Правозащитники Международной федерации за права человека FIDH и российского «Мемориала» в 2007 году написали, что после закона об экстремизме сторонники независимости Ичкерии не могли добиваться её мирно.
    Им оставалось воевать или, скрывая взгляды, идти на службу к Кадырову-младшему, председателю оккупационного правительства, который строил в республике свою личную власть(Citation: 286).

    13 января 2009 года в Вене не меньше четырёх человек из группы Кальтенбруннера, сторонника Кадырова-младшего среди чеченцев Австрии, устроили засаду на Умара Исраилова и застрелили его.
    В 2007 году Умар Исраилов пожаловался в Европейский суд на Кадырова-младшего, главу оккупационной администрации, а в июне 2008 года его посланник Курмакаев требовал у Умара Исраилова отозвать жалобу (подробнее: «Преследование за рубежом»)(Citation: 940)(Citation: 2162).
