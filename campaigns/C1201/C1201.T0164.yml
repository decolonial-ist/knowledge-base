  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские военные и милиционеры грабили дома чеченцев при обысках и задержаниях, а награбленное вывозили на военной технике.

    При «зачистках» (так россияне называли обыски домов и задержания чеченцев) российские войска окружали село, а солдаты и милиционеры обыскивали дома.
    Солдаты забирали ценности, деньги, технику, а часто еду, матрасы, окна и половицы.
    Военные вывозили награбленное из республики на грузовиках(Citation: 1450).
    После грабежа солдаты нередко поджигали или взрывали дома (подробнее: «Тотальное уничтожение инфраструктуры»)(Citation: 1581).

    За то, чтобы не отправлять мужчин в фильтрационные лагеря, военные брали с семей деньги (подробнее: «Административная коррупция и вымогательство»)(Citation: 1210).
    Военные заставляли ограбленных чеченцев подписывать расписки, что претензий у них нет(Citation: 1581).

    В ноябре 1999 года российские солдаты вывозили на военных машинах еду и ковры из домов чеченцев в Серноводске и Ассиновской, сёлах на западе Ичкерии(Citation: 927).

    1 декабря 1999 года солдаты 15-го мотострелкового полка российской армии под командованием начальника штаба полка Воронова захватили Алхан-Юрт, село к юго-западу от Грозного, а контрактники внутренних войск МВД России (предшественников современной Росгвардии) блокировали его(Citation: 770)(Citation: 1581).
    Российские командиры разрешили оставшимся сельчанам выходить из подвалов только с 11 до 13 часов и с белым флагом, и, по выводу правозащитников, так военным было проще грабить(Citation: 1581).
    «Рустам Р.» (имя изменено), чеченец из Алхан-Юрта, 16 декабря рассказал Human Rights Watch, как солдаты сначала выносили собранные сельчанами сумки, а потом пригнали пустые грузовики «Урал»: «они взяли все без исключения: холодильники, ковры и телевизоры.
    Они вывезли все и подожгли дом».
    Военные складывали награбленное в домах, где жили командиры, и в солдатских палатках, а потом вывозили на военных машинах.
    Солдаты застрелили Хамида Хазуева, который просил не грабить его дом (подробнее: «Массовые убийства гражданских»)(Citation: 770).

    11 декабря 1999 года «Леча Л.» (имя изменено) видел на улице Демильханова, как полковник с солдатами грузил вещи сельчан в грузовик, и пересказал Human Rights Watch его ответ сотруднику ФСБ: «Нам дали это село; нам дали его на растерзание; мы взяли его штурмом, нам его дали на две недели».
    В докладе Human Rights Watch сказано, что такой грабёж средь бела дня невозможен «без ведома или, как минимум, молчаливого согласия российских командующих».
    Российская военная прокуратура открыла дело о событиях в селе и закрыла его, сославшись на отсутствие доказательств (подробнее: «Безнаказанность исполнителей»)(Citation: 770).

    В январе 2000 года бойцы внутренних войск МВД России забрали у чеченцев в Старых Атагах, селе к югу от Грозного, деньги, бытовую технику и 37 машин(Citation: 1512).
    В феврале в Новых Алдах, посёлке на южной окраине Грозного, милицейский спецназ и российские солдаты под угрозой расстрела требовали у чеченцев деньги и золото(Citation: 817)(Citation: 280)(Citation: 1581).
    В том же месяце российские солдаты грабили и поджигали дома чеченцев в Дуба-Юрте, селе к югу от Грозного(Citation: 1684).
    В марте после штурма Гой-Чу, села к юго-западу от Грозного, колонны российских солдат вывозили из села разграбленное имущество и продавали его в соседних сёлах за водку(Citation: 3308).
    Весной заместитель начальника российского отдела милиции Ягофаров забрал и продал машину Алаудина Садыкова в Грозном(Citation: 286)(Citation: 782).
    В августе российские военные грабили дома чеченцев в Турты-Хуторе, селе на юго-востоке Ичкерии(Citation: 1581)(Citation: 1503).
    В декабре российские военные 245-го полка избили чеченскую семью в Алхан-Юрте и забрали деньги и золото(Citation: 1503).

    В июле 2001 года российские солдаты грабили дома чеченцев в Серноводске и Ассиновской, а в школе Ассиновской забрали учительскую зарплату(Citation: 814).

    26 ноября 2001 года офицеры в масках из дивизии особого назначения внутренних войск МВД России при «зачистке» Автуров, села к юго-востоку от Грозного, крушили дома и грузили вещи сельчан в два бронетранспортёра с замазанными грязью номерами.
    Заместитель российского прокурора района Бердиев, которого военные по приказу генерального прокурора России позвали следить за законностью, открыл люки и сфотографировал награбленное.
    Бердиев рассказал Анне Политковской, журналистке «Новой газеты», что офицеры передёрнули затворы: «Как ты смеешь?
    Это наши трофеи»(Citation: 1767).

    Российские милиционеры отказались арестовать грабителей, и только российский военный комендант района генерал Нахаев привёз на допрос майора, капитана и старшего лейтенанта дивизии. 27 ноября прокуроры обыскали дивизию и изъяли, по словам Бердиева, около 30 % награбленного.
    Прокуроры возбудили дело о разбое по трём домам, но офицеры остались служить, а прокуроров района военные больше на облавы не звали(Citation: 1767).

    В декабре 2001 года солдаты дивизии особого назначения внутренних войск МВД России крушили дома на улице Мамакаева в Автурах и сорвали украшения с семьи Сангараевых(Citation: 1767).
    В том же месяце российские войска забрали у стариков в Цоцин-Юрте, селе к востоку от Грозного, пенсии(Citation: 1774). 27 марта 2002 года командующий оккупационными войсками Молтенской в приказе № 80 признал, что российские военные грабили чеченцев(Citation: 946).
    В мае 2002 года российские войска генерала Броницкого отняли у чеченцев в Автурах машины и электромоторы(Citation: 954).

    В ноябре 2004 года силовики Кадырова-младшего забрали у Шарпуди Исраилова в Грозном 178 000 рублей(Citation: 940).
    В январе 2005 года российские десантники загрузили в вертолёты деньги и золото из домов в Зумсое, горном селе на юге Ичкерии(Citation: 286)(Citation: 1460).
    В июле 2008 года вооружённые люди в масках, по выводу Human Rights Watch - силовики Кадырова-младшего, вывезли вещи из дома чеченской семьи в Хиди-Хуторе, селе на востоке Ичкерии, и сожгли дом(Citation: 287).

    23 ноября 1999 года Холли Картнер, директор Human Rights Watch по Европе и Центральной Азии, назвала грабёж нарушением международного гуманитарного права и потребовала его прекратить(Citation: 927).
    В 2007 году «Мемориал» и Международная федерация прав человека сообщили, что к середине 2005 года российские суды вынесли 103 приговора военным за грабежи и другие преступления против чеченцев, а реальные сроки получили 27 из них (подробнее: «Безнаказанность исполнителей»)(Citation: 286).

    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что российские военные грабили при подавляющем большинстве облав.
    С 1999 по 2005 год правозащитники насчитали не меньше 252 грабежей, из них 90 - при облавах, 122 - при задержаниях вне облав, 19 - при убийствах и пытках, 21 - без насилия, кроме угроз.
    По выводу авторов, грабители знали, что их преступления против чеченцев, скорее всего, никто не станет расследовать(Citation: 1581).
    Правозащитники «Мемориала» перечислили грабежи по сёлам и датам в хрониках насилия(Citation: 1503).

    С конца 2002 года командование оккупационных войск устраивало облавы всё реже (подробнее: «Террор»), и массовые грабежи сёл почти прекратились.
    Правозащитники насчитали 48 облав с грабежами в 2001 году, 20 - в 2002 году, одну - в 2003 году и по две - в 2004 и 2005 годах(Citation: 1581).
    Российские силовики грабили и дальше - при задержаниях чеченцев у них дома (подробнее: «Похищение людей»)(Citation: 1581). 16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
