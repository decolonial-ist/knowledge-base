  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты, а позже силовики оккупационной администрации требовали от чеченских сёл выдавать бойцов Вооружённых сил Ичкерии, от семей - возвращать сыновей, ушедших к вооружённому сопротивлению, а за отказ обстреливали сёла или жгли дома.

    Командиры западной группировки оккупационных войск генерала Шаманова требовали от глав сёл сообщать о приходе бойцов Ичкерии и не пускать их в сёла(Citation: 278).
    После нападений защитников Ичкерии у сёл российские военные требовали от старейшин и сельчан выдать бойцов, грозя обстрелять или сжечь село(Citation: 1503)(Citation: 1512)(Citation: 1858).

    С 2004 года силовики оккупационной администрации требовали от семей вернуть ушедших сыновей и брали родных в заложники, пока боец не сдастся (подробнее: «Захват заложников»)(Citation: 820).
    В 2007-2008 годах районные отделы милиции оккупационной администрации вместе с местными главами раз за разом вызывали родителей ушедших и грозили, что семье будет хуже, если сын не вернётся домой.
    Силовики жгли дома семей, чьи сыновья не вернулись (подробнее: «Коллективные наказания»)(Citation: 287).

    4-7 февраля 2000 года российские войска бомбили Катыр-Юрт, село к юго-западу от Грозного, куда отошли из Грозного защитники Ичкерии (подробнее: «Неизбирательные нападения»).
    Генерал Шаманов, командовавший западной группировкой оккупационных войск, винил в бомбёжке сельчан, которые пустили бойцов в село(Citation: 278). 24 июля 2000 года, после подрыва российской боевой машины пехоты в шести километрах от Шуани, села на юго-востоке Ичкерии, российские военные потребовали от сельчан за полчаса выдать тех, кто её взорвал, иначе «вызовут авиацию и сожгут село».
    Российские вертолёты в это время уже обстреливали село (подробнее: «Коллективные наказания»)(Citation: 1503).

    18 мая 2001 года, после взрыва российского армейского грузовика у Старых Атагов, села к югу от Грозного, генерал российской 205-й бригады пригрозил старейшинам при новых нападениях «открывать огонь по селу», а 21 мая российские части к северу от села потребовали от сельчан «выдать боевиков» (так россияне называли Вооружённые силы Ичкерии), иначе обстрелы продолжатся.
    До 21 июня российская артиллерия по ночам била по Старым Атагам и разрушила не меньше трёх домов, а повредила десятки(Citation: 1512).

    19 июня 2001 года российские войска окружили Алхан-Калу, село к западу от Грозного, и до 25 июня устраивали там «зачистку» (так россияне называли обыски домов и задержания чеченцев).
    Военные искали полевого командира Арби Бараева, уроженца села. 22 июня российские солдаты задержали Бислана Хасаева и посадили в яму у комендатуры. 23 июня военные увезли старика, жившего рядом с домом, где накануне шёл бой, вместе с сыновьями и внуками, обвинили их в укрывательстве командира и пытали током. 24 июня российские солдаты нашли тело Арби Бараева и только после этого отпустили семью старика.
    В тот же день к матери Бислана Хасаева Марьят Хасаевой приехали российские солдаты на двух бронетранспортёрах.
    Она рассказала Human Rights Watch, что старший из них пообещал вернуть Бислана и её второго сына Аслана, которого военные задержали ещё 29 апреля, и назвал условие: «Выдай нам Бараева или его труп».
    Солдаты дали ей четыре часа и сказали, что живыми сыновей она не увидит. 25 июня Марьят Хасаева откопала у комендатуры могилу глубиной около 30 сантиметров, где лежал Бислан с тремя пулевыми ранами и вывернутой за спину рукой.
    Аслан Хасаев пропал без вести(Citation: 814).

    12 февраля 2002 года, через час после того как бойцы сопротивления застрелили в Старых Атагах четверых сотрудников ФСБ, российские военные потребовали от сельчан «выдать трупы убитых и тех, кто виноват в их гибели».
    Сельчане не смогли выполнить требование, и до 19 февраля российские войска «зачищали» село, а троих задержанных братьев убили и выбросили у соседнего Мескер-Юрта (подробнее: «Убийство пленных и задержанных»)(Citation: 1512).
    В ночь на 26 января 2003 года российские военные в Ачхой-Мартане, селе к юго-западу от Грозного, избили двух чеченцев, одного из них глухонемого, до утра возили их по селу на полу машин и выбросили.
    Утром комендант Ачхой-Мартана Бураев сказал старейшинам, что такие налёты прекратятся, если сельчане сами будут «выдавать боевиков»(Citation: 1858).

    23 сентября 2005 года командир второго полка милиции оккупационной администрации Ясаев с 15 вооружёнными подчинёнными собрал сельчан у мечети Новых Атагов, села к югу от Грозного.
    Ясаев назвал десять семей села «ваххабитскими» (так силовики Кадырова-младшего называли бойцов сопротивления с их родными) и потребовал, чтобы сельчане сами с ними расправились(Citation: 286).
    В мае 2007 года министр внутренних дел оккупационной администрации Алханов вместе с заместителем председателя оккупационного правительства Делимхановым собрал родственников молодых чеченцев, ушедших к сопротивлению.
    Алханов назвал семьи пособниками, раз они кормят сыновей в лесу, и потребовал, чтобы родные отвечали и за то, что не доносят на сыновей(Citation: 287).

    24 июля 2008 года глава оккупационной администрации Кадыров-младший на совещании в Гудермесе, городе к востоку от Грозного, сказал главам районов, начальникам районной милиции и духовенству, что многие начальники - родственники молодых людей, ушедших в лес к вооружённому сопротивлению, и пригрозил: «если в течение десяти дней эта молодежь не будет возвращена домой, все начальники и руководители пойдут под суд»(Citation: 944). 31 июля глава оккупационной администрации Аргуна, города к востоку от Грозного, Темирбаев вызвал повестками 17 семей, чьи сыновья ушли к сопротивлению, а 1 августа велел им за два дня уехать из города, если они не уговорят сыновей сдаться.
    Родные объясняли Темирбаеву, что не отвечают за взрослых сыновей и не знают, где они.
    Темирбаев освободил от выселения три семьи. 4 августа силовики оккупационной администрации сожгли дом одной из семей (подробнее: «Коллективные наказания»), а к остальным пришли вооружённые люди, назвавшиеся сотрудниками городской милиции, проследить за выселением(Citation: 287).
    Две семьи уехали к родственникам.
    Марет, мать одного из ушедших, увезла семью в другое село и рассказала правозащитникам «Мемориала»: «Я не могу отвечать за своего сына, он у меня разрешения не спрашивал». 6 августа Темирбаев при имаме и силовиках отменил выселение, но велел родителям сделать всё, чтобы вернуть сыновей, а тем, кто не хочет, посоветовал уйти к детям в горы.
    Родители записали на камеру обращение к сыновьям сложить оружие (подробнее: «Принудительное публичное покаяние»)(Citation: 944).

    9 августа 2008 года глава оккупационной администрации Кадыров-младший на совещании оккупационного правительства назвал семьи ушедших соучастниками и поручил районным отделам милиции и главам районов «усилить работу» с родственниками бойцов. 16 августа мэр Грозного Хучиев при заместителе министра внутренних дел оккупационной администрации Тагирове собрал родственников бойцов, потребовал «находить и возвращать родственников домой» и пригрозил бедой им и их потомству(Citation: 287).

    В 2009 году Human Rights Watch написала, что в 2007-2008 годах руководители оккупационной администрации Кадырова-младшего не раз заявляли, что семьи, которые не уговорят своих родных-бойцов сдаться, должны за это ответить.
    Правозащитники расценили эти заявления как прямую угрозу родственникам и команду силовикам(Citation: 287).

    В начале марта 2009 года глава Шалинского района, начальник районной милиции Даудов и представители духовенства на собрании в Шали, городе к юго-востоку от Грозного, говорили родителям ушедших, что за сыновей отвечают семьи.
    Юсуп Эбишев, отец одного из ушедших, возразил им. 12 марта силовики оккупационной администрации во второй раз за полгода подожгли дом в его дворе (подробнее: «Коллективные наказания»)(Citation: 287)(Citation: 943).
