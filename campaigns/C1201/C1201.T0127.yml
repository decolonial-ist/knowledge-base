description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Российские военные грозили выселить чеченцев в Сибирь, а из горных сёл выгоняли облавами, грабежом и обстрелами, пока там не оставалось людей.

    При облавах в горных сёлах российские военные требовали от чеченцев уйти, грабили дома и школы, забивали скот и оскверняли мечети, а потом приходили снова(Citation: 1854)(Citation: 2036).
    Российские войска постоянно обстреливали сёла в горах (подробнее: «Неизбирательные нападения»)(Citation: 1581).

    Чеченцы, которых выгнали военные, уходили к родственникам на равнину или в лагеря беженцев в подконтрольной России Ингушетии.
    Российские ведомства и оккупационная администрация не давали им статуса переселенцев, гуманитарной помощи и мест во временном жилье(Citation: 1854).

    5 февраля 2000 года в Новых Алдах, посёлке на южной окраине Грозного, российские омоновцы и солдаты убивали чеченцев, а один из военных, проверяя паспорта, сказал собранным на перекрёстке людям: «Выселять вас будем» (подробнее: «Массовые убийства гражданских»)(Citation: 817).
    В конце декабря 2000 года дознаватель российского отдела милиции в Урус-Мартане, городе к юго-западу от Грозного, отпуская задержанного чеченца, сказал, что в Сибири заканчивают строить «резервации для чеченцев», и добавил: «В этом году начнут вас всех выселять»(Citation: 1503).

    10-15 октября 2001 года при облаве в Цоцин-Юрте, селе к востоку от Грозного, российские солдаты грозили чеченцам: «До весны вас будем „чистить“ [обыскивать дома и задерживать людей], а потом всех вышлем в Сибирь» и «Уезжайте, пока всех вас не перебили» (подробнее: «Террор»)(Citation: 1581).
    При новой облаве в Цоцин-Юрте, с 30 декабря 2001 года по 3 января 2002 года, солдат кричал пожилой чеченке: «Мы вас доведем до того, что вы сами в Сибирь будете проситься»(Citation: 1774).

    В 2002 году российские военные выгнали чеченцев из Центороя, горного села Ножай-Юртовского района на юго-востоке Ичкерии.
    В начале войны в Центорое жили 138 семей.
    Алавди Кудусов, почти 80-летний бывший директор сельской школы, в январе 2003 года рассказал корреспонденту «Новой газеты» Анне Политковской, что военные приходили и требовали: «Уходите отсюда, вы тут только боевиков [так россияне называли бойцов Вооружённых сил Ичкерии] кормите».
    Солдаты грабили дома, забирали и расстреливали коров, которыми кормились семьи. 6 августа 2002 года военные забрали из дома и расстреляли 25-летнего Магомеда Алиева (подробнее: «Убийство пленных и задержанных»).
    Осенью оккупанты стали чаще требовать, чтобы чеченцы ушли, и семьи, которые ещё оставались, увезли из села последних 31 ребёнка. 10 октября экипажи российских вертолётов обстреляли Центорой, а военные подожгли дом Алавди Кудусова (подробнее: «Тотальное уничтожение инфраструктуры»).
    В октябре сыновья увезли его в Новый Центорой, село Грозненского сельского района на равнине.
    К поздней осени 2002 года в Центорое оставались 30 семей, а к январю 2003 года - трое: лежачий больной, его жена и парень, который сторожил свой трактор.
    Большинство сельчан ушли к родным в Новый Центорой.
    Алавди Кудусов сказал журналистке: «Это вторая депортация».
    Глава оккупационной администрации Ножай-Юртовского района Гайербекова ответила ей: «Это не бегство, а обычное дело — старики уехали к своим детям на зиму»(Citation: 1854).

    С осени 2002 года российские войска облавами и обстрелами выгнали чеченцев из многих сёл Веденского, Ножай-Юртовского и Курчалоевского районов в горах на юге Ичкерии.
    Почти полностью опустели Верхние, Средние и Нижние Курчали, Гансолчу, Шерди-Мохк, Тазен-Кале, Гезинчу, Жани-Ведено, Ялхой-Мохк, Ахкинчу-Барзой, Джугурты, а из Гордали-Юрта, Бас-Гордали, Шуани, Малых Шуани, Турты-Хутора и Хашки-Мохка ушло большинство сельчан(Citation: 1581).

    Зимой 2005 года, после январской облавы, российские военные ещё дважды приходили в Зумсой, горное село на юге республики, разграбили школу, осквернили мечеть и забили скот (подробнее: «Террор»).
    Оккупанты объявили чеченцам, что жить им здесь не дадут, потому что в горах не должно остаться тёплых домов, где бойцы Ичкерии могли бы получить еду и кров(Citation: 2036).

    В марте 2003 года правозащитники «Мемориала» в обращении к Комиссии ООН по правам человека оценили число чеченцев, ушедших из горных сёл с осени 2002 года, в десятки тысяч.
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что российские военные добивались, чтобы чеченцы совсем покинули небольшие горные сёла на юге республики и защитники Ичкерии остались там без приюта и пищи.
    По их выводу, к осени 2002 года оккупанты этого добились(Citation: 1581).

    4 июля 2005 года трое вооружённых людей в масках с удостоверениями российской военной разведки застрелили главу администрации Зумсоя, который требовал вернуть похищенных сельчан и дать людям жить в селе (подробнее: «Нейтрализация оппозиции»)(Citation: 1581).
    После его убийства из Зумсоя ушли все чеченцы(Citation: 2036).
