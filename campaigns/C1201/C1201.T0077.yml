description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Оккупанты нападали на чеченские сёла и города, чтобы покарать чеченцев за действия защитников Ичкерии рядом с их домами.

    За подрывы, обстрелы блокпостов и нападения на российские колонны у села российские военные карали мирных чеченцев, которые там жили.
    Военные обвиняли сельчан в поддержке защитников Ичкерии(Citation: 1581).

    Сразу после подрыва российские части блокировали село, обстреливали дома, свозили чеченских мужчин на окраину и пытали, требуя назвать виновных в подрыве (подробнее: «Пытки и истязания»)(Citation: 1581).
    Оккупанты карали сёла, где защитники Ичкерии, по их данным, действовали активнее всего или пользовались наибольшей поддержкой(Citation: 1581).

    2 июля 2000 года после взрыва машины со взрывчаткой у базы МВД России в Аргуне, городе к востоку от Грозного, российские войска блокировали город и задержали больше 60 чеченцев, один из них умер от побоев(Citation: 1581). 24 июля после подрыва российской боевой машины пехоты у Шуани, села на юго-востоке Ичкерии, российские лётчики и артиллеристы разрушили дома чеченцев, а солдаты бросили двух мужчин в ямы воинской части(Citation: 1581)(Citation: 1503).
    В августе в Гехи, селе к юго-западу от Грозного, после подрыва российского бронетранспортёра солдаты 245-го полка и милиционеры убили четверых из 57 задержанных чеченцев, а трое пропали без вести(Citation: 1581).
    В декабре в Урус-Мартане, городе к юго-западу от Грозного, российские военные за обстрел автобуса с военными убили шестерых чеченцев(Citation: 1581).

    В марте 2001 года в Аргуне после того, как защитники Ичкерии ненадолго захватили местную телевизионную станцию, оккупанты задержали около 170 чеченцев, шестерых убили, а пятеро пропали без вести(Citation: 1581).
    В том же месяце в Ачхой-Мартане, селе к юго-западу от Грозного, после подрыва милицейского мусоровоза российские милиционеры из Воронежской области пытали током около десяти молодых чеченцев(Citation: 1581).
    В апреле после убийства полковника ФСБ оккупанты блокировали Цоцин-Юрт, село к востоку от Грозного, расстреляли из бронетранспортёра Хусейна Керимова, а трое задержанных пропали без вести(Citation: 1581).
    В мае российские войска объявили поводом нападение на своих солдат в Старых Атагах, селе к югу от Грозного, и задержали около 50 чеченцев в соседнем Чири-Юрте, а 16-летний юноша из задержанных домой не вернулся(Citation: 1581).
    В июне в Гехи после убийства главы оккупационной администрации села и его жены военные задержали не меньше 11 чеченцев и убили двоих(Citation: 1581).

    1 июля 2001 года у Серноводска, села на западе Ичкерии у границы с подконтрольной России Ингушетией, на фугасе подорвались пятеро российских силовиков(Citation: 814)(Citation: 1581).
    В ночь на 2 июля российские войска окружили Серноводск, где жили около 7000 чеченцев и 2611 беженцев.
    Утром солдаты забирали мужчин из домов и вагонов беженцев(Citation: 814).
    Никто в селе не сопротивлялся, но военные забрасывали дома гранатами(Citation: 1581).
    По подсчёту Арсамакова, главы оккупационной администрации села, 2 июля военные задержали 438 сельчан и 182 беженца.
    Учительница из Серноводска рассказала Human Rights Watch, как солдаты забирали двух её учеников, 14 и 15 лет: «Подъехали - полный БТР [бронетранспортёр]!
    Сидят они сверху, забит весь БТР.
    В масках!
    Вооружены.
    Они хватают этих детей»(Citation: 814).

    Солдаты били и пытали током других задержанных чеченцев на поле у мечети, а подростков вечером отпустили (подробнее: «Пытки и истязания»)(Citation: 814).
    К ночи военные отпустили большинство, а часть чеченцев увезли в российский отдел милиции в Ачхой-Мартане.
    Источники расходятся: одни пишут о 12 увезённых, другие - о больше чем ста(Citation: 814)(Citation: 1581).
    Апти Исигов и Зелимхан Умханов значились в списке отдела, но освобождённые их там не видели, и оба пропали без вести (подробнее: «Похищение людей»)(Citation: 814).

    3 июля 2001 года российские войска окружили танками станицу Ассиновскую, соседнюю с Серноводском, и задержали мужчин.
    Источники расходятся: одни пишут о 300 задержанных чеченцах, другие - о 600-800; одни называют поводом фугас 1 июля, другие - подрыв российского бронетранспортёра у станицы в день облавы(Citation: 814)(Citation: 1581). 4 июля солдаты велели отпущенным чеченцам уходить из станицы, и, по оценке одного из них, около 120 человек ушли пешком в сторону Ингушетии(Citation: 814). 9 июля правозащитники «Мемориала» назвали обе облавы «карательной акцией»(Citation: 1581). 11 июля исполнявший обязанности командующего оккупационными войсками Молтенской, по сообщению сайта НТВ.Ru, сказал о тех, кто проводил облавы: «совершили беспредел, как Мамай [ордынский полководец, разорявший земли] прошел, и сделали вид, что ничего не знают»(Citation: 1522).

    25-27 июля 2001 года российские войска блокировали Цоцин-Юрт и задержали 73 чеченца, не меньше 26 из них пытали, а пятеро пропали без вести.
    Правозащитники пишут, что военные карали сельчан за отказ сотрудничать, а российский офицер заявил им: «Выдавайте ваших бандитов [так россияне называли Вооружённые силы Ичкерии], а то ваши невинные дети будут мучиться.
    Мы их будем бить и пытать…
    В следующий раз закроем село на целый месяц»(Citation: 1581).

    В феврале 2002 года в Старых Атагах после того, как защитники Ичкерии убили двух офицеров ФСБ, а ещё двух захватили, российские войска потребовали от сельчан выдать тела и виновных, а потом неделю пытали чеченцев, жгли дома и не дали родителям отвезти в больницу 8-месячного ребёнка, который умер(Citation: 1581).
    В марте после подрыва российского бронетранспортёра у Цоцин-Юрта военные увезли в фильтрационный лагерь около 300 чеченских мужчин и пытали всех(Citation: 1581). 16 августа в Тевзени, селе на юго-востоке Ичкерии, после подрыва фугаса российские военные держали 67 чеченцев в палатке над ямой и пытали часть из них током, требуя назвать виновных(Citation: 1581). 14 марта 2003 года чеченцы в Старой Сунже, посёлке у Грозного, задержали двух сотрудников ФСБ при закладке фугаса, а сельчане и раньше говорили, что военные сами закладывают фугасы ради повода(Citation: 1581).

    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что российский судья Кононов, по их мнению, первым применил к нападениям России на чеченцев слова «карательная экспедиция»: в особом мнении 31 июля 1995 года, в Первую Русско-Чеченскую войну.
    Авторы назвали «карательными операциями» 136 массовых и неизбирательных из тысяч облав 1999-2005 годов.
    Повод они знают в 32 случаях из 136, и в этих случаях, по их выводу, исполнители карали сельчан за предполагаемую поддержку защитников Ичкерии(Citation: 1581).

    С конца 2002 года оккупанты устраивали облавы реже и в основном в ответ на подрывы и нападения, силами ближайших частей, а после лета 2005 года правозащитники таких облав не фиксировали (подробнее: «Террор»)(Citation: 1581).

    16 апреля 2009 года директор ФСБ Бортников отменил в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии), но оккупационные войска не ушли, а у власти оставался кремлёвский ставленник Кадыров-младший(Citation: 901)(Citation: 895).
