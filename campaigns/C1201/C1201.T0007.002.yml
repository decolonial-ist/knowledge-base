description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Президент России Путин, российские министры и генералы всю войну объявляли вторжение освобождением чеченцев от «бандитов», а оккупацию - заботой о мирной жизни Ичкерии.

    15 октября 1999 года президент России Ельцин указом № 1380 поручил своему представителю в республике Кошману «оказание содействия народу Чечни» (подробнее: «Установка новой системы управления»)(Citation: 768).
    Законом от 2 января 2000 года № 16-ФЗ, поправкой к закону о бюджете на 1999 год, Россия разрешила перечислять деньги через представительство своего правительства в республике на нужды населения «на освобожденных территориях» (так в законе названы захваченные районы Ичкерии)(Citation: 676).
    Министерство обороны России и штаб Северо-Кавказского военного округа в октябре 1999 года завезли в захваченные северные районы Ичкерии продукты, одежду и школьные наборы, чтобы чеченцы поверили, что армия пришла уничтожать только «бандитов»(Citation: 1129).

    В октябре 1999 года председатель правительства России Путин говорил, что Россия делает ставку «на весь чеченский народ, который замучили бандиты»(Citation: 687). 6 декабря первый заместитель начальника Генерального штаба российской армии Манилов назвал листовки, которыми оккупанты требовали от горожан уйти из Грозного до 11 декабря, «гуманной акцией» (подробнее: «Ложный коридор»)(Citation: 1515). 15 декабря представитель правительства России в республике Кошман назвал захват Гудермеса, Ачхой-Мартана и Урус-Мартана российскими войсками освобождением «путем переговоров»(Citation: 1577).

    5 февраля 2000 года пресс-центр Объединённой группировки российских войск объявил «специальную операцию по освобождению от боевиков [так россияне называли Вооружённые силы Ичкерии] пригородных районов Грозного» - посёлков Алды и Черноречье.
    В этот день российские военные и омоновцы убили в Новых Алдах мирных чеченцев, 46 из них российская правозащитная организация «Мемориал» назвала поимённо (подробнее: «Массовые убийства гражданских»)(Citation: 817)(Citation: 951). 20 марта 2000 года исполнявший обязанности президента России Путин прилетел в Грозный и заявил, что, если российские войска уйдут, «начнется порабощение чеченского народа»(Citation: 1540).

    14 июня 2001 года МИД России назвал возвращение в республику международной миссии ОБСЕ знаком постепенной нормализации(Citation: 1381).
    В январе 2002 года Исаев, служащий представительства оккупационной администрации в Москве, сказал, что около 700 млн рублей из денег, выделенных правительством России на восстановление республики, до Ичкерии не дошли (подробнее: «Административная коррупция и вымогательство»)(Citation: 1227). 24 июня 2002 года, накануне встречи с лидерами западных стран на саммите «Большой восьмёрки», президент России Путин, по сообщению французской газеты Le Monde, впервые назвал войну трагедией и пообещал нормализацию в республике в течение года(Citation: 1381).

    24 декабря 2002 года депутаты в Москве предложили сделать 2003 год в Чеченской Республике годом мира и национального согласия(Citation: 285).
    В декабре оккупационное правительство республики заявило, что создало 120 тысяч рабочих мест, а работорговля и набеги на соседние регионы прекратились(Citation: 285).
    В докладе Парламентской ассамблеи Совета Европы от 29 января 2003 года сказано, что центр Грозного почти полностью разрушен(Citation: 285).

    27 февраля 2003 года президент России Путин на заседании Совета безопасности впервые пообещал возместить чеченцам ущерб от войны(Citation: 1217).
    В этот день председатель совета правозащитного центра «Мемориал» Олег Орлов рассказал журналистам в Москве, что российские военные всё чаще увозят чеченцев из домов по ночам: правозащитники переписывались с прокурорами о 600 таких случаях (подробнее: «Похищение людей»)(Citation: 288).
    Через три дня после обещания Путина заместитель председателя правительства России Кудрин объявил, что выплаты начнутся в ближайший месяц(Citation: 1217).
    За неделю до голосования 23 марта по навязанной Россией конституции республики Путин обратился к её гражданам по телевидению: они «должны перестать жить в страхе от ночного стука», а «Дети Чечни — наша главная забота».
    Обращение снимали в грозненском офисе российской энергетической компании РАО «ЕЭС» за высоким забором, а слушателей изображали Усамов, заместитель главы компании Чубайса, и родственники Усамова(Citation: 1867). 17 марта российский министр по делам республики Ильясов перенёс начало выплат на конец года(Citation: 1217).
    Журналистка «Новой газеты» Анна Политковская 20 марта написала о словах Путина про «ночной стук»: «речь не о немедленном прекращении практики ночных посещений домов неизвестными в камуфляже и масках, подъезжающими к твоему дому на БТРах, чтобы утащить кого-то из твоих близких неизвестно куда…»(Citation: 1867).
    Выплаты за разрушенное жильё правительство России назначило только 4 июля 2003 года, и тысячи семей их не получили (подробнее: «Тотальное уничтожение инфраструктуры»)(Citation: 1224)(Citation: 1194).

    6 июня 2003 года и 22 сентября 2006 года депутаты в Москве объявили амнистии российским военным и милиционерам, «руководствуясь принципом гуманизма» (подробнее: «Безнаказанность исполнителей»)(Citation: 795)(Citation: 796).
    С 2004 года правительство России закрывало лагеря беженцев в Ингушетии, заявляя, что обстановка в республике нормализовалась и чеченцы могут вернуться домой (подробнее: «Принудительное возвращение беженцев»)(Citation: 1235). 8 марта 2005 года, после того как ФСБ убила президента Ичкерии Аслана Масхадова, президент России Путин велел усилить защиту республики и всей России «от бандитов»(Citation: 797). 12 декабря 2005 года Путин объявил в Грозном, что в республике «наступил мир».
    В декабре районная оккупационная администрация собрала с предпринимателей по 150-300 тысяч рублей и вставила пластиковые окна в выгоревшие дома без крыш на проспекте Победы в центре Грозного(Citation: 941).

    28 апреля 2006 года представитель Временной оперативной группировки МВД России в республике Тихомиров, отвечая на обвинения в пытках в изоляторе в Грозном, сказал, что его сотрудники приехали «оказать помощь чеченскому народу» (подробнее: «Пытки и истязания»)(Citation: 286).
    В феврале 2007 года министр обороны России Иванов, по сообщению газеты International Herald Tribune, объявил, что Россия добилась в республике успеха и проблема решена(Citation: 42).

    Правозащитники «Мемориала» в 2002 году писали о двух картинках российской пропаганды: по одной, армия «принесла благодарному чеченскому народу освобождение от бандитского режима», по другой, российские силовики «насаждают цивилизацию среди враждебного населения Чечни, исторически не приспособленного к жизни в рамках законности»(Citation: 1512).
    Human Rights Watch в 2005 году писала: «Российские власти всеми силами пытаются убедить международное сообщество в неуклонной «нормализации» обстановки в республике, хотя в прошлом году никаких признаков затухания конфликта не наблюдалось» (речь о войне России против независимой Ичкерии)(Citation: 819).

    16 апреля 2009 года Национальный антитеррористический комитет России, который возглавлял директор ФСБ Бортников, объявил, что ради «дальнейшей нормализации обстановки» отменяет в Чеченской Республике режим «контртеррористической операции» (так Россия называла свою войну против независимой Ичкерии)(Citation: 901).
