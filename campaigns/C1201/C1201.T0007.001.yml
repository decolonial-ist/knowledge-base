  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Председатель правительства, а затем президент России Путин, российские министры, генералы и прокуроры отрицали преступления оккупационных войск, приписывали их Вооружённым силам Ичкерии, а мирных чеченцев, которых убили российские военные, выдавали за бойцов.

    1 октября 1999 года председатель правительства России Путин распоряжением № 1538-р создал Российский информационный центр (Росинформцентр), куда вошли представители силовых ведомств, МИД и телерадиокомпании ВГТРК (подробнее: «Цензура»)(Citation: 1543).
    В 2000 году помощник исполнявшего обязанности президента России Ястржембский опровергал сообщения о преступлениях оккупантов(Citation: 1524)(Citation: 817).

    Пресс-службы Минобороны и МВД России, пресс-центры штабов оккупационных войск и управление ФСБ по Чеченской Республике рассылали сводки через агентство РИА «Новости».
    В этих сводках мирные сёла, как Старые Атаги к югу от Грозного, числились местами, где российские войска блокируют бойцов Ичкерии(Citation: 1512).

    Российские военные прокуроры и прокуратура Чеченской Республики отвечали родным пропавших без вести и правозащитникам, что людей «похитили боевики» (так россияне называли Вооружённые силы Ичкерии)(Citation: 1210).

    В Европейском суде по правам человека Россия отвечала, что чеченцев убивали и похищали переодетые в российскую форму «члены незаконных вооруженных формирований в целях дискредитации российских федеральных сил» (так Россия называла Вооружённые силы Ичкерии)(Citation: 1581).

    С 2003 года Россия передала часть насилия силовикам оккупационной администрации Кадырова и, как пишут правозащитники «Мемориала» и Международной федерации за права человека, выдавала свои преступления за «внутренние разборки» среди чеченцев(Citation: 286).

    24 сентября 1999 года председатель правительства России Путин объявил, что российские самолёты бьют «исключительно по базам террористов»(Citation: 772). 7 октября российские лётчики бомбили Элистанжи, село на юго-востоке Ичкерии, и убили 48 чеченцев (подробнее: «Неизбирательные нападения»)(Citation: 1581).

    21 октября 1999 года оккупанты ударили ракетами «земля - земля» по Центральному рынку, роддому, главной почте и мечети в Грозном, убив около 140 горожан (подробнее: «Неизбирательные нападения»)(Citation: 1581). 22 октября руководитель Росинформцентра Михайлов сказал телеканалу НТВ, что ни самолёты, ни ракеты по городу не били, и предположил, что это теракт бойцов Ичкерии.
    В тот же день начальник пресс-центра оккупационных войск Веклич сказал телеканалу ОРТ, что при «специальной операции» без артиллерии и авиации «рынок вместе с оружием и боеприпасами… уничтожен».
    Председатель правительства Путин 22 октября на пресс-конференции в Хельсинки сказал о рынке: «Это база оружия, склад оружия». 23 октября первый заместитель начальника российского Генштаба Манилов объявил на НТВ, что склад боеприпасов у рынка взорвался, когда две группы чеченских бойцов стреляли друг в друга(Citation: 923). 26 октября командующий российской группировкой «Запад» Шаманов признал на НТВ, что по Грозному ударили «средства старшего начальника» (так он назвал ракеты командующего оккупационными войсками Казанцева).
    На вопрос, кто мог отдать приказ, Шаманов ответил: «Это вопрос не ко мне, это вопрос к вышестоящему начальству»(Citation: 771)(Citation: 1581).
    Правозащитники «Мемориала» в 1999 году написали, что «высшие должностные лица РФ и руководство Генштаба не только лгали… но и несут прямую ответственность за массовую гибель гражданского населения»(Citation: 923).
    В мае 2007 года первый заместитель военного прокурора оккупационных войск Калита написал правозащитникам, что прокуратура отказалась возбудить дело: на рынке взорвался склад оружия (подробнее: «Безнаказанность исполнителей»)(Citation: 1581).

    29 октября 1999 года экипажи российских штурмовиков ударили ракетами по колонне беженцев у села Шаами-Юрт на трассе Ростов - Баку и убили, по данным Красного Креста, 25 чеченцев (подробнее: «Ложный коридор»)(Citation: 1523). 31 октября председатель правительства Путин сказал, что сообщения о бомбёжках мирных чеченцев - «это злонамеренная пропаганда террористов»(Citation: 1523).
    В декабре 1999 года российские солдаты 15-го полка убили в Алхан-Юрте, селе к юго-западу от Грозного, не меньше 18 мирных чеченцев (подробнее: «Массовые убийства гражданских»)(Citation: 770). 23 декабря Путин назвал сообщения об этом «очередной провокацией и полной чушью»(Citation: 1487).

    20 марта 2000 года помощник Путина Ястржембский объявил, что причастность военных Минобороны к убийству не меньше 46 мирных чеченцев 5 февраля в Новых Алдах, посёлке на южной окраине Грозного, «не подтвердилась» (подробнее: «Массовые убийства гражданских»)(Citation: 951).
    В конце марта делегация России отчиталась перед Советом Европы об убийстве «более 20 жителей» посёлка(Citation: 817). 20 декабря 2000 года российские военные с блокпоста в Грозном обстреляли из миномётов пединститут, университет и школу № 8, убив семерых горожан, среди них пятерых студентов (подробнее: «Неизбирательные нападения»)(Citation: 1503).
    Телеканал РТР и военное радио «Чечня свободная» объявили, что по вузам стреляли бойцы Ичкерии, а 21 декабря прокурор Чеченской Республики Чернов опроверг это(Citation: 1503).

    16 ноября 2000 года в лесу у села Ахкинчу-Борзой на востоке Ичкерии, по словам офицеров воинской части, российские разведчики, скорее всего, убили пятерых чеченцев, рубивших дрова для школы(Citation: 1503).
    В тот же день пресс-центр оккупационных войск объявил, что «на подразделение федеральных войск напала группа боевиков» и «пять человек из числа нападавших убиты»(Citation: 1503). 28-29 апреля 2002 года военные генерала Броницкого убили в Алхан-Кале, селе к западу от Грозного, троих задержанных чеченцев, среди них двух братьев, а офицеры вписали их в акт облавы как «члены незаконных вооруженных формирований» (подробнее: «Убийство пленных и задержанных»)(Citation: 1581)(Citation: 953).
    Глава администрации села Малика Умажева отказалась подписать акт, и в ночь на 30 ноября 2002 года, по данным четырёх правозащитных организаций, российские военные убили её в отместку за слова о преступлениях оккупантов (подробнее: «Нейтрализация оппозиции»)(Citation: 953)(Citation: 778)(Citation: 285).
    В ночь на 6 мая 2005 года силовики Кадырова-младшего, первого заместителя председателя оккупационного правительства, увезли Хамида Акуева на базу своего батальона «Вега», а 1 июня следователь районной прокуратуры Кучеров записал его в восемь «вооруженных лиц», убитых в «боестолкновении» у села Аллерой (подробнее: «Убийство пленных и задержанных»).
    Мать узнала сына на фотографии убитого в камуфляже, хотя силовики увезли его из дома в нижнем белье(Citation: 286).

    24 февраля 2001 года в дачном посёлке «Здоровье» у Ханкалы, главной базы оккупационных войск на восточной окраине Грозного, нашли 51 тело, в том числе чеченцев, пропавших без вести после задержания российскими силовиками (подробнее: «Надругательство над мёртвыми»)(Citation: 813). 2 марта прокурор Чеченской Республики Чернов объявил, что «большая часть погибших, скорее всего, были боевиками»(Citation: 1564). 18 декабря 2003 года президент России Путин сказал о похищениях чеченцев: «Или это переодетые бандиты, или это злоупотребления официальных правоохранительных органов?» (подробнее: «Похищение людей»)(Citation: 286).

    В августе 2001 года генерал Манилов объявил, что за войну российские войска убили не больше тысячи мирных чеченцев, а «Мемориал» в 2004 году оценил число убитых от 10 до 20 тысяч (подробнее: «Массовые убийства гражданских»)(Citation: 1328).

    29 февраля 2000 года первый заместитель командующего оккупационными войсками Трошев объявил, что «контртеррористическая операция в Чечне завершена» (так Россия называла свою войну против независимой Ичкерии), а 20 апреля генерал Манилов - что завершена её «войсковая часть» (так он назвал бои армии)(Citation: 1603).
    Россия отменила режим «контртеррористической операции» только 16 апреля 2009 года(Citation: 901).

    15 февраля 2000 года руководитель тюремного ведомства Минюста России Ялунин назвал статью о пытках в фильтрационном лагере в Чернокозове, селе на севере Ичкерии, «заказной», а к приезду Европейского комитета по предупреждению пыток в конце февраля министерство сменило охрану лагеря и вывезло из него почти всех узников (подробнее: «Система фильтрационных лагерей»)(Citation: 1524)(Citation: 1568). 10 июля 2001 года Европейский комитет по предупреждению пыток публично отверг довод России, что в декабре 1999 - начале февраля 2000 года она не держала узников в Чернокозове(Citation: 956).
    В конце мая 2006 года, на следующий день после ухода оперативной группы МВД России из здания в Грозном, в подвале которого была тюрьма, туда прислали строителей сносить его.
    Перед сносом надписи узников в камерах кто-то скрыл под копотью сожжённых покрышек(Citation: 1581).

    Human Rights Watch в докладе о Новых Алдах в июне 2000 года написала, что правительство России «систематически отрицает факты нарушений и подвергает сомнению добросовестность тех, кто представляет достоверную информацию о таких случаях»(Citation: 280).
    Правозащитники Станислав Дмитриевский, Богдан Гварели и Оксана Челышева в 2009 году писали, что версию о переодетых в российскую форму бойцах не подтвердил ни один суд, даже российский, а попытки свалить вину на противника были «сознательным пропагандистским шагом»(Citation: 1581).

    В 2008-2009 годах силовики оккупационной администрации Кадырова-младшего жгли дома родственников чеченцев, которые воевали против оккупантов, а её милиция записывала поджоги в «самовозгорание» (подробнее: «Коллективные наказания»)(Citation: 287). 13 апреля 2009 года, за три дня до отмены режима «контртеррористической операции», сотрудник оккупационной администрации Орзалиев сказал, что Кадыров-младший не останавливает поджоги, потому что «не знает» о них(Citation: 287).
