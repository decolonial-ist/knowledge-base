description:
  ru: |-
    21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября, через три года после завершения Первой Русско-Чеченской войны, российская армия вторглась в Чеченскую Республику Ичкерия(Citation: 27).
    Россия решала, что журналистам можно писать и показывать о войне, преследовала за интервью с руководителями Ичкерии и через российскую милицию лишила типографии чеченскую газету, которая писала о расправах над чеченцами.

    1 октября 1999 года председатель правительства России Путин распоряжением № 1538-р создал Российский информационный центр (Росинформцентр) для освещения войны.
    В рабочую группу центра вошли представители МВД, Минобороны, ФСБ, ещё семи ведомств и государственной телерадиокомпании ВГТРК(Citation: 1543).

    Работать в Ичкерии журналисты могли только с аккредитацией Росинформцентра, который отбирал её за любое нарушение (подробнее: «Информационная изоляция»)(Citation: 1544).
    Россия считала нарушением своего закона о борьбе с терроризмом разговоры журналистов с бойцами Вооружённых сил Ичкерии(Citation: 1446).

    Российские военные задерживали журналистов за независимые репортажи о войне и отбирали у них записи(Citation: 1451)(Citation: 1544).
    В 2001 году министерство печати России несколько раз предупреждало московские газеты и телеканал НТВ о возможных санкциях за интервью с руководителями Ичкерии и её армии(Citation: 1451).

    27 марта 2002 года командующий оккупационными войсками Молтенской приказом № 80 запретил брать журналистов на облавы в сёлах Ичкерии без разрешения командующего и согласования с пресс-службой оккупационных войск(Citation: 946).

    По федеральному закону «О противодействии экстремистской деятельности» от 25 июля 2002 года № 114-ФЗ экстремизмом считалась любая деятельность против территориальной целостности России (подробнее: «Нейтрализация оппозиции»). 8 июля 2006 года российские депутаты приняли к нему поправки, по которым экстремистом считался и автор материалов с «публичным оправданием терроризма»(Citation: 286).

    В 2004 году главный редактор Тимур Алиев печатал в еженедельнике «Чеченское общество» статьи о расправах без суда над чеченцами(Citation: 1973).
    Сотрудники ФСБ и российской милиции несколько раз допрашивали его(Citation: 941). 23 марта 2004 года руководство полиграфического комбината «Ингушетия» в Назрани, городе в подконтрольной России Ингушетии, отказалось печатать номер с сатирическим коллажем на президента России Путина. 28 июля офицер отдела МВД Ингушетии по борьбе с организованной преступностью Гандаров допросил Тимура Алиева о деньгах и статьях газеты.
    Сотрудник отдела сообщил, что в МВД пришло письмо из Чеченской Республики с просьбой остановить издание.
    Последней каплей в отделе назвали статью о Тимуре Хамбулатове из станицы Савельевской на севере Ичкерии, которого 18 марта 2004 года российские военные увели из дома и замучили до смерти (подробнее: «Пытки и истязания»).
    Сотрудники МВД запретили Тимуру Алиеву писать о похищенных и замученных: прочитав газету, молодые чеченцы «уходят в лес» (так говорили о тех, кто уходил к защитникам Ичкерии). 30 июля директор комбината Костоев по устному указанию МВД отказался печатать «Чеченское общество», а больше печатать газету в регионе было негде.
    Журналистка Анна Политковская писала в «Новой газете» 5 августа 2004 года: «…в МВД никто не оспаривал факт существования внесудебных расправ силами бандитов из федеральных [российских] спецподразделений… — оспаривалось лишь право об этом писать правду»(Citation: 1973).

    13 сентября 2005 года силовики оккупационной администрации похитили и пытали шестерых чеченцев в Новых Атагах, селе к югу от Грозного, двоих потом выбросили избитыми, а четверых российский суд осудил на год (подробнее: «Пытки и истязания»)(Citation: 286).
    Журналисты «Вайнаха», телеканала оккупационной администрации, сняли об этом сюжет, но начальник местной милиции Дегиев изъял и уничтожил его, сославшись на приказ Алханова, министра внутренних дел этой администрации(Citation: 941).

    Правозащитник «Мемориала» Александр Черкасов в 2003 году писал, что российское информационное пространство «попало под действие цензуры и самоцензуры», а главные телеканалы почти во всех сообщениях стояли на официальной позиции(Citation: 1503).
    В докладе «Мемориала» и других правозащитных организаций 2005 года сказано, что с осени 1999 года «преследования журналистов обусловлены стремлением властей блокировать информацию из региона»(Citation: 941).
    В 2007 году правозащитники «Мемориала» и Международной федерации за права человека писали, что под угрозами, запугиванием и убийствами журналисты в Чеченской Республике из страха обходили опасные темы: их работа «сведена к эффективно действующей самоцензуре»(Citation: 286).

    26 июля 2006 года Генеральная прокуратура России завела дело против Ахмеда Закаева, одного из руководителей Ичкерии в эмиграции, за его интервью разным СМИ.
    Прокуроры обвинили его «в разжигании ненависти к лицам русской национальности».
    Ахмед Закаев остался в Лондоне, где с 2003 года жил с политическим убежищем (подробнее: «Преследование за рубежом»)(Citation: 1501).
