description:
  en: |-
    The Red Guards shot the prisoners taken at Kruty (a station in the Chernihiv region) with the authorization of Yegorov, commander of the First Revolutionary Army.
    Lapidus, commissar of the 1st Moscow Red Guard detachment, who was with the prisoners at the station and the day before, together with Zombart, commander of the armored train, had talked the Red Guards out of an immediate reprisal, recounted in his testimony to the investigation in the case of commander-in-chief Muravyov: "The next day, as we were pulling out of Kruty station, the train stopped on the way at Yegorov's order; all the detainees were led out of the carriage, and 300 paces from the train they were shot with explosive bullets.
    I went up to the dead, then went up to Yegorov and asked why they had been shot.
    Yegorov, puffing on a cigarette and smiling, replied that he had given the Red Guards permission because they insisted on it"(Citation: 496).
    Moiseyev, a member of the committee of the First Revolutionary Army, described in his testimony who was shot: "At Kruty station about 20 haidamakas were taken prisoner, among them many gymnasium pupils of about 17.
    They were taken beyond the station and shot in the most shameless manner.
    There was an outrageous case when one youth ran away from that place, but he was chased down, brought back to the same spot wearing only his underwear and shot" - and specified: "this was done from the train commanded by Yegorov"(Citation: 496).
    Babenko, commander of the Moscow detachment, captured the prisoners, and Muravyov had appointed Yegorov commander of the First Army - both links are recorded in the investigation materials(Citation: 496).
    The investigation clarified the number of those shot: Tsvanger, secretary of the army committee, corrected her testimony, naming 24 people instead of the earlier 150, and a member of the investigative commission certified the correction(Citation: 497).
    The sources differ in describing the manner of the killing: Sotnyk Averkii Honcharenko, who commanded the Ukrainian detachment at Kruty, wrote in his memoirs that the prisoners were not shot but bayoneted, whereas the documents of the Soviet investigation record shooting with explosive bullets(Citation: 497).
  uk: |-
    Червоногвардійці розстріляли полонених під Крутами (станція на Чернігівщині) з дозволу командувача Першої революційної армії Єгорова.
    Комісар 1-го Московського червоногвардійського загону Лапідус, який був при полонених на станції і напередодні разом з начальником панцирного потяга Зомбартом відмовив червоногвардійців від негайної розправи, у своїх свідченнях слідству у справі головнокомандувача Муравйова розповів: «Наступного дня, коли ми від'їжджали від ст. Крути, потяг дорогою зупинився за наказом Єгорова, з вагона вивели всіх затриманих і за 300 кроків від потяга їх розстріляли розривними кулями.
    Я підійшов до вбитих, потім підійшов до Єгорова і спитав, чому їх розстріляли.
    Єгоров, покурюючи цигарку й усміхаючись, відповів, що дозволив він червоногвардійцям тому, що вони на цьому наполягали»(Citation: 496).
    Член комітету Першої революційної армії Мойсеєв описав у свідченнях, кого розстріляли: «На ст. Крути було захоплено в полон близько 20 гайдамаків, серед яких було багато гімназистів років по 17.
    Їх вивезли за станцію і стали розстрілювати найбезпардоннішим чином.
    Був обурливий випадок, коли один юнак утік з того місця, але його наздогнали, привели на попереднє місце в самій білизні й розстріляли», - і уточнив: «це було зроблено в потязі, яким командував Єгоров»(Citation: 496).
    Начальник Московського загону Бабенко захопив полонених, а Муравйов призначив Єгорова командувачем Першої армії - обидві прив'язки стоять у матеріалах слідства(Citation: 496).
    Слідство уточнило число розстріляних: секретарка армійського комітету Цвангер виправила своє свідчення, назвавши 24 особи замість попередніх 150, і член слідчої комісії засвідчив виправлення(Citation: 497).
    Джерела розходяться в описі способу страти: сотник Аверкій Гончаренко, який командував українським загоном під Крутами, у спогадах писав, що полонених не розстрілювали, а кололи багнетами, тоді як у документах радянського слідства значиться розстріл розривними кулями(Citation: 497).
  ru: |-
    Красногвардейцы расстреляли пленных под Крутами (станция на Черниговщине) по разрешению командующего Первой революционной армией Егорова.
    Комиссар 1-го Московского красногвардейского отряда Лапидус, который был при пленных на станции и накануне вместе с начальником броневого поезда Зомбартом отговорил красногвардейцев от немедленной расправы, в своих показаниях следствию по делу главнокомандующего Муравьёва рассказал: «На следующий день, когда мы отъезжали от ст. Круты, поезд по дороге остановился по приказанию Егорова, из вагона были выведены все задержанные и в 300 шагах от поезда их расстреляли разрывными пулями.
    Я подошел к убитым, затем подошел к Егорову и спросил, почему их расстреляли.
    Егоров, покуривая папиросу и улыбаясь, ответил, что разрешил он красногвардейцам потому, что они настаивали на этом»(Citation: 496).
    Член комитета Первой революционной армии Мойсеев описал в показаниях, кого расстреляли: «На ст. Круты были захвачены в плен около 20 гайдамаков, среди которых было много гимназистов лет по 17.
    Их вывезли за станцию и стали расстреливать самым беспардонным образом.
    Был возмутительный случай, когда один юноша убежал от этого места, но его нагнали, привели к прежнему месту в одном белье и расстреляли», - и уточнил: «это было произведено в поезде, которым командовал Егоров»(Citation: 496).
    Начальник Московского отряда Бабенко захватил пленных, а Муравьёв назначил Егорова командующим Первой армией - обе привязки стоят в материалах следствия(Citation: 496).
    Следствие уточнило число расстрелянных: секретарь армейского комитета Цвангер исправила своё показание, назвав 24 человека вместо прежних 150, и член следственной комиссии заверил исправление(Citation: 497).
    Источники расходятся в описании способа казни: сотник Аверкий Гончаренко, командовавший украинским отрядом под Крутами, в воспоминаниях писал, что пленных не расстреливали, а кололи штыками, тогда как в документах советского следствия значится расстрел разрывными пулями(Citation: 497).
