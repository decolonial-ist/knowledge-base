name:
  en: The Battle of Kruty and the Killing of Prisoners (January 1918)
  uk: Бій під Крутами і розстріл полонених (січень 1918)
  ru: Бой под Крутами и расстрел пленных (январь 1918)
description:
  en: |-
    In late December 1917, as the troops of Bolshevik Russia were advancing on Kyiv, a detachment of yunkers - cadets of the 1st Kyiv Youth Military School named after Bohdan Khmelnytsky (four companies of 150 cadets each, 20 officers, 18 machine guns) - under the command of Sotnyk Averkii Honcharenko took up the defense of Bakhmach station, a railway junction on the border of the UNR and the RSFSR(Citation: 193).
    On January 27, 1918, reinforcements arrived from Kyiv - the first company of the student volunteer battalion under the command of Sotnyk Omelchenko, 115-130 volunteers: students of the Ukrainian National University and Kyiv University and senior-grade pupils of Ukrainian gymnasiums - teenagers, many of them 17 years old(Citation: 193)(Citation: 496).
    The Ukrainian forces took up defense near Kruty station (now the village of Pamiatne in Chernihiv oblast)(Citation: 193).
    On the morning of January 29 a six-thousand-strong detachment of Petrograd and Moscow Red Guards led by Yegorov attacked the positions; the fighting lasted until evening, the defenders repelled several attacks and, on the order of Sotnyk Averkii Honcharenko, withdrew to their echelon - the detachment's train waiting two kilometers away; their losses came to as many as 300 killed, wounded, and captured(Citation: 193).
    A platoon of the student company lost its bearings at dusk and came out at the station already held by the Red Guards; 27 prisoners were shot - among them, according to testimony in the investigation file of commander-in-chief Muravyov, "there were many gymnasium pupils of about 17"; Yegorov, commander of the First Revolutionary Army, authorized the shooting(Citation: 496).
    The teenage cadets managed to delay the offensive: explaining the heavy losses at Kruty and the delay in the advance on Kyiv, Muravyov claimed in his report that the Ukrainian forces had been commanded by "S. Petliura himself" - as the compilers of the collection of the Ukrainian Institute of National Memory note(Citation: 497).
    In February Muravyov's troops approached Kyiv from the Darnytsia side, shelled the city with heavy artillery for five days, and captured it on February 8, 1918(Citation: 494).
    After the UNR concluded the Peace of Brest-Litovsk with the Central Powers, German and Austro-Hungarian troops entered Ukraine, with Ukrainian units in the vanguard; the Bolsheviks abandoned Kyiv, and in early March the Council of People's Ministers returned there, followed a few days later by the Ukrainian Central Rada(Citation: 493).
    On March 19, 1918, by decision of the Ukrainian Central Rada, the bodies of those killed at Kruty were brought to Kyiv and ceremonially buried at the Askold's Grave cemetery(Citation: 193).
  uk: |-
    Наприкінці грудня 1917 року, коли війська більшовицької Росії наступали на Київ, загін юнкерів - курсантів 1-ї Київської юнацької військової школи імені Богдана Хмельницького (чотири сотні по 150 курсантів, 20 старшин, 18 кулеметів) - під командуванням сотника Аверкія Гончаренка зайняв оборону станції Бахмач, залізничного вузла на кордоні УНР і РСФРР(Citation: 193). 27 січня 1918 року з Києва підійшло підкріплення - перша сотня студентського добровольчого батальйону під командуванням сотника Омельченка, 115-130 добровольців: студенти Українського національного університету й Київського університету, гімназисти старших класів українських гімназій - підлітки, багатьом з яких було по 17 років(Citation: 193)(Citation: 496).
    Українські сили зайняли оборону біля станції Крути (нині село Пам'ятне Чернігівської області)(Citation: 193).
    Вранці 29 січня шеститисячний загін петроградських і московських червоногвардійців на чолі з Єгоровим атакував позиції; бій тривав до вечора, оборонці відбили кілька атак і за наказом сотника Аверкія Гончаренка відійшли до свого ешелону - потяга загону, що чекав за два кілометри; їхні втрати - до 300 вбитих, поранених, полонених(Citation: 193).
    Чота (взвод) студентської сотні в сутінках втратила орієнтир і вийшла до станції, вже зайнятої червоногвардійцями; 27 полонених було розстріляно - у слідчій справі головнокомандувача радянськими військами Муравйова записано: «було багато гімназистів років по 17»; командувач Першої революційної армії Єгоров дозволив розстріл(Citation: 496).
    Курсанти-підлітки змогли затримати наступ: пояснюючи значні втрати під Крутами й затримку просування на Київ, Муравйов у звіті стверджував, ніби українськими силами командував «сам С. Петлюра», - це відзначають упорядники збірника Українського інституту національної пам'яті(Citation: 497).
    У лютому війська Муравйова підійшли до Києва з боку Дарниці, п'ять днів обстрілювали місто з важких гармат і 8 лютого 1918 року захопили його(Citation: 494).
    Після Берестейського миру УНР з Центральними державами в Україну ввійшли німецькі й австро-угорські війська - в авангарді йшли українські частини; більшовики залишили Київ, і на початку березня туди повернулася Рада народних міністрів, а за кілька днів і Українська Центральна Рада(Citation: 493). 19 березня 1918 року за рішенням Української Центральної Ради тіла загиблих під Крутами перевезли до Києва й урочисто поховали на цвинтарі Аскольдова могила(Citation: 193).
  ru: |-
    В конце декабря 1917 года, когда войска большевистской России наступали на Киев, отряд юнкеров - курсантов 1-й Киевской юношеской военной школы имени Богдана Хмельницкого (четыре сотни по 150 курсантов, 20 старшин, 18 пулемётов) - под командованием сотника Аверкия Гончаренко занял оборону станции Бахмач, железнодорожного узла на границе УНР и РСФСР(Citation: 193). 27 января 1918 года из Киева подошло подкрепление - первая сотня студенческого добровольческого батальона под командованием сотника Омельченко, 115-130 добровольцев: студенты Украинского национального университета и Киевского университета, гимназисты старших классов украинских гимназий - подростки, многим из которых было по 17 лет(Citation: 193)(Citation: 496).
    Украинские силы заняли оборону возле станции Круты (ныне село Памятное Черниговской области)(Citation: 193).
    Утром 29 января шеститысячный отряд петроградских и московских красногвардейцев во главе с Егоровым атаковал позиции; бой продолжался до вечера, оборонявшиеся отбили несколько атак и по приказу сотника Аверкия Гончаренко отошли к своему эшелону - поезду отряда, ожидавшему в двух километрах; их потери - до 300 убитых, раненых, пленных(Citation: 193).
    Взвод студенческой сотни в сумерках потерял ориентир и вышел к станции, уже занятой красногвардейцами; 27 пленных были расстреляны - среди них, по показаниям в следственном деле главнокомандующего советскими войсками Муравьёва, «было много гимназистов лет по 17»; командующий Первой революционной армией Егоров разрешил расстрел(Citation: 496).
    Курсанты-подростки смогли задержать наступление: объясняя значительные потери под Крутами и задержку продвижения на Киев, Муравьёв в отчёте утверждал, будто украинскими силами командовал «сам С. Петлюра», - это отмечают составители сборника Украинского института национальной памяти(Citation: 497).
    В феврале войска Муравьёва подошли к Киеву со стороны Дарницы, пять дней обстреливали город из тяжёлых орудий и 8 февраля 1918 года захватили его(Citation: 494).
    После Брестского мира УНР с Центральными державами в Украину вошли немецкие и австро-венгерские войска - в авангарде шли украинские части; большевики оставили Киев, и в начале марта туда вернулись Рада народных министров, а через несколько дней и Украинская Центральная Рада(Citation: 493). 19 марта 1918 года по решению Украинской Центральной Рады тела погибших под Крутами перевезли в Киев и торжественно похоронили на Аскольдовой могиле(Citation: 193).
