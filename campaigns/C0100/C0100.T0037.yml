description:
  en: |-
    The installation of a controlled administration under military cover: the decisions of the Crimean parliament were taken in conditions where "behind the backs of Crimea's self-defense forces, our servicemen, of course, stood"(Citation: 203).
    The UN General Assembly declared the ensuing referendum void and confirmed that it "was not authorized by Ukraine"(Citation: 202).
    OHCHR recorded the "election" scene itself: overnight into 27 February "armed groups without insignia took over the buildings of the local government and parliament," and "on 27 February, members of the Parliament of Crimea, in the presence of gunmen, dismissed the local Government and elected Sergey Aksenov as the Head of Crimea"(Citation: 326).
  uk: |-
    Приведення до влади підконтрольної адміністрації під прикриттям військових: рішення кримського парламенту ухвалювалися в умовах, коли «за спиною сил самооборони Криму, звичайно, стали наші військовослужбовці»(Citation: 203).
    ГА ООН визнала подальший референдум таким, що не має сили, і підтвердила, що він «не був санкціонований Україною»(Citation: 202).
    УВКПЛ зафіксувало й саму сцену «обрання»: у ніч проти 27 лютого «озброєні групи без розпізнавальних знаків захопили будівлі місцевого уряду та парламенту», а «27 лютого члени парламенту Криму, у присутності озброєних людей, відправили у відставку місцевий уряд та обрали Сергія Аксьонова главою Криму»(Citation: 326).
  ru: |-
    Приведение к власти подконтрольной администрации под прикрытием военных: решения крымского парламента принимались в условиях, когда «за спиной сил самообороны Крыма, конечно, встали наши военнослужащие»(Citation: 203).
    ГА ООН признала последовавший референдум не имеющим силы и подтвердила, что он «не был санкционирован Украиной»(Citation: 202).
    УВКПЧ зафиксировало и саму сцену «избрания»: в ночь на 27 февраля «вооружённые группы без опознавательных знаков захватили здания местного правительства и парламента», а «27 февраля члены парламента Крыма, в присутствии вооружённых людей, отправили в отставку местное правительство и избрали Сергея Аксёнова главой Крыма»(Citation: 326).
