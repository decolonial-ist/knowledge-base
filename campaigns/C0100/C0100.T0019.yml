description:
  en: |-
    The use of regular troops without insignia to establish control over the peninsula.
    A year later V. Putin admitted it on his call-in show of 17 April 2014: "behind the backs of Crimea's self-defense forces, our servicemen, of course, stood.
    They acted very correctly, but… decisively and professionally"(Citation: 203).
    Ukrainian garrisons on the peninsula were blockaded and disarmed, as Putin himself admitted: "and the way the Ukrainian units were disarmed - all of this was done so swiftly that it seemed it had been prepared for an incredibly long time"(Citation: 203).
  uk: |-
    Використання регулярних військ без розпізнавальних знаків для встановлення контролю над півостровом.
    Через рік це визнав В. Путін на «прямій лінії» 17 квітня 2014 року: «за спиною сил самооборони Криму, звичайно, стали наші військовослужбовці.
    Вони діяли дуже коректно, але… рішуче і професійно»(Citation: 203).
    Українські гарнізони на півострові було блоковано й роззброєно, що Путін визнав сам: «і те, як було роззброєно українські частини - це все було зроблено настільки стрімко, що складалося враження, що це неймовірно довго готувалося»(Citation: 203).
  ru: |-
    Использование регулярных войск без знаков различия для установления контроля над полуостровом.
    Год спустя это признал В. Путин на «прямой линии» 17 апреля 2014 года: «за спиной сил самообороны Крыма, конечно, встали наши военнослужащие.
    Они действовали очень корректно, но… решительно и профессионально»(Citation: 203).
    Украинские гарнизоны на полуострове были блокированы и разоружены, что Путин признал сам: «и то, как были разоружены украинские части - это всё было сделано настолько стремительно, что создавалось ощущение, что это невероятно долго готовилось»(Citation: 203).
