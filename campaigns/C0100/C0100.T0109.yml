description:
  ru: |-
    Имитация народной воли под военной оккупацией: сперва массовка «сил самообороны», затем фиктивный референдум.
    Генеральная Ассамблея ООН постановила, что референдум 16 марта 2014 года «не был санкционирован Украиной» и, «не имея законной силы, не может быть основой для какого-либо изменения статуса Автономной Республики Крым или города Севастополя»(Citation: 202).
    Картинку народного порыва обеспечивала митинговая и «добровольческая» массовка, за которой стояли российские военные, - это Путин признал 17 апреля 2014 года: «за спиной сил самообороны Крыма, конечно, встали наши военнослужащие»(Citation: 203).
  en: |-
    The manufacturing of an appearance of mass pro-Russian mobilization on the peninsula: behind the "self-defense forces," in whose name the operation was conducted, stood Russian troops, as Putin admitted on 17 April 2014: "behind the backs of Crimea's self-defense forces, our servicemen, of course, stood"(Citation: 202).
    Rally and "volunteer" crowds supplied the picture of a popular impulse whose legal significance the UN rejected(Citation: 203).
  uk: |-
    Створення видимості масової проросійської мобілізації на півострові: за «силами самооборони», від імені яких велася операція, стояли російські військові, що Путін визнав 17 квітня 2014 року: «за спиною сил самооборони Криму, звичайно, стали наші військовослужбовці»(Citation: 202).
    Мітингова та «добровольча» масовка забезпечувала картинку народного пориву, юридичне значення якої ООН відкинула(Citation: 203).
