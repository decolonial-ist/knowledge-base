description:
  ru: |-
    Вмешательство во внутреннее управление: «гетман лишался права самовольно (без рассмотрения дела в войсковом суде) отдавать приказы о казни и увольнении с должностей своих подчинённых»(Citation: 199) – кадровые и судебные решения выводились из-под единоличной власти гетмана.
    Сама норма старше этого договора: впервые она закреплена Конотопскими статьями 1672 года («судом и доводом войсковым казнил и от чина… отставлял»)(Citation: 398).
  en: |-
    Interference in internal governance: "the hetman was deprived of the right to arbitrarily (without a hearing before the military court) issue orders for the execution or dismissal of his subordinates"(Citation: 199) – personnel and judicial decisions were removed from the hetman's sole authority.
    The norm itself is older than this treaty: it was first fixed by the Konotop Articles of 1672 ("executed and removed from office… by the judgment and proof of the Host's court")(Citation: 398).
  uk: |-
    Втручання у внутрішнє управління: «гетьман позбавлявся права самовільно (без розгляду справи у військовому суді) віддавати накази про страту й звільнення з посад своїх підлеглих»(Citation: 199) – кадрові та судові рішення виводилися з-під одноосібної влади гетьмана.
    Сама норма старша за цей договір: уперше її закріплено Конотопськими статтями 1672 року («судом і доводом військовим карав на смерть і від чину… відставляв»)(Citation: 398).
