name:
  en: The Konotop Articles of Ivan Samoilovych (1672)
  uk: Конотопські статті Івана Самойловича (1672)
  ru: Конотопские статьи Ивана Самойловича (1672)
description:
  en: |-
    A further curtailment of the Hetmanate's political agency and interference in the autonomy's internal affairs: "Overall, the Konotop Articles limited the hetman's power in favor of the officer oligarchy, and also narrowed the autonomy of the Hetmanate"(Citation: 193).
    The weakening of the hetman's power laid the ground for the growing influence of the Muscovite government over the autonomy's elites.
  uk: |-
    Подальше урізання політичної суб'єктності Гетьманщини та втручання у внутрішні справи автономії: «Загалом К[онотопські] с[татті] обмежували гетьман. владу на користь старшинської олігархії, а також звужували автономію Гетьманщини»(Citation: 193).
    Ослаблення гетьманської влади створювало ґрунт для посилення впливу московського уряду на еліти автономії.
  ru: |-
    Дальнейшее урезание политической субъектности Гетманщины и вмешательство во внутренние дела автономии: «В целом Конотопские статьи ограничивали гетманскую власть в пользу старшинской олигархии, а также сужали автономию Гетманщины»(Citation: 193).
    Ослабление гетманской власти создавало почву для усиления влияния московского правительства на элиты автономии.
