name:
  en: Bribery of Elites, Coercion into Subjecthood, and the Taking of Amanats (1645–1658)
  uk: Підкуп еліт, примус до підданства та взяття аманатів (1645–1658)
  ru: Подкуп элит, принуждение к подданству и взятие аманатов (1645–1658)
description:
  en: |-
    The occupation administration of the Tsardom of Muscovy expanded legal control over the societies of the Nokhchi, bribed loyal elites, and coerced the mountain societies into vassalage.
    The metropole officially rewarded the leaders who served it, granting them privileges and power over dependent people: the register of files of the Ambassadorial Prikaz for 1645 records a petition from the serving Okotsk murza Chepan Kokhostrov to Tsar Mikhail Fedorovich and a report memorandum of the central apparatus «on granting him an increase to his salary and ownership of the uzdens and «people» of his brother, murza Albir Kokhostrov»(Citation: 82).
    In parallel, the administration forced the mountain societies of the Nokhchi (the Shibutians and the Michkizians) into legal subordination.
    In 1647, under pressure from the Terek voivodes, the Shibutians «placed themselves under your lofty sovereign hand in direct servitude... and swore the shert on the Quran»(Citation: 82), while the Michkiz people «together with the entire Michkiz land placed themselves in servitude under your lofty sovereign hand... and swore the shert on the Quran»(Citation: 82).
    To guarantee the fulfillment of the imposed obligations, the representatives of the metropole demanded hostages: a dispatch from the Terek voivode Prince Venedikt Andreevich Obolensky and his associates to the Ambassadorial Prikaz of 1647 dryly records the fact of «the giving of an amanat to the Terek town»(Citation: 82).
    The documents record that the metropole instructed the voivodes «to order that amanats be taken from among their kin, men of note... to order that they be kept and given food and drink in the same way as other such amanats»(Citation: 82), as a result of which the mountaineers «gave a good amanat to the Terek town, Kasa»(Citation: 82)(Citation: 83).
  uk: |-
    Окупаційна адміністрація Московського царства розширювала юридичний контроль над суспільствами Нохчі, здійснювала підкуп лояльних еліт і примушувала гірські суспільства до васалітету.
    Метрополія офіційно заохочувала очільників, які їй служили, роздаючи їм привілеї та владу над залежними людьми: у переліку справ Посольського приказу за 1645 рік зафіксовано чолобитну служилого окоцького мурзи Чепана Кохострова цареві Михайлу Федоровичу та доповідну виписку центрального апарату «про пожалування йому надбавки до жалування та володіння узденями і «людьми» його брата мурзи Албіра Кохострова»(Citation: 82).
    Паралельно адміністрація примушувала гірські суспільства Нохчі (Шибутян і Мічкізян) до юридичного підпорядкування.
    У 1647 році під тиском терських воєвод Шибутяни «стали під твоєю государевою високою рукою в прямому холопстві... на Корані шерть учинили»(Citation: 82), а мічкізькі люди «з усією Мічкізькою землею під твоєю государевою високою рукою в холопстві стали... і на Корані шертували»(Citation: 82).
    Для гарантії виконання нав'язаних зобов'язань представники метрополії вимагали заручників: у відписці терського воєводи князя Венедикта Андрійовича Оболенського з товаришами до Посольського приказу від 1647 року сухо констатується факт «дачі аманата в Терське місто»(Citation: 82).
    У документах зафіксовано, що метрополія приписала воєводам «звеліти взяти в них в аманати родичів — знатних людей... звеліти тримати і корм та питво давати так само, як і іншим таким аманатам»(Citation: 82), унаслідок чого горці «аманата в Терське місто дали доброго, Касу»(Citation: 82)(Citation: 83).
  ru: |-
    Оккупационная администрация Московского Царства расширяла юридический контроль над обществами нохчи, осуществляла подкуп лояльных элит и принуждала горные общества к вассалитету.
    Метрополия официально поощряла служащих ей предводителей, раздавая им привилегии и власть над зависимыми людьми: в перечне дел Посольского приказа за 1645 год зафиксирована челобитная служилого окоцкого мурзы Чепана Кохострова царю Михаилу Федоровичу и докладная выписка центрального аппарата «о пожаловании его прибавкою к жалованью и владением узденями и «людьми» его брата мурзы Албира Кохострова»(Citation: 82).
    Параллельно администрация заставляла горные общества нохчи (шибутян и мичкизян) к юридическому подчинению.
    В 1647 году под давлением терских воевод шибутяне «учинились под твоею государьскою высокою рукою в прямом холопстве... на куране шерть учинили»(Citation: 82), а мичкизские люди «со всею Мичкизскою землею под твоею государьскою высокою рукою в холопстве учинились... и на куране шертовали»(Citation: 82).
    Для гарантии исполнения навязанных обязательств представители метрополии требовали заложников: в отписке терского воеводы князя Венедикта Андреевича Оболенского с товарищами в Посольский приказ от 1647 года сухо констатируется факт «дачи аманата в Терский город»(Citation: 82).
    В документах фиксируется, что метрополия предписала воеводам «велеть у них взять аманатов родственных нарочитых людей... велеть держать и корм и питье давать так же, как и иным таким аманатом»(Citation: 82), в результате чего горцы «аманата в Терской город дали доброго, Касу»(Citation: 82)(Citation: 83).
