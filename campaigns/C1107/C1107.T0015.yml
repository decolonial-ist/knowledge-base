description:
  ru: 'Оккупационная администрация раздавала привилегии и передавала лояльным предводителям нохчи власть над зависимыми людьми для переманивания их на свою сторону: в перечне дел Посольского приказа за 1645 год зафиксирована челобитная служилого окоцкого мурзы Чепана Кохострова царю Михаилу Федоровичу и докладная выписка центрального аппарата «о пожаловании его прибавкою к жалованью и владением узденями и «людьми» его брата мурзы Албира Кохострова»(Citation: 82).'
  en: 'The occupation administration handed out privileges and transferred to loyal Nokhchi leaders power over dependent people in order to win them over to its side: the register of cases of the Posolsky Prikaz for 1645 records a petition from the serving Okotsk murza Chepan Kokhostrov to Tsar Mikhail Fedorovich and a report extract by the central apparatus «on granting him an increase to his salary and possession of the uzdens and «people» of his brother, murza Albir Kokhostrov»(Citation: 82).'
  uk: 'Окупаційна адміністрація роздавала привілеї та передавала лояльним предводителям Нохчі владу над залежними людьми, щоб переманити їх на свій бік: у переліку справ Посольського приказу за 1645 рік зафіксовано чолобитну служилого окоцького мурзи Чепана Кохострова цареві Михайлу Федоровичу та доповідну виписку центрального апарату «про пожалування його прибавкою до жалування та володінням узденями і «людьми» його брата мурзи Албіра Кохострова»(Citation: 82).'
