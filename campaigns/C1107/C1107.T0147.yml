description:
  en: 'The occupation administration forced the mountain societies of the Nokhchi into legal subordination: in 1647, under pressure from the Terek voivodes, the Shibutians «placed themselves under thy sovereign high hand in direct servitude... and swore the shert oath on the Quran»(Citation: 82), while the Michkiz people «with all the Michkiz land placed themselves in servitude under thy sovereign high hand... and swore the shert on the Quran»(Citation: 82).'
  uk: 'Окупаційна адміністрація примусила гірські суспільства Нохчі до юридичного підпорядкування: у 1647 році під тиском терських воєвод Шибутяни «вчинилися під твоєю государевою високою рукою в прямому холопстві... на курані шерть учинили»(Citation: 82), а мічкізькі люди «з усією Мічкізькою землею під твоєю государевою високою рукою в холопстві вчинилися... і на курані шертували»(Citation: 82).'
  ru: 'Оккупационная администрация принудила горские общества нохчи к юридическому подчинению: в 1647 году под давлением терских воевод шибутяне «учинились под твоею государьскою высокою рукою в прямом холопстве... на куране шерть учинили»(Citation: 82), а мичкизские люди «со всею Мичкизскою землею под твоею государьскою высокою рукою в холопстве учинились... и на куране шертовали»(Citation: 82).'
