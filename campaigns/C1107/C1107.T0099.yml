description:
  en: 'The occupation administration used the taking of hostages from among the Indigenous population to guarantee the loyalty of the mountain societies of the Nokhchi: a dispatch from the Terek voivode Prince Venedikt Andreevich Obolensky and his associates to the Posolsky Prikaz in 1647 officially records the fact of «the giving of an amanat to the Terek town»(Citation: 82); the metropole instructed the voivodes «to order that amanats be taken from them — kinsmen of notable people»(Citation: 82), as a result of which the Highlanders «gave a good amanat to the Terek town, Kasa»(Citation: 82)(Citation: 83).'
  uk: 'Окупаційна адміністрація використовувала захоплення заручників з-поміж корінного населення як гарантію лояльності гірських суспільств Нохчі: у відписці терського воєводи князя Венедикта Андрійовича Оболенського з товаришами до Посольського приказу від 1647 року офіційно констатовано факт «давання аманата в Терське місто»(Citation: 82); метрополія приписала воєводам «звеліти взяти в них аманатами родичів знатних людей»(Citation: 82), унаслідок чого Горці «аманата в Терське місто дали доброго, Касу»(Citation: 82)(Citation: 83).'
  ru: 'Оккупационная администрация использовала захват заложников из числа коренного населения для гарантии лояльности горных обществ нохчи: в отписке терского воеводы князя Венедикта Андреевича Оболенского с товарищами в Посольский приказ от 1647 года официально констатируется факт «дачи аманата в Терский город»(Citation: 82); метрополия предписала воеводам «велеть у них взять аманатов родственных нарочитых людей»(Citation: 82), в результате чего горцы «аманата в Терской город дали доброго, Касу»(Citation: 82)(Citation: 83).'
