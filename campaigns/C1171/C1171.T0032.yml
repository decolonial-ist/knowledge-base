description:
  en: |-
    The allotment norm was written out by estate and origin: "Cossacks are allotted 30 desiatinas (a desiatina is a little over a hectare) per soul, while natives get no more than 2-5 desiatinas"(Citation: 251); the gap was also entrenched by the general rules of allotment: by the count of the newspaper Kazachy Vestnik for 1884, on which historian Z. Kh.
    Ibragimova relies, Russian residents of the Caucasus krai received "24–30 desiatinas of land allotment per soul, whereas natives got 12–18 desiatinas per dym, which on average numbered 5 men" (a dym is a hearth, a household)(Citation: 251).
    In 1886 in the Grozny okrug "an average Chechen family with many children... had 11 desiatinas of land, while the average Cossack family owned more than 92 desiatinas"(Citation: 125).
    By Order No. 418 of the viceroy of 1863, "the right to buy land plots from the local population was received by Russian officers and officials of the oblast administration"(Citation: 251) - an ordinary Chechen could not be a buyer of that same category of land; the rules of 1 March 1902 instituted the buying-up of privately owned lands "for the needs of the Caucasus Cossack hosts, at the expense of their capital funds"(Citation: 251).
  uk: |-
    Норма наділу була розписана за станом і походженням: «козакам відводиться по 30 десятин (десятина - трохи більше гектара) на душу, а тубільцям не більше 2-5 десятин»(Citation: 251); розрив закріплювали і загальні правила наділення: за рахунком газети «Казачий вестник» за 1884 рік, на який спирається історик З. Х. Ібрагімова, російські жителі Кавказького краю отримували «по 24–30 десятин на душу земельного наділу, тоді як тубільці по 12–18 десятин на дим, що в середньому налічував 5 чоловіків» (дим - двір, домогосподарство)(Citation: 251).
    У 1886 році в Грозненському окрузі «на багатодітну чеченську сім'ю... в середньому припадало 11 десятин землі, тоді як середньостатистична козача сім'я володіла понад 92 десятинами»(Citation: 125).
    Наказом намісника №418 від 1863 року «право купувати в місцевого населення земельні ділянки отримали російські офіцери і чиновники обласної адміністрації»(Citation: 251) - рядовий чеченець покупцем тієї самої категорії землі бути не міг; правила 1 березня 1902 року запровадили скуповування приватновласницьких земель «для потреб Кавказьких козачих військ, коштом їхніх капіталів»(Citation: 251).
  ru: |-
    Норма надела была расписана по сословию и происхождению: «казакам отводится по 30 десятин (десятина - чуть больше гектара) на душу, а туземцам не более 2-5 десятин»(Citation: 251); разрыв закрепляли и общие правила наделения: по счёту газеты «Казачий вестник» за 1884 год, на который опирается историк З. Х. Ибрагимова, русские жители Кавказского края получали «по 24–30 десятин на душу земельного надела, тогда как туземцы по 12–18 десятин на дым, в среднем насчитывавший 5 мужчин» (дым - двор, домохозяйство)(Citation: 251).
    В 1886 году в Грозненском округе «на многодетную чеченскую семью... в среднем приходилось 11 десятин земли, в то время как среднестатистическая казачья семья владела более чем 92 десятинами»(Citation: 125).
    Приказом наместника №418 от 1863 года «право покупать у местного населения земельные участки получили русские офицеры и чиновники областной администрации»(Citation: 251) - рядовой чеченец покупателем той же категории земли быть не мог; правила 1 марта 1902 года учредили скупку частновладельческих земель «для надобностей Кавказских казачьих войск, на средства их капиталов»(Citation: 251).
