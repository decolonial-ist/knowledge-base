description:
  ru: |-
    В 1895 году казаки сдали в аренду 420 тысяч десятин (десятина - чуть больше гектара) «юртовых» земель, официальная арендная плата за которые составила свыше 140 тысяч рублей в год; сверх того в аренду шли «запасные» земли - до 65 тысяч десятин ежегодно(Citation: 125).
    К 1913 году станицы сдавали 424 тысячи десятин войсковых земель и получали 806,5 тысячи рублей арендной платы, а основными арендаторами были чеченцы - до 77 процентов крестьянских хозяйств(Citation: 125).
    Аренда стала такой массовой, что администрация Терской области забеспокоилась: историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что власти «всерьез опасались, что, арендуя одни и те же участки в течение многих лет, горцы могут, в конце концов, предъявить на них претензии», и, кроме того, стремились закрепить в области как можно больше «иногородних» крестьян, «а потому в конце XIX в. вышло распоряжение, запрещавшее казакам сдавать свою землю в аренду непосредственно горцам»(Citation: 125).
    Пользование землёй, отнятой у чеченцев, было поставлено в зависимость от разрешения властей, а само это разрешение отзывалось, как только пользование грозило превратиться в право.
  en: |-
    In 1895 the Cossacks leased out 420 thousand desiatinas (a desiatina is a little over a hectare) of "yurt" (stanitsa allotment) lands, the official rent for which came to over 140 thousand rubles a year; on top of that, "reserve" lands went out on lease - up to 65 thousand desiatinas annually(Citation: 125).
    By 1913 the stanitsas were leasing out 424 thousand desiatinas of host lands and collecting 806.5 thousand rubles in rent, and the main tenants were Chechens - up to 77 percent of peasant households(Citation: 125).
    Leasing became so widespread that the administration of the Terek oblast grew alarmed: historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that the authorities "seriously feared that, by renting the same plots for many years, the highlanders might in the end lay claim to them", and, besides, sought to attach to the oblast as many "out-of-town" peasants as possible, "and therefore at the end of the 19th century an ordinance came out forbidding Cossacks to lease their land directly to the highlanders"(Citation: 125).
    The use of land taken from the Chechens was made conditional on the authorities' permission, and that permission was revoked as soon as use threatened to turn into right.
  uk: |-
    У 1895 році козаки здали в оренду 420 тисяч десятин (десятина - трохи більше гектара) «юртових» земель, офіційна орендна плата за які склала понад 140 тисяч рублів на рік; окрім того, в оренду йшли «запасні» землі - до 65 тисяч десятин щорічно(Citation: 125).
    До 1913 року станиці здавали 424 тисячі десятин військових земель і отримували 806,5 тисячі рублів орендної плати, а основними орендарями були чеченці - до 77 відсотків селянських господарств(Citation: 125).
    Оренда стала такою масовою, що адміністрація Терської області занепокоїлася: історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що влада «всерйоз побоювалася, що, орендуючи ті самі ділянки протягом багатьох років, горці можуть, зрештою, пред'явити на них претензії», і, крім того, прагнула закріпити в області якомога більше «іногородніх» селян, «а тому наприкінці XIX ст. вийшло розпорядження, що забороняло козакам здавати свою землю в оренду безпосередньо горцям»(Citation: 125).
    Користування землею, відібраною в чеченців, було поставлене в залежність від дозволу влади, а сам цей дозвіл відкликався, щойно користування загрожувало перетворитися на право.
