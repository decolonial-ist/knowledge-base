description:
  ru: |-
    По сводке историков Я. З. Ахмадова и Э. Х. Хасмагомадова, из 643 тысяч десятин (десятина - чуть больше гектара) равнинной и предгорной Чечни чеченским селениям оставлено 347 тысяч, казачьим станицам передано 222 тысячи - треть, офицерам-частным владельцам - 28 тысяч, укреплениям - 17 тысяч, казне - около 30 тысяч «запасных»(Citation: 125).
    Тот же раздел ведомство описало само: Терское межевое управление, считая одну лишь плоскостную часть Большой и Малой Чечни (охват уже, чем равнинная и предгорная Чечня в своде историков), подытожило: «Вся плоскостная часть Большой и Малой Чечни, с прилегающим малочеченским лесом, составляет площадь 271086 десятин.
    Из неё разновременно отошло 6 казачьим станицам 650 десятин, Терскому казачьему войску 1560 десятин леса, пожаловано в частную собственность за заслуги отдельных лиц 8645 десятин, отдано городам и слободам 8266 десятин, 43 чеченским аулам наделено 234970 десятин, в ведении лесного ведомства состояло 16965 десятин.
    Таким образом, свободных земель нет…»(Citation: 251).
    Леса конфискованы полностью: «в Чечне и Ингушетии царизм присвоил леса общей площадью 225,5 тысяч десятин (они стали «казенными») и еще 33,5 тысячи десятин по Сунже и ее притокам передал казачьему войску.
    Леса брались под вооруженную охрану, и несчастных крестьян, попавшихся на порубке леса, преследовали тяжелыми карами»(Citation: 125).
    У горных аулов, по историку З. Х. Ибрагимовой, «было конфисковано в казну 50989 десятин пастбищ», а затем эти же пастбища переданы общинам «на условиях оброчного пользования»(Citation: 251).
    Отнимали и расчищенное своими руками: в 1874 году в Веденском округе владельцам 250 десятин расчищенных из-под леса участков предложили присягнуть на Коране, что расчистка шла с разрешения обществ, - «во всем округе только Ш. Долатмурзиев, житель селения Белгатой, смог присягнуть... все остальные участки, владельцы которых к чести своей не рискнули дать ложную клятву, были признаны общественными»(Citation: 125); после восстания 1877 года у жителей Дышни-Ведено отобраны 74 свидетельства на расчищенные участки «в качестве наказания, за поддержку восставших»(Citation: 251).
    В 1888 году чеченские общества обратились с прошением к императору: строительные материалы и дрова они «вынуждены покупать у частных владельцев или у казны, а раньше пользовались ими бесплатно»(Citation: 251).
    В 1891 году общество Владикавказской железной дороги получило концессию на ветвь от станции Беслан через Грозный на Петровск(Citation: 460). 15 июня 1891 года Александр III именным указом министру путей сообщения предписал изъятие земель под трассу: «Разрѣшивъ сооруженіе Петровской желѣзной дороги, взамѣнъ ранѣе указаннаго направленія ея отъ Владикавказа до Петровска, по направленію отъ станціи Бесланъ... до Петровска, повелѣваемъ: 1) сдѣлать надлежащія распоряженія къ отчужденію... необходимыхъ для сей цѣли земель»(Citation: 462).
    Полотно, станция и всё путевое хозяйство легли на земли, которые к тому времени числились за Терским казачьим войском и станицей Грозненской, - на ту самую плоскостную землю, что была отнята у чеченских аулов и передана войску: историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что «железнодорожное полотно (и, соответственно, станция и все путевое хозяйство) прошло по землям, принадлежавшим Терскому казачьему войску», а «грозненский городской вокзал был построен на земле станицы Грозненской»(Citation: 125).
    Торг о цене шёл между дорогой, городом и казаками: городские власти потребовали «по 60 рублей за каждый квадратный сажень городских земель, отчуждаемых для возведения вокзала, локомотивного депо с мастерскими, товарной станции и подъездных путей», а казаки станицы Грозненской предложили строителям свой участок бесплатно - в расчёте, что вслед за станцией у них поднимутся нефтеперерабатывающие и другие предприятия(Citation: 125).
    Деньги за отчуждение получали держатели захваченного, чеченские общества в этом расчёте не участвовали.
  en: |-
    According to the summary by historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov, of the 643 thousand desiatinas (a desiatina is a little over a hectare) of lowland and piedmont Chechnya, Chechen villages were left 347 thousand, Cossack stanitsas were handed 222 thousand - a third, officers as private owners got 28 thousand, fortifications 17 thousand, and the treasury about 30 thousand desiatinas of "reserve" land(Citation: 125).
    The same partition was described by the office itself: the Terek land-survey administration, counting only the lowland part of Greater and Lesser Chechnya (a narrower scope than the lowland and piedmont Chechnya of the historians' summary), summed up: "The entire lowland part of Greater and Lesser Chechnya, with the adjoining Lesser-Chechen forest, comprises an area of 271086 desiatinas.
    Of it, at various times, 650 desiatinas went to 6 Cossack stanitsas, 1560 desiatinas of forest to the Terek Cossack Host, 8645 desiatinas were granted into private ownership for the services of individual persons, 8266 desiatinas were given to towns and settlements, 234970 desiatinas were allotted to 43 Chechen auls, and 16965 desiatinas were held by the forestry department.
    Thus, there is no free land left…"(Citation: 251).
    The forests were confiscated wholesale: "in Chechnya and Ingushetia tsarism appropriated forests with a total area of 225.5 thousand desiatinas (they became 'state' forests) and handed another 33.5 thousand desiatinas along the Sunzha and its tributaries to the Cossack host.
    The forests were placed under armed guard, and the unfortunate peasants caught felling wood were pursued with heavy penalties"(Citation: 125).
    From the mountain auls, according to historian Z. Kh.
    Ibragimova, "50989 desiatinas of pasture were confiscated to the treasury", and the same pastures were then handed back to the communities "on terms of quitrent use"(Citation: 251).
    What people had cleared with their own hands was taken too: in 1874 in the Vedeno okrug the owners of 250 desiatinas of plots cleared from under forest were told to swear on the Quran that the clearing had been done with the permission of the communities - "in the whole okrug only Sh.
    Dolatmurzayev, a resident of the village of Belgatoy, was able to swear... all the other plots, whose owners to their honor did not risk giving a false oath, were declared communal"(Citation: 125); after the uprising of 1877 the residents of Dyshni-Vedeno had 74 certificates for cleared plots taken away "as punishment, for support of the insurgents"(Citation: 251).
    In 1888 the Chechen communities petitioned the emperor: building materials and firewood they were "forced to buy from private owners or from the treasury, whereas formerly they had used them free of charge"(Citation: 251).
    In 1891 the Vladikavkaz Railway Company received a concession for a branch line from Beslan station through Grozny to Petrovsk(Citation: 460).
    On 15 June 1891 Alexander III, by a personal decree to the Minister of Ways of Communication, ordered the expropriation of land for the route: "Having authorized the construction of the Petrovsk railway, in place of its previously indicated direction from Vladikavkaz to Petrovsk, along the direction from Beslan station... to Petrovsk, we command: 1) that the proper arrangements be made for the expropriation... of the lands necessary for this purpose"(Citation: 462).
    The trackbed, the station and the entire railway infrastructure landed on lands that by then were registered to the Terek Cossack Host and the Groznenskaya stanitsa - the very lowland land that had been taken from Chechen auls and handed to the host: historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that "the railway trackbed (and, accordingly, the station and all the railway facilities) passed over lands belonging to the Terek Cossack Host", and "the Grozny city railway station was built on the land of the Groznenskaya stanitsa"(Citation: 125).
    The bargaining over the price went on between the railway, the town and the Cossacks: the town authorities demanded "60 rubles for every square sazhen of town land expropriated for the construction of the station, the locomotive depot with workshops, the goods station and the access tracks", while the Cossacks of the Groznenskaya stanitsa offered the builders their plot free of charge - counting on oil-refining and other enterprises rising around the station(Citation: 125).
    The money for the expropriation went to the holders of what had been seized; the Chechen communities had no part in that settlement.
  uk: |-
    За зведенням істориків Я. З. Ахмадова та Е. Х. Хасмагомадова, із 643 тисяч десятин (десятина - трохи більше гектара) рівнинної і передгірної Чечні чеченським селищам залишено 347 тисяч, козачим станицям передано 222 тисячі - третину, офіцерам-приватним власникам - 28 тисяч, укріпленням - 17 тисяч, скарбниці - близько 30 тисяч «запасних»(Citation: 125).
    Той самий розподіл відомство описало саме: Терське межове управління, рахуючи лише площинну частину Великої і Малої Чечні (охоплення вужче, ніж рівнинна і передгірна Чечня у зведенні істориків), підсумувало: «Уся площинна частина Великої і Малої Чечні, з прилеглим малочеченським лісом, становить площу 271086 десятин.
    З неї в різний час відійшло 6 козачим станицям 650 десятин, Терському козачому війську 1560 десятин лісу, надано у приватну власність за заслуги окремих осіб 8645 десятин, віддано містам і слободам 8266 десятин, 43 чеченським аулам наділено 234970 десятин, у віданні лісового відомства перебувало 16965 десятин.
    Таким чином, вільних земель немає…»(Citation: 251).
    Ліси конфісковано повністю: «в Чечні та Інгушетії царизм привласнив ліси загальною площею 225,5 тисяч десятин (вони стали «казенними») і ще 33,5 тисячі десятин по Сунжі та її притоках передав козачому війську.
    Ліси бралися під озброєну охорону, і нещасних селян, що попалися на порубці лісу, переслідували тяжкими карами»(Citation: 125).
    У гірських аулів, за істориком З. Х. Ібрагімовою, «було конфісковано в скарбницю 50989 десятин пасовищ», а потім ці самі пасовища передано громадам «на умовах оброчного користування»(Citation: 251).
    Відбирали і розчищене власними руками: у 1874 році у Веденському окрузі власникам 250 десятин розчищених з-під лісу ділянок запропонували присягнути на Корані, що розчищення йшло з дозволу громад, - «у всьому окрузі тільки Ш. Долатмурзієв, житель селища Белгатой, зміг присягнути... всі інші ділянки, власники яких на честь свою не ризикнули дати неправдиву клятву, були визнані громадськими»(Citation: 125); після повстання 1877 року в жителів Дишні-Ведено відібрано 74 свідоцтва на розчищені ділянки «як покарання, за підтримку повсталих»(Citation: 251).
    У 1888 році чеченські громади звернулися з проханням до імператора: будівельні матеріали і дрова вони «змушені купувати у приватних власників або у скарбниці, а раніше користувалися ними безплатно»(Citation: 251).
    У 1891 році товариство Владикавказької залізниці отримало концесію на гілку від станції Беслан через Грозний на Петровськ(Citation: 460). 15 червня 1891 року Олександр III іменним указом міністру шляхів сполучення приписав вилучення земель під трасу: «Дозволивши спорудження Петровської залізниці, замість раніше вказаного напрямку її від Владикавказа до Петровська, за напрямком від станції Беслан... до Петровська, повеліваємо: 1) зробити належні розпорядження щодо відчуження... необхідних для цієї мети земель»(Citation: 462).
    Полотно, станція і все колійне господарство лягли на землі, які на той час значилися за Терським козачим військом і станицею Грозненською, - на ту саму площинну землю, що була відібрана в чеченських аулів і передана війську: історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що «залізничне полотно (і, відповідно, станція і все колійне господарство) пройшло по землях, що належали Терському козачому війську», а «грозненський міський вокзал був побудований на землі станиці Грозненської»(Citation: 125).
    Торг про ціну йшов між залізницею, містом і козаками: міська влада зажадала «по 60 рублів за кожен квадратний сажень міських земель, відчужуваних для зведення вокзалу, локомотивного депо з майстернями, товарної станції та під'їзних колій», а козаки станиці Грозненської запропонували будівельникам свою ділянку безплатно - з розрахунку, що слідом за станцією в них піднімуться нафтопереробні та інші підприємства(Citation: 125).
    Гроші за відчуження отримували держателі захопленого, чеченські громади в цьому розрахунку участі не брали.
