description:
  en: |-
    The Kakhanovskaya stanitsa "was founded in 1860 on the site of the village of Umakhan-Yurt in the bend of the lower Sunzha" and found itself almost encircled by 14 Chechen villages, which took in the evicted people of Umakhan-Yurt(Citation: 251).
    Six stanitsas of the Kizlyar otdel "were situated on the lands of the expelled Chechen population", and the Baryatinskaya stanitsa, planted right up against the large village of Stary Yurt, took away part of the Stary Yurt residents' lands(Citation: 251).
    In all, on the Sunzha Line, by the count of historian Z. Kh.
    Ibragimova, "the highlanders lost 262946 desiatinas of lowland land"(Citation: 251).
  uk: |-
    Станиця Кахановська «була заснована в 1860 р. на місці села Умахан-Юрт у закруті нижньої Сунжі» й опинилася майже в оточенні 14 чеченських сіл, які прийняли до себе виселених умаханюртівців(Citation: 251).
    Шість станиць Кізлярського відділу «розташовувалися на землях вигнаного чеченського населення», а станиця Барятинська, поставлена впритул до великого села Старий Юрт, відібрала у староюртівців частину їхніх земель(Citation: 251).
    Загалом на Сунженській лінії, за підрахунком історика З. Х. Ібрагімової, «горці втратили 262946 десятин площинної землі»(Citation: 251).
  ru: |-
    Станица Кахановская «была основана в 1860 г. на месте села Умахан-Юрт в излучине нижней Сунжи» и оказалась почти в окружении 14 чеченских сёл, которые приняли к себе выселенных умаханюртовцев(Citation: 251).
    Шесть станиц Кизлярского отдела «располагались на землях изгнанного чеченского населения», а станица Барятинская, поставленная вплотную к крупному селу Старый Юрт, отняла у староюртовцев часть их земель(Citation: 251).
    Всего на Сунженской линии, по подсчёту историка З. Х. Ибрагимовой, «горцы лишились 262946 дес. плоскостной земли»(Citation: 251).
