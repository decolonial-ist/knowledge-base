description:
  ru: 'Мобилизация жителей колонизированных украинских губерний в имперскую армию для войны на Балканах – в рамках всеобщей воинской повинности, действовавшей в украинских землях со времен ликвидации автономии(Citation: 196).'
  en: 'The mobilization of the inhabitants of the colonized Ukrainian governorates into the imperial army for the war in the Balkans – under the universal military conscription in force in the Ukrainian lands since the liquidation of the autonomy(Citation: 196).'
  uk: 'Мобілізація мешканців колонізованих українських губерній до імперської армії для війни на Балканах – у рамках загальної військової повинності, що діяла в українських землях з часів ліквідації автономії(Citation: 196).'
