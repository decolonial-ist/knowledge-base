description:
  ru: |-
    Идеологическое оправдание захватнической войны религией и панславизмом: по Достоевскому, «настояниями и кровью России славяне уже освобождены… турецкой империи уже не существует и…
    Балканский полуостров свободен и живет новою жизнью»(Citation: 154) – войне придавался статус священной миссии освобождения единоверцев.
  en: 'The ideological justification of a war of conquest by religion and Pan-Slavism: per Dostoevsky, "by Russia''s insistence and blood the Slavs have already been liberated… the Turkish empire no longer exists and… the Balkan peninsula is free and lives a new life"(Citation: 154) – the war was given the status of a sacred mission of liberating co-religionists.'
  uk: |-
    Ідеологічне виправдання загарбницької війни релігією та панславізмом: за Достоєвським, «наполяганнями і кров'ю Росії слов'яни вже звільнені… турецької імперії вже не існує і…
    Балканський півострів вільний і живе новим життям»(Citation: 154) – війні надавався статус священної місії визволення єдиновірців.
