description:
  ru: 'Оккупационная администрация насильно направляла подчиненных нохчи воевать против их собственных соотечественников: историк Е. Н. Кушева указывает в заголовке первичного документа на состоявшийся «поход терских ратных людей и терских окочан... против эндерейского владельца Салтан-Магмута и соединившихся с ним людей окоцких и мичкизских кабаков»(Citation: 82).'
  en: 'The occupation administration forcibly sent subordinated Nokhchi to fight against their own compatriots: historian E. N. Kusheva indicates in the heading of a primary document that there took place a «campaign of Terek men-at-arms and Terek Okochans... against the Endirey ruler Saltan-Magmut and the people of the Okotsk and Michkiz kabaks who had joined him»(Citation: 82).'
  uk: 'Окупаційна адміністрація насильно спрямовувала підпорядкованих Нохчі воювати проти їхніх власних співвітчизників: історик Е. Н. Кушева вказує в заголовку первинного документа на здійснений «похід терських ратних людей і терських Окочан... проти ендерейського володаря Салтан-Магмута і людей окоцьких та мічкізьких кабаків, що приєдналися до нього»(Citation: 82).'
