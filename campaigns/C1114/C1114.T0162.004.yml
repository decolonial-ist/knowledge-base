description:
  ru: 'Назначенная оккупационная администрация применяла телесные наказания и незаконные аресты: в поданной царю Михаилу Федоровичу челобитной служилых окочан Терского города указывалось, что кабардинский князь Сунчалей Янглычевич Черкасский «велит нас в тюрьму сажати и кнутьем бити без твоего государева ведома и без вины»(Citation: 92)(Citation: 82).'
  en: 'The appointed occupation administration used corporal punishment and unlawful arrests: a petition submitted to Tsar Mikhail Fyodorovich by the service Okochans of the Terek town stated that the Kabardian prince Sunchaley Yanglychevich Cherkassky «orders us to be thrown into prison and beaten with the knout without your sovereign knowledge and without guilt»(Citation: 92)(Citation: 82).'
  uk: 'Призначена окупаційна адміністрація застосовувала тілесні покарання та незаконні арешти: у поданій цареві Михайлу Федоровичу чолобитній служилих Окочан Терського міста зазначалося, що кабардинський князь Сунчалей Янгличевич Черкаський «велить нас у тюрму саджати і кнутом бити без твого государевого відома і без вини»(Citation: 92)(Citation: 82).'
