description:
  ru: 'Метрополия целенаправленно игнорировала официальные жалобы коренного населения на произвол назначенных правителей, лишая их права на защиту: составители академических сборников констатируют, что поданная царю Михаилу Федоровичу «Челобитная «окочан» не была удовлетворена»(Citation: 92).'
  en: 'The metropole deliberately ignored official complaints by the Indigenous population about the arbitrary conduct of the appointed rulers, depriving them of the right to protection: the compilers of academic document collections state that, as regards the petition submitted to Tsar Mikhail Fyodorovich, «the petition of the «Okochans» was not granted»(Citation: 92).'
  uk: 'Метрополія цілеспрямовано ігнорувала офіційні скарги корінного населення на свавілля призначених правителів, позбавляючи його права на захист: упорядники академічних збірників констатують, що подана цареві Михайлу Федоровичу «Чолобитна «Окочан» не була задоволена»(Citation: 92).'
