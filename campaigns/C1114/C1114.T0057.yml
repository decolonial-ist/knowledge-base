description:
  ru: |-
    Назначенная администрация принуждала коренное население к бесплатному труду: историк Е. Н. Кушева указывает, что кабардинский князь Сунчалей Янглычевич Черкасский заставлял подчиненных служилых окочан Терского города «изделия на него всякие делати, пашни пахати и сена косити»(Citation: 83).
    Сама метрополия годами не оплачивала военную службу коренного населения: в отписке терского воеводы Петра Петровича Головина астраханскому воеводе Ивану Никитичу Одоевскому фиксируется, что они «служат де они государю царю... всякие государевы терские... службы... а государевым денежным и хлебным жалованьем не пожалованы десятый год»(Citation: 92).
  en: |-
    The appointed administration forced the Indigenous population into unpaid labor: historian E. N. Kusheva points out that the Kabardian prince Sunchaley Yanglychevich Cherkassky compelled the service Okochans of the Terek town subordinate to him «to make all manner of wares for him, to plow the fields and to mow the hay»(Citation: 83).
    The metropole itself went years without paying for the military service of the Indigenous population: a report from the Terek voivode Pyotr Petrovich Golovin to the Astrakhan voivode Ivan Nikitich Odoyevsky records that they «serve the sovereign tsar... in all manner of the sovereign's Terek... services... yet have not been granted the sovereign's monetary and grain salary for the tenth year now»(Citation: 92).
  uk: |-
    Призначена адміністрація примушувала корінне населення до безоплатної праці: історик Е. Н. Кушева вказує, що кабардинський князь Сунчалей Янгличевич Черкаський змушував підлеглих служилих Окочан Терського міста «вироби на нього всякі робити, ріллю орати і сіно косити»(Citation: 83).
    Сама метрополія роками не оплачувала військову службу корінного населення: у відписці терського воєводи Петра Петровича Головіна астраханському воєводі Івану Микитовичу Одоєвському зафіксовано, що вони «служать государеві цареві... всякі государеві терські... служби... а государевим грошовим і хлібним жалуванням не пожалувані десятий рік»(Citation: 92).
