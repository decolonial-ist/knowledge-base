description:
  ru: 'Оккупационная администрация обложила горные общества нохчи данью: в выписке из книги Приказной избы Терского города зафиксировано, что администрация направляла людей «в Мичкизы для государева ясаку»(Citation: 82).'
  en: 'The occupation administration imposed tribute on the highland Nokhchi societies: an extract from the book of the Terek town''s Prikaz office records that the administration sent people «to the Michkizes for the sovereign''s yasak»(Citation: 82).'
  uk: 'Окупаційна адміністрація обклала гірські спільноти Нохчі даниною: у виписці з книги Приказної ізби Терського міста зафіксовано, що адміністрація направляла людей «у Мічкізи по государів ясак»(Citation: 82).'
