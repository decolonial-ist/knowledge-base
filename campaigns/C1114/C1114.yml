name:
  ru: Лишение нохчи субъектности и установление чужеродного управления (1614–1616)
  en: Deprivation of the Nokhchi of political agency and the imposition of alien governance (1614–1616)
  uk: Позбавлення Нохчі суб'єктності та встановлення чужорідного управління (1614–1616)
description:
  ru: |-
    Оккупационная администрация метрополии ликвидировала самостоятельность обществ нохчи (окочан) в Терском городе, установив над ними чужеродное управление и начав использовать их ресурсы.
    Историк Е. Н. Кушева констатирует, что в 1614 году царь Михаил Федорович повелел кабардинскому князю Сунчалею Янглычевичу Черкасскому «быть над Окопаны надо всеми... князем, судить и в ратном строенье и во всяких делах ведать»(Citation: 83).
    Назначенный правитель приступил к физической и экономической эксплуатации коренного населения.
    Кушева указывает, что он заставлял подчиненных «изделия на него всякие делати, пашни пахати и сена косити»(Citation: 83).
    Установлены факты административного вымогательства и работорговли: в челобитной царю Михаилу Федоровичу служилые окочане Терского города отчитывались, что правитель «выбрав у нас насилством ис табуна 8 конев добрых, и сослал в Кабарду в кабаки свои»(Citation: 92)(Citation: 82), «продал напрасно товарыщев наших окочан 4-х человек»(Citation: 92)(Citation: 82) и «взял в холопи жену и сослал ее в кабаки свои в Кабарду»(Citation: 92)(Citation: 82).
    В документе дополняется, что он применял к нохчи телесные наказания: «велит нас в тюрьму сажати и кнутьем бити без твоего государева ведома и без вины»(Citation: 92)(Citation: 82).
    Сама администрация метрополии годами принуждала нохчи к бесплатной службе: в отписке терского воеводы Петра Петровича Головина астраханскому воеводе Ивану Никитичу Одоевскому фиксируется, что они «служат де они государю царю... всякие государевы терские... службы... а государевым денежным и хлебным жалованьем не пожалованы десятый год»(Citation: 92).
    Коренное население также принуждали воевать против собственных соотечественников: составитель академического сборника Е. Н. Кушева указывает в заголовке первичного документа на состоявшийся «поход терских ратных людей и терских окочан... против эндерейского владельца Салтан-Магмута и соединившихся с ним людей окоцких и мичкизских кабаков»(Citation: 82).
    Параллельно метрополия облагала горные общества нохчи данью: в выписке из книги Приказной избы Терского города зафиксировано, что администрация направляла людей «в Мичкизы для государева ясаку»(Citation: 82).
    Составители академических сборников сухо констатируют финал протестов нохчи: «Челобитная «окочан» не была удовлетворена»(Citation: 92).
  en: |-
    The occupation administration of the metropole liquidated the autonomy of the Nokhchi communities (the Okochans) in the Terek town, establishing alien governance over them and beginning to exploit their resources.
    Historian E. N. Kusheva states that in 1614 Tsar Mikhail Fedorovich ordered the Kabardian prince Sunchaley Yanglychevich Cherkassky "to be prince over all the Okochans..., to judge them and to have charge of them in military organization and in all matters"(Citation: 83).
    The appointed ruler proceeded to the physical and economic exploitation of the indigenous population.
    Kusheva points out that he forced those under his rule "to perform all manner of labor for him, to plow the fields and to mow the hay"(Citation: 83).
    Facts of administrative extortion and slave trading are documented: in a petition to Tsar Mikhail Fedorovich, the service Okochans of the Terek town reported that the ruler "having taken from us by force 8 good horses from the herd, sent them off to his kabaks in Kabarda"(Citation: 92)(Citation: 82), "wrongfully sold four of our Okochan comrades"(Citation: 92)(Citation: 82) and "took a wife into bondage and sent her off to his kabaks in Kabarda"(Citation: 92)(Citation: 82).
    The document adds that he subjected the Nokhchi to corporal punishment: "he orders us to be thrown into prison and beaten with the knout without thy sovereign knowledge and without guilt"(Citation: 92)(Citation: 82).
    The administration of the metropole itself for years compelled the Nokhchi to serve without pay: a report from the Terek voivode Pyotr Petrovich Golovin to the Astrakhan voivode Ivan Nikitich Odoevsky records that they "serve the sovereign tsar... in all manner of the sovereign's Terek... services... yet for the tenth year have not been granted the sovereign's monetary and grain salary"(Citation: 92).
    The indigenous population was also forced to fight against their own compatriots: E. N. Kusheva, compiler of an academic collection, indicates in the heading of a primary document that there took place "a campaign of the Terek fighting men and the Terek Okochans... against the Endirey ruler Saltan-Magmut and the people of the Okotsk and Michkiz kabaks who had joined him"(Citation: 82).
    In parallel, the metropole imposed tribute on the mountain communities of the Nokhchi: an extract from the book of the Terek town's Prikaz office records that the administration sent men "to the Michkiz lands for the sovereign's yasak"(Citation: 82).
    The compilers of the academic collections dryly state the outcome of the Nokhchi protests: "The petition of the 'Okochans' was not granted"(Citation: 92).
  uk: |-
    Окупаційна адміністрація метрополії ліквідувала самостійність спільнот Нохчі (Окочан) у Терському місті, встановивши над ними чужорідне управління та почавши використовувати їхні ресурси.
    Історикиня Е. Н. Кушева констатує, що 1614 року цар Михайло Федорович повелів кабардинському князю Сунчалею Янгличевичу Черкаському «бути над Окочанами над усіма... князем, судити та у ратній справі й у всіляких справах відати»(Citation: 83).
    Призначений правитель узявся до фізичної та економічної експлуатації корінного населення.
    Кушева вказує, що він змушував підлеглих «вироби на нього всілякі робити, ріллю орати та сіно косити»(Citation: 83).
    Встановлено факти адміністративного здирництва та работоргівлі: у чолобитній цареві Михайлу Федоровичу служилі Окочани Терського міста звітували, що правитель «вибравши в нас насильством із табуна 8 коней добрих, заслав до Кабарди в кабаки свої»(Citation: 92)(Citation: 82), «продав безвинно товаришів наших Окочан 4-х осіб»(Citation: 92)(Citation: 82) і «взяв у холопи дружину та заслав її в кабаки свої до Кабарди»(Citation: 92)(Citation: 82).
    У документі додається, що він застосовував до Нохчі тілесні покарання: «велить нас до в'язниці саджати та кнутом бити без твого государевого відома і без вини»(Citation: 92)(Citation: 82).
    Сама адміністрація метрополії роками примушувала Нохчі до безоплатної служби: у відписці терського воєводи Петра Петровича Головіна астраханському воєводі Івану Микитовичу Одоєвському фіксується, що вони «служать де вони государю цареві... всілякі государеві терські... служби... а государевою грошовою та хлібною платнею не пожалувані десятий рік»(Citation: 92).
    Корінне населення також примушували воювати проти власних співвітчизників: укладачка академічного збірника Е. Н. Кушева вказує в заголовку первинного документа на здійснений «похід терських ратних людей і терських Окочан... проти ендерейського володаря Салтан-Магмута та людей окоцьких і мічкізських кабаків, що приєдналися до нього»(Citation: 82).
    Паралельно метрополія обкладала гірські спільноти Нохчі даниною: у виписці з книги Приказної ізби Терського міста зафіксовано, що адміністрація направляла людей «у Мічкізи для государевого ясаку»(Citation: 82).
    Укладачі академічних збірників сухо констатують фінал протестів Нохчі: «Чолобитну „Окочан" не було задоволено»(Citation: 92).
