description:
  en: 'The metropole''s occupation administration abolished Nokhchi self-governance, forcibly subordinating them to an alien elite: historian E. N. Kusheva states that in 1614 Tsar Mikhail Fyodorovich ordered the Kabardian prince Sunchaley Yanglychevich Cherkassky «to be prince over all the Okochans... to judge them and to have charge of them in military organization and in all matters»(Citation: 83).'
  uk: 'Окупаційна адміністрація метрополії ліквідувала самоврядування Нохчі, силою підпорядкувавши їх прийшлій еліті: історик Е. Н. Кушева констатує, що в 1614 році цар Михайло Федорович повелів кабардинському князю Сунчалею Янгличевичу Черкаському «бути над Окочанами над усіма... князем, судити і в ратній справі та в усяких справах відати»(Citation: 83).'
  ru: 'Оккупационная администрация метрополии ликвидировала самоуправление нохчи, силой подчинив их пришлой элите: историк Е. Н. Кушева констатирует, что в 1614 году царь Михаил Федорович повелел кабардинскому князю Сунчалею Янглычевичу Черкасскому «быть над Окопаны надо всеми... князем, судить и в ратном строенье и во всяких делах ведать»(Citation: 83).'
