description:
  ru: 'Назначенная оккупационная администрация обращала коренное население в рабство: в поданной царю Михаилу Федоровичу челобитной служилых окочан Терского города указывалось, что кабардинский князь Сунчалей Янглычевич Черкасский «продал напрасно товарыщев наших окочан 4-х человек»(Citation: 92)(Citation: 82) и «взял в холопи жену и сослал ее в кабаки свои в Кабарду»(Citation: 92)(Citation: 82).'
  en: 'The appointed occupation administration enslaved the Indigenous population: a petition submitted to Tsar Mikhail Fyodorovich by the service Okochans of the Terek town stated that the Kabardian prince Sunchaley Yanglychevich Cherkassky «wrongfully sold 4 of our fellow Okochans»(Citation: 92)(Citation: 82) and «took a wife into bondage and sent her off to his kabaks in Kabarda»(Citation: 92)(Citation: 82).'
  uk: 'Призначена окупаційна адміністрація обертала корінне населення в рабство: у поданій цареві Михайлу Федоровичу чолобитній служилих Окочан Терського міста зазначалося, що кабардинський князь Сунчалей Янгличевич Черкаський «продав безвинно товаришів наших Окочан 4-х осіб»(Citation: 92)(Citation: 82) і «взяв у холопи жінку і заслав її в кабаки свої в Кабарду»(Citation: 92)(Citation: 82).'
