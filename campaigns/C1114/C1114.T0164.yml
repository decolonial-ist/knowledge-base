description:
  en: 'Representatives of the metropole''s authorities openly seized property from the Nokhchi population, abusing their official position: in their petition to Tsar Mikhail Fyodorovich, the service Okochans of the Terek town reported that the Kabardian prince Sunchaley Yanglychevich Cherkassky «having taken from us by force 8 good horses from the herd, sent them off to his kabaks (villages) in Kabarda»(Citation: 92)(Citation: 82).'
  uk: 'Представники влади метрополії відкрито відбирали власність у населення Нохчі, використовуючи своє службове становище: у своїй чолобитній цареві Михайлу Федоровичу служилі Окочани Терського міста звітували, що кабардинський князь Сунчалей Янгличевич Черкаський «вибрав у нас насильством із табуна 8 коней добрих, і заслав у Кабарду в кабаки свої»(Citation: 92)(Citation: 82).'
  ru: 'Представители власти метрополии открыто отбирали собственность у населения нохчи, используя свое служебное положение: в своей челобитной царю Михаилу Федоровичу служилые окочане Терского города отчитывались, что кабардинский князь Сунчалей Янглычевич Черкасский «выбрав у нас насилством ис табуна 8 конев добрых, и сослал в Кабарду в кабаки свои»(Citation: 92)(Citation: 82).'
