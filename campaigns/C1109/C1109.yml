name:
  ru: Циклическая перестройка и ликвидация укреплений на реке Сунжа (1571–1653)
  en: Cyclical Rebuilding and Elimination of Fortifications on the Sunzha River (1571–1653)
  uk: Циклічна перебудова та ліквідація укріплень на річці Сунжа (1571–1653)
description:
  ru: |-
    Регулярная армия Московского Царства осуществляла циклическую ликвидацию и возобновление военного присутствия на землях нохчи в устье реки Сунжи.
    Возведенная в 1567 году первая военная база была вскоре уничтожена: историк Е. Н. Кушева отмечает, что «город 1567 г. был около 1571 г. снесен»(Citation: 83).
    Причину ликвидации базы указывает военный историк В. А. Потто: она «вскоре была уничтожена в угоду турецкому султану»(Citation: 74).
    Позже военное присутствие на землях нохчи возобновили: историк Е. Н. Кушева пишет, что «в 1577 - 1578 гг... русский город был возобновлен на реке на Терке на устье Сунчи»(Citation: 83).
    Однако вторая военная база также была ликвидирована: историк Е. Н. Кушева указывает, что этот «русский город был также вскоре разорен по требованию хана»(Citation: 83).
    Очередное укрепление многократно перестраивалось: составитель сборника документов Е. Н. Кушева указывает, что военные силы Московского Царства «острог отстраивали в 1590, 1635 гг.»(Citation: 82), а также отмечает, что в перерывах «крепость по политическим причинам была оставлена в 1605 г.»(Citation: 82).
    Попытка закрепиться на землях нохчи произошла позже: составитель сборника документов Е. Н. Кушева фиксирует, что «в 1651 г. был вновь построен русский острог на левом берегу Сунжи»(Citation: 82).
    Однако вскоре он был окончательно ликвидирован: составитель сборника Е. Н. Кушева указывает, что «в 1653 г. острог был сожжен персидскими войсками и больше не восстанавливался»(Citation: 82).
  en: |-
    The Regular Army of the Tsardom of Muscovy carried out the cyclical elimination and renewal of its military presence on the lands of the Nokhchi at the mouth of the Sunzha River.
    The first military base, built in 1567, was soon destroyed: historian E. N. Kusheva notes that "the town of 1567 was demolished around 1571"(Citation: 83).
    Military historian V. A. Potto indicates the reason for the base's elimination: it "was soon destroyed to appease the Turkish sultan"(Citation: 74).
    Later, the military presence on the lands of the Nokhchi was renewed: historian E. N. Kusheva writes that "in 1577-1578... the Russian town was restored on the Terek River at the mouth of the Sunzha"(Citation: 83).
    However, the second military base was also eliminated: historian E. N. Kusheva indicates that this "Russian town was likewise soon destroyed at the demand of the khan"(Citation: 83).
    The subsequent fortification was rebuilt many times: E. N. Kusheva, compiler of a collection of documents, indicates that the military forces of the Tsardom of Muscovy "rebuilt the ostrog in 1590 and 1635"(Citation: 82), and also notes that in the intervals "the fortress was abandoned for political reasons in 1605"(Citation: 82).
    Another attempt to gain a foothold on the lands of the Nokhchi took place later: E. N. Kusheva, compiler of the collection of documents, records that "in 1651 a Russian ostrog was built anew on the left bank of the Sunzha"(Citation: 82).
    However, it was soon eliminated for good: compiler E. N. Kusheva indicates that "in 1653 the ostrog was burned by Persian troops and was never rebuilt"(Citation: 82).
  uk: |-
    Регулярна армія Московського царства здійснювала циклічну ліквідацію та відновлення військової присутності на землях Нохчі в гирлі річки Сунжі.
    Зведена 1567 року перша військова база була невдовзі знищена: історик Е. Н. Кушева зазначає, що «місто 1567 р. було близько 1571 р. знесене»(Citation: 83).
    Причину ліквідації бази вказує військовий історик В. А. Потто: вона «невдовзі була знищена на догоду турецькому султанові»(Citation: 74).
    Пізніше військову присутність на землях Нохчі відновили: історик Е. Н. Кушева пише, що «в 1577-1578 рр... російське місто було відновлене на річці Терек у гирлі Сунчі»(Citation: 83).
    Проте друга військова база також була ліквідована: історик Е. Н. Кушева вказує, що це «російське місто було також невдовзі розорене на вимогу хана»(Citation: 83).
    Чергове укріплення багаторазово перебудовувалося: укладачка збірника документів Е. Н. Кушева вказує, що військові сили Московського царства «острог відбудовували в 1590, 1635 рр.»(Citation: 82), а також зазначає, що в перервах «фортеця з політичних причин була залишена в 1605 р.»(Citation: 82).
    Спроба закріпитися на землях Нохчі відбулася пізніше: укладачка збірника документів Е. Н. Кушева фіксує, що «в 1651 р. було знову збудовано російський острог на лівому березі Сунжі»(Citation: 82).
    Однак невдовзі він був остаточно ліквідований: укладачка збірника Е. Н. Кушева вказує, що «в 1653 р. острог було спалено перськими військами й більше не відновлювано»(Citation: 82).
