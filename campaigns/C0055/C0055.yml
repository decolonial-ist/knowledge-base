name:
  ru: Закон Кивалова-Колесниченко (2012)
  en: The Kivalov-Kolesnichenko Law (2012)
  uk: Закон Ківалова-Колесніченка (2012)
description:
  ru: |-
    Попытка пророссийских политических сил в Украине институционализировать вытеснение государственного языка из публичной сферы, образования и делопроизводства путем принятия закона «Об основах государственной языковой политики» от 3 июля 2012 года № 5029-VI, расширявшего права так называемых региональных языков(Citation: 198).
    Решением от 28 февраля 2018 года № 2-р/2018 Конституционный суд Украины признал закон неконституционным(Citation: 446).
  en: |-
    An attempt by pro-Russian political forces in Ukraine to institutionalize the displacement of the state language from the public sphere, education, and record-keeping through the adoption of the law "On the Principles of State Language Policy" of July 3, 2012, No. 5029-VI, which expanded the rights of so-called regional languages(Citation: 198).
    By its decision of February 28, 2018, No. 2-r/2018, the Constitutional Court of Ukraine declared the law unconstitutional(Citation: 446).
  uk: |-
    Спроба проросійських політичних сил в Україні інституціоналізувати витіснення державної мови з публічної сфери, освіти та діловодства шляхом ухвалення закону «Про засади державної мовної політики» від 3 липня 2012 року № 5029-VI, що розширював права так званих регіональних мов(Citation: 198).
    Рішенням від 28 лютого 2018 року № 2-р/2018 Конституційний Суд України визнав закон неконституційним(Citation: 446).
