description:
  ru: |-
    Наместник на Кавказе и главнокомандующий Кавказской армией Барятинский - о желающих уйти чеченцах: «...это, пожалуй, и не дурно, что уйдет вся эта сволочь, которая нам только в тягость.
    Не останавливайте, пусть идут в Мекку или куда хотят.
    А уж я постараюсь представить Государю это дело в настоящем виде...» - императору дело представили как «добровольное движение самих чеченцев»(Citation: 125).
    Начальник Кубанской области генерал Евдокимов, проводивший выселение горцев Западного Кавказа, сформулировал принцип: «Первая филантропия – своим; горцам же я считаю себя вправе предоставить лишь то, что останется на их долю после удовлетворения последнего из русских интересов»(Citation: 125).
    Оптику, в которой такие решения принимались, формулировала и имперская наука: Берже, 22 года возглавлявший Кавказскую археографическую комиссию и составивший первые десять томов «Актов»(Citation: 108), обосновывал недоверие к горцам их природой: «Восьмисоттысячное горское население Терской и Дагестанской областей составляет тут почти сплошную массу...
    Проникнутая мусульманским фанатизмом, распаленным продолжительной войной, она продолжает ненавидеть нас, как недавних еще заклятых врагов, как неверных, и будет сохранять это чувство до тех пор, пока мы останемся в ее глазах гяурами»(Citation: 255).
    Это не приказ, а голос эпохи - тот язык, на котором выселение выглядело естественным.
  en: |-
    The Viceroy of the Caucasus and commander-in-chief of the Caucasus Army Baryatinsky - on the Chechens who wished to leave: "...it is perhaps no bad thing that all this rabble, which is only a burden to us, will leave.
    Do not stop them, let them go to Mecca or wherever they wish.
    And I will take care to present this matter to the Sovereign in the proper light..." - to the emperor the matter was presented as "a voluntary movement of the Chechens themselves"(Citation: 125).
    The head of the Kuban oblast, General Yevdokimov, who carried out the expulsion of the highlanders of the Western Caucasus, formulated the principle: "Philanthropy first of all to our own; as for the highlanders, I consider myself entitled to grant them only what remains for their share after the last of Russian interests has been satisfied"(Citation: 125).
    The optic in which such decisions were taken was also articulated by imperial scholarship: Berzhe, who headed the Caucasus Archaeographic Commission for 22 years and compiled the first ten volumes of the "Acts"(Citation: 108), grounded distrust of the highlanders in their nature: "The eight-hundred-thousand-strong highland population of the Terek and Dagestan oblasts forms here an almost solid mass...
    Permeated by Muslim fanaticism, inflamed by the long war, it continues to hate us as still-recent sworn enemies, as infidels, and will preserve this feeling as long as we remain giaours in its eyes"(Citation: 255).
    This is not an order but the voice of the epoch - the language in which the expulsion looked natural.
  uk: |-
    Намісник на Кавказі й головнокомандувач Кавказької армії Барятинський - про чеченців, що бажали піти: «...це, мабуть, і непогано, що піде вся ця сволота, яка нам лише тягарем.
    Не зупиняйте, нехай ідуть до Мекки чи куди хочуть.
    А вже я постараюся подати Государеві цю справу в належному вигляді...» - імператорові справу подали як «добровільний рух самих чеченців»(Citation: 125).
    Начальник Кубанської області генерал Євдокимов, що проводив виселення горців Західного Кавказу, сформулював принцип: «Перша філантропія – своїм; горцям же я вважаю себе вправі надати лише те, що залишиться на їхню долю після задоволення останнього з російських інтересів»(Citation: 125).
    Оптику, в якій ухвалювалися такі рішення, формулювала й імперська наука: Берже, який 22 роки очолював Кавказьку археографічну комісію і уклав перші десять томів «Актів»(Citation: 108), обґрунтовував недовіру до горців їхньою природою: «Восьмисоттисячне горське населення Терської і Дагестанської областей становить тут майже суцільну масу...
    Пройнята мусульманським фанатизмом, розпаленим тривалою війною, вона продовжує ненавидіти нас, як іще недавніх заклятих ворогів, як невірних, і зберігатиме це почуття доти, доки ми залишатимемося в її очах гяурами»(Citation: 255).
    Це не наказ, а голос епохи - та мова, якою виселення виглядало природним.
