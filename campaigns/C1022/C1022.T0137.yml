description:
  en: |-
    The head of the Terek oblast, General Loris-Melikov, stressed in a special dispatch to the Main Staff of the Caucasus Army: "For the success of the affair it is necessary that the highlanders not only not know of our desire to assist the resettlement, but the local authorities must, on the contrary, as it were dissuade them from this intention"(Citation: 125); its execution was entrusted to the head of the Middle Military Division, Tumanov, and he reported on it to Loris-Melikov himself: "The first and indispensable condition for arousing in the Chechens the desire to resettle to Turkey I consider to be not revealing that this desire comes from the government... consequently, all this must remain in the deepest secrecy; on our skill it will depend to complete the great [work] without bloodshed or particular disorders…"(Citation: 251).
    In Chechnya "forged proclamations were circulated, purporting to come from the Turkish government, in which the migrants were promised a cordial welcome and good material provision"(Citation: 125) - Loris-Melikov himself asked in writing to be sent samples of Turkish proclamations "for circulation among the population"(Citation: 251).
    Agents frightened the people with the future: they "spread provocative rumours that not a single Chechen would receive a scrap of land, that all the young men would be given up as soldiers, that the Muslim religion would sooner be banned and everyone would become Christians"(Citation: 251).
  uk: |-
    Начальник Терської області генерал Лорис-Меліков у спеціальній депеші до Головного штабу Кавказької армії підкреслював: «Для успіху справи необхідно, щоб горці не тільки не знали про наше бажання сприяти переселенню, а й місцева влада мусить, навпаки, ніби відхиляти їх від цього наміру»(Citation: 125); виконувати її доручили начальникові Середнього військового відділу Туманову, і він звітував про неї самому Лорис-Мелікову: «Першою і неодмінною умовою для збудження в чеченцях бажання переселитися до Туреччини вважаю невиявлення того, що бажання це походить від уряду... отже, все це має залишатися в найглибшій таємниці; від нашого вміння залежатиме без кровопролиття чи особливих негараздів довершити велике…»(Citation: 251).
    У Чечні «поширювалися підроблені прокламації, нібито від турецького уряду, в яких переселенцям обіцяли гостинний прийом і добре матеріальне забезпечення»(Citation: 125) - сам Лорис-Меліков письмово просив надіслати йому зразки турецьких прокламацій «для поширення серед населення»(Citation: 251).
    Агенти лякали народ майбутнім: «розпускали провокаційні чутки про те, що жоден чеченець не отримає ані клаптя землі, що всю молодь віддадуть у солдати, що мусульманську релігію скоріше заборонять і всі стануть християнами»(Citation: 251).
  ru: |-
    Начальник Терской области генерал Лорис-Меликов в специальной депеше в Главный штаб Кавказской армии подчёркивал: «Для успеха дела необходимо, чтобы горцы не только не знали о желании нашем содействовать переселению, но и местная власть должна напротив, как бы отклонять их от этого намерения»(Citation: 125); исполнять её поручили начальнику Среднего военного отдела Туманову, и он отчитывался о ней самому Лорис-Меликову: «Первым и непременным условием к возбуждению в чеченцах желания переселиться в Турцию полагаю не обнаружение, что желание это исходит от правительства... следовательно, все это должно оставаться в глубочайшей тайне; от нашего умения будет зависеть без кровопролития или особых неурядиц довершить великое…»(Citation: 251).
    В Чечне «распространялись поддельные прокламации, якобы исходящие от турецкого правительства, в которых переселенцам обещался радушный прием и хорошее материальное обеспечение»(Citation: 125) - сам Лорис-Меликов письменно просил прислать ему образцы турецких прокламаций «для распространения в населении»(Citation: 251).
    Агенты пугали народ будущим: «распускали провокационные слухи о том, что ни один чеченец не получит ни клочка земли, что вся молодёжь будет отдана в солдаты, что мусульманская религия скорее будет запрещена и все станут христианами»(Citation: 251).
