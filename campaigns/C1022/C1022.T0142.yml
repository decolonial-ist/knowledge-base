description:
  en: |-
    The empire's answer to the pleas of those who returned was fixed in a formula "at the very highest level": "Of any return migration of the highlanders there can be no talk"(Citation: 125).
    Under the rules approved in June 1861 by the chief of the Main Staff of the Caucasus Army, General Kartsov, highlanders who had entered Turkish subjecthood or overstayed their passports were "resolutely forbidden" to return(Citation: 251).
    By November 1865, 2,600 people had gathered at the border, ready to accept Orthodoxy for the sake of returning - "However, the Russian leadership even on such terms was in no hurry to let them through the border... they no longer had anywhere to return to; their ancestral lands had been either confiscated or sold"(Citation: 251).
    Those who tried to return secretly were caught for years: in 1867, 162 people were detained; in 1868 - 663; in 1869 - 369; in 1870 - 1,263; "Over ten years, from 1862 to 1872, 5,964 highlanders (mostly Chechens) managed to return to the Terek oblast, of whom 2,315 the authorities forcibly expelled to Turkey once again"(Citation: 125).
    Even those permitted were not allowed home: the returning Karabulaks (a Vainakh society kindred to the Chechens) "were not admitted to their native lands, but settled as a single aul, Sagopshi, on the lands of the Chechen village of Psedakh"(Citation: 125).
  uk: |-
    Відповідь імперії на прохання тих, хто повернувся, зафіксована формулою «на найвищому рівні»: «Про зворотне переселення горців і мови бути не може»(Citation: 125).
    За правилами, затвердженими в червні 1861 року начальником Головного штабу Кавказької армії генералом Карцовим, горцям, які вступили в турецьке підданство або прострочили паспорти, повертатися «рішуче заборонялося»(Citation: 251).
    До листопада 1865 року на кордоні скупчилося 2600 осіб, готових заради повернення прийняти православ'я, - «Однак російське керівництво навіть на таких умовах не поспішало пропускати їх через кордон... повертатися їм було вже нікуди, родові землі були або конфісковані, або продані»(Citation: 251).
    Тих, хто намагався повернутися таємно, ловили роками: 1867 року затримано 162 особи, 1868 - 663, 1869 - 369, 1870 - 1263; «За десять років, з 1862 по 1872 рр., до Терської області зуміли повернутися 5964 горці (переважно чеченці), з яких 2315 осіб влада в примусовому порядку знову вислала до Туреччини»(Citation: 125).
    Навіть дозволених не пускали додому: карабулаків (вайнахське товариство, споріднене з чеченцями), що повернулися, «не було допущено на рідні землі, а поселено одним аулом Сагопші на землях чеченського селища Пседах»(Citation: 125).
  ru: |-
    Ответ империи на просьбы вернувшихся зафиксирован формулой «на самом высоком уровне»: «Об обратном переселении горцев и речи быть не может»(Citation: 125).
    По правилам, утверждённым в июне 1861 года начальником Главного штаба Кавказской армии генералом Карцовым, горцам, вступившим в турецкое подданство или просрочившим паспорта, возвращаться «решительно воспрещалось»(Citation: 251).
    К ноябрю 1865 года на границе скопилось 2600 человек, готовых ради возвращения принять православие, - «Однако российское руководство даже на таких условиях не спешило пропускать их через границу... возвращаться им было уже некуда, родовые земли были или конфискованы или проданы»(Citation: 251).
    Пытавшихся вернуться тайно ловили годами: в 1867 году задержано 162 человека, в 1868 - 663, в 1869 - 369, в 1870 - 1263; «За десять лет, с 1862 по 1872 гг., в Терскую область сумели вернуться 5964 горца (в основном чеченцы), из которых 2315 человек власти в принудительном порядке снова выслали в Турцию»(Citation: 125).
    Даже разрешённых не пускали домой: вернувшихся карабулаков (вайнахское общество, родственное чеченцам) «не были допущены на родные земли, а поселены одним аулом Сагопши на землях чеченского селения Пседах»(Citation: 125).
