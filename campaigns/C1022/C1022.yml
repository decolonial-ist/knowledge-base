name:
  ru: 'Мухаджирство: выселение чеченцев в Османскую империю, запрет возвращения и замещение населения (1858-1872)'
  en: 'Muhajirism: the expulsion of Chechens to the Ottoman Empire, the ban on return, and population replacement (1858-1872)'
  uk: 'Мухаджирство: виселення чеченців до Османської імперії, заборона повернення та заміщення населення (1858-1872)'
description:
  ru: |-
    В 1858-1872 годах империя вытолкнула чеченцев в Османскую империю и держала закрытой дорогу назад.
    Мухаджирство - от арабского «мухаджир», переселенец, уходящий ради веры: так называли ушедших, и это же имя закрепилось за всей волной выселения.
    Летом 1865 года из Чечни ушли более 23 тысяч человек, пятая часть чеченского народа; уходили волнами, которые имперская канцелярия считала «партиями» - их набралось 28; операцией руководил бывший начальник Чеченского округа генерал Кундухов, которому имперские власти поручили выселение(Citation: 95)(Citation: 125).
    Чеченское выселение было частью общей операции: по официальным данным, за 1858-1865 годы с Северного Кавказа выселено 493 194 человека, из них 443 082 - представители адыгских племён и абхазы(Citation: 255).
    На западе Кавказа орудием была война, на востоке - экономическое удушение и тайная агитация.
    Цель сформулирована в переписке командования Кавказской армии об окончании войны на Западном Кавказе: «...вопрос о времени окончания войны, при настоящих обстоятельствах, приводит к тому – во сколько времени успеем мы отправить в Турцию враждебное нам население»(Citation: 125).
    Начальник штаба Кавказского корпуса Милютин признал характер политики письменно ещё в 1857 году: «обязанности к человеческому роду требуют, чтобы мы заблаговременно приняли меры для обеспечения существования даже и враждебных нам племен, которых по государственной надобности вытесняем из их земель»(Citation: 251).
    Чеченская народная песня сохранила счёт виновников: «Мусульманский царь зовёт нас к себе, / Царь русский – остаться просит! / Без огня и ветра Чечня запылала: / Огнём был Алхасов Муса, / Вихрем подул Османов Садулла... / Вот он, день страшного суда!»(Citation: 251).
    Оба названы по-чеченски, и оба - организаторы выселения: Алхасов Муса - это тот самый генерал Кундухов, а Османов Садулла - его помощник, наиб Малой Чечни (наиб - поставленный властью управляющий округом).
    Историк Д. А. Хожаев ставит выселение в один ряд с депортацией 1944 года: «Геноцид против чеченского народа был осуществлен в XIX веке, во время Кавказской войны и после нее, при выселении в Турцию»(Citation: 95).
  en: |-
    In 1858-1872 the empire pushed the Chechens out into the Ottoman Empire and kept the road back closed.
    Muhajirism comes from the Arabic "muhajir," a migrant who leaves for the sake of faith: that is what those who left were called, and the same name became attached to the whole wave of expulsion.
    In the summer of 1865 more than 23 thousand people left Chechnya, a fifth of the Chechen people; they left in waves that the imperial chancellery counted as "parties" - there were 28 of them; the operation was led by General Kundukhov, former head of the Chechen okrug, whom the imperial authorities tasked with the expulsion(Citation: 95)(Citation: 125).
    The Chechen expulsion was part of a wider operation: according to official data, in 1858-1865 a total of 493,194 people were expelled from the North Caucasus, of whom 443,082 were members of the Adyghe peoples and Abkhazians(Citation: 255).
    In the west of the Caucasus the instrument was war; in the east - economic strangulation and covert agitation.
    The goal was formulated in the correspondence of the command of the Caucasus Army on ending the war in the Western Caucasus: "...the question of when the war will end, under the present circumstances, comes down to this – how soon we will manage to send off to Turkey the population hostile to us"(Citation: 125).
    The chief of staff of the Caucasus Corps, Milyutin, admitted the nature of the policy in writing as early as 1857: "our duties to the human race require that we take measures in advance to secure the existence even of the tribes hostile to us, whom we are forcing out of their lands out of state necessity"(Citation: 251).
    A Chechen folk song kept the tally of the culprits: "The Muslim tsar calls us to him, / The Russian tsar begs us to stay! / Without fire or wind Chechnya burst into flame: / The fire was Alkhasov Musa, / The whirlwind's blast was Osmanov Sadulla... / Here it is, the day of the Last Judgement!"(Citation: 251).
    Both are named in the Chechen manner, and both were organizers of the expulsion: Alkhasov Musa is that same General Kundukhov, and Osmanov Sadulla was his assistant, the naib of Lesser Chechnya (a naib is an administrator of a district installed by the authorities).
    The historian D. A. Khozhayev places the expulsion in the same line as the deportation of 1944: "The genocide against the Chechen people was carried out in the 19th century, during the Caucasus War and after it, during the expulsion to Turkey"(Citation: 95).
  uk: |-
    У 1858-1872 роках імперія виштовхнула чеченців до Османської імперії й тримала дорогу назад закритою.
    Мухаджирство - від арабського «мухаджир», переселенець, що йде заради віри: так називали тих, хто пішов, і це ж ім'я закріпилося за всією хвилею виселення.
    Влітку 1865 року з Чечні пішли понад 23 тисячі людей, п'ята частина чеченського народу; йшли хвилями, які імперська канцелярія рахувала «партіями» - їх набралося 28; операцією керував колишній начальник Чеченського округу генерал Кундухов, якому імперська влада доручила виселення(Citation: 95)(Citation: 125).
    Чеченське виселення було частиною загальної операції: за офіційними даними, за 1858-1865 роки з Північного Кавказу виселено 493 194 особи, з них 443 082 - представники адигських племен і абхази(Citation: 255).
    На заході Кавказу знаряддям була війна, на сході - економічне задушення і таємна агітація.
    Мету сформульовано в листуванні командування Кавказької армії про закінчення війни на Західному Кавказі: «...питання про час закінчення війни, за теперішніх обставин, зводиться до того – за скільки часу ми встигнемо відправити до Туреччини вороже нам населення»(Citation: 125).
    Начальник штабу Кавказького корпусу Мілютін визнав характер політики письмово ще 1857 року: «обов'язки перед людським родом вимагають, щоб ми завчасно вжили заходів для забезпечення існування навіть і ворожих нам племен, яких з державної потреби витісняємо з їхніх земель»(Citation: 251).
    Чеченська народна пісня зберегла рахунок винуватців: «Мусульманський цар кличе нас до себе, / Цар російський – лишитися просить! / Без вогню і вітру Чечня запалала: / Вогнем був Алхасов Муса, / Вихором подув Османов Садулла... / Ось він, день страшного суду!»(Citation: 251).
    Обидва названі по-чеченськи, і обидва - організатори виселення: Алхасов Муса - це той самий генерал Кундухов, а Османов Садулла - його помічник, наїб Малої Чечні (наїб - поставлений владою управитель округу).
    Історик Д. А. Хожаєв ставить виселення в один ряд із депортацією 1944 року: «Геноцид проти чеченського народу було здійснено в XIX столітті, під час Кавказької війни і після неї, під час виселення до Туреччини»(Citation: 95).
