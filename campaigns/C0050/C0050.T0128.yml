description:
  ru: |-
    Прямое закрытие легальных просветительских обществ: из примерно сорока «Просвит» подроссийской Украины на Полтавщине и Харьковщине их запрещали с самого основания, а в 1908–1910 годах, при Столыпине, ликвидированы практически все остальные, кроме отделов Екатеринославской губернии(Citation: 431).
    Разгром получил доктринальное обоснование: Столыпин в обращении к Сенату заявил, что оживление украинской культурной жизни нежелательно, ибо «три основные ветви восточного славянства и происхождением и языком не могут не составлять одного целого»(Citation: 431).

    Циркуляр Столыпина губернаторам (20 января 1910) — полный запрет на самоорганизацию: «при обсуждении ходатайств о регистрации каких бы то ни было инородческих обществ… надлежит… неукоснительно отказывать в регистрации их уставов»(Citation: 160).
  en: |-
    The direct closure of legal educational societies: of the roughly forty "Prosvitas" of Russian-ruled Ukraine, those in the Poltava and Kharkiv regions were banned from their very founding, and in 1908–1910, under Stolypin, virtually all the rest were liquidated, except the branches of the Katerynoslav governorate(Citation: 431).
    The crackdown received its doctrinal grounding: Stolypin declared in an address to the Senate that the revival of Ukrainian cultural life was undesirable, for "the three principal branches of Eastern Slavdom, both by origin and by language, cannot but constitute one whole"(Citation: 431).

    Stolypin's circular to the governors (20 January 1910) — a complete ban on self-organization: "when considering petitions for the registration of any alien societies whatsoever… one must… refuse without fail the registration of their charters"(Citation: 160).
  uk: |-
    Пряме закриття легальних просвітницьких товариств: із близько сорока «Просвіт» підросійської України на Полтавщині та Харківщині їх забороняли від самого заснування, а в 1908–1910 роках, за Столипіна, ліквідовано практично всі інші, крім відділів Катеринославської губернії(Citation: 431).
    Розгром дістав доктринальне обґрунтування: Столипін у зверненні до Сенату заявив, що пожвавлення українського культурного життя небажане, бо «три основні гілки східнього слов'янства і походженням і мовою не можуть не складати одного цілого»(Citation: 431).

    Циркуляр Столипіна губернаторам (20 січня 1910) — повна заборона самоорганізації: «при обговоренні клопотань про реєстрацію будь-яких інородницьких товариств… належить… неухильно відмовляти в реєстрації їхніх статутів»(Citation: 160).
