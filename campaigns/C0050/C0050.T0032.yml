description:
  en: 'The official classing of the indigenous population as aliens: Stolypin prescribed to the governors to refuse the registration of "any alien societies whatsoever, including Ukrainian and Jewish ones, regardless of the aims they pursue"(Citation: 160).'
  uk: 'Офіційне зарахування корінного населення до чужинців: Столипін приписав губернаторам відмовляти в реєстрації «будь-яких інородницьких товариств, у тому числі українських і єврейських, незалежно від цілей, які вони переслідують»(Citation: 160).'
  ru: 'Официальное зачисление коренного населения в чужаки: Столыпин предписал губернаторам отказывать в регистрации «каких бы то ни было инородческих обществ, в том числе украинских и еврейских, независимо от преследуемых ими целей»(Citation: 160).'
