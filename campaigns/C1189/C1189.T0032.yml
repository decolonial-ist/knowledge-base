description:
  ru: |-
    Российская империя 13 августа 1914 года перевела Терскую область на положение «чрезвычайной охраны» - имперский режим, отдававший жителей под внесудебные полномочия администрации, - а затем администрация области издала приказ «об охране спокойствия на предприятиях», по которому судьбу «нарушителей спокойствия» решали военные суды(Citation: 125).
    Как это работало, видно по стачке мая 1916 года на грозненских промыслах: администрация ввела на промыслы вооружённых казаков, те арестовали 13 рабочих, и, как замечают историки Я. З. Ахмадов и Э. Х. Хасмагомадов, «все арестованные оказались мусульманами»(Citation: 125).
    Ещё девятерых рабочих полиция арестовала в первый день стачки - за то, что они подали тревожные заводские гудки(Citation: 125).
  en: |-
    On 13 August 1914 the Russian Empire placed the Terek oblast under the regime of "extraordinary security" - an imperial regime that handed the residents over to the extrajudicial powers of the administration - and then the oblast administration issued an order "on the protection of tranquility at the enterprises", under which the fate of "violators of tranquility" was decided by military courts(Citation: 125).
    How this worked can be seen from the strike of May 1916 at the Grozny oil fields: the administration brought armed Cossacks onto the fields, they arrested 13 workers, and, as historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov remark, "all those arrested turned out to be Muslims"(Citation: 125).
    The police arrested nine more workers on the first day of the strike - for sounding the alarm whistles of the plants(Citation: 125).
  uk: |-
    Російська імперія 13 серпня 1914 року перевела Терську область на положення «надзвичайної охорони» - імперський режим, що віддавав жителів під позасудові повноваження адміністрації, - а потім адміністрація області видала наказ «про охорону спокою на підприємствах», за яким долю «порушників спокою» вирішували військові суди(Citation: 125).
    Як це працювало, видно по страйку травня 1916 року на грозненських промислах: адміністрація ввела на промисли озброєних козаків, ті заарештували 13 робітників, і, як зауважують історики Я. З. Ахмадов і Е. Х. Хасмагомадов, «усі заарештовані виявилися мусульманами»(Citation: 125).
    Ще дев'ятьох робітників поліція заарештувала в перший день страйку - за те, що вони подали тривожні заводські гудки(Citation: 125).
