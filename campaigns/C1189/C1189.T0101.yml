description:
  ru: 'Российская империя 16 августа 1914 года, через три дня после перевода Терской области на положение «чрезвычайной охраны», ввела в области временное положение о военной цензуре(Citation: 125)(Citation: 127).'
  en: 'On 16 August 1914, three days after placing the Terek oblast under "extraordinary security", the Russian Empire introduced in the oblast a provisional statute on military censorship(Citation: 125)(Citation: 127).'
  uk: 'Російська імперія 16 серпня 1914 року, через три дні після переведення Терської області на положення «надзвичайної охорони», запровадила в області тимчасове положення про військову цензуру(Citation: 125)(Citation: 127).'
