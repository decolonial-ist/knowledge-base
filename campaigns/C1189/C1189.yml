name:
  en: 'First World War in Chechnya: removal of the "unreliable element" into the "Savage Division", extraordinary security and mobilization of strikers (1914-1917)'
  uk: 'Перша світова війна в Чечні: вивіз «ненадійного елементу» в «Дику дивізію», надзвичайна охорона і мобілізація страйкарів (1914-1917)'
  ru: 'Первая мировая война в Чечне: вывоз «ненадежного элемента» в «Дикую дивизию», чрезвычайная охрана и мобилизация бастующих (1914-1917)'
description:
  en: |-
    In 1914-1917 the Russian Empire waged the world war both with Chechen hands and at Chechen expense: it carried off to the front, in the "Savage Division", those it considered dangerous, laid the upkeep of the Chechen regiment on the Chechen communities themselves, introduced "extraordinary security" with military courts and censorship in the Terek oblast, and sent striking workers into the army.
    By 1914 Chechnya had lived for half a century under "Military-Popular Administration" - the colonial regime of the Terek oblast (campaign C1170), without the land taken away for Cossack stanitsas (campaign C1171), and under collective punishments for the abrek phenomenon - the empire's name for a highlander's going into the mountains with a weapon after being declared an outlaw; for a single abrek the empire fined and deported entire villages (campaign C1175).
    The empire did not extend military conscription to the Chechens: a commission of the Caucasus Military District found it desirable to bring the Muslims of the Caucasus into service "...on the same grounds as the indigenous population of the Empire...", but to exempt the Chechens and the neighboring Kumyks temporarily, since the Chechens were not yet sufficiently "pacified"; the commander of the Caucasus Military District objected: "The exemption of the Chechens from military conscription, even a temporary one... will be as it were a recognition of privileges for the Chechens for their robberies and brigandage, and in the cause of the pacification of the North Caucasus will bring harm rather than benefit"(Citation: 125).
    The decision on the gradual introduction of conscription for the Muslim highlanders the empire took only in 1913, but by the start of the war the administration of the Terek oblast had not even begun to compile the family lists - a kind of household census - and did not dare to declare mobilization: it confined itself to recruiting volunteers(Citation: 125).
    The only mobilization the Russian Empire declared was not for the war but against a strike: in May 1916 it mobilized Grozny workers who held military service deferrals, for taking part in the strike(Citation: 125).
  uk: |-
    У 1914-1917 роках Російська імперія вела світову війну і чеченськими руками, і чеченським коштом: вивезла на фронт «Дикою дивізією» тих, кого вважала небезпечними, утримання Чеченського полку поклала на самі чеченські громади, запровадила в Терській області «надзвичайну охорону» з військовими судами і цензурою, а страйкарів відправляла в армію.
    До 1914 року Чечня півстоліття жила під «військово-народним управлінням» - колоніальним режимом Терської області (кампанія C1170), без землі, відібраної під козацькі станиці (кампанія C1171), і під колективними покараннями за абрецтво - так імперія називала відхід горців у гори зі зброєю після оголошення їх поза законом; за одного абрека вона штрафувала і виселяла цілі села (кампанія C1175).
    Військову повинність на чеченців імперія не поширювала: комісія Кавказького військового округу визнала бажаним залучити мусульман Кавказу до служби «...на однакових підставах з корінним населенням Імперії...», але чеченців і сусідніх з ними кумиків тимчасово звільнити, оскільки чеченці ще недостатньо «умиротворені»; командувач Кавказького військового округу заперечував: «Звільнення чеченців від військової повинності, хоча б і тимчасове... буде ніби визнанням за чеченцями пільг за їхні грабежі й розбої і в справі умиротворення Північного Кавказу принесе скоріше шкоду, ніж користь»(Citation: 125).
    Рішення про поступове запровадження повинності для горців-мусульман імперія ухвалила лише 1913 року, але до початку війни адміністрація Терської області навіть не почала складати посімейні списки - подобу подвірного перепису - і на мобілізацію не наважилася: обмежилася набором добровольців(Citation: 125).
    Єдину мобілізацію Російська імперія оголосила не для війни, а проти страйку: у травні 1916 року вона мобілізувала грозненських робітників, які мали відстрочку від служби, за участь у страйку(Citation: 125).
  ru: |-
    В 1914-1917 годах Российская империя вела мировую войну и чеченскими руками, и за чеченский счёт: вывезла на фронт «Дикой дивизией» тех, кого считала опасными, содержание Чеченского полка возложила на сами чеченские общества, ввела в Терской области «чрезвычайную охрану» с военными судами и цензурой, а бастующих рабочих отправляла в армию.
    К 1914 году Чечня полвека жила под «военно-народным управлением» - колониальным режимом Терской области (кампания C1170), без земли, отобранной под казачьи станицы (кампания C1171), и под коллективными наказаниями за абречество - так империя называла уход горцев в горы с оружием после объявления их вне закона; за одного абрека она штрафовала и выселяла целые сёла (кампания C1175).
    Воинскую повинность на чеченцев империя не распространяла: комиссия Кавказского военного округа признала желательным привлечь мусульман Кавказа к службе «...на одинаковых основаниях с коренным населением Империи...», но чеченцев и соседних с ними кумыков временно освободить, поскольку чеченцы ещё недостаточно «умиротворены»; командующий Кавказским военным округом возражал: «Освобождение чеченцев от воинской повинности, хотя бы и временное... будет как бы признанием за чеченцами льгот за их грабежи и разбои и в деле умиротворения Северного Кавказа принесет скорее вред, нежели пользу»(Citation: 125).
    Решение о постепенном введении повинности для горцев-мусульман империя приняла только в 1913 году, но к началу войны администрация Терской области даже не начала составлять посемейные списки - подобие подворной переписи - и на мобилизацию не решилась: ограничилась набором добровольцев(Citation: 125).
    Единственную мобилизацию Российская империя объявила не для войны, а против стачки: в мае 1916 года она мобилизовала грозненских рабочих, имевших отсрочку от службы, за участие в забастовке(Citation: 125).
