description:
  ru: |-
    Российская империя с формирования Чеченского полка в 1914 году возложила его содержание на сами чеченские общества: полная экипировка каждого всадника обходилась в 300 рублей, и платили их не казна, а сельские общества, рекомендовавшие человека в полк.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «содержание национальных полков тяжелым бременем ложилось на крестьян-горцев»(Citation: 125).
    Казённых средств не хватало и на остальное: новый конский состав, собранный для пополнения дивизии осенью 1916 года, был, как пишут те же историки, «весьма плох», и командование дивизии добивалось выделения средств на закупку лошадей(Citation: 125).
  en: |-
    From the formation of the Chechen regiment in 1914 the Russian Empire laid its upkeep on the Chechen communities themselves: the full equipment of each horseman cost 300 rubles, and it was paid not by the treasury but by the village communities that had recommended the man into the regiment.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "the upkeep of the national regiments lay as a heavy burden on the peasant-highlanders"(Citation: 125).
    State funds did not suffice for the rest either: the new horses assembled to replenish the division in the autumn of 1916 were, as the same historians write, "very poor", and the division's command sought the allocation of funds to buy horses(Citation: 125).
  uk: |-
    Російська імперія з формування Чеченського полку в 1914 році поклала його утримання на самі чеченські громади: повне спорядження кожного вершника обходилося в 300 рублів, і платили їх не скарбниця, а сільські громади, що рекомендували людину в полк.
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «утримання національних полків тяжким тягарем лягало на селян-горців»(Citation: 125).
    Казенних коштів не вистачало і на решту: новий кінський склад, зібраний для поповнення дивізії восени 1916 року, був, як пишуть ті ж історики, «вельми поганий», і командування дивізії домагалося виділення коштів на закупівлю коней(Citation: 125).
