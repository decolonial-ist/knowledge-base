name:
  en: Failed Attempt at Religious Subjugation of the Highlanders to the Empire through the Hiring of the Preacher Taj ad-Din Mustafin (1836-1841)
  uk: Невдала спроба релігійного підпорядкування горців імперії через найм проповідника Тадж ад-Діна Мустафіна (1836-1841)
  ru: Неудачная попытка религиозного подчинения горцев империи через наём проповедника Тадж ад-Дина Мустафина (1836-1841)
description:
  en: |-
    In 1836, the command of the Russian Caucasus Corps under General Rozen put forward a project to subordinate the entire Sunni clergy of the Caucasus to a "spiritual leader" appointed by the empire: for this role they hired the Kazan efendi (Muslim theologian) Taj ad-Din Mustafin and kept him on the treasury's payroll for about six years.
    The preacher's task was formulated openly: "to turn the highlanders onto the true path, subordinate them to the Russian government, and destroy or hand over Shamil to us alive" (Shamil - imam, leader of the Dagestani and Chechen highlanders' resistance to the Russian conquest)(Citation: 129).
    In Chechnya, Mustafin was sent to the Groznaya fortress to undermine the spiritual influence of Tashu-Hadji (sheikh, imam of Chechnya in 1834-1836, spiritual and military leader of the Chechen resistance).
    After a letter from Tashu-Hadji, who under threat of death forbade the preacher to appear on Chechen land, he acted only under military escort and did not show himself in the mountains.
    The project failed: Golovin, who succeeded Rozen, agreed to release the preacher based on a report by Minister of War Chernyshev of 13 November 1841 - "the teaching of Tajudin Effendi over the course of 6 years did not change the highlanders' attitude toward us in the slightest"(Citation: 129).
  uk: |-
    У 1836 році командування російського Кавказького корпусу за генерала Розена висунуло проєкт підпорядкування всього суннітського духовенства Кавказу призначеному імперією «духовному вождю»: на цю роль найняли казанського ефенді (мусульманського богослова) Тадж ад-Діна Мустафіна і тримали його на утриманні скарбниці близько шести років.
    Завдання проповідника було сформульоване відкрито: «навернути горців на шлях істинний, підпорядкувати їх російському уряду і винищити або видати нам живцем Шаміля» (Шаміль - імам, керівник опору горців Дагестану і Чечні російському завоюванню)(Citation: 129).
    У Чечні Мустафіна направили до фортеці Грозна для підриву духовного впливу Ташу-Хаджі (шейх, у 1834-1836 роках імам Чечні, духовний і військовий керівник чеченського опору).
    Після листа Ташу-Хаджі, який під страхом смерті заборонив проповіднику з'являтися на чеченській землі, той діяв лише під охороною військ і в гори не показувався.
    Проєкт провалився: генерал Головін, який змінив Розена, за доповіддю військового міністра Чернишева від 13 листопада 1841 року погодився відпустити проповідника - «вчення Таджудіна Ефенді протягом 6 років анітрохи не змінило ставлення горців до нас»(Citation: 129).
  ru: |-
    В 1836 году командование российского Кавказского корпуса при генерале Розене выдвинуло проект подчинения всего суннитского духовенства Кавказа назначенному империей «духовному вождю»: на эту роль наняли казанского эфенди (мусульманского богослова) Тадж ад-Дина Мустафина и держали его на содержании казны около шести лет.
    Задача проповедника была сформулирована открыто: «обратить горцев на путь истинный, подчинить их русскому правительству и истребить или выдать нам живьем Шамиля» (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию)(Citation: 129).
    В Чечне Мустафина направили в крепость Грозную для подрыва духовного влияния Ташу-Хаджи (шейх, в 1834-1836 годах имам Чечни, духовный и военный руководитель чеченского сопротивления).
    После письма Ташу-Хаджи, под страхом смерти запретившего проповеднику появляться на чеченской земле, тот действовал только под охраной войск и в горы не показывался.
    Проект провалился: сменивший Розена генерал Головин по докладу военного министра Чернышева от 13 ноября 1841 года согласился отпустить проповедника - «учение Таджудина Эффенди в продолжении 6 лет нисколько не изменило отношение горцев к нам»(Citation: 129).
