description:
  en: |-
    In 1836, the command of the Russian Caucasus Corps sent the hired preacher Taj ad-Din Mustafin, paid by the treasury, to the Groznaya fortress to undermine the influence of Tashu-Hadji (sheikh, imam of Chechnya in 1834-1836, spiritual and military leader of the Chechen resistance) - a spiritual track running parallel to the punitive military actions against the villages that had harbored Tashu-Hadji (campaign C1158).
    The goal was stated in the source: "with the aim of undermining the spiritual influence" of Tashu-Hadji "and reducing the effectiveness of the preaching of ghazawat" (ghazawat - the highlanders' war for independence from the Russian conquest)(Citation: 125).
    The agent "had managed to make a trip to the lowland societies of Dagestan" when Tashu-Hadji, by letter, "under threat of death forbade him to appear on Chechen territory"(Citation: 125); the response is cited by the historian Pokrovsky: "I instruct you that you shall not travel about in these lands without our permission, and if you are not foolish, you should withdraw before harm is done to you"(Citation: 129).
  uk: |-
    У 1836 році командування російського Кавказького корпусу направило до фортеці Грозна найнятого й оплачуваного скарбницею проповідника Тадж ад-Діна Мустафіна для підриву впливу Ташу-Хаджі (шейх, у 1834-1836 роках імам Чечні, духовний і військовий керівник чеченського опору) - духовний трек паралельно військовим карам проти сіл, які приймали Ташу-Хаджі (кампанія C1158).
    Мета сформульована в джерелі: «з метою підірвати духовний вплив» Ташу-Хаджі «і знизити дієвість проповіді газавату» (газават - війна горців за незалежність від російського завоювання)(Citation: 125).
    Агент «встиг було здійснити поїздку в рівнинні громади Дагестану», коли Ташу-Хаджі листом «під страхом смерті заборонив йому з'являтися на чеченській території»(Citation: 125); відповідь наводить історик Покровський: «приписую вам, щоб ви без дозволу нашого не роз'їжджали б у цих краях, і якщо ви не дурні, то повинні віддалитися, перш ніж вам буде завдано шкоди»(Citation: 129).
  ru: |-
    В 1836 году командование российского Кавказского корпуса направило в крепость Грозную нанятого и оплачиваемого казной проповедника Тадж ад-Дина Мустафина для подрыва влияния Ташу-Хаджи (шейх, в 1834-1836 годах имам Чечни, духовный и военный руководитель чеченского сопротивления) - духовный трек параллельно военным карам против принимавших Ташу-Хаджи сёл (кампания C1158).
    Цель сформулирована в источнике: «с целью подорвать духовное влияние» Ташу-Хаджи «и снизить действенность проповеди газавата» (газават - война горцев за независимость от российского завоевания)(Citation: 125).
    Агент «успел было совершить поездку в равнинные общества Дагестана», когда Ташу-Хаджи письмом «под страхом смерти запретил ему появляться на чеченской территории»(Citation: 125); ответ приводит историк Покровский: «предписываю вам, чтобы вы без дозволения нашего не разъезжали бы в сих странах, и если вы не глупы, то должны удалиться, прежде чем вам будет нанесен вред»(Citation: 129).
