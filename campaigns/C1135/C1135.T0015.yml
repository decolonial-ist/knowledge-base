description:
  ru: 'Оккупационная администрация Российской империи покупала лояльность представителей местной знати государственными выплатами: историк Я. З. Ахмадов фиксирует «наделение российским жалованьем 4 чеченских князей и их узденей»(Citation: 94).'
  en: |-
    The occupation administration of the Russian Empire bought the loyalty of members of the local nobility with state payments: historian Ya.
    Z. Akhmadov records «the granting of Russian stipends to 4 Chechen princes and their uzdens»(Citation: 94).
  uk: 'Окупаційна адміністрація Російської імперії купувала лояльність представників місцевої знаті державними виплатами: історик Я. З. Ахмадов фіксує «наділення російським жалуванням 4 чеченських князів та їхніх узденів»(Citation: 94).'
