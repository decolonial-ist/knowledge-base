description:
  ru: 'Оккупационная администрация Российской империи расширяла систему удержания родственников знати: историк Я. З. Ахмадов констатирует, что для контроля над территориями «в залог верности присяге русским властям выдаются аманаты»(Citation: 94).'
  en: |-
    The occupation administration of the Russian Empire expanded the system of holding relatives of the nobility: historian Ya.
    Z. Akhmadov states that, to control the territories, «amanats are handed over as a pledge of fidelity to the oath to the Russian authorities»(Citation: 94).
  uk: 'Окупаційна адміністрація Російської імперії розширювала систему утримання родичів знаті: історик Я. З. Ахмадов констатує, що для контролю над територіями «на запоруку вірності присязі російській владі видаються аманати»(Citation: 94).'
