name:
  en: Expansion of the Bribery System and Coercion of Highland Societies into Subjecthood (1741–1748)
  uk: Розширення системи підкупу та примус гірських суспільств до підданства (1741–1748)
  ru: Расширение системы подкупа и принуждение горных обществ к подданству (1741–1748)
description:
  en: |-
    In the 1740s, the diplomatic and administrative apparatus of the Russian Empire scaled up the application of institutional colonial mechanisms to new territories of the Nokhchi.
    Historian Ya.
    Z. Akhmadov states that in 1741–1748 there was an «intensification of Russian-Chechen political and trade ties»(Citation: 94).
    The occupation administration expanded the practice of institutional bribery: the researcher records «the granting of Russian salaries to 4 Chechen princes and their uzdens»(Citation: 94).
    This process was accompanied by the legal subordination of new territories through the issuing of ultimatum demands.
    The author points out that, in response to the highlanders' requests for access to the plain, the empire gave its consent exclusively «on the condition that the highlanders take an oath of Russian allegiance»(Citation: 94), which led to the formalization of oaths «by new societies of Chechnya, including mountain ones»(Citation: 94).
    Overall, as Akhmadov summarizes, «The process of formalizing relations with Russia at the official level covers the main districts of Chechnya», while, as rigid guarantees of obedience, «amanats (hostages) are handed over as a pledge of fidelity to the oath to the Russian authorities»(Citation: 94).
  uk: |-
    У 1740-ві роки дипломатичний та адміністративний апарат Російської імперії масштабував застосування інституційних колоніальних механізмів на нові території Нохчі.
    Історик Я. З. Ахмадов констатує, що у 1741–1748 роках відбулася «активізація російсько-чеченських політичних і торговельних зв'язків»(Citation: 94).
    Окупаційна адміністрація розширила практику інституційного підкупу: дослідник фіксує «наділення російським жалуванням 4 чеченських князів та їхніх узденів»(Citation: 94).
    Цей процес супроводжувався юридичним підпорядкуванням нових територій шляхом висування ультимативних вимог.
    Автор зазначає, що на прохання горців про допуск до рівнини імперія давала згоду виключно «за умови складення горцями присяги російського підданства»(Citation: 94), що призвело до оформлення присяг «новими товариствами Чечні, зокрема й гірськими»(Citation: 94).
    Загалом, як резюмує Ахмадов, «Процес оформлення відносин з Росією на офіційному рівні охоплює основні райони Чечні», при цьому як жорсткі гарантії підпорядкування «в заставу вірності присязі російській владі видаються аманати»(Citation: 94).
  ru: |-
    В 1740-е годы дипломатический и административный аппарат Российской империи масштабировал применение институциональных колониальных механизмов на новые территории нохчи.
    Историк Я. З. Ахмадов констатирует, что в 1741–1748 годах произошла «активизация русско-чеченских политических и торговых связей»(Citation: 94).
    Оккупационная администрация расширила практику институционального подкупа: исследователь фиксирует «наделение российским жалованьем 4 чеченских князей и их узденей»(Citation: 94).
    Этот процесс сопровождался юридическим подчинением новых территорий путем выставления ультимативных требований.
    Автор указывает, что на просьбы горцев о допуске к равнине империя давала согласие исключительно «с условием принятия горцами присяги российского подданства»(Citation: 94), что привело к оформлению присяг «новыми обществами Чечни, в т.ч. и горными»(Citation: 94).
    В целом, как резюмирует Ахмадов, «Процесс оформления отношений с Россией на официальном уровне охватывает основные районы Чечни», при этом в качестве жестких гарантий повиновения «в залог верности присяге русским властям выдаются аманаты»(Citation: 94).
