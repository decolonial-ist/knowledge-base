description:
  ru: 'Целенаправленная демографическая ассимиляция по секретному указу Анны от 31 января 1734 года правителю Шаховскому: «дабы вы по вашему іскуству секретно под рукою особливо трудились малороссіянъ от свойства… отводить, а побуждать их і іскуснымъ образомъ приводить в свойство с… великороссійскимъ народомъ»(Citation: 158).'
  en: 'Targeted demographic assimilation under Anna''s secret decree of January 31, 1734 to governor Shakhovskoy: "that you with your skill, secretly and quietly, take special pains to divert the Little Russians from kinship… and to encourage them and skillfully bring them into kinship with… the Great Russian people"(Citation: 158).'
  uk: 'Цілеспрямована демографічна асиміляція за секретним указом Анни від 31 січня 1734 року правителеві Шаховському: «аби ви за вашою вправністю секретно, під рукою, особливо трудилися малоросіян від спорідненості… відводити, а спонукати їх і вправним чином приводити у спорідненість з… великоросійським народом»(Citation: 158).'
