description:
  ru: 'Возвращение Запорожской Сечи под власть империи на условиях короны: «Из тактических соображений в ходе подготовки к очередной турецкой войне Анна амнистировала запорожцев и разрешила им вернуться на старые сечевые места (1734) и основать Новую Сечь»(Citation: 185) – амнистия оформляла переход казаков под власть России с обязательством военной службы.'
  en: 'The return of the Zaporozhian Sich under the empire''s authority on the crown''s terms: "For tactical reasons, in the course of preparations for the next Turkish war, Anna amnestied the Zaporozhians and allowed them to return to the old Sich grounds (1734) and found the New Sich"(Citation: 185) – the amnesty formalized the Cossacks'' passage under Russian authority with an obligation of military service.'
  uk: 'Повернення Запорозької Січі під владу імперії на умовах корони: «Із тактичних міркувань у ході підготовки до чергової турец. війни А[нна] І[ванівна] амністувала запорожців і дозволила їм вернутися на старі січові місця (1734) і заснувати Нову Січ»(Citation: 185) – амністія оформлювала перехід козаків під владу Росії із зобов''язанням військової служби.'
