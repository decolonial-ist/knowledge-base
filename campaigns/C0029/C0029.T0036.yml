description:
  ru: |-
    Блокирование выборов нового лидера и создание гибридной администрации для ручного управления: «В состав Правления гетманского правительства входили царский резидент в Украине кн.
    А.Шаховской с двумя российскими чиновниками… а также генеральный обозный Я.Лизогуб с двумя украинскими старшинами»(Citation: 195) – формально равноправная коллегия, которую фактически возглавлял царский резидент.
  en: |-
    Blocking the election of a new leader and creating a hybrid administration for direct control: "The Governance included the tsar's resident in Ukraine, Prince O. Shakhovskoy, with 2 Russian officials… as well as general quartermaster Ya.
    Lyzohub with 2 Ukrainian officers"(Citation: 195) – a formally equal collegium actually headed by the tsar's resident.
  uk: |-
    Блокування виборів нового лідера та створення гібридної адміністрації для ручного управління: «До складу П[равління] г[етьманського] у[ряду] входили царський резидент в Україні кн.
    О.Шаховськой із 2-ма рос. урядовцями… а також генеральний обозний Я.Лизогуб із 2-ма укр. старшинами»(Citation: 195) – формально рівноправна колегія, яку фактично очолював царський резидент.
