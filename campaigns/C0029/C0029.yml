name:
  ru: Правление гетманского правительства и Лубенский договор (1734–1750)
  en: The Governing Council of the Hetman Government and the Lubny Treaty (1734–1750)
  uk: Правління гетьманського уряду та Лубенський договір (1734–1750)
description:
  ru: |-
    Длительный период прямого управления Левобережьем без выборов гетмана.
    «ПРАВЛЕНИЕ ГЕТМАНСКОГО ПРАВИТЕЛЬСТВА — орган власти, созданный правительством российской императрицы Анны в 1734 после смерти гетмана Д.Апостола для управления Левобережной Украиной (Гетманщиной) и недопущения новых гетманских выборов»; «по сути его главой был царский резидент»(Citation: 195).
    Одновременно империя вернула под контроль Запорожье: «Анна амнистировала запорожцев и разрешила им вернуться на старые сечевые места (1734) и основать Новую Сечь»(Citation: 185) – в преддверии войны с Турцией казаков возвращали как военный ресурс короны.
  en: |-
    A long period of direct rule over the Left Bank without the election of a hetman.
    "The GOVERNANCE OF THE HETMAN'S GOVERNMENT was an organ of power created by the government of Russian empress Anna in 1734 after the death of hetman D. Apostol to govern Left-Bank Ukraine (the Hetmanate) and to prevent new hetman elections"; "in essence its head was the tsar's resident"(Citation: 195).
    At the same time the empire brought Zaporizhzhia back under control: "Anna amnestied the Zaporozhians and allowed them to return to the old Sich grounds (1734) and found the New Sich"(Citation: 185) – on the eve of war with Turkey the Cossacks were being brought back as a military resource of the crown.
  uk: |-
    Тривалий період прямого управління Лівобережжям без виборів гетьмана.
    «ПРАВЛІННЯ ГЕТЬМАНСЬКОГО УРЯДУ — орган влади, створений урядом рос. імп.
    Анни Іванівни 1734 після смерті гетьмана Д.Апостола для управління Лівобережною Україною (Гетьманщиною) та недопущення нових гетьман. виборів»; «по суті його головою був царський резидент»(Citation: 195).
    Водночас імперія повернула під контроль Запорожжя: «А[нна] І[ванівна] амністувала запорожців і дозволила їм вернутися на старі січові місця (1734) і заснувати Нову Січ»(Citation: 185) – напередодні війни з Туреччиною козаків повертали як військовий ресурс корони.
