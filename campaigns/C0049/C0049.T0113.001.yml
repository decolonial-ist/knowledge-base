description:
  en: |-
    The ban on the language in public speech: at the archaeological congress in Kyiv in 1899 the authorities forbade scholars from Austrian-ruled Ukraine to read papers in Ukrainian - they demonstratively withdrew from the sessions(Citation: 431).
    At the unveiling of the Kotliarevsky monument in Poltava on 30-31 August 1903, the Galicians were allowed to speak Ukrainian, but when local Ukrainians began reading a greeting address, the mayor cut the reading short, citing an order of the ministry of internal affairs; only in 1906 did the Senate revoke the ban, even reprimanding the minister for "the impropriety of his actions"(Citation: 431).
    In 1904-1905 the commissions of the Kyiv and Kharkiv universities and the Academy of Sciences, consulted by the Committee of Ministers, spoke out for lifting the bans on the Ukrainian word, yet the decrees of 1876 and 1881 were never formally revoked(Citation: 431).
  uk: |-
    Заборона мови в публічних виступах: на археологічному конгресі в Києві 1899 року влада заборонила вченим з підавстрійської України читати доповіді українською мовою - ті демонстративно відмовилися від будь-якої участі в нарадах(Citation: 431).
    На відкритті пам'ятника Котляревському в Полтаві 30–31 серпня 1903 року галичанам дозволили промовляти по-українському, та коли місцеві українці почали читати вітальну адресу, міський голова перервав читання, пославшись на наказ міністерства внутрішніх справ; лише 1906 року Сенат скасував заборону і «поставив на вид» міністрові «неправильність його дій»(Citation: 431).
    У 1904–1905 роках опитані Комітетом міністрів комісії Київського і Харківського університетів та Академія наук висловилися за скасування заборон українського слова, однак укази 1876 і 1881 років формально так і не було скасовано(Citation: 431).
  ru: |-
    Запрет языка в публичных выступлениях: на археологическом съезде в Киеве в 1899 году власти запретили учёным из австрийской Украины читать доклады на украинском языке - те демонстративно отказались от участия в заседаниях(Citation: 431).
    На открытии памятника Котляревскому в Полтаве 30–31 августа 1903 года галичанам разрешили выступать по-украински, но когда местные украинцы начали читать приветственный адрес, городской голова прервал чтение, сославшись на приказ министерства внутренних дел; лишь в 1906 году Сенат отменил запрет и «поставил на вид» министру «неправильность его действий»(Citation: 431).
    В 1904–1905 годах запрошенные Комитетом министров комиссии Киевского и Харьковского университетов и Академия наук высказались за отмену запретов украинского слова, однако указы 1876 и 1881 годов формально так и не были отменены(Citation: 431).
