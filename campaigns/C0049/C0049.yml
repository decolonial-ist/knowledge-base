name:
  en: Ban on the Language in Books and Public Speeches (1892–1905)
  uk: Заборона мови в книжках і публічних виступах (1892–1905)
  ru: Запрет языка в книгах и публичных выступлениях (1892–1905)
description:
  en: |-
    A state campaign to drive the language out of public space and literature: in 1892 the Main Administration for Press Affairs directed the censorship committee to suppress translations into Ukrainian, "reducing the number of such talentless works for purely state purposes"(Citation: 159); at the archaeological congress in Kyiv in 1899, scholars from Austrian-ruled Ukraine were forbidden to read papers in Ukrainian - in protest they withdrew from participation(Citation: 431); at the unveiling of the Kotliarevsky monument in Poltava on 30-31 August 1903, only guests from Galicia were allowed to speak Ukrainian, while the mayor forbade the locals to do so, citing an order of the ministry of internal affairs(Citation: 431).
    Even children's literature fell under the ban: the 1895 circular prohibited Ukrainian books "for children's reading"(Citation: 181).
  uk: |-
    Державна кампанія з витіснення мови з публічного простору та літератури: 1892 року Головне управління у справах друку приписало цензурному комітету припиняти переклади українською, «скорочуючи число таких бездарних творів у цілях чисто державних»(Citation: 159); на археологічному конгресі в Києві 1899 року вченим з підавстрійської України заборонили читати доповіді українською - на знак протесту ті відмовилися від участі(Citation: 431); на відкритті пам'ятника Котляревському в Полтаві 30–31 серпня 1903 року промовляти по-українському дозволили лише гостям з Галичини, а місцевим міський голова заборонив, пославшись на наказ міністерства внутрішніх справ(Citation: 431).
    Під заборону потрапила навіть дитяча література: циркуляром 1895 року заборонено українські книжки «для дитячого читання»(Citation: 181).
  ru: |-
    Государственная кампания по вытеснению языка из публичного пространства и литературы: в 1892 году Главное управление по делам печати предписало цензурному комитету пресекать переводы на украинский, «сокращая число таких бездарных произведений в целях чисто государственных»(Citation: 159); на археологическом съезде в Киеве в 1899 году учёным из австрийской Украины запретили читать доклады по-украински - в знак протеста те отказались от участия(Citation: 431); на открытии памятника Котляревскому в Полтаве 30–31 августа 1903 года выступить по-украински разрешили только гостям из Галичины, а местным городской голова запретил, сославшись на приказ министерства внутренних дел(Citation: 431).
    Под запрет попала даже детская литература: циркуляром 1895 года запрещены украинские книги «для детского чтения»(Citation: 181).
