description:
  en: |-
    Arrests, interrogations – the gendarmes "resorted to brutal pressure" and "applied refined methods of psychological processing"(Citation: 192), and reprisal against the leaders: the sentences were set out in the report of the chief of gendarmes Orlov to the emperor of May 26, 1847, with Nicholas I's resolution "Execute"(Citation: 450).
    Shevchenko was sent into the army "with the institution over the poet of 'the strictest surveillance with a prohibition on writing and drawing'"(Citation: 182)(Citation: 450).
    Hrushevsky: the brotherhood "was seized while still in the midst of its very formation" after a student's denunciation; "The heaviest punishment fell on Shevchenko: he was given over to the soldiery and exiled to the trans-Caspian desert, forbidden to write and to paint," and "persecutions and prohibitions previously unheard of descended upon Ukrainian thought and the Ukrainian word… the very words Ukraine, Little Russia, Hetmanate were deemed criminal"(Citation: 250).
    The brotherhood's co-founder Mykola Hulak "was imprisoned in the Shlisselburg fortress (1847-50), then exiled to Perm under strict police surveillance (1850-59)"(Citation: 186).
  uk: |-
    Арешти, допити – жандарми «вдавалися до брутального тиску» і «застосовували витончені методи психологічної обробки»(Citation: 192) та розправа над лідерами: вироки оформила доповідь шефа жандармів Орлова імператорові від 26 травня 1847 року з резолюцією Миколи I «Виконати»(Citation: 450).
    Шевченка було віддано в солдати «зі встановленням над поетом «найсуворішого нагляду із забороною писати й малювати»»(Citation: 182)(Citation: 450).
    Грушевський: брацтво «було захоплено серед самого ще свого творення» за доносом студента; «Найтяжша кара впала на Шевченка: його віддано в салдати і вислано в закаспійську пустиню, заборонивши писати й малювати», а «на українську мисль, на українське слово пішли нагінки і заборони, перед тим не бувалі… самі такі слова як Україна, Малоросія, Гетьманщина вважали ся злочинними»(Citation: 250).
    Співзасновник братства Микола Гулак «був ув'язнений у Шліссельбурзькій фортеці (1847—50), згодом засланий до м. Перм… під суворий нагляд поліції (1850—59)»(Citation: 186).
  ru: |-
    Аресты, допросы – жандармы «прибегали к грубому давлению» и «применяли изощрённые методы психологической обработки»(Citation: 192) и расправа над лидерами: приговоры оформил доклад шефа жандармов Орлова императору от 26 мая 1847 года с резолюцией Николая I «Исполнить»(Citation: 450).
    Шевченко был отдан в солдаты «с учреждением над поэтом «строжайшего надзора с запрещением писать и рисовать»»(Citation: 182)(Citation: 450).
    Грушевский: братство «было захвачено среди самого ещё своего создания» по доносу студента; «Тяжелейшая кара пала на Шевченко: его отдали в солдаты и выслали в закаспийскую пустыню, запретив писать и рисовать», а «на украинскую мысль, на украинское слово пошли гонения и запреты, прежде не бывалые… сами такие слова как Украина, Малороссия, Гетманщина считались преступными»(Citation: 250).
    Соучредитель братства Николай Гулак «был заключён в Шлиссельбургскую крепость (1847—50), затем сослан в Пермь под строгий надзор полиции (1850—59)»(Citation: 186).
