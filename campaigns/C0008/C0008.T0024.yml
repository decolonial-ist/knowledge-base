description:
  ru: 'Аннексия митрополии маскировалась под защиту единоверцев: реформа проводилась «с опорой на православное движение против турецких завоевателей»(Citation: 3), а «Главным проектом Голицына в отношении Украины… стала реформа украинской православной церкви, точнее — подчинение киевской митрополии московскому патриарху»(Citation: 3)(Citation: 4).'
  en: 'The annexation of the metropolitanate was disguised as the protection of co-religionists: the reform was carried out "relying on the Orthodox movement against the Turkish conquerors"(Citation: 3), and "Golitsyn''s main project concerning Ukraine… became the reform of the Ukrainian Orthodox church, or rather – the subordination of the Kyiv metropolitanate to the Moscow patriarch"(Citation: 3)(Citation: 4).'
  uk: 'Анексія митрополії маскувалася під захист єдиновірців: реформа проводилася «з опорою на православний рух проти турецьких завойовників»(Citation: 3), а «Головним проєктом Голіцина щодо України… стала реформа української православної церкви, точніше — підпорядкування київської митрополії московському патріархові»(Citation: 3)(Citation: 4).'
