description:
  en: 'The destruction of the Kyiv theological school and the declaration of its works as heresy: "All Ukrainian writings, beginning with the catechism of Petro Mohyla, were declared heretical... the council condemned virtually all the principal works of Kyivan theological scholarship"(Citation: 4)(Citation: 3).'
  uk: 'Знищення київської богословської школи та оголошення її праць єрессю: «Усі українські твори, починаючи з катехізису Петра Могили, оголошувалися єретичними... собор засудив практично всі основні твори київської богословської вченості»(Citation: 4)(Citation: 3).'
  ru: 'Уничтожение киевской богословской школы и объявление ее трудов ересью: «Все украинские сочинения, начиная с катехизиса Петра Могилы, объявлялись еретическими... собор осудил практически все основные произведения киевской богословской учености»(Citation: 4)(Citation: 3).'
