description:
  ru: |-
    14 июля 1831 у укрепления Ташкичу из засады был убит лидер чеченского сопротивления Бейбулат Таймиев - руководитель восстания 1825-1826 годов, устранённый после того, как открытая репрессия была признана командованием слишком опасной.
    Историк Д. А. Хожаев писал: «Царское командование несколько раз намеревалось расправиться с Бейбулатом, но опасалось открыто репрессировать его...
    Началась подготовка убийства Бейбулата, которое вскоре и было совершено»(Citation: 95).
    Убийца - князь Сали, состоявший на имперской службе, - наказан не был, хотя прочие случаи кровной мести жестоко преследовались; главнокомандующий Паскевич отписал, что Бейбулат «был до конца изменником, поэтому и наказывать убийцу не следует»(Citation: 95).
  en: |-
    On July 14, 1831, near the Tashkichu fortification, Beibulat Taimiev, leader of the Chechen resistance and head of the uprising of 1825–1826, was killed from ambush — eliminated after open repression had been deemed too dangerous by the command.
    The historian D. A. Khozhaev wrote: “The tsarist command intended several times to do away with Beibulat, but feared to repress him openly...
    Preparations for the murder of Beibulat began, and it was soon carried out”(Citation: 95).
    The killer — Prince Sali, who was in imperial service — went unpunished, although other cases of blood vengeance were harshly prosecuted; commander-in-chief Paskevich wrote back that Beibulat “was a traitor to the end, and therefore the killer should not be punished”(Citation: 95).
  uk: |-
    14 липня 1831 біля укріплення Ташкічу із засідки було вбито лідера чеченського опору Бейбулата Таймієва — керівника повстання 1825–1826 років, усунутого після того, як відкриту репресію командування визнало надто небезпечною.
    Історик Д. А. Хожаєв писав: «Царське командування кілька разів мало намір розправитися з Бейбулатом, але побоювалося відкрито репресувати його...
    Почалася підготовка вбивства Бейбулата, яке невдовзі й було скоєно»(Citation: 95).
    Убивця — князь Салі, який перебував на імперській службі, — покараний не був, хоча інші випадки кровної помсти жорстоко переслідувалися; головнокомандувач Паскевич відписав, що Бейбулат «був до кінця зрадником, тому й карати вбивцю не слід»(Citation: 95).
