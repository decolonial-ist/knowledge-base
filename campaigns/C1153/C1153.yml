name:
  ru: Убийство лидера чеченского сопротивления Бейбулата Таймиева, подготовленное имперским командованием (1831)
  en: Assassination of Chechen resistance leader Beibulat Taimiev, prepared by the imperial command (1831)
  uk: Вбивство лідера чеченського опору Бейбулата Таймієва, підготовлене імперським командуванням (1831)
description:
  ru: |-
    После побега из-под надзора осенью 1830 года лидер чеченского сопротивления Бейбулат Таймиев, связанный клятвой Паскевичу, переломом обеих ног и болезнью, не участвовал в боевых действиях, но одним своим именем вдохновлял повстанцев.
    Историк Д. А. Хожаев писал: «Царское командование несколько раз намеревалось расправиться с Бейбулатом, но опасалось открыто репрессировать его, так как это могло вызвать нежелательный резонанс по всей Чечне.
    И всё-таки дальнейшее пребывание такого человека, как Бейбулат, в восставшей Чечне становилось для царского командования опасным.
    Началась подготовка убийства Бейбулата, которое вскоре и было совершено»(Citation: 95). 14 июля 1831 недалеко от укрепления Ташкичу Бейбулат был убит из засады князем Сали, состоявшим на имперской службе.
    Д. А. Хожаев фиксировал официальную версию - убийство подавалось как кровная месть - и её разоблачение: «князь Сали, находившийся на царской службе, наказан не был, тогда как остальные случаи кровной мести царским командованием жестоко преследовались.
    Паскевич об убитом Бейбулате отписал, что он был до конца изменником, поэтому и наказывать убийцу не следует»(Citation: 95).
  en: |-
    After his escape from surveillance in the fall of 1830, the leader of the Chechen resistance Beibulat Taimiev — bound by his oath to Paskevich, by fractures of both legs, and by illness — took no part in hostilities, but his name alone inspired the insurgents.
    The historian D. A. Khozhaev wrote: “The tsarist command several times intended to do away with Beibulat, but feared to repress him openly, since this could provoke an undesirable resonance throughout Chechnya.
    And yet the continued presence of a man like Beibulat in insurgent Chechnya was becoming dangerous for the tsarist command.
    Preparations began for the murder of Beibulat, which was soon carried out”(Citation: 95).
    On July 14, 1831, not far from the fortification of Tashkichu, Beibulat was killed from ambush by Prince Sali, who was in imperial service.
    D. A. Khozhaev recorded the official version — the murder was presented as a blood feud — and its exposure: “Prince Sali, who was in tsarist service, was not punished, whereas the other cases of blood vengeance were cruelly prosecuted by the tsarist command.
    Paskevich wrote of the slain Beibulat that he had been a traitor to the end, and that therefore the killer should not be punished”(Citation: 95).
  uk: |-
    Після втечі з-під нагляду восени 1830 року лідер чеченського опору Бейбулат Таймієв, зв'язаний клятвою Паскевичу, переломом обох ніг і хворобою, не брав участі в бойових діях, але самим своїм ім'ям надихав повстанців.
    Історик Д. А. Хожаєв писав: «Царське командування кілька разів мало намір розправитися з Бейбулатом, але боялося відкрито репресувати його, оскільки це могло викликати небажаний резонанс по всій Чечні.
    І все ж подальше перебування такої людини, як Бейбулат, у повсталій Чечні ставало для царського командування небезпечним.
    Почалася підготовка вбивства Бейбулата, яке невдовзі й було скоєно»(Citation: 95). 14 липня 1831 року неподалік укріплення Ташкічу Бейбулата було вбито із засідки князем Салі, який перебував на імперській службі.
    Д. А. Хожаєв зафіксував офіційну версію — вбивство подавалося як кровна помста — та її викриття: «князь Салі, який перебував на царській службі, покараний не був, тоді як інші випадки кровної помсти царське командування жорстоко переслідувало.
    Паскевич про вбитого Бейбулата відписав, що той був до кінця зрадником, а тому й карати вбивцю не слід»(Citation: 95).
