description:
  ru: 'Правительство Московского царства использовало религиозную идентичность и концепцию защиты единоверцев для идеологического прикрытия военной экспансии: историк Майкл Ходарковский констатирует, что дипломатический аппарат позиционировал царя в качестве «универсального христианского правителя, который «поддерживал истинную христианскую веру»»(Citation: 70), а вторжения мотивировались «божественной обязанностью спасать православных христиан из неверного плена»(Citation: 70); в результате, как резюмирует историк Майкл Ходарковский, при продвижении на новые территории «военные и политические интересы Москвы больше не могли быть отделены от идеологической и теологической риторики экспансии»(Citation: 70), из-за чего Северный Кавказ «стал религиозным фронтиром»(Citation: 71).'
  en: 'The government of the Tsardom of Muscovy used religious identity and the concept of protecting co-religionists as ideological cover for military expansion: historian Michael Khodarkovsky states that the diplomatic apparatus positioned the tsar as a "universal Christian ruler who ''upheld the true Christian faith''"(Citation: 70), while invasions were motivated by a "divine obligation to rescue Orthodox Christians from infidel captivity"(Citation: 70); as a result, as historian Michael Khodarkovsky summarizes, in the advance into new territories "Moscow''s military and political interests could no longer be separated from the ideological and theological rhetoric of expansion"(Citation: 70), because of which the North Caucasus "became a religious frontier"(Citation: 71).'
  uk: 'Уряд Московського царства використовував релігійну ідентичність та концепцію захисту одновірців для ідеологічного прикриття воєнної експансії: історик Майкл Ходарковський констатує, що дипломатичний апарат позиціонував царя як «універсального християнського правителя, який «підтримував істинну християнську віру»»(Citation: 70), а вторгнення мотивувалися «божественним обов''язком рятувати православних християн з невірного полону»(Citation: 70); у результаті, як резюмує історик Майкл Ходарковський, під час просування на нові території «військові та політичні інтереси Москви більше не могли бути відокремлені від ідеологічної й теологічної риторики експансії»(Citation: 70), через що Північний Кавказ «став релігійним фронтиром»(Citation: 71).'
