name:
  ru: Религиозный фронтир и фабрикация исторического права (1550–1721)
  en: Religious Frontier and the Fabrication of Historical Right (1550–1721)
  uk: Релігійний фронтир і фабрикація історичного права (1550–1721)
description:
  ru: |-
    В период с середины XVI века до 1721 года дипломатический аппарат Московского Царства оправдывал военную экспансию на Северный Кавказ теологической риторикой и вымышленными историческими правами.
    Историк Майкл Ходарковский (Michael Khodarkovsky) констатирует, что правительственный аппарат позиционировал царя в качестве «универсального христианского правителя, который «поддерживал истинную христианскую веру»»(Citation: 70).
    Вторжения мотивировались «божественной обязанностью спасать православных христиан из неверного плена»(Citation: 70).
    В результате, как резюмирует исследователь, «военные и политические интересы Москвы больше не могли быть отделены от идеологической и теологической риторики экспансии»(Citation: 70), а Северный Кавказ «стал религиозным фронтиром»(Citation: 71).
    Параллельно конструировались фиктивные основания для территориальных претензий: автор фиксирует, что чиновники создавали ложные отчеты для зарубежных правителей о том, что коренные народы Кавказа якобы издревле являлись московскими «подданными в Рязанском крае, а затем бежали из Рязани и поселились в горах»(Citation: 70), что давало метрополии формальный повод узаконить поглощение их земель и строительство своих фортификаций.
  en: |-
    From the mid-16th century until 1721, the diplomatic apparatus of the Tsardom of Muscovy justified military expansion into the North Caucasus with theological rhetoric and invented historical rights.
    Historian Michael Khodarkovsky states that the government apparatus positioned the tsar as a "universal Christian ruler, who 'upheld the true Christian faith'"(Citation: 70).
    Invasions were motivated by a "divine obligation to rescue Orthodox Christians from infidel captivity"(Citation: 70).
    As a result, as the researcher summarizes, "Moscow's military and political interests could no longer be separated from the ideological and theological rhetoric of expansion"(Citation: 70), and the North Caucasus "became a religious frontier"(Citation: 71).
    In parallel, fictitious grounds for territorial claims were being constructed: the author records that officials produced false reports for foreign rulers claiming that the indigenous peoples of the Caucasus had allegedly been Muscovite "subjects in the Riazan region since ancient times, and then fled from Riazan and settled in the mountains"(Citation: 70), which gave the metropole a formal pretext to legalize the absorption of their lands and the construction of its fortifications.
  uk: |-
    У період із середини XVI століття до 1721 року дипломатичний апарат Московського царства виправдовував військову експансію на Північний Кавказ теологічною риторикою та вигаданими історичними правами.
    Історик Майкл Ходарковський (Michael Khodarkovsky) констатує, що урядовий апарат позиціонував царя як «універсального християнського правителя, який «підтримував істинну християнську віру»»(Citation: 70).
    Вторгнення мотивувалися «божественним обов'язком рятувати православних християн із невірного полону»(Citation: 70).
    У результаті, як резюмує дослідник, «військові та політичні інтереси Москви більше не могли бути відокремлені від ідеологічної та теологічної риторики експансії»(Citation: 70), а Північний Кавказ «став релігійним фронтиром»(Citation: 71).
    Паралельно конструювалися фіктивні підстави для територіальних претензій: автор фіксує, що чиновники створювали неправдиві звіти для закордонних правителів про те, що корінні народи Кавказу нібито здавна були московськими «підданими в Рязанському краї, а потім утекли з Рязані й оселилися в горах»(Citation: 70), що давало метрополії формальний привід узаконити поглинання їхніх земель і будівництво своїх фортифікацій.
