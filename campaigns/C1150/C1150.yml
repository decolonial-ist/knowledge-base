name:
  ru: Обман и силовое удержание Бейбулата Таймиева Паскевичем, раскол Чечни на партии и принуждение к присяге (1828-1829)
  en: Deception and Forcible Detention of Beibulat Taimiev by Paskevich, Splitting Chechnya into Factions, and Coercion into an Oath of Allegiance (1828-1829)
  uk: Обман і силове утримання Бейбулата Таймієва Паскевичем, розкол Чечні на партії та примус до присяги (1828-1829)
description:
  ru: |-
    После карательного похода Ермолова 1826 года и спада восстания 1825-1826 годов империя, не сумев завоевать Чечню оружием, перешла к обману, расколу и заложничеству.
    Историк Д. А. Хожаев писал: «Паскевич, пытаясь выманить из Чечни главного руководителя чеченских повстанцев, в продолжение всего 1828 года через посредников предлагает Бейбулату вернуться на «русскую службу».
    Ему обещают капитанский чин, прощение и почести»(Citation: 95). 6 марта 1829 Бейбулат Таймиев со 120 старшинами Чечни были вынуждены принять в Тарках номинальное подданство через шамхала Тарковского.
    Д. А. Хожаев фиксировал мотив: старшины «пытались избежать подчинения царским приставам, отвести от Чечни угрозу постоянных набегов»(Citation: 95).
    Командующий войсками на Кавказской линии Эмануэль в рапорте Паскевичу поставил условие: «покорность Бей-Булата и прочих непокорных Чеченцев тогда только будет признана благонамеренною, когда они безусловно примут присягу и выдадут аманатов»(Citation: 104).
    Паскевич в предписании Эмануэлю раскрыл расчёт на раскол народа: «не безполезно нам иметь в Чечне две партии, которые, оставаясь обе покорными правительству нашему, междоусобными раздорами будут воздерживаться от враждебных замыслов против Русских»(Citation: 104).
    Вызвав Бейбулата и старшин его партии в Тифлис якобы для переговоров, Паскевич задержал их при действующей армии на всю турецкую кампанию.
    Д. А. Хожаев писал: «Поняв, что его обманули, он пытается немедленно возвратиться в Чечню, но его силой задерживают в Тифлисе»(Citation: 95).
    Сам Паскевич признал схему в предписании Эмануэлю от 2 августа 1829: «я тотчас решился вызвать к себе под видом объяснений старшин их и известного вам старшину Бей-Булата, дабы, отвлекши их сюда, лишить племя сие возможности... предпринять что либо враждебное»; «Продержав их таким образом в течении целого лета, я доставил Линии с их стороны спокойствие»(Citation: 104).
    Тем же предписанием утверждено положение о Чечне: аманаты от каждого старшинства «в залог покорности» в крепости Грозной, сын шамхала комиссаром над чеченцами, выезд на имперскую территорию только по билетам (письменным пропускам) от комиссара(Citation: 104).
    Присяга подписывалась народом, пережившим волну арестов, казней и ссылок со стороны имперского командования.
    Чеченцы писали Паскевичу в апреле 1829: они «арестовали, полонили, вешали и ссылали в Сибирь и в другие места многих из тех, которые, будучи покорны, служили великому Государю»(Citation: 104).
  en: |-
    After Yermolov's punitive campaign of 1826 and the ebbing of the uprising of 1825-1826, the empire, having failed to subdue Chechnya by force of arms, turned to deception, division, and hostage-taking.
    The historian D. A. Khozhaev wrote: "Paskevich, trying to lure the principal leader of the Chechen insurgents out of Chechnya, throughout the whole of 1828 offers Beibulat, through intermediaries, a return to 'Russian service.' He is promised the rank of captain, pardon, and honors"(Citation: 95).
    On March 6, 1829, Beibulat Taimiev and 120 elders of Chechnya were forced to accept nominal allegiance in Tarki through the Shamkhal of Tarki.
    D. A. Khozhaev recorded the motive: the elders "sought to avoid subordination to the tsarist pristavs (superintendents), to avert from Chechnya the threat of constant raids"(Citation: 95).
    Emanuel, commander of the troops on the Caucasus Line, set a condition in his report to Paskevich: "the submission of Bey-Bulat and the other unsubdued Chechens will be recognized as well-intentioned only when they unconditionally take the oath and hand over amanats (hostages)"(Citation: 104).
    In his instruction to Emanuel, Paskevich revealed the calculation of splitting the people: "it is not without use for us to have two factions in Chechnya, which, both remaining submissive to our government, will by internecine discord be restrained from hostile designs against the Russians"(Citation: 104).
    Having summoned Beibulat and the elders of his faction to Tiflis ostensibly for negotiations, Paskevich detained them with the army in the field for the entire Turkish campaign.
    D. A. Khozhaev wrote: "Realizing that he had been deceived, he tries to return to Chechnya immediately, but he is detained in Tiflis by force"(Citation: 95).
    Paskevich himself acknowledged the scheme in his instruction to Emanuel of August 2, 1829: "I at once resolved to summon to me, under the guise of explanations, their elders and the elder Bey-Bulat known to you, so that, having drawn them away here, I would deprive this tribe of the possibility... of undertaking anything hostile"; "Having kept them in this way for the whole summer, I secured tranquility for the Line on their part"(Citation: 104).
    The same instruction confirmed the regulation on Chechnya: amanats from every elder's district "as a pledge of submission" in the fortress of Groznaya, the son of the Shamkhal as commissar over the Chechens, and travel into imperial territory only with tickets (written passes) from the commissar(Citation: 104).
    The oath was signed by a people that had lived through a wave of arrests, executions, and exiles at the hands of the imperial command.
    The Chechens wrote to Paskevich in April 1829: they "arrested, took captive, hanged, and exiled to Siberia and other places many of those who, being submissive, served the great Sovereign"(Citation: 104).
  uk: |-
    Після карального походу Єрмолова 1826 року та спаду повстання 1825-1826 років імперія, не зумівши підкорити Чечню зброєю, перейшла до обману, розколу та заручництва.
    Історик Д. А. Хожаєв писав: «Паскевич, намагаючись виманити з Чечні головного керівника чеченських повстанців, упродовж усього 1828 року через посередників пропонує Бейбулату повернутися на „російську службу“.
    Йому обіцяють капітанський чин, прощення та почесті»(Citation: 95). 6 березня 1829 року Бейбулат Таймієв зі 120 старшинами Чечні були змушені прийняти в Тарках номінальне підданство через шамхала Тарковського.
    Д. А. Хожаєв фіксував мотив: старшини «намагалися уникнути підпорядкування царським приставам, відвести від Чечні загрозу постійних набігів»(Citation: 95).
    Командувач військ на Кавказькій лінії Емануель у рапорті Паскевичу поставив умову: «покірність Бей-Булата та інших непокірних Чеченців лише тоді буде визнана благонаміреною, коли вони беззастережно приймуть присягу і видадуть аманатів»(Citation: 104).
    Паскевич у приписі Емануелю розкрив розрахунок на розкол народу: «не без користі нам мати в Чечні дві партії, які, залишаючись обидві покірними нашому урядові, міжусобними чварами утримуватимуться від ворожих задумів проти Росіян»(Citation: 104).
    Викликавши Бейбулата і старшин його партії до Тифліса нібито для переговорів, Паскевич затримав їх при діючій армії на всю турецьку кампанію.
    Д. А. Хожаєв писав: «Зрозумівши, що його обдурили, він намагається негайно повернутися до Чечні, але його силою затримують у Тифлісі»(Citation: 95).
    Сам Паскевич визнав схему в приписі Емануелю від 2 серпня 1829 року: «я одразу вирішив викликати до себе під виглядом пояснень їхніх старшин і відомого вам старшину Бей-Булата, аби, відвабивши їх сюди, позбавити це плем'я можливості... вчинити що-небудь вороже»; «Протримавши їх у такий спосіб протягом цілого літа, я забезпечив Лінії спокій з їхнього боку»(Citation: 104).
    Тим самим приписом затверджено положення про Чечню: аманати від кожного старшинства «в заставу покірності» у фортеці Грозній, син шамхала — комісаром над Чеченцями, виїзд на імперську територію лише за білетами (письмовими перепустками) від комісара(Citation: 104).
    Присягу підписував народ, який пережив хвилю арештів, страт і заслань з боку імперського командування.
    Чеченці писали Паскевичу у квітні 1829 року: вони «заарештували, полонили, вішали й засилали до Сибіру та в інші місця багатьох із тих, хто, будучи покірними, служили великому Государеві»(Citation: 104).
