description:
  ru: |-
    Положением от 2 августа 1829 главнокомандующий Паскевич замкнул доступ чеченцев к торговле на назначенного империей комиссара: выезд на имперскую территорию разрешался только по билетам (письменным пропускам) - «Ему же предоставляется право выдавать билеты означенным Чеченцам для проезда в наши владения по торговым нуждам»(Citation: 104).
    На практике пропускная система дополнялась произволом: чеченское общество писало Паскевичу 21 ноября 1829, что Энгельгардт и Хасай-Муса «приказывают своим подвластным брать под арест всех тех Чеченцев, которые приезжают к ним с билетами от Шахбаза», а подчинённые Хасай-Мусе действуют так, что чеченцы лишаются «средств к пропитанию»(Citation: 104).
  en: |-
    By the regulation of August 2, 1829, Commander-in-Chief Paskevich locked the Chechens' access to trade onto a commissar appointed by the empire: travel to imperial territory was permitted only with tickets (written passes) — "To him is also granted the right to issue tickets to the said Chechens for travel into our domains on trade business"(Citation: 104).
    In practice, the pass system was supplemented by arbitrariness: Chechen society wrote to Paskevich on November 21, 1829 that Engelhardt and Khasai-Musa "order their subordinates to place under arrest all those Chechens who come to them with tickets from Shahbaz," while those obedient to Khasai-Musa act so that the Chechens are deprived of their "means of sustenance"(Citation: 104).
  uk: |-
    Положенням від 2 серпня 1829 року головнокомандувач Паскевич замкнув доступ Чеченців до торгівлі на призначеного імперією комісара: виїзд на імперську територію дозволявся лише за білетами (письмовими перепустками) — «Йому ж надається право видавати білети означеним Чеченцям для проїзду в наші володіння в торговельних потребах»(Citation: 104).
    На практиці перепускна система доповнювалася свавіллям: чеченське суспільство писало Паскевичу 21 листопада 1829 року, що Енгельгардт і Хасай-Муса «наказують своїм підвладним брати під арешт усіх тих Чеченців, які приїжджають до них із білетами від Шахбаза», а підлеглі Хасай-Мусі діють так, що чеченці втрачають «засоби до прожитку»(Citation: 104).
