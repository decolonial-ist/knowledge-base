description:
  en: |-
    From spring until the end of summer 1829, Commander-in-Chief Paskevich forcibly kept with the field army the Chechen elders who had been summoned for negotiations, directly calling them hostages.
    In his instruction to Emanuel of May 16, 1829, he wrote: "The mere absence of these people, who will be with us in the manner of amanats, will restrain the unpacified Chechens from any hostile attempts"(Citation: 104).
    He summed up the result on August 2, 1829: "The Chechen elders, having been graciously received by me, remained with the detachment and were with me in military operations against the Turks.
    Having kept them in this way for a whole summer, I secured tranquility for the Line on their part"(Citation: 104).
    By the same document, hostage-taking was entrenched as a system of governing Chechnya: "As a pledge of the submission of the said Chechens, the amanats presented by each eldership are to be kept in the fortress of Grozny; and if from any one an amanat has not yet been delivered, then the elder, until the amanat is delivered, is obliged... to remain himself as a pledge in the fortress of Grozny"(Citation: 104).
  uk: |-
    З весни до кінця літа 1829 року головнокомандувач Паскевич насильно утримував при діючій армії викликаних на переговори чеченських старшин, прямо називаючи їх заручниками.
    У приписі Емануелю від 16 травня 1829 року він писав: «Сама відсутність цих людей, які будуть у нас на кшталт аманатів, утримає немирних Чеченців від будь-яких ворожих замахів»(Citation: 104).
    Підсумок він підбив 2 серпня 1829 року: «Чеченські старшини, бувши прийняті мною прихильно, залишилися в загоні й були при мені у воєнних діях проти Турків.
    Протримавши їх у такий спосіб протягом цілого літа, я забезпечив Лінії з їхнього боку спокій»(Citation: 104).
    Тим самим документом заручництво закріплено як систему управління Чечнею: «У заставу покірності означених Чеченців залишити у кр.
    Грозній наданих від кожного старшинства аманатів; якщо ж від котрогось аманата ще не доставлено, то старшина до часу доставлення аманата зобов'язується... залишатися сам заставою у кр.
    Грозній»(Citation: 104).
  ru: |-
    С весны до конца лета 1829 главнокомандующий Паскевич насильно удерживал при действующей армии вызванных на переговоры чеченских старшин, прямо называя их заложниками.
    В предписании Эмануэлю от 16 мая 1829 он писал: «Одно отсутствие сих людей, которые у нас будут в роде аманатов, удержит немирных Чеченцев от всяких враждебных покушений»(Citation: 104).
    Итог он подвёл 2 августа 1829: «Чеченские старшины, быв приняты мною благосклонно, остались в отряде и были при мне в военных действиях против Турок.
    Продержав их таким образом в течении целого лета, я доставил Линии с их стороны спокойствие»(Citation: 104).
    Тем же документом заложничество закреплено как система управления Чечнёй: «В залог покорности означенных Чеченцев оставить в кр.
    Грозной представленных от каждого старшинства аманатов; в случае же, если от которого ещё не доставлен аманат, то старшина до времени доставления аманата обязывается... оставаться сам залогом в кр.
    Грозной»(Citation: 104).
