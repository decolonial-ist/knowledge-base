description:
  en: |-
    On March 6, 1829, in Tarki, Beibulat Taimiev and 120 elders of Chechnya were forced to take an oath of allegiance through the Shamkhal of Tarki.
    The historian D. A. Khozhaev recorded the coerced nature of this step: the elders "tried to avoid subordination to the tsarist superintendents, to avert from Chechnya the threat of constant raids"(Citation: 95).
    The Chechens themselves, in a petition to Paskevich in April 1829, documented the backdrop against which the submission was being signed: the imperial command "arrested, took captive, hanged and exiled to Siberia and to other places many of those who, being obedient, served the great Sovereign"(Citation: 104).
    Emanuel, commander of the troops on the Caucasian Line, in a report to Paskevich of May 15, 1829, made the recognition of submission conditional: it "will be recognized as well-intentioned only when they unconditionally take the oath and hand over amanats"(Citation: 104).
    Holding Beibulat in Tiflis, Paskevich sealed the subjecthood with the "Regulation on the Submission of the Chechens to Russia" and the statute of August 2, 1829(Citation: 95)(Citation: 104).
  uk: |-
    6 березня 1829 року в Тарках Бейбулат Таймієв зі 120 старшинами Чечні були змушені скласти присягу через шамхала Тарковського.
    Історик Д. А. Хожаєв фіксував вимушеність цього кроку: старшини «намагалися уникнути підпорядкування царським приставам, відвести від Чечні загрозу постійних набігів»(Citation: 95).
    Самі Чеченці у проханні до Паскевича у квітні 1829 року документували тло, на якому підписувалася покірність: імперське командування «арештовували, брали в полон, вішали й засилали до Сибіру та в інші місця багатьох із тих, які, будучи покірними, служили великому Государеві»(Citation: 104).
    Командувач військ на Кавказькій лінії Емануель у рапорті Паскевичу від 15 травня 1829 року обумовив визнання покірності: вона «лише тоді буде визнана благонаміреною, коли вони беззастережно складуть присягу та видадуть аманатів»(Citation: 104).
    Утримуючи Бейбулата в Тифлісі, Паскевич закріпив підданство «Постановою про покірність чеченців Росії» та положенням від 2 серпня 1829 року(Citation: 95)(Citation: 104).
  ru: |-
    6 марта 1829 в Тарках Бейбулат Таймиев со 120 старшинами Чечни были вынуждены принять присягу через шамхала Тарковского.
    Историк Д. А. Хожаев фиксировал вынужденность этого шага: старшины «пытались избежать подчинения царским приставам, отвести от Чечни угрозу постоянных набегов»(Citation: 95).
    Сами чеченцы в прошении Паскевичу в апреле 1829 документировали фон, на котором подписывалась присяга: имперское командование «арестовали, полонили, вешали и ссылали в Сибирь и в другие места многих из тех, которые, будучи покорны, служили великому Государю»(Citation: 104).
    Командующий войсками на Кавказской линии Эмануэль в рапорте Паскевичу от 15 мая 1829 обусловил признание присяги: она «тогда только будет признана благонамеренною, когда они безусловно примут присягу и выдадут аманатов»(Citation: 104).
    Удерживая Бейбулата в Тифлисе, Паскевич закрепил подданство «Постановлением о покорности чеченцев России» и положением от 2 августа 1829(Citation: 95)(Citation: 104).
