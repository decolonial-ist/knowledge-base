description:
  ru: |-
    Весной 1829 главнокомандующий Паскевич обезвредил руководящий слой чеченского сопротивления, выманив Бейбулата Таймиева и 60 старшин его партии в Тифлис под предлогом переговоров и удержав их силой.
    Историк Д. А. Хожаев писал: «Приехав в Тифлис, Бейбулат узнаёт, что Паскевич находится в действующих войсках.
    Поняв, что его обманули, он пытается немедленно возвратиться в Чечню, но его силой задерживают в Тифлисе»(Citation: 95).
    Паскевич признал обман собственным пером в предписании Эмануэлю от 2 августа 1829: «я тотчас решился вызвать к себе под видом объяснений старшин их и известного вам старшину Бей-Булата, дабы, отвлекши их сюда, лишить племя сие возможности в случае неудовольствия предпринять что либо враждебное»(Citation: 104).
  en: |-
    In the spring of 1829, Commander-in-Chief Paskevich neutralized the leading stratum of the Chechen resistance by luring Beibulat Taimiev and 60 elders of his party to Tiflis under the pretext of negotiations and holding them there by force.
    The historian D. A. Khozhaev wrote: "On arriving in Tiflis, Beibulat learns that Paskevich is with the army in the field.
    Realizing that he has been deceived, he tries to return to Chechnya immediately, but he is forcibly detained in Tiflis"(Citation: 95).
    Paskevich admitted the deception in his own hand in his instruction to Emanuel of August 2, 1829: "I at once resolved to summon to myself, under the guise of explanations, their elders and the elder Bei-Bulat known to you, so that, having drawn them away here, I might deprive this tribe of the possibility, in case of discontent, of undertaking anything hostile"(Citation: 104).
  uk: |-
    Навесні 1829 року головнокомандувач Паскевич знешкодив керівний прошарок чеченського опору, виманивши Бейбулата Таймієва та 60 старшин його партії до Тифліса під приводом переговорів і утримавши їх силою.
    Історик Д. А. Хожаєв писав: «Приїхавши до Тифліса, Бейбулат дізнається, що Паскевич перебуває в діючих військах.
    Зрозумівши, що його обдурили, він намагається негайно повернутися до Чечні, але його силою затримують у Тифлісі»(Citation: 95).
    Паскевич визнав обман власним пером у приписі Емануелю від 2 серпня 1829 року: «я одразу вирішив викликати до себе під виглядом пояснень старшин їхніх та відомого вам старшину Бей-Булата, аби, відволікши їх сюди, позбавити плем'я це можливості у разі невдоволення вчинити що-небудь вороже»(Citation: 104).
