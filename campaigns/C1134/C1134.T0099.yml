description:
  en: |-
    The occupation administration of the Russian Empire continued to physically hold relatives of the Nokhchi elite: historian Ya.
    Z. Akhmadov records the existence of a document from 1738 identified as a «Letter from the Chechen lord A. Bartykhanov to Lieutenant Colonel Bunin regarding his loyal service to Russia and requesting the release of his sister from Kizlyar»(Citation: 94).
  uk: 'Окупаційна адміністрація Російської імперії продовжувала фізично утримувати родичів еліти Нохчі: історик Я. З. Ахмадов фіксує наявність документа за 1738 рік, визначеного як «Лист чеченського володаря А. Бартиханова підполковнику Буніну про свою вірну службу Росії та з проханням відпустити його сестру з Кізляра»(Citation: 94).'
  ru: |-
    Оккупационная администрация Российской империи продолжала физически удерживать родственников элиты нохчи: историк Я. З. Ахмадов фиксирует наличие документа за 1738 год, определенного как «Письмо чеченского владельца А. Бартыханова подполк.
    Бунину о своей верной службе России и с просьбой отпустить его сестру из Кизляра»(Citation: 94).
