description:
  ru: 'Правительство Российской империи выстраивало военную линию за счет инженерного возведения укрепленных военизированных пунктов для изоляции коренного населения: историк Я. З. Ахмадов констатирует, что в 1736 году были учреждены «три новые казачьи станицы: Бороздинская, Каргалинская, Дубовская»(Citation: 94), которые, как фиксирует историк И. Х. Тхамокова, выступали фортификациями, так как каждая подобная станица «была как бы небольшой крепостцей, служившей для защиты от неприятельских набегов»(Citation: 85).'
  en: |-
    The Government of the Russian Empire built up a military line through the engineering construction of fortified militarized outposts to isolate the Indigenous population: historian Ya.
    Z. Akhmadov states that in 1736 «three new Cossack stanitsas: Borozdinskaya, Kargalinskaya, Dubovskaya»(Citation: 94) were established, which, as historian I. Kh.
    Tkhamokova records, served as fortifications, since each such stanitsa «was in effect a small fortress serving for protection against enemy raids»(Citation: 85).
  uk: 'Уряд Російської імперії вибудовував військову лінію шляхом інженерного зведення укріплених воєнізованих пунктів для ізоляції корінного населення: історик Я. З. Ахмадов констатує, що 1736 року було засновано «три нові козачі станиці: Бороздинську, Каргалинську, Дубовську»(Citation: 94), які, як фіксує історик І. Х. Тхамокова, виступали фортифікаціями, оскільки кожна така станиця «була ніби невеликою фортечкою, що слугувала для захисту від ворожих набігів»(Citation: 85).'
