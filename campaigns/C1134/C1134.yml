name:
  en: Construction of Fortified Stanitsas, Settlement of Cossacks on the Borders, and Holding of Hostages (1736–1740)
  uk: Зведення укріплених станиць, підселення Козаків на кордонах та утримання заручників (1736–1740)
  ru: Возведение укрепленных станиц, подселение казаков на границах и удержание заложников (1736–1740)
description:
  en: |-
    In the period from 1736 to 1740, the diplomatic and administrative apparatus of the Russian Empire maintained control over the borders of the Nokhchi societies through infrastructure construction and hostage-taking.
    The established evidence base demonstrates that the metropole began by building new fortifications: historian Ya.
    Z. Akhmadov records the establishment in 1736 of fortified posts, among them «three new Cossack stanitsas: Borozdinskaya, Kargalinskaya, Dubovskaya»(Citation: 94).
    Historian I. Kh.
    Tkhamokova emphasizes their engineering-defensive status, recording that each such stanitsa «was, as it were, a small fortress serving for protection against enemy raids»(Citation: 85).
    The construction of infrastructure was followed by the physical settlement of military contingents: the first researcher indicates that garrisons were placed on these frontiers, «and from Kizlyar toward the sea another 430 Cossack families are being settled»(Citation: 94).
    In parallel, the occupation administration continued to physically hold relatives of the local elite seized in previous years: Akhmadov notes, in a list of archival documents, a paper from 1738 identified as «Letter of the Chechen lord A. Bartykhanov to Lieutenant Colonel Bunin about his faithful service to Russia and with a request to release his sister from Kizlyar»(Citation: 94).
  uk: |-
    У період з 1736 по 1740 рік дипломатичний та адміністративний апарат Російської імперії підтримував контроль над кордонами суспільств Нохчі шляхом інфраструктурного будівництва та захоплення заручників.
    Затверджена доказова база свідчить, що метрополія почала зі зведення нових фортифікацій: історик Я. З. Ахмадов констатує заснування 1736 року укріплених пунктів, серед яких «три нові козацькі станиці: Бороздинська, Каргалинська, Дубовська»(Citation: 94).
    Історик І. Х. Тхамокова підкреслює їхній інженерно-оборонний статус, фіксуючи, що кожна подібна станиця «була ніби невеликою фортечкою, що служила для захисту від ворожих набігів»(Citation: 85).
    За будівництвом інфраструктури послідувало фізичне підселення військових контингентів: перший дослідник вказує, що на цих рубежах розмістили гарнізони, «а від Кізляра до моря поселяють ще 430 козацьких сімей»(Citation: 94).
    Паралельно окупаційна адміністрація продовжувала фізично утримувати родичів місцевої еліти, захоплених у попередні роки: Ахмадов зазначає в переліку архівних документів наявність паперу за 1738 рік, визначеного як «Лист чеченського володільця А. Бартиханова підполк.
    Буніну про свою вірну службу Росії та з проханням відпустити його сестру з Кізляра»(Citation: 94).
  ru: |-
    В период с 1736 по 1740 год дипломатический и административный аппарат Российской империи поддерживал контроль над границами обществ нохчи путем инфраструктурного строительства и захвата заложников.
    Утвержденная база доказывает, что метрополия начала с возведения новых фортификаций: историк Я. З. Ахмадов констатирует учреждение в 1736 году укрепленных пунктов, среди которых «три новые казачьи станицы: Бороздинская, Каргалинская, Дубовская»(Citation: 94).
    Историк И. Х. Тхамокова подчеркивает их инженерно-оборонительный статус, фиксируя, что каждая подобная станица «была как бы небольшой крепостцей, служившей для защиты от неприятельских набегов»(Citation: 85).
    За строительством инфраструктуры последовало физическое подселение военных контингентов: первый исследователь указывает, что на этих рубежах разместили гарнизоны, «а от Кизляра к морю поселяют еще 430 казачьих семей»(Citation: 94).
    Параллельно оккупационная администрация продолжала физически удерживать родственников местной элиты, захваченных в предыдущие годы: Ахмадов отмечает в перечне архивных документов наличие бумаги за 1738 год, определенной как «Письмо чеченского владельца А. Бартыханова подполк.
    Бунину о своей верной службе России и с просьбой отпустить его сестру из Кизляра»(Citation: 94).
