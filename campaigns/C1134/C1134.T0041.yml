description:
  en: |-
    The Government of the Russian Empire physically enlarged the buffer zone around the territories of the Nokhchi through the mass relocation of militarized settlers: historian Ya.
    Z. Akhmadov states that «1736 - from the Greben stanitsas down the Terek to Kizlyar, three new Cossack stanitsas are established: Borozdinskaya, Kargalinskaya, Dubovskaya, and from Kizlyar to the sea another 430 Cossack families are settled»(Citation: 94).
  uk: 'Уряд Російської імперії фізично укрупнював буферну зону навколо територій Нохчі шляхом масового переміщення воєнізованих поселенців: історик Я. З. Ахмадов констатує, що «1736 р. - від гребінських станиць вниз по Тереку до Кізляра засновують три нові козачі станиці: Бороздинську, Каргалинську, Дубовську, а від Кізляра до моря поселяють ще 430 козачих сімей»(Citation: 94).'
  ru: 'Правительство Российской империи физически укрупняло буферную зону вокруг территорий нохчи за счет массового перемещения военизированных поселенцев: историк Я. З. Ахмадов констатирует, что «1736 г. - от гребенских станиц вниз по Тереку до Кизляра учреждают три новые казачьи станицы: Бороздинская, Каргалинская, Дубовская, а от Кизляра к морю поселяют еще 430 казачьих семей»(Citation: 94).'
