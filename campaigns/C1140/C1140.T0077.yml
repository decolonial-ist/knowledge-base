description:
  en: |-
    The Russian Empire dispatched troops to the lands of the Nokhchi to compel submission.
    The plan of the commander-in-chief in the Caucasus, General Gudovich, was to strike the unprotected: to catch the inhabitants before “their livestock and families… are sheltered in the mountains,” for “then… their punishment and complete success in the matter would be surer and more convenient.”
    When the commander of the Caucasus Line, General Bulgakov, delayed by an expedition in Dagestan, gave the inhabitants time to fortify the Khankala Gorge and took it by a bloody storm, General Gudovich, in a directive of March 20, 1807, refused to take this “on his own account” and stressed that he had not sent him to wage war: “you were sent not to wage war with the Chechen peoples, but to punish them and bring them into complete submission.”
    The commander of the Caucasus Line, General Bulgakov, considered the outcome of the campaign to be that the Chechens had by force of arms been “brought to such a state that they will long feel the blow dealt to them and, certainly, will not soon regain strength”(Citation: 99).
  uk: |-
    Російська імперія направила війська на землі Нохчі для примусу до покірності.
    Задум головнокомандувача на Кавказі генерала Гудовича полягав в ударі по незахищених: застати мешканців перш, ніж «худоба і сім'ї їхні… сховані в горах», бо «тоді… покарання їх і цілковитий успіх у справі були б певніші та зручніші».
    Коли командувач Кавказької лінії генерал Булгаков, затримавшись в експедиції в Дагестані, дав мешканцям час укріпити Ханкальську ущелину і взяв її кровопролитним штурмом, генерал Гудович у приписі від 20 березня 1807 року відмовився прийняти це «на свій рахунок» і підкреслив, що посилав не на війну: «вас послано не для того, щоб вести війну з чеченськими народами, а щоб покарати їх і привести до цілковитої покірності».
    Підсумком походу командувач Кавказької лінії генерал Булгаков вважав те, що Чеченці силою зброї «доведені до такого стану, що довго відчуватимуть завданий їм удар і, звісно, нескоро прийдуть у силу»(Citation: 99).
  ru: |-
    Российская империя направила войска на земли нохчи для принуждения к подчинению.
    Замысел главнокомандующего на Кавказе генерала Гудовича состоял в ударе по незащищенным: застать жителей прежде, чем «скот и семейства их… укрыты в горах», ибо «тогда… наказание их и совершенный успех в деле были вернее и удобнее».
    Когда командующий Кавказской линией генерал Булгаков, задержавшись на экспедиции в Дагестане, дал жителям время укрепить Ханкальское ущелье и взял его кровопролитным штурмом, генерал Гудович в предписании от 20 марта 1807 года отказался принять это «на свой счет» и подчеркнул, что посылал не на войну: «вы посланы не для того, чтобы вести войну с Чеченскими народами, но наказать их и привести в совершенную покорность».
    Итогом похода командующий Кавказской линией генерал Булгаков считал то, что чеченцы силою оружия «доведены до такого состояния, что долго будут чувствовать нанесенный им удар, и, конечно, не скоро придут в силу»(Citation: 99).
