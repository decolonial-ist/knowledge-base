description:
  ru: |-
    Российская империя удерживала заложников из числа жителей нохчи как гарантию подчинения.
    По постановлению, предъявленному командующим Кавказской линией генералом Булгаковым, чеченские старшины обязывались «даем первейших из нас аманатами по выбору Российского в здешнем краю начальника»; селения Большой Атаги, Малой Атаги и Гехи «дали 3-х аманатов из лучших семейств», которых главнокомандующий на Кавказе генерал Гудович предписал «отправить в Кизляр… иметь над ними надзор и выдавать на содержание их каждому в месяц по 10 р.»(Citation: 99).
  en: |-
    The Russian Empire held hostages from among the Nokhchi inhabitants as a guarantee of submission.
    Under the resolution presented by the commander of the Caucasus Line, General Bulgakov, the Chechen elders undertook: “we give the foremost among us as amanats, at the choice of the Russian commander in this region”; the villages of Bolshaya Ataga, Malaya Ataga, and Gekhi “gave 3 amanats from the best families,” whom the commander-in-chief in the Caucasus, General Gudovich, ordered “to send to Kizlyar… to keep watch over them and to issue for their maintenance 10 r. per month each”(Citation: 99).
  uk: |-
    Російська імперія утримувала заручників з-поміж мешканців Нохчі як гарантію підкорення.
    За постановою, пред'явленою командувачем Кавказької лінії генералом Булгаковим, чеченські старшини зобов'язувалися: «даємо найперших з нас аманатами за вибором російського начальника в тутешньому краї»; селища Великої Атаги, Малої Атаги та Гехі «дали 3-х аманатів з найкращих родин», яких головнокомандувач на Кавказі генерал Гудович приписав «відправити в Кізляр… мати над ними нагляд і видавати на їхнє утримання кожному по 10 р. на місяць»(Citation: 99).
