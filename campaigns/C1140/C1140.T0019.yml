description:
  ru: |-
    Российская империя вводила войска на земли нохчи, чтобы силой проникнуть вглубь Большой Чечни и сломить сопротивление её обществ.
    Историк Д. А. Хожаев описывает войска генерала Булгакова как «пришедших с огнём и мечом на чеченскую землю», а Ханкальское сражение 1807 года — как кровопролитное(Citation: 95).
    В феврале 1807 года три отряда под общим началом командующего Кавказской линией генерала Булгакова переправились за Терек; 13 февраля войска штурмом прорвали Ханкальское ущелье, которое жители укрепили завалами, рвами и засеками.
    Командующий Кавказской линией генерал Булгаков доносил, что вошёл «для примерного наказания» обществ нохчи, что жители, собравшись числом около 10,000, «решась погибнуть, нежели чрез ущелье пропустить Российское войско»; при штурме ущелья, из оборонявшихся чеченцев, по его рапорту, «около 1,000 убитых тех на месте»(Citation: 99).
    Имперский историк Потто признаёт, что после булгаковского штурма Ханкальского ущелья попытки русских проникнуть вглубь Чечни «больше уже не возобновлялись»(Citation: 75).
  en: |-
    The Russian Empire sent troops into the lands of the Nokhchi in order to force its way deep into Greater Chechnya and break the resistance of its communities.
    The historian D. A. Khozhaev describes General Bulgakov's troops as having “come with fire and sword to the Chechen land,” and the Khankala battle of 1807 as bloody(Citation: 95).
    In February 1807, three detachments under the overall command of the commander of the Caucasus Line, General Bulgakov, crossed the Terek; on February 13, the troops broke through the Khankala Gorge by storm, which the inhabitants had fortified with barricades, ditches, and abatis.
    The commander of the Caucasus Line, General Bulgakov, reported that he had entered “for the exemplary punishment” of the Nokhchi communities, that the inhabitants, having gathered in number about 10,000, “resolved to perish rather than let the Russian troops pass through the gorge”; during the storming of the gorge, of the defending Chechens, according to his report, there were “about 1,000 killed on the spot”(Citation: 99).
    The imperial historian Potto admits that after Bulgakov's storming of the Khankala Gorge, Russian attempts to penetrate deep into Chechnya “were never renewed”(Citation: 75).
  uk: |-
    Російська імперія вводила війська на землі Нохчі, щоб силою проникнути вглиб Великої Чечні та зламати опір її громад.
    Історик Д. А. Хожаєв описує війська генерала Булгакова як таких, що «прийшли з вогнем і мечем на чеченську землю», а Ханкальську битву 1807 року — як кровопролитну(Citation: 95).
    У лютому 1807 року три загони під загальним командуванням командувача Кавказької лінії генерала Булгакова переправилися за Терек; 13 лютого війська штурмом прорвали Ханкальську ущелину, яку мешканці укріпили завалами, ровами та засіками.
    Командувач Кавказької лінії генерал Булгаков доносив, що ввійшов «для зразкового покарання» громад Нохчі, що мешканці, зібравшись числом близько 10,000, «вирішили радше загинути, ніж пропустити російське військо через ущелину»; під час штурму ущелини серед Чеченців, які оборонялися, за його рапортом, було «близько 1,000 убитих на місці»(Citation: 99).
    Імперський історик Потто визнає, що після булгаковського штурму Ханкальської ущелини спроби росіян проникнути вглиб Чечні «більше вже не поновлювалися»(Citation: 75).
