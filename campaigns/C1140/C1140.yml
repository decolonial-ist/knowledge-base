name:
  ru: 'Карательный поход Булгакова: разорение чеченских селений и принуждение к подданству (1807)'
  en: 'Bulgakov''s Punitive Expedition: Devastation of Chechen Villages and Coercion into Allegiance (1807)'
  uk: 'Каральний похід Булгакова: розорення чеченських селищ і примус до підданства (1807)'
description:
  ru: |-
    В феврале — апреле 1807 года Российская империя предприняла карательный поход вглубь Большой Чечни под началом командующего Кавказской линией генерала Булгакова, разоряя селения нохчи и принуждая их к подданству.
    Историк Д. А. Хожаев пишет о войсках генерала Булгакова как о «пришедших с огнём и мечом на чеченскую землю»(Citation: 95).
    Замысел главнокомандующего на Кавказе генерала Гудовича состоял в том, чтобы ударить внезапно, пока жители не укрыли семьи в горах: «застали-б и вы их всех в расплох, скот и семейства их не могли-бы ещё быть ими укрыты в горах, а потому наказание их и совершенный успех в деле были вернее и удобнее»(Citation: 99).
    Командующий Кавказской линией генерал Булгаков штурмом прорвал укреплённое Ханкальское ущелье и предавал селения огню; генерал Ивелич доносил, что Большая Чеченская Атага «предана огню», а её жители подчинились, «которых селения их истреблены огнём»(Citation: 99).
    Недовольный тем, что вместо внезапной расправы вышла кровопролитная война, генерал Гудович в предписании от 20 марта 1807 года отказался принять штурм Ханкалы «на свой счёт» и подчеркнул карательный, а не военный характер порученного: «вы посланы не для того, чтобы вести войну с Чеченскими народами, но наказать их и привести в совершенную покорность»(Citation: 99).
    По итогам похода командующий Кавказской линией генерал Булгаков докладывал, что чеченцы силою оружия «доведены до такого состояния, что долго будут чувствовать нанесённый им удар, и, конечно, не скоро придут в силу»(Citation: 99).
  en: |-
    In February–April 1807, the Russian Empire undertook a punitive expedition deep into Greater Chechnya under the command of General Bulgakov, commander of the Caucasian Line, devastating Nokhchi villages and coercing them into allegiance.
    Historian D. A. Khozhaev writes of General Bulgakov's troops as having «come with fire and sword to the Chechen land»(Citation: 95).
    The plan of the commander-in-chief in the Caucasus, General Gudovich, was to strike suddenly, before the inhabitants could shelter their families in the mountains: «you would have caught them all by surprise, their cattle and families could not yet have been hidden by them in the mountains, and therefore their punishment and complete success in the matter would have been surer and more convenient»(Citation: 99).
    General Bulgakov, commander of the Caucasian Line, broke through the fortified Khankala Gorge by storm and put villages to the torch; General Ivelich reported that Greater Chechen Ataga had been «consigned to fire», and its inhabitants had submitted, «whose villages were destroyed by fire»(Citation: 99).
    Displeased that instead of a sudden reprisal a bloody war had resulted, General Gudovich, in a directive of March 20, 1807, refused to accept the storming of Khankala «on his own account» and emphasized the punitive, rather than military, character of the assignment: «you were sent not to wage war with the Chechen peoples, but to punish them and bring them into complete submission»(Citation: 99).
    Summing up the expedition, General Bulgakov, commander of the Caucasian Line, reported that by force of arms the Chechens had been «brought to such a state that they will long feel the blow dealt to them, and, of course, will not soon regain strength»(Citation: 99).
  uk: |-
    У лютому — квітні 1807 року Російська імперія здійснила каральний похід углиб Великої Чечні під проводом командувача Кавказької лінії генерала Булгакова, розорюючи селища Нохчі та примушуючи їх до підданства.
    Історик Д. А. Хожаєв пише про війська генерала Булгакова як про таких, що «прийшли з вогнем і мечем на чеченську землю»(Citation: 95).
    Задум головнокомандувача на Кавказі генерала Гудовича полягав у тому, щоб ударити раптово, поки жителі не сховали сім'ї в горах: «застали б і ви їх усіх зненацька, худоба й сім'ї їхні не могли б ще бути ними приховані в горах, а тому покарання їх і цілковитий успіх у справі були б певніші та зручніші»(Citation: 99).
    Командувач Кавказької лінії генерал Булгаков штурмом прорвав укріплену Ханкальську ущелину й віддавав селища вогню; генерал Івеліч доносив, що Велика Чеченська Атага «віддана вогню», а її жителі підкорилися, «селища яких знищені вогнем»(Citation: 99).
    Незадоволений тим, що замість раптової розправи вийшла кровопролитна війна, генерал Гудович у приписі від 20 березня 1807 року відмовився прийняти штурм Ханкали «на свій рахунок» і підкреслив каральний, а не воєнний характер дорученого: «вас послано не для того, щоб вести війну з Чеченськими народами, а щоб покарати їх і привести до цілковитої покори»(Citation: 99).
    За підсумками походу командувач Кавказької лінії генерал Булгаков доповідав, що Чеченці силою зброї «доведені до такого стану, що довго відчуватимуть завданий їм удар і, звісно, не скоро наберуться сили»(Citation: 99).
