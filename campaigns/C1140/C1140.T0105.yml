description:
  en: |-
    The Russian Empire burned the villages of the Nokhchi, depriving the inhabitants of shelter and means of subsistence.
    General Ivelich reported that the village of Bolshaya Chechenskaya Ataga was “consigned to fire” by the detachment of the commander of the Caucasus Line, General Bulgakov, while the remaining inhabitants, “whose villages were destroyed by fire,” agreed to subjecthood(Citation: 99).
  uk: |-
    Російська імперія спалювала селища Нохчі, позбавляючи мешканців даху та засобів до існування.
    Генерал Івеліч доносив, що село Велика Чеченська Атага «віддане вогню» загоном командувача Кавказької лінії генерала Булгакова, а мешканці, що залишилися, «селища яких винищені вогнем», погодилися на підданство(Citation: 99).
  ru: |-
    Российская империя сжигала селения нохчи, лишая жителей крова и средств к существованию.
    Генерал Ивелич доносил, что село Большая Чеченская Атага «предана огню» отрядом командующего Кавказской линией генерала Булгакова, а оставшиеся жители согласились на подданство, «которых селения их истреблены огнем»(Citation: 99).
