description:
  ru: |-
    Российская империя силой оружия принуждала общества нохчи к присяге на подданство.
    После разорения селений командующий Кавказской линией генерал Булгаков предъявил чеченскому народу постановление, по которому старшины «повергаем себя со всем народом Чеченским… в вечное верноподданство… в чем и даем присягу по нашему обычаю на святом Коране», а за нарушение народ подвергал себя «строжайшему наказанию и в жилищах наших разорению без сопротивления»; главнокомандующий на Кавказе генерал Гудович докладывал, что чеченцы «совершенно покорены силою оружия и приведены к присяге на вечную верность подданства»(Citation: 99).
  en: |-
    The Russian Empire compelled the Nokhchi communities by force of arms to swear an oath of subjecthood.
    After the devastation of the villages, the commander of the Caucasus Line, General Bulgakov, presented the Chechen people with a resolution by which the elders declared: “we submit ourselves with the whole Chechen people… into eternal loyal subjecthood… in witness whereof we give an oath according to our custom on the Holy Quran,” and for any violation the people subjected itself “to the strictest punishment and to the devastation of our dwellings without resistance”; the commander-in-chief in the Caucasus, General Gudovich, reported that the Chechens had been “completely subdued by force of arms and brought to an oath of eternal fidelity of subjecthood”(Citation: 99).
  uk: |-
    Російська імперія силою зброї примушувала громади Нохчі до присяги на підданство.
    Після розорення селищ командувач Кавказької лінії генерал Булгаков пред'явив чеченському народові постанову, за якою старшини «віддаємо себе з усім народом Чеченським… у вічне вірнопідданство… у чому й даємо присягу за нашим звичаєм на святому Корані», а за порушення народ піддавав себе «найсуворішому покаранню і розоренню осель наших без спротиву»; головнокомандувач на Кавказі генерал Гудович доповідав, що Чеченці «цілковито підкорені силою зброї та приведені до присяги на вічну вірність підданства»(Citation: 99).
