description:
  ru: 'Введение территориальной дискриминации: указом 1791 года право еврейского населения на мещанское и купеческое состояние было ограничено определенными наместничествами – Екатеринославским и Таврическим(Citation: 150) – правовая основа будущей черты оседлости, ограничившей зону проживания и экономической деятельности колонизированными губерниями.'
  en: 'The introduction of territorial discrimination: by the decree of 1791, the Jewish population''s right to burgher and merchant status was confined to specific viceroyalties – Ekaterinoslav and Taurida(Citation: 150) – the legal foundation of the future Pale of Settlement, which confined the area of residence and economic activity to the colonized governorates.'
  uk: 'Запровадження територіальної дискримінації: указом 1791 року право єврейського населення на міщанський і купецький стан було обмежено визначеними намісництвами – Катеринославським і Таврійським(Citation: 150) – правова основа майбутньої смуги осілості, що обмежила зону проживання та економічної діяльності колонізованими губерніями.'
