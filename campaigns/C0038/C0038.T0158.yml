description:
  ru: |-
    Российская империя в 1804-1811 годах поставила в центре Полтавы чугунный Монумент Славы в память своей победы над армией Карла XII 27 июня 1709 года - деньгами самого города и по проекту, присланному из Петербурга.
    Именным указом Сенату от 11 сентября 1804 года «Об оставлении бывших во владении города Полтавы деревень в казенном ведомстве и об отпуске собираемого с оных дохода в ведение тамошнего Генерал-Губернатора для сооружения в Полтаве монумента в память 27 июня 1709 года» городские доходы были обращены на монумент: «общество граждан Полтавских, чрез поданное к Генерал-Губернатору Князю Куракину прошение, все сии доходы назначило к построению в Полтаве монумента в память незабвенного для России дня, 27 июня 1709 года, то и повелеваем: как ныне следующие в выдачу, так и впредь собираемые в пользу сего города доходы отпускать в ведение тамошнего Генерал-Губернатора, доколе начатый монумент совершенно будет окончен»(Citation: 437).
    Вторым актом, именным рескриптом малороссийскому генерал-губернатору от 9 мая 1805 года «Об устроении монумента, в воспоминание победы, одержанной под Полтавою Императором Петром Великим», император прислал готовый проект и распорядился строить: «препровождаю к вам при сем планы монументу сему, здесь составленные, поручая вам... приступить к устроению его на месте, за исключением бронзовых украшений, к нему принадлежащих, кои особенно здесь будут сделаны и доставлены к своему назначению»(Citation: 437).
    То есть платит Полтава, а решает, как будет выглядеть знак на её земле, Петербург - вплоть до бронзы, которую отливают там же и присылают готовой.
    Монумент заложили 27 июня 1804 года, чугунную колонну поставили в мае 1809-го под руководством инженера Луганского завода Москвина, а весь ансамбль открыли 27 июня 1811 года, к очередной годовщине битвы(Citation: 432)(Citation: 442).
    На медальоне верхнего квадрата пьедестала, в кольце-змее между двумя колчанами, стояло «Июня 27 дня 1709 года», на противоположной стороне - «Окончен в 1809 году»(Citation: 432): дата чужой победы сделана датой самого места.
    Обе надписи вместе с бронзовыми барельефами исчезли в 1901 году - дореволюционный свод фиксирует это глухо: «Надпись эта и предыдущая уничтожены в 1901 году и тогда же, неизвестно кем, взяты окружавшие их бронзовые барельефы»(Citation: 432); восстановили их только при капитальном ремонте 1953 года(Citation: 442).
    Монумент стоит в Полтаве до сих пор: на август 2026 года он числится памятником национального значения под охранным номером 160010-Н(Citation: 441), Украинский институт национальной памяти письмом от 29 июля 2024 года рекомендовал его демонтировать(Citation: 439), но решение по памятникам национального значения принимает правительство, и в перечне таких решений по состоянию на 20 мая 2026 года монумента нет(Citation: 440).
  en: |-
    In 1804-1811 the Russian Empire put up a cast-iron Monument of Glory in the center of Poltava in memory of its victory over the army of Charles XII on 27 June 1709 - with the city's own money and to a design sent from St. Petersburg.
    By the imperial decree to the Senate of 11 September 1804, "On leaving the villages formerly owned by the city of Poltava under state administration and on releasing the income collected from them to the local Governor-General for the construction in Poltava of a monument in memory of 27 June 1709," the city's revenues were assigned to the monument: "the community of Poltava citizens, through a petition submitted to Governor-General Prince Kurakin, has designated all these revenues for the construction in Poltava of a monument in memory of the day unforgettable for Russia, 27 June 1709, and so we command: the revenues now due for payment, as well as those henceforth collected in favor of this city, shall be released to the local Governor-General until the monument that has been begun is completely finished"(Citation: 437).
    By a second act, the imperial rescript of 9 May 1805 to the Governor-General of Little Russia, "On the construction of a monument in commemoration of the victory won at Poltava by Emperor Peter the Great," the emperor sent a ready-made design and ordered construction to begin: "I forward to you herewith the plans for this monument, drawn up here, charging you... to proceed with its construction on site, except for the bronze ornaments belonging to it, which will be made separately here and delivered to their destination"(Citation: 437).
    That is, Poltava pays, while Petersburg decides what the sign on its land will look like - down to the bronze, which is cast there and shipped ready-made.
    The monument was founded on 27 June 1804, the cast-iron column was raised in May 1809 under the direction of Moskvin, an engineer of the Luhansk works, and the whole ensemble was opened on 27 June 1811, for the next anniversary of the battle(Citation: 432)(Citation: 442).
    On the medallion of the upper square of the pedestal, inside a serpent ring between two quivers, stood "June the 27th, 1709," and on the opposite side - "Finished in 1809"(Citation: 432): the date of someone else's victory was made into the date of the place itself.
    Both inscriptions, together with the bronze bas-reliefs, disappeared in 1901 - the pre-revolutionary survey records it tersely: "This inscription and the preceding one were destroyed in 1901, and at the same time the bronze bas-reliefs that surrounded them were taken by persons unknown"(Citation: 432); they were restored only during the capital repairs of 1953(Citation: 442).
    The monument still stands in Poltava: as of August 2026 it is listed as a monument of national significance under heritage protection number 160010-Н(Citation: 441), the Ukrainian Institute of National Remembrance recommended dismantling it in a letter of 29 July 2024(Citation: 439), but decisions on monuments of national significance are made by the government, and the list of such decisions as of 20 May 2026 does not include the monument(Citation: 440).
  uk: |-
    Російська імперія в 1804-1811 роках поставила в центрі Полтави чавунний Монумент Слави на пам'ять про свою перемогу над армією Карла XII 27 червня 1709 року - коштом самого міста і за проєктом, надісланим з Петербурга.
    Іменним указом Сенату від 11 вересня 1804 року «Про залишення сіл, що були у володінні міста Полтави, в казенному віданні та про відпуск зібраного з них доходу у відання тамтешнього генерал-губернатора для спорудження в Полтаві монумента на пам'ять 27 червня 1709 року» міські доходи були звернені на монумент: «товариство громадян полтавських, через подане до генерал-губернатора князя Куракіна прохання, всі ці доходи призначило на побудову в Полтаві монумента на пам'ять незабутнього для Росії дня, 27 червня 1709 року, то й повеліваємо: як нині належні до видачі, так і надалі збирані на користь цього міста доходи відпускати у відання тамтешнього генерал-губернатора, доки розпочатий монумент буде цілком закінчений»(Citation: 437).
    Другим актом, іменним рескриптом малоросійському генерал-губернаторові від 9 травня 1805 року «Про спорудження монумента на спомин перемоги, здобутої під Полтавою імператором Петром Великим», імператор надіслав готовий проєкт і розпорядився будувати: «надсилаю до вас при цьому плани цього монумента, тут складені, доручаючи вам... приступити до спорудження його на місці, за винятком бронзових прикрас, що до нього належать, які окремо тут будуть зроблені й доставлені до свого призначення»(Citation: 437).
    Тобто платить Полтава, а вирішує, який вигляд матиме знак на її землі, Петербург - аж до бронзи, яку відливають там само й надсилають готовою.
    Монумент заклали 27 червня 1804 року, чавунну колону поставили в травні 1809-го під керівництвом інженера Луганського заводу Москвіна, а весь ансамбль відкрили 27 червня 1811 року, до чергової річниці битви(Citation: 432)(Citation: 442).
    На медальйоні верхнього квадрата п'єдесталу, в кільці-змії між двома сагайдаками, стояло «Июня 27 дня 1709 года», на протилежному боці - «Окончен в 1809 году»(Citation: 432): дату чужої перемоги зроблено датою самого місця.
    Обидва написи разом із бронзовими барельєфами зникли 1901 року - дореволюційне зведення фіксує це глухо: «Напис цей і попередній знищені 1901 року, і тоді ж, невідомо ким, забрано бронзові барельєфи, що їх оточували»(Citation: 432); відновили їх лише під час капітального ремонту 1953 року(Citation: 442).
    Монумент стоїть у Полтаві досі: станом на серпень 2026 року він числиться пам'яткою національного значення під охоронним номером 160010-Н(Citation: 441), Український інститут національної пам'яті листом від 29 липня 2024 року рекомендував його демонтувати(Citation: 439), але рішення щодо пам'яток національного значення ухвалює уряд, і в переліку таких рішень станом на 20 травня 2026 року монумента немає(Citation: 440).
