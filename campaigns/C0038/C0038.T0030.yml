description:
  en: 'The erasure of historical borders and the introduction of the imperial vertical: "The governor-general concentrated the entire fullness of administrative power: he was endowed with the right of legislative initiative, determined the degree to which all-Russian laws extended within the governorate-general, and controlled the activity of state institutions, including judicial ones"(Citation: 194).'
  uk: 'Стирання історичних кордонів і впровадження імперської вертикалі: «Генерал-губернатор зосереджував усю повноту адм. влади: наділявся правом законодавчої ініціативи, визначав ступінь поширення в генерал-губернаторстві загальноросійських законів, контролював діяльність держ. установ, у т. ч. і судових»(Citation: 194).'
  ru: 'Стирание исторических границ и внедрение имперской вертикали: «Генерал-губернатор сосредоточивал всю полноту административной власти: наделялся правом законодательной инициативы, определял степень распространения в генерал-губернаторстве общероссийских законов, контролировал деятельность государственных учреждений, в т. ч. и судебных»(Citation: 194).'
