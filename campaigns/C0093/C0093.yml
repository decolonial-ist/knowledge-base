name:
  ru: Манипулятивный референдум о сохранении СССР (март 1991)
  en: Manipulative Referendum on the Preservation of the USSR (March 1991)
  uk: Маніпулятивний референдум про збереження СРСР (березень 1991)
description:
  ru: |-
    Попытка Москвы легитимизировать сохранение распадающейся империи.
    Общесоюзный бюллетень содержал вопрос: «Считаете ли Вы необходимым сохранение Союза Советских Социалистических Республик как обновленной федерации равноправных суверенных республик, в которой будут в полной мере гарантироваться права и свободы человека любой национальности»(Citation: 178).
    Верховная Рада УССР добавила свой вопрос – о нахождении Украины в Союзе «на основе Декларации о государственном суверенитете Украины»(Citation: 177), что и сделало итог двусмысленным.
    Двусмысленную формулировку утвердил Верховный Совет СССР постановлением за подписью его председателя Лукьянова(Citation: 178).
  en: |-
    Moscow's attempt to legitimize the preservation of a disintegrating empire.
    The all-Union ballot contained the question: "Do you consider necessary the preservation of the Union of Soviet Socialist Republics as a renewed federation of equal sovereign republics in which the rights and freedoms of a person of any nationality will be fully guaranteed"(Citation: 178).
    The Verkhovna Rada of the Ukrainian SSR added its own question – on Ukraine's membership in the Union "on the basis of the Declaration of State Sovereignty of Ukraine"(Citation: 177), which is what made the outcome ambiguous.
    The ambiguous wording was approved by the USSR Supreme Soviet in a resolution signed by its chairman Lukyanov(Citation: 178).
  uk: |-
    Спроба Москви легітимізувати збереження імперії, що розпадалася.
    Загальносоюзний бюлетень містив питання: «Чи вважаєте Ви необхідним збереження Союзу Радянських Соціалістичних Республік як оновленої федерації рівноправних суверенних республік, у якій повною мірою гарантуватимуться права і свободи людини будь-якої національності»(Citation: 178).
    Верховна Рада УРСР додала своє питання – про перебування України в Союзі «на засадах Декларації про державний суверенітет України»(Citation: 177), що й зробило підсумок двозначним.
    Двозначне формулювання затвердила Верховна Рада СРСР постановою за підписом її голови Лук'янова(Citation: 178).
