name:
  ru: Промышленная колонизация и ресурсная эксплуатация Юга (1890)
  en: Industrial Colonization and Resource Exploitation of the South (1890)
  uk: Промислова колонізація та ресурсна експлуатація Півдня (1890)
description:
  ru: 'В конце XIX века Российская империя превращает украинские земли в сырьевую колонию, эксплуатируя ресурсы Донбасса и целенаправленно завозя рабочую силу: «42 процента из 425 413 рабочих, перечисленных в переписи, родились за пределами Украины», а «в 1892 г. 80 процентов рабочей силы на шахтах и заводах Юзовки… прибыло из Московского региона»(Citation: 183).'
  en: 'At the end of the 19th century, the Russian Empire turns the Ukrainian lands into a raw-materials colony, exploiting the resources of the Donbas and deliberately importing labor: "42 percent of the 425,413 workers counted in the census were born outside Ukraine," and "in 1892, 80 percent of the workforce at the mines and plants of Yuzivka… had arrived from the Moscow region"(Citation: 183).'
  uk: 'Наприкінці XIX століття Російська імперія перетворює українські землі на сировинну колонію, експлуатуючи ресурси Донбасу та цілеспрямовано завозячи робочу силу: «42 відсотки з 425 413 робітників, перелічених у перепису, народилися поза межами України», а «у 1892 р. 80 відсотків робочої сили на шахтах і заводах Юзівки… прибуло з Московського реґіону»(Citation: 183).'
