description:
  ru: 'Использование дешевой рабочей силы на шахтах и заводах в условиях тяжелейшей эксплуатации: «Первоначально большинство шахтёров составляли сезонные рабочие»(Citation: 213) – без прав, без оседлости, на износ.'
  en: 'The use of cheap labor at the mines and plants under conditions of harsh exploitation: "Initially the majority of miners were seasonal workers"(Citation: 213) – without rights, without settlement, worked to exhaustion.'
  uk: 'Використання дешевої робочої сили на шахтах і заводах в умовах найтяжчої експлуатації: «Первинно більшість шахтарів становили сезонні робітники»(Citation: 213) – без прав, без осілості, на знос.'
