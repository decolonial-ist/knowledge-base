description:
  en: 'The 1941 scorched-earth tactic under the directive of the USSR Sovnarkom and the Central Committee of 29 June 1941: "In the forced withdrawal of Red Army units, drive off the rolling railway stock, leave the enemy not a single locomotive, not a single railcar"(Citation: 167); the Dnipro hydroelectric station was "destroyed at the beginning of the Great Patriotic War… (see the Directive of the USSR Council of People''s Commissars and the Central Committee of the VKP(b) of June 29, 1941)"(Citation: 186).'
  uk: |-
    Тактика «випаленої землі» 1941 року за директивою РНК СРСР і ЦК ВКП(б) від 29 червня 1941 року: «При вимушеному відході частин Червоної Армії відганяти рухомий залізничний склад, не залишати ворогові жодного паровоза, жодного вагона»(Citation: 167); ДніпроГЕС був «зруйнований на початку Великої вітчизняної війни… (див.
    Директива РНК СРСР та ЦК ВКП(б) від 29 червня 1941)»(Citation: 186).
  ru: 'Тактика «выжженной земли» 1941 года по директиве СНК СССР и ЦК ВКП(б) от 29 июня 1941 года: «При вынужденном отходе частей Красной Армии угонять подвижной железнодорожный состав, не оставлять врагу ни одного паровоза, ни одного вагона»(Citation: 167); ДнепроГЭС был «разрушенный в начале Великой отечественной войны… (см. Директива СНК СССР и ЦК ВКП(б) от 29 июня 1941)»(Citation: 186).'
