description:
  en: |-
    The use of untrained conscripts as expendable material: they were "thrown into combat often at once, without undergoing military training in reserve units, sometimes unarmed, not even changed into military uniform (hence the name)"(Citation: 211).
    The scale is visible from a single episode: "after the Red Army first took Kharkiv in the spring of 1943, about 15 thousand people aged 15 to 45 were mobilized into it and sent to the front without training," with "1 rifle per 5-10 men"(Citation: 211).
  uk: |-
    Використання ненавчених мобілізованих як витратного матеріалу: їх «кидали у бойові дії часто відразу, без проходження військової підготовки у запасних частинах, іноді неозброєними, не переодягненими у військову форму (звідси назва)»(Citation: 211).
    Масштаб видно з одного епізоду: «після першого взяття Червоною армією Харкова навесні 1943 р. до неї було мобілізовано близько 15 тис. осіб віком від 15 до 45 років, яких без підготовки відправили на фронт», причому «1 гвинтівка припадала на 5-10 осіб»(Citation: 211).
  ru: |-
    Использование необученных мобилизованных как расходного материала: их «бросали в боевые действия часто сразу, без прохождения военной подготовки в запасных частях, иногда невооружёнными, не переодетыми в военную форму (отсюда название)»(Citation: 211).
    Масштаб виден по одному эпизоду: «после первого взятия Красной армией Харькова весной 1943 г. в неё было мобилизовано около 15 тыс. человек в возрасте от 15 до 45 лет, которых без подготовки отправили на фронт», причём «1 винтовка приходилась на 5-10 человек»(Citation: 211).
