description:
  en: |-
    The occupation administration of the Tsardom of Muscovy imposed discriminatory levies on Nokhchi societies for the internal movement of goods: the historian Sh.
    B. Akhmadov emphasizes that «the Okochans (Akkin Chechens) living in the town of Terki were obliged without exception to pay duty on the various goods and wares they took out for sale to their compatriots in Chechnya and Ingushetia»(Citation: 66).
  uk: 'Окупаційна адміністрація Московського царства обклала суспільства Нохчі дискримінаційними зборами за внутрішнє переміщення товарів: історик Ш. Б. Ахмадов підкреслює, що «Окочани (Чеченці-Аккінці), які мешкали в місті Терки, мусили в обов''язковому порядку сплачувати мито за різні товари та вироби, що їх вони вивозили на продаж своїм співвітчизникам у Чечню та Інгушетію»(Citation: 66).'
  ru: 'Оккупационная администрация Московского Царства обложила общества нохчи дискриминационными сборами за внутреннее перемещение грузов: историк Ш. Б. Ахмадов подчеркивает, что «окочане (чеченцы-аккинцы), проживавшие в городе Терки должны были в обязательном порядке платить пошлину за различные товары и изделия, вывозимые ими на продажу к своим соотечественникам в Чечню и Ингушетию»(Citation: 66).'
