description:
  ru: 'Регулярная армия Московского Царства осуществляла вооруженные рейды на территории обществ нохчи: историк Я. З. Ахмадов констатирует, что в 1691–1700 годах «со стороны царских властей на казаков-бунтовщиков и их союзников-горцев совершались в отместку карательные экспедиции»(Citation: 94) и фиксирует «ответные карательные рейды царских сил»(Citation: 94).'
  en: |-
    The regular army of the Tsardom of Muscovy carried out armed raids on the territories of Nokhchi societies: the historian Ya.
    Z. Akhmadov states that in 1691–1700 «punitive expeditions were carried out by the tsarist authorities in retaliation against the rebel Cossacks and their Highlander allies»(Citation: 94) and records «retaliatory punitive raids by tsarist forces»(Citation: 94).
  uk: 'Регулярна армія Московського царства здійснювала збройні рейди на території суспільств Нохчі: історик Я. З. Ахмадов констатує, що в 1691–1700 роках «з боку царської влади на козаків-бунтівників та їхніх союзників-Горців у відплату здійснювалися каральні експедиції»(Citation: 94) і фіксує «каральні рейди царських сил у відповідь»(Citation: 94).'
