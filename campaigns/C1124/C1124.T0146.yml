description:
  en: |-
    The occupation administration of the Tsardom of Muscovy engaged in systemic lawless arbitrariness against the Indigenous population: the historian Sh.
    B. Akhmadov states that «the venality and bribe-taking of the voivodes, who permitted themselves great abuses — all this was far from a new phenomenon»(Citation: 66).
  uk: 'Окупаційна адміністрація Московського царства чинила системне протиправне свавілля щодо корінного населення: історик Ш. Б. Ахмадов констатує, що «продажність і хабарництво воєвод, які дозволяли собі великі зловживання, — усе це було явищем далеко не новим»(Citation: 66).'
  ru: 'Оккупационная администрация Московского Царства осуществляла системный нелегальный произвол в отношении коренного населения: историк Ш. Б. Ахмадов констатирует, что «подкупность и взяточничество воевод, позволявших себе большие злоупотребления, - все это было явлением далеко не новым»(Citation: 66).'
