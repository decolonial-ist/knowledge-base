description:
  ru: 'Дипломатический аппарат Московского Царства расширял юридическое подчинение территорий нохчи: историк Я. З. Ахмадов фиксирует, что метрополия оформила в 1696 году «выражение покровительства Россией Брагунскому княжеству в Чечне»(Citation: 94).'
  en: |-
    The diplomatic apparatus of the Tsardom of Muscovy expanded the legal subordination of Nokhchi territories: the historian Ya.
    Z. Akhmadov records that in 1696 the metropole formalized «the expression of Russia's protection over the Braguny principality in Chechnya»(Citation: 94).
  uk: 'Дипломатичний апарат Московського царства розширював юридичне підпорядкування територій Нохчі: історик Я. З. Ахмадов фіксує, що метрополія оформила 1696 року «вираження покровительства Росією Брагунському князівству в Чечні»(Citation: 94).'
