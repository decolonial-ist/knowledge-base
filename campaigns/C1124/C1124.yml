name:
  ru: Карательные рейды и экономическое удушение нохчи (1691–1700)
  en: Punitive Raids and the Economic Strangulation of the Nokhchi (1691–1700)
  uk: Каральні рейди та економічне удушення Нохчі (1691–1700)
description:
  ru: |-
    В конце XVII века Московское Царство осуществляло непрерывное силовое, дипломатическое и экономическое давление на общества нохчи.
    В ответ на союз коренного населения с русскими казаками-раскольниками регулярная армия проводила вооруженные операции: историк Я. З. Ахмадов констатирует, что в 1691–1700 годах «со стороны царских властей на казаков-бунтовщиков и их союзников-горцев совершались в отместку карательные экспедиции»(Citation: 94) и фиксирует «ответные карательные рейды царских сил»(Citation: 94).
    Параллельно дипломатический аппарат расширял юридический контроль над регионом, оформив в 1696 году «выражение покровительства Россией Брагунскому княжеству в Чечне»(Citation: 94).
    Силовые методы дополнялись официальным фискальным давлением: историк Ш. Б. Ахмадов подчеркивает, что «окочане (чеченцы-аккинцы), проживавшие в городе Терки должны были в обязательном порядке платить пошлину за различные товары и изделия, вывозимые ими на продажу к своим соотечественникам в Чечню и Ингушетию»(Citation: 66).
    Экономическое удушение усугублялось произволом местной оккупационной администрации: он дополняет, что «подкупность и взяточничество воевод, позволявших себе большие злоупотребления, - все это было явлением далеко не новым»(Citation: 66).
  en: |-
    At the end of the 17th century, the Tsardom of Muscovy exerted continuous military, diplomatic, and economic pressure on the societies of the Nokhchi.
    In response to the alliance of the Indigenous population with Russian Old Believer Cossacks, the regular army conducted armed operations: the historian Ya.
    Z. Akhmadov states that in 1691–1700 «punitive expeditions were carried out in retaliation by the tsarist authorities against the rebel Cossacks and their mountaineer allies»(Citation: 94) and records «retaliatory punitive raids by tsarist forces»(Citation: 94).
    In parallel, the diplomatic apparatus expanded legal control over the region, formalizing in 1696 «an expression of Russia's protection over the Braguny principality in Chechnya»(Citation: 94).
    Military methods were supplemented by official fiscal pressure: the historian Sh.
    B. Akhmadov emphasizes that «the Okochans (Akkin Chechens) living in the town of Terki were obligated without exception to pay duties on the various goods and wares they took out for sale to their compatriots in Chechnya and Ingushetia»(Citation: 66).
    The economic strangulation was aggravated by the arbitrariness of the local occupation administration: he adds that «the venality and bribe-taking of the voivodes, who permitted themselves great abuses — all this was a phenomenon far from new»(Citation: 66).
  uk: |-
    Наприкінці XVII століття Московське царство здійснювало безперервний силовий, дипломатичний та економічний тиск на суспільства Нохчі.
    У відповідь на союз корінного населення з російськими козаками-розкольниками регулярна армія проводила збройні операції: історик Я. З. Ахмадов констатує, що в 1691–1700 роках «з боку царської влади на козаків-бунтівників та їхніх союзників-горців у відплату здійснювалися каральні експедиції»(Citation: 94) і фіксує «відповідні каральні рейди царських сил»(Citation: 94).
    Паралельно дипломатичний апарат розширював юридичний контроль над регіоном, оформивши в 1696 році «вираження покровительства Росією Брагунському князівству в Чечні»(Citation: 94).
    Силові методи доповнювалися офіційним фіскальним тиском: історик Ш. Б. Ахмадов підкреслює, що «Окочани (Чеченці-Аккінці), які проживали в місті Терки, мусили в обов'язковому порядку платити мито за різні товари та вироби, які вони вивозили на продаж до своїх співвітчизників у Чечню та Інгушетію»(Citation: 66).
    Економічне удушення посилювалося свавіллям місцевої окупаційної адміністрації: він додає, що «продажність і хабарництво воєвод, які дозволяли собі великі зловживання, — усе це було явищем далеко не новим»(Citation: 66).
