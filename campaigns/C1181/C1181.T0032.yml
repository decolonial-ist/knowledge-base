description:
  en: |-
    By its decree of 11 March 1952 the Presidium of the Supreme Soviet of the USSR ordered that even those who had served out their sentences not be released into freedom: Chechens, Ingush and the other deported peoples "having served punishment for various crimes in corrective-labor camps, colonies and prisons" were, "upon expiry of the term of punishment, to be sent by convoy to special settlement, under the surveillance of the organs of the Ministry of State Security of the USSR, at the place of residence of their families"(Citation: 620).
    The nationwide amnesty of 27 March 1953 was a criminal-law amnesty and did not touch the exiles at all.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "the question of restoring the Checheno-Ingush ASSR was not raised even for discussion.
    To all the numerous letters and appeals of the highlanders to Moscow came the harsh, unambiguous answer that the Chechens and Ingush were to remain in their places of residence forever"(Citation: 125).
    The empire cut the exiles off from education as well.
    Children were formally subject to universal schooling, but in 1945 in some oblasts of Kazakhstan up to 70% of the special settlers' children did not go to school: the families, robbed at deportation, had nothing to dress their children in - in the documents this is recorded as "by reason of the absence of warm clothing and footwear"(Citation: 125), and in 1946, of the 89 thousand special settlers' children from the North Caucasus obliged to study under the law on universal education, only 22 thousand actually studied(Citation: 125).
    By 1949 no less than 60% of the North Caucasus special settlers were completely illiterate; 2.1% had a complete secondary education, 0.2% - higher education(Citation: 125).
    The empire barred the road to university as well: a school graduate needed a special permit from the republican organs of internal affairs, study was allowed only in Kazakhstan, Kirghizia and Uzbekistan, and even after the diploma the Chechens and Ingush still could not leave the places of deportation - and, according to the data of the organs of internal affairs, a significant part of the special settlers with higher education - lawyers, writers, teachers - could not find work in their profession(Citation: 125).
    The educated grew fewer even in absolute numbers: in 1946 Kazakhstan counted 1,248 people with higher or specialized secondary education among those deported from the North Caucasus; by the beginning of 1948 there remained 1,127(Citation: 125).
    By its decree of 16 July 1956 the Presidium of the Supreme Soviet of the USSR removed the special-settlement registration - and by the same second article stripped the people of their property and of the right to their homeland(Citation: 262).
    Even the empire's own audits gave the segregation no justification.
    In February 1953 Ganenko and Alatortsev, inspectors of the Central Committee of the Bolshevik party, toured the special settlements of Kazakhstan and Uzbekistan, and the commission that examined their memorandum summarized it thus: "Many local party and soviet organs display a disdainful attitude toward work among the special settlers, pass over numerous instances of arbitrariness toward this part of the population, of infringement of the special settlers' lawful rights, of indiscriminate political distrust toward them, which artificially breeds moods of discontent among the special settlers"(Citation: 533).
    In 1954 the Ministry of Internal Affairs declared unfounded the complaints that Chechens and Ingush were allegedly terrorizing the local population: 506,043 people deported from the North Caucasus stood on the special-settlement rolls in 1954, and of them only 5,418 - about one percent - had been convicted and were in confinement(Citation: 533).
    The same ministry counted, as of 10 November 1955, among the Chechens deported "for treason" 2,280 war veterans, 4,455 holders of orders and medals and 2,553 families of men killed at the front; among the Ingush - another 1,085, 1,869 and 871(Citation: 620).
    The empire amnestied even genuine accomplices of the German occupiers: the decree of 17 September 1955 was so entitled - "On the Amnesty of Soviet Citizens Who Collaborated with the Occupiers in the Period of the Great Patriotic War of 1941-1945."
    But historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that the highland peoples, repressed "allegedly for 'collaboration with the Germans,'" "were not touched by this decree"(Citation: 125).
    In August 1956 an inspection that had toured Kazakhstan and Kirghizia reported to the Presidium of the Supreme Soviet after the fact: "From 1948 to 1953 the living conditions of the special settlers were burdened with restrictions of various kinds which were not warranted by serious causes from the point of view of the special settlers' own conduct.
    Many Chechens were dismissed from work, expelled from the party, arrested and then sentenced to long terms of imprisonment"(Citation: 533).
    By its decree of 9 January 1957 the Presidium of the Supreme Soviet of the USSR recognized "as necessary the restoration of the national autonomy of the Chechen and Ingush peoples," recommended the restoration itself to the Presidium of the Supreme Soviet of the RSFSR and repealed only the ban on returning: "Article 2 of the Decree of 16 July 1956 in the part prohibiting the Chechens and Ingush from returning to their former place of residence"(Citation: 263).
    A decree of the Presidium of the Supreme Soviet of the RSFSR restored the republic that same day(Citation: 533), but neither of these acts ordered the return of the confiscated property.
  uk: |-
    Президія Верховної Ради СРСР указом від 11 березня 1952 року звеліла навіть тих, хто відбув строк, не випускати на волю: чеченців, інгушів та інші виселені народи, «які відбули покарання за різні злочини у виправно-трудових таборах, колоніях і тюрмах», належало «після закінчення строку покарання направляти етапом на спецпоселення, під нагляд органів Міністерства державної безпеки СРСР, за місцем проживання їхніх сімей»(Citation: 620).
    Загальнодержавна амністія 27 березня 1953 року була кримінальною і засланих не торкалася зовсім.
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «питання про відновлення Чечено-Інгуської АРСР не ставилося навіть у порядку обговорення.
    На всі численні листи та звернення горців до Москви йшла жорстка недвозначна відповідь, що чеченці та інгуші мають залишатися в місцях свого проживання навічно»(Citation: 125).
    Імперія відрізала засланих і від освіти.
    Діти формально підлягали загальному навчанню, але 1945 року в окремих областях Казахстану до 70% дітей спецпоселенців не ходили до школи: сім'ям, пограбованим під час виселення, не було в що вдягти дітей - у документах це записано «через відсутність теплого одягу та взуття»(Citation: 125), а 1946 року з 89 тисяч дітей спецпоселенців із Північного Кавказу, зобов'язаних учитися за законом про загальну освіту, реально вчилися лише 22 тисячі(Citation: 125).
    До 1949 року не менш як 60% північнокавказьких спецпоселенців були цілком неписьменними, повну середню освіту мали 2,1%, вищу - 0,2%(Citation: 125).
    Імперія перекрила й дорогу до вишу: випускникові школи потрібен був спеціальний дозвіл республіканських органів внутрішніх справ, учитися дозволяли лише в Казахстані, Киргизії та Узбекистані, а після диплома чеченці та інгуші все одно не могли залишити місць виселення - і, за даними органів внутрішніх справ, значна частина спецпоселенців із вищою освітою, юристи, літератори й педагоги, не могла влаштуватися за фахом(Citation: 125).
    Освічених ставало менше навіть в абсолютних числах: 1946 року в Казахстані налічувалося 1248 осіб із вищою та середньою спеціальною освітою серед виселених із Північного Кавказу, на початок 1948 року їх залишилося 1127(Citation: 125).
    Президія Верховної Ради СРСР указом від 16 липня 1956 року зняла облік спецпоселення - і тією ж другою статтею позбавила людей майна та права на батьківщину(Citation: 262).
    Сегрегації не виправдовували навіть власні перевірки імперії.
    У лютому 1953 року інспектори центрального комітету більшовицької партії Ганенко й Алаторцев об'їхали спецпоселення в Казахстані та Узбекистані, і комісія, що розбирала їхню записку, переказала її так: «Багато місцевих партійних і радянських органів допускають зневажливе ставлення до роботи серед спецпоселенців, проходять повз численні факти свавілля щодо цієї частини населення, ущемлення законних прав спецпоселенців, огульної політичної недовіри до них, що штучно породжує настрої невдоволення серед спецпоселенців»(Citation: 533).
    Міністерство внутрішніх справ 1954 року назвало такими, що не відповідають дійсності, скарги на чеченців та інгушів, які нібито тероризують місцеве населення: на обліку спецпоселення 1954 року стояло 506 043 особи, виселені з Північного Кавказу, а засуджено й сиділо в ув'язненні з них лише 5418 - близько одного відсотка(Citation: 533).
    Те саме міністерство нарахувало на 10 листопада 1955 року у висланих «за зраду» чеченців 2280 учасників війни, 4455 нагороджених орденами й медалями та 2553 сім'ї загиблих на фронті, в інгушів - ще 1085, 1869 і 871(Citation: 620).
    Імперія амністувала навіть справжніх посібників німецьких окупантів: указ від 17 вересня 1955 року так і називався - «Про амністію радянських громадян, які співпрацювали з окупантами в період Великої Вітчизняної війни 1941-1945 рр.».
    Але історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що горських народів, репресованих «нібито за "співпрацю з німцями"», «цей указ не торкнувся»(Citation: 125).
    У серпні 1956 року інспекція, що об'їхала Казахстан і Киргизію, доповідала Президії Верховної Ради заднім числом: «З 1948 по 1953 р. умови життя спецпоселенців були обтяжені різного роду обмеженнями, які не викликалися серйозними причинами з погляду поведінки самих спецпоселенців.
    Багатьох чеченців зняли з роботи, виключили з партії, заарештовували й потім засуджували на тривалі строки тюремного ув'язнення»(Citation: 533).
    Президія Верховної Ради СРСР указом від 9 січня 1957 року визнала «за необхідне відновити національну автономію чеченського та інгуського народів», рекомендувала саме відновлення Президії Верховної Ради РРФСР і скасувала лише заборону повертатися: «статтю 2 Указу від 16 липня 1956 року в частині заборони чеченцям та інгушам повертатися на колишнє місце проживання»(Citation: 263).
    Указ Президії Верховної Ради РРФСР того ж дня відновив республіку(Citation: 533), але повертати конфісковане майно жоден із цих актів не звелів.
  ru: |-
    Президиум Верховного Совета СССР указом от 11 марта 1952 года велел даже отсидевших срок не выпускать на волю: «Отбывших наказание за разные преступления в исправительно-трудовых лагерях, колониях и тюрьмах» чеченцев, ингушей и других выселенных народов - «по истечении срока наказания направлять этапом на спецпоселение, под надзор органов Министерства государственной безопасности СССР, по месту жительства их семей»(Citation: 620).
    Общегосударственная амнистия 27 марта 1953 года была уголовной и ссыльных не касалась вовсе.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «вопрос о восстановлении Чечено-Ингушской АССР не ставился даже в порядке обсуждения.
    На все многочисленные письма и обращения горцев в Москву следовал жестокий недвусмысленный ответ, что чеченцы и ингуши должны оставаться в местах своего проживания навечно»(Citation: 125).
    Империя отрезала ссыльных и от образования.
    Дети формально подлежали всеобщему обучению, но в 1945 году в отдельных областях Казахстана до 70% детей спецпереселенцев не ходили в школу: семьям, ограбленным при выселении, нечем было одеть детей - в документах это записано «по причине отсутствия теплой одежды и обуви»(Citation: 125), а в 1946 году из 89 тысяч детей спецпереселенцев с Северного Кавказа, обязанных учиться по закону о всеобщем образовании, реально учились только 22 тысячи(Citation: 125).
    К 1949 году не менее 60% северокавказских спецпереселенцев были полностью неграмотными, полное среднее образование было у 2,1%, высшее - у 0,2%(Citation: 125).
    Империя перекрыла и дорогу в вуз: выпускнику школы требовалось специальное разрешение республиканских органов внутренних дел, учиться разрешали только в Казахстане, Киргизии и Узбекистане, а после диплома чеченцы и ингуши всё равно не могли покинуть места выселения - и, по данным органов внутренних дел, значительная часть спецпереселенцев с высшим образованием, юристы, литераторы и педагоги, не могла устроиться по специальности(Citation: 125).
    Образованных становилось меньше даже в абсолютных числах: в 1946 году в Казахстане насчитывалось 1248 человек с высшим и средним специальным образованием среди выселенных с Северного Кавказа, к началу 1948 года их осталось 1127(Citation: 125).
    Президиум Верховного Совета СССР указом от 16 июля 1956 года снял учёт спецпоселения - и той же второй статьёй лишил людей имущества и права на родину(Citation: 262).
    Сегрегацию не оправдывали даже собственные счёты империи.
    В феврале 1953 года инспекторы центрального комитета большевистской партии Ганенко и Алаторцев объехали спецпоселения в Казахстане и Узбекистане, и комиссия, разбиравшая их записку, пересказала её так: «Многие местные партийные и советские органы допускают пренебрежительное отношение к работе среди спецпоселенцев, проходят мимо многочисленных фактов произвола в отношении этой части населения, ущемления законных прав спецпоселенцев, огульного политического недоверия к ним, что искусственно порождает настроения недовольства среди спецпоселенцев»(Citation: 533).
    Министерство внутренних дел в 1954 году назвало не соответствующими действительности жалобы на чеченцев и ингушей, будто бы терроризирующих местное население: на учёте спецпоселения в 1954 году состояло 506 043 человека, выселенных с Северного Кавказа, а осуждено и сидело в заключении из них только 5418 - около одного процента(Citation: 533).
    То же министерство насчитало к 10 ноября 1955 года у высланных «за предательство» чеченцев 2280 участников войны, 4455 награждённых орденами и медалями и 2553 семьи погибших на фронте, у ингушей - ещё 1085, 1869 и 871(Citation: 620).
    Империя амнистировала даже реальных пособников немецких оккупантов: указ от 17 сентября 1955 года так и назывался - «Об амнистии советских граждан, сотрудничавших с оккупантами в период Великой Отечественной войны 1941-1945 гг.».
    Но историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что горских народов, репрессированных «якобы за «сотрудничество с немцами»», «данный указ не коснулся»(Citation: 125).
    В августе 1956 года инспекция, объехавшая Казахстан и Киргизию, докладывала Президиуму Верховного Совета задним числом: «С 1948 по 1953 г. условия жизни спецпоселенцев были отягощены различного рода ограничениями, которые не вызывались серьезными причинами с точки зрения поведения самих спецпоселенцев.
    Многих чеченцев сняли с работы, исключили из партии, арестовывали и затем осуждали на длительные сроки тюремного заключения»(Citation: 533).
    Президиум Верховного Совета СССР указом от 9 января 1957 года признал «необходимым восстановить национальную автономию чеченского и ингушского народов», рекомендовал само восстановление Президиуму Верховного Совета РСФСР и отменил лишь запрет возвращаться: «статью 2 Указа от 16 июля 1956 года в части запрещения чеченцам и ингушам возвращаться на прежнее местожительство»(Citation: 263).
    Указ Президиума Верховного Совета РСФСР в тот же день восстановил республику(Citation: 533), но возвращать конфискованное имущество ни один из этих актов не велел.
