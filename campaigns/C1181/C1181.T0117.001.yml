description:
  ru: |-
    Колонизатор заселил земли выселенных чеченцев и ингушей приезжими и держал их там все годы ссылки.
    В 1956 году комиссия руководства большевистской партии («ЦК КПСС») готовила восстановление республики и доложила о приезжих: в районы, отошедшие Грозненской области, «было переселено из РСФСР, Украины и Молдавии 78 тыс. чел.», на земли, отданные Дагестану, «переселилось из высокогорных районов республики 46 тыс. горцев», в районы, отданные Северной Осетии, - «55 тыс. чел.»(Citation: 620).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что уже к середине мая 1944 года приезжих в Грозненской области было 40% от числа выселенных оттуда чеченцев, а «желающих ехать на новые места было мало» - и колонизатор платил переселенцам по 2500 рублей на семью и освобождал их от налогов на год(Citation: 125).
    Чеченский историк А. Г. Авторханов, писавший в эмиграции, видел в замене населения расчёт империи, и назвал его: «создать на Кавказе новый колониально-колонизаторский и военно-полицейский корпус иноземцев, подчиненных, исполнительных и послушных в деле защиты советских имперских интересов».
    Итог он подвёл так: «заселением сюда более чем миллионного населения советских колонизаторов большевики уже вбили первый клин между братскими народами Кавказа»(Citation: 369).
    Вторым мотивом он называет нефть - «ясно обозначенный курс Советского правительства взять окончательно в имперские руки ведущую и основную для всего Советского Союза кавказскую нефтяную экономику»(Citation: 369).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов подводят итог: «В результате искусственных сдвигов границ территорий, «поправок» в расселении репрессированных народов, к 1961 г. чеченцы и ингуши составили 41% населения республики, в то время как в 1939 г. их доля достигала 58,4%»(Citation: 125).
  en: |-
    The colonizer settled the lands of the deported Chechens and Ingush with newcomers and kept them there through all the years of exile.
    In 1956 a commission of the leadership of the Bolshevik party (the "Central Committee of the CPSU") was preparing the restoration of the republic and reported on the newcomers: into the districts that had gone to Grozny oblast "78 thousand persons were resettled from the RSFSR, Ukraine and Moldavia," onto the lands given to Dagestan "46 thousand highlanders resettled from the high-mountain districts of the republic," into the districts given to North Ossetia - "55 thousand persons"(Citation: 620).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that already by mid-May 1944 the newcomers in Grozny oblast numbered 40% of the Chechens deported from it, and "there were few willing to go to the new places" - so the colonizer paid the settlers 2,500 rubles per family and exempted them from taxes for a year(Citation: 125).
    The Chechen historian A. G. Avtorkhanov, writing in emigration, saw in the replacement of the population an imperial calculation, and named it: "to create in the Caucasus a new colonial-colonizing and military-police corps of foreigners, subordinate, obedient and compliant in the matter of defending Soviet imperial interests."
    He summed it up thus: "by settling here a population of more than a million Soviet colonizers the Bolsheviks have already driven the first wedge between the brotherly peoples of the Caucasus"(Citation: 369).
    As a second motive he names oil - "the clearly marked course of the Soviet government to take finally into imperial hands the leading and basic Caucasian oil economy for the whole Soviet Union"(Citation: 369).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov sum up: "As a result of artificial shifts of territorial borders and of 'corrections' in the settlement of the repressed peoples, by 1961 the Chechens and Ingush made up 41% of the population of the republic, whereas in 1939 their share had reached 58.4%"(Citation: 125).
  uk: |-
    Колонізатор заселив землі виселених чеченців та інгушів приїжджими і тримав їх там усі роки заслання. 1956 року комісія керівництва більшовицької партії («ЦК КПРС») готувала відновлення республіки і доповіла про приїжджих: у райони, що відійшли до Грозненської області, «було переселено з РРФСР, України та Молдавії 78 тис. осіб», на землі, віддані Дагестану, «переселилося з високогірних районів республіки 46 тис. горян», у райони, віддані Північній Осетії, - «55 тис. осіб»(Citation: 620).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що вже до середини травня 1944 року приїжджих у Грозненській області було 40 % від числа виселених звідти чеченців, а «охочих їхати на нові місця було мало» - і колонізатор платив переселенцям по 2500 рублів на сім'ю і звільняв їх від податків на рік(Citation: 125).
    Чеченський історик А. Г. Авторханов, який писав в еміграції, бачив у заміні населення розрахунок імперії, і назвав його: «створити на Кавказі новий колоніально-колонізаторський і військово-поліцейський корпус чужинців, підлеглих, виконавчих і слухняних у справі захисту радянських імперських інтересів».
    Підсумок він підбив так: «заселенням сюди більш ніж мільйонного населення радянських колонізаторів більшовики вже вбили перший клин між братніми народами Кавказу»(Citation: 369).
    Другим мотивом він називає нафту - «чітко окреслений курс Радянського уряду взяти остаточно в імперські руки провідну й основну для всього Радянського Союзу кавказьку нафтову економіку»(Citation: 369).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов підбивають підсумок: «У результаті штучних зсувів кордонів територій, «поправок» у розселенні репресованих народів, до 1961 р. чеченці та інгуші становили 41 % населення республіки, тоді як 1939 р. їхня частка сягала 58,4 %»(Citation: 125).
