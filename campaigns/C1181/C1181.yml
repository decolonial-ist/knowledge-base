name:
  ru: '«Сосланы навечно»: жизнь в спецпоселении и возвращение на занятую родину (1949-1965)'
  en: '"Exiled Forever": Life in Special Settlement and Return to an Occupied Homeland (1949-1965)'
  uk: '«Заслані навічно»: життя у спецпоселенні та повернення на зайняту батьківщину (1949-1965)'
description:
  ru: |-
    После депортации чеченцев в 1944 году (кампания C1180) оккупанты заняли их дома, аулы и поля.
    В 1952 году на землях выселенных народов Северного Кавказа их было больше миллиона(Citation: 369).
    Президиум Верховного Совета СССР ещё указом от 26 ноября 1948 года объявил ссылку вечной: чеченцы и ингуши «сосланы навечно», за побег - до 20 лет каторги(Citation: 125).
    Сама ссылка была устроена как тюрьма без стен.
    Тайная полиция признавала: «В 1949 г. был проведен ряд мероприятий по розыску и задержанию беглецов, а также установлению жесткого режима в местах поселений»(Citation: 533).
    По постановлению правительства СССР от 8 января 1945 года «всякая самовольная отлучка выселенца за пределы района расселения, обслуживаемого спецкомендатурой, рассматривается как побег и влечет за собой ответственность в уголовном порядке», а район этот порой ограничивался несколькими улицами в городе или одним сельсоветом(Citation: 533).
    Тем, кого ведомство записывало в «злостно уклоняющиеся от работы в колхозах», полагалось 8 лет лишения свободы(Citation: 533), а десятерых религиозных наставников и их учеников суд оккупантов в июле 1952 года отправил в лагеря на сроки до 25 лет с конфискацией имущества(Citation: 533).
    «Вечный» срок ссылки держался на указах Сталина.
    Ужесточение 1948-1949 годов шло его курсом конца 1940-х на подавление любой самостоятельности, и тайной полиции, которая требовала сажать беглецов без разбора, он в награду отдал и надзор за спецпоселенцами, и распоряжение их трудом(Citation: 533).
    После его смерти срок ссылки чеченцев стал предметом ведомственного торга: летом 1953 года отдел центрального комитета большевистской партии предлагал снять с учёта спецпоселения 560 710 человек, среди них чеченцев и ингушей, а полицейское ведомство требовало «указанные категории лиц временно оставить на спецпоселении»(Citation: 533); министр внутренних дел СССР Круглов в сентябре просил председателя Совета Министров СССР Маленкова оставить чеченцев и ингушей на поселении ещё на пять лет, считая освобождение из-под надзора преждевременным.
    Решения по его записке так и не приняли(Citation: 533).
    Империя не вернула отнятые земли даже когда отпустила людей из ссылки: Президиум Верховного Совета СССР указом от 16 июля 1956 года снял с чеченского народа режим спецпоселения (принудительного проживания в Казахстане и Киргизии под надзором комендатур) - и той же статьёй закрепил: снятие ограничений «не влечет за собой возвращение им имущества, конфискованного при выселении, и что они не имеют права возвращаться в места, откуда были выселены»(Citation: 262).
    Ведомства объясняли запрет тем, что земля уже роздана.
    Начальник полиции оккупанта Барсуков докладывал 26 июня 1956 года, что разместить чеченцев и ингушей в их районах «не представляется возможным», потому что «эти районы заселены переселенцами из центральных областей РСФСР»(Citation: 533), а министр внутренних дел СССР Дудоров докладывал руководству большевистской партии («ЦК КПСС»): «возможность восстановления автономии для чеченцев и ингушей в пределах прежней территории является делом трудным и вряд ли осуществимым... возвращение чеченцев и ингушей в прежние места жительства неизбежно вызовет целый ряд нежелательных последствий»(Citation: 533).
    Народ вернулся сам, не дожидаясь разрешений: уже 15 июня 1957 года бюро областного комитета большевистской партии («Чечено-Ингушский обком КПСС») признавало, что «в республику уже прибыло более 122 тысяч чеченцев и ингушей вместо 70 тысяч, предусмотренных планом на 1957 год»(Citation: 533), а отдел переселений колониальной администрации («Оргкомитета по ЧИАССР») считал в справке на 20 января 1958 года: по плану должны переселиться 23 503 семьи - прибыло 52 037 семей, 201 746 человек(Citation: 620).
    «Почти треть взрослых чеченцев, ингушей и карачаевцев (до 80 тысяч человек) отказались дать» подписку об отказе от имущества - пишут историки Я. З. Ахмадов и Э. Х. Хасмагомадов - «и вернулись домой, не взирая на запреты»(Citation: 125).
    Люди приехали на родину, занятую переселенцами и урезанную перекройкой границ: свои дома приходилось выкупать у новых владельцев(Citation: 125), горные аулы остались закрытыми, а ингушские земли Тарской долины, на которых складывался ингушский народ, империя чеченцам и ингушам не вернула: в 1944 году она отдала их Северной Осетии, а восстанавливая республику в 1957 году, оставила за ней 1600 квадратных километров чернозёма и добавила взамен 5000 квадратных километров песков Бурунной степи за Тереком; протесты чечено-ингушской делегации руководство большевистской партии отклонило(Citation: 125).
    Историки считают итог в долях: «к 1961 г. чеченцы и ингуши составили 41% населения республики, в то время как в 1939 г. их доля достигала 58,4%»(Citation: 125).
  en: |-
    After the deportation of the Chechens in 1944 (campaign C1180) the occupiers took over their homes, auls and fields.
    By 1952 there were more than a million of them on the lands of the deported peoples of the North Caucasus(Citation: 369).
    By its decree of 26 November 1948 the Presidium of the Supreme Soviet of the USSR had already declared the exile eternal: the Chechens and Ingush were "exiled forever," with up to 20 years of hard labor for escape(Citation: 125).
    The exile itself was built as a prison without walls.
    The secret police admitted: "In 1949 a series of measures was carried out to track down and detain fugitives, as well as to establish a strict regime in the places of settlement"(Citation: 533).
    Under the resolution of the government of the USSR of 8 January 1945, "any unauthorized absence of a deportee beyond the bounds of the resettlement district served by the special commandant's office shall be regarded as escape and shall entail criminal liability," and that district was at times limited to a few streets in a town or a single village soviet(Citation: 533).
    Those whom the agency listed among the "malicious evaders of work on the collective farms" faced 8 years of imprisonment(Citation: 533), and in July 1952 the occupiers' court sent ten religious mentors and their followers to the camps for terms of up to 25 years with confiscation of property(Citation: 533).
    The "eternal" term of exile rested on Stalin's decrees.
    The tightening of 1948-1949 followed his late-1940s course of crushing any self-reliance, and to the secret police, which demanded that fugitives be jailed indiscriminately, he handed as a reward both the supervision of the special settlers and the disposal of their labor(Citation: 533).
    After his death the term of the Chechens' exile became a matter of bargaining between agencies: in the summer of 1953 a department of the Central Committee of the Bolshevik party proposed removing 560,710 people from the special-settlement rolls, Chechens and Ingush among them, while the police ministry demanded that "the said categories of persons temporarily remain in special settlement"(Citation: 533); in September Kruglov, Minister of Internal Affairs of the USSR, asked Malenkov, chairman of the Council of Ministers of the USSR, to keep the Chechens and Ingush in settlement for another five years, deeming their release from surveillance premature.
    No decision on his memorandum was ever taken(Citation: 533).
    The empire did not return the seized lands even when it let the people out of exile: by its decree of 16 July 1956 the Presidium of the Supreme Soviet of the USSR lifted the special-settlement regime from the Chechen people (forced residence in Kazakhstan and Kirghizia under the surveillance of commandants' offices) - and in the same article laid down that the lifting of restrictions "does not entail the return to them of property confiscated at deportation, and that they do not have the right to return to the places from which they were deported"(Citation: 262).
    The ministries explained the ban by saying the land had already been handed out.
    Barsukov, head of the occupier's police, reported on 26 June 1956 that housing the Chechens and Ingush in their districts "is not possible," because "these districts are settled by migrants from the central oblasts of the RSFSR"(Citation: 533), while Dudorov, Minister of Internal Affairs of the USSR, reported to the leadership of the Bolshevik party (the "TsK KPSS"): "the possibility of restoring autonomy for the Chechens and Ingush within their former territory is a difficult matter and hardly feasible... the return of the Chechens and Ingush to their former places of residence will inevitably provoke a whole range of undesirable consequences"(Citation: 533).
    The people returned on their own, without waiting for permissions: already on 15 June 1957 the bureau of the regional committee of the Bolshevik party (the "Checheno-Ingush obkom of the KPSS") admitted that "more than 122 thousand Chechens and Ingush have already arrived in the republic instead of the 70 thousand provided for by the plan for 1957"(Citation: 533), and the resettlement department of the colonial administration (the "Orgkomitet for the ChIASSR") counted in a report of 20 January 1958: under the plan 23,503 families were to resettle - 52,037 families, 201,746 people, had arrived(Citation: 620).
    "Almost a third of the adult Chechens, Ingush and Karachais (up to 80 thousand people) refused to give" the pledge renouncing their property, write historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov, "and returned home regardless of the bans"(Citation: 125).
    People arrived to a homeland occupied by settlers and cut down by a redrawing of borders: they had to buy their own houses back from the new owners(Citation: 125), the mountain auls remained closed, and the Ingush lands of the Tarskaya valley, where the Ingush people had taken shape, the empire did not return to the Chechens and Ingush: in 1944 it gave them to North Ossetia and, restoring the republic in 1957, left 1,600 square kilometers of black earth with Ossetia, adding to the republic in exchange 5,000 square kilometers of the sands of the Burun steppe beyond the Terek; the protests of the Chechen-Ingush delegation were rejected by the leadership of the Bolshevik party(Citation: 125).
    Historians reckon the outcome in shares: "by 1961 the Chechens and Ingush made up 41% of the republic's population, whereas in 1939 their share had reached 58.4%"(Citation: 125).
  uk: |-
    Після депортації чеченців у 1944 році (кампанія C1180) окупанти зайняли їхні домівки, аули та поля.
    У 1952 році на землях виселених народів Північного Кавказу їх було понад мільйон(Citation: 369).
    Президія Верховної Ради СРСР ще указом від 26 листопада 1948 року оголосила заслання вічним: чеченці та інгуші «заслані навічно», за втечу - до 20 років каторги(Citation: 125).
    Саме заслання було влаштоване як в'язниця без стін.
    Таємна поліція визнавала: «У 1949 р. було проведено низку заходів із розшуку й затримання втікачів, а також встановлення жорсткого режиму в місцях поселень»(Citation: 533).
    За постановою уряду СРСР від 8 січня 1945 року «будь-яка самовільна відлучка виселенця за межі району розселення, який обслуговує спецкомендатура, розглядається як втеча і тягне за собою відповідальність у кримінальному порядку», а район цей часом обмежувався кількома вулицями в місті або однією сільрадою(Citation: 533).
    Тим, кого відомство записувало до тих, «хто злісно ухиляється від роботи в колгоспах», належало 8 років позбавлення волі(Citation: 533), а десятьох релігійних наставників та їхніх учнів суд окупантів у липні 1952 року відправив у табори на строки до 25 років із конфіскацією майна(Citation: 533).
    «Вічний» строк заслання тримався на указах Сталіна.
    Посилення 1948-1949 років ішло його курсом кінця 1940-х на придушення будь-якої самостійності, і таємній поліції, яка вимагала садити втікачів без розбору, він у нагороду віддав і нагляд за спецпоселенцями, і розпорядження їхньою працею(Citation: 533).
    Після його смерті строк заслання чеченців став предметом відомчого торгу: влітку 1953 року відділ центрального комітету більшовицької партії пропонував зняти з обліку спецпоселення 560 710 осіб, серед них чеченців та інгушів, а поліційне відомство вимагало «зазначені категорії осіб тимчасово залишити на спецпоселенні»(Citation: 533); міністр внутрішніх справ СРСР Круглов у вересні просив голову Ради Міністрів СРСР Маленкова залишити чеченців та інгушів на поселенні ще на п'ять років, вважаючи звільнення з-під нагляду передчасним.
    Рішення за його запискою так і не ухвалили(Citation: 533).
    Імперія не повернула відібраних земель, навіть коли відпустила людей із заслання: Президія Верховної Ради СРСР указом від 16 липня 1956 року зняла з чеченського народу режим спецпоселення (примусового проживання в Казахстані та Киргизії під наглядом комендатур) - і тією ж статтею закріпила: зняття обмежень «не тягне за собою повернення їм майна, конфіскованого під час виселення, і що вони не мають права повертатися в місця, звідки були виселені»(Citation: 262).
    Відомства пояснювали заборону тим, що землю вже роздано.
    Начальник поліції окупанта Барсуков доповідав 26 червня 1956 року, що розмістити чеченців та інгушів у їхніх районах «не видається можливим», бо «ці райони заселені переселенцями з центральних областей РРФСР»(Citation: 533), а міністр внутрішніх справ СРСР Дудоров доповідав керівництву більшовицької партії («ЦК КПРС»): «можливість відновлення автономії для чеченців та інгушів у межах колишньої території є справою важкою і навряд чи здійсненною... повернення чеченців та інгушів у колишні місця проживання неминуче викличе цілу низку небажаних наслідків»(Citation: 533).
    Народ повернувся сам, не чекаючи дозволів: уже 15 червня 1957 року бюро обласного комітету більшовицької партії («Чечено-Інгуський обком КПРС») визнавало, що «в республіку вже прибуло понад 122 тисячі чеченців та інгушів замість 70 тисяч, передбачених планом на 1957 рік»(Citation: 533), а відділ переселень колоніальної адміністрації («Оргкомітету по ЧІАРСР») рахував у довідці на 20 січня 1958 року: за планом мали переселитися 23 503 сім'ї - прибуло 52 037 сімей, 201 746 осіб(Citation: 620).
    «Майже третина дорослих чеченців, інгушів і карачаївців (до 80 тисяч осіб) відмовилися дати» підписку про відмову від майна - пишуть історики Я. З. Ахмадов і Е. Х. Хасмагомадов - «і повернулися додому, незважаючи на заборони»(Citation: 125).
    Люди приїхали на батьківщину, зайняту переселенцями й урізану перекроюванням кордонів: свої будинки доводилося викуповувати в нових власників(Citation: 125), гірські аули залишилися закритими, а інгуські землі Тарської долини, на яких складався інгуський народ, імперія чеченцям та інгушам не повернула: у 1944 році вона віддала їх Північній Осетії, а відновлюючи республіку 1957 року, залишила за нею 1600 квадратних кілометрів чорнозему й додала натомість 5000 квадратних кілометрів пісків Бурунного степу за Тереком; протести чечено-інгуської делегації керівництво більшовицької партії відхилило(Citation: 125).
    Історики рахують підсумок у частках: «до 1961 р. чеченці та інгуші становили 41% населення республіки, тоді як у 1939 р. їхня частка сягала 58,4%»(Citation: 125).
