description:
  ru: |-
    Колонизатор оставил высшие должности восстановленной республики за русскими руководителями.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что вокруг первого секретаря областного комитета большевистской партии («обкома КПСС») Яковлева «сложилась группировка руководящих работников, которая отрицательно относилась «...к акту восстановления автономии чечено-ингушского народа...»», а сам Яковлев «открыто заявлял, что считает большой ошибкой решение по реабилитации репрессированных народов»(Citation: 125).
    Чиновник правительства РСФСР Федин докладывал 29 августа 1957 года, что трое членов Оргкомитета из чеченцев и ингушей - Дукузов, Мальсагов и Тепсаев - «более восьми месяцев не назначены ни на какие должности и по существу ни за что конкретно не отвечают», хотя «в республике ощущается большой недостаток в кадрах из чеченцев и ингушей»(Citation: 533).
    Писатель А. Е. Костерин, свидетель событий, писал: «Все велось и ведется так, чтобы вызвать эксцессы со стороны изгнанников и против партийно-советских организаций, и против тех, кто заселил их селения...
    Эти эксцессы были, есть и, к сожалению, будут, если не изменится позиция и тактика обкома»(Citation: 125).
    Те же историки пишут: «Очень быстро в социалистической Чечено-Ингушетии формируется негласная система распределения высших должностей» - посты первого секретаря областного комитета партии, министра внутренних дел, прокурора, главы КГБ (предшественника современной ФСБ), руководителя «Грознефти» и другие «закрепляются за русскими руководителями»(Citation: 125).
  en: |-
    The colonizer kept the highest posts of the restored republic for Russian leaders.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that around the first secretary of the Bolshevik party's oblast committee (the "obkom of the CPSU") Yakovlev "there formed a grouping of leading officials which had a negative attitude '...toward the act of restoring the autonomy of the Chechen-Ingush people...'," and Yakovlev himself "openly declared that he considered the decision on the rehabilitation of the repressed peoples a great mistake"(Citation: 125).
    An official of the government of the RSFSR, Fedin, reported on 29 August 1957 that three members of the Organizing Committee from among the Chechens and Ingush - Dukuzov, Malsagov and Tepsaev - "for more than eight months have not been appointed to any posts and in essence are responsible for nothing concrete," although "the republic feels a great shortage of cadres from among the Chechens and Ingush"(Citation: 533).
    The writer A. E. Kosterin, a witness of the events, wrote: "Everything was and is being done so as to provoke excesses on the part of the exiles both against the party-soviet organizations and against those who settled their villages...
    These excesses have been, are and, regrettably, will be, unless the position and tactics of the obkom change"(Citation: 125).
    The same historians write: "Very quickly an unspoken system of distributing the highest posts takes shape in socialist Chechen-Ingushetia" - the posts of first secretary of the party's oblast committee, minister of internal affairs, prosecutor, head of the KGB (predecessor of today's FSB), head of "Grozneft" and others "are reserved for Russian leaders"(Citation: 125).
  uk: |-
    Колонізатор залишив вищі посади відновленої республіки за російськими керівниками.
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що навколо першого секретаря обласного комітету більшовицької партії («обкому КПРС») Яковлєва «склалося угруповання керівних працівників, яке негативно ставилося «...до акту відновлення автономії чечено-інгуського народу...»», а сам Яковлєв «відкрито заявляв, що вважає великою помилкою рішення про реабілітацію репресованих народів»(Citation: 125).
    Чиновник уряду РРФСР Федін доповідав 29 серпня 1957 року, що троє членів Оргкомітету з чеченців та інгушів - Дукузов, Мальсагов і Тепсаєв - «понад вісім місяців не призначені на жодні посади і по суті ні за що конкретно не відповідають», хоча «в республіці відчувається великий брак кадрів із чеченців та інгушів»(Citation: 533).
    Письменник А. Є. Костерін, свідок подій, писав: «Усе велося і ведеться так, щоб викликати ексцеси з боку вигнанців і проти партійно-радянських організацій, і проти тих, хто заселив їхні села...
    Ці ексцеси були, є і, на жаль, будуть, якщо не зміниться позиція і тактика обкому»(Citation: 125).
    Ті самі історики пишуть: «Дуже швидко в соціалістичній Чечено-Інгушетії формується негласна система розподілу вищих посад» - посади першого секретаря обласного комітету партії, міністра внутрішніх справ, прокурора, глави КДБ (попередника сучасної ФСБ), керівника «Грознафти» та інші «закріплюються за російськими керівниками»(Citation: 125).
