description:
  en: |-
    Collective-farm meetings sentenced deported Chechens to an 8-year banishment from their places of settlement - without trial, investigation or defense.
    The government of the USSR established this procedure by its resolution of 2 June 1948: the general meeting of a collective farm or village passed a "public sentence" of banishment "for malicious evasion of labor activity in agriculture and the leading of an antisocial, parasitic way of life," and these meetings were conducted by the organs of the Ministry of Internal Affairs.
    The ministry itself reported: "The banishment measures were determined by general meetings of collective farms and village peasants, conducted by the organs of the MVD"(Citation: 620).
    The Ministry of Internal Affairs admitted in a 1950 report: "deportees maliciously evading work on the collective farms are being banished by decisions of collective-farm meetings for 8 years to remote regions of the country" - this was done in the Kzyl-Orda, Kustanai, Pavlodar and South Kazakhstan oblasts of Kazakhstan(Citation: 533).
    The ministry itself called banishment without trial merely an "erroneous practice" and an "incorrect application of the measure of punishment": under its own order such people were supposed to be put on trial(Citation: 533).
    Historian V. A. Kozlov writes from the ministry's documents: "The more far-sighted police officials were forced to admit that punishing the Chechens and Ingush for evasion of work was inexpedient" - or else "a natural defense mechanism will kick in - the single monolithic community will behave as one person - you cannot punish them all!"(Citation: 533).
  uk: |-
    Колгоспні збори засуджували депортованих чеченців до висилки з місць поселення на 8 років - без суду, слідства й захисту.
    Уряд СРСР установив такий порядок постановою від 2 червня 1948 року: загальні збори колгоспу чи села виносили «громадський вирок» про виселення «за злісне ухиляння від трудової діяльності в сільському господарстві та ведення антигромадського, паразитичного способу життя», а проводили ці збори органи Міністерства внутрішніх справ.
    Саме міністерство доповідало: «Заходи з виселення були визначені загальними зборами колгоспів і селян сіл, що їх проводили органи МВС»(Citation: 620).
    Міністерство внутрішніх справ у доповіді 1950 року визнавало: «виселенці, які злісно ухиляються від роботи в колгоспах, за рішеннями колгоспних зборів висилаються на 8 років у віддалені райони країни» - так робили в Кзил-Ординській, Кустанайській, Павлодарській та Південно-Казахстанській областях Казахстану(Citation: 533).
    Саме міністерство називало висилку без суду лише «помилковою практикою» та «неправильним застосуванням міри покарання»: за його ж наказом таких людей належало віддавати під суд(Citation: 533).
    Історик В. А. Козлов пише за документами міністерства: «Далекоглядніші поліційні чиновники змушені були визнати, що карати чеченців та інгушів за ухиляння від роботи недоцільно» - інакше «запрацює природний захисний механізм - єдина монолітна спільнота поведеться як одна людина - усіх не покараєш!»(Citation: 533).
  ru: |-
    Колхозные собрания приговаривали депортированных чеченцев к высылке из мест поселения на 8 лет - без суда, следствия и защиты.
    Правительство СССР установило такой порядок постановлением от 2 июня 1948 года: общее собрание колхоза или села выносило «общественный приговор» о выселении «за злостное уклонение от трудовой деятельности в сельском хозяйстве и ведение антиобщественного, паразитического образа жизни», а проводили эти собрания органы Министерства внутренних дел.
    Само министерство докладывало: «Мероприятия по выселению были определены общими собраниями колхозов и крестьян сел, проводившимися органами МВД»(Citation: 620).
    Министерство внутренних дел в докладе 1950 года признавало: «выселенцы, злостно уклоняющиеся от работы в колхозах, по решениям колхозных собраний высылаются на 8 лет в отдаленные районы страны» - так делали в Кзыл-Ординской, Кустанайской, Павлодарской и Южно-Казахстанской областях Казахстана(Citation: 533).
    Само министерство называло высылку без суда лишь «ошибочной практикой» и «неправильным применением меры наказания»: по его же приказу таких людей полагалось отдавать под суд(Citation: 533).
    Историк В. А. Козлов пишет по документам министерства: «Более дальновидные полицейские чиновники вынуждены были признать, что наказывать чеченцев и ингушей за уклонение от работы нецелесообразно» - иначе «заработает естественный защитный механизм - единое монолитное сообщество поведет себя как один человек - всех не накажешь!»(Citation: 533).
