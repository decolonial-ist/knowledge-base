description:
  ru: |-
    Колонизатор под угрозой тюрьмы эксплуатировал труд депортированных чеченцев.
    Правительство СССР постановлением от 21 февраля 1948 года велело организовать «правильное и обязательное трудоиспользование спецпоселенцев»(Citation: 533).
    По справкам отдела спецпоселений тайной полиции, чеченцы и ингуши работали в распоряжении всех министерств («наркоматов»), кроме военного: на 1 января 1949 года 125 753 человека были заняты в сельском хозяйстве, 6175 - в угольной промышленности, 9737 - в металлургии, 12 011 - в местной промышленности(Citation: 265).
    Тех, кого ведомство записывало в «злостно уклоняющиеся от работы в колхозах», Министерство внутренних дел СССР и Генеральный прокурор совместным приказом требовали судить по статье 82 - «лишение свободы на 8 лет», но тайная полиция признавала, что на местах людей отправляли в новую высылку на те же 8 лет и вовсе без суда - решениями колхозных собраний(Citation: 533).
    Даже послабление колонизатор привязал к труду: постановлением от 5 июля 1954 года «О снятии некоторых ограничений в правовом положении спецпоселенцев» правительство СССР разрешило жить не в границах комендатуры, а в пределах своей области - но только занятым общественно полезным трудом(Citation: 533)(Citation: 267).
  en: |-
    The colonizer exploited the labor of the deported Chechens under threat of prison.
    By its resolution of 21 February 1948 the government of the USSR ordered the organization of the "correct and obligatory labor utilization of the special settlers"(Citation: 533).
    According to the reports of the special settlements department of the secret police, the Chechens and Ingush worked at the disposal of all the ministries (the "narkomats") except the military one: as of 1 January 1949, 125,753 people were employed in agriculture, 6,175 in the coal industry, 9,737 in metallurgy, 12,011 in local industry(Citation: 265).
    Those whom the agency listed among the "malicious evaders of work on the collective farms" were, by joint order of the Ministry of Internal Affairs of the USSR and the Prosecutor General, to be tried under Article 82 - "deprivation of freedom for 8 years" - but the secret police admitted that on the ground people were sent into a new 8-year exile without any trial at all, by decisions of collective-farm meetings(Citation: 533).
    Even the relaxation the colonizer tied to labor: by the resolution of 5 July 1954 "On Lifting Certain Restrictions in the Legal Status of the Special Settlers" the government of the USSR allowed people to live not within the bounds of the commandant's office but within their oblast - yet only those engaged in socially useful labor(Citation: 533)(Citation: 267).
  uk: |-
    Колонізатор під загрозою тюрми експлуатував працю депортованих чеченців.
    Уряд СРСР постановою від 21 лютого 1948 року звелів організувати «правильне й обов'язкове трудовикористання спецпоселенців»(Citation: 533).
    За довідками відділу спецпоселень таємної поліції, чеченці та інгуші працювали в розпорядженні всіх міністерств («наркоматів»), крім військового: на 1 січня 1949 року 125 753 особи були зайняті в сільському господарстві, 6175 - у вугільній промисловості, 9737 - у металургії, 12 011 - у місцевій промисловості(Citation: 265).
    Тих, кого відомство записувало до тих, «хто злісно ухиляється від роботи в колгоспах», Міністерство внутрішніх справ СРСР і Генеральний прокурор спільним наказом вимагали судити за статтею 82 - «позбавлення волі на 8 років», але таємна поліція визнавала, що на місцях людей відправляли в нове заслання на ті самі 8 років і зовсім без суду - рішеннями колгоспних зборів(Citation: 533).
    Навіть послаблення колонізатор прив'язав до праці: постановою від 5 липня 1954 року «Про зняття деяких обмежень у правовому становищі спецпоселенців» уряд СРСР дозволив жити не в межах комендатури, а в межах своєї області - але лише зайнятим суспільно корисною працею(Citation: 533)(Citation: 267).
