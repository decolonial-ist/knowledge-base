description:
  ru: |-
    СССР запрещал ссыльным чеченцам и ингушам покидать район поселения, который порой состоял из нескольких улиц.
    Комиссия Центрального комитета партии признавала это в 1953 году в записке главе правительства Маленкову: «отлучка спецпоселенца без соответствующего разрешения за пределы района, обслуживаемого спецкомендатурой... рассматривается как побег и влечет за собой ответственность в уголовном порядке»(Citation: 267).
    Ссыльная ингушка Аза Базоркина, получившая в шестнадцать лет паспорт со штампом «спецпоселенец», свидетельствует, как комендант не выпустил друга её отца проводить умершую жену: «Мусульманское кладбище находилось за чертой города и проводить жену за эту черту он не позволил»(Citation: 553).
    Лишь постановлением от 5 июля 1954 года Совет Министров СССР ослабил режим: занятым общественно полезным трудом дал «право проживания в пределах данной области, края, республики»(Citation: 606), но побег остался преступлением: за выезд с поселения без разрешения судили по статье 82 Уголовного кодекса РСФСР (побег с места обязательного поселения)(Citation: 267), и в 1956 году «из 328 тысяч чеченцев на учете в спецкомендатурах состояли немногим более 191,4 тысяч»(Citation: 125).
    Запрет на возвращение пережил и указ от 9 января 1957 года: министр внутренних дел СССР Дудоров просил руководство большевистской партии («ЦК КПСС») разрешить «лиц чеченской и ингушской национальностей, возвращающихся к прежнему месту жительства без разрешения Оргкомитета, задерживать, снимать с поездов, пароходов, других видов транспорта и возвращать к местам бывшего поселения», а 9 апреля 1957 года докладывал: за три дня в поездах «было выявлено и задержано 2139 чел.»(Citation: 533).
    Оргкомитет растянул возврат на четыре года и сделал его платным: возвращающиеся жаловались формальному главе государства Ворошилову, что представителем Оргкомитета Немухиным им «был сообщен порядок возвращения нас в течение 1957-1960 гг., причем все расходы, связанные с переездом, относились за счет нас, самих переезжающих»(Citation: 533); 26 января 1957 года Оргкомитет и бюро областного комитета партии («Грозненский обком КПСС») установили, что «приезд для постоянного местожительства на территории республики может производиться только по разрешению Оргкомитета ЧИАССР [Чечено-Ингушской республики]», и предписали полиции оккупанта прописывать приезжих только по этим разрешениям(Citation: 533); Совет Министров РСФСР 5 сентября 1960 года продлил срок возвращения «до 1963 г.»(Citation: 533).
    Горная Чечня осталась закрытой: пять горных районов - Галанчожский, Чеберлоевский, Шароевский, Итум-Калинский и Шатойский - указ от 9 января 1957 года не воссоздал(Citation: 533).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что «горцам было запрещено проживание» там, а репатриантов «селили в новых совхозах, рабочих поселках, фермах... особенно в затеречных казачьих районах, причем в засушливых, нездоровых, отдаленных от районных центров и городов местах»(Citation: 125).
    Те же историки пишут, что в станицах попутно «создавались условия для их быстрой культурной и языковой ассимиляции»: «В станицах преподавание велось только на русском языке, руководителями станичных советов, районов и хозяйств оставались исключительно русские»(Citation: 125).
    Погром августа 1958 года в Грозном, с требованием из резолюции погромщиков «Чечено-ингушскому населению разрешить проживать в Грозненской области не более 10 % от общего количества населения»(Citation: 533), СССР обернул против самих чеченцев.
    Историки пишут: «В ноябре 1958 г. в Грозном и в Грозненском (сельском) районе был установлен особый паспортный режим, согласно которому здесь вводились серьезные ограничения на прописку... подлинная цель данной акции состояла в создании административных препонов на пути миграции чеченского населения в Грозный», а «Инициатором введения запрета... выступили партийные и советские органы Чечено-Ингушетии»(Citation: 125).
  en: |-
    The USSR forbade the exiled Chechens and Ingush to leave the district of settlement, which at times consisted of a few streets.
    A commission of the Central Committee of the party admitted this in 1953 in a memorandum to the head of government Malenkov: "the absence of a special settler without the appropriate permission beyond the limits of the district served by the special commandant's office... is regarded as escape and entails liability under criminal law"(Citation: 267).
    The exiled Ingush woman Aza Bazorkina, who at sixteen received a passport stamped "special settler," testifies how the commandant would not let her father's friend go to bury his dead wife: "The Muslim cemetery lay beyond the city limits, and he did not allow him to accompany his wife beyond that line"(Citation: 553).
    Only by its resolution of 5 July 1954 did the Council of Ministers of the USSR ease the regime: to those engaged in socially useful labor it granted "the right of residence within the given oblast, krai, republic"(Citation: 606), but escape remained a crime: for leaving the settlement without permission people were tried under article 82 of the Criminal Code of the RSFSR (escape from a place of obligatory settlement)(Citation: 267), and in 1956 "of 328 thousand Chechens, a little over 191.4 thousand were on the registers of the special commandant's offices"(Citation: 125).
    The ban on returning outlived even the decree of 9 January 1957: the minister of internal affairs of the USSR Dudorov asked the leadership of the Bolshevik party (the "Central Committee of the CPSU") to allow "persons of Chechen and Ingush nationality returning to their former place of residence without the permission of the Organizing Committee to be detained, removed from trains, steamers and other means of transport and returned to the places of their former settlement," and on 9 April 1957 reported: in three days "2,139 persons were identified and detained" on trains(Citation: 533).
    The Organizing Committee stretched the return out over four years and made it paid: the returnees complained to the formal head of state Voroshilov that the Organizing Committee's representative Nemukhin had in March 1957 "announced to us the procedure of our return over 1957-1960, with all expenses connected with the move charged to us, the movers ourselves"(Citation: 533); on 26 January 1957 the Organizing Committee and the bureau of the party's oblast committee (the "Grozny obkom of the CPSU") established that "arrival for permanent residence on the territory of the republic may take place only by permission of the Organizing Committee of the ChIASSR [the Chechen-Ingush republic]," and ordered the occupier's police to register newcomers only on those permits(Citation: 533); on 5 September 1960 the Council of Ministers of the RSFSR extended the deadline for return "until 1963"(Citation: 533).
    Mountain Chechnya remained closed: five mountain districts - Galanchozh, Cheberloy, Sharoy, Itum-Kale and Shatoy - the decree of 9 January 1957 did not restore(Citation: 533).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that "the highlanders were forbidden to reside" there, while the repatriates "were settled in new state farms, workers' settlements, farmsteads... especially in the Cossack districts beyond the Terek, and in arid, unhealthy places remote from district centers and towns"(Citation: 125).
    The same historians write that in the stanitsas, along the way, "conditions were created for their rapid cultural and linguistic assimilation": "In the stanitsas teaching was conducted only in Russian; the heads of stanitsa soviets, districts and farms remained exclusively Russians"(Citation: 125).
    The pogrom of August 1958 in Grozny, with the demand from the pogromists' resolution "to allow the Chechen-Ingush population to reside in Grozny oblast at no more than 10% of the total population"(Citation: 533), the USSR turned against the Chechens themselves.
    The historians write: "In November 1958 a special passport regime was established in Grozny and in the Grozny (rural) district, under which serious restrictions on residence registration were introduced here... the true purpose of this action was to create administrative obstacles in the way of the migration of the Chechen population into Grozny," and "The initiators of the introduction of the ban, under the pretext of tightening the fight against a rise in offenses, were the party and soviet organs of Chechen-Ingushetia"(Citation: 125).
  uk: |-
    СРСР забороняв засланим чеченцям та інгушам залишати район поселення, який часом складався з кількох вулиць.
    Комісія Центрального комітету партії визнавала це 1953 року в записці главі уряду Маленкову: «відлучка спецпоселенця без відповідного дозволу за межі району, який обслуговує спецкомендатура... розглядається як втеча і тягне за собою відповідальність у кримінальному порядку»(Citation: 267).
    Заслана інгушка Аза Базоркіна, яка в шістнадцять років отримала паспорт зі штампом «спецпоселенець», свідчить, як комендант не випустив друга її батька провести померлу дружину: «Мусульманський цвинтар був за межею міста, і провести дружину за цю межу він не дозволив»(Citation: 553).
    Лише постановою від 5 липня 1954 року Рада Міністрів СРСР послабила режим: зайнятим суспільно корисною працею дала «право проживання в межах даної області, краю, республіки»(Citation: 606), але втеча лишилася злочином: за виїзд із поселення без дозволу судили за статтею 82 Кримінального кодексу РРФСР (втеча з місця обов'язкового поселення)(Citation: 267), і 1956 року «з 328 тисяч чеченців на обліку в спецкомендатурах перебували трохи більше 191,4 тисячі»(Citation: 125).
    Заборона повертатися пережила й указ від 9 січня 1957 року: міністр внутрішніх справ СРСР Дудоров просив керівництво більшовицької партії («ЦК КПРС») дозволити «осіб чеченської та інгуської національностей, які повертаються до колишнього місця проживання без дозволу Оргкомітету, затримувати, знімати з поїздів, пароплавів, інших видів транспорту і повертати до місць колишнього поселення», а 9 квітня 1957 року доповідав: за три дні в поїздах «було виявлено і затримано 2139 осіб»(Citation: 533).
    Оргкомітет розтягнув повернення на чотири роки і зробив його платним: ті, хто повертався, скаржилися формальному главі держави Ворошилову, що представник Оргкомітету Немухін у березні 1957 року «повідомив порядок повернення нас протягом 1957-1960 рр., причому всі витрати, пов'язані з переїздом, відносилися за рахунок нас, самих переїжджаючих»(Citation: 533); 26 січня 1957 року Оргкомітет і бюро обласного комітету партії («Грозненський обком КПРС») установили, що «приїзд для постійного місця проживання на території республіки може здійснюватися лише з дозволу Оргкомітету ЧІАРСР [Чечено-Інгуської республіки]», і приписали поліції окупанта прописувати приїжджих лише за цими дозволами(Citation: 533); Рада Міністрів РРФСР 5 вересня 1960 року продовжила строк повернення «до 1963 р.»(Citation: 533).
    Гірська Чечня лишилася закритою: п'ять гірських районів - Галанчозький, Чеберлоївський, Шароївський, Ітум-Калинський і Шатойський - указ від 9 січня 1957 року не відновив(Citation: 533).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що «горянам було заборонено проживання» там, а репатріантів «селили в нових радгоспах, робітничих селищах, на фермах... особливо в затеречних козацьких районах, причому в посушливих, нездорових, віддалених від районних центрів і міст місцях»(Citation: 125).
    Ті самі історики пишуть, що в станицях заразом «створювалися умови для їхньої швидкої культурної та мовної асиміляції»: «У станицях викладання велося тільки російською мовою, керівниками станичних рад, районів і господарств залишалися виключно росіяни»(Citation: 125).
    Погром серпня 1958 року в Грозному, з вимогою з резолюції погромників «Чечено-інгуському населенню дозволити проживати в Грозненській області не більше 10 % від загальної кількості населення»(Citation: 533), СРСР обернув проти самих чеченців.
    Історики пишуть: «У листопаді 1958 р. у Грозному та в Грозненському (сільському) районі було встановлено особливий паспортний режим, згідно з яким тут запроваджувалися серйозні обмеження на прописку... справжня мета цієї акції полягала у створенні адміністративних перепон на шляху міграції чеченського населення до Грозного», а «Ініціатором запровадження заборони... виступили партійні та радянські органи Чечено-Інгушетії»(Citation: 125).
