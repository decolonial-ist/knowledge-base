description:
  en: |-
    In June 1956 the head of the Soviet militia Barsukov reported: "to place the Chechens and Ingush in the districts where they lived before the deportation is not possible," because "these districts are settled by migrants from the central oblasts of the RSFSR," while on the lands that had passed to North Ossetia, where before the deportation "77,578 Chechens and Ingush lived," "the local [and] party organs consider the return of the Chechens and Ingush inexpedient"(Citation: 533).
    The minister of internal affairs of the USSR Dudorov in June 1956 proposed not returning the people at all: "The former territory is settled" - and raised the question "of creating for the Chechens and Ingush an oblast autonomy on the territory of the Kazakh and Kirghiz SSR"(Citation: 620).
    The USSR dropped the plan because of "the sharply negative attitude of the Chechens and Ingush" and their striving to return home(Citation: 265).
    The decree of 9 January 1957 charged the Russian parliament (the Presidium of the Supreme Soviet of the RSFSR) with establishing the borders(Citation: 620) - and the Prigorodny district stayed with North Ossetia.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "The unanimous protests of the Chechen-Ingush delegation on the question of the Prigorodny district were ignored by the Central Committee of the CPSU"; the colonizer cut off "1,600 square kilometers of exclusively black-earth land," and enlarged the republic "at the expense of the sandy lands of the Burunnaya steppe (in essence, semi-desert) beyond the Terek"(Citation: 125).
    The historians write that in Dagestan the colonizers "sought at the same time to prevent the restoration of the Aukh (Chechen) district.
    For this the returning Chechens were not allowed to settle in their old houses in their native auls, but were dispersed in small groups" across five districts(Citation: 125).
    The Russian parliament, in setting the republic's borders, did not return to it the former Aukh district either - it is absent from the list of transferred lands(Citation: 533).
    On 10 April 1964 the new settlers of the village of Duchi in the former Aukh district beat and expelled the Chechen Salikh Saitamulov, who had returned to his parents' plot, and on 12 April about 500 Chechens came to Duchi with demands, as the investigation recorded, "to permit Saitamulov and other Chechens to reside in the village of Duchi and other former Chechen villages, to return to them their former households and plots of land"; the KGB (predecessor of today's FSB) under the government of Dagestan answered with a criminal case for mass disorders(Citation: 267).
    The case fell apart: historian V. A. Kozlov writes that the Chechens "held together and evaded giving testimony," and the case was closed "for absence... of the elements of a crime"(Citation: 267).
  uk: |-
    У червні 1956 року начальник радянської міліції Барсуков доповідав: «розмістити чеченців та інгушів у районах, де вони проживали до виселення, не видається можливим», бо «ці райони заселені переселенцями з центральних областей РРФСР», а на землях, що відійшли до Північної Осетії, де до виселення «проживало 77 578 чеченців та інгушів», «повернення чеченців та інгушів місцеві [та] партійні органи вважають недоцільним»(Citation: 533).
    Міністр внутрішніх справ СРСР Дудоров у червні 1956 року пропонував узагалі не повертати народ: «Колишня територія заселена» - і ставив питання «про створення для чеченців та інгушів обласної автономії на території Казахської та Киргизької РСР»(Citation: 620).
    Від плану СРСР відмовився через «різко негативне ставлення чеченців та інгушів» і їхнє прагнення повернутися додому(Citation: 265).
    Указ від 9 січня 1957 року доручив установити кордони російському парламентові (Президії Верховної Ради РРФСР)(Citation: 620) - і Пригородний район лишився за Північною Осетією.
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «Дружні протести чечено-інгуської делегації з питання про Пригородний район були проігноровані ЦК КПРС»; колонізатор відрізав «1600 квадратних кілометрів виключно чорноземних земель», а республіку збільшив «за рахунок піщаних земель Бурунного степу (по суті, напівпустель) за Тереком»(Citation: 125).
    Історики пишуть, що в Дагестані колонізатори «прагнули водночас не допустити відновлення Аухівського (чеченського) району.
    Для цього чеченцям, що поверталися, не дозволяли селитися у своїх старих будинках у рідних аулах, а розселяли невеликими групами» по п'яти районах(Citation: 125).
    Російський парламент, установлюючи кордони республіки, не повернув їй і колишнього Аухівського району - у переліку переданих земель його немає(Citation: 533). 10 квітня 1964 року новосели села Дучі колишнього Аухівського району побили й вигнали чеченця Саліха Сайтамулова, який повернувся на ділянку батьків, а 12 квітня близько 500 чеченців прийшли в Дучі з вимогами, як записало слідство, «про дозвіл Сайтамулову та іншим чеченцям проживати в с.
    Дучі та інших колишніх чеченських селищах, повернення їм їхніх колишніх домоволодінь і земельних ділянок»; КДБ (попередник сучасної ФСБ) при уряді Дагестану відповів кримінальною справою про масові заворушення(Citation: 267).
    Справа розвалилася: історик В. А. Козлов пише, що чеченці «трималися згуртовано і від давання свідчень ухилялися», і справу закрили «за відсутністю... складу злочину»(Citation: 267).
  ru: |-
    В июне 1956 года начальник советской милиции Барсуков докладывал: «разместить чеченцев и ингушей в районах, где они проживали до выселения, не представляется возможным», потому что «эти районы заселены переселенцами из центральных областей РСФСР», а на землях, отошедших к Северной Осетии, где до выселения «проживало 77 578 чеченцев и ингушей», «возвращение чеченцев и ингушей местные [и] партийные органы считают нецелесообразным»(Citation: 533).
    Министр внутренних дел СССР Дудоров в июне 1956 года предлагал вовсе не возвращать народ: «Прежняя территория заселена» - и ставил вопрос «о создании для чеченцев и ингушей областной автономии на территории Казахской и Киргизской ССР»(Citation: 620).
    От плана СССР отказался из-за «резко отрицательного отношения чеченцев и ингушей» и их стремления вернуться домой(Citation: 265).
    Указ от 9 января 1957 года поручил установить границы российскому парламенту (Президиуму Верховного Совета РСФСР)(Citation: 620) - и Пригородный район остался за Северной Осетией.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Дружные протесты чечено-ингушской делегации по вопросу о Пригородном районе были проигнорированы ЦК КПСС»; колонизатор отрезал «1600 квадратных километров исключительно черноземных земель», а республику увеличил «за счет песчаных земель Бурунной степи (по существу, полупустынь) за Тереком»(Citation: 125).
    Историки пишут, что в Дагестане колонизаторы «стремились не допустить одновременно восстановления Ауховского (чеченского) района.
    Для этого возвращающимся чеченцам не разрешали селиться в своих старых домах в родных аулах, а расселяли небольшими группами» по пяти районам(Citation: 125).
    Российский парламент, устанавливая границы республики, не вернул ей и бывший Ауховский район - в перечне переданных земель его нет(Citation: 533). 10 апреля 1964 года новосёлы села Дучи бывшего Ауховского района избили и выдворили чеченца Салиха Сайтамулова, вернувшегося на участок родителей, а 12 апреля около 500 чеченцев пришли в Дучи с требованиями, как записало следствие, «о разрешении Сайтамулову и другим чеченцам проживать в сел.
    Дучи и других бывших чеченских селениях, возвращении им их бывших домовладений и земельных участков»; КГБ (предшественник современной ФСБ) при правительстве Дагестана ответил уголовным делом о массовых беспорядках(Citation: 267).
    Дело развалилось: историк В. А. Козлов пишет, что чеченцы «держались сплоченно и от дачи показаний уклонялись», и дело прекратили «за отсутствием... состава преступления»(Citation: 267).
