description:
  en: |-
    In January 1831, General Velyaminov's troops cut a clearing and cleared a road through the forest between the settlement of Aldy and the Groznaya fortress, depriving the inhabitants of forest cover for the sake of a military passage to the south.
    The imperial historian Potto wrote: Velyaminov “set about cutting a clearing and clearing a road between Aldy and Groznaya in order to prepare for himself a secure gateway to the south”(Citation: 78).
    On January 21, 1831, Mairtup was exterminated “with its luxuriant gardens and plantations” — orchards of many years' standing, the foundation of the village's way of life, were destroyed(Citation: 78).
  uk: |-
    У січні 1831 війська генерала Вельямінова вирубали просіку та розчистили дорогу через ліс між селищем Алди й фортецею Грозною, позбавляючи жителів лісового укриття заради військового проходу на південь.
    Імперський історик Потто писав: Вельямінов «узявся рубати просіку й розчищати дорогу між Алдами та Грозною, щоб приготувати собі забезпечені ворота на південь»(Citation: 78). 21 січня 1831 винищено Маїртуп «з його розкішними садами та плантаціями» — знищено багаторічні сади, основу укладу села(Citation: 78).
  ru: |-
    В январе 1831 войска генерала Вельяминова вырубили просеку и расчистили дорогу через лес между селением Алды и крепостью Грозной, лишая жителей лесного укрытия ради военного прохода на юг.
    Имперский историк Потто писал: Вельяминов «принялся рубить просеку и расчищать дорогу между Алдами и Грозной, чтобы приготовить себе обеспеченные ворота к югу»(Citation: 78). 21 января 1831 истреблён Маиртуп «с его роскошными садами и плантациями» - уничтожены многолетние сады, основа уклада села(Citation: 78).
