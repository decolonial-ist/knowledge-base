description:
  en: |-
    At dawn on December 19, 1830, Cossacks of General Velyaminov's detachment, having burst into the sleeping village of Dzulgai-Yurt, cut down the inhabitants caught unawares.
    The imperial historian Potto recorded: “thirty-nine people were taken prisoner, and about twelve were cut down.
    The rest, having taken cover in the forest, opened an exchange of fire”(Citation: 78).
    Those cut down were inhabitants overtaken during the sudden nighttime seizure of the village; armed resistance was mounted later only by those who managed to reach the forest.
  uk: |-
    На світанку 19 грудня 1830 козаки загону генерала Вельямінова, увірвавшись у сонне село Дзулгай-Юрт, рубали захоплених зненацька жителів.
    Імперський історик Потто зафіксував: «взято було в полон тридцять дев'ять осіб та осіб дванадцять порубано.
    Решта, сховавшись у лісі, зав'язали перестрілку»(Citation: 78).
    Порубані — це жителі, наздогнані під час раптового нічного захоплення села; збройний опір зав'язали пізніше лише ті, хто встиг добігти до лісу.
  ru: |-
    На рассвете 19 декабря 1830 казаки отряда генерала Вельяминова, ворвавшись в спящее село Дзулгай-Юрт, рубили застигнутых жителей.
    Имперский историк Потто фиксировал: «взято было в плен тридцать девять человек да человек двенадцать изрублено.
    Остальные, укрывшись в лесу, завязали перестрелку»(Citation: 78).
    Изрубленные - жители, настигнутые при внезапном ночном захвате села; вооружённое сопротивление завязали позже лишь те, кто успел добежать до леса.
