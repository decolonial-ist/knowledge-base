description:
  en: |-
    In December 1830 – January 1831, General Velyaminov's troops razed and burned the villages of lowland Chechnya: Kiter-Yurt, Pkhan-Kichu, Edin-Yurt, Daut-Yurt, Engeli, Uzeken-Yurt, Besenber with its hamlets, Avtury, Geldigen, and Mairtup with the surrounding auls.
    The imperial historian Potto wrote: Kiter-Yurt “was immediately given over to the flames,” “over the following two days the Butyrsky and Tarutinsky regiments burned the village of Pkhan-Kichu,” “along the way they burned two more unsubmissive villages: Edin-Yurt and Daut-Yurt,” the troops “managed to exterminate one more aul, Engeli,” the regiments “burned the unsubmissive village of Uzeken-Yurt,” “exterminated in the vicinity the aul of Besenber, with all the hamlets adjoining it,” and on January 21, 1831, “the same fate befell Maiortup itself”(Citation: 78).
    The submission offered by the villages of Avtury, Geldigen, and Mairtup, together with the handing over of hostages, Velyaminov rejected, demanding the impossible — the surrender of all Russian captives and fugitives — in order to preserve a pretext for exterminating the villages: submission, as Potto admits, “was not at all part of Velyaminov's designs, as he understood the necessity of punishing these auls cruelly”(Citation: 78).
  uk: |-
    У грудні 1830 – січні 1831 війська генерала Вельямінова знесли та спалили села рівнинної Чечні: Кітер-Юрт, Пхан-Кічу, Едін-Юрт, Даут-Юрт, Енгелі, Узекен-Юрт, Бесенбер із хуторами, Автури, Гельдіген, Маїртуп з навколишніми аулами.
    Імперський історик Потто писав: Кітер-Юрт «одразу ж було віддано полум'ю», «наступних два дні Бутирський і Тарутінський полки палили село Пхан-Кічу», «дорогою спалили ще два непокірні села: Едін-Юрт і Даут-Юрт», війська «встигли винищити ще один аул Енгелі», полки «спалили непокірне село Узекен-Юрт», «винищили в околиці аул Бесенбер з усіма прилеглими до нього хуторами», а 21 січня 1831 «та сама доля спіткала й сам Маіортуп»(Citation: 78).
    Запропоновану селами Автури, Гельдіген і Маїртуп покірність із видачею заручників Вельямінов відкинув, зажадавши нездійсненного — видачі всіх російських полонених і втікачів, — щоб зберегти привід для винищення сіл: покірність, за визнанням Потто, «зовсім не входила в наміри Вельямінова, який розумів необхідність жорстоко покарати ці аули»(Citation: 78).
  ru: |-
    В декабре 1830 - январе 1831 войска генерала Вельяминова снесли и сожгли сёла равнинной Чечни: Китер-Юрт, Пхан-Кичу, Един-Юрт, Даут-Юрт, Енгели, Узекен-Юрт, Бесенбер с хуторами, Автуры, Гельдиген, Маиртуп с окрестными аулами.
    Имперский историк Потто писал: Китер-Юрт «тотчас же предано было пламени», «в следующие два дня Бутырский и Тарутинский полки сожгли деревню Пхан-Кичу», «по пути сожгли ещё две непокорные деревни: Един-Юрт и Даут-Юрт», войска «успели истребить ещё один аул Енгели», полки «сожгли непокорную деревню Узекен-Юрт», «истребили в окрестности аул Бесенбер, со всеми прилегавшими к нему хуторами», а 21 января 1831 «та же участь постигла и сам Маиортуп»(Citation: 78).
    Предложенное сёлами Автуры, Гельдиген и Маиртуп подчинение с выдачей заложников Вельяминов отверг, потребовав невыполнимого - выдачи всех русских пленных и беглых, - чтобы сохранить предлог для истребления сёл: подчинение, по признанию Потто, «вовсе не входила в виды Вельяминова, понимавшего необходимость жестоко наказать эти аулы»(Citation: 78).
