name:
  en: 'Burning of Lowland Chechnya by Velyaminov''s Expedition: Demolition of Villages from the Sunzha to Mairtup, Seizure of Astemir''s Family, Collective Penalties Imposed on Chechen Villages, the Cutting Down of Fleeing Inhabitants of Dzulgai-Yurt, and Destruction of Winter Stores (1830-1831)'
  uk: 'Випалювання рівнинної Чечні експедицією Вельямінова: знесення сіл від Сунжі до Маїртупа, захоплення сім''ї Астемира, колективні стягнення з чеченських сіл, рубання жителів Дзулгай-Юрта, які тікали, та винищення зимових запасів (1830-1831)'
  ru: 'Выжигание плоскостной Чечни экспедицией Вельяминова: снос сёл от Сунжи до Маиртупа, захват семьи Астемира, коллективные взыскания с чеченских сёл, рубка бегущих жителей Дзулгай-Юрта и истребление зимних запасов (1830-1831)'
description:
  en: |-
    In the fall of 1830, General Velyaminov, who had taken command of the troops operating against Chechnya, began with collective property exactions from the Chechen villages standing on the Terek River near the imperial border.
    The imperial historian Potto admits: for the driving off by Chechens of ten head of cattle from the stanitsa of Chervlennaya, Velyaminov “immediately ordered that ten head of cattle likewise be taken from the inhabitants of the two villages of Braguny and Novy-Yurt, past which the raiding party had gone, and returned to the Cossacks,” and after a herd of horses was driven off in the Nogai steppe, “Braguny again paid with exactly the same number of head”; the owner of Novy-Yurt, Shah-Girei, was summoned to Groznaya and confined in a casemate — a prison cell inside the fortress(Citation: 78).
    On December 18, 1830, a detachment assembled in Groznaya consisting of four infantry regiments — the Moscow, Butyrsky, Tarutino, and Borodino regiments — a composite battalion of the 43rd Jaeger Regiment, five sotnias of line Cossacks, and twenty-two guns, and at night the troops moved on the village of Dzulgai-Yurt, where the Karabulak leader Astemir lived.
    Potto wrote: the Cossacks, bursting into the village at dawn, rushed to Astemir's house; he himself managed to escape, “but his family — a young son, a daughter, a grandson, and a female cousin — fell into the hands of the Cossacks.
    Besides them, thirty-nine people were taken prisoner, and about twelve were cut down”(Citation: 78).
    Then the villages of western, Lesser Chechnya were destroyed one after another: Kiter-Yurt “was given over to the flames,” Pkhan-Kichu was burned down, at the village of Daut-Martan “the inhabitants managed to flee, but all their property remained the booty of the detachment,” Edin-Yurt and Daut-Yurt were burned, “enormous stores of harvested hay” were destroyed, Martan-aul and Dzhargan-Yurt were occupied, the aul of Engeli was exterminated(Citation: 78).
    Between campaigns, the troops cut a clearing through the forest between the village of Aldy and the fortress of Groznaya.
    In January 1831 the blow was shifted to eastern, Greater Chechnya: Uzeken-Yurt was burned, Besenber with all its hamlets was destroyed.
    The villages of Avtury, Geldigen, and Mairtup sent their elders with an offer of submission and hostages, but Velyaminov rejected them, demanding the surrender of all Russian captives and deserter soldiers.
    The condition was a double impossibility, and Potto himself deciphers this: they “could not have had many” captives — captives did not settle in the villages but left through exchange and ransom, which both sides practiced; as for deserters, the Nokhchi did not hand them over — the Chechens, by Potto's admission, “regarded them... as men who had given themselves under the protection of their hearths, and therefore never surrendered them”(Citation: 78).
    Hospitality is a value celebrated in Chechen illi (heroic songs) on a par with courage and fidelity to one's word, and handing over a fugitive meant sending a guest to his death: the historian D. A. Khozhaev wrote of the marching gallows “on which the general [Yermolov] hanged highlanders and fugitive Russian soldiers and Cossacks who were hiding in mountain auls,” and recorded that the demand for “the surrender of fugitive Russian soldiers and Cossacks living in the mountain auls” was a constant instrument of the imperial bailiffs (pristavs)(Citation: 95).
    By demanding simultaneously the nonexistent and the inadmissible, Velyaminov engineered a refusal: “this belated and forced submission was not at all part of Velyaminov's designs; he understood the necessity of punishing these auls cruelly, and perhaps that is why he set before them conditions which, in the view of the highlanders, were unthinkable”(Citation: 78).
    Avtury was taken by storm and burned, Geldigen was consigned to the flames with all its stores, and on January 21 Mairtup “with its luxuriant gardens and plantations” was destroyed together with the surrounding auls(Citation: 78).
    Potto sums up the result with an admission: “all of lowland Chechnya, traversed through and through as far as the Kochalykovsky ridge, was given over by Velyaminov to fire and sword”(Citation: 78).
  uk: |-
    Восени 1830 року генерал Вельямінов, який прийняв командування військами, що діяли проти Чечні, розпочав із колективних майнових стягнень із чеченських сіл, що стояли на річці Терек біля імперського кордону.
    Імперський історик Потто визнає: за викрадення Чеченцями десяти голів худоби зі станиці Червленної Вельямінов «одразу наказав відібрати у жителів двох сіл Брагуни та Новий-Юрт, повз які пройшов загін, теж десять голів худоби і повернути їх козакам», а після викрадення табуна коней у Ногайському степу «Брагуни знову поплатилися точно такою ж кількістю голів»; власника Нового-Юрта Шах-Гірея було викликано до Грозної й посаджено в каземат — тюремну камеру всередині фортеці(Citation: 78). 18 грудня 1830 року в Грозній зібрався загін із чотирьох піхотних полків — Московського, Бутирського, Тарутинського та Бородінського, — зведеного батальйону 43-го єгерського полку, п'яти сотень лінійних козаків і двадцяти двох гармат, і вночі війська рушили на село Дзулгай-Юрт, де жив карабулацький ватажок Астемір.
    Потто писав: козаки, увірвавшись у село на світанку, кинулися до будинку Астеміра; самому йому вдалося втекти, «але його родина — малолітній син, донька, онук і двоюрідна сестра — потрапили до рук козаків.
    Крім них, було взято в полон тридцять дев'ять осіб та осіб дванадцять порубано»(Citation: 78).
    Далі послідовно знищувалися села західної, Малої Чечні: Кітер-Юрт «було віддано полум'ю», спалено Пхан-Кічу, біля села Даут-Мартан «жителі встигли втекти, але все їхнє майно лишилося здобиччю загону», спалено Едін-Юрт і Даут-Юрт, знищено «величезні запаси заготовленого сіна», зайнято Мартан-аул і Джарган-Юрт, винищено аул Енгелі(Citation: 78).
    Між походами війська прорубали просіку в лісі між селищем Алди та фортецею Грозною.
    У січні 1831 року удар було перенесено на східну, Велику Чечню: спалено Узекен-Юрт, винищено Бесенбер з усіма хуторами.
    Села Автури, Гельдіген і Маїртуп прислали своїх старійшин із пропозицією підкоритися й дати заручників, але Вельямінов відкинув їх, вимагаючи видати всіх російських полонених і солдатів-утікачів.
    Умова була подвійною неможливістю, і Потто сам це розшифровує: полонених «не могло бути в них багато» — полонені не осідали в селах, а йшли за обміном і викупом, які практикували обидві сторони; утікачів же Нохчі не видавали — на них Чеченці, за визнанням Потто, «дивилися... як на тих, хто віддався під заступництво їхніх вогнищ, а тому ніколи не видавали їх»(Citation: 78).
    Гостинність — оспівувана в чеченських іллі (героїчних піснях) цінність нарівні з мужністю та вірністю слову, а видача втікача означала відправити гостя на смерть: історик Д. А. Хожаєв писав про похідні шибениці, «на яких генерал [Єрмолов] вішав горян і російських солдатів-утікачів та козаків, що переховувалися в гірських аулах», і фіксував, що вимога «видачі російських солдатів-утікачів і козаків, які жили в гірських аулах» була постійним інструментом імперських приставів(Citation: 95).
    Вимагаючи одночасно неіснуюче й неприпустиме, Вельямінов проєктував відмову: «ця пізня і вимушена покора зовсім не входила в плани Вельямінова, який розумів необхідність жорстоко покарати ці аули, і, можливо, саме тому він поставив перед ними такі умови, які, на думку горян, були немислимі»(Citation: 78).
    З боєм узято та спалено Автури, віддано вогню Гельдіген з усіма запасами, 21 січня винищено Маїртуп «з його розкішними садами та плантаціями» разом із навколишніми аулами(Citation: 78).
    Підсумок Потто підводить визнанням: «уся рівнинна Чечня, пройдена наскрізь до Кочаликівського хребта, була віддана Вельяміновим вогню й мечу»(Citation: 78).
  ru: |-
    Осенью 1830 года генерал Вельяминов, принявший командование войсками, действовавшими против Чечни, начал с коллективных имущественных взысканий с чеченских сёл, стоявших на реке Терек у имперской границы.
    Имперский историк Потто признаёт: за угон чеченцами десяти голов скота из станицы Червленной Вельяминов «тотчас приказал отобрать от жителей двух деревень Брагуны и Нового-Юрта, мимо которых прошла партия, тоже десять штук скота и возвратить его казакам», а после угона табуна лошадей в Ногайской степи «Брагуны опять поплатились точно таким же количеством голов»; владелец Нового-Юрта Шах-Гирей был затребован в Грозную и посажен в каземат - тюремную камеру внутри крепости(Citation: 78). 18 декабря 1830 в Грозной собрался отряд из четырёх пехотных полков - Московского, Бутырского, Тарутинского и Бородинского, - сводного батальона 43-го егерского полка, пяти сотен линейных казаков и двадцати двух орудий, и ночью войска двинулись на село Дзулгай-Юрт, где жил карабулакский предводитель Астемир.
    Потто писал: казаки, ворвавшись в село на рассвете, кинулись к дому Астемира, самому ему удалось уйти, «но его семья - малолетний сын, дочь, внук и двоюродная сестра попали в руки казаков.
    Кроме их взято было в плен тридцать девять человек да человек двенадцать изрублено»(Citation: 78).
    Далее последовательно уничтожались сёла западной, Малой Чечни: Китер-Юрт «предано было пламени», сожжена Пхан-Кичу, у села Даут-Мартан «жители успели бежать, но всё имущество их осталось добычей отряда», сожжены Един-Юрт и Даут-Юрт, истреблены «громадные запасы заготовленного сена», заняты Мартан-аул и Джарган-Юрт, истреблён аул Енгели(Citation: 78).
    Между походами войска прорубили просеку в лесу между селением Алды и крепостью Грозной.
    В январе 1831 удар перенесён на восточную, Большую Чечню: сожжён Узекен-Юрт, истреблён Бесенбер со всеми хуторами.
    Села Автуры, Гельдиген и Маиртуп прислали своих старейшин с предложением подчиниться и дать заложников, но Вельяминов отверг их, потребовав выдать всех русских пленных и беглых солдат.
    Условие было двойной невозможностью, и Потто сам это расшифровывает: пленных «не могло быть у них много» - пленные не оседали в сёлах, а уходили по обмену и выкупу, которые практиковали обе стороны; беглых же нохчи не выдавали - на них чеченцы, по признанию Потто, «смотрели... как на отдавшихся под покровительство их очагов, а потому никогда не выдавали их»(Citation: 78).
    Гостеприимство - воспеваемая в чеченских илли (героических песнях) ценность наравне с мужеством и верностью слову, а выдача беглого означала отправить гостя на смерть: историк Д. А. Хожаев писал о походных виселицах, «на которых генерал [Ермолов] вешал горцев и беглых русских солдат и казаков, скрывавшихся в горных аулах», и фиксировал, что требование «выдачи беглых русских солдат и казаков, живших в горских аулах» было постоянным инструментом имперских приставов(Citation: 95).
    Требуя одновременно несуществующее и недопустимое, Вельяминов проектировал отказ: «эта поздняя и вынужденная покорность вовсе не входила в виды Вельяминова, понимавшего необходимость жестоко наказать эти аулы, и может быть, поэтому-то он поставил перед ними такие условия, которые, по мнению горцев, были немыслимы»(Citation: 78).
    С боем взяты и сожжены Автуры, предан огню Гельдиген со всеми запасами, 21 января истреблён Маиртуп «с его роскошными садами и плантациями» вместе с окрестными аулами(Citation: 78).
    Итог Потто подводит признанием: «вся плоскостная Чечня, пройденная насквозь до Кочалыковского хребта, была предана Вельяминовым огню и мечу»(Citation: 78).
