name:
  en: Strengthening of the Border Line and Reconnaissance of Resources (1711–1717)
  uk: Зміцнення прикордонної лінії та розвідка ресурсів (1711–1717)
  ru: Укрепление пограничной линии и разведка ресурсов (1711–1717)
description:
  en: |-
    The metropole temporarily reduced the intensity of direct military strikes, shifting to infrastructural fortification and the study of the region.
    Historian Ya.
    Z. Akhmadov states that, owing to the foreign policy situation, “issues related to the mountain peoples ceased to be of primary importance to them”(Citation: 94).
    Nevertheless, the occupation apparatus continued preparations for further expansion.
    In 1711–1712, the government consolidated the military lines on the border with the lands of the Nokhchi: the researcher points out that “the small Greben Cossack towns along the Terek were consolidated, by order of Tsar Peter I, into 5 stanitsas — from Chervlyonnaya to Kurdyukovskaya”(Citation: 94).
    In parallel, conceptual and economic reconnaissance was under way: in 1714, the tsar’s adviser A. Bekovich-Cherkassky submitted a report in which he considered “drawing the Highlanders over to Russia’s side” to be “in keeping with the vital interests of the Russian state”(Citation: 94).
    In 1717, to inventory the potential of the Nokhchi lands, the government dispatched a specialist: the author records “the survey of mineral springs and other natural riches of the Terek River (including the Bragun warm springs) by Doctor Gottlieb Schober on the assignment of Peter I”(Citation: 94).
  uk: |-
    Метрополія тимчасово знизила інтенсивність прямих військових ударів, перейшовши до інфраструктурного зміцнення та вивчення регіону.
    Історик Я. З. Ахмадов констатує, що у зв’язку із зовнішньополітичною ситуацією «питання, пов’язані з гірськими народами, перестали бути для них першочерговими»(Citation: 94).
    Проте окупаційний апарат продовжував підготовку до подальшої експансії.
    У 1711–1712 роках уряд укрупнив військові рубежі на кордоні із землями Нохчі: дослідник вказує, що «дрібні гребінські козацькі містечка по Тереку зводяться, за розпорядженням царя Петра I, у 5 станиць — від Червленної до Курдюковської»(Citation: 94).
    Паралельно велася концептуальна та економічна розвідка: у 1714 році радник царя О. Бекович-Черкаський подав донесення, в якому вважав «залучення Горців на бік Росії» таким, що «відповідає життєвим інтересам російської держави»(Citation: 94).
    У 1717 році для інвентаризації потенціалу земель Нохчі уряд направив фахівця: автор фіксує «обстеження мінеральних джерел та інших природних багатств р. Терек (зокрема Брагунських теплих вод) доктором Готлібом Шобером за завданням Петра I»(Citation: 94).
  ru: |-
    Метрополия временно снизила интенсивность прямых военных ударов, перейдя к инфраструктурному укреплению и изучению региона.
    Историк Я. З. Ахмадов констатирует, что в связи с внешнеполитической ситуацией «вопросы, связанные с горскими народами, перестали быть для них первостепенными»(Citation: 94).
    Тем не менее, оккупационный аппарат продолжал подготовку к дальнейшей экспансии.
    В 1711–1712 годах правительство укрупнило военные рубежи на границе с землями нохчи: исследователь указывает, что «мелкие казачьи гребенские городки по Тереку сводятся, по распоряжению царя Петра I, в 5 станиц - от Червленной до Курдюковской»(Citation: 94).
    Параллельно велась концептуальная и экономическая разведка: в 1714 году советник царя А. Бекович-Черкасский предоставил донесение, в котором он считал «отвечающим жизненным интересам российского государства» «привлечение горцев на сторону России»(Citation: 94).
    В 1717 году для инвентаризации потенциала земель нохчи правительство направило специалиста: автор фиксирует «обследование минеральных источников и других природных богатств р. Терек (в т.ч.
    Брагунских теплых вод) доктором Готлибом Шобером по заданию Петра I»(Citation: 94).
