description:
  ru: 'Правительство Московского Царства укрупняло военизированные поселения на границе с землями нохчи для усиления контроля: историк Я. З. Ахмадов констатирует, что в 1711–1712 годах «мелкие казачьи гребенские городки по Тереку сводятся, по распоряжению царя Петра I, в 5 станиц - от Червленной до Курдюковской»(Citation: 94).'
  en: |-
    The government of the Tsardom of Muscovy consolidated militarized settlements on the border with the lands of the Nokhchi to strengthen control: historian Ya.
    Z. Akhmadov states that in 1711–1712 "the small Greben Cossack towns along the Terek were merged, by order of Tsar Peter I, into 5 stanitsas - from Chervlyonnaya to Kurdyukovskaya"(Citation: 94).
  uk: 'Уряд Московського царства укрупнював воєнізовані поселення на кордоні із землями Нохчі для посилення контролю: історик Я. З. Ахмадов констатує, що у 1711–1712 роках «дрібні козацькі гребінські містечка по Тереку зводяться, за розпорядженням царя Петра I, у 5 станиць - від Червленої до Курдюковської»(Citation: 94).'
