description:
  ru: |-
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов считают: «более 1200 жителей Беноя, Энгеноя, Даттыха, Гендаргена и других селений Ичкерии насильственно переселены»(Citation: 125); историк Д. А. Хожаев уточняет механизм рассеяния: жители Беноя «29 января 1861 года в числе 1218 человек были высланы и расселены по 5—10 дворов в указанные им плоскостные селения Чечни»(Citation: 95).
    Выселяли и зимой: историк З. Х. Ибрагимова пишет - «Особенно тяжёлым для чеченцев было переселение, предпринятое в декабре 1860 года, во время сильных морозов. 120 семей горцев, не имевших возможности укрыться в лесу зимой, были переселены в течение 2-х дней на плоскость, их жилища разорены войсками.
    В течение зимы 1861 года на Чеченскую равнину было выселено 1500 горных чеченцев»(Citation: 251).
    Аккинское горное общество в июле 1860 года выселено целиком: по имперскому рапорту, «Мятежные Акинцы разселены были между Галашевцами и другими сосѣдними племенами; жилища ихъ были уничтожены»(Citation: 109).
  en: |-
    The historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov reckon: "more than 1200 inhabitants of Benoy, Engenoy, Dattykh, Gendargen and other villages of Ichkeria were forcibly resettled"(Citation: 125); the historian D. A. Khozhayev details the mechanism of dispersal: the inhabitants of Benoy "on 29 January 1861, numbering 1218 people, were deported and dispersed, 5—10 households at a time, among the lowland villages of Chechnya assigned to them"(Citation: 95).
    Deportations went on in winter as well: the historian Z. Kh.
    Ibragimova writes - "Especially hard for the Chechens was the resettlement undertaken in December 1860, during severe frosts. 120 highlander families, having no way to shelter in the forest in winter, were resettled onto the plain within 2 days, their dwellings devastated by the troops.
    Over the winter of 1861, 1500 mountain Chechens were deported to the Chechen plain"(Citation: 251).
    The Akki mountain society was deported in its entirety in July 1860: according to an imperial report, "The mutinous Akkins were dispersed among the Galash people and other neighboring tribes; their dwellings were destroyed"(Citation: 109).
  uk: |-
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов вважають: «понад 1200 жителів Беноя, Енгеноя, Даттиха, Гендаргена та інших селищ Ічкерії насильницьки переселені»(Citation: 125); історик Д. А. Хожаєв уточнює механізм розсіяння: жителі Беноя «29 січня 1861 року в числі 1218 осіб були вислані й розселені по 5—10 дворів у вказані їм рівнинні селища Чечні»(Citation: 95).
    Виселяли й узимку: історик З. Х. Ібрагімова пише - «Особливо тяжким для чеченців було переселення, здійснене в грудні 1860 року, під час сильних морозів. 120 родин горців, які не мали змоги сховатися в лісі взимку, були переселені протягом 2-х днів на рівнину, їхні житла розорені військами.
    Протягом зими 1861 року на Чеченську рівнину було виселено 1500 гірських чеченців»(Citation: 251).
    Аккінське гірське товариство в липні 1860 року виселено цілком: за імперським рапортом, «Бунтівні аккінці були розселені між галашівцями та іншими сусідніми племенами; житла їхні були знищені»(Citation: 109).
