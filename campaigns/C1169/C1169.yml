name:
  ru: Подавление восстаний 1860-1861 годов, казнь Байсангура и расстрел зикристов у Шали (1860-1864)
  en: Suppression of the 1860-1861 uprisings, the execution of Baysangur, and the shooting of the zikrists near Shali (1860-1864)
  uk: Придушення повстань 1860-1861 років, страта Байсангура і розстріл зікристів біля Шалі (1860-1864)
description:
  ru: |-
    Двадцать пять лет чеченцы и дагестанцы держали против империи собственное государство - имамат, созданный имамом Шамилём: с шариатскими судами, налогами, армией и наместниками-наибами в округах.
    В 1859 году имамат пал: в апреле войска взяли его столицу Ведено, в августе у дагестанского аула Гуниб сдался сам Шамиль.
    Его увезли в Россию под надзор: местом жительства император Александр II определил Калугу, где имаму с семьёй дали особняк и двадцать тысяч рублей годового содержания - такой плен источники называют «почётным».
    Больше десяти лет спустя ему разрешили паломничество в Мекку (хадж); в 1871 году он умер в Медине (Аравийский полуостров, ныне Саудовская Аравия) и похоронен там(Citation: 128).
    После этого Чечню удерживали силой.
    В 1860-1861 годах в Ичкерии и Аргунском округе поднялись восстания - их подавили экспедициями с уничтожением аулов и выселением жителей, а тех, кто их возглавлял, казнили или отправили в ссылку - во внутренние губернии России, в Сибирь и в крепости: Байсангура Беноевского повесили по приговору военно-полевого суда, наиба Атаби-муллу Атаева и Уму Дуева развезли по разным губерниям, шейха Кунта-Хаджи - бессрочно в Устюжну Новгородской губернии, его брата - в Выборгскую крепость, рядовых последователей - на крепостные работы с поселением в Сибири.
    В январе 1864 года у села Шали войска расстреляли безоружное шествие последователей шейха Кунта-Хаджи - мусульманского проповедника, учившего, что Бога надо поминать вслух, хором, с пением и кружением по кругу.
    Такое поминание называется зикр, отсюда имперское прозвище его последователей - зикристы.
    Что двигало восставшими, записала сама имперская сторона: полковник Белик доносил начальнику Терской области в конце мая 1860 года о вернувшихся на пепелище беноевцах - они «убедительно просили дозволения поселиться на старых своих местах, - в противном случае они все поклялись умереть, но не подчиниться»(Citation: 125).
    Программу периода зафиксировал начальник Главного штаба Кавказской армии Карцов (в других источниках - Карцев) секретным меморандумом 1864 года: «единственно верное средство обеспечить длительную покорность чеченцев - организовать их массовое переселение частью в Турцию, частью на равнину, подальше от гор»(Citation: 125).
    Итог расправы у Шали историк Д. А. Хожаев формулирует так: «царские власти спровоцировали горцев на выступление и устроили побоище, расстреляв из пушек толпы мюридов-зикристов, с одними кинжалами и пустыми ножнами двинувшихся на каре солдат»(Citation: 95) - мюриды это ученики шейха.
  en: |-
    For twenty-five years the Chechens and Dagestanis held their own state against the empire - the Imamate created by Imam Shamil: with sharia courts, taxes, an army, and naib governors in the districts.
    In 1859 the Imamate fell: in April the troops took its capital, Vedeno; in August, near the Dagestani aul of Gunib, Shamil himself surrendered.
    He was taken to Russia under surveillance: Emperor Alexander II designated Kaluga as his place of residence, where the imam and his family were given a mansion and twenty thousand rubles a year in upkeep - a captivity the sources call "honorable".
    More than ten years later he was allowed a pilgrimage to Mecca (hajj); in 1871 he died in Medina (the Arabian Peninsula, now Saudi Arabia) and was buried there(Citation: 128).
    After that, Chechnya was held by force.
    In 1860-1861 uprisings broke out in Ichkeria and the Argun district - they were suppressed by expeditions with the destruction of auls and the eviction of the inhabitants, and those who led them were executed or sent into exile - to the inner provinces of Russia, to Siberia, and to fortresses: Baysangur of Benoy was hanged by sentence of a field court-martial; naib Atabi-Mullah Atayev and Uma Duyev were sent off to different provinces; Sheikh Kunta-Haji - indefinitely, to Ustyuzhna in Novgorod province; his brother - to the Vyborg fortress; rank-and-file followers - to fortress labor with settlement in Siberia.
    In January 1864, near the village of Shali, troops shot down an unarmed procession of followers of Sheikh Kunta-Haji - a Muslim preacher who taught that God must be remembered aloud, in chorus, with singing and circling in a ring.
    Such remembrance is called zikr - hence the imperial nickname of his followers, the zikrists.
    What moved the insurgents was recorded by the imperial side itself: Colonel Belik reported to the head of the Terek oblast in late May 1860 about the Benoy people who had returned to their burnt-out homes - they "earnestly begged permission to settle in their old places, - otherwise they had all sworn to die rather than submit"(Citation: 125).
    The program of the period was set down by the chief of the Main Staff of the Caucasus Army, Kartsov (Kartsev in other sources), in a secret memorandum of 1864: "the only sure means of securing the lasting submission of the Chechens is to organize their mass resettlement, partly to Turkey, partly to the plain, far away from the mountains"(Citation: 125).
    The outcome of the massacre near Shali is summed up by the historian D. A. Khozhayev: "the tsarist authorities provoked the highlanders into an action and staged a slaughter, gunning down with cannon the crowds of murid-zikrists who had advanced on the soldiers' squares with nothing but daggers and empty scabbards"(Citation: 95) - murids are a sheikh's disciples.
  uk: |-
    Двадцять п'ять років чеченці й дагестанці тримали проти імперії власну державу - імамат, створений імамом Шамілем: із шаріатськими судами, податками, армією та намісниками-наїбами в округах. 1859 року імамат упав: у квітні війська взяли його столицю Ведено, у серпні біля дагестанського аулу Гуніб здався сам Шаміль.
    Його вивезли до Росії під нагляд: місцем проживання імператор Олександр II визначив Калугу, де імамові з родиною дали особняк і двадцять тисяч рублів річного утримання - такий полон джерела називають «почесним».
    Понад десять років по тому йому дозволили паломництво до Мекки (хадж); 1871 року він помер у Медині (Аравійський півострів, нині Саудівська Аравія) і похований там(Citation: 128).
    Після цього Чечню утримували силою.
    У 1860-1861 роках в Ічкерії та Аргунському окрузі піднялися повстання - їх придушили експедиціями зі знищенням аулів і виселенням жителів, а тих, хто їх очолював, стратили або відправили на заслання - у внутрішні губернії Росії, до Сибіру й у фортеці: Байсангура Беноєвського повісили за вироком військово-польового суду, наїба Атабі-муллу Атаєва й Уму Дуєва розвезли по різних губерніях, шейха Кунта-Хаджі - безстроково в Устюжну Новгородської губернії, його брата - у Виборзьку фортецю, рядових послідовників - на фортечні роботи з поселенням у Сибіру.
    У січні 1864 року біля села Шалі війська розстріляли беззбройну ходу послідовників шейха Кунта-Хаджі - мусульманського проповідника, який учив, що Бога треба поминати вголос, хором, зі співом і кружлянням по колу.
    Таке поминання називається зікр, звідси імперське прізвисько його послідовників - зікристи.
    Що рухало повстанцями, записала сама імперська сторона: полковник Бєлік доносив начальникові Терської області наприкінці травня 1860 року про беноївців, які повернулися на попелище, - вони «переконливо просили дозволу оселитися на старих своїх місцях, - інакше вони всі поклялися померти, але не підкоритися»(Citation: 125).
    Програму періоду зафіксував начальник Головного штабу Кавказької армії Карцов (в інших джерелах - Карцев) секретним меморандумом 1864 року: «єдино надійний засіб забезпечити тривалу покірність чеченців - організувати їхнє масове переселення частиною до Туреччини, частиною на рівнину, подалі від гір»(Citation: 125).
    Підсумок розправи біля Шалі історик Д. А. Хожаєв формулює так: «царська влада спровокувала горців на виступ і влаштувала побоїще, розстрілявши з гармат натовпи мюридів-зікристів, які з самими кинджалами й порожніми піхвами рушили на каре солдатів»(Citation: 95) - мюриди це учні шейха.
