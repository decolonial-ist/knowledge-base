description:
  ru: |-
    В начале июня 1860 года в Беной, куда самовольно вернулись выселенные семьи во главе с Байсангуром Беноевским, главой этого общества при имаме Шамиле (руководителе сопротивления горцев российскому завоеванию), введены войска, казаки и милиция(Citation: 125). 28 сентября 1860 года войска взяли Беной штурмом: историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут - «отчаянное сопротивление... было быстро подавлено огнем артиллерии»; историк З. Х. Ибрагимова датирует занятие аула 26 сентября и добавляет: «Ответные репрессии были направлены на всё население восставших округов»(Citation: 125)(Citation: 251).
    В декабре 1860 - январе 1861 года по Ичкерии прошла операция генерала Кундухова - десять пехотных батальонов, четыре сотни казаков и семь сотен чеченской милиции: «для преследования восставших широко применялись «летучие» отряды, а основная масса войск была задействована в «прочесывании» местности»(Citation: 125).
    С весны до глубокой осени 1861 года, по историку З. Х. Ибрагимовой, «на территории Чечни, от реки Ассы до аула Гехи, оперировала военно-карательная экспедиция... силой оружия выселявшая чеченцев в предгорья и на плоскость»(Citation: 251).
    Осенью 1861 года три отряда принудили к сдаче последних руководителей восстания - имперский рапорт от 22 декабря 1861 года подводит итог: «Настойчивыя дѣйствія нашихъ войскъ въ суровую зиму прошлаго года... принудили Ичкеринцевъ изъявить безусловную покорность»(Citation: 109).
  en: |-
    In early June 1860, troops, Cossacks, and militia were sent into Benoy, where the deported families had returned without permission, led by Baysangur of Benoy, head of that society under Imam Shamil (the leader of the highlanders’ resistance to the Russian conquest)(Citation: 125).
    On 28 September 1860 the troops took Benoy by storm: the historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write - "the desperate resistance... was quickly suppressed by artillery fire"; the historian Z. Kh.
    Ibragimova dates the taking of the aul to 26 September and adds: "The retaliatory repressions were directed at the entire population of the insurgent districts"(Citation: 125)(Citation: 251).
    In December 1860 - January 1861 General Kundukhov's operation swept through Ichkeria - ten infantry battalions, four hundred Cossacks, and seven hundred Chechen militia: "'flying' detachments were widely used to pursue the insurgents, while the main mass of the troops was engaged in 'combing' the terrain"(Citation: 125).
    From spring until late autumn 1861, according to the historian Z. Kh.
    Ibragimova, "on the territory of Chechnya, from the Assa river to the aul of Gekhi, a military-punitive expedition operated... evicting the Chechens by force of arms into the foothills and onto the plain"(Citation: 251).
    In autumn 1861 three detachments forced the last leaders of the uprising to surrender - an imperial report of 22 December 1861 sums it up: "The persistent actions of our troops in the severe winter of last year... compelled the Ichkerians to declare unconditional submission"(Citation: 109).
  uk: |-
    На початку червня 1860 року в Беной, куди самовільно повернулися виселені родини на чолі з Байсангуром Беноєвським, головою цього товариства за імама Шаміля (керівника опору горців російському завоюванню), введено війська, козаків і міліцію(Citation: 125). 28 вересня 1860 року війська взяли Беной штурмом: історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть - «відчайдушний опір... був швидко придушений вогнем артилерії»; історик З. Х. Ібрагімова датує зайняття аулу 26 вересня і додає: «Репресії у відповідь були спрямовані на все населення повсталих округів»(Citation: 125)(Citation: 251).
    У грудні 1860 - січні 1861 року Ічкерією пройшла операція генерала Кундухова - десять піхотних батальйонів, чотири сотні козаків і сім сотень чеченської міліції: «для переслідування повсталих широко застосовувалися «летючі» загони, а основна маса військ була задіяна в «прочісуванні» місцевості»(Citation: 125).
    З весни до глибокої осені 1861 року, за істориком З. Х. Ібрагімовою, «на території Чечні, від річки Асси до аулу Гехі, оперувала військово-каральна експедиція... що силою зброї виселяла чеченців у передгір'я та на рівнину»(Citation: 251).
    Восени 1861 року три загони примусили до здачі останніх керівників повстання - імперський рапорт від 22 грудня 1861 року підбиває підсумок: «Наполегливі дії наших військ у сувору зиму минулого року... примусили ічкеринців виявити безумовну покірність»(Citation: 109).
