description:
  en: |-
    After the shooting near Shali the empire demanded that the Chechen societies hand over the survivors.
    On 26 January 1864 Loris-Melikov, head of the Terek oblast, assembled the naibs and "honorable" residents in the Groznaya fortress: the historian Z. Kh.
    Ibragimova writes - he "announced to the assembled Chechens that they were obliged to hand over all the zikrists [followers of Sheikh Kunta-Haji].
    A final deadline was set - 1 February, after which the head of the oblast threatened to commence military operations.
    He also forbade the performance of zikrist rites"(Citation: 251).
    The historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov quote the demand verbatim: "...to assist in restoring the order disrupted by the zikrists...", and record the ban on the "loud" zikr, compliance with which was to be watched over by the clergy and the village elders(Citation: 125).
  uk: |-
    Після розстрілу біля Шалі імперія зажадала від чеченських товариств видати вцілілих. 26 січня 1864 року Лоріс-Меліков, начальник Терської області, зібрав у фортеці Грозній наїбів і «почесних» жителів: історик З. Х. Ібрагімова пише - він «оголосив чеченцям, що зібралися, що вони зобов'язані видати всіх зікристів [послідовників шейха Кунта-Хаджі].
    Було призначено останній строк - 1 лютого, після чого начальник області пригрозив розпочати воєнні дії.
    Він також заборонив виконання зікристських обрядів»(Citation: 251).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов наводять вимогу дослівно: «...сприяти відновленню порядку, порушеного зікристами...», і фіксують заборону «гучного» зікру, за дотриманням якої мали стежити духовенство і сільські старшини(Citation: 125).
  ru: |-
    После расстрела у Шали империя потребовала от чеченских обществ выдать уцелевших. 26 января 1864 года Лорис-Меликов, начальник Терской области, собрал в крепости Грозной наибов и «почетных» жителей: историк З. Х. Ибрагимова пишет - он «объявил собравшимся чеченцам, что они обязаны выдать всех зикристов [последователей шейха Кунта-Хаджи].
    Был назначен последний срок - 1 февраля, после чего начальник области пригрозил начать военные действия.
    Он также запретил исполнение зикристских обрядов»(Citation: 251).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов приводят требование дословно: «...способствовать восстановлению порядка, нарушенного зикристами...», и фиксируют запрет «громкого» зикра, за соблюдением которого должны были следить духовенство и сельские старшины(Citation: 125).
