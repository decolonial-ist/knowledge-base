description:
  ru: |-
    В операции Кундухова зимой 1860-1861 годов шли «7 сотен чеченской милиции» полковника Чермоева(Citation: 125); Атаби-мулла Атаев, наиб Малой Чечни (в имперских документах - Атабай), в ноябре 1861 года сдался, по документу, «командиру Чеченского конно-иррегулярного дивизиона Вагапу Адуеву» - Адуеву, служившему империи в её чине(Citation: 125).
    Против шейха Кунта-Хаджи власть мобилизовала лояльное духовенство: историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут - «были предприняты меры к тому, чтобы склонить наиболее видных представителей чеченского мусульманского духовенства открыто выступить против Кунта-Хаджи и проповедуемого им учения»(Citation: 125).
  en: |-
    In Kundukhov's operation in the winter of 1860-1861 marched the "7 hundreds of Chechen militia" of Colonel Chermoyev(Citation: 125); Atabi-Mullah Atayev, naib of Lesser Chechnya (Atabai in the imperial documents), surrendered in November 1861, according to a document, "to the commander of the Chechen irregular cavalry divizion, Vagap Aduyev" - Aduyev, who served the empire holding its rank(Citation: 125).
    Against Sheikh Kunta-Haji the authorities mobilized loyal clergy: the historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write - "measures were taken to induce the most prominent representatives of the Chechen Muslim clergy to come out openly against Kunta-Haji and the teaching he preached"(Citation: 125).
  uk: |-
    В операції Кундухова взимку 1860-1861 років ішли «7 сотень чеченської міліції» полковника Чермоєва(Citation: 125); Атабі-мулла Атаєв, наїб Малої Чечні (в імперських документах - Атабай), у листопаді 1861 року здався, за документом, «командирові Чеченського кінно-іррегулярного дивізіону Вагапу Адуєву» - Адуєву, який служив імперії в її чині(Citation: 125).
    Проти шейха Кунта-Хаджі влада мобілізувала лояльне духовенство: історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть - «було вжито заходів, щоб схилити найпомітніших представників чеченського мусульманського духовенства відкрито виступити проти Кунта-Хаджі та вчення, яке він проповідував»(Citation: 125).
