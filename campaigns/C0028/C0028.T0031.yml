description:
  en: |-
    Complete diplomatic isolation of the autonomy: "Article 19 forbids the hetman relations with other countries.
    He was to acquaint the tsar's resident with letters received from abroad, forward their translations to the tsar's court, and meanwhile detain the envoys"(Citation: 196).
  uk: |-
    Повна дипломатична ізоляція автономії: «Ст. 19 забороняє гетьману зносини з ін. країнами.
    З одержаними з-за кордону листами він мав ознайомлювати царського резидента, їх переклади пересилати до царського двору, а посланців тим часом затримувати»(Citation: 196).
  ru: |-
    Полная дипломатическая изоляция автономии: «Ст. 19 запрещает гетману сношения с другими странами.
    С полученными из-за границы письмами он должен был знакомить царского резидента, их переводы пересылать к царскому двору, а посланцев тем временем задерживать»(Citation: 196).
