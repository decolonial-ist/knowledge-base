name:
  ru: Решительные пункты (1728)
  en: The Decisive Points (1728)
  uk: Рішительні пункти (1728)
description:
  ru: |-
    Односторонний имперский акт, навязанный гетману Даниилу Апостолу вместо традиционного двустороннего договора.
    Формально смягчив режим Малороссийской коллегии, документ закрепил жесткие имперские ограничения по ключевым пунктам: «Ст. 19 запрещает гетману сношения с другими странами»(Citation: 196), таможенные доходы уходили в царскую казну, а кадровые назначения ставились под контроль метрополии.
  en: |-
    A unilateral imperial act imposed on hetman Danylo Apostol instead of the traditional bilateral treaty.
    While formally softening the regime of the Little Russian Collegium, the document entrenched harsh imperial restrictions on key points: "Article 19 forbids the hetman relations with other countries"(Citation: 196), customs revenues went to the tsar's treasury, and personnel appointments were placed under the metropole's control.
  uk: |-
    Односторонній імперський акт, нав'язаний гетьманові Данилові Апостолу замість традиційного двостороннього договору.
    Формально пом'якшивши режим Малоросійської колегії, документ закріпив жорсткі імперські обмеження за ключовими пунктами: «Ст. 19 забороняє гетьману зносини з ін. країнами»(Citation: 196), митні доходи йшли до царської скарбниці, а кадрові призначення ставилися під контроль метрополії.
