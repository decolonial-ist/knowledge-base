description:
  ru: |-
    Отказ от договорного формата: вместо двустороннего соглашения – царские «решительные» резолюции на просьбы гетмана, изданные в форме указа.
    Автономия перестала быть стороной договора и получала правила существования сверху.
  en: |-
    Rejection of the treaty format: instead of a bilateral agreement – the tsar's "decisive" resolutions upon the hetman's requests, issued in the form of a decree.
    The autonomy ceased to be a party to a treaty and received its rules of existence from above.
  uk: |-
    Відмова від договірного формату: замість двосторонньої угоди – царські «рішительні» резолюції на прохання гетьмана, видані у формі указу.
    Автономія перестала бути стороною договору й отримувала правила існування згори.
