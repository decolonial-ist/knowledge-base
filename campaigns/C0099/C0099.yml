name:
  ru: Срыв ассоциации с ЕС (2013–2014)
  en: Derailing the Association with the EU (2013–2014)
  uk: Зрив асоціації з ЄС (2013–2014)
description:
  ru: |-
    Экономическое и политическое давление В. Путина на В. Януковича осенью 2013 года с целью сорвать подписание Соглашения об ассоциации с ЕС.
    Цена вопроса была оформлена публично 17 декабря 2013 года: «Украина получит от России 15 миллиардов долларов и газ по сниженной цене» - цена газа снижалась «до 268,5 долларов за тысячу кубометров» вместо прежних 410, а деньги шли «из российского Фонда национального благосостояния» в обмен на украинские государственные ценные бумаги(Citation: 234).
    Отказ подписывать соглашение стал спусковым крючком протестов: «в период с 21 ноября 2013 года по 22 февраля 2014 года произошли крупномасштабные уличные протесты, спровоцированные решением тогдашнего Президента Виктора Януковича не подписывать соглашение об ассоциации с Европейским союзом», а их подавление вылилось в расстрелы - на Майдане «в период с января по февраль 2014 года были убиты более 100 человек, в том числе снайперами»(Citation: 236).
  en: |-
    Economic and political pressure by V. Putin on V. Yanukovych in the autumn of 2013 aimed at derailing the signing of the Association Agreement with the EU.
    The price was formalized publicly on December 17, 2013: "Ukraine will receive 15 billion dollars from Russia and gas at a reduced price" - the gas price was lowered "to 268.5 dollars per thousand cubic meters" instead of the previous 410, and the money came "from the Russian National Welfare Fund" in exchange for Ukrainian government securities(Citation: 234).
    The refusal to sign the agreement triggered the protests: "between 21 November 2013 and 22 February 2014 large-scale street protests took place, provoked by the decision of then-President Viktor Yanukovych not to sign the association agreement with the European Union," and their suppression ended in shootings - on the Maidan "between January and February 2014 more than 100 people were killed, including by snipers"(Citation: 236).
  uk: |-
    Економічний і політичний тиск В. Путіна на В. Януковича восени 2013 року з метою зірвати підписання Угоди про асоціацію з ЄС.
    Ціну питання було оформлено публічно 17 грудня 2013 року: «Україна отримає від Росії 15 мільярдів доларів і газ за зниженою ціною» - ціна газу знижувалася «до 268,5 долара за тисячу кубометрів» замість попередніх 410, а гроші йшли «з російського Фонду національного добробуту» в обмін на українські державні цінні папери(Citation: 234).
    Відмова підписувати угоду стала спусковим гачком протестів: «у період з 21 листопада 2013 року по 22 лютого 2014 року відбулися масштабні вуличні протести, спровоковані рішенням тодішнього Президента Віктора Януковича не підписувати угоду про асоціацію з Європейським союзом», а їх придушення вилилося в розстріли - на Майдані «у період з січня по лютий 2014 року були вбиті понад 100 осіб, у тому числі снайперами»(Citation: 236).
