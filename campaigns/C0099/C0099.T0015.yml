description:
  ru: |-
    Использование экономического шантажа и обещаний кредита вкупе со скидкой на газ для принуждения В. Януковича к срыву подписания Соглашения об ассоциации с ЕС: 17 декабря 2013 года было объявлено о снижении цены газа «до 268,5 долларов за тысячу кубометров» (вместо 410) и о том, что «Украина, согласно двусторонним договоренностям, получит 15 миллиардов долларов из российского Фонда национального благосостояния, продав Москве на эту сумму свои государственные ценные бумаги».
    При этом Путин подчеркнул: «Мы считаем, что это временное решение, имея в виду, что долгосрочные, долговременные договоренности должны и будут достигнуты»(Citation: 234).
  en: |-
    The use of economic blackmail and promises of a loan together with a gas discount to coerce V. Yanukovych into derailing the signing of the Association Agreement with the EU: on December 17, 2013, a reduction of the gas price "to 268.5 dollars per thousand cubic meters" (instead of 410) was announced, along with the fact that "Ukraine, under the bilateral agreements, will receive 15 billion dollars from the Russian National Welfare Fund, selling Moscow its government securities for that amount."
    Putin stressed: "We consider this a temporary solution, bearing in mind that long-term, long-lasting agreements must and will be reached"(Citation: 234).
  uk: |-
    Використання економічного шантажу та обіцянок кредиту вкупі зі знижкою на газ для примусу В. Януковича до зриву підписання Угоди про асоціацію з ЄС: 17 грудня 2013 року було оголошено про зниження ціни газу «до 268,5 долара за тисячу кубометрів» (замість 410) і про те, що «Україна, згідно з двосторонніми домовленостями, отримає 15 мільярдів доларів з російського Фонду національного добробуту, продавши Москві на цю суму свої державні цінні папери».
    При цьому Путін підкреслив: «Ми вважаємо, що це тимчасове рішення, маючи на увазі, що довгострокові, довготривалі домовленості повинні бути й будуть досягнуті»(Citation: 234).
