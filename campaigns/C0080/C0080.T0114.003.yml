description:
  ru: |-
    24 января 1938 года Оргбюро ЦК ВКП(б) постановлением «О ликвидации национальных школ и национальных отделений в школах» закрыло нерусские школы по всему Союзу, тем же числом ликвидировав национальные районы и сельсоветы(Citation: 421)(Citation: 422); 13 марта постановление ЦК ВКП(б) и СНК СССР № 324 «Об обязательном изучении русского языка в школах национальных республик и областей» сделало язык метрополии обязательным предметом во всех школах республик(Citation: 423).
    Киев исполнил 10 апреля 1938 года: Политбюро ЦК КП(б)У, «исходя из решения ЦК ВКП(б)», объявило «нецелесообразным и вредным дальнейшее существование особых национальных школ» и постановило реорганизовать немецкие, польские, чешские, шведские и другие школы и техникумы «в советские школы обычного типа», ликвидировать национальные отделения и классы при обычных школах, техникумах и вузах, а там, где учеников некуда перевести, перевести на программы обычных школ сами заведения - «с преподаванием на украинском или русском языке»; Одесский немецкий педагогический институт превращён в институт иностранных языков, всю работу приказано закончить к 1 августа 1938 года(Citation: 420).
    Обоснование Политбюро записало в самой постанове: «враги народа - троцкисты, бухаринцы и буржуазные националисты, орудовавшие в Наркомпросе УССР, насаждали особые национальные немецкие, польские, чешские, шведские, греческие и другие школы, превращая их в очаги буржуазно-националистического, антисоветского влияния на детей»(Citation: 420).
    Государственным актом решение оформил Совнарком УССР постановлением от 29 июня 1938 года о реорганизации особых национальных школ, техникумов и Одесского немецкого пединститута: уже к 1 августа 1938 года реорганизации в обычные школы с русским (преимущественно) и украинским языком преподавания подлежали 766 национальных начальных, неполных средних и средних школ, ещё 122 объединялись с русскими и украинскими по территориальному принципу - подсчёт историка Людмилы Якубовой(Citation: 16).
  en: |-
    On 24 January 1938 the Orgburo of the Central Committee of the VKP(b), by its resolution "On the Liquidation of National Schools and National Sections in Schools," closed non-Russian schools throughout the Union, liquidating the national districts and village soviets on the same day(Citation: 421)(Citation: 422); on 13 March the resolution of the Central Committee of the VKP(b) and the USSR Council of People's Commissars No. 324 "On the Compulsory Study of the Russian Language in the Schools of the National Republics and Regions" made the metropole's language a compulsory subject in all schools of the republics(Citation: 423).
    Kyiv executed the decision on 10 April 1938: the Politburo of the Central Committee of the KP(b)U, "proceeding from the decision of the Central Committee of the VKP(b)," declared "the further existence of special national schools inexpedient and harmful" and resolved to reorganize the German, Polish, Czech, Swedish and other schools and technical colleges "into Soviet schools of the ordinary type," to liquidate national sections and classes at ordinary schools, colleges and universities, and, where there was nowhere to transfer the pupils, to transfer the institutions themselves to ordinary school curricula - "with instruction in Ukrainian or Russian"; the Odesa German Pedagogical Institute was turned into an institute of foreign languages, and all the work was ordered finished by 1 August 1938(Citation: 420).
    The Politburo wrote its justification into the resolution itself: "enemies of the people - Trotskyites, Bukharinites and bourgeois nationalists operating in the People's Commissariat of Education of the Ukrainian SSR - implanted special national German, Polish, Czech, Swedish, Greek and other schools, turning them into hotbeds of bourgeois-nationalist, anti-Soviet influence on children"(Citation: 420).
    The decision was given the form of a state act by the Council of People's Commissars of the Ukrainian SSR in its resolution of 29 June 1938 on the reorganization of special national schools, colleges and the Odesa German Pedagogical Institute: by 1 August 1938, 766 national primary, incomplete secondary and secondary schools were subject to reorganization into ordinary schools with (predominantly) Russian and Ukrainian as the language of instruction, and another 122 were merged with Russian and Ukrainian ones on the territorial principle - the count of the historian Liudmyla Yakubova(Citation: 16).
  uk: |-
    24 січня 1938 року Оргбюро ЦК ВКП(б) постановою «Про ліквідацію національних шкіл і національних відділень у школах» закрило неросійські школи по всьому Союзу, тим самим числом ліквідувавши національні райони та сільради(Citation: 421)(Citation: 422); 13 березня постанова ЦК ВКП(б) і РНК СРСР № 324 «Про обов'язкове вивчення російської мови в школах національних республік і областей» зробила мову метрополії обов'язковим предметом у всіх школах республік(Citation: 423).
    Київ виконав 10 квітня 1938 року: Політбюро ЦК КП(б)У, «виходячи з рішення ЦК ВКП(б)», визнало «недоцільним і шкідливим дальніше існування особих національних шкіл» і постановило реорганізувати німецькі, польські, чеські, шведські та інші школи й технікуми «в радянські школи звичайного типу», ліквідувати національні відділи та класи при звичайних школах, технікумах і вишах, а там, де учнів нікуди перевести, перевести на програми звичайних шкіл самі заклади - з викладанням українською або російською мовою; Одеський німецький педагогічний інститут перетворено на інститут іноземних мов, усю роботу наказано закінчити до 1 серпня 1938 року(Citation: 420).
    Обґрунтування Політбюро записало в самій постанові: «вороги народу - троцькісти, бухарінці й буржуазні націоналісти, які орудували в НКО УРСР, насаджували особі національні німецькі, польські, чеські, шведські, грецькі й інші школи, перетворюючи їх в очаги буржуазно-націоналістичного, антирадянського впливу на дітей»(Citation: 420).
    Державним актом рішення оформив Раднарком УРСР постановою від 29 червня 1938 року про реорганізацію особих національних шкіл, технікумів та Одеського німецького педінституту: вже до 1 серпня 1938 року реорганізації у звичайні школи з російською (переважно) та українською мовою викладання підлягали 766 національних початкових, неповних середніх і середніх шкіл, ще 122 об'єднувалися з російськими та українськими за територіальним принципом - підрахунок історикині Людмили Якубової(Citation: 16).
