name:
  en: NKVD National Operations and Institutional Russification (1937–1939)
  uk: Національні операції НКВС та інституційна русифікація (1937–1939)
  ru: Национальные операции НКВД и институциональная русификация (1937–1939)
description:
  en: |-
    The total purge of ethnic minorities (Poles, Germans, Greeks, Bulgarians) during the Great Terror through targeted national orders of the NKVD.
    In parallel, in 1938, Moscow officially liquidated every single national district and minority school - by resolutions of the Orgburo of the Central Committee of the VKP(b) of 24 January 1938(Citation: 421)(Citation: 422) - and by the resolution of the Central Committee of the VKP(b) and the USSR Council of People's Commissars of 13 March 1938 No. 324 made the study of the Russian language compulsory(Citation: 423); Kyiv executed the decision by the resolution of the Politburo of the Central Committee of the KP(b)U of 10 April 1938(Citation: 420), returning to overtly imperial practices of assimilation(Citation: 15)(Citation: 5).
  uk: |-
    Тотальна зачистка етнічних меншин (Поляків, Німців, Греків, Болгар) у межах Великого терору через цільові національні накази НКВС.
    Паралельно, у 1938 році, Москва офіційно ліквідовує всі без винятку національні райони та школи для меншин - постановами Оргбюро ЦК ВКП(б) від 24 січня 1938 року(Citation: 421)(Citation: 422) - і постановою ЦК ВКП(б) та РНК СРСР від 13 березня 1938 року № 324 запроваджує обов'язкове вивчення російської мови(Citation: 423); Київ виконує постановою Політбюро ЦК КП(б)У від 10 квітня 1938 року(Citation: 420), повертаючись до відвертих імперських практик асиміляції(Citation: 15)(Citation: 5).
  ru: |-
    Тотальная зачистка этнических меньшинств (поляков, немцев, греков, болгар) в рамках Большого террора через целевые национальные приказы НКВД.
    Параллельно, в 1938 году, Москва официально ликвидирует все без исключения национальные районы и школы для меньшинств - постановлениями Оргбюро ЦК ВКП(б) от 24 января 1938 года(Citation: 421)(Citation: 422) - и постановлением ЦК ВКП(б) и СНК СССР от 13 марта 1938 года № 324 вводит обязательное изучение русского языка(Citation: 423); Киев исполняет постановой Политбюро ЦК КП(б)У от 10 апреля 1938 года(Citation: 420), возвращаясь к откровенным имперским практикам ассимиляции(Citation: 15)(Citation: 5).
