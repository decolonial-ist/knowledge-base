description:
  en: |-
    The conduct of secret mass "national operations" of the NKVD for the physical annihilation of members of ethnic minorities(Citation: 5).
    The mechanism was set by the operational orders of people's commissar Yezhov: No. 00485 of 11 August 1937 opened the Polish operation - "to begin, from 20 August 1937, a broad operation aimed at the complete liquidation of the local organizations of the 'POW'" with completion "within a three-month term"(Citation: 465), - and No. 00439 of 25 July 1937 the German one(Citation: 466); the Greek, Bulgarian and other operations followed their template(Citation: 5).
    The scale is recorded in the perpetrator's own accounting: according to the summary figures of the 1st Special Department of the NKVD of the Ukrainian SSR dated 30 August 1938, 94,659 people were arrested in the republic under orders Nos. 00485, 00593 and others (54,011 on the Polish line, 23,036 on the German, 5,642 on the Greek), of whom 61,683 had been convicted by 1 July 1938; in all, of the 197,945 people convicted by the NKVD of the Ukrainian SSR over the reporting period, 122,274 were sentenced to be shot - nearly two out of every three(Citation: 471).
    Across all the "national lines" of the USSR, 335,513 people were convicted, and 73.66% of them were shot(Citation: 197).
  uk: |-
    Проведення таємних масових «національних операцій» НКВС для фізичного знищення представників етнічних меншин(Citation: 5).
    Механізм задали оперативні накази наркома Єжова: № 00485 від 11 серпня 1937 року відкрив польську операцію - «з 20 серпня 1937 року розпочати широку операцію, спрямовану на повну ліквідацію місцевих організацій „ПОВ“», з терміном завершення «у 3-місячний строк»(Citation: 465), - а № 00439 від 25 липня 1937 року — німецьку(Citation: 466); за їхніми лекалами пройшли грецька, болгарська та інші операції(Citation: 5).
    Масштаб записано у звітності самого карателя: за цифровими зведеннями 1-го спецвідділу НКВС УРСР від 30 серпня 1938 року, в порядку наказів №№ 00485, 00593 та інших по республіці заарештовано 94 659 осіб (54 011 - по польській лінії, 23 036 - по німецькій, 5 642 - по грецькій), з них до 1 липня 1938 року засуджено 61 683; загалом же зі 197 945 засуджених НКВС УРСР за звітний період до розстрілу присуджено 122 274 особи - майже двоє з кожних трьох(Citation: 471).
    За всіма «національними лініями» СРСР засуджено 335 513 осіб, з них розстріляно 73,66%(Citation: 197).
  ru: |-
    Проведение секретных массовых «национальных операций» НКВД для физического уничтожения представителей этнических меньшинств(Citation: 5).
    Механизм задали оперативные приказы наркома Ежова: № 00485 от 11 августа 1937 года открыл польскую операцию - «с 20 августа 1937 года начать широкую операцию, направленную к полной ликвидации местных организаций „ПОВ“», со сроком завершения «в 3-х месячный срок»(Citation: 465), - а № 00439 от 25 июля 1937 года — немецкую(Citation: 466); по их лекалам прошли греческая, болгарская и другие операции(Citation: 5).
    Масштаб записан в отчётности самого карателя: по цифровым сводкам 1-го спецотдела НКВД УССР от 30 августа 1938 года, в порядке приказов №№ 00485, 00593 и других по республике арестовано 94 659 человек (54 011 - по польской линии, 23 036 - по немецкой, 5 642 - по греческой), из них к 1 июля 1938 года осуждено 61 683; всего же из 197 945 осуждённых НКВД УССР за отчётный период к расстрелу приговорены 122 274 человека - почти двое из каждых трёх(Citation: 471).
    По всем «национальным линиям» СССР осуждено 335 513 человек, из них расстреляно 73,66%(Citation: 197).
