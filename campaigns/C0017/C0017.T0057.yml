description:
  ru: |-
    Массовая мобилизация казацких полков на каторжные строительные работы: рытье Ладожского канала «осуществлялось, главным образом, руками украинских казаков», и там «от непосильного труда, голода и тяжёлого климата гибли десятки тысяч человек»(Citation: 194).
    В 1721 году на канал был отправлен «10-тысячный казацкий корпус» во главе с П. Полуботком(Citation: 195); работы продолжались и в 1721–23 годах(Citation: 196).
  en: |-
    The mass mobilization of Cossack regiments for penal construction labor: the digging of the Ladoga Canal "was carried out chiefly by the hands of Ukrainian Cossacks," and there "tens of thousands of people perished from back-breaking labor, hunger and the harsh climate"(Citation: 194).
    In 1721 a "10,000-strong Cossack corps" headed by P. Polubotok was dispatched to the canal(Citation: 195); the works continued through 1721–23(Citation: 196).
  uk: |-
    Масова мобілізація козацьких полків на каторжні будівельні роботи: копання Ладозького каналу «здійснювалося, гол. чин., руками укр. козаків», і там «від непосильної праці, голоду й важкого клімату гинули десятки тисяч осіб»(Citation: 194).
    У 1721 році на канал було відправлено «10-тис. козац. корпус» на чолі з П. Полуботком(Citation: 195); роботи тривали й у 1721–23 роках(Citation: 196).
