name:
  en: 'Forced Labor on Imperial Construction: The Ladoga Canal (1704–1725)'
  uk: 'Примусова праця на імперських будовах: Ладозький канал (1704–1725)'
  ru: 'Принудительный труд на имперских стройках: Ладожский канал (1704–1725)'
description:
  en: |-
    The physical and economic exhaustion of the region through the transformation of the Cossack host into unpaid labor for imperial construction projects.
    The chief of these was the Ladoga Canal: Peter I handed the direction of the works to Münnich, while the digging itself "was carried out chiefly by the hands of Ukrainian Cossacks," and "on the construction works, tens of thousands of people perished from back-breaking labor, hunger and the harsh climate"(Citation: 194).
    In 1721 the acting hetman P. Polubotok "headed a 10,000-strong Cossack corps dispatched by order of Tsar Peter I to the construction of the Ladoga Canal"(Citation: 195).
    For the defiant there were also the Neva construction sites - as hard labor: captured Zaporozhians were "exiled to Sankt-Piterburkh to hard labor forever"(Citation: 4).
  uk: |-
    Фізичне та економічне виснаження регіону через перетворення козацького війська на безоплатну робочу силу для імперських будов.
    Головною з них був Ладозький канал: керівництво роботами Петро I передав Мініху, а саме копання «здійснювалося, гол. чин., руками укр. козаків», причому «на буд. роботах від непосильної праці, голоду й важкого клімату гинули десятки тисяч осіб»(Citation: 194).
    У 1721 році наказний гетьман П. Полуботок «очолював 10-тис. козац. корпус, відправлений за наказом царя Петра I на спорудження Ладозького каналу»(Citation: 195).
    На тих, хто чинив опір, чекали й невські будови - як каторга: полонені запорожці були «заслані в Санкт-Пітербурх на каторгу вічно»(Citation: 4).
  ru: |-
    Физическое и экономическое истощение региона через превращение казацкого войска в бесплатную рабочую силу для имперских строек.
    Главной из них был Ладожский канал: руководство работами Пётр I передал Миниху, а само рытьё «осуществлялось, главным образом, руками украинских казаков», причём «на строительных работах от непосильного труда, голода и тяжёлого климата гибли десятки тысяч человек»(Citation: 194).
    В 1721 году наказной гетман П. Полуботок «возглавлял 10-тысячный казацкий корпус, отправленный по приказу царя Петра I на сооружение Ладожского канала»(Citation: 195).
    Тех, кто сопротивлялся, ждали и невские стройки - как каторга: пленные запорожцы были «сосланы в Санкт-Питербурх на каторгу вечно»(Citation: 4).
