description:
  ru: |-
    Вывод казацких полков из казацкой иерархии под прямое командование имперских должностных лиц: руководство работами на Ладожском канале Пётр I передал Б.-К.
    Миниху, который «перенял у кн.
    А. Меншикова руководство сооружением (рытьём) Ладожского канала»(Citation: 194); казацкие корпуса отправлялись на эти работы «по приказу царя Петра I»(Citation: 195).
  en: |-
    Removing Cossack regiments from the Cossack hierarchy and placing them under the direct command of imperial officials: Peter I handed the direction of the Ladoga Canal works to B.-C.
    Münnich, who "took over from Prince A. Menshikov the direction of the construction (digging) of the Ladoga Canal"(Citation: 194); Cossack corps were dispatched to these works "by order of Tsar Peter I"(Citation: 195).
  uk: |-
    Виведення козацьких полків із козацької ієрархії під пряме командування імперських посадовців: керівництво роботами на Ладозькому каналі Петро I передав Б.-К.
    Мініху, який «перебрав у кн.
    О.Меншикова кер-во спорудженням (копанням) Ладозького каналу»(Citation: 194); козацькі корпуси відправлялися на ці роботи «за наказом царя Петра I»(Citation: 195).
