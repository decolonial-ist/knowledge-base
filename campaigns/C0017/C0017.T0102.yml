description:
  en: |-
    Shifting the upkeep of the mobilized onto the subjects themselves: Cossacks dispatched to the imperial construction sites were left without supply and "suffer great want from hunger, having neither food for themselves, nor winter quarters, nor fodder for the horses"(Citation: 4).
    Workers for state construction the tsar simply ordered to be "taken from Ukraine, from those towns that are under your authority"(Citation: 4), while at the works themselves people perished "from back-breaking labor, hunger and the harsh climate"(Citation: 194).
  uk: |-
    Перекладання утримання мобілізованих на самих підданих: відправлені на імперські будови козаки залишалися без постачання і «великої зазнають нужди від голоду, не маючи ні для себе харчів, ні стацій зимових, ні для коней корму»(Citation: 4).
    Робітників для казенних будов цар приписував просто «взяти з України, тих міст, які у вас відомі»(Citation: 4), а на самих роботах люди гинули «від непосильної праці, голоду й важкого клімату»(Citation: 194).
  ru: |-
    Перекладывание содержания мобилизованных на самих подданных: отправленные на имперские стройки казаки оставались без снабжения и «великую терпят нужду от голоду, не меючи ни для себе харчи, ни стации зимовых, ни для коней корму»(Citation: 4).
    Работников для казенных строек царь предписывал просто «взять с Украины, тех городов, которые у вас ведомы»(Citation: 4), а на самих работах люди гибли «от непосильного труда, голода и тяжёлого климата»(Citation: 194).
