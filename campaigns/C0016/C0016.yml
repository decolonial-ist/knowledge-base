name:
  en: The Reshetylivka Articles (1709)
  uk: Решетилівські статті (1709)
  ru: Решетиловские статьи (1709)
description:
  en: |-
    The first systematic campaign to dismantle treaty-based agency: instead of an equal interstate treaty – the tsar's "decisive" resolutions upon the hetman's petitionary articles.
    "The joint document, drawn up as a decree, was signed by state chancellor Count G. Golovkin"(Citation: 196) - the signature "State Chancellor, Count Golovkin.
    Given at Kyiv, 31 July 1709" stands under the published act itself(Citation: 393).
    The articles "fully preserved the previously established control of the tsarist regime over local financing, the functioning of the administrative apparatus, the Cossack army, and foreign policy"(Citation: 196).
  uk: |-
    Перша системна кампанія з демонтажу договірної суб'єктності: замість рівноправного міждержавного договору – царські «рішительні» резолюції на просительні статті гетьмана.
    «Спільний документ, оформлений як указ, підписав держ. канцлер граф Г.Головкін»(Citation: 196) - підпис «Державний Канцлер, Граф Головкін.
    Дано в Києві, 31 липня 1709 року» стоїть під публікацією самого акта(Citation: 393).
    Статті «повністю зберігали встановлений раніше контроль царату над місц. фінансуванням, функціонуванням адм. апарату, козац. військом, зовн. політикою»(Citation: 196).
  ru: |-
    Первая системная кампания по демонтажу договорной субъектности: вместо равноправного межгосударственного договора – царские «решительные» резолюции на просительные статьи гетмана.
    «Совместный документ, оформленный как указ, подписал государственный канцлер граф Г.Головкин»(Citation: 196) - подпись «Государственный Канцлер, Граф Головкин.
    Дан в Киеве, 31 Июля, 1709 году» стоит под публикацией самого акта(Citation: 393).
    Статьи «полностью сохраняли установленный ранее контроль царата над местным финансированием, функционированием административного аппарата, казацким войском, внешней политикой»(Citation: 196).
