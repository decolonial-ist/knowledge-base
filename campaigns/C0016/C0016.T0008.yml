description:
  en: |-
    Refusal to sign a treaty: the replacement of an equal agreement with the tsar's unilateral "resolutions."
    "The joint document, drawn up as a decree, was signed by state chancellor Count G. Golovkin"(Citation: 196)(Citation: 393) – the autonomy ceased to be a party to a treaty.
  uk: |-
    Відмова від підписання договору: заміна рівноправної угоди односторонніми «резолюціями» царя.
    «Спільний документ, оформлений як указ, підписав держ. канцлер граф Г.Головкін»(Citation: 196)(Citation: 393) – автономія перестала бути договірною стороною.
  ru: |-
    Отказ от подписания договора: замена равноправного соглашения односторонними «резолюциями» царя.
    «Совместный документ, оформленный как указ, подписал государственный канцлер граф Г.Головкин»(Citation: 196)(Citation: 393) – автономия перестала быть договорной стороной.
