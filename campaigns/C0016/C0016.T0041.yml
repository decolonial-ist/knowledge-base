description:
  en: |-
    Preservation of tsarist representatives' oversight of the hetmanate's administrative apparatus: the articles "fully preserved the previously established control of the tsarist regime over local financing and the functioning of the administrative apparatus"(Citation: 196).
    The institution of the tsar's resident was established alongside the hetman: "The first tsar's resident was stolnik A. Izmailov, who in his work was guided by official and secret tsarist articles"; the residents "were given the right to control the election and official appointments of representatives of the starshyna"(Citation: 196).
  uk: |-
    Збереження нагляду царських представників над управлінським апаратом гетьманату: статті «повністю зберігали встановлений раніше контроль царату над місц. фінансуванням, функціонуванням адм. апарату»(Citation: 196).
    При гетьмані було запроваджено інститут царського резидента: «Першим Р[езидентом] ц[арським] став стольник А.Ізмайлов, який у своїй роботі керувався офіційними і таємними царськими статтями»; резидентам «надано право контролювати обрання та службові призначення представників старшини»(Citation: 196).
  ru: |-
    Сохранение надзора царских представителей над управленческим аппаратом гетманата: статьи «полностью сохраняли установленный ранее контроль царата над местным финансированием, функционированием административного аппарата»(Citation: 196).
    При гетмане был учреждён институт царского резидента: «Первым Р[езидентом] ц[арским] стал стольник А.Измайлов, который в своей работе руководствовался официальными и тайными царскими статьями»; резидентам «дано право контролировать избрание и служебные назначения представителей старшины»(Citation: 196).
