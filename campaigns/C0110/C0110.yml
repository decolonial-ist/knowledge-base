name:
  en: The Alexander II Monument in Kyiv (1911)
  uk: Пам'ятник Олександрові II у Києві (1911)
  ru: Памятник Александру II в Киеве (1911)
description:
  en: |-
    In 1911 the Russian Empire put up in central Kyiv the largest monument to Alexander II in the entire empire.
    The gratitude on the pedestal was voiced not by Ukraine and not by Kyiv but by the "Southwestern Krai" - the empire's official name for the Ukrainian lands west of the Dnipro(Citation: 407)(Citation: 408).
    The monument was unveiled on 30 August 1911 on Tsarskaya Square; the money was raised by an all-Russian subscription, 200 thousand rubles; the central pedestal bore the coat of arms of the empire, the double-headed eagle, and the inscription "To the Tsar-Liberator, the grateful Southwestern Krai.
    The year 1911"(Citation: 411)(Citation: 407).
  uk: |-
    Російська імперія 1911 року поставила в центрі Києва найбільший в усій імперії пам'ятник Олександрові II.
    Вдячність на п'єдесталі висловлювала не Україна і не Київ, а «Південно-Західний край» - так імперія офіційно називала українські землі на захід від Дніпра(Citation: 407)(Citation: 408).
    Пам'ятник відкрили 30 серпня 1911 року на Царській площі; гроші зібрали всеросійською підпискою, 200 тисяч рублів; центральний п'єдестал ніс герб імперії, двоголового орла, і напис «Царю-освободителю благодарный Юго-Западный край. 1911 год»(Citation: 411)(Citation: 407).
  ru: |-
    Российская империя в 1911 году поставила в центре Киева крупнейший во всей империи памятник Александру II.
    Благодарность на пьедестале высказывала не Украина и не Киев, а «Юго-Западный край» - так империя официально называла украинские земли к западу от Днепра(Citation: 407)(Citation: 408).
    Памятник открыли 30 августа 1911 года на Царской площади; деньги собрали всероссийской подпиской, 200 тысяч рублей; центральный пьедестал нёс герб империи, двуглавого орла, и надпись «Царю-освободителю благодарный Юго-Западный край. 1911 год»(Citation: 411)(Citation: 407).
