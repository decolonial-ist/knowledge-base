description:
  ru: |-
    Попытка вооруженного захвата власти весной 2014 года путем штурма областных администраций: ООН зафиксировала, что уже «в середине апреля 2014 года» «группы вооруженных людей незаконно произвели хорошо организованный и скоординированный захват общественных зданий и отделений милиции и служб безопасности в городах и поселках в Донецкой и Луганской областях», а «в целях сохранения контроля над захваченными районами эти группы возвели баррикады и блокпосты»(Citation: 236).
    В Харькове переворот был быстро подавлен.
  en: |-
    An attempted armed seizure of power in the spring of 2014 by storming regional administrations: the UN recorded that already "in mid-April 2014" "groups of armed men unlawfully carried out a well-organized and coordinated seizure of public buildings and police and security service offices in towns and villages of the Donetsk and Luhansk regions," and "in order to retain control of the seized areas these groups set up barricades and checkpoints"(Citation: 236).
    In Kharkiv the coup was quickly suppressed.
  uk: |-
    Спроба збройного захоплення влади навесні 2014 року через штурм обласних адміністрацій: ООН зафіксувала, що вже «у середині квітня 2014 року» «групи озброєних людей незаконно здійснили добре організоване і скоординоване захоплення громадських будівель та відділень міліції і служб безпеки в містах і селищах Донецької та Луганської областей», а «з метою збереження контролю над захопленими районами ці групи звели барикади і блокпости»(Citation: 236).
    У Харкові переворот було швидко придушено.
