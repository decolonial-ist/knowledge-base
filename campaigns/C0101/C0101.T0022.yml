description:
  ru: 'Привлечение к боевым действиям российских неонацистских группировок (таких как ДРГ «Русич» под командованием А. Мильчакова), главари которых открыто призывали к немотивированному садистскому насилию над гражданскими («Режь бомжей, щенков и детей!»)(Citation: 2).'
  en: 'Engagement in combat operations of Russian neo-Nazi groups (such as the "Rusich" sabotage and reconnaissance group under the command of A. Milchakov), whose ringleaders openly called for unmotivated sadistic violence against civilians ("Slaughter the homeless, the puppies, and the children!")(Citation: 2).'
  uk: 'Залучення до бойових дій російських неонацистських угруповань (таких як ДРГ «Русич» під командуванням О. Мільчакова), ватажки яких відкрито закликали до невмотивованого садистського насильства над цивільними («Ріж бомжів, цуценят і дітей!»)(Citation: 2).'
