name:
  ru: 'Продолжение российско-украинской войны: Вооруженная агрессия на Донбассе (2014–2015)'
  en: 'Continuation of the Russo-Ukrainian War: Armed Aggression in the Donbas (2014–2015)'
  uk: 'Продовження російсько-української війни: Збройна агресія на Донбасі (2014–2015)'
description:
  ru: |-
    Расширение российской агрессии через захват административных зданий на востоке Украины вооруженными отрядами: «группы вооруженных людей незаконно произвели хорошо организованный и скоординированный захват общественных зданий и отделений милиции и служб безопасности в городах и поселках в Донецкой и Луганской областях»(Citation: 236).
    Командир отряда, перешедшего границу, И. Гиркин («Стрелков») позже сам признал свою роль: «Спусковой крючок войны все-таки нажал я.
    Если бы наш отряд не перешел границу, в итоге все бы кончилось, как в Харькове, как в Одессе»(Citation: 247).
    Кампания сопровождалась террором против местного населения, уничтожением рейса MH17 и массированной дезинформацией(Citation: 227).
    Летом 2014 года РФ ввела регулярные войска, что привело к боям под Иловайском и Дебальцевом.
    Мониторинговая миссия ООН с самого начала фиксировала привозную массовку протестов: «людей привозили автобусами и платили им за участие в протестах и проведение их по определённым сценариям, включая провоцирование насильственных инцидентов», причём «некоторые протестующие, предположительно, прибыли из Российской Федерации»(Citation: 325).
  en: |-
    The expansion of Russian aggression through the seizure of administrative buildings in eastern Ukraine by armed detachments: "groups of armed men unlawfully carried out a well-organized and coordinated seizure of public buildings and police and security service offices in towns and villages of the Donetsk and Luhansk regions"(Citation: 236).
    The commander of the detachment that crossed the border, I. Girkin ("Strelkov"), later admitted his own role: "It was I, after all, who pulled the trigger of the war.
    Had our detachment not crossed the border, it would all have ended as in Kharkiv, as in Odesa"(Citation: 247).
    The campaign was accompanied by terror against the local population, the downing of flight MH17, and massive disinformation(Citation: 227).
    In the summer of 2014, the Russian Federation brought in regular troops, which led to the battles near Ilovaisk and Debaltseve.
    The UN monitoring mission recorded bussed-in crowds from the outset: "people were brought in buses and paid to take part in protests and conduct them according to specific scenarios, including causing violent incidents," while "some protesters allegedly come from the Russian Federation"(Citation: 325).
  uk: |-
    Розширення російської агресії через захоплення адміністративних будівель на сході України збройними загонами: «групи озброєних людей незаконно здійснили добре організоване і скоординоване захоплення громадських будівель та відділень міліції і служб безпеки в містах і селищах Донецької та Луганської областей»(Citation: 236).
    Командир загону, що перейшов кордон, І. Гіркін («Стрєлков») згодом сам визнав свою роль: «Спусковий гачок війни все-таки натиснув я.
    Якби наш загін не перейшов кордон, у підсумку все б скінчилося, як у Харкові, як в Одесі»(Citation: 247).
    Кампанія супроводжувалася терором проти місцевого населення, знищенням рейсу MH17 та масованою дезінформацією(Citation: 227).
    Влітку 2014 року РФ ввела регулярні війська, що призвело до боїв під Іловайськом і Дебальцевим.
    Моніторингова місія ООН від самого початку фіксувала привізну масовку протестів: «людей привозили автобусами і платили їм за участь у протестах та проведення їх за визначеними сценаріями, включно з провокуванням насильницьких інцидентів», причому «деякі протестувальники, імовірно, прибули з Російської Федерації»(Citation: 325).
