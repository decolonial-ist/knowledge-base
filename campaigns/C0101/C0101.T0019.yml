description:
  en: |-
    The overt crossing of the state border by regular Russian troops in the summer and autumn of 2014 to save the separatists from defeat: the "DNR" commander admitted that the decisive role was played by Russian servicemen who came "on leave" - "it was mostly 'vacationers' who advanced on Mariupol.
    When they left, both the front line and the opportunities became precarious"(Citation: 247).
    The offensive resulted in heavy losses for the Ukrainian army near Ilovaisk and Debaltseve.
    The presence of regular troops continued into 2015: the GRU men captured near Shchastia were "soldiers of the 3rd Separate Guards Special Purpose Brigade of the Main Directorate of the General Staff of the Russian Armed Forces, who arrived on the territory of Ukraine on March 26 and were quartered in Luhansk"(Citation: 328).
  uk: |-
    Відкритий перехід державного кордону регулярними військами РФ улітку-восени 2014 року для порятунку сепаратистів від розгрому: командир «ДНР» визнав, що вирішальну роль відіграли російські військові, які приїжджали «у відпустці» - «в основному на Маріуполь наступали «відпускники».
    Коли вони пішли, хиткою залишилися і лінія фронту, і можливості»(Citation: 247).
    Наступ обернувся важкими втратами української армії під Іловайськом і Дебальцевим.
    Присутність регулярних військ тривала й у 2015 році: узяті в полон під Щастям ГРУшники були «бійці 3-ї окремої гвардійської бригади спеціального призначення Головного управління Генштабу ЗС РФ, які 26 березня прибули на територію України та були розквартировані в Луганську»(Citation: 328).
  ru: |-
    Открытый переход государственной границы регулярными войсками РФ летом-осенью 2014 года для спасения сепаратистов от разгрома: командир «ДНР» признал, что решающую роль сыграли российские военные, приезжавшие «в отпуске» - «в основном на Мариуполь наступали «отпускники».
    Когда они ушли, зыбкая осталась и линия фронта, и возможности»(Citation: 247).
    Наступление обернулось тяжелыми потерями украинской армии под Иловайском и Дебальцевом.
    Присутствие регулярных войск продолжалось и в 2015 году: взятые в плен под Счастьем ГРУшники были «бойцы 3-й отдельной гвардейской бригады специального назначения Главного управления Генштаба ВС РФ, которые 26 марта прибыли на территорию Украины и были расквартированы в Луганске»(Citation: 328).
