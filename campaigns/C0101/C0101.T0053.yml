description:
  ru: 'Массовые незаконные задержания и похищения мирных граждан на оккупированных территориях: «вооруженные группы продолжали совершать похищения, подвергать людей физическим и психологическим пыткам, жестокому обращению», причем «людей похищали с целью получения выкупа, для принудительного труда и для обмена на бойцов, захваченных украинскими властями»(Citation: 236).'
  en: 'Mass unlawful detentions and abductions of civilians in the occupied territories: "armed groups continued to commit abductions, to subject people to physical and psychological torture and ill-treatment," and "people were abducted for ransom, for forced labor, and for exchange for fighters captured by the Ukrainian authorities"(Citation: 236).'
  uk: 'Масові незаконні затримання та викрадення мирних громадян на окупованих територіях: «озброєні групи продовжували чинити викрадення, піддавати людей фізичним і психологічним тортурам, жорстокому поводженню», причому «людей викрадали з метою отримання викупу, для примусової праці та для обміну на бійців, захоплених українською владою»(Citation: 236).'
