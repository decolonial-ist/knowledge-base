description:
  ru: |-
    Разжигание вооруженных столкновений в Одессе 2 мая 2014 года: ООН фиксирует насилие, совершенное «в Одессе 2 мая 2014 года в ходе столкновений между сторонниками единства и сторонникам федерализации Украины, в результате которых погибли 48 человек, в основном сторонники федерализации страны», и отмечает, что «к ответственности до сих пор никто не привлечен»(Citation: 236).
    Кульминацией стал пожар в Доме профсоюзов, где укрылись активисты: мониторинговая миссия ООН среди главных нерасследованных вопросов называла, «чем был вызван пожар в Доме профсоюзов» и «кто виновен в убийствах»(Citation: 322).
  en: |-
    The instigation of armed clashes in Odesa on May 2, 2014: the UN records the violence committed "in Odesa on 2 May 2014 during clashes between supporters of unity and supporters of the federalization of Ukraine, as a result of which 48 people died, mostly supporters of the country's federalization," and notes that "no one has yet been held to account"(Citation: 236).
    The culmination was the fire in the Trade Union Building where activists had taken refuge: the UN monitoring mission listed among the key uninvestigated questions "what caused the fire in the Trade Union building" and "who are the perpetrators of the killings"(Citation: 322).
  uk: |-
    Розпалювання збройних сутичок в Одесі 2 травня 2014 року: ООН фіксує насильство, скоєне «в Одесі 2 травня 2014 року під час зіткнень між прибічниками єдності та прибічниками федералізації України, внаслідок яких загинули 48 осіб, переважно прибічники федералізації країни», і зазначає, що «до відповідальності досі ніхто не притягнутий»(Citation: 236).
    Кульмінацією стала пожежа в Будинку профспілок, де сховалися активісти: моніторингова місія ООН серед головних нерозслідуваних питань називала, «чим була викликана пожежа в Будинку профспілок» і «хто винен у вбивствах»(Citation: 322).
