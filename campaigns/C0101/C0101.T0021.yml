description:
  en: |-
    The physical elimination of legitimate representatives of local government who resisted the occupation: "the mutilated body of Volodomyr Rybak, a member of the 'Batkivshchyna' party and deputy of the Municipal Council of Horlivka (Donetsk region), was found near the village of Raihorodok," and "Rybak was abducted on April 17 by pro-Russians, following a pro-Ukrainian gathering in Horlivka.
    He was then tortured and murdered"(Citation: 231).
  uk: |-
    Фізичне усунення легітимних представників місцевої влади, які чинили опір окупації: «понівечене тіло Володимира Рибака, члена партії „Батьківщина“ і депутата міської ради Горлівки (Донецька область), було знайдено біля села Райгородок», причому «Рибака викрали 17 квітня проросійські сили після проукраїнського зібрання в Горлівці.
    Потім його катували та вбили»(Citation: 231).
  ru: |-
    Физическое устранение легитимных представителей местной власти, оказывавших сопротивление оккупации: «изуродованное тело Владимира Рыбака, члена партии „Батькивщина“ и депутата городского совета Горловки (Донецкая область), было найдено близ села Райгородок», причем «Рыбак был похищен 17 апреля пророссийскими силами после проукраинского собрания в Горловке.
    Затем его пытали и убили»(Citation: 231).
