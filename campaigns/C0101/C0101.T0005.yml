description:
  ru: |-
    Эксплуатация трагедии в Одессе для создания государственного пропагандистского мифа и инверсии ролей: реальная картина по данным ООН - столкновения «между сторонниками единства и сторонникам федерализации Украины, в результате которых погибли 48 человек», при этом расследование не завершено и «к ответственности до сих пор никто не привлечен»(Citation: 236).
    Эта трагедия использовалась как моральное оправдание дальнейшей агрессии - тем же приемом, что и фейк о «распятом мальчике», по которому «нет никаких доказательств, подтверждающих утверждение Пышняк»(Citation: 217).
  en: |-
    The exploitation of the Odesa tragedy to build a state propaganda myth and invert the roles: the actual picture, per the UN, is clashes "between supporters of unity and supporters of the federalization of Ukraine, as a result of which 48 people died," while the investigation remains incomplete and "no one has yet been held to account"(Citation: 236).
    The tragedy was used as moral justification for further aggression - by the same device as the "crucified boy" fake, for which "there is no evidence to support Pyshniak's claim"(Citation: 217).
  uk: |-
    Експлуатація одеської трагедії для створення державного пропагандистського міфу та інверсії ролей: реальна картина за даними ООН - сутички «між прибічниками єдності та прибічниками федералізації України, внаслідок яких загинули 48 осіб», при цьому розслідування не завершене і «до відповідальності досі ніхто не притягнутий»(Citation: 236).
    Ця трагедія використовувалася як моральне виправдання подальшої агресії - тим самим прийомом, що й фейк про «розп'ятого хлопчика», щодо якого «немає жодних доказів, які підтверджували б твердження Пишняк»(Citation: 217).
