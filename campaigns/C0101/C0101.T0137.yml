description:
  en: |-
    A massive campaign of fabricating fakes to dehumanize Ukrainians: on state television it was claimed that "Ukrainian armed forces herded city residents to the central square and publicly executed a small boy and his mother," yet "there is no evidence to support Pyshniak's claim," and the residents of Sloviansk who were interviewed did not confirm the story(Citation: 217).
    The same method produced the fabricated "death of a 10-year-old girl" in the Petrovskyi district of Donetsk (March 2015): BBC correspondents on the ground established that no such girl had ever existed(Citation: 323).
    In parallel ran an operation to conceal responsibility for the destruction of flight MH17: the Russian Ministry of Defense "made a series of self-contradictory claims blaming Ukraine, rather than Russia or Russian-led separatists, for the Boeing 777's shoot down," while a deputy defense minister publicly repeated "a fabricated claim that originated on Twitter of how a Spanish air traffic controller named Carlos saw two Ukrainian fighter jets near MH17"(Citation: 227).
  uk: |-
    Масована кампанія з конструювання фейків для розлюднення українців: в ефірі державного телеканалу стверджувалося, що «українські збройні сили зігнали мешканців міста на центральну площу та публічно стратили маленького хлопчика і його матір», однак «немає жодних доказів, які підтверджували б твердження Пишняк», а опитані мешканці Слов'янська розповідь не підтвердили(Citation: 217).
    Тим самим методом сфабриковано «загибель 10-річної дівчинки» в Петровському районі Донецька (березень 2015): кореспонденти BBC на місці встановили, що такої дівчинки ніколи не існувало(Citation: 323).
    Паралельно тривала операція з приховування відповідальності за знищення рейсу MH17: Міноборони РФ «виступило з серією суперечливих заяв, що покладали вину за знищення Boeing 777 на Україну, а не на Росію чи керованих Росією сепаратистів», а заступник міністра оборони публічно повторив «сфабриковане твердження, що виникло у Twitter, про те, як іспанський авіадиспетчер на ім'я Карлос бачив два українські винищувачі поруч із MH17»(Citation: 227).
  ru: |-
    Массированная кампания по конструированию фейков для расчеловечивания украинцев: в эфире государственного телеканала утверждалось, что «украинские вооружённые силы согнали жителей города на центральную площадь и публично казнили маленького мальчика и его мать», однако «нет никаких доказательств, подтверждающих утверждение Пышняк», а опрошенные жители Славянска рассказ не подтвердили(Citation: 217).
    Тем же методом сфабрикована «гибель 10-летней девочки» в Петровском районе Донецка (март 2015): корреспонденты BBC на месте установили, что такой девочки никогда не существовало(Citation: 323).
    Параллельно шла операция по сокрытию ответственности за уничтожение рейса MH17: Минобороны РФ «выступило с серией противоречащих друг другу заявлений, возлагающих вину за уничтожение Boeing 777 на Украину, а не на Россию или руководимых Россией сепаратистов», а замминистра обороны публично повторил «сфабрикованное утверждение, возникшее в Twitter, о том, как испанский авиадиспетчер по имени Карлос видел два украинских истребителя рядом с MH17»(Citation: 227).
