description:
  ru: |-
    Ведение войны чужими руками: переход границы вооружённой группой, захват Славянска и формирование «ДНР»/«ЛНР» с присланным из Москвы руководством.
    Командир отряда признал: «практически маховик войны, которая до сих пор идет, запустил наш отряд», и «спусковой крючок войны все-таки нажал я»(Citation: 247).
    Управление ООН по правам человека фиксировало, что «группы вооруженных людей незаконно произвели хорошо организованный и скоординированный захват общественных зданий и отделений милиции и служб безопасности»(Citation: 236).
    Руководство «республики» с самого начала было московским: «Александр Бородай - первый премьер-министр ДНР, в 2014 году передавший полномочия Александру Захарченко», москвич, выросший «в интеллигентной московской семье»(Citation: 324).
    Теми же формированиями весной-летом 2014 года пытались взять Мариуполь: «в основном на Мариуполь наступали «отпускники»», то есть российские военные, а об итоге он же говорит: после их ухода «зыбкая осталась и линия фронта, и возможности»(Citation: 247); 13 июня город был отбит украинскими войсками.
  en: |-
    The seizure of Sloviansk by an armed group that had crossed the border, and the formation of the separatist "DNR"/"LNR": the detachment's commander openly admitted that "in practice it was our detachment that set in motion the flywheel of the war that is still going on," and that "it was I, after all, who pulled the trigger of the war"(Citation: 247).
    In parallel, "groups of armed men unlawfully carried out a well-organized and coordinated seizure of public buildings and police and security service offices"(Citation: 236).
    The "republic's" leadership was from the outset dispatched from Moscow: "Alexander Boroday - the first prime minister of the DNR, who in 2014 handed over his powers to Alexander Zakharchenko," a Muscovite raised "in an intelligentsia Moscow family"(Citation: 324).
    In the spring and summer of 2014 the same formations tried to take Mariupol: "those advancing on Mariupol were mainly 'vacationers'," that is, Russian soldiers, and about the outcome the same commander says that after their departure "both the front line and the opportunities remained shaky"(Citation: 247); on 13 June Ukrainian troops retook the city.
  uk: |-
    Захоплення Слов'янська збройною групою, що перейшла кордон, і формування сепаратистських «ДНР»/«ЛНР»: командир загону прямо визнав, що «практично маховик війни, яка досі йде, запустив наш загін», і що «спусковий гачок війни все-таки натиснув я»(Citation: 247).
    Паралельно «групи озброєних людей незаконно здійснили добре організоване і скоординоване захоплення громадських будівель та відділень міліції і служб безпеки»(Citation: 236).
    Керівництво «республіки» від самого початку було присланим із Москви: «Олександр Бородай - перший прем'єр-міністр ДНР, який 2014 року передав повноваження Олександрові Захарченку», москвич, що виріс «в інтелігентній московській родині»(Citation: 324).
    Тими ж формуваннями навесні-влітку 2014 року намагалися взяти Маріуполь: «в основному на Маріуполь наступали «відпускники»», тобто російські військові, а про підсумок він же каже: після їхнього відходу «хиткою лишилася і лінія фронту, і можливості»(Citation: 247); 13 червня українські війська відбили місто.
