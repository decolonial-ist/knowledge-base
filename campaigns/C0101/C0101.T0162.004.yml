description:
  ru: |-
    Систематическое применение пыток и физического насилия к гражданским лицам за проукраинскую позицию: ООН фиксировала, что «вооруженные группы продолжали совершать похищения, подвергать людей физическим и психологическим пыткам, жестокому обращению, а также совершать другие серьезные нарушения прав человека»(Citation: 236).
    Похищенных активисток Автомайдана держали в подвале, где их «предположительно, несколько раз избивали со связанными руками», а волосы отрезали в наказание(Citation: 231).
  en: |-
    The systematic use of torture and physical violence against civilians for a pro-Ukrainian stance: the UN recorded that "armed groups continued to commit abductions, to subject people to physical and psychological torture and ill-treatment, and to commit other grave human rights violations"(Citation: 236).
    Abducted Automaidan activists were held in a basement where they were "allegedly beaten several times, with their hands bound," and their hair was cut off in reprisal(Citation: 231).
  uk: |-
    Систематичне застосування катувань і фізичного насильства до цивільних за проукраїнську позицію: ООН фіксувала, що «озброєні групи продовжували чинити викрадення, піддавати людей фізичним і психологічним тортурам, жорстокому поводженню, а також чинити інші серйозні порушення прав людини»(Citation: 236).
    Викрадених активісток Автомайдану тримали в підвалі, де їх «імовірно, кілька разів били зі зв'язаними руками», а волосся відрізали на покарання(Citation: 231).
