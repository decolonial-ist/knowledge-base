name:
  en: Stalling Democratic Reforms and Countering the People's Movement (Rukh) (1989–1990)
  uk: Гальмування демократичних реформ і протидія Народному Руху (1989–1990)
  ru: Торможение демократических реформ и противодействие Народному Руху (1989–1990)
description:
  en: |-
    The conservative party apparatus under the leadership of V. Shcherbytsky attempted to contain the growth of the national liberation movement.
    Because of KGB pressure and the threat of an immediate ban, the founders of the Ukrainian independence movement were initially forced to disguise their goals, naming the organization the "People's Movement of Ukraine for Perestroika": "at first it supported the official course of perestroika, without formally raising the demand of Ukraine's independence," and its program "lacked the demand for a new union treaty and contained a formal provision recognizing the 'guiding role' of the communist party"(Citation: 24).
    Only in 1990, having proclaimed that "what is needed is not perestroika but the complete dismantling of the totalitarian system," did Rukh remove the words "for perestroika" from its name(Citation: 24).
  uk: |-
    Консервативний партійний апарат під керівництвом В. Щербицького намагався стримати зростання національно-визвольного руху.
    Через тиск КДБ і загрозу негайної заборони засновники українського руху за незалежність спочатку були змушені маскувати свої цілі, назвавши організацію «Народний рух України за перебудову»: «спочатку вона підтримувала офіц. курс на перебудову, не ставлячи формально вимогу незалежності України», а в програмі «була відсутня вимога про новий союзний договір і містилося формальне положення про визнання „керуючої ролі“ компартії»(Citation: 24).
    Лише 1990 року, проголосивши, що «необхідна не перебудова, а повний демонтаж тоталітарної системи», Рух прибрав із назви слова «за перебудову»(Citation: 24).
  ru: |-
    Консервативный партийный аппарат под руководством В. Щербицкого пытался сдержать рост национально-освободительного движения.
    Из-за давления КГБ и угрозы немедленного запрета основатели украинского движения за независимость изначально были вынуждены маскировать свои цели, назвав организацию «Народный Рух Украины за перестройку»: «сначала она поддерживала официальный курс на перестройку, формально не выдвигая требование независимости Украины», а в программе «отсутствовало требование о новом союзном договоре и содержалось формальное положение о признании „руководящей роли“ компартии»(Citation: 24).
    Лишь в 1990 году, провозгласив, что «необходима не перестройка, а полный демонтаж тоталитарной системы», Рух убрал из названия слова о перестройке(Citation: 24).
