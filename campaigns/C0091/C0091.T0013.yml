description:
  en: |-
    The use of brute force by party activists against Rukh activists: when Rukh members attempted to install a cross on the grave of those executed near Bazar, "the activists were not allowed into the village" "with the help of KGB men and provocations about the Rukh members' 'Banderite' intentions"; some participants "were dragged out of the car, beaten, and the flags were torn to shreds," while the role of "protesting peasants" was played by men in disguise: "in reality these were communist party activists from nearby districts"(Citation: 233).
    The political prisoner Vasyl Ovsienko ended up in the hospital: "the communists thrashed me near Bazar on November 17"(Citation: 232).
  uk: |-
    Застосування грубої сили партійним активом проти активістів Руху: під час спроби рухівців встановити хрест на могилі розстріляних під Базаром «активістів у село не впустили» «з допомогою КДБістів та провокацій про „бандерівські“ наміри рухівців», одних учасників «витягнули з машини, побили, а прапори пошматували», а роль «протестувальних селян» грали переодягнені: «насправді це були компартактивісти з ближніх районів»(Citation: 233).
    Політв'язень Василь Овсієнко потрапив до лікарні: «відлупцювали мене комуністи під Базаром 17 листопада»(Citation: 232).
  ru: |-
    Применение грубой силы партийным активом против активистов Руха: при попытке рухивцев установить крест на могиле расстрелянных под Базаром «активистов в село не впустили» «с помощью кагэбистов и провокаций о „бандеровских“ намерениях руховцев», одних участников «вытащили из машины, избили, а флаги изорвали в клочья», а роль «протестующих селян» играли переодетые: «на самом деле это были компартактивисты из ближних районов»(Citation: 233).
    Политзаключенный Василь Овсиенко попал в больницу: «отколотили меня коммунисты под Базаром 17 ноября»(Citation: 232).
