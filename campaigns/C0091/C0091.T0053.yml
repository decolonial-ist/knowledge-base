description:
  ru: |-
    Насильственное исчезновение ключевого функционера движения: «в ночь с 15 на 16 января 1994 двое вооружённых неизвестных ворвались в секретариат НРУ в Киеве, забрали некоторые документы, искали Бойчишина» - главу секретариата Руха Михайла Бойчишина больше никто не видел.
    Расследование было саботировано: правоохранители «сначала не спешили принимать заявление об исчезновении политика, а затем демонстративно проявляли незаинтересованность в раскрытии преступления», причем «следователей не столько интересовали обстоятельства нападения на Секретариат и исчезновение Бойчишина, сколько финансирование партии»(Citation: 238).
  en: |-
    The forced disappearance of a key functionary of the movement: "on the night of January 15–16, 1994, two armed unknown men burst into the NRU secretariat in Kyiv, took some documents, and searched for Boichyshyn" - Mykhailo Boichyshyn, head of the Rukh secretariat, was never seen again.
    The investigation was sabotaged: law enforcement "at first was in no hurry to accept the report of the politician's disappearance, and then demonstratively displayed disinterest in solving the crime," and "the investigators were interested not so much in the circumstances of the attack on the Secretariat and Boichyshyn's disappearance as in the party's financing"(Citation: 238).
  uk: |-
    Насильницьке зникнення ключового функціонера руху: «у ніч з 15 на 16 січня 1994 двоє озброєних невідомих увірвались в секретаріат НРУ в Києві, забрали деякі документи, шукали Бойчишина» - голову секретаріату Руху Михайла Бойчишина більше ніхто не бачив.
    Розслідування було саботоване: правоохоронці «спочатку не поспішали приймати заяву про зникнення політика, а відтак демонстративно виявляли незацікавленість в розкритті злочину», причому «слідчих не стільки цікавили обставини нападу на Секретаріат та зникнення Бойчишина, як фінансування партії»(Citation: 238).
