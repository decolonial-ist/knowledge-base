description:
  ru: 'Тайная операция московских посланцев, переодетых монахами, по уничтожению древних документов XI–XVII веков: «Сгорели огромный архив и библиотека, погибли грамоты и пожалования… князей, феодалов и гетманов»; «Огонь уничтожил письменную память о независимой украинской политической и духовной жизни Лавры»(Citation: 210).'
  en: 'A covert operation by Muscovite emissaries disguised as monks to destroy ancient documents of the 11th–17th centuries: "The enormous archive and library burned down; the charters and grants… of princes, magnates, and hetmans perished"; "The fire destroyed the written memory of the Lavra''s independent Ukrainian political and spiritual life"(Citation: 210).'
  uk: 'Таємна операція московських посланців, переодягнених ченцями, зі знищення давніх документів XI–XVII століть: «Згоріли величезний архів і бібліотека, загинули грамоти і пожалування… князів, феодалів і гетьманів»; «Вогонь знищив письмову пам''ять про незалежне українське політичне і духовне життя Лаври»(Citation: 210).'
