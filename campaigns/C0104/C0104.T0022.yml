description:
  en: |-
    In November 1921 Russian occupation troops under the command of Kotovsky encircled, near the village of Mali Mynky in the north of Zhytomyr Oblast, a detachment of soldiers of the army of the Ukrainian People's Republic (UNR) who had returned from across the Zbruch to raise an uprising against Soviet rule - this raid is known as the Second Winter Campaign(Citation: 186).
    The captured Ukrainians were taken to the neighbouring village of Bazar, and a visiting Russian commission (the «Extraordinary Five») sentenced 359 men to death(Citation: 500).

    The colonizers staged a public execution for intimidation.
    The day before the shooting they forced the peasants of the village of Bazar to dig a long ditch in a ravine, and brought the residents of the surrounding villages to the execution site(Citation: 500).
    The purpose is recorded in the testimonies gathered by a courier of the Ukrainian underground who visited the site immediately after the execution: the people were herded there «to deter the population from attempts to resist Soviet rule»(Citation: 500).
    A detachment of the invader's army surrounded the 359 captured Ukrainians in a tight ring and shot them before the eyes of their assembled compatriots(Citation: 500).

    The calculation of intimidation is recorded in the sentence itself: the commission resolved to shoot the prisoners in order «to show the entire capitalist world and its hirelings that the power of the Soviets mercilessly punishes anyone who attempts to disrupt its peaceful work»(Citation: 500).
  uk: |-
    У листопаді 1921 року російські окупаційні війська під командуванням Котовського оточили біля села Малі Миньки на півночі Житомирської області загін воїнів армії Української Народної Республіки (УНР), які повернулися з-за Збруча піднімати повстання проти радянської влади, - цей рейд називають Другим зимовим походом(Citation: 186).
    Полонених Українців відвезли до сусіднього села Базар, і російська виїзна комісія («надзвичайна п'ятірка») засудила 359 осіб до розстрілу(Citation: 500).

    Колонізатори влаштували публічну страту для залякування.
    Напередодні розстрілу вони змусили селян із села Базар викопати довгий рів у балці, а до місця страти звезли мешканців навколишніх сіл(Citation: 500).
    Мету записано у свідченнях, які зібрала зв'язкова українського підпілля, що побувала на місці одразу після страти: людей зігнали «для відстрашення населення від спроб спротиву совєтській владі»(Citation: 500).
    Загін армії загарбника оточив 359 полонених Українців щільним кільцем і розстріляв їх на очах у зігнаних співвітчизників(Citation: 500).

    Розрахунок на залякування записано і в самому вироку: комісія постановила розстріляти полонених, щоб «показати всьому капіталістичному світові та його наймитам, що влада Рад безпощадно карає кожного, хто зазіхне порушити її мирну працю»(Citation: 500).
  ru: |-
    В ноябре 1921 года российские оккупационные войска под командованием Котовского окружили у села Малые Миньки на севере Житомирской области отряд воинов армии Украинской Народной Республики (УНР), вернувшихся из-за Збруча поднимать восстание против советской власти, - этот рейд называют Вторым зимним походом(Citation: 186).
    Пленных Украинцев отвезли в соседнее село Базар, и российская выездная комиссия («чрезвычайная пятёрка») приговорила 359 человек к расстрелу(Citation: 500).

    Колонизаторы устроили публичную казнь для устрашения.
    Накануне расстрела они заставили крестьян из села Базар выкопать длинный ров в балке, а к месту казни свезли жителей окрестных сёл(Citation: 500).
    Цель записана в свидетельствах, которые собрала связная украинского подполья, побывавшая на месте сразу после казни: людей согнали «для устрашения населения от попыток сопротивления советской власти»(Citation: 500).
    Отряд армии захватчика окружил 359 пленных Украинцев плотным кольцом и расстрелял их на глазах у согнанных соотечественников(Citation: 500).

    Расчёт на устрашение записан и в самом приговоре: комиссия постановила расстрелять пленных, чтобы «показать всему капиталистическому миру и его наймитам, что власть Советов безпощадно карает всякого покушающегося нарушить ее мирную работу»(Citation: 500).
