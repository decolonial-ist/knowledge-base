description:
  ru: |-
    Массовые убийства заключенных при силовом подавлении восстаний.
    В Норильске «было убито около 100 человек и ранено более 200»(Citation: 201); в Кенгире «Во время подавления восстания погибло и было ранено около 700 заключённых»(Citation: 214).
  en: |-
    Mass killings of prisoners during the forcible suppression of the uprisings.
    In Norilsk, "about 100 people were killed and more than 200 wounded"(Citation: 201); in Kengir, "during the suppression of the uprising, about 700 prisoners were killed or wounded"(Citation: 214).
  uk: |-
    Масові вбивства в'язнів під час силового придушення повстань.
    У Норильську «було вбито близько 100 осіб і поранено понад 200»(Citation: 201); у Кенгірі «Під час придушення повстання загинуло і було поранено близько 700 в'язнів»(Citation: 214).
