name:
  en: Artificial Separatism and the Dismemberment of Territories (January – March 1918)
  uk: Штучний сепаратизм і розчленування територій (січень – березень 1918)
  ru: Искусственный сепаратизм и расчленение территорий (январь – март 1918)
description:
  en: |-
    Having been forced to recognize Ukraine's independence under the Treaty of Brest-Litovsk, the government of Soviet Russia attempted to retain control over the eastern industrial regions.
    To this end, a separate separatist entity (the Donetsk–Kryvyi Rih Soviet Republic) was artificially constructed on the territory of the Donbas and the Kryvyi Rih region, with the aim of directly subordinating these lands to the central Russian authorities, bypassing the UNR(Citation: 25)(Citation: 22).
  uk: |-
    Вимушено визнавши незалежність України за Брестським мирним договором, уряд Радянської Росії спробував утримати контроль над східними промисловими регіонами.
    Для цього на території Донбасу та Криворіжжя було штучно сконструйовано окреме сепаратистське утворення (Донецько-Криворізьку радянську республіку) з метою прямого підпорядкування цих земель центральним російським органам влади в обхід УНР(Citation: 25)(Citation: 22).
  ru: |-
    Вынужденно признав независимость Украины по Брестскому мирному договору, правительство Советской России попыталось удержать контроль над восточными промышленными регионами.
    Для этого на территории Донбасса и Криворожья было искусственно сконструировано отдельное сепаратистское образование (Донецко-Криворожская советская республика) с целью прямого подчинения этих земель центральным российским органам власти в обход УНР(Citation: 25)(Citation: 22).
