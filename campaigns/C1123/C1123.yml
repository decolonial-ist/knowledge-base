name:
  ru: Принудительная мобилизация нохчи на русско-турецкую войну (1677–1679)
  en: Forcible Mobilization of the Nokhchi for the Russo-Turkish War (1677–1679)
  uk: Примусова мобілізація Нохчі на російсько-турецьку війну (1677–1679)
description:
  ru: |-
    Оккупационная администрация Московского Царства массово использовала подчиненных нохчи (окочан) в качестве военного ресурса в конфликтах с Османской империей на дальних фронтах.
    В 1678 году кабардинский князь Каспулат Муцалович Черкасский получил царскую грамоту, в которой историк И. Х. Тхамокова фиксирует награду «за его «многие службы», за то, что он участвовал в крымском и чигиринском походах»(Citation: 85).
    В перечнях архивных документов за 1678 год зафиксирована отписка чугуевского воеводы Ивана Рыхтарова в Разрядный приказ «о походе полка кн.
    Каспулата Муцаловича Черкасского под Чугуев»(Citation: 92).
    Эксплуатация военного потенциала продолжалась и в следующем году: в 1679 году царь Федор Алексеевич издал указ в Посольский приказ о посылке князю Каспулату Муцаловичу Черкасскому грамоты «о несении его полком сторожевой службы в окрестностях Чугуева и Харькова»(Citation: 92), а в отписке самого Каспулата Черкасского в Посольский приказ за тот же год констатируется «о приходе его полка под Валуйки»(Citation: 92).
  en: |-
    The occupation administration of the Tsardom of Muscovy made mass use of the subordinated Nokhchi (the Okochans) as a military resource in conflicts with the Ottoman Empire on distant fronts.
    In 1678, the Kabardian prince Kaspulat Mutsalovich Cherkassky received a tsarist charter in which the historian I. Kh.
    Tkhamokova records a reward «for his «many services», for having taken part in the Crimean and Chyhyryn campaigns»(Citation: 85).
    The registers of archival documents for 1678 record a dispatch from the Chuhuiv voivode Ivan Rykhtarov to the Razriad Prikaz «on the march of the regiment of Prince Kaspulat Mutsalovich Cherkassky to Chuhuiv»(Citation: 92).
    The exploitation of military potential continued the following year as well: in 1679, Tsar Fedor Alekseevich issued a decree to the Ambassadorial Prikaz on sending Prince Kaspulat Mutsalovich Cherkassky a charter «on his regiment's performance of guard duty in the vicinity of Chuhuiv and Kharkiv»(Citation: 92), while a dispatch from Kaspulat Cherkassky himself to the Ambassadorial Prikaz for the same year states «on the arrival of his regiment at Valuyki»(Citation: 92).
  uk: |-
    Окупаційна адміністрація Московського царства масово використовувала підпорядкованих Нохчі (Окочан) як воєнний ресурс у конфліктах з Османською імперією на далеких фронтах.
    У 1678 році кабардинський князь Каспулат Муцалович Черкаський отримав царську грамоту, в якій історик І. Х. Тхамокова фіксує нагороду «за його «многії служби», за те, що він брав участь у кримському і чигиринському походах»(Citation: 85).
    У переліках архівних документів за 1678 рік зафіксовано відписку чугуївського воєводи Івана Рихтарова до Розрядного приказу «про похід полку кн.
    Каспулата Муцаловича Черкаського під Чугуїв»(Citation: 92).
    Експлуатація воєнного потенціалу тривала й наступного року: у 1679 році цар Федір Олексійович видав указ Посольському приказу про надіслання князеві Каспулату Муцаловичу Черкаському грамоти «про несення його полком сторожової служби в околицях Чугуєва і Харкова»(Citation: 92), а у відписці самого Каспулата Черкаського до Посольського приказу за той самий рік констатується «про прихід його полку під Валуйки»(Citation: 92).
