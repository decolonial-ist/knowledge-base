description:
  ru: |-
    Оккупационная администрация направляла подчиненных нохчи (окочан) для участия в вооруженных конфликтах (Чигиринских походах) на территории Украины: историк И. Х. Тхамокова указывает, что в 1678 году кабардинский князь Каспулат Муцалович Черкасский (под чьей властью находились окочане) получил царскую грамоту «за то, что он участвовал в крымском и чигиринском походах»(Citation: 85); в перечнях документов за 1678 год зафиксирована отписка чугуевского воеводы Ивана Рыхтарова в Разрядный приказ «о походе полка кн.
    Каспулата Муцаловича Черкасского под Чугуев»(Citation: 92); а в 1679 году царь Федор Алексеевич издал указ в Посольский приказ «о несении его полком сторожевой службы в окрестностях Чугуева и Харькова»(Citation: 92).
  en: |-
    The occupation administration sent subordinated Nokhchi (Okochans) to take part in armed conflicts (the Chyhyryn campaigns) on the territory of Ukraine: the historian I. Kh.
    Tkhamokova notes that in 1678 the Kabardian prince Kaspulat Mutsalovich Cherkassky (under whose authority the Okochans were) received a tsar's charter «for having taken part in the Crimean and Chyhyryn campaigns»(Citation: 85); the document registers for 1678 record a dispatch from the Chuhuiv voivode Ivan Rykhtarov to the Razryadny Prikaz «on the march of the regiment of Prince Kaspulat Mutsalovich Cherkassky to Chuhuiv»(Citation: 92); and in 1679 Tsar Fedor Alekseevich issued a decree to the Posolsky Prikaz «on his regiment performing guard duty in the vicinity of Chuhuiv and Kharkiv»(Citation: 92).
  uk: |-
    Окупаційна адміністрація направляла підпорядкованих Нохчі (Окочан) для участі у збройних конфліктах (Чигиринських походах) на території України: історикиня І. Х. Тхамокова вказує, що в 1678 році кабардинський князь Каспулат Муцалович Черкаський (під чиєю владою перебували Окочани) отримав царську грамоту «за те, що він брав участь у кримському та чигиринському походах»(Citation: 85); у переліках документів за 1678 рік зафіксовано відписку чугуївського воєводи Івана Рихтарова до Розрядного приказу «про похід полку кн.
    Каспулата Муцаловича Черкаського під Чугуїв»(Citation: 92); а в 1679 році цар Федір Олексійович видав указ Посольському приказу «про несення його полком сторожової служби в околицях Чугуєва та Харкова»(Citation: 92).
