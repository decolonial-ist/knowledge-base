description:
  ru: |-
    Зимой 1847-1848 годов империя поставила крепости, запиравшие Малую Чечню (равнинно-предгорную западную часть Чечни).
    Имперский офицер Полторацкий, участник зимней экспедиции 1847-1848 годов, записал: «Устройством передовой Сунженской линии, от Грозной до Владикавказа, мы очень стеснили Малую Чечню, но постройкой теперь крепостей на Мартане, Валерике и Ассе мы окончательно приводили в исполнение ее смертный приговор»(Citation: 122).
    Историк Н. И. Покровский фиксирует продолжение в 1848 году: «в начале августа заложено было укрепление Урус-Мартан»(Citation: 129).
    Станицы селили казаков на местах сожжённых аулов, крепости держали на той же земле войска.
  en: |-
    In the winter of 1847-1848 the empire built fortresses that locked in Lesser Chechnya (the lowland-piedmont western part of Chechnya).
    Imperial officer Poltoratsky, a participant in the winter expedition of 1847-1848, wrote: "By the building of the forward Sunzha Line, from Groznaya to Vladikavkaz, we greatly constricted Lesser Chechnya, but by now constructing fortresses on the Martan, the Valerik and the Assa we were finally carrying out her death sentence"(Citation: 122).
    Historian N. I. Pokrovsky records the continuation in 1848: "at the beginning of August the fortification of Urus-Martan was founded"(Citation: 129).
    The stanitsas settled Cossacks on the sites of burned auls; the fortresses kept troops on that same land.
  uk: |-
    Узимку 1847-1848 років імперія поставила фортеці, що замикали Малу Чечню (рівнинно-передгірну західну частину Чечні).
    Імперський офіцер Полторацький, учасник зимової експедиції 1847-1848 років, записав: «Улаштуванням передової Сунженської лінії, від Грозної до Владикавказа, ми дуже стиснули Малу Чечню, але побудовою тепер фортець на Мартані, Валерику й Ассі ми остаточно виконували її смертний вирок»(Citation: 122).
    Історик М. І. Покровський фіксує продовження в 1848 році: «на початку серпня закладено було укріплення Урус-Мартан»(Citation: 129).
    Станиці селили козаків на місцях спалених аулів, фортеці тримали на тій самій землі війська.
