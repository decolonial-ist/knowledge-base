description:
  ru: |-
    Переселённых к укреплениям держали заложниками.
    Генерал Слепцов рапортом от 4 октября 1850 года доложил, что содержит в казачьей станице Сунженской, поставленной на месте чеченского аула Дибир-Юрт, заложников (аманатов) - людей, которых империя забирала из семей переселённых, чтобы держать общины в повиновении под угрозой расправы над взятыми: «Аманатовъ же, взятыхъ мною въ удостовѣреніе безусловной покорности переселившихся, я содержу въ ст. Сунженской»(Citation: 107).
    Заложник обеспечивал и резню хутора наиба Дубы (наместника имама Шамиля, руководителя сопротивления горцев российскому завоеванию) 6 марта 1847 года: имперский офицер Полторацкий записал о двух подкупленных племянниках наиба - «в то время, как один из двух был, как аманат (заложник), арестован на гауптвахте в Воздвиженском, другой... вел неприятельский отряд в родное гнездо свое»(Citation: 122).
  en: |-
    Those resettled down to the fortifications were held by hostages.
    General Sleptsov, in a report of 4 October 1850, stated that he was holding in the Cossack stanitsa Sunzhenskaya, planted on the site of the Chechen aul Dibir-Yurt, hostages (amanats) - people the empire took from the families of the resettled in order to hold their communities in obedience under the threat of reprisal against those taken: "The amanats, taken by me in assurance of the unconditional submission of the resettled, I keep in the stanitsa Sunzhenskaya"(Citation: 107).
    A hostage also secured the massacre of the hamlet of naib Duba (a deputy of Imam Shamil, leader of the highlanders' resistance to the Russian conquest) on 6 March 1847: imperial officer Poltoratsky wrote of the naib's two bribed nephews - "while one of the two was, as an amanat (hostage), held under arrest in the guardhouse at Vozdvizhenskoye, the other... was leading the enemy detachment into his own native nest"(Citation: 122).
  uk: |-
    Переселених до укріплень тримали заручниками.
    Генерал Слєпцов рапортом від 4 жовтня 1850 року доповів, що утримує в козачій станиці Сунженській, поставленій на місці чеченського аулу Дібір-Юрт, заручників (аманатів) - людей, яких імперія забирала з родин переселених, щоб тримати громади в підпорядкуванні під загрозою розправи над узятими: «Аманатів же, взятих мною на засвідчення безумовної покірності переселених, я утримую в ст. Сунженській»(Citation: 107).
    Заручник забезпечував і різанину хутора наїба Дуби (намісника імама Шаміля, керівника опору горців російському завоюванню) 6 березня 1847 року: імперський офіцер Полторацький записав про двох підкуплених племінників наїба - «у той час, як один із двох був, як аманат (заручник), заарештований на гауптвахті у Воздвиженському, інший... вів ворожий загін у рідне гніздо своє»(Citation: 122).
