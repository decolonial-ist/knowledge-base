description:
  ru: |-
    Население горных ущелий Малой Чечни (равнинно-предгорной западной части Чечни) империя сселяла к своим укреплениям.
    Генерал Слепцов рапортом генералу Ильинскому от 4 октября 1850 года отчитался: «В два дня, с 30-го сентября по 2-е октября, аулы Галгаевскій, Эйшкалойскій, Начхойскій и Терлоева, разсѣянные хуторами, опустѣли.
    Болѣе 150-ти семействъ населили пространство около Закан-юрта и Казах-кичу» - у имперских укреплений(Citation: 107).
    Рапорт оформляет переселение как просьбу старшин; механизм принуждения тот же рапорт называет прямо - стеснение будущими имперскими поселениями в долине и пример уже переселившихся соотечественников.
  en: |-
    The empire drove the population of the mountain gorges of Lesser Chechnya (the lowland-piedmont western part of Chechnya) down to its fortifications.
    General Sleptsov reported to General Ilyinsky on 4 October 1850: "In two days, from 30 September to 2 October, the auls Galgayevsky, Eyshkaloysky, Nachkhoysky and Terloyev, scattered in hamlets, emptied.
    More than 150 families settled the space around Zakan-yurt and Kazakh-kichu" - next to the imperial fortifications(Citation: 107).
    The report frames the resettlement as a request of the elders; the mechanism of coercion is named plainly by the same report - constraint by the future imperial settlements in the valley and the example of compatriots already resettled.
  uk: |-
    Населення гірських ущелин Малої Чечні (рівнинно-передгірної західної частини Чечні) імперія зселяла до своїх укріплень.
    Генерал Слєпцов рапортом генералу Іллінському від 4 жовтня 1850 року відзвітував: «За два дні, з 30-го вересня по 2-е жовтня, аули Галгаєвський, Ейшкалойський, Начхойський і Терлоєва, розсіяні хуторами, спорожніли.
    Понад 150 родин заселили простір біля Закан-юрта і Казах-кічу» - біля імперських укріплень(Citation: 107).
    Рапорт оформлює переселення як прохання старшин; механізм примусу той самий рапорт називає прямо - стиснення майбутніми імперськими поселеннями в долині та приклад уже переселених співвітчизників.
