description:
  ru: |-
    Империя уничтожала аулы и хутора Малой Чечни (равнинно-предгорной западной части Чечни) удар за ударом.
    В ноябре-декабре 1847 года уничтожены Голен-Гойта и аул наиба Саиб-дулы (наместника имама Шамиля, руководителя сопротивления горцев российскому завоеванию): имперский офицер Полторацкий, участник зимней экспедиции 1847-1848 годов, записал о сожжённых домах горцев (саклях) - «обгоревшие остовы сакель и на земле почерневшие густые лужи крови и всюду разбросанные людские трупы напоминали о так недавно существовавшем богатом ауле Голен-Гойте», а об ауле Саиб-дулы: колонна «приступом взяла аул, все в нем истребила и сожгла до основания»(Citation: 122).
    В ночь на 17 февраля 1850 года по предписанию главнокомандующего на Кавказе, переданному журналом военных происшествий генерала Ильинского, - «истребить тамъ жилища вреднаго и упорнаго въ непокорности населенія» - отряд полковника Слепцова сжёг хутора Музуроева, Нехлоева и аул Ясан-юрт: «Не многіе изъ жителей успѣли спастись...
    Окончивъ истребленіе хуторовъ и аула въ два часа времени, полк.
    Слѣпцовъ началъ отступленіе»(Citation: 107). 15 июня 1851 года истреблён «ряд хуторов и аулов» Гехинского ущелья(Citation: 129), а 16 ноября 1851 года - аул Дахин-Ирзау: рапорт генерала Козловского отмечает «обращеніе въ пепелъ аула Дахин-ирзау съ огромными запасами хлѣба и сѣна»(Citation: 107).
  en: |-
    The empire destroyed the auls and hamlets of Lesser Chechnya (the lowland-piedmont western part of Chechnya) blow after blow.
    In November-December 1847 Golen-Goyta and the aul of naib Saib-dula (a deputy of Imam Shamil, leader of the highlanders' resistance to the Russian conquest) were destroyed: imperial officer Poltoratsky, a participant in the winter expedition of 1847-1848, wrote of the burned highlander houses (saklias) - "the charred skeletons of saklias and, on the ground, blackened thick pools of blood and human corpses scattered everywhere recalled the rich aul of Golen-Goyta that had existed so recently," and of the aul of Saib-dula: the column "took the aul by storm, annihilated everything in it and burned it to the ground"(Citation: 122).
    On the night of 17 February 1850, under an order of the commander-in-chief in the Caucasus conveyed by the journal of military events of General Ilyinsky - "to annihilate there the dwellings of the harmful population stubborn in its insubmission" - the detachment of Colonel Sleptsov burned the hamlets of Muzuroyev and Nekhloyev and the aul Yasan-yurt: "Few of the inhabitants managed to save themselves...
    Having finished the annihilation of the hamlets and the aul in two hours' time, Colonel Sleptsov began his withdrawal"(Citation: 107).
    On 15 June 1851 "a series of hamlets and auls" of the Gekhi gorge was annihilated(Citation: 129), and on 16 November 1851 - the aul Dakhin-Irzau: General Kozlovsky's report notes "the turning to ashes of the aul Dakhin-Irzau with enormous stores of grain and hay"(Citation: 107).
  uk: |-
    Імперія знищувала аули й хутори Малої Чечні (рівнинно-передгірної західної частини Чечні) удар за ударом.
    У листопаді-грудні 1847 року знищені Голен-Гойта й аул наїба Саїб-дули (намісника імама Шаміля, керівника опору горців російському завоюванню): імперський офіцер Полторацький, учасник зимової експедиції 1847-1848 років, записав про спалені будинки горців (саклі) - «обгорілі кістяки сакель і на землі почорнілі густі калюжі крові та всюди розкидані людські трупи нагадували про так недавно існуючий багатий аул Голен-Гойту», а про аул Саїб-дули: колона «приступом узяла аул, все в ньому винищила і спалила дощенту»(Citation: 122).
    У ніч на 17 лютого 1850 року за приписом головнокомандувача на Кавказі, переданим журналом воєнних подій генерала Іллінського, - «винищити там житла шкідливого й упертого в непокірності населення» - загін полковника Слєпцова спалив хутори Музуроєва, Нехлоєва й аул Ясан-юрт: «Небагато з жителів встигли врятуватися...
    Закінчивши винищення хуторів і аулу за дві години часу, полк.
    Слєпцов почав відступ»(Citation: 107). 15 червня 1851 року винищено «низку хуторів і аулів» Гехінської ущелини(Citation: 129), а 16 листопада 1851 року - аул Дахін-Ірзау: рапорт генерала Козловського відзначає «обернення в попіл аулу Дахін-ірзау з величезними запасами хліба та сіна»(Citation: 107).
