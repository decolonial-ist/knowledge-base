description:
  ru: |-
    Резню хутора наиба Дубы (наместника имама Шамиля, руководителя сопротивления горцев российскому завоеванию) 6 марта 1847 года подготовил точечный подкуп внутри семьи наиба.
    Имперский офицер Полторацкий, участник штурма, записал о проводнике отряда: «Это был родной племянник наиба Дубы, подкупленный вместе с братом своим за хороший куш из кармана Меллера» - командовавшего отрядом Меллер-Закомельского(Citation: 122).
    Куплены были оба брата: один вёл войска на родной хутор, второй сидел заложником в Воздвиженском - гарантией, что проводник не передумает.
  en: |-
    The massacre of the hamlet of naib Duba (a deputy of Imam Shamil, leader of the highlanders' resistance to the Russian conquest) on 6 March 1847 was prepared by a targeted bribe inside the naib's family.
    Imperial officer Poltoratsky, a participant in the assault, wrote of the detachment's guide: "This was naib Duba's own nephew, bribed together with his brother for a good cut out of the pocket of Meller" - Meller-Zakomelsky, who commanded the detachment(Citation: 122).
    Both brothers were bought: one led the troops against his native hamlet, the other sat as a hostage in Vozdvizhenskoye - a guarantee that the guide would not change his mind.
  uk: |-
    Різанину хутора наїба Дуби (намісника імама Шаміля, керівника опору горців російському завоюванню) 6 березня 1847 року підготував точковий підкуп усередині родини наїба.
    Імперський офіцер Полторацький, учасник штурму, записав про провідника загону: «Це був рідний племінник наїба Дуби, підкуплений разом із братом своїм за добрий куш із кишені Меллера» - Меллер-Закомельського, що командував загоном(Citation: 122).
    Куплені були обидва брати: один вів війська на рідний хутір, другий сидів заручником у Воздвиженському - гарантією, що провідник не передумає.
