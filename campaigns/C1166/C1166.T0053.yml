description:
  ru: |-
    Каждый удар по аулам Малой Чечни (равнинно-предгорной западной части Чечни) кончался уводом людей.
    Из резни хутора наиба Дубы (наместника имама Шамиля, руководителя сопротивления горцев российскому завоеванию) 6 марта 1847 года отряд, по записи имперского офицера Полторацкого, «приволок за собою 9 человек пленных: трех беззубых стариков и шесть женщин»(Citation: 122).
    В налёте 17 февраля 1850 года взято «плѣнными 54 души обоего пола»(Citation: 107); у переправы через реку Сунжу 15 сентября 1851 года - 38 пленных(Citation: 107); при истреблении Дахин-Ирзау 16 ноября 1851 года «захвачено въ плѣнъ 24 души»(Citation: 107).
    Счёт «душами обоего пола» в рапортах - счёт уведённых гражданских, не бойцов.
  en: |-
    Every strike on the auls of Lesser Chechnya (the lowland-piedmont western part of Chechnya) ended with people being carried off.
    From the massacre of the hamlet of naib Duba (a deputy of Imam Shamil, leader of the highlanders' resistance to the Russian conquest) on 6 March 1847 the detachment, by the record of imperial officer Poltoratsky, "dragged along behind it 9 captives: three toothless old men and six women"(Citation: 122).
    In the raid of 17 February 1850, "54 souls of both sexes" were taken captive(Citation: 107); at the crossing of the Sunzha river on 15 September 1851 - 38 captives(Citation: 107); at the annihilation of Dakhin-Irzau on 16 November 1851, "24 souls were taken captive"(Citation: 107).
    The count in "souls of both sexes" in the reports is a count of civilians carried off, not fighters.
  uk: |-
    Кожен удар по аулах Малої Чечні (рівнинно-передгірної західної частини Чечні) закінчувався виведенням людей.
    З різанини хутора наїба Дуби (намісника імама Шаміля, керівника опору горців російському завоюванню) 6 березня 1847 року загін, за записом імперського офіцера Полторацького, «приволік за собою 9 людей полонених: трьох беззубих стариків і шість жінок»(Citation: 122).
    У нальоті 17 лютого 1850 року взято «полоненими 54 душі обох статей»(Citation: 107); біля переправи через річку Сунжу 15 вересня 1851 року - 38 полонених(Citation: 107); при винищенні Дахін-Ірзау 16 листопада 1851 року «захоплено в полон 24 душі»(Citation: 107).
    Рахунок «душами обох статей» у рапортах - рахунок виведених цивільних, не бійців.
