description:
  ru: |-
    Резня как средство устрашения была осознанной практикой периода - и империя награждала за неё.
    Историк Н. И. Покровский пишет об ударе по хутору наиба Дубы (наместника имама Шамиля, руководителя сопротивления горцев российскому завоеванию): «русское командование не отказывалось и от отдельных коротких ударов с целью устрашения чеченцев.
    Объектом одного из таких ударов избран был хутор наиба Дубы...
    Произошла форменная резня»(Citation: 129).
    За эту резню империя раздала награды: имперский офицер Полторацкий, участник резни, приводит приказ - «за отличное мужество и храбрость, оказанные в деле при истреблении аула Дубы, производятся такие-то, и из прапорщиков в подпоручики - Полторацкий», а Воронцов, наместник на Кавказе, прислал отряду «128 знаков отличия военного ордена» для солдат(Citation: 122).
    Награждение за «дело при истреблении аула» - официальное признание резни образцовой службой.
  en: |-
    Massacre as a means of intimidation was a conscious practice of the period - and the empire gave awards for it.
    Historian N. I. Pokrovsky writes of the strike on the hamlet of naib Duba (a deputy of Imam Shamil, leader of the highlanders' resistance to the Russian conquest): "the Russian command did not renounce separate short strikes aimed at terrifying the Chechens.
    The object of one such strike was the hamlet of naib Duba...
    What took place was an outright massacre"(Citation: 129).
    For this massacre the empire handed out awards: imperial officer Poltoratsky, a participant in the massacre, cites the order - "for the excellent courage and bravery shown in the action at the annihilation of the aul of Duba, such-and-such are promoted, and from ensign to second lieutenant - Poltoratsky," while Vorontsov, the viceroy in the Caucasus, sent the detachment "128 badges of the military order" for the soldiers(Citation: 122).
    An award for "the action at the annihilation of an aul" is official recognition of massacre as exemplary service.
  uk: |-
    Різанина як засіб залякування була усвідомленою практикою періоду - й імперія нагороджувала за неї.
    Історик М. І. Покровський пише про удар по хутору наїба Дуби (намісника імама Шаміля, керівника опору горців російському завоюванню): «російське командування не відмовлялося і від окремих коротких ударів з метою залякування чеченців.
    Об'єктом одного з таких ударів обрано було хутір наїба Дуби...
    Сталася справжня різанина»(Citation: 129).
    За цю різанину імперія роздала нагороди: імперський офіцер Полторацький, учасник різанини, наводить наказ - «за відмінну мужність і хоробрість, виявлені в ділі при винищенні аулу Дуби, провадяться такі-то, і з прапорщиків у підпоручики - Полторацький», а Воронцов, намісник на Кавказі, надіслав загону «128 знаків відзнаки військового ордена» для солдатів(Citation: 122).
    Нагородження за «діло при винищенні аулу» - офіційне визнання різанини зразковою службою.
