description:
  en: |-
    The empire conducted trade with the Chechens through controlled channels.
    The number of state barter yards (points of exchange of goods under the supervision of officials) in the second half of the 1840s "was increased to 11"(Citation: 125).
    In 1850 the empire expanded trade - under the same control: historian N. I. Pokrovsky writes - "In 1850 the commander-in-chief, wishing to bring the unsubdued highlanders closer to the Russians, permitted the opening of a fair near the Groznaya fortress...
    After an exchange of amanats on 15 May an armistice of three days was concluded...
    On our side the sale of weapons and iron was not permitted" (an amanat is a hostage whom the empire took from a community as a guarantee of its submission)(Citation: 129); historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write of "the first Grozny trade fair," to which the highlanders brought "various goods on 500 arbas" (an arba is a two-wheeled cart)(Citation: 125).
    The fair opened with an exchange of hostages; the sale of weapons and iron the empire did not permit.
  uk: |-
    Торгівлю з чеченцями імперія вела через контрольовані канали.
    Число казенних мінових дворів (пунктів обміну товарами під наглядом чиновників) у другій половині 1840-х років «було збільшено до 11»(Citation: 125).
    У 1850 році імперія розширила торгівлю - під тим самим контролем: історик М. І. Покровський пише - «У 1850 р. головнокомандувач, бажаючи зблизити непокірних горців з росіянами, дозволив відкрити біля фортеці Грозної ярмарок...
    Після розміну аманатів 15 травня укладено було перемир'я на три дні...
    З нашого боку не дозволено було продаж зброї та заліза» (аманат - заручник, якого імперія забирала з громади як гарантію її підкорення)(Citation: 129); історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть про «перший Грозненський торговий ярмарок», на який горці привезли «різних товарів на 500-х арбах» (арба - двоколісний віз)(Citation: 125).
    Ярмарок відкривався обміном заручниками; продаж зброї та заліза імперія не дозволяла.
  ru: |-
    Торговлю с чеченцами империя вела через контролируемые каналы.
    Число казённых меновых дворов (пунктов обмена товарами под надзором чиновников) во второй половине 1840-х годов «было увеличено до 11»(Citation: 125).
    В 1850 году империя расширила торговлю - под тем же контролем: историк Н. И. Покровский пишет - «В 1850 г. главнокомандующий, желая сблизить непокорных горцев с русскими, разрешил открыть около крепости Грозной ярмарку...
    После размена аманатов 15 мая заключено было перемирие на три дня...
    С нашей стороны недозволена была продажа оружия и железа» (аманат - заложник, которого империя забирала из общины как гарантию её подчинения)(Citation: 129); историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут о «первой Грозненской торговой ярмарке», на которую горцы привезли «разных товаров на 500-х арбах» (арба - двухколёсная повозка)(Citation: 125).
    Ярмарка открывалась обменом заложниками; продажу оружия и железа империя не разрешала.
