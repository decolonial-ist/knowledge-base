description:
  ru: |-
    Земля выселенных обществ Малой Чечни (равнинно-предгорной западной части Чечни) уходила империи.
    Генерал Слепцов рапортом генералу Ильинскому от 4 октября 1850 года подвёл итог сселения горных аулов: «богатыя земли между Сунжею и Русскою дорогою достались въ безотчетное владѣніе правительства, такъ что вся плоскость Малой Чечни нынѣ совершенно очищена отъ враждебнаго населенія»(Citation: 107).
    «Безотчетное владение» - формула самого рапорта: земля взята без какого-либо оформления прав прежних владельцев.
  en: |-
    The land of the evicted communities of Lesser Chechnya (the lowland-piedmont western part of Chechnya) passed to the empire.
    General Sleptsov, in a report to General Ilyinsky of 4 October 1850, summed up the displacement of the mountain auls: "the rich lands between the Sunzha and the Russian road have passed into the unaccountable possession of the government, so that the entire plain of Lesser Chechnya is now completely cleared of the hostile population"(Citation: 107).
    "Unaccountable possession" is the report's own formula: the land was taken without any registration of the former owners' rights.
  uk: |-
    Земля виселених товариств Малої Чечні (рівнинно-передгірної західної частини Чечні) відходила імперії.
    Генерал Слєпцов рапортом генералу Іллінському від 4 жовтня 1850 року підбив підсумок зселення гірських аулів: «багаті землі між Сунжею і Російською дорогою дісталися в беззвітне володіння уряду, так що вся площина Малої Чечні нині цілком очищена від ворожого населення»(Citation: 107).
    «Беззвітне володіння» - формула самого рапорту: землю взято без жодного оформлення прав колишніх власників.
