description:
  ru: |-
    Короткие внезапные удары были рабочим режимом войск в Малой Чечне (равнинно-предгорной западной части Чечни) 1847-1851 годов.
    Отряд на хутор наиба Дубы (наместника имама Шамиля, руководителя сопротивления горцев российскому завоеванию) выступил «5-го марта, в 10 часов ночи» и ударил на рассвете(Citation: 122); налёт 17 февраля 1850 года занял «два часа времени»(Citation: 107); в июне, сентябре и ноябре 1851 года по аулам били отряды генералов Слепцова, Барятинского и Козловского(Citation: 107)(Citation: 129).
    Рамку практики дал историк Н. И. Покровский: «отдельные короткие удары с целью устрашения чеченцев»(Citation: 129).
  en: |-
    Short surprise strikes were the working mode of the troops in Lesser Chechnya (the lowland-piedmont western part of Chechnya) in 1847-1851.
    The detachment against the hamlet of naib Duba (a deputy of Imam Shamil, leader of the highlanders' resistance to the Russian conquest) set out "on 5 March, at 10 o'clock at night" and struck at dawn(Citation: 122); the raid of 17 February 1850 took "two hours' time"(Citation: 107); in June, September and November 1851 the auls were struck by the detachments of Generals Sleptsov, Baryatinsky and Kozlovsky(Citation: 107)(Citation: 129).
    The frame of the practice was given by historian N. I. Pokrovsky: "separate short strikes aimed at terrifying the Chechens"(Citation: 129).
  uk: |-
    Короткі раптові удари були робочим режимом військ у Малій Чечні (рівнинно-передгірній західній частині Чечні) 1847-1851 років.
    Загін на хутір наїба Дуби (намісника імама Шаміля, керівника опору горців російському завоюванню) виступив «5-го березня, о 10 годині ночі» і вдарив на світанку(Citation: 122); наліт 17 лютого 1850 року зайняв «дві години часу»(Citation: 107); у червні, вересні й листопаді 1851 року по аулах били загони генералів Слєпцова, Барятинського й Козловського(Citation: 107)(Citation: 129).
    Рамку практики дав історик М. І. Покровський: «окремі короткі удари з метою залякування чеченців»(Citation: 129).
