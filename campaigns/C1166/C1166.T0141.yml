description:
  en: |-
    The squeezing of the Chechens out of the mountains was built on depriving them of the means of life - and the empire wrote about this openly.
    Vorontsov, viceroy and commander-in-chief in the Caucasus, reported to Minister of War Chernyshev in an official letter (otnosheniye) of 25 October 1847: "constrained in their means of life, seeing their constant failures, the Chechens waver, and a large number of families are already resettling into our bounds"(Citation: 126).
    General Sleptsov, in a report of 4 October 1850, built on this a calculation for the future: the mountain communities, "constrained by our future settlements in the valley, ... will inevitably follow the example of their compatriots" - that is, they too would come down to the fortifications(Citation: 107).
  uk: |-
    Видавлювання чеченців з гір будувалося на позбавленні засобів життя - й імперія писала про це відкрито.
    Воронцов, намісник і головнокомандувач на Кавказі, доповів військовому міністрові Чернишову службовим листом (отношенієм) від 25 жовтня 1847 року: «стиснуті в засобах життя, бачачи постійні свої невдачі, чеченці вагаються і у великому числі родин уже переселяються в наші межі»(Citation: 126).
    Генерал Слєпцов рапортом від 4 жовтня 1850 року будував на цьому розрахунок на майбутнє: гірські товариства, «стиснуті майбутніми нашими поселеннями на долині, ... неминуче підуть за прикладом своїх співвітчизників» - тобто теж зійдуть до укріплень(Citation: 107).
  ru: |-
    Выдавливание чеченцев с гор строилось на лишении средств жизни - и империя писала об этом открыто.
    Воронцов, наместник и главнокомандующий на Кавказе, доложил военному министру Чернышеву служебным письмом (отношением) от 25 октября 1847 года: «стесненные в средствах жизни, видя постоянные свои неудачи, чеченцы колеблются и в большом числе семейств уже переселяются в наши пределы»(Citation: 126).
    Генерал Слепцов рапортом от 4 октября 1850 года строил на этом расчёт на будущее: горные общества, «стѣсненные будущими нашими поселеніями на долинѣ, ... неизбѣжно послѣдуютъ примѣру своихъ соотечественниковъ» - то есть тоже сойдут к укреплениям(Citation: 107).
