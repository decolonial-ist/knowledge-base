description:
  ru: 'Расправы над повстанцами для сохранения имперского контроля: «Царское правительство прибегло к жестоким репрессиям против участников восстания, отменило конституцию Королевства Польского и, одновременно, большинство признаков автономии польских земель… ввело военное положение (продлившееся четверть века)»(Citation: 195).'
  en: 'Reprisals against the insurgents to preserve imperial control: "The tsarist government resorted to brutal repressions against the participants of the uprising, abolished the constitution of the Kingdom of Poland and, simultaneously, most attributes of the Polish lands'' autonomy… introduced martial law (which lasted a quarter of a century)"(Citation: 195).'
  uk: 'Розправи над повстанцями для збереження імперського контролю: «Царський уряд вдався до жорстоких репресій проти учасників повстання, скасував конституцію Королівства Польського і, одночасно, більшість ознак автономії польс. земель… запровадив воєнний стан (який тривав чверть століття)»(Citation: 195).'
