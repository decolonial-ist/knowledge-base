name:
  ru: Подавление Ноябрьского восстания (1830–1831)
  en: Suppression of the November Uprising (1830–1831)
  uk: Придушення Листопадового повстання (1830–1831)
description:
  ru: |-
    Регулярная армия Российской империи подавляет национально-освободительное восстание: повстанческие отряды на Волыни, Житомирщине, Подолье и Киевщине «были в апреле—мае 1831 разгромлены царскими войсками», после чего «Царское правительство прибегло к жестоким репрессиям против участников восстания»(Citation: 195).
    Начинается эпоха закручивания гаек на Правобережье.
  en: |-
    The Russian Empire's regular army suppresses a national liberation uprising: the insurgent detachments in Volhynia, the Zhytomyr region, Podillia, and the Kyiv region "were routed by the tsarist troops in April–May 1831," after which "the tsarist government resorted to brutal repressions against the participants of the uprising"(Citation: 195).
    The era of tightening the screws on the Right Bank begins.
  uk: |-
    Регулярна армія Російської імперії придушує національно-визвольне повстання: повстанські загони на Волині, Житомирщині, Поділлі та Київщині «були в квітні—травні 1831 розгромлені царськими військами», після чого «Царський уряд вдався до жорстоких репресій проти учасників повстання»(Citation: 195).
    Починається епоха закручування гайок на Правобережжі.
