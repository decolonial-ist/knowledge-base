name:
  en: Devastation of the Kachkalyk villages of the Nokhchi and displacement of their inhabitants beyond the mountains after the Dadi-Yurt terror (1819)
  uk: Розорення качкаликівських селищ Нохчі та витіснення жителів за гори після даді-юртівського терору (1819)
  ru: Разорение качкалыкских селений нохчи и вытеснение жителей за горы после дади-юртского террора (1819)
description:
  en: |-
    After the demonstrative destruction of Dadi-Yurt, General Yermolov moved on to devastate the remaining Nokhchi villages of the Kachkalyk plain and drive their inhabitants off the land.
    The historian D. A. Khozhaev writes that under Yermolov “cruel punitive raids on peaceful Caucasian auls — with the annihilation of the population, houses, crops, orchards, and forests, the driving off of livestock, and the plundering of property — which disgraced Russian arms, became the rule,” and following Dadi-Yurt the Kachkalyk villages of Isti-Su, Noiberdy, Alleroi, and others were “taken by storm and destroyed”(Citation: 95).
    Yermolov himself describes the campaign in his “Notes”: on September 30, 1819, he “himself set out with 6 battalions and 16 artillery pieces toward the Kachkalyk villages”; on October 2 he attacked “the village of Goryachevskaya, the strongest of them” (also known as Isti-Su), and a day later devastated Noen-Berdy and Allayar-Aul: “from the first the Chechens were driven out by heavy cannonade, the latter was abandoned by them…
    Both were utterly devastated”(Citation: 96).
    At the same time, Major General Sysoev invaded Chechen land from Groznaya through Khan-Kale, drawing the forces of the Chechens away from the Kachkalyk plain(Citation: 96).
    The imperial historian Potto confirms: the Apsheron men “went in with bayonets without firing a shot, burst into the aul and committed it to the flames,” while Noim-Berdy and Allayar-Aul “were utterly devastated”(Citation: 75).
    One village survived by submitting: Yermolov writes that “the village of Khangeldy begged for mercy…
    The Aksai owners vouched for its inhabitants, and mercy was granted them”(Citation: 96), while Potto adds that “the aul of Khosh-Geldy met Yermolov with bread and salt and was spared”(Citation: 75).
    The remaining villages the punitive forces found empty, because the Dadi-Yurt terror had driven the inhabitants off the plain in advance.
    Yermolov admits that “in none of the villages were there wives and children; the property had likewise been carried away,” for “the example of Dadan-Yurt spread terror everywhere”(Citation: 96).
    Potto writes that “the remaining auls were empty - their inhabitants had fled beyond the mountains,” and “within a few days the Kumyk plain was completely cleared of the predatory Chechens”(Citation: 75).
    On October 5 the troops returned to Vnezapnaya(Citation: 96).
  uk: |-
    Після показового знищення Даді-Юрта генерал Єрмолов рушив розоряти решту сіл Нохчі качкалицької рівнини та зганяти їхніх мешканців із землі.
    Історик Д. А. Хожаєв пише, що за Єрмолова «стали правилом жорстокі каральні набіги на мирні кавказькі аули, що ганьбили російську зброю, — зі знищенням населення, будинків, посівів, садів і лісів, викраденням худоби та розграбуванням майна», і слідом за Даді-Юртом качкалицькі села Істі-Су, Нойберди, Аллерой та інші були «взяті штурмом і знищені»(Citation: 95).
    Сам Єрмолов у своїх «Записках» описує похід: тридцятого вересня 1819 року він «сам пішов із 6-ма батальйонами та 16-ма гарматами артилерії до сіл качкалицьких», другого жовтня атакував «село Горячевське, найсильніше з них» (воно ж Істі-Су), а через день розорив Ноєн-Берди та Аллаяр-аул: «з першого Чеченців вигнано сильною канонадою, останнє було ними залишене…
    Обидва розорені цілковито»(Citation: 96).
    Водночас генерал-майор Сисоєв із Грозної вдерся в чеченську землю через Хан-Кале, відтягуючи на себе сили Чеченців із качкалицької рівнини(Citation: 96).
    Імперський історик Потто підтверджує: апшеронці «без пострілу пішли в багнети, увірвалися в аул і віддали його полум’ю», а Ноїм-Берди та Аллаяр-Аул «були цілковито розорені»(Citation: 75).
    Одне село встояло, підкорившись: Єрмолов пише, що «село Хангельди просило пощади…
    Аксаївські власники ручалися за його мешканців, і їм дано пощаду»(Citation: 96), а Потто додає, що «аул Хош-Гельди зустрів Єрмолова хлібом-сіллю і був пощаджений»(Citation: 75).
    Решту сіл карателі знайшли порожніми, бо даді-юртівський терор заздалегідь зігнав мешканців із рівнини.
    Єрмолов визнає, що «в жодному з сіл не було жінок і дітей, майно також було вивезене», адже «приклад Дадан-юрта поширив усюди жах»(Citation: 96).
    Потто пише, що «решта аулів були порожні - їхні мешканці втекли за гори», і «Кумицька рівнина за кілька днів була цілковито очищена від хижих Чеченців»(Citation: 75).
    П’ятого жовтня війська повернулися до Внєзапної(Citation: 96).
  ru: |-
    После показательного уничтожения Дади-юрта генерал Ермолов двинулся разорять остальные нохчийские сёла качкалыкской плоскости и сгонять их жителей с земли.
    Историк Д. А. Хожаев пишет, что при Ермолове «стали правилом позорившие русское оружие жестокие карательные набеги на мирные кавказские аулы, с уничтожением населения, домов, посевов, садов и лесов, угоном скота и разграблением имущества», и вслед за Дади-юртом качкалыкские деревни Исти-су, Нойберды, Аллерой и другие были «взяты штурмом и уничтожены»(Citation: 95).
    Сам Ермолов в своих «Записках» описывает поход: тридцатого сентября 1819 года он «сам пошёл с 6-ю баталионами и 16-ю орудиями артиллерии к деревням Качкалыкским», второго октября атаковал «деревню Горячевскую, сильнейшую из них» (она же Исти-су), а через день разорил Ноен-берды и Аллаяр-аул, «из первой выгнаты чеченцы сильною канонадою, последняя была ими оставлена…
    Обе разорены совершенно»(Citation: 96).
    Одновременно генерал-майор Сысоев из Грозной вторгся в чеченскую землю через Хан-Кале, оттягивая на себя силы чеченцев с качкалыкской плоскости(Citation: 96).
    Имперский историк Потто подтверждает: апшеронцы «без выстрела пошли в штыки, ворвались в аул и предали его пламени», а Ноим-Берды и Аллаяр-Аул «были совершенно разорены»(Citation: 75).
    Одно село устояло, подчинившись: Ермолов пишет, что «деревня Хангельды просила пощады…
    Аксаевские владельцы ручались за жителей оных, и им дана пощада»(Citation: 96), а Потто добавляет, что «аул Хош-Гельды встретил Ермолова хлебом-солью и был пощажён»(Citation: 75).
    Остальные сёла каратели нашли пустыми, потому что дади-юртский террор согнал жителей с плоскости заранее.
    Ермолов признаёт, что «ни в одной из деревень не было жён и детей, имущество также было вывезено», ибо «пример Дадан-юрта распространил повсюду ужас»(Citation: 96).
    Потто пишет, что «остальные аулы были пусты - жители их бежали за горы», и «Кумыкская плоскость в несколько дней была совершенно очищена от хищных чеченцев»(Citation: 75).
    Пятого октября войска вернулись во Внезапную(Citation: 96).
