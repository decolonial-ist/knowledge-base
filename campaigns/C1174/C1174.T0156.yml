description:
  en: |-
    In February 1919 the Volunteer Army demanded, through the Mountain government, the handing over of all Red Army men sheltering in Chechnya: "About 700 people were indeed prepared for handover, but this action met the resolute resistance of the Goity Soviet and the open discontent of the people," write historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov (the Goity Soviet - the soviet of the village of Goity); General Shatilov reported: "...unrest is taking place among the Chechens, as part of them do not want the Bolsheviks handed over"(Citation: 125).
    The demand to hand over "all Red Army men, Bolsheviks and abreks" entered the April ultimatum as well(Citation: 125).
  uk: |-
    У лютому 1919 року Добровольча армія зажадала через Гірський уряд видати всіх червоноармійців, які переховувалися в Чечні: «Близько 700 осіб дійсно були підготовлені до видачі, однак ця акція зустріла рішучий опір Гойтинської Ради і відкрите невдоволення народу», - пишуть історики Я. З. Ахмадов і Е. Х. Хасмагомадов (Гойтинська Рада - рада села Гойти); генерал Шатилов доносив: «...серед чеченців відбуваються заворушення, оскільки частина їх не бажає видачі більшовиків»(Citation: 125).
    Вимога видачі «всіх червоноармійців, більшовиків і абреків» увійшла і до квітневого ультиматуму(Citation: 125).
  ru: |-
    В феврале 1919 года Добровольческая армия потребовала через Горское правительство выдать всех укрывшихся в Чечне красноармейцев: «Около 700 человек действительно были подготовлены к выдаче, однако эта акция встретила решительное сопротивление Гойтинского Совета и открытое недовольство народа», - пишут историки Я. З. Ахмадов и Э. Х. Хасмагомадов (Гойтинский Совет - совет села Гойты); генерал Шатилов доносил: «...среди чеченцев происходят волнения, так как часть их не желает выдачи большевиков»(Citation: 125).
    Требование выдачи «всех красноармейцев, большевиков и абреков» вошло и в апрельский ультиматум(Citation: 125).
