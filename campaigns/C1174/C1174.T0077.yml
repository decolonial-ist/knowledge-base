description:
  en: |-
    At the end of February 1919 four regiments of the Volunteer Army - the division of General Shatilov - attacked the village of Goity with artillery, for its refusal to hand over the Red Army men sheltering there; detachments from the surrounding villages came to its aid, and the Denikinites retreated toward Grozny(Citation: 125).
    On 23 March the army struck from Grozny at Gudermes(Citation: 125).
    From 27 to 30 March battles raged for Alkhan-Yurt: "The shelling of the village was conducted by 24 guns and an armored train that had taken position near the Ermolovskaya stanitsa... the village was captured"; more than 400 of its defenders died(Citation: 125).
    For failure to fulfill the demand to return captured Cossacks the army stormed Tsatsan-Yurt - historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "On 9 April 1919 the White troops attacked and by nightfall captured the village of Tsatsan-Yurt.
    In the course of the fierce battle more than 500 people died on the Chechen side, including over 400 Tsatsan-Yurt villagers proper"(Citation: 125).
    In October the command threw against Chechnya a force of 15 thousand soldiers and officers taken off the advance on Moscow: "On 5 October stubborn three-day battles began for Chechen-Aul, after which the villages situated near the railway were subjected to a new devastation"(Citation: 125).
  uk: |-
    Наприкінці лютого 1919 року чотири полки Добровольчої армії - дивізія генерала Шатилова - з артилерією атакували село Гойти за відмову видати червоноармійців, які там переховувалися; на допомогу селу вийшли загони навколишніх селищ, і денікінці відступили до Грозного(Citation: 125). 23 березня армія вдарила з Грозного на Гудермес(Citation: 125).
    З 27 по 30 березня йшли бої за Алхан-Юрт: «Обстріл села вели 24 гармати і бронепоїзд, що зайняв позицію біля станиці Єрмоловської... село було захоплено»; захисників загинуло понад 400(Citation: 125).
    За невиконання вимоги повернути захоплених козаків армія штурмувала Цацан-Юрт - історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «9 квітня 1919 р. білі війська атакували і до ночі захопили село Цацан-Юрт.
    У ході жорстокого бою з чеченського боку загинуло понад 500 осіб, включно з понад 400 власне цацан-юртівцями»(Citation: 125).
    У жовтні командування кинуло проти Чечні угруповання в 15 тисяч солдатів і офіцерів, зняте з наступу на Москву: «5 жовтня почалися запеклі триденні бої за Чечен-Аул, після чого нового розгрому зазнали селища, розташовані поряд із залізницею»(Citation: 125).
  ru: |-
    В конце февраля 1919 года четыре полка Добровольческой армии - дивизия генерала Шатилова - с артиллерией атаковали село Гойты за отказ выдать укрывшихся красноармейцев; на помощь селу вышли отряды окрестных селений, и деникинцы отступили к Грозному(Citation: 125). 23 марта армия ударила из Грозного на Гудермес(Citation: 125).
    С 27 по 30 марта шли бои за Алхан-Юрт: «Обстрел села вели 24 орудия и бронепоезд, занявший позицию у станицы Ермоловской... село было захвачено»; защитников погибло более 400(Citation: 125).
    За невыполнение требования вернуть захваченных казаков армия штурмовала Цацан-Юрт - историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «9 апреля 1919 г. белые войска атаковали и к ночи захватили село Цацан-Юрт.
    В ходе жестокого сражения с чеченской стороны погибло более 500 человек, включая свыше 400 собственно цацан-юртовцев»(Citation: 125).
    В октябре командование бросило против Чечни группировку в 15 тысяч солдат и офицеров, снятую с наступления на Москву: «5 октября начались упорные трехдневные бои за Чечен-Аул, после чего новому разгрому подверглись селения, расположенные рядом с железной дорогой»(Citation: 125).
