name:
  en: 'Denikin''s terror in Chechnya: destroyed auls and 15 thousand dead (1919)'
  uk: 'Денікінський терор у Чечні: зруйновані аули і 15 тисяч загиблих (1919)'
  ru: 'Деникинский террор в Чечне: разрушенные аулы и 15 тысяч погибших (1919)'
description:
  en: |-
    In 1919 the Volunteer Army of General Denikin conquered Chechnya with ultimatums, assaults and the burning of villages - the year it left behind ended with 21 destroyed auls and 15 thousand dead.
    After the fall of the empire (campaign C1189) the peoples of the North Caucasus tried to live in a state of their own: in May 1918 the highland political forces proclaimed the independent Mountain Republic from the Black Sea to the Caspian; its first government was headed by the Chechen Tapa Chermoyev, an oil industrialist (campaign C1173), its parliament by the Ingush Vassan-Girey Dzhabagiev(Citation: 125).
    In February 1919 the Terek oblast was occupied by the Volunteer Army - troops of former imperial officers under the command of Denikin, fighting the Bolsheviks for the return of Russia within its former borders; historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "The main force of the Volunteer Army was made up of Cossacks, and therefore the actions of the Denikinites in the Terek oblast were aimed, first of all, at restoring the privileged position of the Cossacks"(Citation: 125).
    Denikin did not recognize the Mountain Republic: he refused to receive the delegation of its government; General Lyakhov, appointed ruler of the Terek oblast, agreed to regard the republic's parliament as no more than "a consultative organ attached to his person", and as ruler of Chechnya the Volunteer Army appointed General Aliev(Citation: 125).
    At the negotiations with the Mountain government Lyakhov declared: "...There cannot be two masters in one house.
    Where I pay, I shall be the master.
    I demand submission to my authority, and whoever does not submit to it, let him blame himself for what will come of it"(Citation: 125).
    The Denikin command recorded of the resistance: "The bitterness of the Chechens and their daring reach the utmost degree"(Citation: 125).
    The year's total was drawn by the Soviet survey of 1920, which historian E. F. Zhupikova cites: "21 destroyed auls and 15 thousand dead Chechens is what the Denikin army left behind it"(Citation: 256).
  uk: |-
    У 1919 році Добровольча армія генерала Денікіна завойовувала Чечню ультиматумами, штурмами і спаленням сіл - за рік після неї залишилися 21 зруйнований аул і 15 тисяч загиблих.
    Після падіння імперії (кампанія C1189) народи Північного Кавказу спробували жити своєю державою: у травні 1918 року горські політичні сили проголосили незалежну Гірську Республіку від Чорного моря до Каспійського, перший уряд очолив чеченець Тапа Чермоєв - нафтопромисловець (кампанія C1173), парламент - інгуш Вассан-Гірей Джабагієв(Citation: 125).
    У лютому 1919 року Терську область зайняла Добровольча армія - війська колишніх імперських офіцерів під командуванням Денікіна, що воювали з більшовиками за повернення Росії в колишніх кордонах; історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «Головну силу Добровольчої армії становили козаки, а тому дії денікінців у Терській області спрямовані, насамперед, на відновлення привілейованого становища козацтва»(Citation: 125).
    Гірську Республіку Денікін не визнав: делегацію її уряду відмовився прийняти; генерал Ляхов, призначений правителем Терської області, погодився вважати парламент республіки лише «дорадчим органом при своїй особі», а правителем Чечні Добровольча армія призначила генерала Алієва(Citation: 125).
    На переговорах з Гірським урядом Ляхов заявив: «...В одному домі двох господарів бути не може.
    Там, де я плачу, я буду господар.
    Я вимагаю підпорядкування моїй владі, а хто їй не підпорядковується, то нехай сам винить себе за те, що з цього вийде»(Citation: 125).
    Денікінське командування записало про опір: «Запеклість чеченців та їхня відвага сягають крайнього прояву»(Citation: 125).
    Підсумок року підбило радянське обстеження 1920 року, яке наводить історик Є. Ф. Жупікова: «21 зруйнований аул, 15 тис. загиблих чеченців залишила після себе денікінська армія»(Citation: 256).
  ru: |-
    В 1919 году Добровольческая армия генерала Деникина завоёвывала Чечню ультиматумами, штурмами и сожжением сёл - за год после неё остались 21 разрушенный аул и 15 тысяч погибших.
    После падения империи (кампания C1189) народы Северного Кавказа попробовали жить своим государством: в мае 1918 года горские политические силы провозгласили независимую Горскую Республику от Чёрного моря до Каспийского, первое правительство возглавил чеченец Тапа Чермоев - нефтепромышленник (кампания C1173), парламент - ингуш Вассан-Гирей Джабагиев(Citation: 125).
    В феврале 1919 года Терскую область заняла Добровольческая армия - войска бывших имперских офицеров под командованием Деникина, воевавшие с большевиками за возвращение России в прежних границах; историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Главную силу Добровольческой армии составляли казаки, а потому действия деникинцев в Терской области направлены, прежде всего, на восстановление привилегированного положения казачества»(Citation: 125).
    Горскую Республику Деникин не признал: делегацию её правительства отказался принять; генерал Ляхов, назначенный правителем Терской области, согласился считать парламент республики лишь «совещательным органом при своей особе», а правителем Чечни Добровольческая армия назначила генерала Алиева(Citation: 125).
    На переговорах с Горским правительством Ляхов заявил: «...В одном доме двух хозяев быть не может.
    Там, где я плачу, я буду хозяин.
    Я требую подчинения моей власти, а кто ей не подчиняется, то пусть сам винит себя за то, что из этого выйдет»(Citation: 125).
    Деникинское командование записало о сопротивлении: «Ожесточение чеченцев и их удаль достигают крайнего проявления»(Citation: 125).
    Итог года подвело советское обследование 1920 года, которое приводит историк Е. Ф. Жупикова: «21 разрушенный аул, 15 тыс. погибших чеченцев оставила после себя деникинская армия»(Citation: 256).
