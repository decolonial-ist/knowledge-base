description:
  ru: |-
    19 февраля 1919 года генерал Ляхов на съезде представителей Чечни в Алдах объявил требования Добровольческой армии, включая мобилизацию: «Эти требования выдвигались в ультимативной форме и не подлежали обсуждению», - пишут историки Я. З. Ахмадов и Э. Х. Хасмагомадов, - и съезд оставил ультиматум без ответа(Citation: 125).
    В апреле 1919 года командование выдвинуло новый ультиматум: «полную покорность чеченцев назначенному правителю Чечни, выдачу всех красноармейцев, большевиков и абреков, а также всех ценностей, вывезенных в Чечню Красной Армией... возвращение расхищенных материалов с железной дороги и организация поставок продовольствия и фуража для армии»; за невыполнение отдельного требования - немедленно вернуть группу казаков, захваченных в окрестностях села, - армия штурмом взяла Цацан-Юрт(Citation: 125).
  en: |-
    On 19 February 1919 General Lyakhov, at a congress of Chechnya's representatives in Aldy, announced the demands of the Volunteer Army, including mobilization: "These demands were put forward in the form of an ultimatum and were not subject to discussion," write historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov, and the congress left the ultimatum without an answer(Citation: 125).
    In April 1919 the command put forward a new ultimatum: "the complete submission of the Chechens to the appointed ruler of Chechnya, the handing over of all Red Army men, Bolsheviks and abreks, as well as of all the valuables carried off into Chechnya by the Red Army... the return of the pilfered materials from the railway and the organization of deliveries of provisions and fodder for the army"; for failure to fulfill a separate demand - to immediately return a group of Cossacks captured in the vicinity of the village - the army took Tsatsan-Yurt by storm(Citation: 125).
  uk: |-
    19 лютого 1919 року генерал Ляхов на з'їзді представників Чечні в Алдах оголосив вимоги Добровольчої армії, включно з мобілізацією: «Ці вимоги висувалися в ультимативній формі і не підлягали обговоренню», - пишуть історики Я. З. Ахмадов і Е. Х. Хасмагомадов, - і з'їзд залишив ультиматум без відповіді(Citation: 125).
    У квітні 1919 року командування висунуло новий ультиматум: «повну покірність чеченців призначеному правителю Чечні, видачу всіх червоноармійців, більшовиків і абреків, а також усіх цінностей, вивезених у Чечню Червоною Армією... повернення розкрадених матеріалів із залізниці та організацію постачання продовольства і фуражу для армії»; за невиконання окремої вимоги - негайно повернути групу козаків, захоплених в околицях села, - армія штурмом узяла Цацан-Юрт(Citation: 125).
