description:
  ru: |-
    В феврале 1919 года Добровольческая армия объявила на съезде в Алдах мобилизацию горцев - за счёт самих сёл: «селения обязаны были экипировать и содержать мобилизованных за свой счет»(Citation: 125).
    Назначенный правителем Чечни генерал Алиев провёл мобилизацию: «Собранные таким образом 200-300 всадников (вместе с кабардинцами и ингушами) принимали участие в подавлении крестьянских волнений на Ставрополье»(Citation: 125).
    Историк Е. Ф. Жупикова передаёт вывод исследователя П. Аптекаря о причинах восстания чеченцев против Деникина: «насильственные мобилизации и реквизиции продовольствия для армии Деникина»(Citation: 256).
  en: |-
    In February 1919 the Volunteer Army announced at the congress in Aldy a mobilization of the highlanders - at the villages' own expense: "the villages were obliged to equip and maintain the mobilized at their own cost"(Citation: 125).
    General Aliev, the appointed ruler of Chechnya, carried out the mobilization: "The 200-300 horsemen assembled in this way (together with Kabardians and Ingush) took part in the suppression of peasant unrest in the Stavropol region"(Citation: 125).
    Historian E. F. Zhupikova conveys the conclusion of the researcher P. Aptekar on the causes of the Chechens' uprising against Denikin: "the forcible mobilizations and requisitions of provisions for Denikin's army"(Citation: 256).
  uk: |-
    У лютому 1919 року Добровольча армія оголосила на з'їзді в Алдах мобілізацію горців - коштом самих сіл: «селища зобов'язані були споряджати й утримувати мобілізованих за свій рахунок»(Citation: 125).
    Призначений правителем Чечні генерал Алієв провів мобілізацію: «Зібрані в такий спосіб 200-300 вершників (разом з кабардинцями та інгушами) брали участь у придушенні селянських заворушень на Ставропіллі»(Citation: 125).
    Історик Є. Ф. Жупікова передає висновок дослідника П. Аптекаря про причини повстання чеченців проти Денікіна: «насильницькі мобілізації та реквізиції продовольства для армії Денікіна»(Citation: 256).
