description:
  en: 'The use of the regular army to suppress the January Uprising: Muravyov and Berg, appointed by the emperor, "resorted to brutal repressions and terror with the aim of suppressing the uprising"; "hundreds of Poles were executed, thousands exiled to Siberia or given over to the army"(Citation: 195).'
  uk: 'Використання регулярної армії для придушення Січневого повстання: призначені імператором Муравйов і Берг «вдалися до жорстоких репресій і терору з метою придушення повстання»; «сотні поляків були страчені, тисячі вислані в Сибір або віддані в армію»(Citation: 195).'
  ru: 'Использование регулярной армии для подавления Январского восстания: назначенные императором Муравьев и Берг «прибегли к жестоким репрессиям и террору с целью подавления восстания»; «сотни поляков были казнены, тысячи высланы в Сибирь или отданы в армию»(Citation: 195).'
