description:
  ru: 'Зачистка гражданских сообществ на волне подавления восстания: «подавление польского восстания 1863–1864 гг., оказавшее соответствующее влияние на украинофильское движение, которое интерпретировалось царской администрацией как австрийская интрига, привели к самороспуску громад и угасанию общественной активности»(Citation: 197).'
  en: 'The purge of civic communities in the wake of the uprising''s suppression: "the suppression of the Polish uprising of 1863–1864, which had a corresponding impact on the Ukrainophile movement, interpreted by the tsarist administration as an Austrian intrigue, led to the self-dissolution of the hromadas and the fading of public activity"(Citation: 197).'
  uk: 'Зачистка громадянських спільнот на хвилі придушення повстання: «придушення польського повстання 1863–1864 рр., яке справило відповідний вплив на українофільський рух, що інтерпретувався царською адміністрацією як австрійська інтрига, привели до саморозпуску громад і згасання суспільної активності»(Citation: 197).'
