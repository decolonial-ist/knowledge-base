name:
  ru: Отмена казацкого устройства в Слободской Украине (1765)
  en: Abolition of the Cossack Order in Sloboda Ukraine (1765)
  uk: Скасування козацького устрою в Слобідській Україні (1765)
description:
  ru: |-
    Имперская реформа по ликвидации военно-социальной структуры Слобожанщины: «Выводы этого следствия при участии сенатской комиссии привели к вердикту Правительствующего Сената о ликвидации автономного устройства 16 декабря 1764 и ряду экспериментальных нововведений, утверждённых Екатериной II манифестом 28 июля 1765.
    На базе слободских полков была образована Слободско-Украинская губерния, из воинских сил — 5 одноимённых гусарских полков (см. Гусары), основная часть казацкого населения переведена в разряд военных обывателей»(Citation: 196).
  en: |-
    An imperial reform to liquidate the military-social structure of Sloboda Ukraine: "The conclusions of this investigation, with the participation of a Senate commission, led to the verdict of the Governing Senate on the liquidation of the autonomous order on December 16, 1764, and a series of experimental innovations approved by Catherine II's manifesto of July 28, 1765.
    On the basis of the Sloboda regiments the Sloboda-Ukrainian Governorate was formed, out of the military forces – 5 hussar regiments of the same names (see Hussars), and the bulk of the Cossack population was transferred to the category of military settlers"(Citation: 196).
  uk: |-
    Імперська реформа з ліквідації військово-соціальної структури Слобожанщини: «Висновки цього слідства при участі сенатської комісії призвели до вердикту Правительствуючого Сенату щодо ліквідації автономного устрою 16 грудня 1764 та низки експериментальних нововведень, затверджених Катериною II маніфестом 28 липня 1765.
    На базі слобідських полків було утворено Слобідсько-Українську губернію, із військ. потуг — 5 однойменних гусарських полків (див.
    Гусари), осн. частину козац. населення переведено в розряд військових обивателів»(Citation: 196).
