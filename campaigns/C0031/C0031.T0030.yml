description:
  ru: 'Ликвидация казацких административных единиц и внедрение имперского деления: утверждённый императрицей доклад комиссии Шаховского и Панина от 16 декабря 1764 года и манифест Екатерины II от 28 июля 1765 года(Citation: 395)(Citation: 396) – «На базе слободских полков была образована Слободско-Украинская губерния»(Citation: 196).'
  en: 'The liquidation of Cossack administrative units and the introduction of imperial division: the report of the Shakhovskoy-Panin commission confirmed by the empress on December 16, 1764 and Catherine II''s manifesto of July 28, 1765(Citation: 395)(Citation: 396) – "On the basis of the Sloboda regiments the Sloboda-Ukrainian Governorate was formed"(Citation: 196).'
  uk: 'Ліквідація козацьких адміністративних одиниць і впровадження імперського поділу: затверджена імператрицею доповідь комісії Шаховського і Паніна від 16 грудня 1764 року та маніфест Катерини II від 28 липня 1765 року(Citation: 395)(Citation: 396) – «На базі слобідських полків було утворено Слобідсько-Українську губернію»(Citation: 196).'
