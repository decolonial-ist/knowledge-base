name:
  en: Attempted bribery of Shamil with a promise of power over Dagestan to secure his appearance before Nicholas I in Tiflis, and the summoning of the Chechen imam Tashu-Hadji (1837)
  uk: Спроба підкупу Шаміля обіцянкою влади над Дагестаном заради явки до Миколи I в Тифліс і виклик чеченського імама Ташу-Хаджі (1837)
  ru: Попытка подкупа Шамиля обещанием власти над Дагестаном ради явки к Николаю I в Тифлис и вызов чеченского имама Ташу-Хаджи (1837)
description:
  en: |-
    In September 1837, ahead of Nicholas I's visit to the Caucasus, the empire tried to buy the leader of the highlander resistance: Shamil (Shamil - imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest) was offered "pardon", honors and power in exchange for appearing before the emperor in Tiflis.
    General Adlerberg conveyed Nicholas I's will to general Rozen in a letter of 10 August 1837: "that Shamil and his chief accomplices Tashav-Hadji, Kibit-Magomet and the Qarakh qadi Abdurrahman be given suggestions to take advantage of His Majesty's arrival in the Caucasus region and to beg the mercy of appearing before the face of the Monarch Himself"(Citation: 133) - Tashu-Hadji (sheikh, in 1834-1836 the imam of Chechnya, spiritual and military leader of the Chechen resistance) is named first among the "accomplices".
    General Klugenau obtained a personal meeting with Shamil on 18 September 1837 at a spring near the aul of Karanay; Shamil's chronicler Muhammad Tahir al-Qarakhi recorded the essence of the offer: "Kluki von Klugenau began to speak, asking Shamil to come for a meeting with the Russian Nicholas.
    He asserted that the emperor would exalt him, Shamil, show him honor, and make him the administrator of the affairs of all Dagestani Muslims.
    From the emperor, he said, there would be no treachery"(Citation: 128).
    At the same time colonel Pullo demanded of Shamil by letter that he send "to the Groznaya fortress two deputies to be presented to the Sovereign" - and this competing demand, as the imperial historian Yurov admits, "greatly hindered the success" of the recruitment(Citation: 133).
    Shamil refused in a letter to Klugenau of 28 September 1837: "I have resolved not to go to Tiflis even if I am cut to pieces, because I have many times seen treachery from you"(Citation: 133) - neither he nor Tashu-Hadji appeared before the emperor.
  uk: |-
    У вересні 1837 року, напередодні приїзду Миколи I на Кавказ, імперія спробувала купити лідера горського спротиву: Шамілю (Шаміль - імам, керівник спротиву горців Дагестану і Чечні російському завоюванню) пропонували «прощення», пошану і владу в обмін на явку до імператора в Тифліс.
    Волю Миколи I генерал Адлерберг передав генералу Розену листом від 10 серпня 1837: «щоб Шамілю та головним його спільникам Ташав-Гаджі, Кібіт-Магомету і карахському кадію Абдуррахману зроблено було навіювання скористатися прибуттям Його Величності в кавказький край і випросити милості постати перед лице Самого Монарха»(Citation: 133) - першим серед «спільників» названо Ташу-Хаджі (шейх, у 1834-1836 роках імам Чечні, духовний і військовий керівник чеченського спротиву).
    Генерал Клюгенау домігся особистого побачення з Шамілем 18 вересня 1837 біля джерела поблизу аулу Каранай; хроніст Шаміля Мухаммед-Тахір аль-Карахі записав суть пропозиції: «Клюкі фон Клюгенау заговорив, просячи Шаміля приїхати для зустрічі з російським Миколою.
    Він запевняв, що імператор звеличить його, Шаміля, виявить йому пошану, зробить управителем справ усіх дагестанських мусульман.
    Від імператора, мовляв, не буде жодної зради»(Citation: 128).
    Водночас полковник Пулло листом зажадав від Шаміля вислати «у фортецю Грозну двох депутатів для представлення їх Государю» - і ця конкурентна вимога, за визнанням імперського історика Юрова, «дуже завадила успіхові» вербування(Citation: 133).
    Шаміль відмовився листом Клюгенау від 28 вересня 1837: «я вирішив не їхати в Тифліс, навіть якщо поріжуть мене на шматки, бо я багато разів бачив від вас зради»(Citation: 133) - до імператора не з'явився ні він, ні Ташу-Хаджі.
  ru: |-
    В сентябре 1837 года, перед приездом Николая I на Кавказ, империя попыталась купить лидера горского сопротивления: Шамилю (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию) предлагали «прощение», почёт и власть в обмен на явку к императору в Тифлис.
    Волю Николая I генерал Адлерберг передал генералу Розену письмом от 10 августа 1837: «дабы сделаны были Шамилю и главным его сообщникам Ташов-хаджи, Кибит-Магомету и карахскому кадию Абдуррахману внушения воспользоваться прибытием Его Величества в кавказский край и испросить милости предстать пред лицо Самого Монарха»(Citation: 133) - первым среди «сообщников» назван Ташу-Хаджи (шейх, в 1834-1836 годах имам Чечни, духовный и военный руководитель чеченского сопротивления).
    Генерал Клюгенау добился личного свидания с Шамилём 18 сентября 1837 у родника близ аула Каранай; хронист Шамиля Мухаммед-Тахир аль-Карахи записал суть предложения: «Клюки фон Клюгенау заговорил, прося Шамиля приехать для встречи с русским Николаем.
    Он утверждал, что император возвеличит его, Шамиля, окажет ему почет, сделает управляющим делами всех дагестанских мусульман.
    От императора, мол, не будет никакой измены»(Citation: 128).
    Одновременно полковник Пулло письмом потребовал от Шамиля выслать «в кр.
    Грозную двух депутатов для представления их Государю» - и это конкурирующее требование, по признанию имперского историка Юрова, «много помешало успеху» вербовки(Citation: 133).
    Шамиль отказался письмом Клюгенау от 28 сентября 1837: «я решился не отправляться в Тифлис, если и изрежут меня по кускам, потому, что я многократно видел от вас измены»(Citation: 133) - к императору не явился ни он, ни Ташу-Хаджи.
