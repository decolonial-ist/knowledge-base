name:
  en: Pereiaslav Council (1654)
  uk: Переяславська рада (1654)
  ru: Переяславская рада (1654)
description:
  en: |-
    The oath of Bohdan Khmelnytsky and the starshyna to the tsar.
    Establishment of control over the Hetmanate through a legal trap: the treaty was asymmetric by design – in response to the demand for a mutual oath, envoy "V. Buturlin, citing the autocratic character of the Russian monarch's power, refused to do so"(Citation: 195).
    The very language of "reunification" is a later imperial overlay: Tsar Aleksei's charter to the Zaporozhian Host (27 March 1654) speaks only of subjects who "have come under our sovereign's high hand"(Citation: 142).
  uk: |-
    Присяга Богдана Хмельницького та старшини цареві.
    Встановлення контролю над Гетьманщиною через юридичну пастку: договір від початку задумувався як асиметричний – на вимогу про взаємну присягу посол «В.Бутурлін, покликаючись на самодержавний характер влади рос. монарха, відмовився це зробити»(Citation: 195).
    Сама мова «возз'єднання» – пізніша імперська надбудова: жалувана грамота царя Олексія Війську Запорозькому (27 березня 1654) говорить лише про підданих, що «учинилися під нашою государською високою рукою»(Citation: 142).
  ru: |-
    Присяга Богдана Хмельницкого и старшины царю.
    Установление контроля над Гетманщиной через юридическую ловушку: договор изначально задумывался как асимметричный – на требование о взаимной присяге посол «В.Бутурлин, ссылаясь на самодержавный характер власти российского монарха, отказался это сделать»(Citation: 195).
    Сам язык «воссоединения» – позднейшая имперская надстройка: жалованная грамота царя Алексея Войску Запорожскому (27 марта 1654) говорит лишь о подданных, что «учинились под нашею государскою высокою рукою»(Citation: 142).
