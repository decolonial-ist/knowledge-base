name:
  ru: Ликвидация института гетманства и Вторая Малороссийская коллегия (1764)
  en: Liquidation of the Institution of the Hetmancy and the Second Little Russian Collegium (1764)
  uk: Ліквідація інституту гетьманства та Друга Малоросійська колегія (1764)
description:
  ru: |-
    Финальное упразднение политической автономии.
    Екатерина II заставила гетмана Разумовского отречься от должности и указом от 10 ноября 1764 года учредила оккупационную администрацию: «повелѣваемъ нашему сенату для надлежащаго въ Малой Россіи управленія учредить тамъ малороссійскую коллегію, въ которой присутствовать главнымъ: нашему генералу, графу Румянцеву»(Citation: 145).
    Программа была задана заранее в секретном наставлении: «чтоб они обрусели и перестали бы глядеть, как волки к лесу»(Citation: 144).
  en: |-
    The final abolition of political autonomy.
    Catherine II forced hetman Rozumovsky to renounce his office and by the decree of November 10, 1764 established an occupation administration: "we command our Senate, for the proper governance of Little Russia, to establish there a Little Russian Collegium, presided over by our general, Count Rumyantsev"(Citation: 145).
    The program had been set in advance in a secret instruction: "so that they become Russified and cease looking to the forest like wolves"(Citation: 144).
  uk: |-
    Фінальне скасування політичної автономії.
    Катерина II змусила гетьмана Розумовського зректися посади й указом від 10 листопада 1764 року заснувала окупаційну адміністрацію: «повеліваємо нашому сенату для належного в Малій Росії управління заснувати там малоросійську колегію, в якій присутнім бути головним: нашому генералові, графу Румянцеву»(Citation: 145).
    Програму було задано заздалегідь у секретному настановленні: «щоб вони обрусіли й перестали дивитися, як вовки до лісу»(Citation: 144).
