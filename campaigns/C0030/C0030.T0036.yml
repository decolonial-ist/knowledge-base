description:
  ru: 'Учреждение прямого имперского органа – Второй Малороссийской коллегии: четыре великороссийских члена, четыре малороссийских, во главе Румянцев с полномочиями генерал-губернатора; под её же ведомство передавалась и Запорожская Сечь: «ЗапорожскоЙ Сѣчи, которая состояла подъ вѣдомствомъ гетмана, быть нынѣ вѣдомой въ семъ правительствѣ малороссійскомъ»(Citation: 145).'
  en: 'The establishment of a direct imperial organ – the Second Little Russian Collegium: four Great Russian members, four Little Russian ones, headed by Rumyantsev with the powers of a governor-general; the Zaporozhian Sich was also transferred to its jurisdiction: "the Zaporozhian Sich, which was under the hetman''s jurisdiction, shall now be administered by this Little Russian government"(Citation: 145).'
  uk: 'Заснування прямого імперського органу – Другої Малоросійської колегії: чотири великоросійські члени, чотири малоросійські, на чолі Румянцев із повноваженнями генерал-губернатора; під її ж відомство передавалася й Запорозька Січ: «Запорозькій Січі, яка перебувала під відомством гетьмана, бути нині відомою в цьому правительстві малоросійському»(Citation: 145).'
