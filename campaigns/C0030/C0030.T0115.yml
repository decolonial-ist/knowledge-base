description:
  ru: |-
    Секретная инструкция монарха по культурному перевариванию края: «Малая Россия, Лифляндия и Финляндия суть провинции, которые правятся конфирмованными им привилегиями…
    Сии провинции, также и Смоленскую, надлежит легчайшими способами привести к тому, чтоб они обрусели и перестали бы глядеть, как волки к лесу»(Citation: 144).
  en: |-
    The monarch's secret instruction on the cultural digestion of the land: "Little Russia, Livonia, and Finland are provinces governed by the privileges confirmed to them…
    These provinces, as well as Smolensk, must by the easiest means be brought to the point where they become Russified and cease looking to the forest like wolves"(Citation: 144).
  uk: |-
    Секретна інструкція монарха щодо культурного перетравлення краю: «Мала Росія, Ліфляндія і Фінляндія суть провінції, які правляться конфірмованими їм привілеями…
    Ці провінції, а також Смоленську, належить найлегшими способами привести до того, щоб вони обрусіли й перестали дивитися, як вовки до лісу»(Citation: 144).
