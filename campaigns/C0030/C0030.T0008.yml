description:
  en: |-
    The final elimination of the office of the autonomy's leader: after Rozumovsky's forced abdication, Catherine II's decree of November 10, 1764 handed power to the Little Russian Collegium, whose president was instructed to act "with a governor's authority, that is, as our special plenipotentiary"(Citation: 145).
    Catherine II's instruction to procurator-general Vyazemsky (1764) stated the goal openly: "and when there is no hetman in Little Russia, one must strive that the very age and name of hetmans vanish"(Citation: 144).
  uk: |-
    Остаточне знищення посади лідера автономії: після вимушеного зречення Розумовського указ Катерини II від 10 листопада 1764 року передав владу Малоросійській колегії, а її президентові приписувалося діяти «з владою губернаторською, себто як особливий повірений наш»(Citation: 145).
    Настановлення Катерини II генерал-прокуророві Вяземському (1764) формулювало мету відкрито: «коли ж у Малоросії гетьмана не буде, то належить старатися, щоб вік та ім'я гетьманів зникло»(Citation: 144).
  ru: |-
    Окончательное уничтожение должности лидера автономии: после вынужденного отречения Разумовского указ Екатерины II от 10 ноября 1764 года передал власть Малороссийской коллегии, а её президенту предписывалось действовать «съ властію губернаторскою, то есть какъ особливый повѣренный нашъ»(Citation: 145).
    Наставление Екатерины II генерал-прокурору Вяземскому (1764) формулировало цель открыто: «когда же в Малороссии гетмана не будет, то должно стараться, чтоб век и имя гетманов исчезло»(Citation: 144).
