description:
  en: |-
    Throughout Feze's spring tour (February-April 1837), the troops took the Chechens' livestock and property.
    According to Rozen's reports to Minister of War Chernyshev: on 5 February the livestock of mullah Udi's detachment was taken - "148 head of livestock of various kinds"; on 11 February "213 head of livestock of various kinds belonging to the unsubmissive Chechens were seized"; against those hiding in the forests "searches were made in various directions... and livestock of various kinds and property were seized from many of them"(Citation: 105).
    The April raid on the Gertli settlement, according to the report of 30 May, took "465 head of small livestock"(Citation: 105).
  uk: |-
    Протягом усього весняного туру Фезе (лютий-квітень 1837) війська забирали худобу і майно чеченців.
    За рапортами Розена військовому міністру Чернишову: 5 лютого відбито худобу загону мулли Уді - «148 штук різного роду худоби»; 11 лютого «захоплено 213 штук різного роду худоби, що належала непокірним чеченцям»; проти тих, що переховувалися в лісах, «зроблені були за різними напрямками пошуки... і захоплено в багатьох із них різного роду худобу і майно»(Citation: 105).
    Квітневий рейд на Гертлінське селище, за рапортом від 30 травня, взяв «465 штук дрібної худоби»(Citation: 105).
  ru: |-
    На всём протяжении весеннего тура Фезе (февраль-апрель 1837) войска забирали скот и имущество чеченцев.
    По рапортам Розена военному министру Чернышеву: 5 февраля отбит скот отряда муллы Уди - «148 штук разного рода скота»; 11 февраля «захвачено 213 штук разного рода скота, принадлежавшего непокорным Чеченцам»; против укрывшихся в лесах «сделаны были по разным направлениям поиски... и захвачены у многих из них разного рода скот и имущество»(Citation: 105).
    Апрельский рейд на Гертлинское селение, по рапорту от 30 мая, взял «465 штук мелкого скота»(Citation: 105).
