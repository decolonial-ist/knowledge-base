name:
  ru: 'Принуждение Чечни к присяге весенним туром Фезе: аманаты с принуждённых к присяге обществ, уничтожение аулов по Джалке, штраф скотом (февраль-апрель 1837)'
  en: 'Coercion of Chechnya into Oaths by Feze''s Spring Tour: Amanats from Communities Coerced into the Oath, Destruction of Auls along the Dzhalka, a Livestock Fine (February-April 1837)'
  uk: 'Примушення Чечні до присяги весняним туром Фезе: аманати з примушених до присяги громад, знищення аулів по Джалці, штраф худобою (лютий-квітень 1837)'
description:
  ru: |-
    В феврале-апреле 1837 года командование российского Кавказского корпуса провело серию экспедиций генерала Фезе по Чечне, принуждая общество за обществом к присяге империи.
    Санкцию Розен сформулировал в донесении военному министру Чернышеву: поход «за Аргуном» полезен «для уменьшения в Чеченцах доверия к возмутителям и отклонения их от намерения соединиться с Шамилем» (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию)(Citation: 105).
    Розен в своих рапортах Чернышеву сам описывает механизм: после уничтожения аулов Ахой-юрт, Люмик-юрт, Сеид-юрт и Автур «Чеченцы, объятые страхом от предшествовавших действий... пришли в большое уныние» - и войска взяли присяги с аманатами (аманат - человек, которого империя забирала у общины как гарантию подчинения) с Шали 6 февраля, Герменчука 8-го, Гельдигена 15-го, шести аулов Мичика 21-го, аулов по Яман-су и Аксаю 25-го, а в конце марта - со старшин Гойтинского леса и Мартанского ущелья(Citation: 105).
    Сводка рапорта от 4 марта 1837 считает за одиннадцать февральских дней: «захвачено войсками нашими в плен 52 души непокорившихся добровольно жителей... и взято аманатов 52 чел.»(Citation: 105).
    Расчёт генерал Фезе доложил открыто - действовал «в намерении пользоваться по возможности паническим страхом» (рапорт Вельяминову от 15 марта 1837)(Citation: 126).
    В марте войска прошли вверх по Джалке: «оставленные ими четыре аула заняты и истреблены без сопротивления», уничтожены кутаны (зимние устройства для скота) с запасами хлеба(Citation: 105).
    В конце апреля ночной рейд на Гертлинское селение взял «18 душ, принадлежащих к семействам хищников» и 465 голов скота, и «положен на селение штраф в 132 штуки скота»(Citation: 105).
    Голос нохчи фиксирует тур как вторжение - историк Д. А. Хожаев пишет: «в конце февраля-начале марта враг вновь вторгся в Ичкерию. 1 марта у селения Алерой произошел бой между отрядом соратника Ташу-хаджи Уди-муллы и войсками генерала Фези» (Ташу-Хаджи - шейх, в 1834-1836 годах имам Чечни, духовный и военный руководитель чеченского сопротивления)(Citation: 95).
  en: |-
    In February-April 1837, the command of the Russian Caucasus Corps conducted a series of expeditions under General Feze across Chechnya, coercing community after community into an oath to the empire.
    Rozen stated the sanction in a dispatch to Minister of War Chernyshev: a campaign "beyond the Argun" would be useful "for diminishing the Chechens' trust in the instigators and turning them away from the intention of joining Shamil" (Shamil - imam, leader of the Dagestani and Chechen highlanders' resistance to the Russian conquest)(Citation: 105).
    Rozen's reports to Chernyshev describe the mechanism themselves: after the annihilation of the auls of Akhoy-yurt, Lyumik-yurt, Seid-yurt and Avtur, "the Chechens, gripped by fear from the preceding actions... fell into great despondency" - and the troops took oaths with amanats (amanat - a person whom the empire took from a community as a guarantee of subordination) from Shali on 6 February, Germenchuk on the 8th, Geldigen on the 15th, six auls of the Michik on the 21st, the auls along the Yaman-su and the Aksai on the 25th, and, at the end of March, from the elders of the Goyta forest and the Martan gorge(Citation: 105).
    The summary in the report of 4 March 1837 counts, for eleven February days: "52 souls of inhabitants who did not submit voluntarily were taken captive by our troops... and 52 amanats were taken"(Citation: 105).
    General Feze stated the calculation openly - he acted "with the intention of making use, as far as possible, of the panic fear" (report to Velyaminov of 15 March 1837)(Citation: 126).
    In March the troops passed up the Dzhalka: "the four auls they had abandoned were occupied and annihilated without resistance", and the kutans (winter shelters for livestock) with their grain stores were destroyed(Citation: 105).
    At the end of April a night raid on the Gertli settlement took "18 souls belonging to the families of the brigands" and 465 head of livestock, and "a fine of 132 head of livestock was imposed on the settlement"(Citation: 105).
    The voice of the Nokhchi records the tour as an invasion - the historian D. A. Khozhaev writes: "at the end of February-beginning of March the enemy again invaded Ichkeria.
    On 1 March, at the village of Aleroy, a battle took place between the detachment of Tashu-Hadji's companion Udi-mullah and the troops of General Fezi" (Tashu-Hadji - sheikh, imam of Chechnya in 1834-1836, spiritual and military leader of the Chechen resistance)(Citation: 95).
  uk: |-
    У лютому-квітні 1837 року командування російського Кавказького корпусу провело серію експедицій генерала Фезе по Чечні, примушуючи громаду за громадою до присяги імперії.
    Санкцію Розен сформулював у донесенні військовому міністру Чернишову: похід «за Аргуном» корисний «для зменшення в чеченцях довіри до підбурювачів і відхилення їх від наміру з'єднатися з Шамілем» (Шаміль - імам, керівник опору горців Дагестану і Чечні російському завоюванню)(Citation: 105).
    Механізм рапорти Розена Чернишову описують самі: після винищення аулів Ахой-юрт, Люмік-юрт, Сеїд-юрт і Автур «чеченці, охоплені страхом від попередніх дій... прийшли у велике зневір'я» - і війська взяли присяги з аманатами (аманат - людина, яку імперія забирала в громади як гарантію підпорядкування) з Шалі 6 лютого, Герменчука 8-го, Гельдігена 15-го, шести аулів Мічика 21-го, аулів по Яман-су і Аксаю 25-го, а наприкінці березня - зі старшин Гойтинського лісу і Мартанського міжгір'я(Citation: 105).
    Зведення рапорту від 4 березня 1837 рахує за одинадцять лютневих днів: «захоплено військами нашими в полон 52 душі жителів, що не підкорилися добровільно... і взято аманатів 52 чол.»(Citation: 105).
    Розрахунок генерал Фезе доповів відкрито - діяв «у намірі користуватися по можливості панічним страхом» (рапорт Вельямінову від 15 березня 1837)(Citation: 126).
    У березні війська пройшли вгору по Джалці: «залишені ними чотири аули зайняті і винищені без опору», знищено кутани (зимові споруди для худоби) із запасами хліба(Citation: 105).
    Наприкінці квітня нічний рейд на Гертлінське селище взяв «18 душ, що належать до сімейств хижаків» і 465 голів худоби, і «покладено на селище штраф у 132 штуки худоби»(Citation: 105).
    Голос нохчі фіксує тур як вторгнення - історик Д. А. Хожаєв пише: «наприкінці лютого-на початку березня ворог знову вторгся в Ічкерію. 1 березня біля селища Алерой відбувся бій між загоном соратника Ташу-хаджі Уді-мулли і військами генерала Фезі» (Ташу-Хаджі - шейх, у 1834-1836 роках імам Чечні, духовний і військовий керівник чеченського опору)(Citation: 95).
