  ru: 'Принуждение Чечни к присяге весенним туром Фезе: аманаты с принуждённых к присяге обществ, уничтожение аулов по Джалке, штраф скотом (февраль-апрель 1837)'
  en: 'Coercion of Chechnya into Oaths by Feze''s Spring Tour: Amanats from Communities Coerced into the Oath, Destruction of Auls along the Dzhalka, a Livestock Fine (February-April 1837)'
  uk: 'Примушення Чечні до присяги весняним туром Фезе: аманати з примушених до присяги громад, знищення аулів по Джалці, штраф худобою (лютий-квітень 1837)'
