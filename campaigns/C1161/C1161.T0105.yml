description:
  ru: |-
    Весенний тур Фезе (февраль-апрель 1837) уничтожал жильё и зимнее хозяйство чеченских обществ.
    Рапорт Розена военному министру Чернышеву от 23 февраля 1837: 5 февраля «войска наши истребили лежащие на пути аулы Ахой-юрт и Люмик-юрт и хутора неприязненных Чеченцев», 9 февраля истреблены Сеид-юрт и Автур(Citation: 105).
    В мартовском марше вверх по Джалке, по рапорту от 12 апреля, «оставленные ими четыре аула заняты и истреблены без сопротивления.
    Потом войска проникли в чащу леса, уничтожили кутаны (зимние устройства для скота)»; 26 марта войска уничтожали кутаны у Шали, и своим маршрутом то же делала колонна Бирзуля(Citation: 105).
  en: |-
    Feze's spring tour (February-April 1837) destroyed the housing and winter livelihood of the Chechen communities.
    Rozen's report to Minister of War Chernyshev of 23 February 1837: on 5 February "our troops annihilated the auls of Akhoy-yurt and Lyumik-yurt lying on the way and the khutors of the hostile Chechens"; on 9 February Seid-yurt and Avtur were annihilated(Citation: 105).
    In the March march up the Dzhalka, according to the report of 12 April, "the four auls they had abandoned were occupied and annihilated without resistance.
    Then the troops penetrated into the thick of the forest and destroyed the kutans (winter shelters for livestock)"; on 26 March the troops were destroying kutans near Shali, and Birzul's column did the same along its own route(Citation: 105).
  uk: |-
    Весняний тур Фезе (лютий-квітень 1837) знищував житло і зимове господарство чеченських громад.
    Рапорт Розена військовому міністру Чернишову від 23 лютого 1837: 5 лютого «війська наші винищили аули Ахой-юрт і Люмік-юрт, що лежали на шляху, і хутори ворожих чеченців», 9 лютого винищені Сеїд-юрт і Автур(Citation: 105).
    У березневому марші вгору по Джалці, за рапортом від 12 квітня, «залишені ними чотири аули зайняті і винищені без опору.
    Потім війська проникли в хащу лісу, знищили кутани (зимові споруди для худоби)»; 26 березня війська знищували кутани біля Шалі, і своїм маршрутом те ж робила колона Бірзуля(Citation: 105).
