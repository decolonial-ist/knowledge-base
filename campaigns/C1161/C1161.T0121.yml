description:
  ru: |-
    Уничтожая в марте 1837 года кутаны (зимние устройства для скота) по Джалке и у Шали, войска Фезе целенаправленно жгли продовольствие.
    Рапорт Розена военному министру Чернышеву от 12 апреля 1837 фиксирует: в кутанах «сожгли значительное количество найденного в оных хлеба», у Шали войска «захватили находившихся при них караульных и множество съестных припасов», а колонна Бирзуля сожгла «несколько сот четвертей найденного в оных хлеба» (четверть - старинная мера зерна, около 210 литров)(Citation: 105).
    Сожжение сотен четвертей хлеба в конце зимы лишало ушедшие в леса и горы семьи средств дожить до урожая.
  en: |-
    Destroying the kutans (winter shelters for livestock) along the Dzhalka and near Shali in March 1837, Feze's troops deliberately burned food.
    Rozen's report to Minister of War Chernyshev of 12 April 1837 records: in the kutans they "burned a considerable quantity of the grain found in them"; near Shali the troops "seized the watchmen present at them and a multitude of food supplies"; and Birzul's column burned "several hundred chetverts of the grain found in them" (chetvert - an old grain measure of about 210 liters)(Citation: 105).
    Burning hundreds of chetverts of grain at the end of winter left the families who had fled to the forests and mountains without means to survive until the harvest.
  uk: |-
    Знищуючи в березні 1837 року кутани (зимові споруди для худоби) по Джалці та біля Шалі, війська Фезе цілеспрямовано палили продовольство.
    Рапорт Розена військовому міністру Чернишову від 12 квітня 1837 фіксує: у кутанах «спалили значну кількість знайденого в них хліба», біля Шалі війська «захопили вартових, що перебували при них, і безліч їстівних припасів», а колона Бірзуля спалила «кілька сот четвертей знайденого в них хліба» (четверть - старовинна міра зерна, близько 210 літрів)(Citation: 105).
    Спалення сотень четвертей хліба наприкінці зими позбавляло сім'ї, що пішли в ліси і гори, засобів дожити до врожаю.
