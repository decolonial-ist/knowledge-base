description:
  ru: |-
    Присяга, взятая войсками Фезе в феврале 1837 года, сразу оборачивалась трудовой повинностью.
    Рапорт Розена военному министру Чернышеву от 4 марта 1837 записывает: 21 февраля «жители шести соседних аулов изъявили покорность и выслали рабочих для прорубки, вместе с Кумыками, дороги в лесах чрез Качалыковские горы по Мичику»(Citation: 105) - только что подчинённые общины империя поставила рубить лес под военную дорогу против них же; повинность шла в пакете подчинения, как позже её закрепят типовые «Условия покоряющимся горцам».
  en: |-
    The submission taken by Feze's troops in February 1837 immediately turned into labor duty.
    Rozen's report to Minister of War Chernyshev of 4 March 1837 records: on 21 February "the inhabitants of six neighboring auls declared their submission and sent out workers to cut, together with the Kumyks, a road in the forests through the Qachqalyq mountains along the Michik"(Citation: 105) - communities just subordinated were set by the empire to cut the forest for a military road against themselves; the duty came as part of the package of submission, as the standard "Conditions Prescribed to Submitting Highlanders" would later codify it.
  uk: |-
    Покірність, взята військами Фезе в лютому 1837 року, одразу оберталася трудовою повинністю.
    Рапорт Розена військовому міністру Чернишову від 4 березня 1837 записує: 21 лютого «жителі шести сусідніх аулів виявили покірність і вислали робітників для прорубки, разом з кумиками, дороги в лісах через Качаликівські гори по Мічику»(Citation: 105) - щойно підпорядковані громади імперія поставила рубати ліс під військову дорогу проти них же; повинність ішла в пакеті підпорядкування, як пізніше її закріплять типові «Умови, що приписуються горцям, які підкоряються».
