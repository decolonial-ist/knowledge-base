description:
  ru: |-
    Весенний тур Фезе (февраль-апрель 1837) прорубал чеченские леса под военные дороги.
    По рапортам Розена военному министру Чернышеву: в феврале прорублена дорога «в лесах чрез Качалыковские горы по Мичику и между аулами Казбеком и Аку-юртом»; рапорт от 12 апреля отмечает, что мартовский марш шёл «просекой, прорубленной им в феврале месяце сего года»; сам Фезе в конце февраля двигался, «разработывая вьючную тропинку в способную дорогу для проезда всяких тяжестей»(Citation: 105).
    Просеки и дороги в лесах лишали чеченские общества естественной защиты и открывали войскам постоянный доступ вглубь страны.
  en: |-
    Feze's spring tour (February-April 1837) cut military roads through the Chechen forests.
    According to Rozen's reports to Minister of War Chernyshev: in February a road was cut "in the forests through the Qachqalyq mountains along the Michik and between the auls of Kazbek and Aku-yurt"; the report of 12 April notes that the March march went "by the clearing cut by him in February of this year"; Feze himself moved at the end of February "working the pack trail into a road fit for the passage of all kinds of loads"(Citation: 105).
    Clearings and roads through the forests deprived the Chechen communities of their natural protection and opened the troops permanent access into the depth of the country.
  uk: |-
    Весняний тур Фезе (лютий-квітень 1837) прорубував чеченські ліси під військові дороги.
    За рапортами Розена військовому міністру Чернишову: у лютому прорубано дорогу «в лісах через Качаликівські гори по Мічику і між аулами Казбеком і Аку-юртом»; рапорт від 12 квітня зазначає, що березневий марш ішов «просікою, прорубаною ним у лютому місяці цього року»; сам Фезе наприкінці лютого рухався, «розробляючи в'ючну стежку в придатну дорогу для проїзду всяких вантажів»(Citation: 105).
    Просіки і дороги в лісах позбавляли чеченські громади природного захисту і відкривали військам постійний доступ углиб країни.
