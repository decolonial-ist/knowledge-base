description:
  en: |-
    Physical annihilation and isolation of the Ukrainian intelligentsia, writers, and scholars, as well as of the party opposition (national communists), in the course of targeted repressions.
    Fabrication of cases (including the "UNC" case) and driving representatives of the national elite to death, including the historian Mykhailo Hrushevsky, the writer Mykola Khvylovy, and People's Commissar Mykola Skrypnyk(Citation: 22).
  uk: |-
    Фізичне знищення та ізоляція Української інтелігенції, письменників, науковців, а також партійної опозиції (націонал-комуністів) у ході цілеспрямованих репресій.
    Фабрикація справ (зокрема справи «УНЦ») і доведення до смерті представників національної еліти, включно з істориком М. Грушевським, письменником М. Хвильовим та наркомом М. Скрипником(Citation: 22).
  ru: |-
    Физическое уничтожение и изоляция украинской интеллигенции, писателей, ученых, а также партийной оппозиции (национал-коммунистов) в ходе целенаправленных репрессий.
    Фабрикация дел (в т.ч. дела «УНЦ») и доведение до смерти представителей национальной элиты, включая историка М. Грушевского, писателя М. Хвылевого и наркома Н. Скрыпника(Citation: 22).
