description:
  ru: |-
    Конструирование нового советско-имперского исторического канона для подмены украинского прошлого: «с конца 1930-х гг. в исторической науке СССР утвердился тезис», провозглашенная в работах Б. Грекова, К. Гуслистого и Ф. Ястребова, «о Киевской Руси как об „общей колыбели“ истории украинского, русского и белорусского народов», а «в 1939 Б.Греков выдвинул положение об этническом единстве „русского народа“ в эпоху Киевской Руси»(Citation: 186).
    Эта схема вытесняла концепцию М. Грушевского и отрицала самостоятельность истории Украины.
  en: |-
    The construction of a new Soviet-imperial historical canon to supplant the Ukrainian past: "from the late 1930s a thesis took hold in the historical scholarship of the USSR," proclaimed in the works of B. Grekov, K. Huslystyi, and F. Yastrebov, "of Kyivan Rus as the 'common cradle' of the history of the Ukrainian, Russian, and Belarusian peoples," and "in 1939 B. Grekov advanced the proposition of the ethnic unity of the 'Rus people' in the era of Kyivan Rus"(Citation: 186).
    This scheme displaced M. Hrushevsky's conception and denied the independence of Ukraine's history.
  uk: |-
    Конструювання нового радянсько-імперського історичного канону для підміни українського минулого: «від кін. 1930-х рр. в істор. науці СРСР утвердилася теза», проголошена в працях Б. Грекова, К. Гуслистого та Ф. Ястребова, «про Київ.
    Русь як про „спільну колиску“ історії укр., рос. і білорус. народів», а «1939 Б.Греков висунув положення про етнічну єдність „руського народу“ в добу Київ.
    Русі»(Citation: 186).
    Ця схема витісняла концепцію М. Грушевського та заперечувала самостійність історії України.
