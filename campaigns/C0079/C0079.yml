name:
  en: Cultural Terror and the "Executed Renaissance" (1933–1938)
  uk: Культурний терор і «Розстріляне відродження» (1933–1938)
  ru: Культурный террор и «Расстрелянное возрождение» (1933–1938)
description:
  en: |-
    The abrupt rollback of the policy of "Ukrainization."
    The start of the physical extermination and political defamation of the intellectual elite - writers, scholars, film directors, as well as the old national communists (M. Skrypnyk was driven to suicide)(Citation: 22).
    In parallel with the physical terror came the destruction of the Ukrainian Autocephalous Orthodox Church, large-scale censorship, the rewriting of history, and the artificial convergence of the Ukrainian language with Russian; works published in the Ukrainian SSR before 1933, in the words of the compiler of the anthology "Executed Renaissance," were "destroyed as a result of Moscow's new course toward the rout and colonial provincialization of Ukraine"(Citation: 196).
  uk: |-
    Різке згортання політики «українізації».
    Старт фізичного знищення та політичного шельмування інтелектуальної еліти - письменників, учених, режисерів, а також старих націонал-комуністів (доведення до самогубства М. Скрипника)(Citation: 22).
    Паралельно з фізичним терором розгортався розгром Української автокефальної православної церкви, масштабна цензура, переписування історії та штучне зближення української мови з російською; твори, видані в УСРР до 1933 року, за словами упорядника антології «Розстріляне відродження», були «нищені наслідком нового курсу Москви на розгром і колоніяльну провінціялізацію України»(Citation: 196).
  ru: |-
    Резкое сворачивание политики «украинизации».
    Старт физического уничтожения и политического шельмования интеллектуальной элиты - писателей, ученых, режиссеров, а также старых национал-коммунистов (доведение до самоубийства М. Скрыпника)(Citation: 22).
    Параллельно с физическим террором разворачивался разгром Украинской автокефальной православной церкви, масштабная цензура, переписывание истории и искусственное сближение украинского языка с русским; произведения, изданные в УССР до 1933 года, по словам составителя антологии «Расстрелянное возрождение», были «уничтожаемые вследствие нового курса Москвы на разгром и колониальную провинциализацию Украины»(Citation: 196).
