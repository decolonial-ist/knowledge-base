description:
  ru: |-
    Массовые еврейские погромы при попустительстве и соучастии полиции: в октябре 1905 года «зарегистрировано более 600 погромов и более 800 убитых»(Citation: 195).
    В Одессе «полицейские нижних чинов и солдаты не мешали погромщикам, а во многих случаях сами участвовали в грабежах и убийствах»(Citation: 180), а командующий войсками округа заявил полицейским: «все мы в душе сочувствуем погрому»(Citation: 180).
  en: |-
    Mass Jewish pogroms with the connivance and complicity of the police: in October 1905 "over 600 pogroms and over 800 killed were registered"(Citation: 195).
    In Odesa, "Low-ranking policemen and soldiers failed to interfere with the pogromists and in many instances participated in the looting and killing"(Citation: 180), and the commander of the district's troops told policemen: "all of us sympathize in our souls with the pogrom"(Citation: 180).
  uk: |-
    Масові єврейські погроми за потурання та співучасті поліції: у жовтні 1905 року «зареєстровано понад 600 погромів і понад 800 убитих»(Citation: 195).
    В Одесі «поліцейські нижніх чинів і солдати не заважали погромникам, а в багатьох випадках самі брали участь у грабунках і вбивствах»(Citation: 180), а командувач військ округу заявив поліцейським: «усі ми в душі співчуваємо погрому»(Citation: 180).
