description:
  en: |-
    The intimidation of the population and suppression of the liberation movement by radical monarchist organizations whose program rested on the principles of "the unity and indivisibility of the Russian Empire, the preservation of autocracy… great-power chauvinism, antisemitism, militant Orthodoxy"(Citation: 196).
    The outcome was "the mass Jewish pogroms provoked by the 'Union,' particularly in Ukraine, in the 'Pale of Settlement'"(Citation: 196).
  uk: |-
    Залякування населення та придушення визвольного руху радикальними монархічними організаціями, чия програма будувалася на засадах «єдність і неподільність Рос. імперії, збереження самодержавства… великодерж. шовінізм, антисемітизм, войовниче православ'я»(Citation: 196).
    Підсумком стали «спровоковані «Союзом» масові погроми єврейські, зокрема в Україні, у «смузі осілості»»(Citation: 196).
  ru: |-
    Запугивание населения и подавление освободительного движения радикальными монархическими организациями, чья программа строилась на принципах «единство и неделимость Российской империи, сохранение самодержавия… великодержавный шовинизм, антисемитизм, воинствующее православие»(Citation: 196).
    Итогом стали «спровоцированные «Союзом» массовые еврейские погромы, в частности в Украине, в «черте осёдлости»»(Citation: 196).
