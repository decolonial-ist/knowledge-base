description:
  en: |-
    The government of the Russian Empire dispatched specialists to collect data on the lands and population of the Nokhchi: historian Sh.
    B. Akhmadov points out that in 1728 the officer I. G. Gerber "on the government's assignment... compiled a description of the localities and population... as well as a map of this area"(Citation: 66).
  uk: 'Уряд Російської імперії направляв фахівців для збору даних про землі та населення Нохчі: історик Ш. Б. Ахмадов вказує, що 1728 року офіцер І. Г. Гербер «за завданням уряду... склав опис місцевостей і населення... а також карту цього району»(Citation: 66).'
  ru: 'Правительство Российской империи направляло специалистов для сбора данных о землях и населении нохчи: историк Ш. Б. Ахмадов указывает, что в 1728 году офицер И. Г. Гербер «по заданию правительства... составил описание местностей и населения... а также карту этого района»(Citation: 66).'
