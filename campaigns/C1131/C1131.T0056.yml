description:
  en: |-
    The occupation administration of the Russian Empire levied discriminatory duties on the movement of goods of the Indigenous population: historian Ya.
    Z. Akhmadov quotes the customs books, stating that in 1726 "on the travel document of the Terek resident, the Okochanin Kurman Bogomatov... duties of 24 altyns in money were collected by decree"(Citation: 94).
  uk: 'Окупаційна адміністрація Російської імперії стягувала дискримінаційні мита за переміщення товарів корінного населення: історик Я. З. Ахмадов цитує митні книги, констатуючи, що 1726 року «з проїжджого листа з терського жителя Окоченина Курмана Богоматова... мита за указом 24 алтини грошима взято»(Citation: 94).'
  ru: 'Оккупационная администрация Российской империи взимала дискриминационные пошлины за перемещение товаров коренного населения: историк Я. З. Ахмадов цитирует таможенные книги, констатируя, что в 1726 году «с проезжего письма с терского жителя окоченина Курмана Богоматова... пошлин по указу 24 алтыни деньги взято»(Citation: 94).'
