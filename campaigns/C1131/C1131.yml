name:
  ru: Экономическая дискриминация и разведка территорий (1726–1728)
  en: Economic Discrimination and Reconnaissance of Territories (1726–1728)
  uk: Економічна дискримінація та розвідка територій (1726–1728)
description:
  ru: |-
    В период с 1726 по 1731 год Российская империя осуществляла рутинное административное и экономическое давление на общества нохчи, избегая масштабных военных интервенций.
    Оккупационная администрация жестко облагала налогами коммерческие поездки коренного населения: историк Я. З. Ахмадов цитирует таможенные документы, констатируя, что в 1726 году «с проезжего письма с терского жителя окоченина Курмана Богоматова... пошлин по указу 24 алтыни деньги взято»(Citation: 94), а также «от 15 февраля 1726 г. сообщается о том, что с терских окочан Суркая Усманова... были взяты пошлины»(Citation: 94).
    Экономическое удушение вызывало вооруженное сопротивление: Ахмадов указывает, что горцы «совершали нападения на царские укрепления, держали крепость Святого Креста «в великом утеснении»»(Citation: 94).
    Кроме того, империя проводила сбор военно-стратегической информации: историк Ш. Б. Ахмадов отмечает, что в 1728 году офицер И. Г. Гербер «по заданию правительства... составил описание местностей и населения... а также карту этого района»(Citation: 66).
  en: |-
    In the period from 1726 to 1731, the Russian Empire exerted routine administrative and economic pressure on the Nokhchi societies while avoiding large-scale military interventions.
    The occupation administration imposed harsh taxes on commercial travel by the indigenous population: historian Ya.
    Z. Akhmadov cites customs documents, stating that in 1726 «from the travel document of the Terek resident, the Okochan Kurman Bogomatov... duties of 24 altyns in money were collected by decree»(Citation: 94), and also that «a report of February 15, 1726 states that duties were collected from the Terek Okochans Surkai Usmanov...»(Citation: 94).
    The economic strangulation provoked armed resistance: Akhmadov indicates that the highlanders «carried out attacks on the tsarist fortifications, kept the fortress of the Holy Cross «in great oppression»»(Citation: 94).
    In addition, the empire conducted the gathering of military-strategic intelligence: historian Sh.
    B. Akhmadov notes that in 1728 the officer I. G. Gerber «on the government's assignment... compiled a description of the localities and population... as well as a map of this district»(Citation: 66).
  uk: |-
    У період з 1726 по 1731 рік Російська імперія здійснювала рутинний адміністративний та економічний тиск на суспільства Нохчі, уникаючи масштабних воєнних інтервенцій.
    Окупаційна адміністрація жорстко обкладала податками комерційні поїздки корінного населення: історик Я. З. Ахмадов цитує митні документи, констатуючи, що 1726 року «з проїжджого листа з терського жителя окоченина Курмана Богоматова... мит за указом 24 алтини грошима взято»(Citation: 94), а також «від 15 лютого 1726 р. повідомляється про те, що з терських окочан Суркая Усманова... було стягнуто мита»(Citation: 94).
    Економічне удушення викликало збройний опір: Ахмадов вказує, що горці «здійснювали напади на царські укріплення, тримали фортецю Святого Хреста «у великому утісненні»»(Citation: 94).
    Крім того, імперія проводила збір військово-стратегічної інформації: історик Ш. Б. Ахмадов зазначає, що 1728 року офіцер І. Г. Гербер «за завданням уряду... склав опис місцевостей і населення... а також мапу цього району»(Citation: 66).
