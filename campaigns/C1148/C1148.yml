name:
  ru: Разорение равнинных сёл нохчи в карательном походе Ермолова (1826)
  en: Devastation of the Lowland Nokhchi Villages in Yermolov’s Punitive Campaign (1826)
  uk: Розорення рівнинних сіл Нохчі в каральному поході Єрмолова (1826)
description:
  ru: |-
    В январе-мае 1826 года Российская империя провела большой карательный поход против нохчи, разоряя равнинные сёла за участие в восстании Бейбулата Таймиева и принуждая жителей к подчинению.
    Историк Д. А. Хожаев пишет, что «в январе 1826 года, дождавшись неудобного для жителей Чечни периода, когда из-за морозов трудно стало укрывать семьи, Ермолов начинает большой карательный поход в Чечню», заняв 26 января аул Большая Атага и сжигая селения одно за другим(Citation: 95).
    Сам генерал Ермолов в рапорте императору Николаю I от 28 мая 1826 года признаёт ход разорения: при штурме Урус-Мартана «деревня сожжена и прекрасные сады оной вырублены», у Ставна-куля «в плен взято обоего пола 16 душ, убито несколько человек», а селение Шали он «приказал истребить… и вырубить сады»(Citation: 103).
    Историк Д. А. Хожаев подводит итог: к 18 мая 1826 года «были уничтожены цветущие селения, вырублены прекрасные фруктовые сады, сожжены поля, угнан скот.
    Убиты люди, взяты в плен женщины и дети…
    Люди умирали от голода, холода и болезней»(Citation: 95).
  en: |-
    In January-May 1826 the Russian Empire conducted a large punitive campaign against the Nokhchi, devastating lowland villages for participation in Beibulat Taimiev’s uprising and forcing the inhabitants into submission.
    The historian D. A. Khozhaev writes that “in January 1826, having waited for a period inconvenient for the inhabitants of Chechnya, when the frosts made it difficult to shelter families, Yermolov begins a large punitive campaign into Chechnya,” occupying the aul of Bolshaya Ataga on January 26 and burning settlements one after another(Citation: 95).
    General Yermolov himself, in a report to Emperor Nicholas I of May 28, 1826, admits the course of the devastation: during the storming of Urus-Martan “the village was burned and its splendid orchards cut down,” at Stavna-Kul “16 souls of both sexes were taken prisoner, several people killed,” and the village of Shali he “ordered to be exterminated… and its orchards cut down”(Citation: 103).
    The historian D. A. Khozhaev sums up: by May 18, 1826, “flourishing settlements had been destroyed, splendid fruit orchards cut down, fields burned, livestock driven off.
    People were killed, women and children taken prisoner…
    People were dying of hunger, cold, and disease”(Citation: 95).
  uk: |-
    У січні-травні 1826 року Російська імперія провела великий каральний похід проти Нохчі, розоряючи рівнинні села за участь у повстанні Бейбулата Таймієва та примушуючи мешканців до покірності.
    Історик Д. А. Хожаєв пише, що «в січні 1826 року, дочекавшись незручного для мешканців Чечні періоду, коли через морози стало важко переховувати сім’ї, Єрмолов починає великий каральний похід у Чечню», зайнявши 26 січня аул Велика Атага та спалюючи селища одне за одним(Citation: 95).
    Сам генерал Єрмолов у рапорті імператору Миколі I від 28 травня 1826 року визнає перебіг розорення: під час штурму Урус-Мартана «село спалене, а прекрасні сади його вирубані», біля Ставна-куля «в полон узято обох статей 16 душ, убито кількох людей», а селище Шалі він «наказав винищити… і вирубати сади»(Citation: 103).
    Історик Д. А. Хожаєв підсумовує: до 18 травня 1826 року «були знищені квітучі селища, вирубані прекрасні фруктові сади, спалені поля, викрадена худоба.
    Убиті люди, взяті в полон жінки та діти…
    Люди помирали від голоду, холоду та хвороб»(Citation: 95).
