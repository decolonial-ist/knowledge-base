description:
  ru: |-
    Российская империя угоняла скот и обирала разорённые сёла нохчи.
    Историк Д. А. Хожаев пишет, что к 18 мая 1826 года был «угнан скот», а после возвращения войск Ермолов «послал отряд из 500 казаков на Даут-Мартан», и «селение было разорено и ограблено»(Citation: 95).
  en: |-
    The Russian Empire drove off livestock and plundered the ravaged villages of the Nokhchi.
    Historian D. A. Khozhaev writes that by May 18, 1826, «livestock had been driven off», and after the troops returned, Yermolov «sent a detachment of 500 Cossacks against Daut-Martan», and «the village was ravaged and plundered»(Citation: 95).
  uk: |-
    Російська імперія відганяла худобу й оббирала розорені села Нохчі.
    Історик Д. А. Хожаєв пише, що до 18 травня 1826 року було «відігнано худобу», а після повернення військ Єрмолов «послав загін із 500 козаків на Даут-Мартан», і «селище було розорене й пограбоване»(Citation: 95).
