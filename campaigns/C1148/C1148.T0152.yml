description:
  ru: |-
    Российская империя натравливала на нохчи соседний народ, чтобы ослабить их сопротивление.
    Историк Д. А. Хожаев пишет, что Ермолов, «пытаясь спровоцировать столкновение между чеченцами и ингушами… насильно собирал ингушей в милицию и направлял их вместе с царскими отрядами против чеченских аулов», хотя ингуши «отказывались идти против своих сородичей… дезертируя из милиции»(Citation: 95).
  en: |-
    The Russian Empire set a neighboring people against the Nokhchi in order to weaken their resistance.
    Historian D. A. Khozhaev writes that Yermolov, «attempting to provoke a clash between the Chechens and the Ingush… forcibly conscripted the Ingush into a militia and sent them together with tsarist detachments against Chechen auls», although the Ingush «refused to go against their kin… deserting from the militia»(Citation: 95).
  uk: |-
    Російська імперія нацьковувала на Нохчі сусідній народ, щоб послабити їхній опір.
    Історик Д. А. Хожаєв пише, що Єрмолов, «намагаючись спровокувати зіткнення між Чеченцями та Інгушами… насильно збирав Інгушів у міліцію і направляв їх разом із царськими загонами проти чеченських аулів», хоча Інгуші «відмовлялися йти проти своїх родичів… дезертируючи з міліції»(Citation: 95).
