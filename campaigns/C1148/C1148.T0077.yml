description:
  ru: |-
    Российская империя посылала войска разорять равнинные сёла нохчи, выбирая для удара самое уязвимое для жителей время.
    Историк Д. А. Хожаев пишет, что «в январе 1826 года, дождавшись неудобного для жителей Чечни периода, когда из-за морозов трудно стало укрывать семьи, Ермолов начинает большой карательный поход в Чечню», заняв 26 января аул Большая Атага(Citation: 95).
    Сам генерал Ермолов в рапорте императору Николаю I от 28 мая 1826 года доносил, что войска методично прорубали дороги и занимали селения: 12 апреля «занято без выстрела сел.
    Курчали», 16-го «войска перешли к сел.
    Гехи», 24-го «перешел к сел.
    Малая Рошни, которое найдено пустым»(Citation: 103).
  en: |-
    The Russian Empire sent troops to ravage the lowland villages of the Nokhchi, choosing the moment most vulnerable for the inhabitants to strike.
    Historian D. A. Khozhaev writes that «in January 1826, having waited for a period inconvenient for the inhabitants of Chechnya, when the frosts made it difficult to shelter families, Yermolov launches a large punitive campaign into Chechnya», occupying the aul of Bolshaya Ataga on January 26(Citation: 95).
    General Yermolov himself, in a report to Emperor Nicholas I dated May 28, 1826, reported that the troops were methodically cutting roads and occupying villages: on April 12 «the village of Kurchali was occupied without a shot», on the 16th «the troops moved to the village of Gekhi», and on the 24th he «moved to the village of Malaya Roshni, which was found empty»(Citation: 103).
  uk: |-
    Російська імперія посилала війська розоряти рівнинні села Нохчі, обираючи для удару найуразливіший для мешканців час.
    Історик Д. А. Хожаєв пише, що «в січні 1826 року, дочекавшись незручного для жителів Чечні періоду, коли через морози стало важко переховувати сім'ї, Єрмолов починає великий каральний похід у Чечню», зайнявши 26 січня аул Велика Атага(Citation: 95).
    Сам генерал Єрмолов у рапорті імператору Миколі I від 28 травня 1826 року доносив, що війська методично прорубували дороги та займали селища: 12 квітня «зайнято без пострілу сел.
    Курчалі», 16-го «війська перейшли до сел.
    Гехі», 24-го «перейшов до сел.
    Мала Рошні, яке знайдено порожнім»(Citation: 103).
