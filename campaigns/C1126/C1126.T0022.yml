description:
  ru: |-
    Правительство Московского Царства применяло показательные жестокие казни для психологического слома коренного населения: историк Я. З. Ахмадов фиксирует, что плененный лидер восстания был «повешен за ребро на крюке в соответствии с приказом Петра I П.М.
    Апраксину («учини жестокую смертную казнь»)»(Citation: 94).
  en: |-
    The government of the Tsardom of Muscovy used demonstrative brutal executions to psychologically break the Indigenous population: historian Ya.
    Z. Akhmadov records that the captured leader of the uprising was "hanged by a rib on a hook in accordance with Peter I's order to P.M. Apraksin ('carry out a cruel death penalty')"(Citation: 94).
  uk: |-
    Уряд Московського царства застосовував показові жорстокі страти для психологічного зламу корінного населення: історик Я. З. Ахмадов фіксує, що полонений лідер повстання був «повішений за ребро на гаку відповідно до наказу Петра I П.М.
    Апраксіну («вчини жорстоку смертну кару»)»(Citation: 94).
