description:
  ru: 'Правительство Московского Царства организовывало военные операции против обществ нохчи: историк Я. З. Ахмадов констатирует, что «меры, принятые Петром I по борьбе с булавинской «ребелией» и другими восстаниями, в т.ч. на Тереке против Чечни, были, по существу, карательными»(Citation: 94).'
  en: |-
    The government of the Tsardom of Muscovy organized military operations against Nokhchi societies: the historian Ya.
    Z. Akhmadov states that «the measures taken by Peter I to combat the Bulavin «rebeliya» and other uprisings, including on the Terek against Chechnya, were in essence punitive»(Citation: 94).
  uk: 'Уряд Московського царства організовував воєнні операції проти суспільств Нохчі: історик Я. З. Ахмадов констатує, що «заходи, вжиті Петром I для боротьби з булавінською «ребелією» та іншими повстаннями, зокрема на Тереку проти Чечні, були, по суті, каральними»(Citation: 94).'
