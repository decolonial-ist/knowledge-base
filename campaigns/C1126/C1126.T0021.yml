description:
  ru: 'Правительство Московского Царства пленило и физически устранило лидера сопротивления: историк Я. З. Ахмадов констатирует, что царь «лично решал судьбу руководителей повстанцев»(Citation: 94), в результате чего предводитель Мурат Кучуков, «попавший раненым в плен, был повешен»(Citation: 94).'
  en: |-
    The government of the Tsardom of Muscovy captured and physically eliminated a resistance leader: historian Ya.
    Z. Akhmadov states that the tsar "personally decided the fate of the insurgent leaders"(Citation: 94), as a result of which the leader Murat Kuchukov, "taken prisoner while wounded, was hanged"(Citation: 94).
  uk: 'Уряд Московського царства полонив і фізично знищив лідера опору: історик Я. З. Ахмадов констатує, що цар «особисто вирішував долю керівників повстанців»(Citation: 94), внаслідок чого ватажок Мурат Кучуков, «який пораненим потрапив у полон, був повішений»(Citation: 94).'
