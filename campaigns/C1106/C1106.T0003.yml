description:
  en: 'The propaganda apparatus of the Russian Empire used poetry to broadcast the logic of domination into society: the imperial historian and participant in the events V. A. Potto records that the poet A. S. Pushkin proclaimed in verse the inevitability of subjugation: «Submit, Caucasus - Yermolov is coming!»(Citation: 75), while the poet V. A. Zhukovsky extolled the destruction of infrastructure by military commanders: «Scarcely at the villages - the villages blaze»(Citation: 74).'
  uk: 'Апарат пропаганди Російської імперії використовував поезію для трансляції в суспільство логіки домінування: імперський історик і учасник подій В. О. Потто фіксує, що поет О. С. Пушкін у віршах проголошував неминучість підкорення: «Смирися, Кавказе, - іде Єрмолов!»(Citation: 75), а поет В. А. Жуковський вихваляв руйнування інфраструктури воєначальниками: «Лиш до сіл - палають села»(Citation: 74).'
  ru: 'Аппарат пропаганды Российской империи использовал поэзию для трансляции в общество логики доминирования: имперский историк и участник событий В. А. Потто фиксирует, что поэт А. С. Пушкин в стихах провозглашал неизбежность завоевания: «Смирись, Кавказ,- идет Ермолов!»(Citation: 75), а поэт В. А. Жуковский восхвалял разрушение инфраструктуры военачальниками: «Лишь к селам - пышут села»(Citation: 74).'
