description:
  ru: 'Оккупационная администрация Российской империи лишала коренное население статуса легитимного противника, применяя инверсию смыслов: историк Я. З. Ахмадов констатирует, что законная оборона маркировалась криминальными терминами, и «Антиколониальные и антифеодальные выступления населения Чечни, именуемые в официальных документах ''шалостями'', ''грабежами'' и ''убийствами'', воспринимались российским самодержавием как вызов и оскорбление»(Citation: 94), что служило формальным поводом для карательных действий.'
  en: |-
    The occupation administration of the Russian Empire stripped the Indigenous population of the status of a legitimate adversary by applying an inversion of meanings: historian Ya.
    Z. Akhmadov states that lawful defense was labeled with criminal terms, and «The anti-colonial and anti-feudal uprisings of the population of Chechnya, referred to in official documents as 'mischief', 'robberies', and 'murders', were perceived by the Russian autocracy as a challenge and an insult»(Citation: 94), which served as a formal pretext for punitive actions.
  uk: 'Окупаційна адміністрація Російської імперії позбавляла корінне населення статусу легітимного супротивника, застосовуючи інверсію смислів: історик Я. З. Ахмадов констатує, що законна оборона маркувалася кримінальними термінами, і «Антиколоніальні та антифеодальні виступи населення Чечні, іменовані в офіційних документах ''пустощами'', ''грабежами'' та ''вбивствами'', сприймалися російським самодержавством як виклик і образа»(Citation: 94), що слугувало формальним приводом для каральних дій.'
