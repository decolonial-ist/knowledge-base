name:
  en: Propagandistic Inversion of Roles and Dehumanization (1800–1864)
  uk: Пропагандистська інверсія ролей і дегуманізація (1800–1864 рр.)
  ru: Пропагандистская инверсия ролей и дегуманизация (1800–1864 гг.)
description:
  en: |-
    In the 19th century, the occupation administration of the Russian Empire and its propaganda apparatus used inversion of roles and the broadcasting of a logic of superiority to legitimize military aggression.
    Historian Ya.
    Z. Akhmadov states that «The anti-colonial and anti-feudal uprisings of the population of Chechnya, referred to in official documents as 'mischief', 'robberies' and 'murders', were perceived by the Russian autocracy as a challenge and an insult...
    All of this provoked cruel punitive actions incommensurate with the apparent cause»(Citation: 94).
    The practical application of this mechanism is recorded in reports: in 1800, the commander-in-chief of the troops, General B. F. Knorring, justified expeditions against the Indigenous population as protection from their «predatory plunder, villainous brigandage»(Citation: 94).
    In parallel, official historiography constructed an image of backwardness: the researcher points out that pre-revolutionary military science was characterized by an «apologia for the tsarist policy of conquest», under which the defensive struggle of the local population was labeled «the actions of barbarians devoid of 'civilized' notions of independence and freedom»(Citation: 66).
    Literature was used to broadcast chauvinism to the masses.
    The imperial historian and participant in the events V. A. Potto records that the poet A. S. Pushkin proclaimed in verse: «Submit, Caucasus — Yermolov comes!»(Citation: 75), while the poet V. A. Zhukovsky glorified the destruction of villages: «Toward the villages — the villages blaze»(Citation: 74).
    Relying on this foundation, General A. P. Yermolov justified repressions on the grounds that «the proconsul of the Caucasus cannot tame the cruelty of the local mores with mercy»(Citation: 75).
  uk: |-
    У XIX столітті окупаційна адміністрація Російської імперії та апарат пропаганди використовували інверсію ролей і трансляцію логіки вищості для легітимізації воєнної агресії.
    Історик Я. З. Ахмадов констатує, що «Антиколоніальні та антифеодальні виступи населення Чечні, іменовані в офіційних документах 'пустощами', 'грабежами' та 'вбивствами', сприймалися російським самодержавством як виклик і образа...
    Усе це викликало жорстокі каральні дії, несумірні з видимою причиною»(Citation: 94).
    Практичне застосування цього механізму фіксується в рапортах: у 1800 році головнокомандувач військами генерал Б. Ф. Кноррінг обґрунтовував експедиції проти корінного населення захистом від їхніх «хижацьких грабувань, злодійських розбоїв»(Citation: 94).
    Паралельно офіційна історіографія конструювала образ відсталості: дослідник зазначає, що дореволюційній воєнній науці була притаманна «апологія загарбницької політики царизму», за якої оборонна боротьба місцевого населення маркувалася «діями варварів, позбавлених 'цивілізованих' уявлень про незалежність і свободу»(Citation: 66).
    Для трансляції шовінізму в маси використовувалася література.
    Імперський історик і учасник подій В. О. Потто фіксує, що поет О. С. Пушкін у віршах проголошував: «Скорися, Кавказе, — іде Єрмолов!»(Citation: 75), а поет В. А. Жуковський вихваляв руйнування сіл: «Лиш до сіл — палають села»(Citation: 74).
    Спираючись на цю базу, генерал О. П. Єрмолов обґрунтовував репресії тим, що «проконсул Кавказу жорстокість тутешніх звичаїв не може приборкати милосердям»(Citation: 75).
  ru: |-
    В XIX веке оккупационная администрация Российской империи и аппарат пропаганды использовали инверсию ролей и трансляцию логики превосходства для легитимизации военной агрессии.
    Историк Я. З. Ахмадов констатирует, что «Антиколониальные и антифеодальные выступления населения Чечни, именуемые в официальных документах 'шалостями', 'грабежами' и 'убийствами', воспринимались российским самодержавием как вызов и оскорбление...
    Все это вызывало несоизмеримые с видимой причиной жестокие карательные действия»(Citation: 94).
    Практическое применение этого механизма фиксируется в рапортах: в 1800 году главнокомандующий войсками генерал Б. Ф. Кнорринг обосновывал экспедиции против коренного населения защитой от их «хищными граблениями, злодейскими разбоями»(Citation: 94).
    Параллельно официальная историография конструировала образ отсталости: исследователь указывает, что дореволюционной военной науке была характерна «апология захватнической политики царизма», при которой оборонительная борьба местного населения маркировалась «действиями варваров, лишенных 'цивилизованных' представлений о независимости и свободе»(Citation: 66).
    Для трансляции шовинизма в массы использовалась литература.
    Имперский историк и участник событий В. А. Потто фиксирует, что поэт А. С. Пушкин в стихах провозглашал: «Смирись, Кавказ,- идет Ермолов!»(Citation: 75), а поэт В. А. Жуковский восхвалял разрушения деревень: «Лишь к селам - пышут села»(Citation: 74).
    Опираясь на эту базу, генерал А. П. Ермолов обосновывал репрессии тем, что «проконсул Кавказа жестокость здешних нравов не может укротить милосердием»(Citation: 75).
