description:
  ru: |-
    За шейхом Али Митаевым, членом Чеченского ревкома, ГПУ установило «тщательное наблюдение», а весной 1924 года «приняло решение «об изъятии» из Чечни А. Митаева.
    Официальные договоренности с ним были коварно нарушены, он был внезапно арестован, вывезен в Ростов-на-Дону и, после недолгого следствия, расстрелян»(Citation: 125); историк Е. Ф. Жупикова датирует арест 19 апреля 1924 года и приводит формулу обвинения ГПУ - «за его связь с контрреволюционными организациями»(Citation: 256).
    Характер расправы и её исполнителей историки называют своими именами: «Убийство чекистами А. Митаева», - пишут Я. З. Ахмадов и Э. Х. Хасмагомадов(Citation: 125).
  en: |-
    Over Sheikh Ali Mitaev, a member of the Chechen revkom, the GPU set "thorough surveillance", and in the spring of 1924 it "took the decision 'on the removal' of A. Mitaev from Chechnya.
    The official agreements with him were treacherously broken; he was suddenly arrested, taken to Rostov-on-Don and, after a brief investigation, shot"(Citation: 125); historian E. F. Zhupikova dates the arrest to 19 April 1924 and cites the GPU's formula of accusation - "for his connection with counter-revolutionary organizations"(Citation: 256).
    The historians call the character of the reprisal and its perpetrators by their proper names: "The murder of A. Mitaev by the Chekists," write Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov(Citation: 125).
  uk: |-
    За шейхом Алі Мітаєвим, членом Чеченського ревкому, ГПУ встановило «ретельне спостереження», а навесні 1924 року «ухвалило рішення «про вилучення» з Чечні А. Мітаєва.
    Офіційні домовленості з ним були віроломно порушені, він був раптово заарештований, вивезений у Ростов-на-Дону і, після недовгого слідства, розстріляний»(Citation: 125); історик Є. Ф. Жупікова датує арешт 19 квітня 1924 року і наводить формулу звинувачення ГПУ - «за його зв'язок з контрреволюційними організаціями»(Citation: 256).
    Характер розправи та її виконавців історики називають своїми іменами: «Убивство чекістами А. Мітаєва», - пишуть Я. З. Ахмадов і Е. Х. Хасмагомадов(Citation: 125).
