description:
  ru: |-
    Советский Союз 9 мая 1924 года секретным постановлением Президиума ЦИК дал ОГПУ «право внесудебной расправы в отношении бандитов и их пособников, а именно: высылка из данной местности, заключение в концентрационный лагерь на срок до 3-х лет и применение высшей меры наказания - расстрел», а республикам предписал объявлять местности «неблагополучными по бандитизму», где органы ГПУ «вправе решать по своему усмотрению любое дело о бандитизме»(Citation: 474).
    Чеченские власти уже в том же мае телеграфировали в центр: «Санкционируйте создание трибунала или политической тройки»(Citation: 259).
    Заработавшие тройки «в составе работника прокуратуры, ГПУ и первого партийного руководителя, — как правило, выносили приговоры заочно — по представленным документам, часто даже не допрашивая обвиняемого.
    Об участии в процессе защиты не могло быть и речи»(Citation: 125).
  en: |-
    On 9 May 1924 the Soviet Union, by a secret resolution of the Presidium of the Central Executive Committee (TsIK), gave the OGPU "the right of extrajudicial reprisal against bandits and their accomplices, namely: expulsion from the given locality, confinement in a concentration camp for a term of up to 3 years, and the application of the supreme measure of punishment - shooting", and prescribed that the republics declare localities "unfavorable in respect of banditry", where the GPU organs "are entitled to decide at their own discretion any case of banditry"(Citation: 474).
    The Chechen authorities already in that same May telegraphed the center: "Sanction the creation of a tribunal or a political troika"(Citation: 259).
    The troikas that went to work, "composed of an official of the procuracy, the GPU and the first party leader, — as a rule, passed sentences in absentia — on the basis of the submitted documents, often without even questioning the accused.
    Of any participation of a defense in the proceedings there could be no talk"(Citation: 125).
  uk: |-
    Радянський Союз 9 травня 1924 року таємною постановою Президії ЦВК дав ОГПУ «право позасудової розправи щодо бандитів та їхніх посібників, а саме: висилка з даної місцевості, ув'язнення в концентраційний табір на строк до 3-х років і застосування вищої міри покарання - розстріл», а республікам приписав оголошувати місцевості «неблагополучними щодо бандитизму», де органи ГПУ «мають право вирішувати на свій розсуд будь-яку справу про бандитизм»(Citation: 474).
    Чеченська влада вже в тому ж травні телеграфувала в центр: «Санкціонуйте створення трибуналу або політичної трійки»(Citation: 259).
    Трійки, що запрацювали, «у складі працівника прокуратури, ГПУ і першого партійного керівника, — як правило, виносили вироки заочно — за поданими документами, часто навіть не допитуючи звинуваченого.
    Про участь у процесі захисту не могло бути й мови»(Citation: 125).
