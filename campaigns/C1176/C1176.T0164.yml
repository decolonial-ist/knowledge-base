description:
  en: |-
    In 1920 the Red Army looted the Chechen villages where it was stationed: the units quartered in Chechnya, historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write, "received almost no property or food allowance", which pushed them into "self-supply" - "...the Red Army not only ran riot, but took away grain, cattle and so forth, terrorizing the population with senseless killings"(Citation: 125).
    In the summer of 1920, in Tsentoroy, the Chechens routed a unit of the Caucasus Labor Army "engaged in outright plunder"(Citation: 125).
    The property of the killed was taken too: during the disarmament of May 1922 "up to 30 'bandits' were captured and shot, and their property was confiscated by the authorities"(Citation: 125).
  uk: |-
    Червона армія в 1920 році грабувала чеченські села, в яких стояла: розквартировані в Чечні частини, пишуть історики Я. З. Ахмадов і Е. Х. Хасмагомадов, «майже не отримували майнового і продовольчого забезпечення», що змушувало їх займатися «самопостачанням» - «...Червона Армія не тільки бешкетувала, а й відбирала хліб, худобу та інше, тероризуючи населення безцільними вбивствами»(Citation: 125).
    Влітку 1920 року в Центорої чеченці розгромили підрозділ Кавказької трудової армії, «що займався прямими грабежами»(Citation: 125).
    Забирали й майно вбитих: під час роззброєння у травні 1922 року «було захоплено і розстріляно до 30 «бандитів», чиє майно влада конфіскувала»(Citation: 125).
  ru: |-
    Красная армия в 1920 году грабила чеченские сёла, в которых стояла: расквартированные в Чечне части, пишут историки Я. З. Ахмадов и Э. Х. Хасмагомадов, «почти не получали имущественного и продовольственного довольствия», что вынуждало их заниматься «самоснабжением» - «...Красная Армия не только дебоширила, но отбирала хлеб, скот и проч., терроризируя население бесцельными убийствами»(Citation: 125).
    Летом 1920 года в Центорое чеченцы разгромили подразделение Кавказской трудовой армии, «занимавшееся прямыми грабежами»(Citation: 125).
    Забирали и имущество убитых: при разоружении в мае 1922 года «было захвачено и расстреляно до 30 «бандитов», чье имущество власти конфисковали»(Citation: 125).
