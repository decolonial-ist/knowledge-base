description:
  en: |-
    Soviet Russia disarmed Chechen villages by military operations through all five years of the campaign.
    Historian E. F. Zhupikova writes: the Caucasus Labor Army "conducted" disarmament operations "...in 1920; in March-August 1921 the Chechen auls of Gordali, Tsentoroy, Belgatoy, Dargo, Benoy, Vedeno, Groznensky and Shali, which had taken part in the mutiny of N. Gotsinsky, were disarmed"(Citation: 256).
    In May 1922 the troops sent into Chechnya were headed by Gikalo - secretary of the Mountain oblast committee (obkom) of the party(Citation: 475), who in the war with Denikin had commanded insurgent detachments in the mountains of Chechnya(Citation: 256): "The villages of Makhkety, Goity and Katyr-Yurt were subjected to disarmament, with combat aviation used against the latter.
    Besides the seizure of a significant quantity of weapons, up to 30 'bandits' were captured and shot, and their property was confiscated by the authorities"(Citation: 125).
    The year 1924 "ended in the Chechen Autonomous Oblast with a large military operation to seize weapons, in the course of which almost 3 thousand rifles and about 400 revolvers and pistols were collected"(Citation: 125).
  uk: |-
    Радянська Росія роззброювала чеченські села військовими операціями всі п'ять років кампанії.
    Історик Є. Ф. Жупікова пише: операції з роззброєння Кавказька трудова армія «проводила... у 1920 р.; у березні-серпні 1921 р. було роззброєно чеченські аули Гордалі, Центорой, Белгатой, Дарго, Беной, Ведено, Грозненський, Шалі, що брали участь у заколоті Н. Гоцинського»(Citation: 256).
    У травні 1922 року війська, направлені в Чечню, очолив Гікало - секретар Гірського обкому партії(Citation: 475), який у війну з Денікіним командував повстанськими загонами в горах Чечні(Citation: 256): «Роззброєння зазнали селища Махкети, Гойти і Катир-Юрт, причому проти останніх було використано бойову авіацію.
    Крім вилучення значної кількості зброї, було захоплено і розстріляно до 30 «бандитів», чиє майно влада конфіскувала»(Citation: 125). 1924 рік «завершився в Чеченській АО великою військовою операцією з вилучення зброї, у ході якої вдалося зібрати майже 3 тисячі гвинтівок і близько 400 револьверів і пістолетів»(Citation: 125).
  ru: |-
    Советская Россия разоружала чеченские сёла войсковыми операциями все пять лет кампании.
    Историк Е. Ф. Жупикова пишет: операции по разоружению Кавказская трудовая армия «проводила... в 1920 г.; в марте-августе 1921 г. были разоружены участвовавшие в мятеже Н. Гоцинского чеченские аулы Гордали, Центорой, Белгатой, Дарго, Беной, Ведено, Грозненский, Шали»(Citation: 256).
    В мае 1922 года войска, направленные в Чечню, возглавил Гикало - секретарь Горского обкома партии(Citation: 475), в войну с Деникиным командовавший повстанческими отрядами в горах Чечни(Citation: 256): «Разоружению подверглись селения Махкеты, Гойты и Катыр-Юрт, причем против последних была использована боевая авиация.
    Кроме изъятия значительного количества оружия, было захвачено и расстреляно до 30 «бандитов», чье имущество власти конфисковали»(Citation: 125). 1924 год «завершился в Чеченской АО крупной войсковой операцией по изъятию оружия, в ходе которой удалось собрать почти 3 тысячи винтовок и около 400 револьверов и пистолетов»(Citation: 125).
