description:
  ru: |-
    Советская Россия поставила над Чечнёй невыборный чрезвычайный орган: 3 апреля 1920 года съезд в Грозном «провозгласил передачу всей власти Чеченскому революционному комитету из пяти человек»(Citation: 125).
    Когда на выборах в Советы в июле 1920 года «подавляющее большинство мест в Советах получили... представители так называемых «кулацко-мульских и националистических элементов»», избранные Советы распускались - историки Я. З. Ахмадов и Э. Х. Хасмагомадов фиксируют: «крестьянские Советы за короткий срок распускались дважды (в августе 1921 и в июле 1922 г.) и вновь восстанавливалась власть ревкома»(Citation: 125).
    Осенью 1920 года «Алдынский съезд был разогнан, а несколько грозненских партийных работников... арестованы» по распоряжению главы Кавказского бюро ЦК компартии Орджоникидзе(Citation: 125).
    Горская АССР, оформившая автономию горцев, «просуществовала недолго и в 1924 г., выполнив по мысли партийного руководства свои задачи, прекратила свое существование»(Citation: 125).
  en: |-
    Soviet Russia placed an unelected extraordinary body over Chechnya: on 3 April 1920 a congress in Grozny "proclaimed the transfer of all power to the Chechen Revolutionary Committee of five members"(Citation: 125).
    When at the elections to the Soviets in July 1920 "the overwhelming majority of seats in the Soviets went to... representatives of the so-called 'kulak-mullah and nationalist elements'", the elected Soviets were dissolved - historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov record: "within a short span the peasant Soviets were dissolved twice (in August 1921 and in July 1922) and the power of the revkom was restored again"(Citation: 125).
    In the autumn of 1920 "the Aldy congress was dispersed, and several Grozny party workers... arrested" on the orders of Ordzhonikidze, head of the Caucasus Bureau of the Communist Party's Central Committee(Citation: 125).
    The Mountain ASSR, which had given legal form to the highlanders' autonomy, "did not last long and in 1924, having fulfilled its tasks as conceived by the party leadership, ceased to exist"(Citation: 125).
  uk: |-
    Радянська Росія поставила над Чечнею невиборний надзвичайний орган: 3 квітня 1920 року з'їзд у Грозному «проголосив передачу всієї влади Чеченському революційному комітету з п'яти осіб»(Citation: 125).
    Коли на виборах до Рад у липні 1920 року «переважну більшість місць у Радах отримали... представники так званих «куркульсько-мульських і націоналістичних елементів»», обрані Ради розпускалися - історики Я. З. Ахмадов і Е. Х. Хасмагомадов фіксують: «селянські Ради за короткий строк розпускалися двічі (у серпні 1921 і в липні 1922 р.) і знову відновлювалася влада ревкому»(Citation: 125).
    Восени 1920 року «Алдинський з'їзд було розігнано, а кількох грозненських партійних працівників... заарештовано» за розпорядженням глави Кавказького бюро ЦК компартії Орджонікідзе(Citation: 125).
    Гірська АСРР, що оформила автономію горців, «проіснувала недовго і в 1924 р., виконавши, за задумом партійного керівництва, свої завдання, припинила своє існування»(Citation: 125).
