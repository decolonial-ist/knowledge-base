description:
  en: |-
    Soviet Russia carried out executions for show: "During the Chechen congress in Grozny, by verdict of the local Cheka, 7 Chechens were demonstratively shot.
    The execution made such '...a devastating impression on the masses of Chechens who had not yet had time to disperse after the congress' that the command of the Caucasus Labor Army demanded that henceforth death sentences on Chechens be carried out as far away from Chechnya as possible"(Citation: 125).
  uk: |-
    Радянська Росія страчувала напоказ: «Під час проведення чеченського з'їзду в Грозному за вироком місцевої ЧК було демонстративно розстріляно 7 чеченців.
    Ця страта справила настільки «...убивче враження на маси чеченців, які не встигли роз'їхатися після з'їзду», що командування Кавказької Трудової Армії вимагало надалі виконувати смертні вироки над чеченцями якомога далі від Чечні»(Citation: 125).
  ru: |-
    Советская Россия казнила напоказ: «Во время проведения чеченского съезда в Грозном по приговору местной ЧК были демонстративно расстреляны 7 чеченцев.
    Эта казнь произвела настолько «...убийственное впечатление на массы не успевших разъехаться после съезда чеченцев», что командование Кавказской Трудовой Армии потребовало впредь приводить в исполнение смертные приговоры над чеченцами как можно дальше от Чечни»(Citation: 125).
