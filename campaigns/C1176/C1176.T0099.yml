description:
  ru: 'В 1923-1924 годах Чеченский ревком сделал заложничество официальной практикой борьбы с «бандитизмом»: «Были приняты меры к взятию на учет всех имевшихся в Чечне преступников и введена практика взятия заложников из числа близких родственников скрывающихся бандитов»(Citation: 125).'
  en: 'In 1923-1924 the Chechen revkom made hostage-taking an official practice of the fight against "banditry": "Measures were taken to register all criminals present in Chechnya, and the practice was introduced of taking hostages from among the close relatives of bandits in hiding"(Citation: 125).'
  uk: 'У 1923-1924 роках Чеченський ревком зробив заручництво офіційною практикою боротьби з «бандитизмом»: «Було вжито заходів щодо взяття на облік усіх наявних у Чечні злочинців і запроваджено практику взяття заручників з числа близьких родичів бандитів, які переховуються»(Citation: 125).'
