name:
  en: Police Registration and Restriction of Settlement (1631–1640)
  uk: Поліцейський облік та обмеження розселення (1631–1640)
  ru: Полицейский учет и ограничение расселения (1631–1640)
description:
  en: |-
    The occupation administration of the Tsardom of Muscovy introduced rigid statistical control and restricted the right of the Nokhchi societies (Okochans, Michkiz, and Shibut) to free movement within the controlled territory.
    In 1631, Tsar Mikhail Fedorovich issued a decree to the Prikaz of the Kazan Palace on a census of the newcomer population of the town of Terki, directly prohibiting the free residence of unsanctioned migrants.
    The document prescribed identifying persons «whom it will not be possible to trust», and such people were «to be ordered sent out of the town of Terki, and ordered to go back to wherever each had come from, so that no harm would come to the town from them»(Citation: 92).
    To implement this mechanism, the metropole regularly conducted a total demographic accounting.
    In the state register of serving people for the region of the Prikaz of the Kazan Palace for 1637, the central authorities recorded in detail the number of inhabitants, including 350 serving «Okotsk people» and 680 newcomer «Okochans, and Tatars, and Michkiz, and Shibut»(Citation: 82).
    In 1640, on the orders of the Terek voivode, the Terek syn boyarsky P. Lukin and the clerk F. Belkov compiled a detailed name-by-name register of the population of the slobodas, rigidly documenting every household of the subordinated Nokhchi (Okochans) to ensure constant surveillance(Citation: 92)(Citation: 82).
  uk: |-
    Окупаційна адміністрація Московського царства запровадила жорсткий статистичний контроль та обмежила право на вільне пересування товариств Нохчі (Окочан, Мічкізян і Шибутян) на підконтрольній території. 1631 року цар Михайло Федорович видав указ до приказу Казанського палацу про перепис прийшлого населення Терського міста, прямо заборонивши вільне проживання несанкціонованих переселенців.
    У документі приписувалося виявляти осіб, «вірити яким буде не можна», і таких людей «з Терського міста веліти висилати геть, і веліти їм їхати туди, звідки хто приїхав, щоб від них місту якогось лиха не сталося»(Citation: 92).
    Для реалізації цього механізму метрополія регулярно проводила тотальний демографічний облік.
    У державному розписі служилих людей по області приказу Казанського палацу на 1637 рік центральна влада детально зафіксувала чисельність жителів, зокрема 350 служилих «окоцьких людей» та 680 прихожих «Окочан, і Татар, і Мічкізян, і Шибутян»(Citation: 82). 1640 року за розпорядженням терського воєводи терський син боярський П. Лукін та піддячий Ф. Бєлков склали докладний поіменний розпис населення слобід, жорстко паспортизувавши кожен двір підкорених Нохчі (Окочан) для забезпечення постійного нагляду(Citation: 92)(Citation: 82).
  ru: |-
    Оккупационная администрация Московского Царства ввела жесткий статистический контроль и ограничила право на свободное перемещение обществ нохчи (окочан, мичкизян и шибутян) на подконтрольной территории.
    В 1631 году царь Михаил Федорович издал указ в приказ Казанского дворца о переписи пришлого населения Терского города, прямо запретив свободное проживание несанкционированных переселенцев.
    В документе предписывалось выявлять лиц, «верить которым будет не мочно», и таких людей «ис Терского города велети высылать вон, и велеть им ехать отколь хто приехал, чтоб от них городу какое дурно не учинилось»(Citation: 92).
    Для реализации этого механизма метрополия регулярно проводила тотальный демографический учет.
    В государственной росписи служилым людям по области приказа Казанского дворца на 1637 год центральная власть детально зафиксировала численность жителей, включая 350 служилых «окотцких людей» и 680 прихожих «окочан, и татар, и мичкизян, и шибутян»(Citation: 82).
    В 1640 году по распоряжению терского воеводы терский сын боярский П. Лукин и подьячий Ф. Белков составили подробную поименную роспись населения слобод, жестко паспортизировав каждый двор подчиненных нохчи (окочан) для обеспечения постоянного надзора(Citation: 92)(Citation: 82).
