description:
  ru: 'Оккупационная администрация метрополии юридически запретила свободное проживание коренного населения в Терском городе, организовав принудительную высылку неутвержденных лиц и тотальный демографический контроль: в 1631 году царь Михаил Федорович издал указ в приказ Казанского дворца, предписывающий переписать прихожих нохчи (мичкизян и окочан) и постановляющий, что тех из них, кому «верить которым будет не мочно», необходимо «ис Терского города велети высылать вон, и велеть им ехать отколь хто приехал»(Citation: 92); для обеспечения надзора в государственной росписи служилым людям по области приказа Казанского дворца на 1637 год центральная власть детально зафиксировала количество подчиненных жителей Терского города, включая 350 «окотцких людей» и 680 прихожих «окочан, и татар, и мичкизян, и шибутян»(Citation: 82); а в 1640 году по распоряжению терского воеводы терский сын боярский П. Лукин и подьячий Ф. Белков составили поименную роспись населения Терских слобод, жестко зафиксировав каждый двор подчиненных нохчи (окочан)(Citation: 92)(Citation: 82).'
  en: 'The metropole''s occupation administration legally prohibited the free residence of the Indigenous population in Tersky Town, organizing the forced expulsion of unapproved persons and total demographic control: in 1631, Tsar Mikhail Fyodorovich issued a decree to the Prikaz of the Kazan Palace ordering a census of the newly arrived Nokhchi (Michkizians and Okochans) and ruling that those of them «who cannot be trusted» must be «ordered to be expelled out of Tersky Town, and ordered to go back whence each had come»(Citation: 92); to ensure surveillance, in the state register of serving people for the region of the Prikaz of the Kazan Palace for 1637, the central authorities recorded in detail the number of subordinate residents of Tersky Town, including 350 «Okotsky people» and 680 newly arrived «Okochans, and Tatars, and Michkizians, and Shibutians»(Citation: 82); and in 1640, on the orders of the Terek voivode, the Terek syn boyarsky P. Lukin and the clerk F. Belkov compiled a name-by-name register of the population of the Terek slobodas, rigidly recording every household of the subordinate Nokhchi (Okochans)(Citation: 92)(Citation: 82).'
  uk: 'Окупаційна адміністрація метрополії юридично заборонила вільне проживання корінного населення в Терському місті, організувавши примусове виселення незатверджених осіб і тотальний демографічний контроль: 1631 року цар Михайло Федорович видав указ до приказу Казанського палацу, що приписував переписати прийшлих Нохчі (Мічкізян та Окочан) і постановляв, що тих із них, кому «вірити буде не можна», необхідно «з Терського міста веліти висилати геть, і веліти їм їхати туди, звідки хто приїхав»(Citation: 92); для забезпечення нагляду в державному розписі служилим людям по області приказу Казанського палацу на 1637 рік центральна влада детально зафіксувала кількість підпорядкованих жителів Терського міста, включно з 350 «окоцькими людьми» та 680 прийшлими «Окочанами, і Татарами, і Мічкізянами, і Шибутянами»(Citation: 82); а 1640 року за розпорядженням терського воєводи терський син боярський П. Лукін і под''ячий Ф. Бєлков склали поіменний розпис населення Терських слобід, жорстко зафіксувавши кожен двір підпорядкованих Нохчі (Окочан)(Citation: 92)(Citation: 82).'
