description:
  ru: |-
    Перевод казаков на положение бесправных военных поселенцев (аракчеевщина), спровоцировавший восстание 1817 года: «Толчком к нему стал приказ об упразднении Бугского казацкого войска и превращении казаков в военных поселенцев…
    Расправа с восставшими казаками была чрезвычайно жестокой, многих из них порубили саблями, утопили в Южном Буге, засекли батогами»(Citation: 185).
    Актов было два, по разные стороны восстания: именной указ от 17 апреля 1817 года передал округ Бугского войска «в непосредственное военное управление» (ПСЗРИ, т. XXXIV, № 26.802) - он и стал толчком; указ от 8 октября 1817 года (№ 27.081), уже после подавления, оформил ликвидацию: «название Бугского казачьего войска уничтожается»(Citation: 448).
  en: |-
    The transfer of Cossacks to the status of rightless military settlers (the Arakcheev system), which provoked the uprising of 1817: "The trigger was the order abolishing the Buh Cossack Host and turning the Cossacks into military settlers…
    The reprisal against the rebellious Cossacks was extraordinarily brutal: many were cut down with sabers, drowned in the Southern Buh, flogged to death"(Citation: 185).
    There were two acts, on opposite sides of the uprising: the nominal decree of April 17, 1817 transferred the Buh Host's district "into direct military administration" (PSZRI, vol.
    XXXIV, no. 26,802) - this was the trigger; the decree of October 8, 1817 (no. 27,081), issued after the suppression, formalized the liquidation: "the name of the Buh Cossack Host is abolished"(Citation: 448).
  uk: |-
    Переведення козаків на становище безправних військових поселенців (аракчеєвщина), що спровокувало повстання 1817 року: «Поштовхом до нього став наказ про скасування Бузького козацького війська і перетворення козаків на військ. поселенців…
    Розправа з повсталими козаками була надзвичайно жорстокою, багатьох із них порубали шаблями, потопили в Пд.
    Бузі, засікли батогами»(Citation: 185).
    Актів було два, по різні боки повстання: іменний указ від 17 квітня 1817 року передав округ Бузького війська «в безпосереднє військове управління» (ПСЗРІ, т. XXXIV, № 26.802) - він і став поштовхом; указ від 8 жовтня 1817 року (№ 27.081), уже після придушення, оформив ліквідацію: «назва Бузького козачого війська знищується»(Citation: 448).
