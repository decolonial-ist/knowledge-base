description:
  ru: 'Переманивание на сторону империи кошевого атамана Гладкого в 1828 году: часть задунайцев «во главе с кошевым атаманом О.Гладким 30(18) мая 1828 перешли Килийское гирло Дуная, вошли в Измаильский порт и присоединились к российской армии»(Citation: 189).'
  en: 'The luring of kish otaman Hladky over to the empire''s side in 1828: part of the Danubians "headed by kish otaman Y. Hladky, on May 30 (18), 1828, crossed the Kiliya mouth of the Danube, entered the port of Izmail, and joined the Russian army"(Citation: 189).'
  uk: 'Переманювання на бік імперії кошового отамана Гладкого 1828 року: частина задунайців «на чолі з кошовим отаманом Й.Гладким 30(18) трав. 1828 перейшли Кілійське гирло Дунаю, увійшли до Ізмаїльського порту й приєдналися до рос. армії»(Citation: 189).'
