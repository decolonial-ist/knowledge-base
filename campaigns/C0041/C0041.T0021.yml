description:
  ru: 'Переход атамана оставил оставшихся за Дунаем казаков под ударом Порты и положил конец последней казацкой вольнице: Задунайская Сечь «существовала с последней четверти 18 в. по 1828»(Citation: 189).'
  en: 'The otaman''s defection left the Cossacks remaining beyond the Danube exposed to the Porte''s retaliation and put an end to the last free Cossack host: the Danubian Sich "existed from the last quarter of the 18th century until 1828"(Citation: 189).'
  uk: 'Перехід отамана залишив козаків, що зосталися за Дунаєм, під ударом Порти й поклав край останній козацькій вольниці: Задунайська Січ «існувала з останньої чв. 18 ст. по 1828»(Citation: 189).'
