description:
  ru: 'Для обеспечения политического подчинения элиты нохчи администрация использовала финансовое стимулирование: историк Мурат Яшар (Murat Yasar) указывает, что «подписание шерти шло рука об руку с денежным содержанием и подарками, которые царь давал местным правителям»(Citation: 72).'
  en: 'To secure the political subordination of the Nokhchi elite, the administration used financial incentives: historian Murat Yasar points out that «the signing of the shert went hand in hand with monetary allowances and gifts that the tsar gave to local rulers»(Citation: 72).'
  uk: 'Для забезпечення політичного підпорядкування еліти Нохчі адміністрація використовувала фінансове стимулювання: історик Мурат Яшар (Murat Yasar) вказує, що «підписання шерті йшло пліч-о-пліч із грошовим утриманням та подарунками, які цар давав місцевим правителям»(Citation: 72).'
