name:
  en: Beginning of the political subjugation of the Nokhchi (1588–1591)
  uk: Початок політичного підпорядкування Нохчі (1588–1591)
  ru: Начало политического подчинения нохчи (1588–1591)
description:
  en: |-
    The occupation administration of the Tsardom of Muscovy imposed vassalage on the Nokhchi elite under the guise of a military alliance through the procedure of oath-taking (shert).
    As historian Murat Yasar notes, to the Nokhchi this looked like a military pact: "many local rulers in Muscovy's southern and eastern borderlands, especially in the North Caucasus, regarded the shert more as a military alliance between themselves and one of their potential allies"(Citation: 72).
    The administration, however, unilaterally interpreted this act as unconditional submission: historian Michael Khodarkovsky points out that "in Moscow's eyes the shert now meant an oath of allegiance by the tsar's new and loyal subjects"(Citation: 70).
    Historian Murat Yasar adds that consent was incentivized through bribery: "the signing of the shert went hand in hand with the monetary allowances and gifts that the tsar gave to the local rulers"(Citation: 72).
    To maintain control, the forcible seizure of relatives of Nokhchi leaders was employed: E. N. Kusheva, compiler of a collection of documents, writes that "his nephew Batai was left as a hostage (amanat) in the Terek town"(Citation: 82).
    The subordinated Nokhchi communities were obligated to take part in the military operations of the occupation administration: E. N. Kusheva, compiler of a collection of documents, points to documents "on the possibility of the participation of Murza Shikh... in a campaign of Russian fighting men"(Citation: 82).
  uk: |-
    Окупаційна адміністрація Московського царства нав'язала васалітет еліті Нохчі під виглядом військового союзу через процедуру складання присяги (шерті).
    Як зазначає історик Мурат Яшар (Murat Yasar), для Нохчі це виглядало як військовий пакт: «багато місцевих правителів у південних і східних прикордонних зонах Московії, особливо на Північному Кавказі, розглядали шерть радше як військовий союз між ними та одним із потенційних союзників»(Citation: 72).
    Однак адміністрація в односторонньому порядку трактувала цей акт як беззастережне підпорядкування: історик Майкл Ходарковський (Michael Khodarkovsky) вказує, що «в очах Москви шерть тепер означала присягу на вірність нових і відданих підданих царя»(Citation: 70).
    Історик Мурат Яшар додає, що згода стимулювалася підкупом: «підписання шерті йшло пліч-о-пліч із грошовим утриманням і подарунками, які цар давав місцевим правителям»(Citation: 72).
    Для утримання контролю застосовувалося силове захоплення родичів лідерів Нохчі: укладачка збірника документів Е. Н. Кушева пише, що «аманатом у Терському місті було залишено його племінника Батая»(Citation: 82).
    Підпорядковані спільноти Нохчі зобов'язувалися брати участь у військових операціях окупаційної адміністрації: укладачка збірника документів Е. Н. Кушева вказує на документи «про можливість участі мурзи Шиха... у поході російських ратних людей»(Citation: 82).
  ru: |-
    Оккупационная администрация Московского Царства навязала вассалитет элите нохчи под видом военного союза через процедуру принесения клятвы (шерти).
    Как отмечает историк Мурат Яшар (Murat Yasar), для нохчи это выглядело как военный пакт: «многие местные правители в южных и восточных пограничных зонах Московии, особенно на Северном Кавказе, рассматривали шерть скорее как военный союз между ними и одним из потенциальных союзников»(Citation: 72).
    Однако администрация в одностороннем порядке трактовала этот акт как безоговорочное подчинение: историк Майкл Ходарковский (Michael Khodarkovsky) указывает, что «в глазах Москвы шерть теперь означала клятву верности новых и преданных подданных царя»(Citation: 70).
    Историк Мурат Яшар дополняет, что согласие стимулировалось подкупом: «подписание шерти шло рука об руку с денежным содержанием и подарками, которые царь давал местным правителям»(Citation: 72).
    Для удержания контроля применялся силовой захват родственников лидеров нохчи: составитель сборника документов Е. Н. Кушева пишет, что «аманатом в Терском городе был оставлен его племянник Батай»(Citation: 82).
    Подчиненные общества нохчи обязывались участвовать в военных операциях оккупационной администрации: составитель сборника документов Е. Н. Кушева указывает на документы «о возможности участия мурзы Шиха... в походе русских ратных людей»(Citation: 82).
