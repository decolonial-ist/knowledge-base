description:
  en: 'The occupation administration obliged the subordinated Nokhchi societies to take part in military campaigns: historian E. N. Kusheva points to documents «on the possibility of the participation of Murza Shikh... in a campaign of Russian men-at-arms»(Citation: 82).'
  uk: 'Окупаційна адміністрація зобов''язувала підпорядковані спільноти Нохчі брати участь у військових кампаніях: історик Е. Н. Кушева вказує на документи «про можливість участі мурзи Шиха... в поході російських ратних людей»(Citation: 82).'
  ru: 'Оккупационная администрация обязывала подчиненные общества нохчи участвовать в военных кампаниях: историк Е. Н. Кушева указывает на документы «о возможности участия мурзы Шиха... в походе русских ратных людей»(Citation: 82).'
