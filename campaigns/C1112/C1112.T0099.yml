description:
  ru: 'В качестве гарантии подчинения оккупационная администрация удерживала представителей элиты нохчи: историк Е. Н. Кушева пишет, что «аманатом в Терском городе был оставлен его племянник Батай»(Citation: 82).'
  en: 'As a guarantee of submission, the occupation administration detained representatives of the Nokhchi elite: historian E. N. Kusheva writes that «his nephew Batai was left as an amanat (hostage) in the Terek town»(Citation: 82).'
  uk: 'Як гарантію підпорядкування окупаційна адміністрація утримувала представників еліти Нохчі: історик Е. Н. Кушева пише, що «аманатом у Терському місті був залишений його племінник Батай»(Citation: 82).'
