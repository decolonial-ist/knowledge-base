description:
  en: 'The forced conscription of millions into the imperial army: "During the war years, 3.5 million Ukrainians were mobilized into the ranks of the Russian army (by other data – 4.5 million out of a total of 15.5 million)"(Citation: 195).'
  uk: 'Примусовий призов мільйонів до імперської армії: «За роки війни до лав рос. армії було мобілізовано 3,5 млн українців (за ін. даними — 4,5 млн із заг. чисельності 15,5 млн)»(Citation: 195).'
  ru: 'Принудительный призыв миллионов в имперскую армию: «За годы войны в ряды российской армии было мобилизовано 3,5 млн украинцев (по другим данным — 4,5 млн из общей численности 15,5 млн)»(Citation: 195).'
