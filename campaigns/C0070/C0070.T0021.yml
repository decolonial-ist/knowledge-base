description:
  en: |-
    The purge of Ukrainian institutions and the persecution of the movement's leaders.
    Hrushevsky was "arrested by the gendarmerie in Kyiv on December 11, 1914, and accused of Austrophilia and involvement in creating the Legion of Ukrainian Sich Riflemen.
    He was sent into exile to Simbirsk"(Citation: 186), then transferred to Kazan with a teaching ban and stripped of his professorship.
  uk: |-
    Зачистка українських інституцій та переслідування лідерів руху.
    Грушевський був «11 груд. 1914 заарештований жандармерією у Києві й звинувачений в австрофільстві та причетності до створення Легіону Українських січових стрільців.
    Відправлений на заслання до Симбірська»(Citation: 186), потім переведений до Казані із забороною викладання та позбавлений професорського звання.
  ru: |-
    Зачистка украинских институтов и преследование лидеров движения.
    Грушевский был «11 декабря 1914 арестован жандармерией в Киеве и обвинён в австрофильстве и причастности к созданию Легиона Украинских сечевых стрельцов.
    Отправлен в ссылку в Симбирск»(Citation: 186), затем переведен в Казань с запретом преподавания и лишен профессорского звания.
