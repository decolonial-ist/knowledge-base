name:
  ru: Ночное нападение на аул Топли, сожжение Герменчука и принуждение нохчи к рубке своих лесов (1820)
  en: Night Attack on the Aul of Topli, Burning of Germenchuk, and Coercion of the Nokhchi to Fell Their Own Forests (1820)
  uk: Нічний напад на аул Топлі, спалення Герменчука та примушення Нохчі до вирубування власних лісів (1820)
description:
  ru: |-
    Весной 1820 года генерал Ермолов и начальник левого фланга Греков двинули войска прорубать дорогу-просеку через леса нохчи к аулу Герменчук, по пути убивая жителей и сжигая аулы, а соседние сёла сгоняя рубить эту просеку через их собственный лес.
    Имперский историк Потто описывает, как в ночь на 6 марта 1820 года отряд Грекова скрытно переправился за Сунжу и внезапно напал на спавший аул Топли: гребенский казачий полк «без сопротивления ворвался в аул, погруженный еще в глубокий сон», казаки «кинулись по саклям с кинжалами», и «часть жителей была перерезана прежде, чем успела подняться с постелей; другая просила пощады»(Citation: 75).
    Затем Потто пишет, что Греков «собрал старшин окрестных деревень и приказал им немедленно выслать рабочих с топорами для вырубки», и «курящиеся развалины деревни… заставили чеченцев повиноваться» — согнанные нохчи под угрозой той же расправы рубили просеку через свой «дремучий лес»(Citation: 75).
    Через три дня просека была готова, и войска «продвинулись вперед, сожгли Герменчуг и потянулись назад в Грозную», хотя аул стоял пустым и жители уже ушли(Citation: 75).
    Сам Ермолов в предписании Грекову от 15 марта 1820 года подтверждает и санкционирует этот замысел удушения: «одно стеснение Чеченцев в необходимых их потребностях может им истолковать выгоду покорности, и я давно уже разрешил вам употреблять к тому возможные средства», отмечая, что Греков «открыл дорогу даже на плоскость»(Citation: 103).
  en: |-
    In the spring of 1820, General Yermolov and Grekov, commander of the left flank, moved troops to cut a road-clearing through the forests of the Nokhchi to the aul of Germenchuk, killing inhabitants and burning auls along the way, while rounding up the neighboring villages to fell this clearing through their own forest.
    The imperial historian Potto describes how, on the night of March 6, 1820, Grekov’s detachment secretly crossed the Sunzha and suddenly attacked the sleeping aul of Topli: the Grebensky Cossack regiment “burst without resistance into the aul, still sunk in deep sleep,” the Cossacks “rushed through the saklias with daggers,” and “part of the inhabitants were slaughtered before they could rise from their beds; the others begged for mercy”(Citation: 75).
    Potto then writes that Grekov “gathered the elders of the surrounding villages and ordered them to send workers with axes at once for the felling,” and “the smoldering ruins of the village… compelled the Chechens to obey” — the Nokhchi, rounded up under threat of the same reprisal, cut the clearing through their own “dense forest”(Citation: 75).
    Three days later the clearing was ready, and the troops “advanced, burned Germenchug, and drew back to Groznaya,” although the aul stood empty and its inhabitants had already left(Citation: 75).
    Yermolov himself, in an instruction to Grekov of March 15, 1820, confirms and sanctions this design of strangulation: “only the squeezing of the Chechens in their essential needs can make plain to them the advantage of submission, and I long ago authorized you to employ every possible means to that end,” noting that Grekov had “opened a road even onto the plain”(Citation: 103).
  uk: |-
    Навесні 1820 року генерал Єрмолов і начальник лівого флангу Греков рушили війська прорубувати дорогу-просіку крізь ліси Нохчі до аулу Герменчук, дорогою вбиваючи мешканців і спалюючи аули, а сусідні села зганяючи рубати цю просіку крізь їхній власний ліс.
    Імперський історик Потто описує, як у ніч на 6 березня 1820 року загін Грекова потай переправився за Сунжу і раптово напав на сплячий аул Топлі: гребенський козачий полк «без опору увірвався в аул, ще занурений у глибокий сон», козаки «кинулися по саклях із кинджалами», і «частина мешканців була вирізана перш, ніж встигла піднятися з ліжок; інша просила пощади»(Citation: 75).
    Далі Потто пише, що Греков «зібрав старшин навколишніх сіл і наказав їм негайно вислати робітників із сокирами для вирубки», і «димні руїни села… змусили Чеченців коритися» — зігнані Нохчі під загрозою такої самої розправи рубали просіку крізь свій «дрімучий ліс»(Citation: 75).
    Через три дні просіка була готова, і війська «просунулися вперед, спалили Герменчуг і потяглися назад у Грозну», хоча аул стояв порожнім і мешканці вже пішли(Citation: 75).
    Сам Єрмолов у приписі Грекову від 15 березня 1820 року підтверджує і санкціонує цей задум удушення: «саме лише утискання Чеченців у необхідних їхніх потребах може витлумачити їм вигоду покірності, і я давно вже дозволив вам уживати для того всіх можливих засобів», зазначаючи, що Греков «відкрив дорогу навіть на рівнину»(Citation: 103).
