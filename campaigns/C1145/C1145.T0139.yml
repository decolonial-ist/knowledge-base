description:
  en: |-
    The Russian Empire placed a chain of fortifications on the land taken from the Nokhchi to consolidate the seizure and hold the population in submission.
    Historian D. A. Khozhaev writes that Yermolov, moving the Caucasian Line to the Sunzha, was “squeezing unsubdued Chechnya with new fortresses and fortifications,” and that “on the occupied territory fortifications were built…
    Neotstupny Stan, Zlobny Okop, Vnezapnaya (1819), and others”(Citation: 95).
    The imperial historian Potto confirms that in the summer of 1820, having barely finished the Germenchuk clearing, Grekov “set about felling the forest along the Sunzha and building on the cleared glades two new fortifications: the Ust-Martan redoubt and Zlobny Okop,” and on the site of the demolished Kachkalyk village of Isti-Su he placed “Neotstupny Stan”(Citation: 75).
  uk: |-
    Російська імперія ставила на відібраній у Нохчі землі ланцюг укріплень, щоб закріпити захоплення й тримати населення у підпорядкуванні.
    Історик Д. А. Хожаєв пише, що Єрмолов, переносячи Кавказьку лінію на Сунжу, «стискав непокірну Чечню новими фортецями та укріпленнями», і на «окупованій території збудовано укріплення…
    Нєотступний Стан, Злобний Окоп, Внєзапна (1819 рік) та інші»(Citation: 95).
    Імперський історик Потто підтверджує, що влітку 1820 року, ледве закінчивши герменчуцьку просіку, Греков «взявся до вирубки лісу по Сунжі та до будівництва на розчищених галявинах двох нових укріплень: Усть-Мартанського редуту і Злобного Окопу», а на місці знесеного качкаликського Істі-су поставив «Нєотступний Стан»(Citation: 75).
  ru: |-
    Российская империя ставила на отнятой у нохчи земле цепь укреплений, чтобы закрепить захват и держать население в подчинении.
    Историк Д. А. Хожаев пишет, что Ермолов, перенося Кавказскую линию на Сунжу, «сжимая непокорную Чечню новыми крепостями и укреплениями», и на «оккупированной территории построены укрепления…
    Неотступный Стан, Злобный Окоп, Внезапная (1819 год) и другие»(Citation: 95).
    Имперский историк Потто подтверждает, что летом 1820 года, едва закончив герменчукскую просеку, Греков «приступил к вырубке леса по Сунже и к постройке на расчищенных полянах двух новых укреплений: Усть-Мартанского редута и Злобного Окопа», а на месте снесённого качкалыкского Исти-су поставил «Неотступный Стан»(Citation: 75).
