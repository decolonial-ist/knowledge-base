description:
  en: 'The imperial historian Potto writes that after the night attack the aul of Topli was left as “smoldering ruins,” and at the close of the campaign the troops “advanced forward, burned Germenchug, and drew back to Groznaya,” even though the aul stood empty(Citation: 75).'
  uk: 'Імперський історик Потто пише, що після нічного нападу аул Топлі залишився «руїнами, що куряться», а наприкінці походу війська «просунулися вперед, спалили Герменчуг і потяглися назад у Грозну», хоча аул стояв порожнім(Citation: 75).'
  ru: 'Имперский историк Потто пишет, что после ночного нападения аул Топли остался «курящимися развалинами», а на исходе похода войска «продвинулись вперед, сожгли Герменчуг и потянулись назад в Грозную», хотя аул стоял пустым(Citation: 75).'
