description:
  ru: |-
    Российская империя посылала войска карательным походом разорять нохчийские сёла и прорубать военные дороги через их земли.
    Имперский историк Потто пишет, что весной 1820 года начальник левого фланга Греков двинулся на аул Герменчук «с ружьем в одной руке и с топором в другой» и в ночь на 6 марта 1820 года скрытно переправил отряд за Сунжу, внезапно напав на аул Топли(Citation: 75).
    Сам генерал Ермолов в предписании Грекову от 15 марта 1820 года санкционировал замысел: «одно стеснение Чеченцев в необходимых их потребностях может им истолковать выгоду покорности, и я давно уже разрешил вам употреблять к тому возможные средства»(Citation: 103).
  en: |-
    The Russian Empire sent troops on a punitive campaign to ravage Nokhchi villages and cut military roads through their lands.
    The imperial historian Potto writes that in the spring of 1820 Grekov, commander of the left flank, moved on the aul of Germenchuk “with a musket in one hand and an axe in the other,” and on the night of March 6, 1820, covertly moved a detachment across the Sunzha, falling suddenly upon the aul of Topli(Citation: 75).
    General Yermolov himself, in an order to Grekov of March 15, 1820, sanctioned the design: “only the squeezing of the Chechens in their essential needs can make plain to them the advantage of submission, and I have long since authorized you to employ every possible means to that end”(Citation: 103).
  uk: |-
    Російська імперія посилала війська каральним походом розоряти нохчійські села та прорубувати військові дороги через їхні землі.
    Імперський історик Потто пише, що навесні 1820 року начальник лівого флангу Греков рушив на аул Герменчук «з рушницею в одній руці та з сокирою в другій» і в ніч на 6 березня 1820 року потай переправив загін за Сунжу, раптово напавши на аул Топлі(Citation: 75).
    Сам генерал Єрмолов у приписі Грекову від 15 березня 1820 року санкціонував задум: «лише утиск Чеченців у необхідних їхніх потребах може розтлумачити їм вигоду покірності, і я давно вже дозволив вам уживати для цього всіх можливих засобів»(Citation: 103).
