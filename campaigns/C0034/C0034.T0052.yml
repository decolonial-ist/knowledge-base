description:
  en: 'The secularization and confiscation into the imperial treasury of the lands of Ukrainian Orthodox monasteries: "in 1786, during the secularization, the monastery was closed, and its property and lands passed to the state treasury"(Citation: 196) – the fate of the Sviatohirsk monastery is typical of the entire 1786 campaign, which deprived the local church of its economic base.'
  uk: 'Секуляризація та конфіскація до імперської скарбниці земель українських православних монастирів: «1786 під час секуляризації монастир було закрито, його майно й угіддя відійшли до держ. скарбниці»(Citation: 196) – доля Святогірського монастиря типова для всієї кампанії 1786 року, що позбавила локальну церкву економічної бази.'
  ru: 'Секуляризация и конфискация в имперскую казну земель украинских православных монастырей: «в 1786 во время секуляризации монастырь был закрыт, его имущество и угодья отошли в государственную казну»(Citation: 196) – судьба Святогорского монастыря типична для всей кампании 1786 года, лишившей локальную церковь экономической базы.'
