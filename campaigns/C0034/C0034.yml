name:
  en: Administrative Dismantling and Enserfment of the Left Bank (1781–1786)
  uk: Адміністративний демонтаж і закріпачення Лівобережжя (1781–1786)
  ru: Административный демонтаж и закрепощение Левобережья (1781–1786)
description:
  en: |-
    The execution of Catherine II's secret instructions for the institutional and cultural assimilation of the land: the liquidation of the regimental order and the introduction of imperial viceroyalties – the Kyiv Viceroyalty was established by the nominal decree to the Senate of September 16, 1781 (PSZRI, coll. 1, vol.
    XXI, no. 15,228; execution ordered from November)(Citation: 397)(Citation: 391), "which finally abolished the remnants of the Hetmanate's autonomy and its regimental-sotnia administrative-political and military order"(Citation: 192); the secularization of monastery lands in 1786 and the legal binding of peasants by Catherine II's decree of May 3, 1783: "each of the villagers is to remain in the place and station where he is registered by the current last revision"(Citation: 149).
  uk: 'Виконання секретних інструкцій Катерини II щодо інституційної та культурної асиміляції краю: ліквідація полкового устрою та впровадження імперських намісництв – Київське намісництво засновано іменним указом Сенату від 16 вересня 1781 року (ПСЗРІ, зібр. 1-ше, т. XXI, № 15.228; виконати приписано з листопада)(Citation: 397)(Citation: 391), «що остаточно скасував залишки автономії Гетьманщини та її полково-сотенний адм.-політ. і військ. устрій»(Citation: 192); секуляризація монастирських земель 1786 року та юридичне прикріплення селян указом Катерини II від 3 травня 1783 року: «кожному з поселян залишитися на своєму місці й у званні, де він за нинішньою останньою ревізією записаний»(Citation: 149).'
  ru: 'Исполнение секретных инструкций Екатерины II по институциональной и культурной ассимиляции края: ликвидация полкового устройства и введение имперских наместничеств – Киевское наместничество учреждено именным указом Сенату от 16 сентября 1781 года (ПСЗРИ, собр. 1-е, т. XXI, № 15.228; исполнить предписано с ноября)(Citation: 397)(Citation: 391), «окончательно упразднившим остатки автономии Гетманщины и её полково-сотенное административно-политическое и военное устройство»(Citation: 192); секуляризация монастырских земель 1786 года и юридическое прикрепление крестьян указом Екатерины II от 3 мая 1783 года: «каждому из поселян остаться в своем месте и звании, где он по нынешней последней ревизии написан»(Citation: 149).'
