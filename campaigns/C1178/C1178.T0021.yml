description:
  en: |-
    The USSR arrested, exiled, disenfranchised and hounded the authorities of the Chechen people - the sheikhs, the mullahs, the revered elders.
    The national commission of the North Caucasus krai committee of the party resolved on 28 June 1927: "The sheikhs in most cases are themselves kulaks and traders... they not only economically enserf the poor and middle peasants but, using the religious prejudices of the masses, exercise their political influence as a kulak stratum over a significant part of the toiling masses"(Citation: 541) - thus the party designated the people's spiritual mentors "kulaks", class enemies.
    In the summer of 1927 the USSR broke off relations with Great Britain and expected war - and the OGPU (the political police, a predecessor of today's FSB) arrested sixteen religious authorities across Chechnya.
    Yevdokimov, the OGPU plenipotentiary in the North Caucasus, in his secret report for 1927 tied the arrests to the war scare: "The days of military danger of the summer period unusually inspired the Chechen musduh [Muslim clergy] in the sense of bold and open agitation for aid to external forces, for the preparation of an uprising", - and explained the operation thus: "The c/r [counter-revolutionary] propaganda of the clergy, which was shaping a panicky-defeatist mood in the Chechen peasantry, obliged our organ to be forestalled into a mass operation against the most active religious top layer.
    Rarely subjected to repressions and confident in the strength of his influence over the broad public - the Chechen mullah found himself caught unawares.
    The removal of 16 reactionary representatives of the Chechen religious world therefore made an enormous impression on him and for a time paralyzed his activity"(Citation: 535); "removal" was what the empire called a person's arrest.
    Yevdokimov measured success by the disintegration of the spiritual stratum: "a whole series of mullahs began to renounce their rank (up to 30 cases), and a number of religious authorities, compromised by a/s [anti-Soviet] sabotage in the past, to hide from the authorities"(Citation: 535).
    The Chechens answered with intercession, and the report admits: "the campaign for organizing public petitions on behalf of the arrested had significant success"(Citation: 535).
    Among those under arrest was Sheikh Gaysumov of Shali - one of the most revered men of Chechnya; Yevdokimov wrote: "The exception was the sect of Sheikh Gaysumov, whose activists, in connection with the latter's arrest, acted very energetically in the field of mobilizing public sympathy"(Citation: 535).
    The assembly of the village of Shali - 800 people - vouched for the arrested man: "to confirm that citizen Gopsumov Sungant [thus is Gaysumov recorded in the document], aged 107, has been an honored elder in the present village and has never been noted in anything discreditable, either criminal or political"(Citation: 533); Nagayev, inspector of the North Caucasus krai executive committee, filed this assembly into his report as evidence - "in the person of these 'assemblies', led by the kulaks and the clergy, the outlines of a real organization opposing our party are beginning to crystallize"(Citation: 533).
    The empire entered the intercession for an old man into its own file of incriminating material.
    In the autumn of 1927 the Prague journal "Volnye Gortsy" ["The Free Highlanders"] printed a letter from the Caucasus about the same wave: "The Bolsheviks, striking the pose of saviors of our national freedom, are in fact little by little killing all the living forces in the country, tearing from our ranks the most capable - our intellectual forces"; "Such an explosion of new terror took place here after the Anglo-Soviet rupture.
    Numerous arrests of the intelligentsia, the clergy and even whole families took place in almost every locality on the highlanders' territory.
    The GPU is working flat out"(Citation: 534).
    The OGPU in the same report named the next target as well: "the national-democratic movement appears to us as that new kind of highlander c/r [counter-revolution] with which we shall have to contend in the coming years and months"(Citation: 535).
    The empire struck at the authorities' rights as well: at the elections of 1928/29 in the Chechen Autonomous Oblast it disenfranchised 11,279 people, and in the breakdown of the lishentsy stand the lines: "Servants of religious cult, 1,569" and "Members of lishentsy families, 5,658"(Citation: 533).
    By 1930 the colonizer had counted the whole stratum head by head - the report on the inspection of the oblast party organization, sent in March 1931 to the All-Russian Central Executive Committee - the supreme organ of the occupation power of the RSFSR, states: "The strength of the mullahs in the Chechen aul is still enormous.
    On 1 May 1930 there were in Chechnya... communal mullahs - 450, kub mullahs - 800, sheikhs - 34... descendants of Muhammad and other religious authorities - 250, folk healers - 150"; the conclusion, in the same place: "In order to wage a struggle against such a huge army of mullahs, sheikhs and the like, it is necessary to have trained cadres"(Citation: 533).
    In the autumn of 1931, after the killing by the Chekists of Shita Istamulov - leader of the 1929 uprising in Shali, - the arrests of the authorities became mass; the Chechen historian A. G. Avtorkhanov, who worked in Chechnya in those years and later wrote about it in emigration, writes: the killing "was the beginning of a large GPU operation in Chechnya for the liquidation of 'kulak-counter-revolutionary elements and mullah-nationalist ideologues'"(Citation: 369).
    The Grozny and Rostov krai GPU, Avtorkhanov writes, set the arrest quotas, and the government of the USSR confirmed those quotas(Citation: 369).
  uk: |-
    СРСР заарештовував, засилав, позбавляв прав і цькував авторитетів чеченського народу - шейхів, мулл, шанованих старих.
    Національна комісія Північно-Кавказького крайового комітету партії постановила 28 червня 1927 року: «Шейхи здебільшого самі куркулі й торговці... не лише економічно закріпачують бідноту і середняків, а й, використовуючи релігійні забобони мас, здійснюють свій політичний вплив як куркульського прошарку на значну частину трудящих мас»(Citation: 541) - так партія призначила духовних наставників народу «куркулями», класовими ворогами.
    Улітку 1927 року СРСР розірвав відносини з Великою Британією і чекав війни - і ОГПУ (політична поліція, попередниця сучасної ФСБ) заарештувало по Чечні шістнадцять релігійних авторитетів.
    Повноважний представник ОГПУ на Північному Кавказі Євдокимов у секретній доповіді за 1927 рік пов'язав арешти з воєнною тривогою: «Дні воєнної небезпеки літнього періоду надзвичайно надихнули чеченське мусдух [мусульманське духовенство] у сенсі сміливої і відвертої агітації за допомогу зовнішнім силам, за підготовку повстання», - а операцію пояснив так: «К/р [контрреволюційна] пропаганда духовенства, що складала панічно-поразницький настрій чеченського селянства, зобов'язала попередити наш орган до масової операції по найактивнішій релігійній верхівці.
    Рідко підданий репресіям і впевнений у силі своїх впливів на широку громадськість – чеченський мулла виявився заскоченим зненацька.
    Вилучення 16 осіб реакційних представників чеченського релігійного світу справило на нього тому величезне враження і на перший час паралізувало його діяльність»(Citation: 535); «вилученням» імперія називала арешт людини.
    Євдокимов міряв успіх розпадом духовного прошарку: «ціла низка мулл почала відмовлятися від сану (до 30 випадків), а низка релігійних авторитетів, скомпрометованих а/р [антирадянським] саботажем у минулому, переховуватися від влади»(Citation: 535).
    Чеченці відповідали заступництвом, і доповідь визнає: «кампанія з організації громадських клопотань за заарештованих мала значний успіх»(Citation: 535).
    Під арештом сидів і шейх Гайсумов із Шалі - один з найшанованіших людей Чечні; Євдокимов писав: «Виняток становила секта шейха Гайсумова, актив якої у зв'язку з арештом останнього дуже енергійно діяв у галузі мобілізації громадського співчуття»(Citation: 535).
    Сход села Шалі - 800 людей - поручився за заарештованого: «підтвердити, що громадянин Гопсумов Сунгант [так у документі записано Гайсумова], який має від роду 107 років, був почесним старим у справжньому селі, ніколи ні в чому порочному як кримінальному, так і політичному помічений не був»(Citation: 533); обстежувач Північно-Кавказького крайового виконавчого комітету Нагаєв підшив цей сход до доповіді як доказ - «в особі цих «сходів», керованих куркульством і духовенством, починають викристалізовуватися обриси справжньої організації, що протистоїть нашій партії»(Citation: 533).
    Імперія записала заступництво за старого собі в обвинувальний матеріал.
    Восени 1927 року празький журнал «Вольные Горцы» надрукував листа з Кавказу про ту саму хвилю: «Більшовики, прибираючи позу рятівників нашої національної свободи, насправді помалу вбивають у країні всі живі сили, вириваючи з наших лав найздібніших — наші інтелігентні сили»; «Такий вибух нового терору мав у нас місце після англо-радянського розриву.
    Численні арешти інтелігенції, духовенства і навіть цілих родин мали місце майже в усіх місцях на території горців.
    ГПУ працює щосили»(Citation: 534).
    ОГПУ в тій самій доповіді назвало і наступну мішень: «національно-демократичний рух видається нам тим новим видом горської к/р [контрреволюції], з яким у найближчі роки й місяці доведеться нам вести боротьбу»(Citation: 535).
    Імперія вражала авторитетів і в правах: на виборах 1928/29 року в Чеченській автономній області вона позбавила виборчих прав 11 279 людей, і в розбивці лишенців стоять рядки: «Служителів релігійного культу 1569» і «Члени родин лишенців 5658»(Citation: 533).
    До 1930 року колонізатор перелічив увесь прошарок по головах - у доповіді про обстеження партійної організації області, надісланій у березні 1931 року до Всеросійського центрального виконавчого комітету - найвищого органу окупаційної влади РРФСР, сказано: «Сила мулл у чеченському аулі ще величезна.
    На 1 травня 1930 р. в Чечні було... громадських мулл — 450, кубових мулл — 800, шейхів — 34... нащадків Магомета та ін. релігійних авторитетів — 250, знахарів — 150»; висновок там же: «Для того щоб вести боротьбу з такою величезною армією мулл, шейхів тощо, необхідно мати підготовлені кадри»(Citation: 533).
    Восени 1931 року, після вбивства чекістами Шити Істамулова - предводителя повстання 1929 року в Шалі, - арешти авторитетів стали масовими; чеченський історик А. Г. Авторханов, який працював у ті роки в Чечні і писав про це в еміграції, пише: вбивство «було початком проведення в Чечні великої операції ГПУ з ліквідації «куркульсько-контрреволюційних елементів і мулльсько-націоналістичних ідеологів»»(Citation: 369).
    Грозненське і Ростовське крайові ГПУ, пише Авторханов, установлювали норми арештів, а уряд СРСР ці норми затверджував(Citation: 369).
  ru: |-
    СССР арестовывал, ссылал, лишал прав и травил авторитетов чеченского народа - шейхов, мулл, почитаемых стариков.
    Национальная комиссия Северо-Кавказского краевого комитета партии постановила 28 июня 1927 года: «Шейхи в большинстве случаев сами кулаки и торговцы... не только экономически закрепощают бедноту и середняков, но и, используя религиозные предрассудки масс, осуществляют своё политическое влияние как кулацкого слоя на значительную часть трудящихся масс»(Citation: 541) - так партия назначила духовных наставников народа «кулаками», классовыми врагами.
    Летом 1927 года СССР разорвал отношения с Великобританией и ждал войны - и ОГПУ (политическая полиция, предшественница современной ФСБ) арестовало по Чечне шестнадцать религиозных авторитетов.
    Полномочный представитель ОГПУ на Северном Кавказе Евдокимов в секретном докладе за 1927 год связал аресты с военной тревогой: «Дни военной опасности летнего периода необычайно вдохновили чеченское мусдух [мусульманское духовенство] в смысле смелой и откровенной агитации за помощь внешним силам, за подготовку восстания», - а операцию объяснил так: «К/р [контрреволюционная] пропаганда духовенства, слагавшая панически-пораженческое настроение чеченского крестьянства, обязала предупредить наш орган к массовой операции по наиболее активной религиозной верхушке.
    Редко подвергавшийся репрессиям и уверенный в силе своих влияний на широкую общественность – чеченский мулла оказался застигнутым врасплох.
    Изъятие 16 человек реакционных представителей чеченского религиозного мира произвело на него поэтому огромное впечатление и на первое время парализовало его деятельность»(Citation: 535); «изъятием» империя называла арест человека.
    Евдокимов мерил успех распадом духовного слоя: «целый ряд мулл начал отказываться от сана (до 30 случаев), а ряд религиозных авторитетов, скомпрометированных а/с [антисоветским] саботажем в прошлом, скрываться от власти»(Citation: 535).
    Чеченцы отвечали заступничеством, и доклад признаёт: «кампания по организации общественных ходатайств за арестованных имела значительный успех»(Citation: 535).
    Под арестом сидел и шейх Гайсумов из Шали - один из самых почитаемых людей Чечни; Евдокимов писал: «Исключение составила секта шейха Гайсумова, актив которой в связи с арестом последнего очень энергично действовал в области мобилизации общественного сочувствия»(Citation: 535).
    Сход села Шали - 800 человек - поручился за арестованного: «подтвердить, что гражданин Гопсумов Сунгант [так в документе записан Гайсумов], имеющий от роду 107 лет, являлся почётным стариком в настоящем селе, никогда ни в чём порочном как уголовном, так и политическом замечен не был»(Citation: 533); обследователь Северо-Кавказского краевого исполнительного комитета Нагаев подшил этот сход к докладу как улику - «в лице этих «сходов», руководимых кулачеством и духовенством, начинают выкристаллизовываться очертания настоящей организации, противостоящей нашей партии»(Citation: 533).
    Империя записала заступничество за старика себе в обвинительный материал.
    Осенью 1927 года пражский журнал «Вольные Горцы» напечатал письмо с Кавказа о той же волне: «Большевики, принимая позу спасителей нашей национальной свободы, на самом деле мало по малу убивают в стране все живые силы, вырывая из наших рядов наиболее способных — наши интеллигентные силы»; «Такой взрыв нового террора имел у нас место после англо-советского разрыва.
    Многочисленные аресты интеллигенции, духовенства и даже целых семейств имели место почти во всех местах на территории горцев.
    ГПУ работает во всю»(Citation: 534).
    ОГПУ в том же докладе назвало и следующую мишень: «национально-демократическое движение нам представляется тем новым видом горской к/р [контрреволюции], с которым в ближайшие годы и месяцы придётся нам вести борьбу»(Citation: 535).
    Империя поражала авторитетов и в правах: на выборах 1928/29 года в Чеченской автономной области она лишила избирательных прав 11 279 человек, и в разбивке лишенцев стоят строки: «Служителей религиозного культа 1569» и «Члены семей лишенцев 5658»(Citation: 533).
    К 1930 году колонизатор пересчитал весь слой по головам - в докладе об обследовании партийной организации области, отправленном в марте 1931 года во Всероссийский центральный исполнительный комитет - высший орган оккупационной власти РСФСР, сказано: «Сила мулл в чеченском ауле ещё огромна.
    На 1 мая 1930 г. в Чечне было... общественных мулл — 450, кубовых мулл — 800, шейхов — 34... потомков Магомета и проч. религиозных авторитетов — 250, знахарей — 150»; вывод там же: «Для того чтобы вести борьбу с такой громадной армией мулл, шейхов и т. п., необходимо иметь подготовленные кадры»(Citation: 533).
    Осенью 1931 года, после убийства чекистами Шиты Истамулова - предводителя восстания 1929 года в Шали, - аресты авторитетов стали массовыми; чеченский историк А. Г. Авторханов, работавший в те годы в Чечне и писавший об этом в эмиграции, пишет: убийство «было началом проведения в Чечне большой операции ГПУ по ликвидации «кулацко-контрреволюционных элементов и мулльско-националистических идеологов»»(Citation: 369).
    Грозненское и Ростовское краевые ГПУ, пишет Авторханов, устанавливали нормы арестов, а правительство СССР эти нормы утверждало(Citation: 369).
