description:
  ru: |-
    СССР расстреливал арестованных чеченцев - в том числе захваченных руководителей восстаний.
    В марте 1932 года против принудительного сведения хозяйств в колхозы («коллективизации») восстал Ножай-Юртовский район Чечни; историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Пятеро захваченных руководителей восстания были вскоре расстреляны»(Citation: 125).
    Следом чекисты пришли за духовенством - Я. З. Ахмадов и Э. Х. Хасмагомадов продолжают: «Арестам подверглись некоторые известные чеченские шейхи, а Кана-шейх Хантиев был расстрелян в апреле 1933 г.»(Citation: 125).
    Кана-шейх Хантиев - духовный наставник мусульман (шейх) из села Лаха-Невре, нынешнего Надтеречного; исследователь А. Духаев, которого цитирует историк К. Г. Дендиев, пишет о нём: «В последний раз был арестован 17 марта 1933 года, в возрасте 85 лет... и 9 апреля того же года приговорен к высшей мере наказания.
    Приговор приведен в исполнение 10 мая 1933 г. В 1990 году Кана-Шейх Хантиев был реабилитирован»(Citation: 544).
    Источники расходятся в дате расстрела: апрель либо 10 мая 1933 года.
    Счёт расстрелянных не ограничивается верхушкой: чеченский историк А. Г. Авторханов, работавший в те годы в Чечне и писавший об этом в эмиграции, пишет, что по делу «Чеченского националистического центра», сфабрикованному ОГПУ (политической полицией, предшественницей современной ФСБ), расстреливали и рядовых - сколько, установить невозможно(Citation: 369).
  en: |-
    The USSR shot arrested Chechens - including captured leaders of the uprisings.
    In March 1932 the Nozhay-Yurt district of Chechnya revolted against the forced merging of households into kolkhozes ("collectivization"); historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "The five captured leaders of the uprising were soon shot"(Citation: 125).
    Next the Chekists came for the clergy - Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov continue: "Arrests befell some well-known Chechen sheikhs, and Kana-Sheikh Khantiev was shot in April 1933"(Citation: 125).
    Kana-Sheikh Khantiev was a spiritual mentor of Muslims (a sheikh) from the village of Lakha-Nevre, today's Nadterechnoye; researcher A. Dukhaev, quoted by historian K. G. Dendiev, writes of him: "He was arrested for the last time on 17 March 1933, at the age of 85... and on 9 April of the same year sentenced to the supreme measure of punishment.
    The sentence was carried out on 10 May 1933.
    In 1990 Kana-Sheikh Khantiev was rehabilitated"(Citation: 544).
    The sources diverge on the date of the execution: April or 10 May 1933.
    The count of those shot is not limited to the top: the Chechen historian A. G. Avtorkhanov, who worked in Chechnya in those years and later wrote about it in emigration, writes that in the case of the "Chechen nationalist center", fabricated by the OGPU (the political police, a predecessor of today's FSB), rank-and-file people were shot as well - how many, it is impossible to establish(Citation: 369).
  uk: |-
    СРСР розстрілював заарештованих чеченців - зокрема захоплених керівників повстань.
    У березні 1932 року проти примусового зведення господарств у колгоспи («колективізації») повстав Ножай-Юртівський район Чечні; історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «П'ятеро захоплених керівників повстання були невдовзі розстріляні»(Citation: 125).
    Слідом чекісти прийшли за духовенством - Я. З. Ахмадов і Е. Х. Хасмагомадов продовжують: «Арештів зазнали деякі відомі чеченські шейхи, а Кана-шейх Хантієв був розстріляний у квітні 1933 р.»(Citation: 125).
    Кана-шейх Хантієв - духовний наставник мусульман (шейх) із села Лаха-Невре, нинішнього Надтеречного; дослідник А. Духаєв, якого цитує історик К. Г. Дендієв, пише про нього: «Востаннє був заарештований 17 березня 1933 року, у віці 85 років... і 9 квітня того ж року засуджений до вищої міри покарання.
    Вирок виконано 10 травня 1933 р. У 1990 році Кана-Шейх Хантієв був реабілітований»(Citation: 544).
    Джерела розходяться в даті розстрілу: квітень або 10 травня 1933 року.
    Лік розстріляних не обмежується верхівкою: чеченський історик А. Г. Авторханов, який працював у ті роки в Чечні і писав про це в еміграції, пише, що у справі «Чеченського націоналістичного центру», сфабрикованій ОГПУ (політичною поліцією, попередницею сучасної ФСБ), розстрілювали і рядових - скільки, встановити неможливо(Citation: 369).
