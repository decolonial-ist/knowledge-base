name:
  ru: Коллективизация Чечни (1927-1936)
  en: Collectivization of Chechnya (1927-1936)
  uk: Колективізація Чечні (1927-1936)
description:
  ru: |-
    В 1927 году, после лишения чеченского народа оружия (кампания C1177), СССР начал принудительно объединять крестьянские хозяйства Чечни в подконтрольные российскому государству колхозы («коллективизация»).
    Той же весной СССР разорвал отношения с Великобританией и ждал войны - и первым делом пошёл зачищать чеченский «тыл»: летом 1927 года ОГПУ (политическая полиция, предшественница современной ФСБ) арестовало по Чечне шестнадцать религиозных авторитетов.
    Полномочный представитель ОГПУ на Северном Кавказе Евдокимов записал в секретном докладе: «Дни военной опасности летнего периода необычайно вдохновили чеченское мусдух [мусульманское духовенство] в смысле смелой и откровенной агитации за помощь внешним силам, за подготовку восстания»(Citation: 535).
    Так империя приписала Чеченцам восстание, которого не было; настоящие восстания она через два года вызвала сама - колхозами, разорением и закрытием мечетей. 30 января 1930 года высший орган оккупационной власти («Политбюро ЦК ВКП(б)») принял секретное постановление «О мероприятиях по ликвидации кулацких хозяйств в районах сплошной коллективизации»; «кулаками» колонизаторы называли крестьян, которых посчитали «зажиточными».
    Политбюро постановило разорить в среднем три-пять процентов крестьянских хозяйств по всему СССР и разделило их хозяев на три разряда: первых - в концлагерь, вплоть до расстрела, вторых - на высылку в отдалённые места, третьих - на высылку в худшие участки в своём же районе; по всей стране оно распорядилось отправить 60 тысяч человек в лагеря и 150 тысяч на выселение со своей земли, Северному Кавказу с Дагестаном - 6-8 тысяч и 20 тысяч.
    Политбюро поручило ОГПУ расправу над первым и вторым разрядами, и 2 февраля 1930 года заместитель председателя ОГПУ Ягода подписал приказ № 44/21 «О мероприятиях по ликвидации кулачества как класса»(Citation: 543).
    У тысяч чеченских семей, которых колонизатор счёл зажиточными, он забирал избирательные права, скот и землю, а самих выселял за пределы родного края.
    СССР бил и по религиозной жизни Чеченцев: вытеснял шариатские суды - они решали дела чеченцев по исламскому праву, - лишал эти суды денег из казны и закрывал мечети.
    Нохчи не смирились и трижды поднимались с оружием: в декабре 1929 года восстали Шали, Гойты и Беной, весной 1930 года - горные округа, включая Галанчож, в марте 1932 года - Ножай-Юртовский район.
    Все три раза СССР посылал против восставших войска с артиллерией и авиацией; итог одного только 1932 года у историков Я. З. Ахмадова и Э. Х. Хасмагомадова: «число убитых достигло 333, раненых — 150.
    Части Красной Армии и оперативные группы ГПУ потеряли всего 27 человек убитыми...»(Citation: 125).
    После восстания 1932 года ОГПУ сфабриковало «Чеченский националистический центр» - подпольную организацию, которой не существовало: так империя выдала восстания за плод тайного заговора(Citation: 369).
    По делу «центра» ОГПУ арестовало до 3 тысяч чеченцев(Citation: 125), расстреляло пятерых захваченных руководителей восстания и «членов центра», которых чеченский историк А. Г. Авторханов называет поимённо; счёт расстрелянных рядовых неизвестен(Citation: 369).
    Командующий оккупационными войсками Северо-Кавказского военного округа (СКВО) Белов в секретном докладе командования округа краевому комитету партии («Северо-Кавказский крайком ВКП(б)») об итогах войсковой операции весны 1930 года писал: «Причинами выступления являются...
    Крупнейшие ошибки старого партийного руководства области, проводившего совершенно неправильную линию на сплошную коллективизацию, без учета особенностей и уровня развития национальной области», и дальше перечислял: «Административное насаждение колхозов, попытки коллективизации в горных районах, неправильное лишение избирательных прав середняков, а в ряде случаев и бедняков... попытка административного закрытия мечетей»(Citation: 533).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов назвали эту политику заголовком своего раздела: «Коллективизация сельского хозяйства.
    Закрепощение крестьянства государством»(Citation: 125).
  en: |-
    In 1927, after stripping the Chechen people of their weapons (campaign C1177), the USSR began forcibly merging the peasant households of Chechnya into kolkhozes - collective farms controlled by the Russian state ("collectivization").
    That same spring the USSR broke off relations with Great Britain and expected war - and its first move was to purge the Chechen "rear": in the summer of 1927 the OGPU (the political police, a predecessor of today's FSB) arrested sixteen religious authorities across Chechnya.
    Yevdokimov, the OGPU plenipotentiary in the North Caucasus, recorded in a secret report: "The days of military danger of the summer period unusually inspired the Chechen musduh [Muslim clergy] in the sense of bold and open agitation for aid to external forces, for the preparation of an uprising"(Citation: 535).
    Thus the empire ascribed to the Chechens an uprising that did not exist; the real uprisings it provoked itself two years later - with kolkhozes, devastation and the closing of mosques.
    On 30 January 1930 the supreme organ of the occupation power (the "Politburo of the TsK VKP(b)") adopted a secret resolution "On measures for the liquidation of kulak households in districts of wholesale collectivization"; "kulaks" was what the colonizers called peasants they deemed "well-off".
    The Politburo resolved to ruin on average three to five percent of peasant households across the USSR and divided their owners into three categories: the first - to concentration camps, up to execution by shooting; the second - to exile in remote places; the third - to resettlement on the worst plots within their own district; across the country it ordered 60 thousand people sent to the camps and 150 thousand expelled from their land, with 6-8 thousand and 20 thousand assigned to the North Caucasus with Dagestan.
    The Politburo entrusted the reprisal against the first and second categories to the OGPU, and on 2 February 1930 deputy chairman of the OGPU Yagoda signed order No. 44/21 "On measures for the liquidation of the kulaks as a class"(Citation: 543).
    From thousands of Chechen families whom the colonizer deemed well-off it took away voting rights, livestock and land, and expelled the people themselves beyond the borders of their native region.
    The USSR struck at the religious life of the Chechens as well: it squeezed out the sharia courts - they decided Chechens' cases by Islamic law, - stripped those courts of treasury money and closed mosques.
    The Nokhchi did not submit and rose in arms three times: in December 1929 Shali, Goity and Benoy revolted, in the spring of 1930 - the mountain okrugs, including Galanchozh, in March 1932 - the Nozhay-Yurt district.
    All three times the USSR sent troops with artillery and aviation against the insurgents; the toll of the year 1932 alone, from historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov: "the number of killed reached 333, of wounded - 150.
    The units of the Red Army and the operational groups of the GPU lost in all 27 men killed..."(Citation: 125).
    After the uprising of 1932 the OGPU fabricated the "Chechen nationalist center" - an underground organization that did not exist: thus the empire passed the uprisings off as the fruit of a secret conspiracy(Citation: 369).
    In the case of the "center" the OGPU arrested up to 3 thousand Chechens(Citation: 125), shot five captured leaders of the uprising and the "members of the center", whom the Chechen historian A. G. Avtorkhanov names one by one; the count of the rank-and-file shot is unknown(Citation: 369).
    Belov, commander of the occupation troops of the North Caucasus Military District (SKVO), wrote in the district command's secret report to the krai committee of the party (the "North Caucasus kraikom VKP(b)") on the results of the military operation of spring 1930: "The causes of the outbreak are...
    The gravest errors of the old party leadership of the oblast, which pursued a completely incorrect line of wholesale collectivization, without regard for the particularities and the level of development of the national oblast", and further listed: "The administrative imposition of kolkhozes, attempts at collectivization in the mountain districts, the incorrect disenfranchisement of middle peasants, and in a number of cases of poor peasants as well... the attempt at the administrative closing of mosques"(Citation: 533).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov named this policy in the title of their chapter: "The collectivization of agriculture.
    The enserfment of the peasantry by the state"(Citation: 125).
  uk: |-
    У 1927 році, після позбавлення чеченського народу зброї (кампанія C1177), СРСР почав примусово зводити селянські господарства Чечні в підконтрольні російській державі колгоспи («колективізація»).
    Тієї ж весни СРСР розірвав відносини з Великою Британією і чекав війни - і найперше пішов зачищати чеченський «тил»: улітку 1927 року ОГПУ (політична поліція, попередниця сучасної ФСБ) заарештувало по Чечні шістнадцять релігійних авторитетів.
    Повноважний представник ОГПУ на Північному Кавказі Євдокимов записав у секретній доповіді: «Дні воєнної небезпеки літнього періоду надзвичайно надихнули чеченське мусдух [мусульманське духовенство] у сенсі сміливої і відвертої агітації за допомогу зовнішнім силам, за підготовку повстання»(Citation: 535).
    Так імперія приписала чеченцям повстання, якого не було; справжні повстання вона через два роки викликала сама - колгоспами, руйнуванням і закриттям мечетей. 30 січня 1930 року найвищий орган окупаційної влади («Політбюро ЦК ВКП(б)») ухвалив секретну постанову «Про заходи з ліквідації куркульських господарств у районах суцільної колективізації»; «куркулями» колонізатори називали селян, яких вважали «заможними».
    Політбюро постановило розорити в середньому три-п'ять відсотків селянських господарств по всьому СРСР і поділило їхніх власників на три розряди: перших - до концтабору, аж до розстрілу, других - на заслання у віддалені місця, третіх - на виселення на найгірші ділянки у своєму ж районі; по всій країні воно розпорядилося відправити 60 тисяч людей до таборів і 150 тисяч на виселення зі своєї землі, Північному Кавказу з Дагестаном - 6-8 тисяч і 20 тисяч.
    Політбюро доручило ОГПУ розправу над першим і другим розрядами, і 2 лютого 1930 року заступник голови ОГПУ Ягода підписав наказ № 44/21 «Про заходи з ліквідації куркульства як класу»(Citation: 543).
    У тисяч чеченських родин, яких колонізатор визнав заможними, він забирав виборчі права, худобу і землю, а самих виселяв за межі рідного краю.
    СРСР бив і по релігійному житті чеченців: витісняв шаріатські суди - вони вирішували справи чеченців за ісламським правом, - позбавляв ці суди грошей зі скарбниці та закривав мечеті.
    Нохчі не скорилися і тричі піднімалися зі зброєю: у грудні 1929 року повстали Шалі, Гойти і Беной, навесні 1930 року - гірські округи, включно з Галанчожем, у березні 1932 року - Ножай-Юртівський район.
    Усі три рази СРСР посилав проти повсталих війська з артилерією та авіацією; підсумок одного лише 1932 року в істориків Я. З. Ахмадова і Е. Х. Хасмагомадова: «число вбитих сягнуло 333, поранених — 150.
    Частини Червоної армії та оперативні групи ГПУ втратили всього 27 людей убитими...»(Citation: 125).
    Після повстання 1932 року ОГПУ сфабрикувало «Чеченський націоналістичний центр» - підпільну організацію, якої не існувало: так імперія видала повстання за плід таємної змови(Citation: 369).
    У справі «центру» ОГПУ заарештувало до 3 тисяч чеченців(Citation: 125), розстріляло п'ятьох захоплених керівників повстання і «членів центру», яких чеченський історик А. Г. Авторханов називає поіменно; лік розстріляних рядових невідомий(Citation: 369).
    Бєлов, командувач окупаційних військ Північно-Кавказького військового округу (СКВО), у секретній доповіді командування округу крайовому комітетові партії («Північно-Кавказький крайком ВКП(б)») про підсумки військової операції весни 1930 року писав: «Причинами виступу є...
    Найбільші помилки старого партійного керівництва області, яке проводило цілком неправильну лінію на суцільну колективізацію, без урахування особливостей і рівня розвитку національної області», і далі перелічував: «Адміністративне насадження колгоспів, спроби колективізації в гірських районах, неправильне позбавлення виборчих прав середняків, а в низці випадків і бідняків... спроба адміністративного закриття мечетей»(Citation: 533).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов назвали цю політику заголовком свого розділу: «Колективізація сільського господарства.
    Закріпачення селянства державою»(Citation: 125).
