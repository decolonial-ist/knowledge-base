description:
  en: |-
    The OGPU (the political police, a predecessor of today's FSB) passed sentences on arrested Chechens by "troikas" - commissions of three: without trial, without defense counsel, up to execution by shooting.
    In Chechnya the extrajudicial procedure had operated since the 1920s: Kraft served as deputy head of the Chechen oblast department of the GPU - the oblast link of the political police - and worked with troikas as early as 1924: on 20 August the leadership of the Chechen oblast executive committee, on his report, resolved "to deem necessary the extension of the term of functioning of the troika for extrajudicial hearing by two months"(Citation: 544).
    On 2 February 1930 deputy chairman of the OGPU Yagoda signed order No. 44/21 "On measures for the liquidation of the kulaks as a class" - "kulaks" was what the colonizers called peasants they themselves declared well-off(Citation: 543).
    Under this order the OGPU created troikas: cases in them were examined without trial, and the panel was made up of representatives of the krai committee of the party, of the procuracy, and Chekists(Citation: 544).
    The troikas received the cases of the "first category" - the peasants whom the supreme organ of the occupation power (the "Politburo of the TsK VKP(b)"), by its secret resolution of 30 January 1930, had consigned to concentration camps, up to execution by shooting(Citation: 543).
    In the autumn of 1931, after the killing by the Chekists of Shita Istamulov - leader of the 1929 uprising in Shali, - the GPU carried out a wave of mass arrests across Chechnya.
    The Chechen historian A. G. Avtorkhanov, who worked in Chechnya in those years and later wrote about it in emigration, writes of the trial of the arrested: "The arrested were convicted by an extraordinary 'troika' of the GPU specially created for the purpose, chaired by its chief G. Kraft", and "few of them ever returned to freedom"(Citation: 369).
    The count of the arrested diverges among the sources: the historians give up to 35 thousand, while by the OGPU's own memorandum of 31 July 1931, 20,230 people passed through the extrajudicial troikas of the whole North Caucasus krai in 1930(Citation: 543).
    The troika worked after the March 1932 uprising in the Nozhay-Yurt district of Chechnya as well: Yevdokimov, head of the OGPU for the North Caucasus krai, at a secret conference of the secretaries of the national oblast committees of the party in Rostov on 15 December 1932, reported the tally of the Chekists' "work" on the results of the uprising: "...745, of them 386 screened out, 359 brought before the troika, 100 people sentenced to 10 down to 3 years, 188 conditionally, 166 released"(Citation: 544).
  uk: |-
    ОГПУ (політична поліція, попередниця сучасної ФСБ) виносило вироки заарештованим чеченцям «трійками» - комісіями з трьох осіб: без суду, без захисника, аж до розстрілу.
    У Чечні позасудовий порядок діяв ще з 1920-х років: Крафт служив заступником начальника Чеченського обласного відділу ГПУ - обласної ланки політичної поліції - і працював з трійками ще в 1924 році: 20 серпня керівництво Чеченського обласного виконавчого комітету за його доповіддю постановило «вважати необхідним продовження строку функціонування трійки з позасудового слухання на два місяці»(Citation: 544). 2 лютого 1930 року заступник голови ОГПУ Ягода підписав наказ № 44/21 «Про заходи з ліквідації куркульства як класу» - «куркулями» колонізатори називали селян, яких самі оголошували заможними(Citation: 543).
    За цим наказом ОГПУ створювало трійки: справи в них розбирали без суду, у складі сиділи представники крайового комітету партії, прокуратури і чекісти(Citation: 544).
    Трійки дістали справи «першої категорії» - селян, яких найвищий орган окупаційної влади («Політбюро ЦК ВКП(б)») секретною постановою від 30 січня 1930 року призначив до концтаборів, аж до розстрілу(Citation: 543).
    Восени 1931 року, після вбивства чекістами Шити Істамулова - предводителя повстання 1929 року в Шалі, - ГПУ провело по Чечні хвилю масових арештів.
    Чеченський історик А. Г. Авторханов, який працював у ті роки в Чечні і писав про це в еміграції, пише про суд над заарештованими: «Заарештовані були засуджені спеціально створеною для цієї мети надзвичайною «трійкою» ГПУ під головуванням його шефа Г. Крафта», а «на волю з них рідко хто повернувся»(Citation: 369).
    Лік заарештованих у джерелах розходиться: в істориків - до 35 тисяч, а за довідкою ОГПУ від 31 липня 1931 року через позасудові трійки всього Північно-Кавказького краю за 1930 рік пройшло 20 230 осіб(Citation: 543).
    Трійка працювала і після повстання березня 1932 року в Ножай-Юртівському районі Чечні: глава ОГПУ по Північно-Кавказькому краю Євдокимов доповів на секретній нараді секретарів національних обласних комітетів партії в Ростові 15 грудня 1932 року лік чекістської «роботи» за підсумками повстання: «…745, з них відсіяно 386, представлено на трійку 359, засуджено від 10 до 3-х років 100 чол., умовно 188, звільнено 166»(Citation: 544).
  ru: |-
    ОГПУ (политическая полиция, предшественница современной ФСБ) выносило приговоры арестованным чеченцам «тройками» - комиссиями из трёх человек: без суда, без защитника, вплоть до расстрела.
    В Чечне внесудебный порядок действовал ещё с 1920-х годов: Крафт служил заместителем начальника Чеченского областного отдела ГПУ - областного звена политической полиции - и работал с тройками ещё в 1924 году: 20 августа руководство Чеченского областного исполнительного комитета по его докладу постановило «считать необходимым продление срока функционирования тройки по внесудебному слушанию на два месяца»(Citation: 544). 2 февраля 1930 года заместитель председателя ОГПУ Ягода подписал приказ № 44/21 «О мероприятиях по ликвидации кулачества как класса» - «кулаками» колонизаторы называли крестьян, которых сами объявляли зажиточными(Citation: 543).
    По этому приказу ОГПУ создавало тройки: дела в них разбирали без суда, в составе сидели представители краевого комитета партии, прокуратуры и чекисты(Citation: 544).
    Тройки получили дела «первой категории» - крестьян, которых высший орган оккупационной власти («Политбюро ЦК ВКП(б)») секретным постановлением от 30 января 1930 года назначил в концлагеря, вплоть до расстрела(Citation: 543).
    Осенью 1931 года, после убийства чекистами Шиты Истамулова - предводителя восстания 1929 года в Шали, - ГПУ провело по Чечне волну массовых арестов.
    Чеченский историк А. Г. Авторханов, работавший в те годы в Чечне и писавший об этом в эмиграции, пишет о суде над арестованными: «Арестованные были осуждены специально созданной для этой цели чрезвычайной «тройкой» ГПУ под председательством его шефа Г. Крафта», а «на волю из них редко кто вернулся»(Citation: 369).
    Счёт арестованных в источниках расходится: у историков - до 35 тысяч, а по справке ОГПУ от 31 июля 1931 года через внесудебные тройки всего Северо-Кавказского края за 1930 год прошло 20 230 человек(Citation: 543).
    Тройка работала и после восстания марта 1932 года в Ножай-Юртовском районе Чечни: глава ОГПУ по Северо-Кавказскому краю Евдокимов доложил на секретном совещании секретарей национальных областных комитетов партии в Ростове 15 декабря 1932 года счёт чекистской «работы» по итогам восстания: «…745, из них отсеяно 386, представлено на тройку 359, осуждено от 10 до 3-х лет 100 чел., условно 188, освобождено 166»(Citation: 544).
