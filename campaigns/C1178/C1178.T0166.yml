description:
  ru: |-
    ОГПУ (политическая полиция, предшественница современной ФСБ) сфабриковало «Чеченский националистический центр» - подпольную организацию, которой не существовало, - и осудило по этому делу тысячи чеченцев.
    Так империя «объяснила» восстания против принудительного сведения хозяйств в колхозы («коллективизации»): не голод и разорение подняли людей, а тайный заговор.
    Чеченский историк А. Г. Авторханов, работавший в те годы в Чечне и писавший об этом в эмиграции, описал механику фабрикации: «Логика чекистов подсказывала, что виновников и организаторов всех антисоветских восстаний надо искать в каком-то едином «националистическом центре», куда, несомненно, должны входить, по той же логике, представители внутренней и заграничной чеченской эмиграции»(Citation: 369).
    За дело, по его словам, взялись краевой орган ОГПУ под руководством Курского и Федотова и Чеченский областной отдел ОГПУ под руководством Крафта: «Они так искусно и правдоподобно создали этот «контрреволюционный националистический центр», что в его существование поверили даже многие из чеченцев»(Citation: 369).
    «Уликами» стали письма от имени чеченского эмигранта, нефтепромышленника Тапы Чермоева - с призывами готовить восстание; они приходили чеченским деятелям в Грозный из Стамбула, Парижа и Лондона через подставных лиц, которых ОГПУ обязало сдавать письма ему.
    Авторханов заключает: «версия о письмах Чермоева была ложью, а сами письма – фальшивками ОГПУ.
    Но как раз эти письма и служили «вещественными доказательствами» против «националистического центра»»(Citation: 369).
    Осенью 1932 года ОГПУ арестовало всю «группу» адресатов, следом прошли массовые аресты по Гудермесскому и Ножай-Юртовскому районам - тому самому, что в марте 1932 года восстал против колхозов; Авторханов пишет: «В общей сложности по делу «Чеченского националистического центра» было арестовано до 3 тысяч человек.
    Арестованным было предъявлено обвинение в создании «контрреволюционного националистического центра Чечни для подготовки и проведения вооруженного восстания»»(Citation: 369).
    Суда не было - Авторханов пишет: «Почти все арестованные были осуждены через коллегию ГПУ.
    Из членов «центра» Абдулкадиров, Шамилев, Курбанов, Моца-Хаджи Сотаев, Беймурзаев были расстреляны.
    Другие получили по 10 лет.
    Сколько расстреляно рядовых, установить невозможно»(Citation: 369).
    Сфабрикованным делом империя оправдывалась и публично: секретарь краевого комитета партии Евдокимов на краевой конференции партии 1934 года цитировал «письма миллионера Чермоева» как доказательство подготовки восстания на деньги и оружие западных держав(Citation: 369).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов подтверждают масштаб: репрессиям «в связи с делом так называемого «Чеченского националистического центра»» подверглось, «по некоторым данным, до 3 тысяч человек»(Citation: 125).
  en: |-
    The OGPU (the political police, a predecessor of today's FSB) fabricated the "Chechen nationalist center" - an underground organization that did not exist - and convicted thousands of Chechens in the case.
    Thus the empire "explained" the uprisings against the forced merging of households into kolkhozes ("collectivization"): it was not hunger and devastation that raised the people, but a secret conspiracy.
    The Chechen historian A. G. Avtorkhanov, who worked in Chechnya in those years and later wrote about it in emigration, described the mechanism of the fabrication: "The logic of the Chekists suggested that the culprits and organizers of all the anti-Soviet uprisings should be sought in some single 'nationalist center', into which, undoubtedly, by the same logic, representatives of the internal and foreign Chechen emigration must belong"(Citation: 369).
    The work, by his words, was taken up by the krai organ of the OGPU under Kursky and Fedotov and the Chechen oblast department of the OGPU under Kraft: "They created this 'counter-revolutionary nationalist center' so skillfully and plausibly that even many of the Chechens believed in its existence"(Citation: 369).
    The "evidence" was letters in the name of the Chechen émigré, oil industrialist Tapa Chermoev - with calls to prepare an uprising; they came to Chechen public figures in Grozny from Istanbul, Paris and London through intermediaries whom the OGPU had obliged to hand the letters over to it.
    Avtorkhanov concludes: "the version of Chermoev's letters was a lie, and the letters themselves - forgeries of the OGPU.
    But it was precisely these letters that served as 'material evidence' against the 'nationalist center'"(Citation: 369).
    In the autumn of 1932 the OGPU arrested the entire "group" of the addressees, followed by mass arrests across the Gudermes and Nozhay-Yurt districts - the very one that had revolted against the kolkhozes in March 1932; Avtorkhanov writes: "In all, up to 3 thousand people were arrested in the case of the 'Chechen nationalist center'.
    The arrested were charged with creating a 'counter-revolutionary nationalist center of Chechnya for the preparation and carrying out of an armed uprising'"(Citation: 369).
    There was no trial - Avtorkhanov writes: "Almost all the arrested were convicted through the collegium of the GPU.
    Of the members of the 'center', Abdulkadirov, Shamilev, Kurbanov, Motsa-Hadji Sotaev and Beymurzaev were shot.
    Others received 10 years each.
    How many of the rank and file were shot is impossible to establish"(Citation: 369).
    With the fabricated case the empire justified itself publicly as well: Yevdokimov, secretary of the krai committee of the party, at the krai party conference of 1934 cited "the letters of the millionaire Chermoev" as proof of the preparation of an uprising with the money and weapons of the Western powers(Citation: 369).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov confirm the scale: repression "in connection with the case of the so-called 'Chechen nationalist center'" befell, "by some data, up to 3 thousand people"(Citation: 125).
  uk: |-
    ОГПУ (політична поліція, попередниця сучасної ФСБ) сфабрикувало «Чеченський націоналістичний центр» - підпільну організацію, якої не існувало, - і засудило в цій справі тисячі чеченців.
    Так імперія «пояснила» повстання проти примусового зведення господарств у колгоспи («колективізації»): не голод і руйнування підняли людей, а таємна змова.
    Чеченський історик А. Г. Авторханов, який працював у ті роки в Чечні і писав про це в еміграції, описав механіку фабрикації: «Логіка чекістів підказувала, що винуватців і організаторів усіх антирадянських повстань треба шукати в якомусь єдиному «націоналістичному центрі», куди, безсумнівно, мають входити, за тією ж логікою, представники внутрішньої і закордонної чеченської еміграції»(Citation: 369).
    До справи, за його словами, взялися крайовий орган ОГПУ під керівництвом Курського і Федотова та Чеченський обласний відділ ОГПУ під керівництвом Крафта: «Вони так майстерно і правдоподібно створили цей «контрреволюційний націоналістичний центр», що в його існування повірили навіть багато хто з чеченців»(Citation: 369).
    «Доказами» стали листи від імені чеченського емігранта, нафтопромисловця Тапи Чермоєва - із закликами готувати повстання; вони приходили чеченським діячам до Грозного зі Стамбула, Парижа і Лондона через підставних осіб, яких ОГПУ зобов'язало здавати листи йому.
    Авторханов підсумовує: «версія про листи Чермоєва була брехнею, а самі листи – фальшивками ОГПУ.
    Але саме ці листи і слугували «речовими доказами» проти «націоналістичного центру»»(Citation: 369).
    Восени 1932 року ОГПУ заарештувало всю «групу» адресатів, слідом пройшли масові арешти по Гудермеському і Ножай-Юртівському районах - тому самому, що в березні 1932 року повстав проти колгоспів; Авторханов пише: «Загалом у справі «Чеченського націоналістичного центру» було заарештовано до 3 тисяч осіб.
    Заарештованим було пред'явлено обвинувачення у створенні «контрреволюційного націоналістичного центру Чечні для підготовки і проведення збройного повстання»»(Citation: 369).
    Суду не було - Авторханов пише: «Майже всі заарештовані були засуджені через колегію ГПУ.
    З членів «центру» Абдулкадиров, Шамілєв, Курбанов, Моца-Хаджі Сотаєв, Беймурзаєв були розстріляні.
    Інші дістали по 10 років.
    Скільки розстріляно рядових, установити неможливо»(Citation: 369).
    Сфабрикованою справою імперія виправдовувалася й публічно: секретар крайового комітету партії Євдокимов на крайовій конференції партії 1934 року цитував «листи мільйонера Чермоєва» як доказ підготовки повстання на гроші та зброю західних держав(Citation: 369).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов підтверджують масштаб: репресій «у зв'язку зі справою так званого «Чеченського націоналістичного центру»» зазнало, «за деякими даними, до 3 тисяч осіб»(Citation: 125).
