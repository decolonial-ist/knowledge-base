description:
  ru: |-
    Колонизатор отбирал у чеченских священнослужителей пожертвования прихожан и закрывал их храмы.
    Осенью 1929 года в Гойтах колонизаторы отбирали мечеть за невыполненное «хлебное задание» - норму сдачи зерна империи; об этом говорил предводитель восстания в Шали Шита Истамулов: «Смотрите, какое безобразие творят в Гойтах; объявили пока хлеб не выполните, на это время отберем мечеть.
    Куда же это дело годится, когда у чеченского народа отбирают его последнюю веру…»(Citation: 544).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что в 1929 году в Надтеречном районе «начинается эксперимент по отстранению мулл от распределения добровольных пожертвований мусульман в пользу бедных и духовенства — закята» - империя передала раздачу своим комитетам крестьянской взаимопомощи(Citation: 125).
    Колонизатор уничтожил большую часть мечетей Чечни - счёт до и после у историка К. Г. Дендиева: до российской революции в Чечне было «2675 мечетей, 60 тыс. мюридов [учеников шейхов], членов различных религиозных организаций, 38 шейхов, 850 мулл и 140 духовных школ», - а счёт середины 1937 года: «401 мечеть, не считая кубовых [малых квартальных]», при которых «работали 406 мулл»(Citation: 544).
    Командующий оккупационными войсками Северо-Кавказского военного округа Белов в докладе командования округа краевому комитету партии («Северо-Кавказский крайком ВКП(б)») об итогах войсковой операции весны 1930 года назвал закрытие мечетей по приказам колонизаторов среди причин, по которым чеченские аулы поднялись с оружием(Citation: 533).
  en: |-
    The colonizer took from the Chechen clergy the donations of their congregations and closed their houses of worship.
    In the autumn of 1929 in Goity the colonizers were confiscating a mosque over an unfulfilled "grain assignment" - a quota of grain owed to the empire; Shita Istamulov, leader of the uprising in Shali, spoke of it: "Look what an outrage they are committing in Goity; they have announced: until you deliver the grain, we will take away the mosque for that time.
    What good is this, when the Chechen people is being robbed of its last faith..."(Citation: 544).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that in 1929 in the Nadterechny district "an experiment begins in removing the mullahs from the distribution of the voluntary donations of Muslims for the benefit of the poor and the clergy - the zakat" - the empire handed the distribution over to its own peasant mutual-aid committees(Citation: 125).
    The colonizer destroyed the greater part of the mosques of Chechnya - the before-and-after count is given by historian K. G. Dendiev: before the Russian revolution Chechnya had "2,675 mosques, 60 thousand murids [disciples of sheikhs], members of various religious organizations, 38 sheikhs, 850 mullahs and 140 religious schools", - and the count of mid-1937: "401 mosques, not counting the kub ones [small neighborhood mosques]", at which "406 mullahs worked"(Citation: 544).
    Belov, commander of the occupation troops of the North Caucasus Military District, in the district command's report to the krai committee of the party (the "North Caucasus kraikom VKP(b)") on the results of the military operation of spring 1930, named the closing of mosques on the colonizers' orders among the causes for which the Chechen auls had risen in arms(Citation: 533).
  uk: |-
    Колонізатор відбирав у чеченських священнослужителів пожертви парафіян і закривав їхні храми.
    Восени 1929 року в Гойтах колонізатори відбирали мечеть за невиконане «хлібне завдання» - норму здачі зерна імперії; про це говорив предводитель повстання в Шалі Шита Істамулов: «Дивіться, яке неподобство коять у Гойтах; оголосили: поки хліб не виконаєте, на цей час відберемо мечеть.
    Куди ж це годиться, коли в чеченського народу відбирають його останню віру…»(Citation: 544).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що в 1929 році в Надтеречному районі «починається експеримент з відсторонення мулл від розподілу добровільних пожертв мусульман на користь бідних і духовенства — закяту» - імперія передала роздачу своїм комітетам селянської взаємодопомоги(Citation: 125).
    Колонізатор знищив більшу частину мечетей Чечні - лік до і після в історика К. Г. Дендієва: до російської революції в Чечні було «2675 мечетей, 60 тис. мюридів [учнів шейхів], членів різних релігійних організацій, 38 шейхів, 850 мулл і 140 духовних шкіл», - а лік середини 1937 року: «401 мечеть, не рахуючи кубових [малих квартальних]», при яких «працювали 406 мулл»(Citation: 544).
    Бєлов, командувач окупаційних військ Північно-Кавказького військового округу, у доповіді командування округу крайовому комітетові партії («Північно-Кавказький крайком ВКП(б)») про підсумки військової операції весни 1930 року назвав закриття мечетей за наказами колонізаторів серед причин, з яких чеченські аули піднялися зі зброєю(Citation: 533).
