description:
  ru: |-
    Насильственное выселение семей повстанцев в Сибирь и депортация украинцев Закерзонья: вывоз «бандпособников» целыми семьями начался сразу - уже летом 1944 года «вывезено более 17 000 человек в Красноярский край»(Citation: 191); всего за 1944–52 годы на спецпоселение вывезены 203 662 человека, среди них «представителей семей членов Организации украинских националистов и бойцов Украинской повстанческой армии и их симпатиков — 182 543 человека»(Citation: 191).
    Акция «Висла» была проведена, чтобы «лишить его социально-экономической и морально-психологической поддержки со стороны местного украинского населения», и завершилась рассеянием общины: власти избавились от украинского населения, «распылив ок. 150 тыс. человек»(Citation: 185).
  en: |-
    The forcible removal of insurgents' families to Siberia and the deportation of the Ukrainians of Zakerzonnia: the removal of "bandit accomplices" with their entire families began at once - already in the summer of 1944 "more than 17,000 people were carried off to Krasnoyarsk Krai"(Citation: 191); in all, in 1944–52, 203,662 people were removed to special settlements, among them "representatives of the families of members of the Organization of Ukrainian Nationalists and soldiers of the Ukrainian Insurgent Army and their sympathizers — 182,543 people"(Citation: 191).
    Operation "Vistula" was carried out in order to "deprive it of socio-economic and moral-psychological support from the local Ukrainian population," and ended in the scattering of the community: the authorities rid themselves of the Ukrainian population, "dispersing about 150 thousand people"(Citation: 185).
  uk: |-
    Насильницьке виселення родин повстанців до Сибіру та депортація українців Закерзоння: вивезення «бандпосібників» цілими родинами почалося одразу - вже влітку 1944 року «вивезено понад 17 000 осіб в Красноярський край»(Citation: 191); загалом за 1944–52 роки на спецпоселення вивезено 203 662 особи, серед них «представників родин членів Організації українських націоналістів і вояків Української повстанської армії та їх симпатиків — 182 543 особи»(Citation: 191).
    Акцію «Вісла» було проведено, щоб «позбавити його соціально-екон. та морально-психологічної підтримки з боку місц. укр. людності», і завершилася вона розсіянням громади: влада позбулася українського населення, «розпорошивши бл. 150 тис. осіб»(Citation: 185).
