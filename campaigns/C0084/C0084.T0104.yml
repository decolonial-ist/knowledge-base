description:
  en: |-
    Extrajudicial killings of civilians in the course of suppressing the insurgency: the Presidium of the CPSU Central Committee itself admitted, in its resolution "On the Political and Economic Situation of the Western Oblasts of the Ukrainian SSR" of May 26, 1953: "From 1944 through 1952, up to 500 thousand people in the western oblasts of Ukraine were subjected to various kinds of repression, including over 134 thousand arrested, over 153 thousand killed, and over 203 thousand deported forever from the Ukrainian SSR"(Citation: 403)(Citation: 186) – the authorities did not divide the killed into insurgents and civilians, and already on July 2, 1953, after Beria's arrest, the resolution itself was revoked as conducive to "the activization of bourgeois-nationalist elements"(Citation: 403).
    Terror was also waged by disguised MGB "special groups" acting under the guise of the UPA: the military prosecutor of the MVD troops of the Ukrainian district, Kosharsky, in his report to Khrushchev (February 15, 1949), cited "examples of beatings, rapes and robberies of the population" by agent-fighters and stated: "the actions of the so-called MGB special groups are of a pronounced bandit, anti-Soviet character and, of course, cannot be justified by any operational considerations"(Citation: 195).
  uk: |-
    Позасудові вбивства цивільних у ході придушення повстанського руху: Президія ЦК КПРС у постанові «Про політичний і господарський стан західних областей Української РСР» від 26 травня 1953 року сама визнала: «З 1944 по 1952 рр. у західних областях України піддано різним видам репресій до 500 тисяч осіб, у тому числі заарештовано понад 134 тис. осіб, убито понад 153 тис. осіб, вислано навічно з меж УРСР понад 203 тис. осіб»(Citation: 403)(Citation: 186) – убитих влада не поділяла на повстанців і цивільних, а вже 2 липня 1953 року, після арешту Берії, саму постанову скасували як таку, що сприяє «активізації буржуазно-націоналістичних елементів»(Citation: 403).
    Терор вели й переодягнені «спецгрупи» МДБ, що діяли під виглядом УПА: воєнний прокурор військ МВС Українського округу Кошарський у доповідній Хрущову (15 лютого 1949) наводив «приклади побиття, зґвалтувань, грабунків населення» агентами-бойовиками і констатував: «дії т. зв. спецгруп МДБ носять ярко виражений бандитський антирадянський характер і, зрозуміло, не можуть бути виправдані ніякими оперативними міркуваннями»(Citation: 195).
  ru: |-
    Внесудебные убийства гражданских в ходе подавления повстанческого движения: Президиум ЦК КПСС в постановлении «О политическом и хозяйственном состоянии западных областей Украинской ССР» от 26 мая 1953 года сам признал: «С 1944 по 1952 гг. в западных областях Украины подверглось разным видам репрессии до 500 тысяч человек, в том числе арестовано более 134 тыс. человек, убито более 153 тыс. человек, выслано навечно из пределов УССР более 203 тыс. человек»(Citation: 403)(Citation: 186) – убитых власть не делила на повстанцев и гражданских, а уже 2 июля 1953 года, после ареста Берии, само постановление отменили как способствующее «активизации буржуазно-националистических элементов»(Citation: 403).
    Террор вели и переодетые «спецгруппы» МГБ, действовавшие под видом УПА: военный прокурор войск МВД Украинского округа Кошарский в докладной Хрущёву (15 февраля 1949) приводил «примеры избиений, изнасилований, грабежей населения» агентами-боевиками и констатировал: «действия т. н. спецгрупп МГБ носят ярко выраженный бандитский антисоветский характер и, разумеется, не могут быть оправданы никакими оперативными соображениями»(Citation: 195).
