description:
  ru: |-
    Массовые аресты бойцов УПА, членов ОУН и заподозренных в помощи им с последующей отправкой в лагеря ГУЛАГа, на который режим возлагал «изоляция „ненадёжных элементов“» как одну из ключевых задач(Citation: 186).
    В ходе акции «Висла» для гражданских, заподозренных в содействии подполью, предусматривалось «введение военно-полевых судов и концлагерей, в частности в Явожно»(Citation: 185).
    К 1951 году украинцы стали вторым народом ГУЛАГа: по ведомственной статистике, «Национальный состав заключенных ГУЛАГа (по состоянию на 1 января 1951 г.)» насчитывал 506 221 украинца из примерно 2,5 млн заключённых - около 20%(Citation: 329).
  en: |-
    Mass arrests of UPA fighters, OUN members, and those suspected of aiding them, followed by dispatch to the GULAG camps, upon which the regime placed "the isolation of 'unreliable elements'" as one of its key tasks(Citation: 186).
    During Operation "Vistula," for civilians suspected of assisting the underground there was provision for "the introduction of courts-martial and concentration camps, in particular at Jaworzno"(Citation: 185).
    By 1951 Ukrainians had become the second-largest nation of the GULAG: according to the agency's own statistics, the "National composition of GULAG prisoners (as of January 1, 1951)" counted 506,221 Ukrainians out of some 2.5 million prisoners - about 20%(Citation: 329).
  uk: |-
    Масові арешти бійців УПА, членів ОУН і запідозрених у допомозі їм із подальшим відправленням до таборів ГУЛАГу, на який режим покладав «ізоляція „ненадійних елементів“» як одне з ключових завдань(Citation: 186).
    Під час акції «Вісла» для цивільних, запідозрених у сприянні підпіллю, передбачалося «запровадження військ.-польових судів і концтаборів, зокрема у Явожно»(Citation: 185).
    До 1951 року українці стали другим народом ГУЛАГу: за відомчою статистикою, «Національний склад ув'язнених ГУЛАГу (станом на 1 січня 1951 р.)» налічував 506 221 українця з приблизно 2,5 млн ув'язнених - близько 20%(Citation: 329).
