description:
  en: |-
    The creation of an atmosphere of total fear through the bloody provocations of NKVD special groups operating in the guise of the UPA: People's Commissar Strokach "initiated the formation of special groups of the NKVD of the Ukrainian SSR from former partisans for the struggle against the UPA" and "personally interrogated the captured leaders of the OUN networks of Western Ukraine"(Citation: 196).
    The terror was also demonstrative: "one of the forms of struggle was the policy of intimidating OUN and UPA members and the local population: open trials and executions, putting the bodies of the dead on public display, and destroying insurgent graves"(Citation: 331).
  uk: |-
    Створення атмосфери тотального страху через криваві провокації спецгруп НКВС, що діяли під виглядом УПА: нарком Строкач «ініціював формування спец. груп НКВС УРСР з колиш. партизанів для боротьби з УПА» і «власноруч допитував захоплених керівників проводів ОУН Західної України»(Citation: 196).
    Терор був і демонстративним: «Однією з форм боротьби була політика залякування членів ОУН і УПА та місцевого населення: відкриті судові процеси та страти, виставлення тіл загиблих на загальний огляд, руйнування повстанських могил»(Citation: 331).
  ru: |-
    Создание атмосферы тотального страха через кровавые провокации спецгрупп НКВД, действовавших под видом УПА: нарком Строкач «инициировал формирование специальных групп НКВД УССР из бывших партизан для борьбы с УПА» и «собственноручно допрашивал захваченных руководителей проводов ОУН Западной Украины»(Citation: 196).
    Террор был и демонстративным: «одной из форм борьбы была политика запугивания членов ОУН и УПА и местного населения: открытые судебные процессы и казни, выставление тел погибших на всеобщее обозрение, разрушение повстанческих могил»(Citation: 331).
