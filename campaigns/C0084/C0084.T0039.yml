description:
  ru: 'Координация действий с просоветским правительством Польши по уничтожению украинского подполья: акция «Висла» «как депортационная, детально разрабатывалась и осуществлялась польскими властями», но ее выполнение «координировалось с парт.-сов. властными органами СССР» - советское командование перебросило «из Львовской обл. одну танковую дивизию, специальные подразделения НКВД и заблокировало пограничными войсками украинско-польскую границу»(Citation: 185).'
  en: 'The coordination of actions with the pro-Soviet government of Poland to destroy the Ukrainian underground: Operation "Vistula," "as a deportation action, was elaborated in detail and carried out by the Polish authorities," but its execution "was coordinated with the party-Soviet organs of power of the USSR" - the Soviet command transferred "from Lviv oblast one tank division and special NKVD units, and blocked the Ukrainian-Polish border with border troops"(Citation: 185).'
  uk: 'Координація дій із прорадянським урядом Польщі зі знищення українського підпілля: акція «Вісла» «як депортаційна, детально розроблялася і здійснювалася польс. владою», але її виконання «координувалося з парт.рад. владними органами СРСР» - радянське командування перекинуло «з Львів. обл. одну танкову д-зію, спец. підрозділи НКВС і заблокувало прикордонними військами укр.-польс. кордон»(Citation: 185).'
