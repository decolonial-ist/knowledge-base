description:
  ru: 'Использование плененных участников сопротивления и депортированных как бесплатной рабочей силы: в задачи ГУЛАГа входило «использование их как дешёвой рабочей силы и переброска, при необходимости, с места на место»(Citation: 186); депортированных из Западной Украины направляли на спецпоселения и тяжелые работы - только летом 1944 года «вывезено более 17 000 человек в Красноярский край»(Citation: 191).'
  en: 'The use of captured resistance members and deportees as free labor: the tasks of the GULAG included "using them as cheap labor and transferring them, as needed, from place to place"(Citation: 186); deportees from Western Ukraine were sent to special settlements and hard labor - in the summer of 1944 alone "more than 17,000 people were carried off to Krasnoyarsk Krai"(Citation: 191).'
  uk: 'Використання полонених учасників опору та депортованих як безплатної робочої сили: до завдань ГУЛАГу входило «використання їх як дешевої робочої сили і перекидання, в разі потреби, з місця на місце»(Citation: 186); депортованих із Західної України направляли на спецпоселення та важкі роботи - лише влітку 1944 року «вивезено понад 17 000 осіб в Красноярський край»(Citation: 191).'
