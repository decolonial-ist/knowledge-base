description:
  ru: |-
    Регулярные чекистско-войсковые операции НКВД и МГБ по зачистке западноукраинских сел: нарком внутренних дел УССР Т. Строкач лично «руководил и координировал оперативно-чекистские операции по ликвидации подполья Организации украинских националистов, подразделений Украинской повстанческой армии, массовые депортации населения в Западной Украине»(Citation: 196).
    Уже «5 апреля 1944 на основании распоряжения Народного комиссариата внутренних дел СССР разработана схема арестов и депортации членов ОУН–УПА»(Citation: 191).
  en: |-
    Regular chekist-military operations by the NKVD and MGB to sweep western Ukrainian villages: the People's Commissar of Internal Affairs of the Ukrainian SSR T. Strokach personally "directed and coordinated operational-chekist operations to liquidate the underground of the Organization of Ukrainian Nationalists and units of the Ukrainian Insurgent Army, and mass deportations of the population in Western Ukraine"(Citation: 196).
    Already "on April 5, 1944, on the basis of a directive of the People's Commissariat of Internal Affairs of the USSR, a scheme of arrests and deportation of OUN–UPA members was worked out"(Citation: 191).
  uk: |-
    Регулярні чекістсько-військові операції НКВС і МДБ із зачистки західноукраїнських сіл: нарком внутрішніх справ УРСР Т. Строкач особисто «керував та координував оперативно-чекістські операції з ліквідації підпілля Організації українських націоналістів, підрозділів Української повстанської армії, масові депортації населення в Західній Україні»(Citation: 196).
    Уже «5 квітня 1944 на підставі розпорядження Народного комісаріату внутрішніх справ СРСР опрацьовано схему арештів і депортації членів ОУН–УПА»(Citation: 191).
