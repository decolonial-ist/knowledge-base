name:
  en: Suppression of UPA Resistance and Operation "Vistula" (1944–1951)
  uk: Придушення опору УПА та операція «Вісла» (1944–1951)
  ru: Подавление сопротивления УПА и операция «Висла» (1944–1951)
description:
  en: |-
    A war waged by NKVD/MGB troops against the Ukrainian Insurgent Army (UPA) in western Ukraine: chekist-military operations, mass repressive actions, and the forced removal of insurgents' families to Siberia - in 1944–52 "203,662 people were deported from the territory of Western Ukraine to special settlements in remote regions of the USSR"(Citation: 191).
    Its finale was the use of collusion with a third party - Operation "Vistula" (1947), coordinated with the pro-Soviet government of Poland, "the concluding stage of the forced deportation of Ukrainians" "from the ancestral lands of Lemkivshchyna, Nadsiannia, Kholmshchyna, and Pidliashshia," carried out to deprive the UPA of its social base(Citation: 185).
  uk: |-
    Війна військ НКВС/МДБ проти Української повстанської армії (УПА) в Західній Україні: чекістсько-військові операції, масові репресивні акції та примусове вивезення родин повстанців до Сибіру - за 1944–52 роки «із території Західної України вислано на спецпоселення у віддалені райони СРСР 203 662 особи»(Citation: 191).
    Фіналом стало застосування змови з третьою стороною - узгоджена з прорадянським урядом Польщі акція «Вісла» (1947), «завершальний етап примусової депортації українців» «з прабатьківських земель Лемківщини, Надсяння, Холмщини та Підляшшя», проведена, щоб позбавити УПА соціальної бази(Citation: 185).
  ru: |-
    Война войск НКВД/МГБ против Украинской повстанческой армии (УПА) в Западной Украине: чекистско-войсковые операции, массовые репрессивные акции и принудительный вывоз семей повстанцев в Сибирь - за 1944–52 годы «с территории Западной Украины выслано на спецпоселение в отдалённые районы СССР 203 662 человека»(Citation: 191).
    Финалом стало применение сговора с третьей стороной - согласованная с просоветским правительством Польши акция «Висла» (1947), «завершающий этап принудительной депортации украинцев» «с прадедовских земель Лемковщины, Надсянья, Холмщины и Подляшья», проведенная, чтобы лишить УПА социальной базы(Citation: 185).
