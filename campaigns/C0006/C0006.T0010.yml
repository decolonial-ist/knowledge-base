description:
  en: |-
    The deliberate dissolution of a distinct Ukrainian identity in the construct of a "single Orthodox people": the "Synopsis" subordinated Kyiv's history to the idea of a common "Slaveno-Rossian people"(Citation: 196), and its political program presupposed a struggle for the "liberation… of the remaining part of the 'single Orthodox people'"(Citation: 184).
    Hrushevsky points out what exactly was erased: the "Synopsis" is "a brief history of Rus composed at the Pechersk Lavra, done very lifelessly and incompletely (the history of the Cossacks, the struggle against Poland, and all of Ukraine's recent history are almost entirely omitted from it)"(Citation: 250).
  uk: |-
    Цілеспрямоване розчинення окремої української ідентичності в конструкції «єдиного православного народу»: «Синопсис» підпорядковував історію Києва ідеї спільного «славеноросійського народу»(Citation: 196), а його політична програма передбачала боротьбу за «визволення… решти „єдиного православного народу“»(Citation: 184).
    Грушевський вказує, що саме було стерто: «Синопсис» - «коротенька історія Руси, зложена в Печерській Лаврі, дуже мертво і неповно (історія козаччини, боротьба з Польщею і вся новійша історія України проминені в ній майже цілком)»(Citation: 250).
  ru: |-
    Целенаправленное растворение отдельной украинской идентичности в конструкции «единого православного народа»: «Синопсис» подчинял историю Киева идее общего «славенороссийского народа»(Citation: 196), а его политическая программа предполагала борьбу за «освобождение… остальной части „единого православного народа“»(Citation: 184).
    Грушевский указывает, что именно было стёрто: «Синопсис» - «коротенькая история Руси, составленная в Печерской Лавре, очень мертво и неполно (история казачества, борьба с Польшей и вся новейшая история Украины пропущены в ней почти полностью)»(Citation: 250).
