description:
  ru: 'Внедрение нарратива о неразрывной связи Киева и Москвы, служившего политическим целям метрополии: автор стремился «дать московскому царю мотивацию для продолжения борьбы с Речью Посполитой» и «облегчить элите Гетманата инкорпорацию в русское правящее сословие»(Citation: 184).'
  en: 'The implantation of a narrative about the unbreakable bond between Kyiv and Moscow, serving the political aims of the metropole: the author sought "to give the Muscovite tsar the motivation to continue the struggle with the Polish-Lithuanian Commonwealth" and "to ease the incorporation of the Hetmanate''s elite into the Russian ruling estate"(Citation: 184).'
  uk: 'Впровадження наративу про нерозривний зв''язок Києва й Москви, що служив політичним цілям метрополії: автор прагнув «дати московському цареві мотивацію для продовження боротьби з Річчю Посполитою» і «полегшити еліті Гетьманату інкорпорацію в російський правлячий стан»(Citation: 184).'
