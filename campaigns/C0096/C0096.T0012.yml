description:
  ru: |-
    Инспирирование угрозы раскола страны в ответ на протесты: на съезде в Северодонецке 28 ноября 2004 года глава фракции «Регионов» Р. Богатырева дала прямое обещание сепаратистского референдума - «мы на него с вами не пойдем, мы будем проводить референдум о создании Юго-Восточного государства (овации, аплодисменты)»(Citation: 246).
    Присутствие официальных лиц РФ придавало этому санкцию Москвы: мэр Москвы Ю. Лужков с трибуны напомнил, что «наш Президент России Владимир Владимирович Путин первым поздравил Виктора Федоровича Януковича с победой»(Citation: 246).
  en: |-
    The instigation of the threat of splitting the country in response to the protests: at the congress in Sievierodonetsk on November 28, 2004, Regions faction leader R. Bohatyriova gave a direct promise of a separatist referendum - "we will not go to it with you, we will hold a referendum on the creation of a South-Eastern state (ovation, applause)"(Citation: 246).
    The presence of Russian officials lent this Moscow's sanction: the mayor of Moscow Yu.
    Luzhkov reminded the hall from the rostrum that "our President of Russia Vladimir Vladimirovich Putin was the first to congratulate Viktor Fedorovych Yanukovych on his victory"(Citation: 246).
  uk: |-
    Інспірування загрози розколу країни у відповідь на протести: на з'їзді в Сєвєродонецьку 28 листопада 2004 року голова фракції «Регіонів» Р. Богатирьова дала пряму обіцянку сепаратистського референдуму - «ми на нього з вами не підемо, ми проводитимемо референдум про створення Південно-Східної держави (овації, оплески)»(Citation: 246).
    Присутність офіційних осіб РФ надавала цьому санкцію Москви: мер Москви Ю. Лужков з трибуни нагадав, що «наш Президент Росії Володимир Володимирович Путін першим привітав Віктора Федоровича Януковича з перемогою»(Citation: 246).
