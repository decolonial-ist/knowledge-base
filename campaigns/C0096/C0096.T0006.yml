description:
  ru: |-
    Ведение агрессивной информационной кампании в пользу «своего» кандидата с прямым участием первого лица РФ: в прямом эфире трех украинских телеканалов за две недели до голосования звучали похвалы правительству кандидата - «правительству В.Януковича удалось больше: они смогли наполнить этот рост хорошим качеством.
    То есть экономика Украины развивается диверсифицированно»(Citation: 242).
    Параллельно оппонентов демонизировали, обвиняя в национализме и профашистских взглядах.
  en: |-
    The conduct of an aggressive information campaign in favor of "their" candidate with the direct participation of the head of the Russian state: live on three Ukrainian television channels two weeks before the vote, praise was voiced for the candidate's government - "V. Yanukovych's government achieved more: they managed to fill this growth with good quality.
    That is, Ukraine's economy is developing in a diversified way"(Citation: 242).
    In parallel, opponents were demonized with accusations of nationalism and pro-fascist views.
  uk: |-
    Ведення агресивної інформаційної кампанії на користь «свого» кандидата з прямою участю першої особи РФ: у прямому ефірі трьох українських телеканалів за два тижні до голосування лунали похвали урядові кандидата - «уряду В.Януковича вдалося більше: вони змогли наповнити це зростання гарною якістю.
    Тобто економіка України розвивається диверсифіковано»(Citation: 242).
    Паралельно опонентів демонізували, звинувачуючи в націоналізмі та профашистських поглядах.
