name:
  ru: Вмешательство в выборы и противодействие «Оранжевой революции» (2004)
  en: Election Interference and Countering the "Orange Revolution" (2004)
  uk: Втручання у вибори та протидія «Помаранчевій революції» (2004)
description:
  ru: |-
    Прямое вмешательство РФ в президентские выборы суверенного государства для навязывания лояльного кандидата (В. Януковича): за две недели до первого тура В. Путин в прямом эфире трех украинских телеканалов (26 октября 2004) агитировал за действующего премьера, заявляя, что «правительству В.Януковича удалось больше: они смогли наполнить этот рост хорошим качеством»(Citation: 242).
    Против лидера демократических сил В. Ющенко было применено химическое отравление: концентрация диоксина в его крови «более чем в 50 000 раз превышала показатели обычного населения»(Citation: 225).
    В ответ на протесты Москва инспирировала угрозу раскола страны - на съезде в Северодонецке (28 ноября 2004) глава фракции «Регионов» Р. Богатырева под аплодисменты обещала «мы будем проводить референдум о создании Юго-Восточного государства», а почетным гостем в президиуме сидел мэр Москвы Ю. Лужков(Citation: 246).
  en: |-
    Direct interference by the Russian Federation in the presidential election of a sovereign state in order to impose a loyal candidate (V. Yanukovych): two weeks before the first round, the head of the Russian state, live on three Ukrainian television channels, campaigned for the incumbent prime minister, declaring that "V. Yanukovych's government achieved more: they managed to fill this growth with good quality"(Citation: 242).
    Chemical poisoning was used against the leader of the democratic forces, V. Yushchenko: the dioxin levels in his blood "were more than 50,000-fold greater than those in the general population"(Citation: 225).
    In response to the protests, Moscow instigated the threat of splitting the country apart - at the Sievierodonetsk congress (28 November 2004) Regions faction leader R. Bohatyriova's words "we will hold a referendum on the creation of a South-Eastern state" were met with applause, while the mayor of Moscow Yu.
    Luzhkov sat as an honored guest in the presidium(Citation: 246).
  uk: |-
    Пряме втручання РФ у президентські вибори суверенної держави для нав'язування лояльного кандидата (В. Януковича): за два тижні до першого туру В. Путін у прямому ефірі трьох українських телеканалів (26 жовтня 2004) агітував за чинного прем'єра, заявляючи, що «уряду В.Януковича вдалося більше: вони змогли наповнити це зростання гарною якістю»(Citation: 242).
    Проти лідера демократичних сил В. Ющенка було застосовано хімічне отруєння: концентрація діоксину в його крові «більш ніж у 50 000 разів перевищувала показники звичайного населення»(Citation: 225).
    У відповідь на протести Москва інспірувала загрозу розколу країни - на з'їзді в Сєвєродонецьку (28 листопада 2004) голова фракції «Регіонів» Р. Богатирьова під оплески обіцяла «ми проводитимемо референдум про створення Південно-Східної держави», а почесним гостем у президії сидів мер Москви Ю. Лужков(Citation: 246).
