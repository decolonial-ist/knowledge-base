description:
  en: |-
    An attempt to physically eliminate the leader of the democratic opposition V. Yushchenko at the height of the election campaign by dioxin poisoning: in late December 2004 "a patient presented with TCDD poisoning; the levels in his blood serum (108000 pg/g lipid weight) were more than 50 000-fold greater than those in the general population"(Citation: 225).
    The poisoning led to severe disfigurement of the candidate's face.
  uk: |-
    Спроба фізичного усунення лідера демократичної опозиції В. Ющенка в розпал передвиборчої кампанії через отруєння діоксином: наприкінці грудня 2004 року «пацієнт надійшов з отруєнням ТХДД; рівні в сироватці його крові (108000 пг/г ліпідної маси) більш ніж у 50 000 разів перевищували показники звичайного населення»(Citation: 225).
    Отруєння призвело до тяжкого спотворення обличчя кандидата.
  ru: |-
    Попытка физического устранения лидера демократической оппозиции В. Ющенко в разгар предвыборной кампании путем отравления диоксином: в конце декабря 2004 года «пациент поступил с отравлением ТХДД; уровни в сыворотке его крови (108000 пг/г липидной массы) более чем в 50 000 раз превышали показатели обычного населения»(Citation: 225).
    Отравление привело к тяжелому обезображиванию лица кандидата.
