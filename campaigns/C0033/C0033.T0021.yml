description:
  en: |-
    The arrest and exile of the Sich's top leadership: "In July 1775, after the destruction of the New Sich, by order of Empress Catherine II, Kalnyshevsky was arrested and sent to the prison of the Solovetsky monastery"(Citation: 192).
    Kalnyshevsky spent more than 25 years in confinement; formally freed in 1801, he died in the monastery.
  uk: |-
    Арешт і заслання вищого керівництва Січі: «В лип. 1775, після зруйнування Нової Січі, за розпорядженням імп.
    Катерини II К[алнишевського] було заарештовано і відправлено до в'язниці Соловецького монастиря»(Citation: 192).
    Калнишевський провів в ув'язненні понад 25 років; формально звільнений 1801 року, він помер у монастирі.
  ru: |-
    Арест и ссылка высшего руководства Сечи: «В июле 1775, после разрушения Новой Сечи, по распоряжению императрицы Екатерины II Калнышевский был арестован и отправлен в тюрьму Соловецкого монастыря»(Citation: 192).
    Калнышевский провел в заключении более 25 лет; формально освобожденный в 1801 году, он умер в монастыре.
