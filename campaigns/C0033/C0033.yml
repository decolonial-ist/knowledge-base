name:
  en: Military Liquidation of the Zaporozhian Sich (1775)
  uk: Військова ліквідація Запорозької Січі (1775)
  ru: Военная ликвидация Запорожской Сечи (1775)
description:
  en: |-
    The military encirclement and destruction of the Zaporozhian Sich immediately after a joint war.
    Catherine II's manifesto of 3 August 1775 (PSZRI, coll. 1, vol.
    XX, no. 14,354) declared: "the Zaporozhian Sich has been utterly destroyed, with the extirpation for the future of the very name of the Zaporozhian Cossacks"(Citation: 147)(Citation: 390).
    The last kish otaman, Kalnyshevsky, "was arrested and sent to the prison of the Solovetsky monastery"(Citation: 192), where he spent more than 25 years.
    Hrushevsky describes the mechanics of the treachery: the government "went about the affair slowly, in secret, to catch the Zaporozhians entirely unprepared," and general Tekeli "entered the Zaporozhian lands as a good friend" - then suddenly laid siege to the Sich.
    The Zaporozhians were even faulted for their own husbandry: they "were establishing their own tillage and thereby severing their dependence on the Russian state"(Citation: 250).
  uk: |-
    Військове оточення та зруйнування Запорозької Січі одразу після спільної війни.
    Маніфест Катерини II від 3 серпня 1775 року (ПСЗРІ, зібр. 1-ше, т. XX, № 14.354) оголосив: «січ Запорозька вкінець уже зруйнована, з витребленням на майбутній час і самої назви Запорозьких козаків»(Citation: 147)(Citation: 390).
    Останнього кошового отамана Калнишевського «було заарештовано і відправлено до в'язниці Соловецького монастиря»(Citation: 192), де він провів понад 25 років.
    Грушевський описує механіку віроломства: уряд «повів дїло по малу, потайки, щоб захопити Запорожців зовсім неприготованими», а генерал Текелї «війшов в запорозькі землі як добрий приятель» - і несподівано обложив Січ.
    У провину запорожцям ставили навіть власне господарство: вони «заводили своє власне хліборобство і тим розривали свою залежність від росийської держави»(Citation: 250).
  ru: |-
    Военное окружение и разрушение Запорожской Сечи сразу после совместной войны.
    Манифест Екатерины II от 3 августа 1775 года (ПСЗРИ, собр. 1-е, т. XX, № 14.354) объявил: «сечь Запорожская в конец уже разрушена, со истреблением на будущее время и самого названия Запорожских казаков»(Citation: 147)(Citation: 390).
    Последний кошевой атаман Калнышевский «был арестован и отправлен в тюрьму Соловецкого монастыря»(Citation: 192), где он провел более 25 лет.
    Грушевский описывает механику вероломства: правительство «повело дело помалу, тайком, чтобы захватить запорожцев совсем неготовыми», а генерал Текели «вошёл в запорожские земли как добрый приятель» - и внезапно осадил Сечь.
    В вину запорожцам ставили даже собственное хозяйство: они «заводили своё собственное хлебопашество и тем разрывали свою зависимость от российской державы»(Citation: 250).
