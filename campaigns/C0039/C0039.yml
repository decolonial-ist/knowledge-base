name:
  ru: Русско-турецкая война и аннексия Бессарабии (1806–1812)
  en: Russo-Turkish War and the Annexation of Bessarabia (1806–1812)
  uk: Російсько-турецька війна та анексія Бессарабії (1806–1812)
description:
  ru: 'Использование украинских ресурсов в очередной геополитической войне империи, завершившейся отторжением Бессарабии у Османской империи: «После включения 16 мая 1812 Буджака в состав России (см. Бухарестский мирный договор 1812) украинские казаки волонтёрских полков, Усть-Дунайского Буджацкого казацкого войска и Дунайского казацкого войска активно заселяют Буджак»(Citation: 185).'
  en: 'The use of Ukrainian resources in yet another geopolitical war of the empire, which ended with the severing of Bessarabia from the Ottoman Empire: "After the incorporation of Bessarabia into Russia on May 16, 1812 (see the Treaty of Bucharest of 1812), Ukrainian Cossacks of the volunteer regiments, of the Ust-Danube Budjak Cossack Host, and of the Danube Cossack Host actively settled the Budjak"(Citation: 185).'
  uk: |-
    Використання українських ресурсів у черговій геополітичній війні імперії, що завершилася відторгненням Бессарабії від Османської імперії: «Після включення 16 трав. 1812 Б[ессарабії] до складу Росії (див.
    Бухарестський мирний договір 1812) укр. козаки волонтерських полків, Усть-Дунайського Буджацького козацького війська та Дунайського козацького війська активно заселяють Буджак»(Citation: 185).
