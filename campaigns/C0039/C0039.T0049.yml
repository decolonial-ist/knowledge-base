    Akkerman"(Citation: 196).
  uk: |-
    Використання українських козацьких формувань в імперській війні: «Рос. війська, до складу яких входило Усть-Дунайське Буджацьке козацьке військо, захопили Хотин, Бендери…
    Акерман»(Citation: 196).
