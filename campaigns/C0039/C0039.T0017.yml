description:
  ru: 'Отторжение Бессарабии от Османской империи и ее официальная аннексия по Бухарестскому миру: договор «утвердил присоединение Бессарабии к России и перенос границы с Днестра на Прут до его впадения в Дунай»(Citation: 196).'
  en: 'The severing of Bessarabia from the Ottoman Empire and its official annexation under the Peace of Bucharest: the treaty "confirmed the annexation of Bessarabia to Russia and the transfer of the border from the Dniester to the Prut down to its confluence with the Danube"(Citation: 196).'
  uk: 'Відторгнення Бессарабії від Османської імперії та її офіційна анексія за Бухарестським миром: договір «затвердив приєднання Бессарабії до Росії та перенесення кордону з Дністра на Прут до його впадіння в Дунай»(Citation: 196).'
