description:
  ru: 'Силовое удержание Правобережья империей: белоцерковская крепость с московским гарнизоном устояла, а поход захлебнулся после измены татар – «Орлик отступил, не взявши Белой Церкви»(Citation: 156), и его армия разложилась.'
  en: 'The empire''s forcible retention of the Right Bank: the Bila Tserkva fortress with its Muscovite garrison held out, and the campaign collapsed after the Tatars'' betrayal – "Orlyk retreated without taking Bila Tserkva"(Citation: 156), and his army disintegrated.'
  uk: 'Силове утримання Правобережжя імперією: білоцерківська фортеця з московською залогою встояла, а похід захлинувся після зради татар – «Орлик відступив, не взявши Білої Церкви»(Citation: 156), і його військо розклалося.'
