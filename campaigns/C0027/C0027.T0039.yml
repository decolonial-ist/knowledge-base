description:
  en: |-
    The collapse of the anti-Moscow coalition from within: on the Right Bank, the Tatar allies betrayed the Cossacks and turned to seizing the civilian population – "the Tatars, disobeying Orlyk, scattered in raiding parties and began taking yasyr captives across Ukrainian villages"(Citation: 156).
    Orlyk himself wrote to the Swedish king: "What atrocities unheard of under the moon did the wild Tatars then commit!"(Citation: 156).
  uk: |-
    Розвал антимосковської коаліції зсередини: на Правобережжі татарські союзники зрадили козаків і перейшли до захоплення мирного населення – «татари, не слухаючись Орлика, розсипалися загонами і стали набирати ясир по українських селах»(Citation: 156).
    Сам Орлик писав шведському королю: «Яких нечуваних під місяцем звірств не вчинили тоді дикі татари!»(Citation: 156).
  ru: |-
    Развал антимосковской коалиции изнутри: на Правобережье татарские союзники предали казаков и перешли к захвату мирного населения – «татары, не слушаясь Орлика, рассыпались загонами и стали набирать яссыр по украинским селам»(Citation: 156).
    Сам Орлик писал шведскому королю: «Каких неслыханных под луною свирепств ни учинили тогда дикие татары!»(Citation: 156).
