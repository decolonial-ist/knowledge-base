description:
  ru: |-
    Юридическая фиксация раскола территории.
    Москва целенаправленно раздробила некогда единую страну, превратив такие важные регионы, как Запорожье, в бесправные буферные зоны под совместным управлением: «...Запорожье (которое по договору 1667 года было в совместном правлении Москвы и Варшавы)»(Citation: 4).
  en: |-
    The legal codification of the territory's division.
    Moscow deliberately fragmented a once unified country, turning such important regions as Zaporizhzhia into rightless buffer zones under joint administration: "...Zaporizhzhia (which under the treaty of 1667 was under the joint rule of Moscow and Warsaw)"(Citation: 4).
  uk: |-
    Юридична фіксація розколу території.
    Москва цілеспрямовано роздробила колись єдину країну, перетворивши такі важливі регіони, як Запорожжя, на безправні буферні зони під спільним управлінням: «...Запорожжя (яке за договором 1667 року перебувало у спільному правлінні Москви та Варшави)»(Citation: 4).
