description:
  en: |-
    The official partition of Ukrainian lands between two neighboring states.
    The treaty was signed exclusively by representatives of Moscow and Warsaw: "Concluded on January 30 (February 9) in the village of Andrusovo, near Smolensk, for 13.5 years.
    The Russian delegation was headed by okolnichy A. L. Ordin-Nashchokin, the Polish one by commissioner Yu.
    Hlebowicz"(Citation: 187).
    The opinion of the autonomy itself was completely ignored: "The interests of the hetmans and of Ukraine were, of course, not taken into account"(Citation: 3).
    A separate knot of the collusion was Kyiv: article 7 of the Andrusovo treaty (30 January 1667) stipulated that "the very city of Kyiv… is to be handed over and vacated… that is, within two years, counting from the present treaty… in the coming year 1669, on the 15th day of April"(Citation: 312); "Muscovy then did not give it back"(Citation: 250) - and in 1686 it legalized what it had withheld, "paying for Kyiv once more" (see the "Eternal Peace" campaign).
    The "territory for money" scheme was laid down in the same document: article 34 records Tsar Aleksei's consent to grant "a worthy treasury for the satisfaction of the szlachta exiles… from the part of Ukraine ceded to His Tsarist Majesty's side"(Citation: 312) - with the sum deferred to future embassies.
  uk: |-
    Офіційний поділ українських земель між двома сусідніми державами.
    Договір підписали виключно представники Москви й Варшави: «Укладено 30.1(9.2) у с.
    Андрусово, поблизу Смоленська, на 13,5 року.
    Російську делегацію очолював окольничий А. Л. Ордін-Нащокін, польську – комісар Ю. Глібович»(Citation: 187).
    Думку самої автономії було повністю проігноровано: «Інтереси гетьманів і України при цьому, зрозуміло, не враховувалися»(Citation: 3).
    Окремий вузол змови - Київ: стаття 7 Андрусівського договору (30 січня 1667) зобов'язувала, що «саме місто Київ… має бути відданий і очищений… себто у два роки, від нинішнього договору рахуючи… у прийдешньому 1669 році в місяці квітні у 15 день»(Citation: 312); «Москва потім його не віддала»(Citation: 250) - а 1686 року легалізувала утримане, «доплативши за Київ ще раз» (див. кампанію «Вічний мир»).
    Схему «територія за гроші» закладено там само: стаття 34 фіксує згоду царя Олексія видати «казни якої достойної до задоволення шляхти, вигнанців… з частини України, у бік Його Царської Величності уступленої»(Citation: 312) - суму відклали на наступні посольства.
  ru: |-
    Официальный раздел украинских земель между двумя соседними государствами.
    Договор был подписан исключительно представителями Москвы и Варшавы: «Заключено 30.1(9.2) в дер.
    Андрусово, близ Смоленска, на 13,5 лет.
    Рус. делегацию возглавлял окольничий А. Л. Ордин-Нащокин, польскую – комиссар Ю. Глебович»(Citation: 187).
    Мнение самой автономии было полностью проигнорировано: «Интересы гетманов и Украины при этом, разумеется, не учитывались»(Citation: 3).
    Отдельный узел сговора - Киев: статья 7 Андрусовского договора (30 января 1667) обязывала, что «самой городъ Кіевъ… имѣетъ быть отданъ и очищенъ… се есть въ два года, отъ нынѣшняго договора считаючи… въ пришломъ 1669 году въ мѣсяцѣ Апрѣлѣ въ 15 день»(Citation: 312); «Москва потом его не отдала»(Citation: 250) - а в 1686 году легализовала удержанное, «доплатив за Киев ещё раз» (см. кампанию «Вечный мир»).
    Схема «территория за деньги» заложена там же: статья 34 фиксирует согласие царя Алексея выдать «казны какой достойной до удовольствованія шляхты, выгнанцовъ… изъ части Украйны, въ сторону Его Царскаго Величества уступленной»(Citation: 312) - сумму отложили на следующие посольства.
