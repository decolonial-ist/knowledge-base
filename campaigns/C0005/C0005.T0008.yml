description:
  ru: |-
    При юридическом разделе украинских земель мнение самого народа или его лидеров было демонстративно проигнорировано.
    Гетманщина рассматривалась исключительно как объект: «Интересы гетманов и Украины при этом, разумеется, не учитывались»(Citation: 3).
  en: |-
    In the legal partition of Ukrainian lands, the opinion of the people themselves or of their leaders was demonstratively ignored.
    The Hetmanate was treated exclusively as an object: "The interests of the hetmans and of Ukraine were, of course, not taken into account"(Citation: 3).
  uk: |-
    Під час юридичного поділу українських земель думку самого народу чи його лідерів було демонстративно проігноровано.
    Гетьманщину розглядали виключно як об'єкт: «Інтереси гетьманів та України при цьому, звісно, не враховувалися»(Citation: 3).
