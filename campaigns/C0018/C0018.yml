name:
  en: The Case of Pavlo Polubotok (1723)
  uk: Справа Павла Полуботка (1723)
  ru: Дело Павла Полуботка (1723)
description:
  en: |-
    Peter I's establishment of the First Little Russian Collegium to seize governance from the hetman's administration: the collegium was created "as the highest appellate instance and the administrative-controlling organ of the Russian state structure in Ukraine"(Citation: 194).
    It was accompanied by the arrest of acting hetman Polubotok and the officers for defending the autonomy: "the officers submitted to Emperor Peter I yet another petition to close the Little Russian Collegium.
    After this, interrogations of Polubotok began in the Secret Chancellery, and on November 10, 1723 he was arrested and imprisoned in the Peter and Paul Fortress"(Citation: 195), where the hetman died.
    The arrest order itself was never published as a separate act - the case was run by the Secret Chancellery; the circumstances were retrospectively set out in Empress Catherine I's manifesto of 8 February 1725: "it was ordered that the General Starshyna - Polubotok, Chernysh and Savych - be in St. Petersburg to answer for it"(Citation: 447).
  uk: |-
    Заснування Петром I Першої Малоросійської колегії для перехоплення управління в гетьманської адміністрації: колегію створено «як вища апеляційна інстанція та адм.-контролюючий орган рос. держ. структури в Україні»(Citation: 194).
    Супроводжувалося арештом наказного гетьмана Полуботка та старшини за захист автономії: «старшина подала на ім'я імп.
    Петра I чергову чолобитну про закриття Малорос. колегії.
    Після цього розпочалися допити П[олуботка] в Таємній канцелярії, а 10 листопада 1723 його заарештували й ув'язнили у Петропавловській фортеці»(Citation: 195), де гетьман і помер.
    Сам наказ про арешт окремим актом не публікувався - справу вела Таємна канцелярія; обставини ретроспективно викладено в маніфесті імператриці Катерини I від 8 лютого 1725 року: «повелено, тій Генеральній Старшині Полуботку, Чернишу і Савичу для відповіді в тому, бути в Санктпетербурзі»(Citation: 447).
  ru: |-
    Учреждение Петром I Первой Малороссийской коллегии для перехвата управления у гетманской администрации: коллегия создана «как высшая апелляционная инстанция и административно-контролирующий орган российской государственной структуры в Украине»(Citation: 194).
    Сопровождалось арестом наказного гетмана Полуботка и старшины за защиту автономии: «старшина подала на имя императора Петра I очередную челобитную о закрытии Малороссийской коллегии.
    После этого начались допросы Полуботка в Тайной канцелярии, а 10 ноября 1723 его арестовали и заключили в Петропавловскую крепость»(Citation: 195), где гетман и умер.
    Сам приказ об аресте отдельным актом не публиковался - дело вела Тайная канцелярия; обстоятельства ретроспективно изложены в манифесте императрицы Екатерины I от 8 февраля 1725 года: «повелено, той Генеральной Старшине Полуботку, Чернышу и Савичу для ответа в том, быть в Санктпетербурге»(Citation: 447).
