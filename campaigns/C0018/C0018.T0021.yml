description:
  ru: |-
    Арест наказного гетмана и старшины в Петербурге за челобитные в защиту автономных прав.
    Петр готовил показательную расправу: «Пётр I планировал провести показательный процесс над П.Полуботком и его единомышленниками, обвинить их в „государственной измене“ и ликвидировать украинскую автономию.
    Для этой цели был создан специальный Генеральный суд»(Citation: 207).
    План сорвала лишь смерть узника: гетман «умер 21 декабря 1724 г. (по ст. ст.) от пневмонии»(Citation: 207).
  en: |-
    The arrest of the acting hetman and officers in St. Petersburg for petitions defending autonomous rights.
    Peter was preparing a demonstrative reprisal: "Peter I planned to hold a show trial of Polubotok and his associates, accuse them of 'high treason,' and liquidate the Ukrainian autonomy.
    A special General Court was created for this purpose"(Citation: 207).
    Only the prisoner's death derailed the plan: the hetman "died on December 21, 1724 (O.S.) of pneumonia"(Citation: 207).
  uk: |-
    Арешт наказного гетьмана та старшини в Петербурзі за чолобитні на захист автономних прав.
    Петро готував показову розправу: «Петро I планував провести показовий процес над П.Полуботком і його однодумцями, звинуватити їх у „державній зраді“ та ліквідувати українську автономію.
    Для цієї мети було створено спеціальний Ґенеральний суд»(Citation: 207).
    План зірвала лише смерть в'язня: гетьман «помер 21 грудня 1724 р. (за ст. ст.) від пневмонії»(Citation: 207).
