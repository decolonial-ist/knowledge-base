name:
  ru: Московско-украинская война (1658–1659)
  en: Muscovite–Ukrainian War (1658–1659)
  uk: Московсько-українська війна (1658–1659)
description:
  ru: |-
    Открытая военная агрессия Московского царства в ответ на попытку гетмана разорвать вассалитет.
    Сопровождалась разжиганием гражданской войны через спонсирование оппозиции – восстание Пушкаря и Барабаша против Выговского(Citation: 196) – и прямым вторжением московской армии, понесшей катастрофические потери под Конотопом: «Цвет московской конницы, совершившей счастливые походы 54-го и 55-го годов, сгиб в один день»(Citation: 155).
  en: |-
    Open military aggression by the Tsardom of Muscovy in response to the hetman's attempt to break vassalage.
    It was accompanied by the fomenting of civil war through sponsorship of the opposition – the revolt of Pushkar and Barabash against Vyhovsky(Citation: 196) – and by a direct invasion of the Muscovite army, which suffered catastrophic losses at Konotop: "The flower of the Muscovite cavalry, which had made the fortunate campaigns of '54 and '55, perished in a single day"(Citation: 155).
  uk: |-
    Відкрита воєнна агресія Московського царства у відповідь на спробу гетьмана розірвати васалітет.
    Супроводжувалася розпалюванням громадянської війни через спонсорування опозиції – повстання Пушкаря і Барабаша проти Виговського(Citation: 196) – та прямим вторгненням московського війська, яке зазнало катастрофічних втрат під Конотопом: «Цвіт московської кінноти, що здійснила щасливі походи 54-го і 55-го років, згинув за один день»(Citation: 155).
