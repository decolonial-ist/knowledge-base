name:
  ru: 'Подавление восстания нохчи: разорение сёл и принудительная рубка лесов Грековым (1821-1822)'
  en: 'Suppression of the Nokhchi Uprising: Devastation of Villages and Forced Forest Felling by Grekov (1821-1822)'
  uk: 'Придушення повстання Нохчі: розорення сіл і примусове вирубування лісів Грековим (1821-1822)'
description:
  ru: |-
    В 1821-1822 годах нохчи поднялись против насаждения Российской империей крепостной линии на реке Сунже и сгона жителей равнины в горы.
    Историк Д. А. Хожаев пишет, что в начале 1822 года Бейбулат Таймиев при помощи кадиев Абдул-Кадыра из Герменчука и муллы Мустафы, бежавшего из сожжённого Сунженского аула, «пытался поднять всеобщее восстание в Чечне»(Citation: 95).
    Начальник левого фланга Кавказской линии Греков подавлял это сопротивление карательными разорениями сёл и принудительной прорубкой просек через леса нохчи руками самих жителей.
    Историк Д. А. Хожаев приводит рапорт Грекова, в котором тот сам излагал свою цель: согнать чеченцев в леса, где «не доставало только снегу и холодной погоды, чтобы народ чеченский испытывал все бедствия при подобных случаях неизбежные и почувствовал необходимость покориться»(Citation: 95).
    Имперский историк Потто подтверждает ход подавления со стороны завоевателя: 1 марта 1821 года войска «окружили селение Ойсунгур… и в наказание жителей, бежавших перед их приходом, совершенно его разрушили», вырубив лес «в одну сторону до Исти-Су, в другую — до Мичика»(Citation: 75).
    В феврале 1822 года, когда кадий Абдул-Кадыр встретил войска на Аргуне с оружием, «пушечное ядро оторвало Абдул-Кадыру ногу… на третий день умер», после чего Греков «сжёг селения Шали и Малые Атаги»(Citation: 75).
  en: |-
    In 1821-1822 the Nokhchi rose up against the Russian Empire’s imposition of a fortress line on the Sunzha River and the driving of the plain’s inhabitants into the mountains.
    The historian D. A. Khozhaev writes that in early 1822 Beibulat Taimiev, with the help of the qadi Abdul-Kadyr of Germenchuk and mullah Mustafa, who had fled the burned Sunzha aul, “attempted to raise a general uprising in Chechnya”(Citation: 95).
    Grekov, commander of the left flank of the Caucasian Line, suppressed this resistance with punitive devastations of villages and the forced cutting of clearings through the forests of the Nokhchi by the hands of the inhabitants themselves.
    The historian D. A. Khozhaev cites Grekov’s report, in which he himself set out his aim: to drive the Chechens into the forests, where “only snow and cold weather were lacking for the Chechen people to experience all the calamities inevitable in such cases and to feel the necessity of submitting”(Citation: 95).
    The imperial historian Potto confirms the course of the suppression from the conqueror’s side: on March 1, 1821, the troops “surrounded the village of Oisungur… and, as punishment of the inhabitants, who had fled before their arrival, destroyed it completely,” felling the forest “in one direction as far as Isti-Su, in the other — as far as the Michik”(Citation: 75).
    In February 1822, when the qadi Abdul-Kadyr met the troops on the Argun with arms in hand, “a cannonball tore off Abdul-Kadyr’s leg… he died on the third day,” after which Grekov “burned the villages of Shali and Malye Atagi”(Citation: 75).
  uk: |-
    У 1821-1822 роках Нохчі повстали проти насадження Російською імперією укріпленої лінії на річці Сунжі та зганяння мешканців рівнини в гори.
    Історик Д. А. Хожаєв пише, що на початку 1822 року Бейбулат Таймієв за допомогою кадіїв Абдул-Кадира з Герменчука та мулли Мустафи, який утік зі спаленого Сунженського аулу, «намагався підняти загальне повстання в Чечні»(Citation: 95).
    Начальник лівого флангу Кавказької лінії Греков придушував цей опір каральними розореннями сіл і примусовим прорубуванням просік крізь ліси Нохчі руками самих мешканців.
    Історик Д. А. Хожаєв наводить рапорт Грекова, у якому той сам викладав свою мету: зігнати Чеченців у ліси, де «бракувало лише снігу та холодної погоди, щоб народ чеченський зазнав усіх лих, у подібних випадках неминучих, і відчув необхідність підкоритися»(Citation: 95).
    Імперський історик Потто підтверджує перебіг придушення з боку завойовника: 1 березня 1821 року війська «оточили селище Ойсунгур… і на покарання мешканців, які втекли перед їхнім приходом, цілковито його зруйнували», вирубавши ліс «в один бік до Істі-Су, в інший — до Мічика»(Citation: 75).
    У лютому 1822 року, коли кадій Абдул-Кадир зустрів війська на Аргуні зі зброєю, «гарматне ядро відірвало Абдул-Кадиру ногу… на третій день помер», після чого Греков «спалив селища Шалі та Малі Атаги»(Citation: 75).
