description:
  en: |-
    The Russian Empire compelled the Nokhchi themselves to cut military clearings through their own forests.
    Historian D. A. Khozhaev writes that in imposing the line, the conquerors “compelled the subordinated Highlanders to heavy labor building roads and bridges,” while those who evaded it were “fined mercilessly, with their livestock and property confiscated”(Citation: 95).
    The imperial historian Potto confirms that the clearings from Amir-Adzhi-Yurt to Oisungur, Isti-Su, and Gerzel-Aul “through the narrow forested strip… were worked by the natives themselves, under the supervision of the Aksai princes”(Citation: 75).
  uk: |-
    Російська імперія змушувала самих Нохчі прорубувати військові просіки через їхні власні ліси.
    Історик Д. А. Хожаєв пише, що під час насадження лінії завойовники «примушували підкорених Горців до важких робіт із будівництва доріг і мостів», а тих, хто ухилявся, «нещадно штрафували, відбираючи худобу та майно»(Citation: 95).
    Імперський історик Потто підтверджує, що просіки від Амір-Аджі-Юрта до Ойсунгура, Істі-Су та Герзель-Аула «через вузьку лісисту смугу… розробляли самі тубільці, під наглядом аксаївських князів»(Citation: 75).
  ru: |-
    Российская империя принуждала самих нохчи прорубать военные просеки через их собственные леса.
    Историк Д. А. Хожаев пишет, что при насаждении линии завоеватели «принуждали подчинившихся горцев к тяжёлым работам по строительству дорог и мостов», а уклонившихся «нещадно штрафовали, отбирая скот и имущество»(Citation: 95).
    Имперский историк Потто подтверждает, что просеки от Амир-Аджи-Юрта до Ойсунгура, Исти-Су и Герзель-Аула «через узкую лесистую полосу… разрабатывали сами туземцы, под наблюдением аксаевских князей»(Citation: 75).
