description:
  ru: |-
    Российская империя удерживала заложников из нохчи и принуждала ими к подчинению.
    Историк Д. А. Хожаев приводит «Обращение» Ермолова к чеченцам с прямой угрозой: при малейшем неповиновении «аманаты повешены, деревни истребляются огнём, жён и детей вырезывают»(Citation: 95).
    Имперский историк Потто подтверждает, что начальник левого фланга Кавказской линии Греков принуждал именно заложниками: всякое нападение на отряд «неминуемо повлечёт за собою смертную казнь или ссылку в Сибирь аманатов», и потому «чеченцы волей-неволей мирились с тем, что падали и исчезали леса — их вековая защита»(Citation: 75).
  en: |-
    The Russian Empire held hostages from among the Nokhchi and used them to compel submission.
    Historian D. A. Khozhaev cites Yermolov's «Address» to the Chechens containing a direct threat: at the slightest disobedience, «the amanats are hanged, villages are exterminated by fire, wives and children are slaughtered»(Citation: 95).
    The imperial historian Potto confirms that Grekov, commander of the left flank of the Caucasus Line, compelled submission precisely through hostages: any attack on a detachment «will inevitably entail the death penalty or exile to Siberia for the amanats», and therefore «the Chechens willy-nilly reconciled themselves to the fact that the forests — their age-old protection — were falling and disappearing»(Citation: 75).
  uk: |-
    Російська імперія утримувала заручників із Нохчі та примушувала ними до підпорядкування.
    Історик Д. А. Хожаєв наводить «Звернення» Єрмолова до Чеченців із прямою погрозою: за найменшого непослуху «аманатів вішають, села винищують вогнем, жінок і дітей вирізають»(Citation: 95).
    Імперський історик Потто підтверджує, що начальник лівого флангу Кавказької лінії Греков примушував саме заручниками: будь-який напад на загін «неминуче потягне за собою смертну кару або заслання аманатів до Сибіру», і тому «Чеченці хоч-не-хоч мирилися з тим, що падали і зникали ліси — їхній віковий захист»(Citation: 75).
