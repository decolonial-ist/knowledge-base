description:
  ru: |-
    Юбилей закрепили материальным знаком в Переяславе на Киевщине, на той самой площади, где в 1654 году проходила рада.
    Знак встал в ходе юбилейной перестройки города, которую заказала республиканская власть: «в связи с подготовкой к празднованию 300-летия воссоединения Украины с Россией» Совет Министров УССР выделил 20 миллионов рублей на реконструкцию Переяслав-Хмельницкого, план перестройки разработали под руководством архитектора Владимира Заболотного, и в мае 1954 года «на площади, где проходила историческая Переяславская рада (ныне площадь Воссоединения), установлен обелиск с мемориальной доской»(Citation: 363).
    На доске под рельефом Богдана Хмельницкого отлит текст: «На этой площади 8 (18) января 1654 года состоялась Переяславская рада, которая, выражая волю украинского народа, единогласно приняла историческое решение о воссоединении Украины с Россией»(Citation: 414).
    Знак не просто отмечал место: он объявлял решение единогласным и выражающим волю народа, закрепляя эту версию в бронзе на самой площади, где всё происходило.
  en: |-
    The jubilee was fixed with a material sign in Pereiaslav in the Kyiv region, on the very square where the rada had taken place in 1654.
    The sign went up in the course of the jubilee reconstruction of the town ordered by the republic's authorities: "in connection with the preparation for the celebration of the 300th anniversary of the reunification of Ukraine with Russia," the Council of Ministers of the Ukrainian SSR allocated 20 million rubles for the reconstruction of Pereiaslav-Khmelnytskyi, the reconstruction plan was developed under the direction of the architect Volodymyr Zabolotnyi, and in May 1954, "on the square where the historic Pereiaslav Rada took place (now Reunification Square), an obelisk with a memorial plaque was put up"(Citation: 363).
    On the plaque, beneath a relief of Bohdan Khmelnytsky, a text is cast: "On this square, on 8 (18) January 1654, the Pereiaslav Rada took place, which, expressing the will of the Ukrainian people, unanimously adopted the historic decision on the reunification of Ukraine with Russia"(Citation: 414).
    The sign did not merely mark the spot: it declared the decision unanimous and expressive of the people's will, fixing this version in bronze on the very square where it all happened.
  uk: |-
    Ювілей закріпили матеріальним знаком у Переяславі на Київщині, на тій самій площі, де 1654 року відбувалася рада.
    Знак постав у ході ювілейної перебудови міста, яку замовила республіканська влада: «У зв'язку з підготовкою до святкування 300-річчя возз'єднання України з Росією Рада Міністрів УРСР виділила 20 млн. крб. на реконструкцію Переяслав-Хмельницького», план перебудови розробили під керівництвом архітектора Володимира Заболотного, і в травні 1954 року «на площі, де відбувалася історична Переяславська рада (нині площа Возз'єднання), встановлено обеліск з меморіальною дошкою»(Citation: 363).
    На дошці під рельєфом Богдана Хмельницького відлито текст: «На цій площі 8(18) січня 1654 року відбулась Переяславська Рада, яка, виражаючи волю українського народу, одностайно прийняла історичне рішення про возз'єднання України з Росією»(Citation: 414).
    Знак не просто позначав місце: він оголошував рішення одностайним і таким, що виражає волю народу, закріплюючи цю версію в бронзі на тій самій площі, де все відбувалося.
