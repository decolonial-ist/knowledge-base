description:
  en: 'A state campaign to construct a historical myth: the "Theses on the 300th Anniversary of the Reunification of Ukraine with Russia," approved by the CPSU Central Committee, declared that "by this historic act was completed the long struggle of the freedom-loving Ukrainian people against foreign enslavers for reunification with the Russian people in a single Russian state"(Citation: 171) – the annexation of 1654 was retroactively rewritten as the goal and outcome of a national struggle.'
  uk: 'Державна кампанія з конструювання історичного міфу: «Тези до 300-річчя возз''єднання України з Росією», схвалені ЦК КПРС, проголошували, що «Цим історичним актом була завершена тривала боротьба волелюбного українського народу проти іноземних поневолювачів за возз''єднання з російським народом в єдиній Російській державі»(Citation: 171) – анексію 1654 року заднім числом переписували як мету та підсумок національної боротьби.'
  ru: 'Государственная кампания по конструированию исторического мифа: «Тезисы о 300-летии воссоединения Украины с Россией», одобренные ЦК КПСС, объявляли, что «Этим историческим актом была завершена длительная борьба свободолюбивого украинского народа против иноземных поработителей за воссоединение с русским народом в едином Российском государстве»(Citation: 171) – аннексия 1654 года задним числом переписывалась как цель и итог национальной борьбы.'
