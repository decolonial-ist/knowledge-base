description:
  en: |-
    The redrawing of internal borders by the USSR Supreme Soviet Presidium's resolution of 19 February 1954: "To approve the joint submission of the Presidium of the Supreme Soviet of the RSFSR and the Presidium of the Supreme Soviet of the Ukrainian SSR on the transfer of the Crimean oblast from the Russian Soviet Federative Socialist Republic to the Ukrainian Soviet Socialist Republic"(Citation: 169) – the decision was taken in Moscow, without any expression of will by the peninsula's inhabitants.
    Behind the "commonality of the economy" stood the desire to shift the peninsula, ruined by deportation and war, onto the books of the Ukrainian SSR: "Moscow admits ever more openly: the Crimean region is a problem territory that the union center does not know how to sustain"(Citation: 330).
  uk: |-
    Перекроювання внутрішніх кордонів постановою Президії ВР СРСР від 19 лютого 1954 року: «Затвердити спільне подання Президії Верховної Ради РРФСР і Президії Верховної Ради УРСР про передачу Кримської області зі складу Російської Радянської Федеративної Соціалістичної Республіки до складу Української Радянської Соціалістичної Республіки»(Citation: 169) – рішення ухвалювалося в Москві, без жодного волевиявлення мешканців півострова.
    За «спільністю економіки» стояло бажання скинути зруйнований депортацією і війною півострів на баланс УРСР: «У Москві дедалі відвертіше визнають: Кримська область є проблемною територією, яку союзний центр не знає, як утримувати»(Citation: 330).
  ru: |-
    Перекраивание внутренних границ постановлением Президиума ВС СССР от 19 февраля 1954 года: «Утвердить совместное представление Президиума Верховного Совета РСФСР и Президиума Верховного Совета УССР о передаче Крымской области из состава Российской Советской Федеративной Социалистической Республики в состав Украинской Советской Социалистической Республики»(Citation: 169) – решение принималось в Москве, без всякого волеизъявления жителей полуострова.
    За «общностью экономики» стояло желание сбросить разорённый депортацией и войной полуостров на баланс УССР: «В Москве всё откровеннее признают: Крымская область является проблемной территорией, которую союзный центр не знает, как содержать»(Citation: 330).
