name:
  ru: Идеологическая кампания «300-летие воссоединения» и передача Крыма (1954)
  en: The Ideological Campaign of the "300th Anniversary of Reunification" and the Transfer of Crimea (1954)
  uk: Ідеологічна кампанія «300-річчя возз'єднання» та передача Криму (1954)
description:
  ru: |-
    Государственная пропагандистская операция: чтобы замаскировать колониальный статус Украины, империя с помпой отпраздновала годовщину Переяславской рады, конструируя миф о «едином народе».
    В рамках той же кампании УССР был передан Крым – указ Президиума Верховного Совета СССР от 19 февраля 1954 года мотивировал это так: «Учитывая общность экономики, территориальную близость и тесные хозяйственные и культурные связи между Крымской областью и Украинской ССР»(Citation: 169).
    Реальный контекст решения: «После Второй мировой войны, депортации крымскотатарского народа и массовых переселений из других регионов СССР полуостров находится в глубоком социально-экономическом кризисе», и «в Москве всё откровеннее признают: Крымская область - проблемная территория, которую союзный центр не знает, как содержать»(Citation: 330).
  en: |-
    A state propaganda operation: to mask Ukraine's colonial status, the empire celebrated with pomp the anniversary of the Pereiaslav Council, constructing the myth of a "single people."
    As part of the same campaign, Crimea was transferred to the Ukrainian SSR – the decree of the USSR Supreme Soviet Presidium of 19 February 1954 motivated it thus: "Taking into account the commonality of the economy, territorial proximity, and close economic and cultural ties between the Crimean oblast and the Ukrainian SSR"(Citation: 169).
    The real context of the decision: "After the Second World War, the deportation of the Crimean Tatar people and mass resettlements from other regions of the USSR, the peninsula is in a deep socio-economic crisis," and "Moscow admits ever more openly: the Crimean region is a problem territory that the union center does not know how to sustain"(Citation: 330).
  uk: |-
    Державна пропагандистська операція: щоб замаскувати колоніальний статус України, імперія з помпою відсвяткувала річницю Переяславської ради, конструюючи міф про «єдиний народ».
    У межах тієї ж кампанії УРСР було передано Крим – указ Президії Верховної Ради СРСР від 19 лютого 1954 року мотивував це так: «Враховуючи спільність економіки, територіальну близькість і тісні господарські та культурні зв'язки між Кримською областю і Українською РСР»(Citation: 169).
    Реальний контекст рішення: «Після Другої світової війни, депортації кримськотатарського народу та масових переселень з інших регіонів СРСР півострів перебуває в глибокій соціально-економічній кризі», і «У Москві дедалі відвертіше визнають: Кримська область є проблемною територією, яку союзний центр не знає, як утримувати»(Citation: 330).
