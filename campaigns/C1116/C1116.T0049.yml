description:
  en: |-
    The occupation administration compelled the subordinate Nokhchi to take part in armed conflicts: in their petition to Tsar Mikhail Fyodorovich, the Okotsky murza Kokhostrov Biytemirov and the serving Okochans of Tersky Town reported that «we, your sovereign's kholops (bonded servants), fight your sovereign's disobedient ones, not sparing our heads; for you, sovereign, we shed our blood and lay down our heads»(Citation: 82).

    The occupation administration and forces loyal to it sent the subordinate Nokhchi (Okochans) to take part in armed conflicts, including against their own compatriots: the historian I. Kh.
    Tkhamokova states that in 1626 the voivodes sent «252 Okochans»(Citation: 85)(Citation: 92) on a campaign, and in 1628, during an armed incursion, the Kabardian murza Konshov-murza Bitemryukov «went against these “mountain people”... with the “Okochans”»(Citation: 85).
  uk: |-
    Окупаційна адміністрація примушувала підпорядкованих Нохчі до участі у збройних конфліктах: у своїй чолобитній цареві Михайлу Федоровичу окоцький мурза Кохостров Бійтеміров та служилі Окочани Терського міста звітували, що «з твоїми государевими непослушниками б'ємося ми, холопи твої государеві, не шкодуючи голів своїх, за тебе, государя, кров свою проливаємо і голови свої складаємо»(Citation: 82).

    Окупаційна адміністрація та лояльні їй сили направляли підпорядкованих Нохчі (Окочан) для участі у збройних конфліктах, зокрема проти їхніх співвітчизників: історикиня І. Х. Тхамокова констатує, що 1626 року воєводи послали в похід «Окочан 252 особи»(Citation: 85)(Citation: 92), а 1628 року під час збройного вторгнення кабардинський мурза Коншов-мурза Бітемрюков «ходив на цих «горських людей»... з «Окочанами»»(Citation: 85).
  ru: |-
    Оккупационная администрация принуждала подчиненных нохчи к участию в вооруженных конфликтах: в своей челобитной царю Михаилу Федоровичу окоцкий мурза Кохостров Бийтемиров и служилые окочане Терского города отчитывались, что «с твоими государевы непослушники бьемся мы, холопи твои государевы, не щадя голов своих, за себя, государя, кровь свою проливаем и головы свои складываем»(Citation: 82).

    Оккупационная администрация и лояльные ей силы направляли подчиненных нохчи (окочан) для участия в вооруженных конфликтах, в том числе против их соотечественников: историк И. Х. Тхамокова констатирует, что в 1626 году воеводы послали в поход «окочан 252 человека»(Citation: 85)(Citation: 92), а в 1628 году во время вооруженного вторжения кабардинский мурза Коншов-мурза Битемрюков «ходил на этих «горских людей»... с «окочанами»»(Citation: 85).
