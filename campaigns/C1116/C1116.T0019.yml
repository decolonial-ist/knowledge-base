description:
  ru: 'Вооруженные отряды, лояльные метрополии, осуществляли вторжение на территории горных обществ нохчи для подавления их сопротивления: историк И. Х. Тхамокова указывает, что в 1628 году кабардинский мурза Коншов-мурза Битемрюков «ходил на этих «горских людей» вместе с «вольными» атаманами и казаками и с «окочанами»»(Citation: 85).'
  en: |-
    Armed detachments loyal to the metropole carried out incursions into the territories of the Nokhchi mountain communities in order to suppress their resistance: the historian I. Kh.
    Tkhamokova notes that in 1628 the Kabardian murza Konshov-murza Bitemryukov «went against these “mountain people” together with the “free” atamans and Cossacks and with the “Okochans”»(Citation: 85).
  uk: 'Збройні загони, лояльні метрополії, здійснювали вторгнення на території гірських громад Нохчі для придушення їхнього опору: історикиня І. Х. Тхамокова вказує, що 1628 року кабардинський мурза Коншов-мурза Бітемрюков «ходив на цих «горських людей» разом із «вольними» отаманами й козаками та з «Окочанами»»(Citation: 85).'
