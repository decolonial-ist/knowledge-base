description:
  ru: 'Оккупационная администрация обложила горные общества нохчи (шибутян) ежегодной натуральной данью: в отписке терских воевод Ивана Андреевича Дашкова и Богдана Герасимовича Приклонского в Посольский приказ констатируется, что при оформлении подданства в 1627 году от горцев потребовали «ясак давати по кулю меду на год»(Citation: 82).'
  en: 'The occupation administration imposed an annual tribute in kind on the Nokhchi mountain communities (the Shibutians): a report from the Terek voivodes Ivan Andreyevich Dashkov and Bogdan Gerasimovich Priklonsky to the Posolsky Prikaz states that when subjecthood was formalized in 1627, the mountaineers were required «to give yasak at one kul (sack) of honey per year»(Citation: 82).'
  uk: 'Окупаційна адміністрація обклала гірські громади Нохчі (Шибутян) щорічною натуральною даниною: у відписці терських воєвод Івана Андрійовича Дашкова та Богдана Герасимовича Приклонського до Посольського приказу констатується, що під час оформлення підданства 1627 року від горців вимагали «ясак давати по кулю меду на рік»(Citation: 82).'
