name:
  en: Use of the Nokhchi in Military Expeditions, Intervention, and Imposition of Yasak (1626–1628)
  uk: Використання Нохчі у воєнних експедиціях, інтервенція та обкладення ясаком (1626–1628)
  ru: Использование нохчи в военных экспедициях, интервенция и обложение ясаком (1626–1628)
description:
  en: |-
    The occupation administration of the metropole and forces loyal to it used the subordinated Nokhchi (Okochans) in armed conflicts and carried out military interventions into the mountain territories.
    Historian I. Kh.
    Tkhamokova states that in 1626, to support allied feudal lords, the voivodes sent «Terek uzdens and Cherkasy and newly baptized ones and Okochans, 252 men, as well as Terek atamans and Cossacks with the Terek mounted streltsy head Fadey Voloshenin and with sotniks, 500 men»(Citation: 85)(Citation: 92).
    In 1628, after mountaineers killed five Cossacks, a retaliatory invasion followed: Tkhamokova indicates that during the armed campaign the Kabardian murza Konshov-murza Bitemryukov «went against these «mountain people» together with the «free» atamans and Cossacks and with the «Okochans»»(Citation: 85).
    In parallel, the metropole coerced the mountain societies of the Nokhchi into legal subjugation and payment of tribute in kind.
    A dispatch from the Terek voivodes Ivan Andreevich Dashkov and Bogdan Gerasimovich Priklonsky to the Ambassadorial Prikaz records information about «the oath given by the Shibut men Lavarsan Yazyev and Zatyshka Lavarsanov on behalf of 20 households in 1627»(Citation: 82).
    The document dryly states the administration's demand that the mountaineers «not fall away from the sovereign and remain under the sovereign's hand in direct kholopstvo (servitude)»(Citation: 82) and undertake to «pay yasak of one kul of honey per year»(Citation: 82).
  uk: |-
    Окупаційна адміністрація метрополії та лояльні їй сили використовували підкорених Нохчі (Окочан) у збройних конфліктах і здійснювали воєнні інтервенції на гірські території.
    Історик І. Х. Тхамокова констатує, що 1626 року для підтримки союзних феодалів воєводи послали «терських узденів і черкасів, і новохрещених, і Окочан 252 особи, а також терських отаманів і козаків з терським кінним стрілецьким головою Фадеєм Волошеніним та із сотниками 500 осіб»(Citation: 85)(Citation: 92). 1628 року, після того як горці вбили п'ятьох козаків, відбулося вторгнення у відповідь: Тхамокова зазначає, що під час збройного походу кабардинський мурза Коншов-мурза Бітемрюков «ходив на цих «горських людей» разом із «вольними» отаманами й козаками та з «Окочанами»»(Citation: 85).
    Паралельно метрополія примушувала гірські товариства Нохчі до юридичного підпорядкування та сплати натуральної данини.
    У відписці терських воєвод Івана Андрійовича Дашкова та Богдана Герасимовича Приклонського до Посольського приказу зафіксовано інформацію про «присягу, дану Шибутянами Лаварсаном Язиєвим і Затишкою Лаварсановим за 20 дворів у 1627 р.»(Citation: 82).
    У документі сухо констатується вимога адміністрації, щоб горці «від государя відступні не були і були під государевою рукою в прямому холопстві»(Citation: 82) та зобов'язалися «ясак давати по кулю меду на рік»(Citation: 82).
  ru: |-
    Оккупационная администрация метрополии и лояльные ей силы использовали подчиненных нохчи (окочан) в вооруженных конфликтах и осуществляли военные интервенции на горные территории.
    Историк И. Х. Тхамокова констатирует, что в 1626 году для поддержки союзных феодалов воеводы послали «терских узденей и черкас и новокрещенов и окочан 252 человека да терских же атаманов и казаков с терским конным головою стрелецким с Фадеем Волошенином и с сотники 500 человек»(Citation: 85)(Citation: 92).
    В 1628 году, после того как горцы убили пятерых казаков, последовало ответное вторжение: Тхамокова указывает, что во время вооруженного похода кабардинский мурза Коншов-мурза Битемрюков «ходил на этих «горских людей» вместе с «вольными» атаманами и казаками и с «окочанами»»(Citation: 85).
    Параллельно метрополия принуждала горные общества нохчи к юридическому подчинению и выплате натуральной дани.
    В отписке терских воевод Ивана Андреевича Дашкова и Богдана Герасимовича Приклонского в Посольский приказ фиксируется информация о «присяге, данной шибутянами Лаварсаном Языевым и Затышкой Лаварсановым за 20 дворов в 1627 г.»(Citation: 82).
    В документе сухо констатируется требование администрации, чтобы горцы «от государя отступны не были и были под государевою рукою в прямом холопстве»(Citation: 82) и обязались «ясак давати по кулю меду на год»(Citation: 82).
