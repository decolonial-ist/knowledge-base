description:
  ru: |-
    С 1973 года колонизатор оправдывал депортацию и не давал чеченцам говорить о ней и о военном захвате региона, а с 1979 года навязал «концепцию» о «200-летии добровольного вхождения Чечено-Ингушетии в состав России» и преследовал историков, которые её оспаривали.
    На собрании оккупационной администрации региона 27 марта 1973 года один из её руководителей Боков оправдывал выселение 1944 года: «Все это, на наш взгляд, и вынудило правительство пойти на эту крайнюю меру, чтобы покончить с антисоветскими действиями политбанд [так власть называла вооружённых противников], которые укрывались в значительной части чечено-ингушского населения», а в протокол того же собрания носителей «националистических» идей записали поимённо: «исключенный из партии писатель Халид Ошаев, бывший заместитель директора завода Костоев Б., преподаватель госуниверситета кандидат наук Вагапов Я.»(Citation: 638).
    Историк А. Б. Кузнецова пишет, что на обсуждении двухтомника «Очерки истории Чечено-Ингушской АССР» в 1973 году критиковали «умаление» роли русского народа и работы историка В. И. Филькина, «при этом на обсуждении не было сказано ни слова о депортации»(Citation: 265).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что оккупационная администрация региона повела травлю чеченской интеллигенции «под видом дискуссии вокруг «концепции» о 200-летии добровольного вхождения Чечено-Ингушетии в состав России», автором которой считался археолог Виноградов, а он «опирался даже на авторитет ЦК КПСС [центральной власти в Москве]»(Citation: 125).
    В феврале 1979 года историк Академии наук Л. И. Лавров по поручению начальства написал отзыв на «Справку-обоснование» юбилея: присяги XVIII века «не приводили к фактическому вхождению края в состав Российской империи, так как в нем и после присяг не появлялись чиновники царской администрации», а «намечаемое празднование юбилея в свете сказанного представляется исторически неоправданным»; историк В. П. Крикунов, опубликовавший записку в 1990 году, пишет: «Первый экземпляр записки затерялся и при решении вопроса «праздновать» или «не праздновать» 200-летний «юбилей» не был принят во внимание (вернее, был принят во внимание, а потому, видимо, и затерялся)»(Citation: 701).
    Историк Виктор Шнирельман пишет: «В эти годы Виноградов стал главным советником обкома КПСС [оккупационной администрации региона] по идеологии и общественным наукам, что фактически сделало его первым цензором научной и издательской деятельности в республике»; «Травле подверглись такие чеченские и ингушские историки, как М.Н.
    Музаев, А.З.
    Вацуев, Я.З.
    Ахмадов, X. Акиев, Я.С.
    Вагапов, X.С.
    Ахмадов и др.»; книгу лингвиста Кюри Чокаева «Язык и история вайнахов» 1977 года «в обкоме… признали образцом «махрового национализма», и весь тираж был тут же уничтожен»(Citation: 663).
    Историки Д. Б. Абдурахманов и Я. З. Ахмадов пишут также, что за несогласие с «концепцией» «официально шельмовались [публично позорились] … доцент Чечено-Ингушского госуниверситета Ф.П.
    Боков, профессора Н.П.
    Гриценко, В.П.
    Крикунов»(Citation: 631).
    Шнирельман пишет, что глава оккупационной администрации региона Власов воспроизвёл концепцию «в своем выступлении на III пленуме Чечено-Ингушского обкома КПСС 14 июля 1979 г.» и «дал указание широко пропагандировать ее в местных СМИ», а в 1982 году юбилей «добровольного вхождения» совместили с 60-летием республики: «По этому случаю республика была награждена орденом Трудового Красного Знамени; награды получили и ее руководители.
    В частности, Власову был вручен орден Ленина»(Citation: 663). 29 июня 1984 года оккупационная администрация региона записала в протокол о работе института истории, социологии и филологии: «Вагапов Я.С., Ахмадов Я.З., Вацуев А.З. допускают политически вредные суждения, оспаривают научность концепции добровольного вхождения чеченцев и ингушей в состав России»(Citation: 631).
    Историки Д. Б. Абдурахманов и Я. З. Ахмадов пишут, что только в 1990 году «тот же орган КПСС отменил свое решение по поводу института и его сотрудников как ошибочное»(Citation: 631).
  en: |-
    From 1973 the coloniser justified the deportation and did not let the Chechens speak of it or of the military seizure of the region, and from 1979 it imposed a "concept" of "the 200th anniversary of the voluntary entry of Chechen-Ingushetia into Russia" and persecuted the historians who disputed it.
    At a meeting of the region's occupation administration on 27 March 1973 one of its leaders, Bokov, justified the eviction of 1944: "All this, in our view, forced the government to take this extreme measure in order to put an end to the anti-Soviet actions of the political bandit groups [the authorities' name for armed opponents], which found shelter among a significant part of the Chechen-Ingush population", and the minutes of the same meeting named the bearers of "nationalist" ideas one by one: "the writer Khalid Oshaev, expelled from the party, the former deputy director of a plant Kostoev B., the university lecturer and candidate of sciences Vagapov Ya."(Citation: 638).
    Historian A. B. Kuznetsova writes that at the discussion of the two-volume "Essays on the History of the Chechen-Ingush ASSR" in 1973 the speakers criticised the "belittling" of the role of the Russian people and the works of the historian V. I. Filkin, "while not a word was said at the discussion about the deportation"(Citation: 265).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that the region's occupation administration launched a persecution of the Chechen intelligentsia "under the guise of a discussion around the 'concept' of the 200th anniversary of the voluntary entry of Chechen-Ingushetia into Russia", whose author was considered to be the archaeologist Vinogradov, and he "relied even on the authority of the CC of the CPSU [the central authority in Moscow]"(Citation: 125).
    In February 1979 L. I. Lavrov, a historian of the Academy of Sciences, wrote on instructions from his superiors a review of the "Justification Memorandum" for the jubilee: the oaths of the 18th century "did not lead to the actual entry of the region into the Russian Empire, since even after the oaths no officials of the tsarist administration appeared there", and "the planned celebration of the jubilee, in the light of the above, appears historically unjustified"; historian V. P. Krikunov, who published the memorandum in 1990, writes: "The first copy of the memorandum got lost and, when the question of whether or not to celebrate the 200th 'jubilee' was being decided, was not taken into account (or rather, it was taken into account, and that, evidently, is why it got lost)"(Citation: 701).
    Historian Viktor Shnirelman writes: "In those years Vinogradov became the chief adviser of the obkom of the CPSU [the region's occupation administration] on ideology and social sciences, which in effect made him the first censor of scholarly and publishing activity in the republic"; "Such Chechen and Ingush historians as M. N. Muzaev, A. Z. Vatsuev, Ya.
    Z. Akhmadov, Kh.
    Akiev, Ya.
    S. Vagapov, Kh.
    S. Akhmadov and others were subjected to persecution"; the 1977 book by the linguist Kyuri Chokaev, "The Language and History of the Vainakhs", "was declared in the obkom… a model of 'rabid nationalism', and the entire print run was destroyed on the spot"(Citation: 663).
    Historians D. B. Abdurakhmanov and Ya.
    Z. Akhmadov also write that for disagreeing with the "concept" "there were officially pilloried [publicly disgraced] … the Chechen-Ingush State University lecturer F. P. Bokov, professors N. P. Gritsenko and V. P. Krikunov"(Citation: 631).
    Shnirelman writes that Vlasov, head of the region's occupation administration, reproduced the concept "in his speech at the III plenum of the Chechen-Ingush obkom of the CPSU on 14 July 1979" and "gave instructions to propagate it widely in the local media", and in 1982 the jubilee of the "voluntary entry" was combined with the 60th anniversary of the republic: "On this occasion the republic was awarded the Order of the Red Banner of Labour; its leaders received awards too.
    In particular, Vlasov was presented with the Order of Lenin"(Citation: 663).
    On 29 June 1984 the region's occupation administration recorded in its minutes on the work of the Institute of History, Sociology and Philology: "Vagapov Ya.
    S., Akhmadov Ya.
    Z., Vatsuev A. Z. permit themselves politically harmful judgements, dispute the scholarly validity of the concept of the voluntary entry of the Chechens and the Ingush into Russia"(Citation: 631).
    Historians D. B. Abdurakhmanov and Ya.
    Z. Akhmadov write that only in 1990 did "the same organ of the CPSU revoke its decision concerning the institute and its staff as mistaken"(Citation: 631).
  uk: |-
    З 1973 року колонізатор виправдовував депортацію і не давав чеченцям говорити про неї та про військове захоплення регіону, а з 1979 року нав'язав «концепцію» про «200-річчя добровільного входження Чечено-Інгушетії до складу Росії» і переслідував істориків, які її заперечували.
    На зібранні окупаційної адміністрації регіону 27 березня 1973 року один із її керівників Боков виправдовував виселення 1944 року: «Усе це, на наш погляд, і змусило уряд піти на цей крайній захід, щоб покінчити з антирадянськими діями політбанд [так влада називала озброєних противників], які переховувалися серед значної частини чечено-інгуського населення», а до протоколу того самого зібрання носіїв «націоналістичних» ідей записали поіменно: «виключений з партії письменник Халід Ошаєв, колишній заступник директора заводу Костоєв Б., викладач держуніверситету кандидат наук Вагапов Я.»(Citation: 638).
    Історик А. Б. Кузнецова пише, що на обговоренні двотомника «Нариси історії Чечено-Інгуської АРСР» у 1973 році критикували «применшення» ролі російського народу та праці історика В. І. Фількіна, «при цьому на обговоренні не було сказано жодного слова про депортацію»(Citation: 265).
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть, що окупаційна адміністрація регіону повела цькування чеченської інтелігенції «під виглядом дискусії навколо «концепції» про 200-річчя добровільного входження Чечено-Інгушетії до складу Росії», автором якої вважався археолог Виноградов, а він «спирався навіть на авторитет ЦК КПРС [центральної влади в Москві]»(Citation: 125).
    У лютому 1979 року історик Академії наук Л. І. Лавров за дорученням начальства написав відгук на «Довідку-обґрунтування» ювілею: присяги XVIII століття «не приводили до фактичного входження краю до складу Російської імперії, оскільки в ньому й після присяг не з'являлися чиновники царської адміністрації», а «намічене святкування ювілею у світлі сказаного видається історично невиправданим»; історик В. П. Крикунов, який опублікував записку в 1990 році, пише: «Перший примірник записки загубився і при вирішенні питання «святкувати» чи «не святкувати» 200-річний «ювілей» не був узятий до уваги (точніше, був узятий до уваги, а тому, мабуть, і загубився)»(Citation: 701).
    Історик Віктор Шнірельман пише: «У ці роки Виноградов став головним радником обкому КПРС [окупаційної адміністрації регіону] з ідеології та суспільних наук, що фактично зробило його першим цензором наукової та видавничої діяльності в республіці»; «Цькування зазнали такі чеченські та інгуські історики, як М. Н. Музаєв, А. З. Вацуєв, Я. З. Ахмадов, Х. Акієв, Я. С. Вагапов, Х. С. Ахмадов та ін.»; книжку лінгвіста Кюрі Чокаєва «Мова та історія вайнахів» 1977 року «в обкомі… визнали зразком «махрового націоналізму», і весь наклад було тут же знищено»(Citation: 663).
    Історики Д. Б. Абдурахманов та Я. З. Ахмадов пишуть також, що за незгоду з «концепцією» «офіційно шельмувалися [публічно ганьбилися] … доцент Чечено-Інгуського держуніверситету Ф. П. Боков, професори М. П. Гриценко, В. П. Крикунов»(Citation: 631).
    Шнірельман пише, що глава окупаційної адміністрації регіону Власов відтворив концепцію «у своєму виступі на III пленумі Чечено-Інгуського обкому КПРС 14 липня 1979 р.» і «дав вказівку широко пропагувати її в місцевих ЗМІ», а в 1982 році ювілей «добровільного входження» поєднали з 60-річчям республіки: «З цієї нагоди республіку було нагороджено орденом Трудового Червоного Прапора; нагороди отримали і її керівники.
    Зокрема, Власову було вручено орден Леніна»(Citation: 663). 29 червня 1984 року окупаційна адміністрація регіону записала до протоколу про роботу інституту історії, соціології та філології: «Вагапов Я. С., Ахмадов Я. З., Вацуєв А. З. припускаються політично шкідливих суджень, заперечують науковість концепції добровільного входження чеченців та інгушів до складу Росії»(Citation: 631).
    Історики Д. Б. Абдурахманов та Я. З. Ахмадов пишуть, що лише в 1990 році «той самий орган КПРС скасував своє рішення щодо інституту та його співробітників як помилкове»(Citation: 631).
