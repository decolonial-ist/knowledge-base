description:
  ru: |-
    В 1972-1981 годах чеченцы и ингуши дважды писали в Москву о дискриминации и протестовали на площади; каждый раз колонизатор исключал из единственной разрешённой партии и судил протестующих, а не оккупационное руководство региона.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что в марте 1972 года 26 чеченских и ингушских коммунистов «написали коллективное письмо в адрес ЦК КПСС [центральной власти в Москве], в котором прямо обвинили партийное руководство Чечено-Ингушетии не только в шовинизме, но и коррупции.
    Результат обращения, однако, был не тот, на который рассчитывали авторы коллективного письма: наказание понесли не руководители республики, а они сами»; из партии исключили С. Бокаева, С. Плиева, Н. Умархаджаева, Б. Костоева, Б. Льянова(Citation: 125). 16 января 1973 года ингуши собрались на центральной площади Грозного, перед зданием оккупационной администрации региона, и к ним присоединились чеченцы; участник митинга Салман Маматиев вспоминает: «на второй день на площади чеченцев было почти столько же, сколько ингушей»(Citation: 638).
    Очевидица событий Аза Базоркина вспоминает: «С самодельной трибуны на площади Ленина 16, 17 и 18 января день и ночь льется обида обездоленных обманутых людей», а в ночь на 19 января милиция и внутренние войска (предшественники современной Росгвардии) разогнали площадь: «Сомневающуюся молодежь, не желавшую расходиться без достоверных сведений, избивая резиновыми дубинками и поливая из брандспойтов ледяной водой, загнали в автобусы, вывезли за город, где выпустили, мокрых, в двадцатиградусный мороз в чистом поле»(Citation: 553). 13 марта 1973 года Москва приняла постановление «Об антиобщественных националистических проявлениях в г. Грозном»; 27 марта оккупационная администрация региона постановила принять его «к неуклонному руководству и исполнению» и записала: «За националистические действия и активное участие в антиобщественных проявлениях исключены из партии Плиев С. X., Газдиев А. М., а также Куштов А. С. – врач 2-ой горбольницы, Абадиев Б. – директор театра кукол, Ужахова – преподаватель школы-интерната № 15, Эгиев – бывший председатель постройкома СМУ-7 [профсоюзного комитета строительного управления], Даурбеков – бывший зав. отделом Назрановской районной газеты»(Citation: 638).
    Историк А. Б. Кузнецова приводит итог: «Из КПСС было исключено 23 человека, из ВЛКСМ [комсомола, молодёжной организации советской власти] – 18, освобождены от руководящей работы 9 человек и привлечены к уголовной ответственности – 14 человек»(Citation: 265). 27 декабря 1973 года председатель КГБ (предшественника современной ФСБ) Андропов докладывал в Москву: «После известных событий, происходивших в г. Грозном в январе 1973 года, в которых принимали активное участие около 400 ингушей из Пригородного района Северо-Осетинской АССР, в результате принятых органами госбезопасности мер новые попытки осуществить общественно опасные действия, особенно в феврале 1973 года в годовщину выселения ингушей, а также накануне праздников 1 и 9 мая, были предотвращены»(Citation: 639).
    В июне 1981 года 23 коммуниста написали Брежневу о коррупции главы оккупационной администрации региона Власова; историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «ЦК КПСС и на этот раз поддержал республиканское руководство, обвинив авторов письма в национализме (хотя среди подписавших его были люди разных национальностей, в том числе русские и украинцы).
    Два человека были исключены из партии»(Citation: 125).
  en: |-
    In 1972-1981 the Chechens and the Ingush twice wrote to Moscow about discrimination and protested on the square; each time the coloniser expelled from the only permitted party and put on trial the protesters, not the region's occupation leadership.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that in March 1972 26 Chechen and Ingush communists "wrote a collective letter addressed to the CC of the CPSU [the central authority in Moscow], in which they directly accused the party leadership of Chechen-Ingushetia not only of chauvinism but also of corruption.
    The result of the appeal, however, was not what the authors of the collective letter had counted on: it was not the leaders of the republic who were punished, but they themselves"; S. Bokaev, S. Pliev, N. Umarkhadzhaev, B. Kostoev and B. Lyanov were expelled from the party(Citation: 125).
    On 16 January 1973 the Ingush gathered on the central square of Grozny, in front of the building of the region's occupation administration, and Chechens joined them; rally participant Salman Mamatiev recalls: "on the second day there were almost as many Chechens on the square as Ingush"(Citation: 638).
    Eyewitness Aza Bazorkina recalls: "From a makeshift rostrum on Lenin Square, on 16, 17 and 18 January, day and night, the grievance of dispossessed, deceived people pours out", and on the night of 19 January the militia and the internal troops (predecessors of today's Rosgvardiya) cleared the square: "The doubting young people, who did not want to disperse without reliable information, were beaten with rubber truncheons and doused with icy water from fire hoses, herded into buses, driven out of the city and let out there, soaking wet, into a twenty-degree frost in an open field"(Citation: 553).
    On 13 March 1973 Moscow adopted a resolution "On Anti-Social Nationalist Manifestations in the City of Grozny"; on 27 March the region's occupation administration resolved to accept it "for unswerving guidance and execution" and recorded: "For nationalist actions and active participation in anti-social manifestations the following have been expelled from the party: Pliev S. Kh., Gazdiev A. M., as well as Kushtov A. S. - physician at city hospital No. 2, Abadiev B. - director of the puppet theatre, Uzhakhova - teacher at boarding school No. 15, Egiev - former chairman of the construction committee of SMU-7 [trade-union committee of a construction directorate], Daurbekov - former head of department at the Nazran district newspaper"(Citation: 638).
    Historian A. B. Kuznetsova gives the tally: "23 people were expelled from the CPSU, 18 from the VLKSM [the Komsomol, the youth organisation of Soviet power], 9 people were removed from leading positions and 14 people were prosecuted"(Citation: 265).
    On 27 December 1973 KGB chairman Andropov (the KGB being the predecessor of today's FSB) reported to Moscow: "After the well-known events that took place in the city of Grozny in January 1973, in which about 400 Ingush from the Prigorodny district of the North Ossetian ASSR took an active part, as a result of measures taken by the state security organs new attempts to carry out socially dangerous acts, especially in February 1973 on the anniversary of the eviction of the Ingush and also on the eve of the holidays of 1 and 9 May, were prevented"(Citation: 639).
    In June 1981 23 communists wrote to Brezhnev about the corruption of Vlasov, head of the region's occupation administration; historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "The CC of the CPSU this time too backed the republican leadership, accusing the authors of the letter of nationalism (although among its signatories were people of various nationalities, including Russians and Ukrainians).
    Two people were expelled from the party"(Citation: 125).
  uk: |-
    У 1972-1981 роках чеченці та інгуші двічі писали до Москви про дискримінацію і протестували на площі; щоразу колонізатор виключав з єдиної дозволеної партії та судив протестувальників, а не окупаційне керівництво регіону.
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть, що в березні 1972 року 26 чеченських та інгуських комуністів «написали колективного листа на адресу ЦК КПРС [центральної влади в Москві], в якому прямо звинуватили партійне керівництво Чечено-Інгушетії не лише в шовінізмі, а й у корупції.
    Результат звернення, однак, був не той, на який розраховували автори колективного листа: покарання зазнали не керівники республіки, а вони самі»; з партії виключили С. Бокаєва, С. Плієва, Н. Умархаджаєва, Б. Костоєва, Б. Льянова(Citation: 125). 16 січня 1973 року інгуші зібралися на центральній площі Грозного, перед будівлею окупаційної адміністрації регіону, і до них приєдналися чеченці; учасник мітингу Салман Маматієв згадує: «на другий день на площі чеченців було майже стільки ж, скільки інгушів»(Citation: 638).
    Очевидиця подій Аза Базоркіна згадує: «З саморобної трибуни на площі Леніна 16, 17 і 18 січня день і ніч ллється образа знедолених, обдурених людей», а в ніч на 19 січня міліція та внутрішні війська (попередники сучасної Росгвардії) розігнали площу: «Молодь, що сумнівалася й не хотіла розходитися без достовірних відомостей, б'ючи гумовими кийками й поливаючи з брандспойтів крижаною водою, загнали в автобуси, вивезли за місто, де випустили, мокрих, у двадцятиградусний мороз у чистому полі»(Citation: 553). 13 березня 1973 року Москва ухвалила постанову «Про антигромадські націоналістичні прояви в м. Грозному»; 27 березня окупаційна адміністрація регіону постановила прийняти її «до неухильного керівництва й виконання» і записала: «За націоналістичні дії та активну участь в антигромадських проявах виключені з партії Плієв С. Х., Газдієв А. М., а також Куштов А. С. - лікар 2-ї міськлікарні, Абадієв Б. - директор театру ляльок, Ужахова - викладачка школи-інтернату № 15, Егієв - колишній голова побудкому БМУ-7 [профспілкового комітету будівельного управління], Даурбеков - колишній зав. відділу Назранівської районної газети»(Citation: 638).
    Історик А. Б. Кузнецова наводить підсумок: «З КПРС було виключено 23 особи, з ВЛКСМ [комсомолу, молодіжної організації радянської влади] - 18, звільнено з керівної роботи 9 осіб і притягнуто до кримінальної відповідальності - 14 осіб»(Citation: 265). 27 грудня 1973 року голова КДБ (попередника сучасної ФСБ) Андропов доповідав до Москви: «Після відомих подій, що відбувалися в м. Грозному в січні 1973 року, в яких брали активну участь близько 400 інгушів із Приміського району Північно-Осетинської АРСР, у результаті вжитих органами держбезпеки заходів нові спроби здійснити суспільно небезпечні дії, особливо в лютому 1973 року в річницю виселення інгушів, а також напередодні свят 1 і 9 травня, було відвернено»(Citation: 639).
    У червні 1981 року 23 комуністи написали Брежнєву про корупцію глави окупаційної адміністрації регіону Власова; історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть: «ЦК КПРС і цього разу підтримав республіканське керівництво, звинувативши авторів листа в націоналізмі (хоча серед тих, хто його підписав, були люди різних національностей, зокрема росіяни та українці).
    Двох осіб було виключено з партії»(Citation: 125).
