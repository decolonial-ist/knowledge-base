name:
  en: '"Only Pardoned": Alien Rule and the Suppression of Chechen and Ingush National Life (1965-1989)'
  uk: '«Лише помилувані»: чужа влада і придушення національного життя чеченців та інгушів (1965-1989)'
  ru: '«Только помилованы»: чужая власть и подавление национальной жизни чеченцев и ингушей (1965-1989)'
description:
  en: |-
    In 1965-1989 the Chechens and the Ingush, whom the coloniser had merged into a single region (the Chechen-Ingush ASSR), were ruled by Russian officials sent from Moscow.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "in the early 1970s, of the 60 ministries and agencies of the Council of Ministers of the ChIASSR only 17 were headed by Chechens or Ingush.
    In most rural districts the first secretaries of the district committees were Russians"(Citation: 125).
    In 1972 Chechen and Ingush communists wrote to Moscow about this twice.
    From 16 to 19 January 1973 several thousand Ingush (participants speak of 15 thousand), joined by Chechens, rallied on the central square of Grozny in front of the building of the region's occupation administration and demanded the return of the Prigorodny district, handed to North Ossetia during the deportation of 1944, or the lifting of the ban on settling there.
    On the night of 19 January soldiers of the internal troops (predecessors of today's Rosgvardiya) with truncheons and firemen spraying icy water from hoses dispersed those who remained on the square, drove them out of the city and dropped them off in the frost(Citation: 638).
    Then the coloniser went after those who had complained: on 13 March 1973 Moscow adopted a resolution "On Anti-Social Nationalist Manifestations in the City of Grozny", the authors of the letters were expelled from the only permitted party, the organisers of the rally were put on trial(Citation: 638), and in December KGB chairman Andropov (the KGB being the predecessor of today's FSB) reported on "measures" against "about 400 Ingush"(Citation: 639).
    In those same years the coloniser worked to leave the Chechens and the Ingush without a history, a faith, a language or a livelihood of their own.
    The USSR rewrote history, imposing its own concept, "the 200th anniversary of the voluntary entry of Chechen-Ingushetia into Russia", and persecuted the Chechen historians who disputed it through decisions of the region's occupation administration(Citation: 631).
    In a quarter of a century the occupier did not allow the highlanders to open a single mosque(Citation: 643).
    The schools to which Chechen and Ingush children returned worked only in Russian from the first grade: the law of the RSFSR of 16 April 1959 declared that "instruction at school is conducted in the pupils' native language" and left the choice of language to parents, but after the return from exile the coloniser opened no schools with Chechen as the language of instruction, so there was nothing to choose from(Citation: 700).
    The factories and oil enterprises of Grozny hired newcomers rather than Chechens: by the end of the 1980s only 16 % of oil-refining workers were Chechens or Ingush, according to official statistics of 1979 up to 28 % of the able-bodied lived off their household plots, and according to the census of 1989 almost a quarter of the people lived outside the republic(Citation: 125).
    The coloniser said aloud what it thought of the people after the dispersal.
    A. Martazanova, a participant in the events of 1973, recalls: at a meeting of the region's occupation administration on 27 March one of its leaders, Bokov, "said that the Ingush and the Chechens had not yet been rehabilitated, that they had only been pardoned in advance, in the hope of good behaviour", while Rustem Goygov, head of a department in the same administration, who began: "But what about the decisions of the 20th Congress of the CPSU [the congress of 1956 that condemned the deportations of peoples], which…", was not allowed to finish and a month later was removed from his post; the phrase had first been uttered by Solomentsev, head of the government of the RSFSR, who had come to Grozny(Citation: 638).
    Eyewitness Aza Bazorkina recalls that a few days after the dispersal the newspaper Grozny Worker printed, over the signatures of intimidated Ingush, an article "To Serve One's People Honestly", which "says that the Ingush people have not been rehabilitated (as if there had been no 20th Party Congress!) but pardoned"(Citation: 553).
  uk: |-
    У 1965-1989 роках чеченцями та інгушами, яких колонізатор об'єднав в один регіон (Чечено-Інгуську АРСР), правили надіслані з Москви російські керівники.
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть: «на початку 70-х рр. із 60 міністерств і відомств Ради Міністрів ЧІАРСР лише 17 очолювали чеченці та інгуші.
    У більшості сільських районів перші секретарі райкомів були росіянами»(Citation: 125).
    У 1972 році чеченські та інгуські комуністи двічі написали про це до Москви.
    З 16 по 19 січня 1973 року кілька тисяч інгушів (учасники називають 15 тисяч) і чеченці, що приєдналися до них, мітингували на центральній площі Грозного, перед будівлею окупаційної адміністрації регіону, і вимагали повернути Приміський район, відданий Північній Осетії під час депортації 1944 року, або зняти заборону селитися в ньому.
    У ніч на 19 січня солдати внутрішніх військ (попередників сучасної Росгвардії) з кийками та пожежники, що поливали крижаною водою зі шлангів, розігнали тих, хто лишився на площі, вивезли їх за місто й висадили на морозі(Citation: 638).
    Потім колонізатор узявся за тих, хто скаржився: 13 березня 1973 року Москва ухвалила постанову «Про антигромадські націоналістичні прояви в м. Грозному», авторів листів виключили з єдиної дозволеної партії, організаторів мітингу судили(Citation: 638), а голова КДБ (попередника сучасної ФСБ) Андропов у грудні доповів про «заходи» проти «близько 400 інгушів»(Citation: 639).
    У ті самі роки колонізатор працював над тим, щоб у чеченців та інгушів не лишилося своєї історії, віри, мови й заробітку.
    СРСР переписував історію, нав'язуючи свою концепцію: «200-річчя добровільного входження Чечено-Інгушетії до складу Росії», а істориків-чеченців, які з цим сперечалися, переслідував рішеннями окупаційної адміністрації регіону(Citation: 631).
    За чверть століття окупант не дозволив горянам відкрити жодної мечеті(Citation: 643).
    Школи, до яких повернулися чеченські та інгуські діти, працювали лише російською мовою з першого класу: закон РРФСР від 16 квітня 1959 року проголосив, що «навчання в школі проводиться рідною мовою учнів», і віддав вибір мови батькам, але шкіл із чеченською мовою навчання після повернення із заслання колонізатор не відкрив, тож обирати не було з чого(Citation: 700).
    На заводи й нафтові підприємства Грозного брали приїжджих, а не чеченців: до кінця 1980-х лише 16 % працівників нафтопереробки були чеченцями чи інгушами, за офіційною статистикою 1979 року до 28 % працездатних годувалися з присадибного господарства, а за переписом 1989 року майже чверть народу жила за межами республіки(Citation: 125).
    Колонізатор висловив своє ставлення до народу вголос після розгону.
    А. Мартазанова, учасниця подій 1973 року, згадує: на зібранні окупаційної адміністрації регіону 27 березня один із її керівників Боков «сказав, що інгуші та чеченці ще не реабілітовані, що їх лише помилували авансом, сподіваючись на хорошу поведінку», а завідувачу відділу в тій самій адміністрації Рустему Гойгову, який почав: «А як же рішення ХХ з'їзду КПРС [з'їзду 1956 року, що засудив депортації народів], який…», не дали договорити й за місяць зняли з роботи; першим цю фразу вимовив глава уряду РРФСР Соломенцев, що приїхав до Грозного(Citation: 638).
    Очевидиця подій Аза Базоркіна згадує, що за кілька днів після розгону газета «Грозненський робітник» надрукувала за підписами заляканих інгушів статтю «Чесно служити своєму народові», де «йдеться, що інгуський народ не реабілітований (ніби й не було XX з'їзду партії!), а помилуваний»(Citation: 553).
  ru: |-
    В 1965-1989 годах чеченцами и ингушами, которых колонизатор объединил в один регион (Чечено-Ингушскую АССР), правили присланные из Москвы русские руководители.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «в начале 70-х гг. из 60 министерств и ведомств Совета Министров ЧИАССР всего 17 возглавлялись чеченцами и ингушами.
    В большинстве сельских районов первые секретари райкомов были русские»(Citation: 125).
    В 1972 году чеченские и ингушские коммунисты дважды написали об этом в Москву.
    С 16 по 19 января 1973 года несколько тысяч ингушей (участники называют 15 тысяч) и присоединившиеся к ним чеченцы митинговали на центральной площади Грозного, перед зданием оккупационной администрации региона, и требовали вернуть Пригородный район, отданный Северной Осетии при депортации 1944 года, или снять запрет селиться в нём.
    В ночь на 19 января солдаты внутренних войск (предшественников современной Росгвардии) с дубинками и пожарные, поливавшие ледяной водой из шлангов, разогнали оставшихся на площади, вывезли их за город и высадили на морозе(Citation: 638).
    Затем колонизатор взялся за тех, кто жаловался: 13 марта 1973 года Москва приняла постановление «Об антиобщественных националистических проявлениях в г. Грозном», авторов писем исключили из единственной разрешённой партии, организаторов митинга судили(Citation: 638), а председатель КГБ (предшественника современной ФСБ) Андропов в декабре доложил о «мерах» против «около 400 ингушей»(Citation: 639).
    Те же годы колонизатор работал над тем, чтобы у чеченцев и ингушей не осталось своей истории, веры, языка и заработка.
    СССР переписывал историю, навязывая свою концепцию: «200-летие добровольного вхождения Чечено-Ингушетии в состав России», а историков-чеченцев, которые с этим спорили, преследовал решениями оккупационной администрации региона(Citation: 631).
    За четверть века оккупант не разрешил горцам открыть ни одной мечети(Citation: 643).
    Школы, куда вернулись чеченские и ингушские дети, работали только на русском языке с первого класса: закон РСФСР от 16 апреля 1959 года объявил, что «обучение в школе проводится на родном языке учащихся», и отдал выбор языка родителям, но школ с чеченским языком обучения после возвращения из ссылки колонизатор не открыл, так что выбирать было не из чего(Citation: 700).
    На заводы и нефтяные предприятия Грозного брали приезжих, а не чеченцев: к концу 1980-х только 16 % работников нефтепереработки были чеченцами или ингушами, по официальной статистике 1979 года до 28 % трудоспособных кормились с подсобного хозяйства, а по переписи 1989 года почти четверть народа жила за пределами республики(Citation: 125).
    Колонизатор высказал своё отношение к народу вслух после разгона.
    А. Мартазанова, участница событий 1973 года, вспоминает: на собрании оккупационной администрации региона 27 марта один из её руководителей Боков «сказал, что ингуши и чеченцы еще не реабилитированы, что их только помиловали авансом, надеясь на хорошее поведение», а заведующего отделом в той же администрации Рустема Гойгова, который начал: «А как же решения ХХ съезда КПСС [съезда 1956 года, осудившего депортации народов], который…», не дали договорить и через месяц сняли с работы; первым эту фразу произнёс приехавший в Грозный глава правительства РСФСР Соломенцев(Citation: 638).
    Очевидица событий Аза Базоркина вспоминает, что через несколько дней после разгона газета «Грозненский рабочий» напечатала за подписями запуганных ингушей статью «Честно служить своему народу», где «говорится, что ингушский народ не реабилитирован (будто и не было XX съезда партии!), а помилован»(Citation: 553).
