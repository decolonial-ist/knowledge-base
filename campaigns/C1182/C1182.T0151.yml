description:
  ru: |-
    После возвращения чеченцев и ингушей из ссылки СССР не давал коренным жителям занимать ключевые руководящие посты во власти и промышленности, закрепляя их за русскими переселенцами.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Ведущие посты (первого секретаря обкома КПСС [главы оккупационной администрации региона], министра МВД, республиканского прокурора, руководителя КГБ [предшественницы современной ФСБ], министра финансов, секретаря Грозненского горкома КПСС [главы города] и председателя Грозненского горисполкома [главы городской администрации], руководителя «Грознефти», военного комиссара республики и некоторые др.) закрепляются за русскими руководителями»; за чеченцами и ингушами при 70 % населения «резервировалось примерно 30% должностей»(Citation: 125).
    По письму 26 коммунистов 1972 года, которое цитируют историки, «в начале 70-х гг. из 60 министерств и ведомств Совета Министров ЧИАССР [Чечено-Ингушской республики] всего 17 возглавлялись чеченцами и ингушами.
    В большинстве сельских районов первые секретари райкомов [главы районов] были русские»(Citation: 125).
    Историки пишут: «Именно поэтому ЦК КПСС [центральная власть в Москве] постоянно направляет в Чечено-Ингушетию новых первых секретарей обкома [глав региона]» - в 1966-1989 годах это были присланные из других областей Апряткин, Власов и Фотеев(Citation: 125).
    Когда ингуши на митинге в январе 1973 года потребовали брать на руководящие должности местных, руководитель в оккупационной администрации региона Боков ответил на собрании партийных работников 21 января: «Доходили в своих выступлениях до того, что здесь нужно провести мероприятие, чтобы учитывать руководящий состав кадров из числа чеченцев и ингушей, то есть провести коренизацию»(Citation: 638).
    Историк А. Б. Кузнецова пишет со слов свидетеля Б. Х. Ториева: «Чеченцы и ингуши подвергались жестокой дискриминации при приеме в КПСС – их принимали только из числа рабочих, в связи с чем имевшие инженерные должности были вынуждены идти работать на завод рабочими, чтобы иметь возможность вступить в партию»(Citation: 265).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что только к середине 1980-х чеченцы и ингуши возглавили 155 сельских советов из 194 и 11 городских и районных советов из 19, а «за русской номенклатурой оставались наиболее значимые посты среднего и республиканского уровня, а также руководство Грозного и областного комитета КПСС»(Citation: 125).
    Историки пишут, что 1 июля 1989 года оккупационная администрация региона на своём собрании «впервые за всю историю чечено-ингушской партийной организации, отверг предложенную ЦК КПСС кандидатуру (Н. И. Семенова) и избрал первым секретарем Докку Завгаева»(Citation: 125).
  en: |-
    After the return of the Chechens and the Ingush from exile the USSR did not let the indigenous inhabitants hold key leading posts in government and industry, reserving them for Russian settlers.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "The leading posts (first secretary of the obkom of the CPSU [head of the region's occupation administration], minister of the MVD, republican prosecutor, head of the KGB [predecessor of today's FSB], minister of finance, secretary of the Grozny gorkom of the CPSU [head of the city] and chairman of the Grozny gorispolkom [head of the city administration], head of Grozneft, military commissar of the republic and some others) are reserved for Russian officials"; for the Chechens and the Ingush, 70 % of the population, "roughly 30% of posts were reserved"(Citation: 125).
    According to the letter of 26 communists of 1972, which the historians quote, "in the early 1970s, of the 60 ministries and agencies of the Council of Ministers of the ChIASSR [the Chechen-Ingush republic] only 17 were headed by Chechens or Ingush.
    In most rural districts the first secretaries of the raikoms [heads of districts] were Russians"(Citation: 125).
    The historians write: "That is precisely why the CC of the CPSU [the central authority in Moscow] keeps sending new first secretaries of the obkom [heads of the region] to Chechen-Ingushetia" - in 1966-1989 these were Apryatkin, Vlasov and Foteev, sent in from other regions(Citation: 125).
    When the Ingush at the rally of January 1973 demanded that locals be appointed to leading posts, Bokov, a leader in the region's occupation administration, replied at a meeting of party functionaries on 21 January: "In their speeches they went so far as to say that a measure should be carried out here to take account of leading cadres from among the Chechens and the Ingush, that is, to carry out indigenisation"(Citation: 638).
    Historian A. B. Kuznetsova writes, citing the witness B. Kh.
    Toriev: "Chechens and Ingush were subjected to harsh discrimination in admission to the CPSU - they were admitted only from among the workers, so that those who held engineering positions were forced to go and work at a factory as labourers in order to be able to join the party"(Citation: 265).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that only by the mid-1980s did Chechens and Ingush head 155 of the 194 village soviets and 11 of the 19 city and district soviets, while "the most significant posts at the middle and republican level, as well as the leadership of Grozny and of the regional committee of the CPSU, remained with the Russian nomenklatura"(Citation: 125).
    The historians write that on 1 July 1989 the region's occupation administration at its meeting "for the first time in the entire history of the Chechen-Ingush party organisation rejected the candidate proposed by the CC of the CPSU (N. I. Semenov) and elected Doku Zavgaev first secretary"(Citation: 125).
  uk: |-
    Після повернення чеченців та інгушів із заслання СРСР не давав корінним жителям обіймати ключові керівні посади у владі та промисловості, закріплюючи їх за російськими переселенцями.
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть: «Провідні посади (першого секретаря обкому КПРС [глави окупаційної адміністрації регіону], міністра МВС, республіканського прокурора, керівника КДБ [попередниці сучасної ФСБ], міністра фінансів, секретаря Грозненського міськкому КПРС [глави міста] і голови Грозненського міськвиконкому [глави міської адміністрації], керівника «Грознафти», військового комісара республіки та деякі ін.) закріплюються за російськими керівниками»; за чеченцями та інгушами при 70 % населення «резервувалося приблизно 30% посад»(Citation: 125).
    За листом 26 комуністів 1972 року, який цитують історики, «на початку 70-х рр. із 60 міністерств і відомств Ради Міністрів ЧІАРСР [Чечено-Інгуської республіки] лише 17 очолювали чеченці та інгуші.
    У більшості сільських районів перші секретарі райкомів [глави районів] були росіянами»(Citation: 125).
    Історики пишуть: «Саме тому ЦК КПРС [центральна влада в Москві] постійно направляє до Чечено-Інгушетії нових перших секретарів обкому [глав регіону]» - у 1966-1989 роках це були надіслані з інших областей Апряткін, Власов і Фотеєв(Citation: 125).
    Коли інгуші на мітингу в січні 1973 року зажадали брати на керівні посади місцевих, керівник в окупаційній адміністрації регіону Боков відповів на зібранні партійних працівників 21 січня: «Доходили у своїх виступах до того, що тут потрібно провести захід, щоб враховувати керівний склад кадрів із числа чеченців та інгушів, тобто провести коренізацію»(Citation: 638).
    Історик А. Б. Кузнецова пише зі слів свідка Б. Х. Торієва: «Чеченці та інгуші зазнавали жорстокої дискримінації при прийомі до КПРС - їх приймали лише з числа робітників, через що ті, хто обіймав інженерні посади, були змушені йти працювати на завод робітниками, щоб мати змогу вступити до партії»(Citation: 265).
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть, що лише до середини 1980-х чеченці та інгуші очолили 155 сільських рад із 194 та 11 міських і районних рад із 19, а «за російською номенклатурою лишалися найвагоміші посади середнього та республіканського рівня, а також керівництво Грозного й обласного комітету КПРС»(Citation: 125).
    Історики пишуть, що 1 липня 1989 року окупаційна адміністрація регіону на своєму зібранні «вперше за всю історію чечено-інгуської партійної організації відкинула запропоновану ЦК КПРС кандидатуру (М. І. Семенова) й обрала першим секретарем Доку Завгаєва»(Citation: 125).
