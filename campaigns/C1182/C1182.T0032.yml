description:
  en: |-
    In 1965-1989 the coloniser, by law and by administrative decisions, kept the Chechens out of the cities and factories of their own republic.
    The coloniser had restricted the residence registration of Chechens in Grozny as early as 1958; historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "these restrictions in fact ceased to operate only in the 1980s"(Citation: 125).
    Historian A. B. Kuznetsova writes that in the early 1970s "the leadership of the ChIASSR [the Chechen-Ingush republic] (in agreement with the union centre [Moscow]) declared that the labour resources of the republic (read: the unemployed) had to be used locally"(Citation: 265).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "Already in 1979 up to 28% of all able-bodied inhabitants of the Chechen-Ingush ASSR, according to official statistics, derived their main income from work on their personal household plots, that is, were in fact unemployed.
    Ten years later the level of hidden unemployment, by some estimates, had risen to 40%"(Citation: 125).
  uk: |-
    У 1965-1989 роках колонізатор законом і рішеннями адміністрації тримав чеченців поза містами й заводами власної республіки.
    Колонізатор обмежив прописку чеченців у Грозному ще в 1958 році; історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть: «ці обмеження фактично перестали діяти лише у 80-х рр.
    XX ст.»(Citation: 125).
    Історик А. Б. Кузнецова пише, що на початку 1970-х років «керівництво ЧІАРСР [Чечено-Інгуської республіки] (узгоджено з союзним центром [Москвою]) оголосило, що трудові ресурси республіки (читай - безробітних) необхідно використовувати на місці»(Citation: 265).
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть: «Уже в 1979 р. до 28% усіх працездатних жителів Чечено-Інгуської АРСР, за офіційною статистикою, отримували основний дохід від діяльності в особистому підсобному господарстві, тобто фактично були безробітними.
    Через десять років рівень прихованого безробіття, за деякими оцінками, зріс до 40%»(Citation: 125).
  ru: |-
    В 1965-1989 годах колонизатор законом и решениями администрации держал чеченцев вне городов и заводов собственной республики.
    Колонизатор ограничил прописку чеченцев в Грозном ещё в 1958 году; историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «эти ограничения фактически перестали действовать только в 80-х гг.
    XX в.»(Citation: 125).
    Историк А. Б. Кузнецова пишет, что в начале 1970-х годов «руководство ЧИАССР [Чечено-Ингушской республики] (согласованно с союзным центром [Москвой]), объявило, что трудовые ресурсы республики (читай – безработных) – необходимо использовать на месте»(Citation: 265).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Уже в 1979 г. до 28% всех трудоспособных жителей Чечено-Ингушской АССР, согласно официальной статистике, получали основной доход от деятельности в личном подсобном хозяйстве, т. е. фактически являлись безработными.
    Через десять лет уровень скрытой безработицы, по некоторым оценкам, возрос до 40%»(Citation: 125).
