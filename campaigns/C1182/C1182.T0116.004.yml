description:
  ru: |-
    В 1958-1989 годах колонизатор объявлял чеченские святыни закрытыми, судил за печать Корана и вёл учёт верующих. 10 декабря 1958 года московское ведомство по надзору за религией разослало своим чиновникам на местах циркуляр, озаглавленный так: «О мерах по прекращению паломничества к так называемым „святым местам"»; задача в нём: «добиться прекращения паломничества и закрытия так называемых "святых мест"»(Citation: 649).
    В Чечне под этот циркуляр попала могила матери шейха Кунта-Хаджи - основателя самого многочисленного чеченского братства.
    В отчёте того же ведомства за 1973 год сказано: могила «около четырнадцати лет тому назад было объявлено местными органами власти «закрытым».
    Однако, начиная с 1961 г., религиозники самовольно стали восстанавливать его…
    В 1970–1971 гг. это так называемое «святое место»… посещало свыше 10 тыс[яч] чел[овек]…
    В пути следования паломники, зачастую с участием подростков, совершают коллективный религиозный обряд «зикр» [совместную молитву с движением по кругу и пением]»(Citation: 647).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Особо пресекалось проведение обряда «громкого» зикра [молитвы вслух] кадырийского тариката [братства] (орден Кунта-Хаджи)»(Citation: 125). 29 июня 1979 года Октябрьский районный суд Грозного судил Алаудина Богатырева, Салаудина Дубаева и Анатолия Юшкина; в приговоре сказано, что Богатырев «в целях занятия запрещенным промыслом… занимался изготовлением полиграфическим способом в значительных размерах литературы религиозного содержания на арабском языке»: с 1971 по 1978 год они подпольно напечатали 2500 экземпляров Корана, 600 экземпляров его частей и 500 учебников арабского языка, и суд постановил «подвергнуть» Богатырева «к 6 годам лишения свободы с конфискацией имущества с содержанием в исправительно-трудовой колонии строгого режима», а Дубаева и Юшкина к четырём годам(Citation: 642). 5 апреля 1983 года Москва приняла постановление «О мерах по идеологической изоляции реакционной части мусульманского духовенства»; чиновник по надзору за религией в регионе Музаров отчитался 25 августа 1983 года: «организационно прекратили свою деятельность 59 мюридских [религиозных] групп и обществ и нейтрализована деятельность более 100 служителей культа [мулл]…
    Была проведена работа по взятию на учет всех экстремистских элементов и фанатиков, составлена карта мюридских [религиозных] организаций»; «Сократилось количество мюридов [членов братств] – от 20 тыс. до 9 тыс.»(Citation: 643).
    Чеченцы не подчинились: 5 мая 1989 года ведомство по надзору за религией насчитало в республике 311 групп братств, «объединяющих около 8300 человек», из них «братства «Кунта-Хаджи» — 183 группы»(Citation: 648).
  en: |-
    In 1958-1989 the coloniser declared Chechen shrines closed, put people on trial for printing the Quran and kept believers on file.
    On 10 December 1958 the Moscow agency supervising religion sent its officials in the regions a circular headed thus: "On Measures to Stop Pilgrimage to So-Called 'Holy Places'"; its task: "to achieve the cessation of pilgrimage and the closure of so-called 'holy places'"(Citation: 649).
    In Chechnya this circular fell upon the grave of the mother of Sheikh Kunta-Haji, founder of the largest Chechen brotherhood.
    The same agency's report for 1973 says: the grave "was declared 'closed' by the local authorities about fourteen years ago.
    However, from 1961 the religious activists began restoring it without permission…
    In 1970-1971 this so-called 'holy place'… was visited by over 10 thousand people…
    On the way the pilgrims, often with the participation of adolescents, perform the collective religious rite of 'zikr' [a joint prayer with circular movement and chanting]"(Citation: 647).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "The performance of the 'loud' zikr [prayer aloud] of the Qadiri tariqa [brotherhood] (the order of Kunta-Haji) was suppressed with particular severity"(Citation: 125).
    On 29 June 1979 the Oktyabrsky district court of Grozny tried Alaudin Bogatyrev, Salaudin Dubaev and Anatoly Yushkin; the verdict states that Bogatyrev "with the aim of engaging in a prohibited trade… was engaged in the production by printing methods, on a significant scale, of literature of religious content in the Arabic language": from 1971 to 1978 they had clandestinely printed 2,500 copies of the Quran, 600 copies of parts of it and 500 Arabic textbooks, and the court ruled "to subject" Bogatyrev "to 6 years of deprivation of liberty with confiscation of property, to be served in a strict-regime corrective labour colony", and Dubaev and Yushkin to four years each(Citation: 642).
    On 5 April 1983 Moscow adopted a resolution "On Measures for the Ideological Isolation of the Reactionary Part of the Muslim Clergy"; Muzarov, the official supervising religion in the region, reported on 25 August 1983: "59 murid [religious] groups and societies have organisationally ceased their activity and the activity of more than 100 ministers of the cult [mullahs] has been neutralised…
    Work was carried out to put all extremist elements and fanatics on file, a map of murid [religious] organisations was drawn up"; "The number of murids [members of brotherhoods] has fallen - from 20 thousand to 9 thousand"(Citation: 643).
    The Chechens did not submit: on 5 May 1989 the agency supervising religion counted 311 brotherhood groups in the republic, "uniting about 8,300 people", of which "the 'Kunta-Haji' brotherhood - 183 groups"(Citation: 648).
  uk: |-
    У 1958-1989 роках колонізатор оголошував чеченські святині закритими, судив за друк Корану і вів облік вірян. 10 грудня 1958 року московське відомство з нагляду за релігією розіслало своїм чиновникам на місцях циркуляр із такою назвою: «Про заходи з припинення паломництва до так званих „святих місць"»; завдання в ньому: «домогтися припинення паломництва і закриття так званих "святих місць"»(Citation: 649).
    У Чечні під цей циркуляр потрапила могила матері шейха Кунта-Хаджі - засновника найчисленнішого чеченського братства.
    У звіті того самого відомства за 1973 рік сказано: могила «близько чотирнадцяти років тому була оголошена місцевими органами влади «закритою».
    Однак починаючи з 1961 р. релігійники самовільно почали відновлювати її…
    У 1970-1971 рр. це так зване «святе місце»… відвідувало понад 10 тис[яч] осіб…
    Дорогою паломники, часто за участю підлітків, здійснюють колективний релігійний обряд «зікр» [спільну молитву з рухом по колу та співом]»(Citation: 647).
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть: «Особливо припинялося проведення обряду «гучного» зікру [молитви вголос] кадирійського тарикату [братства] (орден Кунта-Хаджі)»(Citation: 125). 29 червня 1979 року Жовтневий районний суд Грозного судив Алаудіна Богатирьова, Салаудіна Дубаєва та Анатолія Юшкіна; у вироку сказано, що Богатирьов «з метою зайняття забороненим промислом… займався виготовленням поліграфічним способом у значних розмірах літератури релігійного змісту арабською мовою»: з 1971 по 1978 рік вони підпільно надрукували 2500 примірників Корану, 600 примірників його частин і 500 підручників арабської мови, і суд постановив «піддати» Богатирьова «6 рокам позбавлення волі з конфіскацією майна з утриманням у виправно-трудовій колонії суворого режиму», а Дубаєва та Юшкіна - чотирьом рокам(Citation: 642). 5 квітня 1983 року Москва ухвалила постанову «Про заходи з ідеологічної ізоляції реакційної частини мусульманського духовенства»; чиновник з нагляду за релігією в регіоні Музаров відзвітував 25 серпня 1983 року: «організаційно припинили свою діяльність 59 мюридських [релігійних] груп і товариств та нейтралізовано діяльність понад 100 служителів культу [мулл]…
    Було проведено роботу з узяття на облік усіх екстремістських елементів і фанатиків, складено карту мюридських [релігійних] організацій»; «Скоротилася кількість мюридів [членів братств] - з 20 тис. до 9 тис.»(Citation: 643).
    Чеченці не скорилися: 5 травня 1989 року відомство з нагляду за релігією нарахувало в республіці 311 груп братств, «що об'єднують близько 8300 осіб», з них «братства «Кунта-Хаджі» - 183 групи»(Citation: 648).
