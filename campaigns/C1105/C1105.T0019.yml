description:
  ru: 'Для возведения базы на землях нохчи администрация ввела вооруженные отряды: историк Е. Н. Кушева пишет, что весной 1567 года из Москвы были посланы воеводы А. С. Бабичев и П. Протасьев «со многими людьми, да и наряд, пушки и пищали»(Citation: 83), а историки А. С. Куликов и В. А. Рунов отмечают, что они были посланы «с огненным боем и многими людьми»(Citation: 65).'
  en: 'To construct the base on the lands of the Nokhchi, the administration brought in armed detachments: historian E. N. Kusheva writes that in the spring of 1567 the voivodes A. S. Babichev and P. Protasyev were dispatched from Moscow "with many men, as well as ordnance, cannons, and arquebuses"(Citation: 83), while historians A. S. Kulikov and V. A. Runov note that they were sent "with firepower and many men"(Citation: 65).'
  uk: 'Для зведення бази на землях Нохчі адміністрація ввела збройні загони: історик Е. Н. Кушева пише, що навесні 1567 року з Москви були послані воєводи А. С. Бабичев і П. Протасьєв «з багатьма людьми, та й наряд, гармати й пищалі»(Citation: 83), а історики А. С. Куликов і В. А. Рунов зазначають, що вони були послані «з вогняним боєм і багатьма людьми»(Citation: 65).'
