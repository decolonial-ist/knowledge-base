description:
  en: 'The military forces of the Tsardom of Muscovy built a fortified outpost on the lands of the Nokhchi: historian E. N. Kusheva states that in 1567 "the Russian town... was built in that same year"(Citation: 83).'
  uk: 'Військові сили Московського царства звели укріплений пункт на землях Нохчі: історик Е. Н. Кушева констатує, що в 1567 році «руське місто... було того ж року поставлене»(Citation: 83).'
