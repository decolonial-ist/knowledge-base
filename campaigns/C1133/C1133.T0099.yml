description:
  en: |-
    The occupation administration of the Russian Empire institutionalized a system of holding relatives of the local elite: historian Ya.
    Z. Akhmadov records that «In 1735, two amanats from the Chechen domain were already being held in Kizlyar: from Aidemir - Bardykhan, and from the Chechen lord Alisultan Kazbulatov - Bamat»(Citation: 94).
  uk: 'Окупаційна адміністрація Російської імперії інституціоналізувала систему утримання родичів місцевої еліти: історик Я. З. Ахмадов фіксує, що «У 1735 р. в Кізлярі вже утримувалося два аманати з Чеченського володіння: від Айдеміра - Бардихан, і від чеченського володаря Алісултана Казбулатова - Бамат»(Citation: 94).'
  ru: 'Оккупационная администрация Российской империи институционализировала систему удержания родственников местной элиты: историк Я. З. Ахмадов фиксирует, что «В 1735 г. в Кизляре уже содержалось два аманата из Чеченского владения: от Айдемира - Бардыхан, и от чеченского владельца Алисултана Казбулатова - Бамат»(Citation: 94).'
