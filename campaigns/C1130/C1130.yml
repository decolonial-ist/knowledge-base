name:
  en: Construction of the Holy Cross Fortress and Forced Resettlement (1722–1724)
  uk: Зведення фортеці Святого Хреста та примусове переселення (1722–1724)
  ru: Возведение крепости Святого Креста и принудительное переселение (1722–1724)
description:
  en: |-
    In 1722–1724, the Russian Empire carried out military-infrastructural colonization and demographic manipulation on the seized frontiers.
    In the autumn of 1722, construction of a new military base began: historian Ya.
    Z. Akhmadov states that Peter I «founded the fortress of the Holy Cross on the Sulak»(Citation: 94).
    To ensure forcible control over the territory, the metropole carried out settlement by loyal troops: the researcher indicates that at the fortress «1 thousand families of Cossacks from the Don are being settled»(Citation: 94).
    At the same time, the occupation administration liquidated the former administrative center and forcibly relocated the subordinated Nokhchi societies: the author records that «the Terek town had been razed by 1724, and its entire population, including the Okotskaya sloboda, populated by natives of Chechnya... was transferred to the new fortress»(Citation: 94).
    A controlled buffer zone was taking shape around the new fortification: historian Sh.
    B. Akhmadov notes that «next to the fortress of the Holy Cross, slobodkas populated by Circassians, Chechens, Ingush, Kabardians, and others very quickly began to appear»(Citation: 66).
  uk: |-
    У 1722–1724 роках Російська імперія здійснювала військово-інфраструктурну колонізацію та демографічні маніпуляції на захоплених рубежах.
    Восени 1722 року розпочалося будівництво нової військової бази: історик Я. З. Ахмадов констатує, що Петро I «заклав на Сулаку фортецю Святий Хрест»(Citation: 94).
    Для забезпечення силового контролю над територією метрополія здійснювала заселення лояльними військами: дослідник вказує, що при фортеці «розселяють 1 тис. сімей Козаків з Дону»(Citation: 94).
    Водночас окупаційна адміністрація ліквідувала колишній адміністративний центр і насильно перемістила підпорядковані суспільства Нохчі: автор фіксує, що «Терське місто до 1724 р. було зрите, а все його населення, включно з Окоцькою слободою, заселеною вихідцями з Чечні... було переведено до нової фортеці»(Citation: 94).
    Навколо нового укріплення формувалася контрольована буферна зона: історик Ш. Б. Ахмадов зазначає, що «поруч із фортецею Святого Хреста дуже швидко стали виникати слобідки, населені Черкесами, Чеченцями, Інгушами, Кабардинцями та ін.»(Citation: 66).
  ru: |-
    В 1722–1724 годах Российская империя осуществляла военно-инфраструктурную колонизацию и демографические манипуляции на захваченных рубежах.
    Осенью 1722 года началось строительство новой военной базы: историк Я. З. Ахмадов констатирует, что Петр I «заложил на Сулаке крепость Святой Крест»(Citation: 94).
    Для обеспечения силового контроля над территорией метрополия осуществляла заселение лояльными войсками: исследователь указывает, что при крепости «расселяют 1 тыс. семей казаков с Дона»(Citation: 94).
    Одновременно оккупационная администрация ликвидировала прежний административный центр и насильственно переместила подчиненные общества нохчи: автор фиксирует, что «Терский город к 1724 г. был срыт, а все его население, включая Окоцкую слободу, населенную выходцами из Чечни... было переведено в новую крепость»(Citation: 94).
    Вокруг нового укрепления формировалась контролируемая буферная зона: историк Ш. Б. Ахмадов отмечает, что «рядом с крепостью Святого Креста очень быстро стали возникать слободки, населенные черкесами, чеченцами, ингушами, кабардинцами и др.»(Citation: 66).
