description:
  en: 'The occupation administration dispatched emissaries to collect strategic, demographic, and economic data on the mountain societies of the Nokhchi: in 1658 the central apparatus of the Posolsky Prikaz instructed the Terek voivodes to find out «how many of them there are and what kind of people they are... and what fighting force they have... and what grows in their land, and what craftsmen there are»(Citation: 82), in execution of which in 1659 the Terek voivodes Melenty Kvashnin and his associates «sent a streltsy commander into the Shibut land and ordered him to inspect in the Shibut land... the towns and places»(Citation: 82), who, in an extract for the report of the Posolsky Prikaz to Tsar Alexei Mikhailovich of 1660, reported that «[to]wns they have none, nor any fighting forces»(Citation: 82).'
  uk: 'Окупаційна адміністрація направляла емісарів для збору стратегічних, демографічних та економічних даних про гірські суспільства Нохчі: у 1658 році центральний апарат Посольського приказу приписав терським воєводам з''ясувати «чи багато їх і які то люди... і який у них бій... і що в їхній землі родить, і які є ремісничі люди»(Citation: 82), на виконання чого в 1659 році терські воєводи Мелентій Квашнін з товаришами «в Шибутську землю послали стрілецького голову і звеліли йому в Шибутській землі оглянути... міста і місця»(Citation: 82), який у виписці до доповіді Посольського приказу цареві Олексію Михайловичу 1660 року доповів, що «[мі]ст у них і боїв ніяких немає»(Citation: 82).'
  ru: 'Оккупационная администрация направляла эмиссаров для сбора стратегических, демографических и экономических данных о горных обществах нохчи: в 1658 году центральный аппарат Посольского приказа предписал терским воеводам выяснить «много ли их и каковы люди... и какой у них бой... и что в их земле родитца, и какие есть ремесленые люди»(Citation: 82), во исполнение чего в 1659 году терские воеводы Мелентий Квашнин с товарищами «в Шибутцкую землю послали голову стрелецкого и велели ему в Шибуцкой земле досмотрить... городов, и мест»(Citation: 82), который в выписке в доклад Посольского приказа царю Алексею Михайловичу 1660 года доложил, что «го]родов у них и боев никаких нет»(Citation: 82).'
