name:
  en: Comprehensive Reconnaissance of Territories and an Attempt to Coerce into Subjecthood (1658–1660)
  uk: Комплексна розвідка територій і спроба примусу до підданства (1658–1660)
  ru: Комплексная разведка территорий и попытка принуждения к подданству (1658–1660)
description:
  en: |-
    The occupation administration of the Tsardom of Muscovy gathered military-strategic and economic intelligence on the mountain societies of the Nokhchi (the Shibutians) and made attempts at their forcible subjugation.
    In 1658, the central apparatus of the Ambassadorial Prikaz instructed the Terek voivodes to send a mission into the mountains, in order «concerning those little lands... to order that they be examined and truly scouted out — how many of them there are and what kind of people they are... and what fighting capability they have... and what grows in their land, and what craftsmen there are»(Citation: 82).
    The document of the central authority also directly stated «to order that amanats be taken from among their kin, men of note»(Citation: 82).
    To carry out the order, in 1659 the Terek voivodes Melenty Kvashnin and his associates dispatched a military emissary: an extract for the report of the Ambassadorial Prikaz to Tsar Aleksei Mikhailovich of 1660 states that the voivodes «sent a streltsy head into the Shibut land and ordered him to inspect in the Shibut land the Christian faith, and church building, and towns, and places, and to bring them to the faith, and to take an amanat to the Terek»(Citation: 82).
    The emissary carried out the reconnaissance, reporting that «they have no church building, nor to]wns, nor any fighting forces»(Citation: 82), but he was unable to subjugate the population: «he did not brin[g] the inhabitants of the Shibut land to the faith»(Citation: 82).
    The seizure of new hostages likewise ended without result; the emissary merely stated that the mountaineers «wish [to be] under the lofty sovereign hand, and on the Terek they [have an amanat]»(Citation: 82).
  uk: |-
    Окупаційна адміністрація Московського царства здійснювала збір військово-стратегічної та економічної інформації про гірські суспільства Нохчі (Шибутян) і робила спроби їх примусового підпорядкування.
    У 1658 році центральний апарат Посольського приказу приписав терським воєводам направити місію в гори, щоб «про ті землиці... звеліти роздивитися й розвідати достеменно — чи багато їх і які то люди... і який у них бій... і що в їхній землі родить, і які є ремісні люди»(Citation: 82).
    У документі центральної влади також прямо вказувалося «звеліти взяти в них в аманати родичів — знатних людей»(Citation: 82).
    Для виконання наказу в 1659 році терські воєводи Мелентій Квашнін з товаришами послали військового емісара: у виписці в доповідь Посольського приказу цареві Олексію Михайловичу 1660 року констатується, що воєводи «в Шибутську землю послали голову стрілецького і звеліли йому в Шибутській землі додивитися християнської віри, і церковної будови, і городів, і місць, і до віри їх привести, і аманата на Терек узяти»(Citation: 82).
    Емісар провів розвідку, доповівши, що «церковної будови і го]родів у них і боїв ніяких немає»(Citation: 82), однак підкорити населення не зміг: «жителів Шибутської землі до віри не при[ві]в»(Citation: 82).
    Захоплення нових заручників також завершилося безрезультатно, емісар лише констатував, що горці «під государевою високою рукою [бути] хочуть, і на Терку в них [аманат є]»(Citation: 82).
  ru: |-
    Оккупационная администрация Московского Царства осуществляла сбор военно-стратегической и экономической информации о горных обществах нохчи (шибутянах) и предпринимала попытки их принудительного подчинения.
    В 1658 году центральный аппарат Посольского приказа предписал терским воеводам направить миссию в горы, чтобы «про те землицы... велеть розсмотреть и розведать подлинно - много ли их и каковы люди... и какой у них бой... и что в их земле родитца, и какие есть ремесленые люди»(Citation: 82).
    В документе центральной власти также прямо указывалось «велеть у них взять аманатов родственных нарочитых людей»(Citation: 82).
    Для исполнения приказа в 1659 году терские воеводы Мелентий Квашнин с товарищами послали военного эмиссара: в выписке в доклад Посольского приказа царю Алексею Михайловичу 1660 года констатируется, что воеводы «в Шибутцкую землю послали голову стрелецкого и велели ему в Шибуцкой земле досмотрить христианские веры, и церковного строенья, и городов, и мест, и к вере их привесть, и аманата на Терек взять»(Citation: 82).
    Эмиссар провел разведку, доложив, что «церковного строения и го]родов у них и боев никаких нет»(Citation: 82), однако подчинить население не смог: «Шибуцкие земли жителей к вере не при[ве]л»(Citation: 82).
    Захват новых заложников также завершился безрезультатно, эмиссар лишь констатировал, что горцы «под государскою высокою рукою [быти] хотят, и на Терке у них [аманат есть]»(Citation: 82).
