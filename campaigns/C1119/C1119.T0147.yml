description:
  en: 'The occupation administration made attempts to force the independent societies of the Nokhchi (the Shibutians) into legal subordination: an extract for the report of the Posolsky Prikaz to Tsar Alexei Mikhailovich of 1660 states that the Terek voivodes Melenty Kvashnin and his associates sent a military emissary to the Highlanders and ordered him «to bring them to the oath»(Citation: 82); however, the attempt proved unsuccessful, and he «did not br[in]g the inhabitants of the Shibut land to the oath»(Citation: 82).'
  uk: 'Окупаційна адміністрація робила спроби примусити незалежні суспільства Нохчі (Шибутян) до юридичного підпорядкування: у виписці до доповіді Посольського приказу цареві Олексію Михайловичу 1660 року констатовано, що терські воєводи Мелентій Квашнін з товаришами послали до Горців військового емісара і звеліли йому «до віри їх привести»(Citation: 82), однак спроба виявилася безуспішною, і він «жителів Шибутської землі до віри не при[ві]в»(Citation: 82).'
  ru: 'Оккупационная администрация предпринимала попытки принудить независимые общества нохчи (шибутян) к юридическому подчинению: в выписке в доклад Посольского приказа царю Алексею Михайловичу 1660 года констатируется, что терские воеводы Мелентий Квашнин с товарищами послали военного эмиссара к горцам и велели ему их «к вере их привесть»(Citation: 82), однако попытка оказалась безуспешной, и он «Шибуцкие земли жителей к вере не при[ве]л»(Citation: 82).'
