description:
  ru: |-
    СССР в сентябре 1941 года создал в составе местных органов НКВД (предшественника современной ФСБ), в том числе в Чечне, особые отделы по борьбе с бандитизмом, а в Шатойском, Галанчожском и Итум-Калинском районах - постоянные оперативные группы, чью задачу историки Я. З. Ахмадов и Э. Х. Хасмагомадов передают словами «быстро пресекать любые проявления бандитизма»(Citation: 125).
    Первой стала войсковая операция 30 октября - 15 ноября 1941 года по районам объявленного «восстания»: по докладу 141-го полка внутренних войск НКВД (предшественников современной Росгвардии), убиты 36 человек, записанных «бандитами», задержан 251 - «повстанцев — 127, бандитов — 7, бандповстанцев — 13, дезертиров — 104»(Citation: 533). 5 декабря 1941 года в селе Гихи Урус-Мартановского района полк двухчасовым боем уничтожил группу из десяти человек, которую доклад называет «кадровой бандой» Кайдова Азака: трое убиты, семеро задержаны(Citation: 533).
    В том же декабре для поддержки оперативных групп СССР сформировал в Чечне 178-й мотострелковый батальон, развёрнутый в следующем году в 141-й полк войск НКВД (в докладе командира полк назван стрелковым, у историков - горнострелковым)(Citation: 125).
    Счёт полка за 1941 год, с 25 октября по 1 января 1942 года: убито 59 человек, задержано 390(Citation: 533).
  en: |-
    In September 1941 the USSR created special departments for the struggle against "banditry" within the local NKVD organs (a predecessor of today's FSB), including in Chechnya, and permanent operational groups in the Shatoy, Galanchozh and Itum-Kale districts, whose task the historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov render in the words "to quickly suppress any manifestations of banditry"(Citation: 125).
    The first came the military operation of 30 October - 15 November 1941 across the districts of the declared "uprising": according to the report of the 141st Regiment of the NKVD Internal Troops (predecessors of today's Rosgvardia), 36 people recorded as "bandits" were killed and 251 detained - "insurgents — 127, bandits — 7, bandit-insurgents — 13, deserters — 104"(Citation: 533).
    On 5 December 1941, in the village of Gikhi in the Urus-Martan district, the regiment in a two-hour battle destroyed a group of ten people that the report calls the "cadre band" of Kaidov Azak: three were killed, seven detained(Citation: 533).
    In the same December, to support the operational groups, the USSR formed the 178th Motorized Rifle Battalion in Chechnya, expanded the following year into the 141st Regiment of NKVD troops (in the commander's report the regiment is called a rifle regiment, by the historians - a mountain-rifle one)(Citation: 125).
    The regiment's count for 1941, from 25 October to 1 January 1942: 59 people killed, 390 detained(Citation: 533).
  uk: |-
    СРСР у вересні 1941 року створив у складі місцевих органів НКВД (попередника сучасної ФСБ), зокрема в Чечні, особливі відділи боротьби з бандитизмом, а в Шатойському, Галанчозькому та Ітум-Калінському районах - постійні оперативні групи, чиє завдання історики Я. З. Ахмадов і Е. Х. Хасмагомадов передають словами «швидко припиняти будь-які прояви бандитизму»(Citation: 125).
    Першою стала військова операція 30 жовтня - 15 листопада 1941 року районами оголошеного «повстання»: за доповіддю 141-го полку внутрішніх військ НКВД (попередників сучасної Росгвардії), убито 36 людей, записаних «бандитами», затримано 251 - «повстанців — 127, бандитів — 7, бандповстанців — 13, дезертирів — 104»(Citation: 533). 5 грудня 1941 року в селі Гіхи Урус-Мартанівського району полк двогодинним боєм знищив групу з десяти людей, яку доповідь називає «кадровою бандою» Кайдова Азака: троє вбиті, семеро затримані(Citation: 533).
    Того ж грудня для підтримки оперативних груп СРСР сформував у Чечні 178-й мотострілецький батальйон, розгорнутий наступного року у 141-й полк військ НКВД (у доповіді командира полк названо стрілецьким, в істориків - гірськострілецьким)(Citation: 125).
    Рахунок полку за 1941 рік, з 25 жовтня по 1 січня 1942 року: убито 59 людей, затримано 390(Citation: 533).
