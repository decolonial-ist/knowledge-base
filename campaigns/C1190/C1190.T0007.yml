description:
  en: |-
    The USSR declared the economic protest of the Chechens an "uprising" organized by "fascist agents".
    The party organs of the Soviet colonial administration of Checheno-Ingushetia, "at the prompting of the NKVD-NKGB", gave the protest of late October 1941 a name the historians render as: "an open anti-Soviet 'kulak-bandit uprising'"; the events themselves, as the historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write, bore "features of social protest"(Citation: 125).
    This version became fixed in the documents: in the report of the commander of the 141st Regiment of the NKVD Internal Troops (predecessors of today's Rosgvardia), Lieutenant Colonel Khalukhaev, dated 26 June 1943, October 1941 is described thus: "an armed counter-revolutionary uprising was raised by German-fascist agents"(Citation: 533).
    The count kept by the secret services contradicted the picture they were imposing: over the whole of 1941 the NKVD organs eliminated 12 "bands" with a total strength of up to 100 men, recording four "bandit incidents" in which nine people died(Citation: 125).
    There is no uprising behind these figures: all the "bands" the NKVD counted and eliminated over the year held up to a hundred men for the whole of Chechnya, and nine people died in the clashes.
    The desertion the colonizer imputed to the Chechen people was the desertion of recruits, not of frontline soldiers - the certificate of Dementyev, head of the Grozny Region directorate of the Ministry of Internal Affairs, dated 1956, states: during the first mobilization "450 men deserted en route to the dispatch point, 269 men evaded the call-up"(Citation: 533), and the historians confirm: the detained deserters were "by no means from the front, but from units being formed in Grozny or passing through it"(Citation: 125).
    On frontline desertion Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "over the first six months of the war, 38 known cases of desertion from the front line"; at the same time, they write, in Checheno-Ingushetia "they began to count as 'deserters' also those who fled death in the 'labor army' or evaded mobilization into it," and they also write about the bookkeeping: "A man was counted as an 'evader', or even a deserter, if he failed to appear at the recruitment stations at first summons, even by reason of disability or of his own death"(Citation: 125).
    The historians note that the assessments rested "on the data of the central apparatus of the NKVD of the ChIASSR exclusively," and that "the only real thing here was the bombing of Chechen auls and hamlets by Soviet aviation.
    Everything else is open to question"(Citation: 125).
    The military commissariats carried out three call-ups: 29 August - 2 September 1941 (8 thousand men were subject to call-up), in October 1941 (4,733 men) and on 17-25 March 1942: "14,577 men were subject to call-up, of whom only 4,395 were called up"(Citation: 533) - people evaded the call-up en masse.
    In April 1942 the USSR cancelled the call-up of Chechens and Ingush altogether - Dementyev's certificate states: "In connection with this, in April 1942 there followed an order of the NKO of the USSR cancelling the call-up of Chechens and Ingush into the army"(Citation: 533) (the NKO - the USSR ministry of defense).
    The Chechen historian A. G. Avtorkhanov, writing in emigration, dates the release from service to February 1942 and renders the order's motivation in the words "the Chechens and Ingush, by religious conviction, refuse to eat pork"(Citation: 369).
    The historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that it was the NKVD organs (a predecessor of today's FSB) that obtained the halt of the call-up in March 1942, and render the official motivation thus: "the halt of the call-up was motivated all but by care for the Chechens and Ingush, even by the impossibility of providing their nourishment with meat (the highlanders did not eat pork, and there was practically no mutton or beef laid in as canned food)"(Citation: 125).
    Two years later the USSR accused the people it had itself removed from the call-up of evading service and going over to the enemy; on this accusation the colonizer built the decree deporting the people from its own lands in 1944, known as Operation "Chechevitsa" ("Lentil") (campaign C1180) and later recognized as genocide of the Chechen people: by Russia in 1991(Citation: 550), by the European Parliament in 2004(Citation: 551) and by Ukraine in 2022(Citation: 552).
  uk: |-
    СРСР оголосив господарський протест чеченців «повстанням», організованим «фашистськими агентами».
    Партійні органи радянської колоніальної адміністрації Чечено-Інгушетії, «за підказкою НКВД-НКГБ», дали протестові кінця жовтня 1941 року ім'я, яке історики наводять так: «відкрите антирадянське «куркульсько-бандитське повстання»»; самі події, як пишуть історики Я. З. Ахмадов і Е. Х. Хасмагомадов, мали «риси соціального протесту»(Citation: 125).
    Ця версія закріпилася в документах: у доповіді командира 141-го полку внутрішніх військ НКВД (попередників сучасної Росгвардії) підполковника Халухаєва від 26 червня 1943 року жовтень 1941 року описано так: «німецько-фашистськими агентами було піднято збройне контрреволюційне повстання»(Citation: 533).
    Підрахунок спецслужб суперечив картині, яку вони нав'язували: за весь 1941 рік органи НКВД ліквідували 12 «банд» загальною чисельністю до 100 осіб, зафіксувавши чотири «бандпрояви», в яких загинуло дев'ятеро людей(Citation: 125).
    За цими цифрами немає повстання: у всіх «бандах», які НКВД налічив і ліквідував за рік, було до ста осіб на всю Чечню, а в сутичках загинуло дев'ятеро.
    Дезертирство, яке колонізатор поставив у провину чеченському народові, було дезертирством новобранців, а не фронтовиків - у довідці начальника управління Міністерства внутрішніх справ Грозненської області Дементьєва від 1956 року сказано: під час першої мобілізації «дезертирували в дорозі до місця відправлення 450 осіб, ухилилися від призову 269 осіб»(Citation: 533), й історики підтверджують: затримані дезертири були «аж ніяк не з фронту, а з частин, що формувалися у Грозному або проходили через нього»(Citation: 125).
    Про фронтове дезертирство Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «за перші шість місяців війни відомі факти дезертирства з передової 38 осіб»; при цьому, пишуть вони, до «дезертирів» у Чечено-Інгушетії «почали зараховувати й тих, хто втік від смерті з «трудармії» або ухилився від мобілізації до неї», і вони ж пишуть про облік: ««Ухильником», а то й дезертиром вважалися й ті, хто на першу вимогу не з'явився на призовні дільниці, хоча б через інвалідність або власну смерть»(Citation: 125).
    Історики зазначають, що оцінки спиралися «на дані виключно центрального апарату НКВД ЧІАССР», а «реальними тут були лише бомбардування радянською авіацією чеченських аулів і хуторів.
    Усе інше під питанням»(Citation: 125).
    Військкомати провели три призови: 29 серпня - 2 вересня 1941 року (призову підлягало 8 тисяч осіб), у жовтні 1941-го (4733 особи) та 17-25 березня 1942 року: «Підлягало призову 14 577 осіб, з яких було призвано лише 4395»(Citation: 533) - люди масово ухилялися від призову.
    У квітні 1942 року СРСР скасував призов чеченців та інгушів зовсім - у довідці Дементьєва сказано: «У зв'язку з цим у квітні 1942 р. надійшов наказ НКО СРСР про скасування призову до армії чеченців та інгушів»(Citation: 533) (НКО - міністерство оборони СРСР).
    Чеченський історик А. Г. Авторханов, який писав в еміграції, датує звільнення від служби лютим 1942 року й передає мотивування наказу словами «чеченці та інгуші за релігійними переконаннями відмовляються їсти свинину»(Citation: 369).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що припинення призову в березні 1942 року домоглися органи НКВД (попередника сучасної ФСБ), а офіційне мотивування передають так: «припинення призову мотивувалося мало не турботою про чеченців та інгушів, навіть неможливістю забезпечити їхнє харчування м'ясом (горці не їли свинини, а баранини та яловичини у вигляді консервів заготовлено практично не було)»(Citation: 125).
    Через два роки СРСР звинуватив народ, який сам же відсторонив від призову, в ухилянні від служби та переході до противника; на цьому звинуваченні колонізатор побудував указ про депортацію народу з його земель 1944 року, відому як операція «Сочевиця» («Чечевица») (кампанія C1180) й пізніше визнану геноцидом чеченського народу: Росією 1991 року(Citation: 550), Європейським парламентом 2004-го(Citation: 551) та Україною 2022-го(Citation: 552).
  ru: |-
    СССР объявил хозяйственный протест чеченцев «восстанием», организованным «фашистскими агентами».
    Партийные органы советской колониальной администрации Чечено-Ингушетии, «по подсказке НКВД-НКГБ», дали протесту конца октября 1941 года имя, которое историки приводят так: «открытое антисоветское «кулацко-бандитское восстание»»; сами события, как пишут историки Я. З. Ахмадов и Э. Х. Хасмагомадов, носили «черты социального протеста»(Citation: 125).
    Эта версия закрепилась в документах: в докладе командира 141-го полка внутренних войск НКВД (предшественников современной Росгвардии) подполковника Халухаева от 26 июня 1943 года октябрь 1941 года описан так: «немецко-фашистскими агентами было поднято вооруженное контрреволюционное восстание»(Citation: 533).
    Подсчёт спецслужб противоречил картине, которую они навязывали: за весь 1941 год органы НКВД ликвидировали 12 «банд» общей численностью до 100 человек, зафиксировав четыре «бандпроявления», в которых погибло девять человек(Citation: 125).
    За этими цифрами нет восстания: во всех «бандах», которые НКВД насчитал и ликвидировал за год, состояло до ста человек на всю Чечню, а в стычках погибло девять.
    Дезертирство, которое колонизатор вменил чеченскому народу, было дезертирством новобранцев, а не фронтовиков - в справке начальника управления Министерства внутренних дел Грозненской области Дементьева от 1956 года сказано: при первой мобилизации «дезертировали в пути следования к месту отправки 450 человек, уклонились от призыва 269 человек»(Citation: 533), и историки подтверждают: задержанные дезертиры были «отнюдь не с фронта, а из частей, проходивших формирование в Грозном или следовавших через него»(Citation: 125).
    О фронтовом дезертирстве Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «за первые шесть месяцев войны известны факты дезертирства с передовой 38 человек»; при этом, пишут они, к «дезертирам» в Чечено-Ингушетии «стали причислять и тех, кто бежал от смерти из «трудармии» или уклонился от мобилизации в нее», и они же пишут об учёте: ««Уклонившимся», а то и дезертиром считались и те, кто по первому требованию не явился на призывные участки, хотя бы по причине инвалидности или собственной смерти»(Citation: 125).
    Историки отмечают, что оценки опирались «на данные исключительно центрального аппарата НКВД ЧИАССР», а «реальными здесь были только бомбардировки советской авиацией чеченских аулов и хуторов.
    Все остальное под вопросом»(Citation: 125).
    Военкоматы провели три призыва: 29 августа - 2 сентября 1941 года (подлежало призыву 8 тысяч человек), в октябре 1941-го (4733 человека) и 17-25 марта 1942 года: «Подлежало призыву 14 577 чел., из которых было призвано только 4395»(Citation: 533) - люди массово уклонялись от призыва.
    В апреле 1942 года СССР отменил призыв чеченцев и ингушей вовсе - в справке Дементьева сказано: «В связи с этим в апреле 1942 г. последовал приказ НКО СССР об отмене призыва в армию чеченцев и ингушей»(Citation: 533) (НКО - министерство обороны СССР).
    Чеченский историк А. Г. Авторханов, писавший в эмиграции, датирует освобождение от службы февралём 1942 года и передаёт мотивировку приказа словами «чеченцы и ингуши по религиозным убеждениям отказываются есть свинину»(Citation: 369).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что прекращения призыва в марте 1942 года добились органы НКВД, а официальную мотивировку передают так: «прекращение призыва мотивировалось чуть ли не заботой о чеченцах и ингушах, даже невозможностью обеспечить их питание мясом (горцы не ели свинину, а баранины и говядины заготовлено в виде консервов практически не было)»(Citation: 125).
    Через два года СССР обвинил народ, который сам же отстранил от призыва, в уклонении от службы и переходе к противнику; на этом обвинении колонизатор построил указ о депортации народа со своих земель в 1944 году, известной как операция «Чечевица» (кампания C1180) и позже признанной геноцидом чеченского народа: Россией в 1991 году(Citation: 550), Европейским парламентом в 2004-м(Citation: 551) и Украиной в 2022-м(Citation: 552).
