name:
  ru: '«Бомбы обрушились на аулы»: репрессии и воздушные удары по горной Чечне накануне депортации (1941-1942)'
  en: '"Bombs Rained Down on the Auls": Repression and Air Strikes on Mountain Chechnya on the Eve of the Deportation (1941-1942)'
  uk: '«Бомби обрушилися на аули»: репресії та повітряні удари по гірській Чечні напередодні депортації (1941-1942)'
description:
  ru: |-
    Осенью 1941 года шла Вторая мировая война: Германия наступала на СССР, и фронт двигался к Кавказу.
    СССР забирал чеченцев на войну: при первой массовой мобилизации, с 29 августа по 2 сентября 1941 года, военкоматы забрали почти 8 тысяч человек - уклониться сумели 269, ещё 450 бежали по дороге к месту отправки(Citation: 533).
    В октябре забрали ещё 4,4 тысячи человек - 362 на призывные участки не явились(Citation: 533).
    Ещё до 13 тысяч мужчин, непригодных к строевой службе, военкоматы отправили в «трудармию» - строительные батальоны(Citation: 125).
    Уже в сентябре 1941 года эшелоны трудармейцев оказались в прифронтовой зоне, где свыше 10 тысяч из них погибли(Citation: 125).
    В «дезертиры» колонизатор записывал бежавших от смерти из «трудармии», уклонившихся от мобилизации в неё и даже тех, кто не явился на призывной участок из-за инвалидности или собственной смерти; чеченские историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Несчастные граждане были вынуждены или скрываться от ареста, или платить мзду работникам военкоматов и НКВД» - и добавляют: «Массовые взятки с горцев стали обыденной практикой военкоматов»(Citation: 125).
    В начале октября 1941 года горные сёла Чечни поднялись против колхозов и мобилизации - по докладу командира 141-го полка внутренних войск НКВД (предшественников современной Росгвардии) подполковника Халухаева от 26 июня 1943 года, протест охватил Шатоевский (Шатойский), Итум-Калинский, Галанчожский, Чеберлоевский и Шароевский районы(Citation: 533).
    Даже по данным спецслужб это был хозяйственный протест: население горных селений «приступило к стихийному разделу колхозного имущества» - имущества, которое колонизатор свёл в колхозы при коллективизации (кампания C1178); те же данные записали за людьми массовую неуплату налогов и уклонение от мобилизации; «черты социального протеста» в событиях видят и Я. З. Ахмадов и Э. Х. Хасмагомадов(Citation: 125).
    Ответом СССР стали войсковая операция по горным районам, объявление этого протеста «кулацко-бандитским восстанием» и оперативные группы и войска НКВД, оставленные в горах.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что к подавлению, «кроме оперативных групп и внутренних войск, были привлечены три звена боевой авиации», и «Бомбы обрушились на аулы, население которых и не подозревало ни о каком «восстании»»(Citation: 125).
    «В период с 30 октября по 15 ноября 1941 г. 141-й с. п. совместно с другими частями в тяжелых многодневных боях разгромил к[онтр]р[еволюционное] восстание», - докладывал Халухаев начальнику внутренних войск НКВД СССР Шередеге(Citation: 533).
  en: |-
    In the autumn of 1941 the Second World War was underway: Germany was advancing on the USSR, and the front was moving toward the Caucasus.
    The USSR was taking Chechens to its war: during the first mass mobilization, from 29 August to 2 September 1941, the military commissariats took almost 8 thousand men - 269 managed to evade, and another 450 fled on the way to the dispatch point(Citation: 533).
    In October they took another 4.4 thousand - 362 did not report to the recruitment stations(Citation: 533).
    The commissariats sent up to 13 thousand more men, unfit for combat service, to the "labor army" - construction battalions(Citation: 125).
    Already in September 1941 the labor-army trains found themselves in the frontline zone, where more than 10 thousand of these men died(Citation: 125).
    The colonizer recorded as "deserters" those who fled death in the "labor army", those who evaded mobilization into it, and even those who failed to appear at a recruitment station because of disability or their own death; the Chechen historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "The unfortunate citizens were forced either to hide from arrest or to pay bribes to the officials of the military commissariats and the NKVD" - and add: "Mass bribes taken from the highlanders became the everyday practice of the military commissariats"(Citation: 125).
    In early October 1941 the mountain villages of Chechnya rose against the collective farms and the mobilization - according to the report of the commander of the 141st Regiment of the NKVD Internal Troops (predecessors of today's Rosgvardia), Lieutenant Colonel Khalukhaev, dated 26 June 1943, the protest covered the Shatoy (Shatoevsky), Itum-Kale, Galanchozh, Cheberloy and Sharoy districts(Citation: 533).
    Even by the data of the secret services this was an economic protest: the population of the mountain villages "proceeded to a spontaneous division of collective-farm property" - property the colonizer had merged into collective farms during collectivization (campaign C1178); the same records charged the people with mass non-payment of taxes and evasion of mobilization; Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov likewise see "features of social protest" in the events(Citation: 125).
    The USSR's response was a military operation across the mountain districts, the declaration of this protest a "kulak-bandit uprising", and operational groups and NKVD troops left behind in the mountains.
    The historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that, "besides the operational groups and internal troops, three flights of combat aircraft were brought in" for the suppression, and "Bombs rained down on auls whose population did not even suspect any 'uprising'"(Citation: 125).
    "In the period from 30 October to 15 November 1941 the 141st rifle regiment, together with other units, crushed the c[ounter]-r[evolutionary] uprising in heavy multi-day fighting," Khalukhaev reported to Sheredega, head of the NKVD Internal Troops of the USSR(Citation: 533).
  uk: |-
    Восени 1941 року тривала Друга світова війна: Німеччина наступала на СРСР, і фронт рухався до Кавказу.
    СРСР забирав чеченців на війну: під час першої масової мобілізації, з 29 серпня по 2 вересня 1941 року, військкомати забрали майже 8 тисяч людей - ухилитися зуміли 269, ще 450 втекли дорогою до місця відправлення(Citation: 533).
    У жовтні забрали ще 4,4 тисячі людей - 362 на призовні дільниці не з'явилися(Citation: 533).
    Ще до 13 тисяч чоловіків, непридатних до стройової служби, військкомати відправили в «трудармію» - будівельні батальйони(Citation: 125).
    Уже у вересні 1941 року ешелони трудармійців опинилися у прифронтовій зоні, де понад 10 тисяч із них загинули(Citation: 125).
    У «дезертири» колонізатор записував тих, хто втік від смерті з «трудармії», ухилився від мобілізації до неї, і навіть тих, хто не з'явився на призовну дільницю через інвалідність або власну смерть; чеченські історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «Нещасні громадяни були змушені або переховуватися від арешту, або платити хабарі працівникам військкоматів і НКВД» - і додають: «Масові хабарі з горців стали повсякденною практикою військкоматів»(Citation: 125).
    На початку жовтня 1941 року гірські села Чечні піднялися проти колгоспів і мобілізації - за доповіддю командира 141-го полку внутрішніх військ НКВД (попередників сучасної Росгвардії) підполковника Халухаєва від 26 червня 1943 року, протест охопив Шатоєвський (Шатойський), Ітум-Калінський, Галанчозький, Чеберлоєвський і Шароєвський райони(Citation: 533).
    Навіть за даними спецслужб це був господарський протест: населення гірських сіл «приступило до стихійного поділу колгоспного майна» - майна, яке колонізатор звів у колгоспи під час колективізації (кампанія C1178); ті самі дані записали за людьми масову несплату податків та ухиляння від мобілізації; «риси соціального протесту» в подіях бачать і Я. З. Ахмадов і Е. Х. Хасмагомадов(Citation: 125).
    Відповіддю СРСР стали військова операція гірськими районами, оголошення цього протесту «куркульсько-бандитським повстанням» та оперативні групи і війська НКВД, залишені в горах.
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що до придушення, «крім оперативних груп і внутрішніх військ, були залучені три ланки бойової авіації», і «Бомби обрушилися на аули, населення яких і не підозрювало ні про яке «повстання»»(Citation: 125).
    «У період з 30 жовтня по 15 листопада 1941 р. 141-й с. п. спільно з іншими частинами у важких багатоденних боях розгромив к[онтр]р[еволюційне] повстання», - доповідав Халухаєв начальникові внутрішніх військ НКВД СРСР Шередезі(Citation: 533).
