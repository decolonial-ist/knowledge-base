name:
  en: Creation of the Little Russian Prikaz (1663)
  uk: Створення Малоросійського приказу (1663)
  ru: Создание Малороссийского приказа (1663)
description:
  en: |-
    Institutional substitution: Ukrainian affairs were handed over to a special agency in Moscow.
    The Little Russian Prikaz was founded "as one of the departments of the Ambassadorial Prikaz to administer Ukrainian affairs," and through it the tsarist government "exercised control over the political-administrative activity of the hetman's administration and the tsarist voivodes in Ukraine"(Citation: 194) – the Hetmanate fell under the permanent departmental oversight of the metropole.
  uk: |-
    Інституційне заміщення: українські справи передано спеціальному відомству в Москві.
    Малоросійський приказ було засновано «як один із відділів Посольського приказу для відання укр. справами», і через нього царський уряд «здійснював контроль за політико-адм. діяльністю гетьман. адміністрації та царських воєвод в Україні»(Citation: 194) – Гетьманщина потрапила під постійний відомчий нагляд метрополії.
  ru: |-
    Институциональное замещение: украинские дела переданы специальному ведомству в Москве.
    Малороссийский приказ был основан «как один из отделов Посольского приказа для ведения украинских дел», и через него царское правительство «осуществлял контроль за политико-административной деятельностью гетманской администрации и царских воевод в Украине»(Citation: 194) – Гетманщина попала под постоянный ведомственный надзор метрополии.
