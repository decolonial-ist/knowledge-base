description:
  ru: 'Союзный центр задействовал международную трибуну против украинского суверенитета: Буш публично заклеймил стремление к независимости как «самоубийственный национализм на почве этнической ненависти»(Citation: 174) – речь вошла в историю как «Chicken Kiev speech».'
  en: 'The union center deployed an international platform against Ukrainian sovereignty: Bush publicly called the striving for independence a "suicidal nationalism based upon ethnic hatred"(Citation: 174) – the speech went down in history as the "Chicken Kiev speech."'
  uk: 'Союзний центр задіяв міжнародну трибуну проти українського суверенітету: Буш публічно затаврував прагнення до незалежності як «самогубний націоналізм на ґрунті етнічної ненависті»(Citation: 174) – промова увійшла в історію як «Chicken Kiev speech».'
