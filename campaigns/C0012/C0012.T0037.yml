description:
  ru: |-
    Установление полностью подконтрольного Москве правительства после уничтожения столицы: выборы нового гетмана прошли в присутствии Петра сразу после казни батуринских старшин.
    Историк Т. Г. Таирова-Яковлева пишет: «При создавшихся условиях старшина просто утвердила представленного Петром Скоропадского»(Citation: 3).
    Механику зависимости фиксирует Грушевский: «Гетманскую резиденцию перенесли из Батурина в Глухов, под самую московскую границу, и поставили два московских полка гарнизоном, чтобы те резиденты могли сразу арестовать гетмана и старшину», и «каждый в Украине понимал, что сила не в гетмане, а в тех резидентах»(Citation: 250).
  en: |-
    The installation of a government fully controlled by Moscow after the destruction of the capital: the election of the new hetman took place in Peter's presence immediately after the execution of the Baturyn officers – "Under the circumstances, the officers simply confirmed Skoropadsky, presented by Peter"(Citation: 3).
    Hrushevsky records the mechanics of dependence: "The hetman's residence was moved from Baturyn to Hlukhiv, right up against the Muscovite border, and two Muscovite regiments were garrisoned there so that the residents could arrest the hetman and the officers at once," and "everyone in Ukraine understood that power lay not with the hetman but with those residents"(Citation: 250).
  uk: |-
    Встановлення повністю підконтрольного Москві уряду після знищення столиці: вибори нового гетьмана відбулися в присутності Петра одразу після страти батуринських старшин – «За умов, що склалися, старшина просто затвердила представленого Петром Скоропадського»(Citation: 3).
    Механіку залежності фіксує Грушевський: «Гетьманську резіденцію перенесено з Батурина до Глухова, під саму московську границю і поставлено два московські полки залогою, щоб ті резіденти могли зараз арештувати гетьмана і старшину», і «кождий на Україні розумів, що сила не в гетьмані, а в тих резідентах»(Citation: 250).
