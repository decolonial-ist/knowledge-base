description:
  en: |-
    The formalization of the occupation regime through sham procedures.
    The officers, terrorized by the massacre, were made to vote for the metropole's preferred candidate: "At the end of this spectacle came the execution of the officers captured in Baturyn, and then the formal election of a new hetman.
    Under the circumstances, the officers simply confirmed Skoropadsky, presented by Peter"(Citation: 3)(Citation: 4).
  uk: |-
    Оформлення окупаційного режиму через фіктивні процедури.
    Залякану різаниною старшину змусили проголосувати за угодного метрополії кандидата: «Після закінчення цього дійства відбулася страта захоплених у Батурині старшин, а потім формальні вибори нового гетьмана.
    За умов, що склалися, старшина просто затвердила представленого Петром Скоропадського»(Citation: 3)(Citation: 4).
  ru: |-
    Оформление оккупационного режима через фиктивные процедуры.
    Запуганную резней старшину заставили проголосовать за угодного метрополии кандидата: «По окончании этого действия состоялась казнь захваченных в Батурине старшин, а затем формальные выборы нового гетмана.
    При создавшихся условиях старшина просто утвердила представленного Петром Скоропадского»(Citation: 3)(Citation: 4).
