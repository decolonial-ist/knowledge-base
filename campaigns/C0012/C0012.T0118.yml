description:
  ru: |-
    Тотальная резня мирного населения: «Функ перебил больше тысячи людей в маленьком городке Терее (Терейской слободе) и сжег этот городок, сжег также Дрыгалов (Недрыгайлово)… и велел перебить всех, кто повстречался, чтобы внушить ужас другим»(Citation: 170).
    «Всего в батуринской трагедии погибло около 15 тысяч украинцев, в том числе все женщины и дети»(Citation: 3)(Citation: 4).
  en: |-
    Total massacre of the civilian population: "Funck slaughtered more than a thousand people in the small town of Terey (Tereyska sloboda) and burned the town down, and also burned Dryhalov (Nedryhailiv)… and ordered everyone encountered to be killed, so as to instill horror in others"(Citation: 170).
    "In total, about 15 thousand Ukrainians died in the Baturyn tragedy, including all the women and children"(Citation: 3)(Citation: 4).
  uk: |-
    Тотальна різанина мирного населення: «Функ перебив понад тисячу людей у маленькому містечку Тереї (Терейській слободі) і спалив це містечко, спалив також Дригалів (Недригайлове)… і звелів перебити всіх, хто трапився, щоб вселити жах іншим»(Citation: 170).
    «Загалом у батуринській трагедії загинуло близько 15 тисяч українців, у тому числі всі жінки й діти»(Citation: 3)(Citation: 4).
