description:
  ru: |-
    Кампания по стиранию имени лидера сопротивления (damnatio memoriae): «Два столетия имя и дела Мазепы вымарывались…
    Сбивали его гербы на построенных им храмах, замазывали его имя на книгах»(Citation: 3)(Citation: 4).
  en: |-
    A campaign to erase the resistance leader's name (damnatio memoriae): "For two centuries the name and deeds of Mazepa were expunged…
    His coats of arms were knocked off the churches he had built, his name was painted over in books"(Citation: 3)(Citation: 4).
  uk: |-
    Кампанія зі стирання імені лідера опору (damnatio memoriae): «Два століття ім'я і діла Мазепи вимазувалися…
    Збивали його герби на збудованих ним храмах, замазували його ім'я на книгах»(Citation: 3)(Citation: 4).
