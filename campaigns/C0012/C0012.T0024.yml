description:
  ru: |-
    Анафему гетману Ивану Мазепе огласили по прямому распоряжению царя Петра I - письмо местоблюстителю патриаршего престола Стефану Яворскому от 31 октября 1708 года: «изволте онаго за такое ево дело публично в саборной церкви проклятию предать...»(Citation: 4).
    Часть украинского духовенства обряд не приняла: бывший лохвицкий протопоп в 1724 году во время объявления анафемы в одной из церквей сказал «Наш Мазепа свят и будет на небе, а ваш государь нет»(Citation: 4).
    Вселенский патриархат анафему никогда не признавал: «анафема была наложена на Ивана Мазепу по политическим причинам и не имела богословского или канонического обоснования»(Citation: 209).
  en: |-
    The anathema against Mazepa was proclaimed by the tsar's direct order - "be pleased to have him, for such a deed of his, publicly cursed in the cathedral church..."(Citation: 4).
    Part of the Ukrainian clergy refused to accept the rite: a former Lokhvytsia archpriest said during the proclamation of the anathema, "Our Mazepa is holy and will be in heaven, and your sovereign will not"(Citation: 4).
    The Ecumenical Patriarchate never recognized it: "the anathema was laid on Ivan Mazepa for political reasons and had no theological or canonical justification"(Citation: 209).
  uk: |-
    Анафему Мазепі було оголошено за прямим розпорядженням царя - «звольте оного за таке його діло публічно в соборній церкві прокляттю віддати...»(Citation: 4).
    Частина українського духовенства обряд не прийняла: колишній лохвицький протопоп під час оголошення анафеми сказав «Наш Мазепа святий і буде на небі, а ваш государ ні»(Citation: 4).
    Вселенський патріархат ніколи її не визнавав: «анафема була накладена на Івана Мазепу з політичних причин і не мала богословського чи канонічного обґрунтування»(Citation: 209).
