name:
  en: All-Russian Census and the Erasure of Identity (1897)
  uk: Всеросійський перепис і стирання ідентичності (1897)
  ru: Всероссийская перепись и стирание идентичности (1897)
description:
  en: |-
    The empire conducted the general census of 1897, embedded in the doctrine of the "triune Russian people".
    The linguist Sergei Bulich, in his article for the Brockhaus and Efron Encyclopedic Dictionary, classified Ukrainian speech thus: "the Little Russian dialect of the Russian language"(Citation: 157).
    Historians of the Institute of History of Ukraine of the National Academy of Sciences note: "The census of 1897 recorded not nationality but the respondents' native tongue, and since many Ukrainians named Russian as such, there were in fact more ethnic Ukrainians than indicated in the census"(Citation: 197).
    The census also recorded the reach of the Ukrainian language.
    According to its consolidated volume, the "Little Russian dialect" - the imperial name for the Ukrainian language - was named as their native tongue by 22,380,551 people out of 125,640,021 counted in the empire, that is 17.8%: the empire's second language by number of speakers after Great Russian (Russian)(Citation: 491).
    Nearly one in four speakers lived outside the nine Ukrainian governorates, and in the Kuban region (now mostly Krasnodar krai of Russia) Ukrainian was the most widespread native language(Citation: 491).
  uk: |-
    Імперія провела загальний перепис 1897 року, вбудований у доктрину «триєдиного руського народу».
    Лінгвіст Сергій Булич у статті для Енциклопедичного словника Брокгауза і Ефрона так класифікував українську мову: «малоруське наріччя російської мови»(Citation: 157).
    Історики Інституту історії України Національної академії наук зазначають: «Перепис 1897 р. фіксував не національність, а рідну мову респондентів, і оскільки багато українців називали як таку російську, етнічних українців фактично було більше, ніж зазначено у перепису»(Citation: 197).
    Перепис зафіксував і масштаб поширення української мови.
    За його зведеним томом «малоруське наріччя» - імперська назва української мови - назвали рідним 22 380 551 особа зі 125 640 021 переписаних в імперії, тобто 17,8%: друга мова імперії за кількістю носіїв після великоруської (російської)(Citation: 491).
    Майже кожен четвертий носій жив за межами дев'яти українських губерній, а в Кубанській області (нині переважно Краснодарський край Росії) українська була найпоширенішою рідною мовою(Citation: 491).
  ru: |-
    Империя провела всеобщую перепись 1897 года, встроенную в доктрину «триединого русского народа».
    Лингвист Сергей Булич в статье для Энциклопедического словаря Брокгауза и Ефрона классифицировал украинскую речь так: «Малорусское наречие русского яз[ыка].»(Citation: 157).
    Историки Института истории Украины Национальной академии наук отмечают: «Перепись 1897 г. фиксировала не национальность, а родной язык респондентов, и поскольку многие украинцы называли таковым русский, этнических украинцев фактически было больше, чем указано в переписи»(Citation: 197).
    Перепись зафиксировала и масштаб распространения украинского языка.
    По её сводному тому «малорусское наречие» - имперское название украинского языка - назвали родным 22 380 551 человек из 125 640 021 переписанного в империи, то есть 17,8%: второй язык империи по числу носителей после великорусского (русского)(Citation: 491).
    Почти каждый четвёртый носитель жил за пределами девяти украинских губерний, а в Кубанской области (ныне в основном Краснодарский край России) украинский был самым распространённым родным языком(Citation: 491).
