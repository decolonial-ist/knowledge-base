description:
  ru: |-
    В 1841-1846 годах экспедиции стирали чеченские селения десятками.
    Ауховское селение Кишень войска генерала Граббе, командующего войсками Кавказской линии (цепи имперских укреплений на земле нохчи), уничтожали три дня: имперский историк Юров записал - «к вечеру селение и его сады не существовали; из груды обгорелых развалин возвышались только две мечети и две сакли... пощаженные по просьбе Дукай-кадия» (сакля - дом горца; кадий - мусульманский судья)(Citation: 134).
    В походе на реку Ассу в конце сентября 1841 года отряд, по Юрову, «взял с боя и разрушил 8 аулов» - среди них Гапургой-Юрт, Адильгери-Юрт, Ша-Юрт, - а «запасы кукурузы и сена сожжены»(Citation: 134).
    В октябрьской экспедиции 15-30 октября 1841 года сожжены Пхан-Кичу, Шалажи, Магома-Ирзау, Магома-Юрт, Терга-Юрт, Шуаиб-хутор и аулы у Гойты; 16 октября уничтожен Нурикой-Юрт - Юров называет его «многолюднейший и богатейший чеченский аул»(Citation: 134).
    В декабре 1846 года войска выжгли Алдинские хутора и аулы Малой Чечни (равнинно-предгорной западной части Чечни).
    Имперский офицер Полторацкий, участник экспедиции, записал 15 декабря 1846 года: «по приказанию начальника колонны вспыхнули все окружающие нас сакли» (сакля - дом горца)(Citation: 122).
    Итог зачистки он же подвёл так: «Цель экспедиции в Малой Чечне была достигнута вполне... плоскость Малой Чечни в треугольник между крепостями Грозной, Воздвиженской и Закан-Юртом очищена совершенно от жилищ и лесов»(Citation: 122).
  en: |-
    In 1841-1846 expeditions wiped out Chechen settlements by the dozen.
    The Aukh village of Kishen the troops of general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), destroyed over three days: the imperial historian Yurov recorded - "by evening the village and its orchards existed no more; out of the heap of charred ruins rose only two mosques and two saklias... spared at the request of Dukai-qadi" (saklia - a highlander's house; qadi - a Muslim judge)(Citation: 134).
    In the march to the Assa river at the end of September 1841 the detachment, according to Yurov, "took by fighting and destroyed 8 auls" - among them Gapurgoy-Yurt, Adilgeri-Yurt, Sha-Yurt - and "the stores of maize and hay were burned"(Citation: 134).
    In the October expedition of 15-30 October 1841 Phan-Kichu, Shalazhi, Magoma-Irzau, Magoma-Yurt, Terga-Yurt, Shuaib-khutor and the auls near Goyta were burned; on 16 October Nurikoy-Yurt was destroyed - Yurov calls it "the most populous and richest Chechen aul"(Citation: 134).
    In December 1846 the troops burned out the Aldy hamlets and the auls of Lesser Chechnya (the lowland-piedmont western part of Chechnya).
    The imperial officer Poltoratsky, a participant of the expedition, recorded on 15 December 1846: "at the order of the column's commander all the saklias around us burst into flame" (saklia - a highlander's house)(Citation: 122).
    The result of the sweep he summed up thus: "The goal of the expedition in Lesser Chechnya was achieved in full... the plain of Lesser Chechnya in the triangle between the fortresses of Groznaya, Vozdvizhenskaya and Zakan-Yurt has been cleared completely of dwellings and forests"(Citation: 122).
  uk: |-
    У 1841-1846 роках експедиції стирали чеченські селища десятками.
    Ауховське селище Кишень війська генерала Граббе, командувача військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), знищували три дні: імперський історик Юров записав - «до вечора селище та його сади не існували; з купи обгорілих руїн височіли тільки дві мечеті та дві саклі... пощаджені на прохання Дукай-кадія» (сакля - дім горця; кадій - мусульманський суддя)(Citation: 134).
    У поході на річку Ассу наприкінці вересня 1841 року загін, за Юровим, «взяв з бою і зруйнував 8 аулів» - серед них Гапургой-Юрт, Адільгері-Юрт, Ша-Юрт, - а «запаси кукурудзи та сіна спалено»(Citation: 134).
    У жовтневій експедиції 15-30 жовтня 1841 року спалено Пхан-Кічу, Шалажі, Магома-Ірзау, Магома-Юрт, Терга-Юрт, Шуаїб-хутір та аули біля Гойти; 16 жовтня знищено Нурикой-Юрт - Юров називає його «найбагатолюдніший і найбагатший чеченський аул»(Citation: 134).
    У грудні 1846 року війська випалили Алдинські хутори та аули Малої Чечні (рівнинно-передгірної західної частини Чечні).
    Імперський офіцер Полторацький, учасник експедиції, записав 15 грудня 1846 року: «за наказом начальника колони спалахнули всі саклі, що нас оточували» (сакля - дім горця)(Citation: 122).
    Підсумок зачистки він же підбив так: «Мета експедиції в Малій Чечні була досягнута цілком... площина Малої Чечні в трикутнику між фортецями Грозною, Воздвиженською і Закан-Юртом очищена цілком від жител і лісів»(Citation: 122).
