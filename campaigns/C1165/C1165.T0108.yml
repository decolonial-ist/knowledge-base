description:
  ru: |-
    В 1841-1846 годах империя держала не подчинившуюся Чечню в торговой блокаде. 7 мая 1841 года генерал Граббе, командующий войсками Кавказской линии (цепи имперских укреплений на земле нохчи), разослал шести начальникам участков линии предписание «принять строжайшие меры, чтобы непокорным горцам непередаваемо было пороха, серы, свинца или других каких-либо припасов, а с нашей стороны за исполнением этого иметь неослабное и постоянное наблюдение»(Citation: 126).
    Действие блокады признала имперская записка «О политическом состоянии Чечни» при рапорте генерала Нейдгардта, главы имперских войск на Кавказе, от 20 ноября 1843 года: чеченцам не хватает тканей, железа и соли, и «причину этому искать должно в прекращении торговых связей с русскими, а не в недостатке продовольственных средств»(Citation: 126).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что чеченские наибства (области имамата, управляемые наместниками имама - наибами) стали его экономической базой: хлеб и другая сельскохозяйственная продукция чеченских крестьян дали «имамату возможность почти два десятилетия жить в условиях полной экономической блокады»(Citation: 125).
  en: |-
    In 1841-1846 the empire held Chechnya, which had not submitted, under a trade blockade.
    On 7 May 1841 general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), sent to six sector commanders of the line an instruction "to take the strictest measures so that no gunpowder, sulphur, lead or any other supplies be passed to the unsubmissive highlanders, and on our side to keep unflagging and constant watch over the execution of this"(Citation: 126).
    The blockade's effect was admitted by the imperial memorandum "On the political condition of Chechnya" attached to the report of general Neidhardt, head of the empire's troops in the Caucasus, of 20 November 1843: the Chechens lack cloth, iron and salt, and "the cause of this must be sought in the cessation of trade ties with the Russians, and not in a shortage of means of subsistence"(Citation: 126).
    The historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that the Chechen naibstvos (districts of the imamate governed by the imam's deputies, the naibs) became its economic base: the grain and other farm produce of Chechen peasants gave "the imamate the possibility of living for almost two decades under conditions of a complete economic blockade"(Citation: 125).
  uk: |-
    У 1841-1846 роках імперія тримала Чечню, що не підкорилася, в торговельній блокаді. 7 травня 1841 року генерал Граббе, командувач військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), розіслав шістьом начальникам дільниць лінії припис «вжити найсуворіших заходів, щоб непокірним горцям не передавалося пороху, сірки, свинцю чи будь-яких інших припасів, а з нашого боку за виконанням цього мати неослабний і постійний нагляд»(Citation: 126).
    Дію блокади визнала імперська записка «Про політичний стан Чечні» при рапорті генерала Нейдгардта, глави імперських військ на Кавказі, від 20 листопада 1843 року: чеченцям бракує тканин, заліза і солі, і «причину цього шукати треба в припиненні торговельних зв'язків з росіянами, а не в нестачі продовольчих засобів»(Citation: 126).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що чеченські наїбства (області імамату, керовані намісниками імама - наїбами) стали його економічною базою: хліб та інша сільськогосподарська продукція чеченських селян дали «імамату можливість майже два десятиліття жити в умовах повної економічної блокади»(Citation: 125).
