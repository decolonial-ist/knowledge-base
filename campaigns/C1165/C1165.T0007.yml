description:
  ru: |-
    В начале 1844 года, после поражений имперской армии в 1843 году, генерал Нейдгардт, глава имперских войск на Кавказе, издал воззвание к горцам, переворачивающее картину войны: захватчиком в нём выставлен не имперский генерал, приведший войска, а Шамиль (имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию).
    Воззвание рисует Шамиля человеком, «который проповедует равенство и истребление всех наследственных властей с единственной целью завладеть наследиями ханов и беков» и который «наполнил ваши аулы ненавистными муртозигатами... обременил вас тяжкими налогами...» (муртазигаты - конные воины постоянного войска имамата)(Citation: 129).
    Результат воззвания историк Н. И. Покровский описал коротко: «Но вопли не помогали» - воплями он называет сами эти имперские увещевания(Citation: 129).
  en: |-
    At the beginning of 1844, after the defeats of the imperial army in 1843, general Neidhardt, head of the empire's troops in the Caucasus, issued a proclamation to the highlanders that inverted the picture of the war: the invader in it is not the imperial general who brought the troops, but Shamil (the imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest).
    The proclamation paints Shamil as a man "who preaches equality and the extermination of all hereditary authorities with the sole aim of seizing the inheritances of the khans and beks" and who "has filled your auls with hated murtazigats... has burdened you with heavy taxes..." (murtazigats - mounted warriors of the Imamate's standing army)(Citation: 129).
    The result of the proclamation historian N. I. Pokrovsky described briefly: "But the wails did not help" - by wails he means these imperial exhortations themselves(Citation: 129).
  uk: |-
    На початку 1844 року, після поразок імперської армії в 1843 році, генерал Нейдгардт, глава імперських військ на Кавказі, видав відозву до горців, що перевертає картину війни: загарбником у ній виставлено не імперського генерала, який привів війська, а Шаміля (імама, керівника опору горців Дагестану і Чечні російському завоюванню).
    Відозва малює Шаміля людиною, «яка проповідує рівність і винищення всіх спадкових влад з єдиною метою заволодіти спадщинами ханів і беків» і яка «наповнила ваші аули ненависними муртозігатами... обтяжила вас тяжкими податками...» (муртазігати - кінні воїни постійного війська імамату)(Citation: 129).
    Результат відозви історик Н. І. Покровський описав коротко: «Но вопли не помогали» - воланням він називає самі ці імперські умовляння(Citation: 129).
