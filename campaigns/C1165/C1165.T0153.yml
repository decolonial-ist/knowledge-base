description:
  ru: |-
    Против религиозного авторитета имамата (государства горцев Дагестана и Чечни во главе с имамом Шамилём, руководителем сопротивления российскому завоеванию) империя выставляла лояльных ей исламских клириков. 13 марта 1845 года Воронцов, наместник и главнокомандующий на Кавказе, докладной запиской императору Николаю I сообщил об отправке в Чечню крымского мусульманского судьи (кадия): «Кади Эскер Сеид Халил Эфенди пришел ко мне и объявил намерение и желание его лично содействовать праведному нашему делу в горах Кавказских увещаниями племен именем самой веры магометанской... я дал ему на расходы... всего 400 руб. сер. и прогоны на четыре лошади до кр.
    Грозной, отнеся расход сей на экстроординарную сумму»(Citation: 126).
    Службу империя оплатила и наградой: историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут - «В 1845 г. в крепость Грозную направлен крымско-татарский кадий Кадиаскер Сеид-Халиль Эфенди, чьи усилия были вскоре отмечены высокой наградой - орденом Святой Анны III степени»(Citation: 125).
  en: |-
    Against the religious authority of the Imamate (the state of the highlanders of Dagestan and Chechnya headed by imam Shamil, leader of the resistance to the Russian conquest) the empire fielded Islamic clerics loyal to itself.
    On 13 March 1845 Vorontsov, viceroy and commander-in-chief in the Caucasus, in a memorandum to emperor Nicholas I reported the dispatch of a Crimean Muslim judge (qadi) to Chechnya: "Qadi Esker Seid Halil Efendi came to me and declared his intention and wish personally to assist our righteous cause in the Caucasus mountains by admonishing the tribes in the name of the Mohammedan faith itself...
    I gave him for expenses... 400 rubles in silver in all and post-horses for four horses to the Groznaya fortress, charging this expense to the extraordinary sum"(Citation: 126).
    The empire paid for the service with a decoration as well: historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write - "In 1845 the Crimean Tatar qadi Qadiasker Seid-Halil Efendi was sent to the Groznaya fortress; his efforts were soon marked by a high decoration - the Order of St Anna, third class"(Citation: 125).
  uk: |-
    Проти релігійного авторитету імамату (держави горців Дагестану і Чечні на чолі з імамом Шамілем, керівником опору російському завоюванню) імперія виставляла лояльних їй ісламських кліриків. 13 березня 1845 року Воронцов, намісник і головнокомандувач на Кавказі, доповідною запискою імператору Миколі I повідомив про відправлення до Чечні кримського мусульманського судді (кадія): «Каді Ескер Сеїд Халіл Ефенді прийшов до мене і оголосив намір і бажання його особисто сприяти праведній нашій справі в горах Кавказьких умовляннями племен іменем самої віри магометанської... я дав йому на витрати... всього 400 руб. ср. і прогони на чотири коні до фортеці Грозної, віднісши витрату цю на екстраординарну суму»(Citation: 126).
    Службу імперія оплатила і нагородою: історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть - «У 1845 р. до фортеці Грозної направлено кримськотатарського кадія Кадіаскера Сеїд-Халіля Ефенді, чиї зусилля були невдовзі відзначені високою нагородою - орденом Святої Анни III ступеня»(Citation: 125).
