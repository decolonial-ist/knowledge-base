description:
  ru: |-
    Разрешённую торговлю с Чечнёй империя загнала под собственный контроль - в казённые меновые дворы (пункты обмена товарами под надзором чиновников).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Свободная торговля русских с горцами на пограничной линии, в том числе и с чеченцами, была запрещена.
    Все торговые операции должны были проходить под контролем государственных чиновников, которые следили за тем, чтобы к горцам - «за границу», не попадали товары военного характера.
    Кроме того, вводился ряд ограничений на продажу железа, соли, золота и других товаров»(Citation: 125).
    Сеть контролируемых пунктов расширялась: во второй половине 1840-х годов число меновых дворов доведено до 11; за 1846 год горцы привезли на все меновые дворы товара на 231 тысячу рублей(Citation: 125).
  en: |-
    The trade with Chechnya that remained permitted, the empire drove under its own control - into state barter yards (exchange points supervised by officials).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "Free trade of Russians with the highlanders on the border line, including with the Chechens, was forbidden.
    All trade operations had to pass under the control of state officials, who saw to it that goods of military character did not reach the highlanders - 'beyond the border'.
    In addition, a number of restrictions were introduced on the sale of iron, salt, gold and other goods"(Citation: 125).
    The network of controlled points expanded: in the second half of the 1840s the number of barter yards was brought to 11; in 1846 barter points were opened in the Cossack stanitsas of Chervlennaya and Mozdokskaya; over 1846 the highlanders brought goods worth 231 thousand rubles to all the barter yards(Citation: 125).
  uk: |-
    Дозволену торгівлю з Чечнею імперія загнала під власний контроль - у казенні мінові двори (пункти обміну товарами під наглядом чиновників).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «Вільна торгівля росіян з горцями на прикордонній лінії, у тому числі і з чеченцями, була заборонена.
    Усі торговельні операції мали проходити під контролем державних чиновників, які стежили за тим, щоб до горців - «за кордон», не потрапляли товари воєнного характеру.
    Крім того, запроваджувалася низка обмежень на продаж заліза, солі, золота та інших товарів»(Citation: 125).
    Мережа контрольованих пунктів розширювалася: у другій половині 1840-х років число мінових дворів доведено до 11 за 1846 рік горці привезли на всі мінові двори товару на 231 тисячу рублів(Citation: 125).
