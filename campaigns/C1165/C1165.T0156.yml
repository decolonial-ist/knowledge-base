description:
  en: |-
    The empire demanded that Chechen communities hand over soldiers who had fled to them from the imperial army, and set salt as the price of that surrender.
    Minister of War Chernyshev, in an official service letter (otnoshenie) of 6 September 1842, conveyed to general Golovin, commander of the Separate Caucasus Corps (head of the imperial troops and administration in the Caucasus), the order of emperor Nicholas I: the local command was to ""demand the return of the servicemen who had hidden among the highlanders who had declared their submission to us"", and from the communities that had not submitted to obtain the surrender through need - ""to endeavour to induce the unsubmitted to hand over deserters in exchange for salt""(Citation: 126).
    The emperor expressly forbade ransoming the fugitives with money: the payment for the people handed over was access to the salt the empire kept under embargo.
  uk: |-
    Імперія вимагала від чеченських громад видавати солдатів, які втекли до них з імперської армії, і призначила ціною видачі сіль.
    Військовий міністр Чернишов офіційним службовим листом (відношенням) від 6 вересня 1842 року передав генералу Головіну, командиру Окремого Кавказького корпусу (главі імперських військ і адміністрації на Кавказі), повеління імператора Миколи I: щоб місцеве начальство «вимагало повернення військових чинів, що переховалися в горців, які виявили нам покірність», а від непідкорених громад «намагалося схиляти непокірних до видачі дезертирів за сіль»(Citation: 126).
    Викуповувати втікачів грошима імператор заборонив прямо: платою за виданих людей ставав доступ до солі, яку імперія тримала під забороною.
  ru: |-
    Империя требовала от чеченских обществ выдавать солдат, бежавших к ним из имперской армии, и назначила ценой выдачи соль.
    Военный министр Чернышев официальным служебным письмом (отношением) от 6 сентября 1842 года передал генералу Головину, командиру Отдельного Кавказского корпуса (главе имперских войск и администрации на Кавказе), повеление императора Николая I: чтобы местное начальство «требовало возвращения воинских чинов, скрывшихся у горцев изъявивших нам покорность», а от не подчинившихся обществ «старалось соглашать непокорных к выдаче дезертиров за соль»(Citation: 126).
    Выкупать беглецов деньгами император запретил прямо: платой за выданных людей становился доступ к соли, которую империя держала под запретом.
