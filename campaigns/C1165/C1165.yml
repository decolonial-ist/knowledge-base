name:
  ru: '«Стеснение Чечни со всех сторон»: блокада, тайная война, карательные экспедиции и Сунженская линия (1840-1846)'
  en: '"Constriction of Chechnya from all sides": blockade, secret war, punitive expeditions and the Sunzha Line (1840-1846)'
  uk: '«Стиснення Чечні з усіх боків»: блокада, таємна війна, каральні експедиції та Сунженська лінія (1840-1846)'
description:
  ru: |-
    В 1840-1846 годах империя сжимала Чечню со всех сторон разом: торговой блокадой и заложничеством, тайной войной - заказными убийствами, агентурой и подкупом, - карательными экспедициями и строительством Сунженской линии крепостей с выселением жителей.
    Программу назвал генерал Головин, командир Отдельного Кавказского корпуса (глава имперских войск и администрации на Кавказе), рапортом военному министру Чернышеву от 24 февраля 1841 года: «стеснение таким образом со всех сторон Чечни поставит вождей этого многолюдного племени в самое невыгодное для них положение...
    Весьма правдоподобно, что чеченцы, оставшись продолжительное время в бездействии, сделаются смирнее»(Citation: 126).
    Расчёт политики историк Н. И. Покровский формулирует по документам: «Голодная Чечня, по расчетам царизма, должна была сдаться, чтобы восстановить торговые отношения и добыть хлеб»(Citation: 129).
    Военную силу империя дополнила тайной: Чернышев секретным письмом Головину от 19 июля 1842 года назвал образец - «Англичане умели утвердить владычество свое в Индии политическими средствами.
    Этим путем сберегли они войска и выиграли время в покорении края.
    Не должны ли и мы испытать эту систему?»(Citation: 126).
    Итог шести лет подвёл имперский офицер Полторацкий, участник декабрьской экспедиции 1846 года: «плоскость Малой Чечни в треугольник между крепостями Грозной, Воздвиженской и Закан-Юртом очищена совершенно от жилищ и лесов»(Citation: 122).
  en: |-
    In 1840-1846 the empire constricted Chechnya from all sides at once: by trade blockade and hostage-taking, by secret war - contract killings, agents and bribery, - by punitive expeditions and by building the Sunzha Line of fortresses with the eviction of the inhabitants.
    The programme was named by general Golovin, commander of the Separate Caucasus Corps (head of the empire's troops and administration in the Caucasus), in a report to Minister of War Chernyshev of 24 February 1841: ""the constriction of Chechnya in this way from all sides will place the chiefs of this populous tribe in the most disadvantageous position for them...
    It is quite probable that the Chechens, having remained inactive for a long time, will become tamer""(Citation: 126).
    Historian N. I. Pokrovsky formulates the policy's calculation from the documents: ""Starving Chechnya, by tsarism's reckoning, was to surrender in order to restore trade relations and obtain grain""(Citation: 129).
    The empire supplemented armed force with secrecy: in a secret letter to Golovin of 19 July 1842 Chernyshev named the model - ""The English knew how to establish their dominion in India by political means.
    By this path they spared their troops and gained time in the subjugation of the country.
    Should not we too try this system?""(Citation: 126).
    The result of the six years was summed up by the imperial officer Poltoratsky, a participant in the December 1846 expedition: ""the plain of Lesser Chechnya in the triangle between the fortresses of Groznaya, Vozdvizhenskaya and Zakan-Yurt has been cleared completely of dwellings and forests""(Citation: 122).
  uk: |-
    У 1840-1846 роках імперія стискала Чечню з усіх боків разом: торговельною блокадою і заручництвом, таємною війною - замовними вбивствами, агентурою і підкупом, - каральними експедиціями і будівництвом Сунженської лінії фортець із виселенням жителів.
    Програму назвав генерал Головін, командир Окремого Кавказького корпусу (глава імперських військ і адміністрації на Кавказі), рапортом військовому міністру Чернишову від 24 лютого 1841 року: «стиснення таким чином з усіх боків Чечні поставить вождів цього багатолюдного племені в найневигідніше для них становище...
    Вельми правдоподібно, що чеченці, залишившись тривалий час у бездіяльності, стануть смирнішими»(Citation: 126).
    Розрахунок політики історик Н. І. Покровський формулює за документами: «Голодна Чечня, за розрахунками царизму, мала здатися, щоб відновити торговельні відносини і добути хліб»(Citation: 129).
    Військову силу імперія доповнила таємною: Чернишов таємним листом Головіну від 19 липня 1842 року назвав зразок - «Англійці вміли утвердити панування своє в Індії політичними засобами.
    Цим шляхом зберегли вони війська і виграли час у підкоренні краю.
    Чи не повинні й ми випробувати цю систему?»(Citation: 126).
    Підсумок шести років підбив імперський офіцер Полторацький, учасник грудневої експедиції 1846 року: «площина Малої Чечні в трикутнику між фортецями Грозною, Воздвиженською і Закан-Юртом очищена цілком від жител і лісів»(Citation: 122).
