description:
  ru: |-
    Бежавших к восставшим надтеречных чеченцев (жителей левого берега Терека) империя навсегда лишила права вернуться домой.
    «Доклад канцелярии по управлению мирными горцами» (не ранее июля 1841 года) фиксирует распоряжение: «бежавшим чеченцам объявить, что они навсегда лишились права селиться на местах до побега ими занимаемых»(Citation: 126); подполковнику Бековичу-Черкасскому (из кабардинского владетельного рода, на российской службе, приставленному к надтеречным аулам) «предписано было возвращающихся из бегов чеченцев без разрешения не принимать»(Citation: 126).
    Дома двенадцати деревень к этому времени были разобраны и вывезены в казачьи станицы - возвращаться было некуда и запрещено.
    Программа завоевания Чечни, утверждённая императором Николаем I в 1843 году, прописала, где и как чеченцам разрешено жить.
    Военный министр Чернышев докладом императору от 16 ноября 1843 года зафиксировал волю Николая I: разрешить чеченцам обратное поселение на правом берегу Сунжи близ имперских укреплений «не иначе как большими аулами, для приспособления их к обороне несколько самостоятельно и удобнейшего удержания жителей в повиновении, имея при том в виду впоследствии времени, обратить их в казачее сословие.
    Левый же берег Сунжи и пространство до Терека назначены для водворения казачьих станиц и снабжения их землею»(Citation: 126).
    Норма закрепила двойное отчуждение: жить у своих рек чеченцам позволялось только большими аулами под пушками укреплений, а левобережье Сунжи до Терека отписывалось казакам.
    Уцелевших жителей Малой Чечни империя сселяла на равнину под пушки возводимых укреплений.
    Воронцов, наместник и главнокомандующий на Кавказе, рапортом лета 1846 года фиксировал ход и заминку политики: «Переселение жителей Малой Чечни на равнину близ возводимого укрепления еще не имеет надлежащего успеха»(Citation: 126).
    У форта Ачхой к августу 1846 года уже жили переселенцы - именно между ними разрешено было поселиться семьям чеченца Топи, обещавшего служить империи тайным разведчиком в горах и проводником для войск(Citation: 126).
    Выбор места жизни заменён назначением: жить - у укрепления, на виду гарнизона.
  en: |-
    The Terek-side Chechens (inhabitants of the left bank of the Terek) who had fled to the insurgents the empire deprived forever of the right to return home.
    The "Report of the chancellery for the administration of peaceable highlanders" (not earlier than July 1841) records the directive: "to announce to the fugitive Chechens that they have forever lost the right to settle in the places they occupied before their flight"(Citation: 126); lieutenant-colonel Bekovich-Cherkassky (of a Kabardian ruling family, in Russian service, set over the Terek-side auls) "was instructed not to receive Chechens returning from flight without permission"(Citation: 126).
    By that time the houses of the twelve villages had been dismantled and carried off to the Cossack stanitsas - there was nowhere to return to, and returning was forbidden.
    The programme for the conquest of Chechnya approved by emperor Nicholas I in 1843 prescribed where and how the Chechens were permitted to live.
    War minister Chernyshev, in a report to the emperor of 16 November 1843, recorded the will of Nicholas I: to permit the Chechens to resettle on the right bank of the Sunzha near the imperial fortifications "not otherwise than in large auls, to adapt them somewhat independently for defence and for the more convenient keeping of the inhabitants in obedience, bearing in mind also in course of time to turn them into the Cossack estate.
    The left bank of the Sunzha and the expanse up to the Terek are designated for the establishment of Cossack stanitsas and their supply with land"(Citation: 126).
    The norm fixed a double dispossession: the Chechens were allowed to live by their own rivers only in large auls under the guns of the fortifications, while the left bank of the Sunzha up to the Terek was signed over to the Cossacks.
    The surviving inhabitants of Lesser Chechnya the empire resettled onto the plain under the guns of the fortifications being built.
    Vorontsov, viceroy and commander-in-chief in the Caucasus, in a report of summer 1846 recorded the course and the hitch of the policy: "The resettlement of the inhabitants of Lesser Chechnya onto the plain near the fortification under construction does not yet have proper success"(Citation: 126).
    By August 1846 resettlers were already living by fort Achkhoy - it was among them that the families of the Chechen Topi, who had promised to serve the empire as a secret scout in the mountains and a guide for its troops, were permitted to settle(Citation: 126).
    The choice of where to live was replaced by assignment: to live by the fortification, in view of the garrison.
  uk: |-
    Надтеречних чеченців (жителів лівого берега Терека), що втекли до повсталих, імперія назавжди позбавила права повернутися додому.
    «Доповідь канцелярії з управління мирними горцями» (не раніше липня 1841 року) фіксує розпорядження: «чеченцям-утікачам оголосити, що вони назавжди позбулися права селитися на місцях, які займали до втечі»(Citation: 126); підполковнику Бековичу-Черкаському (з кабардинського володарського роду, на російській службі, приставленому до надтеречних аулів) «приписано було чеченців, що повертаються з утечі, без дозволу не приймати»(Citation: 126).
    Доми дванадцяти сіл на той час були розібрані та вивезені в козачі станиці - повертатися не було куди і заборонено.
    Програма завоювання Чечні, затверджена імператором Миколою I у 1843 році, прописала, де і як чеченцям дозволено жити.
    Військовий міністр Чернишов доповіддю імператору від 16 листопада 1843 року зафіксував волю Миколи I: дозволити чеченцям зворотне поселення на правому березі Сунжі біля імперських укріплень «не інакше як великими аулами, для пристосування їх до оборони дещо самостійно і зручнішого утримання жителів у покорі, маючи при тому на увазі згодом обернути їх у козаче сословіє.
    Лівий же берег Сунжі і простір до Терека призначені для поселення козачих станиць і постачання їх землею»(Citation: 126).
    Норма закріпила подвійне відчуження: жити біля своїх річок чеченцям дозволялося тільки великими аулами під гарматами укріплень, а лівобережжя Сунжі до Терека відписувалося козакам.
    Уцілілих жителів Малої Чечні імперія зселяла на рівнину під гармати споруджуваних укріплень.
    Воронцов, намісник і головнокомандувач на Кавказі, рапортом літа 1846 року фіксував хід і заминку політики: «Переселення жителів Малої Чечні на рівнину біля споруджуваного укріплення ще не має належного успіху»(Citation: 126).
    Біля форту Ачхой до серпня 1846 року вже жили переселенці - саме між ними дозволено було поселитися сім'ям чеченця Топі, який обіцяв служити імперії таємним розвідником у горах і провідником для військ(Citation: 126).
    Вибір місця життя замінено призначенням: жити - біля укріплення, на виду гарнізону.
