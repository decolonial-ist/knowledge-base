description:
  ru: |-
    С прорубленных просек и новых укреплений имперские отряды налетали на чеченские аулы, грабя и сжигая их.
    Историк Н. И. Покровский описывает практику 1846 года: «русские войска систематически вырубают леса для проведения широких стратегических дорог... и царские отряды время от времени налетают на аулы, грабят и жгут их»(Citation: 129).
    Грабёж здесь - не эксцесс, а регулярный режим действий войск с линии.
  en: |-
    From the cut clearings and the new fortifications imperial detachments swooped on the Chechen auls, plundering and burning them.
    Historian N. I. Pokrovsky describes the practice of 1846: "Russian troops systematically fell the forests to run wide strategic roads... and the tsarist detachments from time to time swoop on the auls, plunder and burn them"(Citation: 129).
    The plunder here is not an excess but the regular mode of operations of the troops from the line.
  uk: |-
    З прорубаних просік і нових укріплень імперські загони налітали на чеченські аули, грабуючи та палячи їх.
    Історик Н. І. Покровський описує практику 1846 року: «російські війська систематично вирубують ліси для проведення широких стратегічних доріг... і царські загони час від часу налітають на аули, грабують і палять їх»(Citation: 129).
    Грабіж тут - не ексцес, а регулярний режим дій військ з лінії.
