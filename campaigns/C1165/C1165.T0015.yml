description:
  en: |-
    The bribery of the highland elite the empire put on a programmatic footing.
    War minister Chernyshev, in a secret letter to general Golovin, commander of the Separate Caucasus Corps (head of the empire's troops and administration in the Caucasus), of 19 July 1842, proposed adopting the experience of British India: "The English knew how to establish their dominion in India by political means...
    Should not we too try this system?"(Citation: 126).
    Golovin, in a reply of 28 August 1842, drew up a list of candidates for buying over from the circle of Shamil (the imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest) and requested a fund: "By inclining to our side some of the above-mentioned persons, one would greatly weaken the union of muridism...
    I consider it necessary for the chief authority here to have at its disposal up to 15 thousand chervonets in ready money" (chervonets - a gold coin of the empire; muridism - in the imperial lexicon, the highlanders' resistance movement)(Citation: 126).
    On 1 February 1844 emperor Nicholas I approved the fund above the request: by an official service letter of Chernyshev to general Neidhardt, who had replaced Golovin at the head of the empire's troops in the Caucasus, "concerning your designs for secret dealings with the highlanders" it was commanded "instead of the 10 thousand chervonets you requested for this purpose, to assign to your charge 15 thousand chervonets"(Citation: 126).
    For the Dargo expedition of 1845 (the imperial army's march on Shamil's residence, the aul of Dargo) historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov record a separate fund: "for the bribery of influential persons from among the highlanders, 45 thousand rubles in silver were allocated"(Citation: 125).
    On the Sunzha Line under construction (the chain of imperial Cossack stanitsas and fortifications on the Sunzha river) the empire bought the loyalty of individual Chechen elders.
    Vorontsov, viceroy and commander-in-chief in the Caucasus, wrote in a report of summer 1846 about the elder of the aul of Natkhoy-Kezhu: "I turned my particular attention to attracting Aldumov to our side.
    For the losses borne by him and his 4 comrades...
    I would consider it just to assign a reward"(Citation: 126).
  uk: |-
    Підкуп горської верхівки імперія поставила на програмну основу.
    Військовий міністр Чернишов таємним листом генералу Головіну, командиру Окремого Кавказького корпусу (главі імперських військ і адміністрації на Кавказі), від 19 липня 1842 року запропонував перейняти досвід британської Індії: «Англійці вміли утвердити панування своє в Індії політичними засобами...
    Чи не повинні й ми випробувати цю систему?»(Citation: 126).
    Головін листом-відповіддю від 28 серпня 1842 року склав список кандидатів на перекупівлю з оточення Шаміля (імама, керівника опору горців Дагестану і Чечні російському завоюванню) і запросив фонд: «Схиленням на наш бік деяких із вищезгаданих осіб багато послабив би союз мюридства... я вважаю за необхідне мати в розпорядженні головного тут начальства до 15 тис. червінців готової суми» (червінець - золота монета імперії; мюридство - в імперському лексиконі рух опору горців)(Citation: 126). 1 лютого 1844 року імператор Микола I затвердив фонд з перевищенням запиту: офіційним службовим листом Чернишова генералу Нейдгардту, який змінив Головіна на чолі імперських військ на Кавказі, «про види ваші для таємних зносин з горцями» повелено «замість прошених вами на цей предмет 10 тисяч червінців асигнувати у відання ваше 15 тисяч червінців»(Citation: 126).
    До Даргінської експедиції 1845 року (походу імперської армії на резиденцію Шаміля аул Дарго) історики Я. З. Ахмадов і Е. Х. Хасмагомадов фіксують окремий фонд: «для підкупу впливових осіб з горців було виділено 45 тисяч рублів сріблом»(Citation: 125).
    На Сунженській лінії, що будувалася (ланцюгу імперських козацьких станиць і укріплень на річці Сунжі), імперія купувала лояльність окремих чеченських старшин.
    Воронцов, намісник і головнокомандувач на Кавказі, писав у рапорті літа 1846 року про старшину аулу Натхой-Кежу: «я звернув особливу мою увагу, щоб привернути Алдумова на користь нашу.
    За понесені ж ним втрати і 4 товаришами його... я вважав би справедливим призначити винагороду»(Citation: 126).
  ru: |-
    Подкуп горской верхушки империя поставила на программную основу.
    Военный министр Чернышев секретным письмом генералу Головину, командиру Отдельного Кавказского корпуса (главе имперских войск и администрации на Кавказе), от 19 июля 1842 года предложил перенять опыт британской Индии: «Англичане умели утвердить владычество свое в Индии политическими средствами...
    Не должны ли и мы испытать эту систему?»(Citation: 126).
    Головин ответным письмом от 28 августа 1842 года составил список кандидатов на перекупку из окружения Шамиля (имама, руководителя сопротивления горцев Дагестана и Чечни российскому завоеванию) и запросил фонд: «Склонением на нашу сторону некоторых из выше упомянутых лиц, много бы ослабил союз мюридства... я полагаю необходимым иметь в распоряжении главного здесь начальства до 15 тыс. червонцев готовой суммы» (червонец - золотая монета империи; мюридство - в имперском лексиконе движение сопротивления горцев)(Citation: 126). 1 февраля 1844 года император Николай I утвердил фонд с превышением запроса: официальным служебным письмом Чернышева генералу Нейдгардту, сменившему Головина во главе имперских войск на Кавказе, «о видах ваших для тайных сношений с горцами» повелено «вместо просимых вами на сей предмет 10 тысяч червонцев ассигновать в ведение ваше 15 тысяч червонцев»(Citation: 126).
    К Даргинской экспедиции 1845 года (походу имперской армии на резиденцию Шамиля аул Дарго) историки Я. З. Ахмадов и Э. Х. Хасмагомадов фиксируют отдельный фонд: «для подкупа влиятельных лиц из горцев, было выделено 45 тысяч рублей серебром»(Citation: 125).
    На строящейся Сунженской линии (цепи имперских казачьих станиц и укреплений на реке Сунже) империя покупала лояльность отдельных чеченских старшин.
    Воронцов, наместник и главнокомандующий на Кавказе, писал в рапорте лета 1846 года о старшине аула Натхой-Кежу: «я обратил особенное мое внимание, чтобы привлечь Алдумова в пользу нашу.
    За понесенные же им потери и 4 товарищами его... я бы полагал справедливым назначить вознаграждение»(Citation: 126).
