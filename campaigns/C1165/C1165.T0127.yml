description:
  ru: |-
    После разорения Ауха (чеченской области на северо-востоке) летом 1841 года империя переселила лояльные ей ауховские семьи с их земли.
    Имперский историк Юров записал: «К 21-му июня в сс.
    Акташ и Юрт-Аух собралось 180 семейств; в залог покорности они доставили аманатами почетнейших лиц и отправили свои стада на пастьбу в Салатау» (аманат - человек, которого империя забирала из общины как заложника)(Citation: 134).
    При отходе войск в сентябре семьи увели с родной земли: историк Н. И. Покровский - «верные царизму ауховцы поселены в кумыкских аулах, где они быстро попали под тяжелую руку кумыкских князей»(Citation: 129).
    Давление на семьи было двусторонним: по Юрову, перешедшим к империи ауховцам грозила расправа имамата, «им оставалось одно - крепко держаться за русских»(Citation: 134) - выбор между двумя угрозами кончился потерей дома и подчинением чужим владетелям.
    Создание Сунженской линии шло через изгнание живших на ней людей.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: после решения о создании линии казачьих станиц «началось планомерное изгнание чеченцев.
    В конечном итоге самое крупное общество Малой Чечни - Карабулак - полностью лишилось своих земель» (карабулаки - вайнахское общество между Чечнёй и Ингушетией)(Citation: 125).
    Зачистка декабря 1846 года выдавливала жителей с равнины физически: имперский офицер Полторацкий, участник экспедиции, записал - «местность кругом Алдинских хуторов все пустела: аулы сжигались, и их обитатели оттеснялись дальше в леса»(Citation: 122).
  en: |-
    After the devastation of Aukh (the Chechen region in the north-east) in summer 1841 the empire resettled the Aukh families loyal to it away from their land.
    The imperial historian Yurov recorded: "By 21 June 180 families had gathered in the villages of Aktash and Yurt-Aukh; as a pledge of submission they delivered their most honoured men as amanats and sent their herds to pasture in Salatau" (amanat - a person whom the empire took from a community as a hostage)(Citation: 134).
    When the troops withdrew in September the families were led away from their native land: historian N. I. Pokrovsky - "the Aukhovites loyal to tsarism were settled in Kumyk auls, where they quickly fell under the heavy hand of the Kumyk princes"(Citation: 129).
    The pressure on the families was two-sided: according to Yurov, the Aukhovites who had gone over to the empire were threatened with reprisal by the Imamate, "one thing remained to them - to hold fast to the Russians"(Citation: 134) - a choice between two threats that ended in the loss of their home and subjection to alien lords.
    The creation of the Sunzha Line went through the expulsion of the people living on it.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: after the decision to create the line of Cossack stanitsas "the systematic expulsion of the Chechens began.
    In the end the largest community of Lesser Chechnya - Karabulak - was deprived of its lands entirely" (the Karabulaks - a Vainakh community between Chechnya and Ingushetia)(Citation: 125).
    The sweep of December 1846 squeezed the inhabitants off the plain physically: the imperial officer Poltoratsky, a participant of the expedition, recorded - "the country around the Aldy hamlets kept emptying: the auls were burned, and their inhabitants were pushed further into the forests"(Citation: 122).
  uk: |-
    Після розорення Ауху (чеченської області на північному сході) влітку 1841 року імперія переселила лояльні їй ауховські сім'ї з їхньої землі.
    Імперський історик Юров записав: «До 21-го червня в сс.
    Акташ і Юрт-Аух зібралося 180 сімейств; у заставу покірності вони доставили аманатами найпочесніших осіб і відправили свої стада на пасовище в Салатау» (аманат - людина, яку імперія забирала з громади як заручника)(Citation: 134).
    При відході військ у вересні сім'ї повели з рідної землі: історик Н. І. Покровський - «вірні царизму ауховці поселені в кумицьких аулах, де вони швидко потрапили під тяжку руку кумицьких князів»(Citation: 129).
    Тиск на сім'ї був двостороннім: за Юровим, ауховцям, що перейшли до імперії, загрожувала розправа імамату, «їм залишалося одне - міцно триматися за росіян»(Citation: 134) - вибір між двома загрозами скінчився втратою дому і підпорядкуванням чужим володарям.
    Створення Сунженської лінії йшло через вигнання людей, що на ній жили.
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: після рішення про створення лінії козачих станиць «почалося планомірне вигнання чеченців.
    У кінцевому підсумку найбільша громада Малої Чечні - Карабулак - повністю позбулася своїх земель» (карабулаки - вайнахська громада між Чечнею та Інгушетією)(Citation: 125).
    Зачистка грудня 1846 року видавлювала жителів з рівнини фізично: імперський офіцер Полторацький, учасник експедиції, записав - «місцевість довкола Алдинських хуторів усе пустіла: аули спалювалися, і їхні мешканці відтіснялися далі в ліси»(Citation: 122).
