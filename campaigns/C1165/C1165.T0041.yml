description:
  en: |-
    In Chechen villages the empire quartered its troops.
    The "Journal of military events on the left flank of the Caucasus Line" for 23 May - 6 June 1846 records: after most inhabitants of the aul of Akbulat-Yurt on the Terek had fled, ""for the protection of the remaining inhabitants of Akbulat-Yurt and in order to use the direct communication with the Kumyk plain through this aul, maj.-gen.
    Kozlovsky stationed there one company of infantry with one gun and set up there a post of 25 mounted Kumyks"" (the Kumyks - a neighbouring Turkic people from whom the empire recruited mounted guards)(Citation: 126).
    A garrison in the aul is surveillance from within: the village's life went on under the daily watch of a company with a gun.
  uk: |-
    У чеченські селища імперія ставила війська на постій.
    «Журнал военных происшествий на левом фланге Кавказской линии» за 23 травня - 6 червня 1846 року фіксує: після втечі більшості жителів аулу Акбулат-Юрт на Тереку «для охранения оставшихся жителей Акбулат-Юрта и чтобы пользоваться прямым сообщением с Кумыкской плоскостью через этот аул, ген.-м.
    Козловский расположил там одну роту пехоты при одном орудии и устроил там пост из 25 конных кумык» (кумики - сусідній тюркський народ, з якого імперія набирала кінну варту)(Citation: 126).
    Гарнізон в аулі - це нагляд зсередини: життя селища йшло під щоденним наглядом роти з гарматою.
  ru: |-
    В чеченские селения империя ставила войска на постой.
    «Журнал военных происшествий на левом фланге Кавказской линии» за 23 мая - 6 июня 1846 года фиксирует: после бегства большинства жителей аула Акбулат-Юрт на Тереке «для охранения оставшихся жителей Акбулат-Юрта и чтобы пользоваться прямым сообщением с Кумыкской плоскостью через этот аул, ген.-м.
    Козловский расположил там одну роту пехоты при одном орудии и устроил там пост из 25 конных кумык» (кумыки - соседний тюркский народ, из которого империя набирала конную стражу)(Citation: 126).
    Гарнизон в ауле - это надзор изнутри: жизнь селения шла под ежедневным присмотром роты с орудием.
