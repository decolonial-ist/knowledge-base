description:
  ru: |-
    Против Чечни империя мобилизовала другие завоёванные ею народы Кавказа.
    В составе армии Воронцова, наместника на Кавказе, в Даргинском походе 1845 года историки Я. З. Ахмадов и Э. Х. Хасмагомадов считают «1 тысячу человек грузинской милиции, 16 сотен казаков и горской милиции (кабардинской и осетинской)» (милиция - вооружённые отряды горцев и грузин на службе империи)(Citation: 125).
    Колонизированные народы империя ставила в строй против соседей - чтобы кавказцы воевали с кавказцами за имперское завоевание.
  en: |-
    Against Chechnya the empire mobilised the other peoples of the Caucasus it had conquered.
    In the army of Vorontsov, viceroy in the Caucasus, in the Dargo march of 1845 historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov count "1 thousand men of the Georgian militia, 16 sotnias of Cossacks and highland militia (Kabardian and Ossetian)" (militia - armed detachments of highlanders and Georgians in the empire's service)(Citation: 125).
    The colonised peoples the empire put into the ranks against their neighbours - so that Caucasians would fight Caucasians for the imperial conquest.
  uk: |-
    Проти Чечні імперія мобілізувала інші завойовані нею народи Кавказу.
    У складі армії Воронцова, намісника на Кавказі, в Даргінському поході 1845 року історики Я. З. Ахмадов і Е. Х. Хасмагомадов рахують «1 тисячу осіб грузинської міліції, 16 сотень козаків і горської міліції (кабардинської та осетинської)» (міліція - озброєні загони горців і грузинів на службі імперії)(Citation: 125).
    Колонізовані народи імперія ставила в стрій проти сусідів - щоб кавказці воювали з кавказцями за імперське завоювання.
