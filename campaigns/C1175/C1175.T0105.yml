description:
  ru: 'Российская империя в 1911 году снесла чеченские хутора двух округов: «Был начат насильственный снос всех «самовольно» построенных (а иных здесь не было) хуторов в Веденском и Грозненском округах»(Citation: 125); чеченские хутора «неоднократно сносились, в том числе и под предлогом «наказания» за укрывательство абреков»(Citation: 125).'
  en: 'In 1911 the Russian Empire demolished the Chechen hamlets of two okrugs: "A forcible demolition was begun of all the hamlets built ''without permission'' (and there were no others here) in the Vedeno and Grozny okrugs"(Citation: 125); Chechen hamlets "were repeatedly demolished, including under the pretext of ''punishment'' for sheltering abreks"(Citation: 125).'
  uk: 'Російська імперія в 1911 році знесла чеченські хутори двох округів: «Було розпочато насильницьке знесення всіх «самовільно» побудованих (а інших тут не було) хуторів у Веденському і Грозненському округах»(Citation: 125); чеченські хутори «неодноразово зносилися, зокрема й під приводом «покарання» за переховування абреків»(Citation: 125).'
