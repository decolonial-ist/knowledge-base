description:
  en: |-
    On 10 October 1905, at the Grozny market, the troops of the Russian Empire fired not at the pogromists but at the Chechens whom armed reservists were attacking: historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that the soldiers of the Shirvansky regiment, led by Colonel Popov, used their weapons, "...shooting the hiding Chechens, hunting them down in attics and cellars, while the reservists and hooligans smashed and looted shops before the eyes of the authorities"; by the historians' count, 27 Chechens were harmed in the pogrom, of whom 17 were killed(Citation: 125).
  uk: '10 жовтня 1905 року на грозненському ринку війська Російської імперії стріляли не по погромниках, а по чеченцях, яких громили озброєні запасні: історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що солдати Ширванського полку на чолі з полковником Поповим застосували зброю, «...розстрілюючи чеченців, які ховалися, розшукуючи їх по горищах і підвалах, у той час як запасні та хулігани громили і грабували на очах у начальства магазини»; за підрахунком істориків, у ході погрому постраждало 27 чеченців, з яких 17 було вбито(Citation: 125).'
  ru: '10 октября 1905 года на грозненском рынке войска Российской империи стреляли не по погромщикам, а по чеченцам, которых громили вооружённые запасные: историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что солдаты Ширванского полка во главе с полковником Поповым применили оружие, «...расстреливая прятавшихся чеченцев, разыскивая их по чердакам и подвалам, в то время как запасные и хулиганы громили и грабили на глазах у начальства магазины»; по подсчёту историков, в ходе погрома пострадало 27 чеченцев, из которых 17 были убиты(Citation: 125).'
