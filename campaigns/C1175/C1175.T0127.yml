description:
  ru: |-
    Российская империя к 1913 году арестовала и выслала из Терской области тысячи людей «по обвинению в укрывательстве абрека»(Citation: 125).
    «В ходе подавления выступлений в горной части Чечни были высланы сотни крестьян из одного только Веденского округа.
    В результате большое количество семей лишились главных кормильцев и оказались на грани нищеты» - часть добычи Зелимхан тратил на поддержку семей высланных(Citation: 125).
  en: |-
    By 1913 the Russian Empire had arrested and exiled from the Terek oblast thousands of people "on the charge of sheltering the abrek"(Citation: 125).
    "In the course of suppressing the actions in the mountainous part of Chechnya, hundreds of peasants were exiled from the Vedeno okrug alone.
    As a result a great number of families lost their main breadwinners and found themselves on the brink of destitution" - part of his takings Zelimkhan spent on supporting the families of the exiled(Citation: 125).
  uk: |-
    Російська імперія до 1913 року заарештувала і вислала з Терської області тисячі людей «за звинуваченням у переховуванні абрека»(Citation: 125).
    «У ході придушення виступів у гірській частині Чечні були вислані сотні селян з одного лише Веденського округу.
    У результаті велика кількість сімей позбулися головних годувальників і опинилися на межі злиднів» - частину здобичі Зелімхан витрачав на підтримку сімей висланих(Citation: 125).
