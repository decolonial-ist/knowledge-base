description:
  ru: |-
    В конце 1906 года карательный отряд Российской империи с артиллерией и казаками восстанавливал власть в Веденском округе: «селения Нижалой, Нохч-Келой, Хой и Макажой, жители которых упорно отказывались подчиняться, были подвергнуты артиллерийскому обстрелу»; отмечалось, что в результате карательной экспедиции «...большая часть населения Веденского округа, охваченная паникой, бежала в горы, где терпит голод и холод»; арестованы несколько сот человек, большинство осуждено и сослано(Citation: 125).
    В августе 1908 года «экзекуции» с массовыми обысками подверглось селение Цацан-Юрт(Citation: 125).
  en: |-
    At the end of 1906 a punitive detachment of the Russian Empire, with artillery and Cossacks, was restoring imperial power in the Vedeno okrug: "the villages of Nizhaloy, Nokhch-Keloy, Khoy and Makazhoy, whose residents stubbornly refused to submit, were subjected to artillery bombardment"; it was noted that as a result of the punitive expedition "...the greater part of the population of the Vedeno okrug, seized by panic, fled to the mountains, where it suffers hunger and cold"; several hundred people were arrested, most of them convicted and exiled(Citation: 125).
    In August 1908 the village of Tsatsan-Yurt was subjected to an "execution" with mass searches(Citation: 125).
  uk: |-
    Наприкінці 1906 року каральний загін Російської імперії з артилерією і козаками відновлював владу у Веденському окрузі: «селища Ніжалой, Нохч-Келой, Хой і Макажой, жителі яких уперто відмовлялися підкорятися, були піддані артилерійському обстрілу»; зазначалося, що в результаті каральної експедиції «...більша частина населення Веденського округу, охоплена панікою, втекла в гори, де терпить голод і холод»; заарештовано кілька сотень людей, більшість засуджено і заслано(Citation: 125).
    У серпні 1908 року «екзекуції» з масовими обшуками зазнало селище Цацан-Юрт(Citation: 125).
