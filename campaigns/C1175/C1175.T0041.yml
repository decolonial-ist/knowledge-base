description:
  en: |-
    In 1911 the Russian Empire appointed "government elders" in the zone of Zelimkhan's operations and put troops on the residents' own upkeep: "Military teams were sent to be quartered in the villages of Kharachoy, Dyshne-Vedeno, Mekhkety, Zavirkhi, Khattuni, Eshelkhotoy, Elistandzhi, Tauzen, Isti-Su, Mayrtup, Khoy, Ikharoy, Rigakhoy, Makazhoy, Avtury and the Varanda hamlets"(Citation: 125).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write of this practice: "the sending of military units into Chechen villages was widely practiced, and their upkeep lay as a heavy burden on the local residents"(Citation: 125).
  uk: |-
    Російська імперія в 1911 році призначила в зоні дій Зелімхана «урядових старшин» і поставила війська на утримання самих жителів: «У селища Харачой, Дишне-Ведено, Мехкети, Завірхі, Хаттуні, Ешелхотой, Елістанджі, Таузень, Істі-Су, Майртуп, Хой, Іхарой, Рігахой, Макажой, Автури і Варандинські хутори направлено на постій військові команди»(Citation: 125).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть про цю практику: «широко практикувалося направлення в чеченські селища військових підрозділів, утримання яких тяжким тягарем лягало на місцевих жителів»(Citation: 125).
  ru: |-
    Российская империя в 1911 году назначила в зоне действий Зелимхана «правительственных старшин» и поставила войска на содержание самих жителей: «В селения Харачой, Дышне-Ведено, Мехкеты, Завирхи, Хаттуни, Эшелхотой, Элистанджи, Таузень, Исти-Су, Майртуп, Хой, Ихарой, Ригахой, Макажой, Автуры и Варандинские хутора направлены на постой воинские команды»(Citation: 125).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут об этой практике: «широко практиковалось направление в чеченские селения воинских подразделений, содержание которых тяжелым бременем ложилось на местных жителей»(Citation: 125).
