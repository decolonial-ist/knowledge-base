description:
  ru: |-
    Военная директива Российской империи конца 1907 года предписывала командующему бригадой, стоявшей в Грозненском и Веденском округах, в случае восстания «...действовать с полной энергией, рассеивая банды до полного уничтожения, а равно стирая с лица земли укрывавшие их селения, памятуя, что такой способ не только будет более действенен, но и более гуманен»(Citation: 125).
    Предписанное исполняли.
    В августе 1908 года «экзекуции» с массовыми обысками подверглось селение Цацан-Юрт, с жителей которого взыскали «контрибуцию» за несданное оружие - 7 тысяч рублей(Citation: 125).
    В 1911 году в Веденском и Грозненском округах снесли все хутора, построенные «самовольно», а с чеченского населения обоих округов взыскали 100 тысяч рублей в пользу пострадавших «...во время нападения шайки Зелимхана»(Citation: 125).
    Людей из окружения абрека убивали и вешали: повешен Саламбек Гороводжиев, в марте 1911 года в Старых Атагах убит Аюб Томаев(Citation: 125).
    Преследовали и за слово: «Строжайшим образом была запрещена любая пропаганда, подрывающая авторитет правительства и местных властей», нарушителю грозило до трёх лет тюрьмы или штраф до 3 тысяч рублей(Citation: 125).
  en: |-
    A military directive of the Russian Empire of late 1907 prescribed to the commander of the brigade stationed in the Grozny and Vedeno okrugs, in the event of an uprising, "...to act with full energy, scattering the bands to the point of total annihilation, and likewise wiping off the face of the earth the villages that sheltered them, bearing in mind that such a method will be not only more effective but also more humane"(Citation: 125).
    The prescription was carried out.
    In August 1908 the village of Tsatsan-Yurt was subjected to an "execution" with mass searches, and its residents had a "contribution" for undelivered weapons exacted from them - 7 thousand rubles(Citation: 125).
    In 1911, in the Vedeno and Grozny okrugs, all hamlets built "without permission" were demolished, and 100 thousand rubles were exacted from the Chechen population of both okrugs in favor of those who had suffered "...during the attack of Zelimkhan's band"(Citation: 125).
    People from the abrek's circle were killed and hanged: Salambek Gorovodzhiev was hanged; in March 1911 Ayub Tomayev was killed in Starye Atagi(Citation: 125).
    Speech was persecuted in the same manner: "Any propaganda undermining the authority of the government and the local authorities was prohibited in the strictest way", and the offender faced up to three years of prison or a fine of up to 3 thousand rubles(Citation: 125).
  uk: |-
    Військова директива Російської імперії кінця 1907 року приписувала командувачу бригади, що стояла в Грозненському і Веденському округах, у разі повстання «...діяти з повною енергією, розсіюючи банди до повного знищення, а так само стираючи з лиця землі селища, що їх переховували, пам'ятаючи, що такий спосіб не тільки буде дієвішим, а й гуманнішим»(Citation: 125).
    Приписане виконували.
    У серпні 1908 року «екзекуції» з масовими обшуками зазнало селище Цацан-Юрт, з жителів якого стягнули «контрибуцію» за нездану зброю - 7 тисяч рублів(Citation: 125).
    У 1911 році у Веденському і Грозненському округах знесли всі хутори, побудовані «самовільно», а з чеченського населення обох округів стягнули 100 тисяч рублів на користь постраждалих «...під час нападу зграї Зелімхана»(Citation: 125).
    Людей з оточення абрека вбивали і вішали: повішено Саламбека Гороводжиєва, у березні 1911 року в Старих Атагах убито Аюба Томаєва(Citation: 125).
    Переслідували і за слово: «Найсуворішим чином була заборонена будь-яка пропаганда, що підриває авторитет уряду і місцевої влади», порушнику загрожувало до трьох років тюрми або штраф до 3 тисяч рублів(Citation: 125).
