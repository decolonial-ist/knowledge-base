description:
  en: |-
    On 24 October 1905 the Russian Empire imposed martial law "in the Grozny, Vedeno and Khasav-Yurt okrugs of the Terek oblast, that is, in the whole of Chechnya", and on 23 December extended it to the entire oblast(Citation: 125).
    The weapons ban "applied exclusively to the highlanders and the out-of-town settlers and did not extend to the Cossacks.
    Moreover... the Viceroy of the Caucasus ordered that 10 thousand single-shot Berdan rifles and a million cartridges be distributed to the Cossacks of the Terek oblast free of charge"(Citation: 125).
    On 22 June 1909 martial law was lifted - but "in the Terek oblast a 'state of reinforced protection' was introduced at the same time", whose ordinances "effectively reduced to 'nought' the democratic rights and freedoms 'granted' by the imperial decree of 17 October 1905"(Citation: 125).
  uk: |-
    Російська імперія 24 жовтня 1905 року ввела воєнне положення «у Грозненському, Веденському і Хасав-Юртівському округах Терської області, тобто в усій Чечні», а 23 грудня поширила його на всю область(Citation: 125).
    Заборона зброї «стосувалася виключно горців та іногородніх і не поширювалася на козаків.
    Ба більше... намісник Кавказу розпорядився безплатно роздати козакам Терської області 10 тисяч однозарядних гвинтівок-берданок і мільйон патронів»(Citation: 125). 22 червня 1909 року воєнне положення скасовано - але «в Терській області одночасно вводився «стан посиленої охорони»», розпорядження якого «фактично звели на «ніщо» демократичні права і свободи, «даровані» імператорським указом від 17 жовтня 1905 р.»(Citation: 125).
  ru: |-
    Российская империя 24 октября 1905 года ввела военное положение «в Грозненском, Веденском и Хасав-Юртовском округах Терской области, т. е. во всей Чечне», а 23 декабря распространила его на всю область(Citation: 125).
    Запрет оружия «относился исключительно к горцам и иногородним и не распространялся на казаков.
    Более того... наместник Кавказа распорядился бесплатно раздать казакам Терской области 10 тысяч однозарядных винтовок-берданок и миллион патронов»(Citation: 125). 22 июня 1909 года военное положение отменено - но «в Терской области одновременно вводилось «состояние усиленной охраны»», распоряжения которого «фактически свели на «нет» демократические права и свободы, «дарованные» императорским указом от 17 октября 1905 г.»(Citation: 125).
