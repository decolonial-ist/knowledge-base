description:
  ru: |-
    В январе 1908 года начальник Терской области секретным циркуляром предписал «установить секретный надзор за деятельностью мусульманского духовенства, «...а равно за появлением эмиссаров из Турции»»(Citation: 125).
    В 1911 году «российские власти пошли на беспрецедентный шаг - в 1911 г. из Терской области высланы в административном порядке сразу восемь шейхов, как кадырийского, так и накшбандийского тарикатов (шейх - духовный наставник, тарикат - религиозное братство учеников вокруг такого наставника)...
    Главный покровитель Зелимхана - Баматгири-хаджи Митаев, а также ингушский шейх Батал-хаджи Белхороев, умерли в ссылке»(Citation: 125).
  en: |-
    In January 1908 the head of the Terek oblast, by a secret circular, ordered "to establish secret surveillance over the activity of the Muslim clergy, '...and likewise over the appearance of emissaries from Turkey'"(Citation: 125).
    In 1911 "the Russian authorities took an unprecedented step - in 1911 eight sheikhs at once, of both the Qadiri and the Naqshbandi tariqats, were exiled from the Terek oblast by administrative order (a sheikh is a spiritual mentor; a tariqat is a religious brotherhood of disciples around such a mentor)...
    Zelimkhan's chief protector - Bamatgiri-Haji Mitayev, as well as the Ingush sheikh Batal-Haji Belkhoroyev, died in exile"(Citation: 125).
  uk: |-
    У січні 1908 року начальник Терської області секретним циркуляром приписав «установити секретний нагляд за діяльністю мусульманського духовенства, «...а так само за появою емісарів із Туреччини»»(Citation: 125).
    У 1911 році «російська влада пішла на безпрецедентний крок - у 1911 р. з Терської області вислано в адміністративному порядку одразу вісім шейхів, як кадирійського, так і накшбандійського тарикатів (шейх - духовний наставник, тарикат - релігійне братство учнів навколо такого наставника)...
    Головний покровитель Зелімхана - Баматгірі-хаджі Мітаєв, а також інгуський шейх Батал-хаджі Белхороєв, померли на засланні»(Citation: 125).
