description:
  ru: |-
    Московское царство физически и юридически изолировало автономию от участия в международной политике, решая судьбу казацких земель без учета их национальных интересов: «Полномочные представители Украинского казацкого государства во главе с Р.Гапоненко не были допущены за стол переговоров»(Citation: 185).
    Просьбу гетмана дать послам мандаты полноправных участников царское правительство «пропустило мимо ушей»: делегаты «сидели без дела возле комиссаров, не допущенные к официальным переговорам»(Citation: 249).
  en: |-
    The Tsardom of Muscovy physically and legally isolated the autonomy from participation in international politics, deciding the fate of the Cossack lands without regard for their national interests: "The plenipotentiary representatives of the Ukrainian Cossack state, headed by R. Haponenko, were not admitted to the negotiating table"(Citation: 185).
    The hetman's request to grant the envoys mandates as full participants was "let pass unheeded" by the tsar's government: the delegates "sat idle beside the commissioners, not admitted to the official sessions"(Citation: 249).
  uk: |-
    Московське царство фізично та юридично ізолювало автономію від участі в міжнародній політиці, вирішуючи долю козацьких земель без урахування їхніх національних інтересів: «Повноважні представники Укр. козац. д-ви на чолі з Р.Гапоненком не були допущені за стіл переговорів»(Citation: 185).
    Прохання гетьмана дати послам мандати повноправних учасників царський уряд «пустив повз уха»: делегати «сиділи бездільно коло комісарів і не допущені до офіційних нарад»(Citation: 249).
