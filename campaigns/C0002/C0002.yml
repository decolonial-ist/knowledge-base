name:
  en: Truce of Vilna (1656)
  uk: Віленське перемир'я (1656)
  ru: Виленское перемирие (1656)
description:
  en: |-
    Separate peace negotiations between Moscow and the Polish-Lithuanian Commonwealth on ending the war and dividing spheres of influence, held in complete isolation from the Ukrainian side: "The plenipotentiary representatives of the Ukrainian Cossack state, headed by R. Haponenko, were not admitted to the negotiating table"(Citation: 185).
    The hetman asked that the Cossack envoys be given mandates as full participants of the congress - "but the tsar's government once again let this request pass unheeded," and the delegates "sat idle beside the commissioners, not admitted to the official sessions"(Citation: 249).
  uk: |-
    Сепаратні мирні переговори між Москвою та Річчю Посполитою про закінчення війни й поділ сфер впливу, що пройшли в повній ізоляції української сторони: «Повноважні представники Укр. козац. д-ви на чолі з Р.Гапоненком не були допущені за стіл переговорів»(Citation: 185).
    Гетьман просив дати козацьким послам мандати повноправних учасників з'їзду - «але царський уряд знову пустив се проханнє повз уха», і делегати «сиділи бездільно коло комісарів і не допущені до офіційних нарад»(Citation: 249).
  ru: |-
    Сепаратные мирные переговоры между Москвой и Речью Посполитой об окончании войны и разделе сфер влияния, прошедшие в полной изоляции украинской стороны: «Полномочные представители Украинского казацкого государства во главе с Р.Гапоненко не были допущены за стол переговоров»(Citation: 185).
    Гетман просил дать казацким послам мандаты полноправных участников съезда - «но царское правительство вновь пропустило эту просьбу мимо ушей», и делегаты «сидели без дела возле комиссаров, не допущенные к официальным переговорам»(Citation: 249).
