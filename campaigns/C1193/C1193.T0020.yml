description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Российские спецслужбы и армия давали марионеточной оппозиции деньги, оружие, инструкторов, танкистов и лётчиков, чтобы свергнуть Джохара Дудаева, избранного президента Чеченской Республики.

    Летом 1994 года министерство России по делам национальностей и ФСК (предшественница современной ФСБ) помогали марионеточной оппозиции набирать вооружённых бойцов в Знаменском, селе на северо-западе Ичкерии, и в Урус-Мартане, городе к юго-западу от Грозного(Citation: 27).
    Россия выделила больше 150 миллиардов рублей Временному совету, руководству марионеточной оппозиции, которое та утвердила на съезде 3 июня.
    ФСК в аналитической справке назвала главу Временного совета самым подходящим для поддержки(Citation: 27).

    3 сентября 1994 года правительство России в обращении к чеченскому народу предложило Джохару Дудаеву уйти в отставку(Citation: 27).

    5 сентября 1994 года Генеральный штаб российской армии приказал передать Временному совету 10 бронетранспортёров и 6 боевых вертолётов с экипажами(Citation: 27).
    С этих вертолётов российские лётчики обстреливали ракетами жилые дома Ичкерии (подробнее: «Неизбирательные нападения»).
    В ноябре российская армия передала совету танки(Citation: 27)(Citation: 1045).

    В сентябре и октябре 1994 года российские офицеры учили больше ста бойцов Временного совета водить танки Т-62 и стрелять из армейских миномётов на полигоне «Прудбой» под Волгоградом, городом на юге России(Citation: 1042)(Citation: 27).

    В октябре 1994 года начальник московского управления ФСК Савостьянов велел найти для Временного совета российских солдат и офицеров, которые умеют обслуживать бронетехнику и воевать на ней.
    Военная контрразведка ФСК подбирала кандидатов(Citation: 1086).
    С 3 по 9 ноября офицеры ФСК ездили по воинским частям под Москвой и заключали с танкистами контракты(Citation: 27)(Citation: 1086).

    В ноябре 1994 года начальник Генерального штаба российской армии Колесников разрешил отправить завербованных на Кавказ.
    Заместитель министра России по делам национальностей Котенков руководил отправкой, и к 16 ноября завербованных привезли в Моздок, город в подконтрольной России Северной Осетии у границы Чеченской Республики(Citation: 27).
    Россия отрицала, что посылала своих военных воевать за Временный совет (подробнее: «Ложь о собственных действиях»).

    Осенью 1994 года сотрудники ФСК воевали на стороне марионеточной оппозиции(Citation: 27).

    С сентября 1994 года, до штурма Грозного 26 ноября, бойцы Временного совета и российские экипажи нападали на Ичкерию. 2 сентября бойцы совета и колонна из двенадцати танков с российскими экипажами напали на Грозный.
    Вооружённые силы Ичкерии остановили их у посёлка Долинский, к северо-западу от Грозного, подбили танк и захватили в плен восемь человек, среди них, по первым данным, российских военных(Citation: 717)(Citation: 729)(Citation: 26)(Citation: 27)(Citation: 710)(Citation: 1338). 30 сентября российские лётчики с четырёх вертолётов Временного совета обстреляли ракетами аэропорт «Северный» в Грозном и уничтожили пять гражданских самолётов и два самолёта армии Ичкерии, а бойцы марионеточной оппозиции перекрыли въезды в город(Citation: 27)(Citation: 1068)(Citation: 1039).
    Джохар Дудаев отверг ультиматум Временного совета сдаться за шесть часов, и бойцы совета разошлись, не напав на Грозный(Citation: 1068)(Citation: 1043). 15 октября бойцы Временного совета штурмовали Грозный с юга и с севера, и Вооружённые силы Ичкерии отбили штурм.
    Защитники захватили в плен несколько десятков нападавших, среди них, по разным данным, от 12 до 15 российских офицеров(Citation: 1043), а 16 октября бойцы совета отступили на свои базы, в Знаменское и в Гехи, село к юго-западу от Грозного(Citation: 27).

    17 ноября 1994 года, за девять дней до штурма Грозного, группа российских офицеров во главе с начальником Генерального штаба Колесниковым прилетела из Москвы в Моздок(Citation: 27).
    Валерий Яков, специальный корреспондент московской газеты «Известия», в ноябре 1996 года писал о подготовке штурма: «Там, в Моздоке, на базе „Арсенал“ контрактники [завербованные российские военные]… обучали чеченские экипажи [Временного совета]…
    Всего контрактники получили 40 абсолютно новых танков, из них 16 машин были с „русскими“ экипажами»(Citation: 727)(Citation: 1086). 26 ноября бойцы Временного совета и российские танкисты под командованием Жукова, заместителя командира российского армейского корпуса из Волгограда, штурмовали Грозный(Citation: 27)(Citation: 1086).
    Зелимхан Яндарбиев, вице-президент Чеченской Республики, писал в воспоминаниях, что утром увидел начало штурма из окна своего кабинета в президентском дворце: «на северо-восточной окраине города, со стороны Толстой-Юрта [села к северу от Грозного, где стояли бойцы Временного совета], загромыхали танково-артиллерийские выстрелы»(Citation: 713).
    Танки дошли до центра Грозного, где бойцы Вооружённых сил Ичкерии расстреливали их из гранатомётов(Citation: 27).
    Защитники разбили нападавших и, по данным правительства Чеченской Республики, захватили в плен 68 российских военных(Citation: 1071).
    Среди пленных были солдаты и офицеры российской Кантемировской танковой дивизии из-под Москвы(Citation: 1085).

    Правозащитники «Мемориала» пишут, что без военной помощи России марионеточная оппозиция не могла свергнуть Джохара Дудаева(Citation: 27).

    После поражения 26 ноября Временный совет отвёл бойцов на базы(Citation: 1127)(Citation: 27).
    Через пятнадцать дней, 11 декабря 1994 года, российская армия открыто вторглась в Чеченскую Республику Ичкерия (подробнее: «Военная интервенция»)(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Russian special services and the army gave the puppet opposition money, weapons, instructors, tank crewmen and pilots in order to overthrow Dzhokhar Dudayev, the elected president of the Chechen Republic.

    In the summer of 1994, Russia's Ministry for Nationalities Affairs and the FSK (a predecessor of today's FSB) helped the puppet opposition recruit armed fighters in Znamenskoye, a village in the northwest of Ichkeria, and in Urus-Martan, a town southwest of Grozny(Citation: 27).
    Russia allocated more than 150 billion rubles to the Provisional Council, the leadership of the puppet opposition, which it had confirmed at a congress on 3 June.
    In an analytical memorandum, the FSK named the head of the Provisional Council the most suitable candidate for support(Citation: 27).

    On 3 September 1994, the Russian government, in an address to the Chechen people, proposed that Dzhokhar Dudayev resign(Citation: 27).

    On 5 September 1994, the General Staff of the Russian army ordered that 10 armored personnel carriers and 6 combat helicopters with crews be handed over to the Provisional Council(Citation: 27).
    From these helicopters, Russian pilots fired rockets at residential houses in Ichkeria (see: "Indiscriminate Attacks").
    In November, the Russian army handed tanks over to the council(Citation: 27)(Citation: 1045).

    In September and October 1994, Russian officers trained more than a hundred fighters of the Provisional Council to drive T-62 tanks and fire army mortars at the "Prudboy" training ground near Volgograd, a city in the south of Russia(Citation: 1042)(Citation: 27).

    In October 1994, Savostyanov, the head of the Moscow directorate of the FSK, ordered that Russian soldiers and officers who knew how to maintain armored vehicles and fight in them be found for the Provisional Council.
    The military counterintelligence of the FSK selected the candidates(Citation: 1086).
    From 3 to 9 November, FSK officers travelled around military units near Moscow and signed contracts with tank crewmen(Citation: 27)(Citation: 1086).

    In November 1994, Kolesnikov, the Chief of the General Staff of the Russian army, authorized sending the recruits to the Caucasus.
    Kotenkov, Russia's deputy minister for nationalities affairs, directed the dispatch, and by 16 November the recruits had been brought to Mozdok, a town in Russian-controlled North Ossetia near the border of the Chechen Republic(Citation: 27).
    Russia denied that it was sending its servicemen to fight for the Provisional Council (see: "Lies about Its Own Actions").

    In the autumn of 1994, FSK officers fought on the side of the puppet opposition(Citation: 27).

    From September 1994 until the assault on Grozny on 26 November, fighters of the Provisional Council and Russian crews attacked Ichkeria.
    On 2 September, fighters of the council and a column of twelve tanks with Russian crews attacked Grozny.
    The Armed Forces of Ichkeria stopped them at the settlement of Dolinsky, northwest of Grozny, knocked out a tank and took eight men prisoner, among them, according to initial reports, Russian servicemen(Citation: 717)(Citation: 729)(Citation: 26)(Citation: 27)(Citation: 710)(Citation: 1338).
    On 30 September, Russian pilots in four helicopters of the Provisional Council fired rockets at the "Severny" airport in Grozny and destroyed five civilian aircraft and two aircraft of the army of Ichkeria, and fighters of the puppet opposition blocked the entrances to the city(Citation: 27)(Citation: 1068)(Citation: 1039).
    Dzhokhar Dudayev rejected the Provisional Council's ultimatum to surrender within six hours, and the council's fighters dispersed without attacking Grozny(Citation: 1068)(Citation: 1043).
    On 15 October, fighters of the Provisional Council stormed Grozny from the south and from the north, and the Armed Forces of Ichkeria repelled the assault.
    The defenders took several dozen attackers prisoner, among them, according to various reports, 12 to 15 Russian officers(Citation: 1043), and on 16 October the council's fighters retreated to their bases in Znamenskoye and in Gekhi, a village southwest of Grozny(Citation: 27).

    On 17 November 1994, nine days before the assault on Grozny, a group of Russian officers headed by Kolesnikov, the Chief of the General Staff, flew from Moscow to Mozdok(Citation: 27).
    Valery Yakov, special correspondent of the Moscow newspaper Izvestia, wrote about the preparation of the assault in November 1996: "There, in Mozdok, at the 'Arsenal' base, the contract soldiers [recruited Russian servicemen]… trained the Chechen crews [of the Provisional Council]…
    In all, the contract soldiers received 40 brand-new tanks, 16 of which had 'Russian' crews"(Citation: 727)(Citation: 1086).
    On 26 November, fighters of the Provisional Council and Russian tank crewmen under the command of Zhukov, the deputy commander of a Russian army corps from Volgograd, stormed Grozny(Citation: 27)(Citation: 1086).
    Zelimkhan Yandarbiyev, the vice president of the Chechen Republic, wrote in his memoirs that in the morning he saw the start of the assault from the window of his office in the presidential palace: "on the northeastern outskirts of the city, from the direction of Tolstoy-Yurt [a village north of Grozny where the fighters of the Provisional Council were stationed], tank and artillery fire began to thunder"(Citation: 713).
    The tanks reached the center of Grozny, where fighters of the Armed Forces of Ichkeria shot them up with grenade launchers(Citation: 27).
    The defenders routed the attackers and, according to the government of the Chechen Republic, took 68 Russian servicemen prisoner(Citation: 1071).
    Among the prisoners were soldiers and officers of the Russian Kantemirovskaya Tank Division from near Moscow(Citation: 1085).

    Human rights defenders of Memorial write that without Russia's military help the puppet opposition could not have overthrown Dzhokhar Dudayev(Citation: 27).

    After the defeat of 26 November, the Provisional Council withdrew its fighters to its bases(Citation: 1127)(Citation: 27).
    Fifteen days later, on 11 December 1994, the Russian army openly invaded the Chechen Republic of Ichkeria (see: "Military Intervention")(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Російські спецслужби та армія давали маріонетковій опозиції гроші, зброю, інструкторів, танкістів і льотчиків, щоб скинути Джохара Дудаєва, обраного президента Чеченської Республіки.

    Улітку 1994 року міністерство Росії у справах національностей і ФСК (попередниця сучасної ФСБ) допомагали маріонетковій опозиції набирати збройних бійців у Знаменському, селі на північному заході Ічкерії, і в Урус-Мартані, місті на південний захід від Грозного(Citation: 27).
    Росія виділила понад 150 мільярдів рублів Тимчасовій раді, керівництву маріонеткової опозиції, яке та затвердила на з'їзді 3 червня.
    ФСК в аналітичній довідці назвала голову Тимчасової ради найбільш підхожим для підтримки(Citation: 27).

    3 вересня 1994 року уряд Росії у зверненні до чеченського народу запропонував Джохару Дудаєву піти у відставку(Citation: 27).

    5 вересня 1994 року Генеральний штаб російської армії наказав передати Тимчасовій раді 10 бронетранспортерів і 6 бойових вертольотів з екіпажами(Citation: 27).
    З цих вертольотів російські льотчики обстрілювали ракетами житлові будинки Ічкерії (докладніше: «Невибіркові напади»).
    У листопаді російська армія передала раді танки(Citation: 27)(Citation: 1045).

    У вересні та жовтні 1994 року російські офіцери вчили понад сто бійців Тимчасової ради водити танки Т-62 і стріляти з армійських мінометів на полігоні «Прудбой» під Волгоградом, містом на півдні Росії(Citation: 1042)(Citation: 27).

    У жовтні 1994 року начальник московського управління ФСК Савостьянов звелів знайти для Тимчасової ради російських солдатів і офіцерів, які вміють обслуговувати бронетехніку й воювати на ній.
    Військова контррозвідка ФСК добирала кандидатів(Citation: 1086).
    З 3 по 9 листопада офіцери ФСК їздили по військових частинах під Москвою та укладали з танкістами контракти(Citation: 27)(Citation: 1086).

    У листопаді 1994 року начальник Генерального штабу російської армії Колесников дозволив відправити завербованих на Кавказ.
    Заступник міністра Росії у справах національностей Котенков керував відправленням, і до 16 листопада завербованих привезли в Моздок, місто в підконтрольній Росії Північній Осетії біля кордону Чеченської Республіки(Citation: 27).
    Росія заперечувала, що посилала своїх військових воювати за Тимчасову раду (докладніше: «Брехня про власні дії»).

    Восени 1994 року співробітники ФСК воювали на боці маріонеткової опозиції(Citation: 27).

    З вересня 1994 року, до штурму Грозного 26 листопада, бійці Тимчасової ради та російські екіпажі нападали на Ічкерію. 2 вересня бійці ради й колона з дванадцяти танків із російськими екіпажами напали на Грозний.
    Збройні сили Ічкерії зупинили їх біля селища Долинського, на північний захід від Грозного, підбили танк і захопили в полон вісьмох людей, серед них, за першими даними, російських військових(Citation: 717)(Citation: 729)(Citation: 26)(Citation: 27)(Citation: 710)(Citation: 1338). 30 вересня російські льотчики з чотирьох вертольотів Тимчасової ради обстріляли ракетами аеропорт «Сєверний» у Грозному і знищили п'ять цивільних літаків і два літаки армії Ічкерії, а бійці маріонеткової опозиції перекрили в'їзди до міста(Citation: 27)(Citation: 1068)(Citation: 1039).
    Джохар Дудаєв відкинув ультиматум Тимчасової ради здатися за шість годин, і бійці ради розійшлися, не напавши на Грозний(Citation: 1068)(Citation: 1043). 15 жовтня бійці Тимчасової ради штурмували Грозний з півдня та з півночі, і Збройні сили Ічкерії відбили штурм.
    Захисники захопили в полон кілька десятків нападників, серед них, за різними даними, від 12 до 15 російських офіцерів(Citation: 1043), а 16 жовтня бійці ради відступили на свої бази, у Знаменське та в Гехі, село на південний захід від Грозного(Citation: 27).

    17 листопада 1994 року, за дев'ять днів до штурму Грозного, група російських офіцерів на чолі з начальником Генерального штабу Колесниковим прилетіла з Москви в Моздок(Citation: 27).
    Валерій Яков, спеціальний кореспондент московської газети «Известия», у листопаді 1996 року писав про підготовку штурму: «Там, у Моздоку, на базі „Арсенал“ контрактники [завербовані російські військові]… навчали чеченські екіпажі [Тимчасової ради]…
    Усього контрактники отримали 40 абсолютно нових танків, із них 16 машин були з „російськими“ екіпажами»(Citation: 727)(Citation: 1086). 26 листопада бійці Тимчасової ради та російські танкісти під командуванням Жукова, заступника командира російського армійського корпусу з Волгограда, штурмували Грозний(Citation: 27)(Citation: 1086).
    Зелімхан Яндарбієв, віцепрезидент Чеченської Республіки, писав у спогадах, що вранці побачив початок штурму з вікна свого кабінету в президентському палаці: «на північно-східній околиці міста, з боку Толстой-Юрта [села на північ від Грозного, де стояли бійці Тимчасової ради], загуркотіли танково-артилерійські постріли»(Citation: 713).
    Танки дійшли до центру Грозного, де бійці Збройних сил Ічкерії розстрілювали їх із гранатометів(Citation: 27).
    Захисники розбили нападників і, за даними уряду Чеченської Республіки, захопили в полон 68 російських військових(Citation: 1071).
    Серед полонених були солдати й офіцери російської Кантемирівської танкової дивізії з-під Москви(Citation: 1085).

    Правозахисники «Меморіалу» пишуть, що без військової допомоги Росії маріонеткова опозиція не могла скинути Джохара Дудаєва(Citation: 27).

    Після поразки 26 листопада Тимчасова рада відвела бійців на бази(Citation: 1127)(Citation: 27).
    Через п'ятнадцять днів, 11 грудня 1994 року, російська армія відкрито вторглася в Чеченську Республіку Ічкерія (докладніше: «Воєнна інтервенція»)(Citation: 27).
