description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Российские военные грабили музеи и дома чеченцев в Грозном, а специалисты министерства культуры России вывезли из руин в Москву самые ценные из уцелевших картин.

    С 1 по 4 января 1995 года оккупанты обстреливали здание, где стояли Чеченский национальный музей и Музей изобразительных искусств, и почти целиком сожгли оба музея (подробнее: «Уничтожение исторической памяти»)(Citation: 27).

    До весны 1995 года российские военные не пускали в руины музеев никого из чеченцев и разграбили то, что уцелело.
    Оккупанты забирали экспонаты как трофеи, по званию и должности(Citation: 988).

    Российские солдаты грузили экспонаты Национального музея на бронетранспортёры(Citation: 988).
    Военачальники оккупационных войск с помощью солдат вывезли из отдела рукописей музея не один грузовик древних книг в сторону Моздока, города в Северной Осетии, и Ингушетии, подконтрольных России(Citation: 988).

    В феврале 1995 года сотрудники ФСК (предшественницы современной ФСБ) сложили картины и другие произведения искусства из руин в 20-тонный железнодорожный контейнер(Citation: 27).
    В конце марта российское министерство по чрезвычайным ситуациям привезло в Грозный пятерых специалистов министерства культуры России и московских музеев.
    Группа описала произведения из контейнера(Citation: 986).
    Заместитель директора музейного центра министерства культуры Хотин, один из пятерых, в феврале 1996 года рассказал общественному трибуналу российского фонда «Гласность» в Москве: «Мы попытались все, что было возможно, вынести из развалин.
    При этом сохранность произведений была практически нулевой. …
    Мы законсервировали, предварительно привели в божеский вид и вывезли порядка 60 произведений изобразительного искусства»(Citation: 986).
    Директор Национального музея Иса Адаев в мае 1996 года сказал этому трибуналу в Праге: «Эксперты-искусствоведы, приехавшие из Москвы, помогали красть вещи, определяя нужные по степени их значимости.
    Эти эксперты оставляли, по их словам, „ненужный хлам“»(Citation: 988).

    В 1995 году, во время захвата Грозного, российские солдаты дважды грабили домашнюю библиотеку чеченского журналиста Аслана Дукаева в городе, и его сестра спасла лишь несколько книг(Citation: 1613).
    В 1995 году, после захвата Грозного, бойцы части 3111 дивизии внутренних войск МВД России имени Дзержинского (предшественники современной Росгвардии) обыскали дом чеченца на окраине города и увезли коллекцию древних рукописей, книг и икон, которую там хранил бывший заместитель директора Грозненской филармонии Михаил Паталов.
    Его заявление прошло одиннадцать прокурорских инстанций, прокуратура завела дело, но оно осталось без движения(Citation: 27).

    В июле 1995 года делегация Ичкерии на переговорах с Россией в Грозном потребовала вернуть экспонаты Национального музея.
    Российская делегация устно обещала этим заняться(Citation: 988).
    Через семь месяцев, в феврале 1996 года, вывезенные картины лежали в хранилищах министерства культуры России и ждали реставрации(Citation: 986).
    В июле 2002 года 43 работы Музея изобразительных искусств Грозного висели в Москве на выставке Третьяковской галереи(Citation: 1611).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Russian servicemen looted museums and the homes of Chechens in Grozny, and specialists of the Russian ministry of culture took the most valuable of the surviving paintings from the ruins to Moscow.

    From 1 to 4 January 1995, the occupiers shelled the building that housed the Chechen National Museum and the Museum of Fine Arts, and burned both museums almost completely (see: "Destruction of Historical Memory")(Citation: 27).

    Until the spring of 1995, Russian servicemen let none of the Chechens into the ruins of the museums and plundered what had survived.
    The occupiers took exhibits as trophies, according to rank and position(Citation: 988).

    Russian soldiers loaded exhibits of the National Museum onto armored personnel carriers(Citation: 988).
    Commanders of the occupation troops, with the help of soldiers, took more than one truckload of ancient books from the museum's manuscript department toward Mozdok, a town in North Ossetia, and Ingushetia, both under Russian control(Citation: 988).

    In February 1995, officers of the FSK (a predecessor of today's FSB) packed paintings and other works of art from the ruins into a 20-ton railway container(Citation: 27).
    At the end of March, the Russian ministry for emergency situations brought five specialists from the Russian ministry of culture and Moscow museums to Grozny.
    The group catalogued the works from the container(Citation: 986).
    Khotin, deputy director of the ministry of culture's museum center and one of the five, told the public tribunal of the Russian Glasnost Foundation in Moscow in February 1996: "We tried to carry out of the ruins everything that could be carried out.
    At the same time, the state of preservation of the works was practically zero. …
    We conserved, made presentable and took away about 60 works of fine art"(Citation: 986).
    Isa Adayev, director of the National Museum, told this tribunal in Prague in May 1996: "The art experts who came from Moscow helped to steal things, picking out what they wanted by degree of significance.
    These experts left behind what they called 'useless junk'"(Citation: 988).

    In 1995, during the capture of Grozny, Russian soldiers twice looted the home library of the Chechen journalist Aslan Dukaev in the city, and his sister saved only a few books(Citation: 1613).
    In 1995, after the capture of Grozny, servicemen of unit 3111 of the Dzerzhinsky Division of the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) searched the house of a Chechen on the outskirts of the city and took away a collection of ancient manuscripts, books and icons that Mikhail Patalov, a former deputy director of the Grozny Philharmonic, kept there.
    His complaint passed through eleven levels of the prosecutor's office, the prosecutors opened a case, but it went nowhere(Citation: 27).

    In July 1995, the delegation of Ichkeria at the talks with Russia in Grozny demanded the return of the National Museum's exhibits.
    The Russian delegation verbally promised to look into it(Citation: 988).
    Seven months later, in February 1996, the removed paintings lay in the storerooms of the Russian ministry of culture awaiting restoration(Citation: 986).
    In July 2002, 43 works from the Grozny Museum of Fine Arts hung in Moscow at an exhibition of the Tretyakov Gallery(Citation: 1611).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Російські військові грабували музеї та будинки чеченців у Грозному, а фахівці міністерства культури Росії вивезли з руїн до Москви найцінніші з уцілілих картин.

    З 1 по 4 січня 1995 року окупанти обстрілювали будівлю, де розміщувалися Чеченський національний музей і Музей образотворчих мистецтв, і майже повністю спалили обидва музеї (докладніше: «Знищення історичної пам'яті»)(Citation: 27).

    До весни 1995 року російські військові не пускали в руїни музеїв нікого з чеченців і розграбували те, що вціліло.
    Окупанти забирали експонати як трофеї, за званням і посадою(Citation: 988).

    Російські солдати вантажили експонати Національного музею на бронетранспортери(Citation: 988).
    Воєначальники окупаційних військ за допомогою солдатів вивезли з відділу рукописів музею не одну вантажівку стародавніх книг у бік Моздока, міста в Північній Осетії, та Інгушетії, підконтрольних Росії(Citation: 988).

    У лютому 1995 року співробітники ФСК (попередниці сучасної ФСБ) склали картини та інші твори мистецтва з руїн у 20-тонний залізничний контейнер(Citation: 27).
    Наприкінці березня російське міністерство з надзвичайних ситуацій привезло в Грозний п'ятьох фахівців міністерства культури Росії та московських музеїв.
    Група описала твори з контейнера(Citation: 986).
    Заступник директора музейного центру міністерства культури Хотін, один із п'ятьох, у лютому 1996 року розповів громадському трибуналу російського фонду «Гласність» у Москві: «Ми спробували все, що було можливо, винести з руїн.
    При цьому збереженість творів була практично нульовою. …
    Ми законсервували, попередньо привели до божого вигляду і вивезли близько 60 творів образотворчого мистецтва»(Citation: 986).
    Директор Національного музею Іса Адаєв у травні 1996 року сказав цьому трибуналу в Празі: «Експерти-мистецтвознавці, які приїхали з Москви, допомагали красти речі, визначаючи потрібні за ступенем їхньої значущості.
    Ці експерти залишали, за їхніми словами, „непотрібний мотлох“»(Citation: 988).

    У 1995 році, під час захоплення Грозного, російські солдати двічі грабували домашню бібліотеку чеченського журналіста Аслана Дукаєва в місті, і його сестра врятувала лише кілька книг(Citation: 1613).
    У 1995 році, після захоплення Грозного, бійці частини 3111 дивізії внутрішніх військ МВС Росії імені Дзержинського (попередники сучасної Росгвардії) обшукали будинок чеченця на околиці міста і вивезли колекцію стародавніх рукописів, книг та ікон, яку там зберігав колишній заступник директора Грозненської філармонії Михайло Паталов.
    Його заява пройшла одинадцять прокурорських інстанцій, прокуратура завела справу, але вона залишилася без руху(Citation: 27).

    У липні 1995 року делегація Ічкерії на переговорах з Росією в Грозному вимагала повернути експонати Національного музею.
    Російська делегація усно пообіцяла цим зайнятися(Citation: 988).
    Через сім місяців, у лютому 1996 року, вивезені картини лежали у сховищах міністерства культури Росії і чекали на реставрацію(Citation: 986).
    У липні 2002 року 43 роботи Музею образотворчих мистецтв Грозного висіли в Москві на виставці Третьяковської галереї(Citation: 1611).
