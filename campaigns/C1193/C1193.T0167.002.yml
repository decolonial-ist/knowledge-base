description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Россия объявляла прекращение огня или подписывала его с Ичкерией, а оккупационные войска продолжали бомбить сёла и начинали новые наступления.

    Президент России Ельцин объявлял прекращение боевых действий указами и в обращениях к гражданам России по телевидению(Citation: 27)(Citation: 1357).
    Председатель правительства России Черномырдин, командующие оккупационными войсками и российские делегации договаривались о прекращении огня с представителями Ичкерии(Citation: 27).
    Россия назначала прекращение огня перед ежегодным обращением Ельцина к российскому парламенту 16 февраля 1995 года и перед выборами президента России летом 1996 года(Citation: 27).

    В ночь на 10 января 1995 года российское правительство объявило прекращение огня на 48 часов и потребовало, чтобы Вооружённые силы Ичкерии сдались, а днём российская армия продолжила штурм Грозного(Citation: 27)(Citation: 988). 17 января председатель правительства России Черномырдин договорился с министрами Ичкерии о прекращении огня в несколько этапов, а в ночь на 19 января российские лётчики сбросили на президентский дворец в Грозном бомбы, которые пробивают бетон(Citation: 1038)(Citation: 27). 13 февраля командующий оккупационными войсками Куликов договорился с Асланом Масхадовым, начальником Главного штаба армии Ичкерии, о «перемирии» до 19 февраля, а 18 февраля российские артиллеристы обстреляли позиции армии Ичкерии к востоку от Грозного(Citation: 27).

    26 апреля 1995 года президент России Ельцин подписал указ о прекращении боевых действий в Ичкерии с 28 апреля по 12 мая.
    В указе сказано: «в случае вооруженных провокаций в ЧР [Чеченской Республике] действия подразделений и частей временных объединенных сил [российских войск]… определяются в соответствии с обстановкой»(Citation: 27)(Citation: 1346).
    Генерал Трошев, который весной 1995 года командовал войсками министерства обороны России в Ичкерии, писал в воспоминаниях: «Мы понимали, что объявление моратория [прекращения боевых действий] носило чисто политический характер — страна готовилась к празднованию 50-летия Великой Победы…»(Citation: 1130). 9 мая на праздник в Москву приехали главы иностранных государств(Citation: 27).

    С 28 апреля по 12 мая 1995 года российские солдаты продолжали убивать мирных чеченцев(Citation: 27). 1 мая российский снайпер убил шестилетнюю Зулихан Юнусову в Старых Атагах, селе к югу от Грозного.
    Иса Адаев, директор Чеченского национального музея, был на её похоронах и в мае 1996 года рассказал в Праге общественному трибуналу российского фонда «Гласность»: «Через несколько дней при встрече с военным комендантом выяснилось, что солдаты были пьяные и стреляли на спор: попадут или нет.
    Так они убили девочку»(Citation: 988). 10 мая российские солдаты из комендатуры Старопромысловского района Грозного смертельно ранили Ш. Чантиева за рулём его машины(Citation: 27). 11 мая, через два дня после праздника в Москве, российские лётчики бомбили Шатой, районный центр в горах на юге Ичкерии(Citation: 986).
    Неизвестно, сколько таких преступлений совершили оккупационные войска с 28 апреля по 12 мая 1995 года. 12 мая, как только срок указа кончился, российская армия возобновила наступление на горные районы Ичкерии(Citation: 27).

    30 июля 1995 года Россия подписала с Ичкерией соглашение о прекращении военных действий (подробнее: «Фиктивные договоры»).
    С 17 августа российские лётчики бомбили Рошни-Чу и Танги-Чу, сёла к юго-западу от Грозного, а 9 октября оккупанты начали новое наступление(Citation: 986)(Citation: 27).

    31 марта 1996 года президент России Ельцин указом № 435 объявил о «прекращении с 24.00 часов 31 марта 1996 г. войсковых операций на территории Чеченской Республики»(Citation: 1326). 1 апреля командующий оккупационными войсками Тихомиров объявил, что продолжит войну, а 4 апреля российские солдаты штурмовали Гойское, село к юго-западу от Грозного, и в боях убили 26 чеченцев(Citation: 27). 27 мая председатель правительства России Черномырдин и Зелимхан Яндарбиев, исполнявший обязанности президента Ичкерии, подписали в Москве договорённость о прекращении огня, а вечером 3 июня российские лётчики бомбили сёла Ножай-Юртовского и Веденского районов на юго-востоке Ичкерии(Citation: 1124)(Citation: 27)(Citation: 1362). 10 июня в Назрани Россия обязалась прекратить бомбёжки и до 7 июля снять блокпосты, а 9 июля, через шесть дней после победы Ельцина на выборах президента России, оккупанты начали новое наступление(Citation: 1124)(Citation: 1307)(Citation: 27). 13 августа исполнявший обязанности командующего оккупационными войсками Пуликовский встретился с начальником Главного штаба армии Ичкерии Асланом Масхадовым, и Ичкерия объявила, что они договорились прекратить огонь с полудня 14 августа. 14 августа российские лётчики бомбили Комсомольское, село к северо-востоку от Грозного, и убили девять чеченцев(Citation: 1367)(Citation: 1274). 18 августа командование оккупационными войсками заключило с армией Ичкерии соглашение о прекращении огня, а в ночь на 20 августа российские лётчики возобновили бомбёжки Грозного(Citation: 1270)(Citation: 27).

    Сергей Ковалёв, глава Наблюдательной миссии российских правозащитников, 11 мая 1995 года написал в американском журнале The New York Review of Books, что российские командиры объявляли прекращение огня под давлением в России и за рубежом и мирного процесса не начинали(Citation: 919).
    Правозащитники «Мемориала» пишут, что Россия использовала «перемирие» 1995 года, чтобы подготовить выборы и закрепить марионеточное правительство, а «мирный план» Ельцина 1996 года действовал, пока в России не подвели итоги выборов(Citation: 27).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года Россия подписала с Ичкерией мирные соглашения в Хасавюрте и признала в них «недопустимость применения вооруженной силы или угрозы ее применения при решении спорных вопросов» (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
    Через три года после соглашений в Хасавюрте Россия снова напала на Ичкерию. 21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября российская армия вторглась в республику(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Russia declared ceasefires or signed them with Ichkeria, while the occupation forces went on bombing villages and launched new offensives.

    Russian president Yeltsin declared an end to hostilities by decree and in televised addresses to the citizens of Russia(Citation: 27)(Citation: 1357).
    Russian prime minister Chernomyrdin, commanders of the occupation forces and Russian delegations agreed on ceasefires with representatives of Ichkeria(Citation: 27).
    Russia scheduled ceasefires before Yeltsin's annual address to the Russian parliament on 16 February 1995 and before the Russian presidential election in the summer of 1996(Citation: 27).

    On the night of 10 January 1995, the Russian government declared a 48-hour ceasefire and demanded that the Armed Forces of Ichkeria surrender, and in the daytime the Russian army continued its assault on Grozny(Citation: 27)(Citation: 988).
    On 17 January, Russian prime minister Chernomyrdin agreed with the ministers of Ichkeria on a ceasefire in several stages, and on the night of 19 January Russian pilots dropped concrete-piercing bombs on the presidential palace in Grozny(Citation: 1038)(Citation: 27).
    On 13 February, Kulikov, commander of the occupation forces, agreed with Aslan Maskhadov, chief of the Main Staff of the army of Ichkeria, on a "truce" until 19 February, and on 18 February Russian artillerymen shelled the positions of the army of Ichkeria east of Grozny(Citation: 27).

    On 26 April 1995, Russian president Yeltsin signed a decree ending hostilities in Ichkeria from 28 April to 12 May.
    The decree says: "in the event of armed provocations in the ChR [the Chechen Republic], the actions of the units and formations of the temporary joint forces [Russian troops]… shall be determined in accordance with the situation"(Citation: 27)(Citation: 1346).
    General Troshev, who in the spring of 1995 commanded the troops of the Russian defense ministry in Ichkeria, wrote in his memoirs: "We understood that the declaration of the moratorium [the end of hostilities] was of a purely political nature — the country was preparing to celebrate the 50th anniversary of the Great Victory…"(Citation: 1130).
    On 9 May, heads of foreign states came to Moscow for the celebration(Citation: 27).

    From 28 April to 12 May 1995, Russian soldiers went on killing Chechen civilians(Citation: 27).
    On 1 May, a Russian sniper killed six-year-old Zulikhan Yunusova in Starye Atagi, a village south of Grozny.
    Isa Adayev, director of the Chechen National Museum, was at her funeral and in May 1996 told the public tribunal of the Russian Glasnost Foundation in Prague: "A few days later, at a meeting with the military commandant, it turned out that the soldiers had been drunk and were shooting on a bet: would they hit or not.
    That is how they killed the girl"(Citation: 988).
    On 10 May, Russian soldiers from the commandant's office of the Staropromyslovsky district of Grozny mortally wounded Sh.
    Chantiev at the wheel of his car(Citation: 27).
    On 11 May, two days after the celebration in Moscow, Russian pilots bombed Shatoy, a district center in the mountains in the south of Ichkeria(Citation: 986).
    It is unknown how many such crimes the occupation forces committed from 28 April to 12 May 1995.
    On 12 May, as soon as the decree expired, the Russian army resumed its offensive on the mountain districts of Ichkeria(Citation: 27).

    On 30 July 1995, Russia signed an agreement with Ichkeria on the cessation of hostilities (see: "Sham Treaties").
    From 17 August, Russian pilots bombed Roshni-Chu and Tangi-Chu, villages south-west of Grozny, and on 9 October the occupiers launched a new offensive(Citation: 986)(Citation: 27).

    On 31 March 1996, Russian president Yeltsin, by decree No. 435, announced "the cessation, from 24.00 hours on 31 March 1996, of military operations on the territory of the Chechen Republic"(Citation: 1326).
    On 1 April, Tikhomirov, commander of the occupation forces, announced that he would continue the war, and on 4 April Russian soldiers stormed Goyskoye, a village south-west of Grozny, and killed 26 Chechens in the fighting(Citation: 27).
    On 27 May, Russian prime minister Chernomyrdin and Zelimkhan Yandarbiyev, acting president of Ichkeria, signed a ceasefire agreement in Moscow, and on the evening of 3 June Russian pilots bombed villages of the Nozhay-Yurt and Vedeno districts in the south-east of Ichkeria(Citation: 1124)(Citation: 27)(Citation: 1362).
    On 10 June in Nazran, Russia undertook to stop the bombing and to remove its checkpoints by 7 July, and on 9 July, six days after Yeltsin's victory in the Russian presidential election, the occupiers launched a new offensive(Citation: 1124)(Citation: 1307)(Citation: 27).
    On 13 August, Pulikovsky, acting commander of the occupation forces, met Aslan Maskhadov, chief of the Main Staff of the army of Ichkeria, and Ichkeria announced that they had agreed to cease fire from noon on 14 August.
    On 14 August, Russian pilots bombed Komsomolskoye, a village north-east of Grozny, and killed nine Chechens(Citation: 1367)(Citation: 1274).
    On 18 August, the command of the occupation forces concluded a ceasefire agreement with the army of Ichkeria, and on the night of 20 August Russian pilots resumed the bombing of Grozny(Citation: 1270)(Citation: 27).

    Sergei Kovalyov, head of the Observer Mission of Russian human rights defenders, wrote in the American magazine The New York Review of Books on 11 May 1995 that the ceasefires declared by Russian commanders were disingenuous concessions to domestic and foreign pressures, not the start of a genuine peace process(Citation: 919).
    Human rights defenders of Memorial write that Russia used the "truce" of 1995 to prepare elections and entrench the puppet government, and that Yeltsin's "peace plan" of 1996 remained in force until the election results were tallied in Russia(Citation: 27).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, Russia signed peace agreements with Ichkeria in Khasavyurt and recognized in them "the inadmissibility of the use of armed force or the threat of its use in resolving disputed questions" (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
    Three years after the agreements in Khasavyurt, Russia attacked Ichkeria again.
    On 21 September 1999, Russian pilots began bombing Grozny, and on 29 September the Russian army invaded the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Росія оголошувала припинення вогню або підписувала його з Ічкерією, а окупаційні війська далі бомбили села й починали нові наступи.

    Президент Росії Єльцин оголошував припинення бойових дій указами і в зверненнях до громадян Росії по телебаченню(Citation: 27)(Citation: 1357).
    Голова уряду Росії Черномирдін, командувачі окупаційних військ і російські делегації домовлялися про припинення вогню з представниками Ічкерії(Citation: 27).
    Росія призначала припинення вогню перед щорічним зверненням Єльцина до російського парламенту 16 лютого 1995 року і перед виборами президента Росії влітку 1996 року(Citation: 27).

    У ніч на 10 січня 1995 року російський уряд оголосив припинення вогню на 48 годин і зажадав, щоб Збройні сили Ічкерії здалися, а вдень російська армія продовжила штурм Грозного(Citation: 27)(Citation: 988). 17 січня голова уряду Росії Черномирдін домовився з міністрами Ічкерії про припинення вогню в кілька етапів, а в ніч на 19 січня російські льотчики скинули на президентський палац у Грозному бомби, які пробивають бетон(Citation: 1038)(Citation: 27). 13 лютого командувач окупаційних військ Куликов домовився з Асланом Масхадовим, начальником Головного штабу армії Ічкерії, про «перемир'я» до 19 лютого, а 18 лютого російські артилеристи обстріляли позиції армії Ічкерії на схід від Грозного(Citation: 27).

    26 квітня 1995 року президент Росії Єльцин підписав указ про припинення бойових дій в Ічкерії з 28 квітня по 12 травня.
    В указі сказано: «у разі збройних провокацій у ЧР [Чеченській Республіці] дії підрозділів і частин тимчасових об'єднаних сил [російських військ]… визначаються відповідно до обстановки»(Citation: 27)(Citation: 1346).
    Генерал Трошев, який навесні 1995 року командував військами міністерства оборони Росії в Ічкерії, писав у спогадах: «Ми розуміли, що оголошення мораторію [припинення бойових дій] мало суто політичний характер — країна готувалася святкувати 50-річчя Великої Перемоги…»(Citation: 1130). 9 травня на свято до Москви приїхали глави іноземних держав(Citation: 27).

    З 28 квітня по 12 травня 1995 року російські солдати далі вбивали мирних чеченців(Citation: 27). 1 травня російський снайпер убив шестирічну Зуліхан Юнусову в Старих Атагах, селі на південь від Грозного.
    Іса Адаєв, директор Чеченського національного музею, був на її похороні і в травні 1996 року розповів у Празі громадському трибуналу російського фонду «Гласність»: «Через кілька днів при зустрічі з військовим комендантом з'ясувалося, що солдати були п'яні і стріляли на спір: влучать чи ні.
    Так вони вбили дівчинку»(Citation: 988). 10 травня російські солдати з комендатури Старопромислівського району Грозного смертельно поранили Ш. Чантієва за кермом його машини(Citation: 27). 11 травня, через два дні після свята в Москві, російські льотчики бомбили Шатой, районний центр у горах на півдні Ічкерії(Citation: 986).
    Невідомо, скільки таких злочинів скоїли окупаційні війська з 28 квітня по 12 травня 1995 року. 12 травня, щойно строк указу скінчився, російська армія відновила наступ на гірські райони Ічкерії(Citation: 27).

    30 липня 1995 року Росія підписала з Ічкерією угоду про припинення воєнних дій (докладніше: «Фіктивні договори»).
    З 17 серпня російські льотчики бомбили Рошні-Чу і Танги-Чу, села на південний захід від Грозного, а 9 жовтня окупанти почали новий наступ(Citation: 986)(Citation: 27).

    31 березня 1996 року президент Росії Єльцин указом № 435 оголосив про «припинення з 24.00 годин 31 березня 1996 р. військових операцій на території Чеченської Республіки»(Citation: 1326). 1 квітня командувач окупаційних військ Тихомиров оголосив, що продовжить війну, а 4 квітня російські солдати штурмували Гойське, село на південний захід від Грозного, і в боях убили 26 чеченців(Citation: 27). 27 травня голова уряду Росії Черномирдін і Зелімхан Яндарбієв, який виконував обов'язки президента Ічкерії, підписали в Москві домовленість про припинення вогню, а ввечері 3 червня російські льотчики бомбили села Ножай-Юртівського і Веденського районів на південному сході Ічкерії(Citation: 1124)(Citation: 27)(Citation: 1362). 10 червня в Назрані Росія зобов'язалася припинити бомбардування і до 7 липня зняти блокпости, а 9 липня, через шість днів після перемоги Єльцина на виборах президента Росії, окупанти почали новий наступ(Citation: 1124)(Citation: 1307)(Citation: 27). 13 серпня Пуліковський, який виконував обов'язки командувача окупаційних військ, зустрівся з начальником Головного штабу армії Ічкерії Асланом Масхадовим, і Ічкерія оголосила, що вони домовилися припинити вогонь з полудня 14 серпня. 14 серпня російські льотчики бомбили Комсомольське, село на північний схід від Грозного, і вбили дев'ятьох чеченців(Citation: 1367)(Citation: 1274). 18 серпня командування окупаційних військ уклало з армією Ічкерії угоду про припинення вогню, а в ніч на 20 серпня російські льотчики відновили бомбардування Грозного(Citation: 1270)(Citation: 27).

    Сергій Ковальов, глава Спостережної місії російських правозахисників, 11 травня 1995 року написав в американському журналі The New York Review of Books, що російські командири оголошували припинення вогню під тиском у Росії та за кордоном і мирного процесу не починали(Citation: 919).
    Правозахисники «Меморіалу» пишуть, що Росія використала «перемир'я» 1995 року, щоб підготувати вибори і закріпити маріонетковий уряд, а «мирний план» Єльцина 1996 року діяв, доки в Росії не підбили підсумки виборів(Citation: 27).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року Росія підписала з Ічкерією мирні угоди в Хасав'юрті і визнала в них «неприпустимість застосування збройної сили або погрози її застосування при вирішенні спірних питань» (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
    Через три роки після угод у Хасав'юрті Росія знову напала на Ічкерію. 21 вересня 1999 року російські льотчики почали бомбити Грозний, а 29 вересня російська армія вторглася в республіку(Citation: 27).
