description:
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Throughout the war, Russia called the army and the authorities of Ichkeria "bandits", "bandit formations" and "terrorists", and Chechens "militants".

    On 2 November 1993, Russian president Yeltsin, by decree No. 1833, approved a military doctrine under which the army could be used against "illegal armed formations"(Citation: 1327)(Citation: 652).
    With these words Russian officials designated the Armed Forces of Ichkeria(Citation: 27).

    On 27 December 1994, Russian president Yeltsin, in a televised address to the citizens of Russia, called some of the defenders of Ichkeria professional "terrorists" and mercenaries from other states.
    The president set Russian soldiers and police officers the task of disarming the "bandit formations".
    Yeltsin warned Russians that their relatives could fall victim to the "rampant banditry" in Ichkeria(Citation: 747).
    Commanders of the occupation forces called the people in Grozny and in the villages that the Russian army was pounding "bandit formations" and "militants"(Citation: 27).

    A soldier of the Russian border troops who fought in Ichkeria told the newspaper Rossiyskiye Vesti about retraining in Stavropol, a city in the south of Russia.
    There the soldiers were told to set booby traps without thinking about who would be blown up by them: a child would grow up to be a "mujahid", and a woman would give birth to a new "militant"(Citation: 27).

    On 7 April 1995, the Internal Troops of Russia's Ministry of Internal Affairs (predecessors of today's Rosgvardia) began the assault on Samashki, a village in the west of Ichkeria(Citation: 662).
    On 8 April, a Russian soldier was driving women and children out of a cellar on Vygonnaya Street.
    Mariet T., a Chechen woman from that street, told observers of Memorial that the occupier shouted at them: "These aren't women, they're bitches, whores, they kill ours too, and we're supposed to spare theirs?!"
    Then the Russian military herded some of the women into a room and others into a cellar and shot at them (see: "Mass Killings of Civilians").
    Ruslan N. from Samashki recalled how MVD soldiers detained him that day: "They took my passport and right there, in front of me, tore it up… 'You'll go down as a militant.
    You've got a militant's mug'".
    At a military unit north of the village, the servicemen beat him unconscious.
    Ruslan N. survived(Citation: 1136).

    Russian officials and military men, from the prime minister to the soldier conducting a search, called the authorities of Ichkeria "bandits"(Citation: 1323)(Citation: 1410), its army "bandit formations"(Citation: 27) and "terrorists"(Citation: 1294)(Citation: 1357), and Chechen civilians "bandits"(Citation: 986) and "militants"(Citation: 988).
    On 4 January 1996, Tikhomirov, commander of the occupation forces, in an interview with the Russian agency Interfax, spoke of Aslan Maskhadov, chief of the Main Staff of the Armed Forces of Ichkeria, as a "bandit"(Citation: 27).

    On 11 and 12 July 1996, unknown persons blew up two trolleybuses in Moscow(Citation: 27).
    According to Amnesty International, at the site of the second explosion Moscow mayor Luzhkov told a Russian police general that all Chechens should be expelled from the city.
    The general replied that if he were allowed to, he would introduce terror on the streets.
    The Russian television channel NTV showed this conversation on the day of the explosion(Citation: 1162)(Citation: 27).
    At a press conference at the mayor's office, Luzhkov told journalists that a "Chechen trace" could be seen in the explosions(Citation: 1160)(Citation: 1310)(Citation: 27).
    Alexander Litvinenko, a former FSB officer, and the historian Yuri Felshtinsky write that those who blew up the trolleybuses "were not caught and… it was not determined whether they were Chechens or not"(Citation: 1087).
    Human rights defenders of Human Rights Watch wrote in their report for 1996 that Luzhkov's televised statements "set the tone" for raids on markets and dormitories.
    In the two days after the explosions, the Moscow police, which verified documents "overwhelmingly against dark-skinned people", detained 5,770 people for violating residence registration rules(Citation: 1253).
    In a 1999 report, Amnesty International wrote that for several years Luzhkov's statements served the police as an implied instruction to persecute and intimidate Chechens solely because they were Chechens(Citation: 694).

    At a hearing in the US Congress, the Russian journalist Yevgenia Albats said that those whom Russia called "bandits" were ordinary citizens who had stood up for their land, their houses and their families(Citation: 1038).
    Human rights defenders of Memorial write that until June 1995, and again from late January 1996, Russia waged the war without calling it a war or the enemy an enemy(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Росія всю війну називала армію і владу Ічкерії «бандитами», «бандформуваннями» і «терористами», а чеченців - «бойовиками».

    2 листопада 1993 року президент Росії Єльцин указом № 1833 затвердив воєнну доктрину, за якою армію можна було застосовувати проти «незаконних збройних формувань»(Citation: 1327)(Citation: 652).
    Цими словами російські чиновники позначали Збройні сили Ічкерії(Citation: 27).

    27 грудня 1994 року президент Росії Єльцин у зверненні по телебаченню до громадян Росії назвав частину захисників Ічкерії професійними «терористами» і найманцями з інших держав.
    Президент поставив російським солдатам і міліціонерам завдання роззброїти «бандформування».
    Єльцин попередив росіян, що жертвами «розгулу бандитизму» в Ічкерії можуть стати їхні рідні(Citation: 747).
    Командувачі окупаційних військ називали «бандформуваннями» і «бойовиками» людей у Грозному і селах, по яких била російська армія(Citation: 27).

    Солдат російських прикордонних військ, який воював в Ічкерії, розповів газеті «Російські вісті» про перепідготовку в Ставрополі, місті на півдні Росії.
    Там солдатам казали ставити міни-пастки, не думаючи, хто на них підірветься: дитина виросте «моджахедом», а жінка народить нового «бойовика»(Citation: 27).

    7 квітня 1995 року внутрішні війська МВС Росії (попередники сучасної Росгвардії) почали штурм Самашок, села на заході Ічкерії(Citation: 662). 8 квітня російський солдат виганяв жінок і дітей з підвалу на Вигонній вулиці.
    Марієт Т., чеченка з цієї вулиці, розповіла спостерігачам «Меморіалу», що окупант кричав їм: «Це не жінки, це суки, бляді, вони теж наших убивають, а ми їхніх будемо жаліти?!»
    Потім російські військові загнали одних жінок у кімнату, інших - у підвал і стріляли в них (докладніше: «Масові вбивства цивільних»).
    Руслан Н. із Самашок згадував, як того дня солдати МВС затримали його: «Вони взяли паспорт і тут же, при мені, порвали…
    „За бойовика підеш.
    У тебе пика бойовицька“».
    У військовій частині на північ від села військові побили його до непритомності.
    Руслан Н. вижив(Citation: 1136).

    Російські чиновники та військові, від голови уряду до солдата на обшуку, називали владу Ічкерії «бандитами»(Citation: 1323)(Citation: 1410), її армію - «бандформуваннями»(Citation: 27) і «терористами»(Citation: 1294)(Citation: 1357), а мирних чеченців - «бандитами»(Citation: 986) і «бойовиками»(Citation: 988). 4 січня 1996 року командувач окупаційних військ Тихомиров в інтерв'ю російському агентству «Інтерфакс» говорив про Аслана Масхадова, начальника Головного штабу Збройних сил Ічкерії, як про «бандита»(Citation: 27).

    11 і 12 липня 1996 року невідомі підірвали в Москві два тролейбуси(Citation: 27).
    За словами Amnesty International, на місці другого вибуху мер Москви Лужков сказав російському генералові міліції, що з міста треба виселити всіх чеченців.
    Генерал відповів, що, якщо йому дозволять, запровадить на вулицях терор.
    Російський телеканал НТВ показав цю розмову в день вибуху(Citation: 1162)(Citation: 27).
    На пресконференції в мерії Лужков сказав журналістам, що у вибухах видно «чеченський слід»(Citation: 1160)(Citation: 1310)(Citation: 27).
    Олександр Литвиненко, колишній офіцер ФСБ, та історик Юрій Фельштинський пишуть, що тих, хто підірвав тролейбуси, «не спіймали і… не визначили, чеченці вони чи ні»(Citation: 1087).
    Правозахисники з Human Rights Watch писали в доповіді за 1996 рік, що телевізійні заяви Лужкова «задали тон» облавам на ринках і в гуртожитках.
    За два дні після вибухів московська міліція, яка перевіряла документи «переважно у смаглявих людей», затримала за порушення правил прописки 5770 осіб(Citation: 1253).
    У доповіді 1999 року Amnesty International писала, що заяви Лужкова кілька років були для міліції негласною вказівкою переслідувати й залякувати чеченців лише за те, що вони чеченці(Citation: 694).

    На слуханнях у Конгресі США російська журналістка Євгенія Альбац розповіла, що ті, кого Росія називала «бандитами», - звичайні громадяни, які стали на захист своєї землі, домівок і родин(Citation: 1038).
    Правозахисники «Меморіалу» пишуть, що до червня 1995 року і знову з кінця січня 1996 року Росія вела війну, не називаючи її війною, а противника - противником(Citation: 27).
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Россия всю войну называла армию и власть Ичкерии «бандитами», «бандформированиями» и «террористами», а чеченцев - «боевиками».

    2 ноября 1993 года президент России Ельцин указом № 1833 утвердил военную доктрину, по которой армию можно было применять против «незаконных вооруженных формирований»(Citation: 1327)(Citation: 652).
    Этими словами российские чиновники обозначали Вооружённые силы Ичкерии(Citation: 27).

    27 декабря 1994 года президент России Ельцин в обращении по телевидению к гражданам России назвал часть защитников Ичкерии профессиональными «террористами» и наёмниками из других государств.
    Президент поставил российским солдатам и милиционерам задачу разоружить «бандформирования».
    Ельцин предупредил россиян, что жертвами «разгула бандитизма» в Ичкерии могут стать их родные(Citation: 747).
    Командующие оккупационными войсками называли «бандформированиями» и «боевиками» людей в Грозном и сёлах, по которым била российская армия(Citation: 27).

    Солдат российских пограничных войск, который воевал в Ичкерии, рассказал газете «Российские вести» о переподготовке в Ставрополе, городе на юге России.
    Там солдатам говорили ставить мины-ловушки, не думая, кто на них подорвётся: ребёнок вырастет «моджахедом», а женщина родит нового «боевика»(Citation: 27).

    7 апреля 1995 года внутренние войска МВД России (предшественники современной Росгвардии) начали штурм Самашек, села на западе Ичкерии(Citation: 662). 8 апреля российский солдат выгонял женщин и детей из подвала на Выгонной улице.
    Мариет Т., чеченка с этой улицы, рассказала наблюдателям «Мемориала», что оккупант кричал им: «Это не женщины, это суки, бляди, они тоже наших убивают, а мы ихних будем жалеть?!»
    Потом российские военные загнали одних женщин в комнату, других - в подвал и стреляли в них (подробнее: «Массовые убийства гражданских»).
    Руслан Н. из Самашек вспоминал, как в этот день солдаты МВД задержали его: «Они взяли паспорт и тут же, при мне, изорвали…
    „За боевика покатишь.
    У тебя рожа боевицкая“».
    В воинской части к северу от села военные избили его до потери сознания.
    Руслан Н. выжил(Citation: 1136).

    Российские чиновники и военные, от председателя правительства до солдата на обыске, называли власть Ичкерии «бандитами»(Citation: 1323)(Citation: 1410), её армию - «бандформированиями»(Citation: 27) и «террористами»(Citation: 1294)(Citation: 1357), а мирных чеченцев - «бандитами»(Citation: 986) и «боевиками»(Citation: 988). 4 января 1996 года командующий оккупационными войсками Тихомиров в интервью российскому агентству «Интерфакс» говорил об Аслане Масхадове, начальнике Главного штаба Вооружённых сил Ичкерии, как о «бандите»(Citation: 27).

    11 и 12 июля 1996 года неизвестные взорвали в Москве два троллейбуса(Citation: 27).
    По словам Amnesty International, на месте второго взрыва мэр Москвы Лужков сказал российскому генералу милиции, что из города надо выселить всех чеченцев.
    Генерал ответил, что, если ему позволят, введёт на улицах террор.
    Российский телеканал НТВ показал этот разговор в день взрыва(Citation: 1162)(Citation: 27).
    На пресс-конференции в мэрии Лужков сказал журналистам, что во взрывах виден «чеченский след»(Citation: 1160)(Citation: 1310)(Citation: 27).
    Александр Литвиненко, бывший офицер ФСБ, и историк Юрий Фельштинский пишут, что тех, кто взорвал троллейбусы, «не поймали и… не определили, чеченцы они или нет»(Citation: 1087).
    Правозащитники из Human Rights Watch писали в докладе за 1996 год, что телевизионные заявления Лужкова «задали тон» облавам на рынках и в общежитиях.
    За два дня после взрывов московская милиция, которая проверяла документы «в подавляющем большинстве у смуглых людей», задержала за нарушение правил прописки 5770 человек(Citation: 1253).
    В докладе 1999 года Amnesty International писала, что заявления Лужкова несколько лет были для милиции негласным указанием преследовать и запугивать чеченцев только за то, что они чеченцы(Citation: 694).

    На слушаниях в Конгрессе США российская журналистка Евгения Альбац рассказала, что те, кого Россия называла «бандитами», - обычные граждане, вставшие на защиту своей земли, домов и семей(Citation: 1038).
    Правозащитники «Мемориала» пишут, что до июня 1995 года и снова с конца января 1996 года Россия вела войну, не называя её войной, а противника - противником(Citation: 27).
