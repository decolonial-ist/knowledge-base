description:
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers looted Chechen homes and carried the belongings away in military vehicles(Citation: 27).

    Officers of the Russian Ministry of Internal Affairs and soldiers of the Russian Internal Troops (predecessors of today's Rosgvardia), during "zachistkas" ("sweeps", as the Russians called house searches and detentions of Chechens) in Grozny, went from house to house with weapons.
    The occupiers took money, gold and valuables from the owners.
    Chechen families filed the most complaints of looting against them(Citation: 27).

    From December 1994, Russian police officers and fighters of the Russian Ministry of Internal Affairs looted Chechen families in the stanitsa of Assinovskaya in the west of Ichkeria(Citation: 662).
    In mid-January 1995, the elders let Russian troops into the stanitsa after they promised to do no harm (see: "False Guarantees of Safety"), and the occupiers looted the homes of Chechens(Citation: 654).
    On 28 and 29 January, the Russian military surrounded a block in the settlement of Butenko on the outskirts of Grozny with armored personnel carriers, went from yard to yard with weapons, took a thousand dollars from Leila Bapayeva, and from her neighbor, a mother of eleven children, her "Mother Heroine" medal(Citation: 986)(Citation: 27).
    In late January, the occupiers loaded appliances from abandoned houses of Grozny into armored personnel carriers, and a Russian captain drove a covered truck full of furniture through the city(Citation: 27)(Citation: 662).
    In February, because of the looting in Assinovskaya, the head of the Achkhoy-Martan district in the west of Ichkeria and a representative of the Armed Forces of Ichkeria refused to let the Internal Troops of the Russian Ministry of Internal Affairs into the villages of the district(Citation: 662).

    In the winter of 1995, after the seizure of Grozny, the Russian military carried the belongings of Chechens on army vehicles through Ingushetia to North Ossetia, Russian-controlled republics to the west of Ichkeria.
    Russian traffic police recorded many such cases at their posts in Ingushetia(Citation: 27).

    In February 1995, Russian Justice Minister Kovalyov and General Babichev, who commanded one of the occupiers' groupings, declared on air that soldiers who take food from abandoned houses, or whatever is lying around unguarded, commit no crime(Citation: 27).

    On 1 March 1995, Sobolev, deputy director of the FSK (predecessor of today's FSB), admitted on the Vremya program of the ORT television channel that the Russian military in Ichkeria had looted.
    Russian soldiers who on 30 March 1995 seized Gudermes, the second-largest town of Ichkeria, took whatever they wanted at the market and did not pay(Citation: 27)(Citation: 656).
    Until December 1995, Russian servicemen who served in Gudermes on contract in 45-day shifts got drunk before going home, entered the homes of Chechens and took chickens, geese, carpets and dishes(Citation: 656).

    On 7-8 April 1995, the Internal Troops and police special forces of the Russian Ministry of Internal Affairs stormed Samashki, a village in the west of Ichkeria, and killed 103 peaceful Chechens (see: "Mass Killings of Civilians").
    Along with armored vehicles, the occupiers brought military trucks into the village.
    The soldiers loaded video equipment, tape recorders, televisions, carpets and furniture into them and into armored personnel carriers, and searched women's necks for gold(Citation: 662)(Citation: 1136).
    On 13 April, Sadulla Yusupov from Samashki told Oleg Orlov, a staff member of Memorial, how he climbed out of the cellar where a Russian serviceman had wounded him with a grenade and saw three occupiers in the yard: "They dragged out this little safe, this one here.
    We kept money and papers in it.
    Two of them are opening it with something, trying to open it, and the third is guarding them and shooting chickens, into the house".
    The soldiers opened the safe and left.
    Human rights defenders of the Observer Mission found Sadulla Yusupov's house burned down, but there were no traces of fighting on its walls(Citation: 662)(Citation: 27).

    In April 1995, Albast Madayev from Samashki wrote to Govorukhin, chairman of the Russian parliament's commission investigating the causes of the war in Ichkeria: "They burned my house with a shot from a flamethrower, killed 3 cows and 12 sheep.
    Of the household belongings, they took away what they could and set fire to the rest"(Citation: 1136).
    The commission received 221 statements from Chechens of this village.
    In 60 of them it is said that the Russian military took valuables, food and shot livestock from the houses, and often burned the rest (see: "Total Destruction of Infrastructure").
    On 6 June, Govorukhin, chairman of the commission, told Krasnaya Zvezda, the newspaper of the Russian Ministry of Defense, that he did not believe in the looting in Samashki.
    Not one of the complainants received an answer(Citation: 662).

    In April 1995, an officer of the Russian FSB confirmed in Ichkeria to Viktor Kurochkin and Viktor Sheinis, deputies of the Russian parliament, that soldiers of the occupation troops were looting the seized villages on a mass scale.
    The officer had filed a report about this to his superiors and received no answer(Citation: 27).
    On the night of 7 July 1995, the Russian soldiers Korovin, Shulin and Petrov came from their unit to the settlement of Rodina to demand money and gold from Chechens, killed two of them and wounded three.
    A year later, a military court gave Korovin 14 years, and Shulin and Petrov six and three years(Citation: 1367)(Citation: 27).
    From 30 September 1995 to March 1996, police officers and soldiers of the Russian Ministry of Internal Affairs who kept Sernovodsk, a village in the west of Ichkeria, encircled looted Chechen families and drove away their livestock (see: "Transport Blockade")(Citation: 988).
    On 14 December 1995, the Armed Forces of Ichkeria liberated Gudermes, and on 19-20 December Russian troops seized the town again.
    Russian soldiers lived in dachas outside the town, came every day into the homes of Chechens and took carpets, dishes, food and Red Cross medicines(Citation: 656).

    In February 1996, the Russian military looted the houses that had survived the stormings in the settlement of Novogroznensky in the east of Ichkeria(Citation: 27)(Citation: 988).
    On 9 and 10 March, the Russian military carried mattresses, refrigerators and other belongings of Chechen families out of Sernovodsk on some thirty trucks, which doctors of the international organization Doctors Without Borders counted.
    At the resort north of the village, Russian soldiers looted and set fire to the apartments where refugees were living(Citation: 988).
    In March 1996, Russian soldiers looted the surviving houses in Samashki(Citation: 988)(Citation: 27).
    Russian guards in the prison of Pyatigorsk, a town in the south of Russia, took fur hats, leather jackets, shoes, money and gold from 91 Chechens whom the occupiers had unlawfully detained near Samashki on 15 March 1996 (see: "Filtration Camp System").
    On 19 April, the Ministry of Internal Affairs released them without charges(Citation: 657)(Citation: 27).
    In August 1996, when the Armed Forces of Ichkeria were liberating Grozny, the reconnaissance battalion of the Russian army's 205th Brigade drove townspeople out of the 16-story buildings on Altaiskaya Street near the old airport, where there was no fighting, and loaded their belongings into vehicles.
    When the fighting ended and the soldiers left, the townspeople found almost all the apartments looted(Citation: 27).
    On 17 August 1996, soldiers of the 101st Brigade of the Internal Troops of the Russian Ministry of Internal Affairs searched the houses around the "15th Gorodok", their base in Grozny, took whatever they wanted and shot up the rest with assault rifles(Citation: 921).

    On 20-22 August 1996, Aleksei Karmayev, a 67-year-old disabled man from Grozny, went to the headquarters of the 276th Regiment of the Russian army to demand that Russian soldiers stop looting and return his belongings.
    On 24 August, eight soldiers of the regiment led him away from the yard of his house on Kommunisticheskaya Street, after which the disabled man went missing (see: "Abduction of People")(Citation: 657)(Citation: 1152).

    Human rights defenders of Memorial write that soon after the start of the war the occupiers began to loot and destroy the property of Chechens on a mass scale, and that Russian commanders and military prosecutors did not seriously combat the looting.
    By Memorial's conclusion, soldiers went on looting even after the leadership of the Internal Troops of the Russian Ministry of Internal Affairs, in an address to the troops in February 1995, acknowledged looting, extortion and violence against peaceful Chechens(Citation: 27).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти грабували чеченські домівки й вивозили речі на військових машинах(Citation: 27).

    Співробітники МВС Росії та солдати російських внутрішніх військ (попередники сучасної Росгвардії) під час «зачисток» (так росіяни називали обшуки будинків і затримання чеченців) у Грозному обходили будинки зі зброєю.
    Окупанти відбирали в господарів гроші, золото й цінні речі.
    На них чеченські родини подали найбільше скарг про грабежі(Citation: 27).

    З грудня 1994 року російські міліціонери та бійці МВС Росії грабували чеченські родини в станиці Ассиновська на заході Ічкерії(Citation: 662).
    У середині січня 1995 року старійшини впустили в станицю російські війська, які обіцяли не завдавати шкоди (докладніше: «Фальшиві гарантії безпеки»), і окупанти грабували домівки чеченців(Citation: 654). 28 і 29 січня російські військові оточили бронетранспортерами квартал у селищі Бутенко на околиці Грозного, обходили двори зі зброєю, забрали в Лейли Бапаєвої тисячу доларів, а в її сусідки, матері одинадцяти дітей, медаль «Мати-героїня»(Citation: 986)(Citation: 27).
    Наприкінці січня окупанти вантажили в бронетранспортери техніку з покинутих будинків Грозного, а російський капітан вів містом криту вантажівку, повну меблів(Citation: 27)(Citation: 662).
    У лютому через грабежі в Ассиновській глава Ачхой-Мартанівського району на заході Ічкерії та представник Збройних сил Ічкерії відмовилися впустити внутрішні війська МВС Росії в села району(Citation: 662).

    Узимку 1995 року, після захоплення Грозного, російські військові везли речі чеченців на армійській техніці через Інгушетію до Північної Осетії, підконтрольних Росії республік на захід від Ічкерії.
    Російські дорожні міліціонери записали на своїх постах в Інгушетії безліч таких випадків(Citation: 27).

    У лютому 1995 року міністр юстиції Росії Ковальов і генерал Бабичев, який командував одним з угруповань окупантів, оголосили в ефірі, що солдати, які забирають продукти з покинутих будинків або те, що погано лежить, не чинять злочину(Citation: 27).

    1 березня 1995 року заступник директора ФСК (попередниці сучасної ФСБ) Соболев визнав у програмі «Час» телеканалу ОРТ, що російські військові в Ічкерії грабували.
    Російські солдати, які 30 березня 1995 року захопили Гудермес, друге за величиною місто Ічкерії, забирали на ринку все, що хотіли, і не платили(Citation: 27)(Citation: 656).
    До грудня 1995 року російські військові, які служили в Гудермесі за контрактом змінами по 45 днів, перед від'їздом додому напивалися, заходили в домівки чеченців і забирали курей, гусей, килими та посуд(Citation: 656).

    7-8 квітня 1995 року внутрішні війська та міліцейський спецназ МВС Росії штурмували Самашки, село на заході Ічкерії, і вбили 103 мирних чеченців (докладніше: «Масові вбивства цивільних»).
    Разом із бронетехнікою окупанти пригнали в село військові вантажівки.
    Солдати вантажили в них і в бронетранспортери відеоапаратуру, магнітофони, телевізори, килими та меблі, а в жінок шукали золото на шиї(Citation: 662)(Citation: 1136). 13 квітня Садулла Юсупов із Самашок розповів Олегові Орлову, співробітникові «Меморіалу», як вибрався з підвалу, де російський військовий поранив його гранатою, і побачив у дворі трьох окупантів: «Вони витягли ось цей сейф маленький, ось такий.
    У ньому грошенята, папери там зберігали.
    Двоє його відкривають чимось, намагаються відкрити, а третій їх охороняє і стріляє курей, у будинок».
    Солдати відкрили сейф і пішли.
    Правозахисники Спостережної місії знайшли будинок Садулли Юсупова згорілим, але слідів бою на його стінах не було(Citation: 662)(Citation: 27).

    Албаст Мадаєв із Самашок у квітні 1995 року написав голові комісії російського парламенту з розслідування причин війни в Ічкерії Говорухіну: «Мій дім спалили пострілом з вогнемета, вбили 3 корови, 12 баранів.
    З домашніх речей вивезли, що змогли, а решту підпалили»(Citation: 1136).
    Комісія отримала від чеченців із цього села 221 заяву.
    У 60 із них сказано, що російські військові забирали з будинків цінні речі, продукти та застрелену худобу, а решту часто спалювали (докладніше: «Тотальне знищення інфраструктури»). 6 червня голова комісії Говорухін сказав газеті міністерства оборони Росії «Красная звезда», що не вірить у грабежі в Самашках.
    Жоден із заявників відповіді не отримав(Citation: 662).

    У квітні 1995 року офіцер ФСБ Росії підтвердив в Ічкерії депутатам російського парламенту Віктору Курочкіну та Віктору Шейнісу, що солдати окупаційних військ масово грабують захоплені села.
    Офіцер подав про це рапорт начальству і відповіді не отримав(Citation: 27).
    У ніч на 7 липня 1995 року російські солдати Коровін, Шулін і Петров прийшли зі своєї частини в селище Родіна вимагати в чеченців гроші й золото, вбили двох із них, трьох поранили.
    Через рік військовий суд дав Коровіну 14 років, Шуліну й Петрову - шість і три роки(Citation: 1367)(Citation: 27).
    З 30 вересня 1995 року до березня 1996 року міліціонери та солдати МВС Росії, які тримали в кільці Серноводськ, село на заході Ічкерії, грабували чеченські родини й викрадали їхню худобу (докладніше: «Транспортна блокада»)(Citation: 988). 14 грудня 1995 року Збройні сили Ічкерії звільнили Гудермес, а 19-20 грудня російські війська знову захопили місто.
    Російські солдати жили на дачах за містом, щодня приходили в домівки чеченців і забирали килими, посуд, їжу та ліки Червоного Хреста(Citation: 656).

    У лютому 1996 року російські військові грабували вцілілі після штурмів будинки в селищі Новогрозненський на сході Ічкерії(Citation: 27)(Citation: 988). 9 і 10 березня російські військові вивозили із Серноводська матраци, холодильники та інші речі чеченських родин на трьох десятках вантажівок, які нарахували лікарі міжнародної організації «Лікарі без кордонів».
    На курорті на північ від села російські солдати грабували й підпалювали квартири, в яких жили біженці(Citation: 988).
    У березні 1996 року російські солдати грабували вцілілі будинки в Самашках(Citation: 988)(Citation: 27).
    Російські охоронці у в'язниці П'ятигорська, міста на півдні Росії, відібрали хутряні шапки, шкіряні куртки, взуття, гроші й золото в 91 чеченця, яких окупанти незаконно затримали 15 березня 1996 року біля Самашок (докладніше: «Система фільтраційних таборів»). 19 квітня МВС відпустило їх без звинувачень(Citation: 657)(Citation: 27).
    У серпні 1996 року, коли Збройні сили Ічкерії звільняли Грозний, розвідувальний батальйон 205-ї бригади російської армії вигнав городян із 16-поверхових будинків на Алтайській вулиці біля старого аеропорту, де не було боїв, і вантажив їхні речі в машини.
    Коли бої скінчилися і солдати пішли, городяни знайшли майже всі квартири пограбованими(Citation: 27). 17 серпня 1996 року солдати 101-ї бригади внутрішніх військ МВС Росії обшукували будинки навколо «15-го городка», своєї бази в Грозному, забирали, що хотіли, а решту розстрілювали з автоматів(Citation: 921).

    20-22 серпня 1996 року Олексій Кармаєв, 67-річний інвалід із Грозного, ходив до штабу 276-го полку російської армії вимагати, щоб російські солдати перестали грабувати й повернули його речі. 24 серпня восьмеро солдатів полку повели його з двору будинку на Комуністичній вулиці, після чого інвалід зник безвісти (докладніше: «Викрадення людей»)(Citation: 657)(Citation: 1152).

    Правозахисники «Меморіалу» пишуть, що невдовзі після початку війни окупанти стали масово грабувати й нищити майно чеченців, а російські командири та військові прокурори серйозно з грабежами не боролися.
    За висновком «Меморіалу», солдати грабували й після того, як у лютому 1995 року керівництво внутрішніх військ МВС Росії у зверненні до військ визнало грабежі, здирництво й насильство проти мирних чеченців(Citation: 27).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты грабили чеченские дома и вывозили вещи на военных машинах(Citation: 27).

    Сотрудники МВД России и солдаты российских внутренних войск (предшественники современной Росгвардии) во время «зачисток» (так россияне называли обыски домов и задержания чеченцев) в Грозном обходили дома с оружием.
    Оккупанты отбирали у хозяев деньги, золото и ценные вещи.
    На них чеченские семьи подали больше всего жалоб о грабежах(Citation: 27).

    С декабря 1994 года российские милиционеры и бойцы МВД России грабили чеченские семьи в станице Ассиновская на западе Ичкерии(Citation: 662).
    В середине января 1995 года старейшины впустили в станицу российские войска, которые обещали не причинять вреда (подробнее: «Ложные гарантии безопасности»), и оккупанты грабили дома чеченцев(Citation: 654). 28 и 29 января российские военные окружили бронетранспортёрами квартал в посёлке Бутенко на окраине Грозного, обходили дворы с оружием, забрали у Лейлы Бапаевой тысячу долларов, а у её соседки, матери одиннадцати детей, медаль «Мать-героиня»(Citation: 986)(Citation: 27).
    В конце января оккупанты грузили в бронетранспортёры технику из оставленных домов Грозного, а российский капитан вёл по городу крытый грузовик, полный мебели(Citation: 27)(Citation: 662).
    В феврале из-за грабежей в Ассиновской глава Ачхой-Мартановского района на западе Ичкерии и представитель Вооружённых сил Ичкерии отказались впустить внутренние войска МВД России в сёла района(Citation: 662).

    Зимой 1995 года, после захвата Грозного, российские военные везли вещи чеченцев на армейской технике через Ингушетию в Северную Осетию, подконтрольные России республики к западу от Ичкерии.
    Российские дорожные милиционеры записали на своих постах в Ингушетии множество таких случаев(Citation: 27).

    В феврале 1995 года министр юстиции России Ковалёв и генерал Бабичев, командовавший одной из группировок оккупантов, объявили в эфире, что солдаты, которые забирают продукты из брошенных домов или то, что плохо лежит, не совершают преступления(Citation: 27).

    1 марта 1995 года заместитель директора ФСК (предшественницы современной ФСБ) Соболев признал в программе «Время» телеканала ОРТ, что российские военные в Ичкерии грабили.
    Российские солдаты, которые 30 марта 1995 года захватили Гудермес, второй по величине город Ичкерии, забирали на рынке всё, что хотели, и не платили(Citation: 27)(Citation: 656).
    До декабря 1995 года российские военные, которые служили в Гудермесе по контракту сменами по 45 дней, перед отъездом домой напивались, заходили в дома чеченцев и забирали кур, гусей, ковры и посуду(Citation: 656).

    7-8 апреля 1995 года внутренние войска и милицейский спецназ МВД России штурмовали Самашки, село на западе Ичкерии, и убили 103 мирных чеченца (подробнее: «Массовые убийства гражданских»).
    Вместе с бронетехникой оккупанты пригнали в село военные грузовики.
    Солдаты грузили в них и в бронетранспортёры аппаратуру для видео, магнитофоны, телевизоры, ковры и мебель, а у женщин искали золото на шее(Citation: 662)(Citation: 1136). 13 апреля Садулла Юсупов из Самашек рассказал Олегу Орлову, сотруднику «Мемориала», как выбрался из подвала, где российский военный ранил его гранатой, и увидел во дворе троих оккупантов: «Они вытащили вот этот сейф маленький, вот такой.
    В нем денежки, бумаги там хранили.
    Двое его открывают чем-то, стараются открывать, а третий их охраняет и стреляет кур, в дом».
    Солдаты открыли сейф и ушли.
    Правозащитники Наблюдательной миссии нашли дом Садуллы Юсупова сгоревшим, но следов боя на его стенах не было(Citation: 662)(Citation: 27).

    Албаст Мадаев из Самашек в апреле 1995 года написал председателю комиссии российского парламента по расследованию причин войны в Ичкерии Говорухину: «Мой дом сожгли выстрелом из огнемета, убили 3 коров, 12 баранов.
    Из домашних вещей вывезли, что смогли, а оставшиеся подожгли»(Citation: 1136).
    Комиссия получила от чеченцев из этого села 221 заявление.
    В 60 из них сказано, что российские военные забирали из домов ценные вещи, продукты и застреленный скот, а остальное часто сжигали (подробнее: «Тотальное уничтожение инфраструктуры»). 6 июня председатель комиссии Говорухин сказал газете министерства обороны России «Красная звезда», что не верит в грабежи в Самашках.
    Ни один из заявителей ответа не получил(Citation: 662).

    В апреле 1995 года офицер ФСБ России подтвердил в Ичкерии депутатам российского парламента Виктору Курочкину и Виктору Шейнису, что солдаты оккупационных войск массово грабят захваченные сёла.
    Офицер подал об этом рапорт начальству и ответа не получил(Citation: 27).
    В ночь на 7 июля 1995 года российские солдаты Коровин, Шулин и Петров пришли из своей части в посёлок Родина требовать у чеченцев деньги и золото, убили двоих из них, троих ранили.
    Через год военный суд дал Коровину 14 лет, Шулину и Петрову - шесть и три года(Citation: 1367)(Citation: 27).
    С 30 сентября 1995 года до марта 1996 года милиционеры и солдаты МВД России, которые держали в кольце Серноводск, село на западе Ичкерии, грабили чеченские семьи и угоняли их скот (подробнее: «Транспортная блокада»)(Citation: 988). 14 декабря 1995 года Вооружённые силы Ичкерии освободили Гудермес, а 19-20 декабря российские войска снова захватили город.
    Российские солдаты жили на дачах за городом, каждый день приходили в дома чеченцев и забирали ковры, посуду, еду и лекарства Красного Креста(Citation: 656).

    В феврале 1996 года российские военные грабили уцелевшие после штурмов дома в посёлке Новогрозненский на востоке Ичкерии(Citation: 27)(Citation: 988). 9 и 10 марта российские военные вывозили из Серноводска матрацы, холодильники и другие вещи чеченских семей на трёх десятках грузовиков, которые насчитали врачи международной организации "Врачи без границ".
    На курорте к северу от села российские солдаты грабили и поджигали квартиры, в которых жили беженцы(Citation: 988).
    В марте 1996 года российские солдаты грабили уцелевшие дома в Самашках(Citation: 988)(Citation: 27).
    Российские охранники в тюрьме Пятигорска, города на юге России, отобрали меховые шапки, кожаные куртки, обувь, деньги и золото у 91 чеченца, которых оккупанты незаконно задержали 15 марта 1996 года у Самашек (подробнее: «Система фильтрационных лагерей»). 19 апреля МВД отпустило их без обвинений(Citation: 657)(Citation: 27).
    В августе 1996 года, когда Вооружённые силы Ичкерии освобождали Грозный, разведывательный батальон 205-й бригады российской армии выгнал горожан из 16-этажных домов на Алтайской улице у старого аэропорта, где не было боёв, и грузил их вещи в машины.
    Когда бои кончились и солдаты ушли, горожане нашли почти все квартиры ограбленными(Citation: 27). 17 августа 1996 года солдаты 101-й бригады внутренних войск МВД России обыскивали дома вокруг «15-го городка», своей базы в Грозном, забирали, что хотели, а остальное расстреливали из автоматов(Citation: 921).

    20-22 августа 1996 года Алексей Кармаев, 67-летний инвалид из Грозного, ходил в штаб 276-го полка российской армии требовать, чтобы российские солдаты перестали грабить и вернули его вещи. 24 августа восемь солдат полка увели его со двора дома на Коммунистической улице, после чего инвалид пропал без вести (подробнее: «Похищение людей»)(Citation: 657)(Citation: 1152).

    Правозащитники «Мемориала» пишут, что вскоре после начала войны оккупанты стали массово грабить и уничтожать имущество чеченцев, а российские командиры и военные прокуроры серьёзно с грабежами не боролись.
    По выводу «Мемориала», солдаты грабили и после того, как в феврале 1995 года руководство внутренних войск МВД России в обращении к войскам признало грабежи, вымогательство и насилие против мирных чеченцев(Citation: 27).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
