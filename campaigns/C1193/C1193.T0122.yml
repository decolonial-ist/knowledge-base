description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты не пускали к чеченцам врачей и гуманитарную помощь, а раненых не выпускали к врачам.

    Российские военные на блокпостах вокруг окружённых перед штурмом сёл и городов не пропускали туда врачей, сотрудников ООН, Красного Креста, машины с едой и автобусы для беженцев.
    Оккупанты не выпускали к врачам раненных ими чеченцев(Citation: 27).
    Российские солдаты обстреливали машины скорой помощи и гуманитарных организаций(Citation: 27)(Citation: 1245).

    17 декабря 1994 года российские военные расстреляли у границы подконтрольной России Ингушетии колонну легковых машин с беженцами из Грозного (подробнее: «Массовые убийства гражданских»).
    Оккупанты обстреляли врачей скорой помощи, которые ехали к раненым с ингушской стороны, и до половины пятого утра не подпускали их к месту расстрела(Citation: 27).

    В январе 1995 года российские чиновники направляли гуманитарную помощь в северные районы Ичкерии.
    На юг Ичкерии и в подконтрольный России Дагестан, куда бежали чеченцы, российские ведомства помощь не направляли(Citation: 658). 6 января в Троицкой, станице в Ингушетии, солдат патруля МВД России застрелил безоружного водителя Руслана из колонны, которую беженка из Грозного вела туда за стариками (подробнее: «Массовые убийства гражданских»)(Citation: 1128).
    В начале апреля 1995 года российские чиновники на сутки задержали на блокпосту сразу за границей Ичкерии колонну Красного Креста с медицинскими грузами для Грозного, сославшись на то, что у водителей нет нужных документов(Citation: 1334).

    7 апреля 1995 года внутренние войска МВД России (предшественники современной Росгвардии) штурмовали Самашки, село на западе Ичкерии. 8 и 9 апреля спецназ МВД России на блокпосту № 13 не пропустил в село врачей Международного комитета Красного Креста (МККК), «Врачей без границ» и российского Красного Креста(Citation: 662)(Citation: 1136).
    Валерий Борщёв, депутат российского парламента, который 8 апреля ехал в село с врачами, в феврале 1996 года рассказал общественному трибуналу российского фонда «Гласность» в Москве: «Как объяснил майор, командир 13-й заставы…, они, военные, руководствуются не женевскими конвенциями [международными договорами о защите раненых и мирных людей на войне], а приказами местного командующего генерала-полковника Куликова»(Citation: 986). 9 апреля Дзеки Мусаева, 1920 года рождения, умерла от приступа гипертонии без помощи врачей(Citation: 662). 10 апреля российские военные разрешили вывезти раненых, но машины скорой помощи в село не пустили, и чеченцы из Самашек повезли 15 раненых односельчан к посту на автобусе, грузовике и тракторе с прицепом.
    Российские военные с позиций на Сунженском хребте, горной гряде у села, обстреляли прицеп и второй раз ранили Тауса Ибишева, который через несколько дней умер в больнице в Ингушетии.
    Врачи скорой помощи увезли остальных раненых от поста в больницы Ингушетии.
    После этого оккупанты пустили в село машины МККК, а 13 апреля - врачей российского Красного Креста.
    В докладе Наблюдательной миссии российских правозащитных организаций сказано, что не меньше 13 раненых чеченцев из Самашек умерли, потому что вовремя не получили помощи врачей.
    Миссия опубликовала поимённый список убитых в селе, в том числе умерших от ран без помощи врачей(Citation: 662)(Citation: 27).

    30 сентября 1995 года российские внутренние войска и милиция окружили Серноводск, село на западе Ичкерии у границы с Ингушетией, и не пускали сотрудников ООН с гуманитарной помощью к 3000 беженцам на курорте села, среди них 2100 детям (подробнее: «Транспортная блокада»)(Citation: 27)(Citation: 1337).
    С 26 октября солдаты не пропускали в Серноводск машины с едой, а с ноября пускали туда грузовик с едой два раза в неделю(Citation: 27).
    На обращение представителя Генерального секретаря ООН от 7 ноября 1995 года о нехватке еды у беженцев Серноводска правительство России ответило почти через четыре месяца, 29 февраля 1996 года(Citation: 658).
    В декабре 1995 года российские военные обстреляли машину Красного Креста, которая ехала в Ведено, районный центр на юго-востоке Ичкерии.
    Сотрудники Красного Креста не договорились с оккупантами и повернули назад(Citation: 1351).

    14 декабря 1995 года Вооружённые силы Ичкерии освободили Гудермес, второй по величине город Ичкерии, к востоку от Грозного, а 19-20 декабря российские войска после пяти дней обстрелов и бомбёжек захватили его (подробнее: «Неизбирательные нападения»)(Citation: 27).
    Правительство России не разрешило гуманитарным организациям вывезти из города мирных чеченцев, и горожане шли пешком в подконтрольный России Дагестан.
    По дороге замёрзли насмерть беженцы, среди них не меньше четырёх детей(Citation: 656).
    В Осман-Юрте, селе в Дагестане, умерла пятилетняя Зали Зелимханова, которая шла с семьёй из Гудермеса. 21 января 1996 года её мать Мелхаш Зелимханова рассказала там правозащитникам международной организации Human Rights Watch и «Мемориала»: «Когда мы сидели в подвале [в Гудермесе], было очень холодно, и к тому времени, как мы добрались сюда, моя дочь Зали заболела и внезапно умерла»(Citation: 656).
    После захвата Гудермеса российские военные несколько дней не пускали в город сотрудников МККК, пока старики, женщины и дети мёрзли без еды и воды в подвалах разрушенных домов. 26 декабря МККК начал раздавать в Гудермесе помощь(Citation: 1354).

    В декабре 1995 года и январе 1996 года солдаты на российских блокпостах почти не пропускали машины бельгийского отделения «Врачей без границ», и врачи не довезли до Гудермеса лекарства(Citation: 656).
    Под Новый 1996 год российские военные и сотрудники МВД на постах вокруг Серноводска избивали экипажи машин, которые везли детям новогодние подарки(Citation: 988).

    В 1996 году российские военные на блокпостах проверяли у гуманитарных организаций пропуска на поездки по Ичкерии.
    Российские ведомства выдавали пропуск на две недели, часто - за несколько дней до конца срока, или не выдавали вовсе(Citation: 1245).
    К 3 января оккупанты закрыли для машин МККК дороги вокруг Грозного и к Гудермесу.
    Командиры оккупационных войск в Грозном и военное руководство в Москве до конца января не отвечали на просьбы МККК назвать, с кем вести переговоры(Citation: 656). 5 марта 1996 года, во время штурма Серноводска российскими частями Артемова, командующего оккупационными войсками на юго-западе Ичкерии, оккупанты договорились с МККК прекратить огонь и пропустить его сотрудников к раненым и больным, но 6 марта солдаты на посту не пропустили машины МККК, заявив, что приказа не получали(Citation: 988)(Citation: 27).
    Чеченцы, которых ранили оккупанты, попали к врачам только 9 марта, когда российские войска захватили Серноводск(Citation: 27), а МККК попал в село через три недели после начала штурма 3 марта(Citation: 988).
    Во время штурма Самашек оккупанты 16 марта 1996 года не пропустили 17 автобусов Международной организации по миграции, которая договорилась с российскими военными вывезти тех, кто остался в селе, и не выпустили раненых через Новый Шарой, село к югу, хотя чеченцы предлагали за это 100 миллионов рублей и легковую машину(Citation: 27)(Citation: 988). 19 марта, когда оккупанты открыли выход из Самашек, врач сельской больницы увезла раненых в больницу Ачхой-Мартана, районного центра на западе Ичкерии(Citation: 27).

    Весной 1996 года российские войска окружали горные сёла Веденского, Шатойского и Ножай-Юртовского районов на юге и юго-востоке Ичкерии.
    Солдаты не пускали туда врачей и гуманитарные организации(Citation: 27). 10 июля 1996 года российские войска окружили Махкеты, горное село на юго-востоке Ичкерии, и перекрыли единственную дорогу из него, а солдаты на российских блокпостах вокруг Шали, города к юго-востоку от Грозного, не пропускали машины с ранеными.
    Тяжелораненых чеченцев выводили из Махкетов горными тропами, четверо из них умерли от ран в больнице Шали(Citation: 27).

    Правозащитники Human Rights Watch в обзоре за 1995 год писали, что российские войска раз за разом не пропускали или задерживали гуманитарную помощь мирным людям в Ичкерии, особенно в начале войны, и по меньшей мере один раз обстреляли машину «Врачей без границ» с хорошо заметной эмблемой организации(Citation: 1301). 26 марта 1996 года Генеральный секретарь ООН написал в докладе Комиссии по правам человека, что, по данным Human Rights Watch, российские ведомства создавали организациям помощи бюрократические препятствия, мешали её раздаче и не разрешали вывозить больных и раненых из Грозного.
    Сергей Ковалёв, российский уполномоченный по правам человека, сообщил ООН, что Россия мешает доставлять в зону войны гуманитарную помощь, в том числе лекарства для спасения раненых(Citation: 658).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers did not let doctors and humanitarian aid reach the Chechens, and did not let the wounded out to the doctors.

    Russian servicemen at the checkpoints around villages and towns surrounded before an assault did not let in doctors, UN and Red Cross staff, vehicles with food or buses for refugees.
    The occupiers did not let the Chechens they had wounded out to the doctors(Citation: 27).
    Russian soldiers fired on ambulances and vehicles of humanitarian organizations(Citation: 27)(Citation: 1245).

    On 17 December 1994, Russian servicemen shot up a column of cars with refugees from Grozny near the border of Russian-controlled Ingushetia (see: "Mass Killings of Civilians").
    The occupiers fired on ambulance doctors who were driving to the wounded from the Ingush side, and did not let them approach the site of the shooting until half past four in the morning(Citation: 27).

    In January 1995, Russian officials directed humanitarian aid to the northern districts of Ichkeria.
    To the south of Ichkeria and to Russian-controlled Dagestan, where Chechens had fled, Russian agencies sent no aid(Citation: 658).
    On 6 January, in Troitskaya, a stanitsa in Ingushetia, a soldier of a patrol of the Russian Ministry of Internal Affairs shot dead Ruslan, an unarmed driver from a column that a refugee woman from Grozny was leading there for the elderly (see: "Mass Killings of Civilians")(Citation: 1128).
    In early April 1995, Russian officials held up for a day at a checkpoint just across the border of Ichkeria a Red Cross convoy with medical supplies for Grozny, citing the fact that the drivers did not have the required documents(Citation: 1334).

    On 7 April 1995, the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) stormed Samashki, a village in the west of Ichkeria.
    On 8 and 9 April, the special forces of the Russian Ministry of Internal Affairs at checkpoint No. 13 did not let into the village doctors of the International Committee of the Red Cross (ICRC), of Médecins Sans Frontières and of the Russian Red Cross(Citation: 662)(Citation: 1136).
    Valery Borshchov, a deputy of the Russian parliament who was traveling to the village with the doctors on 8 April, told the public tribunal of the Russian Glasnost Foundation in Moscow in February 1996: "As the major, the commander of the 13th post, explained…, they, the military, are guided not by the Geneva Conventions [international treaties on the protection of the wounded and of civilians in war], but by the orders of the local commander, Colonel General Kulikov"(Citation: 986).
    On 9 April, Dzeki Musayeva, born in 1920, died of a hypertensive attack without medical help(Citation: 662).
    On 10 April, Russian servicemen allowed the wounded to be taken out, but did not let ambulances into the village, and Chechens from Samashki drove 15 wounded fellow villagers to the post on a bus, a truck and a tractor with a trailer.
    Russian servicemen from positions on the Sunzha ridge, a range of hills near the village, fired on the trailer and wounded Taus Ibishev a second time; he died a few days later in a hospital in Ingushetia.
    Ambulance doctors took the rest of the wounded from the post to hospitals in Ingushetia.
    After this, the occupiers let ICRC vehicles into the village, and on 13 April doctors of the Russian Red Cross.
    The report of the Observer Mission of Russian human rights organizations says that at least 13 wounded Chechens from Samashki died because they did not receive medical help in time.
    The Mission published a list by name of those killed in the village, including those who died of their wounds without medical help(Citation: 662)(Citation: 27).

    On 30 September 1995, Russian Internal Troops and police surrounded Sernovodsk, a village in the west of Ichkeria near the border with Ingushetia, and did not let UN staff with humanitarian aid reach the 3,000 refugees at the village resort, among them 2,100 children (see: "Transport Blockade")(Citation: 27)(Citation: 1337).
    From 26 October, the soldiers did not let vehicles with food into Sernovodsk, and from November they let a truck with food in twice a week(Citation: 27).
    To the appeal of the representative of the UN Secretary-General of 7 November 1995 about the shortage of food among the refugees of Sernovodsk, the Russian government replied almost four months later, on 29 February 1996(Citation: 658).
    In December 1995, Russian servicemen fired on a Red Cross vehicle that was driving to Vedeno, a district center in the southeast of Ichkeria.
    The Red Cross staff could not come to terms with the occupiers and turned back(Citation: 1351).

    On 14 December 1995, the Armed Forces of Ichkeria liberated Gudermes, the second-largest city of Ichkeria, east of Grozny, and on 19-20 December Russian troops captured it after five days of shelling and bombing (see: "Indiscriminate Attacks")(Citation: 27).
    The Russian government did not allow humanitarian organizations to evacuate Chechen civilians from the city, and the townspeople walked on foot to Russian-controlled Dagestan.
    On the way, refugees froze to death, among them at least four children(Citation: 656).
    In Osman-Yurt, a village in Dagestan, five-year-old Zali Zelimkhanova, who was walking with her family from Gudermes, died.
    On 21 January 1996, her mother Melkhash Zelimkhanova told human rights defenders of the international organization Human Rights Watch and of "Memorial" there: "When we were in the basement [in Gudermes] it was very cold, and by the time we got here my daughter, Zali, got sick and died a sudden death"(Citation: 656).
    After the capture of Gudermes, Russian servicemen for several days did not let ICRC staff into the city, while the elderly, women and children froze without food or water in the basements of destroyed houses.
    On 26 December, the ICRC began distributing aid in Gudermes(Citation: 1354).

    In December 1995 and January 1996, soldiers at Russian checkpoints hardly ever let through the vehicles of the Belgian section of Médecins Sans Frontières, and the doctors could not get medicines to Gudermes(Citation: 656).
    On the eve of New Year 1996, Russian servicemen and officers of the Ministry of Internal Affairs at the posts around Sernovodsk beat the crews of vehicles that were bringing New Year presents to the children(Citation: 988).

    In 1996, Russian servicemen at the checkpoints checked humanitarian organizations for passes for travel around Ichkeria.
    Russian agencies issued a pass for two weeks, often a few days before it expired, or did not issue one at all(Citation: 1245).
    By 3 January, the occupiers had closed the roads around Grozny and to Gudermes to ICRC vehicles.
    The commanders of the occupation troops in Grozny and the military leadership in Moscow did not reply until the end of January to the ICRC's requests to name someone to negotiate with(Citation: 656).
    On 5 March 1996, during the assault on Sernovodsk by the Russian units of Artemov, the commander of the occupation troops in the southwest of Ichkeria, the occupiers agreed with the ICRC to cease fire and let its staff through to the wounded and sick, but on 6 March the soldiers at the post did not let the ICRC vehicles through, saying that they had received no orders(Citation: 988)(Citation: 27).
    The Chechens wounded by the occupiers reached doctors only on 9 March, when Russian troops captured Sernovodsk(Citation: 27), and the ICRC got into the village three weeks after the start of the assault on 3 March(Citation: 988).
    During the assault on Samashki, on 16 March 1996 the occupiers did not let through 17 buses of the International Organization for Migration, which had agreed with the Russian military to evacuate those who remained in the village, and did not let the wounded out through Novy Sharoy, a village to the south, although the Chechens offered 100 million rubles and a car for this(Citation: 27)(Citation: 988).
    On 19 March, when the occupiers opened the way out of Samashki, a doctor of the village hospital took the wounded to the hospital in Achkhoy-Martan, a district center in the west of Ichkeria(Citation: 27).

    In the spring of 1996, Russian troops surrounded the mountain villages of the Vedeno, Shatoy and Nozhay-Yurt districts in the south and southeast of Ichkeria.
    The soldiers did not let doctors or humanitarian organizations in(Citation: 27).
    On 10 July 1996, Russian troops surrounded Makhkety, a mountain village in the southeast of Ichkeria, and blocked the only road out of it, while soldiers at the Russian checkpoints around Shali, a town southeast of Grozny, did not let vehicles with the wounded through.
    Seriously wounded Chechens were carried out of Makhkety along mountain paths; four of them died of their wounds in the hospital in Shali(Citation: 27).

    The human rights defenders of Human Rights Watch wrote in their review for 1995 that Russian troops again and again blocked or delayed humanitarian aid to civilians in Ichkeria, especially at the start of the war, and at least once fired on a Médecins Sans Frontières vehicle with a clearly visible emblem of the organization(Citation: 1301).
    On 26 March 1996, the UN Secretary-General wrote in a report to the Commission on Human Rights that, according to Human Rights Watch, Russian agencies created bureaucratic obstacles for aid organizations, hindered the distribution of aid and did not allow the sick and wounded to be evacuated from Grozny.
    Sergei Kovalyov, Russia's human rights commissioner, informed the UN that Russia was obstructing the delivery of humanitarian aid to the war zone, including medicines to save the wounded(Citation: 658).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти не пускали до чеченців лікарів і гуманітарну допомогу, а поранених не випускали до лікарів.

    Російські військові на блокпостах навколо оточених перед штурмом сіл і міст не пропускали туди лікарів, співробітників ООН, Червоного Хреста, машини з їжею та автобуси для біженців.
    Окупанти не випускали до лікарів поранених ними чеченців(Citation: 27).
    Російські солдати обстрілювали машини швидкої допомоги та гуманітарних організацій(Citation: 27)(Citation: 1245).

    17 грудня 1994 року російські військові розстріляли біля кордону підконтрольної Росії Інгушетії колону легкових машин із біженцями з Грозного (докладніше: «Масові вбивства цивільних»).
    Окупанти обстріляли лікарів швидкої допомоги, які їхали до поранених з інгушського боку, і до пів на п'яту ранку не підпускали їх до місця розстрілу(Citation: 27).

    У січні 1995 року російські чиновники направляли гуманітарну допомогу в північні райони Ічкерії.
    На південь Ічкерії та в підконтрольний Росії Дагестан, куди втекли чеченці, російські відомства допомогу не направляли(Citation: 658). 6 січня в Троїцькій, станиці в Інгушетії, солдат патруля МВС Росії застрелив неозброєного водія Руслана з колони, яку біженка з Грозного вела туди за старими людьми (докладніше: «Масові вбивства цивільних»)(Citation: 1128).
    На початку квітня 1995 року російські чиновники на добу затримали на блокпості відразу за кордоном Ічкерії колону Червоного Хреста з медичними вантажами для Грозного, пославшись на те, що у водіїв немає потрібних документів(Citation: 1334).

    7 квітня 1995 року внутрішні війська МВС Росії (попередники сучасної Росгвардії) штурмували Самашки, село на заході Ічкерії. 8 і 9 квітня спецназ МВС Росії на блокпості № 13 не пропустив у село лікарів Міжнародного комітету Червоного Хреста (МКЧХ), «Лікарів без кордонів» і російського Червоного Хреста(Citation: 662)(Citation: 1136).
    Валерій Борщов, депутат російського парламенту, який 8 квітня їхав у село з лікарями, у лютому 1996 року розповів громадському трибуналу російського фонду «Гласність» у Москві: «Як пояснив майор, командир 13-ї застави…, вони, військові, керуються не женевськими конвенціями [міжнародними договорами про захист поранених і мирних людей на війні], а наказами місцевого командувача генерал-полковника Куликова»(Citation: 986). 9 квітня Дзекі Мусаєва, 1920 року народження, померла від нападу гіпертонії без допомоги лікарів(Citation: 662). 10 квітня російські військові дозволили вивезти поранених, але машини швидкої допомоги в село не пустили, і чеченці із Самашок повезли 15 поранених односельців до поста на автобусі, вантажівці та тракторі з причепом.
    Російські військові з позицій на Сунженському хребті, гірському пасмі біля села, обстріляли причіп і вдруге поранили Тауса Ібішева, який через кілька днів помер у лікарні в Інгушетії.
    Лікарі швидкої допомоги відвезли решту поранених від поста до лікарень Інгушетії.
    Після цього окупанти пустили в село машини МКЧХ, а 13 квітня - лікарів російського Червоного Хреста.
    У доповіді Спостережної місії російських правозахисних організацій сказано, що не менше 13 поранених чеченців із Самашок померли, бо вчасно не отримали допомоги лікарів.
    Місія опублікувала поіменний список убитих у селі, зокрема тих, хто помер від ран без допомоги лікарів(Citation: 662)(Citation: 27).

    30 вересня 1995 року російські внутрішні війська та міліція оточили Серноводськ, село на заході Ічкерії біля кордону з Інгушетією, і не пускали співробітників ООН із гуманітарною допомогою до 3000 біженців на курорті села, серед них 2100 дітей (докладніше: «Транспортна блокада»)(Citation: 27)(Citation: 1337).
    З 26 жовтня солдати не пропускали в Серноводськ машини з їжею, а з листопада пускали туди вантажівку з їжею два рази на тиждень(Citation: 27).
    На звернення представника Генерального секретаря ООН від 7 листопада 1995 року про нестачу їжі в біженців Серноводська уряд Росії відповів майже через чотири місяці, 29 лютого 1996 року(Citation: 658).
    У грудні 1995 року російські військові обстріляли машину Червоного Хреста, яка їхала у Ведено, районний центр на південному сході Ічкерії.
    Співробітники Червоного Хреста не домовилися з окупантами і повернули назад(Citation: 1351).

    14 грудня 1995 року Збройні сили Ічкерії звільнили Гудермес, друге за величиною місто Ічкерії, на схід від Грозного, а 19-20 грудня російські війська після п'яти днів обстрілів і бомбардувань захопили його (докладніше: «Невибіркові напади»)(Citation: 27).
    Уряд Росії не дозволив гуманітарним організаціям вивезти з міста мирних чеченців, і городяни йшли пішки в підконтрольний Росії Дагестан.
    Дорогою замерзли на смерть біженці, серед них не менше чотирьох дітей(Citation: 656).
    В Осман-Юрті, селі в Дагестані, померла п'ятирічна Залі Зелімханова, яка йшла з родиною з Гудермеса. 21 січня 1996 року її мати Мелхаш Зелімханова розповіла там правозахисникам міжнародної організації Human Rights Watch і «Меморіалу»: «Коли ми сиділи в підвалі [у Гудермесі], було дуже холодно, і на той час, як ми дісталися сюди, моя дочка Залі захворіла і раптово померла»(Citation: 656).
    Після захоплення Гудермеса російські військові кілька днів не пускали в місто співробітників МКЧХ, поки старі люди, жінки та діти мерзли без їжі й води в підвалах зруйнованих будинків. 26 грудня МКЧХ почав роздавати в Гудермесі допомогу(Citation: 1354).

    У грудні 1995 року та січні 1996 року солдати на російських блокпостах майже не пропускали машини бельгійського відділення «Лікарів без кордонів», і лікарі не довезли до Гудермеса ліки(Citation: 656).
    Під Новий 1996 рік російські військові та співробітники МВС на постах навколо Серноводська били екіпажі машин, які везли дітям новорічні подарунки(Citation: 988).

    У 1996 році російські військові на блокпостах перевіряли в гуманітарних організацій перепустки на поїздки по Ічкерії.
    Російські відомства видавали перепустку на два тижні, часто - за кілька днів до кінця строку, або не видавали зовсім(Citation: 1245).
    До 3 січня окупанти закрили для машин МКЧХ дороги навколо Грозного і до Гудермеса.
    Командири окупаційних військ у Грозному та військове керівництво в Москві до кінця січня не відповідали на прохання МКЧХ назвати, з ким вести переговори(Citation: 656). 5 березня 1996 року, під час штурму Серноводська російськими частинами Артемова, командувача окупаційних військ на південному заході Ічкерії, окупанти домовилися з МКЧХ припинити вогонь і пропустити його співробітників до поранених і хворих, але 6 березня солдати на посту не пропустили машини МКЧХ, заявивши, що наказу не отримували(Citation: 988)(Citation: 27).
    Чеченці, яких поранили окупанти, потрапили до лікарів лише 9 березня, коли російські війська захопили Серноводськ(Citation: 27), а МКЧХ потрапив у село через три тижні після початку штурму 3 березня(Citation: 988).
    Під час штурму Самашок окупанти 16 березня 1996 року не пропустили 17 автобусів Міжнародної організації з міграції, яка домовилася з російськими військовими вивезти тих, хто залишився в селі, і не випустили поранених через Новий Шарой, село на півдні, хоча чеченці пропонували за це 100 мільйонів рублів і легкову машину(Citation: 27)(Citation: 988). 19 березня, коли окупанти відкрили вихід із Самашок, лікарка сільської лікарні відвезла поранених до лікарні Ачхой-Мартана, районного центру на заході Ічкерії(Citation: 27).

    Навесні 1996 року російські війська оточували гірські села Веденського, Шатойського і Ножай-Юртівського районів на півдні та південному сході Ічкерії.
    Солдати не пускали туди лікарів і гуманітарні організації(Citation: 27). 10 липня 1996 року російські війська оточили Махкети, гірське село на південному сході Ічкерії, і перекрили єдину дорогу з нього, а солдати на російських блокпостах навколо Шалі, міста на південний схід від Грозного, не пропускали машини з пораненими.
    Тяжкопоранених чеченців виводили з Махкетів гірськими стежками, четверо з них померли від ран у лікарні Шалі(Citation: 27).

    Правозахисники Human Rights Watch в огляді за 1995 рік писали, що російські війська раз за разом не пропускали або затримували гуманітарну допомогу мирним людям в Ічкерії, особливо на початку війни, і щонайменше один раз обстріляли машину «Лікарів без кордонів» із добре помітною емблемою організації(Citation: 1301). 26 березня 1996 року Генеральний секретар ООН написав у доповіді Комісії з прав людини, що, за даними Human Rights Watch, російські відомства створювали організаціям допомоги бюрократичні перешкоди, заважали її роздачі й не дозволяли вивозити хворих і поранених із Грозного.
    Сергій Ковальов, російський уповноважений з прав людини, повідомив ООН, що Росія заважає доставляти в зону війни гуманітарну допомогу, зокрема ліки для порятунку поранених(Citation: 658).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
