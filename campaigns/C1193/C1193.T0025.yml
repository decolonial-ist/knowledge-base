description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты бомбили чеченское телевидение, глушили спутниковую связь журналистов и не пускали их к местам своих ударов.

    Командиры оккупационных войск приказывали не пускать журналистов к местам штурмов и бомбёжек.
    Российские военные и милиционеры на блокпостах не пропускали журналистов, в том числе с аккредитацией правительства России, к сёлам и городам, по которым били российские войска (подробнее: «Цензура»)(Citation: 27)(Citation: 988).
    Правозащитники американского Committee to Protect Journalists пишут, что российские военные в Ичкерии глушили спутниковую связь журналистов, портили отснятую плёнку и уничтожали аппаратуру(Citation: 1121).

    29 ноября 1994 года Россия объявила, что в 14:00 отключит всю связь с Ичкерией(Citation: 1159).
    С 21 по 24 декабря российские лётчики били по телецентру в Грозном.
    Командующий российской военной авиацией Дейнекин назвал цель этих ударов: «прекратить оголтелую антироссийскую пропаганду»(Citation: 27).

    3 января 1995 года российские лётчики бомбили Шали, город к юго-востоку от Грозного.
    Правозащитники Human Rights Watch пишут, что лётчики, по-видимому, целились в вышку радиосвязи, а убили нескольких горожан на рынке и в больнице (подробнее: «Неизбирательные нападения»)(Citation: 654). 7 и 8 апреля внутренние войска МВД России (предшественники современной Росгвардии) штурмовали Самашки, село на западе Ичкерии, и убили там 103 мирных чеченца (подробнее: «Массовые убийства гражданских»)(Citation: 662). 11 апреля оккупанты на посту у села не пропустили туда журналистов и пустили их только 13 апреля(Citation: 1136)(Citation: 662). 8 октября российские лётчики бомбили Рошни-Чу, село к юго-западу от Грозного (подробнее: «Неизбирательные нападения»).
    Оккупанты перекрыли все подъезды к селу, а бойцы милицейского спецназа из российского города Иркутска на посту не пускали туда журналистов, ссылаясь на приказ(Citation: 27)(Citation: 1434).
    С 11 декабря, перед «выборами» главы марионеточного правительства 14-17 декабря, российские солдаты на блокпостах не пускали в Грозный журналистов без специальных пропусков (подробнее: «Имитация народного волеизъявления»)(Citation: 27).
    С 14 по 20 декабря, после того как Вооружённые силы Ичкерии освободили Гудермес, второй по величине город республики, оккупанты обстреливали и бомбили город, а до 25 декабря не пускали туда прессу (подробнее: «Неизбирательные нападения»)(Citation: 656).

    В январе 1996 года командование оккупационных войск закрыло для прессы Грозный и восток Ичкерии(Citation: 656).
    С февраля до первых дней марта оккупанты обстреливали из артиллерии окружённый посёлок Новогрозненский на востоке Ичкерии и сёла Аллерой, Центорой, Бачи-Юрт и Суворов-Юрт (подробнее: «Неизбирательные нападения»).
    Российские военные не пускали туда журналистов(Citation: 27).
    С 3 по 9 марта российские войска обстреливали из артиллерии и с вертолётов Серноводск, село на западе Ичкерии (подробнее: «Неизбирательные нападения»)(Citation: 27).
    С 6 по 9 марта, когда Вооружённые силы Ичкерии атаковали оккупантов в Грозном, российские чиновники не пускали журналистов в город(Citation: 1121). 10 марта российский военный комендант Серноводска запретил пускать в село журналистов, правозащитников и любых иностранцев (подробнее: «Выдворение внешних миссий»)(Citation: 27).

    15 марта 1996 года внутренние войска МВД России и 58-я российская армия начали штурм Самашек (подробнее: «Военная интервенция»)(Citation: 27).
    Источники расходятся в числе мирных чеченцев, которых оккупанты убили в селе во время штурма: 35 по списку сельчан(Citation: 27) или около 600 по словам врача, которая лечила там людей (подробнее: «Неизбирательные нападения»)(Citation: 1127)(Citation: 988). 17 и 18 марта оккупанты не пропустили к селу независимых журналистов из Москвы.
    Мария Эйсмонт, корреспондент московской газеты «Сегодня», 22 апреля рассказала общественному трибуналу российского фонда «Гласность» в Москве, что 26 и 27 марта российские военные останавливали её на дорогах к Самашкам, а в село она попала через пять дней.
    В Серноводске российские солдаты, которые участвовали в штурме, развернули журналистов словами: «Не надо туда ехать, вам там нечего делать, тем более что там уже совершенно не на что смотреть».
    Александр Трушин, корреспондент московской «Общей газеты», 21 апреля рассказал трибуналу «Гласности», что в начале апреля начальник российского блокпоста у села позвонил генералу и не пропустил журналистов: «Я спросил у капитана: “Вы доложили, зачем мы едем, с какой целью?”
    Он ответил: “Да, генерал в курсе, и тем не менее приказано вас не пропускать”»(Citation: 988).
    Правозащитники «Мемориала» пишут, что сообщения об этом штурме не попали на телевидение и радио(Citation: 27).

    21 апреля 1996 года оккупанты убили Джохара Дудаева, президента Ичкерии, во время его разговора по спутниковому телефону с посредником в переговорах о мире; по версии, которую правозащитники «Мемориала» считают вероятной, российские военные засекли сигнал этого телефона (подробнее: «Нейтрализация оппозиции»)(Citation: 1609)(Citation: 27). 8 августа 1996 года, когда Вооружённые силы Ичкерии освобождали Грозный, российские солдаты не пустили в город четырёх журналистов иностранных СМИ ни через один из двух въездов(Citation: 1121).

    Правозащитники «Мемориала» пишут, что во второй год войны российские войска отрезали от прессы районы, которые считали нежелательными, гораздо плотнее и успешнее, чем в первый год(Citation: 27).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers bombed Chechen television, jammed journalists' satellite links and kept them away from the sites of their strikes.

    Commanders of the occupation forces ordered that journalists not be let into the sites of assaults and bombings.
    The Russian military and police at checkpoints did not let journalists, including those with accreditation from the Russian government, into the villages and towns that Russian troops were striking (see: "Censorship")(Citation: 27)(Citation: 988).
    Human rights defenders of the American Committee to Protect Journalists write that Russian troops in Ichkeria jammed journalists' satellite transmissions, exposed their film and destroyed their equipment(Citation: 1121).

    On 29 November 1994, Russia announced that at 2 p.m. it would cut off all communications with Ichkeria(Citation: 1159).
    From 21 to 24 December, Russian pilots struck the television center in Grozny.
    Deinekin, commander of Russian military aviation, named the aim of these strikes: "to stop the rabid anti-Russian propaganda"(Citation: 27).

    On 3 January 1995, Russian pilots bombed Shali, a town southeast of Grozny.
    Human rights defenders of Human Rights Watch write that the pilots were apparently trying to hit a radio communication tower, but killed several townspeople at the market and in the hospital (see: "Indiscriminate Attacks")(Citation: 654).
    On 7 and 8 April, the Internal Troops of Russia's Ministry of Internal Affairs (predecessors of today's Rosgvardia) stormed Samashki, a village in the west of Ichkeria, and killed 103 Chechen civilians there (see: "Mass Killings of Civilians")(Citation: 662).
    On 11 April, the occupiers at the post near the village did not let journalists in and admitted them only on 13 April(Citation: 1136)(Citation: 662).
    On 8 October, Russian pilots bombed Roshni-Chu, a village southwest of Grozny (see: "Indiscriminate Attacks").
    The occupiers blocked all the roads to the village, and men of the police special forces from the Russian city of Irkutsk at the post did not let journalists in, citing an order(Citation: 27)(Citation: 1434).
    From 11 December, before the "elections" of the head of the puppet government on 14-17 December, Russian soldiers at checkpoints did not let journalists without special passes into Grozny (see: "Sham Expression of Popular Will")(Citation: 27).
    From 14 to 20 December, after the Armed Forces of Ichkeria had liberated Gudermes, the second-largest city of the republic, the occupiers shelled and bombed the city, and until 25 December did not let the press in (see: "Indiscriminate Attacks")(Citation: 656).

    In January 1996, the command of the occupation forces closed Grozny and the east of Ichkeria to the press(Citation: 656).
    From February until the first days of March, the occupiers shelled with artillery the encircled settlement of Novogroznensky in the east of Ichkeria and the villages of Alleroy, Tsentoroy, Bachi-Yurt and Suvorov-Yurt (see: "Indiscriminate Attacks").
    The Russian military did not let journalists in there(Citation: 27).
    From 3 to 9 March, Russian troops shelled Sernovodsk, a village in the west of Ichkeria, with artillery and fired on it from helicopters (see: "Indiscriminate Attacks")(Citation: 27).
    From 6 to 9 March, while the Armed Forces of Ichkeria were attacking the occupiers in Grozny, Russian officials did not let journalists into the city(Citation: 1121).
    On 10 March, the Russian military commandant of Sernovodsk forbade letting journalists, human rights defenders and any foreigners into the village (see: "Expulsion of Foreign Missions")(Citation: 27).

    On 15 March 1996, the Internal Troops of Russia's Ministry of Internal Affairs and the Russian 58th Army began the assault on Samashki (see: "Military Intervention")(Citation: 27).
    Sources differ on the number of Chechen civilians the occupiers killed in the village during the assault: 35 according to the villagers' list(Citation: 27) or about 600 according to a doctor who treated people there (see: "Indiscriminate Attacks")(Citation: 1127)(Citation: 988).
    On 17 and 18 March, the occupiers did not let independent journalists from Moscow through to the village.
    Maria Eismont, a correspondent of the Moscow newspaper Segodnya, told the public tribunal of the Russian Glasnost Foundation in Moscow on 22 April that on 26 and 27 March the Russian military stopped her on the roads to Samashki, and that she got into the village five days later.
    In Sernovodsk, Russian soldiers who had taken part in the assault turned the journalists back with the words: "There's no need to go there, there's nothing for you to do there, all the more so since there is nothing at all left to look at."
    Alexander Trushin, a correspondent of the Moscow newspaper Obshchaya Gazeta, told the Glasnost tribunal on 21 April that in early April the chief of the Russian checkpoint near the village phoned a general and did not let the journalists through: "I asked the captain: 'Did you report why we are going, for what purpose?' He answered: 'Yes, the general knows, and nevertheless the order is not to let you through'"(Citation: 988).
    Human rights defenders of Memorial write that reports of this assault did not reach television and radio(Citation: 27).

    On 21 April 1996, the occupiers killed Dzhokhar Dudayev, the president of Ichkeria, during his conversation on a satellite phone with a mediator in the peace talks; according to the version that human rights defenders of Memorial consider likely, the Russian military located the signal of this phone (see: "Neutralization of the Opposition")(Citation: 1609)(Citation: 27).
    On 8 August 1996, while the Armed Forces of Ichkeria were liberating Grozny, Russian soldiers did not let four journalists of foreign media into the city through either of its two entrances(Citation: 1121).

    Human rights defenders of Memorial write that in the second year of the war Russian troops cut off from the press the areas they deemed undesirable far more tightly and successfully than in the first year(Citation: 27).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти бомбили чеченське телебачення, глушили супутниковий зв'язок журналістів і не пускали їх до місць своїх ударів.

    Командири окупаційних військ наказували не пускати журналістів до місць штурмів і бомбардувань.
    Російські військові та міліціонери на блокпостах не пропускали журналістів, зокрема з акредитацією уряду Росії, до сіл і міст, по яких били російські війська (докладніше: «Цензура»)(Citation: 27)(Citation: 988).
    Правозахисники американського Committee to Protect Journalists пишуть, що російські військові в Ічкерії глушили супутниковий зв'язок журналістів, псували відзняту плівку і знищували апаратуру(Citation: 1121).

    29 листопада 1994 року Росія оголосила, що о 14:00 відключить увесь зв'язок з Ічкерією(Citation: 1159).
    З 21 по 24 грудня російські льотчики били по телецентру в Грозному.
    Командувач російської військової авіації Дейнекін назвав ціль цих ударів: «припинити оскаженілу антиросійську пропаганду»(Citation: 27).

    3 січня 1995 року російські льотчики бомбили Шалі, місто на південний схід від Грозного.
    Правозахисники Human Rights Watch пишуть, що льотчики, мабуть, цілилися у вежу радіозв'язку, а вбили кількох городян на ринку та в лікарні (докладніше: «Невибіркові напади»)(Citation: 654). 7 і 8 квітня внутрішні війська МВС Росії (попередники сучасної Росгвардії) штурмували Самашки, село на заході Ічкерії, і вбили там 103 мирних чеченців (докладніше: «Масові вбивства цивільних»)(Citation: 662). 11 квітня окупанти на посту біля села не пропустили туди журналістів і пустили їх лише 13 квітня(Citation: 1136)(Citation: 662). 8 жовтня російські льотчики бомбили Рошні-Чу, село на південний захід від Грозного (докладніше: «Невибіркові напади»).
    Окупанти перекрили всі під'їзди до села, а бійці міліцейського спецназу з російського міста Іркутська на посту не пускали туди журналістів, посилаючись на наказ(Citation: 27)(Citation: 1434).
    З 11 грудня, перед «виборами» голови маріонеткового уряду 14-17 грудня, російські солдати на блокпостах не пускали в Грозний журналістів без спеціальних пропусків (докладніше: «Імітація народного волевиявлення»)(Citation: 27).
    З 14 по 20 грудня, після того як Збройні сили Ічкерії звільнили Гудермес, друге за величиною місто республіки, окупанти обстрілювали і бомбили місто, а до 25 грудня не пускали туди пресу (докладніше: «Невибіркові напади»)(Citation: 656).

    У січні 1996 року командування окупаційних військ закрило для преси Грозний і схід Ічкерії(Citation: 656).
    З лютого до перших днів березня окупанти обстрілювали з артилерії оточене селище Новогрозненський на сході Ічкерії та села Аллерой, Центорой, Бачі-Юрт і Суворов-Юрт (докладніше: «Невибіркові напади»).
    Російські військові не пускали туди журналістів(Citation: 27).
    З 3 по 9 березня російські війська обстрілювали з артилерії та з вертольотів Серноводськ, село на заході Ічкерії (докладніше: «Невибіркові напади»)(Citation: 27).
    З 6 по 9 березня, коли Збройні сили Ічкерії атакували окупантів у Грозному, російські чиновники не пускали журналістів у місто(Citation: 1121). 10 березня російський військовий комендант Серноводська заборонив пускати в село журналістів, правозахисників і будь-яких іноземців (докладніше: «Видворення зовнішніх місій»)(Citation: 27).

    15 березня 1996 року внутрішні війська МВС Росії та 58-ма російська армія почали штурм Самашок (докладніше: «Воєнна інтервенція»)(Citation: 27).
    Джерела розходяться в числі мирних чеченців, яких окупанти вбили в селі під час штурму: 35 за списком сельчан(Citation: 27) або близько 600 за словами лікарки, яка лікувала там людей (докладніше: «Невибіркові напади»)(Citation: 1127)(Citation: 988). 17 і 18 березня окупанти не пропустили до села незалежних журналістів із Москви.
    Марія Ейсмонт, кореспондентка московської газети «Сегодня», 22 квітня розповіла громадському трибуналу російського фонду «Гласність» у Москві, що 26 і 27 березня російські військові зупиняли її на дорогах до Самашок, а в село вона потрапила через п'ять днів.
    У Серноводську російські солдати, які брали участь у штурмі, розвернули журналістів словами: «Не треба туди їхати, вам там нічого робити, тим паче що там уже зовсім нема на що дивитися».
    Олександр Трушин, кореспондент московської «Общей газети», 21 квітня розповів трибуналу «Гласності», що на початку квітня начальник російського блокпоста біля села подзвонив генералові і не пропустив журналістів: «Я запитав у капітана: „Ви доповіли, навіщо ми їдемо, з якою метою?“ Він відповів: „Так, генерал у курсі, і все ж наказано вас не пропускати“»(Citation: 988).
    Правозахисники «Меморіалу» пишуть, що повідомлення про цей штурм не потрапили на телебачення і радіо(Citation: 27).

    21 квітня 1996 року окупанти вбили Джохара Дудаєва, президента Ічкерії, під час його розмови по супутниковому телефону з посередником у переговорах про мир; за версією, яку правозахисники «Меморіалу» вважають імовірною, російські військові засікли сигнал цього телефону (докладніше: «Нейтралізація опозиції»)(Citation: 1609)(Citation: 27). 8 серпня 1996 року, коли Збройні сили Ічкерії звільняли Грозний, російські солдати не пустили в місто чотирьох журналістів іноземних ЗМІ ні через один із двох в'їздів(Citation: 1121).

    Правозахисники «Меморіалу» пишуть, що на другий рік війни російські війська відрізали від преси райони, які вважали небажаними, набагато щільніше й успішніше, ніж у перший рік(Citation: 27).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
