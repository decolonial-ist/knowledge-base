description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты без суда убивали задержанных чеченцев.

    В начале 1995 года при «зачистках» (так россияне называли обыски домов и задержания чеченцев) в Грозном российские военные расстреливали мирных чеченцев сразу после задержания(Citation: 27).
    Российский конвой убивал их в дороге, в кузовах грузовиков и в пеших колоннах(Citation: 27)(Citation: 662).

    На базах и позициях своих частей российские военные забивали насмерть или расстреливали задержанных чеченцев.
    Оккупанты тайно закапывали тела убитых у своих позиций и не отдавали их семьям (подробнее: «Надругательство над мёртвыми»)(Citation: 27)(Citation: 986)(Citation: 988).

    В начале января 1995 года российские солдаты задержали у консервного завода в Грозном больше 60 мужчин. 3 января конвой повёз их в фильтрационный лагерь в Моздоке, городе в подконтрольной России Северной Осетии.
    Когда один из двух грузовиков сломался, охрана уложила всех в кузов второго, в шесть слоёв и больше.
    Те, кто лежал в нижних слоях, задыхались, а в тех, кто пытался пошевелиться, конвой стрелял(Citation: 27).
    Закраил Вайраев ехал в этом грузовике. 28 февраля 1995 года в Назрани, городе в подконтрольной России Ингушетии, он рассказал о дороге правозащитнику американской организации Freedom House.
    В записи его показаний сказано: «В машине перевозили 63 человека.
    По дороге двое задохнулись, а шестерых расстреляли тут же, в машине.
    Так мертвецы и ехали вместе с остальными до Моздока.
    Били на протяжении всего пути»(Citation: 922).
    Среди застреленных в кузове был юноша из Грозного Руслан Касаев(Citation: 27).

    28 января 1995 года российские солдаты вели под конвоем братьев Хамидовых по территории части внутренних войск МВД России (предшественников современной Росгвардии) на улице Маяковского в Грозном.
    Соседка услышала, как один из братьев крикнул, что их ведут на расстрел, и рассказала об этом их отцу Хусейну Хамидову, который с января 1995 года искал пропавших в Ичкерии людей и вскрывал массовые захоронения.
    Со слов соседки отец нашёл могилу там, откуда ушла российская военная часть(Citation: 27). 24 апреля 1996 года Хусейн Хамидов рассказал в Москве общественному трибуналу российского фонда «Гласность»: «2 апреля [1995 года] я раскопал захоронение пяти трупов во дворе частного дома по улице Маяковского, 16, и среди них были мои сыновья. …
    У них были связаны ноги веревкой, все зубы были выбиты, на теле были следы сильных побоев».
    О других могилах отец братьев сказал трибуналу: «На основании производимых нами эксгумаций я могу утверждать, что в бывших местах дислокации [российских] воинских частей производились расстрелы людей.
    Их забирали в галошах, в домашней одежде, на головы у них были надеты чехлы от подушек (наволочки).
    У многих выкопанных трупов руки и ноги были связаны колючей проволокой, было множество ножевых ранений»(Citation: 988). 17 мая 1995 года прокурор оккупационной администрации в Заводском районе Грозного возбудил дело об убийстве братьев.
    Российские военные прокуроры получили дело и приостановили его, потому что не нашли виновных(Citation: 27).

    В апреле 1995 года российские военные задержали у фильтрационного лагеря на северо-восточной окраине Грозного троих чеченцев, которые приехали за отпущенным родственником.
    Родственник нашёл их тела в канализационной трубе в полутора километрах оттуда: у убитых были выколоты глаза и отрезаны уши, у каждого - по 15 пулевых ранений(Citation: 986). 7-8 апреля 1995 года бойцы внутренних войск МВД России и российские милиционеры при обысках в Самашках, селе на западе Ичкерии, расстреливали во дворах задержанных чеченских мужчин, и Наблюдательная миссия российских правозащитных организаций назвала по именам 27 из них (подробнее: «Массовые убийства гражданских»)(Citation: 662).
    Российский конвой, который вёл задержанных чеченцев из Самашек в воинскую часть в сопках к северу от села, застрелил по дороге троих: раненого из них солдат убил по приказу командира конвоя(Citation: 662)(Citation: 27). 9 мая 1995 года солдаты 503-го полка российской армии задержали на блокпосту троих чеченцев из Шали, города к юго-востоку от Грозного.
    После того как 3 июня полк ушёл, родные нашли тела двоих тайно закопанными на поле у Шали, а 6 июня тело третьего - на кладбище, на всех телах были следы пыток(Citation: 986)(Citation: 27).

    23 февраля 1996 года, когда 58-я российская армия наступала на Бамут, село к юго-западу от Грозного, солдаты этой армии посадили на бронетранспортёр Шарипа Батаева, чеченца из Аршты, села в подконтрольной России Ингушетии. 20 марта следователи из Ингушетии нашли его тело в неглубокой могиле у позиции разведчиков 693-го полка 58-й армии: оккупанты перебили ему запястья и застрелили его в затылок(Citation: 27)(Citation: 988).
    С 3 по 9 марта 1996 года российские войска штурмовали Серноводск, село на западе Ичкерии, а солдаты задержали на улице молодую чеченку и увели в соседний дом, где позже было найдено её тело(Citation: 1403)(Citation: 659). 20 марта семеро российских военных высадились с вертолёта у молочной фермы возле Нагорного, села рядом с Грозным, выстроили в шеренгу мирных чеченцев, которые прятались в сарае, и расстреляли самых молодых мужчин.
    Источники расходятся: Human Rights Watch пишет о двух убитых братьях, Чеченский женский комитет назвал пятерых расстрелянных у фермы и Умара Тужуева, которого военные живым сбросили с вертолёта(Citation: 657)(Citation: 1152)(Citation: 988).

    28 марта 1996 года оккупанты отдали за пятерых своих солдат троих чеченцев и тела ещё двух задержанных, и на одном из тел командир Вооружённых сил Ичкерии Султан Качеев увидел рану от штыка (подробнее: «Захват заложников»)(Citation: 657)(Citation: 1152). 30 апреля бойцы внутренних войск МВД России задержали на блокпосту в Грозном чеченцев, жителей города, и бросили в яму в Ханкале, главной базе оккупационных войск на восточной окраине Грозного.
    Охрана забила насмерть двоих, остальных 3 мая российский уголовный розыск увёз из Ханкалы, а прокурор марионеточного правительства подтвердил, что оба умерли от побоев и связи с армией Ичкерии у них не было(Citation: 27). 12 мая российские войска захватили Харсеной, горное село на юге Ичкерии, и солдаты расстреляли на дороге шестерых молодых чеченцев, которые ушли из села, а их тела не отдали родным.
    В селе солдаты расстреляли ещё одного молодого чеченца, который просил их не входить в мечеть(Citation: 988). 17 августа 1996 года российские военные в масках обыскивали дома у республиканской больницы в Грозном.
    Когда оккупанты ушли из квартала, родные нашли в соседнем дворе тела двух чеченцев, двоюродных братьев, со связанными проволокой руками и следами пыток(Citation: 921).

    26 марта 1996 года Генеральный секретарь ООН передал Комиссии ООН по правам человека сообщения, что российские войска без суда казнили захваченных чеченских мужчин: мирных людей и бойцов армии Ичкерии(Citation: 658).
    Правозащитники «Мемориала» пишут, что сотрудники МВД России и российские военные казнили людей в Ичкерии без суда.
    По их выводу, конвой и охрана чувствовали себя безнаказанными в первые часы и дни после задержания, потому что МВД России отсчитывало срок содержания задержанного с того часа, когда его привозили в фильтрационный лагерь(Citation: 27)(Citation: 662).
    Неизвестно, скольких задержанных чеченцев оккупанты убили с декабря 1994 года по август 1996 года.
    В начале 1997 года правозащитники «Мемориала» писали о задержанных и пропавших без вести чеченцах: «Многие из них погибли, и в настоящее время необходимо найти места их захоронений, эксгумировать и опознать трупы»(Citation: 987).

    Российские военные прокуроры отдали под суд бывшего командира 503-го полка Соколова за убийство троих чеченцев из Шали, но военный суд вернул дело прокурорам, и к весне 1998 года они его не закончили (подробнее: «Безнаказанность исполнителей»)(Citation: 27).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers killed detained Chechens without trial.

    In early 1995, during "zachistki" ("sweeps", as Russians called house searches and detentions of Chechens) in Grozny, Russian servicemen shot peaceful Chechens dead right after detaining them(Citation: 27).
    Russian escorts killed them on the way, in the backs of trucks and in columns on foot(Citation: 27)(Citation: 662).

    At the bases and positions of their units, Russian servicemen beat detained Chechens to death or shot them.
    The occupiers secretly buried the bodies of the killed near their positions and did not return them to the families (see: "Desecration of the Dead")(Citation: 27)(Citation: 986)(Citation: 988).

    In early January 1995, Russian soldiers detained more than 60 men near the cannery in Grozny.
    On 3 January, an escort drove them to the filtration camp in Mozdok, a town in Russian-controlled North Ossetia.
    When one of the two trucks broke down, the guards laid everyone in the back of the second one, in six layers and more.
    Those lying in the lower layers suffocated, and the escort shot at those who tried to move(Citation: 27).
    Zakrail Vairayev rode in that truck.
    On 28 February 1995, in Nazran, a town in Russian-controlled Ingushetia, he told a human rights defender of the American organization Freedom House about the journey.
    The record of his testimony says: "The vehicle was carrying 63 people.
    On the way, two suffocated, and six were shot right there, in the vehicle.
    So the dead rode along with the rest all the way to Mozdok.
    They beat us the whole way"(Citation: 922).
    Among those shot dead in the back of the truck was Ruslan Kasayev, a young man from Grozny(Citation: 27).

    On 28 January 1995, Russian soldiers led the Khamidov brothers under escort across the grounds of a unit of the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) on Mayakovsky Street in Grozny.
    A neighbor heard one of the brothers shout that they were being led to be shot, and told their father Khusein Khamidov, who from January 1995 had been searching for people missing in Ichkeria and opening mass graves.
    From the neighbor's words, the father found the grave at the place the Russian military unit had left(Citation: 27).
    On 24 April 1996, in Moscow, Khusein Khamidov told the public tribunal of the Russian Glasnost Foundation: "On 2 April [1995] I dug up a burial of five bodies in the yard of a private house at 16 Mayakovsky Street, and among them were my sons. …
    Their legs were tied with rope, all their teeth were knocked out, there were marks of severe beatings on their bodies".
    Of other graves the brothers' father told the tribunal: "On the basis of the exhumations we carried out, I can state that people were shot at the former locations of [Russian] military units.
    They were taken away in galoshes, in house clothes, with pillowcases pulled over their heads.
    Many of the exhumed bodies had their hands and feet tied with barbed wire, and there were numerous knife wounds"(Citation: 988).
    On 17 May 1995, the prosecutor of the occupation administration in the Zavodskoy district of Grozny opened a case into the murder of the brothers.
    Russian military prosecutors received the case and suspended it because they had not found the culprits(Citation: 27).

    In April 1995, Russian servicemen detained three Chechens near the filtration camp on the northeastern outskirts of Grozny; they had come for a released relative.
    The relative found their bodies in a sewer pipe a kilometer and a half from there: the eyes of the killed had been gouged out and their ears cut off, and each had 15 bullet wounds(Citation: 986).
    On 7-8 April 1995, soldiers of the Internal Troops of the Russian Ministry of Internal Affairs and Russian police officers, during searches in Samashki, a village in the west of Ichkeria, shot detained Chechen men in courtyards, and the Observer Mission of Russian human rights organizations named 27 of them (see: "Mass Killings of Civilians")(Citation: 662).
    The Russian escort that led detained Chechens from Samashki to a military unit in the hills north of the village shot three of them dead on the way: one of them, wounded, a soldier killed on the order of the escort commander(Citation: 662)(Citation: 27).
    On 9 May 1995, soldiers of the 503rd regiment of the Russian army detained three Chechens from Shali, a town southeast of Grozny, at a checkpoint.
    After the regiment left on 3 June, relatives found the bodies of two of them secretly buried in a field near Shali, and on 6 June the body of the third at a cemetery; all the bodies bore marks of torture(Citation: 986)(Citation: 27).

    On 23 February 1996, when the Russian 58th Army was advancing on Bamut, a village southwest of Grozny, soldiers of that army put Sharip Batayev, a Chechen from Arshty, a village in Russian-controlled Ingushetia, onto an armored personnel carrier.
    On 20 March, investigators from Ingushetia found his body in a shallow grave near the position of the reconnaissance troops of the 693rd regiment of the 58th Army: the occupiers had broken his wrists and shot him in the back of the head(Citation: 27)(Citation: 988).
    From 3 to 9 March 1996, Russian troops stormed Sernovodsk, a village in the west of Ichkeria, and soldiers detained a young Chechen woman in the street and took her into a neighboring house, where her body was later found(Citation: 1403)(Citation: 659).
    On 20 March, seven Russian servicemen landed from a helicopter at a dairy farm near Nagornoye, a village close to Grozny, lined up the peaceful Chechens who were hiding in a barn and shot the youngest men.
    Sources differ: Human Rights Watch writes of two brothers killed, while the Chechen Women's Committee named five people shot at the farm and Umar Tuzhuyev, whom the servicemen threw alive out of the helicopter(Citation: 657)(Citation: 1152)(Citation: 988).

    On 28 March 1996, the occupiers gave up three Chechens and the bodies of two more detainees in exchange for five of their soldiers, and on one of the bodies Sultan Kacheyev, a commander of the Armed Forces of Ichkeria, saw a bayonet wound (see: "Hostage-Taking")(Citation: 657)(Citation: 1152).
    On 30 April, soldiers of the Internal Troops of the Russian Ministry of Internal Affairs detained Chechens, residents of the city, at a checkpoint in Grozny and threw them into a pit in Khankala, the main base of the occupation troops on the eastern outskirts of Grozny.
    The guards beat two of them to death; the rest were taken out of Khankala on 3 May by the Russian criminal investigation police, and a prosecutor of the puppet government confirmed that both had died of beatings and had had no connection to the army of Ichkeria(Citation: 27).
    On 12 May, Russian troops seized Kharsenoy, a mountain village in the south of Ichkeria, and soldiers shot dead on the road six young Chechens who had left the village, and did not return their bodies to their relatives.
    In the village, the soldiers shot dead another young Chechen who asked them not to enter the mosque(Citation: 988).
    On 17 August 1996, masked Russian servicemen searched houses near the republican hospital in Grozny.
    When the occupiers left the block, relatives found in a neighboring yard the bodies of two Chechens, cousins, with their hands tied with wire and marks of torture(Citation: 921).

    On 26 March 1996, the UN Secretary-General transmitted to the UN Commission on Human Rights reports that Russian troops had executed captured Chechen men without trial: peaceful people and soldiers of the army of Ichkeria(Citation: 658).
    The human rights defenders of "Memorial" write that officers of the Russian Ministry of Internal Affairs and Russian servicemen executed people in Ichkeria without trial.
    In their conclusion, escorts and guards felt unpunishable in the first hours and days after a detention because the Russian Ministry of Internal Affairs counted a detainee's term of custody from the hour he was brought to a filtration camp(Citation: 27)(Citation: 662).
    It is unknown how many detained Chechens the occupiers killed from December 1994 to August 1996.
    In early 1997, the human rights defenders of "Memorial" wrote of detained and missing Chechens: "Many of them have died, and now it is necessary to find the places of their burial, exhume and identify the bodies"(Citation: 987).

    Russian military prosecutors put Sokolov, the former commander of the 503rd regiment, on trial for the murder of three Chechens from Shali, but a military court returned the case to the prosecutors, and by the spring of 1998 they had not completed it (see: "Impunity of Perpetrators")(Citation: 27).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти без суду вбивали затриманих чеченців.

    На початку 1995 року під час «зачисток» (так росіяни називали обшуки будинків і затримання чеченців) у Грозному російські військові розстрілювали мирних чеченців одразу після затримання(Citation: 27).
    Російський конвой убивав їх дорогою, у кузовах вантажівок і в піших колонах(Citation: 27)(Citation: 662).

    На базах і позиціях своїх частин російські військові забивали на смерть або розстрілювали затриманих чеченців.
    Окупанти таємно закопували тіла вбитих біля своїх позицій і не віддавали їх сім'ям (докладніше: «Наруга над мертвими»)(Citation: 27)(Citation: 986)(Citation: 988).

    На початку січня 1995 року російські солдати затримали біля консервного заводу в Грозному понад 60 чоловіків. 3 січня конвой повіз їх до фільтраційного табору в Моздоку, місті в підконтрольній Росії Північній Осетії.
    Коли одна з двох вантажівок зламалася, охорона поклала всіх у кузов другої, у шість шарів і більше.
    Ті, хто лежав у нижніх шарах, задихалися, а в тих, хто намагався поворухнутися, конвой стріляв(Citation: 27).
    Закраїл Вайраєв їхав у цій вантажівці. 28 лютого 1995 року в Назрані, місті в підконтрольній Росії Інгушетії, він розповів про дорогу правозахисникові американської організації Freedom House.
    У записі його свідчень сказано: «У машині перевозили 63 людини.
    Дорогою двоє задихнулися, а шістьох розстріляли тут же, у машині.
    Так мерці й їхали разом з іншими до Моздока.
    Били протягом усього шляху»(Citation: 922).
    Серед застрелених у кузові був юнак із Грозного Руслан Касаєв(Citation: 27).

    28 січня 1995 року російські солдати вели під конвоєм братів Хамідових територією частини внутрішніх військ МВС Росії (попередників сучасної Росгвардії) на вулиці Маяковського в Грозному.
    Сусідка почула, як один із братів крикнув, що їх ведуть на розстріл, і розповіла про це їхньому батькові Хусейну Хамідову, який з січня 1995 року шукав зниклих в Ічкерії людей і розкривав масові поховання.
    Зі слів сусідки батько знайшов могилу там, звідки пішла російська військова частина(Citation: 27). 24 квітня 1996 року Хусейн Хамідов розповів у Москві громадському трибуналу російського фонду «Гласність»: «2 квітня [1995 року] я розкопав поховання п'яти трупів у дворі приватного будинку по вулиці Маяковського, 16, і серед них були мої сини. …
    У них були зв'язані ноги мотузкою, усі зуби були вибиті, на тілі були сліди сильних побоїв».
    Про інші могили батько братів сказав трибуналу: «На підставі проведених нами ексгумацій я можу стверджувати, що в колишніх місцях дислокації [російських] військових частин проводилися розстріли людей.
    Їх забирали в калошах, у домашньому одязі, на головах у них були надіті чохли від подушок (наволочки).
    У багатьох викопаних трупів руки й ноги були зв'язані колючим дротом, було багато ножових поранень»(Citation: 988). 17 травня 1995 року прокурор окупаційної адміністрації в Заводському районі Грозного порушив справу про вбивство братів.
    Російські військові прокурори отримали справу й зупинили її, бо не знайшли винних(Citation: 27).

    У квітні 1995 року російські військові затримали біля фільтраційного табору на північно-східній околиці Грозного трьох чеченців, які приїхали за відпущеним родичем.
    Родич знайшов їхні тіла в каналізаційній трубі за півтора кілометра звідти: у вбитих були виколоті очі й відрізані вуха, у кожного - по 15 кульових поранень(Citation: 986). 7-8 квітня 1995 року бійці внутрішніх військ МВС Росії та російські міліціонери під час обшуків у Самашках, селі на заході Ічкерії, розстрілювали у дворах затриманих чеченських чоловіків, і Спостережна місія російських правозахисних організацій назвала на ім'я 27 із них (докладніше: «Масові вбивства цивільних»)(Citation: 662).
    Російський конвой, який вів затриманих чеченців із Самашок до військової частини в сопках на північ від села, застрелив дорогою трьох: пораненого з них солдат убив за наказом командира конвою(Citation: 662)(Citation: 27). 9 травня 1995 року солдати 503-го полку російської армії затримали на блокпості трьох чеченців із Шалі, міста на південний схід від Грозного.
    Після того як 3 червня полк пішов, рідні знайшли тіла двох таємно закопаними на полі біля Шалі, а 6 червня тіло третього - на кладовищі, на всіх тілах були сліди катувань(Citation: 986)(Citation: 27).

    23 лютого 1996 року, коли 58-ма російська армія наступала на Бамут, село на південний захід від Грозного, солдати цієї армії посадили на бронетранспортер Шаріпа Батаєва, чеченця з Аршти, села в підконтрольній Росії Інгушетії. 20 березня слідчі з Інгушетії знайшли його тіло в неглибокій могилі біля позиції розвідників 693-го полку 58-ї армії: окупанти перебили йому зап'ястки й застрелили його в потилицю(Citation: 27)(Citation: 988).
    З 3 по 9 березня 1996 року російські війська штурмували Серноводськ, село на заході Ічкерії, а солдати затримали на вулиці молоду чеченку й повели до сусіднього будинку, де пізніше було знайдено її тіло(Citation: 1403)(Citation: 659). 20 березня семеро російських військових висадилися з гелікоптера біля молочної ферми поблизу Нагорного, села поруч із Грозним, вишикували в шеренгу мирних чеченців, які ховалися в сараї, і розстріляли наймолодших чоловіків.
    Джерела розходяться: Human Rights Watch пише про двох убитих братів, Чеченський жіночий комітет назвав п'ятьох розстріляних біля ферми та Умара Тужуєва, якого військові живим скинули з гелікоптера(Citation: 657)(Citation: 1152)(Citation: 988).

    28 березня 1996 року окупанти віддали за п'ятьох своїх солдатів трьох чеченців і тіла ще двох затриманих, і на одному з тіл командир Збройних сил Ічкерії Султан Качеєв побачив рану від штика (докладніше: «Захоплення заручників»)(Citation: 657)(Citation: 1152). 30 квітня бійці внутрішніх військ МВС Росії затримали на блокпості в Грозному чеченців, мешканців міста, і кинули в яму в Ханкалі, головній базі окупаційних військ на східній околиці Грозного.
    Охорона забила на смерть двох, решту 3 травня російський кримінальний розшук вивіз із Ханкали, а прокурор маріонеткового уряду підтвердив, що обоє померли від побоїв і зв'язку з армією Ічкерії в них не було(Citation: 27). 12 травня російські війська захопили Харсеной, гірське село на півдні Ічкерії, і солдати розстріляли на дорозі шістьох молодих чеченців, які вийшли із села, а їхні тіла не віддали рідним.
    У селі солдати розстріляли ще одного молодого чеченця, який просив їх не входити до мечеті(Citation: 988). 17 серпня 1996 року російські військові в масках обшукували будинки біля республіканської лікарні в Грозному.
    Коли окупанти пішли з кварталу, рідні знайшли в сусідньому дворі тіла двох чеченців, двоюрідних братів, зі зв'язаними дротом руками та слідами катувань(Citation: 921).

    26 березня 1996 року Генеральний секретар ООН передав Комісії ООН з прав людини повідомлення, що російські війська без суду страчували захоплених чеченських чоловіків: мирних людей і бійців армії Ічкерії(Citation: 658).
    Правозахисники «Меморіалу» пишуть, що співробітники МВС Росії та російські військові страчували людей в Ічкерії без суду.
    За їхнім висновком, конвой та охорона почувалися безкарними в перші години й дні після затримання, бо МВС Росії відлічувало строк утримання затриманого з тієї години, коли його привозили до фільтраційного табору(Citation: 27)(Citation: 662).
    Невідомо, скількох затриманих чеченців окупанти вбили з грудня 1994 року по серпень 1996 року.
    На початку 1997 року правозахисники «Меморіалу» писали про затриманих і зниклих безвісти чеченців: «Багато з них загинули, і нині необхідно знайти місця їхнього поховання, ексгумувати й упізнати трупи»(Citation: 987).

    Російські військові прокурори віддали під суд колишнього командира 503-го полку Соколова за вбивство трьох чеченців із Шалі, але військовий суд повернув справу прокурорам, і до весни 1998 року вони її не закінчили (докладніше: «Безкарність виконавців»)(Citation: 27).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
