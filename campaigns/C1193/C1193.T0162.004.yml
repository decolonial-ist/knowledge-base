description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты били и пытали задержанных чеченцев.

    Российские солдаты с милиционерами били их на блокпостах и при «зачистках» (так россияне называли обыски домов и задержания чеченцев)(Citation: 662).
    Конвой оккупантов бил их в грузовиках и вертолётах.
    При выгрузке солдаты заставляли их бежать между двумя рядами охранников, которые били бегущих дубинками и прикладами(Citation: 27)(Citation: 662).

    На допросах российские военные и милиционеры требовали от чеченцев признать, что они воевали, назвать бойцов Вооружённых сил Ичкерии и места, где спрятано оружие(Citation: 27).
    В ямах, тюремных машинах и цистернах российская охрана по нескольку суток держала их со связанными руками, с завязанными глазами, без воды и еды(Citation: 27)(Citation: 657).
    Оккупанты отпускали избитых узников без обвинений или отдавали на обмен за пленных российских военных (подробнее: «Захват заложников»)(Citation: 27).

    Российские военные и милиционеры, от солдат на блокпостах до военных следователей на базах, пытали чеченцев с декабря 1994 года по сентябрь 1996 года. 25 декабря 1994 года у посёлка Долинский к северо-западу от Грозного российские солдаты задержали и избили Али Исраилова из Серноводска, села на западе Ичкерии.
    Охранники лагеря в Моздоке, городе в подконтрольной России Северной Осетии, избивали его ещё три дня и отпустили.
    После побоев Али Исраилов полтора месяца лечился(Citation: 922).

    До конца января 1995 года ОМОН из Рязани, отряд российской милиции, охранял фильтрационный лагерь МВД России в Моздоке и пытал задержанных чеченцев на допросах в тюремных вагонах (подробнее: «Система фильтрационных лагерей»).
    Охранники, которых МВД прислало на смену 24-26 января, не пытали на допросах, но били узников(Citation: 27).

    1 января 1995 года российские солдаты задержали у консервного завода в Грозном Закраила Вайраева, а охранники в Моздоке и в Пятигорске, городе на юге России, избили его так, что у него треснула грудная клетка и открылся туберкулёз.
    Охрана лагеря в Моздоке восемь суток оставляла его, больного, в тюремном вагоне, а затем отправила в больницу в Назрани, городе в подконтрольной России Ингушетии(Citation: 922).
    С 3 января по 15 февраля 1995 года охрана лагеря у консервного завода в Грозном, конвой и охранники тюрем в Пятигорске и в Ставрополе, ещё одном городе на юге России, избивали Магомеда Мейриева из Грозного, а в Пятигорске натравили на него собаку. 15 февраля оккупанты отпустили его в Моздоке со шрамами от прикладов и укусов(Citation: 922). 23 января 1995 года на блокпосту № 13 между Серноводском и соседним селом Самашки сотрудники МВД России избили Ахмеда Идрисова из Грозного, угрожая убить, и 31 января отпустили его как невиновного, с переломами рёбер(Citation: 922).
    Весной 1995 года охрана лагеря у консервного завода в Грозном давала узникам вместо воды мочу(Citation: 988). 25 марта 1995 года российские солдаты задержали чеченца Исани Ханоева в его доме в Ассиновской, станице на западе Ичкерии.
    Охранники воинской части у станицы ночами избивали его и пытали током, а 6 апреля МВД отпустило его из Моздока как невиновного(Citation: 27).

    С конца января 1995 года российские военные держали задержанных чеченцев в ямах и тюремных машинах при воинских частях, куда не пускали правозащитников и прокуроров.
    Такие ямы были в Ханкале, главной базе оккупационных войск на восточной окраине Грозного, и у Ассиновской(Citation: 27).

    7 апреля 1995 года внутренние войска МВД России (предшественники современной Росгвардии) штурмовали Самашки.
    В этот день сотрудники МВД задержали на блокпосту Махмудэмина Изиева из Самашек, который уходил с семьёй в Серноводск, и вертолётом отправили на полевой командный пункт российских войск у Ассиновской(Citation: 27). 8 апреля бойцы внутренних войск при обысках в Самашках били прикладами чеченских мужчин и подростков, а в воинской части к северу от села и у Ассиновской солдаты травили их собаками(Citation: 662)(Citation: 1136)(Citation: 738).
    У Ассиновской охрана три дня держала Махмудэмина Изиева без воды и еды в тюремной машине на дне ямы.
    На допросах военные били его по почкам и в грудь, присоединяли к его шее провода и пытали током, от которого остались ожоги(Citation: 662)(Citation: 27). 10 апреля оккупанты отправили его вертолётом в фильтрационный лагерь в Моздоке, а шестерых несовершеннолетних чеченцев из Самашек в этот день отпустили оттуда в синяках и со следами укусов(Citation: 662)(Citation: 1136)(Citation: 738).
    Перед приездом представителей Международного комитета Красного Креста 11-13 апреля охрана лагеря пригрозила задержанным чеченцам: «Они уйдут, а вы здесь останетесь»(Citation: 662). 18 апреля МВД России отпустило Махмудэмина Изиева как невиновного. 20 апреля в Серноводске он рассказал наблюдателям «Мемориала» о Моздоке: «На допросах снова избивали, угрожали расстрелом.
    Следователь сам не бил, били люди в масках, когда он выходил из отсека»(Citation: 27).

    Летом 1995 года охрана у Ассиновской подвешивала Рамзана Исаева из Алхан-Юрта, села к юго-западу от Грозного, за наручники, жгла ему ступни горелкой, сжимала голову металлическим обручем и пытала током, а потом оккупанты отдали его за пленного из российской армии(Citation: 27).
    В июле 1995 года российские солдаты на две недели посадили Микаэла Ивгиева, журналиста чеченского журнала «Орга», в закопанную в землю цистерну в Ханкале, где военные пытали его током и подвешивали за связанные за спиной руки; Микаэл Ивгиев выжил(Citation: 27). 23 декабря 1995 года российские военные задержали Руслана Сосламбекова на блокпосту у въезда в Грозный и 28 дней держали в лагере МВД в гаражах на окраине города, где охранники при нём травили узников собаками и отбивали им внутренности, а потом отпустили(Citation: 986).

    В начале 1996 года охранники лагеря в Грозном подвесили чеченца горизонтально и избили, и врачи городской больницы № 9 лечили его от перебитых рёбер(Citation: 657)(Citation: 1152).
    В феврале 1996 года оккупанты привезли на обмен в Шатой, районный центр в горах на юге Ичкерии, пленного чеченца, избитого так, что из бронетранспортёра его вынесли на руках, и армия Ичкерии отдала за него российских солдат(Citation: 27).
    В марте 1996 года бойцы МВД России тринадцать суток держали в железнодорожной цистерне в Ханкале троих чеченцев с блокпоста между Гойтами и Старыми Атагами, сёлами к югу от Грозного, изображали их расстрел и резали ножом, а в апреле военные следователи в Ханкале загоняли иглы под ногти Саидашу Шамахурову из села Гикалово.
    Оккупанты отдали всех четверых на обмен (подробнее: «Захват заложников»)(Citation: 657).

    В мае 1995 года Сергей Ковалёв, глава Наблюдательной миссии российских правозащитников, написал, что его группа опросила больше ста чеченцев, бывших узников российских оккупантов.
    По его словам, почти каждого из них оккупанты били и унижали, а многих пытали(Citation: 919).
    В сентябре 1995 года специальный докладчик ООН по пыткам написал правительству России, что охрана лагерей систематически избивала многих узников, чтобы вырвать признание в поддержке Джохара Дудаева(Citation: 738).
    Правозащитники «Мемориала» пишут, что на жестокое обращение жаловалось большинство людей, прошедших фильтрационные лагеря, а осмотры судебных медиков подтверждают их рассказы.
    По докладу «Мемориала», в ямах при воинских частях оккупанты пытали всё чаще, а у Ассиновской - и в 1996 году(Citation: 27).
    В январе 1997 года правозащитники Human Rights Watch написали, что в 1996 году российские военные продолжали пытать чеченцев в Ханкале(Citation: 657).
    Неизвестно, сколько таких преступлений совершили оккупационные войска с декабря 1994 года по сентябрь 1996 года.
    Правозащитники «Мемориала» опубликовали рассказы задержанных чеченцев о побоях и пытках в лагерях зимой и весной 1995 года(Citation: 922).

    Российские суды не осудили ни одного оккупанта за пытки и истязания чеченцев (подробнее: «Безнаказанность исполнителей»)(Citation: 27).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661).
    Российские военные по меньшей мере до конца сентября удерживали чеченцев на своих базах в Грозном и в Ханкале(Citation: 27). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers beat and tortured detained Chechens.

    Russian soldiers together with police officers beat them at checkpoints and during "zachistki" ("sweeps", as Russians called house searches and detentions of Chechens)(Citation: 662).
    The occupiers' escorts beat them in trucks and helicopters.
    On unloading, the soldiers made them run between two rows of guards, who beat the running men with clubs and rifle butts(Citation: 27)(Citation: 662).

    During interrogations, Russian servicemen and police officers demanded that Chechens admit they had fought, name soldiers of the Armed Forces of Ichkeria and the places where weapons were hidden(Citation: 27).
    In pits, prison vans and tanks, Russian guards held them for several days with their hands tied, blindfolded, without water or food(Citation: 27)(Citation: 657).
    The occupiers released the beaten prisoners without charges or gave them up for exchange for captured Russian servicemen (see: "Hostage-Taking")(Citation: 27).

    Russian servicemen and police officers, from soldiers at checkpoints to military investigators at bases, tortured Chechens from December 1994 to September 1996.
    On 25 December 1994, near the settlement of Dolinsky northwest of Grozny, Russian soldiers detained and beat Ali Israilov from Sernovodsk, a village in the west of Ichkeria.
    The guards of the camp in Mozdok, a town in Russian-controlled North Ossetia, beat him for three more days and released him.
    After the beatings, Ali Israilov spent a month and a half in treatment(Citation: 922).

    Until the end of January 1995, the OMON from Ryazan, a Russian police unit, guarded the filtration camp of the Russian Ministry of Internal Affairs in Mozdok and tortured detained Chechens during interrogations in prison railcars (see: "Filtration Camp System").
    The guards whom the Ministry of Internal Affairs sent to replace them on 24-26 January did not torture during interrogations, but beat the prisoners(Citation: 27).

    On 1 January 1995, Russian soldiers detained Zakrail Vairayev near the cannery in Grozny, and the guards in Mozdok and in Pyatigorsk, a city in the south of Russia, beat him so badly that his chest cracked and his tuberculosis flared up.
    The guards of the Mozdok camp left him, sick, in a prison railcar for eight days and then sent him to a hospital in Nazran, a town in Russian-controlled Ingushetia(Citation: 922).
    From 3 January to 15 February 1995, the guards of the camp near the cannery in Grozny, the escorts and the guards of the prisons in Pyatigorsk and in Stavropol, another city in the south of Russia, beat Magomed Meiriev from Grozny, and in Pyatigorsk they set a dog on him.
    On 15 February, the occupiers released him in Mozdok with scars from rifle butts and bites(Citation: 922).
    On 23 January 1995, at checkpoint No. 13 between Sernovodsk and the neighboring village of Samashki, officers of the Russian Ministry of Internal Affairs beat Akhmed Idrisov from Grozny, threatening to kill him, and on 31 January released him as innocent, with broken ribs(Citation: 922).
    In the spring of 1995, the guards of the camp near the cannery in Grozny gave the prisoners urine instead of water(Citation: 988).
    On 25 March 1995, Russian soldiers detained the Chechen Isani Khanoyev in his home in Assinovskaya, a stanitsa in the west of Ichkeria.
    The guards of the military unit near the stanitsa beat him at night and tortured him with electric current, and on 6 April the Ministry of Internal Affairs released him from Mozdok as innocent(Citation: 27).

    From the end of January 1995, Russian servicemen held detained Chechens in pits and prison vans at military units, where human rights defenders and prosecutors were not allowed.
    There were such pits in Khankala, the main base of the occupation troops on the eastern outskirts of Grozny, and near Assinovskaya(Citation: 27).

    On 7 April 1995, the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) stormed Samashki.
    That day, officers of the Ministry of Internal Affairs detained at a checkpoint Makhmudemin Iziev from Samashki, who was leaving with his family for Sernovodsk, and sent him by helicopter to the field command post of the Russian troops near Assinovskaya(Citation: 27).
    On 8 April, soldiers of the Internal Troops beat Chechen men and teenagers with rifle butts during searches in Samashki, and at the military unit north of the village and near Assinovskaya soldiers set dogs on them(Citation: 662)(Citation: 1136)(Citation: 738).
    Near Assinovskaya, the guards held Makhmudemin Iziev for three days without water or food in a prison van at the bottom of a pit.
    During interrogations, the servicemen beat him in the kidneys and the chest, attached wires to his neck and tortured him with electric current, which left burns(Citation: 662)(Citation: 27).
    On 10 April, the occupiers sent him by helicopter to the filtration camp in Mozdok, and that day six underage Chechens from Samashki were released from there bruised and with bite marks(Citation: 662)(Citation: 1136)(Citation: 738).
    Before the visit of representatives of the International Committee of the Red Cross on 11-13 April, the camp guards threatened the detained Chechens: "They will leave, and you will stay here"(Citation: 662).
    On 18 April, the Russian Ministry of Internal Affairs released Makhmudemin Iziev as innocent.
    On 20 April, in Sernovodsk, he told the "Memorial" observers about Mozdok: "During interrogations they beat me again and threatened to shoot me.
    The investigator himself did not beat me; people in masks did the beating when he left the compartment"(Citation: 27).

    In the summer of 1995, the guards near Assinovskaya hung Ramzan Isayev from Alkhan-Yurt, a village southwest of Grozny, by his handcuffs, burned his feet with a torch, squeezed his head with a metal hoop and tortured him with electric current, and then the occupiers gave him up in exchange for a captive from the Russian army(Citation: 27).
    In July 1995, Russian soldiers put Mikael Ivgiev, a journalist of the Chechen magazine "Orga", for two weeks into a tank buried in the ground in Khankala, where the servicemen tortured him with electric current and hung him by his hands tied behind his back; Mikael Ivgiev survived(Citation: 27).
    On 23 December 1995, Russian servicemen detained Ruslan Soslambekov at a checkpoint at the entrance to Grozny and held him for 28 days in a camp of the Ministry of Internal Affairs in garages on the outskirts of the city, where the guards, in front of him, set dogs on prisoners and beat their insides to a pulp, and then released him(Citation: 986).

    In early 1996, the guards of the camp in Grozny hung a Chechen horizontally and beat him, and the doctors of City Hospital No. 9 treated him for broken ribs(Citation: 657)(Citation: 1152).
    In February 1996, the occupiers brought for exchange to Shatoy, a district center in the mountains in the south of Ichkeria, a captured Chechen beaten so badly that he was carried out of the armored personnel carrier in people's arms, and the army of Ichkeria gave up Russian soldiers for him(Citation: 27).
    In March 1996, soldiers of the Russian Ministry of Internal Affairs held three Chechens from the checkpoint between Goity and Starye Atagi, villages south of Grozny, for thirteen days in a railway tank car in Khankala, staged their execution and cut them with a knife, and in April military investigators in Khankala drove needles under the fingernails of Saidash Shamakhurov from the village of Gikalovo.
    The occupiers gave all four up for exchange (see: "Hostage-Taking")(Citation: 657).

    In May 1995, Sergei Kovalyov, head of the Observer Mission of Russian human rights defenders, wrote that his group had interviewed more than a hundred Chechens, former prisoners of the Russian occupiers.
    According to him, the occupiers beat and humiliated almost every one of them, and tortured many(Citation: 919).
    In September 1995, the UN Special Rapporteur on torture wrote to the government of Russia that camp guards systematically beat many prisoners to extract confessions of support for Dzhokhar Dudayev(Citation: 738).
    The human rights defenders of "Memorial" write that most of the people who passed through the filtration camps complained of cruel treatment, and that forensic medical examinations confirm their accounts.
    According to the "Memorial" report, in the pits at military units the occupiers tortured more and more often, and near Assinovskaya also in 1996(Citation: 27).
    In January 1997, the human rights defenders of Human Rights Watch wrote that in 1996 Russian servicemen continued to torture Chechens in Khankala(Citation: 657).
    It is unknown how many such crimes the occupation troops committed from December 1994 to September 1996.
    The human rights defenders of "Memorial" published the accounts of detained Chechens about beatings and torture in the camps in the winter and spring of 1995(Citation: 922).

    Russian courts convicted not a single occupier for the torture and abuse of Chechens (see: "Impunity of Perpetrators")(Citation: 27).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    Russian servicemen held Chechens at their bases in Grozny and in Khankala at least until the end of September(Citation: 27).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти били й катували затриманих чеченців.

    Російські солдати з міліціонерами били їх на блокпостах і під час «зачисток» (так росіяни називали обшуки будинків і затримання чеченців)(Citation: 662).
    Конвой окупантів бив їх у вантажівках і гелікоптерах.
    Під час вивантаження солдати змушували їх бігти між двома рядами охоронців, які били бігунів кийками та прикладами(Citation: 27)(Citation: 662).

    На допитах російські військові й міліціонери вимагали від чеченців визнати, що вони воювали, назвати бійців Збройних сил Ічкерії та місця, де сховано зброю(Citation: 27).
    У ямах, тюремних машинах і цистернах російська охорона по кілька діб тримала їх зі зв'язаними руками, із зав'язаними очима, без води та їжі(Citation: 27)(Citation: 657).
    Окупанти відпускали побитих в'язнів без обвинувачень або віддавали на обмін за полонених російських військових (докладніше: «Захоплення заручників»)(Citation: 27).

    Російські військові й міліціонери, від солдатів на блокпостах до військових слідчих на базах, катували чеченців з грудня 1994 року по вересень 1996 року. 25 грудня 1994 року біля селища Долинський на північний захід від Грозного російські солдати затримали й побили Алі Ісраілова із Серноводська, села на заході Ічкерії.
    Охоронці табору в Моздоку, місті в підконтрольній Росії Північній Осетії, били його ще три дні й відпустили.
    Після побоїв Алі Ісраілов півтора місяця лікувався(Citation: 922).

    До кінця січня 1995 року ОМОН з Рязані, загін російської міліції, охороняв фільтраційний табір МВС Росії в Моздоку і катував затриманих чеченців на допитах у тюремних вагонах (докладніше: «Система фільтраційних таборів»).
    Охоронці, яких МВС прислало на зміну 24-26 січня, не катували на допитах, але били в'язнів(Citation: 27).

    1 січня 1995 року російські солдати затримали біля консервного заводу в Грозному Закраїла Вайраєва, а охоронці в Моздоку і в П'ятигорську, місті на півдні Росії, побили його так, що в нього тріснула грудна клітка і відкрився туберкульоз.
    Охорона табору в Моздоку вісім діб залишала його, хворого, у тюремному вагоні, а потім відправила до лікарні в Назрані, місті в підконтрольній Росії Інгушетії(Citation: 922).
    З 3 січня по 15 лютого 1995 року охорона табору біля консервного заводу в Грозному, конвой та охоронці в'язниць у П'ятигорську і в Ставрополі, ще одному місті на півдні Росії, били Магомеда Мейрієва з Грозного, а в П'ятигорську нацькували на нього собаку. 15 лютого окупанти відпустили його в Моздоку зі шрамами від прикладів та укусів(Citation: 922). 23 січня 1995 року на блокпості № 13 між Серноводськом і сусіднім селом Самашки співробітники МВС Росії побили Ахмеда Ідрісова з Грозного, погрожуючи вбити, і 31 січня відпустили його як невинного, з переламаними ребрами(Citation: 922).
    Навесні 1995 року охорона табору біля консервного заводу в Грозному давала в'язням замість води сечу(Citation: 988). 25 березня 1995 року російські солдати затримали чеченця Ісані Ханоєва в його домі в Ассинівській, станиці на заході Ічкерії.
    Охоронці військової частини біля станиці ночами били його й катували струмом, а 6 квітня МВС відпустило його з Моздока як невинного(Citation: 27).

    З кінця січня 1995 року російські військові тримали затриманих чеченців у ямах і тюремних машинах при військових частинах, куди не пускали правозахисників і прокурорів.
    Такі ями були в Ханкалі, головній базі окупаційних військ на східній околиці Грозного, і біля Ассинівської(Citation: 27).

    7 квітня 1995 року внутрішні війська МВС Росії (попередники сучасної Росгвардії) штурмували Самашки.
    Того дня співробітники МВС затримали на блокпості Махмудеміна Ізієва із Самашок, який виходив із сім'єю до Серноводська, і гелікоптером відправили на польовий командний пункт російських військ біля Ассинівської(Citation: 27). 8 квітня бійці внутрішніх військ під час обшуків у Самашках били прикладами чеченських чоловіків і підлітків, а у військовій частині на північ від села та біля Ассинівської солдати нацьковували на них собак(Citation: 662)(Citation: 1136)(Citation: 738).
    Біля Ассинівської охорона три дні тримала Махмудеміна Ізієва без води та їжі в тюремній машині на дні ями.
    На допитах військові били його по нирках і в грудь, приєднували до його шиї дроти й катували струмом, від якого залишилися опіки(Citation: 662)(Citation: 27). 10 квітня окупанти відправили його гелікоптером до фільтраційного табору в Моздоку, а шістьох неповнолітніх чеченців із Самашок того дня відпустили звідти в синцях і зі слідами укусів(Citation: 662)(Citation: 1136)(Citation: 738).
    Перед приїздом представників Міжнародного комітету Червоного Хреста 11-13 квітня охорона табору пригрозила затриманим чеченцям: «Вони підуть, а ви тут залишитеся»(Citation: 662). 18 квітня МВС Росії відпустило Махмудеміна Ізієва як невинного. 20 квітня в Серноводську він розповів спостерігачам «Меморіалу» про Моздок: «На допитах знову били, погрожували розстрілом.
    Слідчий сам не бив, били люди в масках, коли він виходив із відсіку»(Citation: 27).

    Улітку 1995 року охорона біля Ассинівської підвішувала Рамзана Ісаєва з Алхан-Юрта, села на південний захід від Грозного, за наручники, палила йому ступні пальником, стискала голову металевим обручем і катувала струмом, а потім окупанти віддали його за полоненого з російської армії(Citation: 27).
    У липні 1995 року російські солдати на два тижні посадили Мікаела Івгієва, журналіста чеченського журналу «Орга», у закопану в землю цистерну в Ханкалі, де військові катували його струмом і підвішували за зв'язані за спиною руки; Мікаел Івгієв вижив(Citation: 27). 23 грудня 1995 року російські військові затримали Руслана Сосламбекова на блокпості біля в'їзду в Грозний і 28 днів тримали в таборі МВС у гаражах на околиці міста, де охоронці при ньому нацьковували на в'язнів собак і відбивали їм нутрощі, а потім відпустили(Citation: 986).

    На початку 1996 року охоронці табору в Грозному підвісили чеченця горизонтально й побили, і лікарі міської лікарні № 9 лікували його від переламаних ребер(Citation: 657)(Citation: 1152).
    У лютому 1996 року окупанти привезли на обмін до Шатоя, районного центру в горах на півдні Ічкерії, полоненого чеченця, побитого так, що з бронетранспортера його винесли на руках, і армія Ічкерії віддала за нього російських солдатів(Citation: 27).
    У березні 1996 року бійці МВС Росії тринадцять діб тримали в залізничній цистерні в Ханкалі трьох чеченців з блокпоста між Гойтами і Старими Атагами, селами на південь від Грозного, зображали їхній розстріл і різали ножем, а в квітні військові слідчі в Ханкалі заганяли голки під нігті Саідашу Шамахурову із села Гікалове.
    Окупанти віддали всіх чотирьох на обмін (докладніше: «Захоплення заручників»)(Citation: 657).

    У травні 1995 року Сергій Ковальов, глава Спостережної місії російських правозахисників, написав, що його група опитала понад сто чеченців, колишніх в'язнів російських окупантів.
    За його словами, майже кожного з них окупанти били й принижували, а багатьох катували(Citation: 919).
    У вересні 1995 року спеціальний доповідач ООН з питань катувань написав урядові Росії, що охорона таборів систематично била багатьох в'язнів, щоб вирвати зізнання в підтримці Джохара Дудаєва(Citation: 738).
    Правозахисники «Меморіалу» пишуть, що на жорстоке поводження скаржилася більшість людей, які пройшли фільтраційні табори, а огляди судових медиків підтверджують їхні розповіді.
    За доповіддю «Меморіалу», у ямах при військових частинах окупанти катували дедалі частіше, а біля Ассинівської - і в 1996 році(Citation: 27).
    У січні 1997 року правозахисники Human Rights Watch написали, що в 1996 році російські військові продовжували катувати чеченців у Ханкалі(Citation: 657).
    Невідомо, скільки таких злочинів скоїли окупаційні війська з грудня 1994 року по вересень 1996 року.
    Правозахисники «Меморіалу» опублікували розповіді затриманих чеченців про побої та катування в таборах узимку й навесні 1995 року(Citation: 922).

    Російські суди не засудили жодного окупанта за катування та знущання над чеченцями (докладніше: «Безкарність виконавців»)(Citation: 27).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661).
    Російські військові щонайменше до кінця вересня утримували чеченців на своїх базах у Грозному і в Ханкалі(Citation: 27). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
