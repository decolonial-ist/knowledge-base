description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Россия подписывала с Ичкерией и её сёлами соглашения, по которым защитники сдавали оружие, а российские войска оставались в республике, и нарушала эти соглашения.

    Российские делегации записывали в соглашения, что российские части уходят из республики по мере того, как Вооружённые силы Ичкерии сдают оружие(Citation: 27)(Citation: 1127).
    Пока шли переговоры, президент России Ельцин указами оставлял войска в республике на постоянной основе(Citation: 1123)(Citation: 671).

    14 июня 1995 года бойцы Вооружённых сил Ичкерии захватили заложников в Будённовске, подконтрольном России городе к северо-западу от республики, и потребовали прекратить войну. 19 июня Россия начала переговоры с Ичкерией в Грозном(Citation: 27). 20 и 21 июня делегации подписали протоколы, по которым российские войска уходили из республики район за районом(Citation: 1325)(Citation: 1319). 3 июля президент России Ельцин подписал указ № 663: «Разрешить дислоцировать [размещать] на постоянной основе на территории Чеченской Республики… воинские части…
    Вооруженных Сил Российской Федерации»(Citation: 1123). 27 июля глава российской делегации, министр по делам национальностей Михайлов, заявил на переговорах в Грозном, что Россия «больше не связывает подписание соглашения по военным вопросам с политическим соглашением и статусом Чечни»(Citation: 27). 30 июля делегации подписали соглашение о прекращении военных действий.
    В нём армию Ичкерии назвали «незаконными вооруженными формированиями» и записали, что сначала оружие сдавала она, затем чеченцы, которые с оружием охраняли свои сёла, затем все остальные(Citation: 1580)(Citation: 1131).
    Российские войска по соглашению уходили «одновременно с разоружением», а бригада внутренних войск МВД России (предшественников современной Росгвардии) и бригада российской армии оставались в республике.
    Российская делегация приписала к тексту примечание, что законодательство России Ичкерию не признаёт (подробнее: «Лишение субъектности»)(Citation: 1580)(Citation: 1131).

    После соглашения бойцы армии Ичкерии начали сдавать оружие и вернулись в свои сёла, а российские части из республики не ушли(Citation: 27)(Citation: 1127). 9 октября 1995 года, через десять недель после соглашения, Россия обвинила в покушении на командующего оккупационными войсками Романова сторонников Джохара Дудаева, президента Ичкерии, приостановила переговоры и приказала войскам возобновить наступление (подробнее: «Присвоение статуса жертвы агрессором»)(Citation: 27).

    Весной 1996 года командование оккупационных войск и марионеточное правительство в Грозном подписывали с сёлами Ичкерии «Протоколы о мире и согласии», по которым село обязывалось не пускать к себе бойцов армии Ичкерии, а Россия обещала избавить его от боёв(Citation: 27)(Citation: 681).
    К 28 марта 1996 года, по данным французского агентства AFP, такие протоколы подписали больше 120 сёл(Citation: 1385).
    Перед подписанием российские войска окружали село и обстреливали его (подробнее: «Коллективные наказания»)(Citation: 988).
    Российские лётчики бомбили сёла, которые подписали протоколы (подробнее: «Ложные гарантии безопасности»)(Citation: 27).

    27 мая 1996 года председатель правительства России Черномырдин и Зелимхан Яндарбиев, исполнявший обязанности президента Ичкерии, подписали в Москве договорённость о прекращении огня(Citation: 27). 10 июня в Назрани, городе в подконтрольной России Ингушетии, делегации России и Ичкерии дополнили её протоколом, где Россия обязалась вывести свои войска из республики до конца августа 1996 года(Citation: 1124). 25 июня президент России Ельцин указом № 985 велел вывести к 1 сентября только части четырёх военных округов, а соединения, которые стояли в республике постоянно, обустраивать(Citation: 671). 9 июля, через шесть дней после того как Ельцин выиграл выборы президента России, оккупанты начали новое наступление (подробнее: «Ложное перемирие»)(Citation: 27). 22 августа, когда Вооружённые силы Ичкерии окружили оккупантов в Грозном, генерал Лебедь, секретарь Совета безопасности России, и Аслан Масхадов, начальник Главного штаба Вооружённых сил Ичкерии, подписали в Новых Атагах, селе к югу от Грозного, соглашение о прекращении огня.
    Россия обязалась в нём вывести войска из Грозного к 26 августа, а из всей республики - до конца августа, но начала уходить из города 28 августа(Citation: 697)(Citation: 1316)(Citation: 1127).

    Правозащитники «Мемориала» пишут, что Россия не принимала всерьёз переговоры с Ичкерией(Citation: 27).

    31 августа 1996 года, после того как Вооружённые силы Ичкерии освободили Грозный от оккупантов(Citation: 1127), генерал Лебедь и Аслан Масхадов подписали в Хасавюрте, городе в подконтрольном России Дагестане, мирные соглашения.
    Россия и Ичкерия записали в них отказ от силы и угроз силой при решении спорных вопросов.
    Стороны договорились заключить соглашение об основах своих отношений до 31 декабря 2001 года(Citation: 661).
    Последние российские войска ушли из республики 31 декабря 1996 года, через четыре месяца после срока из соглашения в Новых Атагах(Citation: 27).
    Через три года после соглашений в Хасавюрте Россия снова напала на Ичкерию. 21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября российская армия вторглась в республику(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Russia signed agreements with Ichkeria and its villages under which the defenders handed over their weapons while Russian troops stayed in the republic, and violated these agreements.

    Russian delegations wrote into the agreements that Russian units would leave the republic as the Armed Forces of Ichkeria handed over their weapons(Citation: 27)(Citation: 1127).
    While the talks were going on, Russian president Yeltsin kept troops in the republic on a permanent basis by decree(Citation: 1123)(Citation: 671).

    On 14 June 1995, fighters of the Armed Forces of Ichkeria took hostages in Budyonnovsk, a Russian-controlled town northwest of the republic, and demanded an end to the war.
    On 19 June, Russia began talks with Ichkeria in Grozny(Citation: 27).
    On 20 and 21 June, the delegations signed protocols under which Russian troops would leave the republic district by district(Citation: 1325)(Citation: 1319).
    On 3 July, Russian president Yeltsin signed decree No. 663: "To permit the stationing [placing] on a permanent basis on the territory of the Chechen Republic… of military units… of the Armed Forces of the Russian Federation"(Citation: 1123).
    On 27 July, the head of the Russian delegation, Minister for Nationalities Mikhailov, stated at the talks in Grozny that Russia "no longer links the signing of the agreement on military questions to a political agreement and the status of Chechnya"(Citation: 27).
    On 30 July, the delegations signed an agreement on the cessation of hostilities.
    In it, the army of Ichkeria was called "illegal armed formations", and it was written that first the army would hand over its weapons, then the Chechens who guarded their villages with arms, then everyone else(Citation: 1580)(Citation: 1131).
    Under the agreement, Russian troops would leave "simultaneously with disarmament", while a brigade of the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) and a brigade of the Russian army would stay in the republic.
    The Russian delegation added a note to the text that the legislation of Russia does not recognize Ichkeria (see: "Deprivation of Agency")(Citation: 1580)(Citation: 1131).

    After the agreement, fighters of the army of Ichkeria began handing over their weapons and returned to their villages, while the Russian units did not leave the republic(Citation: 27)(Citation: 1127).
    On 9 October 1995, ten weeks after the agreement, Russia blamed supporters of Dzhokhar Dudayev, the president of Ichkeria, for an attempt on the life of Romanov, the commander of the occupation troops, suspended the talks and ordered the troops to resume the offensive (see: "Aggressor Claiming Victim Status")(Citation: 27).

    In the spring of 1996, the command of the occupation troops and the puppet government in Grozny signed "Protocols on Peace and Accord" with the villages of Ichkeria, under which a village undertook not to let fighters of the army of Ichkeria in, and Russia promised to spare it from fighting(Citation: 27)(Citation: 681).
    By 28 March 1996, according to the French news agency AFP, more than 120 villages had signed such protocols(Citation: 1385).
    Before the signing, Russian troops surrounded the village and shelled it (see: "Collective Punishment")(Citation: 988).
    Russian pilots bombed villages that had signed the protocols (see: "False Guarantees of Safety")(Citation: 27).

    On 27 May 1996, Chernomyrdin, the chairman of the Russian government, and Zelimkhan Yandarbiyev, the acting president of Ichkeria, signed a ceasefire agreement in Moscow(Citation: 27).
    On 10 June, in Nazran, a town in Russian-controlled Ingushetia, the delegations of Russia and Ichkeria supplemented it with a protocol in which Russia undertook to withdraw its troops from the republic by the end of August 1996(Citation: 1124).
    On 25 June, Russian president Yeltsin, by decree No. 985, ordered that only the units of four military districts be withdrawn by 1 September, while the formations stationed in the republic permanently were to be provided with facilities(Citation: 671).
    On 9 July, six days after Yeltsin won the Russian presidential election, the occupiers began a new offensive (see: "Sham Ceasefire")(Citation: 27).
    On 22 August, when the Armed Forces of Ichkeria had surrounded the occupiers in Grozny, General Lebed, the secretary of the Russian Security Council, and Aslan Maskhadov, the chief of the Main Staff of the Armed Forces of Ichkeria, signed a ceasefire agreement in Novye Atagi, a village south of Grozny.
    In it, Russia undertook to withdraw its troops from Grozny by 26 August and from the whole republic by the end of August, but began leaving the city on 28 August(Citation: 697)(Citation: 1316)(Citation: 1127).

    The human rights defenders of "Memorial" write that Russia did not take the talks with Ichkeria seriously(Citation: 27).

    On 31 August 1996, after the Armed Forces of Ichkeria had liberated Grozny from the occupiers(Citation: 1127), General Lebed and Aslan Maskhadov signed the peace agreements in Khasavyurt, a town in Russian-controlled Dagestan.
    In them, Russia and Ichkeria wrote down the renunciation of force and the threat of force in resolving disputed questions.
    The sides agreed to conclude an agreement on the foundations of their relations by 31 December 2001(Citation: 661).
    The last Russian troops left the republic on 31 December 1996, four months after the deadline in the agreement of Novye Atagi(Citation: 27).
    Three years after the agreements in Khasavyurt, Russia attacked Ichkeria again.
    On 21 September 1999, Russian pilots began bombing Grozny, and on 29 September the Russian army invaded the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Росія підписувала з Ічкерією та її селами угоди, за якими захисники здавали зброю, а російські війська залишалися в республіці, і порушувала ці угоди.

    Російські делегації записували в угоди, що російські частини йдуть із республіки в міру того, як Збройні сили Ічкерії здають зброю(Citation: 27)(Citation: 1127).
    Поки тривали переговори, президент Росії Єльцин указами залишав війська в республіці на постійній основі(Citation: 1123)(Citation: 671).

    14 червня 1995 року бійці Збройних сил Ічкерії захопили заручників у Будьоннівську, підконтрольному Росії місті на північний захід від республіки, і зажадали припинити війну. 19 червня Росія почала переговори з Ічкерією в Грозному(Citation: 27). 20 і 21 червня делегації підписали протоколи, за якими російські війська йшли з республіки район за районом(Citation: 1325)(Citation: 1319). 3 липня президент Росії Єльцин підписав указ № 663: «Дозволити дислокувати [розміщувати] на постійній основі на території Чеченської Республіки… військові частини…
    Збройних Сил Російської Федерації»(Citation: 1123). 27 липня голова російської делегації, міністр у справах національностей Михайлов, заявив на переговорах у Грозному, що Росія «більше не пов'язує підписання угоди з військових питань із політичною угодою і статусом Чечні»(Citation: 27). 30 липня делегації підписали угоду про припинення воєнних дій.
    У ній армію Ічкерії назвали «незаконними збройними формуваннями» і записали, що спершу зброю здавала вона, потім чеченці, які зі зброєю охороняли свої села, потім усі решта(Citation: 1580)(Citation: 1131).
    Російські війська за угодою йшли «одночасно з роззброєнням», а бригада внутрішніх військ МВС Росії (попередників сучасної Росгвардії) і бригада російської армії залишалися в республіці.
    Російська делегація дописала до тексту примітку, що законодавство Росії Ічкерію не визнає (докладніше: «Позбавлення суб'єктності»)(Citation: 1580)(Citation: 1131).

    Після угоди бійці армії Ічкерії почали здавати зброю і повернулися у свої села, а російські частини з республіки не пішли(Citation: 27)(Citation: 1127). 9 жовтня 1995 року, через десять тижнів після угоди, Росія звинуватила в замаху на командувача окупаційних військ Романова прихильників Джохара Дудаєва, президента Ічкерії, призупинила переговори і наказала військам відновити наступ (докладніше: «Привласнення статусу жертви агресором»)(Citation: 27).

    Навесні 1996 року командування окупаційних військ і маріонетковий уряд у Грозному підписували із селами Ічкерії «Протоколи про мир і злагоду», за якими село зобов'язувалося не пускати до себе бійців армії Ічкерії, а Росія обіцяла позбавити його боїв(Citation: 27)(Citation: 681).
    До 28 березня 1996 року, за даними французького агентства AFP, такі протоколи підписали понад 120 сіл(Citation: 1385).
    Перед підписанням російські війська оточували село й обстрілювали його (докладніше: «Колективні покарання»)(Citation: 988).
    Російські льотчики бомбили села, які підписали протоколи (докладніше: «Фальшиві гарантії безпеки»)(Citation: 27).

    27 травня 1996 року голова уряду Росії Черномирдін і Зелімхан Яндарбієв, який виконував обов'язки президента Ічкерії, підписали в Москві домовленість про припинення вогню(Citation: 27). 10 червня в Назрані, місті в підконтрольній Росії Інгушетії, делегації Росії та Ічкерії доповнили її протоколом, де Росія зобов'язалася вивести свої війська з республіки до кінця серпня 1996 року(Citation: 1124). 25 червня президент Росії Єльцин указом № 985 велів вивести до 1 вересня лише частини чотирьох військових округів, а з'єднання, які стояли в республіці постійно, облаштовувати(Citation: 671). 9 липня, через шість днів після того, як Єльцин виграв вибори президента Росії, окупанти почали новий наступ (докладніше: «Фальшиве перемир'я»)(Citation: 27). 22 серпня, коли Збройні сили Ічкерії оточили окупантів у Грозному, генерал Лебідь, секретар Ради безпеки Росії, та Аслан Масхадов, начальник Головного штабу Збройних сил Ічкерії, підписали в Нових Атагах, селі на південь від Грозного, угоду про припинення вогню.
    Росія зобов'язалася в ній вивести війська з Грозного до 26 серпня, а з усієї республіки - до кінця серпня, але почала йти з міста 28 серпня(Citation: 697)(Citation: 1316)(Citation: 1127).

    Правозахисники «Меморіалу» пишуть, що Росія не сприймала всерйоз переговори з Ічкерією(Citation: 27).

    31 серпня 1996 року, після того як Збройні сили Ічкерії звільнили Грозний від окупантів(Citation: 1127), генерал Лебідь і Аслан Масхадов підписали в Хасав'юрті, місті в підконтрольному Росії Дагестані, мирні угоди.
    Росія та Ічкерія записали в них відмову від сили і погроз силою при вирішенні спірних питань.
    Сторони домовилися укласти угоду про основи своїх відносин до 31 грудня 2001 року(Citation: 661).
    Останні російські війська пішли з республіки 31 грудня 1996 року, через чотири місяці після строку з угоди в Нових Атагах(Citation: 27).
    Через три роки після угод у Хасав'юрті Росія знову напала на Ічкерію. 21 вересня 1999 року російські льотчики почали бомбити Грозний, а 29 вересня російська армія вторглася в республіку(Citation: 27).
