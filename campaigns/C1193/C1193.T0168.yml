    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Москва всю войну выводила своих солдат, милиционеров и командиров оккупационных войск из-под ответственности за преступления против чеченцев.

    В Ичкерии командующий внутренними войсками МВД России (предшественниками современной Росгвардии) Шкирко выступал под фамилией «Широков», а начальник их штаба Львов - «генерал Ягодин».
    Заместители командующего оккупационными войсками Романов и Лабунец назывались «Антонов» и «Алексеев»(Citation: 27)(Citation: 1136).

    Военные прокуроры закрывали дела о людях, которых российские солдаты расстреляли в машинах у блокпостов, и ссылались на статьи 23 и 27 закона России о внутренних войсках МВД(Citation: 27).

    17 декабря 1994 года российские военные расстреляли колонну беженцев из Грозного у станицы Нестеровской в подконтрольной России Ингушетии.
    Российские прокуроры приостановили дело, не найдя виновных(Citation: 27).

    3 января 1995 года российские лётчики бомбили Аршты, село в Ингушетии, где жили в основном чеченцы (подробнее: «Коллективные наказания»), а при второй бомбёжке, 18 апреля, убили там трёх женщин.
    Российские прокуроры закрыли оба дела, не найдя преступления(Citation: 27). 14 января 1995 года секретарь Совета безопасности России Лобов сказал, что правду о бомбёжках Грозного должна установить специальная комиссия.
    Россия такой комиссии не создала(Citation: 27).

    24 января 1995 года в Грозном пропали двое сыновей Хусейна Хамидова. 2 апреля отец раскопал яму во дворе дома на улице Маяковского, где до этого стояла часть внутренних войск МВД России, и нашёл их тела (подробнее: «Убийство пленных и задержанных»).
    Прокуратура марионеточного правительства возбудила дело и собрала доказательства.
    Российские военные прокуроры приостановили его, не найдя виновных(Citation: 27). 24 апреля 1996 года Хусейн Хамидов, который с января 1995 года искал пропавших людей в Ичкерии, рассказал общественному трибуналу российского фонда «Гласность» в Москве: «Ни одного расследованного и доведенного до суда дела нет… когда передаешь им документы, передаешь заявление о каком-то совершенном преступлении, они говорят: „А вы скажите, кто это сделал, солдаты российской действующей армии, или СОБРа [милицейского спецназа], или МВД“…
    А кто же знает, кто совершил преступление — форма у них одна и та же.
    И на этом основании нам отказывают»(Citation: 988).

    Российские суды дали капитану 81-го полка внутренних войск МВД России Поливцеву четыре года за убийство четверых чеченцев в Грозном 25 января 1995 года(Citation: 27).

    7-8 апреля 1995 года российские внутренние войска штурмовали Самашки, село на западе Ичкерии, и убили 103 мирных чеченца (подробнее: «Массовые убийства гражданских»). 12 апреля полковник МВД России на посту у села представился правозащитникам Обломовым, хотя на ремне его автомата была написана фамилия «Еланский». 19 апреля российский прокурор Джапов сказал наблюдателю российской правозащитной организации «Мемориал» Андрею Блинушову, что не знает, как привлечь к ответственности бойцов спецподразделений МВД.
    Наблюдатель записал в дневнике со слов прокурора: «спецчасти МВД, выходящие из Чечни, уничтожают всю свою документацию, касающуюся их действий на территории этой республики.
    Действуют эти подразделения зачастую в масках, без каких либо знаков различия на форменной одежде, все офицеры вместо подлинных фамилий пользуются двумя-тремя псевдонимами»(Citation: 1136). 27 апреля исполнявший обязанности генерального прокурора России Ильюшенко возбудил дело об убийствах и поджогах в селе(Citation: 1136).
    В середине мая российские военные следователи опросили часть пострадавших и свидетелей, но могил не вскрывали и в Самашки больше не приезжали. 14 января 1997 года прокуроры закрыли дело. 21 ноября 1997 года заместитель главного военного прокурора России Смирнов назвал «Мемориалу» причину: «военнослужащие действовали в состоянии крайней необходимости и необходимой обороны»(Citation: 27).

    Российский военный Вершинин получил от суда три года за то, что 17 апреля 1995 года застрелил мальчика Зелимхана Дедиева в станице Петропавловская к северо-востоку от Грозного(Citation: 27). 14 июня 1995 года Генеральная прокуратура России распоряжением № 15-6-95 приказала прокурору марионеточного правительства в Грозном передавать российским военным прокурорам дела о преступлениях российских солдат, только если факты установлены бесспорно. 4 июля 1996 года прокурор этого правительства написал генеральному прокурору России Скуратову, что российские прокуроры вернули ему 112 дел без расследования, не найдя в них бесспорных доказательств вины.
    В письме сказано, что безымянные командиры приказывали не пускать следователей в воинские части и на блокпосты(Citation: 27).
    Солдаты Коровин, Шулин и Петров получили 14, шесть и три года за то, что в ночь на 7 июля 1995 года убили двух чеченцев в посёлке Родина у своей части(Citation: 1367)(Citation: 27).
    Российские военные не пускали в свои части следователей марионеточной прокуратуры, которые расследовали убийство семерых чеченцев из семьи Чапановых в селе Пригородное у Грозного 7 июля 1995 года.
    В январе 1996 года марионеточная прокуратура приостановила дело(Citation: 27). 17 декабря 1996 года суд дал бойцу российского милицейского спецназа Пермякову полтора года условно за «неосторожное убийство» Заурбека Узуева, которого тот 8 сентября 1995 года застрелил на блокпосту во время митинга за независимость Ичкерии(Citation: 27).
    Военные прокуроры приостановили дело о бомбёжке Рошни-Чу, села к юго-западу от Грозного, в октябре 1995 года(Citation: 27).

    Военные прокуроры закрыли дело об убийстве Шарипа Батаева, чеченца из Аршты, которого разведчики 693-го полка 58-й армии России застрелили в конце февраля 1996 года.
    По версии прокуроров, командир разведчиков защищался(Citation: 27).
    Весной 1996 года российские прокуроры не возбудили уголовного дела о том, как оккупанты в марте сожгли Серноводск и разрушили Самашки, сёла на западе Ичкерии(Citation: 988). 30 июня 1996 года военный прокурор Сапрунов написал прокуратуре марионеточного правительства, что оккупанты избили по дороге в Пятигорск, город на юге России, половину из 91 чеченца из Самашек, которых российские военные незаконно задержали 15 марта (подробнее: «Пытки и истязания»)(Citation: 657)(Citation: 1152).
    В марте 1997 года российские прокуроры приостановили дело, не найдя виновных: задержавшие были «с масками на лицах, в связи с чем их опознание невозможно»(Citation: 27). 10 декабря 1996 года прокурор Главной военной прокуратуры России Синицын ответил на просьбу «Мемориала» расследовать, как солдаты внутренних войск МВД России прикрывались мирными людьми в Самашках в марте 1996 года и больными 9-й городской больницы Грозного в августе 1996 года (подробнее: «Использование людей как «живого щита»»).
    Синицын написал, что переслал доклад правозащитников прокурорам Северного Кавказа, чтобы его приложили к сообщениям прессы(Citation: 657), а 21 ноября 1997 года заместитель главного военного прокурора Смирнов ответил, что в Самашках люди прятались за бронетехникой от обстрела(Citation: 27).
    Военные прокуроры приостановили дела о бомбёжках Катыр-Юрта и Шалажи, сёл к юго-западу от Грозного, в марте и апреле 1996 года (подробнее: «Неизбирательные нападения»)(Citation: 27).
    Прокурор оккупационных войск Шевченко, не выезжая на место, заявил, что солдаты внутренних войск МВД России, которые 15 июля 1996 года расстреляли в легковых машинах безоружных людей в пригороде Грозного, применили оружие правильно(Citation: 1364)(Citation: 27).
    В середине июля 1996 года российские солдаты без обвинений держали двух чеченцев из Веденского района на юго-востоке Ичкерии в армейской камере в Ханкале, главной базе оккупационных войск на восточной окраине Грозного, и отпустили их по требованию военных прокуроров.
    Прокуратура оккупационных войск признала незаконным только это задержание, но дела не возбудила, потому что виновный, комендант Ханкалы, погиб в боях в августе 1996 года(Citation: 27).

    8 августа 1996 года Главная военная прокуратура России ответила депутату российского парламента Юлию Рыбакову, что с 11 декабря 1994 года прокуроры возбудили 129 дел о преступлениях оккупантов против мирных людей в Ичкерии.
    Из них 21 дело прокуроры передали в суды, 21 закрыли, 26 не закончили, а 61 приостановили - 48 потому, что не нашли виновных, и 13 потому, что не знали, где обвиняемые(Citation: 27).

    29 сентября 1997 года Управление военных судов России ответило на запрос «Мемориала», что за всю войну суды осудили 18 солдат и офицеров, из них семерых - за убийства(Citation: 27).

    26 июля 1995 года Комитет ООН по правам человека выразил сожаление, что никто не ответил за жестокое обращение с пленными и задержанными в Ичкерии(Citation: 736).
    В докладе Human Rights Watch от января 1997 года сказано, что Россия систематически нарушала права человека и так же систематически не привлекала виновных к ответственности(Citation: 657).
    Правозащитники «Мемориала» пишут, что за всю войну Россия не привлекла к ответственности ни одного высшего командира.
    По их данным, российские суды никого не осудили за бомбёжки сёл и городов Ичкерии, фильтрационные лагеря, пытки, захват заложников и живой щит(Citation: 27).

    По сведениям Human Rights Watch, на мирных переговорах в августе 1996 года российская делегация воспротивилась тому, чтобы обсуждать ответственность за преступления(Citation: 657).
    После мирных соглашений в Хасавюрте 31 августа 1996 года (подробнее: «Фиктивные договоры»)(Citation: 661) Россия перевела прокуратуру оккупационных войск в подконтрольный ей Дагестан.
    Правозащитники «Мемориала» пишут, что после этого прокуроры почти перестали расследовать преступления российских военных и милиционеров(Citation: 27). 12 марта 1997 года депутаты в Москве постановлением № 1199-II объявили амнистию за преступления, связанные с войной в Ичкерии(Citation: 1315).
    По этой амнистии российские прокуроры прекращали незаконченные дела о преступлениях оккупантов(Citation: 27).
