description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты брали сёла Ичкерии в кольцо блокпостов и не пропускали людей и транспорт.

    9 декабря 1994 года, за два дня до открытого вторжения, председатель правительства России Черномырдин постановлением № 1360 приказал МВД закрыть границы Чеченской Республики, а министерству обороны - на время запретить полёты над ней(Citation: 651). 1 февраля 1995 года оккупанты перекрыли блокпостами границу Ичкерии с подконтрольной России Ингушетией(Citation: 27).

    С конца февраля 1995 года части МВД России ставили блокпосты на дорогах между сёлами на западе Ичкерии(Citation: 662).
    В конце марта 1996 года блокпосты на этих дорогах стояли почти на каждом километре(Citation: 988).

    Российские военные на блокпостах пропускали в сёла и города только тех, кто там прописан(Citation: 27)(Citation: 1351).
    На постах российские солдаты незаконно задерживали чеченских мужчин, которые выходили из окружённых сёл, и увозили в фильтрационные лагеря в Грозном и в Моздоке, Пятигорске, Ставрополе - подконтрольных России городах к северо-западу от Ичкерии (подробнее: «Система фильтрационных лагерей»)(Citation: 27).

    В феврале 1995 года российские военные с блокпостов у Самашек, села на западе Ичкерии, в сумерках стреляли по любым машинам, в том числе по машинам скорой помощи(Citation: 988).
    Во второй половине февраля солдаты на блокпосту № 13 у села перестали пропускать туда грузовики(Citation: 662).
    С 13 марта 1995 года российские военные перекрыли все дороги в Самашки и 25 дней, до штурма 7 апреля, держали село в блокаде(Citation: 662). 7 апреля, в день штурма Самашек, оккупанты остановили на блокпосту МВД 12 машин с чеченцами, которые уезжали из села, и до начала обстрела выпустили около ста человек.
    Часть мужчин из них российские военные увезли на вертолёте в фильтрационный лагерь в Моздоке, а те, кто не успел выехать, остались в селе под обстрелом(Citation: 662). 8 апреля у российского блокпоста на перекрёстке дорог из Самашек и Серноводска, села на западе Ичкерии у границы с Ингушетией, собрались 800-1000 человек.
    По приказу командующего оккупационными войсками Куликова командиры поста не пустили в Самашки наблюдателей и чеченцев из села. 11 апреля российская охрана блокпоста № 13 не пустила в Самашки чеченских женщин, которые шли туда с антивоенным маршем(Citation: 1136).

    30 сентября 1995 года внутренние войска МВД России (предшественники современной Росгвардии) и российский милицейский спецназ окружили Серноводск.
    Оккупанты потребовали от чеченцев села разоружить бойцов Вооружённых сил Ичкерии и открыть дорогу российской военной технике (подробнее: «Коллективные наказания»)(Citation: 27).
    По данным «Мемориала», в селе было больше 10 000 человек, по данным ООН - 20 000, ещё больше 3000 беженцев жили в корпусах курорта на окраине(Citation: 27)(Citation: 658). 26 октября российские войска перекрыли последнюю дорогу в Серноводск и перестали пропускать в село любые машины, в том числе с едой (подробнее: «Медицинская и гуманитарная блокада»)(Citation: 27).
    Патриция Крокол, представительница британской христианской общины противников войны, в этот день проехала в село через поле и 20 апреля 1996 года в Москве рассказала общественному трибуналу российского фонда «Гласность»: «В 11 утра попали в Серноводск, а через 40 минут и эту дорогу перекрыли, поставив 14 танков»(Citation: 988).
    В ноябре российские военные стали пропускать в село четыре раза в день автобус с людьми и машину скорой помощи(Citation: 27)(Citation: 1402)(Citation: 659).

    Российские войска окружали Серноводск больше пяти месяцев, до штурма 3 марта 1996 года. 4 марта оккупанты открыли выход из села, но российские солдаты и сотрудники МВД на постах не давали людям выезжать на своих машинах.
    В этот день из Серноводска ушли около 10 000 человек. 5 марта оккупанты снова закрыли въезд и выезд, в селе остались около 7000 мирных чеченцев (подробнее: «Ложный коридор»).
    Обстрелами российские войска убили и ранили сотни из них (подробнее: «Неизбирательные нападения»). 9 марта, после захвата Серноводска, российские военные открыли въезд в село и выезд из него, и только тогда чеченцы вывезли раненых(Citation: 27)(Citation: 1402)(Citation: 659).

    10-11 декабря 1995 года российская армия окружила Гудермес, второй по величине город Ичкерии, к востоку от Грозного, и никого из него не выпускала. 14 декабря Вооружённые силы Ичкерии освободили город, а 19-20 декабря российские войска захватили его (подробнее: «Неизбирательные нападения»)(Citation: 656).
    С 11 по 20 декабря 1995 года, перед «выборами», которые Россия назначила в Ичкерии, командующий оккупационными войсками Шкирко запретил въезд в Грозный машинам без пропусков (подробнее: «Имитация народного волеизъявления»)(Citation: 27).

    14 марта 1996 года части внутренних войск МВД России и российской 58-й армии окружили Самашки и никого не пропускали через блокпост на южной дороге к селу Новый Шарой(Citation: 988). 19 марта оккупанты выпустили чеченцев из окружения(Citation: 27).
    В начале апреля 1996 года российские лётчики днём каждые 15-20 минут бомбили единственную дорогу из Шали, города к юго-востоку от Грозного, в Ведено, районный центр в горах на юго-востоке Ичкерии (подробнее: «Неизбирательные нападения»).
    Чеченцы из Ведено и соседнего села Дышне-Ведено уходили по этой дороге на равнину ночью(Citation: 27)(Citation: 988).
    Весной 1996 года российские военные на блокпосту у Шалажи, села к юго-западу от Грозного, не пускали Мадину Магомадову из Грозного к родителям, потому что она прописана в городе(Citation: 988).

    Правозащитники «Мемориала» пишут, что российские войска всю войну раз за разом окружали сёла и города Ичкерии, ограничивали или полностью закрывали вход и выход из них, а солдаты на блокпостах часто перекрывали движение по дорогам(Citation: 27).

    10 июня 1996 года Россия и Ичкерия подписали протокол к договорённости от 27 мая о прекращении огня.
    Российская делегация обязалась к 7 июля снять блокпосты на выездах из сёл и городов(Citation: 1124). 7 июля командование оккупационными войсками отказалось снять все посты, сославшись на то, что обстановка не нормализовалась (подробнее: «Ложное перемирие»)(Citation: 27). 8 сентября 1996 года российские части начали уходить со своих блокпостов и из Ичкерии(Citation: 1127)(Citation: 1163).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers surrounded the villages of Ichkeria with a ring of checkpoints and did not let people or vehicles through.

    On 9 December 1994, two days before the open invasion, Chernomyrdin, the chairman of the Russian government, by resolution No. 1360 ordered the Ministry of Internal Affairs to close the borders of the Chechen Republic and the Ministry of Defense to ban flights over it for the time being(Citation: 651).
    On 1 February 1995, the occupiers blocked the border of Ichkeria with Russian-controlled Ingushetia with checkpoints(Citation: 27).

    From the end of February 1995, units of the Russian Ministry of Internal Affairs set up checkpoints on the roads between villages in the west of Ichkeria(Citation: 662).
    By the end of March 1996, there were checkpoints on these roads almost every kilometer(Citation: 988).

    Russian servicemen at the checkpoints let into villages and towns only those who were registered as residents there(Citation: 27)(Citation: 1351).
    At the posts, Russian soldiers unlawfully detained Chechen men who were leaving the surrounded villages and took them to the filtration camps in Grozny and in Mozdok, Pyatigorsk and Stavropol, Russian-controlled cities northwest of Ichkeria (see: "Filtration Camp System")(Citation: 27).

    In February 1995, Russian servicemen at the checkpoints near Samashki, a village in the west of Ichkeria, fired at dusk on any vehicles, including ambulances(Citation: 988).
    In the second half of February, the soldiers at checkpoint No. 13 near the village stopped letting trucks in(Citation: 662).
    From 13 March 1995, Russian servicemen blocked all the roads into Samashki and for 25 days, until the assault on 7 April, kept the village under blockade(Citation: 662).
    On 7 April, the day of the assault on Samashki, the occupiers stopped 12 vehicles with Chechens who were leaving the village at a checkpoint of the Ministry of Internal Affairs, and before the shelling began they let about a hundred people through.
    Some of the men among them Russian servicemen took by helicopter to the filtration camp in Mozdok, while those who had not managed to leave stayed in the village under shelling(Citation: 662).
    On 8 April, 800-1,000 people gathered at the Russian checkpoint at the crossroads of the roads from Samashki and Sernovodsk, a village in the west of Ichkeria near the border with Ingushetia.
    On the orders of Kulikov, the commander of the occupation troops, the commanders of the post did not let observers or Chechens from the village into Samashki.
    On 11 April, the Russian guards of checkpoint No. 13 did not let into Samashki Chechen women who were marching there against the war(Citation: 1136).

    On 30 September 1995, the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) and Russian police special forces surrounded Sernovodsk.
    The occupiers demanded that the Chechens of the village disarm the fighters of the Armed Forces of Ichkeria and open the road to Russian military vehicles (see: "Collective Punishment")(Citation: 27).
    According to "Memorial", there were more than 10,000 people in the village, according to the UN 20,000, and another more than 3,000 refugees lived in the buildings of the resort on the outskirts(Citation: 27)(Citation: 658).
    On 26 October, Russian troops blocked the last road into Sernovodsk and stopped letting any vehicles into the village, including those with food (see: "Medical and Humanitarian Blockade")(Citation: 27).
    Patricia Krokol, a representative of a British Christian community of opponents of the war, got into the village that day across a field, and on 20 April 1996 in Moscow she told the public tribunal of the Russian Glasnost Foundation: "At 11 in the morning we got into Sernovodsk, and 40 minutes later they blocked that road too, putting up 14 tanks"(Citation: 988).
    In November, Russian servicemen began letting a bus with people and an ambulance into the village four times a day(Citation: 27)(Citation: 1402)(Citation: 659).

    Russian troops surrounded Sernovodsk for more than five months, until the assault on 3 March 1996.
    On 4 March, the occupiers opened the way out of the village, but Russian soldiers and officers of the Ministry of Internal Affairs at the posts did not let people leave in their own cars.
    On that day, about 10,000 people left Sernovodsk.
    On 5 March, the occupiers again closed the entry and exit, and about 7,000 Chechen civilians remained in the village (see: "Sham Corridor").
    With shelling, Russian troops killed and wounded hundreds of them (see: "Indiscriminate Attacks").
    On 9 March, after the capture of Sernovodsk, Russian servicemen opened the entry into the village and the exit from it, and only then did the Chechens take out the wounded(Citation: 27)(Citation: 1402)(Citation: 659).

    On 10-11 December 1995, the Russian army surrounded Gudermes, the second-largest city of Ichkeria, east of Grozny, and let no one out of it.
    On 14 December, the Armed Forces of Ichkeria liberated the city, and on 19-20 December Russian troops captured it (see: "Indiscriminate Attacks")(Citation: 656).
    From 11 to 20 December 1995, before the "elections" that Russia had scheduled in Ichkeria, Shkirko, the commander of the occupation troops, banned vehicles without passes from entering Grozny (see: "Sham Expression of Popular Will")(Citation: 27).

    On 14 March 1996, units of the Internal Troops of the Russian Ministry of Internal Affairs and of the Russian 58th Army surrounded Samashki and let no one through the checkpoint on the southern road to the village of Novy Sharoy(Citation: 988).
    On 19 March, the occupiers let the Chechens out of the encirclement(Citation: 27).
    In early April 1996, Russian pilots bombed every 15-20 minutes during the day the only road from Shali, a town southeast of Grozny, to Vedeno, a district center in the mountains in the southeast of Ichkeria (see: "Indiscriminate Attacks").
    Chechens from Vedeno and the neighboring village of Dyshne-Vedeno left along this road for the plain at night(Citation: 27)(Citation: 988).
    In the spring of 1996, Russian servicemen at the checkpoint near Shalazhi, a village southwest of Grozny, did not let Madina Magomadova from Grozny through to her parents, because she was registered as a resident of the city(Citation: 988).

    The human rights defenders of "Memorial" write that throughout the war Russian troops surrounded the villages and towns of Ichkeria again and again, restricted or completely closed entry and exit, and soldiers at checkpoints often blocked traffic on the roads(Citation: 27).

    On 10 June 1996, Russia and Ichkeria signed a protocol to the ceasefire agreement of 27 May.
    The Russian delegation undertook to remove the checkpoints at the exits from villages and towns by 7 July(Citation: 1124).
    On 7 July, the command of the occupation troops refused to remove all the posts, citing the fact that the situation had not normalized (see: "Sham Ceasefire")(Citation: 27).
    On 8 September 1996, Russian units began leaving their checkpoints and Ichkeria(Citation: 1127)(Citation: 1163).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти брали села Ічкерії в кільце блокпостів і не пропускали людей і транспорт.

    9 грудня 1994 року, за два дні до відкритого вторгнення, голова уряду Росії Черномирдін постановою № 1360 наказав МВС закрити кордони Чеченської Республіки, а міністерству оборони - на час заборонити польоти над нею(Citation: 651). 1 лютого 1995 року окупанти перекрили блокпостами кордон Ічкерії з підконтрольною Росії Інгушетією(Citation: 27).

    З кінця лютого 1995 року частини МВС Росії ставили блокпости на дорогах між селами на заході Ічкерії(Citation: 662).
    У кінці березня 1996 року блокпости на цих дорогах стояли майже на кожному кілометрі(Citation: 988).

    Російські військові на блокпостах пропускали в села і міста лише тих, хто там прописаний(Citation: 27)(Citation: 1351).
    На постах російські солдати незаконно затримували чеченських чоловіків, які виходили з оточених сіл, і відвозили до фільтраційних таборів у Грозному та в Моздоку, П'ятигорську, Ставрополі - підконтрольних Росії містах на північний захід від Ічкерії (докладніше: «Система фільтраційних таборів»)(Citation: 27).

    У лютому 1995 року російські військові з блокпостів біля Самашок, села на заході Ічкерії, у сутінках стріляли по будь-яких машинах, зокрема по машинах швидкої допомоги(Citation: 988).
    У другій половині лютого солдати на блокпості № 13 біля села перестали пропускати туди вантажівки(Citation: 662).
    З 13 березня 1995 року російські військові перекрили всі дороги в Самашки і 25 днів, до штурму 7 квітня, тримали село в блокаді(Citation: 662). 7 квітня, у день штурму Самашок, окупанти зупинили на блокпості МВС 12 машин із чеченцями, які виїжджали із села, і до початку обстрілу випустили близько ста людей.
    Частину чоловіків із них російські військові відвезли гелікоптером до фільтраційного табору в Моздоку, а ті, хто не встиг виїхати, залишилися в селі під обстрілом(Citation: 662). 8 квітня біля російського блокпоста на перехресті доріг із Самашок і Серноводська, села на заході Ічкерії біля кордону з Інгушетією, зібралися 800-1000 людей.
    За наказом командувача окупаційних військ Куликова командири поста не пустили в Самашки спостерігачів і чеченців із села. 11 квітня російська охорона блокпоста № 13 не пустила в Самашки чеченських жінок, які йшли туди з антивоєнним маршем(Citation: 1136).

    30 вересня 1995 року внутрішні війська МВС Росії (попередники сучасної Росгвардії) та російський міліцейський спецназ оточили Серноводськ.
    Окупанти зажадали від чеченців села роззброїти бійців Збройних сил Ічкерії і відкрити дорогу російській військовій техніці (докладніше: «Колективні покарання»)(Citation: 27).
    За даними «Меморіалу», у селі було понад 10 000 людей, за даними ООН - 20 000, ще понад 3000 біженців жили в корпусах курорту на околиці(Citation: 27)(Citation: 658). 26 жовтня російські війська перекрили останню дорогу в Серноводськ і перестали пропускати в село будь-які машини, зокрема з їжею (докладніше: «Медична та гуманітарна блокада»)(Citation: 27).
    Патриція Крокол, представниця британської християнської громади противників війни, того дня проїхала в село через поле і 20 квітня 1996 року в Москві розповіла громадському трибуналу російського фонду «Гласність»: «Об 11 ранку потрапили в Серноводськ, а через 40 хвилин і цю дорогу перекрили, поставивши 14 танків»(Citation: 988).
    У листопаді російські військові стали пропускати в село чотири рази на день автобус із людьми і машину швидкої допомоги(Citation: 27)(Citation: 1402)(Citation: 659).

    Російські війська оточували Серноводськ понад п'ять місяців, до штурму 3 березня 1996 року. 4 березня окупанти відкрили вихід із села, але російські солдати і співробітники МВС на постах не давали людям виїжджати на своїх машинах.
    Того дня із Серноводська пішли близько 10 000 людей. 5 березня окупанти знову закрили в'їзд і виїзд, у селі залишилися близько 7000 мирних чеченців (докладніше: «Фальшивий коридор»).
    Обстрілами російські війська вбили й поранили сотні з них (докладніше: «Невибіркові напади»). 9 березня, після захоплення Серноводська, російські військові відкрили в'їзд у село і виїзд із нього, і лише тоді чеченці вивезли поранених(Citation: 27)(Citation: 1402)(Citation: 659).

    10-11 грудня 1995 року російська армія оточила Гудермес, друге за величиною місто Ічкерії, на схід від Грозного, і нікого з нього не випускала. 14 грудня Збройні сили Ічкерії звільнили місто, а 19-20 грудня російські війська захопили його (докладніше: «Невибіркові напади»)(Citation: 656).
    З 11 по 20 грудня 1995 року, перед «виборами», які Росія призначила в Ічкерії, командувач окупаційних військ Шкірко заборонив в'їзд у Грозний машинам без перепусток (докладніше: «Імітація народного волевиявлення»)(Citation: 27).

    14 березня 1996 року частини внутрішніх військ МВС Росії та російської 58-ї армії оточили Самашки і нікого не пропускали через блокпост на південній дорозі до села Новий Шарой(Citation: 988). 19 березня окупанти випустили чеченців з оточення(Citation: 27).
    На початку квітня 1996 року російські льотчики вдень кожні 15-20 хвилин бомбили єдину дорогу із Шалі, міста на південний схід від Грозного, у Ведено, районний центр у горах на південному сході Ічкерії (докладніше: «Невибіркові напади»).
    Чеченці з Ведено і сусіднього села Дишне-Ведено йшли цією дорогою на рівнину вночі(Citation: 27)(Citation: 988).
    Навесні 1996 року російські військові на блокпості біля Шалажів, села на південний захід від Грозного, не пускали Мадіну Магомадову з Грозного до батьків, бо вона прописана в місті(Citation: 988).

    Правозахисники «Меморіалу» пишуть, що російські війська всю війну раз за разом оточували села і міста Ічкерії, обмежували або повністю закривали вхід і вихід із них, а солдати на блокпостах часто перекривали рух дорогами(Citation: 27).

    10 червня 1996 року Росія та Ічкерія підписали протокол до домовленості від 27 травня про припинення вогню.
    Російська делегація зобов'язалася до 7 липня зняти блокпости на виїздах із сіл і міст(Citation: 1124). 7 липня командування окупаційних військ відмовилося зняти всі пости, пославшись на те, що обстановка не нормалізувалася (докладніше: «Фальшиве перемир'я»)(Citation: 27). 8 вересня 1996 року російські частини почали йти зі своїх блокпостів і з Ічкерії(Citation: 1127)(Citation: 1163).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
