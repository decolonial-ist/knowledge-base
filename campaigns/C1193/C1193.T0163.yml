    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти палили тіла вбитих ними чеченців, відрізали мертвим вуха, таємно закопували тіла в безіменних могилах і не віддавали родинам.

    Російські військові вбивали затриманих чеченців і таємно закопували тіла біля своїх позицій, а такі могили нерідко виявлялися замінованими(Citation: 27).
    Окупанти не пускали рідних на територію частин, і родини знаходили могили, лише коли частина йшла(Citation: 27)(Citation: 986).

    У захоплених селах російські солдати кидали тіла вбитих ними чеченців у підпалені будинки або поливали бензином і підпалювали(Citation: 662)(Citation: 988).
    Окупанти відрізали мертвим чеченцям вуха(Citation: 657)(Citation: 988).

    Російські військові на вантажівці «Урал» привозили на Карпінське кладовище на заході Грозного тіла з блокпостів і з фільтраційних таборів, куди окупанти звозили затриманих чеченців.
    Гробарі складали їх у свіжі ями, від трьох до п'яти в кожну(Citation: 986).
    На початку війни російська армія відвезла частину тіл у Ростов, місто на півдні Росії, у вагони-холодильники своєї 124-ї медичної лабораторії і не віддавала їх родинам убитих(Citation: 1185)(Citation: 988).

    17 грудня 1994 року російські солдати з бронетранспортерів розстріляли біля кордону з підконтрольною Росії Інгушетією колону машин із біженцями з Грозного і вбили десять людей.
    Окупанти вивезли тіла, і російська міліція в Інгушетії знайшла лише одне з них(Citation: 27). 31 грудня 1994 року окупанти затримали в підвалі лікарні в Грозному двох молодих чеченців, які ховалися там від обстрілу.
    Батьки одного з них пізніше забрали його тіло з моргу в Москві й поховали вдома, а другого рідні до 2015 року так і не знайшли(Citation: 1169).
    З грудня 1994 року по травень 1995 року окупанти затримали в Грозному 27 чеченців і відвезли до фільтраційного табору в Моздоку, місті в підконтрольній Росії Північній Осетії, а до квітня 1996 року звідти привезли їхні тіла.
    Тих, кого російський конвой дорогою до Моздока розстріляв або викинув із машини, сільчани ховали невпізнаними, а рідні потім знаходили їх за описами тіл і одягу(Citation: 988).

    28 січня 1995 року солдати внутрішніх військ МВС Росії (попередників сучасної Росгвардії) вели під конвоєм по своїй частині на вулиці Маяковського в Грозному двох братів, 18 і 21 року, розстріляли їх і таємно закопали у дворі будинку на території частини. 2 квітня, коли частина пішла, їхній батько Хусейн Хамідов знайшов могилу за розповіддю сусідки, дістав тіла із землі при судовому медику і поховав синів біля свого дому(Citation: 27)(Citation: 988)(Citation: 1608).
    У кінці березня 1995 року кримінальний розшук із Москви почав розкривати ями з тілами на кладовищі біля консервного заводу в Заводському районі Грозного.
    Судові медики МВС Росії записували причиною смерті розстріл, загибель у вогні або ножові поранення, а в деяких тіл не було голови(Citation: 986)(Citation: 988).

    7 квітня 1995 року окупаційні війська штурмували Самашки, село на заході Ічкерії. 7 і 8 квітня російські військові обходили будинки і вбивали мирних чеченців (докладніше: «Масові вбивства цивільних»).
    У доповіді Спостережної місії російських правозахисних організацій 1995 року сказано: «Зафіксовано численні повідомлення свідків про навмисне спалення російськими військовослужбовцями тіл загиблих жителів».
    Місія назвала на ім'я 13 людей, чиї тіла спалили окупанти.
    Увечері 7 квітня російські солдати вбили Алі Сугаїпова, Еміна Надирова, Хамзата Хархароєва і його сина Ахмеда, а вранці 8 квітня односельці знайшли їхні спалені тіла в одному дворі(Citation: 662).
    Російські танкісти поранили 62-річного Догу Цатішаєва, а солдати застрелили його впритул з автомата в будинку 93 на вулиці Шаріпова, облили тіло бензином і підпалили(Citation: 662). 20 квітня Тамара Мутієва із Самашок розповіла спостерігачам російської правозахисної організації «Меморіал», що російські військові вбили і спалили її зведену сестру.
    Андрій Блінушов, один зі спостерігачів, записав у щоденнику: «Досі сестра і мама вбитої дівчини збирають у руїнах будинку шматочки її кісток»(Citation: 1136).

    9 травня 1995 року солдати 503-го полку російської армії незаконно затримали на блокпості Аюба Домаєва, Асламбека Сулейманова і Шамхана Ташухаджієва із Шалі, міста на південний схід від Грозного, і вбили всіх трьох (докладніше: «Вбивство полонених і затриманих»).
    Володимир Ємельяненко, кореспондент московського тижневика «Московські новини», 21 лютого 1996 року розповів громадському трибуналу російського фонду «Гласність» у Москві, що військові не пускали рідних на територію полку і на їхні запитання «казали, що тут такі не проїжджали»(Citation: 986). 3 червня 503-й полк пішов зі своєї стоянки на полі біля Шалі, і солдат строкової служби, який утік із полку, показав родинам, де солдати закопали трьох чеченців.
    Біля стоянки розвідувальної роти, на глибині двох метрів, рідні знайшли тіла Аюба Домаєва і Асламбека Сулейманова.
    В іншому місці на полі вони відкопали роздавлену гусеницями машину, на якій їхали троє чеченців. 6 червня тіло Шамхана Ташухаджієва знайшли на кладовищі на околиці Шалі(Citation: 27)(Citation: 986).

    У вересні 1995 року чеченські жінки з Грозного знайшли біля свіжих ям на Карпінському кладовищі п'ять зелених військових ящиків від снарядів, де лежали кістки з попелом, і передали їх місії ОБСЄ.
    За висновком експертизи, в одному з ящиків лежали спалені, облиті сірчаною кислотою і розбиті на дрібні шматки останки людей 20-23 років(Citation: 986).
    На початку жовтня 1995 року чеська журналістка Петра Прохазкова зняла на православному кладовищі в Грозному ями з кількома десятками тіл, куди окупанти вночі на своїх машинах привозили нові тіла, і повідомила про це в ОБСЄ(Citation: 988).

    У кінці лютого 1996 року російські військові вбили затриманого Шаріпа Батаєва, чеченця з Аршти, села в підконтрольній Росії Інгушетії, і закопали тіло на глибину 20 сантиметрів на схилі пагорба, нижче окопів розвідників 693-го полку 58-ї російської армії. 20 березня слідчі з Інгушетії викопали тіло, і того ж дня його поховали за мусульманським звичаєм(Citation: 988).
    Російські війська з 3 по 9 березня 1996 року штурмували Серноводськ, село на заході Ічкерії, і спалили там мечеть, куди 4 березня сільчани принесли тіла вбитих окупантами чеченців, щоб поховати пізніше(Citation: 1356). 11 березня жінки із Серноводська, яких окупанти на кілька годин пустили додому, знайшли біля згорілої мечеті сім спалених тіл(Citation: 988).
    Під час штурму Серноводська екіпажі російських гелікоптерів поранили ракетами літнього чеченця на курорті біля села, де жили біженці, і поранений помер на порозі своєї кімнати.
    Окупанти обшукали курорт, і після цього на місці тіла знайшли лише згорілі останки(Citation: 988). 20 березня 1996 року російські солдати, які висадилися з гелікоптера біля молочної ферми поблизу Нагорного, села поруч із Грозним, розстріляли там затриманих неозброєних чеченців: за даними Human Rights Watch - двох, за даними чеченського жіночого комітету - п'ятьох.
    Убивці відрізали мертвим вуха і розрізали їм живота ножем(Citation: 657)(Citation: 988). 12 травня 1996 року російські війська захопили Харсеной, гірське село на півдні Ічкерії, і розстріляли сімох молодих чеченців із села.
    Односельці поховали одного з них, а тіла решти шістьох окупанти рідним так і не віддали(Citation: 988). 15 липня 1996 року в північно-західному передмісті Грозного солдати внутрішніх військ МВС Росії з двох бронетранспортерів розстріляли неозброєних людей у легкових машинах.
    Окупанти підпалили машини з тілами, а в деяких тіл відрізали вуха(Citation: 1364)(Citation: 27).

    У доповіді Human Rights Watch 1997 року сказано, що з березня 1995 року по січень 1997 року товариство «Жертви війни» на чолі з Хусейном Хамідовим допомогло дістати з масових поховань в Ічкерії 926 тіл.
    Судові медики в Ростові встановили імена 426 із них, а ще близько 80 масових поховань до січня 1997 року не розкрили(Citation: 657).

    У червні 1996 року прокуратура адміністрації, поставленої Росією в Грозному, передала російським прокурорам 342 справи про злочини окупантів, серед них - про відрізані вуха і про тіла, скинуті з гелікоптерів.
    Російські прокурори повернули понад половину справ на додаткове розслідування, а решту закрили або не розглядали (докладніше: «Безкарність виконавців»)(Citation: 657). 3 жовтня 1996 року, через місяць після мирних угод у Хасав'юрті, голова уряду Росії Черномирдін і Зелімхан Яндарбієв, який виконував обов'язки президента Ічкерії, підписали в Москві заяву.
    За нею Росія зобов'язалася на першу вимогу Ічкерії відкривати доступ до місць поховань для обстеження і розкопок(Citation: 799).
    До середини жовтня 1996 року російські чиновники попри заяву не давали товариству «Жертви війни» розкривати могили: казали, що тіл у них немає, або вимагали хабарі(Citation: 657).

    У грудні 1997 року у вагонах-холодильниках 124-ї лабораторії російської армії в Ростові все ще лежали кілька десятків тіл чеченців, загорнутих у ковдри.
    Делегація Ічкерії приїжджала в Ростов і просила повернути їх, але співробітники лабораторії не повернули жодного тіла(Citation: 1185).
    У 2019 році Олександр Черкасов із «Меморіалу» повідомив, що за кілька років до того з холодильників 124-ї лабораторії вивезли близько сотні невпізнаних останків часів війни: частину відправили в Чеченську Республіку, частину поховали під номерами на кладовищах Москви(Citation: 1191).

    У 2014 році російські військові знайшли в Жовтневому районі Грозного братську могилу першої війни з останками понад 160 людей і відвезли їх на експертизу в Ростов.
    За висновком експертів, крім двох російських військових там лежали, найімовірніше, мирні чоловіки, жінки та діти. 31 грудня 2016 року останки 109 людей із цієї могили привезли з Ростова в Грозний.
    Родичі впізнали двох за генетичними паспортами і забрали, а решту 107 поховали у двох тимчасових братських могилах на кладовищі біля села Побєдинське під Грозним, і списків загиблих рідні не отримали(Citation: 1171)(Citation: 1179).
