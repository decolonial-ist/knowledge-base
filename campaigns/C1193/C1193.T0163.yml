description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты жгли тела убитых ими чеченцев, отрезали мёртвым уши, тайно закапывали тела в безымянных могилах и не отдавали семьям.

    Российские военные убивали задержанных чеченцев и тайно закапывали тела у своих позиций, а такие могилы нередко оказывались заминированы(Citation: 27).
    Оккупанты не пускали родных на территорию частей, и семьи находили могилы, только когда часть уходила(Citation: 27)(Citation: 986).

    В захваченных сёлах российские солдаты бросали тела убитых ими чеченцев в подожжённые дома или поливали бензином и поджигали(Citation: 662)(Citation: 988).
    Оккупанты отрезали мёртвым чеченцам уши(Citation: 657)(Citation: 988).

    Российские военные на грузовике «Урал» привозили на Карпинское кладбище на западе Грозного тела с блокпостов и из фильтрационных лагерей, куда оккупанты свозили задержанных чеченцев.
    Могильщики складывали их в свежие ямы, от трёх до пяти в каждую(Citation: 986).
    В начале войны российская армия увезла часть тел в Ростов, город на юге России, в холодильные вагоны своей 124-й медицинской лаборатории и не отдавала их семьям убитых(Citation: 1185)(Citation: 988).

    17 декабря 1994 года российские солдаты из бронетранспортёров расстреляли у границы с подконтрольной России Ингушетией колонну машин с беженцами из Грозного и убили десять человек.
    Оккупанты увезли тела, и российская милиция в Ингушетии нашла только одно из них(Citation: 27). 31 декабря 1994 года оккупанты задержали в подвале больницы в Грозном двух молодых чеченцев, которые прятались там от обстрела.
    Родители одного из них позже забрали его тело из морга в Москве и похоронили дома, а второго родные к 2015 году так и не нашли(Citation: 1169).
    С декабря 1994 года по май 1995 года оккупанты задержали в Грозном 27 чеченцев и увезли в фильтрационный лагерь в Моздоке, городе в подконтрольной России Северной Осетии, а до апреля 1996 года оттуда привезли их тела.
    Тех, кого российский конвой по дороге в Моздок расстрелял или выбросил из машины, сельчане хоронили неопознанными, а родные потом находили их по описаниям тел и одежды(Citation: 988).

    28 января 1995 года солдаты внутренних войск МВД России (предшественников современной Росгвардии) вели под конвоем по своей части на улице Маяковского в Грозном двух братьев, 18 и 21 года, расстреляли их и тайно закопали во дворе дома на территории части. 2 апреля, когда часть ушла, их отец Хусейн Хамидов нашёл могилу по рассказу соседки, достал тела из земли при судебном медике и похоронил сыновей у своего дома(Citation: 27)(Citation: 988)(Citation: 1608).
    В конце марта 1995 года уголовный розыск из Москвы начал вскрывать ямы с телами на кладбище у консервного завода в Заводском районе Грозного.
    Судебные медики МВД России записывали причиной смерти расстрел, гибель в огне или ножевые ранения, а у некоторых тел не было головы(Citation: 986)(Citation: 988).

    7 апреля 1995 года оккупационные войска штурмовали Самашки, село на западе Ичкерии. 7 и 8 апреля российские военные обходили дома и убивали мирных чеченцев (подробнее: «Массовые убийства гражданских»).
    В докладе Наблюдательной миссии российских правозащитных организаций 1995 года сказано: «Зафиксированы многочисленные сообщения свидетелей о преднамеренном сжигании российскими военнослужащими тел погибших жителей».
    Миссия назвала по именам 13 человек, чьи тела сожгли оккупанты.
    Вечером 7 апреля российские солдаты убили Али Сугаипова, Эмина Надырова, Хамзата Хархароева и его сына Ахмеда, а утром 8 апреля односельчане нашли их сожжённые тела в одном дворе(Citation: 662).
    Российские танкисты ранили 62-летнего Догу Цатишаева, а солдаты застрелили его в упор из автомата в доме 93 на улице Шарипова, облили тело бензином и подожгли(Citation: 662). 20 апреля Тамара Мутиева из Самашек рассказала наблюдателям российской правозащитной организации «Мемориал», что российские военные убили и сожгли её сводную сестру.
    Андрей Блинушов, один из наблюдателей, записал в дневнике: «До сих пор сестра и мама убитой девушки собирают в руинах дома кусочки ее костей»(Citation: 1136).

    9 мая 1995 года солдаты 503-го полка российской армии незаконно задержали на блокпосту Аюба Домаева, Асламбека Сулейманова и Шамхана Ташухаджиева из Шали, города к юго-востоку от Грозного, и убили всех троих (подробнее: «Убийство пленных и задержанных»).
    Владимир Емельяненко, корреспондент московского еженедельника «Московские новости», 21 февраля 1996 года рассказал общественному трибуналу российского фонда «Гласность» в Москве, что военные не пускали родных на территорию полка и на их вопросы «говорили, что здесь такие не проезжали»(Citation: 986). 3 июня 503-й полк ушёл со своей стоянки на поле у Шали, и солдат срочной службы, который бежал из полка, показал семьям, где солдаты закопали троих чеченцев.
    У стоянки разведывательной роты, на глубине двух метров, родные нашли тела Аюба Домаева и Асламбека Сулейманова.
    В другом месте на поле они откопали раздавленную гусеницами машину, на которой ехали трое чеченцев. 6 июня тело Шамхана Ташухаджиева нашли на кладбище на окраине Шали(Citation: 27)(Citation: 986).

    В сентябре 1995 года чеченские женщины из Грозного нашли у свежих ям на Карпинском кладбище пять зелёных военных ящиков из-под снарядов, где лежали кости с пеплом, и передали их миссии ОБСЕ.
    По заключению экспертизы, в одном из ящиков лежали сожжённые, облитые серной кислотой и разбитые на мелкие куски останки людей 20-23 лет(Citation: 986).
    В начале октября 1995 года чешская журналистка Петра Прохазкова сняла на православном кладбище в Грозном ямы с несколькими десятками тел, куда оккупанты ночью на своих машинах привозили новые тела, и сообщила об этом в ОБСЕ(Citation: 988).

    В конце февраля 1996 года российские военные убили задержанного Шарипа Батаева, чеченца из Аршты, села в подконтрольной России Ингушетии, и закопали тело на глубину 20 сантиметров на склоне холма, ниже окопов разведчиков 693-го полка 58-й российской армии. 20 марта следователи из Ингушетии выкопали тело, и в тот же день его похоронили по мусульманскому обычаю(Citation: 988).
    Российские войска с 3 по 9 марта 1996 года штурмовали Серноводск, село на западе Ичкерии, и сожгли там мечеть, куда 4 марта сельчане принесли тела убитых оккупантами чеченцев, чтобы похоронить позже(Citation: 1356). 11 марта женщины из Серноводска, которых оккупанты на несколько часов пустили домой, нашли у сгоревшей мечети семь сожжённых тел(Citation: 988).
    Во время штурма Серноводска экипажи российских вертолётов ранили ракетами пожилого чеченца на курорте у села, где жили беженцы, и раненый умер на пороге своей комнаты.
    Оккупанты обыскали курорт, и после этого на месте тела нашли только сгоревшие останки(Citation: 988). 20 марта 1996 года российские солдаты, которые высадились с вертолёта у молочной фермы возле Нагорного, села рядом с Грозным, расстреляли там задержанных безоружных чеченцев: по данным Human Rights Watch - двоих, по данным чеченского женского комитета - пятерых.
    Убийцы отрезали мёртвым уши и разрезали им животы ножом(Citation: 657)(Citation: 988). 12 мая 1996 года российские войска захватили Харсеной, горное село на юге Ичкерии, и расстреляли семерых молодых чеченцев из села.
    Односельчане похоронили одного из них, а тела остальных шестерых оккупанты родным так и не отдали(Citation: 988). 15 июля 1996 года в северо-западном пригороде Грозного солдаты внутренних войск МВД России с двух бронетранспортёров расстреляли безоружных людей в легковых машинах.
    Оккупанты подожгли машины с телами, а у некоторых тел отрезали уши(Citation: 1364)(Citation: 27).

    В докладе Human Rights Watch 1997 года сказано, что с марта 1995 года по январь 1997 года общество «Жертвы войны» во главе с Хусейном Хамидовым помогло достать из массовых захоронений в Ичкерии 926 тел.
    Судебные медики в Ростове установили имена 426 из них, а ещё около 80 массовых захоронений к январю 1997 года не вскрыли(Citation: 657).

    В июне 1996 года прокуратура администрации, поставленной Россией в Грозном, передала российским прокурорам 342 дела о преступлениях оккупантов, среди них - об отрезанных ушах и о телах, сброшенных с вертолётов.
    Российские прокуроры вернули больше половины дел на дополнительное расследование, а остальные закрыли или не рассматривали (подробнее: «Безнаказанность исполнителей»)(Citation: 657). 3 октября 1996 года, через месяц после мирных соглашений в Хасавюрте, председатель правительства России Черномырдин и Зелимхан Яндарбиев, исполнявший обязанности президента Ичкерии, подписали в Москве заявление.
    По нему Россия обязалась по первому требованию Ичкерии открывать доступ к местам захоронений для обследования и раскопок(Citation: 799).
    К середине октября 1996 года российские чиновники вопреки заявлению не давали обществу «Жертвы войны» вскрывать могилы: говорили, что тел у них нет, или требовали взятки(Citation: 657).

    В декабре 1997 года в холодильных вагонах 124-й лаборатории российской армии в Ростове всё ещё лежали несколько десятков тел чеченцев, завёрнутых в одеяла.
    Делегация Ичкерии приезжала в Ростов и просила вернуть их, но сотрудники лаборатории не вернули ни одного тела(Citation: 1185).
    В 2019 году Александр Черкасов из «Мемориала» сообщил, что за несколько лет до того из холодильников 124-й лаборатории вывезли около сотни неопознанных останков времён войны: часть отправили в Чеченскую Республику, часть похоронили под номерами на кладбищах Москвы(Citation: 1191).

    В 2014 году российские военные нашли в Октябрьском районе Грозного братскую могилу первой войны с останками больше 160 человек и увезли их на экспертизу в Ростов.
    По заключению экспертов, кроме двух российских военных там лежали, вероятнее всего, мирные мужчины, женщины и дети. 31 декабря 2016 года останки 109 человек из этой могилы привезли из Ростова в Грозный.
    Родственники опознали двоих по генетическим паспортам и забрали, а остальных 107 похоронили в двух временных братских могилах на кладбище у села Побединское под Грозным, и списков погибших родные не получили(Citation: 1171)(Citation: 1179).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers burned the bodies of the Chechens they had killed, cut off the ears of the dead, secretly buried bodies in unmarked graves and did not give them back to the families.

    Russian servicemen killed detained Chechens and secretly buried the bodies near their positions, and such graves were often mined(Citation: 27).
    The occupiers did not let relatives onto the grounds of their units, and families found the graves only when the unit had left(Citation: 27)(Citation: 986).

    In captured villages, Russian soldiers threw the bodies of the Chechens they had killed into houses they had set on fire, or doused them with gasoline and set them alight(Citation: 662)(Citation: 988).
    The occupiers cut off the ears of dead Chechens(Citation: 657)(Citation: 988).

    Russian servicemen brought bodies in a "Ural" truck to the Karpinsky cemetery in the west of Grozny from the checkpoints and from the filtration camps to which the occupiers took detained Chechens.
    Gravediggers laid them in fresh pits, three to five in each(Citation: 986).
    At the start of the war, the Russian army took some of the bodies to Rostov, a city in the south of Russia, to the refrigerator railcars of its 124th medical laboratory, and did not give them back to the families of the dead(Citation: 1185)(Citation: 988).

    On 17 December 1994, Russian soldiers in armored personnel carriers shot up a column of cars with refugees from Grozny near the border with Russian-controlled Ingushetia and killed ten people.
    The occupiers took the bodies away, and the Russian police in Ingushetia found only one of them(Citation: 27).
    On 31 December 1994, the occupiers detained two young Chechens in the basement of a hospital in Grozny, where they were hiding from the shelling.
    The parents of one of them later collected his body from a morgue in Moscow and buried him at home, while the relatives of the other had still not found him by 2015(Citation: 1169).
    From December 1994 to May 1995, the occupiers detained 27 Chechens in Grozny and took them to the filtration camp in Mozdok, a town in Russian-controlled North Ossetia, and by April 1996 their bodies were brought back from there.
    Those whom the Russian escort shot or threw out of the vehicles on the way to Mozdok were buried unidentified by villagers, and relatives later found them by descriptions of the bodies and clothes(Citation: 988).

    On 28 January 1995, soldiers of the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) led two brothers, aged 18 and 21, under escort through their unit on Mayakovsky Street in Grozny, shot them and secretly buried them in the yard of a house on the grounds of the unit.
    On 2 April, when the unit had left, their father Khusein Khamidov found the grave from a neighbor's account, took the bodies out of the ground in the presence of a forensic doctor and buried his sons by his house(Citation: 27)(Citation: 988)(Citation: 1608).
    At the end of March 1995, criminal investigators from Moscow began opening the pits with bodies at the cemetery near the cannery in the Zavodskoy district of Grozny.
    Forensic doctors of the Russian Ministry of Internal Affairs recorded the cause of death as shooting, death by fire or knife wounds, and some of the bodies had no head(Citation: 986)(Citation: 988).

    On 7 April 1995, the occupation troops stormed Samashki, a village in the west of Ichkeria.
    On 7 and 8 April, Russian servicemen went from house to house and killed Chechen civilians (see: "Mass Killings of Civilians").
    The 1995 report of the Observer Mission of Russian human rights organizations says: "Numerous accounts by witnesses have been recorded of the deliberate burning by Russian servicemen of the bodies of dead residents."
    The Mission named 13 people whose bodies the occupiers had burned.
    On the evening of 7 April, Russian soldiers killed Ali Sugaipov, Emin Nadyrov, Khamzat Kharkharoyev and his son Akhmed, and on the morning of 8 April fellow villagers found their burned bodies in one yard(Citation: 662).
    Russian tank crews wounded 62-year-old Dogu Tsatishayev, and soldiers shot him dead at point-blank range with an automatic rifle in house 93 on Sharipov Street, poured gasoline over the body and set it on fire(Citation: 662).
    On 20 April, Tamara Mutiyeva from Samashki told observers of the Russian human rights organization "Memorial" that Russian servicemen had killed and burned her half-sister.
    Andrei Blinushov, one of the observers, recorded in his diary: "To this day the sister and mother of the murdered girl are collecting pieces of her bones in the ruins of the house"(Citation: 1136).

    On 9 May 1995, soldiers of the 503rd regiment of the Russian army unlawfully detained at a checkpoint Ayub Domayev, Aslambek Suleimanov and Shamkhan Tashukhadzhiyev from Shali, a town southeast of Grozny, and killed all three (see: "Killing of Prisoners and Detainees").
    Vladimir Yemelyanenko, a correspondent of the Moscow weekly Moskovskiye Novosti, told the public tribunal of the Russian Glasnost Foundation in Moscow on 21 February 1996 that the military did not let the relatives onto the grounds of the regiment and in answer to their questions "said that no such people had passed through here"(Citation: 986).
    On 3 June, the 503rd regiment left its camp in a field near Shali, and a conscript soldier who had fled the regiment showed the families where the soldiers had buried the three Chechens.
    Near the camp of the reconnaissance company, at a depth of two meters, the relatives found the bodies of Ayub Domayev and Aslambek Suleimanov.
    In another place in the field they dug up the car in which the three Chechens had been traveling, crushed by tank tracks.
    On 6 June, the body of Shamkhan Tashukhadzhiyev was found at the cemetery on the outskirts of Shali(Citation: 27)(Citation: 986).

    In September 1995, Chechen women from Grozny found by the fresh pits at the Karpinsky cemetery five green military shell boxes containing bones and ashes, and handed them over to the OSCE mission.
    According to the expert examination, one of the boxes contained the remains of people aged 20-23, burned, doused with sulfuric acid and broken into small pieces(Citation: 986).
    In early October 1995, the Czech journalist Petra Procházková filmed at the Orthodox cemetery in Grozny pits with several dozen bodies, to which the occupiers brought new bodies at night in their vehicles, and reported this to the OSCE(Citation: 988).

    At the end of February 1996, Russian servicemen killed the detained Sharip Batayev, a Chechen from Arshty, a village in Russian-controlled Ingushetia, and buried the body at a depth of 20 centimeters on a hillside below the trenches of the reconnaissance troops of the 693rd regiment of the Russian 58th Army.
    On 20 March, investigators from Ingushetia dug up the body, and on the same day it was buried according to Muslim custom(Citation: 988).
    From 3 to 9 March 1996, Russian troops stormed Sernovodsk, a village in the west of Ichkeria, and burned the mosque there, to which on 4 March villagers had brought the bodies of Chechens killed by the occupiers in order to bury them later(Citation: 1356).
    On 11 March, women from Sernovodsk, whom the occupiers had let home for a few hours, found seven burned bodies by the burned-down mosque(Citation: 988).
    During the assault on Sernovodsk, the crews of Russian helicopters wounded an elderly Chechen with rockets at the resort near the village where refugees lived, and the wounded man died on the threshold of his room.
    The occupiers searched the resort, and after that only burned remains were found where the body had been(Citation: 988).
    On 20 March 1996, Russian soldiers who had landed from a helicopter near a dairy farm by Nagornoye, a village next to Grozny, shot detained unarmed Chechens there: two according to Human Rights Watch, five according to the Chechen women's committee.
    The killers cut off the ears of the dead and slit their stomachs with a knife(Citation: 657)(Citation: 988).
    On 12 May 1996, Russian troops captured Kharsenoy, a mountain village in the south of Ichkeria, and shot seven young Chechens from the village.
    Fellow villagers buried one of them, while the bodies of the other six the occupiers never gave back to the relatives(Citation: 988).
    On 15 July 1996, in the northwestern suburb of Grozny, soldiers of the Internal Troops of the Russian Ministry of Internal Affairs from two armored personnel carriers shot unarmed people in passenger cars.
    The occupiers set fire to the cars with the bodies, and cut off the ears of some of the dead(Citation: 1364)(Citation: 27).

    The 1997 report of Human Rights Watch says that from March 1995 to January 1997 the "Victims of War" society headed by Khusein Khamidov helped recover 926 bodies from mass graves in Ichkeria.
    Forensic doctors in Rostov established the names of 426 of them, and about 80 more mass graves had not been opened by January 1997(Citation: 657).

    In June 1996, the prosecutor's office of the administration installed by Russia in Grozny handed over to Russian prosecutors 342 cases on crimes of the occupiers, among them on cut-off ears and on bodies thrown from helicopters.
    Russian prosecutors returned more than half of the cases for further investigation, and closed or did not consider the rest (see: "Impunity of Perpetrators")(Citation: 657).
    On 3 October 1996, a month after the peace agreements in Khasavyurt, Chernomyrdin, the chairman of the Russian government, and Zelimkhan Yandarbiyev, the acting president of Ichkeria, signed a statement in Moscow.
    Under it, Russia undertook to open access to burial sites for examination and excavation at Ichkeria's first request(Citation: 799).
    By mid-October 1996, Russian officials, contrary to the statement, were not letting the "Victims of War" society open the graves: they said they had no bodies, or demanded bribes(Citation: 657).

    In December 1997, several dozen bodies of Chechens, wrapped in blankets, still lay in the refrigerator railcars of the 124th laboratory of the Russian army in Rostov.
    A delegation of Ichkeria came to Rostov and asked for them back, but the laboratory staff did not return a single body(Citation: 1185).
    In 2019, Alexander Cherkasov of "Memorial" reported that several years earlier about a hundred unidentified remains from the time of the war had been taken out of the refrigerators of the 124th laboratory: some were sent to the Chechen Republic, others were buried under numbers in cemeteries in Moscow(Citation: 1191).

    In 2014, Russian servicemen found in the Oktyabrsky district of Grozny a mass grave from the first war with the remains of more than 160 people and took them to Rostov for examination.
    According to the experts, apart from two Russian servicemen, those lying there were most likely civilian men, women and children.
    On 31 December 2016, the remains of 109 people from this grave were brought from Rostov to Grozny.
    Relatives identified two of them by genetic profiles and took them, while the other 107 were buried in two temporary mass graves at the cemetery near the village of Pobedinskoye outside Grozny, and the relatives received no lists of the dead(Citation: 1171)(Citation: 1179).
