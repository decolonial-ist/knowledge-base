    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Президент Росії Єльцин, російські міністри та генерали всю війну заперечували злочини окупаційних військ, приписували їх армії Ічкерії, а мирних чеченців, яких убили російські військові, видавали за її бійців.

    1 грудня 1994 року, за десять днів до відкритого вторгнення, голова уряду Росії Черномирдін розпорядженням № 1886-р створив Тимчасовий інформаційний центр (докладніше: «Цензура»)(Citation: 1341).
    Правозахисники «Меморіалу» пишуть, що центр майже одразу став поширювати дезінформацію і заважати роботі російських та іноземних журналістів в Ічкерії(Citation: 27).

    На запити доповідачів ООН і депутатів російського парламенту уряд Росії, командування окупаційних військ і військова прокуратура відповідали, що на солдатів нападала армія Ічкерії, а повідомлень про злочини не надходило(Citation: 739)(Citation: 27).

    Російські міністри, генерали та пресслужби заперечували, що армія воювала в Ічкерії восени 1994 року(Citation: 729)(Citation: 713)(Citation: 1085)(Citation: 1414)(Citation: 27), а льотчики бомбили Грозний у грудні 1994 року(Citation: 27)(Citation: 986)(Citation: 718).
    Міністр юстиції Росії Ковальов 4 лютого 1995 року сказав, що разом із колегами побував в Ічкерії і не знайшов жодного випадку грабежу російськими солдатами(Citation: 27).

    Оперативний штаб уряду Росії та російські військові приписували армії Ічкерії руйнування житлових кварталів Грозного в грудні 1994 року(Citation: 1426)(Citation: 27) і вбивства мирних людей у містах Шалі в січні 1995 року(Citation: 1431)(Citation: 27) та Гудермесі у квітні 1995 року(Citation: 27).

    Президент Росії Єльцин обіцяв припинити бомбардування або оголошував, що бої закінчено, 27 грудня 1994 року(Citation: 27), 19 січня 1995 року(Citation: 1323)(Citation: 1257), 10 травня 1995 року(Citation: 1276) і 5 квітня 1996 року(Citation: 988), голова уряду Черномирдін - 17 липня 1996 року(Citation: 27).
    Після кожної заяви російські війська далі бомбили і штурмували села й міста Ічкерії(Citation: 27)(Citation: 988).

    7 квітня 1995 року внутрішні війська МВС Росії (попередники сучасної Росгвардії) штурмували Самашки, село на заході Ічкерії.
    За 7 і 8 квітня окупанти вбили в селі 103 мирних чеченців (докладніше: «Масові вбивства цивільних»)(Citation: 662).
    Увечері 7 квітня перший канал російського телебачення і телеканал НТВ з посиланням на агентство «Інтерфакс» та російських військових повідомили, що бійці армії Ічкерії розстріляли старійшин села.
    Того дня російські солдати обстріляли машини, в яких старійшини і мулла поверталися з переговорів.
    Усі восьмеро людей у машинах залишилися живі. 11 квітня п'ятеро старійшин Самашок передали правозахисникам «Меморіалу» заяву: «Заява військового керівництва МВС Росії — вигадка від початку до кінця»(Citation: 1136). 29 травня комісія російського парламенту з розслідування причин війни в Ічкерії визнала повідомлення про розстріл старійшин брехнею(Citation: 662).

    8 квітня 1995 року агентство ІТАР-ТАРС повідомило, що російські війська вбили в Самашках у бою понад 130 бійців армії Ічкерії. 11 квітня представник МВС Росії назвав кореспондентові НТВ 120 бійців, убитих російськими військовими, і сказав, що мирні чеченці пішли перед штурмом.
    Того дня заступник голови уряду Росії Сосковець на запитання кореспондента НТВ про вбивства жінок і чоловіків у селі відповів: «Ні, нічого цього немає»(Citation: 662).
    Російські слідчі у фільтраційному таборі в Моздоку, місті в підконтрольній Росії Північній Осетії, пропонували Махмудеміну Ізієву із Самашок підписати свідчення, що першими стріляли чеченські бійці. 18 квітня російські військові відпустили його без звинувачень(Citation: 27)(Citation: 662).
    Голова комісії російського парламенту з розслідування причин війни Говорухін після поїздки в Самашки 14 квітня сказав депутатам, що нарахував там «близько п'ятдесяти зруйнованих або пошкоджених будинків»(Citation: 662). 1 травня 1995 року правозахисник Сергій Ковальов сказав на слуханнях у Конгресі США, що його група правозахисників склала список із 374 зруйнованих будинків у селі(Citation: 1038).
    У липні частина членів комісії російського парламенту написала висновок від імені всієї комісії: «зі списку [вбитих чеченців із села] треба виключити чоловіків.
    Люди, які тримали в руках автомат чи гранатомет, не можуть вважатися мирними жителями».
    У доповіді Спостережної місії російських правозахисників сказано, що так депутати записали в бійці армії Ічкерії всіх чоловіків Самашок.
    Місія назвала поіменно всіх 103 чеченців, яких убили окупанти, - 90 чоловіків і 13 жінок.
    Четверо з них тримали в руках зброю(Citation: 662). 15 серпня 1995 року уряд Росії відповів спеціальному доповідачеві ООН з питань катувань, що будинки в Самашках зруйнували бійці армії Ічкерії, а військова прокуратура повідомлень про страти чеченців без суду не отримувала(Citation: 738).

    Командувач окупаційними військами Шкірко заперечував бомбардування села Рошні-Чу в жовтні 1995 року(Citation: 1436).
    Російські генерали заперечували обстріли селища Новогрозненський у лютому 1996 року(Citation: 27).
    Командувач окупаційними військами Тихомиров у березні 1996 року заявив, що до військової прокуратури не надходило повідомлень про грабежі(Citation: 27), а у квітні 1996 року заперечував, що його підлеглі вбили президента Ічкерії Джохара Дудаєва(Citation: 27).

    Командувач окупаційними військами Шкірко назвав 267 жертв серед городян Гудермеса, який російські війська штурмували в грудні 1995 року.
    Правозахисники «Меморіалу» пишуть, що це число значно занижене(Citation: 27).
    Міністр оборони Росії Грачов записав у бійці армії Ічкерії мирних чеченців, яких його війська вбили в селищі Новогрозненський у лютому 1996 року(Citation: 27).
    Представник російських військових приписав чеченським бійцям, перевдягненим у російську форму, грабежі, які російські солдати влаштували в селі Серноводськ у березні 1996 року (докладніше: «Мародерство»)(Citation: 27).

    28 березня 1996 року російський льотчик скинув бомбу на Катир-Юрт, село на південний захід від Грозного, і вбив дев'ятьох людей із родини Хажгірієвих (докладніше: «Невибіркові напади»).
    Наступного дня командувач окупаційними військами Тихомиров, за повідомленням агентства «Інтерфакс», визнав, що екіпаж бомбив без наказу, і вибачився перед родиною(Citation: 27)(Citation: 1437). 31 березня президент Росії Єльцин пообіцяв у зверненні до громадян Росії припинити наступ.
    У ніч на 3 квітня і 4 квітня російські льотчики бомбили Шалажі, село на південний захід від Грозного, і вбили трьох чеченців(Citation: 27)(Citation: 988).
    Командувач російської військової авіації Дейнекін і Тихомиров назвали бомбардування провокацією(Citation: 27). 10 квітня Дейнекін сказав на пресконференції, яку показали «Вісті» телеканалу РТР: «ні Катир-Юрт, ні двічі Шалажі, жодних інших населених пунктів федеральні ВПС [російські військово-повітряні сили] та авіація сухопутних військ не бомбили і не планували бомбити».
    Генерал додав, що бомби в селах підривають бійці армії Ічкерії(Citation: 27).
    Курейш Хажгірієв, чеченець із Катир-Юрта, чиїх рідних убив російський льотчик, 22 квітня сказав громадському трибуналу російського фонду «Гласність» у Москві: «Я не можу чути, як генерал Дейнекін блюзнірськи заявляє, що вони не бомбили.
    Я слів не знаходжу!
    Ганьба генералові»(Citation: 988).
    Російські прокурори призупинили справи про бомбардування Катир-Юрта і Шалажів (докладніше: «Безкарність виконавців»).
    У листопаді 1997 року військова прокуратура Росії визнала в листі «Меморіалу», що Катир-Юрт бомбив літак російських військ, а про Шалажі написала, що російська авіація била там по армії Ічкерії(Citation: 27).

    Генерали окупаційних військ заперечували обстріли міста Урус-Мартан у травні 1996 року(Citation: 1278)(Citation: 27).
    Представник російської авіації заперечував бомбардування Ножай-Юртівського району на південному сході Ічкерії 3 червня 1996 року, на третій день припинення вогню, про яке домовилися Росія та Ічкерія(Citation: 27)(Citation: 1362).
    У липні 1996 року російські солдати тримали затриманих чеченців у ямах у Ханкалі, головній базі окупаційних військ на східній околиці Грозного.
    Того місяця військовий прокурор російських військ на Північному Кавказі Соловйов відповів депутатові російського парламенту Юлію Рибакову, що неофіційних фільтраційних таборів не знайшов.
    До 5 серпня окупанти відпустили затриманих(Citation: 27).

    Командувач Тихомиров записав у бійці мирних чеченців, яких російські льотчики вбили в місті Шалі у квітні 1996 року(Citation: 27).
    Штаб окупаційних військ приписав армії Ічкерії обстріли міста Урус-Мартан у травні 1996 року, під час яких екіпажі російських гелікоптерів убивали городян(Citation: 27)(Citation: 988).
    Російські військові не раз заявляли, що армія Ічкерії обороняється в мечетях і пам'ятках культури.
    Директор Національного музею Чеченської Республіки Іса Адаєв у травні 1996 року сказав громадському трибуналу фонду «Гласність» у Празі, що це неправда(Citation: 988).
    Генерал Шаманов, який командував штурмом села Махкети, записав у бійці армії Ічкерії мирних чеченців, яких російські війська вбили там у липні 1996 року(Citation: 27)(Citation: 1127).

    У серпні 1996 року, коли Збройні сили Ічкерії оточили окупантів у Грозному, командування окупаційних військ і міністр оборони Росії Родіонов оголошували, що контролюють центр міста(Citation: 27)(Citation: 1366).

    Правозахисники «Меморіалу» пишуть, що багато повідомлень російських газет, радіо й телебачення про жорстокості армії Ічкерії з посиланням на офіційні російські джерела при перевірці виявилися брехнею(Citation: 27).

    21 листопада 1997 року, майже через рік після того, як останні російські війська пішли з Ічкерії, заступник головного військового прокурора Росії Смирнов написав «Меморіалу», що Рошні-Чу бомбили вісім штурмовиків, чию належність прокуратура не встановила.
    Прокурор заперечував, що в серпні 1996 року солдати 101-ї бригади внутрішніх військ МВС брали в заручники чеченських чоловіків біля «15-го городка», своєї бази в Грозному.
    Бригада відпускала чоловіків, коли рідні виконували її вимоги (докладніше: «Захоплення заручників»)(Citation: 27).
