description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты обстреливали и бомбили целые сёла и города Ичкерии за отказ подчиниться.

    Как правило, командование оккупационными войсками требовало от чеченцев в сёлах сдать оружие, не стрелять по российским солдатам или добиться, чтобы Вооружённые силы Ичкерии ушли из села(Citation: 27).
    В других сёлах российские командиры требовали выдать пленных российских военных или пропустить через село свою технику(Citation: 988)(Citation: 1427).
    Командиры оккупационных войск, ссылаясь на данные своей разведки, требовали от чеченцев в селе выдать произвольное число автоматов в обмен на безопасность(Citation: 655).

    Если село не выполняло требований, российские войска окружали его.
    Оккупанты не выпускали чеченцев из села и не пропускали к ним еду и лекарства (подробнее: «Медицинская и гуманитарная блокада»).
    Российская артиллерия обстреливала окружённое село, а авиация бомбила его (подробнее: «Неизбирательные нападения»).
    Российские военные открывали огонь раньше срока, который назначали сами, или после того, как село сдало оружие(Citation: 27)(Citation: 655).

    После того как 8 января 1995 года бойцы армии Ичкерии захватили в плен российских спецназовцев, российские лётчики с вертолётов пригрозили бомбить Комсомольское, Алхазурово и Рошни-Чу, сёла к юго-западу от Грозного, а потом ударили по окраине Рошни-Чу, хотя спецназовцев в селе не было(Citation: 27)(Citation: 988).
    В январе экипажи российских вертолётов разбрасывали над Бамутом, селом к юго-западу от Грозного, листовки командования оккупационными войсками с угрозой ответить «мощными ракетно-бомбовыми ударами», если из села откроют огонь по российским войскам(Citation: 27).
    В январе оккупанты разбрасывали над Шали, городом к юго-востоку от Грозного, листовки с угрозой открыть «ответный огонь» «по всей деревне» за «один выстрел [в сторону оккупантов] из Шали»(Citation: 27)(Citation: 662).

    С 26 февраля по 3 марта 1995 года российские военные на посту у Самашек, села на западе Ичкерии, грозили старейшинам ударом по селу, если те не уговорят односельчан «решить дело мирно»(Citation: 662). 8 марта старейшины обязались вывести из села армию Ичкерии и сдать тяжёлое оружие, а российский генерал Косолапов подписал с ними договор, по которому российские войска не входят в Самашки и не применяют силу к мирным чеченцам (подробнее: «Ложные гарантии безопасности»).
    Старейшины выполнили обязательство, но с 13 марта российские военные на постах 25 дней никого не выпускали из Самашек и не пропускали туда еду и лекарства (подробнее: «Транспортная блокада»)(Citation: 662). 6 апреля заместитель командующего оккупационными войсками Романов потребовал к семи утра 7 апреля сдать 264 автомата, два пулемёта и одну боевую машину пехоты и впустить в село внутренние войска МВД России (предшественников современной Росгвардии), но старейшины ответили, что столько оружия в селе нет(Citation: 27)(Citation: 662). 7 апреля российский генерал, который отказался назвать себя, дал старейшинам срок до 16 часов, но оккупанты начали обстреливать село из миномётов раньше.
    Юзбек Шовхалов, старейшина Самашек, который участвовал в переговорах с командованием оккупационных войск, 9 апреля 1995 года рассказал наблюдателю «Мемориала», что было, когда российские войска штурмовали село: «„Дай боевиков [так россияне называли Вооружённые силы Ичкерии]“.
    Я говорю: „Боевиков нет здесь“…
    Бронетранспортеры...
    Стреляют из крупнокалиберных пулеметов.
    Прямо в селе.
    В тот дом, где живут...
    Или дом сжигают, или дом погибает, все что угодно...»(Citation: 662). 7 и 8 апреля российские военные убили в Самашках 103 мирных чеченца, которых правозащитники переписали по именам (подробнее: «Массовые убийства гражданских»)(Citation: 662)(Citation: 27).

    3 марта 1995 года командование оккупационными войсками потребовало от чеченцев в Аргуне, Гудермесе и Шали, городах к востоку и юго-востоку от Грозного, уговорить Вооружённые силы Ичкерии уйти, чтобы сберечь жизни людей(Citation: 27)(Citation: 662). 23 марта оккупанты захватили Аргун, а 30-31 марта, когда защитники были вынуждены уйти, - Гудермес и Шали (подробнее: «Военная интервенция»)(Citation: 27). 8 апреля командующий оккупационными войсками на юге Ичкерии Лабунец письменно пригрозил обстрелять из артиллерии Закан-Юрт, село к востоку от Самашек, если чеченцы в селе не сдадут оружие и не выдадут бойцов армии Ичкерии, а 11 апреля солдаты МВД России обыскали каждый двор и оружия не нашли(Citation: 1136)(Citation: 662).
    В апреле 1995 года чеченцы в Бачи-Юрте, Кошкельды и Аллерое, сёлах на востоке Ичкерии, под угрозой бомбёжки купили и сдали оккупантам автоматы, но российские военные всё равно обстреляли эти сёла (подробнее: «Тотальное уничтожение инфраструктуры»)(Citation: 655)(Citation: 27).
    Внутренние войска МВД России и российская милиция больше пяти месяцев, с 30 сентября 1995 года до штурма в марте 1996 года, держали в кольце Серноводск, село на западе Ичкерии, где жили больше 10 000 человек и больше 3000 беженцев(Citation: 1427)(Citation: 27).
    Командующий оккупационными войсками на юго-западе Ичкерии Артемов письменно пригрозил селу ударами артиллерии и авиации, если село не разоружит около ста бойцов армии Ичкерии и не пропустит через Серноводск российскую технику(Citation: 1427).

    11 февраля 1996 года командование оккупационными войсками потребовало от чеченцев в Новогрозненском, посёлке на востоке Ичкерии, сдать оружие и выгнать защитников, а когда защитники не ушли, оккупанты обстрелами и штурмом убили в посёлке не меньше 50 мирных чеченцев (подробнее: «Неизбирательные нападения»)(Citation: 27).
    В марте 1996 года российские военные потребовали от Катыр-Юрта, села к юго-западу от Грозного, сдать автоматы и десять пленных российских солдат, которых в селе не было, а 28 марта российский лётчик сбросил на село бомбы и убил девять человек из семьи Хажгириевых (подробнее: «Неизбирательные нападения»)(Citation: 988)(Citation: 27).

    Весной 1996 года командование оккупационными войсками и марионеточное правительство в Грозном заставляли сёла подписывать «Протокол о мире и согласии».
    По этому документу село обязывалось выдать защитников, сдать оружие и впустить российских военных, а за одного найденного в селе бойца армии Ичкерии оккупанты грозили расстреливать чеченцев и уничтожить село(Citation: 988). 31 марта 1996 года президент России Ельцин указом № 435 сделал подписание таких протоколов частью своей программы для Ичкерии(Citation: 1326), а российская авиация бомбила сёла, которые отказывались подписать протокол(Citation: 27).

    17 апреля 1996 года чеченцы в Чири-Юрте, селе к югу от Грозного, по ультиматуму генерала Шаманова отпустили пленных российских военных, но когда техника оккупантов уходила от села, российские танкисты одним выстрелом разрушили до основания дом семьи Абдуллы Дахаева, представителя власти Ичкерии в Чири-Юрте(Citation: 27). 19 апреля оккупанты окружили Шали, а 25 апреля потребовали от города выдать защитников, сдать оружие и освободить пленных российских солдат.
    В тот же день российские лётчики бомбили город (подробнее: «Неизбирательные нападения»)(Citation: 1359)(Citation: 27).
    В конце апреля старейшины Комсомольского подписали с оккупантами соглашение о мире, но с 30 апреля по 1 мая российские лётчики бомбили село и ранили четырёх мирных чеченцев(Citation: 1360). 6 мая российские войска без боя захватили Шали, где защитников и пленных не оказалось(Citation: 27).
    В этот день оккупанты окружили Комсомольское и пригрозили уничтожить его, если бойцы армии Ичкерии до ночи не сдадут оружие, но около трёх часов дня, до срока, российская артиллерия открыла огонь и убила несколько мирных чеченцев(Citation: 988).

    8 июля 1996 года командующий оккупационными войсками Тихомиров на пресс-конференции в Ханкале, главной базе оккупационных войск на восточной окраине Грозного, пригрозил Ичкерии ответными мерами, если Зелимхан Яндарбиев, исполнявший обязанности президента Ичкерии, 9 июля не вернёт всех российских пленных(Citation: 1307).
    С 9 по 15 июля российские войска окружили и обстреляли Гехи, село к юго-западу от Грозного, где стояло подразделение армии Ичкерии, и Махкеты, горное село на юго-востоке республики.
    В Гехи оккупанты убили 19 мирных чеченцев, в Махкетах - 25 (подробнее: «Неизбирательные нападения»)(Citation: 1364)(Citation: 1127)(Citation: 1309).
    С 10 июля оккупационное командование ввело в Ичкерии комендантский час и запретило въезжать в Грозный и выезжать из города на машинах(Citation: 27)(Citation: 1127).

    Российские военные разрушали дома родных руководителей Ичкерии и командиров её армии(Citation: 27)(Citation: 1127). 15 июля 1996 года экипажи семи российских вертолётов ударили ракетами по Старым Атагам, селу к югу от Грозного, и разрушили дом матери Зелимхана Яндарбиева, исполнявшего обязанности президента Ичкерии, но мать и соседи выжили(Citation: 1127)(Citation: 1364).
    Летом 1996 года российские военные взорвали в горном селе Ведено дом отца Шамиля Басаева, одного из командиров армии Ичкерии(Citation: 27).

    19 августа 1996 года исполнявший обязанности командующего оккупационными войсками Пуликовский потребовал, чтобы армия Ичкерии ушла из Грозного, и дал гражданам Ичкерии 48 часов на выход из города, где оставались, по одним данным, не меньше 50-70 тысяч человек, по другим - 300 тысяч(Citation: 27)(Citation: 1127)(Citation: 1253).
    Генерал пригрозил после этого срока ударить по городу авиацией, артиллерией и реактивными системами залпового огня, которые не могут бить прицельно, а в ночь на 20 августа, не дождавшись конца срока, оккупанты возобновили обстрел и бомбёжку Грозного(Citation: 1127).

    Правозащитники «Мемориала» пишут, что командование оккупационными войсками предъявляло требования всему селу целиком и при отказе грозило расправой всем, кто в нём жил(Citation: 27).
    В докладе Human Rights Watch от мая 1995 года сказано, что требования сдать оружие иногда служат российским военным предлогом для нападения на село или для задержания чеченцев(Citation: 655).
    Неизвестно, сколько таких преступлений совершили оккупационные войска с декабря 1994 года по август 1996 года.

    21 августа 1996 года секретарь Совета безопасности России генерал Лебедь отменил угрозу генерала Пуликовского ударить по Грозному и назвал её журналистам неудачной шуткой(Citation: 1127)(Citation: 1313).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers shelled and bombed entire villages and towns of Ichkeria for refusing to submit.

    As a rule, the command of the occupation troops demanded that the Chechens in the villages hand over their weapons, not fire at Russian soldiers, or make the Armed Forces of Ichkeria leave the village(Citation: 27).
    In other villages Russian commanders demanded the handover of captured Russian servicemen or passage for their vehicles through the village(Citation: 988)(Citation: 1427).
    Commanders of the occupation troops, citing their intelligence data, demanded that the Chechens in a village hand over an arbitrary number of assault rifles in exchange for safety(Citation: 655).

    If a village did not meet the demands, Russian troops surrounded it.
    The occupiers did not let Chechens out of the village and did not let food and medicine through to them (see: "Medical and Humanitarian Blockade").
    Russian artillery shelled the surrounded village, and aircraft bombed it (see: "Indiscriminate Attacks").
    The Russian military opened fire before the deadline they themselves had set, or after the village had handed over its weapons(Citation: 27)(Citation: 655).

    After fighters of the army of Ichkeria took Russian special forces soldiers prisoner on 8 January 1995, Russian pilots in helicopters threatened to bomb Komsomolskoye, Alkhazurovo and Roshni-Chu, villages to the southwest of Grozny, and then struck the outskirts of Roshni-Chu, although the special forces soldiers were not in the village(Citation: 27)(Citation: 988).
    In January the crews of Russian helicopters scattered over Bamut, a village to the southwest of Grozny, leaflets of the command of the occupation troops threatening to respond with "powerful missile and bomb strikes" if fire was opened from the village at Russian troops(Citation: 27).
    In January the occupiers scattered over Shali, a town to the southeast of Grozny, leaflets threatening to open "return fire" "on the whole village" for "a single shot [toward the occupiers] from Shali"(Citation: 27)(Citation: 662).

    From 26 February to 3 March 1995 the Russian military at the post near Samashki, a village in the west of Ichkeria, threatened the elders with a strike on the village if they did not persuade their fellow villagers to "settle the matter peacefully"(Citation: 662).
    On 8 March the elders undertook to get the army of Ichkeria out of the village and hand over heavy weapons, and the Russian general Kosolapov signed an agreement with them under which Russian troops would not enter Samashki and would not use force against Chechen civilians (see: "False Guarantees of Safety").
    The elders fulfilled their obligation, but from 13 March the Russian military at the posts let no one out of Samashki for 25 days and did not let food and medicine through (see: "Transport Blockade")(Citation: 662).
    On 6 April Romanov, the deputy commander of the occupation troops, demanded that by seven in the morning of 7 April the village hand over 264 assault rifles, two machine guns and one infantry fighting vehicle and let the Internal Troops of the Russian MVD (predecessors of today's Rosgvardia) into the village, but the elders replied that there were not that many weapons in the village(Citation: 27)(Citation: 662).
    On 7 April a Russian general who refused to give his name gave the elders until 4 p.m., but the occupiers began shelling the village with mortars earlier.
    Yuzbek Shovkhalov, an elder of Samashki who took part in the talks with the command of the occupation troops, told a Memorial observer on 9 April 1995 what happened when Russian troops stormed the village: "'Give us the militants [this is what the Russians called the Armed Forces of Ichkeria].' I say: 'There are no militants here'…
    Armored personnel carriers...
    They fire from heavy machine guns.
    Right in the village.
    At the house where people live...
    Either they burn the house down, or the house perishes, anything at all..."(Citation: 662).
    On 7 and 8 April the Russian military killed 103 Chechen civilians in Samashki, whom human rights defenders recorded by name (see: "Mass Killings of Civilians")(Citation: 662)(Citation: 27).

    On 3 March 1995 the command of the occupation troops demanded that the Chechens in Argun, Gudermes and Shali, towns to the east and southeast of Grozny, persuade the Armed Forces of Ichkeria to leave in order to save people's lives(Citation: 27)(Citation: 662).
    On 23 March the occupiers captured Argun, and on 30-31 March, when the defenders were forced to leave, Gudermes and Shali (see: "Military Intervention")(Citation: 27).
    On 8 April Labunets, the commander of the occupation troops in the south of Ichkeria, threatened in writing to shell Zakan-Yurt, a village to the east of Samashki, with artillery if the Chechens in the village did not hand over their weapons and surrender the fighters of the army of Ichkeria, and on 11 April soldiers of the Russian MVD searched every yard and found no weapons(Citation: 1136)(Citation: 662).
    In April 1995 the Chechens in Bachi-Yurt, Koshkeldy and Alleroy, villages in the east of Ichkeria, under threat of bombing bought assault rifles and handed them over to the occupiers, but the Russian military shelled these villages anyway (see: "Total Destruction of Infrastructure")(Citation: 655)(Citation: 27).
    The Internal Troops of the Russian MVD and the Russian police kept Sernovodsk, a village in the west of Ichkeria where more than 10,000 people and more than 3,000 refugees lived, encircled for more than five months, from 30 September 1995 until the storming in March 1996(Citation: 1427)(Citation: 27).
    Artemov, the commander of the occupation troops in the southwest of Ichkeria, threatened the village in writing with artillery and air strikes if the village did not disarm about a hundred fighters of the army of Ichkeria and let Russian vehicles through Sernovodsk(Citation: 1427).

    On 11 February 1996 the command of the occupation troops demanded that the Chechens in Novogroznensky, a settlement in the east of Ichkeria, hand over their weapons and expel the defenders, and when the defenders did not leave, the occupiers killed at least 50 Chechen civilians in the settlement by shelling and storming (see: "Indiscriminate Attacks")(Citation: 27).
    In March 1996 the Russian military demanded that Katyr-Yurt, a village to the southwest of Grozny, hand over assault rifles and ten captured Russian soldiers who were not in the village, and on 28 March a Russian pilot dropped bombs on the village and killed nine people from the Khazhgiriyev family (see: "Indiscriminate Attacks")(Citation: 988)(Citation: 27).

    In the spring of 1996 the command of the occupation troops and the puppet government in Grozny forced villages to sign a "Protocol on Peace and Accord".
    Under this document a village undertook to surrender the defenders, hand over weapons and let the Russian military in, and for a single fighter of the army of Ichkeria found in the village the occupiers threatened to shoot Chechens and destroy the village(Citation: 988).
    On 31 March 1996 Russian President Yeltsin, by Decree No. 435, made the signing of such protocols part of his program for Ichkeria(Citation: 1326), and Russian aircraft bombed villages that refused to sign the protocol(Citation: 27).

    On 17 April 1996 the Chechens in Chiri-Yurt, a village to the south of Grozny, released captured Russian servicemen under an ultimatum from General Shamanov, but as the occupiers' vehicles were leaving the village, Russian tank crews with a single shot razed to the ground the house of the family of Abdulla Dakhayev, the representative of the authorities of Ichkeria in Chiri-Yurt(Citation: 27).
    On 19 April the occupiers surrounded Shali, and on 25 April demanded that the town surrender the defenders, hand over weapons and release captured Russian soldiers.
    On the same day Russian pilots bombed the town (see: "Indiscriminate Attacks")(Citation: 1359)(Citation: 27).
    At the end of April the elders of Komsomolskoye signed a peace agreement with the occupiers, but from 30 April to 1 May Russian pilots bombed the village and wounded four Chechen civilians(Citation: 1360).
    On 6 May Russian troops captured Shali without a fight; there turned out to be no defenders or prisoners there(Citation: 27).
    On that day the occupiers surrounded Komsomolskoye and threatened to destroy it if the fighters of the army of Ichkeria did not hand over their weapons by nightfall, but at about three in the afternoon, before the deadline, Russian artillery opened fire and killed several Chechen civilians(Citation: 988).

    On 8 July 1996 Tikhomirov, the commander of the occupation troops, at a press conference in Khankala, the main base of the occupation troops on the eastern outskirts of Grozny, threatened Ichkeria with retaliatory measures if Zelimkhan Yandarbiyev, the acting president of Ichkeria, did not return all Russian prisoners on 9 July(Citation: 1307).
    From 9 to 15 July Russian troops surrounded and shelled Gekhi, a village to the southwest of Grozny where a unit of the army of Ichkeria was stationed, and Makhkety, a mountain village in the southeast of the republic.
    In Gekhi the occupiers killed 19 Chechen civilians, in Makhkety 25 (see: "Indiscriminate Attacks")(Citation: 1364)(Citation: 1127)(Citation: 1309).
    From 10 July the occupation command introduced a curfew in Ichkeria and banned driving into and out of Grozny by car(Citation: 27)(Citation: 1127).

    The Russian military destroyed the houses of relatives of the leaders of Ichkeria and the commanders of its army(Citation: 27)(Citation: 1127).
    On 15 July 1996 the crews of seven Russian helicopters struck Starye Atagi, a village to the south of Grozny, with missiles and destroyed the house of the mother of Zelimkhan Yandarbiyev, the acting president of Ichkeria, but the mother and the neighbors survived(Citation: 1127)(Citation: 1364).
    In the summer of 1996 the Russian military blew up the house of the father of Shamil Basayev, one of the commanders of the army of Ichkeria, in the mountain village of Vedeno(Citation: 27).

    On 19 August 1996 Pulikovsky, the acting commander of the occupation troops, demanded that the army of Ichkeria leave Grozny and gave the citizens of Ichkeria 48 hours to leave the city, where, according to some data, at least 50-70 thousand people remained, and according to others, 300 thousand(Citation: 27)(Citation: 1127)(Citation: 1253).
    The general threatened after that deadline to strike the city with aircraft, artillery and multiple rocket launchers, which cannot fire with precision, and on the night of 20 August, without waiting for the deadline to expire, the occupiers resumed the shelling and bombing of Grozny(Citation: 1127).

    The human rights defenders of Memorial write that the command of the occupation troops made its demands of a whole village and, in case of refusal, threatened reprisals against everyone who lived in it(Citation: 27).
    A Human Rights Watch report of May 1995 says that demands to hand over weapons sometimes serve the Russian military as a pretext for attacking a village or for detaining Chechens(Citation: 655).
    It is unknown how many such crimes the occupation troops committed from December 1994 to August 1996.

    On 21 August 1996 General Lebed, the secretary of the Russian Security Council, canceled General Pulikovsky's threat to strike Grozny and called it a bad joke to journalists(Citation: 1127)(Citation: 1313).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти обстрілювали й бомбили цілі села й міста Ічкерії за відмову підкоритися.

    Як правило, командування окупаційних військ вимагало від чеченців у селах здати зброю, не стріляти по російських солдатах або домогтися, щоб Збройні сили Ічкерії пішли із села(Citation: 27).
    В інших селах російські командири вимагали видати полонених російських військових або пропустити через село свою техніку(Citation: 988)(Citation: 1427).
    Командири окупаційних військ, посилаючись на дані своєї розвідки, вимагали від чеченців у селі видати довільне число автоматів в обмін на безпеку(Citation: 655).

    Якщо село не виконувало вимог, російські війська оточували його.
    Окупанти не випускали чеченців із села й не пропускали до них їжу та ліки (докладніше: «Медична та гуманітарна блокада»).
    Російська артилерія обстрілювала оточене село, а авіація бомбила його (докладніше: «Невибіркові напади»).
    Російські військові відкривали вогонь раніше від строку, який призначали самі, або після того, як село здало зброю(Citation: 27)(Citation: 655).

    Після того як 8 січня 1995 року бійці армії Ічкерії захопили в полон російських спецназівців, російські льотчики з гелікоптерів пригрозили бомбити Комсомольське, Алхазурове і Рошні-Чу, села на південний захід від Грозного, а потім ударили по околиці Рошні-Чу, хоча спецназівців у селі не було(Citation: 27)(Citation: 988).
    У січні екіпажі російських гелікоптерів розкидали над Бамутом, селом на південний захід від Грозного, листівки командування окупаційних військ із погрозою відповісти «потужними ракетно-бомбовими ударами», якщо із села відкриють вогонь по російських військах(Citation: 27).
    У січні окупанти розкидали над Шалі, містом на південний схід від Грозного, листівки з погрозою відкрити «вогонь у відповідь» «по всьому селу» за «один постріл [у бік окупантів] із Шалі»(Citation: 27)(Citation: 662).

    З 26 лютого по 3 березня 1995 року російські військові на посту біля Самашок, села на заході Ічкерії, погрожували старійшинам ударом по селу, якщо ті не вмовлять односельців «вирішити справу мирно»(Citation: 662). 8 березня старійшини зобов'язалися вивести із села армію Ічкерії та здати важку зброю, а російський генерал Косолапов підписав із ними договір, за яким російські війська не входять у Самашки й не застосовують силу до мирних чеченців (докладніше: «Фальшиві гарантії безпеки»).
    Старійшини виконали зобов'язання, але з 13 березня російські військові на постах 25 днів нікого не випускали із Самашок і не пропускали туди їжу та ліки (докладніше: «Транспортна блокада»)(Citation: 662). 6 квітня заступник командувача окупаційних військ Романов вимагав до сьомої ранку 7 квітня здати 264 автомати, два кулемети й одну бойову машину піхоти і впустити в село внутрішні війська МВС Росії (попередників сучасної Росгвардії), але старійшини відповіли, що стільки зброї в селі немає(Citation: 27)(Citation: 662). 7 квітня російський генерал, який відмовився назвати себе, дав старійшинам строк до 16 години, але окупанти почали обстрілювати село з мінометів раніше.
    Юзбек Шовхалов, старійшина Самашок, який брав участь у переговорах із командуванням окупаційних військ, 9 квітня 1995 року розповів спостерігачеві «Меморіалу», що було, коли російські війська штурмували село: «„Дай бойовиків [так росіяни називали Збройні сили Ічкерії]“.
    Я кажу: „Бойовиків тут немає“…
    Бронетранспортери...
    Стріляють із великокаліберних кулеметів.
    Прямо в селі.
    У той будинок, де живуть...
    Або будинок спалюють, або будинок гине, що завгодно...»(Citation: 662). 7 і 8 квітня російські військові вбили в Самашках 103 мирних чеченців, яких правозахисники переписали поіменно (докладніше: «Масові вбивства цивільних»)(Citation: 662)(Citation: 27).

    3 березня 1995 року командування окупаційних військ вимагало від чеченців в Аргуні, Гудермесі та Шалі, містах на схід і південний схід від Грозного, умовити Збройні сили Ічкерії піти, щоб зберегти життя людей(Citation: 27)(Citation: 662). 23 березня окупанти захопили Аргун, а 30-31 березня, коли захисники були змушені піти, - Гудермес і Шалі (докладніше: «Воєнна інтервенція»)(Citation: 27). 8 квітня командувач окупаційних військ на півдні Ічкерії Лабунець письмово пригрозив обстріляти з артилерії Закан-Юрт, село на схід від Самашок, якщо чеченці в селі не здадуть зброю і не видадуть бійців армії Ічкерії, а 11 квітня солдати МВС Росії обшукали кожне подвір'я і зброї не знайшли(Citation: 1136)(Citation: 662).
    У квітні 1995 року чеченці в Бачі-Юрті, Кошкельди та Аллерої, селах на сході Ічкерії, під загрозою бомбардування купили й здали окупантам автомати, але російські військові все одно обстріляли ці села (докладніше: «Тотальне знищення інфраструктури»)(Citation: 655)(Citation: 27).
    Внутрішні війська МВС Росії та російська міліція понад п'ять місяців, з 30 вересня 1995 року до штурму в березні 1996 року, тримали в кільці Серноводськ, село на заході Ічкерії, де жили понад 10 000 людей і понад 3000 біженців(Citation: 1427)(Citation: 27).
    Командувач окупаційних військ на південному заході Ічкерії Артемов письмово пригрозив селу ударами артилерії та авіації, якщо село не роззброїть близько ста бійців армії Ічкерії і не пропустить через Серноводськ російську техніку(Citation: 1427).

    11 лютого 1996 року командування окупаційних військ вимагало від чеченців у Новогрозненському, селищі на сході Ічкерії, здати зброю і вигнати захисників, а коли захисники не пішли, окупанти обстрілами і штурмом убили в селищі не менше ніж 50 мирних чеченців (докладніше: «Невибіркові напади»)(Citation: 27).
    У березні 1996 року російські військові вимагали від Катир-Юрта, села на південний захід від Грозного, здати автомати і десятьох полонених російських солдатів, яких у селі не було, а 28 березня російський льотчик скинув на село бомби й убив дев'ятьох людей із сім'ї Хажгірієвих (докладніше: «Невибіркові напади»)(Citation: 988)(Citation: 27).

    Навесні 1996 року командування окупаційних військ і маріонетковий уряд у Грозному змушували села підписувати «Протокол про мир і злагоду».
    За цим документом село зобов'язувалося видати захисників, здати зброю і впустити російських військових, а за одного знайденого в селі бійця армії Ічкерії окупанти погрожували розстрілювати чеченців і знищити село(Citation: 988). 31 березня 1996 року президент Росії Єльцин указом № 435 зробив підписання таких протоколів частиною своєї програми для Ічкерії(Citation: 1326), а російська авіація бомбила села, які відмовлялися підписати протокол(Citation: 27).

    17 квітня 1996 року чеченці в Чірі-Юрті, селі на південь від Грозного, за ультиматумом генерала Шаманова відпустили полонених російських військових, але коли техніка окупантів відходила від села, російські танкісти одним пострілом зруйнували вщент будинок сім'ї Абдулли Дахаєва, представника влади Ічкерії в Чірі-Юрті(Citation: 27). 19 квітня окупанти оточили Шалі, а 25 квітня вимагали від міста видати захисників, здати зброю і звільнити полонених російських солдатів.
    Того ж дня російські льотчики бомбили місто (докладніше: «Невибіркові напади»)(Citation: 1359)(Citation: 27).
    Наприкінці квітня старійшини Комсомольського підписали з окупантами угоду про мир, але з 30 квітня по 1 травня російські льотчики бомбили село й поранили чотирьох мирних чеченців(Citation: 1360). 6 травня російські війська без бою захопили Шалі, де захисників і полонених не виявилося(Citation: 27).
    Того дня окупанти оточили Комсомольське і пригрозили знищити його, якщо бійці армії Ічкерії до ночі не здадуть зброю, але близько третьої години дня, до строку, російська артилерія відкрила вогонь і вбила кількох мирних чеченців(Citation: 988).

    8 липня 1996 року командувач окупаційних військ Тихомиров на пресконференції в Ханкалі, головній базі окупаційних військ на східній околиці Грозного, пригрозив Ічкерії заходами у відповідь, якщо Зелімхан Яндарбієв, який виконував обов'язки президента Ічкерії, 9 липня не поверне всіх російських полонених(Citation: 1307).
    З 9 по 15 липня російські війська оточили й обстріляли Гехі, село на південний захід від Грозного, де стояв підрозділ армії Ічкерії, і Махкети, гірське село на південному сході республіки.
    У Гехі окупанти вбили 19 мирних чеченців, у Махкетах - 25 (докладніше: «Невибіркові напади»)(Citation: 1364)(Citation: 1127)(Citation: 1309).
    З 10 липня окупаційне командування запровадило в Ічкерії комендантську годину і заборонило в'їжджати в Грозний і виїжджати з міста на машинах(Citation: 27)(Citation: 1127).

    Російські військові руйнували будинки рідних керівників Ічкерії та командирів її армії(Citation: 27)(Citation: 1127). 15 липня 1996 року екіпажі семи російських гелікоптерів ударили ракетами по Старих Атагах, селу на південь від Грозного, і зруйнували будинок матері Зелімхана Яндарбієва, який виконував обов'язки президента Ічкерії, але мати й сусіди вижили(Citation: 1127)(Citation: 1364).
    Улітку 1996 року російські військові підірвали в гірському селі Ведено будинок батька Шаміля Басаєва, одного з командирів армії Ічкерії(Citation: 27).

    19 серпня 1996 року Пуликовський, який виконував обов'язки командувача окупаційних військ, вимагав, щоб армія Ічкерії пішла з Грозного, і дав громадянам Ічкерії 48 годин на вихід із міста, де залишалися, за одними даними, не менше ніж 50-70 тисяч людей, за іншими - 300 тисяч(Citation: 27)(Citation: 1127)(Citation: 1253).
    Генерал пригрозив після цього строку вдарити по місту авіацією, артилерією та реактивними системами залпового вогню, які не можуть бити прицільно, а в ніч на 20 серпня, не дочекавшись кінця строку, окупанти відновили обстріл і бомбардування Грозного(Citation: 1127).

    Правозахисники «Меморіалу» пишуть, що командування окупаційних військ висувало вимоги всьому селу загалом і в разі відмови погрожувало розправою всім, хто в ньому жив(Citation: 27).
    У доповіді Human Rights Watch від травня 1995 року сказано, що вимоги здати зброю іноді слугують російським військовим приводом для нападу на село або для затримання чеченців(Citation: 655).
    Невідомо, скільки таких злочинів скоїли окупаційні війська з грудня 1994 року по серпень 1996 року.

    21 серпня 1996 року секретар Ради безпеки Росії генерал Лебедь скасував погрозу генерала Пуликовського вдарити по Грозному і назвав її журналістам невдалим жартом(Citation: 1127)(Citation: 1313).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
