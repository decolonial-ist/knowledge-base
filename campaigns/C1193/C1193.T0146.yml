description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Российские военные и милиционеры вымогали у чеченцев деньги, золото, автомобили и другие ценности.

    На блокпостах российские милиционеры и солдаты брали с водителей деньги за проезд и отбирали у чеченцев машины.
    Такие посты стояли в Грозном на каждой остановке и на дороге из Гудермеса в Аргун, города к востоку от Грозного(Citation: 988).

    Российская охрана фильтрационных лагерей и ям при воинских частях требовала с задержанных чеченцев деньги за освобождение (подробнее: «Захват заложников»)(Citation: 986)(Citation: 922).

    Российские войска окружали сёла и брали деньги с чеченцев, чтобы не бомбить их и дать чеченцам выехать(Citation: 988)(Citation: 1359).
    Российские военные требовали оружие, которого у чеченцев не было, и брали вместо него деньги.
    Часто через месяц после выплаты новая российская часть окружала село и снова требовала денег(Citation: 988).

    7-8 апреля 1995 года российские солдаты, которые штурмовали Самашки, село на западе Ичкерии, вывели мужчин с Выгонной улицы из подвала и потребовали у женщин золото и деньги за то, чтобы не забирать мужчин.
    Оккупанты увезли мужчин раздетыми и связанными проволокой в ямы у Ассиновской, станицы по соседству, и в фильтрационный лагерь в Моздоке, городе в подконтрольной России Северной Осетии (подробнее: «Система фильтрационных лагерей»)(Citation: 1136).
    В мае штаб объединённой группировки внутренних войск МВД России в Ичкерии запретил «Памяткой» солдатам на постах брать у проезжающих чеченцев вещи и продукты питания(Citation: 27).

    Летом 1995 года марионеточное правительство в Грозном начало платить из российского бюджета компенсации чеченцам, чьи дома разрушили оккупанты(Citation: 1166)(Citation: 27).
    Чиновники марионеточного правительства, которые распределяли выплаты, обычно забирали себе от 15 до 50% денег каждой семьи.
    По подсчёту чеченского журналиста Мусы Мурадова, из 60 тысяч семей Грозного, потерявших жильё, деньги получили не больше полутора тысяч(Citation: 1166).
    Осенью 1995 года российские солдаты на блокпостах у Ачхой-Мартана и Серноводска, сёл на западе Ичкерии, брали с каждого, кто входил в село или выходил из него, 100 000 рублей (23 доллара) у Ачхой-Мартана и 50 000 рублей у Серноводска(Citation: 658).

    До штурма в марте 1996 года чеченцы в Самашках продавали коров, чтобы купить оружие, сдать его российским военным и спасти свои дома.
    Зинаида Байсаева, которая жила в селе, 22 апреля 1996 года рассказала в Москве общественному трибуналу российского фонда «Гласность»: «Приблизительно 9-10 раз мы давали деньги, чтобы нас не бомбили.
    Но нас все равно обстреливали каждую ночь».
    В ночь на 14 марта 1996 года оккупанты окружили Самашки.
    Российские военные сказали главе села и старейшинам, что дадут «коридор», чтобы ночью из села вышли бойцы Вооружённых сил Ичкерии, а потом проверят паспорта и уйдут.
    Зайнап Байсаева из этого села рассказала трибуналу «Гласности»: «За этот коридор на час они запросили, как мне говорили, 58 миллионов рублей.
    Эти деньги собрали с жителей села.
    Мой брат отдал миллион [рублей] — последнее, что он заработал…
    Все деньги передавались на блокпост, тому, кто там командовал».
    За второй «коридор», для выхода из села мирных чеченцев, российские военные потребовали 10 тысяч долларов.
    Чеченцы из Самашек рассказали правозащитникам «Мемориала», что 14 марта глава села отвёз на 13-й российский блокпост оружие и 50 миллионов рублей (10 тысяч долларов).
    Утром 15 марта оккупанты дали чеченцам два часа на выход из села (подробнее: «Ложный коридор») и начали штурм(Citation: 988).

    Весной 1996 года оккупанты и марионеточное правительство в Грозном заставляли сёла подписывать «Протоколы о мире и согласии» и сдавать оружие (подробнее: «Коллективные наказания»)(Citation: 27).
    Чеченцы в Гехи, селе к юго-западу от Грозного, при подписании «Протокола о мире и согласии» заплатили российским военным около ста миллионов рублей.
    В Мескер-Юрте, селе к юго-востоку от Грозного, оккупанты получили по сто тысяч рублей с каждого дома(Citation: 988). 7 апреля 1996 года российские военные велели Саидашу Шамахурову из Гикалово, села к югу от Грозного, ехать на своей машине в Ханкалу, главную базу оккупационных войск на восточной окраине Грозного. 27 апреля оккупанты обменяли его на пленного российского солдата (подробнее: «Захват заложников»), а через три дня вернули ему машину, взяв за неё 2000 долларов и ещё одного пленного(Citation: 657).
    В апреле 1996 года оккупанты окружили Шали, город к юго-востоку от Грозного, и российские солдаты на посту не выпускали чеченцев из города, требовали с них денег и стреляли перед ними в землю. 26 апреля больше тысячи чеченских женщин и детей ушли из Шали пешком(Citation: 27)(Citation: 1359).

    В докладе наблюдательной миссии российских правозащитных организаций 1995 года сказано, что российская охрана вымогала деньги там, где держала задержанных чеченцев до отправки в фильтрационные лагеря, потому что эти места никто не контролировал и у них не было официального статуса(Citation: 922).

    Вопреки «Памятке» российские военные и милиционеры брали поборы на блокпостах до конца войны в 1996 году, и чеченцы жаловались на них правозащитникам(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Russian servicemen and police officers extorted money, gold, cars and other valuables from Chechens.

    At checkpoints, Russian police officers and soldiers took money from drivers for passage and took cars away from Chechens.
    Such posts stood in Grozny at every stop and on the road from Gudermes to Argun, towns east of Grozny(Citation: 988).

    Russian guards of the filtration camps and of the pits at military units demanded money from detained Chechens for their release (see: "Hostage-Taking")(Citation: 986)(Citation: 922).

    Russian troops surrounded villages and took money from Chechens in exchange for not bombing them and for letting the Chechens leave(Citation: 988)(Citation: 1359).
    Russian servicemen demanded weapons that the Chechens did not have and took money instead.
    Often, a month after the payment, a new Russian unit surrounded the village and demanded money again(Citation: 988).

    On 7-8 April 1995, Russian soldiers who were storming Samashki, a village in the west of Ichkeria, brought the men from Vygonnaya Street out of a basement and demanded gold and money from the women in exchange for not taking the men away.
    The occupiers took the men, stripped and bound with wire, to the pits near Assinovskaya, a neighboring stanitsa, and to the filtration camp in Mozdok, a town in Russian-controlled North Ossetia (see: "Filtration Camp System")(Citation: 1136).
    In May, the headquarters of the joint grouping of the Internal Troops of the Russian Ministry of Internal Affairs in Ichkeria, in a "Memo", prohibited soldiers at the posts from taking belongings and food from Chechens passing through(Citation: 27).

    In the summer of 1995, the puppet government in Grozny began paying compensation from the Russian budget to Chechens whose homes the occupiers had destroyed(Citation: 1166)(Citation: 27).
    Officials of the puppet government who distributed the payments usually kept 15 to 50% of each family's money for themselves.
    By the count of the Chechen journalist Musa Muradov, of the 60 thousand families of Grozny who had lost their housing, no more than one and a half thousand received money(Citation: 1166).
    In the autumn of 1995, Russian soldiers at the checkpoints near Achkhoy-Martan and Sernovodsk, villages in the west of Ichkeria, took from everyone who entered or left the village 100,000 rubles (23 dollars) at Achkhoy-Martan and 50,000 rubles at Sernovodsk(Citation: 658).

    Before the assault in March 1996, Chechens in Samashki sold cows to buy weapons, hand them over to the Russian servicemen and save their homes.
    Zinaida Baisayeva, who lived in the village, told the public tribunal of the Russian Glasnost Foundation in Moscow on 22 April 1996: "Approximately 9-10 times we gave money so that they would not bomb us.
    But they shelled us anyway every night."
    On the night of 14 March 1996, the occupiers surrounded Samashki.
    Russian servicemen told the village head and the elders that they would give a "corridor" so that fighters of the Armed Forces of Ichkeria could leave the village at night, and that they would then check passports and leave.
    Zainap Baisayeva from this village told the Glasnost tribunal: "For this one-hour corridor they asked, as I was told, 58 million rubles.
    This money was collected from the residents of the village.
    My brother gave a million [rubles] — the last he had earned…
    All the money was handed over to the checkpoint, to whoever was in command there."
    For a second "corridor", for Chechen civilians to leave the village, the Russian servicemen demanded 10 thousand dollars.
    Chechens from Samashki told human rights defenders of Memorial that on 14 March the village head took weapons and 50 million rubles (10 thousand dollars) to Russian checkpoint No. 13.
    On the morning of 15 March, the occupiers gave the Chechens two hours to leave the village (see: "Sham Corridor") and began the assault(Citation: 988).

    In the spring of 1996, the occupiers and the puppet government in Grozny forced villages to sign "Protocols on Peace and Accord" and to surrender weapons (see: "Collective Punishment")(Citation: 27).
    Chechens in Gekhi, a village southwest of Grozny, paid Russian servicemen about a hundred million rubles when signing the "Protocol on Peace and Accord".
    In Mesker-Yurt, a village southeast of Grozny, the occupiers received a hundred thousand rubles from each house(Citation: 988).
    On 7 April 1996, Russian servicemen ordered Saidash Shamakhurov from Gikalovo, a village south of Grozny, to drive in his own car to Khankala, the main base of the occupation troops on the eastern outskirts of Grozny.
    On 27 April, the occupiers exchanged him for a captured Russian soldier (see: "Hostage-Taking"), and three days later returned his car to him, taking 2,000 dollars and one more prisoner for it(Citation: 657).
    In April 1996, the occupiers surrounded Shali, a town southeast of Grozny, and Russian soldiers at the post did not let Chechens out of the town, demanded money from them and fired into the ground in front of them.
    On 26 April, more than a thousand Chechen women and children left Shali on foot(Citation: 27)(Citation: 1359).

    The 1995 report of the observer mission of Russian human rights organizations says that Russian guards extorted money where they held detained Chechens before sending them to filtration camps, because no one controlled these places and they had no official status(Citation: 922).

    Despite the "Memo", Russian servicemen and police officers kept extorting payments at checkpoints until the end of the war in 1996, and Chechens complained about them to human rights defenders(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Російські військові та міліціонери вимагали в чеченців гроші, золото, автомобілі та інші цінності.

    На блокпостах російські міліціонери і солдати брали з водіїв гроші за проїзд і відбирали в чеченців машини.
    Такі пости стояли в Грозному на кожній зупинці і на дорозі з Гудермеса в Аргун, міста на схід від Грозного(Citation: 988).

    Російська охорона фільтраційних таборів і ям при військових частинах вимагала із затриманих чеченців гроші за звільнення (докладніше: «Захоплення заручників»)(Citation: 986)(Citation: 922).

    Російські війська оточували села і брали гроші з чеченців, щоб не бомбити їх і дати чеченцям виїхати(Citation: 988)(Citation: 1359).
    Російські військові вимагали зброю, якої в чеченців не було, і брали замість неї гроші.
    Часто через місяць після виплати нова російська частина оточувала село і знову вимагала грошей(Citation: 988).

    7-8 квітня 1995 року російські солдати, які штурмували Самашки, село на заході Ічкерії, вивели чоловіків із Вигінної вулиці з підвалу і вимагали в жінок золото й гроші за те, щоб не забирати чоловіків.
    Окупанти відвезли чоловіків роздягненими і зв'язаними дротом у ями біля Ассинівської, сусідньої станиці, та у фільтраційний табір у Моздоку, місті в підконтрольній Росії Північній Осетії (докладніше: «Система фільтраційних таборів»)(Citation: 1136).
    У травні штаб об'єднаного угруповання внутрішніх військ МВС Росії в Ічкерії «Пам'яткою» заборонив солдатам на постах брати в проїжджих чеченців речі та продукти харчування(Citation: 27).

    Улітку 1995 року маріонетковий уряд у Грозному почав платити з російського бюджету компенсації чеченцям, чиї будинки зруйнували окупанти(Citation: 1166)(Citation: 27).
    Чиновники маріонеткового уряду, які розподіляли виплати, зазвичай забирали собі від 15 до 50% грошей кожної сім'ї.
    За підрахунком чеченського журналіста Муси Мурадова, із 60 тисяч сімей Грозного, що втратили житло, гроші отримали не більше ніж півтори тисячі(Citation: 1166).
    Восени 1995 року російські солдати на блокпостах біля Ачхой-Мартана і Серноводська, сіл на заході Ічкерії, брали з кожного, хто входив у село або виходив із нього, 100 000 рублів (23 долари) біля Ачхой-Мартана і 50 000 рублів біля Серноводська(Citation: 658).

    До штурму в березні 1996 року чеченці в Самашках продавали корів, щоб купити зброю, здати її російським військовим і врятувати свої будинки.
    Зінаїда Байсаєва, яка жила в селі, 22 квітня 1996 року розповіла в Москві громадському трибуналу російського фонду «Гласність»: «Приблизно 9-10 разів ми давали гроші, щоб нас не бомбили.
    Але нас усе одно обстрілювали щоночі».
    У ніч на 14 березня 1996 року окупанти оточили Самашки.
    Російські військові сказали голові села і старійшинам, що дадуть «коридор», щоб уночі із села вийшли бійці Збройних сил Ічкерії, а потім перевірять паспорти й підуть.
    Зайнап Байсаєва з цього села розповіла трибуналу «Гласності»: «За цей коридор на годину вони запросили, як мені казали, 58 мільйонів рублів.
    Ці гроші зібрали з жителів села.
    Мій брат віддав мільйон [рублів] — останнє, що він заробив…
    Усі гроші передавали на блокпост, тому, хто там командував».
    За другий «коридор», для виходу із села мирних чеченців, російські військові вимагали 10 тисяч доларів.
    Чеченці із Самашок розповіли правозахисникам «Меморіалу», що 14 березня голова села відвіз на 13-й російський блокпост зброю і 50 мільйонів рублів (10 тисяч доларів).
    Уранці 15 березня окупанти дали чеченцям дві години на вихід із села (докладніше: «Фальшивий коридор») і почали штурм(Citation: 988).

    Навесні 1996 року окупанти і маріонетковий уряд у Грозному змушували села підписувати «Протоколи про мир і згоду» та здавати зброю (докладніше: «Колективні покарання»)(Citation: 27).
    Чеченці в Гехі, селі на південний захід від Грозного, при підписанні «Протоколу про мир і згоду» заплатили російським військовим близько ста мільйонів рублів.
    У Мескер-Юрті, селі на південний схід від Грозного, окупанти отримали по сто тисяч рублів з кожного будинку(Citation: 988). 7 квітня 1996 року російські військові наказали Саїдашу Шамахурову з Гікалова, села на південь від Грозного, їхати на своїй машині в Ханкалу, головну базу окупаційних військ на східній околиці Грозного. 27 квітня окупанти обміняли його на полоненого російського солдата (докладніше: «Захоплення заручників»), а через три дні повернули йому машину, узявши за неї 2000 доларів і ще одного полоненого(Citation: 657).
    У квітні 1996 року окупанти оточили Шалі, місто на південний схід від Грозного, і російські солдати на посту не випускали чеченців із міста, вимагали з них грошей і стріляли перед ними в землю. 26 квітня понад тисяча чеченських жінок і дітей пішли із Шалі пішки(Citation: 27)(Citation: 1359).

    У доповіді спостережної місії російських правозахисних організацій 1995 року сказано, що російська охорона вимагала гроші там, де тримала затриманих чеченців до відправлення у фільтраційні табори, бо ці місця ніхто не контролював і вони не мали офіційного статусу(Citation: 922).

    Попри «Пам'ятку», російські військові та міліціонери брали побори на блокпостах до кінця війни в 1996 році, і чеченці скаржилися на них правозахисникам(Citation: 27).
