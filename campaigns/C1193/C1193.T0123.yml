description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты оставляли чеченцев без питьевой воды.

    Российские лётчики и артиллеристы не раз разрушали в Грозном, столице Ичкерии, подстанции и водопровод, оставляя горожан без воды(Citation: 986)(Citation: 1407).

    Российские военные с бронетранспортёров и вертолётов стреляли в чеченцев, которые шли за водой (подробнее: «Неизбирательные нападения»)(Citation: 654)(Citation: 988).

    31 января 1995 года оккупанты обстреляли Самашки, село на западе Ичкерии, из танков и с вертолётов, оставив чеченцев в селе без воды (подробнее: «Неизбирательные нападения»)(Citation: 662).
    В феврале 1995 года российская артиллерия обстреливала, а авиация бомбила Аргун, город к востоку от Грозного.
    Чеченцы в Аргуне прятались в подвалах и выходили за водой только с семи до девяти утра, а экипажи российских вертолётов стреляли по прохожим на улицах(Citation: 654).

    Во время штурма Грозного в феврале 1995 года российские военные в посёлке Катаяма в черте города с бронетранспортёра расстреляли из пушки 28-летнюю Дженчураеву, когда она несла воду.
    Её брат пытался донести тело до дома и выжил, хотя оккупанты ранили его в плечо.
    Липкан Базаева, преподавательница из Грозного и жена двоюродного брата убитой, в мае 1996 года рассказала в Праге общественному трибуналу российского фонда «Гласность»: «Она пошла за водой, полагая, что женщину не убьют»(Citation: 988).

    7 апреля 1995 года внутренние войска МВД России (предшественники современной Росгвардии) и омоновцы (милицейский спецназ) штурмовали Самашки. 8 апреля российские солдаты обыскивали дома в селе и подожгли большинство из них (подробнее: «Тотальное уничтожение инфраструктуры»).
    Утром 8 апреля российские военные загнали Юзбека Шовхалова, старейшину Самашек, в подвал его дома на Кооперативной улице, и подвал наполнился дымом.
    В апреле 1995 года старейшина рассказал Наблюдательной миссии российских правозащитных организаций, как выбежал оттуда с ожогами: «бегу, думаю, хоть фляга там стояла с водой.
    Нет, они вынесли ее, пьют воду.
    Все сидят с той стороны улицы, сидят, смеются, щелкают семечки»(Citation: 662)(Citation: 27). 10 апреля чеченка по фамилии Карнукаева с Рабочей улицы рассказала миссии о солдатах во дворе соседей, где она пряталась 8 апреля: «Бабке говорят: „Это у вас питьевая вода?“.
    Та говорит: „Да, это чистая вода“.
    „Давайте пейте сами сначала“.
    Она взяла кружку, выпила воды, потом сами пьют и разлили ее, ни капли не оставили.
    Все эти бочки и фляги перевернули, и вылили воду.
    В случае чего, если пожар будет, чтобы не тушили.
    Наверно, так они думали»(Citation: 662).

    К 12 апреля 1995 года российские военные прострелили в Самашках бочки для воды, и чеченцам в селе было не в чем её держать(Citation: 986).
    В дневнике наблюдателя «Мемориала» 14 апреля записано, что в село не подают воду, газ и электричество.
    В этот день командование МВД России упростило въезд в Самашки, а советник президента подконтрольной России Ингушетии Косов организовал подвоз в село хлеба и воды(Citation: 1136).

    Весной 1996 года, через год после того как российские войска захватили Грозный, в квартирах города не было воды, и на человека приходилось два-три литра в сутки.
    Горожане ходили за водой за 5-10 километров и брали её из грязной реки Сунжи, которая течёт через город(Citation: 988).
    В августе 1996 года российские лётчики бомбили Грозный, а артиллеристы обстреливали город (подробнее: «Неизбирательные нападения»).
    В бюллетене Международного комитета Красного Креста от 2 сентября 1996 года сказано, что после этих ударов все 80 тысяч человек в Грозном остались без питьевой воды, а в конце августа инженеры Красного Креста добрались до единственной работающей насосной станции города и стали раздавать воду, по три литра на человека в день(Citation: 1407).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers left Chechens without drinking water.

    Russian pilots and artillerymen more than once destroyed substations and the water supply system in Grozny, the capital of Ichkeria, leaving the townspeople without water(Citation: 986)(Citation: 1407).

    Russian servicemen fired from armored personnel carriers and helicopters at Chechens who were going for water (see: "Indiscriminate Attacks")(Citation: 654)(Citation: 988).

    On 31 January 1995, the occupiers shelled Samashki, a village in the west of Ichkeria, from tanks and helicopters, leaving the Chechens in the village without water (see: "Indiscriminate Attacks")(Citation: 662).
    In February 1995, Russian artillery shelled and aircraft bombed Argun, a town east of Grozny.
    Chechens in Argun hid in basements and went out for water only between seven and nine in the morning, while the crews of Russian helicopters fired at passers-by in the streets(Citation: 654).

    During the assault on Grozny in February 1995, Russian servicemen in the Katayama settlement within the city limits shot 28-year-old Dzhenchuraeva with the cannon of an armored personnel carrier as she was carrying water.
    Her brother tried to carry the body home and survived, although the occupiers wounded him in the shoulder.
    Lipkan Bazaeva, a teacher from Grozny and the wife of the murdered woman's cousin, told the public tribunal of the Russian Glasnost Foundation in Prague in May 1996: "She went for water, believing that a woman would not be killed"(Citation: 988).

    On 7 April 1995, the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) and OMON troops (police special forces) stormed Samashki.
    On 8 April, Russian soldiers searched houses in the village and set fire to most of them (see: "Total Destruction of Infrastructure").
    On the morning of 8 April, Russian servicemen drove Yuzbek Shovkhalov, an elder of Samashki, into the basement of his house on Kooperativnaya Street, and the basement filled with smoke.
    In April 1995, the elder told the observer mission of Russian human rights organizations how he ran out of there with burns: "I run, thinking, at least there was a flask of water standing there.
    No, they had carried it out, they're drinking the water.
    They're all sitting on the other side of the street, sitting, laughing, cracking sunflower seeds"(Citation: 662)(Citation: 27).
    On 10 April, a Chechen woman named Karnukaeva of Rabochaya Street told the mission about soldiers in the neighbors' yard, where she had hidden on 8 April: "They say to the old woman: 'Is this your drinking water?' She says: 'Yes, it's clean water.' 'Go on, you drink it first.' She took a mug, drank some water, then they drank themselves and spilled it, didn't leave a drop.
    They turned over all those barrels and flasks and poured out the water.
    In case anything happened, if there was a fire, so that no one could put it out.
    That's probably what they were thinking"(Citation: 662).

    By 12 April 1995, Russian servicemen had shot through the water barrels in Samashki, and the Chechens in the village had nothing to keep water in(Citation: 986).
    The diary of a Memorial observer records on 14 April that the village was receiving no water, gas or electricity.
    That day, the command of the Russian Ministry of Internal Affairs eased entry into Samashki, and Kosov, an adviser to the president of Russian-controlled Ingushetia, organized the delivery of bread and water to the village(Citation: 1136).

    In the spring of 1996, a year after Russian troops captured Grozny, there was no water in the city's apartments, and there were two to three liters per person a day.
    The townspeople walked 5-10 kilometers for water and took it from the dirty Sunzha river, which flows through the city(Citation: 988).
    In August 1996, Russian pilots bombed Grozny, and artillerymen shelled the city (see: "Indiscriminate Attacks").
    A bulletin of the International Committee of the Red Cross of 2 September 1996 says that after these strikes all 80 thousand people in Grozny were left without drinking water, and at the end of August Red Cross engineers reached the city's only working pumping station and began distributing water, three liters per person a day(Citation: 1407).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти залишали чеченців без питної води.

    Російські льотчики й артилеристи не раз руйнували в Грозному, столиці Ічкерії, підстанції та водогін, залишаючи городян без води(Citation: 986)(Citation: 1407).

    Російські військові з бронетранспортерів і вертольотів стріляли в чеченців, які йшли за водою (докладніше: «Невибіркові напади»)(Citation: 654)(Citation: 988).

    31 січня 1995 року окупанти обстріляли Самашки, село на заході Ічкерії, з танків і з вертольотів, залишивши чеченців у селі без води (докладніше: «Невибіркові напади»)(Citation: 662).
    У лютому 1995 року російська артилерія обстрілювала, а авіація бомбила Аргун, місто на схід від Грозного.
    Чеченці в Аргуні ховалися в підвалах і виходили за водою лише із сьомої до дев'ятої ранку, а екіпажі російських вертольотів стріляли по перехожих на вулицях(Citation: 654).

    Під час штурму Грозного в лютому 1995 року російські військові в селищі Катаяма в межах міста з бронетранспортера розстріляли з гармати 28-річну Дженчураєву, коли вона несла воду.
    Її брат намагався донести тіло додому і вижив, хоча окупанти поранили його в плече.
    Ліпкан Базаєва, викладачка з Грозного і дружина двоюрідного брата вбитої, у травні 1996 року розповіла в Празі громадському трибуналу російського фонду «Гласність»: «Вона пішла за водою, вважаючи, що жінку не вб'ють»(Citation: 988).

    7 квітня 1995 року внутрішні війська МВС Росії (попередники сучасної Росгвардії) та омонівці (міліцейський спецназ) штурмували Самашки. 8 квітня російські солдати обшукували будинки в селі і підпалили більшість із них (докладніше: «Тотальне знищення інфраструктури»).
    Уранці 8 квітня російські військові загнали Юзбека Шовхалова, старійшину Самашок, у підвал його будинку на Кооперативній вулиці, і підвал наповнився димом.
    У квітні 1995 року старійшина розповів Спостережній місії російських правозахисних організацій, як вибіг звідти з опіками: «біжу, думаю, хоч фляга там стояла з водою.
    Ні, вони винесли її, п'ють воду.
    Усі сидять з того боку вулиці, сидять, сміються, лузають насіння»(Citation: 662)(Citation: 27). 10 квітня чеченка на прізвище Карнукаєва з Робочої вулиці розповіла місії про солдатів у дворі сусідів, де вона ховалася 8 квітня: «Бабі кажуть: „Це у вас питна вода?“.
    Та каже: „Так, це чиста вода“.
    „Давайте пийте самі спочатку“.
    Вона взяла кружку, випила води, потім самі п'ють і розлили її, ні краплі не залишили.
    Усі ці бочки і фляги перевернули, і вилили воду.
    Про всяк випадок, якщо пожежа буде, щоб не гасили.
    Напевно, так вони думали»(Citation: 662).

    До 12 квітня 1995 року російські військові прострелили в Самашках бочки для води, і чеченцям у селі було ні в чому її тримати(Citation: 986).
    У щоденнику спостерігача «Меморіалу» 14 квітня записано, що в село не подають воду, газ і електрику.
    Того дня командування МВС Росії спростило в'їзд у Самашки, а радник президента підконтрольної Росії Інгушетії Косов організував підвезення в село хліба і води(Citation: 1136).

    Навесні 1996 року, через рік після того, як російські війська захопили Грозний, у квартирах міста не було води, і на людину припадало два-три літри на добу.
    Городяни ходили за водою за 5-10 кілометрів і брали її з брудної річки Сунжі, яка тече через місто(Citation: 988).
    У серпні 1996 року російські льотчики бомбили Грозний, а артилеристи обстрілювали місто (докладніше: «Невибіркові напади»).
    У бюлетені Міжнародного комітету Червоного Хреста від 2 вересня 1996 року сказано, що після цих ударів усі 80 тисяч людей у Грозному залишилися без питної води, а наприкінці серпня інженери Червоного Хреста дісталися до єдиної працюючої насосної станції міста і стали роздавати воду, по три літри на людину в день(Citation: 1407).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
