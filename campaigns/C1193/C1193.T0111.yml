description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты прикрывались мирными чеченцами от огня Вооружённых сил Ичкерии.

    Российские солдаты выводили чеченцев из подвалов, где те прятались от обстрела, уводили мужчин из домов и забирали врачей и больных в больнице.
    Оккупанты сажали их на бронированные машины или ставили перед собой, чтобы бойцы армии Ичкерии не стреляли(Citation: 27)(Citation: 657).
    Российские военные грозили сжечь или расстрелять захваченных чеченцев, если защитники выстрелят или не отдадут пленных(Citation: 921).
    Российские солдаты отпускали одних чеченцев из живого щита через несколько часов, а других увозили на свои базы.
    Там оккупанты сажали их в ямы и избивали (подробнее: «Пытки и истязания»)(Citation: 921).

    6-8 марта 1996 года, когда армия Ичкерии окружила в Грозном российский блокпост № 6, офицер российской комендатуры города по рации посоветовал солдатам блокпоста захватить пару чеченских семей и прикрыться ими.
    Солдаты на посту этого не сделали(Citation: 1297)(Citation: 27)(Citation: 1298).

    С 15 марта 1996 года внутренние войска МВД России (предшественники современной Росгвардии) и 58-я российская армия штурмовали Самашки, село на западе Ичкерии (подробнее: «Военная интервенция»)(Citation: 27). 17 марта российские солдаты выгнали чеченцев из подвала дома на Рабочей улице, где те прятались от обстрела.
    Майор, командир российского подразделения, заставил залезть на бронированную машину трёх женщин и троих мальчиков Киреевых - пяти, одиннадцати и двенадцати лет(Citation: 27)(Citation: 921).
    Лейла Гаербекова, одна из трёх женщин на машине, 4 мая 1996 года рассказала правозащитнику Андрею Миронову: «Нас под автоматами посадили на танк [бронированную машину] на Рабочей улице.
    Трое детей, их мать Кока, я и моя сестра Гаербекова Аня. <...> Перед танком нас поставили и сказали: «Если одна пуля оттуда будет, мы вас сожжем».
    И не было оттуда никаких пуль, ничего».
    Солдаты поставили перед машиной почти всех, кто прятался в подвале, и под прицелом вели их около 300 метров, до канала посреди села.
    Между 12 и 14 часами майор велел чеченцам расходиться.
    Хизир Хачукаев, командир подразделения армии Ичкерии в Самашках, рассказал правозащитникам «Мемориала», что его бойцы не стреляли по бронированным машинам с людьми и были вынуждены отступать, а основной отпор дали в центре села, когда оккупанты отпустили людей из живого щита(Citation: 27)(Citation: 921).

    15 марта 1996 года в Самашках российские солдаты вывели из дома на Выгонной улице двоих пожилых чеченцев, хозяина и его соседа, посадили наверх бронированной машины и шесть-семь часов возили под пулями.
    После девяти вечера командир оккупантов отпустил обоих(Citation: 921).

    10 августа 1996 года, когда Вооружённые силы Ичкерии освобождали Грозный, солдаты внутренних войск МВД России обыскали 9-ю городскую больницу Грозного.
    Оккупанты на два дня захватили в заложники около 500 больных, их родственников, врачей и медсестёр (подробнее: «Захват заложников»).
    Мовсар Тембулатов, заместитель главного врача, 13 октября 1996 года рассказал в больнице правозащитникам «Мемориала» и Human Rights Watch, как российские солдаты спускались в подвал: «впереди ставят меня или кого-то еще из врачей как прикрытие какое-то, сзади автоматчик»(Citation: 921)(Citation: 27).

    12 августа 1996 года бойцы армии Ичкерии отбили атаку российских войск, которые пытались пробиться к оккупантам, окруженным в больнице.
    Командир российских военных в больнице согласился увести своих солдат в обмен на пленных и потребовал себе в живой щит 100 врачей, медсестёр, ходячих больных и их родственников.
    Хадис Мальсагов, один из заложников, 24 августа 1996 года рассказал правозащитникам «Мемориала»: «Как только все отошли от больницы, они [российские солдаты] ставят в шеренгу женщин и говорят, что будут их расстреливать, если пленных им не отдадут немедленно».
    Бойцы Хизира Хачукаева отдали всех пленных.
    У ворот своей базы оккупанты отпустили людей из живого щита.
    Когда люди возвращались в больницу, российские войска выпустили по ней из миномётов несколько десятков мин, убили медсестру Тоиту Кутуханову и ранили двух медсестёр, двух врачей и больную женщину (подробнее: «Неизбирательные нападения»).
    Вечером 12 и утром 13 августа больные и медики ушли из больницы в здание Международного комитета Красного Креста неподалёку(Citation: 921)(Citation: 27).

    12 августа 1996 года солдаты 101-й бригады внутренних войск МВД России увели мужчин из кварталов Грозного вокруг «15-го городка», своей базы на улице Ленина, и прикрывались ими по дороге туда (подробнее: «Захват заложников»)(Citation: 27).
    Двоих из них, отца и сына, оккупанты привязали проволокой к бронетранспортёру, провезли под огнём в Ханкалу, главную базу оккупационных войск на восточной окраине города, и 16 августа отпустили(Citation: 921).

    В докладе «Мемориала» 1996 года сказано, что российские военные и сотрудники российских ведомств в Ичкерии системно брали заложников и прикрывались живым щитом.
    По данным доклада, оккупанты прикрывались чеченцами последние шесть месяцев войны, с марта по август 1996 года, чаще всего - солдаты внутренних войск МВД России(Citation: 921).

    Прокуроры российской армии не расследовали, как российские войска прикрывались чеченцами в ходе штурмов, и никого не привлекли к ответственности за это (подробнее: «Безнаказанность исполнителей»)(Citation: 657)(Citation: 27).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers shielded themselves with peaceful Chechens from the fire of the Armed Forces of Ichkeria.

    Russian soldiers led Chechens out of the basements where they were hiding from shelling, took men from their homes and seized doctors and patients in a hospital.
    The occupiers put them on armored vehicles or placed them in front of themselves so that the soldiers of the army of Ichkeria would not shoot(Citation: 27)(Citation: 657).
    Russian servicemen threatened to burn or shoot the captured Chechens if the defenders fired or did not hand over captives(Citation: 921).
    Russian soldiers released some Chechens from the human shield after a few hours and took others to their bases.
    There the occupiers put them in pits and beat them (see: "Torture and Abuse")(Citation: 921).

    On 6-8 March 1996, when the army of Ichkeria encircled Russian checkpoint No. 6 in Grozny, an officer of the Russian commandant's office of the city advised the soldiers at the checkpoint over the radio to seize a couple of Chechen families and shield themselves with them.
    The soldiers at the post did not do so(Citation: 1297)(Citation: 27)(Citation: 1298).

    From 15 March 1996, the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) and the Russian 58th Army stormed Samashki, a village in the west of Ichkeria (see: "Military Intervention")(Citation: 27).
    On 17 March, Russian soldiers drove Chechens out of the basement of a house on Rabochaya Street, where they were hiding from shelling.
    A major, the commander of a Russian unit, forced three women and the three Kireyev boys - aged five, eleven and twelve - to climb onto an armored vehicle(Citation: 27)(Citation: 921).
    Leila Gaerbekova, one of the three women on the vehicle, told the human rights defender Andrei Mironov on 4 May 1996: "At gunpoint they put us on a tank [an armored vehicle] on Rabochaya Street.
    Three children, their mother Koka, me and my sister Anya Gaerbekova. <...> They placed us in front of the tank and said: 'If a single bullet comes from over there, we will burn you'.
    And there were no bullets from over there, nothing".
    The soldiers placed almost everyone who had been hiding in the basement in front of the vehicle and led them at gunpoint for about 300 meters, to the canal in the middle of the village.
    Between 12 and 2 p.m., the major told the Chechens to disperse.
    Khizir Khachukayev, the commander of the unit of the army of Ichkeria in Samashki, told the human rights defenders of "Memorial" that his soldiers did not fire at the armored vehicles with people on them and were forced to retreat, and put up their main resistance in the center of the village once the occupiers had let the people out of the human shield(Citation: 27)(Citation: 921).

    On 15 March 1996, in Samashki, Russian soldiers led two elderly Chechens, the owner of a house on Vygonnaya Street and his neighbor, out of the house, put them on top of an armored vehicle and drove them around under bullets for six or seven hours.
    After nine in the evening, the occupiers' commander let both of them go(Citation: 921).

    On 10 August 1996, when the Armed Forces of Ichkeria were liberating Grozny, soldiers of the Internal Troops of the Russian Ministry of Internal Affairs searched City Hospital No. 9 in Grozny.
    For two days, the occupiers held about 500 patients, their relatives, doctors and nurses hostage (see: "Hostage-Taking").
    Movsar Tembulatov, the deputy chief physician, told the human rights defenders of "Memorial" and Human Rights Watch in the hospital on 13 October 1996 how Russian soldiers went down into the basement: "they put me or one of the other doctors in front as some kind of cover, with a submachine gunner behind"(Citation: 921)(Citation: 27).

    On 12 August 1996, soldiers of the army of Ichkeria repelled an attack by Russian troops trying to break through to the occupiers encircled in the hospital.
    The commander of the Russian servicemen in the hospital agreed to lead his soldiers out in exchange for captives and demanded 100 doctors, nurses, walking patients and their relatives as a human shield for himself.
    Khadis Malsagov, one of the hostages, told the human rights defenders of "Memorial" on 24 August 1996: "As soon as everyone had moved away from the hospital, they [the Russian soldiers] line the women up and say they will shoot them if the captives are not handed over to them immediately".
    The soldiers of Khizir Khachukayev handed over all the captives.
    At the gates of their base, the occupiers released the people from the human shield.
    When the people were returning to the hospital, Russian troops fired several dozen mortar shells at it, killed the nurse Toita Kutukhanova and wounded two nurses, two doctors and a woman patient (see: "Indiscriminate Attacks").
    On the evening of 12 August and the morning of 13 August, the patients and medics left the hospital for the building of the International Committee of the Red Cross nearby(Citation: 921)(Citation: 27).

    On 12 August 1996, soldiers of the 101st Brigade of the Internal Troops of the Russian Ministry of Internal Affairs took men from the blocks of Grozny around the "15th Gorodok", their base on Lenin Street, and shielded themselves with them on the way there (see: "Hostage-Taking")(Citation: 27).
    Two of them, a father and son, the occupiers tied with wire to an armored personnel carrier, drove under fire to Khankala, the main base of the occupation troops on the eastern outskirts of the city, and released on 16 August(Citation: 921).

    The 1996 report of "Memorial" says that Russian servicemen and officers of Russian agencies in Ichkeria systematically took hostages and shielded themselves with human shields.
    According to the report, the occupiers shielded themselves with Chechens during the last six months of the war, from March to August 1996, most often the soldiers of the Internal Troops of the Russian Ministry of Internal Affairs(Citation: 921).

    The prosecutors of the Russian army did not investigate how Russian troops shielded themselves with Chechens during assaults and held no one accountable for it (see: "Impunity of Perpetrators")(Citation: 657)(Citation: 27).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти прикривалися мирними чеченцями від вогню Збройних сил Ічкерії.

    Російські солдати виводили чеченців із підвалів, де ті ховалися від обстрілу, виводили чоловіків із будинків і забирали лікарів та хворих у лікарні.
    Окупанти садили їх на броньовані машини або ставили перед собою, щоб бійці армії Ічкерії не стріляли(Citation: 27)(Citation: 657).
    Російські військові погрожували спалити або розстріляти захоплених чеченців, якщо захисники вистрелять або не віддадуть полонених(Citation: 921).
    Російські солдати відпускали одних чеченців із живого щита через кілька годин, а інших відвозили на свої бази.
    Там окупанти садили їх у ями й били (докладніше: «Катування та знущання»)(Citation: 921).

    6-8 березня 1996 року, коли армія Ічкерії оточила в Грозному російський блокпост № 6, офіцер російської комендатури міста по рації порадив солдатам блокпоста захопити пару чеченських сімей і прикритися ними.
    Солдати на посту цього не зробили(Citation: 1297)(Citation: 27)(Citation: 1298).

    З 15 березня 1996 року внутрішні війська МВС Росії (попередники сучасної Росгвардії) і 58-ма російська армія штурмували Самашки, село на заході Ічкерії (докладніше: «Воєнна інтервенція»)(Citation: 27). 17 березня російські солдати вигнали чеченців із підвалу будинку на Робочій вулиці, де ті ховалися від обстрілу.
    Майор, командир російського підрозділу, змусив залізти на броньовану машину трьох жінок і трьох хлопчиків Кіреєвих - п'яти, одинадцяти і дванадцяти років(Citation: 27)(Citation: 921).
    Лейла Гаєрбекова, одна з трьох жінок на машині, 4 травня 1996 року розповіла правозахисникові Андрієві Миронову: «Нас під автоматами посадили на танк [броньовану машину] на Робочій вулиці.
    Троє дітей, їхня мати Кока, я і моя сестра Гаєрбекова Аня. <...> Перед танком нас поставили й сказали: «Якщо одна куля звідти буде, ми вас спалимо».
    І не було звідти ніяких куль, нічого».
    Солдати поставили перед машиною майже всіх, хто ховався в підвалі, і під прицілом вели їх близько 300 метрів, до каналу посеред села.
    Між 12 і 14 годинами майор звелів чеченцям розходитися.
    Хізір Хачукаєв, командир підрозділу армії Ічкерії в Самашках, розповів правозахисникам «Меморіалу», що його бійці не стріляли по броньованих машинах із людьми і були змушені відступати, а основну відсіч дали в центрі села, коли окупанти відпустили людей із живого щита(Citation: 27)(Citation: 921).

    15 березня 1996 року в Самашках російські солдати вивели з будинку на Вигінній вулиці двох літніх чеченців, господаря та його сусіда, посадили нагору броньованої машини і шість-сім годин возили під кулями.
    Після дев'ятої вечора командир окупантів відпустив обох(Citation: 921).

    10 серпня 1996 року, коли Збройні сили Ічкерії звільняли Грозний, солдати внутрішніх військ МВС Росії обшукали 9-ту міську лікарню Грозного.
    Окупанти на два дні захопили в заручники близько 500 хворих, їхніх родичів, лікарів і медсестер (докладніше: «Захоплення заручників»).
    Мовсар Тембулатов, заступник головного лікаря, 13 жовтня 1996 року розповів у лікарні правозахисникам «Меморіалу» та Human Rights Watch, як російські солдати спускалися в підвал: «попереду ставлять мене або когось іще з лікарів як прикриття якесь, позаду автоматник»(Citation: 921)(Citation: 27).

    12 серпня 1996 року бійці армії Ічкерії відбили атаку російських військ, які намагалися пробитися до окупантів, оточених у лікарні.
    Командир російських військових у лікарні погодився вивести своїх солдатів в обмін на полонених і зажадав собі в живий щит 100 лікарів, медсестер, ходячих хворих та їхніх родичів.
    Хадіс Мальсагов, один із заручників, 24 серпня 1996 року розповів правозахисникам «Меморіалу»: «Щойно всі відійшли від лікарні, вони [російські солдати] ставлять у шеренгу жінок і кажуть, що розстрілюватимуть їх, якщо полонених їм не віддадуть негайно».
    Бійці Хізіра Хачукаєва віддали всіх полонених.
    Біля воріт своєї бази окупанти відпустили людей із живого щита.
    Коли люди поверталися до лікарні, російські війська випустили по ній із мінометів кілька десятків мін, убили медсестру Тоіту Кутуханову й поранили двох медсестер, двох лікарів і хвору жінку (докладніше: «Невибіркові напади»).
    Увечері 12 і вранці 13 серпня хворі й медики пішли з лікарні до будівлі Міжнародного комітету Червоного Хреста неподалік(Citation: 921)(Citation: 27).

    12 серпня 1996 року солдати 101-ї бригади внутрішніх військ МВС Росії вивели чоловіків із кварталів Грозного навколо «15-го містечка», своєї бази на вулиці Леніна, і прикривалися ними дорогою туди (докладніше: «Захоплення заручників»)(Citation: 27).
    Двох із них, батька й сина, окупанти прив'язали дротом до бронетранспортера, провезли під вогнем до Ханкали, головної бази окупаційних військ на східній околиці міста, і 16 серпня відпустили(Citation: 921).

    У доповіді «Меморіалу» 1996 року сказано, що російські військові та співробітники російських відомств в Ічкерії системно брали заручників і прикривалися живим щитом.
    За даними доповіді, окупанти прикривалися чеченцями останні шість місяців війни, з березня по серпень 1996 року, найчастіше - солдати внутрішніх військ МВС Росії(Citation: 921).

    Прокурори російської армії не розслідували, як російські війська прикривалися чеченцями під час штурмів, і нікого не притягли до відповідальності за це (докладніше: «Безкарність виконавців»)(Citation: 657)(Citation: 27).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
