    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти захоплювали міста й села Ічкерії.

    26 листопада 1994 року захисники Грозного, столиці Ічкерії, розбили російських танкістів, які штурмували місто під вивіскою маріонеткової опозиції (докладніше: «Організація перевороту»)(Citation: 1156).
    До 29 листопада російська армія зібрала для нападу на Ічкерію близько 140 бойових літаків. 29 листопада російські льотчики на шести літаках Су-27 і чотирьох гелікоптерах атакували президентський палац у Грозному(Citation: 1060). 1 грудня екіпажі російських штурмовиків Су-25 знищили на аеродромах Ічкерії всю її авіацію(Citation: 718). 9 грудня президент Росії Єльцин указом № 2166 наказав урядові застосувати проти Збройних сил Ічкерії всі засоби російської держави, у тому числі армію(Citation: 650).

    За день до переговорів Росії та Ічкерії, призначених на 12 грудня, російська армія і внутрішні війська МВС (попередники сучасної Росгвардії) почали наступ трьома колонами з підконтрольних Росії сусідніх республік (докладніше: «Переговори як прикриття нападу»)(Citation: 27).
    Джерела розходяться: одні називають у цих колонах 14 972 особи, інші - майже 24 тисячі(Citation: 2380)(Citation: 2381).
    Міністерство оборони Росії оцінювало Збройні сили Ічкерії в 11-12 тисяч бійців, МВС Росії - до 15 тисяч, і обидва відомства нараховували ще 30-40 тисяч чеченських добровольців(Citation: 2382).
    Північна колона наступала з Моздока, а західна - з Владикавказа через Інгушетію.
    Східна колона виступила від Кізляра, міста в Дагестані(Citation: 27)(Citation: 651). 11 грудня беззбройні чеченці Хасав'юртівського району Дагестану оточили бронетранспортери східної колони і не пропустили окупаційні війська(Citation: 921)(Citation: 27). 12 грудня біля села Новий Шарой на заході Ічкерії тисячі чеченців стали на дорозі перед західною колоною і на тиждень затримали її біля кордону з Інгушетією(Citation: 27)(Citation: 26).
    Того дня армія Ічкерії зупинила північну колону біля селища Долинський, приблизно за десять кілометрів на північний захід від Грозного(Citation: 27).

    Перед штурмом російські війська оточували міста й села, обстрілювали їх з артилерії, а російська авіація їх бомбила (докладніше: «Невибіркові напади»)(Citation: 27).
    Окупанти вимагали від чеченців в оточених селах вигнати захисників і здати зброю (докладніше: «Колективні покарання»)(Citation: 27).
    У захоплених містах російські війська розміщували комендатури й гарнізони.
    У Грозному Росія поставила підконтрольний «Уряд національного відродження» (докладніше: «Маріонетковий уряд»)(Citation: 27)(Citation: 1127).

    З 18 грудня 1994 року російська авіація бомбила житлові квартали Грозного. 19 грудня частини російської повітряно-десантної дивізії з Пскова під командуванням генерала Бабичева вийшли до західних околиць міста(Citation: 27). 31 грудня російська армія штурмувала Грозний із чотирьох боків.
    Захисники міста розгромили колони окупантів і захопили в полон понад сто російських військових.
    Правозахисники «Меморіалу» пишуть про війська генерала Пуликовського, які наступали з північного заходу: «131-а (Майкопська) окрема мотострілецька бригада і 81-й (Самарський) мотострілецький полк були практично повністю розгромлені»(Citation: 27).

    7-9 січня 1995 року окупанти знову штурмували Грозний, з півночі та заходу.
    Зелімхан Яндарбієв, віцепрезидент Ічкерії, який разом з Асланом Масхадовим керував обороною президентського палацу, писав у спогадах про вечір 18 січня: «Вирішували одне питання: залишитися і померти, що було рівнозначно загибелі Головного штабу, або залишити Президентський палац і на тому боці Сунжі [річки в центрі Грозного] розгорнути новий штаб»(Citation: 713).
    У ніч на 19 січня російські льотчики скинули на палац бомби, які пробивають бетон, і захисники були змушені піти. 19 січня російські солдати захопили руїни палацу.
    Окупанти штурмували решту районів Грозного ще півтора місяця.
    До початку лютого 1995 року Росія довела чисельність своїх військ в Ічкерії до 70 тисяч осіб(Citation: 2382).
    Найдовше захисники билися в Чорноріччі на півдні міста, і 6 березня 1995 року внутрішні війська МВС Росії захопили цей район(Citation: 27).

    23 березня 1995 року окупанти захопили Аргун, місто на схід від Грозного(Citation: 27). 24 березня російські війська увірвалися в Ачхой-Мартан, районний центр на заході Ічкерії, але бійці армії Ічкерії контратакою звільнили село(Citation: 1127). 28 і 29 березня російська армія оточила Гудермес, друге за величиною місто Ічкерії, і Шалі, місто на південний схід від Грозного.
    Російські командири вимагали від городян умовити захисників піти, і 30-31 березня, коли бійці армії Ічкерії були змушені покинути обидва міста, окупанти захопили їх без бою(Citation: 27). 12 травня російська армія почала наступ у гори на півдні Ічкерії. 3 червня окупанти захопили Ведено, районний центр на південний схід від Грозного, а 12 червня - Шатой на півдні від столиці та Ножай-Юрт на південному сході(Citation: 1127)(Citation: 27). 18 червня 1995 року голова уряду Росії Чорномирдін домовився про припинення боїв із Шамілем Басаєвим, командиром бійців Збройних сил Ічкерії, які захопили заручників у Будьоннівську, підконтрольному Росії місті на північний захід від республіки.
    Того вечора окупаційні війська зупинили наступ (докладніше: «Фіктивні договори»)(Citation: 27).
    Наприкінці липня під окупацією російської армії були Грозний, Аргун, Гудермес, Шалі та гірські районні центри, а в більшості сіл російських військ не було(Citation: 27)(Citation: 1127). 14 грудня 1995 року Збройні сили Ічкерії звільнили Гудермес, щоб зірвати «голосування» за главу маріонеткового уряду. 19-20 грудня, після шести днів обстрілів і бомбардувань житлових кварталів, окупанти знову захопили місто(Citation: 27)(Citation: 656).

    17-20 лютого 1996 року російська армія обстрілювала і штурмом захопила Новогрозненський, селище на схід від Гудермеса(Citation: 27). 3 березня російські війська увірвалися в Серноводськ, село на заході Ічкерії, у день, на який їхні командири призначили підписання миру з керівниками села, і захисники вибили нападників.
    До 9 березня, після шести днів обстрілів, захисники Серноводська були змушені піти, і окупанти захопили село(Citation: 27). 6 березня Збройні сили Ічкерії під командуванням Руслана Гелаєва атакували окупантів у Грозному і звільнили більшу частину міста.
    Армія Ічкерії не намагалася втримати місто і 8 березня пішла з нього(Citation: 27)(Citation: 1127).
    У ніч на 14 березня російські війська оточили Самашки, село на заході Ічкерії, і 15 березня почали штурм із танками, артилерією, гелікоптерами й літаками. 19 березня бійці армії Ічкерії під командуванням Хізіра Хачукаєва витратили боєприпаси і були змушені піти(Citation: 27). 4 квітня, після шести днів бомбардування, російські солдати увірвалися в Гойське, село на південний захід від Грозного, але захисники під командуванням Ахмеда Закаєва відбили штурм. 7 травня окупанти під командуванням генерала Шаманова захопили Гойське(Citation: 27). 24 травня, після трьох місяців штурмів, обстрілів і бомбардувань, російська армія захопила Бамут, село на заході Ічкерії біля кордону з підконтрольною Росії Інгушетією, а захисники під командуванням Руслана Хайхороєва вийшли з оточення(Citation: 27).

    9 липня 1996 року, через шість днів після виборів президента Росії, окупанти порушили домовленість про припинення вогню, підписану з Ічкерією 27 травня, і почали новий наступ (докладніше: «Фальшиве перемир'я»)(Citation: 27).
    Того дня російські частини під командуванням генерала Тихомирова, командувача окупаційних військ, оточили й обстріляли Гехі, село на південний захід від Грозного, де стояв підрозділ Збройних сил Ічкерії.
    До 12 липня окупанти вбили командира підрозділу Доку Махаєва і зруйнували понад третину села(Citation: 1364). 15 липня окупанти захопили Махкети, гірське село Веденського району на південному сході Ічкерії, яке оточили п'ятьма днями раніше(Citation: 27)(Citation: 1127).

    Російські правозахисники з «Меморіалу» пишуть, що проти Ічкерії воювала російська армія з авіацією, важкою артилерією і танками, хоча президент і уряд Росії видавали війну за поліцейське роззброєння(Citation: 27). 19 січня 1995 року Європейський парламент у резолюції засудив застосування Росією армії проти Ічкерії(Citation: 735).
    Парламентська асамблея Організації з безпеки і співробітництва в Європі в декларації 8 липня 1995 року засудила війну Росії в Ічкерії як грубе порушення міжнародного права(Citation: 1149).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів.
    За три дні боїв армія Ічкерії відбила центр і близько 80 відсотків міста(Citation: 1127).
    Захисники змусили Росію сісти за стіл переговорів. 22 серпня 1996 року в селі Нові Атаги на півдні республіки Росія та Ічкерія підписали угоду про відведення російських військ із Грозного і спільний контроль над окремими районами міста(Citation: 27)(Citation: 1272). 31 серпня 1996 року генерал Лебедь, секретар Ради безпеки Росії, і Аслан Масхадов, начальник Головного штабу Збройних сил Ічкерії, підписали в Хасав'юрті, місті в підконтрольному Росії Дагестані, спільну заяву.
    Росія визнала в ній недопустимим вирішувати спірні питання силою або загрозою сили (докладніше: «Фіктивні договори»)(Citation: 661).

    До 31 серпня 1996 року окупаційні війська пішли з Грозного на свої головні бази в Ханкалі на східній околиці міста та в аеропорту «Північний» на півночі від нього.
    У місті залишилися російські міліціонери і солдати внутрішніх військ МВС.
    Росія вивела війська з Ведено, Шатоя, Ножай-Юрта і Курчалоя, сіл на півдні та сході Ічкерії.
    Російські частини ще стояли в Шалі, біля Бамута і в Наурському та Шелковському районах на півночі Ічкерії(Citation: 1127).
    У цих двох районах за річкою Терек боїв за всю війну не було. 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
