description:
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers announced "corridors" for Chechens to leave surrounded villages and towns, and then fired on those leaving, detained men at the exit and bombed the villages together with those who had not managed to get out.

    The "corridors" were announced by the command of the occupation forces when it surrounded a village or town before an assault(Citation: 27).
    Russian commanders passed the conditions for leaving to the head of the village at their checkpoint or announced them through the ITAR-TASS agency, and gave the Chechens from two hours to two days to get out(Citation: 27)(Citation: 1260).
    The occupiers began shelling before the appointed time or closed the "corridor" before it ended.
    Russian generals declared that all Chechen civilians had left, and the troops fired on everyone who remained in the village(Citation: 27).

    On 7 April 1995, a Russian general who refused to give his name gave the Chechens in Samashki, a village in the west of Ichkeria, until four in the afternoon to leave, announcing this at one o'clock, and 15-25 minutes before the deadline the occupiers began shelling the village with mortars.
    Of the five thousand people in the village, 100-150 managed to get out before the shelling, and even before the appointed hour the Russian military killed two teenagers and mortally wounded a woman who were leaving the village(Citation: 662).
    On 1-2 June 1995, the command of the occupation forces, by agreement with the Assistance Group of the Organization for Security and Co-operation in Europe, opened a "corridor" for Chechens to leave the Shatoy district in the mountains in the south of Ichkeria, only in the daytime, from ten in the morning to seven in the evening.
    Russian tank crews fired on a column of refugees from Borzoy, a village in this district, and pilots bombed it and killed at least four refugees(Citation: 27).
    On 18 December 1995, while Russian troops were shelling Gudermes, the second-largest town of Ichkeria, east of Grozny, the crew of a Russian helicopter fired rockets in an open field at Chechen refugees, mostly women, who were walking from the town along the "humanitarian corridor" eastward to Khasavyurt, a town in Russian-controlled Dagestan.
    The crew killed the son of one of the refugee women (see: "Mass Killings of Civilians")(Citation: 656)(Citation: 988).

    On 19 February 1996, on the third day of the assault on the settlement of Novogroznensky in the east of Ichkeria, Kvashnin, commander of the Russian troops in the North Caucasus, declared that all Chechen civilians had left the settlement through two "corridors", and refugees from Novogroznensky denied this.
    According to the French agency Agence France-Presse, the occupiers killed at least 50 Chechen civilians in the settlement(Citation: 27).
    On 4 March 1996, on the second day of the assault on Sernovodsk, a village in the west of Ichkeria, the occupiers opened a "corridor" and for two hours let vehicles of the International Organization for Migration into the village, and on 5 March they closed the way out.
    Russian artillerymen and pilots resumed shelling the village, where about 7,000 people remained, and by 9 March, when the occupiers captured Sernovodsk, they had killed at least 45 Chechen civilians there (see: "Mass Killings of Civilians")(Citation: 27)(Citation: 659).

    On the night of 14 March 1996, the occupiers surrounded Samashki, where about 12,000 people lived.
    On 14 March, the command of the occupation forces demanded 10 thousand dollars for a "corridor" for the Chechens to leave the village.
    Chechens from Samashki told human rights defenders of Memorial that the head of the village took this sum to the checkpoint in rubles - 50 million, collected from the villagers (see: "Administrative Corruption and Extortion")(Citation: 988).
    On 15 March at six in the morning, the Russian military at the checkpoint announced to the head of the village that from eight to ten in the morning they would let the Chechens out toward Russian-controlled Ingushetia, and then would begin the assault.
    Some families went south along another road, but there the occupiers let no one out, and the families returned to the village(Citation: 27)(Citation: 988).
    Zaynap Baysaeva, a Chechen woman from Samashki, told the public tribunal of the Russian Glasnost Foundation in Moscow on 22 April: "Everyone who learned about the corridor — some on a tractor… some in a car, drove up to the checkpoint.
    But the road was already blocked — the mercenaries [Russian servicemen] were standing there and detaining males from children in the 6th-9th grades to men of 65"(Citation: 988).
    At the checkpoint, Russian soldiers took 91 Chechens off the buses and unlawfully detained them from among those who were leaving through the "corridor".
    Five weeks later, on 19 April, Russia's Ministry of Internal Affairs released them without charges (see: "Filtration Camp System")(Citation: 657)(Citation: 27).
    Sixteen minutes after the end of the "corridor", Russian troops began shelling the village from tanks and howitzers, helicopters and aircraft.
    About half of the village had not managed to leave (see: "Indiscriminate Attacks")(Citation: 27).

    On 16 March, Russian soldiers at the checkpoint fired on a column of up to 500 Chechens who were trying to get out of Samashki, and the column returned to the village.
    On 18 March, several thousand Chechens approached the Russian positions on the southern edge of the village and demanded to be let out.
    The Russian military allowed women with children to leave and threatened to send the men to a filtration camp, and the women refused to leave without their husbands, fathers, brothers and sons.
    On the morning of 19 March, the crew of a Russian helicopter fired on the Chechens near the Russian positions, killed one Chechen and wounded six or seven (see: "Mass Killings of Civilians").
    Only after this, at noon, did the occupiers open a "corridor", and the Chechens began to leave the encirclement, while a doctor from Samashki took the wounded to the hospital in Achkhoy-Martan, a village in the west of Ichkeria(Citation: 27).
    That day, at another Russian checkpoint, soldiers fired an automatic grenade launcher at women who had been promised a "corridor" to collect their children from the village and return by five in the evening.
    The occupiers wounded eight to ten women, and the wounded ended up in the hospital in Sleptsovskaya, a stanitsa in Russian-controlled Ingushetia(Citation: 27)(Citation: 988).
    During the assault that began on 15 March, the occupiers killed at least 35 Chechen civilians in Samashki(Citation: 27).

    On 6 May 1996, Russian troops surrounded Komsomolskoye, a village in the Urus-Martan district south-west of Grozny, and demanded that the defenders lay down their arms by nightfall, otherwise shelling would begin at two in the morning.
    Russian artillerymen opened fire at about three in the afternoon, 11 hours before the deadline, when the Chechens in the village were still preparing to take the children out, and killed Chechen civilians(Citation: 988).
    On 9 July 1996, Russian troops surrounded Gekhi, a village south-west of Grozny, and on 11 July opened a "corridor" only for women, children and the elderly and closed it the same day.
    The Russian military declared that only men remained in the village, although about 8,000 Chechens had not managed to get out, and from 9 to 12 July the occupiers' artillerymen and pilots killed 19 Chechen civilians in Gekhi(Citation: 27)(Citation: 1127)(Citation: 1364).

    On 19 August 1996, when the Armed Forces of Ichkeria had surrounded the occupiers in Grozny, Pulikovsky, acting commander of the occupation forces, gave the townspeople 48 hours to leave through the only "corridor", via the suburb of Staraya Sunzha in the east, and threatened to bomb the city afterwards(Citation: 1260).
    On the night of 20 August, before the deadline, the occupiers began bombing Grozny and shelling it with artillery, and in the daytime they closed the "corridor"(Citation: 27)(Citation: 1271).
    Human rights defenders of Memorial write that no one counted the civilian townspeople whom the occupiers killed in Grozny from 6 to 22 August, and journalists gave the figure of 2,000(Citation: 27).
    On 20 August, the crew of a Russian helicopter near the village of Goyty south of Grozny fired on Chechen refugees from the city who were traveling in buses and cars, and killed ten to twelve people(Citation: 27).

    Human rights defenders of Memorial write that throughout the war the Russian military informed Chechens about the "corridors" poorly or not at all, gave little time to get out before the shelling, and killed Chechen civilians even as they were leaving through the "corridors"(Citation: 27).

    On 21 August 1996, Lebed, secretary of Russia's Security Council, flew to Ichkeria and cancelled the threat to bomb Grozny made by Pulikovsky, acting commander of the occupation forces(Citation: 1127).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти оголошували чеченцям «коридори» для виходу з оточених сіл і міст, а потім обстрілювали тих, хто виходив, затримували чоловіків на виході та бомбили села разом з тими, хто не встиг піти.

    «Коридори» оголошувало командування окупаційних військ, коли оточувало село чи місто перед штурмом(Citation: 27).
    Російські командири передавали умови виходу голові села на своєму блокпосту або оголошували їх через агентство ІТАР-ТАРС і давали чеченцям на вихід від двох годин до двох діб(Citation: 27)(Citation: 1260).
    Окупанти починали обстріл раніше призначеного строку або закривали «коридор» до його кінця.
    Російські генерали заявляли, що всі мирні чеченці пішли, і війська обстрілювали всіх, хто залишився в селі(Citation: 27).

    7 квітня 1995 року російський генерал, який відмовився назвати себе, о першій дня дав чеченцям у Самашках, селі на заході Ічкерії, строк на вихід до четвертої дня, а за 15-25 хвилин до строку окупанти почали обстрілювати село з мінометів.
    З п'яти тисяч людей у селі до обстрілу встигли вийти 100-150, а ще до призначеної години російські військові вбили двох підлітків і смертельно поранили жінку, які виходили з села(Citation: 662). 1-2 червня 1995 року командування окупаційних військ за домовленістю з Групою сприяння Організації з безпеки і співробітництва в Європі відкрило «коридор» для виходу чеченців із Шатойського району в горах на півдні Ічкерії, лише вдень, з десятої ранку до сьомої вечора.
    Російські танкісти обстрілювали колону біженців із Борзоя, села в цьому районі, а льотчики бомбили її і вбили щонайменше чотирьох біженців(Citation: 27). 18 грудня 1995 року, коли російські війська обстрілювали Гудермес, друге за величиною місто Ічкерії на схід від Грозного, екіпаж російського гелікоптера обстріляв ракетами в чистому полі чеченських біженців, здебільшого жінок, які йшли з міста «гуманітарним коридором» на схід, до Хасав'юрта, міста в підконтрольному Росії Дагестані.
    Екіпаж убив сина однієї з біженок (докладніше: «Масові вбивства цивільних»)(Citation: 656)(Citation: 988).

    19 лютого 1996 року, на третій день штурму селища Новогрозненський на сході Ічкерії, командувач російських військ на Північному Кавказі Квашнін заявив, що всі мирні чеченці пішли з селища двома «коридорами», а біженці з Новогрозненського це спростували.
    За даними французького агентства Agence France-Presse, окупанти вбили в селищі щонайменше 50 мирних чеченців(Citation: 27). 4 березня 1996 року, на другий день штурму Серноводська, села на заході Ічкерії, окупанти відкрили «коридор» і на дві години пустили в село машини Міжнародної організації з міграції, а 5 березня закрили виїзд.
    Російські артилеристи й льотчики відновили обстріл села, де залишалися близько 7000 людей, і до 9 березня, коли окупанти захопили Серноводськ, убили там щонайменше 45 мирних чеченців (докладніше: «Масові вбивства цивільних»)(Citation: 27)(Citation: 659).

    У ніч на 14 березня 1996 року окупанти оточили Самашки, де жили близько 12 000 людей. 14 березня командування окупаційних військ зажадало 10 тисяч доларів за «коридор» для виходу чеченців із села.
    Чеченці з Самашок розповіли правозахисникам «Меморіалу», що голова села відвіз на блокпост цю суму в рублях - 50 мільйонів, зібраних із сельчан (докладніше: «Адміністративна корупція та здирництво»)(Citation: 988). 15 березня о шостій ранку російські військові на блокпосту оголосили голові села, що з восьмої до десятої ранку випустять чеченців у бік підконтрольної Росії Інгушетії, а потім почнуть штурм.
    Частина родин пішла на південь іншою дорогою, але там окупанти нікого не випускали, і родини повернулися в село(Citation: 27)(Citation: 988).
    Зайнап Байсаєва, чеченка з Самашок, 22 квітня розповіла громадському трибуналу російського фонду «Гласність» у Москві: «Усі, хто дізнався про коридор — хто на тракторі… хто на машині, під'їхали до блокпоста.
    Але дорога вже була перекрита — стояли найманці [російські військові] і затримували осіб чоловічої статі від дітей 6-9-го класу до чоловіків 65 років»(Citation: 988).
    На блокпосту російські солдати зняли з автобусів і незаконно затримали 91 чеченця з тих, хто виходив «коридором».
    Через п'ять тижнів, 19 квітня, МВС Росії відпустило їх без звинувачень (докладніше: «Система фільтраційних таборів»)(Citation: 657)(Citation: 27).
    Через 16 хвилин після кінця «коридору» російські війська почали обстрілювати село з танків і гаубиць, з гелікоптерів і літаків.
    Близько половини села піти не встигли (докладніше: «Невибіркові напади»)(Citation: 27).

    16 березня російські солдати на блокпосту обстріляли колону до 500 чеченців, які намагалися вийти з Самашок, і колона повернулася в село. 18 березня кілька тисяч чеченців підійшли до російських позицій на південній околиці села і зажадали випустити їх.
    Російські військові дозволили вийти жінкам з дітьми, а чоловіків пригрозили відправити у фільтраційний табір, і жінки відмовилися йти без чоловіків, батьків, братів і синів.
    Уранці 19 березня екіпаж російського гелікоптера обстріляв чеченців біля російських позицій, убив одного чеченця і поранив шістьох чи сімох (докладніше: «Масові вбивства цивільних»).
    Лише після цього, опівдні, окупанти відкрили «коридор», і чеченці почали виходити з оточення, а лікарка з Самашок відвезла поранених до лікарні Ачхой-Мартана, села на заході Ічкерії(Citation: 27).
    Того дня біля іншого російського блокпоста солдати обстріляли з автоматичного гранатомета жінок, яким обіцяли «коридор», щоб забрати дітей із села і до п'ятої вечора повернутися.
    Окупанти поранили від восьми до десяти жінок, і поранені потрапили до лікарні Слепцовської, станиці в підконтрольній Росії Інгушетії(Citation: 27)(Citation: 988).
    За час штурму, початого 15 березня, окупанти вбили в Самашках щонайменше 35 мирних чеченців(Citation: 27).

    6 травня 1996 року російські війська оточили Комсомольське, село в Урус-Мартанівському районі на південний захід від Грозного, і зажадали від захисників до ночі скласти зброю, інакше з другої години ночі почнуть обстріл.
    Російські артилеристи відкрили вогонь близько третьої дня, за 11 годин до строку, коли чеченці в селі ще збиралися вивезти дітей, і вбили мирних чеченців(Citation: 988). 9 липня 1996 року російські війська оточили Гехі, село на південний захід від Грозного, а 11 липня відкрили «коридор» лише для жінок, дітей і старих і того ж дня закрили його.
    Російські військові оголосили, що в селі залишилися самі чоловіки, хоча вийти не встигли близько 8000 чеченців, а з 9 по 12 липня артилеристи й льотчики окупантів убили в Гехі 19 мирних чеченців(Citation: 27)(Citation: 1127)(Citation: 1364).

    19 серпня 1996 року, коли Збройні сили Ічкерії оточили окупантів у Грозному, Пуліковський, який виконував обов'язки командувача окупаційних військ, дав городянам 48 годин на вихід єдиним «коридором», через передмістя Стара Сунжа на сході, і пригрозив потім бомбити місто(Citation: 1260).
    У ніч на 20 серпня, до кінця строку, окупанти почали бомбити Грозний і обстрілювати його з артилерії, а вдень закрили «коридор»(Citation: 27)(Citation: 1271).
    Правозахисники «Меморіалу» пишуть, що мирних городян, яких окупанти вбили в Грозному з 6 по 22 серпня, ніхто не рахував, а журналісти називали число 2000(Citation: 27). 20 серпня екіпаж російського гелікоптера біля села Гойти на південь від Грозного обстріляв чеченських біженців із міста, які їхали в автобусах і легкових машинах, і вбив від десяти до дванадцяти людей(Citation: 27).

    Правозахисники «Меморіалу» пишуть, що за всю війну російські військові погано сповіщали чеченців про «коридори» або не сповіщали зовсім, давали мало часу на вихід до обстрілу і вбивали мирних чеченців і на виході «коридорами»(Citation: 27).

    21 серпня 1996 року секретар Ради безпеки Росії Лебедь прилетів в Ічкерію і скасував погрозу бомбити Грозний, яку зробив Пуліковський, що виконував обов'язки командувача окупаційних військ(Citation: 1127).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты объявляли чеченцам «коридоры» для выхода из окружённых сёл и городов, а потом обстреливали выходящих, задерживали мужчин на выходе и бомбили сёла вместе с теми, кто не успел уйти.

    «Коридоры» объявляло командование оккупационными войсками, когда окружало село или город перед штурмом(Citation: 27).
    Российские командиры передавали условия выхода главе села на своём блокпосту или объявляли их через агентство ИТАР-ТАСС и давали чеченцам на выход от двух часов до двух суток(Citation: 27)(Citation: 1260).
    Оккупанты начинали обстрел раньше назначенного срока или закрывали «коридор» до его конца.
    Российские генералы заявляли, что все мирные чеченцы ушли, и войска обстреливали всех, кто остался в селе(Citation: 27).

    7 апреля 1995 года российский генерал, который отказался назвать себя, в час дня дал чеченцам в Самашках, селе на западе Ичкерии, срок на выход до четырёх часов дня, а за 15-25 минут до срока оккупанты начали обстреливать село из миномётов.
    Из пяти тысяч человек в селе до обстрела успели выйти 100-150, а ещё до назначенного часа российские военные убили двух подростков и смертельно ранили женщину, которые выходили из села(Citation: 662). 1-2 июня 1995 года командование оккупационными войсками по договорённости с Группой содействия Организации по безопасности и сотрудничеству в Европе открыло «коридор» для выхода чеченцев из Шатойского района в горах на юге Ичкерии, только днём, с десяти утра до семи вечера.
    Российские танкисты обстреливали колонну беженцев из Борзоя, села в этом районе, а лётчики бомбили её и убили не меньше четверых беженцев(Citation: 27). 18 декабря 1995 года, когда российские войска обстреливали Гудермес, второй по величине город Ичкерии к востоку от Грозного, экипаж российского вертолёта обстрелял ракетами в открытом поле чеченских беженцев, в основном женщин, которые шли из города по «гуманитарному коридору» на восток, к Хасавюрту, городу в подконтрольном России Дагестане.
    Экипаж убил сына одной из беженок (подробнее: «Массовые убийства гражданских»)(Citation: 656)(Citation: 988).

    19 февраля 1996 года, на третий день штурма посёлка Новогрозненский на востоке Ичкерии, командующий российскими войсками на Северном Кавказе Квашнин заявил, что все мирные чеченцы ушли из посёлка по двум «коридорам», а беженцы из Новогрозненского это опровергли.
    По данным французского агентства Agence France-Presse, оккупанты убили в посёлке не меньше 50 мирных чеченцев(Citation: 27). 4 марта 1996 года, на второй день штурма Серноводска, села на западе Ичкерии, оккупанты открыли «коридор» и на два часа пустили в село машины Международной организации по миграции, а 5 марта закрыли выезд.
    Российские артиллеристы и лётчики возобновили обстрел села, где оставались около 7000 человек, и до 9 марта, когда оккупанты захватили Серноводск, убили там не меньше 45 мирных чеченцев (подробнее: «Массовые убийства гражданских»)(Citation: 27)(Citation: 659).

    В ночь на 14 марта 1996 года оккупанты окружили Самашки, где жили около 12 000 человек. 14 марта командование оккупационными войсками потребовало 10 тысяч долларов за «коридор» для выхода чеченцев из села.
    Чеченцы из Самашек рассказали правозащитникам «Мемориала», что глава села отвёз на блокпост эту сумму в рублях - 50 миллионов, собранных с сельчан (подробнее: «Административная коррупция и вымогательство»)(Citation: 988). 15 марта в шесть утра российские военные на блокпосту объявили главе села, что с восьми до десяти утра выпустят чеченцев в сторону подконтрольной России Ингушетии, а потом начнут штурм.
    Часть семей пошла на юг по другой дороге, но там оккупанты никого не выпускали, и семьи вернулись в село(Citation: 27)(Citation: 988).
    Зайнап Байсаева, чеченка из Самашек, 22 апреля рассказала общественному трибуналу российского фонда «Гласность» в Москве: «Все, кто узнал о коридоре — кто на тракторе… кто на машине, подъехали к блокпосту.
    Но дорога уже была перекрыта — стояли наемники [российские военные] и задерживали лиц мужского пола от детей 6-9-го класса до мужчин 65 лет»(Citation: 988).
    На блокпосту российские солдаты сняли с автобусов и незаконно задержали 91 чеченца из тех, кто уходил по «коридору».
    Через пять недель, 19 апреля, МВД России отпустило их без обвинений (подробнее: «Система фильтрационных лагерей»)(Citation: 657)(Citation: 27).
    Через 16 минут после конца «коридора» российские войска начали обстреливать село из танков и гаубиц, с вертолётов и самолётов.
    Около половины села уйти не успели (подробнее: «Неизбирательные нападения»)(Citation: 27).

    16 марта российские солдаты на блокпосту обстреляли колонну до 500 чеченцев, которые пытались выйти из Самашек, и колонна вернулась в село. 18 марта несколько тысяч чеченцев подошли к российским позициям на южной окраине села и потребовали выпустить их.
    Российские военные разрешили выйти женщинам с детьми, а мужчин пригрозили отправить в фильтрационный лагерь, и женщины отказались уходить без мужей, отцов, братьев и сыновей.
    Утром 19 марта экипаж российского вертолёта обстрелял чеченцев у российских позиций, убил одного чеченца и ранил шестерых или семерых (подробнее: «Массовые убийства гражданских»).
    Только после этого, в полдень, оккупанты открыли «коридор», и чеченцы начали выходить из окружения, а врач из Самашек увезла раненых в больницу Ачхой-Мартана, села на западе Ичкерии(Citation: 27).
    В этот день у другого российского блокпоста солдаты обстреляли из автоматического гранатомёта женщин, которым обещали «коридор», чтобы забрать детей из села и до пяти вечера вернуться.
    Оккупанты ранили от восьми до десяти женщин, и раненые попали в больницу Слепцовской, станицы в подконтрольной России Ингушетии(Citation: 27)(Citation: 988).
    За время штурма, начатого 15 марта, оккупанты убили в Самашках не меньше 35 мирных чеченцев(Citation: 27).

    6 мая 1996 года российские войска окружили Комсомольское, село в Урус-Мартановском районе к юго-западу от Грозного, и потребовали от защитников до ночи сложить оружие, иначе с двух часов ночи начнут обстрел.
    Российские артиллеристы открыли огонь около трёх часов дня, за 11 часов до срока, когда чеченцы в селе ещё собирались вывезти детей, и убили мирных чеченцев(Citation: 988). 9 июля 1996 года российские войска окружили Гехи, село к юго-западу от Грозного, а 11 июля открыли «коридор» только для женщин, детей и стариков и в тот же день закрыли его.
    Российские военные объявили, что в селе остались одни мужчины, хотя выйти не успели около 8000 чеченцев, а с 9 по 12 июля артиллеристы и лётчики оккупантов убили в Гехи 19 мирных чеченцев(Citation: 27)(Citation: 1127)(Citation: 1364).

    19 августа 1996 года, когда Вооружённые силы Ичкерии окружили оккупантов в Грозном, исполнявший обязанности командующего оккупационными войсками Пуликовский дал горожанам 48 часов на выход по единственному «коридору», через пригород Старая Сунжа на востоке, и пригрозил потом бомбить город(Citation: 1260).
    В ночь на 20 августа, до конца срока, оккупанты начали бомбить Грозный и обстреливать его из артиллерии, а днём закрыли «коридор»(Citation: 27)(Citation: 1271).
    Правозащитники «Мемориала» пишут, что мирных горожан, которых оккупанты убили в Грозном с 6 по 22 августа, никто не считал, а журналисты называли число 2000(Citation: 27). 20 августа экипаж российского вертолёта у села Гойты к югу от Грозного обстрелял чеченских беженцев из города, которые ехали в автобусах и легковых машинах, и убил от десяти до двенадцати человек(Citation: 27).

    Правозащитники «Мемориала» пишут, что за всю войну российские военные плохо оповещали чеченцев о «коридорах» или не оповещали вовсе, давали мало времени на выход до обстрела и убивали мирных чеченцев и на выходе по «коридорам»(Citation: 27).

    21 августа 1996 года секретарь Совета безопасности России Лебедь прилетел в Ичкерию и отменил угрозу бомбить Грозный Пуликовского, исполнявшего обязанности командующего оккупационными войсками(Citation: 1127).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
