description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Россия ставила в Ичкерии подконтрольные правительства.

    23 ноября 1994 года Временный совет, марионеточная оппозиция, объявил о создании «Правительства национального возрождения» во главе с Хаджиевым(Citation: 27).
    Российская армия передала Временному совету бронетехнику и вертолёты с экипажами для штурма Грозного, столицы Ичкерии, но 26 ноября Вооружённые силы Ичкерии разбили войска нападавших (подробнее: «Организация переворота»)(Citation: 27).

    17 декабря 1994 года, через шесть дней после открытого вторжения, президент России Ельцин указом № 2200 создал в Ичкерии оккупационное управление во главе с министром России по делам национальностей Егоровым (подробнее: «Установка новой системы управления»)(Citation: 27)(Citation: 985). 26 декабря марионеточная оппозиция объявила «правительство» Хаджиева второй раз.
    «Правительство» заявило, что готово к переговорам с Россией и не требует вывода российских войск(Citation: 27).

    24 октября 1995 года, через две недели после того, как Москва остановила переговоры с руководством Ичкерии, Россия сменила главу марионеточного правительства Хаджиева на Завгаева, последнего руководителя советской власти в Чечено-Ингушетии. 14-17 декабря Россия провела под оккупацией «голосование» и объявила своего ставленника «избранным» главой республики (подробнее: «Имитация народного волеизъявления»)(Citation: 27).

    В конце января 1996 года председатель правительства России Черномырдин написал депутатам российского парламента, что итоги «голосования» показали поддержку Завгаева в республике, и предложил решать войну как спор чеченцев между собой(Citation: 27).

    27 мая 1996 года президент России Ельцин принимал в Кремле делегацию Ичкерии во главе с Зелимханом Яндарбиевым, исполнявшим обязанности президента.
    Россия включила Завгаева в свою делегацию.
    Чеченские переговорщики потребовали, чтобы ставленник Москвы ушёл из-за стола, но российская сторона отказала.
    Россия настаивала, чтобы глава марионеточного правительства подписал договорённость о прекращении огня, и делегация Ичкерии снова воспротивилась.
    Все члены российской делегации, включая Завгаева, подписали документ, как и представители Ичкерии.
    В сюжете корреспондентов НТВ Черкасова, Реброва и Мелихова для программы «Итоги» сказано, что российский ставленник не хотел подписывать никаких договорённостей с Зелимханом Яндарбиевым: «Однако центр [Москва] приказал и регион [марионеточное правительство] ответил „есть“»(Citation: 1134).

    14 июля 1996 года президент России Ельцин указом «О мерах по стабилизации деятельности органов государственной власти Чеченской Республики» объявил, что марионеточный Комитет национального согласия и «Правительство национального возрождения» больше не нужны(Citation: 1160)(Citation: 27).
    Вместо них Москва признала руководством республики «избранного» Завгаева, его правительство, марионеточный парламент и глав районов(Citation: 27)(Citation: 1160).

    Правозащитники «Мемориала» пишут, что российское оккупационное управление на деле контролировало марионеточное правительство(Citation: 27).
    Они пишут об указе № 435, которым президент России Ельцин 31 марта 1996 года обещал прекратить наступление, начать переговоры с Ичкерией и объявить амнистию: «все эти меры рассматривались как вспомогательные в процессе легитимизации [признания законным] марионеточного режима»(Citation: 27).
    Тим Гульдиман, глава миссии Организации по безопасности и сотрудничеству в Европе в Грозном с января 1996 года, писал в 1998 году, что Москва войсками отодвигала Вооружённые силы Ичкерии на юг и использовала правительство Завгаева, чтобы усилить влияние России в Чеченской Республике(Citation: 681).

    31 июля 1996 года на встрече с чеченцами, жившими в Москве, глава марионеточного правительства Завгаев сказал, что Вооружённые силы Ичкерии не контролируют большинство районов республики(Citation: 1266). 6 августа армия Ичкерии атаковала оккупантов в Грозном(Citation: 27). 7 августа Завгаев бежал на базу оккупационных войск в Ханкале, на восточной окраине города(Citation: 1127), а затем покинул Чеченскую Республику(Citation: 1165).
    В конце августа милиционеры марионеточного правительства перешли из своих зданий к российским военным в аэропорт «Северный» севернее столицы(Citation: 1127).
    Защитники освободили Грозный от оккупантов и вынудили Россию сесть за стол переговоров. 31 августа 1996 года Москва подписала с руководством Ичкерии мирные соглашения в Хасавюрте, городе в подконтрольном России Дагестане (подробнее: «Фиктивные договоры»)(Citation: 661).
    До ноября 1996 года колонизатор называл уехавшего Завгаева «главой республики»(Citation: 27)(Citation: 687). 31 декабря 1996 года последние российские войска ушли из Ичкерии. 27 января 1997 года чеченцы избрали президентом Ичкерии Аслана Масхадова(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Russia installed governments under its control in Ichkeria.

    On 23 November 1994 the Provisional Council, a puppet opposition, announced the creation of a "Government of National Revival" headed by Khadzhiyev(Citation: 27).
    The Russian army handed the Provisional Council armored vehicles and helicopters with crews for the storming of Grozny, the capital of Ichkeria, but on 26 November the Armed Forces of Ichkeria routed the attackers' troops (see: "Staging a Coup")(Citation: 27).

    On 17 December 1994, six days after the open invasion, Russian President Yeltsin, by Decree No. 2200, created an occupation administration in Ichkeria headed by Yegorov, the Russian minister for nationalities (see: "Installation of a New System of Governance")(Citation: 27)(Citation: 985).
    On 26 December the puppet opposition announced Khadzhiyev's "government" for the second time.
    The "government" declared that it was ready for talks with Russia and did not demand the withdrawal of Russian troops(Citation: 27).

    On 24 October 1995, two weeks after Moscow halted the talks with the leadership of Ichkeria, Russia replaced Khadzhiyev as head of the puppet government with Zavgayev, the last leader of the Soviet regime in Chechen-Ingushetia.
    On 14-17 December Russia held a "vote" under occupation and declared its protégé the "elected" head of the republic (see: "Sham Expression of Popular Will")(Citation: 27).

    At the end of January 1996 Chernomyrdin, the chairman of the Russian government, wrote to the deputies of the Russian parliament that the results of the "vote" showed support for Zavgayev in the republic, and proposed to resolve the war as a dispute among Chechens themselves(Citation: 27).

    On 27 May 1996 Russian President Yeltsin received in the Kremlin a delegation of Ichkeria headed by Zelimkhan Yandarbiyev, the acting president.
    Russia included Zavgayev in its delegation.
    The Chechen negotiators demanded that Moscow's protégé leave the table, but the Russian side refused.
    Russia insisted that the head of the puppet government sign the ceasefire agreement, and the delegation of Ichkeria objected again.
    All members of the Russian delegation, including Zavgayev, signed the document, as did the representatives of Ichkeria.
    A report by the NTV correspondents Cherkasov, Rebrov and Melikhov for the program "Itogi" says that the Russian protégé did not want to sign any agreements with Zelimkhan Yandarbiyev: "However, the center [Moscow] gave the order and the region [the puppet government] answered 'yes, sir'"(Citation: 1134).

    On 14 July 1996 Russian President Yeltsin, by the decree "On Measures to Stabilize the Activities of the Bodies of State Power of the Chechen Republic", declared that the puppet Committee of National Accord and the "Government of National Revival" were no longer needed(Citation: 1160)(Citation: 27).
    In their place Moscow recognized the "elected" Zavgayev, his government, the puppet parliament and the heads of districts as the leadership of the republic(Citation: 27)(Citation: 1160).

    The human rights defenders of Memorial write that the Russian occupation administration in fact controlled the puppet government(Citation: 27).
    They write about Decree No. 435, by which Russian President Yeltsin on 31 March 1996 promised to halt the offensive, begin talks with Ichkeria and declare an amnesty: "all these measures were regarded as auxiliary in the process of legitimizing [recognizing as lawful] the puppet regime"(Citation: 27).
    Tim Guldimann, the head of the mission of the Organization for Security and Co-operation in Europe in Grozny from January 1996, wrote in 1998 that Moscow pushed the Armed Forces of Ichkeria southward with its troops and used Zavgayev's government to strengthen Russia's influence in the Chechen Republic(Citation: 681).

    On 31 July 1996, at a meeting with Chechens living in Moscow, Zavgayev, the head of the puppet government, said that the Armed Forces of Ichkeria did not control most of the districts of the republic(Citation: 1266).
    On 6 August the army of Ichkeria attacked the occupiers in Grozny(Citation: 27).
    On 7 August Zavgayev fled to the base of the occupation troops in Khankala, on the eastern outskirts of the city(Citation: 1127), and then left the Chechen Republic(Citation: 1165).
    At the end of August the police officers of the puppet government moved from their buildings to the Russian military at the Severny airport to the north of the capital(Citation: 1127).
    The defenders liberated Grozny from the occupiers and forced Russia to the negotiating table.
    On 31 August 1996 Moscow signed peace agreements with the leadership of Ichkeria in Khasavyurt, a town in Russian-controlled Dagestan (see: "Sham Treaties")(Citation: 661).
    Until November 1996 the colonizer called the departed Zavgayev the "head of the republic"(Citation: 27)(Citation: 687).
    On 31 December 1996, the last Russian troops left Ichkeria.
    On 27 January 1997 the Chechens elected Aslan Maskhadov president of Ichkeria(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Росія ставила в Ічкерії підконтрольні уряди.

    23 листопада 1994 року Тимчасова рада, маріонеткова опозиція, оголосила про створення «Уряду національного відродження» на чолі з Хаджиєвим(Citation: 27).
    Російська армія передала Тимчасовій раді бронетехніку й гелікоптери з екіпажами для штурму Грозного, столиці Ічкерії, але 26 листопада Збройні сили Ічкерії розбили війська нападників (докладніше: «Організація перевороту»)(Citation: 27).

    17 грудня 1994 року, через шість днів після відкритого вторгнення, президент Росії Єльцин указом № 2200 створив в Ічкерії окупаційне управління на чолі з міністром Росії у справах національностей Єгоровим (докладніше: «Встановлення нової системи управління»)(Citation: 27)(Citation: 985). 26 грудня маріонеткова опозиція оголосила «уряд» Хаджиєва вдруге.
    «Уряд» заявив, що готовий до переговорів з Росією і не вимагає виведення російських військ(Citation: 27).

    24 жовтня 1995 року, через два тижні після того, як Москва зупинила переговори з керівництвом Ічкерії, Росія змінила главу маріонеткового уряду Хаджиєва на Завгаєва, останнього керівника радянської влади в Чечено-Інгушетії. 14-17 грудня Росія провела під окупацією «голосування» і оголосила свого ставленика «обраним» главою республіки (докладніше: «Імітація народного волевиявлення»)(Citation: 27).

    Наприкінці січня 1996 року голова уряду Росії Чорномирдін написав депутатам російського парламенту, що підсумки «голосування» показали підтримку Завгаєва в республіці, і запропонував вирішувати війну як суперечку чеченців між собою(Citation: 27).

    27 травня 1996 року президент Росії Єльцин приймав у Кремлі делегацію Ічкерії на чолі із Зелімханом Яндарбієвим, який виконував обов'язки президента.
    Росія включила Завгаєва до своєї делегації.
    Чеченські переговірники вимагали, щоб ставленик Москви пішов з-за столу, але російська сторона відмовила.
    Росія наполягала, щоб глава маріонеткового уряду підписав домовленість про припинення вогню, і делегація Ічкерії знову заперечила.
    Усі члени російської делегації, включно із Завгаєвим, підписали документ, як і представники Ічкерії.
    У сюжеті кореспондентів НТВ Черкасова, Реброва і Меліхова для програми «Підсумки» сказано, що російський ставленик не хотів підписувати жодних домовленостей із Зелімханом Яндарбієвим: «Однак центр [Москва] наказав, і регіон [маріонетковий уряд] відповів „є“»(Citation: 1134).

    14 липня 1996 року президент Росії Єльцин указом «Про заходи щодо стабілізації діяльності органів державної влади Чеченської Республіки» оголосив, що маріонетковий Комітет національної злагоди і «Уряд національного відродження» більше не потрібні(Citation: 1160)(Citation: 27).
    Замість них Москва визнала керівництвом республіки «обраного» Завгаєва, його уряд, маріонетковий парламент і глав районів(Citation: 27)(Citation: 1160).

    Правозахисники «Меморіалу» пишуть, що російське окупаційне управління насправді контролювало маріонетковий уряд(Citation: 27).
    Вони пишуть про указ № 435, яким президент Росії Єльцин 31 березня 1996 року обіцяв припинити наступ, почати переговори з Ічкерією та оголосити амністію: «всі ці заходи розглядалися як допоміжні в процесі легітимізації [визнання законним] маріонеткового режиму»(Citation: 27).
    Тім Гульдіман, глава місії Організації з безпеки і співробітництва в Європі в Грозному з січня 1996 року, писав у 1998 році, що Москва військами відтісняла Збройні сили Ічкерії на південь і використовувала уряд Завгаєва, щоб посилити вплив Росії в Чеченській Республіці(Citation: 681).

    31 липня 1996 року на зустрічі з чеченцями, які жили в Москві, глава маріонеткового уряду Завгаєв сказав, що Збройні сили Ічкерії не контролюють більшості районів республіки(Citation: 1266). 6 серпня армія Ічкерії атакувала окупантів у Грозному(Citation: 27). 7 серпня Завгаєв утік на базу окупаційних військ у Ханкалі, на східній околиці міста(Citation: 1127), а потім покинув Чеченську Республіку(Citation: 1165).
    Наприкінці серпня міліціонери маріонеткового уряду перейшли зі своїх будівель до російських військових в аеропорт «Північний» на північ від столиці(Citation: 1127).
    Захисники звільнили Грозний від окупантів і змусили Росію сісти за стіл переговорів. 31 серпня 1996 року Москва підписала з керівництвом Ічкерії мирні угоди в Хасав'юрті, місті в підконтрольному Росії Дагестані (докладніше: «Фіктивні договори»)(Citation: 661).
    До листопада 1996 року колонізатор називав Завгаєва, який виїхав, «главою республіки»(Citation: 27)(Citation: 687). 31 грудня 1996 року останні російські війська пішли з Ічкерії. 27 січня 1997 року чеченці обрали президентом Ічкерії Аслана Масхадова(Citation: 27).
