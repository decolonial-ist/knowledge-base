description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты разрушали города и сёла Ичкерии вместе с жильём, больницами и школами(Citation: 27).

    Российские лётчики и артиллеристы разрушали жилые кварталы бомбёжками и обстрелами (подробнее: «Неизбирательные нападения»)(Citation: 27).
    В захваченных сёлах и городах российские солдаты и милиционеры грабили дома (подробнее: «Мародерство»), а потом поджигали их бензином, сеном или из огнемётов(Citation: 662)(Citation: 655)(Citation: 988).
    После войны 1994-1996 годов без жилья остались 60 тысяч семей Грозного(Citation: 1166).

    Оккупанты разрушали подстанции, срывали линии электропередачи, взрывали газопроводы(Citation: 986)(Citation: 988).

    В декабре 1994 года российская авиация бомбила Грозный, столицу Ичкерии. 9 января 1995 года Ирина из Третьего микрорайона на окраине Грозного рассказала Human Rights Watch в подконтрольной России Ингушетии: «Наш район пострадал первым… то ли 17, то ли 18 декабря, разбомбили три девятиэтажных дома института “Промавтоматика”.
    Люди все стали бездомными»(Citation: 1128).
    В ночь на 20 декабря российские лётчики сбросили две бомбы на квартал одноэтажных домов на пересечении Московской улицы и улицы Ноя Буачидзе и полностью или частично разрушили 18 домов(Citation: 27).
    Российская авиация разбомбила подстанцию, и Грозный остался без света(Citation: 986). 31 декабря 1994 года оккупанты начали штурм города.
    После 20 февраля 1995 года российский спецназ поджигал и взрывал в Грозном дома, уничтожал трубы и линии электропередачи(Citation: 988).
    Через два с лишним месяца после начала штурма, к 6 марта 1995 года, российские войска захватили Грозный. 1 мая 1995 года российская журналистка Евгения Альбац, которая в январе была в городе, сказала на слушаниях комиссии Конгресса США: «Такого города больше нет.
    В Грозном нет ни одного дома, который война так или иначе не разрушила бы»(Citation: 1038).

    3 февраля 1995 года бойцы российского ОМОНа (милицейского спецназа) и внутренних войск МВД России (предшественников современной Росгвардии) обыскивали дома в Петропавловской, станице к северо-востоку от Грозного, и сожгли 14 домов.
    Всего оккупанты разрушили в станице 86 домов(Citation: 988).
    В феврале 1995 года российские лётчики разбомбили в Аргуне, городе к востоку от Грозного, две школы, спортивную школу, больницу и детский сад(Citation: 654).
    В конце марта 1995 года российские войска без боя захватили Гудермес, второй по величине город Ичкерии, а 29 и 30 марта солдаты жгли в нём дома из огнемётов, и на улице Пархоменко целыми остались два дома(Citation: 27)(Citation: 655).
    В апреле 1995 года российские войска месяц обстреливали Аллерой, село на востоке Ичкерии, где жили 4500-5000 человек.
    Оккупанты полностью разрушили ракетами пятую часть домов Аллероя(Citation: 27).

    7 апреля 1995 года внутренние войска МВД России и ОМОН штурмовали Самашки, село на западе Ичкерии.
    Чеченцы в Самашках рассказали наблюдателям российской правозащитной организации «Мемориал», что солдаты и омоновцы жгли дома 8 апреля, когда обыскивали село.
    Российские военные ночевали в школе на Кооперативной улице, а утром подожгли её, и школа выгорела изнутри(Citation: 662). 10 апреля чеченка по фамилии Карнукаева с Рабочей улицы рассказала Наблюдательной миссии российских правозащитных организаций: «Дома сожжены.
    Мне сейчас некуда идти.
    Я голодная, холодная осталась на улице с 4 детьми»(Citation: 662).
    Сотрудник «Мемориала» Виктор Лозинский с 18 апреля по 1 мая 1995 года осматривал сожжённые дома Самашек.
    В феврале 1996 года он рассказал общественному трибуналу российского фонда «Гласность»: «Село планомерно выжигалось.
    Дома поджигались так: разбивалось стекло прикладом и на подоконник просто клали ветошь [тряпки], пропитанную какой-нибудь соляркой, и ее поджигали»(Citation: 986).
    Наблюдательная миссия опубликовала составленный администрацией Самашек список 198 дворов, где оккупанты полностью разрушили хотя бы один дом, и в 155 из них сгорели почти все дома(Citation: 662).
    Правозащитники «Мемориала» пишут, что российские военные и сотрудники МВД сожгли большинство домов в селе намеренно(Citation: 27).

    С 30 сентября 1995 года до марта 1996 года российские внутренние войска и милиция держали в кольце Серноводск, село на западе Ичкерии, срывали у села линии электропередачи и несколько раз взрывали газопровод (подробнее: «Транспортная блокада»)(Citation: 988).
    В декабре 1995 года, после того как Вооружённые силы Ичкерии освободили Гудермес, российские войска обстреливали и бомбили город.
    По словам беженцев и оценкам журналистов, оккупанты разрушили или повредили около 40 процентов зданий Гудермеса(Citation: 656).

    С 3 по 9 марта 1996 года российские войска штурмовали Серноводск, сожгли или разрушили 30 процентов домов села, а российские солдаты из ручных огнемётов поджигали квартиры беженцев на северной окраине села(Citation: 988). 15 марта 1996 года, через 11 месяцев после первого штурма, российские войска снова штурмовали Самашки и разрушили до основания Дом культуры и школу, которую чеченцы отстроили заново.
    Журналисты, которые приехали после штурма, увидели во всем селе только три уцелевших дома(Citation: 988). 3 и 4 апреля 1996 года российские лётчики бомбили Шалажи, село на юго-западе Ичкерии, и разрушили десятки домов, всю верхнюю часть села(Citation: 27)(Citation: 988). 6 апреля 1996 года российские войска захватили Жани-Ведено, горное село из 38 дворов на юго-востоке Ичкерии, из которого чеченцы ушли от обстрелов, и месяц никого к нему не подпускали.
    Когда российские военные ушли, в селе остался один целый дом, а на месте большинства домов наблюдатель «Мемориала» нашёл пепелища без следов снарядов и бомб(Citation: 27).
    С 9 по 11 июля 1996 года российская артиллерия обстреливала, а авиация бомбила Гехи, село к юго-западу от Грозного.
    Корреспондент московской газеты «Известия» писал, что оккупанты уничтожили больше трети села(Citation: 27)(Citation: 1364).
    В ночь на 11 июля российские артиллеристы обстреливали Махкеты, горное село на юго-востоке Ичкерии, из реактивных систем залпового огня «Град» и «Ураган», которые не могут бить прицельно, и уничтожили 150 домов(Citation: 27)(Citation: 1364).
    С 6 по 22 августа 1996 года российские войска обстреливали Грозный из тяжёлой артиллерии и бомбили его, а 21 августа российские лётчики сбросили на кварталы пятиэтажек на улицах Сайханова и Ульянова зажигательные бомбы, от которых дома выгорели изнутри(Citation: 27).
    В бюллетене Международного комитета Красного Креста от 2 сентября 1996 года сказано, что после августовских ударов все 80 тысяч человек в Грозном остались без электричества и медицинской помощи: все больницы города были разрушены или сильно повреждены(Citation: 1407).

    26 июля 1995 года Комитет ООН по правам человека в замечаниях о России выразил сожаление, что российские вооружённые силы разрушали школы, больницы и другие гражданские здания(Citation: 736).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers destroyed the towns and villages of Ichkeria together with their housing, hospitals and schools(Citation: 27).

    Russian pilots and artillerymen destroyed residential neighborhoods with bombing and shelling (see: "Indiscriminate Attacks")(Citation: 27).
    In captured villages and towns, Russian soldiers and police officers looted houses (see: "Pillage") and then set them on fire with gasoline, hay or flamethrowers(Citation: 662)(Citation: 655)(Citation: 988).
    After the war of 1994-1996, 60,000 families of Grozny were left without housing(Citation: 1166).

    The occupiers destroyed substations, tore down power lines and blew up gas pipelines(Citation: 986)(Citation: 988).

    In December 1994, Russian aviation bombed Grozny, the capital of Ichkeria.
    On 9 January 1995, Irina from the Third Microdistrict on the outskirts of Grozny told Human Rights Watch in Russian-controlled Ingushetia: "Our region was the first to suffer… either December 17th or 18th, three nine-story apartment buildings of the institute 'Promavtomatika' were bombed out.
    People all become homeless"(Citation: 1128).
    On the night of 20 December, Russian pilots dropped two bombs on a block of one-story houses at the intersection of Moskovskaya Street and Noya Buachidze Street and completely or partially destroyed 18 houses(Citation: 27).
    Russian aviation bombed a substation, and Grozny was left without electricity(Citation: 986).
    On 31 December 1994, the occupiers began the assault on the city.
    After 20 February 1995, Russian special forces set fire to and blew up houses in Grozny and destroyed pipes and power lines(Citation: 988).
    More than two months after the start of the assault, by 6 March 1995, Russian troops had captured Grozny.
    On 1 May 1995, the Russian journalist Yevgenia Albats, who had been in the city in January, said at a hearing of a commission of the US Congress: "There is no such city any more.
    There isn't a single house in Grozny that hasn't been destroyed one way or another by the war"(Citation: 1038).

    On 3 February 1995, soldiers of the Russian OMON (police special forces) and of the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) searched houses in Petropavlovskaya, a stanitsa northeast of Grozny, and burned 14 houses.
    In all, the occupiers destroyed 86 houses in the stanitsa(Citation: 988).
    In February 1995, Russian pilots bombed two schools, a sports school, a hospital and a kindergarten in Argun, a town east of Grozny(Citation: 654).
    At the end of March 1995, Russian troops captured Gudermes, the second-largest city of Ichkeria, without a fight, and on 29 and 30 March soldiers burned houses in it with flamethrowers; on Parkhomenko Street two houses were left intact(Citation: 27)(Citation: 655).
    In April 1995, Russian troops shelled for a month Alleroy, a village in the east of Ichkeria with 4,500-5,000 inhabitants.
    The occupiers completely destroyed a fifth of the houses of Alleroy with rockets(Citation: 27).

    On 7 April 1995, the Internal Troops of the Russian Ministry of Internal Affairs and the OMON stormed Samashki, a village in the west of Ichkeria.
    Chechens in Samashki told observers of the Russian human rights organization "Memorial" that the soldiers and OMON men burned houses on 8 April, when they were searching the village.
    Russian servicemen spent the night in the school on Kooperativnaya Street, and in the morning set it on fire, and the school burned out from the inside(Citation: 662).
    On 10 April, a Chechen woman named Karnukayeva from Rabochaya Street told the Observer Mission of Russian human rights organizations: "The houses are burned.
    I have nowhere to go now.
    I am left on the street hungry and cold with 4 children"(Citation: 662).
    Viktor Lozinsky of "Memorial" examined the burned houses of Samashki from 18 April to 1 May 1995.
    In February 1996, he told the public tribunal of the Russian Glasnost Foundation: "The village was being burned out systematically.
    The houses were set on fire like this: a window was broken with a rifle butt, and wiping cloth [rags] soaked in some diesel fuel was simply put on the windowsill and set alight"(Citation: 986).
    The Observer Mission published a list drawn up by the administration of Samashki of 198 yards where the occupiers had completely destroyed at least one house, and in 155 of them almost all the houses had burned down(Citation: 662).
    The human rights defenders of "Memorial" write that the Russian military and officers of the Ministry of Internal Affairs burned most of the houses in the village deliberately(Citation: 27).

    From 30 September 1995 to March 1996, Russian Internal Troops and police kept Sernovodsk, a village in the west of Ichkeria, encircled, tore down the power lines near the village and blew up the gas pipeline several times (see: "Transport Blockade")(Citation: 988).
    In December 1995, after the Armed Forces of Ichkeria had liberated Gudermes, Russian troops shelled and bombed the city.
    According to refugees and journalists' estimates, the occupiers destroyed or damaged about 40 percent of the buildings of Gudermes(Citation: 656).

    From 3 to 9 March 1996, Russian troops stormed Sernovodsk, burned or destroyed 30 percent of the houses of the village, and Russian soldiers set fire to the apartments of refugees on the northern outskirts of the village with hand-held flamethrowers(Citation: 988).
    On 15 March 1996, 11 months after the first assault, Russian troops stormed Samashki again and razed to the ground the House of Culture and the school, which the Chechens had rebuilt.
    Journalists who came after the assault saw only three surviving houses in the whole village(Citation: 988).
    On 3 and 4 April 1996, Russian pilots bombed Shalazhi, a village in the southwest of Ichkeria, and destroyed dozens of houses, the whole upper part of the village(Citation: 27)(Citation: 988).
    On 6 April 1996, Russian troops captured Zhani-Vedeno, a mountain village of 38 yards in the southeast of Ichkeria, from which the Chechens had fled the shelling, and for a month let no one near it.
    When the Russian servicemen left, one intact house remained in the village, and in place of most of the houses an observer of "Memorial" found ashes with no traces of shells or bombs(Citation: 27).
    From 9 to 11 July 1996, Russian artillery shelled and aviation bombed Gekhi, a village southwest of Grozny.
    A correspondent of the Moscow newspaper Izvestia wrote that the occupiers had destroyed more than a third of the village(Citation: 27)(Citation: 1364).
    On the night of 11 July, Russian artillerymen shelled Makhkety, a mountain village in the southeast of Ichkeria, with the Grad and Uragan multiple rocket launchers, which cannot fire with precision, and destroyed 150 houses(Citation: 27)(Citation: 1364).
    From 6 to 22 August 1996, Russian troops shelled Grozny with heavy artillery and bombed it, and on 21 August Russian pilots dropped incendiary bombs on the blocks of five-story buildings on Saikhanov and Ulyanov Streets, from which the buildings burned out from the inside(Citation: 27).
    The bulletin of the International Committee of the Red Cross of 2 September 1996 says that after the August strikes all 80,000 people in Grozny were left without electricity and medical care: all the hospitals of the city were destroyed or badly damaged(Citation: 1407).

    On 26 July 1995, the UN Human Rights Committee, in its comments on Russia, expressed regret that the Russian armed forces had destroyed schools, hospitals and other civilian buildings(Citation: 736).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти руйнували міста і села Ічкерії разом із житлом, лікарнями та школами(Citation: 27).

    Російські льотчики та артилеристи руйнували житлові квартали бомбардуваннями й обстрілами (докладніше: «Невибіркові напади»)(Citation: 27).
    У захоплених селах і містах російські солдати та міліціонери грабували будинки (докладніше: «Мародерство»), а потім підпалювали їх бензином, сіном або з вогнеметів(Citation: 662)(Citation: 655)(Citation: 988).
    Після війни 1994-1996 років без житла залишилися 60 тисяч родин Грозного(Citation: 1166).

    Окупанти руйнували підстанції, зривали лінії електропередачі, підривали газопроводи(Citation: 986)(Citation: 988).

    У грудні 1994 року російська авіація бомбила Грозний, столицю Ічкерії. 9 січня 1995 року Ірина з Третього мікрорайону на околиці Грозного розповіла Human Rights Watch у підконтрольній Росії Інгушетії: «Наш район постраждав першим… чи то 17, чи то 18 грудня, розбомбили три дев'ятиповерхові будинки інституту „Промавтоматика“.
    Люди всі стали бездомними»(Citation: 1128).
    У ніч на 20 грудня російські льотчики скинули дві бомби на квартал одноповерхових будинків на перетині Московської вулиці та вулиці Ноя Буачідзе і повністю або частково зруйнували 18 будинків(Citation: 27).
    Російська авіація розбомбила підстанцію, і Грозний залишився без світла(Citation: 986). 31 грудня 1994 року окупанти почали штурм міста.
    Після 20 лютого 1995 року російський спецназ підпалював і підривав у Грозному будинки, нищив труби та лінії електропередачі(Citation: 988).
    Через два з лишком місяці після початку штурму, до 6 березня 1995 року, російські війська захопили Грозний. 1 травня 1995 року російська журналістка Євгенія Альбац, яка в січні була в місті, сказала на слуханнях комісії Конгресу США: «Такого міста більше немає.
    У Грозному немає жодного будинку, який війна так чи інакше не зруйнувала б»(Citation: 1038).

    3 лютого 1995 року бійці російського ОМОНу (міліцейського спецназу) і внутрішніх військ МВС Росії (попередників сучасної Росгвардії) обшукували будинки в Петропавлівській, станиці на північний схід від Грозного, і спалили 14 будинків.
    Усього окупанти зруйнували в станиці 86 будинків(Citation: 988).
    У лютому 1995 року російські льотчики розбомбили в Аргуні, місті на схід від Грозного, дві школи, спортивну школу, лікарню та дитячий садок(Citation: 654).
    У кінці березня 1995 року російські війська без бою захопили Гудермес, друге за величиною місто Ічкерії, а 29 і 30 березня солдати палили в ньому будинки з вогнеметів, і на вулиці Пархоменка цілими залишилися два будинки(Citation: 27)(Citation: 655).
    У квітні 1995 року російські війська місяць обстрілювали Аллерой, село на сході Ічкерії, де жили 4500-5000 людей.
    Окупанти повністю зруйнували ракетами п'яту частину будинків Аллероя(Citation: 27).

    7 квітня 1995 року внутрішні війська МВС Росії та ОМОН штурмували Самашки, село на заході Ічкерії.
    Чеченці в Самашках розповіли спостерігачам російської правозахисної організації «Меморіал», що солдати й омоновці палили будинки 8 квітня, коли обшукували село.
    Російські військові ночували в школі на Кооперативній вулиці, а вранці підпалили її, і школа вигоріла всередині(Citation: 662). 10 квітня чеченка на прізвище Карнукаєва з Робочої вулиці розповіла Спостережній місії російських правозахисних організацій: «Будинки спалені.
    Мені зараз нікуди йти.
    Я голодна, холодна залишилася на вулиці з 4 дітьми»(Citation: 662).
    Співробітник «Меморіалу» Віктор Лозінський з 18 квітня по 1 травня 1995 року оглядав спалені будинки Самашок.
    У лютому 1996 року він розповів громадському трибуналу російського фонду «Гласність»: «Село планомірно випалювали.
    Будинки підпалювали так: розбивали скло прикладом і на підвіконня просто клали ветош [ганчір'я], просочену якоюсь соляркою, і її підпалювали»(Citation: 986).
    Спостережна місія опублікувала складений адміністрацією Самашок список 198 дворів, де окупанти повністю зруйнували хоча б один будинок, і в 155 із них згоріли майже всі будинки(Citation: 662).
    Правозахисники «Меморіалу» пишуть, що російські військові та співробітники МВС спалили більшість будинків у селі навмисно(Citation: 27).

    З 30 вересня 1995 року до березня 1996 року російські внутрішні війська та міліція тримали в кільці Серноводськ, село на заході Ічкерії, зривали біля села лінії електропередачі й кілька разів підривали газопровід (докладніше: «Транспортна блокада»)(Citation: 988).
    У грудні 1995 року, після того як Збройні сили Ічкерії звільнили Гудермес, російські війська обстрілювали й бомбили місто.
    За словами біженців і оцінками журналістів, окупанти зруйнували або пошкодили близько 40 відсотків будівель Гудермеса(Citation: 656).

    З 3 по 9 березня 1996 року російські війська штурмували Серноводськ, спалили або зруйнували 30 відсотків будинків села, а російські солдати з ручних вогнеметів підпалювали квартири біженців на північній околиці села(Citation: 988). 15 березня 1996 року, через 11 місяців після першого штурму, російські війська знову штурмували Самашки і зруйнували до основи Будинок культури та школу, яку чеченці відбудували заново.
    Журналісти, які приїхали після штурму, побачили в усьому селі лише три вцілілі будинки(Citation: 988). 3 і 4 квітня 1996 року російські льотчики бомбили Шалажі, село на південному заході Ічкерії, і зруйнували десятки будинків, усю верхню частину села(Citation: 27)(Citation: 988). 6 квітня 1996 року російські війська захопили Жані-Ведено, гірське село з 38 дворів на південному сході Ічкерії, з якого чеченці пішли від обстрілів, і місяць нікого до нього не підпускали.
    Коли російські військові пішли, у селі залишився один цілий будинок, а на місці більшості будинків спостерігач «Меморіалу» знайшов згарища без слідів снарядів і бомб(Citation: 27).
    З 9 по 11 липня 1996 року російська артилерія обстрілювала, а авіація бомбила Гехі, село на південний захід від Грозного.
    Кореспондент московської газети «Известия» писав, що окупанти знищили понад третину села(Citation: 27)(Citation: 1364).
    У ніч на 11 липня російські артилеристи обстрілювали Махкети, гірське село на південному сході Ічкерії, з реактивних систем залпового вогню «Град» і «Ураган», які не можуть бити прицільно, і знищили 150 будинків(Citation: 27)(Citation: 1364).
    З 6 по 22 серпня 1996 року російські війська обстрілювали Грозний із важкої артилерії та бомбили його, а 21 серпня російські льотчики скинули на квартали п'ятиповерхівок на вулицях Сайханова та Ульянова запалювальні бомби, від яких будинки вигоріли всередині(Citation: 27).
    У бюлетені Міжнародного комітету Червоного Хреста від 2 вересня 1996 року сказано, що після серпневих ударів усі 80 тисяч людей у Грозному залишилися без електрики та медичної допомоги: усі лікарні міста були зруйновані або сильно пошкоджені(Citation: 1407).

    26 липня 1995 року Комітет ООН з прав людини в зауваженнях щодо Росії висловив жаль, що російські збройні сили руйнували школи, лікарні та інші цивільні будівлі(Citation: 736).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
