description:
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Russia presented its attacks as a forced response and shifted the blame for the war onto Ichkeria.

    Russian President Yeltsin, Chernomyrdin, chairman of the government, Defense Minister Grachev and the commanders of the occupation troops declared the offensives of the Russian army a response to attacks and provocations by the army of Ichkeria, and blamed the leadership of Ichkeria for the breakdown of negotiations(Citation: 27).
    The commanders said this to journalists of Russian news agencies, radio and television(Citation: 27)(Citation: 656).

    On the night of 29 November 1994, Russian President Yeltsin declared that the fighting in Ichkeria could not be stopped, and threatened to use all the forces of the state if the army of Ichkeria and the puppet opposition did not lay down their arms within 48 hours(Citation: 1159)(Citation: 1049).
    Russia itself had armed the puppet opposition and led it into battle, and on 29 November the Security Council of Russia decided to start the war(Citation: 27).

    On 18 February 1995, during the "ceasefire", Russian artillerymen shelled the positions of the army of Ichkeria near Shali, Argun and Gudermes, towns to the east of Grozny, and the defenders did not return fire (see: "Sham Ceasefire")(Citation: 27).
    On 19 February, the Russian government declared that the army of Ichkeria had attacked Russian units on the southern outskirts of Grozny and wrecked the negotiations(Citation: 27)(Citation: 1345).

    On 7 April 1995, the Internal Troops of the Russian Ministry of Internal Affairs (predecessors of today's Rosgvardia) stormed Samashki, a village in the west of Ichkeria.
    On 7 and 8 April, the occupiers killed 103 peaceful Chechens in the village (see: "Mass Killings of Civilians")(Citation: 662).
    On the evening of 7 April, Russian television channels, citing the military, reported that fighters of the army of Ichkeria had shot the village elders.
    That day, Russian soldiers had fired on the cars in which the elders were travelling, and all eight people survived (see: "Lies about Its Own Actions")(Citation: 662).
    On 1 May 1995, Sergei Kovalyov, a deputy of the Russian parliament, said at a hearing in the US Congress that this report had served as a pretext for a punitive action against the village(Citation: 1038).
    In July 1995, six of the ten deputies of the Russian parliament's commission that investigated the causes of the war wrote in their conclusion that the command of the occupation troops had decided to storm Samashki "after yet another killing of three servicemen (border guards)"(Citation: 662)(Citation: 1303)(Citation: 1418).
    The border guards had been killed in January 1995, three months before the storming, in the neighboring stanitsa of Assinovskaya(Citation: 662).

    After unknown persons made an assassination attempt in Grozny on 6 October 1995 on Romanov, the commander of the occupation troops, Russian President Yeltsin on 9 October and Defense Minister Grachev on 10 October blamed the attempt on supporters of Dzhokhar Dudayev, the president of Ichkeria.
    Russia suspended negotiations with Ichkeria and ordered the troops to resume the offensive(Citation: 27)(Citation: 1349).
    On 14 December, the Armed Forces of Ichkeria liberated Gudermes, the second-largest town of the republic, and the occupiers stormed it until 20 December and killed at least 267 townspeople (see: "Mass Killings of Civilians")(Citation: 27).
    On 26 December, Shkirko, the commander of the occupation troops, stated that whoever opens fire first is to blame for the deaths, and that the fighters of the army of Ichkeria attack first(Citation: 656).

    In January 1996, the Russian government wrote to the UN Secretary-General that Russia had from the very beginning wanted to settle the matter by negotiations, and that supporters of Dzhokhar Dudayev, the president of Ichkeria, were wrecking the peace process with provocations(Citation: 658).
    In late January, Chernomyrdin, chairman of the Russian government, in a letter to deputies of the Russian parliament, blamed the leadership of Ichkeria for the breakdown of negotiations and promised to launch propaganda before new strikes on the republic.
    The head of the government warned that casualties were inevitable, including among peaceful Chechens(Citation: 27).

    On 7 May 1996, the crews of five Russian helicopters fired rockets at Urus-Martan, a town south-west of Grozny where there had been no fighting for a year and a half, and killed five Chechens at the market (see: "Indiscriminate Attacks")(Citation: 27)(Citation: 1278).
    Fatima Ashgerieva, who was travelling by bus to Urus-Martan that day, told the public tribunal of the Russian Glasnost Foundation in Prague in May 1996: "We did not hear a single shot from the direction of Urus-Martan, only shots from the helicopters"(Citation: 988).
    On 10 May, Russian pilots again killed one Chechen in Urus-Martan and seriously wounded eight, among them four children.
    On 12 May, the crews of Russian helicopters killed 20-year-old Khasmagomed Arsemikov and wounded eight women(Citation: 27)(Citation: 988).

    On 12 May 1996, Tikhomirov, the commander of the occupation troops, justified the strike on Urus-Martan on the Vesti program of the RTR television channel: "There was at the same time an attempt to provoke actions by the federal [Russian] troops…
    And at the same time fire at the helicopters.
    Which, of course, provoked retaliatory actions by the federal troops"(Citation: 27).
    On 13 May, officials of the Russian-controlled Urus-Martan district said on the Vremya program of the ORT television channel that there were no armed units in the town and that no one had fired at the Russian helicopters(Citation: 1420).
    On 13, 14 and 17 May, police of the occupation administration and the Russian military searched houses in Urus-Martan but did not find a single fighter of the army of Ichkeria(Citation: 27).

    On 9 July 1996, a month after Russia and Ichkeria agreed on a ceasefire in Nazran, a town in Russian-controlled Ingushetia, the occupiers began a new offensive (see: "Sham Ceasefire")(Citation: 1124).
    On 17 July, while Russian pilots were bombing the surroundings of Shatoy and Vedeno, villages in the mountains in the south of Ichkeria, Chernomyrdin, chairman of the Russian government, stated that Ichkeria had been the first to resort to provocation, contrary to the agreements signed in Moscow and Nazran(Citation: 27).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt, a town in Russian-controlled Dagestan (see: "Sham Treaties")(Citation: 661).
    Three years later, on 21 September 1999, Russian pilots began bombing Grozny, and on 29 September the Russian army invaded the republic again(Citation: 27).
    Russia officially called the new war a "counter-terrorist operation"(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Росія виставляла свої напади вимушеною відповіддю і перекладала на Ічкерію провину за війну.

    Президент Росії Єльцин, голова уряду Черномирдін, міністр оборони Грачов і командувачі окупаційними військами оголошували наступи російської армії відповіддю на напади та провокації армії Ічкерії, а в зриві переговорів звинувачували керівництво Ічкерії(Citation: 27).
    Командувачі говорили це журналістам російських агентств, радіо й телебачення(Citation: 27)(Citation: 656).

    У ніч на 29 листопада 1994 року президент Росії Єльцин оголосив, що зупинити бої в Ічкерії не вдалося, і пригрозив застосувати всі сили держави, якщо армія Ічкерії та маріонеткова опозиція за 48 годин не складуть зброю(Citation: 1159)(Citation: 1049).
    Росія сама озброювала маріонеткову опозицію і вела її в бій, а 29 листопада Рада безпеки Росії вирішила почати війну(Citation: 27).

    18 лютого 1995 року, під час «перемир'я», російські артилеристи обстріляли позиції армії Ічкерії біля Шалі, Аргуна та Гудермеса, міст на схід від Грозного, а захисники вогню у відповідь не вели (докладніше: «Фальшиве перемир'я»)(Citation: 27). 19 лютого уряд Росії оголосив, що армія Ічкерії атакувала російські частини на південній околиці Грозного і зірвала переговори(Citation: 27)(Citation: 1345).

    7 квітня 1995 року внутрішні війська МВС Росії (попередники сучасної Росгвардії) штурмували Самашки, село на заході Ічкерії.
    За 7 і 8 квітня окупанти вбили в селі 103 мирних чеченців (докладніше: «Масові вбивства цивільних»)(Citation: 662).
    Увечері 7 квітня російські телеканали з посиланням на військових повідомили, що бійці армії Ічкерії розстріляли старійшин села.
    Того дня російські солдати обстріляли машини, в яких їхали старійшини, і всі восьмеро людей залишилися живі (докладніше: «Брехня про власні дії»)(Citation: 662). 1 травня 1995 року Сергій Ковальов, депутат російського парламенту, сказав на слуханнях у Конгресі США, що це повідомлення стало приводом для каральної акції проти села(Citation: 1038).
    У липні 1995 року шестеро з десяти депутатів комісії російського парламенту, яка розслідувала причини війни, написали у висновку, що командування окупаційними військами вирішило штурмувати Самашки «після чергового вбивства трьох військовослужбовців (прикордонників)»(Citation: 662)(Citation: 1303)(Citation: 1418).
    Прикордонників убили в січні 1995 року, за три місяці до штурму, в сусідній станиці Ассиновській(Citation: 662).

    Після того як 6 жовтня 1995 року невідомі вчинили в Грозному замах на командувача окупаційними військами Романова, президент Росії Єльцин 9 жовтня і міністр оборони Грачов 10 жовтня звинуватили в замаху прихильників Джохара Дудаєва, президента Ічкерії.
    Росія призупинила переговори з Ічкерією і наказала військам відновити наступ(Citation: 27)(Citation: 1349). 14 грудня Збройні сили Ічкерії звільнили Гудермес, друге за величиною місто республіки, а окупанти штурмували його до 20 грудня і вбили не менше 267 городян (докладніше: «Масові вбивства цивільних»)(Citation: 27). 26 грудня командувач окупаційними військами Шкірко заявив, що в загибелі людей винен той, хто першим відкриває вогонь, а першими нападають бійці армії Ічкерії(Citation: 656).

    У січні 1996 року уряд Росії написав Генеральному секретареві ООН, що Росія від самого початку хотіла вирішити справу переговорами, а прихильники Джохара Дудаєва, президента Ічкерії, провокаціями зривають мирний процес(Citation: 658).
    Наприкінці січня голова уряду Росії Черномирдін у листі депутатам російського парламенту звинуватив у зриві переговорів керівництво Ічкерії та пообіцяв перед новими ударами по республіці розгорнути пропаганду.
    Глава уряду попередив, що жертви неминучі, зокрема серед мирних чеченців(Citation: 27).

    7 травня 1996 року екіпажі п'яти російських гелікоптерів ударили ракетами по Урус-Мартану, місту на південний захід від Грозного, де півтора року не було боїв, і вбили на ринку п'ятьох чеченців (докладніше: «Невибіркові напади»)(Citation: 27)(Citation: 1278).
    Фатіма Ашгерієва, яка того дня їхала автобусом до Урус-Мартана, у травні 1996 року розповіла в Празі громадському трибуналу російського фонду «Гласність»: «Жодного пострілу з боку Урус-Мартана ми не чули, тільки постріли з гелікоптерів»(Citation: 988). 10 травня російські льотчики знову вбили в Урус-Мартані одного чеченця і тяжко поранили вісьмох, серед них чотирьох дітей. 12 травня екіпажі російських гелікоптерів убили 20-річного Хасмагомеда Арсемікова і поранили вісьмох жінок(Citation: 27)(Citation: 988).

    12 травня 1996 року командувач окупаційними військами Тихомиров виправдав удар по Урус-Мартану в програмі «Вісті» телеканалу РТР: «Там одночасно була спроба спровокувати дії федеральних [російських] військ…
    І одночасно обстріл гелікоптерів.
    Що, звісно, викликало дії у відповідь федеральних військ»(Citation: 27). 13 травня чиновники Урус-Мартанівського району, підконтрольного Росії, сказали в програмі «Час» телеканалу ОРТ, що в місті немає збройних загонів і ніхто не стріляв по російських гелікоптерах(Citation: 1420). 13, 14 і 17 травня міліціонери окупаційної адміністрації та російські військові обшукували будинки в Урус-Мартані, але не знайшли жодного бійця армії Ічкерії(Citation: 27).

    9 липня 1996 року, через місяць після того як Росія та Ічкерія домовилися про припинення вогню в Назрані, місті в підконтрольній Росії Інгушетії, окупанти почали новий наступ (докладніше: «Фальшиве перемир'я»)(Citation: 1124). 17 липня, коли російські льотчики бомбили околиці Шатоя і Ведено, сіл у горах на півдні Ічкерії, голова уряду Росії Черномирдін заявив, що Ічкерія першою пішла на провокацію всупереч домовленостям, підписаним у Москві та Назрані(Citation: 27).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті, місті в підконтрольному Росії Дагестані (докладніше: «Фіктивні договори»)(Citation: 661).
    Через три роки, 21 вересня 1999 року, російські льотчики почали бомбити Грозний, а 29 вересня російська армія знову вторглася в республіку(Citation: 27).
    Росія офіційно назвала нову війну «контртерористичною операцією»(Citation: 27).
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Россия выставляла свои нападения вынужденным ответом и перекладывала на Ичкерию вину за войну.

    Президент России Ельцин, председатель правительства Черномырдин, министр обороны Грачёв и командующие оккупационными войсками объявляли наступления российской армии ответом на нападения и провокации армии Ичкерии, а в срыве переговоров обвиняли руководство Ичкерии(Citation: 27).
    Командующие говорили это журналистам российских агентств, радио и телевидения(Citation: 27)(Citation: 656).

    В ночь на 29 ноября 1994 года президент России Ельцин объявил, что остановить бои в Ичкерии не удалось, и пригрозил применить все силы государства, если армия Ичкерии и марионеточная оппозиция за 48 часов не сложат оружие(Citation: 1159)(Citation: 1049).
    Россия сама вооружала марионеточную оппозицию и вела её в бой, а 29 ноября Совет безопасности России решил начать войну(Citation: 27).

    18 февраля 1995 года, во время «перемирия», российские артиллеристы обстреляли позиции армии Ичкерии у Шали, Аргуна и Гудермеса, городов к востоку от Грозного, а защитники огня в ответ не вели (подробнее: «Ложное перемирие»)(Citation: 27). 19 февраля правительство России объявило, что армия Ичкерии атаковала российские части на южной окраине Грозного и сорвала переговоры(Citation: 27)(Citation: 1345).

    7 апреля 1995 года внутренние войска МВД России (предшественники современной Росгвардии) штурмовали Самашки, село на западе Ичкерии.
    За 7 и 8 апреля оккупанты убили в селе 103 мирных чеченца (подробнее: «Массовые убийства гражданских»)(Citation: 662).
    Вечером 7 апреля российские телеканалы со ссылкой на военных сообщили, что бойцы армии Ичкерии расстреляли старейшин села.
    В этот день российские солдаты обстреляли машины, в которых ехали старейшины, и все восемь человек остались живы (подробнее: «Ложь о собственных действиях»)(Citation: 662). 1 мая 1995 года Сергей Ковалёв, депутат российского парламента, сказал на слушаниях в Конгрессе США, что это сообщение послужило предлогом для карательной акции против села(Citation: 1038).
    В июле 1995 года шесть из десяти депутатов комиссии российского парламента, которая расследовала причины войны, написали в заключении, что командование оккупационными войсками решило штурмовать Самашки «после очередного убийства трех военнослужащих (пограничников)»(Citation: 662)(Citation: 1303)(Citation: 1418).
    Пограничников убили в январе 1995 года, за три месяца до штурма, в соседней станице Ассиновской(Citation: 662).

    После того как 6 октября 1995 года неизвестные совершили в Грозном покушение на командующего оккупационными войсками Романова, президент России Ельцин 9 октября и министр обороны Грачёв 10 октября обвинили в покушении сторонников Джохара Дудаева, президента Ичкерии.
    Россия приостановила переговоры с Ичкерией и приказала войскам возобновить наступление(Citation: 27)(Citation: 1349). 14 декабря Вооружённые силы Ичкерии освободили Гудермес, второй по величине город республики, а оккупанты штурмовали его до 20 декабря и убили не меньше 267 горожан (подробнее: «Массовые убийства гражданских»)(Citation: 27). 26 декабря командующий оккупационными войсками Шкирко заявил, что в гибели людей виноват тот, кто первым открывает огонь, а первыми нападают бойцы армии Ичкерии(Citation: 656).

    В январе 1996 года правительство России написало Генеральному секретарю ООН, что Россия с самого начала хотела решить дело переговорами, а сторонники Джохара Дудаева, президента Ичкерии, провокациями срывают мирный процесс(Citation: 658).
    В конце января председатель правительства России Черномырдин в письме депутатам российского парламента обвинил в срыве переговоров руководство Ичкерии и пообещал перед новыми ударами по республике развернуть пропаганду.
    Глава правительства предупредил, что жертвы неизбежны, в том числе среди мирных чеченцев(Citation: 27).

    7 мая 1996 года экипажи пяти российских вертолётов ударили ракетами по Урус-Мартану, городу к юго-западу от Грозного, где полтора года не было боёв, и убили на рынке пятерых чеченцев (подробнее: «Неизбирательные нападения»)(Citation: 27)(Citation: 1278).
    Фатима Ашгериева, которая в этот день ехала на автобусе в Урус-Мартан, в мае 1996 года рассказала в Праге общественному трибуналу российского фонда «Гласность»: «Ни одного выстрела со стороны Урус-Мартана мы не слышали, только выстрелы с вертолетов»(Citation: 988). 10 мая российские лётчики снова убили в Урус-Мартане одного чеченца и тяжело ранили восьмерых, среди них четверых детей. 12 мая экипажи российских вертолётов убили 20-летнего Хасмагомеда Арсемикова и ранили восемь женщин(Citation: 27)(Citation: 988).

    12 мая 1996 года командующий оккупационными войсками Тихомиров оправдал удар по Урус-Мартану в программе «Вести» телеканала РТР: «Там одновременно была попытка спровоцировать действия федеральных [российских] войск…
    И одновременно обстрел вертолетов.
    Что, конечно, вызвало ответные действия федеральных войск»(Citation: 27). 13 мая чиновники Урус-Мартановского района, подконтрольного России, сказали в программе «Время» телеканала ОРТ, что в городе нет вооружённых отрядов и никто не стрелял по российским вертолётам(Citation: 1420). 13, 14 и 17 мая милиционеры оккупационной администрации и российские военные обыскивали дома в Урус-Мартане, но не нашли ни одного бойца армии Ичкерии(Citation: 27).

    9 июля 1996 года, через месяц после того как Россия и Ичкерия договорились о прекращении огня в Назрани, городе в подконтрольной России Ингушетии, оккупанты начали новое наступление (подробнее: «Ложное перемирие»)(Citation: 1124). 17 июля, когда российские лётчики бомбили окрестности Шатоя и Ведено, сёл в горах на юге Ичкерии, председатель правительства России Черномырдин заявил, что Ичкерия первой пошла на провокацию вопреки договорённостям, подписанным в Москве и Назрани(Citation: 27).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте, городе в подконтрольном России Дагестане (подробнее: «Фиктивные договоры»)(Citation: 661).
    Через три года, 21 сентября 1999 года, российские лётчики начали бомбить Грозный, а 29 сентября российская армия снова вторглась в республику(Citation: 27).
    Россия официально назвала новую войну «контртеррористической операцией»(Citation: 27).
