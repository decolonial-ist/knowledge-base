    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Российские войска бомбили и обстреливали города Ичкерии, не отличая жилые дома от военных целей(Citation: 27).

    Российская авиация сбрасывала на Ичкерию неуправляемые бомбы и кассетные бомбы с шариками или иглами(Citation: 27).
    Экипажи российских вертолётов стреляли по городам и сёлам неуправляемыми ракетами(Citation: 986)(Citation: 988).
    Оккупационные войска обстреливали жилые кварталы из ствольной артиллерии, миномётов и реактивных систем залпового огня «Град» и «Ураган», которые не могут бить прицельно(Citation: 27).
    В Грозном, столице Ичкерии, российские военные забрасывали жилые дома с людьми глубинными бомбами, которыми топят подводные лодки.
    Такая бомба пробивает десяток бетонных перекрытий и взрывается внутри дома(Citation: 27).

    Оккупанты обстреливали рынки и больницы(Citation: 27).
    Российские войска бомбили сёла перед штурмом, после захвата и во время «перемирий» с Ичкерией (подробнее: «Ложное перемирие»)(Citation: 27).

    Российские лётчики бомбили, а артиллеристы обстреливали города и сёла Ичкерии всю войну, с сентября 1994 года по август 1996 года. 2 сентября 1994 года российские лётчики ударили ракетами по трём сёлам в двадцати километрах от Грозного(Citation: 710)(Citation: 1338). 23 ноября лётчики обстреляли птицефабрику в Шали и ранили семерых мирных чеченцев(Citation: 1339). 25 ноября лётчики ударили по аэропорту Грозного и жилым домам рядом и, по разным данным, убили троих или шестерых человек(Citation: 1087)(Citation: 1059). 26 ноября, когда российские танкисты штурмовали Грозный, лётчики обстреливали город.
    По данным агентства «Чеченпресс», танкисты и лётчики убили от 25 до 39 мирных людей(Citation: 1158)(Citation: 1424)(Citation: 2375). 29 ноября лётчики обстреляли ракетами аэропорт и центр Грозного и, по данным Департамента государственной безопасности Ичкерии, убили 14 человек(Citation: 1340)(Citation: 1159). 30 ноября российская авиация дважды бомбила Грозный и, по словам советника президента Ичкерии, убила до 80 человек(Citation: 1087)(Citation: 1415). 3 декабря 1994 года российский лётчик сбросил бомбу на пятиэтажный жилой дом в Аргуне, городе к востоку от Грозного, но бомба пробила стену и не взорвалась(Citation: 986). 12 декабря российские лётчики с вертолётов и самолётов бомбили жилые кварталы Долинского, посёлка к северо-западу от Грозного(Citation: 26)(Citation: 27). 13 декабря лётчики обстреляли четыре машины с беженцами у села Новый Шарой на западе Ичкерии и убили троих беженцев(Citation: 27)(Citation: 986).

    С 18 декабря 1994 года российская авиация бомбила Грозный, а с 19 декабря до штурма 31 декабря - каждый день(Citation: 27).
    Командующий российской военной авиацией Дейнекин 21 марта 1995 года сказал в интервью газете «Московский комсомолец», что до 29 декабря из-за плохой погоды лётчики не могли применять над городом бомбы и ракеты с лазерным или телевизионным наведением.
    Российские лётчики сбрасывали на город неуправляемые бомбы сквозь облака с высоты пяти-семи километров, когда, по словам командующего, «землю вообще не видно»(Citation: 27).
    В январе и феврале 1995 года российские войска обстреливали жилые кварталы Грозного из ствольной артиллерии и реактивных систем залпового огня, а лётчики бомбили город.
    Андрей Миронов, российский правозащитник, который прожил в Грозном три месяца, в феврале 1996 года рассказал в Москве общественному трибуналу российского фонда «Гласность»: «И вот закончился обстрел, выходишь из дома и видишь: тут трупы, там трупы.
    Лежат старики.
    Рядом санки, на санках фляга с водой».
    Об иглах, которыми оккупанты набивали снаряды и бомбы, правозащитник сказал трибуналу: «Весь Грозный был ими засыпан.
    Эти элементы годятся только для поражения незащищенных людей»(Citation: 986).
    Правозащитники «Мемориала» пишут, что российские лётчики осознанно бомбили Грозный не целясь и такие удары неизбежно убивали много горожан.
    По оценке Наблюдательной миссии российских правозащитных организаций, с декабря 1994 года по март 1995 года оккупанты убили в городе 25-29 тысяч мирных людей (подробнее: «Массовые убийства гражданских»)(Citation: 27).

    В ночь на 21 декабря 1994 года российские артиллеристы попали снарядом в дом в Новоартёмово, селе близ Грозного, и убили пятерых детей.
    Ещё две чеченские девочки из этого дома умерли от ран в больнице(Citation: 27). 24 декабря в морге Центральной республиканской больницы Грозного лежали 19 неопознанных тел горожан, которых убили российские лётчики(Citation: 27).
    С 26 по 28 декабря 1994 года российская авиация бомбила около 40 сёл(Citation: 27). 29 декабря в морг Центральной республиканской больницы привезли тела двоих детей, двух женщин и ещё четверых человек, которых российские артиллеристы убили при обстреле окраин Грозного(Citation: 27).

    3 января 1995 года российские лётчики обстреляли автобусную остановку у Старых Атагов, села к югу от Грозного, и убили там водителя стоявшего рядом грузовика и ещё нескольких человек(Citation: 654).
    В этот день российская авиация сбросила кассетные бомбы на базар, больницу и автомобильный рынок Шали(Citation: 27)(Citation: 986).
    По подсчётам правозащитника Андрея Миронова, одной бомбой на автомобильном рынке лётчики убили от 130 до 160 человек(Citation: 986). 31 января артиллеристы обстреляли Самашки и убили на улице Чапаева четверых человек. 2 февраля артиллеристы попали из миномёта в один двор на этой улице и убили утром женщину и 14-летнюю девочку, а днём - троих человек на похоронах(Citation: 662). 11 или 12 марта 1995 года лётчики бомбили улицу Моздокскую в Шали и разрушили на ней 68 домов(Citation: 27). 22-23 марта экипаж российского вертолёта обстрелял грузовик с беженцами у села Мескер-Юрт близ Шали и убил водителя и пассажира(Citation: 27). 26 марта экипажи шести российских вертолётов обстреляли ракетами Самашки и тяжело ранили четверых человек(Citation: 662). 6 апреля артиллеристы обстреляли из «Града» и ракетами Ники-Хиту, горное село на юго-востоке Ичкерии, и убили двоих чеченских детей(Citation: 27)(Citation: 739). 24 апреля 1995 года лётчики бомбили Ножай-Юрт, село на юго-востоке республики, где не было бойцов армии Ичкерии, и убили четверых чеченцев(Citation: 739)(Citation: 655).
    По данным международной организации «Врачи без границ», за 15 дней до 27 мая 1995 года в больницу Шатоя, горного села на юге Ичкерии, привезли 74 человека, которых ранили российские лётчики(Citation: 1381). 8 октября 1995 года российские лётчики бомбили Рошни-Чу, село к юго-западу от Грозного, и, по словам сельчан, убили 28 человек - мирных чеченцев и бойцов армии Ичкерии(Citation: 1435)(Citation: 27).
    С 14 по 20 декабря 1995 года российские войска обстреливали и бомбили жилые кварталы, больницы и мечеть Гудермеса, второго по величине города Ичкерии(Citation: 27).
    Командующий оккупационными войсками Шкирко назвал 267 мирных людей, убитых в Гудермесе(Citation: 27)(Citation: 656).

    С 11 по 20 февраля 1996 года российские войска обстреливали Новогрозненский, посёлок на востоке Ичкерии, и, по данным агентства Agence France-Presse, убили не меньше 50 мирных чеченцев(Citation: 27).
    Яромир Штетина, корреспондент чешского агентства «Эпицентум», на пресс-конференции спросил командующего оккупационной армией Тихомирова, знает ли генерал о мирных людях в посёлке.
    Командующий ответил журналисту: «Мы не можем установить разницу между боевиком [так россияне называли бойцов Вооружённых сил Ичкерии] и гражданским жителем»(Citation: 988).
    До первых чисел марта 1996 года артиллеристы разрушали сёла Аллерой и Центорой, куда были вынуждены отступить защитники посёлка, и продолжали обстрелы после того, как защитники ушли оттуда.
    Артиллеристы убили в этих сёлах мирных чеченцев(Citation: 27).
    С 3 по 9 марта артиллеристы обстреливали Серноводск, село на западе Ичкерии, и убили не меньше 45 мирных людей(Citation: 27).
    С 6 по 8 марта, когда Вооружённые силы Ичкерии освободили большую часть Грозного, российские войска обстреливали жилые кварталы города, а после ухода защитников ещё несколько дней - его южные районы.
    По данным военной прокуратуры России, за 6-11 марта в Грозном погибли 250 мирных людей(Citation: 1127)(Citation: 27).

    В ночь на 14 марта 1996 года российские войска окружили Самашки, село на западе Ичкерии, где жили около 12 000 человек. 15 марта российские военные дали чеченцам в селе два часа на выход перед штурмом, и около половины из них не успели уйти (подробнее: «Ложный коридор»).
    В 10:16 российские войска начали обстреливать Самашки из бронетранспортёров, танков, ствольной артиллерии и миномётов, с вертолётов и самолётов, а оставшиеся в селе чеченцы прятались в подвалах(Citation: 27).
    Виктор Курочкин, депутат российского парламента, 24 апреля 1996 года в Москве рассказал трибуналу «Гласности»: «Там работало восемь или десять "Ураганов" [реактивных систем залпового огня], — а это самое страшное оружие для населенных пунктов»(Citation: 988).
    Правозащитник Андрей Миронов 17 марта был в Слепцовской, станице в подконтрольной России Ингушетии, и 20 апреля рассказал трибуналу: «Я считал взрывы.
    Сначала это был один взрыв в секунду, потом больше.
    Дней шесть село обстреливалось.
    Из них примерно пять дней — один взрыв в секунду или немного чаще (1-2 взрыва в секунду), то есть не менее 70 тысяч снарядов в сутки»(Citation: 988).
    К 19 марта, когда российские войска открыли выход из окружения, оккупанты разрушили в Самашках почти все дома(Citation: 27).
    Источники расходятся в числе мирных чеченцев, которых оккупанты убили в селе во время штурма: 35 по списку сельчан(Citation: 27) или около 600 по словам врача, которая лечила людей в Самашках(Citation: 1127)(Citation: 988).

    28 марта 1996 года российский лётчик сбросил две бомбы на Катыр-Юрт, село к юго-западу от Грозного, и убил девять человек из семьи Хажгириевых, среди них двух беременных женщин и четверых детей(Citation: 27)(Citation: 988). 3 и 4 апреля 1996 года лётчики бомбили Шалажи, село к юго-западу от Грозного, и убили троих чеченцев(Citation: 27)(Citation: 988). 25 апреля 1996 года лётчики бомбили окружённый российскими войсками Шали, где оставались около 50 тысяч мирных людей(Citation: 1395).
    Лётчики убили мирных чеченцев, а ранили, по словам главы Шалинского района агентству «Интерфакс», 29 человек(Citation: 27).
    В этот день российская авиация бомбила Чишки, горное село к югу от Грозного, и убила одну чеченку(Citation: 27). 7 мая экипажи пяти российских вертолётов ударили по Урус-Мартану, городу к юго-западу от Грозного, и убили на рынке пятерых чеченцев(Citation: 27)(Citation: 1278). 10 и 12 мая экипажи вертолётов снова обстреляли город и оба раза убили по одному человеку(Citation: 27)(Citation: 988).

    В июле 1996 года российские войска обстреливали и бомбили Гехи, село к юго-западу от Грозного, и, по данным газеты «Известия», убили 19 мирных чеченцев(Citation: 27)(Citation: 1364).
    Артиллеристы обстреливали из «Града» и «Урагана» Махкеты, горное село Веденского района на юго-востоке Ичкерии, и к 15 июля убили там 25 мирных чеченцев(Citation: 27)(Citation: 1127)(Citation: 1364). 15 июля экипажи семи российских вертолётов разрушили ракетами шесть домов в Старых Атагах (подробнее: «Коллективные наказания»)(Citation: 1127)(Citation: 1363).
    В июле 1996 года, обстреливая Дарго, Белгатой, Ведено и другие сёла Веденского района, российские войска убили не меньше 30 чеченцев(Citation: 1127).
    С 20 июля до первых чисел августа 1996 года российские лётчики непрерывно бомбили сёла пяти районов на юге республики(Citation: 27).

    В августе 1996 года, когда армия Ичкерии атаковала оккупантов в Грозном, российские лётчики бомбили город, хотя низкая облачность не давала им целиться(Citation: 27).
    По оценке журналистов, с 6 по 22 августа 1996 года оккупанты убили в Грозном около 2000 мирных горожан.
    Правозащитники «Мемориала» пишут, что никто не вёл точного подсчёта(Citation: 27). 7 августа лётчики разрушили хирургическое отделение 4-й городской больницы и убили семерых медицинских работников(Citation: 27). 14 августа экипаж российского вертолёта в пяти километрах от Грозного обстрелял легковые машины с мирными людьми и убил не меньше четырёх человек, среди них двоих детей(Citation: 1273).
    В этот день российские лётчики бомбили Комсомольское, село к северо-востоку от Грозного, и убили девять чеченцев(Citation: 1274). 17 августа 1996 года солдаты 101-й бригады внутренних войск МВД России (предшественники современной Росгвардии) стреляли из автоматов, пулемётов бронемашин и миномётов по жилым домам у «15-го городка», своей базы в Грозном, и убили четверых человек(Citation: 921).
    С 19 по 21 августа российские артиллеристы обстреливали в Грозном Черноречье, южный район города(Citation: 27), улицу Грибоедова(Citation: 27) и площадь Минутка(Citation: 1127), а 20 августа выпустили по городу 60 ракет «Града»(Citation: 27)(Citation: 1127).
    В Черноречье 19 августа артиллеристы убили пожилую женщину(Citation: 27). 21 августа лётчики сбросили с большой высоты зажигательные бомбы на пятиэтажки на улицах Сайханова и Ульянова, где не было бойцов армии Ичкерии(Citation: 1127)(Citation: 27).
    Дома выгорели изнутри, а люди, которые прятались в подвалах, выжили(Citation: 27).

    Правозащитники «Мемориала» пишут, что стрельба без разбора целей была одной из основных черт действий российских военных всю войну и что от бомбёжек и обстрелов больше всего страдали мирные люди(Citation: 27). 25 января 1996 года специальный докладчик ООН по казням без суда написал в докладе Комиссии ООН по правам человека, что российские военные убили тысячи граждан Ичкерии, в том числе когда намеренно и без разбора обстреливали жилые кварталы из тяжёлого оружия и бомбили их(Citation: 739).
    Неизвестно, сколько таких преступлений совершили оккупационные войска с сентября 1994 года по август 1996 года.

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
