description:
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers destroyed the museums, research institutes and ancient monuments of the Chechens.

    During the storming of Grozny, Russian artillerymen shelled, and pilots bombed, the center of the city, where the museums and research institutes of Ichkeria stood(Citation: 27)(Citation: 988).
    Russian pilots fired rockets at ancient towers and settlements in the mountains in the south of Ichkeria(Citation: 988).
    The occupiers occupied the ruins of museums and looted what had survived (see: "Theft of Cultural Property")(Citation: 988).
    Russian troops burned almost the entire Central State Archive of the Chechen Republic and the republican libraries in Grozny (see: "Burning of Books and Archives")(Citation: 27).
    Soldiers of the occupation troops destroyed mosques and leveled ancient burial mounds (see: "Destruction of Shrines and Necropolises")(Citation: 988).

    In January 1995, Russian troops destroyed the Chechen National Museum in Grozny.
    The museum held about 320 thousand exhibits, among them archaeological finds of the ancient and medieval Caucasus, traditional Chechen clothing and old manuscripts(Citation: 27)(Citation: 988).
    The museum's director Isa Adayev told the public tribunal of the Russian Glasnost Foundation in Prague in May 1996: "From 1 to 4 January 1995, the museum building was shelled quite deliberately from several directions".
    When the director got to the museum on 7 January, "it was no longer a museum — nothing was left of it — only ruins".
    On 18 January, Russian special forces seized the ruins(Citation: 988).
    Khotin, deputy director of the museum center of the Russian Ministry of Culture, who inspected the ruins of the museum in late March 1995, told the public tribunal of the Glasnost Foundation in Moscow in February 1996: "The nature of the destruction shows that barrage fire was used there.
    Next to the museum there is a small park of about 50 fairly old trees.
    Well, all those trees are cut in half.
    All of them!"(Citation: 986).

    In early 1995, the occupiers destroyed in Grozny the Research Institute of the Humanities of the Chechen Republic, founded in 1907(Citation: 27).
    In 1995, Russian pilots fired rockets at and bombed Kogo-Maista, an old settlement in the mountains in the south of Ichkeria, far from the fighting.
    In the strikes, the occupiers destroyed six towers that had stood for thirteen centuries, killed the Chechen boy Deni Murtazov and wounded a woman of his family so badly that she became disabled(Citation: 988).

    The human rights defenders of "Memorial" write that Russian troops destroyed or irreparably damaged in Grozny the university, the pedagogical and petroleum institutes, and the geological museum.
    In "Memorial's" assessment, Russian troops did not take the rescue of cultural property into account and inflicted irreparable damage on the culture of the Chechen people(Citation: 27).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти руйнували музеї, наукові інститути та давні пам'ятки чеченців.

    Під час штурму Грозного російські артилеристи обстрілювали, а льотчики бомбили центр міста, де стояли музеї та наукові інститути Ічкерії(Citation: 27)(Citation: 988).
    Російські льотчики обстрілювали ракетами давні вежі та поселення в горах на півдні Ічкерії(Citation: 988).
    Окупанти займали руїни музеїв і грабували вціліле (докладніше: «Крадіжка культурних цінностей»)(Citation: 988).
    Російські війська спалили в Грозному майже весь Центральний державний архів Чеченської Республіки та республіканські бібліотеки (докладніше: «Спалення книг та архівів»)(Citation: 27).
    Солдати окупаційних військ руйнували мечеті та зрівнювали із землею давні поховальні кургани (докладніше: «Знищення святинь і некрополів»)(Citation: 988).

    У січні 1995 року російські війська знищили Чеченський національний музей у Грозному.
    Музей зберігав близько 320 тисяч експонатів, серед них археологічні знахідки давнього та середньовічного Кавказу, традиційний чеченський одяг і старовинні рукописи(Citation: 27)(Citation: 988).
    Директор музею Іса Адаєв у травні 1996 року розповів громадському трибуналу російського фонду «Гласність» у Празі: «З 1 по 4 січня 1995 року велися досить цілеспрямовані обстріли будівлі музею з кількох боків».
    Коли 7 січня директор потрапив до музею, «це був уже не музей — від нього нічого не залишилося — тільки руїни». 18 січня російський спецназ захопив руїни(Citation: 988).
    Заступник директора музейного центру міністерства культури Росії Хотін, який наприкінці березня 1995 року оглядав руїни музею, у лютому 1996 року розповів громадському трибуналу фонду «Гласність» у Москві: «Характер руйнувань свідчить про те, що там застосовували шквальний вогонь.
    Поруч із музеєм є невеликий парк, що складається приблизно з 50 досить старих дерев.
    Так от усі ці дерева зрізані наполовину.
    Усі!»(Citation: 986).

    На початку 1995 року окупанти знищили в Грозному Науково-дослідний інститут гуманітарних наук Чеченської Республіки, заснований 1907 року(Citation: 27).
    У 1995 році російські льотчики обстрілювали ракетами й бомбили Кого-Майсту, старовинне селище в горах на півдні Ічкерії, далеко від боїв.
    Під час обстрілу окупанти зруйнували шість веж, які простояли тринадцять століть, убили чеченського хлопчика Дені Муртазова й поранили жінку з його сім'ї так, що вона стала інвалідом(Citation: 988).

    Правозахисники «Меморіалу» пишуть, що російські війська зруйнували або непоправно пошкодили в Грозному університет, педагогічний і нафтовий інститути, геологічний музей.
    За оцінкою «Меморіалу», російські війська не брали до уваги порятунок культурних цінностей і завдали культурі чеченського народу непоправної шкоди(Citation: 27).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты разрушали музеи, научные институты и древние памятники чеченцев.

    При штурме Грозного российские артиллеристы обстреливали, а лётчики бомбили центр города, где стояли музеи и научные институты Ичкерии(Citation: 27)(Citation: 988).
    Российские лётчики обстреливали ракетами древние башни и поселения в горах на юге Ичкерии(Citation: 988).
    Оккупанты занимали руины музеев и грабили уцелевшее (подробнее: «Кража культурных ценностей»)(Citation: 988).
    Российские войска сожгли в Грозном почти весь Центральный государственный архив Чеченской Республики и республиканские библиотеки (подробнее: «Сожжение книг и архивов»)(Citation: 27).
    Солдаты оккупационных войск разрушали мечети и сравнивали с землёй древние погребальные курганы (подробнее: «Уничтожение святынь и некрополей»)(Citation: 988).

    В январе 1995 года российские войска уничтожили Чеченский национальный музей в Грозном.
    Музей хранил около 320 тысяч экспонатов, среди них археологические находки древнего и средневекового Кавказа, традиционную чеченскую одежду и старинные рукописи(Citation: 27)(Citation: 988).
    Директор музея Иса Адаев в мае 1996 года рассказал общественному трибуналу российского фонда «Гласность» в Праге: «С 1 по 4 января 1995 года велись достаточно целенаправленные обстрелы здания музея с нескольких сторон».
    Когда 7 января директор попал в музей, «это был уже не музей — от него ничего не осталось — только руины». 18 января российский спецназ захватил развалины(Citation: 988).
    Заместитель директора музейного центра министерства культуры России Хотин, который в конце марта 1995 года осматривал руины музея, в феврале 1996 года рассказал общественному трибуналу фонда «Гласность» в Москве: «Характер разрушений говорит о том, что там использовался шквальный огонь.
    Рядом с музеем находится небольшой парк, состоящий примерно из 50 довольно старых деревьев.
    Так вот все эти деревья срезаны наполовину.
    Все!»(Citation: 986).

    В начале 1995 года оккупанты уничтожили в Грозном Научно-исследовательский институт гуманитарных наук Чеченской Республики, основанный в 1907 году(Citation: 27).
    В 1995 году российские лётчики обстреливали ракетами и бомбили Кого-Майсту, старинное селение в горах на юге Ичкерии, вдали от боёв.
    При обстреле оккупанты разрушили шесть башен, которые простояли тринадцать веков, убили чеченского мальчика Дени Муртазова и ранили женщину из его семьи так, что она стала инвалидом(Citation: 988).

    Правозащитники «Мемориала» пишут, что российские войска разрушили или непоправимо повредили в Грозном университет, педагогический и нефтяной институты, геологический музей.
    По оценке «Мемориала», российские войска не принимали в расчёт спасение культурных ценностей и нанесли культуре чеченского народа непоправимый ущерб(Citation: 27).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
