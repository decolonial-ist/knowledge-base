description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Москва всю войну объявляла вторжение и оккупацию благом для чеченцев.

    30 ноября 1994 года президент России Ельцин подписал секретный указ № 2137 «О мероприятиях по восстановлению конституционной законности и правопорядка на территории Чеченской Республики» (так колонизатор назвал подготовку нападения на Ичкерию)(Citation: 27). 9 декабря президент указом № 2166 поручил российскому правительству применить все средства «для обеспечения… прав и свобод граждан»(Citation: 650).

    27 января 1995 года Ельцин подписал указ № 79 «Об обеспечении условий для воссоздания конституционных органов власти в Чеченской Республике» (подробнее: «Установка новой системы управления»)(Citation: 27)(Citation: 1423). 12 июля 1996 года, на четвёртый день наступления оккупационных войск, президент указом № 1028 назвал конституционными органами правительство, которое Москва поставила в Грозном (подробнее: «Марионеточное правительство»)(Citation: 27)(Citation: 1423)(Citation: 1160).

    11 декабря 1994 года, в день открытого вторжения, Ельцин обратился к гражданам России: «Наша цель состоит в том, чтобы найти политическое решение проблем одного из субъектов Российской Федерации — Чеченской Республики, защитить ее граждан от вооруженного экстремизма».
    Президент России обещал: «Обязываю всех должностных лиц, ответственных за проведение мероприятий по восстановлению в Чеченской Республике конституционного порядка [так Россия называла свою войну против независимой Ичкерии], не применять насилия против мирного населения, взять его под защиту»(Citation: 27).
    Через неделю, с 18 декабря, российские лётчики бомбили Грозный, а с 19 декабря до штурма 31 декабря - каждый день.
    Правозащитники российской организации «Мемориал» пишут: «Бомбы и ракеты падали в основном на кварталы, где располагались жилые дома и заведомо не было военных объектов» (подробнее: «Неизбирательные нападения»)(Citation: 27).
    По оценке Наблюдательной миссии российских правозащитных организаций, с декабря 1994 года по март 1995 года оккупанты убили в Грозном 25-29 тысяч мирных горожан (подробнее: «Массовые убийства гражданских»)(Citation: 27).

    Правительство России 11 января 1996 года ответило Генеральному секретарю ООН на запрос о правах человека в Ичкерии, что крайне сложная обстановка вынудила Москву применить вооружённую силу.
    В ответе сказано, что 29 августа 1995 года Ельцин назначил секретаря Совета безопасности России Лобова своим представителем в Ичкерии, чтобы гарантировать права человека и подготовить свободные выборы (подробнее: «Имитация народного волеизъявления»)(Citation: 658).

    23 апреля 1996 года председатель правительства России Черномырдин заявил на заседании правительственной комиссии по урегулированию войны: «В Уставе ООН также значится понятие «принуждение к миру», и в данном случае оно может быть применено»(Citation: 27).
    Через два дня, 25 апреля, российские лётчики бомбили Шали, город к юго-востоку от Грозного, который оккупационные войска окружили шестью днями раньше (подробнее: «Неизбирательные нападения»).
    Оккупанты убили мирных чеченцев, а 29 человек, по сообщению главы Шалинского района агентству «Интерфакс», ранили(Citation: 27).
    Через 11 дней, 6 мая, российские войска без боя захватили Шали и не нашли там защитников (подробнее: «Коллективные наказания»)(Citation: 27).

    17 июля 1996 года председатель правительства России Черномырдин заявил на заседании правительственной комиссии по урегулированию войны, что за полгода Россия ликвидировала «антиконституционный режим» (так Россия называла правительство Ичкерии), угрожавший её территориальной целостности(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Throughout the war, Moscow declared the invasion and occupation a blessing for the Chechens.

    On 30 November 1994, Russian president Yeltsin signed secret decree No. 2137 "On Measures to Restore Constitutional Legality and Law and Order on the Territory of the Chechen Republic" (that is what the colonizer called the preparation of the attack on Ichkeria)(Citation: 27).
    On 9 December, by decree No. 2166 the president instructed the Russian government to use all means "to ensure… the rights and freedoms of citizens"(Citation: 650).

    On 27 January 1995, Yeltsin signed decree No. 79 "On Ensuring the Conditions for the Re-creation of Constitutional Organs of Power in the Chechen Republic" (see: "Installation of a New System of Governance")(Citation: 27)(Citation: 1423).
    On 12 July 1996, the fourth day of the occupation troops' offensive, the president, by decree No. 1028, named as constitutional organs the government that Moscow had installed in Grozny (see: "Puppet Government")(Citation: 27)(Citation: 1423)(Citation: 1160).

    On 11 December 1994, the day of the open invasion, Yeltsin addressed the citizens of Russia: "Our goal is to find a political solution to the problems of one of the subjects of the Russian Federation — the Chechen Republic, and to protect its citizens from armed extremism."
    The president of Russia promised: "I oblige all officials responsible for carrying out the measures to restore constitutional order in the Chechen Republic [that is what Russia called its war against independent Ichkeria] not to use violence against the civilian population and to take it under protection"(Citation: 27).
    A week later, from 18 December, Russian pilots bombed Grozny, and from 19 December until the storming on 31 December they bombed it every day.
    Human rights defenders of the Russian organization Memorial write: "The bombs and missiles fell mainly on neighborhoods where residential buildings stood and where there were knowingly no military objects" (see: "Indiscriminate Attacks")(Citation: 27).
    By the estimate of the Observer Mission of Russian human rights organizations, from December 1994 to March 1995 the occupiers killed 25-29 thousand civilian townspeople in Grozny (see: "Mass Killings of Civilians")(Citation: 27).

    On 11 January 1996, the Russian government replied to the UN Secretary-General's inquiry about human rights in Ichkeria that an extremely complex situation had forced Moscow to use armed force.
    The reply says that on 29 August 1995 Yeltsin appointed Lobov, secretary of the Russian Security Council, as his representative in Ichkeria to guarantee human rights and prepare free elections (see: "Sham Expression of Popular Will")(Citation: 658).

    On 23 April 1996, Chernomyrdin, chairman of the Russian government, stated at a meeting of the government commission on settling the war: "The UN Charter also contains the concept of 'peace enforcement', and in this case it can be applied"(Citation: 27).
    Two days later, on 25 April, Russian pilots bombed Shali, a town southeast of Grozny that the occupation troops had surrounded six days earlier (see: "Indiscriminate Attacks").
    The occupiers killed Chechen civilians and, according to the report of the head of the Shali district to the Interfax agency, wounded 29 people(Citation: 27).
    Eleven days later, on 6 May, Russian troops seized Shali without a fight and found no defenders there (see: "Collective Punishment")(Citation: 27).

    On 17 July 1996, Chernomyrdin, chairman of the Russian government, stated at a meeting of the government commission on settling the war that in six months Russia had liquidated the "anti-constitutional regime" (that is what Russia called the government of Ichkeria) that had threatened its territorial integrity(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Москва всю війну оголошувала вторгнення та окупацію благом для чеченців.

    30 листопада 1994 року президент Росії Єльцин підписав секретний указ № 2137 «Про заходи з відновлення конституційної законності та правопорядку на території Чеченської Республіки» (так колонізатор назвав підготовку нападу на Ічкерію)(Citation: 27). 9 грудня президент указом № 2166 доручив російському уряду застосувати всі засоби «для забезпечення… прав і свобод громадян»(Citation: 650).

    27 січня 1995 року Єльцин підписав указ № 79 «Про забезпечення умов для відтворення конституційних органів влади в Чеченській Республіці» (докладніше: «Встановлення нової системи управління»)(Citation: 27)(Citation: 1423). 12 липня 1996 року, на четвертий день наступу окупаційних військ, президент указом № 1028 назвав конституційними органами уряд, який Москва поставила в Грозному (докладніше: «Маріонетковий уряд»)(Citation: 27)(Citation: 1423)(Citation: 1160).

    11 грудня 1994 року, в день відкритого вторгнення, Єльцин звернувся до громадян Росії: «Наша мета полягає в тому, щоб знайти політичне вирішення проблем одного із суб'єктів Російської Федерації — Чеченської Республіки, захистити її громадян від збройного екстремізму».
    Президент Росії обіцяв: «Зобов'язую всіх посадових осіб, відповідальних за проведення заходів з відновлення в Чеченській Республіці конституційного порядку [так Росія називала свою війну проти незалежної Ічкерії], не застосовувати насильства проти мирного населення, взяти його під захист»(Citation: 27).
    Через тиждень, з 18 грудня, російські льотчики бомбили Грозний, а з 19 грудня до штурму 31 грудня - щодня.
    Правозахисники російської організації «Меморіал» пишуть: «Бомби і ракети падали переважно на квартали, де були житлові будинки і завідомо не було військових об'єктів» (докладніше: «Невибіркові напади»)(Citation: 27).
    За оцінкою Спостережної місії російських правозахисних організацій, з грудня 1994 року по березень 1995 року окупанти вбили в Грозному 25-29 тисяч мирних городян (докладніше: «Масові вбивства цивільних»)(Citation: 27).

    Уряд Росії 11 січня 1996 року відповів Генеральному секретареві ООН на запит про права людини в Ічкерії, що вкрай складна обстановка змусила Москву застосувати збройну силу.
    У відповіді сказано, що 29 серпня 1995 року Єльцин призначив секретаря Ради безпеки Росії Лобова своїм представником в Ічкерії, щоб гарантувати права людини і підготувати вільні вибори (докладніше: «Імітація народного волевиявлення»)(Citation: 658).

    23 квітня 1996 року голова уряду Росії Черномирдін заявив на засіданні урядової комісії з урегулювання війни: «У Статуті ООН також значиться поняття «примус до миру», і в цьому випадку воно може бути застосоване»(Citation: 27).
    Через два дні, 25 квітня, російські льотчики бомбили Шалі, місто на південний схід від Грозного, яке окупаційні війська оточили шістьма днями раніше (докладніше: «Невибіркові напади»).
    Окупанти вбили мирних чеченців, а 29 людей, за повідомленням глави Шалінського району агентству «Інтерфакс», поранили(Citation: 27).
    Через 11 днів, 6 травня, російські війська без бою захопили Шалі і не знайшли там захисників (докладніше: «Колективні покарання»)(Citation: 27).

    17 липня 1996 року голова уряду Росії Черномирдін заявив на засіданні урядової комісії з урегулювання війни, що за півроку Росія ліквідувала «антиконституційний режим» (так Росія називала уряд Ічкерії), який загрожував її територіальній цілісності(Citation: 27).
