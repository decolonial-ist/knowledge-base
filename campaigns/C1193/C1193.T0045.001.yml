description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты разрушали мечети, обстреливали кладбища и сравняли с землёй древние курганы к югу от Грозного.

    Российские артиллеристы, лётчики и экипажи вертолётов обстреливали мечети в сёлах и городах Ичкерии(Citation: 986)(Citation: 27).
    Подходя к селу, оккупанты первым делом стреляли по верхушке мечети, самой высокой постройки, а снайперы обстреливали мечети без причины(Citation: 988).
    По оценке Исы Адаева, директора Национального музея Ичкерии, к маю 1996 года российские войска уничтожили или повредили 70 процентов мечетей республики(Citation: 988).
    Экипажи российских вертолётов бомбили сельские кладбища, а снайперы обстреливали их(Citation: 654)(Citation: 655).

    В феврале-марте 1995 года российский полк два месяца и семь дней стоял у трёх древних погребальных курганов, земляных холмов над могилами, между сёлами Старые Атаги и Чечен-Аул к югу от Грозного.
    Городской совет Грозного выделил вокруг курганов 26 гектаров под музей археологии, и туда привезли ограду, знаки, предупреждавшие, что здесь памятники, и стройматериалы.
    Солдаты раскопали курганы посередине специальной машиной, которая сопровождает танковые полки, а потом сравняли с землёй.
    Оккупанты снесли танками ограду и знаки.
    Солдаты нарыли между курганами окопы, а стройматериалы музея пустили на блиндажи и блокпосты.
    Иса Адаев в мае 1996 года рассказал общественному трибуналу российского фонда «Гласность» в Праге: «Это были целенаправленные действия.
    Одним-двумя случайными попаданиями нельзя было сделать того, что было сделано»(Citation: 988).

    В начале февраля 1995 года российские снайперы стреляли с холмов над Самашками, селом на западе Ичкерии, по сельскому кладбищу и повредили могилы.
    Из-за обстрела семьи на день отложили похороны чеченцев, которых оккупанты убили миномётным огнём 2 февраля(Citation: 654).
    В апреле 1995 года экипажи российских вертолётов бомбили Кошкельды, село на востоке Ичкерии, и сельское кладбище(Citation: 655).
    С 14 по 20 декабря 1995 года артиллеристы оккупационных войск обстреливали мечеть в Гудермесе, втором по величине городе Ичкерии, и убили у неё больше 30 горожан (подробнее: «Неизбирательные нападения»)(Citation: 27).

    К февралю 1996 года российские войска разрушили мечети и минареты, башни при мечетях, в Бамуте, селе на западе Ичкерии(Citation: 986).

    С 3 по 9 марта 1996 года российские войска штурмовали Серноводск, село на западе Ичкерии.
    Российские солдаты сожгли сельскую мечеть вместе с телами чеченцев, которых сельчане принесли туда для похорон (подробнее: «Надругательство над мёртвыми»)(Citation: 1356)(Citation: 988).
    Садыт Гисатова, чеченка из Серноводска, в мае 1996 года рассказала трибуналу «Гласности» в Праге: «Когда мы приехали в мечеть, чтобы похоронить лежавшие там трупы, то увидели, что мечеть сгорела.
    Сгорели и все трупы.
    В каких странах уничтожают церкви и мечети?
    Это ведь святая святых»(Citation: 988).

    К маю 1996 года оккупационные войска при бомбёжках Грозного разрушили мемориал жертвам высылки чеченцев в Среднюю Азию в 1944 году, а надпись на камне сбили выстрелами.
    Чеченцы сложили мемориал в 1992 году из надгробий, которые после высылки колонизаторы пускали на постройку зданий, дорог и свиных ферм(Citation: 310)(Citation: 988).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers destroyed mosques, shelled cemeteries and razed ancient burial mounds south of Grozny to the ground.

    Russian artillerymen, pilots and helicopter crews shelled mosques in the villages and towns of Ichkeria(Citation: 986)(Citation: 27).
    Approaching a village, the occupiers first of all fired at the top of the mosque, the tallest building, and snipers fired at mosques for no reason(Citation: 988).
    By the estimate of Isa Adayev, director of the National Museum of Ichkeria, by May 1996 Russian troops had destroyed or damaged 70 percent of the republic's mosques(Citation: 988).
    Russian helicopter crews bombed village cemeteries, and snipers fired at them(Citation: 654)(Citation: 655).

    In February-March 1995, a Russian regiment stood for two months and seven days beside three ancient burial mounds, earthen hills over graves, between the villages of Starye Atagi and Chechen-Aul south of Grozny.
    The Grozny city council had set aside 26 hectares around the mounds for a museum of archaeology, and a fence, signs warning that these were monuments, and building materials had been brought there.
    Soldiers dug up the middle of the mounds with a special vehicle that accompanies tank regiments, and then razed them to the ground.
    The occupiers knocked down the fence and the signs with tanks.
    Soldiers dug trenches between the mounds and used the museum's building materials for dugouts and checkpoints.
    In May 1996, Isa Adayev told the public tribunal of the Russian Glasnost Foundation in Prague: "These were deliberate actions.
    One or two random hits could not have done what was done"(Citation: 988).

    In early February 1995, Russian snipers fired from the hills above Samashki, a village in the west of Ichkeria, at the village cemetery and damaged graves.
    Because of the shooting, families postponed for a day the funerals of Chechens whom the occupiers had killed with mortar fire on 2 February(Citation: 654).
    In April 1995, Russian helicopter crews bombed Koshkeldy, a village in the east of Ichkeria, and the village cemetery(Citation: 655).
    From 14 to 20 December 1995, artillerymen of the occupation troops shelled the mosque in Gudermes, the second-largest town of Ichkeria, and killed more than 30 townspeople beside it (see: "Indiscriminate Attacks")(Citation: 27).

    By February 1996, Russian troops had destroyed the mosques and minarets, the towers beside mosques, in Bamut, a village in the west of Ichkeria(Citation: 986).

    From 3 to 9 March 1996, Russian troops stormed Sernovodsk, a village in the west of Ichkeria.
    Russian soldiers burned the village mosque together with the bodies of Chechens whom the villagers had brought there for burial (see: "Desecration of the Dead")(Citation: 1356)(Citation: 988).
    In May 1996, Sadyt Gisatova, a Chechen woman from Sernovodsk, told the Glasnost tribunal in Prague: "When we came to the mosque to bury the bodies lying there, we saw that the mosque had burned down.
    All the bodies had burned too.
    In what countries do they destroy churches and mosques?
    It is the holy of holies"(Citation: 988).

    By May 1996, the occupation troops, while bombing Grozny, had destroyed the memorial to the victims of the deportation of the Chechens to Central Asia in 1944, and had shot the inscription off the stone.
    Chechens had built the memorial in 1992 from gravestones that, after the deportation, the colonizers had used to build buildings, roads and pig farms(Citation: 310)(Citation: 988).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти руйнували мечеті, обстрілювали кладовища і зрівняли із землею давні кургани на південь від Грозного.

    Російські артилеристи, льотчики та екіпажі вертольотів обстрілювали мечеті в селах і містах Ічкерії(Citation: 986)(Citation: 27).
    Підходячи до села, окупанти насамперед стріляли по верхівці мечеті, найвищої будівлі, а снайпери обстрілювали мечеті без причини(Citation: 988).
    За оцінкою Іси Адаєва, директора Національного музею Ічкерії, до травня 1996 року російські війська знищили або пошкодили 70 відсотків мечетей республіки(Citation: 988).
    Екіпажі російських вертольотів бомбили сільські кладовища, а снайпери обстрілювали їх(Citation: 654)(Citation: 655).

    У лютому-березні 1995 року російський полк два місяці і сім днів стояв біля трьох давніх поховальних курганів, земляних пагорбів над могилами, між селами Старі Атаги і Чечен-Аул на південь від Грозного.
    Міська рада Грозного виділила навколо курганів 26 гектарів під музей археології, і туди привезли огорожу, знаки, які попереджали, що тут пам'ятки, і будматеріали.
    Солдати розкопали кургани посередині спеціальною машиною, яка супроводжує танкові полки, а потім зрівняли із землею.
    Окупанти знесли танками огорожу і знаки.
    Солдати нарили між курганами окопів, а будматеріали музею пустили на бліндажі та блокпости.
    Іса Адаєв у травні 1996 року розповів громадському трибуналу російського фонду «Гласність» у Празі: «Це були цілеспрямовані дії.
    Одним-двома випадковими влучаннями не можна було зробити того, що було зроблено»(Citation: 988).

    На початку лютого 1995 року російські снайпери стріляли з пагорбів над Самашками, селом на заході Ічкерії, по сільському кладовищу і пошкодили могили.
    Через обстріл родини на день відклали похорон чеченців, яких окупанти вбили мінометним вогнем 2 лютого(Citation: 654).
    У квітні 1995 року екіпажі російських вертольотів бомбили Кошкельди, село на сході Ічкерії, і сільське кладовище(Citation: 655).
    З 14 по 20 грудня 1995 року артилеристи окупаційних військ обстрілювали мечеть у Гудермесі, другому за величиною місті Ічкерії, і вбили біля неї понад 30 городян (докладніше: «Невибіркові напади»)(Citation: 27).

    До лютого 1996 року російські війська зруйнували мечеті й мінарети, вежі при мечетях, у Бамуті, селі на заході Ічкерії(Citation: 986).

    З 3 по 9 березня 1996 року російські війська штурмували Серноводськ, село на заході Ічкерії.
    Російські солдати спалили сільську мечеть разом із тілами чеченців, яких сельчани принесли туди для похорону (докладніше: «Наруга над мертвими»)(Citation: 1356)(Citation: 988).
    Садит Гісатова, чеченка із Серноводська, у травні 1996 року розповіла трибуналу «Гласності» у Празі: «Коли ми приїхали в мечеть, щоб поховати тіла, які там лежали, то побачили, що мечеть згоріла.
    Згоріли і всі тіла.
    У яких країнах знищують церкви і мечеті?
    Це ж святая святих»(Citation: 988).

    До травня 1996 року окупаційні війська під час бомбардувань Грозного зруйнували меморіал жертвам виселення чеченців до Середньої Азії 1944 року, а напис на камені збили пострілами.
    Чеченці склали меморіал 1992 року з надгробків, які після виселення колонізатори пускали на будівництво будівель, доріг і свиноферм(Citation: 310)(Citation: 988).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
