    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    До серпня 1996 року окупанти бомбили міста й села Ічкерії, вбивали мирних чеченців і без звинувачень тримали їх у фільтраційних таборах.

    Восени 1991 року, під час розвалу СРСР, чеченці скинули встановлену радянську владу в Чечено-Інгушській Республіці, обрали президентом Джохара Дудаєва і проголосили незалежність Чеченської Республіки.
    Росія не визнала її і готувала переворот(Citation: 27).

    Восени 1994 року Росія озброювала Тимчасову раду, маріонеткову опозицію, щоб скинути Джохара Дудаєва, президента Ічкерії.
    Російська армія передала раді 10 бронетранспортерів, 40 танків і 6 бойових гелікоптерів зі своїми екіпажами.
    Офіцери ФСК (попередниці сучасної ФСБ) вербували для ради російських танкістів (докладніше: «Організація перевороту»)(Citation: 27). 1 жовтня московська газета «Комерсант» писала, що міністерство оборони Росії «незворушно відкидає всі звинувачення, заявляючи, що не має стосунку до подій, які відбуваються в Чечні»(Citation: 1068). 26 листопада захисники Грозного, столиці Ічкерії, розбили російських танкістів, які штурмували місто під вивіскою маріонеткової опозиції, і захопили в полон десятки російських військових(Citation: 27). 1 грудня російські льотчики знищили на аеродромах усю авіацію Ічкерії(Citation: 718). 9 грудня президент Росії Єльцин указом № 2166 наказав урядові застосувати проти Збройних сил Ічкерії всі засоби російської держави, у тому числі армію(Citation: 650).

    Російські колони рушили в Ічкерію за день до переговорів, які Росія призначила на 12 грудня 1994 року (докладніше: «Переговори як прикриття нападу»)(Citation: 27).
    Джерела розходяться: одні називають у цих колонах 14 972 особи, інші - майже 24 тисячі(Citation: 2380)(Citation: 2381).
    У день вторгнення Єльцин у зверненні до громадян Росії обіцяв: «Зобов'язую всіх посадових осіб, відповідальних за проведення заходів з відновлення в Чеченській Республіці конституційного порядку [так Росія називала свою війну проти незалежної Ічкерії], не застосовувати насильства проти мирного населення, взяти його під захист»(Citation: 27).
    Через сім днів після звернення, з 18 грудня, російська авіація бомбила житлові квартали Грозного.
    Командувач російської військової авіації Дейнекін в інтерв'ю газеті «Московський комсомолець» 21 березня 1995 року розповів, що льотчики скидали на місто некеровані бомби крізь хмари, коли «землі взагалі не видно»(Citation: 27). 31 грудня російська армія штурмувала Грозний.
    Захисники міста розгромили колони окупантів. 19 січня 1995 року російські солдати захопили руїни президентського палацу і ще півтора місяця, до 6 березня, штурмували решту районів міста(Citation: 27).
    До початку лютого 1995 року Росія довела чисельність своїх військ в Ічкерії до 70 тисяч осіб(Citation: 2382).
    Спостережна місія російських правозахисних організацій опитала 265 сімей біженців із Грозного.
    За оцінкою місії, з грудня 1994 року по березень 1995 року окупанти вбили в місті 25-29 тисяч мирних людей (докладніше: «Невибіркові напади»)(Citation: 27).

    Наприкінці березня 1995 року російська армія захопила Аргун, Гудермес і Шалі, міста на схід і південний схід від Грозного(Citation: 27). 7 квітня солдати внутрішніх військ МВС Росії (попередників сучасної Росгвардії) і міліціонери штурмували Самашки, село на заході Ічкерії. 8 квітня окупанти обшукували будинки.
    Садулла Юсупов, літній чеченець із Самашок, 13 квітня розповів співробітникові російської правозахисної організації «Меморіал» Олегу Орлову: «Вони кричали нелюдським голосом матом, матюкали, кричали: "Виходьте, суки!" і до кожного будинку підходили, стріляли»(Citation: 662).
    Спостережна місія опублікувала поіменний список 103 людей, яких окупанти вбили в селі за два дні (докладніше: «Масові вбивства цивільних»)(Citation: 662).
    У червні російські війська захопили Ведено, Шатой і Ножай-Юрт, районні центри в горах на півдні (докладніше: «Воєнна інтервенція»)(Citation: 27)(Citation: 1127).

    14 червня 1995 року бійці Збройних сил Ічкерії захопили близько 1500 заручників у Будьоннівську, підконтрольному Росії місті на північний захід від республіки, і вимагали припинити війну.
    Через п'ять днів Росія почала переговори з Ічкерією в Грозному(Citation: 27). 3 липня, поки тривали переговори, Єльцин указом № 663 дозволив «дислокувати на постійній основі» в республіці частини російської армії(Citation: 1123). 30 липня делегації Росії та Ічкерії підписали угоду про припинення воєнних дій.
    Росія зобов'язалася виводити війська в міру того, як армія Ічкерії здає зброю(Citation: 1580)(Citation: 1131).
    Чеченські бійці почали здавати зброю, а російські частини з республіки не пішли(Citation: 27). 6 жовтня невідомі важко поранили в Грозному командувача окупаційних військ Романова.
    Наступного дня керівництво Збройних сил Ічкерії назвало замах провокацією, щоб зірвати мирну угоду(Citation: 1348). 9 жовтня Єльцин звинуватив у замаху «прихильників [Джохара] Дудаєва» (обраного президента Чеченської Республіки), і Росія відновила наступ(Citation: 27).

    З лютого по травень 1996 року російська армія штурмувала селище Новогрозненський на сході Ічкерії та села Серноводськ, Самашки і Бамут на заході (докладніше: «Воєнна інтервенція»)(Citation: 27).
    Навесні російські командири підписували з селами «Протоколи про мир і злагоду»(Citation: 27).
    Село зобов'язувалося не пускати до себе бійців армії Ічкерії, а Росія обіцяла не вести в ньому бойових дій(Citation: 681).
    Попри домовленості, російські льотчики бомбили села, які підписали протоколи (докладніше: «Фальшиві гарантії безпеки»)(Citation: 27). 21 квітня 1996 року російські військові вдарили ракетами по галявині біля Гехі-Чу, села на південний захід від Грозного, і вбили Джохара Дудаєва, президента Ічкерії (докладніше: «Нейтралізація опозиції»)(Citation: 712)(Citation: 27). 27 травня голова уряду Росії Чорномирдін і Зелімхан Яндарбієв, який виконував обов'язки президента Ічкерії, підписали в Москві домовленість про припинення вогню. 10 червня в Назрані, місті в підконтрольній Росії Інгушетії, Росія зобов'язалася вивести війська з республіки до кінця серпня 1996 року(Citation: 27)(Citation: 1124). 9 липня, через шість днів після того, як Єльцин виграв вибори президента Росії, окупанти почали новий наступ (докладніше: «Фальшиве перемир'я»)(Citation: 27).

    Російські військові та міліціонери без звинувачень звозили затриманих чеченців у фільтраційні табори і в ями при військових частинах (докладніше: «Система фільтраційних таборів»).
    За довідкою заступника начальника тюремного відомства МВС Росії Злиденка, з 11 грудня 1994 року по 22 липня 1995 року через табори в Грозному і в Моздоку, місті в підконтрольній Росії Північній Осетії, пройшли 1325 людей.
    Міністерство відпустило більшість із них як невинних, а сто людей передало слідчим (докладніше: «Фабрикація злочинців»).
    МВС Росії віддало ще 141 людину на обмін на полонених російських військових (докладніше: «Захоплення заручників»)(Citation: 27).
    У вересні 1995 року спеціальний доповідач ООН з питань катувань написав урядові Росії, що багатьох в'язнів таборів систематично били, щоб вирвати зізнання в підтримці Джохара Дудаєва (докладніше: «Катування та знущання»)(Citation: 738).
    За заявами рідних, які збирало чеченське товариство «Жертви війни», у червні 1996 року зниклими безвісти вважалися 1285 людей (докладніше: «Викрадення людей»)(Citation: 27).
    У січні 1998 року Робоча група ООН з насильницьких зникнень повідомила, що Росія не з'ясувала долю жодного зниклого, про якого її запитували(Citation: 1430).

    Російські чиновники та військові називали владу Ічкерії «бандитами»(Citation: 1323)(Citation: 1410), її армію - «бандформуваннями»(Citation: 27) і «терористами»(Citation: 1294)(Citation: 1357), а мирних чеченців - «бандитами»(Citation: 986) і «бойовиками» (докладніше: «Дегуманізація»)(Citation: 988).
    Генерали окупаційних військ видавали вбитих ними мирних людей за бійців Збройних сил Ічкерії (докладніше: «Брехня про власні дії»)(Citation: 27).

    Росія не вела рахунку цивільним, яких убила в Ічкерії(Citation: 27). 3 вересня 1996 року генерал Лебедь, секретар Ради безпеки Росії, на пресконференції в Москві назвав загальне число загиблих у війні: 80 000 людей, «плюс-мінус 10 000»(Citation: 1305)(Citation: 1304).
    У щорічній доповіді за 1996 рік міжнародна правозахисна організація Human Rights Watch оцінила число цивільних, убитих в Ічкерії з грудня 1994 року, від 18 500 до 80 000(Citation: 1253).
    У резолюції 1995 року Європейський парламент засудив застосування Росією армії проти Ічкерії(Citation: 735).
    Парламентська асамблея Організації з безпеки і співробітництва в Європі в декларації 1995 року назвала війну Росії в Ічкерії грубим порушенням міжнародного права(Citation: 1149). 25 січня 1996 року спеціальний доповідач ООН з позасудових страт написав у доповіді Комісії ООН з прав людини, що російські військові вбили тисячі громадян Ічкерії, у тому числі коли навмисно й без розбору обстрілювали житлові квартали з важкої зброї та бомбили їх(Citation: 739).
    За висновком «Меморіалу», російські війська навмисно нападали на цивільних усю війну, а найбільше вбили бомбардуваннями й обстрілами(Citation: 27).

    У доповіді Human Rights Watch від січня 1997 року сказано, що Росія систематично порушувала права людини і так само систематично не притягала винних до відповідальності(Citation: 657). 12 березня 1997 року депутати в Москві постановою № 1199-II оголосили амністію за злочини, пов'язані з війною в Ічкерії.
    За цією амністією російські прокурори закривали незакінчені справи про злочини окупантів(Citation: 1315)(Citation: 27). 29 вересня 1997 року Управління військових судів Росії відповіло на запит «Меморіалу», що за всю війну суди засудили 18 російських солдатів і офіцерів, із них сімох - за вбивства (докладніше: «Безкарність виконавців»)(Citation: 27).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року генерал Лебедь і Аслан Масхадов, начальник Головного штабу Збройних сил Ічкерії, підписали мирні угоди в Хасав'юрті, місті в підконтрольному Росії Дагестані.
    Росія визнала в них «недопустимість застосування збройної сили або загрози її застосування при вирішенні спірних питань».
    В угодах записано, що рішення про незалежність Ічкерії відкладено на п'ять років, до 31 грудня 2001 року (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки. 27 січня 1997 року громадяни Ічкерії обрали президента і парламент республіки.
    Президентом став Аслан Масхадов(Citation: 27).
    Через три роки після угод у Хасав'юрті Росія вдруге після 1994 року напала на Ічкерію. 21 вересня 1999 року російські льотчики почали бомбити Грозний, а 29 вересня російська армія вторглася в республіку(Citation: 27).
