name:
  ru: Первая Русско-Чеченская война (1994–1996)
  en: First Russian-Chechen War (1994–1996)
  uk: Перша російсько-чеченська війна (1994–1996)
description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    До августа 1996 года оккупанты бомбили города и сёла Ичкерии, убивали мирных чеченцев и без обвинений держали их в фильтрационных лагерях.

    Осенью 1991 года, в ходе развала СССР, чеченцы свергли установленную советскую власть в Чечено-Ингушской Республике, выбрали президентом Джохара Дудаева и объявили независимость Чеченской Республики.
    Россия не признала её и готовила переворот(Citation: 27).

    Осенью 1994 года Россия вооружала Временный совет, марионеточную оппозицию, чтобы свергнуть Джохара Дудаева, президента Ичкерии.
    Российская армия передала совету 10 бронетранспортёров, 40 танков и 6 боевых вертолётов со своими экипажами.
    Офицеры ФСК (предшественницы современной ФСБ) вербовали для совета российских танкистов (подробнее: «Организация переворота»)(Citation: 27). 1 октября московская газета «Коммерсантъ» писала, что министерство обороны России «невозмутимо отвергает все обвинения, заявляя, что не имеет отношения к происходящим в Чечне событиям»(Citation: 1068). 26 ноября защитники Грозного, столицы Ичкерии, разбили российских танкистов, которые штурмовали город под вывеской марионеточной оппозиции, и захватили в плен десятки российских военных(Citation: 27). 1 декабря российские лётчики уничтожили на аэродромах всю авиацию Ичкерии(Citation: 718). 9 декабря президент России Ельцин указом № 2166 приказал правительству применить против Вооружённых сил Ичкерии все средства российского государства, в том числе армию(Citation: 650).

    Российские колонны двинулись в Ичкерию за день до переговоров, которые Россия назначила на 12 декабря 1994 года (подробнее: «Переговоры как прикрытие нападения»)(Citation: 27).
    Источники расходятся: одни называют в этих колоннах 14 972 человека, другие - почти 24 тысячи(Citation: 2380)(Citation: 2381).
    В день вторжения Ельцин в обращении к гражданам России обещал: «Обязываю всех должностных лиц, ответственных за проведение мероприятий по восстановлению в Чеченской Республике конституционного порядка [так Россия называла свою войну против независимой Ичкерии], не применять насилия против мирного населения, взять его под защиту»(Citation: 27).
    Через семь дней после обращения, с 18 декабря, российская авиация бомбила жилые кварталы Грозного.
    Командующий российской военной авиацией Дейнекин в интервью газете «Московский комсомолец» 21 марта 1995 года рассказал, что лётчики сбрасывали на город неуправляемые бомбы сквозь облака, когда «землю вообще не видно»(Citation: 27). 31 декабря российская армия штурмовала Грозный.
    Защитники города разгромили колонны оккупантов. 19 января 1995 года российские солдаты захватили развалины президентского дворца и ещё полтора месяца, до 6 марта, штурмовали остальные районы города(Citation: 27).
    К началу февраля 1995 года Россия довела число своих войск в Ичкерии до 70 тысяч человек(Citation: 2382).
    Наблюдательная миссия российских правозащитных организаций опросила 265 семей беженцев из Грозного.
    По оценке миссии, с декабря 1994 года по март 1995 года оккупанты убили в городе 25-29 тысяч мирных людей (подробнее: «Неизбирательные нападения»)(Citation: 27).

    В конце марта 1995 года российская армия захватила Аргун, Гудермес и Шали, города к востоку и юго-востоку от Грозного(Citation: 27). 7 апреля солдаты внутренних войск МВД России (предшественников современной Росгвардии) и милиционеры штурмовали Самашки, село на западе Ичкерии. 8 апреля оккупанты обыскивали дома.
    Садулла Юсупов, пожилой чеченец из Самашек, 13 апреля рассказал сотруднику российской правозащитной организации «Мемориал» Олегу Орлову: «Они кричали нечеловеческим голосом матом, матюгали, кричали: "Выходите, суки!" и к каждому дому подходили, стреляли»(Citation: 662).
    Наблюдательная миссия опубликовала поимённый список 103 человек, которых оккупанты убили в селе за два дня (подробнее: «Массовые убийства гражданских»)(Citation: 662).
    В июне российские войска захватили Ведено, Шатой и Ножай-Юрт, районные центры в горах на юге (подробнее: «Военная интервенция»)(Citation: 27)(Citation: 1127).

    14 июня 1995 года бойцы Вооружённых сил Ичкерии захватили около 1500 заложников в Будённовске, подконтрольном России городе к северо-западу от республики, и потребовали прекратить войну.
    Через пять дней Россия начала переговоры с Ичкерией в Грозном(Citation: 27). 3 июля, пока шли переговоры, Ельцин указом № 663 разрешил «дислоцировать на постоянной основе» в республике части российской армии(Citation: 1123). 30 июля делегации России и Ичкерии подписали соглашение о прекращении военных действий.
    Россия обязалась выводить войска по мере того, как армия Ичкерии сдаёт оружие(Citation: 1580)(Citation: 1131).
    Чеченские бойцы начали сдавать оружие, а российские части из республики не ушли(Citation: 27). 6 октября неизвестные тяжело ранили в Грозном командующего оккупационными войсками Романова.
    На следующий день руководство Вооружённых сил Ичкерии назвало покушение провокацией, чтобы сорвать мирное соглашение(Citation: 1348). 9 октября Ельцин обвинил в покушении «сторонников [Джохара] Дудаева» (выбранного президента Чеченской Республики), и Россия возобновила наступление(Citation: 27).

    С февраля по май 1996 года российская армия штурмовала посёлок Новогрозненский на востоке Ичкерии и сёла Серноводск, Самашки и Бамут на западе (подробнее: «Военная интервенция»)(Citation: 27).
    Весной российские командиры подписывали с сёлами «Протоколы о мире и согласии»(Citation: 27).
    Село обязывалось не пускать к себе бойцов армии Ичкерии, а Россия обещала не вести боевые действия в нем(Citation: 681).
    Вопреки договоренностям, российские лётчики бомбили сёла, которые подписали протоколы (подробнее: «Ложные гарантии безопасности»)(Citation: 27). 21 апреля 1996 года российские военные ударили ракетами по поляне у Гехи-Чу, села к юго-западу от Грозного, и убили Джохара Дудаева, президента Ичкерии (подробнее: «Нейтрализация оппозиции»)(Citation: 712)(Citation: 27). 27 мая председатель правительства России Черномырдин и Зелимхан Яндарбиев, исполнявший обязанности президента Ичкерии, подписали в Москве договорённость о прекращении огня. 10 июня в Назрани, городе в подконтрольной России Ингушетии, Россия обязалась вывести войска из республики до конца августа 1996 года(Citation: 27)(Citation: 1124). 9 июля, через шесть дней после того как Ельцин выиграл выборы президента России, оккупанты начали новое наступление (подробнее: «Ложное перемирие»)(Citation: 27).

    Российские военные и милиционеры без обвинений свозили задержанных чеченцев в фильтрационные лагеря и в ямы при воинских частях (подробнее: «Система фильтрационных лагерей»).
    По справке заместителя начальника тюремного ведомства МВД России Злыденко, с 11 декабря 1994 года по 22 июля 1995 года через лагеря в Грозном и в Моздоке, городе в подконтрольной России Северной Осетии, прошли 1325 человек.
    Министерство отпустило большинство из них как невиновных, а сто человек передало следователям (подробнее: «Фабрикация преступников»).
    МВД России отдало ещё 141 человека на обмен на пленных российских военных (подробнее: «Захват заложников»)(Citation: 27).
    В сентябре 1995 года специальный докладчик ООН по пыткам написал правительству России, что многих узников лагерей систематически избивали, чтобы вырвать признание в поддержке Джохара Дудаева (подробнее: «Пытки и истязания»)(Citation: 738).
    По заявлениям родных, которые собирало чеченское общество «Жертвы войны», в июне 1996 года пропавшими без вести числились 1285 человек (подробнее: «Похищение людей»)(Citation: 27).
    В январе 1998 года Рабочая группа ООН по насильственным исчезновениям сообщила, что Россия не выяснила судьбу ни одного пропавшего, о котором её запрашивали(Citation: 1430).

    Российские чиновники и военные называли власть Ичкерии «бандитами»(Citation: 1323)(Citation: 1410), её армию - «бандформированиями»(Citation: 27) и «террористами»(Citation: 1294)(Citation: 1357), а мирных чеченцев - «бандитами»(Citation: 986) и «боевиками» (подробнее: «Дегуманизация»)(Citation: 988).
    Генералы оккупационных войск выдавали убитых ими мирных людей за бойцов Вооружённых сил Ичкерии (подробнее: «Ложь о собственных действиях»)(Citation: 27).

    Россия не вела счёт гражданским, которых убила в Ичкерии(Citation: 27). 3 сентября 1996 года генерал Лебедь, секретарь Совета безопасности России, на пресс-конференции в Москве назвал общее число погибших в войне: 80 000 человек, «плюс-минус 10 000»(Citation: 1305)(Citation: 1304).
    В ежегодном докладе за 1996 год международная правозащитная организация Human Rights Watch оценила число гражданских, убитых в Ичкерии с декабря 1994 года, от 18 500 до 80 000(Citation: 1253).
    В резолюции 1995 года Европейский парламент осудил применение Россией армии против Ичкерии(Citation: 735).
    Парламентская ассамблея Организации по безопасности и сотрудничеству в Европе в декларации 1995 года назвала войну России в Ичкерии грубым нарушением международного права(Citation: 1149). 25 января 1996 года специальный докладчик ООН по казням без суда написал в докладе Комиссии ООН по правам человека, что российские военные убили тысячи граждан Ичкерии, в том числе когда намеренно и без разбора обстреливали жилые кварталы из тяжёлого оружия и бомбили их(Citation: 739).
    По выводу «Мемориала», российские войска намеренно нападали на гражданских всю войну, а больше всего убили бомбёжками и обстрелами(Citation: 27).

    В докладе Human Rights Watch от января 1997 года сказано, что Россия систематически нарушала права человека и так же систематически не привлекала виновных к ответственности(Citation: 657). 12 марта 1997 года депутаты в Москве постановлением № 1199-II объявили амнистию за преступления, связанные с войной в Ичкерии.
    По этой амнистии российские прокуроры прекращали незаконченные дела о преступлениях оккупантов(Citation: 1315)(Citation: 27). 29 сентября 1997 года Управление военных судов России ответило на запрос «Мемориала», что за всю войну суды осудили 18 российских солдат и офицеров, из них семерых - за убийства (подробнее: «Безнаказанность исполнителей»)(Citation: 27).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года генерал Лебедь и Аслан Масхадов, начальник Главного штаба Вооружённых сил Ичкерии, подписали мирные соглашения в Хасавюрте, городе в подконтрольном России Дагестане.
    Россия признала в них «недопустимость применения вооруженной силы или угрозы ее применения при решении спорных вопросов».
    В соглашениях записано, что решение о независимости Ичкерии отложено на пять лет, до 31 декабря 2001 года (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики. 27 января 1997 года граждане Ичкерии выбрали президента и парламент республики.
    Президентом стал Аслан Масхадов(Citation: 27).
    Через три года после соглашений в Хасавюрте Россия во второй раз после 1994 года напала на Ичкерию. 21 сентября 1999 года российские лётчики начали бомбить Грозный, а 29 сентября российская армия вторглась в республику(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Until August 1996 the occupiers bombed the towns and villages of Ichkeria, killed Chechen civilians and held them without charges in filtration camps.

    In the autumn of 1991, during the collapse of the USSR, Chechens overthrew the Soviet authorities installed in the Chechen-Ingush Republic, elected Dzhokhar Dudayev president and declared the independence of the Chechen Republic.
    Russia did not recognize it and was preparing a coup(Citation: 27).

    In the autumn of 1994, Russia armed the Provisional Council, a puppet opposition, to overthrow Dzhokhar Dudayev, the president of Ichkeria.
    The Russian army handed the council 10 armored personnel carriers, 40 tanks and 6 combat helicopters with their crews.
    Officers of the FSK (a predecessor of today's FSB) recruited Russian tank crews for the council (see: "Staging a Coup")(Citation: 27).
    On 1 October the Moscow newspaper Kommersant wrote that the Russian Ministry of Defense "imperturbably rejects all accusations, stating that it has nothing to do with the events taking place in Chechnya"(Citation: 1068).
    On 26 November the defenders of Grozny, the capital of Ichkeria, routed the Russian tank crews who were storming the city under the banner of the puppet opposition, and took dozens of Russian servicemen prisoner(Citation: 27).
    On 1 December Russian pilots destroyed all of Ichkeria's aircraft on the airfields(Citation: 718).
    On 9 December Russian President Yeltsin, by Decree No. 2166, ordered the government to use all means of the Russian state, including the army, against the Armed Forces of Ichkeria(Citation: 650).

    The Russian columns moved into Ichkeria a day before the talks that Russia had scheduled for 12 December 1994 (see: "Negotiations as Cover for an Attack")(Citation: 27).
    Sources differ: some put the strength of these columns at 14,972 men, others at almost 24,000(Citation: 2380)(Citation: 2381).
    On the day of the invasion, Yeltsin promised in an address to the citizens of Russia: "I oblige all officials responsible for carrying out the measures to restore constitutional order in the Chechen Republic [this is what Russia called its war against independent Ichkeria] not to use violence against the civilian population and to take it under protection"(Citation: 27).
    Seven days after the address, from 18 December, Russian aircraft bombed the residential districts of Grozny.
    Deinekin, the commander of the Russian military aviation, said in an interview with the newspaper Moskovsky Komsomolets on 21 March 1995 that the pilots dropped unguided bombs on the city through the clouds when "the ground could not be seen at all"(Citation: 27).
    On 31 December the Russian army stormed Grozny.
    The defenders of the city routed the occupiers' columns.
    On 19 January 1995 Russian soldiers captured the ruins of the presidential palace and stormed the remaining districts of the city for another month and a half, until 6 March(Citation: 27).
    By early February 1995 Russia had brought the number of its troops in Ichkeria up to 70,000 men(Citation: 2382).
    The Observer Mission of Russian human rights organizations interviewed 265 refugee families from Grozny.
    By the mission's estimate, from December 1994 to March 1995 the occupiers killed 25,000-29,000 civilians in the city (see: "Indiscriminate Attacks")(Citation: 27).

    At the end of March 1995 the Russian army captured Argun, Gudermes and Shali, towns to the east and southeast of Grozny(Citation: 27).
    On 7 April soldiers of the Internal Troops of the Russian MVD (predecessors of today's Rosgvardia) and police officers stormed Samashki, a village in the west of Ichkeria.
    On 8 April the occupiers searched the houses.
    Sadulla Yusupov, an elderly Chechen from Samashki, told Oleg Orlov of the Russian human rights organization Memorial on 13 April: "They were screaming in inhuman voices, swearing, cursing, shouting: 'Come out, you bitches!' and they went up to every house and fired"(Citation: 662).
    The Observer Mission published a list by name of 103 people whom the occupiers killed in the village in two days (see: "Mass Killings of Civilians")(Citation: 662).
    In June Russian troops captured Vedeno, Shatoy and Nozhai-Yurt, district centers in the mountains in the south (see: "Military Intervention")(Citation: 27)(Citation: 1127).

    On 14 June 1995 fighters of the Armed Forces of Ichkeria took about 1,500 hostages in Budyonnovsk, a Russian-controlled town to the northwest of the republic, and demanded an end to the war.
    Five days later Russia began talks with Ichkeria in Grozny(Citation: 27).
    On 3 July, while the talks were under way, Yeltsin, by Decree No. 663, allowed units of the Russian army "to be stationed on a permanent basis" in the republic(Citation: 1123).
    On 30 July the delegations of Russia and Ichkeria signed an agreement on the cessation of hostilities.
    Russia undertook to withdraw its troops as the army of Ichkeria handed over its weapons(Citation: 1580)(Citation: 1131).
    Chechen fighters began to hand over weapons, but the Russian units did not leave the republic(Citation: 27).
    On 6 October unknown persons seriously wounded Romanov, the commander of the occupation troops, in Grozny.
    The next day the leadership of the Armed Forces of Ichkeria called the attempt a provocation aimed at wrecking the peace agreement(Citation: 1348).
    On 9 October Yeltsin blamed the attempt on "supporters of [Dzhokhar] Dudayev" (the elected president of the Chechen Republic), and Russia resumed its offensive(Citation: 27).

    From February to May 1996 the Russian army stormed the settlement of Novogroznensky in the east of Ichkeria and the villages of Sernovodsk, Samashki and Bamut in the west (see: "Military Intervention")(Citation: 27).
    In the spring Russian commanders signed "Protocols on Peace and Accord" with villages(Citation: 27).
    A village undertook not to let fighters of the army of Ichkeria in, and Russia promised not to conduct combat operations in it(Citation: 681).
    Contrary to the agreements, Russian pilots bombed villages that had signed the protocols (see: "False Guarantees of Safety")(Citation: 27).
    On 21 April 1996 the Russian military struck a clearing near Gekhi-Chu, a village to the southwest of Grozny, with missiles and killed Dzhokhar Dudayev, the president of Ichkeria (see: "Neutralization of the Opposition")(Citation: 712)(Citation: 27).
    On 27 May Chernomyrdin, the chairman of the Russian government, and Zelimkhan Yandarbiyev, the acting president of Ichkeria, signed a ceasefire agreement in Moscow.
    On 10 June in Nazran, a town in Russian-controlled Ingushetia, Russia undertook to withdraw its troops from the republic by the end of August 1996(Citation: 27)(Citation: 1124).
    On 9 July, six days after Yeltsin won the Russian presidential election, the occupiers launched a new offensive (see: "Sham Ceasefire")(Citation: 27).

    Russian servicemen and police officers took detained Chechens without charges to filtration camps and to pits at military units (see: "Filtration Camp System").
    According to a memorandum by Zlydenko, the deputy head of the prison service of the Russian MVD, from 11 December 1994 to 22 July 1995, 1,325 people passed through the camps in Grozny and in Mozdok, a town in Russian-controlled North Ossetia.
    The ministry released most of them as innocent and handed one hundred over to investigators (see: "Manufacturing Criminals").
    The Russian MVD gave another 141 people to be exchanged for captured Russian servicemen (see: "Hostage-Taking")(Citation: 27).
    In September 1995 the UN Special Rapporteur on torture wrote to the Russian government that many inmates of the camps were systematically beaten to extract a confession of support for Dzhokhar Dudayev (see: "Torture and Abuse")(Citation: 738).
    According to statements by relatives collected by the Chechen society "Victims of War", 1,285 people were listed as missing in June 1996 (see: "Abduction of People")(Citation: 27).
    In January 1998 the UN Working Group on Enforced Disappearances reported that Russia had not established the fate of a single missing person about whom it had been asked(Citation: 1430).

    Russian officials and military officers called the authorities of Ichkeria "bandits"(Citation: 1323)(Citation: 1410), its army "bandit formations"(Citation: 27) and "terrorists"(Citation: 1294)(Citation: 1357), and Chechen civilians "bandits"(Citation: 986) and "militants" (see: "Dehumanization")(Citation: 988).
    Generals of the occupation troops passed off the civilians they had killed as fighters of the Armed Forces of Ichkeria (see: "Lies about Its Own Actions")(Citation: 27).

    Russia kept no count of the civilians it killed in Ichkeria(Citation: 27).
    On 3 September 1996 General Lebed, the secretary of the Russian Security Council, named the total number of those who died in the war at a press conference in Moscow: 80,000 people, "give or take 10,000"(Citation: 1305)(Citation: 1304).
    In its annual report for 1996 the international human rights organization Human Rights Watch estimated the number of civilians killed in Ichkeria since December 1994 at 18,500 to 80,000(Citation: 1253).
    In a 1995 resolution the European Parliament condemned Russia's use of the army against Ichkeria(Citation: 735).
    In a 1995 declaration the Parliamentary Assembly of the Organization for Security and Co-operation in Europe called Russia's war in Ichkeria a gross violation of international law(Citation: 1149).
    On 25 January 1996 the UN Special Rapporteur on extrajudicial executions wrote in a report to the UN Commission on Human Rights that the Russian military had killed thousands of citizens of Ichkeria, including when they deliberately and indiscriminately shelled residential districts with heavy weapons and bombed them(Citation: 739).
    Memorial concluded that Russian troops deliberately attacked civilians throughout the war and killed the most of them by bombing and shelling(Citation: 27).

    A Human Rights Watch report of January 1997 says that Russia systematically violated human rights and just as systematically failed to bring the perpetrators to justice(Citation: 657).
    On 12 March 1997 the deputies in Moscow, by Resolution No. 1199-II, declared an amnesty for crimes connected with the war in Ichkeria.
    Under this amnesty Russian prosecutors closed unfinished cases on the crimes of the occupiers(Citation: 1315)(Citation: 27).
    On 29 September 1997 the Directorate of Military Courts of Russia replied to a request from Memorial that over the whole war the courts had convicted 18 Russian soldiers and officers, seven of them for murder (see: "Impunity of Perpetrators")(Citation: 27).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996 General Lebed and Aslan Maskhadov, the chief of the Main Staff of the Armed Forces of Ichkeria, signed the peace agreements in Khasavyurt, a town in Russian-controlled Dagestan.
    In them Russia acknowledged "the inadmissibility of the use of armed force or the threat of its use in resolving disputed issues".
    The agreements state that the decision on the independence of Ichkeria was postponed for five years, until 31 December 2001 (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic.
    On 27 January 1997 the citizens of Ichkeria elected the president and parliament of the republic.
    Aslan Maskhadov became president(Citation: 27).
    Three years after the Khasavyurt agreements Russia attacked Ichkeria for the second time since 1994.
    On 21 September 1999 Russian pilots began bombing Grozny, and on 29 September the Russian army invaded the republic(Citation: 27).
