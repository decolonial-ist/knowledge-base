description:
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    The occupiers promised the villages of Ichkeria not to touch the Chechens if a village handed over its weapons, sent away the Armed Forces of Ichkeria or let Russian troops in, and then looted, bombed and stormed the villages that had believed them.

    Russian generals and officers gave their promises to village heads and elders at their posts, by word of mouth or in the form of a written treaty(Citation: 662).

    In mid-January 1995, the elders of Assinovskaya, a stanitsa in the west of Ichkeria, let in Russian troops, who promised through loudspeakers and leaflets not to touch anyone.
    The occupiers looted houses and abused Chechens, and by 16 February every Chechen family had left the stanitsa (see: "Pillage")(Citation: 654).

    On 21 February 1995, the head of Samashki, a village in the west of Ichkeria, and the elders asked Kosolapov, a general of the occupation forces, at the Russian post near the village what they should do so that there would be no war in the village.
    The report of the Observer Mission of Russian human rights defenders gives the general's answer: "You have to hand over the heavy weapons, set up a militia team of 40-45 men to guard the village, draw up a protocol of accord with the seals of the imam and the chairman [of the village administration], explain it to the people — that is all that is required of you".
    On 6-7 March, fighters of the army of Ichkeria from other villages were forced to leave at the demand of the Chechens of Samashki.
    On 8 March, the head of the village, the imam and five elders signed a treaty with the Russian troops.
    The village undertook to hand over its heavy weapons and send away the army of Ichkeria, and in exchange the elders asked the Russian troops not to enter Samashki and not to use force against Chechen civilians.
    General Kosolapov signed the treaty and gave a copy to the head of the village(Citation: 662).

    Eighteen days after the treaty, on 26 March 1995, Russian pilots in six helicopters fired rockets at Samashki and seriously wounded four Chechens.
    On 28 March, the colonel who commanded the Russian post near the village demanded that small arms be handed over, although the treaty said nothing of this.
    The head of Samashki collected six assault rifles in the village and handed them to the occupiers.
    On 6 April, Romanov, deputy commander of the occupation forces, demanded that the village let in the Internal Troops of Russia's Ministry of Internal Affairs (predecessors of today's Rosgvardia) and hand over 264 assault rifles by seven in the morning of 7 April (see: "Collective Punishment").
    The elders replied that there were not that many weapons in the village, and the head of Samashki asked for three days to collect about fifty assault rifles.
    Romanov refused.
    On 7 April, the occupiers shelled Samashki with mortars and stormed the village.
    On 7 and 8 April, the Russian military killed 103 Chechen civilians in the village, whom human rights defenders recorded by name (see: "Mass Killings of Civilians")(Citation: 662).
    On 11 April, five elders of Samashki handed human rights defenders at the Russian post a written statement: "We believed the MVD of Russia… we forced all the militiamen to leave our village of Samashki.
    We believed the military that in this case they would not touch the civilian population.
    And once again a lie.
    On 7 April the special forces of Russia's MVD began to enter the village"(Citation: 662)(Citation: 1136).

    Around 20 April 1995, the elders of Ishkhoy-Yurt, a village in the east of Ichkeria, let in Russian servicemen who promised only to pass through the village(Citation: 27).
    The occupiers fired their assault rifles at the houses and killed a woman who was carrying a child, and the child survived(Citation: 655).

    In the spring of 1996, Russian troops surrounded the villages of Ichkeria and shelled them (see: "Collective Punishment")(Citation: 988).
    Then the occupiers and the puppet government in Grozny signed a "Protocol on Peace and Accord" with the village.
    The village undertook not to let in fighters of the army of Ichkeria, and in return Russia promised that it would be spared any fighting(Citation: 681).
    On 14 March, Artemov, commander of the occupation forces in the south-west of Ichkeria, gave Russian deputies his word of honor that he would not storm Samashki, because the village was handing over its weapons(Citation: 988).
    On 15 March, the occupiers stormed the village and killed at least 35 Chechen civilians (see: "Indiscriminate Attacks")(Citation: 27).

    On 31 March 1996, Russian president Yeltsin, by decree No. 435, named "the signing of protocols on peace and accord" one of the main directions of his program for the Chechen Republic(Citation: 1326).
    According to the French agency AFP, even before the decree, by 28 March, more than 120 villages of Ichkeria had signed protocols with the occupation forces(Citation: 1385).
    On 2 April, Russia and the puppet government signed a "Protocol on Peace and Accord" with Shalazhi, a village south-west of Grozny(Citation: 27).
    On the night of 3 April and on 4 April, Russian pilots bombed the village, destroyed dozens of houses, killed three Chechens and wounded more than three hundred (see: "Indiscriminate Attacks")(Citation: 27)(Citation: 988).
    By 20 April, according to Zavgaev, head of the puppet government, only 15 villages and towns of Ichkeria had not signed the protocol(Citation: 27).
    On 25 April, Russian pilots bombed Chishki, a village south of Grozny, which had signed a "Protocol on Peace and Accord" shortly before.
    The pilots killed one Chechen woman and wounded two more Chechens(Citation: 27).

    Human rights defenders of Memorial write: "At times neither a truce, nor the signing of a 'protocol on peace and accord' by a settlement, nor even the occupation of a village or town by the federal [Russian] troops saved it from indiscriminate attacks, air strikes and artillery shelling"(Citation: 27).
    Tim Guldimann, head of the mission of the Organization for Security and Co-operation in Europe in Grozny from January 1996, wrote in 1998 that the commander of the occupation forces and Zavgaev, head of the puppet government, in part forced these protocols upon the villages(Citation: 681).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Окупанти обіцяли селам Ічкерії не чіпати чеченців, якщо село здасть зброю, виведе Збройні сили Ічкерії або пустить до себе російські війська, а потім грабували, бомбили і штурмували села, які їм повірили.

    Російські генерали й офіцери давали обіцянки головам сіл і старійшинам на своїх постах, на словах або у формі письмового договору(Citation: 662).

    У середині січня 1995 року старійшини станиці Ассинівська на заході Ічкерії впустили російські війська, які через гучномовці й листівки обіцяли нікого не чіпати.
    Окупанти грабували будинки, знущалися з чеченців, і до 16 лютого зі станиці пішли всі чеченські родини (докладніше: «Мародерство»)(Citation: 654).

    21 лютого 1995 року голова Самашок, села на заході Ічкерії, і старійшини спитали на російському посту біля села генерала окупаційних військ Косолапова, що зробити, щоб у селі не було війни.
    У доповіді Спостережної місії російських правозахисників наведено відповідь генерала: «Треба здати важку зброю, створити команду ополчення для охорони села чисельністю 40-45 осіб, скласти протокол згоди з печатками імама і голови [сільської адміністрації], роз'яснити народові — ось і все, що від вас вимагається». 6-7 березня бійці армії Ічкерії з інших сіл на вимогу чеченців Самашок були змушені піти. 8 березня голова села, імам і п'ятеро старійшин підписали договір з російськими військами.
    Село зобов'язалося здати важку зброю і вивести армію Ічкерії, а старійшини натомість просили російські війська не входити в Самашки і не застосовувати силу до мирних чеченців.
    Генерал Косолапов підписав договір і віддав примірник голові села(Citation: 662).

    Через 18 днів після договору, 26 березня 1995 року, російські льотчики з шести гелікоптерів обстріляли Самашки ракетами і тяжко поранили чотирьох чеченців. 28 березня полковник, який командував російським постом біля села, зажадав здати стрілецьку зброю, хоча в договорі цього не було.
    Голова Самашок зібрав у селі шість автоматів і передав їх окупантам. 6 квітня заступник командувача окупаційних військ Романов зажадав впустити в село внутрішні війська МВС Росії (попередників сучасної Росгвардії) і до сьомої ранку 7 квітня здати 264 автомати (докладніше: «Колективні покарання»).
    Старійшини відповіли, що стільки зброї в селі немає, і голова Самашок попросив три дні, щоб зібрати близько п'ятдесяти автоматів.
    Романов відмовив. 7 квітня окупанти обстріляли Самашки з мінометів і штурмували село.
    За 7 і 8 квітня російські військові вбили в селі 103 мирних чеченців, яких правозахисники переписали поіменно (докладніше: «Масові вбивства цивільних»)(Citation: 662). 11 квітня п'ятеро старійшин Самашок передали правозахисникам на російському посту письмову заяву: «Ми повірили МВС Росії… ми змусили піти з нашого села Самашки всіх ополченців.
    Ми повірили військовим, що в цьому разі вони не чіпатимуть мирне населення.
    І знову брехня. 7 квітня спецназ МВС Росії почав входити в село»(Citation: 662)(Citation: 1136).

    Близько 20 квітня 1995 року старійшини Ішхой-Юрта, села на сході Ічкерії, пустили до себе російських військових, які обіцяли лише пройти через село(Citation: 27).
    Окупанти стріляли з автоматів по будинках і вбили жінку, яка несла дитину, а дитина вижила(Citation: 655).

    Навесні 1996 року російські війська оточували села Ічкерії та обстрілювали їх (докладніше: «Колективні покарання»)(Citation: 988).
    Потім окупанти і маріонетковий уряд у Грозному підписували з селом «Протокол про мир і злагоду».
    Село зобов'язувалося не пускати до себе бійців армії Ічкерії, а Росія натомість обіцяла позбавити його боїв(Citation: 681). 14 березня командувач окупаційних військ на південному заході Ічкерії Артемов дав російським депутатам чесне слово не штурмувати Самашки, бо село здає зброю(Citation: 988). 15 березня окупанти штурмували село і вбили щонайменше 35 мирних чеченців (докладніше: «Невибіркові напади»)(Citation: 27).

    31 березня 1996 року президент Росії Єльцин указом № 435 назвав «підписання протоколів про мир і злагоду» одним із головних напрямів своєї програми для Чеченської Республіки(Citation: 1326).
    За даними французького агентства AFP, ще до указу, до 28 березня, понад 120 сіл Ічкерії підписали протоколи з окупаційними військами(Citation: 1385). 2 квітня Росія і маріонетковий уряд підписали «Протокол про мир і злагоду» з Шалажі, селом на південний захід від Грозного(Citation: 27).
    У ніч на 3 квітня і 4 квітня російські льотчики бомбили село, зруйнували десятки будинків, убили трьох чеченців і поранили понад триста (докладніше: «Невибіркові напади»)(Citation: 27)(Citation: 988).
    До 20 квітня, за словами глави маріонеткового уряду Завгаєва, протокол не підписали лише 15 сіл і міст Ічкерії(Citation: 27). 25 квітня російські льотчики бомбили Чишки, село на південь від Грозного, яке незадовго до того підписало «Протокол про мир і злагоду».
    Льотчики вбили одну чеченку і поранили ще двох чеченців(Citation: 27).

    Правозахисники «Меморіалу» пишуть: «Від невибіркових нападів, ударів з повітря й артобстрілів часом не рятували ні перемир'я, ні підписання населеним пунктом „протоколу про мир і злагоду“, ні навіть зайняття села чи міста федеральними [російськими] військами»(Citation: 27).
    Тім Гульдіман, глава місії Організації з безпеки і співробітництва в Європі в Грозному з січня 1996 року, у 1998 році писав, що командувач окупаційних військ і глава маріонеткового уряду Завгаєв почасти нав'язували ці протоколи селам(Citation: 681).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Оккупанты обещали сёлам Ичкерии не трогать чеченцев, если село сдаст оружие, выведет Вооружённые силы Ичкерии или пустит к себе российские войска, а потом грабили, бомбили и штурмовали сёла, которые им поверили.

    Российские генералы и офицеры давали обещания главам сёл и старейшинам на своих постах, на словах или в форме письменного договора(Citation: 662).

    В середине января 1995 года старейшины станицы Ассиновская на западе Ичкерии впустили российские войска, которые через громкоговорители и листовки обещали никого не трогать.
    Оккупанты грабили дома, издевались над чеченцами, и к 16 февраля из станицы ушли все чеченские семьи (подробнее: «Мародерство»)(Citation: 654).

    21 февраля 1995 года глава Самашек, села на западе Ичкерии, и старейшины спросили на российском посту у села генерала оккупационных войск Косолапова, что сделать, чтобы в селе не было войны.
    В докладе Наблюдательной миссии российских правозащитников приведён ответ генерала: «Надо сдать тяжелое оружие, создать команду ополчения для охраны села численностью 40-45 человек, составить протокол согласия с печатями имама и председателя [сельской администрации], разъяснить народу — вот и все, что от вас требуется». 6-7 марта бойцы армии Ичкерии из других сёл по требованию чеченцев Самашек были вынуждены уйти. 8 марта глава села, имам и пятеро старейшин подписали договор с российскими войсками.
    Село обязалось сдать тяжёлое оружие и вывести армию Ичкерии, а старейшины взамен просили российские войска не входить в Самашки и не применять силу к мирным чеченцам.
    Генерал Косолапов подписал договор и отдал экземпляр главе села(Citation: 662).

    Через 18 дней после договора, 26 марта 1995 года, российские лётчики с шести вертолётов обстреляли Самашки ракетами и тяжело ранили четверых чеченцев. 28 марта полковник, который командовал российским постом у села, потребовал сдать стрелковое оружие, хотя в договоре этого не было.
    Глава Самашек собрал в селе шесть автоматов и передал их оккупантам. 6 апреля заместитель командующего оккупационными войсками Романов потребовал впустить в село внутренние войска МВД России (предшественников современной Росгвардии) и к семи утра 7 апреля сдать 264 автомата (подробнее: «Коллективные наказания»).
    Старейшины ответили, что столько оружия в селе нет, и глава Самашек попросил три дня, чтобы собрать около пятидесяти автоматов.
    Романов отказал. 7 апреля оккупанты обстреляли Самашки из миномётов и штурмовали село.
    За 7 и 8 апреля российские военные убили в селе 103 мирных чеченца, которых правозащитники переписали по именам (подробнее: «Массовые убийства гражданских»)(Citation: 662). 11 апреля пятеро старейшин Самашек передали правозащитникам на российском посту письменное заявление: «Мы поверили МВД России… мы заставили уйти из нашего села Самашки всех ополченцев.
    Мы поверили военным, что в этом случае они не тронут мирное население.
    И вновь ложь. 7 апреля спецназ МВД России начал входить в село»(Citation: 662)(Citation: 1136).

    Около 20 апреля 1995 года старейшины Ишхой-Юрта, села на востоке Ичкерии, пустили к себе российских военных, которые обещали только пройти через село(Citation: 27).
    Оккупанты стреляли из автоматов по домам и убили женщину, которая несла ребёнка, а ребёнок выжил(Citation: 655).

    Весной 1996 года российские войска окружали сёла Ичкерии и обстреливали их (подробнее: «Коллективные наказания»)(Citation: 988).
    Затем оккупанты и марионеточное правительство в Грозном подписывали с селом «Протокол о мире и согласии».
    Село обязывалось не пускать к себе бойцов армии Ичкерии, а Россия взамен обещала избавить его от боёв(Citation: 681). 14 марта командующий оккупационными войсками на юго-западе Ичкерии Артемов дал российским депутатам честное слово не штурмовать Самашки, потому что село сдаёт оружие(Citation: 988). 15 марта оккупанты штурмовали село и убили не меньше 35 мирных чеченцев (подробнее: «Неизбирательные нападения»)(Citation: 27).

    31 марта 1996 года президент России Ельцин указом № 435 назвал «подписание протоколов о мире и согласии» одним из главных направлений своей программы для Чеченской Республики(Citation: 1326).
    По данным французского агентства AFP, ещё до указа, к 28 марта, больше 120 сёл Ичкерии подписали протоколы с оккупационными войсками(Citation: 1385). 2 апреля Россия и марионеточное правительство подписали «Протокол о мире и согласии» с Шалажи, селом к юго-западу от Грозного(Citation: 27).
    В ночь на 3 апреля и 4 апреля российские лётчики бомбили село, разрушили десятки домов, убили троих чеченцев и ранили больше трёхсот (подробнее: «Неизбирательные нападения»)(Citation: 27)(Citation: 988).
    К 20 апреля, по словам главы марионеточного правительства Завгаева, протокол не подписали только 15 сёл и городов Ичкерии(Citation: 27). 25 апреля российские лётчики бомбили Чишки, село к югу от Грозного, которое незадолго до этого подписало «Протокол о мире и согласии».
    Лётчики убили одну чеченку и ранили ещё двоих чеченцев(Citation: 27).

    Правозащитники «Мемориала» пишут: «От неизбирательных нападений, ударов с воздуха и артобстрелов подчас не спасали ни перемирие, ни подписание населенным пунктом „протокола о мире и согласии“, ни даже занятие села или города федеральными [российскими] войсками»(Citation: 27).
    Тим Гульдиман, глава миссии Организации по безопасности и сотрудничеству в Европе в Грозном с января 1996 года, в 1998 году писал, что командующий оккупационными войсками и глава марионеточного правительства Завгаев отчасти навязывали эти протоколы сёлам(Citation: 681).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
