description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Россия высылала из Ичкерии правозащитников и выдавливала из республики международные миссии, которые записывали преступления оккупантов.

    9 декабря 1994 года, за два дня до открытого вторжения, председатель правительства России Черномырдин постановлением № 1360 приказал сотрудникам МВД и ФСК (предшественницы современной ФСБ) высылать из Ичкерии приезжих, которых они сочтут угрозой безопасности(Citation: 651).
    По этому постановлению оккупанты не раз высылали из республики правозащитников(Citation: 27).

    Российские военные на блокпостах не пускали правозащитников, депутатов российского парламента и Красный Крест в сёла, которые штурмовали.
    Когда депутаты и правозащитники приезжали проверять фильтрационные лагеря, офицеры оккупационных войск не давали им поговорить с задержанными чеченцами(Citation: 662)(Citation: 27).

    Российские политики и командиры много раз требовали отозвать Тима Гульдимана, главу миссии Организации по безопасности и сотрудничеству в Европе (ОБСЕ), которая с 24 апреля 1995 года работала в Грозном(Citation: 681)(Citation: 1152).

    27 января 1995 года Министерство обороны России не разрешило Сергею Ковалёву, тогда уполномоченному по правам человека в России, поехать с делегацией ОБСЕ в фильтрационный лагерь в Моздоке, городе в подконтрольной России Северной Осетии.
    Члены делегации увидели там чеченцев со следами побоев (подробнее: «Пытки и истязания»)(Citation: 27)(Citation: 1301)(Citation: 1375). 26 марта 1995 года бойцы российского милицейского спецназа задержали у Самашек, села на западе Ичкерии, участников антивоенного «Марша мира» из российских общественных и религиозных организаций, вывезли их в Назрань, город в подконтрольной России Ингушетии, в Ассиновскую, станицу на западе Ичкерии, а часть - в Москву. 11 апреля российские военные на блокпосту не пустили участников марша в Самашки(Citation: 662)(Citation: 1136).

    7 и 8 апреля 1995 года внутренние войска МВД России (предшественники современной Росгвардии) штурмовали Самашки и убили 103 мирных чеченца (подробнее: «Массовые убийства гражданских»)(Citation: 662).
    С 8 апреля российские военные на блокпосту у села не пускали в Самашки наблюдателей правозащитной миссии Сергея Ковалёва, бывшего уполномоченного по правам человека в России(Citation: 1136)(Citation: 27). 11 апреля депутаты российского парламента Борис Титенко и Анатолий Шабад час уговаривали командиров поста пропустить их.
    Андрей Блинушов, наблюдатель «Мемориала», записал в дневнике ответ: «для въезда в Самашки требуется письменное разрешение командующего группировкой войск МВД генерал-полковника Куликова»(Citation: 1136). 12 апреля российские военные пустили в село наблюдателей с депутатами. 13 апреля командующий оккупационными войсками в Ичкерии Куликов запретил пускать в Самашки всех, кто не прописан в селе, в том числе правозащитников(Citation: 662)(Citation: 27).

    Оккупанты увезли чеченских мужчин, задержанных в Самашках, в фильтрационный лагерь в Моздоке (подробнее: «Система фильтрационных лагерей»). 19 апреля 1995 года Андрей Блинушов и депутат российского парламента Юлий Рыбаков приехали туда с проверкой.
    В докладе миссии правозащитников сказано: «из пункта [фильтрационного лагеря] неожиданно была вывезена вся основная документация и был прерван индивидуальный опрос задержанных».
    Генерал Егоров, который в апреле сменил Куликова во главе оккупационных войск, объявил обоим, что проверка закончена(Citation: 662).

    19-20 апреля 1995 года полковники оккупационных войск Лебедев и Харченко отрицали, что у Ассиновской есть ямы, куда сажают людей, и не пустили к задержанным там чеченцам депутата российского парламента Валерия Борщёва, главу правозащитной миссии Сергея Ковалёва, сотрудников «Мемориала» (подробнее: «Система фильтрационных лагерей»)(Citation: 662)(Citation: 1136)(Citation: 27). 26 мая 1995 года оккупанты по постановлению № 1360 силой вывезли из-под Ассиновской в Моздок двух наблюдателей правозащитной миссии, Александра Лавута и Бориса Смушкевича.
    В июне оба наблюдателя снова работали в Грозном(Citation: 27). 2 июня Куликов, к этому времени снова командовавший оккупационными войсками, приказал «Врачам без границ» к шести часам вечера вывести команды из Шатоя и Махкетов, сёл на юге Ичкерии, и объявил, что два месяца ни одна благотворительная организация не может появиться на юге республики.
    В тот же день обе команды уехали из этих сёл(Citation: 1381)(Citation: 27).

    7 октября 1995 года неизвестные обстреляли ракетами здание миссии ОБСЕ в Грозном, и назначенный Россией мэр города потребовал, чтобы миссия уехала.
    Марионеточное правительство отменило решение мэра, но 12 октября ОБСЕ из-за угрозы сотрудникам временно сократила миссию с шести человек до двух(Citation: 1146)(Citation: 1382)(Citation: 27).
    В конце октября 1995 года оккупанты на блокпосту не пустили в Серноводск, село на западе Ичкерии, двух членов британской христианской общины, которая выступает против войн.
    Члены общины проехали в село через поле(Citation: 988).

    С 3 по 9 марта 1996 года, пока оккупанты штурмовали Серноводск, российские солдаты на блокпостах не подпускали к селу наблюдателя «Мемориала» Александра Гурьянова ближе чем на 400 метров(Citation: 988). 8 марта российские военные на блокпосту у въезда в Серноводск обстреляли двух депутатов российского парламента, и командир блокпоста пригрозил расстрелять их в следующий раз(Citation: 988). 10 марта российский военный комендант Серноводска запретил пускать в село журналистов, правозащитников, иностранцев и Красный Крест, а оккупанты пригрозили обстрелять машины Красного Креста и других гуманитарных организаций, если их не уберут от села(Citation: 27).
    С 4 по 9 апреля оккупанты не пустили в Серноводск и Самашки делегацию британской христианской общины, хотя 5 апреля президент России Ельцин объявил, что международные наблюдатели могут свободно ездить по республике(Citation: 988).

    9 июня 1996 года марионеточное правительство заявило, что Тим Гульдиман превысил полномочия, когда вёл прямые переговоры с делегацией Ичкерии, и назвало пребывание миссии ОБСЕ в республике нежелательным(Citation: 1389)(Citation: 27). 24 июня командующий оккупационными войсками Тихомиров на пресс-конференции обвинил главу миссии в том, что тот держит сторону Ичкерии и может сорвать переговоры о прекращении огня(Citation: 1388).
    В начале августа 1996 года, когда Вооружённые силы Ичкерии атаковали оккупантов в Грозном, российские лётчики попали в здание миссии двумя ракетами с вертолётов.
    Четверо её сотрудников восемь дней прятались в погребе и не пострадали(Citation: 681).

    В докладе Human Rights Watch от января 1997 года сказано, что российские ведомства не раз мешали Международному комитету Красного Креста посещать людей, задержанных по уголовным делам в связи с войной, и требовали, чтобы комитет сначала получил разрешение судьи(Citation: 657).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Russia expelled human rights defenders from Ichkeria and squeezed out of the republic the international missions that were recording the crimes of the occupiers.

    On 9 December 1994, two days before the open invasion, Russian prime minister Chernomyrdin, by resolution No. 1360, ordered officers of the Ministry of Internal Affairs and of the FSK (the predecessor of today's FSB) to expel from Ichkeria visitors whom they deemed a threat to security(Citation: 651).
    Under this resolution, the occupiers expelled human rights defenders from the republic more than once(Citation: 27).

    The Russian military at checkpoints did not let human rights defenders, deputies of the Russian parliament or the Red Cross into the villages they were storming.
    When deputies and human rights defenders came to inspect the filtration camps, officers of the occupation forces did not let them talk to the detained Chechens(Citation: 662)(Citation: 27).

    Russian politicians and commanders demanded many times the recall of Tim Guldimann, head of the mission of the Organization for Security and Co-operation in Europe (OSCE), which had been working in Grozny since 24 April 1995(Citation: 681)(Citation: 1152).

    On 27 January 1995, the Russian Ministry of Defense did not allow Sergei Kovalyov, then Russia's human rights commissioner, to travel with an OSCE delegation to the filtration camp in Mozdok, a town in Russian-controlled North Ossetia.
    The members of the delegation saw Chechens there with marks of beatings (see: "Torture and Abuse")(Citation: 27)(Citation: 1301)(Citation: 1375).
    On 26 March 1995, men of the Russian police special forces detained near Samashki, a village in the west of Ichkeria, participants of the anti-war "Peace March" from Russian civic and religious organizations, took them to Nazran, a town in Russian-controlled Ingushetia, to Assinovskaya, a stanitsa in the west of Ichkeria, and some to Moscow.
    On 11 April, the Russian military at the checkpoint did not let the marchers into Samashki(Citation: 662)(Citation: 1136).

    On 7 and 8 April 1995, the Internal Troops of Russia's Ministry of Internal Affairs (predecessors of today's Rosgvardia) stormed Samashki and killed 103 Chechen civilians (see: "Mass Killings of Civilians")(Citation: 662).
    From 8 April, the Russian military at the checkpoint near the village did not let into Samashki the observers of the human rights mission of Sergei Kovalyov, Russia's former human rights commissioner(Citation: 1136)(Citation: 27).
    On 11 April, Boris Titenko and Anatoly Shabad, deputies of the Russian parliament, spent an hour persuading the commanders of the post to let them through.
    Andrei Blinushov, an observer of Memorial, recorded the answer in his diary: "entry into Samashki requires the written permission of the commander of the grouping of MVD troops, Colonel General Kulikov"(Citation: 1136).
    On 12 April, the Russian military let the observers with the deputies into the village.
    On 13 April, Kulikov, commander of the occupation forces in Ichkeria, forbade letting into Samashki anyone not registered as a resident of the village, including human rights defenders(Citation: 662)(Citation: 27).

    The occupiers took the Chechen men detained in Samashki to the filtration camp in Mozdok (see: "Filtration Camp System").
    On 19 April 1995, Andrei Blinushov and Yuly Rybakov, a deputy of the Russian parliament, came there for an inspection.
    The report of the human rights defenders' mission says: "all the main documentation was unexpectedly removed from the point [the filtration camp] and the individual questioning of the detainees was cut short".
    General Yegorov, who in April had replaced Kulikov at the head of the occupation forces, announced to both of them that the inspection was over(Citation: 662).

    On 19-20 April 1995, Lebedev and Kharchenko, colonels of the occupation forces, denied that there were pits near Assinovskaya where people were being put, and did not let Valery Borshchev, a deputy of the Russian parliament, Sergei Kovalyov, head of the human rights mission, or Memorial staff see the Chechens detained there (see: "Filtration Camp System")(Citation: 662)(Citation: 1136)(Citation: 27).
    On 26 May 1995, the occupiers, under resolution No. 1360, forcibly took two observers of the human rights mission, Alexander Lavut and Boris Smushkevich, from near Assinovskaya to Mozdok.
    In June, both observers were working in Grozny again(Citation: 27).
    On 2 June, Kulikov, by this time again in command of the occupation forces, ordered Médecins Sans Frontières to withdraw its teams from Shatoy and Makhkety, villages in the south of Ichkeria, by six in the evening, and announced that for two months no charitable organization could appear in the south of the republic.
    The same day, both teams left these villages(Citation: 1381)(Citation: 27).

    On 7 October 1995, unknown persons fired rockets at the building of the OSCE mission in Grozny, and the mayor of the city appointed by Russia demanded that the mission leave.
    The puppet government overturned the mayor's decision, but on 12 October the OSCE, because of the threat to its staff, temporarily reduced the mission from six people to two(Citation: 1146)(Citation: 1382)(Citation: 27).
    In late October 1995, the occupiers at a checkpoint did not let two members of a British Christian community that opposes wars into Sernovodsk, a village in the west of Ichkeria.
    The members of the community drove into the village across a field(Citation: 988).

    From 3 to 9 March 1996, while the occupiers were storming Sernovodsk, Russian soldiers at the checkpoints did not let Alexander Guryanov, an observer of Memorial, come closer than 400 meters to the village(Citation: 988).
    On 8 March, the Russian military at the checkpoint at the entrance to Sernovodsk fired on two deputies of the Russian parliament, and the commander of the checkpoint threatened to shoot them next time(Citation: 988).
    On 10 March, the Russian military commandant of Sernovodsk forbade letting journalists, human rights defenders, foreigners and the Red Cross into the village, and the occupiers threatened to fire on the vehicles of the Red Cross and other humanitarian organizations if they were not moved away from the village(Citation: 27).
    From 4 to 9 April, the occupiers did not let a delegation of the British Christian community into Sernovodsk and Samashki, although on 5 April Russian president Yeltsin had announced that international observers could travel freely around the republic(Citation: 988).

    On 9 June 1996, the puppet government declared that Tim Guldimann had exceeded his authority when he held direct negotiations with the delegation of Ichkeria, and called the presence of the OSCE mission in the republic undesirable(Citation: 1389)(Citation: 27).
    On 24 June, Tikhomirov, commander of the occupation forces, accused the head of the mission at a press conference of taking the side of Ichkeria and of being capable of wrecking the ceasefire negotiations(Citation: 1388).
    In early August 1996, when the Armed Forces of Ichkeria attacked the occupiers in Grozny, Russian pilots hit the mission building with two rockets from helicopters.
    Four of its staff hid in the cellar for eight days and were unharmed(Citation: 681).

    A Human Rights Watch report of January 1997 says that Russian agencies repeatedly obstructed the International Committee of the Red Cross from visiting people detained on criminal charges in connection with the war, and demanded that the committee first obtain a judge's permission(Citation: 657).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Росія висилала з Ічкерії правозахисників і видавлювала з республіки міжнародні місії, які записували злочини окупантів.

    9 грудня 1994 року, за два дні до відкритого вторгнення, голова уряду Росії Черномирдін постановою № 1360 наказав співробітникам МВС і ФСК (попередниці сучасної ФСБ) висилати з Ічкерії приїжджих, яких вони вважатимуть загрозою безпеці(Citation: 651).
    За цією постановою окупанти не раз висилали з республіки правозахисників(Citation: 27).

    Російські військові на блокпостах не пускали правозахисників, депутатів російського парламенту і Червоний Хрест у села, які штурмували.
    Коли депутати і правозахисники приїздили перевіряти фільтраційні табори, офіцери окупаційних військ не давали їм поговорити із затриманими чеченцями(Citation: 662)(Citation: 27).

    Російські політики й командири багато разів вимагали відкликати Тіма Гульдімана, главу місії Організації з безпеки і співробітництва в Європі (ОБСЄ), яка з 24 квітня 1995 року працювала в Грозному(Citation: 681)(Citation: 1152).

    27 січня 1995 року Міністерство оборони Росії не дозволило Сергієві Ковальову, тоді уповноваженому з прав людини в Росії, поїхати з делегацією ОБСЄ у фільтраційний табір у Моздоку, місті в підконтрольній Росії Північній Осетії.
    Члени делегації побачили там чеченців зі слідами побоїв (докладніше: «Катування та знущання»)(Citation: 27)(Citation: 1301)(Citation: 1375). 26 березня 1995 року бійці російського міліцейського спецназу затримали біля Самашок, села на заході Ічкерії, учасників антивоєнного «Маршу миру» з російських громадських і релігійних організацій, вивезли їх у Назрань, місто в підконтрольній Росії Інгушетії, в Ассинівську, станицю на заході Ічкерії, а частину - до Москви. 11 квітня російські військові на блокпосту не пустили учасників маршу в Самашки(Citation: 662)(Citation: 1136).

    7 і 8 квітня 1995 року внутрішні війська МВС Росії (попередники сучасної Росгвардії) штурмували Самашки і вбили 103 мирних чеченців (докладніше: «Масові вбивства цивільних»)(Citation: 662).
    З 8 квітня російські військові на блокпосту біля села не пускали в Самашки спостерігачів правозахисної місії Сергія Ковальова, колишнього уповноваженого з прав людини в Росії(Citation: 1136)(Citation: 27). 11 квітня депутати російського парламенту Борис Тітенко і Анатолій Шабад годину вмовляли командирів поста пропустити їх.
    Андрій Блінушов, спостерігач «Меморіалу», записав у щоденнику відповідь: «для в'їзду в Самашки потрібен письмовий дозвіл командувача угруповання військ МВС генерал-полковника Куликова»(Citation: 1136). 12 квітня російські військові пустили в село спостерігачів з депутатами. 13 квітня командувач окупаційних військ в Ічкерії Куликов заборонив пускати в Самашки всіх, хто не прописаний у селі, зокрема правозахисників(Citation: 662)(Citation: 27).

    Окупанти відвезли чеченських чоловіків, затриманих у Самашках, у фільтраційний табір у Моздоку (докладніше: «Система фільтраційних таборів»). 19 квітня 1995 року Андрій Блінушов і депутат російського парламенту Юлій Рибаков приїхали туди з перевіркою.
    У доповіді місії правозахисників сказано: «з пункту [фільтраційного табору] несподівано було вивезено всю основну документацію і було перервано індивідуальне опитування затриманих».
    Генерал Єгоров, який у квітні змінив Куликова на чолі окупаційних військ, оголосив обом, що перевірку закінчено(Citation: 662).

    19-20 квітня 1995 року полковники окупаційних військ Лебедєв і Харченко заперечували, що біля Ассинівської є ями, куди саджають людей, і не пустили до затриманих там чеченців депутата російського парламенту Валерія Борщова, главу правозахисної місії Сергія Ковальова, співробітників «Меморіалу» (докладніше: «Система фільтраційних таборів»)(Citation: 662)(Citation: 1136)(Citation: 27). 26 травня 1995 року окупанти за постановою № 1360 силоміць вивезли з-під Ассинівської до Моздока двох спостерігачів правозахисної місії, Олександра Лавута і Бориса Смушкевича.
    У червні обидва спостерігачі знову працювали в Грозному(Citation: 27). 2 червня Куликов, який на той час знову командував окупаційними військами, наказав «Лікарям без кордонів» до шостої години вечора вивести команди з Шатоя і Махкетів, сіл на півдні Ічкерії, і оголосив, що два місяці жодна благодійна організація не може з'являтися на півдні республіки.
    Того ж дня обидві команди поїхали з цих сіл(Citation: 1381)(Citation: 27).

    7 жовтня 1995 року невідомі обстріляли ракетами будівлю місії ОБСЄ в Грозному, і призначений Росією мер міста зажадав, щоб місія поїхала.
    Маріонетковий уряд скасував рішення мера, але 12 жовтня ОБСЄ через загрозу співробітникам тимчасово скоротила місію з шести осіб до двох(Citation: 1146)(Citation: 1382)(Citation: 27).
    Наприкінці жовтня 1995 року окупанти на блокпосту не пустили в Серноводськ, село на заході Ічкерії, двох членів британської християнської громади, яка виступає проти воєн.
    Члени громади проїхали в село через поле(Citation: 988).

    З 3 по 9 березня 1996 року, поки окупанти штурмували Серноводськ, російські солдати на блокпостах не підпускали до села спостерігача «Меморіалу» Олександра Гур'янова ближче ніж на 400 метрів(Citation: 988). 8 березня російські військові на блокпосту біля в'їзду в Серноводськ обстріляли двох депутатів російського парламенту, і командир блокпоста пригрозив розстріляти їх наступного разу(Citation: 988). 10 березня російський військовий комендант Серноводська заборонив пускати в село журналістів, правозахисників, іноземців і Червоний Хрест, а окупанти пригрозили обстріляти машини Червоного Хреста та інших гуманітарних організацій, якщо їх не приберуть від села(Citation: 27).
    З 4 по 9 квітня окупанти не пустили в Серноводськ і Самашки делегацію британської християнської громади, хоча 5 квітня президент Росії Єльцин оголосив, що міжнародні спостерігачі можуть вільно їздити республікою(Citation: 988).

    9 червня 1996 року маріонетковий уряд заявив, що Тім Гульдіман перевищив повноваження, коли вів прямі переговори з делегацією Ічкерії, і назвав перебування місії ОБСЄ в республіці небажаним(Citation: 1389)(Citation: 27). 24 червня командувач окупаційних військ Тихомиров на пресконференції звинуватив главу місії в тому, що той тримає сторону Ічкерії і може зірвати переговори про припинення вогню(Citation: 1388).
    На початку серпня 1996 року, коли Збройні сили Ічкерії атакували окупантів у Грозному, російські льотчики влучили в будівлю місії двома ракетами з гелікоптерів.
    Четверо її співробітників вісім днів ховалися в погребі й не постраждали(Citation: 681).

    У доповіді Human Rights Watch від січня 1997 року сказано, що російські відомства не раз заважали Міжнародному комітетові Червоного Хреста відвідувати людей, затриманих у кримінальних справах у зв'язку з війною, і вимагали, щоб комітет спершу отримав дозвіл судді(Citation: 657).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
