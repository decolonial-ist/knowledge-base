description:
  ru: |-
    Осенью 1994 года Россия напала на Чеченскую Республику Ичкерия под именем марионеточной оппозиции, а 11 декабря 1994 года российская армия открыто вторглась в республику.
    Россия решала, каким журналистам работать в Ичкерии, отбирала у них отснятые кассеты и преследовала за репортажи о войне.

    1 декабря 1994 года, за десять дней до открытого вторжения, председатель правительства России Черномырдин распоряжением № 1886-р создал Временный информационный центр(Citation: 1341)(Citation: 27). 9 декабря постановлением № 1360 российское правительство поручило центру выдавать журналистам аккредитацию, разрешение работать в Ичкерии, и немедленно отбирать её за сведения, которые центр сочтёт неверными.
    Правительство дало МВД России и ФСК (предшественнице современной ФСБ) право высылать из Ичкерии приезжих, которых они сочтут опасными(Citation: 651).

    29 декабря 1994 года МВД России объявило, что аккредитация Временного информационного центра не даёт права ездить туда, где стоят российские внутренние войска (предшественники современной Росгвардии)(Citation: 27).

    В конце января 1995 года российское правительство создало Мобильный информационный центр в Моздоке, городе в подконтрольной России Северной Осетии, где стоял штаб оккупантов.
    Только аккредитация этого центра давала журналистам право находиться в «зоне боевых действий», а там - только под присмотром военных или чиновников.
    Оккупанты обычно считали этой зоной всю Ичкерию(Citation: 27).

    Российские военные высылали из республики журналистов без аккредитации, а журналистов с аккредитацией задерживали и отбирали у них кассеты и аппаратуру, объясняя, что нужна ещё аккредитация министерства обороны или МВД(Citation: 27).

    15 декабря 1994 года заместитель председателя правительства России Сосковец объявил, что правительство может отобрать у телеканала НТВ лицензию на вещание за репортажи о жертвах войны в Ичкерии.
    После общественного протеста правительство отказалось от этой угрозы(Citation: 1335).

    В конце мая 1995 года сотрудники ФСБ России у станицы Ассиновская на западе Ичкерии арестовали журналистов НТВ за то, что они снимали позиции российских войск, хотя командир российской дивизии это разрешил.
    ФСБ шесть часов держала журналистов в фильтрационном лагере и отпустила (подробнее: «Система фильтрационных лагерей»)(Citation: 988). 3 июня 1995 года российские военные арестовали трёх иностранных журналистов на границе Ичкерии с подконтрольным России Дагестаном и отчитали их за то, что у них нет нужной аккредитации.
    Через четыре дня, 7 июня, оккупанты отпустили журналистов в Москву, а кассеты и плёнку отобрали(Citation: 1335).

    25 июня 1995 года Елена Масюк, журналистка российского телеканала НТВ, записала интервью с Шамилем Басаевым, командиром Вооружённых сил Ичкерии, в Ножай-Юртовском районе на юго-востоке республики(Citation: 1335).
    В апреле 1996 года журналистка рассказала в Москве общественному трибуналу российского фонда «Гласность»: «Чтобы получить аккредитацию для работы в Чечне, нужно было попасть на военный аэродром в Моздоке, где выдавали аккредитации, — но для того, чтобы проехать на аэродром, нужно было эту аккредитацию уже иметь».
    О дороге к Шамилю Басаеву она сказала трибуналу: «Чтобы попасть в чеченское село, где, по моим предположениям, находился тогда Басаев, мне нужно было в обход российских блокпостов пройти 12 километров пешком»(Citation: 988). 13 июля 1995 года Генеральная прокуратура России возбудила против Елены Масюк уголовное дело за то, что она не рассказала следствию, где брала интервью.
    В конце августа прокуратура закрыла дело без обвинения и попросила ведомство правительства России по делам печати сделать так, чтобы такие интервью не повторялись(Citation: 1335).

    С 6 по 9 марта 1996 года, пока Вооружённые силы Ичкерии атаковали оккупантов в Грозном, российские чиновники запретили телевизионным группам в городе снимать(Citation: 1121). 8 августа 1996 года российский солдат на блокпосту у Грозного велел четырём журналистам иностранных СМИ повернуть назад и пригрозил уничтожить аппаратуру, а когда они повернули, оккупанты выстрелили по их машине из гранатомёта и промахнулись.
    Через два часа российские лётчики обстреляли журналистов с вертолётов у другого въезда в город, но никого не ранили(Citation: 1121).

    В отчёте за 1996 год международная организация Committee to Protect Journalists написала, что российские войска всю войну не признавали аккредитацию журналистов, портили их плёнку, уничтожали аппаратуру и стреляли по их машинам с блокпостов и боевых вертолётов(Citation: 1121).

    В августе 1996 года Вооружённые силы Ичкерии освободили Грозный от оккупантов, вынудив Россию сесть за стол переговоров(Citation: 1127). 31 августа 1996 года были подписаны мирные соглашения в Хасавюрте (подробнее: «Фиктивные договоры»)(Citation: 661). 31 декабря 1996 года последние российские войска ушли из республики(Citation: 27).
  en: |-
    In the autumn of 1994, Russia attacked the Chechen Republic of Ichkeria under the name of a puppet opposition, and on 11 December 1994 the Russian army openly invaded the republic.
    Russia decided which journalists could work in Ichkeria, confiscated their footage and persecuted them for reporting on the war.

    On 1 December 1994, ten days before the open invasion, Chernomyrdin, chairman of the Russian government, by directive No. 1886-r created the Temporary Information Center(Citation: 1341)(Citation: 27).
    On 9 December, by resolution No. 1360, the Russian government instructed the center to issue journalists accreditation, the permit to work in Ichkeria, and to withdraw it immediately for information the center deemed false.
    The government gave the Russian Interior Ministry (MVD) and the FSK (predecessor of today's FSB) the right to expel from Ichkeria any outsiders they deemed dangerous(Citation: 651).

    On 29 December 1994, the Russian MVD announced that the Temporary Information Center's accreditation gave no right to travel where the Russian Internal Troops (predecessors of today's Rosgvardia) were stationed(Citation: 27).

    At the end of January 1995, the Russian government created the Mobile Information Center in Mozdok, a town in Russian-controlled North Ossetia where the occupiers' headquarters stood.
    Only this center's accreditation gave journalists the right to be in the "combat zone", and there only under the supervision of servicemen or officials.
    The occupiers usually counted all of Ichkeria as this zone(Citation: 27).

    The Russian military expelled journalists without accreditation from the republic, and detained journalists with accreditation and confiscated their tapes and equipment, explaining that accreditation from the Ministry of Defense or the MVD was also needed(Citation: 27).

    On 15 December 1994, Soskovets, deputy chairman of the Russian government, announced that the government could strip the NTV television channel of its broadcasting license for its reports on the victims of the war in Ichkeria.
    After public protest, the government dropped this threat(Citation: 1335).

    At the end of May 1995, officers of the Russian FSB arrested NTV journalists near the stanitsa of Assinovskaya in the west of Ichkeria for filming Russian troop positions, although the commander of the Russian division had allowed it.
    The FSB held the journalists for six hours in a filtration camp and released them (see: "Filtration Camp System")(Citation: 988).
    On 3 June 1995, the Russian military arrested three foreign journalists on the border between Ichkeria and Russian-controlled Dagestan and reprimanded them for not having the proper accreditation.
    Four days later, on 7 June, the occupiers let the journalists go to Moscow but confiscated their tapes and film(Citation: 1335).

    On 25 June 1995, Yelena Masyuk, a journalist of the Russian television channel NTV, recorded an interview with Shamil Basayev, a commander of the Armed Forces of Ichkeria, in the Nozhai-Yurt district in the southeast of the republic(Citation: 1335).
    In April 1996, the journalist told the public tribunal of the Russian Glasnost Foundation in Moscow: "To get accreditation to work in Chechnya, you had to get to the military airfield in Mozdok, where the accreditations were issued — but to drive onto the airfield, you already had to have that accreditation."
    About the road to Shamil Basayev she told the tribunal: "To get to the Chechen village where, by my guess, Basayev was at the time, I had to walk 12 kilometers on foot around the Russian checkpoints"(Citation: 988).
    On 13 July 1995, the Prosecutor General's Office of Russia opened a criminal case against Yelena Masyuk for not telling the investigators where she had taken the interview.
    At the end of August, the prosecutor's office closed the case without charges and asked the Russian government's press agency to make sure such interviews did not happen again(Citation: 1335).

    From 6 to 9 March 1996, while the Armed Forces of Ichkeria were attacking the occupiers in Grozny, Russian officials forbade television crews in the city to film(Citation: 1121).
    On 8 August 1996, a Russian soldier at a checkpoint near Grozny told four journalists of foreign media to turn back and threatened to destroy their equipment, and when they turned around, the occupiers fired a grenade launcher at their car and missed.
    Two hours later, Russian pilots fired on the journalists from helicopters at another entrance to the city but wounded no one(Citation: 1121).

    In its report for 1996, the international organization Committee to Protect Journalists wrote that throughout the war Russian troops refused to recognize journalists' accreditation, spoiled their film, destroyed their equipment and fired on their cars from checkpoints and combat helicopters(Citation: 1121).

    In August 1996, the Armed Forces of Ichkeria liberated Grozny from the occupiers, forcing Russia to the negotiating table(Citation: 1127).
    On 31 August 1996, peace agreements were signed in Khasavyurt (see: "Sham Treaties")(Citation: 661).
    On 31 December 1996, the last Russian troops left the republic(Citation: 27).
  uk: |-
    Восени 1994 року Росія напала на Чеченську Республіку Ічкерія під іменем маріонеткової опозиції, а 11 грудня 1994 року російська армія відкрито вторглася в республіку.
    Росія вирішувала, яким журналістам працювати в Ічкерії, відбирала в них відзняті касети і переслідувала за репортажі про війну.

    1 грудня 1994 року, за десять днів до відкритого вторгнення, голова уряду Росії Черномирдін розпорядженням № 1886-р створив Тимчасовий інформаційний центр(Citation: 1341)(Citation: 27). 9 грудня постановою № 1360 російський уряд доручив центру видавати журналістам акредитацію, дозвіл працювати в Ічкерії, і негайно відбирати її за відомості, які центр визнає невірними.
    Уряд дав МВС Росії та ФСК (попередниці сучасної ФСБ) право висилати з Ічкерії приїжджих, яких вони визнають небезпечними(Citation: 651).

    29 грудня 1994 року МВС Росії оголосило, що акредитація Тимчасового інформаційного центру не дає права їздити туди, де стоять російські внутрішні війська (попередники сучасної Росгвардії)(Citation: 27).

    Наприкінці січня 1995 року російський уряд створив Мобільний інформаційний центр у Моздоку, місті в підконтрольній Росії Північній Осетії, де стояв штаб окупантів.
    Лише акредитація цього центру давала журналістам право перебувати в «зоні бойових дій», а там - лише під наглядом військових або чиновників.
    Окупанти зазвичай вважали цією зоною всю Ічкерію(Citation: 27).

    Російські військові висилали з республіки журналістів без акредитації, а журналістів з акредитацією затримували і відбирали в них касети та апаратуру, пояснюючи, що потрібна ще акредитація міністерства оборони або МВС(Citation: 27).

    15 грудня 1994 року заступник голови уряду Росії Сосковець оголосив, що уряд може відібрати в телеканалу НТВ ліцензію на мовлення за репортажі про жертв війни в Ічкерії.
    Після суспільного протесту уряд відмовився від цієї погрози(Citation: 1335).

    Наприкінці травня 1995 року співробітники ФСБ Росії біля станиці Ассинівська на заході Ічкерії заарештували журналістів НТВ за те, що вони знімали позиції російських військ, хоча командир російської дивізії це дозволив.
    ФСБ шість годин тримала журналістів у фільтраційному таборі і відпустила (докладніше: «Система фільтраційних таборів»)(Citation: 988). 3 червня 1995 року російські військові заарештували трьох іноземних журналістів на кордоні Ічкерії з підконтрольним Росії Дагестаном і вичитали їх за те, що в них немає потрібної акредитації.
    Через чотири дні, 7 червня, окупанти відпустили журналістів до Москви, а касети і плівку відібрали(Citation: 1335).

    25 червня 1995 року Олена Масюк, журналістка російського телеканалу НТВ, записала інтерв'ю з Шамілем Басаєвим, командиром Збройних сил Ічкерії, у Ножай-Юртівському районі на південному сході республіки(Citation: 1335).
    У квітні 1996 року журналістка розповіла в Москві громадському трибуналу російського фонду «Гласність»: «Щоб отримати акредитацію для роботи в Чечні, потрібно було потрапити на військовий аеродром у Моздоку, де видавали акредитації, — але для того, щоб проїхати на аеродром, потрібно було цю акредитацію вже мати».
    Про дорогу до Шаміля Басаєва вона сказала трибуналу: «Щоб потрапити в чеченське село, де, за моїми припущеннями, перебував тоді Басаєв, мені потрібно було в обхід російських блокпостів пройти 12 кілометрів пішки»(Citation: 988). 13 липня 1995 року Генеральна прокуратура Росії порушила проти Олени Масюк кримінальну справу за те, що вона не розповіла слідству, де брала інтерв'ю.
    Наприкінці серпня прокуратура закрила справу без обвинення і попросила відомство уряду Росії у справах преси зробити так, щоб такі інтерв'ю не повторювалися(Citation: 1335).

    З 6 по 9 березня 1996 року, поки Збройні сили Ічкерії атакували окупантів у Грозному, російські чиновники заборонили телевізійним групам у місті знімати(Citation: 1121). 8 серпня 1996 року російський солдат на блокпосту біля Грозного наказав чотирьом журналістам іноземних ЗМІ повернути назад і пригрозив знищити апаратуру, а коли вони повернули, окупанти вистрілили по їхній машині з гранатомета і промахнулися.
    Через дві години російські льотчики обстріляли журналістів з вертольотів біля іншого в'їзду до міста, але нікого не поранили(Citation: 1121).

    У звіті за 1996 рік міжнародна організація Committee to Protect Journalists написала, що російські війська всю війну не визнавали акредитацію журналістів, псували їхню плівку, знищували апаратуру і стріляли по їхніх машинах з блокпостів і бойових вертольотів(Citation: 1121).

    У серпні 1996 року Збройні сили Ічкерії звільнили Грозний від окупантів, змусивши Росію сісти за стіл переговорів(Citation: 1127). 31 серпня 1996 року було підписано мирні угоди в Хасав'юрті (докладніше: «Фіктивні договори»)(Citation: 661). 31 грудня 1996 року останні російські війська пішли з республіки(Citation: 27).
