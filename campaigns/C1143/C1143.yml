name:
  ru: Показательное уничтожение аула Дади-юрт и возведение крепости Внезапной для вытеснения нохчи с кумыкской плоскости (1819)
  en: Demonstrative destruction of the aul of Dadi-Yurt and the construction of the Vnezapnaya fortress to force the Nokhchi off the Kumyk plain (1819)
  uk: Показове знищення аулу Даді-юрт і зведення фортеці Внезапної для витіснення Нохчі з кумицької рівнини (1819)
description:
  ru: |-
    После возведения крепости Грозной на Сунже в 1818 году генерал Ермолов продолжил, как пишет историк Д. А. Хожаев, «сжимать непокорную Чечню новыми крепостями и укреплениями», и в их ряду в 1819 году появилась крепость Внезапная(Citation: 95).
    Имперский историк Потто прямо называет её назначение: заложенная восемнадцатого июля 1819 года, она «разделила чеченцев от кумыков» и «преграждала [чеченцам] путь к дагестанцам через Салатавские горы»(Citation: 75).
    Потто пишет, что Ермолов «решил очистить всю кумыкскую плоскость… заставив чеченцев уйти отсюда за горный Качкалыковский хребет», а добиться, чтобы те сами увели семьи, «можно было только примером ужаса»(Citation: 75).
    Показательной жертвой выбрали нохчийский аул Дади-юрт.
    Историк Д. А. Хожаев пишет, что аул в 200 дворов был «одним из богатейших в Чечне» и «славился своими храбрыми и трудолюбивыми жителями, красотой и благородством девушек»(Citation: 95).
    Ермолов приказал генерал-майору Сысоеву окружить аул и, «буде станут противиться, наказать оружием, никому не давая пощады»(Citation: 96).
    Пятнадцатого сентября 1819 года аул окружили шесть кабардинских рот и семь сотен казаков, и брали его, штурмуя каждый двор под артиллерией(Citation: 75)(Citation: 95).
    Ермолов сам в своих «Записках» признаёт исход: «все, бывшие с оружием, истреблены, и число оных не менее могло быть четырёхсот человек», женщин и детей «взято в плен до ста сорока… но гораздо большее число вырезано было или в домах погибло от действия артиллерии и пожара», а селение «состояло из 200 домов» и было «разорено до основания»(Citation: 96).
    Уцелевших женщин и детей увели пленными за Терек; историк Д. А. Хожаев пишет, что во время переправы 46 захваченных девушек, «не желая переносить надругательства в плену», погибли, «хватая с собой конвоиров в бурную реку»(Citation: 95).
    После уничтожения аула качкалыковские селения Ермолов добивал уже почти без сопротивления; сам он признаёт: «пример Дадан-юрта распространил повсюду ужас»(Citation: 96).
  en: |-
    After the construction of the Groznaya fortress on the Sunzha in 1818, General Yermolov continued, as historian D. A. Khozhaev writes, to "squeeze unsubdued Chechnya with new fortresses and fortifications," and among these, in 1819, appeared the fortress of Vnezapnaya(Citation: 95).
    Imperial historian Potto names its purpose outright: founded on the eighteenth of July 1819, it "separated the Chechens from the Kumyks" and "blocked [the Chechens'] path to the Dagestanis through the Salatau mountains"(Citation: 75).
    Potto writes that Yermolov "decided to clear the entire Kumyk plain… by making the Chechens leave it for beyond the Kachkalyk mountain ridge," and getting them to take their families away themselves "was possible only by an example of terror"(Citation: 75).
    The Nokhchi aul of Dadi-Yurt was chosen as the demonstrative victim.
    Historian D. A. Khozhaev writes that the aul of 200 households was "one of the richest in Chechnya" and "was famed for its brave and industrious inhabitants and for the beauty and nobility of its girls"(Citation: 95).
    Yermolov ordered Major General Sysoev to surround the aul and, "should they resist, to punish them with arms, giving quarter to no one"(Citation: 96).
    On the fifteenth of September 1819 the aul was surrounded by six Kabardian companies and seven hundred Cossacks, who took it by storming each household under artillery fire(Citation: 75)(Citation: 95).
    Yermolov himself admits the outcome in his "Notes": "all who bore arms were exterminated, and their number could not have been fewer than four hundred men"; of women and children "up to one hundred and forty were taken prisoner… but a far greater number were slaughtered or perished in the houses from the effects of artillery and fire," while the village "consisted of 200 houses" and was "razed to its foundations"(Citation: 96).
    The surviving women and children were led away as prisoners beyond the Terek; historian D. A. Khozhaev writes that during the river crossing 46 captured girls, "unwilling to endure abuse in captivity," perished, "dragging their guards with them into the turbulent river"(Citation: 95).
    After the destruction of the aul, Yermolov finished off the Kachkalyk villages with almost no resistance left; he himself admits: "the example of Dadan-Yurt spread terror everywhere"(Citation: 96).
  uk: |-
    Після зведення фортеці Грозної на Сунжі 1818 року генерал Єрмолов продовжив, як пише історик Д. А. Хожаєв, «стискати непокірну Чечню новими фортецями та укріпленнями», і в їхньому ряду 1819 року з'явилася фортеця Внезапна(Citation: 95).
    Імперський історик Потто прямо називає її призначення: закладена вісімнадцятого липня 1819 року, вона «відокремила Чеченців від Кумиків» і «перегороджувала [Чеченцям] шлях до дагестанців через Салатавські гори»(Citation: 75).
    Потто пише, що Єрмолов «вирішив очистити всю кумицьку рівнину… змусивши Чеченців піти звідси за гірський Качкаликівський хребет», а домогтися, щоб ті самі відвели сім'ї, «можна було лише прикладом жаху»(Citation: 75).
    Показовою жертвою обрали нохчійський аул Даді-юрт.
    Історик Д. А. Хожаєв пише, що аул на 200 дворів був «одним із найбагатших у Чечні» і «славився своїми хоробрими та працьовитими жителями, красою і шляхетністю дівчат»(Citation: 95).
    Єрмолов наказав генерал-майорові Сисоєву оточити аул і, «якщо чинитимуть опір, покарати зброєю, нікому не даючи пощади»(Citation: 96).
    П'ятнадцятого вересня 1819 року аул оточили шість кабардинських рот і сім сотень козаків, і брали його, штурмуючи кожен двір під артилерією(Citation: 75)(Citation: 95).
    Єрмолов сам у своїх «Записках» визнає результат: «усі, хто був зі зброєю, винищені, і число їх не менш як чотириста осіб», жінок і дітей «узято в полон до ста сорока… але значно більше число було вирізано або загинуло в домах від дії артилерії та пожежі», а селище «складалося з 200 домів» і було «розорене дощенту»(Citation: 96).
    Уцілілих жінок і дітей повели полоненими за Терек; історик Д. А. Хожаєв пише, що під час переправи 46 захоплених дівчат, «не бажаючи терпіти наругу в полоні», загинули, «хапаючи з собою конвоїрів у бурхливу річку»(Citation: 95).
    Після знищення аулу качкаликівські селища Єрмолов добивав уже майже без опору; сам він визнає: «приклад Дадан-юрта поширив усюди жах»(Citation: 96).
