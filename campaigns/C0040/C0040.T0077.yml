description:
  en: 'The use of regular troops to brutally suppress the unrest of the deceived population: the 1817 uprising of the Buh Cossacks against being turned into military settlers was crushed by four regiments - over 10,000 soldiers with artillery; the rebels were cut down with sabres, drowned in the Southern Buh, and flogged with whips(Citation: 185).'
  uk: 'Використання регулярних військ для жорстокого придушення заворушень обманутого населення: повстання бузьких козаків 1817 року проти перетворення на військових поселенців придушили чотири полки - понад 10 тисяч солдатів з артилерією; повстанців рубали шаблями, топили в Південному Бузі, сікли батогами(Citation: 185).'
  ru: 'Использование регулярных войск для жестокого подавления волнений обманутого населения: восстание бугских казаков 1817 года против превращения в военных поселенцев давили четыре полка - свыше 10 тысяч солдат с артиллерией; повстанцев рубили саблями, топили в Южном Буге, секли батогами(Citation: 185).'
