description:
  en: 'Mass conscription into the militia and the formation of Cossack regiments on the basis of false promises to restore Cossack liberties: "Ukraine was used for the recruitment, equipping, and movement of troops… including a 75-thousand-strong militia from the Kyiv, Podillia, Chernihiv, and Poltava governorates"(Citation: 185).'
  uk: 'Масовий призов до ополчення та формування козачих полків на основі неправдивих обіцянок повернути козацькі вольності: «Україна використовувалася для комплектування, спорядження, переміщення військ… в т. ч. 75-тис. ополчення з Київ., Подільської, Черніг. та Полтав. губ.»(Citation: 185).'
  ru: 'Массовый призыв в ополчение и формирование казачьих полков на основе ложных обещаний вернуть казацкие вольности: «Украина использовалась для комплектования, снаряжения, перемещения войск… в т. ч. 75-тысячного ополчения из Киевской, Подольской, Черниговской и Полтавской губерний»(Citation: 185).'
