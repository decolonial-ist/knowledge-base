name:
  ru: 'Война с Наполеоном: принудительная мобилизация и обман (1812)'
  en: 'War with Napoleon: Forced Mobilization and Deception (1812)'
  uk: 'Війна з Наполеоном: примусова мобілізація та обман (1812)'
description:
  ru: |-
    Ложное обещание властей вернуть коренному населению утраченные казацкие вольности в обмен на кровь.
    Империя выжала из края максимум: «с обеих его сторон Украина использовалась для комплектования, снаряжения, перемещения войск… в т. ч. 75-тысячного ополчения из Киевской, Подольской, Черниговской и Полтавской губерний»(Citation: 185), а после войны формирования распустили, обещания забыли(Citation: 24); когда бугские казаки в 1817 году отказались превращаться в военных поселенцев, их восстание подавили четыре полка с артиллерией(Citation: 185).
  en: |-
    The authorities' false promise to return the lost Cossack liberties to the indigenous population in exchange for blood.
    The empire squeezed the maximum out of the land: "on both of its banks, Ukraine was used for the recruitment, equipping, and movement of troops… including a 75-thousand-strong militia from the Kyiv, Podillia, Chernihiv, and Poltava governorates"(Citation: 185), and after the war the formations were disbanded and the promises forgotten(Citation: 24); when the Buh Cossacks refused to be turned into military settlers in 1817, their uprising was crushed by four regiments with artillery(Citation: 185).
  uk: |-
    Неправдива обіцянка влади повернути корінному населенню втрачені козацькі вольності в обмін на кров.
    Імперія вичавила з краю максимум: «з обох його боків Україна використовувалася для комплектування, спорядження, переміщення військ… в т. ч. 75-тис. ополчення з Київ., Подільської, Черніг. та Полтав. губ.»(Citation: 185), а після війни формування розпустили, обіцянки забули(Citation: 24); коли бузькі козаки 1817 року відмовилися ставати військовими поселенцями, їхнє повстання придушили чотири полки з артилерією(Citation: 185).
