name:
  en: 'Operation "Chechevitsa": the Total Deportation of the Chechen People and the Special Settlement Regime (1943-1949)'
  uk: 'Операція «Сочевиця»: тотальна депортація чеченського народу і режим спецпоселення (1943-1949)'
  ru: 'Операция «Чечевица»: тотальная депортация чеченского народа и режим спецпоселения (1943-1949)'
description:
  en: |-
    On 23 February 1944 the USSR deported the entire Chechen people from their native land to Kazakhstan and Kirghizia (today's Kyrgyzstan).
    The deportation was total - the numbers show it: the 1939 census counted 387.5 thousand Chechens in Checheno-Ingushetia(Citation: 533), and by 1 March 1944 the Soviet NKVD (predecessor of today's FSB) reported 387,229 deported Chechens - 478,479 people together with the Ingush(Citation: 260).
    The colonizer named this expulsion Operation "Chechevitsa" ("Lentil"): historian P. M. Polian writes that already in November 1943 Deputy People's Commissar (Minister) of Internal Affairs Chernyshev was discussing with the heads of regional NKVD directorates "questions connected with the planned Operation 'Chechevitsa' - the deportation of some 0.5 million Vainakhs (Chechens and Ingush)"(Citation: 533).
    The supreme organ of the occupation authority (the "Politburo of the TsK VKP(b)") had been discussing the deportation a year before the announced pretext - the accusation that the people had aided the Germans: on 11 February 1943 the talk was already about timing, and Stalin "leaned toward the second proposal" - to deport after the Germans had been driven from the Caucasus(Citation: 260).
    Albogachiev, the former People's Commissar (Minister) of Internal Affairs of the republic, admitted in 1963: "I repeat once more - there were no grounds whatsoever for the deportation of the Chechens and Ingush.
    This was confirmed by Beria himself during his trial in 1953"(Citation: 125).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "All of the above allows us to qualify with confidence the deportation, in this case of the Chechens and Ingush, as the gravest of crimes - genocide"(Citation: 125).
    Historian D. A. Khozhaev writes: "the second attempt to annihilate the Chechens was undertaken in 1944, when the entire people was driven from its native land and deported to Central Asia and Kazakhstan"(Citation: 95).
    On 26 April 1991 the colonizer acknowledged the genocide by its own law - Article 2 of the RSFSR law "On the Rehabilitation of Repressed Peoples" states: "Repressed peoples are recognized to be those peoples... against whom, on grounds of national or other identity, a state-level policy of slander and genocide was carried out, accompanied by their forcible resettlement..."(Citation: 550).
    In 2004 the European Parliament recognized in a resolution: "the deportation of the entire Chechen people to Central Asia on 23 February 1944 on the orders of Stalin constitutes an act of genocide within the meaning of the Fourth Hague Convention of 1907 and the Convention for the Prevention and Repression of the Crime of Genocide adopted by the UN General Assembly on 9 December 1948"(Citation: 551).
    In its resolution of 18 October 2022 the Verkhovna Rada of Ukraine condemned "the international crimes committed by the russian federation during the first (1994-1996) and second (1999-2009) wars against the Chechen Republic of Ichkeria, the policy of genocide of the Chechen people, following the criminal actions of the tsarist regime of 1817-1864 and of the soviet authorities of 1944"(Citation: 552).
  uk: |-
    23 лютого 1944 року СРСР депортував увесь чеченський народ з рідної землі до Казахстану й Киргизії (нинішній Киргизстан).
    Депортація була поголовною - це видно з чисел: за переписом 1939 року в Чечено-Інгушетії жило 387,5 тисячі чеченців(Citation: 533), і до 1 березня 1944 року радянський НКВД (попередник сучасної ФСБ) відзвітував про 387 229 депортованих чеченців - разом з інгушами 478 479 людей(Citation: 260).
    Колонізатор назвав це виселення операцією «Сочевиця» («Чечевица»): історик П. М. Полян пише, що вже в листопаді 1943 року заступник народного комісара (міністра) внутрішніх справ Чернишев обговорював з начальниками регіональних управлінь НКВД «питання, пов'язані з запланованою операцією «Чечевица» - депортацією близько 0,5 млн вайнахів (чеченців та інгушів)»(Citation: 533).
    Вищий орган окупаційної влади («Політбюро ЦК ВКП(б)») обговорював виселення ще за рік до оголошеного приводу - звинувачення народу в пособництві німцям: 11 лютого 1943 року йшлося вже про строки, і Сталін «схилився до другої пропозиції» - виселити після вигнання німців з Кавказу(Citation: 260).
    Колишній народний комісар (міністр) внутрішніх справ республіки Албогачієв визнав 1963 року: «Повторюю ще раз - не було жодних причин для виселення чеченців та інгушів.
    Це підтвердив і сам Берія під час процесу над ним 1953 року»(Citation: 125).
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть: «Усе зазначене дозволяє впевнено кваліфікувати депортацію, в цьому випадку чеченців та інгушів, як найтяжчий злочин - геноцид»(Citation: 125).
    Історик Д. А. Хожаєв пише: «друга спроба знищення чеченців була здійснена 1944 року, коли весь народ був зігнаний з рідної землі й депортований до Середньої Азії та Казахстану»(Citation: 95). 26 квітня 1991 року колонізатор визнав геноцид власним законом - у статті 2 закону РРФСР «Про реабілітацію репресованих народів» сказано: «Репресованими визнаються народи..., щодо яких за ознаками національної чи іншої належності проводилася на державному рівні політика наклепу та геноциду, що супроводжувалася їх насильницьким переселенням...»(Citation: 550).
    Європейський парламент 2004 року визнав у резолюції: «депортація всього чеченського народу до Середньої Азії 23 лютого 1944 року за наказом Сталіна є актом геноциду у розумінні IV Гаазької конвенції 1907 року та Конвенції про запобігання злочину геноциду і покарання за нього, ухваленої Генеральною Асамблеєю ООН 9 грудня 1948 року»(Citation: 551).
    Верховна Рада України в постанові від 18 жовтня 2022 року засудила «міжнародні злочини, вчинені російською федерацією під час першої (1994-1996) і другої (1999-2009) війн проти Чеченської Республіки Ічкерія, політику геноциду Чеченського народу, наслідуючи злочинні дії царського режиму 1817-1864 років та радянської влади 1944 року»(Citation: 552).
  ru: |-
    23 февраля 1944 года СССР выселил весь чеченский народ с родной земли в Казахстан и Киргизию (нынешний Кыргызстан).
    Депортация была поголовной - это видно по числам: по переписи 1939 года в Чечено-Ингушетии жило 387,5 тысячи чеченцев(Citation: 533), и к 1 марта 1944 года советский НКВД (предшественник современной ФСБ) отчитался о 387 229 депортированных чеченцах - вместе с ингушами 478 479 человек(Citation: 260).
    Колонизатор назвал это выселение операцией «Чечевица»: историк П. М. Полян пишет, что уже в ноябре 1943 года заместитель народного комиссара (министра) внутренних дел Чернышев обсуждал с начальниками региональных управлений НКВД «вопросы, связанные с намечаемой операцией «Чечевица» — депортацией около 0,5 млн вайнахов (чеченцев и ингушей)»(Citation: 533).
    Высший орган оккупационной власти («Политбюро ЦК ВКП(б)») обсуждал выселение ещё за год до объявленного повода - обвинения народа в пособничестве немцам: 11 февраля 1943 года речь шла уже о сроках, и Сталин «склонился ко второму предложению» - выселить после изгнания немцев с Кавказа(Citation: 260).
    Бывший народный комиссар (министр) внутренних дел республики Албогачиев признал в 1963 году: «Повторяю еще раз - не было никаких причин для выселения чеченцев и ингушей.
    Это подтвердил и сам Берия во время процесса над ним в 1953 году»(Citation: 125).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Все указанное позволяет уверенно квалифицировать депортацию, в данном случае чеченцев и ингушей, как тягчайшее преступление - геноцид»(Citation: 125).
    Историк Д. А. Хожаев пишет: «вторая попытка уничтожения чеченцев была предпринята в 1944 году, когда весь народ был согнан с родной земли и депортирован в Среднюю Азию и Казахстан»(Citation: 95). 26 апреля 1991 года колонизатор признал геноцид собственным законом - в статье 2 закона РСФСР «О реабилитации репрессированных народов» сказано: «Репрессированными признаются народы..., в отношении которых по признакам национальной или иной принадлежности проводилась на государственном уровне политика клеветы и геноцида, сопровождавшаяся их насильственным переселением...»(Citation: 550).
    Европейский парламент в 2004 году признал в резолюции: «депортация всего чеченского народа в Среднюю Азию 23 февраля 1944 года по приказу Сталина является актом геноцида по смыслу IV Гаагской конвенции 1907 года и Конвенции о предупреждении преступления геноцида и наказании за него, принятой Генеральной Ассамблеей ООН 9 декабря 1948 года»(Citation: 551).
    Верховная Рада Украины в постановлении от 18 октября 2022 года осудила «международные преступления, совершённые российской федерацией во время первой (1994-1996) и второй (1999-2009) войн против Чеченской Республики Ичкерия, политику геноцида Чеченского народа, наследуя преступные действия царского режима 1817-1864 годов и советской власти 1944 года»(Citation: 552).
