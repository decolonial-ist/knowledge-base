description:
  ru: |-
    Колонизатор упразднил саму республику чеченцев и ингушей и раскроил их землю между соседями: 7 марта 1944 года Президиум Верховного Совета СССР издал указ «О ликвидации Чечено-Ингушской АССР и об административном устройстве ее территории»(Citation: 260): равнинная Чечня вошла в созданный тогда же Грозненский округ Ставропольского края - через месяц колонизатор преобразовал его в Грозненскую область(Citation: 533), горная часть поделена между Грузинской ССР (нынешней Грузией) и Дагестанской АССР (нынешним Дагестаном в составе России), ингушские земли переданы Северной Осетии(Citation: 125).
    Юридически упразднение закреплено законом 25 июня 1946 года(Citation: 260).
  en: |-
    The colonizer abolished the very republic of the Chechens and Ingush and carved up their land among its neighbors: on 7 March 1944 the Presidium of the Supreme Soviet of the USSR issued the decree "On the Liquidation of the Checheno-Ingush ASSR and the Administrative Organization of Its Territory"(Citation: 260): lowland Chechnya went into the newly created Grozny Okrug of Stavropol Krai - a month later the colonizer transformed it into Grozny Oblast(Citation: 533); the mountain part was divided between the Georgian SSR (today's Georgia) and the Dagestan ASSR (today's Dagestan within Russia), and the Ingush lands were handed to North Ossetia(Citation: 125).
    The abolition was given legal form by the law of 25 June 1946(Citation: 260).
  uk: |-
    Колонізатор скасував саму республіку чеченців та інгушів і розкраяв їхню землю між сусідами: 7 березня 1944 року Президія Верховної Ради СРСР видала указ «Про ліквідацію Чечено-Інгушської АРСР та про адміністративний устрій її території»(Citation: 260): рівнинна Чечня увійшла до створеного тоді ж Грозненського округу Ставропольського краю - через місяць колонізатор перетворив його на Грозненську область(Citation: 533), гірську частину поділено між Грузинською РСР (нинішньою Грузією) та Дагестанською АРСР (нинішнім Дагестаном у складі Росії), інгушські землі передано Північній Осетії(Citation: 125).
    Юридично скасування закріплено законом від 25 червня 1946 року(Citation: 260).
