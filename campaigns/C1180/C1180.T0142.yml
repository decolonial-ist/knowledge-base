description:
  en: |-
    The colonizer locked the exiled Chechens and Ingush into their places of settlement: the commandant's offices forbade absences without their permission, and the mutual surety of the "ten-yard groups" was in force - ten neighboring households answered for one another(Citation: 125).
    People fled anyway: from the spring of 1944 to the end of 1950 - over 20.6 thousand escapes, and the chekists caught nearly all the escapees(Citation: 125).
    In 1948 the colonizer forbade the exiles to live within 100 kilometers of the USSR border and forcibly resettled over 6 thousand people deeper into Kazakhstan(Citation: 125).
  uk: |-
    Колонізатор замкнув засланих чеченців та інгушів у місцях вселення: комендатури заборонили відлучки без свого дозволу, діяла кругова порука «десятидвірок» - десять сусідніх дворів відповідали одне за одного(Citation: 125).
    Люди все одно тікали: за весну 1944 - кінець 1950 року - понад 20,6 тисячі втеч, майже всіх утікачів чекісти затримали(Citation: 125). 1948 року колонізатор заборонив засланцям жити ближче ніж за 100 кілометрів від кордону СРСР і повторно переселив понад 6 тисяч людей углиб Казахстану(Citation: 125).
  ru: |-
    Колонизатор запер ссыльных чеченцев и ингушей в местах вселения: комендатуры запретили отлучки без своего разрешения, действовала круговая порука «десятидворок» - десять соседних дворов отвечали друг за друга(Citation: 125).
    Люди всё равно бежали: за весну 1944 - конец 1950 года - свыше 20,6 тысячи побегов, почти всех беглецов чекисты задержали(Citation: 125).
    В 1948 году колонизатор запретил ссыльным жить ближе 100 километров от границы СССР и повторно переселил свыше 6 тысяч человек вглубь Казахстана(Citation: 125).
