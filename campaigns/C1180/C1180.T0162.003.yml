description:
  en: |-
    In April-May 1943 officers of the Soviet NKVD (predecessor of today's FSB), led by Kolesnikov, Deputy People's Commissar (Minister) of Internal Affairs of the republic, in the course of "anti-banditry operations" detained Chechens "suspected of ties with bandits" and shot them "unlawfully, without trial or investigation" - 25 people in two months, "citizens guilty of nothing whatsoever": in the village of Bachi-Yurt, on the orders of cavalry platoon commander Volosov, the convoy shot 17 of 19 detainees, among them a 15-year-old girl; in the village of Belty a convoy headed by Soviet militia section commander Dubasov shot four people "without any pretext whatsoever" and delivered their corpses to the district branch of the NKVD; at the Kuloi hamlet Meishvili, a battalion commander of the NKVD troops (predecessors of today's Rosgvardia), shot the brothers Baisar and Baim Bataev, Dzhamalani Pitalov and Mavla Chebiev(Citation: 533).
    The executioners wrote the shootings off as "attempted escape," and Kolesnikov issued "findings that the use of weapons had been proper"; all this was established by the Chief Military Prosecutor's Office following a letter from the Chechen Dokhtukaev, written from exile - the results were reported in 1957 to Bulganin, head of the government of the USSR, but no one was ever brought to court: the ten-year statute of limitations had expired(Citation: 533).
  uk: |-
    У квітні-травні 1943 року співробітники радянського НКВД (попередника сучасної ФСБ) на чолі із заступником народного комісара (міністра) внутрішніх справ республіки Колесниковим під час «операцій з боротьби з бандитизмом» затримували чеченців, «підозрюваних у зв'язках з бандитами», і розстрілювали їх «незаконно, без суду і слідства» - за два місяці 25 людей, «ні в чому не винних громадян»: у селі Бачі-Юрт за наказом командира кавалерійського взводу Волосова конвой розстріляв 17 з 19 затриманих, серед них 15-річну дівчину; в селі Бельти конвой на чолі з командиром відділення радянської міліції Дубасовим «без жодних приводів» розстріляв чотирьох і привіз до районного відділу НКВД їхні трупи; на хуторі Кулой командир батальйону військ НКВД (попередників сучасної Росгвардії) Мейшвілі розстріляв братів Байсара та Баїма Батаєвих, Джамалані Піталова та Мавлу Чебієва(Citation: 533).
    Кати списували розстріли на «спробу втечі», Колесников давав «висновок про правильність застосування зброї»; усе це встановила Головна військова прокуратура за листом чеченця Дохтукаєва із заслання - підсумок 1957 року доповіли голові уряду СРСР Булганіну, але до суду нікого так і не притягнули: сплив десятирічний строк давності(Citation: 533).
  ru: |-
    В апреле-мае 1943 года сотрудники советского НКВД (предшественника современной ФСБ) во главе с заместителем народного комиссара (министра) внутренних дел республики Колесниковым во время «операций по борьбе с бандитизмом» задерживали чеченцев, «подозреваемых в связях с бандитами», и расстреливали их «незаконно, без суда и следствия» - за два месяца 25 человек, «ни в чем не повинных граждан»: в селе Бачи-Юрт по приказу командира кавалерийского взвода Волосова конвой расстрелял 17 из 19 задержанных, среди них 15-летнюю девушку; в селе Бельты конвой во главе с командиром отделения советской милиции Дубасовым «без всяких поводов» расстрелял четверых и привёз в районный отдел НКВД их трупы; на хуторе Кулой командир батальона войск НКВД (предшественников современной Росгвардии) Мейшвили расстрелял братьев Байсара и Баима Батаевых, Джамалани Питалова и Мавлу Чебиева(Citation: 533).
    Палачи списывали расстрелы на «попытку к бегству», Колесников давал «заключение о правильности применения оружия»; всё это установила Главная военная прокуратура по письму чеченца Дохтукаева из ссылки - итог в 1957 году доложили главе правительства СССР Булганину, но к суду никого так и не привлекли: истёк десятилетний срок давности(Citation: 533).
