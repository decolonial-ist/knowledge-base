description:
  en: |-
    The colonizer cut the Chechens off from medical care from the first day of the deportation: the Chechen historian Dalkhan Khozhaev writes that the troops, driving people out of their homes, "threw the sick off their hospital beds"(Citation: 553).
    Typhus broke out in the trains - the certificate of the Soviet NKVD (predecessor of today's FSB) of 7 April 1944 on those brought to Kirghizia states: "412 people died and 278 were hospitalized"(Citation: 555).
    With no quarantine and no medicine at the destinations the epidemic spread: by 1 April 1944 about 4,800 people had fallen ill in Kazakhstan, over 2,000 in Kirghizia(Citation: 125).
    The colonizer forbade local residents, on pain of arrest, to help the dying Chechens.
    The Chechen historian A. G. Avtorkhanov writes: "The local population was categorically forbidden to render help to the dying by giving food, water or medicine.
    Even a simple display of human sympathy for the perishing women and children was punished with arrests"(Citation: 369).
  uk: |-
    Колонізатор відрізав чеченцям медичну допомогу з першого дня виселення: чеченський історик Далхан Хожаєв пише, що війська, виганяючи людей з домівок, «хворих скидали з лікарняних ліжок»(Citation: 553).
    В ешелонах спалахнув висипний тиф - у довідці радянського НКВД (попередника сучасної ФСБ) від 7 квітня 1944 року про довезених до Киргизії сказано: «померло 412 людей і 278 госпіталізовано»(Citation: 555).
    Без карантину й медицини на місцях епідемія розрослася: до 1 квітня 1944 року в Казахстані захворіло близько 4800 людей, у Киргизії - понад 2000(Citation: 125).
    Колонізатор під загрозою арешту заборонив місцевим жителям допомагати вмираючим чеченцям.
    Чеченський історик А. Г. Авторханов пише: «Місцевому населенню було категорично заборонено надавати допомогу вмираючим подачею їжі, води чи медикаментів.
    Навіть простий вияв людського співчуття до гинучих жінок і дітей карався арештами»(Citation: 369).
  ru: |-
    Колонизатор отрезал чеченцам медицинскую помощь с первого дня выселения: чеченский историк Далхан Хожаев пишет, что войска, выгоняя людей из домов, «больных сбрасывали с больничных коек»(Citation: 553).
    В эшелонах вспыхнул сыпной тиф - в справке советского НКВД (предшественника современной ФСБ) от 7 апреля 1944 года о довезённых до Киргизии сказано: «умерло 412 человек и 278 госпитализировано»(Citation: 555).
    Без карантина и медицины на местах эпидемия разрослась: к 1 апреля 1944 года в Казахстане заболело около 4800 человек, в Киргизии - свыше 2000(Citation: 125).
    Колонизатор под угрозой ареста запретил местным жителям помогать умирающим чеченцам.
    Чеченский историк А. Г. Авторханов пишет: «Местному населению было категорически запрещено оказывать помощь умирающим подачей пищи, воды или медикаментов.
    Даже простое проявление человеческого сочувствия погибающим женщинам и детям каралось арестами»(Citation: 369).
