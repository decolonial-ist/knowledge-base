description:
  ru: |-
    Депортировав чеченский народ в феврале 1944 года, колонизатор сжигал его книги и рукописи.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «На площадях и улицах Грозного запылали костры из книг.
    Сжигалась вся литература и учебники на арабском, чеченском и ингушском языках»(Citation: 125).
    Историк Д. А. Хожаев пишет о родовых хрониках - тяптарах: «Три дня и три ночи горел костер в центре Грозного, в пламени которого были уничтожены почти все чеченские тяптары, а также вся рукописная и печатная литература, посвященная истории и культуре чеченцев»(Citation: 95).
    Из аулов, пишет Д. А. Хожаев, в открытых грузовиках везли «древние рукописи, религиозно-философские трактаты, арабоязычные книги по математике, астрономии, медицине, исторические хадисы, древние предания чеченцев и ингушей на арабском и чеченском (арабской графики) языках, светскую художественную литературу.
    Все эти книги и рукописи были свалены в Грозном прямо на снег у туалета в сквере, примыкающем к Дворцу пионеров»(Citation: 553).
  en: |-
    Having deported the Chechen people in February 1944, the colonizer burned its books and manuscripts.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "On the squares and streets of Grozny bonfires of books blazed up.
    All literature and textbooks in Arabic, Chechen and Ingush were burned"(Citation: 125).
    Historian D. A. Khozhaev writes about the clan chronicles - the tyaptars: "For three days and three nights a bonfire burned in the center of Grozny, in whose flames were destroyed nearly all the Chechen tyaptars, as well as all the manuscript and printed literature devoted to the history and culture of the Chechens"(Citation: 95).
    From the auls, writes D. A. Khozhaev, open trucks carried "ancient manuscripts, religious-philosophical treatises, Arabic-language books on mathematics, astronomy, medicine, historical hadiths, ancient legends of the Chechens and Ingush in Arabic and in Chechen (in Arabic script), secular belles-lettres.
    All these books and manuscripts were dumped in Grozny straight onto the snow by the public toilet in the square adjoining the Palace of Pioneers"(Citation: 553).
  uk: |-
    Депортувавши чеченський народ у лютому 1944 року, колонізатор спалював його книги й рукописи.
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть: «На майданах і вулицях Грозного запалали вогнища з книг.
    Спалювалася вся література та підручники арабською, чеченською та інгушською мовами»(Citation: 125).
    Історик Д. А. Хожаєв пише про родові хроніки - тяптари: «Три дні і три ночі горіло вогнище в центрі Грозного, в полум'ї якого були знищені майже всі чеченські тяптари, а також уся рукописна й друкована література, присвячена історії та культурі чеченців»(Citation: 95).
    З аулів, пише Д. А. Хожаєв, у відкритих вантажівках везли «давні рукописи, релігійно-філософські трактати, арабомовні книги з математики, астрономії, медицини, історичні хадиси, давні перекази чеченців та інгушів арабською і чеченською (арабської графіки) мовами, світську художню літературу.
    Усі ці книги й рукописи були звалені в Грозному просто на сніг біля туалету в сквері, що прилягає до Палацу піонерів»(Citation: 553).
