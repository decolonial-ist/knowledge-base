description:
  ru: |-
    23 февраля 1944 года колонизатор мобилизовал в Грозном студентов и домохозяек, не занятых на фабриках, и с шести утра развёз их по чеченским аулам, из которых через полчаса после их прибытия войска увезли арестованных чеченцев.
    Чеченский историк А. Г. Авторханов приводит свидетельство одного из мобилизованных - русского студента Грозненского нефтяного института: «Таким образом мы были по тщательно разработанному плану распределены по аулам, 20 – 30 человек на аул»(Citation: 369).
    Студент пишет о работе, которую им дали в аулах: «Задача студентов заключалась в том, чтобы до прибытия переселенцев из Курской и Орловской областей держать хозяйство в порядке.
    Мы должны были собирать скот, кормить его, принять зерно, инвентарь и т. д.»(Citation: 369).
    К середине мая 1944 года в Грозненскую область прибыло переселенцев числом в 40% от выселенных чеченцев, в том числе 6800 семей из Ставропольского края(Citation: 125).
    В переданные Дагестану районы колонизатор переселил 65 тысяч человек из 224 горных дагестанских селений(Citation: 125).
    Гибли и переселенцы: в Ауховском районе за 1944-1947 годы от болезней умерло около 2 тысяч - почти треть - переселённых лакцев, одного из горских народов Дагестана(Citation: 125).
  en: |-
    On 23 February 1944 the colonizer mobilized students and housewives not employed at factories in Grozny and from six in the morning drove them out to the Chechen auls, from which, half an hour after their arrival, the troops took away the arrested Chechens.
    The Chechen historian A. G. Avtorkhanov cites the testimony of one of the mobilized - a Russian student of the Grozny Petroleum Institute: "Thus we were, according to a carefully worked-out plan, distributed among the auls, 20-30 people per aul"(Citation: 369).
    The student writes about the work they were given in the auls: "The task of the students was to keep the farms in order until the arrival of the settlers from Kursk and Oryol oblasts.
    We were to gather the livestock, feed it, take in the grain, the implements, and so on"(Citation: 369).
    By mid-May 1944 settlers had arrived in Grozny Oblast numbering 40% of the deported Chechens, including 6,800 families from Stavropol Krai(Citation: 125).
    Into the districts handed to Dagestan the colonizer resettled 65 thousand people from 224 mountain villages of Dagestan(Citation: 125).
    The settlers died too: in the Aukh district in 1944-1947 about 2 thousand - nearly a third - of the resettled Laks, one of the mountain peoples of Dagestan, died of disease(Citation: 125).
  uk: |-
    23 лютого 1944 року колонізатор мобілізував у Грозному студентів і домогосподарок, не зайнятих на фабриках, і з шостої ранку розвіз їх по чеченських аулах, з яких через півгодини після їхнього прибуття війська забрали заарештованих чеченців.
    Чеченський історик А. Г. Авторханов наводить свідчення одного з мобілізованих - російського студента Грозненського нафтового інституту: «У такий спосіб ми були за ретельно розробленим планом розподілені по аулах, 20 - 30 людей на аул»(Citation: 369).
    Студент пише про роботу, яку їм дали в аулах: «Завдання студентів полягало в тому, щоб до прибуття переселенців з Курської та Орловської областей тримати господарство в порядку.
    Ми мали збирати худобу, годувати її, прийняти зерно, інвентар тощо»(Citation: 369).
    До середини травня 1944 року до Грозненської області прибуло переселенців числом у 40% від виселених чеченців, зокрема 6800 сімей зі Ставропольського краю(Citation: 125).
    У передані Дагестану райони колонізатор переселив 65 тисяч людей з 224 гірських дагестанських селищ(Citation: 125).
    Гинули й переселенці: в Аухівському районі за 1944-1947 роки від хвороб померло близько 2 тисяч - майже третина - переселених лакців, одного з гірських народів Дагестану(Citation: 125).
