description:
  ru: |-
    Колонизатор разорял святыни и могилы выселенных чеченцев.
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «...по распоряжению партийно-советских органов были разграблены даже мечети и кладбища...
    Могильные чурты (камни) легли в основания фундаментов заводов, животноводческих ферм, ими мостили улицы городов, выкладывали бордюры тротуаров»(Citation: 125).
    Колонизатор уничтожил городскую мечеть Грозного(Citation: 125).
  en: |-
    The colonizer ravaged the shrines and graves of the deported Chechens.
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "...on the orders of the party-soviet organs even mosques and cemeteries were plundered...
    The grave churts (stones) went into the foundations of factories and livestock farms; they were used to pave city streets and edge sidewalks"(Citation: 125).
    The colonizer destroyed the city mosque of Grozny(Citation: 125).
  uk: |-
    Колонізатор плюндрував святині та могили виселених чеченців.
    Історики Я. З. Ахмадов та Е. Х. Хасмагомадов пишуть: «...за розпорядженням партійно-радянських органів були розграбовані навіть мечеті та кладовища...
    Могильні чурти (камені) лягли в основи фундаментів заводів, тваринницьких ферм, ними мостили вулиці міст, викладали бордюри тротуарів»(Citation: 125).
    Колонізатор знищив міську мечеть Грозного(Citation: 125).
