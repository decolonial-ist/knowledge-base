description:
  en: |-
    The Soviet NKVD (predecessor of today's FSB) obliged the exiled Chechens and Ingush ("special settlers" in the colonizer's terms) over 12 years of age to report monthly to the special commandant's office - the agency's surveillance post at the place of exile; from age 16 the commandant's office opened personal files; the colonizer forbade them to join the Bolshevik party, its youth league (the "Komsomol") and the trade unions, and did not take them into the army(Citation: 260).
    From January 1945 the commandant could, without trial, arrest "offenders" for up to 5 days or fine them up to 100 rubles(Citation: 125).
    By the decree of the Presidium of the Supreme Soviet of the USSR of 26 November 1948 the deportation was declared eternal: the Chechens and Ingush were "exiled in perpetuity," with up to 20 years of hard labor for escape and up to 5 years of prison for aiding escapees(Citation: 125).
  uk: |-
    Радянський НКВД (попередник сучасної ФСБ) зобов'язав засланих чеченців та інгушів («спецпереселенців» у термінах колонізатора) старших за 12 років щомісяця відмічатися в спецкомендатурі - наглядовій конторі відомства на місці заслання; з 16 років комендатура заводила особові справи; колонізатор заборонив їм вступати до більшовицької партії, її молодіжної спілки («комсомолу») та профспілок і не брав їх до армії(Citation: 260).
    З січня 1945 року комендант міг без суду заарештувати «винних» до 5 діб або оштрафувати до 100 рублів(Citation: 125).
    Указом Президії Верховної Ради СРСР від 26 листопада 1948 року виселення оголошено вічним: чеченці та інгуші «заслані навічно», за втечу - до 20 років каторги, за сприяння втікачам - до 5 років тюрми(Citation: 125).
  ru: |-
    Советский НКВД (предшественник современной ФСБ) обязал ссыльных чеченцев и ингушей («спецпереселенцев» в терминах колонизатора) старше 12 лет ежемесячно отмечаться в спецкомендатуре - надзорной конторе ведомства на месте ссылки; с 16 лет комендатура заводила личные дела; колонизатор запретил им вступать в большевистскую партию, её молодёжный союз («комсомол») и профсоюзы и не брал их в армию(Citation: 260).
    С января 1945 года комендант мог без суда арестовать «виновных» до 5 суток или оштрафовать до 100 рублей(Citation: 125).
    Указом Президиума Верховного Совета СССР от 26 ноября 1948 года выселение объявлено вечным: чеченцы и ингуши «сосланы навечно», за побег - до 20 лет каторги, за содействие беглецам - до 5 лет тюрьмы(Citation: 125).
