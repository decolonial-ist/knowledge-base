description:
  ru: 'На опустевшей после выселения чеченцев земле колонизатор уничтожал городские знаки их истории: разорил республиканский краеведческий музей и взорвал памятник чеченскому командиру Асланбеку Шерипову(Citation: 125).'
  en: 'On the land emptied by the deportation of the Chechens the colonizer destroyed the urban markers of their history: it ransacked the republican local history museum and blew up the monument to the Chechen commander Aslanbek Sheripov(Citation: 125).'
  uk: 'На спустілій після виселення чеченців землі колонізатор знищував міські знаки їхньої історії: розорив республіканський краєзнавчий музей і підірвав пам''ятник чеченському командирові Асланбеку Шеріпову(Citation: 125).'
