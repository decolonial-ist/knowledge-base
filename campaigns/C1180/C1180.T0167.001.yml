description:
  ru: |-
    СССР обманом выманивал чеченцев, скрывавшихся в горах от оккупационного режима, обещая свободу, - в бумагах НКВД (предшественника современной ФСБ) это называлось «легализацией».
    Тех, кто поверил обещаниям, арестовывали или высылали вместе с соотечественниками в Казахстан и Киргизию (нынешний Кыргызстан) в ходе геноцидной операции «Чечевица».
    В справке начальника управления внутренних дел Грозненской области Дементьева (1956) сказано: только за сентябрь-октябрь 1943 года «легализовано 30 банд, в состав которых входило 183 чел. и 60 чел. бандитов-одиночек»(Citation: 533).
    Историк П. М. Полян пишет: на учёте НКВД «состояли 1300 так называемых легализованных бандитов, т. е. явившихся, по взаимной договоренности, с повинной и освобожденных за это от репрессий.
    Всех или почти всех из них арестовали незадолго до выселения или в его ходе»(Citation: 533).
    В дни выселения войска объявляли прощение ушедшим в горы - и высылали вышедших.
    Русский студент-очевидец из Грозного, чьё свидетельство напечатал эмигрантский журнал «Прометеус» в 1949 году и приводит чеченский историк А. Г. Авторханов, пишет: «Одновременно была объявлена амнистия [обещание не наказывать] для ушедших в горы, если они явятся добровольно.
    Фактически некоторые из них и явились, но были также выселены…»(Citation: 369).
    Летом 1944 года колонизатор повторил обман: историк П. М. Полян пишет, что в июне из Казахстана в Грозный доставили высланных в феврале «испытанных» религиозных авторитетов, и те склоняли сотни скрывшихся чеченцев «к легализации и, стало быть, к выселению»(Citation: 533).
  en: |-
    The USSR lured out by deception the Chechens who were hiding in the mountains from the occupation regime, promising freedom - in the NKVD's (predecessor of today's FSB) papers this was called "legalization."
    Those who believed the promises were arrested or deported together with their compatriots to Kazakhstan and Kirghizia (today's Kyrgyzstan) in the course of the genocidal Operation "Chechevitsa."
    The report of Dementiev, head of the Grozny Oblast internal affairs directorate (1956), states: in September-October 1943 alone "30 bands were legalized, comprising 183 men, plus 60 lone bandits"(Citation: 533).
    Historian P. M. Polian writes: the NKVD files "listed 1,300 so-called legalized bandits, that is, men who had come forward, by mutual agreement, with a confession and been released from repression for it.
    All or nearly all of them were arrested shortly before the deportation or in its course"(Citation: 533).
    In the days of the deportation the troops announced clemency for those who had gone into the mountains - and deported those who came out.
    A Russian student eyewitness from Grozny, whose testimony was printed in the émigré journal Prometheus in 1949 and is cited by the Chechen historian A. G. Avtorkhanov, writes: "At the same time an amnesty [a promise not to punish] was announced for those who had gone into the mountains, if they came forward voluntarily.
    Some of them did in fact come forward, but were deported all the same…"(Citation: 369).
    In the summer of 1944 the colonizer repeated the deception: historian P. M. Polian writes that in June "tried and tested" religious authorities, deported in February, were brought from Kazakhstan to Grozny, and they induced hundreds of Chechens in hiding "toward legalization and, hence, deportation"(Citation: 533).
  uk: |-
    СРСР обманом виманював чеченців, які переховувалися в горах від окупаційного режиму, обіцяючи свободу, - в паперах НКВД (попередника сучасної ФСБ) це називалося «легалізацією».
    Тих, хто повірив обіцянкам, заарештовували або висилали разом зі співвітчизниками до Казахстану й Киргизії (нинішній Киргизстан) у ході геноцидної операції «Сочевиця».
    У довідці начальника управління внутрішніх справ Грозненської області Дементьєва (1956) сказано: лише за вересень-жовтень 1943 року «легалізовано 30 банд, до складу яких входило 183 особи, та 60 бандитів-одинаків»(Citation: 533).
    Історик П. М. Полян пише: на обліку НКВД «стояли 1300 так званих легалізованих бандитів, тобто тих, хто з'явився, за взаємною домовленістю, з повинною і був звільнений за це від репресій.
    Усіх або майже всіх з них заарештували незадовго до виселення або в його ході»(Citation: 533).
    У дні виселення війська оголошували прощення тим, хто пішов у гори, - і висилали тих, хто вийшов.
    Російський студент-очевидець з Грозного, чиє свідчення надрукував еміграційний журнал «Прометеус» 1949 року і наводить чеченський історик А. Г. Авторханов, пише: «Одночасно була оголошена амністія [обіцянка не карати] для тих, хто пішов у гори, якщо вони з'являться добровільно.
    Фактично дехто з них і з'явився, але їх також виселили…»(Citation: 369).
    Влітку 1944 року колонізатор повторив обман: історик П. М. Полян пише, що в червні з Казахстану до Грозного доставили висланих у лютому «випробуваних» релігійних авторитетів, і ті схиляли сотні чеченців, які переховувалися, «до легалізації і, отже, до виселення»(Citation: 533).
