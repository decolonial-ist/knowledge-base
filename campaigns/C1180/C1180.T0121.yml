description:
  ru: |-
    СССР, депортируя чеченцев и ингушей с родной земли, не позаботился о продовольствии в местах ссылки - от голода и болезней в ссылке за четыре с половиной года умерла почти треть депортированных.
    Отдел спецпоселений Министерства внутренних дел подвёл счёт по Казахской ССР: к 1 июля 1949 года из первоначально расселённых там чеченцев, ингушей, балкарцев и карачаевцев умерло 101 036 человек - 23,3% от числа привезённых; «наибольшая смертность имела место среди выселенцев с Северного Кавказа и калмыков»(Citation: 533).
    Колонизатор отобрал у народа скот и продовольствие ещё дома: постановлением Государственного комитета обороны СССР от 31 января 1944 года народные комиссариаты (министерства) обязывались «принять на Северном Кавказе от спецпереселенцев скот и сельскохозяйственную продукцию... с выдачей на принятое обменных квитанций», а из отобранного скота 350 лошадей, «годных к строевой службе», передавались кавалерийским частям полиции оккупанта(Citation: 360).
    Народный комиссар (министр) внутренних дел Киргизской ССР Пчелкин докладывал народному комиссару (министру) внутренних дел СССР Берии 22 апреля 1944 года: продовольствие, привезённое ссыльными, «иссякает», «установленная норма крайне недостаточна», колхозы помочь «не в состоянии из-за отсутствия его, в результате в отдельных районах имеют место случаи... употребления кореньев и трав»(Citation: 533).
    Историк П. М. Полян пишет: из-за нехватки продуктов, помещений и кормов ссыльным в Киргизии «пришлось забить до 90 %» скота, выданного «в порядке возмещения за оставленный ими в местах прежнего жительства», а выделенные им фонды местное начальство раздавало другим - в Казалинском районе «одну тонну хлеба выдали местному партактиву», в колхозах Базар-Курганского района «продукты выдали только трудоспособным спецпереселенцам, а нетрудоспособных лишили пайка»(Citation: 533).
    В ссылке чеченцы и ингуши умирали десятками тысяч: к концу 1944 года число ссыльных («спецпереселенцев» в терминах колонизатора) в Киргизии упало примерно на 11,5 тысячи, в Казахстане - более чем на 46 тысяч человек(Citation: 125).
    В 1945 году среди северокавказских ссыльных умерло 44 652 ребёнка - родилось 2230; голодало не менее 80 тысяч человек(Citation: 125); зимой 1948-1949 годов в Казахской ССР (нынешнем Казахстане) голодало до 118 тысяч, 418 человек умерли от голода(Citation: 125).
    К октябрю 1948 года в ссылке умерло около 146,9 тысячи северокавказских ссыльных; прямые потери чеченцев и ингушей историки считают в 145,7 тысячи человек, а вместе с неродившимися - 300 тысяч; довоенную численность народ восстановил только к 1959 году(Citation: 125).
  en: |-
    The USSR, deporting the Chechens and Ingush from their native land, made no provision for food at the places of exile - and from famine and disease in exile almost a third of the deported died within four and a half years.
    The Special Settlements Department of the Ministry of Internal Affairs tallied the toll for the Kazakh SSR: by 1 July 1949, of the Chechens, Ingush, Balkars and Karachays initially resettled there, 101,036 people had died - 23.3% of those brought in; "the highest mortality was among the deportees from the North Caucasus and the Kalmyks"(Citation: 533).
    The colonizer had taken the people's livestock and food back home: by the resolution of the State Defense Committee of the USSR of 31 January 1944 the people's commissariats (ministries) were obliged "to accept in the North Caucasus from the special settlers livestock and agricultural produce... issuing exchange receipts for what was accepted," while from the confiscated livestock 350 horses "fit for cavalry service" were handed over to the occupier's police cavalry units(Citation: 360).
    Pchelkin, People's Commissar (Minister) of Internal Affairs of the Kirghiz SSR, reported to People's Commissar (Minister) of Internal Affairs of the USSR Beria on 22 April 1944: the food the exiles had brought with them "is running out," "the established ration is critically insufficient," the collective farms are "in no position to help for lack of it, as a result of which in some districts there are instances... of the eating of roots and grasses"(Citation: 533).
    Historian P. M. Polian writes: for lack of food, shelter and fodder the exiles in Kirghizia "had to slaughter up to 90%" of the livestock issued "in compensation for that left behind in their former places of residence," while the funds allocated to them were handed out by local bosses to others - in the Kazalinsk district "one ton of bread was issued to the local party activists," and in the collective farms of the Bazar-Kurgan district "food was issued only to able-bodied special settlers, while those unfit for work were deprived of rations"(Citation: 533).
    In exile the Chechens and Ingush died by the tens of thousands: by the end of 1944 the number of exiles ("special settlers" in the colonizer's terms) had fallen by about 11.5 thousand in Kirghizia and by more than 46 thousand in Kazakhstan(Citation: 125).
    In 1945, among the North Caucasus exiles, 44,652 children died - 2,230 were born; no fewer than 80 thousand people were starving(Citation: 125); in the winter of 1948-1949 in the Kazakh SSR (today's Kazakhstan) up to 118 thousand were starving, and 418 people died of hunger(Citation: 125).
    By October 1948 about 146.9 thousand North Caucasus exiles had died in exile; historians put the direct losses of the Chechens and Ingush at 145.7 thousand people, and together with the unborn - at 300 thousand; the people recovered its pre-war numbers only by 1959(Citation: 125).
  uk: |-
    СРСР, депортуючи чеченців та інгушів з рідної землі, не подбав про продовольство в місцях заслання - від голоду і хвороб у засланні за чотири з половиною роки померла майже третина депортованих.
    Відділ спецпоселень Міністерства внутрішніх справ підбив рахунок по Казахській РСР: до 1 липня 1949 року з первісно розселених там чеченців, інгушів, балкарців і карачаївців померло 101 036 людей - 23,3% від числа привезених; «найбільша смертність була серед виселенців з Північного Кавказу та калмиків»(Citation: 533).
    Колонізатор відібрав у народу худобу й продовольство ще вдома: постановою Державного комітету оборони СРСР від 31 січня 1944 року народні комісаріати (міністерства) зобов'язувалися «прийняти на Північному Кавказі від спецпереселенців худобу та сільськогосподарську продукцію... з видачею на прийняте обмінних квитанцій», а з відібраної худоби 350 коней, «придатних до стройової служби», передавалися кавалерійським частинам поліції окупанта(Citation: 360).
    Народний комісар (міністр) внутрішніх справ Киргизької РСР Пчелкін доповідав народному комісарові (міністру) внутрішніх справ СРСР Берії 22 квітня 1944 року: продовольство, привезене засланцями, «вичерпується», «встановлена норма вкрай недостатня», колгоспи допомогти «не в змозі через його відсутність, внаслідок чого в окремих районах мають місце випадки... вживання коренів і трав»(Citation: 533).
    Історик П. М. Полян пише: через нестачу продуктів, приміщень і кормів засланцям у Киргизії «довелося забити до 90 %» худоби, виданої «в порядку відшкодування за залишену ними в місцях колишнього проживання», а виділені їм фонди місцеве начальство роздавало іншим - у Казалінському районі «одну тонну хліба видали місцевому партактиву», в колгоспах Базар-Курганського району «продукти видали лише працездатним спецпереселенцям, а непрацездатних позбавили пайка»(Citation: 533).
    У засланні чеченці та інгуші вмирали десятками тисяч: до кінця 1944 року число засланців («спецпереселенців» у термінах колонізатора) в Киргизії впало приблизно на 11,5 тисячі, в Казахстані - більш ніж на 46 тисяч людей(Citation: 125). 1945 року серед північнокавказьких засланців померло 44 652 дитини - народилося 2230; голодувало не менш як 80 тисяч людей(Citation: 125); взимку 1948-1949 років у Казахській РСР (нинішньому Казахстані) голодувало до 118 тисяч, 418 людей померли від голоду(Citation: 125).
    До жовтня 1948 року в засланні померло близько 146,9 тисячі північнокавказьких засланців; прямі втрати чеченців та інгушів історики оцінюють у 145,7 тисячі людей, а разом з ненародженими - у 300 тисяч; довоєнну чисельність народ відновив лише до 1959 року(Citation: 125).
