description:
  ru: 'Очередной этап наступления на автономию: договор с Москвой, ликвидирующий независимую дипломатию («гетмана не обирать... от себя им ни к кому ничего не писать»), запрещающий декларировать свою субъектность и требующий: «народ Малороссийский всякими меры и способами с Великороссйиским народом соединять... супружеством»(Citation: 4).'
  en: 'Another stage of the assault on autonomy: a treaty with Moscow that eliminated independent diplomacy ("a hetman shall not be elected... nor shall they write anything to anyone on their own behalf"), prohibited declaring one''s own subjecthood, and demanded: "to unite the Little Russian people with the Great Russian people by all measures and means... through marriage"(Citation: 4).'
  uk: 'Черговий етап наступу на автономію: договір з Москвою, що ліквідовував незалежну дипломатію («гетьмана не обирати... від себе їм ні до кого нічого не писати»), забороняв декларувати власну суб''єктність і вимагав: «народ Малоросійський усілякими мірами та способами з Великоросійським народом з''єднувати... шлюбом»(Citation: 4).'
