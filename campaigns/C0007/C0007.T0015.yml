description:
  ru: 'Чтобы гарантировать принятие кабальных условий договора, царство подкупило местную старшину гарантиями сохранения их должностей, поставив личные амбиции элиты выше национальных: «гетману старшины генеральной без воли и указу их царского пресветлого величества... с уряду никого не переменять же»(Citation: 4).'
  en: 'To guarantee acceptance of the treaty''s enslaving terms, the tsardom bribed the local starshyna with guarantees that they would keep their offices, placing the elite''s personal ambitions above national ones: "the hetman shall not remove anyone of the general starshyna from office without the will and decree of their most serene tsarist majesty..."(Citation: 4).'
  uk: 'Щоб гарантувати прийняття кабальних умов договору, царство підкупило місцеву старшину гарантіями збереження їхніх посад, поставивши особисті амбіції еліти вище за національні: «гетьману старшини генеральної без волі та указу їх царської пресвітлої величності... з уряду нікого не переміняти»(Citation: 4).'
