description:
  en: |-
    The use of demographic engineering to accelerate assimilation.
    Moscow openly proclaimed a course toward erasing ethnic boundaries by encouraging marriages with Great Russians: "to unite the Little Russian people with the Great Russian people by all measures and means... through matrimony and other conduct..."(Citation: 4).
  uk: |-
    Використання демографічної інженерії для прискорення асиміляції.
    Москва відкрито проголосила курс на стирання етнічних меж шляхом заохочення шлюбів із Великоросами: «народ Малоросійський всякими мірами й способами з Великоросійським народом з'єднувати... подружжям та іншою поведінкою...»(Citation: 4).
  ru: |-
    Использование демографической инженерии для ускорения ассимиляции.
    Москва открыто провозгласила курс на стирание этнических границ путем поощрения браков с великороссами: «народ Малороссийский всякими меры и способами с Великороссйиским народом соединять... супружеством и иным поведением...»(Citation: 4).
