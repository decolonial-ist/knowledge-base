description:
  ru: '«В этом положении статей впервые явно объявлялось стремление царского правительства превратить Украину в область на обычных правах входящую в состав Российского государства»(Citation: 3).'
  en: '"In this provision of the articles, the tsarist government''s aspiration to turn Ukraine into a region incorporated into the Russian state on ordinary terms was openly declared for the first time"(Citation: 3).'
  uk: '«У цьому положенні статей уперше явно проголошувалося прагнення царського уряду перетворити Україну на область, що входить до складу Російської держави на звичайних правах»(Citation: 3).'
