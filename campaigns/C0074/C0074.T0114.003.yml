description:
  ru: |-
    3 августа 1919 года генерал Май-Маевский, начальник администрации белых в Екатеринославской, Харьковской, Курской и Полтавской губерниях, издал в Харькове приказ № 22 и начал его так: «Объявляю основные положения, принятые Особым совещанием по вопросу об "украинских школах"».
    Первым пунктом шёл возврат: «Все школы, в которых до появления "украинских" властей преподавание велось на русском языке, а затем, по распоряжению украинской власти, языком преподавания был сделан малорусский язык, должны вернуться вновь к преподаванию на русском языке»(Citation: 582).

    Историю и географию Украины приказ вычеркнул из программ: «Преподавание "украиноведения" (история и география Украины) упраздняется»(Citation: 582).

    Через девять дней ту же норму подтвердил главнокомандующий: в обращении «К населению Малороссии» Деникин объявил русский язык государственным на всём пространстве России, оставив украинскому частные школы и первые годы начальной - «для облегчения учащимся усвоения первых зачатков знания»(Citation: 248).
    В Киеве приказ № 22 применяли и осенью: в сводке советской стороны о положении в городе записано: «во всех школах вводится русский язык как государственный»(Citation: 589).
  en: |-
    On 3 August 1919 general Mai-Maevsky, head of the Whites' administration in Katerynoslav, Kharkiv, Kursk and Poltava provinces, issued in Kharkiv order No. 22, opening it thus: "I announce the basic provisions adopted by the Special Council on the question of 'Ukrainian schools.'" The first point was reversal: "All schools in which, before the appearance of the 'Ukrainian' authorities, instruction was conducted in Russian, and then, by order of the Ukrainian authority, the Little Russian language was made the language of instruction, must return again to instruction in Russian"(Citation: 582).

    The history and geography of Ukraine the order struck from the curricula: "The teaching of 'Ukrainian studies' (the history and geography of Ukraine) is abolished"(Citation: 582).

    Nine days later the commander-in-chief confirmed the same norm: in the address "To the Population of Little Russia" Denikin declared Russian the state language "over the whole expanse of Russia," leaving to Ukrainian the private schools and the first years of primary school - "to ease the pupils' assimilation of the first rudiments of knowledge"(Citation: 248).
    In Kyiv order No. 22 was applied in the autumn as well: a summary of the Soviet side on the situation in the city records that "in all schools the Russian language is being introduced as the state language"(Citation: 589).
  uk: |-
    3 серпня 1919 року генерал Май-Маєвський, начальник адміністрації білих у Катеринославській, Харківській, Курській і Полтавській губерніях, видав у Харкові наказ № 22 і почав його так: «Оголошую основні положення, ухвалені Особливою нарадою в питанні про „українські школи"».
    Першим пунктом ішло повернення: «Усі школи, в яких до появи „українських" властей викладання велося російською мовою, а потім, за розпорядженням української влади, мовою викладання було зроблено малоруську мову, мають повернутися знову до викладання російською мовою»(Citation: 582).

    Історію і географію України наказ викреслив із програм: «Викладання „українознавства" (історія і географія України) скасовується»(Citation: 582).

    Через дев'ять днів ту саму норму підтвердив головнокомандувач: у зверненні «До населення Малоросії» Денікін оголосив російську мову державною «на всьому просторі Росії», залишивши українській приватні школи та перші роки початкової - «для полегшення учням засвоєння перших зачатків знання»(Citation: 248).
    У Києві наказ № 22 застосовували й восени: у зведенні радянської сторони про становище в місті записано, що «в усіх школах запроваджується російська мова як державна»(Citation: 589).
