description:
  ru: |-
    Центральная советская власть России (ВЦИК) 1 июня 1919 года постановила провести «тесное объединение 1) военной организации и военного командования, 2) советов народного хозяйства, 3) железнодорожного управления и хозяйства, 4) финансов и 5) комиссариатов труда» России, Украины, Латвии, Литвы, Белоруссии и Крыма - «с тем, чтобы руководство указанными отраслями народной жизни было сосредоточено в руках единых коллегий».
    Постановление подписали председатель ВЦИК Калинин и секретарь Серебряков, а формулу независимости оно сохраняло дословно: объединение проводилось, «стоя вполне на почве признания независимости, свободы и самоопределения трудящихся масс Украины, Латвии, Литвы, Белоруссии и Крыма»(Citation: 559).
    Хозяйство, железные дороги, финансы и труд Украины уходили под управление Москвы; независимость оставалась словом на бумаге.

    Продовольственное ведомство в этот список не попало: глава правительства РСФСР Ленин подчинил его отдельно и втайне. 12 июня 1919 года он послал в Киев записку: продовольственное ведомство колониальной администрации Украины (УСРР) переходит под всероссийское и деньгами, и управлением - без объявления об этом; внизу записки стояла помета зашифровать подчёркнутое и передать немедленно, а 14 июня вопрос поставили на пленуме Центрального комитета большевистской партии(Citation: 573).
  en: |-
    On 1 June 1919 the central Soviet authority of Russia (the VTsIK) resolved to carry out "a close unification of 1) the military organization and military command, 2) the councils of the national economy, 3) railway administration and management, 4) finances and 5) the commissariats of labour" of Russia, Ukraine, Latvia, Lithuania, Belarus and Crimea - "so that the direction of the said branches of national life be concentrated in the hands of single collegiums."
    The resolution was signed by Kalinin, chairman of the VTsIK, and by secretary Serebryakov, while preserving the formula of independence word for word: the unification was carried out "standing fully on the ground of recognition of the independence, freedom and self-determination of the toiling masses of Ukraine, Latvia, Lithuania, Belarus and Crimea"(Citation: 559).
    Ukraine's economy, railways, finances and labour passed under Moscow's management; independence remained a word on paper.

    The food ministry was not on that list: Lenin, head of the RSFSR government, subordinated it separately and in secret.
    On 12 June 1919 he sent a note to Kyiv: the food ministry of the colonial administration of Ukraine (the UkrSSR) was passing under the all-Russian one in both money and management - without any announcement; at the bottom of the note stood the instruction to encipher the underlined part and transmit it immediately, and on 14 June the question was put before the plenum of the Central Committee of the Bolshevik party(Citation: 573).
  uk: |-
    Центральна радянська влада Росії (ВЦВК) 1 червня 1919 року постановила провести «тісне об'єднання 1) військової організації та військового командування, 2) рад народного господарства, 3) залізничного управління й господарства, 4) фінансів і 5) комісаріатів праці» Росії, України, Латвії, Литви, Білорусі та Криму - «з тим, щоб керівництво зазначеними галузями народного життя було зосереджене в руках єдиних колегій».
    Постанову підписали голова ВЦВК Калінін і секретар Серебряков, а формулу незалежності вона зберігала дослівно: об'єднання проводилося, «стоячи цілком на ґрунті визнання незалежності, свободи і самовизначення трудящих мас України, Латвії, Литви, Білорусі та Криму»(Citation: 559).
    Господарство, залізниці, фінанси і праця України відходили під управління Москви; незалежність лишалася словом на папері.

    Продовольче відомство до цього списку не потрапило: голова уряду РСФРР Ленін підпорядкував його окремо і потай. 12 червня 1919 року він надіслав до Києва записку: продовольче відомство колоніальної адміністрації України (УСРР) переходить під всеросійське і грошима, і управлінням - без оголошення про це; внизу записки стояла помітка зашифрувати підкреслене і передати негайно, а 14 червня питання поставили на пленумі Центрального комітету більшовицької партії(Citation: 573).
