description:
  ru: |-
    Полномасштабное наступление Украинского фронта Красной армии в начале 1919 года для повторного захвата украинских городов после ухода австро-немецких войск(Citation: 22).⏎Летом 1919 года на Украину наступала и белая армия - Вооружённые силы Юга России во главе с генералом Деникиным(Citation: 248).
    Наступление белой армии Деникина на Киев шло под лозунгом восстановления «единой и неделимой России»(Citation: 22). 30 августа 1919 года Киев, почти без боя оставленный красными, заняли объединённые украинские войска - 1-й и 3-й корпуса Украинской галицкой армии (УГА) и Запорожская группа армии Украинской Народной Республики (УНР) под общим командованием галицкого генерала Кравса; на 16 часов следующего дня, воскресенья 31 августа, Кравс назначил на Крещатике торжественный парад украинских войск с участием главы Директории УНР Симона Петлюры(Citation: 25).
    На следующий день после того, как украинские армии вошли в столицу, Киев заняли и деникинские войска под командованием генерала Бредова, силой вытеснив украинские части(Citation: 25).
    События 31 августа 1919 года получили название «Киевская катастрофа»(Citation: 25)(Citation: 22).
    Катастрофой этот день стал для украинских армий и государственности УНР: взятую накануне столицу они потеряли за сутки, в вооружённом столкновении на Думской площади были убитые и раненые, несколько сотен человек попали в плен(Citation: 25).
    Историки Института истории Украины Национальной академии наук заключают: «успешная поначалу операция украинских войск обернулась болезненным поражением».
    О последствиях они пишут: катастрофа «деморализующе повлияла на украинскую армию и усилила расхождения в стратегических целях» двух украинских политических руководств - надднепрянского и галицкого(Citation: 25).⏎Ход дня известен по дневнику Начальной команды - штаба Украинской галицкой армии.
    Утро 31 августа штаб описал так: в 8 часов деникинские части вошли в город, «кажется, через средний незанятый мост и также через железнодорожный мост, куда переехало несколько бронепоездов», и расположились в юго-восточных предместьях(Citation: 495).
    Старший из галицких командиров отаман Виметаль условился с деникинскими командирами о временной демаркационной линии, но между 16 и 17 часами к городской Думе, уже занятой галичанами, подошёл деникинский генерал Штакельберг с делегацией офицеров и отрядом в 100-200 человек; Кравс потребовал отвести их за условленную линию(Citation: 495).
    Развязку штаб записал так: собравшаяся толпа, «зная о присутствии деникинских войск в Киеве, потребовала вывешивания российского флага на Думе, кроме уже водружённого нами там украинского», и Кравс, «чтобы успокоить толпу, в которой находилось много бывших российских офицеров», разрешил это с мотивировкой «как знамя общей борьбы обеих армий против большевиков»(Citation: 495).
    Проходившие мимо Думы части Запорожской группы «сорвали российский флаг»; началась стрельба - деникинские отряды напали на рассеянные по городу галицкие части, огонь по ним, по той же записи, вело с крыш и балконов и «гражданское население»(Citation: 495).
    Итог дня в дневнике: «10 убитых казаков», разоружённые штаб III галицкого корпуса и одиннадцать его сотен, брошенные в городе орудия Запорожской группы; силы Деникина Кравс оценил «по меньшей мере в две дивизии»(Citation: 495).
    Сражения за город не вышло: после стрельбы у Думы поднялась «большая паника» - несколько подразделений были разоружены, остальные с боем вышли за город; штаб подытожил: «единый отпор по причине упомянутой паники был невозможен»(Citation: 495).
    Кравс выехал для переговоров к Бредову и уже по дороге встретил «сильные колонны добровольцев [солдат Добровольческой армии Деникина]», маршировавшие на город(Citation: 495).⏎Киев остался за деникинцами.
    В ночь на 1 сентября Кравс подписал с Бредовым соглашение о выводе галицких частей; ко 2 сентября войска группы собирались уже на линии Игнатовка - Васильков(Citation: 495).
    Решение о выводе приняло командование: стрельцы группы, по записи за 1 сентября, «сильно подавленные последними событиями, требуют нового наступления на Киев»(Citation: 495).⏎Осенью 1919 года Красная армия перешла в контрнаступление уже против войск Деникина(Citation: 22).
  en: |-
    A full-scale offensive by the Ukrainian Front of the Red Army in early 1919 to recapture Ukrainian cities after the withdrawal of Austro-German troops(Citation: 22).⏎In the summer of 1919 Ukraine was also under attack by the White army - the Armed Forces of South Russia led by General Denikin(Citation: 248).
    The advance of Denikin's White army on Kyiv ran under the slogan of restoring a "united and indivisible Russia"(Citation: 22).
    On August 30, 1919, Kyiv, abandoned by the Reds almost without a fight, was taken by the combined Ukrainian forces - the 1st and 3rd corps of the Ukrainian Galician Army (UHA) and the Zaporizhzhia Group of the army of the Ukrainian People's Republic (UNR) under the overall command of the Galician general Kravs; for 4 p.m. the next day, Sunday, August 31, Kravs scheduled a ceremonial parade of the Ukrainian troops on Khreshchatyk with the participation of Symon Petliura, head of the UNR Directory(Citation: 25).
    The day after the Ukrainian armies entered the capital, Kyiv was also occupied by Denikin's troops under General Bredov, who forced the Ukrainian units out(Citation: 25).
    The events of August 31, 1919 became known as the "Kyiv catastrophe"(Citation: 25)(Citation: 22).
    A catastrophe this day was for the Ukrainian armies and for the statehood of the UNR: they lost the capital, taken the day before, within a single day; the armed clash on Duma Square left dead and wounded, and several hundred men were taken prisoner(Citation: 25).
    Historians of the Institute of History of Ukraine of the National Academy of Sciences conclude: "the initially successful operation of the Ukrainian forces turned into a painful defeat".
    Of the consequences they write: the catastrophe "had a demoralizing effect on the Ukrainian army and deepened the divergence in the strategic aims" of the two Ukrainian political leaderships - that of Dnieper Ukraine and that of Galicia(Citation: 25).⏎The course of the day is known from the diary of the Supreme Command - the staff of the Ukrainian Galician Army.
    The staff described the morning of August 31 thus: at 8 o'clock Denikin's units entered the city, "it seems - across the middle unoccupied bridge and also across the railway bridge, over which several armored trains crossed", and positioned themselves in the southeastern suburbs(Citation: 495).
    The senior Galician commander, Otaman Vimetal, agreed with Denikin's commanders on a provisional demarcation line, but between 4 and 5 p.m. Denikin's general Stackelberg, with a delegation of officers and a detachment of 100-200 men, approached the City Duma, already held by the Galicians; Kravs demanded that they be withdrawn behind the agreed line(Citation: 495).
    The staff recorded the denouement thus: the assembled crowd, "knowing of the presence of Denikin's troops in Kyiv, demanded that the Russian flag be hung on the Duma in addition to the Ukrainian one we had already planted there", and Kravs, "in order to calm the crowd, in which there were many former Russian officers", permitted it with the justification "as a banner of the common struggle of both armies against the Bolsheviks"(Citation: 495).
    Units of the Zaporizhzhia Group passing by the Duma "tore down the Russian flag"; shooting broke out - Denikin's detachments attacked the Galician units scattered across the city, and of the fire from roofs and balconies the diary entry reads: "the civilian population also fired at our units"(Citation: 495).
    The day's toll in the diary: "10 Cossacks killed", the disarmed staff of the III Galician Corps and eleven of its companies, the guns of the Zaporizhzhia Group abandoned in the city; Kravs estimated Denikin's forces at "at least two divisions"(Citation: 495).
    There was no battle for the city: after the shooting at the Duma "great panic" set in - several units were disarmed, the rest fought their way out of the city; the staff summed up: "a unified resistance was impossible because of the panic mentioned"(Citation: 495).
    Kravs set out to negotiate with Bredov and already on his way met "strong columns of volunteers [soldiers of Denikin's Volunteer Army]" marching on the city(Citation: 495).⏎Kyiv remained with Denikin's forces.
    On the night of September 1 Kravs signed with Bredov an agreement on the withdrawal of the Galician units; by September 2 the group's troops were already assembling on the Ihnativka - Vasylkiv line(Citation: 495).
    The withdrawal was the command's decision: the riflemen of the group, according to the entry for September 1, "deeply dispirited by the recent events, demand a new offensive on Kyiv"(Citation: 495).⏎In the fall of 1919 the Red Army went over to a counteroffensive, now against Denikin's forces(Citation: 22).
  uk: |-
    Повномасштабний наступ Українського фронту Червоної армії на початку 1919 року для повторного захоплення українських міст після відходу австро-німецьких військ(Citation: 22).⏎Влітку 1919 року на Україну наступала й біла армія - Збройні сили Півдня Росії на чолі з генералом Денікіним(Citation: 248).
    Наступ білої армії Денікіна на Київ ішов під гаслом відновлення «єдиної та неподільної Росії»(Citation: 22). 30 серпня 1919 року Київ, майже без бою залишений червоними, зайняли об'єднані українські війська - 1-й і 3-й корпуси Української галицької армії (УГА) та Запорізька група армії Української Народної Республіки (УНР) під загальним командуванням галицького генерала Кравса; на 16-ту годину наступного дня, неділі 31 серпня, Кравс призначив на Хрещатику урочистий парад українських військ за участю голови Директорії УНР Симона Петлюри(Citation: 25).
    Наступного дня після того, як українські армії увійшли до столиці, Київ зайняли й денікінські війська під командуванням генерала Бредова, силою витіснивши українські частини(Citation: 25).
    Події 31 серпня 1919 року дістали назву «Київська катастрофа»(Citation: 25)(Citation: 22).
    Катастрофою цей день став для українських армій і державності УНР: взяту напередодні столицю вони втратили за добу, у збройному зіткненні на Думській площі були вбиті й поранені, кілька сотень осіб потрапили в полон(Citation: 25).
    Історики Інституту історії України Національної академії наук підсумовують: «успішна спочатку операція українських військ обернулася болісною поразкою».
    Про наслідки вони пишуть: катастрофа «деморалізуюче вплинула на українську армію і посилила розбіжності у стратегічних цілях» двох українських політичних проводів - наддніпрянського й галицького(Citation: 25).⏎Хід дня відомий за денником Начальної Команди - штабу Української Галицької Армії.
    Ранок 31 серпня штаб описав так: о 8-й годині денікінські частини увійшли до міста, «здається — через середний необсаджений міст і також через залізничий міст, куди переїхало кілька панцирок», і розташувалися в південно-східних передмістях(Citation: 495).
    Найстарший з галицьких командирів отаман Вімєталь домовився з денікінськими командирами про тимчасову демаркаційну лінію, але між 16-ю і 17-ю годинами до міської Думи, вже зайнятої галичанами, підійшов денікінський генерал Штакельберг з делегацією старшин і відділом у 100-200 людей; Кравс зажадав відвести їх за умовлену лінію(Citation: 495).
    Розв'язку штаб записав так: зібрана товпа, «знаючи про присутність денікінських військ в Київі, зажадала вивішення російського прапора на Думі, крім вже нами там застромленого українського», і Кравс, «щоби успокоїти товпу, в якій находилося багато бувших російських старшин», дозволив це з мотивуванням «як знамя спільної боротьби обох армій проти большевиків»(Citation: 495).
    Частини Запорізької Групи, що проходили повз Думу, «здерли російський прапор»; почалася стрілянина - денікінські відділи напали на розкидані по місту галицькі частини, а про вогонь з дахів і балконів у деннику записано: «стріляло також на наші частини цивільне населення»(Citation: 495).
    Підсумок дня в деннику: «10 убитих козаків», роззброєні штаб ІІІ галицького корпусу та одинадцять його сотень, покинуті в місті гармати Запорізької Групи; сили Денікіна Кравс оцінив на «принайменше дві дивізії»(Citation: 495).
    Бою за місто не вийшло: після стрілянини біля Думи здійнялася «велика паніка» - кілька підрозділів було роззброєно, решта з боєм вийшла за місто; штаб підсумував: «Одноцільний опір з причини згаданої паніки був неможливий»(Citation: 495).
    Кравс виїхав на переговори до Бредова і вже дорогою стрінув «сильні кольони добровольців [вояків Добровольчої армії Денікіна]», які маршували на місто(Citation: 495).⏎Київ залишився за денікінцями.
    У ніч на 1 вересня Кравс підписав з Бредовим умову про відведення галицьких частин; до 2 вересня війська групи збиралися вже на лінії Ігнатівка - Васильків(Citation: 495).
    Рішення про відведення ухвалило командування: стрільці групи, за записом за 1 вересня, «дуже пригноблені послідними подіями жадають поновного наступу на Київ»(Citation: 495).⏎Восени 1919 року Червона армія перейшла в контрнаступ уже проти військ Денікіна(Citation: 22).
