description:
  en: |-
    On 25 May 1919 Antonov-Ovseenko, commander of the RSFSR's Ukrainian Front, disarming the villages, ordered the armies: "beforehand, to take hostages from the kulak elements"(Citation: 580).
    On 29 June 1919 the central organ of the colonial administration of Ukraine (the VUTsIK) legalized "the taking of hostages" by its resolution on general mobilization(Citation: 578), and on 11 December 1919 Trotsky, war minister of the RSFSR, included "the hostage system" in the list of means by which the armies "entering Ukraine" were obliged to disarm the population(Citation: 579).

    In Zhytomyr, during the nine days of Soviet rule in March 1919, hostages sat in the secret police "until payment of the contribution" - until the town paid the sum imposed on it; so recorded Livshits, commissioner of the Central Committee for Aid to Pogrom Victims, noting that a considerable part of those arrested "as hostages" were Jews(Citation: 570).
    So it was in Fastiv too: until the contribution imposed on the town was paid, Jews sat as hostages(Citation: 568).
    The occupation secret police in Kyiv held hostages as well: Rakovsky, head of the Soviet colonial administration of Ukraine, wrote to Lenin on 9 August 1919 that after the proclamation of "red terror" over the Hryhoriv uprising it had shot 30 hostages - former members of the monarchist organization "Union of the Russian People," which staged pogroms, and former tsarist officials; when it prepared to shoot 15 more and Rakovsky with Latsis, chairman of the Ukrainian secret police, checked their biographies, only two turned out to be dangerous enemies(Citation: 564).

    The removal of hostages from Kyiv during the evacuation at the end of August 1919 was described by the eyewitness Kateryna Koval-Medzvedska: "Doctors, engineers, topographers were put on record, and in the last days, under threat of execution, they were carried off by force to Moscow.
    Besides that, landowners and the bigger merchants were carried off by the hundreds as hostages"(Citation: 560).
  uk: |-
    25 травня 1919 року командувач Українського фронту РСФРР Антонов-Овсєєнко, роззброюючи села, наказав арміям: «попередньо брати заручників із куркульських елементів»(Citation: 580). 29 червня 1919 року центральний орган колоніальної адміністрації України (ВУЦВК) узаконив «взяття заручників» постановою про загальну мобілізацію(Citation: 578), а 11 грудня 1919 року військовий міністр РСФРР Троцький включив «систему заручників» до переліку засобів, якими армії, «що вступають в Україну», зобов'язані роззброювати населення(Citation: 579).

    У Житомирі за дев'ять днів радянської влади в березні 1919 року заручники сиділи в таємній поліції «до сплати контрибуції» - поки місто не внесе накладену на нього виплату; так записав уповноважений Центрального комітету допомоги потерпілим від погромів Лівшиць, зазначивши, що значну частину заарештованих «як заручників» становили євреї(Citation: 570).
    Так само було у Фастові: до сплати накладеної на місто контрибуції заручниками сиділи євреї(Citation: 568).
    Тримала заручників і окупаційна таємна поліція в Києві: голова радянської колоніальної адміністрації України Раковський писав Леніну 9 серпня 1919 року, що після оголошення «червоного терору» через повстання Григор'єва вона розстріляла 30 заручників - колишніх членів монархічної організації «Союз русского народа», що влаштовувала погроми, і царських чиновників; коли зібралися розстріляти ще 15 і Раковський із головою української таємної поліції Лацісом перевірили їхні біографії, небезпечними ворогами виявилися лише двоє(Citation: 564).

    Вивіз заручників із Києва під час евакуації наприкінці серпня 1919 року описала очевидиця Катерина Коваль-Медзвєдська: «Взято було на обрахунок лікарів, інженірів, топографів, яких в останні дні, під загрозою розстрілу, силою вивезено було на Москву.
    Опріч того, сотнями було вивезено, яко закладників, поміщиків та більших купців»(Citation: 560).
  ru: |-
    25 мая 1919 года командующий Украинским фронтом РСФСР Антонов-Овсеенко, разоружая сёла, приказал армиям: «предварительно брать заложников из кулацких элементов»(Citation: 580). 29 июня 1919 года центральный орган колониальной администрации Украины (ВУЦИК) узаконил «взятие заложников» постановлением о всеобщей мобилизации(Citation: 578), а 11 декабря 1919 года военный министр РСФСР Троцкий включил «систему заложников» в перечень средств, которыми армии, «вступающие в Украину», обязаны разоружать население(Citation: 579).

    В Житомире за девять дней советской власти в марте 1919 года заложники сидели в тайной полиции «до уплаты контрибуции» - пока город не внесёт наложенную на него выплату; так записал уполномоченный Центрального комитета помощи пострадавшим от погромов Лившиц, отметив, что значительную часть арестованных «в виде заложников» составляли евреи(Citation: 570).
    Так же было в Фастове: до уплаты наложенной на город контрибуции заложниками сидели евреи(Citation: 568).
    Держала заложников и оккупационная тайная полиция в Киеве: глава советской колониальной администрации Украины Раковский писал Ленину 9 августа 1919 года, что после объявления «красного террора» из-за восстания Григорьева она расстреляла 30 заложников - бывших членов монархической организации «Союз русского народа», устраивавшей погромы, и царских чиновников; когда собрались расстрелять ещё 15 и Раковский с председателем украинской тайной полиции Лацисом проверили их биографии, опасными врагами оказались лишь двое(Citation: 564).

    Вывоз заложников из Киева при эвакуации в конце августа 1919 года описала очевидица Катерина Коваль-Медзведская: «Взяты были на учёт врачи, инженеры, топографы, которых в последние дни, под угрозой расстрела, силой вывезли на Москву.
    Кроме того, сотнями были вывезены, как заложники, помещики и более крупные купцы»(Citation: 560).
