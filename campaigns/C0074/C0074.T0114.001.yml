description:
  en: 'General Mai-Maevsky, head of the Whites'' administration in Katerynoslav, Kharkiv, Kursk and Poltava provinces, by order No. 22 of 3 August 1919 returned the schools of Ukraine to compulsory instruction in Russian, leaving the native language the place of an elective: "The teaching of the Little Russian language and literature is permitted as non-compulsory subjects on general grounds" - Russian became the compulsory language of instruction, Ukrainian was studied only at will(Citation: 582).'
  uk: 'Начальник адміністрації білих у Катеринославській, Харківській, Курській і Полтавській губерніях генерал Май-Маєвський наказом № 22 від 3 серпня 1919 року повернув школи України до обов''язкового викладання російською, а рідній мові залишив місце факультативу: «Викладання малоруської мови і літератури допускається як необов''язкових предметів на загальних підставах» - обов''язковою мовою навчання стала російська, українську вивчали лише за бажанням(Citation: 582).'
  ru: 'Начальник администрации белых в Екатеринославской, Харьковской, Курской и Полтавской губерниях генерал Май-Маевский приказом № 22 от 3 августа 1919 года вернул школы Украины к обязательному преподаванию на русском, а родному языку оставил место факультатива: «Преподавание малорусского языка и литературы допускается в качестве необязательных предметов на общих основаниях» - русский стал обязательным языком обучения, украинский изучался только по желанию(Citation: 582).'
