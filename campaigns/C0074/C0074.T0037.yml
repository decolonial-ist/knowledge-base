description:
  ru: |-
    28 ноября 1918 года Центральный комитет большевистской партии (ЦК РКП(б)) создал в российском Курске марионеточное правительство для Украины, назвавшее себя «Временным рабоче-крестьянским правительством Украины», - политическое прикрытие для вторжения войск советской России в Украину.
    Манифестом от 29 ноября оно объявило об установлении советской власти в Украине, а 29 января 1919 года было реорганизовано в Совет народных комиссаров УСРР по образцу российского(Citation: 334).
    Указом от 3 декабря 1918 года - за месяц до захвата Харькова - это правительство завело собственную тайную полицию: Всеукраинскую чрезвычайную комиссию(Citation: 575).

    Летом 1919 года Москва отобрала у созданной ширмы и её карательный аппарат. 11 июня 1919 года заместитель председателя украинской тайной полиции Шишков телеграфировал в ЦК РКП(б), что она организационно никак не связана с российской и что все местные комиссии в Украине подчиняются только украинской, а не московской(Citation: 590). 22 июля 1919 года глава российской тайной полиции Дзержинский написал главе украинской Лацису, что дело украинской комиссии - проводить в Украине политику московского центра партии: «по отношению к нам Вы стали самостийником, стали такими объективно», а задача её - «быть проводником политики ЦК РКП [Центрального комитета Российской коммунистической партии] на Украине»(Citation: 577). 13 августа 1919 года политбюро ЦК РКП(б) постановило распустить украинскую тайную полицию, слив её с российской, и поручило исполнение Петерсу; 14 августа политбюро украинского филиала партии (ЦК КП(б)У) подчинилось, а 16 августа Петерс был назначен представителем российской комиссии при колониальной администрации Украины (УСРР)(Citation: 584).
  en: |-
    On 28 November 1918 the Central Committee of the Bolshevik party (the CC RCP(b)) created in the Russian city of Kursk a puppet government for Ukraine, which named itself the "Provisional Workers' and Peasants' Government of Ukraine" - political cover for the invasion by the troops of Soviet Russia into Ukraine.
    By a manifesto of 29 November it proclaimed the establishment of Soviet power in Ukraine, and on 29 January 1919 it was reorganized into the Council of People's Commissars of the UkrSSR on the Russian model(Citation: 334).
    By a decree of 3 December 1918 - a month before the capture of Kharkiv - this government set up its own secret police: the All-Ukrainian Extraordinary Commission(Citation: 575).

    In the summer of 1919 Moscow took even the punitive apparatus away from the front it had created.
    On 11 June 1919 Shishkov, deputy chairman of the Ukrainian secret police, telegraphed the CC RCP(b) that it had no organizational ties whatsoever with the Russian one and that all local commissions in Ukraine were subordinate only to the Ukrainian, not the Moscow one(Citation: 590).
    On 22 July 1919 Dzerzhinsky, head of the Russian secret police, wrote to Latsis, head of the Ukrainian one, that the Ukrainian commission's business was to carry out in Ukraine the policy of the party's Moscow centre: "in relation to us You have become a samostiynik, become one objectively," and its task was "to be the conductor of the policy of the CC RCP [the Central Committee of the Russian Communist Party] in Ukraine"(Citation: 577).
    On 13 August 1919 the politburo of the CC RCP(b) resolved to dissolve the Ukrainian secret police, merging it with the Russian one, and charged Peters with the execution; on 14 August the politburo of the party's Ukrainian branch (the CC CP(b)U) submitted, and on 16 August Peters was appointed representative of the Russian commission attached to the colonial administration of Ukraine (the UkrSSR)(Citation: 584).
  uk: |-
    28 листопада 1918 року Центральний комітет більшовицької партії (ЦК РКП(б)) створив у російському Курську маріонетковий уряд для України, що назвав себе «Тимчасовим робітничо-селянським урядом України», - політичне прикриття для вторгнення військ радянської Росії в Україну.
    Маніфестом від 29 листопада він оголосив про встановлення радянської влади в Україні, а 29 січня 1919 року був реорганізований у Раду народних комісарів УСРР за російським зразком(Citation: 334).
    Указом від 3 грудня 1918 року - за місяць до захоплення Харкова - цей уряд завів власну таємну поліцію: Всеукраїнську надзвичайну комісію(Citation: 575).

    Улітку 1919 року Москва відібрала у створеної ширми і її каральний апарат. 11 червня 1919 року заступник голови української таємної поліції Шишков телеграфував у ЦК РКП(б), що вона організаційно ніяк не пов'язана з російською і що всі місцеві комісії в Україні підпорядковуються лише українській, а не московській(Citation: 590). 22 липня 1919 року голова російської таємної поліції Дзержинський написав голові української Лацісу, що справа української комісії - проводити в Україні політику московського центру партії: «щодо нас Ви стали самостійником, стали такими об'єктивно», а завдання її - «бути провідником політики ЦК РКП [Центрального комітету Російської комуністичної партії] на Україні»(Citation: 577). 13 серпня 1919 року політбюро ЦК РКП(б) постановило розпустити українську таємну поліцію, злити її з російською, і доручило виконання Петерсу; 14 серпня політбюро українського філіалу партії (ЦК КП(б)У) підкорилося, а 16 серпня Петерса було призначено представником російської комісії при колоніальній адміністрації України (УСРР)(Citation: 584).
