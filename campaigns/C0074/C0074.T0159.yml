description:
  en: |-
    On 29 June 1919 the central organ of the colonial administration of Ukraine (the VUTsIK) resolved: "To take the most energetic measures to suppress kulak uprisings and the actions of bands, applying the imposition of contributions on rebellious localities and the taking of hostages"; the resolution was signed for the chairman of that organ by Polozov and by its secretary Lapchinsky(Citation: 578).
    Under this resolution it was not the one who rose who had to answer - in money and in hostages - but the whole locality at once.

    By the end of the year Moscow fixed the practice for the entire army: on 11 December 1919 Trotsky, war minister of the RSFSR, and Kamenev, commander-in-chief of the RSFSR armed forces, signed secret order No. 579 - every army "undertakes, in its area of operations, to disarm the population with the help of all means at its disposal (agitation, agent intelligence, payment for surrendered weapons in money and in kind, house-to-house searches, fines in money and in kind, collective responsibility, the hostage system, the shooting of culprits, etc., etc.)," and the order, as stated in it, applies "first of all to the armies entering Ukraine"(Citation: 579).

    On 26 July 1919 Skrypnyk, plenipotentiary of the same administration's Defence Council, telegraphed from the area of Zeleny's uprising - in the same words as the orders: "The uprising of the peasants of the Trypillia district has been suppressed... there now remains... the exaction from it of all the expenses borne by the workers' and peasants' state for the suppression," specifying: "It is necessary to carry out the exaction in produce, the exaction from the peasants of the expenses caused by the uprising"(Citation: 593).
    In Mohyliv-Podilskyi, which Soviet troops captured on 5 April 1919 without a fight, the town was at once subjected to a forced payment - a telegram to the Bureau of the Ukrainian Press over the signature of Ivanitsky reported: "there is exemplary order in the town, with which even the bourgeoisie is content, despite the imposed contribution of one and a half million"(Citation: 596).
    The reports of the Special Investigative Commission attached to the Whites' command (the AFSR) record of Odesa: "400 people have been sent to forced labour for non-payment of contributions," and of Izium in Kharkiv province: "eyewitnesses told of the wholesale robbery of families whose relatives had gone over to the 'Kadets'"(Citation: 574).

    In Fastiv in Kyiv province the forced payment imposed on the town under the Soviet authority was paid by the Jewish community - Kh.
    Hofman, an officer of the Editorial Board, the body collecting testimony on the pogroms, recorded: "The entire imposed contribution was paid almost wholly by the Jews, notwithstanding that they are poorer and considerably fewer than the Christians.
    Many Jews were taken hostage, sat long in prison, many had to leave Fastiv altogether"(Citation: 568).
  uk: |-
    Центральний орган колоніальної адміністрації України (ВУЦВК) 29 червня 1919 року постановив: «Ужити найенергійніших заходів до придушення куркульських повстань і виступів банд, застосовуючи обкладення контрибуцією бунтівних місцевостей і взяття заручників»; підписали постанову за голову цього органу Полозов і його секретар Лапчинський(Citation: 578).
    Відповідати за цією постановою - грішми й заручниками - мав не той, хто повстав, а вся місцевість разом.

    Під кінець року Москва закріпила практику вже для всієї армії: 11 грудня 1919 року військовий міністр РСФРР Троцький і головнокомандувач збройних сил РСФРР Каменєв підписали таємний наказ № 579 - кожна армія «зобов'язується в районі своїх дій обеззброїти населення за допомогою всіх засобів, які є в її розпорядженні (агітація, агентурна розвідка, оплата зданої зброї грішми й натурою, повальні обшуки, штрафи грішми й натурою, кругова порука, система заручників, розстріл винуватців і т. ін., і т. ін.)», і наказ цей, сказано в ньому ж, стосується «в першу голову армій, що вступають в Україну»(Citation: 579).

    26 липня 1919 року уповноважений Ради оборони тієї ж адміністрації Скрипник телеграфував із району повстання Зеленого - тими самими словами, що й накази: «Повстання ж селян Трипільського району придушено... тепер лишається... стягнення з нього всіх видатків, понесених робітничо-селянською державою на придушення», - і уточнював: «Необхідно провести стягнення продуктами, стягнення з селян видатків, спричинених повстанням»(Citation: 593).
    У Могилеві-Подільському, який радянські війська захопили 5 квітня 1919 року без бою, місто одразу обклали примусовою виплатою - телеграма в Бюро української преси за підписом Іваницького повідомляла: «у місті зразковий порядок, яким навіть буржуазія задоволена, попри накладену контрибуцію в півтора мільйона»(Citation: 596).
    У донесеннях Особливої слідчої комісії при командуванні білих (ЗСПР) записано про Одесу: «400 осіб за несплату контрибуцій відправлено на примусові роботи», і про Ізюм Харківської губернії - «очевидці переказували про поголовне пограбування родин, у яких родичі пішли до „кадетів"»(Citation: 574).

    У Фастові Київської губернії примусову виплату, накладену на місто за радянської влади, внесла єврейська громада - співробітник Редакційної колегії, органу, що збирав свідчення про погроми, Х. Гофман записав: «Уся накладена контрибуція була майже цілком сплачена євреями, попри те, що вони бідніші і їх значно менше, ніж християн.
    Багато євреїв було взято заручниками, довго сиділи у в'язниці, багатьом довелося зовсім залишити Фастів»(Citation: 568).
  ru: |-
    Центральный орган колониальной администрации Украины (ВУЦИК) 29 июня 1919 года постановил: «Принять самые энергичные меры к подавлению кулацких восстаний и выступлений банд, применяя обложение контрибуцией бунтующих местностей и взятие заложников»; подписали постановление за председателя этого органа Полозов и его секретарь Лапчинский(Citation: 578).
    Отвечать по этому постановлению - деньгами и заложниками - должен был не тот, кто восстал, а вся местность разом.

    К концу года Москва закрепила практику уже для всей армии: 11 декабря 1919 года военный министр РСФСР Троцкий и главнокомандующий вооружёнными силами РСФСР Каменев подписали секретный приказ № 579 - каждая армия «обязуется в районе своих действий обезоружить население при помощи всех средств, какие имеются в ее распоряжении (агитация, агентурная разведка, оплата сдаваемого оружия деньгами и натурой, повальные обыски, штрафы деньгами и натурой, круговая порука, система заложников, расстрел виновников и проч., и проч.)», и приказ этот, сказано в нём же, относится «в первую голову к армиям, вступающим в Украину»(Citation: 579).

    26 июля 1919 года уполномоченный Совета обороны той же администрации Скрыпник телеграфировал из района восстания Зелёного - теми же словами, что и приказы: «Восстание же крестьян Трипольского района подавлено... теперь остается... взыскание с него всех расходов, понесенных рабоче-крестьянским государством на подавление», - и уточнял: «Необходимо произвести взыскание продуктами, взыскание с крестьян расходов, вызванных восстанием»(Citation: 593).
    В Могилёве-Подольском, который советские войска захватили 5 апреля 1919 года без боя, город сразу обложили принудительной выплатой - телеграмма в Бюро украинской печати за подписью Иваницкого сообщала: «в городе образцовый порядок, которым даже буржуазия довольна, несмотря на наложенную контрибуцию в полтора миллиона»(Citation: 596).
    В донесениях Особой следственной комиссии при командовании белых (ВСЮР) записано об Одессе: «400 человек за неуплату контрибуций отправлено на принудительные работы», и об Изюме Харьковской губернии - «очевидцы передавали о поголовном ограблении семейств, у коих родственники пошли к "кадетам"»(Citation: 574).

    В Фастове Киевской губернии принудительную выплату, наложенную на город при советской власти, внесла еврейская община - сотрудник Редакционной коллегии, органа, собиравшего свидетельства о погромах, Х. Гофман записал: «Вся наложенная контрибуция была почти целиком уплачена евреями, невзирая на то, что они беднее и их значительно меньше, чем христиан.
    Много евреев было взято заложниками, долго сидели в тюрьме, многим пришлось совсем оставить Фастов»(Citation: 568).
