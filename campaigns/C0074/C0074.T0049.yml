description:
  ru: '29 июня 1919 года центральный орган колониальной администрации Украины (ВУЦИК) постановил «произвести всеобщую мобилизацию рабочих и крестьян призывного возраста, начиная с 19 лет, а в прифронтовой полосе - с 18 лет», весь «нетрудовой элемент» с 18 до 45 лет привлечь в тыловое ополчение - захваченная Украина должна была воевать за захватчика, - и тем же постановлением объявил: «Всех противящихся проведению мобилизации признать врагами народа»; подписали его за председателя органа Полозов и секретарь Лапчинский(Citation: 578). 26 июля 1919 года уполномоченный Совета обороны той же администрации Скрыпник, отчитываясь по Трипольскому району, где армия только что разбила поднявшихся крестьян, писал: «теперь остается мобилизация всего населения этого района» - мужчин поднявшихся сёл забирали в ту самую армию, которая их разбила(Citation: 593).'
  en: |-
    On 29 June 1919 the central organ of the colonial administration of Ukraine (the VUTsIK) resolved "to carry out a general mobilization of workers and peasants of call-up age, beginning at 19, and in the front-line zone at 18," and to draft the entire "non-labouring element" from 18 to 45 into the rear militia - captured Ukraine was to fight for its captor - and by the same resolution it declared: "All who resist the carrying out of the mobilization are to be deemed enemies of the people"; it was signed for the chairman of the organ by Polozov and by secretary Lapchinsky(Citation: 578).
    On 26 July 1919 Skrypnyk, plenipotentiary of the same administration's Defence Council, reporting on the Trypillia district, where the army had just crushed the risen peasants, wrote: "there now remains the mobilization of the entire population of this district" - the men of villages that had just risen were taken into the very army that had crushed them(Citation: 593).
  uk: 'Центральний орган колоніальної адміністрації України (ВУЦВК) 29 червня 1919 року постановив «провести загальну мобілізацію робітників і селян призовного віку, починаючи з 19 років, а в прифронтовій смузі - з 18», увесь «нетрудовий елемент» з 18 до 45 років залучити до тилового ополчення - захоплена Україна мала воювати за загарбника, - і тією ж постановою оголосив: «Усіх, хто противиться проведенню мобілізації, визнати ворогами народу»; підписали її за голову органу Полозов і секретар Лапчинський(Citation: 578). 26 липня 1919 року уповноважений Ради оборони тієї ж адміністрації Скрипник, звітуючи по Трипільському району, де армія щойно розбила селян, які піднялися, писав: «тепер лишається мобілізація всього населення цього району» - чоловіків сіл, які щойно піднялися, забирали в ту саму армію, що їх розбила(Citation: 593).'
