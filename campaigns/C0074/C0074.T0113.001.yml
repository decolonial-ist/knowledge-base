description:
  ru: |-
    Главнокомандующий белой армией Деникин в обращении «К населению Малороссии» ручался: «не будет никаких ограничений в отношении малорусского языка в печати»(Citation: 248).
    Запрет пришёл через три недели после захвата Киева и был устроен как система разрешений: по приказу начальника администрации белых генерала Май-Маевского «все киевские газеты и остальные повременные издания выходят не иначе, как с разрешения на то киевского губернатора», каждое издание прямо из типографии представляется прокурору и губернатору, действует «строгая предварительная военная цензура», а за отступление - штраф 20 000 рублей и полгода тюрьмы(Citation: 588)(Citation: 589).

    Украинской печати разрешений эта система не давала.
    Бюро информации при Совете обороны УССР сообщало из захваченного Киева: газеты белых - «Киевлянин» под редакцией Шульгина, «Эхо», «Вечерняя газета» «и ряд других листовок» - выходят ежедневно, но «в Киеве не выходит ни одна украинская газета», а «на улицах Киева совершенно не слышно украинской речи»(Citation: 566).
    Историки Института истории Украины подтверждают итог: при белых закрывались украинские газеты, а украинские книги забирали из магазинов(Citation: 186).
    Обещание не трогать украинское слово держалось ровно до входа белых в Киев.
  en: |-
    Denikin, commander-in-chief of the White army, vouched in his address "To the Population of Little Russia": "there will be no restrictions whatsoever in relation to the Little Russian language in print"(Citation: 248).
    The ban came three weeks after the capture of Kyiv and was built as a system of permits: by order of general Mai-Maevsky, head of the Whites' administration, "all Kyiv newspapers and other periodicals appear only with the permission of the Kyiv governor," every publication is presented to the prosecutor and the governor straight from the printing house, "strict preliminary military censorship" is in force, and any deviation is punished with a fine of 20,000 roubles and six months in prison(Citation: 588)(Citation: 589).

    To the Ukrainian press this system gave no permits.
    The Information Bureau of the UkrSSR Defence Council reported from captured Kyiv: the Whites' newspapers - Kievlyanin under the editorship of Shulgin, Ekho, Vechernyaya Gazeta "and a number of other sheets" - came out daily, but "not a single Ukrainian newspaper appears in Kyiv," and "in the streets of Kyiv Ukrainian speech is not heard at all"(Citation: 566).
    Historians of the Institute of History of Ukraine confirm the outcome: under the Whites Ukrainian newspapers were closed down and Ukrainian books were removed from the shops(Citation: 186).
    The promise not to touch the Ukrainian word lasted exactly until the Whites entered Kyiv.
  uk: |-
    Головнокомандувач білої армії Денікін у зверненні «До населення Малоросії» ручався: «не буде жодних обмежень щодо малоруської мови в друці»(Citation: 248).
    Заборона прийшла через три тижні після захоплення Києва і була влаштована як система дозволів: за наказом начальника адміністрації білих генерала Май-Маєвського «всі київські газети та інші періодичні видання виходять не інакше, як із дозволу на те київського губернатора», кожне видання прямо з друкарні подається прокуророві й губернаторові, діє «сувора попередня військова цензура», а за відступ - штраф 20 000 рублів і півроку тюрми(Citation: 588)(Citation: 589).

    Українській пресі дозволів ця система не давала.
    Бюро інформації при Раді оборони УСРР повідомляло із захопленого Києва: газети білих - «Киевлянин» за редакцією Шульгіна, «Эхо», «Вечерняя газета» «і ряд інших листків» - виходять щодня, але «в Києві не виходить жодна українська газета», а «на вулицях Києва зовсім не чути української мови»(Citation: 566).
    Історики Інституту історії України підтверджують підсумок: за білих закривалися українські газети, а українські книжки забирали з крамниць(Citation: 186).
    Обіцянка не чіпати українське слово протрималася рівно до входу білих у Київ.
