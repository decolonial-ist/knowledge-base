description:
  ru: |-
    10 сентября 1919 года полковник Матвеев, временно возглавлявший администрацию белых в городе Николаеве, издал распоряжение: все союзы и товарищества, которые не подали свои уставы или не утверждены окружным судом, считаются закрытыми(Citation: 585).
    Украинские просветительские общества, выросшие за годы революции без утверждения по дореволюционному порядку, попадали под это условие целиком: чтобы закрыть их, отдельного приказа не требовалось - именно так, формально нейтральным условием, белые и закрывали украинские общества.
    Историки Института истории Украины подтверждают итог: украинские учреждения при белых были ликвидированы, а на их месте заводились русские(Citation: 186).
  en: |-
    On 10 September 1919 colonel Matveev, temporary head of the Whites' administration in the city of Mykolaiv, issued an ordinance: all unions and societies that had not submitted their charters or had not been confirmed by the circuit court were deemed closed(Citation: 585).
    The Ukrainian enlightenment societies, grown up over the years of the revolution without confirmation under the pre-revolutionary procedure, fell under this condition wholesale: no separate order was needed to close them - it was precisely thus, by a formally neutral condition, that the Whites closed the Ukrainian societies.
    Historians of the Institute of History of Ukraine confirm the outcome: Ukrainian institutions under the Whites were liquidated, and Russian ones were set up in their place(Citation: 186).
  uk: |-
    10 вересня 1919 року полковник Матвєєв, що тимчасово очолював адміністрацію білих у місті Миколаєві, видав розпорядження: всі спілки й товариства, які не подали свої статути або не затверджені окружним судом, вважаються закритими(Citation: 585).
    Українські просвітницькі товариства, що виросли за роки революції без затвердження за дореволюційним порядком, підпадали під цю умову цілком: щоб закрити їх, окремого наказу не було потрібно - саме так, формально нейтральною умовою, білі й закривали українські товариства.
    Історики Інституту історії України підтверджують підсумок: українські установи за білих було ліквідовано, а на їхньому місці заводилися російські(Citation: 186).
