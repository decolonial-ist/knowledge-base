description:
  ru: 'Введение доплат за политику денационализации: указами царской администрации 1869 и 1886 годов чиновникам «в десяти Юго-Западных губерниях лицам русского происхождения, исключая, однако, местных уроженцев», назначались доплаты за успехи в русификации Украины(Citation: 419) - часть системных планов властей по усилению «русского ассимиляторского потенциала» Западного края после польского восстания 1863 года, включавших материальные льготы русским чиновникам и учителям(Citation: 418).'
  en: 'The introduction of bonuses for the policy of denationalization: by decrees of the tsarist administration of 1869 and 1886, officials "in the ten South-Western governorates - persons of Russian origin, excluding, however, local natives" - were assigned bonuses for successes in the Russification of Ukraine(Citation: 419) - part of the authorities'' systematic plans to strengthen the "Russian assimilatory potential" of the Western krai after the Polish uprising of 1863, which included material benefits for Russian officials and teachers(Citation: 418).'
  uk: 'Запровадження доплат за політику денаціоналізації: указами царської адміністрації 1869 і 1886 років чиновникам «у десяти південно-західних губерніях особам російського походження, за винятком, однак, місцевих уродженців», призначалися доплати за успіхи в русифікації України(Citation: 419) - частина системних планів влади з посилення «російського асиміляторського потенціалу» Західного краю після польського повстання 1863 року, що включали матеріальні пільги російським чиновникам та вчителям(Citation: 418).'
