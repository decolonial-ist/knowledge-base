description:
  ru: 'Секретный циркуляр Валуева цензурным комитетам (18 июля 1863), остановивший печать на родном языке: «пропуском же книг на малороссийском языке как духовного содержания, так учебных и вообще назначаемых для первоначального чтения народа, приостановиться»(Citation: 151).'
  en: 'Valuev''s secret circular to the censorship committees (18 July 1863), which halted printing in the native language: "the clearance of books in the Little Russian language, whether of religious content, educational, or generally intended for the people''s elementary reading, is to be suspended"(Citation: 151).'
  uk: 'Таємний циркуляр Валуєва цензурним комітетам (18 липня 1863), що зупинив друк рідною мовою: «пропуск же книг малоросійською мовою як духовного змісту, так навчальних і взагалі призначених для початкового читання народу, призупинити»(Citation: 151).'
