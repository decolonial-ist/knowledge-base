description:
  ru: 'Закрытие национальной прессы: украинский общественно-политический и литературно-художественный журнал «Основа» (Санкт-Петербург, январь 1861 - октябрь 1862) прекратился: планы реорганизации издания сорвал министр внутренних дел Валуев, не санкционировав выпуск по обновлённой программе(Citation: 24).'
  en: 'The closure of the national press: the Ukrainian socio-political and literary journal "Osnova" (St. Petersburg, January 1861 - October 1862) came to an end: the plans to reorganize the publication were thwarted by the minister of internal affairs Valuev, who refused to sanction its publication under a renewed program(Citation: 24).'
  uk: 'Закриття національної преси: український суспільно-політичний і літературно-мистецький часопис «Основа» (Санкт-Петербург, січень 1861 - жовтень 1862) припинився: плани реорганізації видання зірвав міністр внутрішніх справ Валуєв - «міністр внутр[ішніх] справ Рос[ійської] імперії П.Валуєв не санкціонував видання «О[снови]» за оновленою програмою»(Citation: 24).'
