description:
  ru: 'Ликвидация образования на родном языке: за 1859–1862 годы интеллигенция и студенчество основали в Украине 111 воскресных школ для обучения взрослых грамоте, преподавание в них велось на украинском языке; в 1862 году власти закрыли эти школы «за якобы наличие революционной пропаганды»(Citation: 24).'
  en: 'The liquidation of education in the native language: in 1859–1862 the intelligentsia and students founded 111 Sunday schools in Ukraine to teach adults literacy, with instruction conducted in Ukrainian; in 1862 the authorities closed these schools "for the alleged presence of revolutionary propaganda"(Citation: 24).'
  uk: 'Ліквідація освіти рідною мовою: «упродовж 1859–62 в Україні засновано 111 Н[едільних] ш[кіл]» - їх створювали інтелігенція та студентство для навчання грамоти дорослих, «викладання в Н[едільних] ш[колах] велося укр[аїнською] мовою»; «1862 за начебто наявність революц[ійної] пропаганди Н[едільні] ш[коли] були закриті владою»(Citation: 24).'
