description:
  ru: 'Изъятие у УССР контроля над внешней политикой, армией, внешней торговлей, транспортом и связью через Конституцию СССР 1924 года с передачей их в ведение союзных наркоматов(Citation: 22).'
  en: 'Stripping the Ukrainian SSR of control over foreign policy, the army, foreign trade, transport, and communications through the 1924 Constitution of the USSR, transferring them to the jurisdiction of the all-union people''s commissariats(Citation: 22).'
  uk: 'Вилучення в УСРР контролю над зовнішньою політикою, армією, зовнішньою торгівлею, транспортом і зв''язком через Конституцію СРСР 1924 року з передачею їх у відання союзних наркоматів(Citation: 22).'
