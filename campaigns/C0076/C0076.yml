name:
  en: Legal Absorption through the Creation of the USSR (1922–1924)
  uk: Юридичне поглинання через створення СРСР (1922–1924)
  ru: Юридическое поглощение через создание СССР (1922–1924)
description:
  en: |-
    Formal consolidation of the seizure of Ukraine by dragging it into the so-called Union of SSRs.
    The unification of equal republics with the right of free secession was declared, but in practice the union treaty (December 1922) and the Constitution of the USSR (1924) became instruments of rigid centralization.
    The Ukrainian SSR was definitively stripped of control over foreign policy, the army, foreign trade, transport, and communications — all these spheres passed to the jurisdiction of union-level people's commissariats in Moscow(Citation: 22)(Citation: 25).
  uk: |-
    Формальне закріплення захоплення України шляхом втягування її до так званого Союзу РСР.
    Декларувалося об'єднання рівноправних республік із правом вільного виходу, але насправді союзний договір (грудень 1922 р.) та Конституція СРСР (1924 р.) стали інструментами жорсткої централізації.
    УСРР остаточно втратила контроль над зовнішньою політикою, армією, зовнішньою торгівлею, транспортом і зв'язком — усі ці сфери перейшли у відання союзних наркоматів у Москві(Citation: 22)(Citation: 25).
  ru: |-
    Формальное закрепление захвата Украины путем втягивания ее в так называемый Союз ССР.
    Декларировалось объединение равноправных республик с правом свободного выхода, но на деле союзный договор (декабрь 1922 г.) и Конституция СССР (1924 г.) стали инструментами жесткой централизации.
    УССР окончательно лишилась контроля над внешней политикой, армией, внешней торговлей, транспортом и связью — все эти сферы перешли в ведение союзных наркоматов в Москве(Citation: 22)(Citation: 25).
