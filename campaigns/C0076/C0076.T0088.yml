description:
  ru: 'Использование Договора об образовании СССР (декабрь 1922 г.) для формального декларирования союза равноправных республик, маскирующего окончательную централизацию власти в Москве(Citation: 25).'
  en: 'Use of the Treaty on the Creation of the USSR (December 1922) to formally declare a union of equal republics, masking the final centralization of power in Moscow(Citation: 25).'
  uk: 'Використання Договору про утворення СРСР (грудень 1922 р.) для формального декларування союзу рівноправних республік, що маскував остаточну централізацію влади в Москві(Citation: 25).'
