name:
  en: 'Instrumentalization of a Natural Disaster by the Colonizers: Paskevich and Rosen Declare the Earthquake "God''s Punishment of the Nokhchi People for Disobedience to the Empire" (1830)'
  uk: 'Інструменталізація стихійного лиха колонізаторами: Паскевич і Розен оголошують землетрус «Божою карою народові Нохчі за непокору імперії» (1830)'
  ru: 'Инструментализация стихийного бедствия колонизаторами: Паскевич и Розен объявляют землетрясение «Божьей карой народу нохчи за неповиновение империи» (1830)'
description:
  en: |-
    At the end of February 1830, the Caucasus was struck by a devastating earthquake that lasted more than a month and caused panic among the mountain peoples.
    The empire turned the disaster into a weapon of indoctrination and delivered this lie to the people.
    The historian Ya.
    Z. Akhmadov wrote: "supporters of the Russian orientation claimed that the earthquake had been caused by the wrath of Allah over the attempt at an armed uprising"(Citation: 125).
    The mechanics of the indoctrination are acknowledged by the colonizers themselves.
    The imperial historian Volkonsky wrote: "the commander-in-chief accordingly ordered General Rosen 4th to spread entirely opposite rumors among the people, namely, that the earthquake had been sent down by God upon the mountain peoples for their ill-intentioned acts against the Russian government, and hoped by this means to tear his followers away from Kazi-Mulla"(Citation: 116).
    The imperial historian Potto admits that the order was carried out: General Rosen 4th, who commanded the troops on the left flank of the Caucasus Line (the eastern section of the empire's fortified frontier along the Terek and the Sunzha), "resorted to proclamations in which he strove to assure the people that the earthquake had been sent down upon them as punishment for their treason and ill-intentioned acts against the Russian government"(Citation: 78).
  uk: |-
    Наприкінці лютого 1830 року Кавказ уразив руйнівний землетрус, що тривав понад місяць і викликав паніку серед гірських народів.
    Імперія обернула лихо на зброю навіювання й доставила цю брехню народові.
    Історик Я. З. Ахмадов писав: «прибічники російської орієнтації стверджували, що землетрус викликаний гнівом Аллаха за спробу збройного повстання»(Citation: 125).
    Механіку навіювання визнають самі колонізатори.
    Імперський історик Волконський писав: «головнокомандувач і наказав генералові Розену 4-му поширювати в народі цілком протилежні чутки, а саме, що землетрус посланий Богом гірським народам за неблагонамірені їхні вчинки проти російського уряду, і сподівався в такий спосіб відірвати від Казі-мулли його послідовників»(Citation: 116).
    Імперський історик Потто визнає виконання наказу: генерал Розен 4-й, який командував військами на лівому фланзі Кавказької лінії (східній ділянці укріпленого кордону імперії по Тереку й Сунжі), «вдався до прокламацій, у яких намагався запевнити народ, що землетрус посланий йому як покарання за його зраду та неблагонамірені вчинки проти російського уряду»(Citation: 78).
  ru: |-
    В конце февраля 1830 года Кавказ поразило разрушительное землетрясение, продолжавшееся более месяца и вызвавшее панику среди горских народов.
    Империя обратила бедствие в оружие внушения и доставила эту ложь народу.
    Историк Я. З. Ахмадов писал: «сторонники российской ориентации утверждали, что землетрясение вызвано гневом Аллаха за попытку вооружённого восстания»(Citation: 125).
    Механику внушения признают сами колонизаторы.
    Имперский историк Волконский писал: «главнокомандующий и приказал генералу Розену 4-му распространять в народе совершенно противоположные слухи, а именно, что землетрясение ниспослано Богом горским народам за неблагонамеренные их поступки против русского правительства, и надеялся этим путём отторгнуть от Кази-муллы его последователей»(Citation: 116).
    Имперский историк Потто признаёт исполнение приказа: генерал Розен 4-й, командовавший войсками на левом фланге Кавказской линии (восточном участке укреплённой границы империи по Тереку и Сунже), «обратился к прокламациям, в которых старался уверить народ, что землетрясение ниспослано ему в наказание за его измену и неблагонамеренные поступки русского правительства»(Citation: 78).
