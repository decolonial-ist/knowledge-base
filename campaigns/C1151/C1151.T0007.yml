description:
  ru: |-
    В 1830 году, во время продолжавшегося землетрясения, генерал Розен 4-й, командовавший войсками на левом фланге Кавказской линии (восточном участке укреплённой границы империи по Тереку и Сунже), по приказу главнокомандующего Паскевича разослал по аулам прокламации, внушавшие народу искусственную картину мира: природное бедствие объявлялось Божьей карой за сопротивление империи.
    Историк Я. З. Ахмадов писал о том, как эта ложь звучала среди нохчи: «сторонники российской ориентации утверждали, что землетрясение вызвано гневом Аллаха за попытку вооружённого восстания»(Citation: 125).
    Имперский историк Волконский признаёт источник внушения: главнокомандующий «приказал генералу Розену 4-му распространять в народе совершенно противоположные слухи, а именно, что землетрясение ниспослано Богом горским народам за неблагонамеренные их поступки против русского правительства»(Citation: 116).
    Имперский историк Потто фиксировал акт: Розен «обратился к прокламациям, в которых старался уверить народ, что землетрясение ниспослано ему в наказание за его измену и неблагонамеренные поступки русского правительства»(Citation: 78).
  en: |-
    In 1830, during an ongoing earthquake, General Rozen 4th, who commanded the troops on the left flank of the Caucasus Line (the eastern section of the empire's fortified border along the Terek and Sunzha rivers), on the orders of commander-in-chief Paskevich sent proclamations out to the auls, instilling in the people an artificial picture of the world: the natural disaster was declared God's punishment for resisting the empire.
    The historian Ya.
    Z. Akhmadov wrote about how this lie sounded among the Nokhchi: “supporters of the Russian orientation claimed that the earthquake was caused by the wrath of Allah over the attempt at an armed uprising”(Citation: 125).
    The imperial historian Volkonsky acknowledges the source of the suggestion: the commander-in-chief “ordered General Rozen 4th to spread entirely opposite rumors among the people, namely, that the earthquake had been sent down by God upon the Mountain Peoples for their ill-intentioned acts against the Russian government”(Citation: 116).
    The imperial historian Potto recorded the act: Rozen “resorted to proclamations in which he sought to assure the people that the earthquake had been sent down upon them as punishment for their treason and their ill-intentioned acts against the Russian government”(Citation: 78).
  uk: |-
    У 1830 році, під час тривалого землетрусу, генерал Розен 4-й, який командував військами на лівому фланзі Кавказької лінії (східній ділянці укріпленого кордону імперії по Тереку та Сунжі), за наказом головнокомандувача Паскевича розіслав по аулах прокламації, що навіювали народові штучну картину світу: природне лихо оголошувалося Божою карою за опір імперії.
    Історик Я. З. Ахмадов писав про те, як ця брехня звучала серед Нохчі: «прибічники російської орієнтації стверджували, що землетрус викликаний гнівом Аллаха за спробу збройного повстання»(Citation: 125).
    Імперський історик Волконський визнає джерело навіювання: головнокомандувач «наказав генералові Розену 4-му поширювати в народі цілком протилежні чутки, а саме, що землетрус посланий Богом Гірським народам за їхні зловмисні вчинки проти російського уряду»(Citation: 116).
    Імперський історик Потто зафіксував акт: Розен «вдався до прокламацій, у яких намагався запевнити народ, що землетрус посланий йому як покарання за його зраду та зловмисні вчинки проти російського уряду»(Citation: 78).
