description:
  ru: |-
    Статья Д. Медведева, зампреда Совбеза РФ, в «Коммерсанте» (11 октября 2021), маргинализирующей украинское руководство: «нам с вассалами дело иметь бессмысленно.
    Дела нужно вести с сюзереном», «во главе Украины стоят слабые люди, которые стремятся только к тому, чтобы набить свои карманы», а переговоры с ними «абсолютно бессмысленны»(Citation: 241).
    Украинского президента там же сравнили с гипотетическим евреем на службе в СС(Citation: 241).
  en: |-
    An article by D. Medvedev, deputy chairman of Russia's Security Council, in Kommersant (11 October 2021) marginalizing the Ukrainian leadership: "it is pointless for us to deal with vassals.
    One must do business with the suzerain"; "at the head of Ukraine stand weak people who strive only to line their own pockets," and negotiations with them are "absolutely pointless"(Citation: 241).
    In the same text the Ukrainian president was likened to a hypothetical Jew serving in the SS(Citation: 241).
  uk: |-
    Стаття Д. Медведєва, заступника голови Радбезу РФ, у «Коммерсанті» (11 жовтня 2021), що маргіналізує українське керівництво: «нам з васалами справу мати безглуздо.
    Справи треба вести з сюзереном», «на чолі України стоять слабкі люди, які прагнуть лише набити свої кишені», а переговори з ними «абсолютно безглузді»(Citation: 241).
    Українського президента там само порівняли з гіпотетичним євреєм на службі в СС(Citation: 241).
