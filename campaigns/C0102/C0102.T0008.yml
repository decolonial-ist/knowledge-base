description:
  en: 'The official denial of the Ukrainian nation''s right to independent statehood: the article by the head of the Russian state declares outright that "Ukraine''s genuine sovereignty is possible precisely in partnership with Russia," while "the wall that has arisen in recent years between Russia and Ukraine" is declared a split of "between parts of what is essentially one historical and spiritual space"(Citation: 245).'
  uk: 'Офіційна відмова українській нації в праві на самостійну державність: стаття голови РФ прямо декларує, що «справжня суверенність України можлива саме в партнерстві з Росією», а «стіну, що виникла останніми роками між Росією і Україною» оголошено розколом «між частинами, по суті, одного історичного і духовного простору»(Citation: 245).'
  ru: 'Официальный отказ украинской нации в праве на самостоятельную государственность: статья главы РФ прямо декларирует, что «подлинная суверенность Украины возможна именно в партнёрстве с Россией», а «стена, возникшая в последние годы между Россией и Украиной», объявляется расколом «между частями, по сути, одного исторического и духовного пространства»(Citation: 245).'
