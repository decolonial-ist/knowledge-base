description:
  ru: 'Тотальная индоктринация российского общества идеями философа И. Ильина (так называемый «белый фашизм») и превращение концепта «Русского мира» в государственную идеологию (рашизм), обосновывающую культурное превосходство и экзистенциальное право метрополии на насилие над соседями(Citation: 2).'
  en: 'Total indoctrination of Russian society with the ideas of the philosopher I. Ilyin (so-called "white fascism") and the transformation of the "Russian World" concept into a state ideology (rashism) that justifies the metropole''s cultural superiority and existential right to violence against its neighbors(Citation: 2).'
  uk: 'Тотальна індоктринація російського суспільства ідеями філософа І. Ільїна (так званий «білий фашизм») і перетворення концепту «русского міра» на державну ідеологію (рашизм), що обґрунтовує культурну вищість та екзистенційне право метрополії на насильство над сусідами(Citation: 2).'
