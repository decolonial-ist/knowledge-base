description:
  en: |-
    The Government of the Russian Empire organized an armed raid to physically punish the insurgent Indigenous population: historian Ya.
    Z. Akhmadov points out that General Douglas «halted the movement of the main forces and sent toward Chechen-Aul a detachment of dragoons under Colonel Koch, totaling 300 soldiers and 200 Cossacks»(Citation: 94).
  uk: 'Уряд Російської імперії організував збройний рейд для фізичного покарання повсталого корінного населення: історик Я. З. Ахмадов вказує, що генерал Дуглас «зупинив рух великих сил і направив до Чечен-Аула загін драгунів полковника Коха, загалом 300 солдатів і 200 козаків»(Citation: 94).'
  ru: 'Правительство Российской империи организовало вооруженный рейд для физического наказания восставшего коренного населения: историк Я. З. Ахмадов указывает, что генерал Дуглас «остановил движение больших сил и направил к Чечен-Аулу отряд драгун полковника Коха, всего в 300 солдат и 200 казаков»(Citation: 94).'
