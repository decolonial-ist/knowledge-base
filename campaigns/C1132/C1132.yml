name:
  en: Armed Uprising on the Plain, General Douglas's Expedition, and the Rout of Colonel Koch's Punitive Detachment (1732)
  uk: Збройне повстання на рівнині, експедиція генерала Дугласа та розгром карального загону полковника Коха (1732)
  ru: Вооруженное восстание на равнине, экспедиция генерала Дугласа и разгром карательного отряда полковника Коха (1732)
description:
  en: |-
    In 1732, the lowland part of Chechnya became the center of large-scale armed resistance.
    The uprising was provoked by the direct discontent of the indigenous population: historian Sh.
    B. Akhmadov states that those assembled, «openly expressing their discontent with the actions of the tsarist authorities, began to threaten attacks on their fortifications»(Citation: 66).
    Researcher Ya.
    Z. Akhmadov adds that «in 1732 lowland Chechnya once again turns into the center of a major insurgent movement», and «around 10 thousand highlanders gathered in Chechen-Aul», intending to set out «to destroy the tsarist fortifications»(Citation: 94).
    In response, the occupation apparatus applied military force: the first author indicates that «on July 4, 1732, the tsarist authorities dispatched to Chechnya a military detachment headed by General Douglas, who commanded the troops in the fortress of the Holy Cross»(Citation: 66), which, according to the cited report, resolved, regarding the insurgents, «without allowing them to multiply, to avert and destroy them by the dispatched detachment»(Citation: 94).
    The punitive action was coordinated with the loyal local elite: Sh.
    B. Akhmadov notes the participation of Prince Kazbulat, «who led the detachment of tsarist troops headed by Douglas to the village of Chechen-Aul to suppress the highlanders' uprising»(Citation: 66).
    However, the insurgents avoided a direct clash with the empire's main forces: Ya.
    Z. Akhmadov records that «General Douglas, who had already set out on the campaign, received word that the highlanders had dispersed»(Citation: 94).
    After this, the general sent Colonel Koch's dragoon detachment to punish the inhabitants, which, as stated in the sources, «on July 7 entered the village of Chechen, burned it down completely, and began hastily withdrawing»(Citation: 66).
    The historical episode ended that same year with the complete physical destruction of the punitive forces: Ya.
    Z. Akhmadov summarizes that during the withdrawal Koch's detachment «was surrounded in dense forests, defeated, and annihilated», and that in the course of the battle «the senior Chechen prince Kazbulat also perished»(Citation: 94).
  uk: |-
    У 1732 році рівнинна частина Чечні стала центром масштабного збройного опору.
    Виступ був спровокований прямим невдоволенням корінного населення: історик Ш. Б. Ахмадов констатує, що зібрані, «відкрито висловлюючи своє невдоволення діями царської влади, почали погрожувати нападом на їхні укріплення»(Citation: 66).
    Дослідник Я. З. Ахмадов доповнює, що «у 1732 р. рівнинна Чечня знову перетворюється на центр великого повстанського руху», і «в Чечен-Аулі зібралося близько 10 тис. горців», які мали намір виступити «для розгрому царських укріплень»(Citation: 94).
    У відповідь окупаційний апарат застосував військову силу: перший автор вказує, що «4 липня 1732 р. царська влада спорядила до Чечні військовий загін на чолі з генералом Дугласом, який командував військами у фортеці Святий Хрест»(Citation: 66), і той, згідно з цитованим рапортом, постановив повстанців, «не допускаючи до розмноження, посланою командою відвернути і зруйнувати»(Citation: 94).
    Каральна акція координувалася з лояльною місцевою елітою: Ш. Б. Ахмадов зазначає участь князя Казбулата, «який привів загін царських військ на чолі з Дугласом у селище Чечен-аул для придушення виступу горців»(Citation: 66).
    Однак повстанці уникли прямого зіткнення з головними силами імперії: Я. З. Ахмадов фіксує, що «Генерал Дуглас, який було виступив у похід, отримав звістку, що горці розійшлися»(Citation: 94).
    Після цього генерал направив для покарання жителів драгунську команду полковника Коха, яка, як констатується в джерелах, «7 липня вступила в село Чечень, повністю спалила його і почала спішно відходити назад»(Citation: 66).
    Історичний епізод завершився того ж року повним фізичним розгромом карателів: Я. З. Ахмадов резюмує, що під час відходу загін Коха «був оточений у густих лісах, розбитий і знищений», а також у ході бою «загинув і старший чеченський князь Казбулат»(Citation: 94).
  ru: |-
    В 1732 году плоскостная часть Чечни стала центром масштабного вооруженного сопротивления.
    Выступление было спровоцировано прямым недовольством коренного населения: историк Ш. Б. Ахмадов констатирует, что собравшиеся, «открыто выражая свое недовольство действиями царских властей, начали угрожать нападением на их укрепления»(Citation: 66).
    Исследователь Я. З. Ахмадов дополняет, что «в 1732 г. плоскостная Чечня вновь превращается в центр крупного повстанческого движения», и «в Чечен-Ауле, собралось около 10 тыс. горцев», которые намеревались выступить «для разгрома царских укреплений»(Citation: 94).
    В ответ оккупационный аппарат применил военную силу: первый автор указывает, что «4 июля 1732 г. царские власти снарядили в Чечню военный отряд во главе с командовавшим войсками в крепости Святой Крест генералом Дугласом»(Citation: 66), который, согласно цитируемому рапорту, постановил повстанцев «недопущая к размножению посланною командою отвратить и разрушить»(Citation: 94).
    Карательная акция координировалась с лояльной местной элитой: Ш. Б. Ахмадов отмечает участие князя Казбулата, «который привел отряд царских войск во главе с Дугласом в селение Чечен-аул для подавления выступления горцев»(Citation: 66).
    Однако повстанцы избежали прямого столкновения с главными силами империи: Я. З. Ахмадов фиксирует, что «Генерал Дуглас, выступивший было в поход, получил известие, что горцы разошлись»(Citation: 94).
    После этого генерал направил для наказания жителей драгунскую команду полковника Коха, которая, как констатируется в источниках, «7 июля вступил в деревню Чечень, полностью сжег ее и стал спешно отходить назад»(Citation: 66).
    Исторический эпизод завершился в том же году полным физическим разгромом карателей: Я. З. Ахмадов резюмирует, что при отходе отряд Коха «был окружен в густых лесах, разбит и уничтожен», а также в ходе боя «погиб и старший чеченский князь Казбулат»(Citation: 94).
