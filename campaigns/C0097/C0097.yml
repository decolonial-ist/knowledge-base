name:
  ru: Газовые войны и энергетический шантаж (2006–2009)
  en: Gas Wars and Energy Blackmail (2006–2009)
  uk: Газові війни та енергетичний шантаж (2006–2009)
description:
  ru: |-
    Использование государственной монополии «Газпром» как политического оружия против независимого курса Киева.
    Отключение поставок газа в разгар зимы: «в 10:00 по московскому времени 1 января 2006 года „Газпром“ прекратил поставки газа в Украину»(Citation: 228), а три года спустя «российский экспорт в Украину был прекращён 1 января.
    Экспорт в 16 стран-членов ЕС и Молдову был резко сокращён 6 января и полностью прекращён с 7 января»(Citation: 229).
    Поставки шли через непрозрачных посредников (RosUkrEnergo), использование которых «давно критиковалось в европейских правительственных кругах и органами корпоративного управления»(Citation: 229), а совладелец RUE Дмитрий Фирташ в беседе с послом США признал, что «ему требовалось одобрение Могилевича, чтобы вообще войти в бизнес»(Citation: 215).
  en: |-
    The use of the state monopoly Gazprom as a political weapon against Kyiv's independent course.
    Gas supplies were cut off at the height of winter: "at 10.00am Moscow time on January 1, 2006, Gazprom cut off gas supplies to Ukraine"(Citation: 228), and three years later "Russian exports to Ukraine were cut off on 1 January.
    Exports to 16 EU member states and Moldova were drastically reduced on 6 January and cut completely from 7 January"(Citation: 229).
    Supplies ran through opaque intermediaries (RosUkrEnergo), whose use "was long criticized in European government circles and by corporate governance bodies"(Citation: 229), while RUE's co-owner Dmytro Firtash admitted to the US ambassador that "he needed Mogilevich's approval to get into business in the first place"(Citation: 215).
  uk: |-
    Використання державної монополії «Газпром» як політичної зброї проти незалежного курсу Києва.
    Відключення постачання газу в розпал зими: «о 10:00 за московським часом 1 січня 2006 року „Газпром“ припинив постачання газу в Україну»(Citation: 228), а через три роки «російський експорт в Україну було припинено 1 січня.
    Експорт до 16 країн-членів ЄС і Молдови було різко скорочено 6 січня та повністю припинено з 7 січня»(Citation: 229).
    Постачання йшло через непрозорих посередників (RosUkrEnergo), використання яких «давно критикувалося в європейських урядових колах та органами корпоративного управління»(Citation: 229), а співвласник RUE Дмитро Фірташ у розмові з послом США визнав, що «йому було потрібне схвалення Могилевича, щоб узагалі ввійти в бізнес»(Citation: 215).
