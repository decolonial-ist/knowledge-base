description:
  ru: |-
    Навязывание коррупционных схем поставок газа через компанию-посредника: Москва «использовала череду компаний-посредников (Itera с 1998 года, Eural Trans Gas с 2003-го, Rosukrenergo (RUE) с 2005-го) для транспортировки, а иногда и поставки газа в Украину», причем такая практика «давно критиковалась в европейских правительственных кругах и органами корпоративного управления (где вызывала озабоченность их непрозрачность)»(Citation: 229).
    Совладелец RUE Дмитрий Фирташ в декабре 2008 года, по записи посла США, «признал связи с деятелем российской оргпреступности Семёном Могилевичем, заявив, что ему требовалось одобрение Могилевича, чтобы вообще войти в бизнес»(Citation: 215).
  en: |-
    The imposition of corrupt gas-supply schemes through intermediary companies: Moscow "used a series of intermediary trading companies (Itera from 1998, Eural Trans Gas from 2003, Rosukrenergo (RUE) from 2005) to transport, and sometimes to supply, the gas to Ukraine," a practice that "was long criticized in European government circles and by corporate governance bodies (where there was concern about their opacity)"(Citation: 229).
    RUE's co-owner Dmytro Firtash told the US ambassador in December 2008 outright that "He acknowledged ties to Russian organized crime figure Seymon Mogilevich, stating he needed Mogilevich's approval to get into business in the first place"(Citation: 215).
  uk: |-
    Нав'язування корупційних схем постачання газу через компанію-посередника: Москва «використовувала низку компаній-посередників (Itera з 1998 року, Eural Trans Gas з 2003-го, Rosukrenergo (RUE) з 2005-го) для транспортування, а іноді й постачання газу в Україну», причому така практика «давно критикувалася в європейських урядових колах та органами корпоративного управління (де занепокоєння викликала їхня непрозорість)»(Citation: 229).
    Співвласник RUE Дмитро Фірташ у грудні 2008 року, за записом посла США, «визнав зв'язки з діячем російської оргзлочинності Семеном Могилевичем, заявивши, що йому було потрібне схвалення Могилевича, щоб узагалі ввійти в бізнес»(Citation: 215).
