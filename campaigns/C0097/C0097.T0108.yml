description:
  ru: 'Прямой энергетический шантаж и отключение поставок газа в разгар зимы: 1 января 2006 года - «в 10:00 по московскому времени 1 января 2006 года „Газпром“ прекратил поставки газа в Украину»(Citation: 228); 1 января 2009 года - «российский экспорт в Украину был прекращён 1 января», после чего экспорт в ЕС был «резко сокращён 6 января и полностью прекращён с 7 января», а в наиболее пострадавших балканских странах наступила гуманитарная чрезвычайная ситуация: «часть населения не могла отапливать свои дома»(Citation: 229).'
  en: 'Direct energy blackmail and the cut-off of gas supplies at the height of winter: on January 1, 2006 - "at 10.00am Moscow time on January 1, 2006, Gazprom cut off gas supplies to Ukraine"(Citation: 228); on January 1, 2009 - "Russian exports to Ukraine were cut off on 1 January," after which exports to the EU were "drastically reduced on 6 January and cut completely from 7 January," and in the worst-affected Balkan countries a humanitarian emergency ensued, with "parts of the populations unable to heat their homes"(Citation: 229).'
  uk: 'Прямий енергетичний шантаж і відключення постачання газу в розпал зими: 1 січня 2006 року - «о 10:00 за московським часом 1 січня 2006 року „Газпром“ припинив постачання газу в Україну»(Citation: 228); 1 січня 2009 року - «російський експорт в Україну було припинено 1 січня», після чого експорт до ЄС було «різко скорочено 6 січня та повністю припинено з 7 січня», а в найбільш постраждалих балканських країнах настала гуманітарна надзвичайна ситуація: «частина населення не могла опалювати свої домівки»(Citation: 229).'
