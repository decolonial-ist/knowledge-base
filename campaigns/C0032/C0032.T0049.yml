description:
  ru: |-
    Использование украинских казацких полков в имперской войне против Османской империи.
    Заслуги запорожцев и их кошевого Калнышевского в этой войне «были признаны царским правительством и императрицей, которая наградила его золотой медалью с бриллиантами»(Citation: 192) – что не спасло ни его, ни Сечь от расправы сразу после победы.
  en: |-
    The use of Ukrainian Cossack regiments in the imperial war against the Ottoman Empire.
    The merits of the Zaporozhians and their kish otaman Kalnyshevsky in this war "were recognized by the tsarist government and the empress, who awarded him a gold medal with diamonds"(Citation: 192) – which saved neither him nor the Sich from reprisal right after the victory.
  uk: |-
    Використання українських козацьких полків в імперській війні проти Османської імперії.
    Заслуги запорожців та їхнього кошового Калнишевського в цій війні «були визнані царським урядом й імператрицею, яка нагородила його золотою медаллю з діамантами»(Citation: 192) – що не врятувало ні його, ні Січ від розправи одразу після перемоги.
