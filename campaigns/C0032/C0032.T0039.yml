description:
  en: 'The signing of the Treaty of Küçük Kaynarca: the diplomatic severing of Crimea from the Ottoman Empire through fictitious "independence" – "neither the Russian court nor the Ottoman Porte shall interfere in the election and elevation of the said khan, nor in their domestic, political, civil, and internal affairs under any pretext"(Citation: 146) – in preparation for the subsequent annexation.'
  uk: 'Підписання Кючук-Кайнарджійського договору: дипломатичне відсічення Криму від Османської імперії через фіктивну «незалежність» – «ні російський двір, ні Оттоманська Порта не мають втручатися як в обрання і возведення пом''янутого хана, так і в домашні, політичні, цивільні та внутрішні їхні справи під жодним виглядом»(Citation: 146) – у підготовку подальшої анексії.'
  ru: 'Подписание Кючук-Кайнарджийского договора: дипломатическое отсечение Крыма от Османской империи через фиктивную «независимость» – «ни российский двор, ни Оттоманская Порта не имеют вступаться как в избрание и возведение помянутого хана, так и в домашние, политические, гражданские и внутренние их дела ни под каким видом»(Citation: 146) – в подготовку последующей аннексии.'
