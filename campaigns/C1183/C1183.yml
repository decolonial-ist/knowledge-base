name:
  en: 'Non-Recognition and the Attempted Military Invasion: Moscow''s Response to the Independence of the Chechen Republic (September-November 1991)'
  uk: 'Невизнання і спроба воєнного вторгнення: відповідь Москви на незалежність Чеченської Республіки (вересень-листопад 1991)'
  ru: 'Непризнание и попытка военного вторжения: ответ Москвы на независимость Чеченской Республики (сентябрь-ноябрь 1991)'
description:
  en: |-
    After their return from exile the Chechens were ruled for three decades by Russians sent from Moscow; only on 1 July 1989 did an assembly of the region's occupation administration for the first time reject Moscow's candidate and choose a Chechen, Zavgaev, as head of the region(Citation: 125).
    By the autumn of 1991 the USSR was falling apart: the union republics were declaring independence one after another.
    On 18 August the USSR vice-president Yanaev, together with the heads of the KGB (predecessor of today's FSB), the army and the police, tried to keep the union in Moscow's hands by force: they announced that the nominal head of the USSR, Gorbachev, could not govern "for reasons of health", declared a state of emergency and brought tanks into Moscow, but gave up after three days(Citation: 176).
    Zavgaev, the head of Chechnya installed under the USSR, backed those who wanted to preserve the USSR, and lost: the Chechens came out to non-stop rallies and on 6 September forced his Supreme Soviet to dissolve itself(Citation: 707).
    That same autumn the Chechens elected their own president, Dzhokhar Dudaev, and declared independence from Russia, while the coloniser in the person of the RSFSR went in two months from sending a delegation "to explain the policy" to an attempt to impose a state of emergency on the whole territory of Chechen-Ingushetia with internal troops, but was forced to retreat.
    On 10 September 1991 the RSFSR president Yeltsin sent to Grozny a delegation headed by state secretary Burbulis and instructed it "to explain the policy of the Russian Federation and of the President of the RSFSR"(Citation: 704).
    On 14 September Khasbulatov, a Chechen from the Moscow leadership, then acting head of parliament, flew to Grozny; on 15 September he personally chaired the last session of the Supreme Soviet of Chechen-Ingushetia, and under pressure from Khasbulatov and from Dzhokhar Dudaev's supporters the deputies dismissed Zavgaev, dissolved themselves and chose from their own ranks a Provisional Supreme Council of 32 members headed by Khusein Akhmadov to hold new elections(Citation: 710).
    Moscow tried to take this council for itself: on 25 September five of its members headed by the council's deputy chairman Chernyi, Khasbulatov's man, came out against Dzhokhar Dudaev's congress; on 26 September Khasbulatov himself threatened by telegram not to recognise the elections, and on 5 October thirteen of the council's thirty-two members, backed by the local KGB, tried to remove Khusein Akhmadov.
    In response Dzhokhar Dudaev's supporters blocked the central square of Grozny, arrested the republic's procurator and occupied the buildings of the KGB and of the government; Moscow's people in the council, as general Sokolov reported to his command, had no "practical power" left(Citation: 710)(Citation: 707).
    On 6 October the RSFSR vice-president Rutskoi flew to Grozny with the minister of internal affairs and the chairman of the KGB of the RSFSR, but achieved nothing(Citation: 710), and on 8 October the Moscow leadership, over Khasbulatov's signature, recognised as lawful in Chechnya only the group of procurator Bakhmadov - the man who, according to Sokolov's report, had been "appointed by the Chairman of the Supreme Soviet of the RSFSR Khasbulatov"(Citation: 707) - and demanded that "the illegal armed formations [this is what the coloniser called the fighters for independence from Russia] surrender their weapons by 24:00 on 10 October 1991"(Citation: 624).
    On 24 October Moscow announced, before any vote had taken place, that the elections set for 27 October "have no legal basis and their results cannot be recognised as lawful"(Citation: 625).
    On 27 October the Chechens elected Dzhokhar Dudaev president, and on 1 November he signed a decree: "to proclaim the state sovereignty of the Chechen Republic from 1 November 1991"(Citation: 630).
    On 2 November Moscow declared the elections "unlawful, and the acts adopted by them not subject to execution"(Citation: 622).
    On 7 November Yeltsin, by decree No. 178, imposed a state of emergency on the whole territory of Chechen-Ingushetia: a curfew, a ban on rallies and strikes, the seizure of weapons, the cancellation of the elections, a Provisional Administration appointed from Moscow, and "the expulsion of violators of public order who are not residents of the given locality... beyond the territory of the Chechen-Ingush Republic at their own expense"(Citation: 274).
    On 8 November the parliament of the Chechen Republic declared the decree unlawful and demanded the withdrawal of the troops within 24 hours(Citation: 627).
    The National Guard of Chechnya and unarmed townspeople blockaded the airlifted internal troops (predecessors of today's Rosgvardiya) at the Khankala airfield near Grozny and in the building of the ministry of internal affairs.
    The nominal head of the USSR, Gorbachev, refused the RSFSR the use of union troops; on the morning of 10 November the internal troops left Grozny(Citation: 276), and on 11 November the deputies in Moscow refused to approve Yeltsin's decree, finding it necessary to act "not by applying emergency measures but by political means"(Citation: 275).
  uk: |-
    Після повернення із заслання чеченцями три десятиліття правили надіслані з Москви росіяни; лише 1 липня 1989 року збори окупаційної адміністрації регіону вперше відкинули кандидата Москви і обрали головою регіону чеченця Завгаєва(Citation: 125).
    До осені 1991 року СРСР розвалювався: союзні республіки одна за одною оголошували незалежність. 18 серпня віцепрезидент СРСР Янаєв з головами КДБ (попередника сучасної ФСБ), армії та поліції спробували силою втримати союз у руках Москви: оголосили, що формальний глава СРСР Горбачов не може правити «за станом здоров'я», запровадили надзвичайний стан і ввели танки в Москву, але через три дні здалися(Citation: 176).
    Поставлений за СРСР глава Чечні Завгаєв підтримав тих, хто хотів зберегти СРСР, і програв: чеченці вийшли на безперервні мітинги і 6 вересня змусили його Верховну Раду розпустити себе(Citation: 707).
    Тієї ж осені чеченці обрали свого президента, Джохара Дудаєва, і оголосили незалежність від Росії, а колонізатор в особі РРФСР за два місяці пройшов шлях від відправлення делегації «роз'яснити політику» до спроби запровадити надзвичайний стан на всій території Чечено-Інгушетії силами внутрішніх військ, але був змушений відступити. 10 вересня 1991 року президент РРФСР Єльцин направив до Грозного делегацію на чолі з державним секретарем Бурбулісом і доручив їй «роз'яснити політику Російської Федерації і Президента РРФСР»(Citation: 704). 14 вересня до Грозного прилетів Хасбулатов, чеченець з московського керівництва, який тоді виконував обов'язки глави парламенту; 15 вересня він особисто вів останню сесію Верховної Ради Чечено-Інгушетії, і депутати під тиском Хасбулатова та прихильників Джохара Дудаєва відправили Завгаєва у відставку, розпустили себе і обрали зі свого складу Тимчасову Вищу Раду з 32 осіб на чолі з Хусейном Ахмадовим, щоб та провела нові вибори(Citation: 710).
    Москва спробувала забрати цю раду собі: 25 вересня п'ятеро її членів на чолі із заступником голови ради Чорним, людиною Хасбулатова, виступили проти конгресу Джохара Дудаєва; 26 вересня сам Хасбулатов телеграмою пригрозив не визнати вибори, а 5 жовтня тринадцять із тридцяти двох членів ради за підтримки місцевого КДБ спробували усунути Хусейна Ахмадова.
    Прихильники Джохара Дудаєва у відповідь перекрили центральну площу Грозного, заарештували прокурора республіки і зайняли будівлі КДБ та уряду; у людей Москви в раді, як доповідав командуванню генерал Соколов, «практичної влади» не лишилося(Citation: 710)(Citation: 707). 6 жовтня до Грозного прилетів віцепрезидент РРФСР Руцькой з міністром внутрішніх справ і головою КДБ РРФСР, але нічого не домігся(Citation: 710), і 8 жовтня московське керівництво за підписом Хасбулатова визнало законною в Чечні лише групу прокурора Бахмадова - того, хто, за доповіддю Соколова, «призначений Головою Верховної Ради РРФСР Хасбулатовим»(Citation: 707), - і зажадало: «незаконним збройним формуванням [так колонізатор назвав борців за незалежність від Росії] до 24 години 10 жовтня 1991 року здати зброю»(Citation: 624). 24 жовтня Москва оголосила ще до голосування, що призначені на 27 жовтня вибори «не мають правової основи і їхні результати не можуть бути визнані законними»(Citation: 625). 27 жовтня чеченці обрали президентом Джохара Дудаєва, і 1 листопада він підписав указ: «оголосити про державний суверенітет Чеченської Республіки з 1 листопада 1991 року»(Citation: 630). 2 листопада Москва визнала вибори «незаконними, а ухвалені ними акти такими, що не підлягають виконанню»(Citation: 622). 7 листопада Єльцин указом № 178 запровадив на всій території Чечено-Інгушетії надзвичайний стан: комендантську годину, заборону мітингів і страйків, вилучення зброї, скасування виборів, призначену з Москви Тимчасову адміністрацію і «видворення порушників громадського порядку, які не є жителями даної місцевості... за межі території Чечено-Інгушської Республіки за їхній рахунок»(Citation: 274). 8 листопада парламент Чеченської Республіки оголосив указ незаконним і зажадав вивести війська за 24 години(Citation: 627).
    Національна гвардія Чечні та беззбройні городяни заблокували перекинуті внутрішні війська (попередники сучасної Росгвардії) на аеродромі Ханкала під Грозним і в будівлі міністерства внутрішніх справ.
    Формальний глава СРСР Горбачов відмовив РРФСР у союзних військах, 10 листопада вранці внутрішні війська пішли з Грозного(Citation: 276), і 11 листопада депутати в Москві відмовилися затвердити указ Єльцина, визнавши за потрібне діяти «не шляхом застосування надзвичайних заходів, а політичними засобами»(Citation: 275).
  ru: |-
    После возвращения из ссылки чеченцами три десятилетия правили присланные из Москвы русские; только 1 июля 1989 года собрание оккупационной администрации региона впервые отвергло кандидата Москвы и выбрало главой региона чеченца Завгаева(Citation: 125).
    К осени 1991 года СССР разваливался: союзные республики одна за другой объявляли независимость. 18 августа вице-президент СССР Янаев с главами КГБ (предшественника современной ФСБ), армии и полиции попытались силой удержать союз в руках Москвы: объявили, что формальный глава СССР Горбачёв не может править «по состоянию здоровья», ввели чрезвычайное положение и танки в Москву, но через три дня сдались(Citation: 176).
    Поставленный при СССР глава Чечни Завгаев поддержал тех, кто хотел сохранить СССР, и проиграл: чеченцы вышли на непрерывные митинги и 6 сентября заставили его Верховный Совет распустить себя(Citation: 707).
    Той же осенью чеченцы избрали своего президента, Джохара Дудаева, и объявили независимость от России, а колонизатор в лице РСФСР за два месяца прошёл путь от посылки делегации «разъяснить политику» до попытки ввести чрезвычайное положение на всей территории Чечено-Ингушетии силами внутренних войск, но был вынужден отступить. 10 сентября 1991 года президент РСФСР Ельцин направил в Грозный делегацию во главе с государственным секретарём Бурбулисом и поручил ей «разъяснить политику Российской Федерации и Президента РСФСР»(Citation: 704). 14 сентября в Грозный прилетел Хасбулатов, чеченец из московского руководства, тогда исполнявший обязанности главы парламента; 15 сентября он лично вёл последнюю сессию Верховного Совета Чечено-Ингушетии, и депутаты под давлением Хасбулатова и сторонников Джохара Дудаева отправили Завгаева в отставку, распустили себя и выбрали из своего состава Временный Высший Совет из 32 человек во главе с Хусейном Ахмадовым, чтобы тот провёл новые выборы(Citation: 710).
    Москва попыталась забрать этот совет себе: 25 сентября пять его членов во главе с заместителем председателя совета Чёрным, человеком Хасбулатова, выступили против конгресса Джохара Дудаева; 26 сентября сам Хасбулатов телеграммой пригрозил не признать выборы, а 5 октября тринадцать из тридцати двух членов совета при поддержке местного КГБ попытались сместить Хусейна Ахмадова.
    Сторонники Джохара Дудаева в ответ перекрыли центральную площадь Грозного, арестовали прокурора республики и заняли здания КГБ и правительства; у людей Москвы в совете, как докладывал командованию генерал Соколов, «практической власти» не осталось(Citation: 710)(Citation: 707). 6 октября в Грозный прилетел вице-президент РСФСР Руцкой с министром внутренних дел и председателем КГБ РСФСР, но ничего не добился(Citation: 710), и 8 октября московское руководство за подписью Хасбулатова признало законной в Чечне только группу прокурора Бахмадова - того, кто, по докладу Соколова, «назначен Председателем Верховного Совета РСФСР Хасбулатовым»(Citation: 707), - и потребовало: «незаконным вооруженным формированиям [так колонизатор назвал борцов за независимость от России] до 24 часов 10 октября 1991 года сдать оружие»(Citation: 624). 24 октября Москва объявила ещё до голосования, что назначенные на 27 октября выборы «не имеют правовой основы и их результаты не могут быть признаны законными»(Citation: 625). 27 октября чеченцы избрали президентом Джохара Дудаева, и 1 ноября он подписал указ: «объявить о государственном суверенитете Чеченской Республики с 1 ноября 1991 года»(Citation: 630). 2 ноября Москва признала выборы «незаконными, а принятые ими акты не подлежащими исполнению»(Citation: 622). 7 ноября Ельцин указом № 178 ввёл на всей территории Чечено-Ингушетии чрезвычайное положение: комендантский час, запрет митингов и забастовок, изъятие оружия, отмену выборов, назначенную из Москвы Временную администрацию и «выдворение нарушителей общественного порядка, не являющихся жителями данной местности... за пределы территории Чечено-Ингушской Республики за их счет»(Citation: 274). 8 ноября парламент Чеченской Республики объявил указ незаконным и потребовал вывести войска за 24 часа(Citation: 627).
    Национальная гвардия Чечни и горожане без оружия заблокировали переброшенные внутренние войска (предшественники современной Росгвардии) на аэродроме Ханкала под Грозным и в здании министерства внутренних дел.
    Формальный глава СССР Горбачёв отказал РСФСР в союзных войсках, 10 ноября утром внутренние войска ушли из Грозного(Citation: 276), и 11 ноября депутаты в Москве отказались утвердить указ Ельцина, признав нужным действовать «не путем применения чрезвычайных мер, а политическими средствами»(Citation: 275).
