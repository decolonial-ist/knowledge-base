description:
  ru: |-
    7 ноября 1991 года президент РСФСР Ельцин подписал указ № 178, пункт 1: «Ввести с 5 часов 00 минут 9 ноября 1991 г. до 5 часов 00 минут 9 декабря 1991 г. чрезвычайное положение на всей территории Чечено-Ингушской Республики».
    Тем же указом он ввёл комендантский час, запретил митинги и забастовки, приказал «временное изъятие у граждан, предприятий и организаций огнестрельного и холодного оружия», досмотр транспорта и жилищ и «выдворение нарушителей общественного порядка, не являющихся жителями данной местности, к месту их постоянного проживания или за пределы территории Чечено-Ингушской Республики за их счет», а министру внутренних дел и председателю КГБ (предшественника современной ФСБ) РСФСР поручил представить «предложения о привлечении дополнительных сил»(Citation: 274). 8 ноября парламент Чеченской Республики под председательством Хусейна Ахмадова потребовал от Ельцина «в течение 24 часов вывести все вооруженные формирования с территории суверенной Чеченской Республики» и решил «довести до сведения парламентов и народов мира о вооруженном вмешательстве руководства России во внутренние дела суверенной Чеченской Республики»(Citation: 627).
    Журналист Цыганок в статье «Десять дней, которые отменили мир» приводит сводку министерства внутренних дел РСФСР на утро 10 ноября: «Для обеспечения режима чрезвычайного положения в регион Северного Кавказа направлены подразделения МВД РСФСР общей численностью около 1,2 тыс. чел.»(Citation: 276).
    По хронике событий, 8-9 ноября «на военном аэродроме Ханкала близ Грозного приземлились два военно-транспортных самолета с отрядами спецназа на борту, но без оружия… аэродром блокируется гвардейцами Дж.Дудаева, выход из самолетов невозможен, поэтому утром 9 ноября самолеты улетают»(Citation: 707).
    Национальная гвардия Чечни и горожане без оружия окружили здание министерства внутренних дел в Грозном; 9 ноября первый заместитель министра внутренних дел РСФСР Комиссаров докладывал в Москву: «Мы блокированы в здании МВД ЧИР [Чечено-Ингушской Республики].
    Окружены толпой примерно 4000 человек, напротив стоят бензовозы»(Citation: 276). 9 ноября московское руководство записало, что «руководители исполнительных органов (Баранников [министр внутренних дел СССР], Бакатин [председатель КГБ СССР], Комиссаров [первый заместитель министра внутренних дел РСФСР]) в сложной критической ситуации не сумели осуществить свои прямые должностные обязанности»(Citation: 623).
    Формальный глава СССР Горбачёв отказал РСФСР в союзных войсках, и 10 ноября в 10:45 внутренние войска (предшественники современной Росгвардии) начали отход из Грозного(Citation: 276). 11 ноября депутаты в Москве постановили «признать невозможным утверждение Указа», установили «особый режим въезда в Чечено-Ингушскую Республику и выезда из нее, исключающий ввоз и вывоз оружия» и назначили «парламентское и служебное (по линии МВД РСФСР и КГБ РСФСР) расследование для установления лиц, ответственных за принятие недостаточно подготовленных политических и военно-технических решений по введению чрезвычайного положения»(Citation: 275).
  en: |-
    On 7 November 1991 the RSFSR president Yeltsin signed decree No. 178, point 1: "To introduce, from 05:00 on 9 November 1991 until 05:00 on 9 December 1991, a state of emergency on the whole territory of the Chechen-Ingush Republic".
    By the same decree he imposed a curfew, banned rallies and strikes, ordered "the temporary seizure of firearms and cold weapons from citizens, enterprises and organisations", searches of vehicles and dwellings, and "the expulsion of violators of public order who are not residents of the given locality to their place of permanent residence or beyond the territory of the Chechen-Ingush Republic at their own expense", and instructed the minister of internal affairs and the chairman of the KGB (predecessor of today's FSB) of the RSFSR to submit "proposals on bringing in additional forces"(Citation: 274).
    On 8 November the parliament of the Chechen Republic, chaired by Khusein Akhmadov, demanded that Yeltsin "within 24 hours withdraw all armed formations from the territory of the sovereign Chechen Republic" and resolved "to inform the parliaments and peoples of the world of the armed interference of the leadership of Russia in the internal affairs of the sovereign Chechen Republic"(Citation: 627).
    The journalist Tsyganok, in the article "Ten Days That Cancelled the Peace", quotes the summary of the RSFSR ministry of internal affairs for the morning of 10 November: "To ensure the regime of the state of emergency, units of the MVD [ministry of internal affairs] of the RSFSR with a total strength of about 1.2 thousand men have been sent to the North Caucasus region"(Citation: 276).
    According to the chronicle of events, on 8-9 November "two military transport aircraft with special-forces detachments on board, but without weapons, landed at the Khankala military airfield near Grozny… the airfield is blockaded by Dzh.
    Dudaev's guardsmen, leaving the aircraft is impossible, so on the morning of 9 November the aircraft fly away"(Citation: 707).
    The National Guard of Chechnya and unarmed townspeople surrounded the building of the ministry of internal affairs in Grozny; on 9 November the first deputy minister of internal affairs of the RSFSR Komissarov reported to Moscow: "We are blockaded in the building of the MVD [ministry of internal affairs] of the ChIR [Chechen-Ingush Republic].
    We are surrounded by a crowd of about 4,000 people, fuel tankers are standing opposite"(Citation: 276).
    On 9 November the Moscow leadership recorded that "the heads of the executive bodies (Barannikov [minister of internal affairs of the USSR], Bakatin [chairman of the KGB of the USSR], Komissarov [first deputy minister of internal affairs of the RSFSR]) in a difficult critical situation failed to carry out their direct official duties"(Citation: 623).
    The nominal head of the USSR, Gorbachev, refused the RSFSR the use of union troops, and on 10 November at 10:45 the internal troops (predecessors of today's Rosgvardiya) began their withdrawal from Grozny(Citation: 276).
    On 11 November the deputies in Moscow resolved "to recognise the approval of the Decree as impossible", established "a special regime of entry into and exit from the Chechen-Ingush Republic, excluding the import and export of weapons" and ordered "a parliamentary and an internal (through the MVD of the RSFSR and the KGB of the RSFSR) investigation to establish the persons responsible for taking insufficiently prepared political and military-technical decisions on the introduction of the state of emergency"(Citation: 275).
  uk: |-
    7 листопада 1991 року президент РРФСР Єльцин підписав указ № 178, пункт 1: «Запровадити з 5 години 00 хвилин 9 листопада 1991 р. до 5 години 00 хвилин 9 грудня 1991 р. надзвичайний стан на всій території Чечено-Інгушської Республіки».
    Тим самим указом він запровадив комендантську годину, заборонив мітинги і страйки, наказав «тимчасове вилучення у громадян, підприємств та організацій вогнепальної і холодної зброї», огляд транспорту і житла та «видворення порушників громадського порядку, які не є жителями даної місцевості, до місця їхнього постійного проживання або за межі території Чечено-Інгушської Республіки за їхній рахунок», а міністрові внутрішніх справ і голові КДБ (попередника сучасної ФСБ) РРФСР доручив подати «пропозиції щодо залучення додаткових сил»(Citation: 274). 8 листопада парламент Чеченської Республіки під головуванням Хусейна Ахмадова зажадав від Єльцина «протягом 24 годин вивести всі збройні формування з території суверенної Чеченської Республіки» і вирішив «довести до відома парламентів і народів світу про збройне втручання керівництва Росії у внутрішні справи суверенної Чеченської Республіки»(Citation: 627).
    Журналіст Циганок у статті «Десять днів, які скасували мир» наводить зведення міністерства внутрішніх справ РРФСР на ранок 10 листопада: «Для забезпечення режиму надзвичайного стану в регіон Північного Кавказу направлено підрозділи МВС [міністерства внутрішніх справ] РРФСР загальною чисельністю близько 1,2 тис. осіб»(Citation: 276).
    За хронікою подій, 8-9 листопада «на військовому аеродромі Ханкала поблизу Грозного приземлилися два військово-транспортні літаки із загонами спецназу на борту, але без зброї… аеродром блокують гвардійці Дж.Дудаєва, вихід із літаків неможливий, тому вранці 9 листопада літаки відлітають»(Citation: 707).
    Національна гвардія Чечні та беззбройні городяни оточили будівлю міністерства внутрішніх справ у Грозному; 9 листопада перший заступник міністра внутрішніх справ РРФСР Комісаров доповідав до Москви: «Ми заблоковані в будівлі МВС [міністерства внутрішніх справ] ЧІР [Чечено-Інгушської Республіки].
    Оточені натовпом приблизно 4000 осіб, навпроти стоять бензовози»(Citation: 276). 9 листопада московське керівництво записало, що «керівники виконавчих органів (Баранников [міністр внутрішніх справ СРСР], Бакатін [голова КДБ СРСР], Комісаров [перший заступник міністра внутрішніх справ РРФСР]) у складній критичній ситуації не зуміли виконати свої прямі посадові обов'язки»(Citation: 623).
    Формальний глава СРСР Горбачов відмовив РРФСР у союзних військах, і 10 листопада о 10:45 внутрішні війська (попередники сучасної Росгвардії) почали відхід із Грозного(Citation: 276). 11 листопада депутати в Москві постановили «визнати неможливим затвердження Указу», встановили «особливий режим в'їзду до Чечено-Інгушської Республіки і виїзду з неї, що виключає ввезення і вивезення зброї» та призначили «парламентське і службове (по лінії МВС РРФСР і КДБ РРФСР) розслідування для встановлення осіб, відповідальних за ухвалення недостатньо підготовлених політичних і військово-технічних рішень щодо запровадження надзвичайного стану»(Citation: 275).
