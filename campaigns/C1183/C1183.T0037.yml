description:
  en: |-
    On 15 September 1991 the deputies of the Supreme Soviet of Chechen-Ingushetia, at their last session, chaired in person by Khasbulatov, a Chechen from the Moscow leadership, then acting head of parliament, dissolved themselves and chose from their own ranks a Provisional Supreme Council of 32 members headed by Khusein Akhmadov to hold new elections(Citation: 710).
    Filatov, in 1991 secretary of the parliament's leadership in Moscow, recalled: "with the energetic participation of Khasbulatov the Supreme Soviet of the republic was dispersed — what remained was the so-called Small Council, some artificial formation that was to work until new elections were held"(Citation: 709).
    Khusein Akhmadov took the side of Dzhokhar Dudaev's congress and on 4 October signed a resolution on the KGB (predecessor of today's FSB): "to terminate the activity of the KGB of the ChIR [Chechen-Ingush Republic] and of all its structures on the territory of the Chechen Republic"(Citation: 708).
    Then Moscow began to build its own power out of this council.
    On 25 September five of its members headed by the council's deputy chairman Chernyi, Khasbulatov's man, came out against Dzhokhar Dudaev's congress; on 26 September Khasbulatov himself threatened by telegram not to recognise the elections; on 5 October thirteen of the council's thirty-two members, backed by the local KGB, tried to remove Khusein Akhmadov(Citation: 710).
    On 8 October the Moscow leadership, over Khasbulatov's signature, having heard vice-president Rutskoi back from Grozny, declared lawful in the republic only the council "under the chairmanship of comrade B. D. Bakhmadov" - a procurator whom they themselves had installed - and instructed it "to take all necessary measures to stabilise the situation"(Citation: 624).
    General Sokolov, head of the occupation army's training centre in Grozny, reported to his command: "the chairman V. D. Bakhmadov was appointed by the Chairman of the Supreme Soviet of the RSFSR R. I. Khasbulatov", and the council itself "has no practical power"(Citation: 707).
    On 9 October the leadership of the National Congress of the Chechen People, Dzhokhar Dudaev's congress, called Bakhmadov's council "unlawful, puppet" and demanded that it "dissociate itself from the attempt to resurrect" the Supreme Soviet "dissolved by the people"(Citation: 706).
    After the elections of 27 October Bakhmadov's council addressed the residents of the republic: the elections "are unconstitutional and have no lawful force, not a single decree of the so-called president D. Dudaev, not a single resolution of the parliament of the so-called Chechen Republic has legal force or is subject to execution"(Citation: 629).
    On 7 November the RSFSR president Yeltsin, by decree No. 178, resolved: "To introduce... on the territory of the Chechen-Ingush Republic, as a special form of administration, a Provisional Administration of the Chechen-Ingush Republic"; as its head he appointed his own representative in the republic, Arsanov, as deputy the republic's minister of internal affairs Ibragimov, and instructed them "to form the Provisional Administration of the Chechen-Ingush Republic within 3 days"(Citation: 274).
    On 8 November the parliament of the Chechen Republic, chaired by Khusein Akhmadov, replied: "The leadership of Russia, following the lead of the overthrown totalitarian forces and proceeding from imperial interests, has introduced it [the state of emergency] on the territory of a republic whose sovereignty was proclaimed as far back as November 1990" - and declared the decree "unlawful and having no legal force"(Citation: 627).
    Neither Bakhmadov's council nor Arsanov's Provisional Administration ever got to work in Chechnya: on 11 November the deputies in Moscow refused to approve Yeltsin's decree(Citation: 275).
  uk: |-
    15 вересня 1991 року депутати Верховної Ради Чечено-Інгушетії на останній сесії, яку особисто вів Хасбулатов, чеченець з московського керівництва, який тоді виконував обов'язки глави парламенту, розпустили себе і обрали зі свого складу Тимчасову Вищу Раду з 32 осіб на чолі з Хусейном Ахмадовим, щоб та провела нові вибори(Citation: 710).
    Філатов, у 1991 році секретар керівництва парламенту в Москві, згадував: «за енергійної участі Хасбулатова розігнано Верховну Раду республіки — лишилася так звана Мала Рада, якесь штучне утворення, яке мало працювати до проведення нових виборів»(Citation: 709).
    Хусейн Ахмадов став на бік конгресу Джохара Дудаєва і 4 жовтня підписав постанову про КДБ (попередника сучасної ФСБ): «припинити діяльність КДБ ЧІР [Чечено-Інгушської Республіки] і всіх його структур на території Чеченської Республіки»(Citation: 708).
    Тоді Москва почала будувати з цієї ради свою владу. 25 вересня п'ятеро її членів на чолі із заступником голови ради Чорним, людиною Хасбулатова, виступили проти конгресу Джохара Дудаєва; 26 вересня сам Хасбулатов телеграмою пригрозив не визнати вибори; 5 жовтня тринадцять із тридцяти двох членів ради за підтримки місцевого КДБ спробували усунути Хусейна Ахмадова(Citation: 710). 8 жовтня московське керівництво за підписом Хасбулатова, заслухавши віцепрезидента Руцького, що повернувся з Грозного, оголосило законною в республіці лише раду «під головуванням т. Бахмадова Б.Д.» - прокурора, якого самі й поставили, - і доручило їй «вжити всіх необхідних заходів для стабілізації обстановки»(Citation: 624).
    Генерал Соколов, начальник окупаційного військового навчального центру в Грозному, доповідав командуванню: «голова Бахмадов В.Д. призначений Головою Верховної Ради РРФСР Хасбулатовим Р.І.», а сама рада «практичної влади не має»(Citation: 707). 9 жовтня керівництво Загальнонаціонального конгресу чеченського народу, конгресу Джохара Дудаєва, назвало раду Бахмадова «незаконною, маріонетковою» і зажадало від неї «відмежуватися від спроби реанімувати розпущену народом» Верховну Раду(Citation: 706).
    Після виборів 27 жовтня рада Бахмадова звернулася до жителів республіки: вибори «є антиконституційними і не мають законної сили, жоден указ т.зв. президента Д.Дудаєва, жодна постанова парламенту т.зв.
    Чеченської Республіки не мають юридичної сили і не підлягають виконанню»(Citation: 629). 7 листопада президент РРФСР Єльцин указом № 178 постановив: «Запровадити... на території Чечено-Інгушської Республіки як особливу форму управління Тимчасову адміністрацію Чечено-Інгушської Республіки»; главою він призначив свого представника в республіці Арсанова, заступником - міністра внутрішніх справ республіки Ібрагімова і доручив їм «сформувати у 3-денний строк Тимчасову адміністрацію Чечено-Інгушської Республіки»(Citation: 274). 8 листопада парламент Чеченської Республіки під головуванням Хусейна Ахмадова відповів: «Керівництво Росії, йдучи на поводі у повалених тоталітарних сил, виходячи з імперських інтересів, запровадило його [надзвичайний стан] на території республіки, суверенітет якої було оголошено ще в листопаді 1990 р.» - і визнало указ «незаконним і таким, що не має юридичної сили»(Citation: 627).
    Ні рада Бахмадова, ні Тимчасова адміністрація Арсанова в Чечні так і не запрацювали: 11 листопада депутати в Москві відмовилися затвердити указ Єльцина(Citation: 275).
  ru: |-
    15 сентября 1991 года депутаты Верховного Совета Чечено-Ингушетии на последней сессии, которую лично вёл Хасбулатов, чеченец из московского руководства, тогда исполнявший обязанности главы парламента, распустили себя и выбрали из своего состава Временный Высший Совет из 32 человек во главе с Хусейном Ахмадовым, чтобы тот провёл новые выборы(Citation: 710).
    Филатов, в 1991 году секретарь руководства парламента в Москве, вспоминал: «при энергичном участии Хасбулатова разогнан Верховный Совет республики — остался так называемый Малый Совет, какое-то искусственное образование, которое должно работать до проведения новых выборов»(Citation: 709).
    Хусейн Ахмадов встал на сторону конгресса Джохара Дудаева и 4 октября подписал постановление о КГБ (предшественнике современной ФСБ): «прекратить деятельность КГБ ЧИР [Чечено-Ингушской Республики] и всех его структур на территории Чеченской Республики»(Citation: 708).
    Тогда Москва стала строить из этого совета свою власть. 25 сентября пять его членов во главе с заместителем председателя совета Чёрным, человеком Хасбулатова, выступили против конгресса Джохара Дудаева; 26 сентября сам Хасбулатов телеграммой пригрозил не признать выборы; 5 октября тринадцать из тридцати двух членов совета при поддержке местного КГБ попытались сместить Хусейна Ахмадова(Citation: 710). 8 октября московское руководство за подписью Хасбулатова, заслушав вернувшегося из Грозного вице-президента Руцкого, объявило законным в республике только совет «под председательством т. Бахмадова Б.Д.» - прокурора, которого сами и поставили, - и поручило ему «принять все необходимые меры по стабилизации обстановки»(Citation: 624).
    Генерал Соколов, начальник оккупационного военного учебного центра в Грозном, докладывал командованию: «председатель Бахмадов В.Д. назначен Председателем Верховного Совета РСФСР Хасбулатовым Р.И.», а сам совет «практической власти не имеет»(Citation: 707). 9 октября руководство Общенационального конгресса чеченского народа, конгресса Джохара Дудаева, назвало совет Бахмадова «незаконным, марионеточным» и потребовало от него «отмежеваться от попытки реанимировать распущенный народом» Верховный Совет(Citation: 706).
    После выборов 27 октября совет Бахмадова обратился к жителям республики: выборы «являются антиконституционными и не имеют законной силы, ни один указ т.н. президента Д.Дудаева, ни одно постановление парламента т.н.
    Чеченской Республики не имеют юридической силы и не подлежат исполнению»(Citation: 629). 7 ноября президент РСФСР Ельцин указом № 178 постановил: «Ввести... на территории Чечено-Ингушской Республики в качестве особой формы управления Временную администрацию Чечено-Ингушской Республики»; главой он назначил своего представителя в республике Арсанова, заместителем - министра внутренних дел республики Ибрагимова и поручил им «сформировать в 3-дневный срок Временную администрацию Чечено-Ингушской Республики»(Citation: 274). 8 ноября парламент Чеченской Республики под председательством Хусейна Ахмадова ответил: «Руководство России, идя на поводу у свергнутых тоталитарных сил, исходя из имперских интересов, ввело таковое [чрезвычайное положение] на территории республики, суверенитет которой был объявлен еще в ноябре 1990 г.» - и признал указ «незаконным и не имеющим юридической силы»(Citation: 627).
    Ни совет Бахмадова, ни Временная администрация Арсанова в Чечне так и не заработали: 11 ноября депутаты в Москве отказались утвердить указ Ельцина(Citation: 275).
