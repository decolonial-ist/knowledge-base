description:
  en: |-
    On 10 September 1991 the RSFSR president Yeltsin sent to Chechen-Ingushetia a delegation headed by state secretary Burbulis and instructed it "to explain the policy of the Russian Federation and of the President of the RSFSR at the present stage"(Citation: 704); the delegation came back with nothing(Citation: 707).
    On 8 October the Moscow leadership, over Khasbulatov's signature, resolved "until the election of a new composition of the Supreme Soviet of the Chechen-Ingush Republic, to regard the Provisional Supreme Council of the Republic as the only lawful body of state power on the territory of the Chechen-Ingush Republic" and ordered "the illegal armed formations [this is what the coloniser called the fighters for independence from Russia] to surrender their weapons to the bodies of internal affairs by 24:00 on 10 October 1991"(Citation: 624).
    The Chechens did not surrender their weapons: on 9 October the leadership of the National Congress of the Chechen People replied that the resolution had been adopted "with the sole aim of preserving colonial domination over the Chechen people, over the peoples of the Caucasus and their natural riches", announced the mobilisation of men from 15 to 55 and put the National Guard on combat alert(Citation: 706).
    On 10 October Moscow instructed vice-president Rutskoi and the RSFSR government "to ensure the necessary conditions for the restoration of legality and law and order in the Chechen-Ingush Republic"(Citation: 705).
    On 15 October the chairman of the KGB of the RSFSR (predecessor of today's FSB) Ivanenko suspended the work of the KGB of Chechen-Ingushetia "until 27 October 1991" and by his own order appointed an acting chairman for it(Citation: 707).
    On 19 October Yeltsin addressed the leadership of the congress with an ultimatum: "I demand from the leaders of the Executive Committee of the National Congress of the Chechen People and the groupings supporting them the cessation of unlawful actions and unconditional submission to the law… all measures provided for by the laws of the RSFSR will be taken"(Citation: 626).
    On 24 October Moscow resolved that the elections set for 27 October "have no legal basis and their results cannot be recognised as lawful", and entrusted the preparation of different elections to the Provisional Supreme Council and to the RSFSR deputies from the republic(Citation: 625).
    The Chechens voted anyway: on 27 October, according to the electoral commission of the Chechen Republic, 72 % of voters turned out, and 90.1 % voted for Dzhokhar Dudaev(Citation: 707).
    On 1 November Dzhokhar Dudaev signed a decree: "Guided by the Declaration on the state sovereignty of the republic and by the will of the citizens of the Chechen Republic expressed in direct and universal elections, to proclaim the state sovereignty of the Chechen Republic from 1 November 1991"(Citation: 630).
    On 2 November Moscow answered with a resolution: "To recognise the elections to the supreme body of state power (the Supreme Soviet) and of the President of the republic held in the Chechen-Ingush Republic on 27 October 1991 as unlawful, and the acts adopted by them as not subject to execution"(Citation: 622).
    On 7 November Yeltsin, in decree No. 178, named as the reason for the state of emergency an aggravation "caused by the unlawful actions of the executive committee of the National Congress of the Chechen People and its leaders, who seek, by organising mass disorders, with the use of violence, to remove the lawfully acting state bodies from power", and in point 6 banned any elections: "elections of bodies of state power and of local self-government shall not be held during the whole period of the state of emergency"(Citation: 274).
    None of these bans worked: the elections took place, the president and the parliament of Chechnya were at work, and on 11 November the deputies in Moscow refused to approve the decree itself(Citation: 275).
  uk: |-
    10 вересня 1991 року президент РРФСР Єльцин направив до Чечено-Інгушетії делегацію на чолі з державним секретарем Бурбулісом і доручив їй «роз'яснити політику Російської Федерації і Президента РРФСР на даному етапі»(Citation: 704); делегація повернулася ні з чим(Citation: 707). 8 жовтня московське керівництво за підписом Хасбулатова постановило «надалі до обрання нового складу Верховної Ради Чечено-Інгушської Республіки вважати єдиним законним органом державної влади на території Чечено-Інгушської Республіки Тимчасову Вищу Раду Республіки» і наказало «незаконним збройним формуванням [так колонізатор назвав борців за незалежність від Росії] до 24 години 10 жовтня 1991 року здати зброю органам внутрішніх справ»(Citation: 624).
    Чеченці зброю не здали: 9 жовтня керівництво Загальнонаціонального конгресу чеченського народу відповіло, що постанову ухвалено «з єдиною метою збереження колоніального панування над чеченським народом, над народами Кавказу та їхніми природними багатствами», оголосило мобілізацію чоловіків від 15 до 55 років і привело національну гвардію в бойову готовність(Citation: 706). 10 жовтня Москва доручила віцепрезидентові Руцькому та урядові РРФСР «забезпечити необхідні умови для відновлення законності і правопорядку в Чечено-Інгушській Республіці»(Citation: 705). 15 жовтня голова КДБ РРФСР (попередника сучасної ФСБ) Іваненко зупинив роботу КДБ Чечено-Інгушетії «до 27 жовтня 1991 року» і своїм наказом призначив йому виконувача обов'язків голови(Citation: 707). 19 жовтня Єльцин звернувся до керівництва конгресу з ультиматумом: «вимагаю від лідерів Виконкому Загальнонаціонального конгресу чеченського народу і угруповань, що їх підтримують, припинення протиправних дій і беззастережного підкорення законові… буде вжито всіх передбачених законами РРФСР заходів»(Citation: 626). 24 жовтня Москва постановила, що призначені на 27 жовтня вибори «не мають правової основи і їхні результати не можуть бути визнані законними», а підготовку інших виборів доручила Тимчасовій Вищій Раді та депутатам РРФСР від республіки(Citation: 625).
    Чеченці проголосували все одно: 27 жовтня, за даними виборчої комісії Чеченської Республіки, прийшли 72 % виборців, за Джохара Дудаєва - 90,1 %(Citation: 707). 1 листопада Джохар Дудаєв підписав указ: «Керуючись Декларацією про державний суверенітет республіки і волевиявленням громадян Чеченської Республіки, вираженим прямими і загальними виборами, оголосити про державний суверенітет Чеченської Республіки з 1 листопада 1991 року»(Citation: 630). 2 листопада Москва відповіла постановою: «Визнати проведені в Чечено-Інгушській Республіці 27 жовтня 1991 року вибори до вищого органу державної влади (Верховної Ради) і Президента республіки незаконними, а ухвалені ними акти такими, що не підлягають виконанню»(Citation: 622). 7 листопада Єльцин в указі № 178 назвав причиною надзвичайного стану загострення, «спричинене незаконними діями виконкому Загальнонаціонального конгресу чеченського народу та його лідерів, які прагнуть шляхом організації масових заворушень, із застосуванням насильства, усунути від влади законно діючі державні органи», а пунктом 6 заборонив будь-які вибори: «вибори органів державної влади і місцевого самоврядування протягом усього періоду надзвичайного стану не проводяться»(Citation: 274).
    Жодна з цих заборон не спрацювала: вибори відбулися, президент і парламент Чечні працювали, а 11 листопада депутати в Москві відмовилися затвердити і сам указ(Citation: 275).
  ru: |-
    10 сентября 1991 года президент РСФСР Ельцин направил в Чечено-Ингушетию делегацию во главе с государственным секретарём Бурбулисом и поручил ей «разъяснить политику Российской Федерации и Президента РСФСР на данном этапе»(Citation: 704); делегация вернулась ни с чем(Citation: 707). 8 октября московское руководство за подписью Хасбулатова постановило «впредь до избрания нового состава Верховного Совета Чечено-Ингушской Республики считать единственным законным органом государственной власти на территории Чечено-Ингушской Республики Временный Высший Совет Республики» и приказало «незаконным вооруженным формированиям [так колонизатор назвал борцов за независимость от России] до 24 часов 10 октября 1991 года сдать оружие органам внутренних дел»(Citation: 624).
    Чеченцы оружие не сдали: 9 октября руководство Общенационального конгресса чеченского народа ответило, что постановление принято «с единственной целью сохранения колониального господства над чеченским народом, над народами Кавказа и их природными богатствами», объявило мобилизацию мужчин от 15 до 55 лет и привело национальную гвардию в боевую готовность(Citation: 706). 10 октября Москва поручила вице-президенту Руцкому и правительству РСФСР «обеспечить необходимые условия для восстановления законности и правопорядка в Чечено-Ингушской Республике»(Citation: 705). 15 октября председатель КГБ РСФСР (предшественника современной ФСБ) Иваненко приостановил работу КГБ Чечено-Ингушетии «до 27 октября 1991 года» и своим приказом назначил ему исполняющего обязанности председателя(Citation: 707). 19 октября Ельцин обратился к руководству конгресса с ультиматумом: «требую от лидеров Исполкома Общенационального конгресса чеченского народа и поддерживающих их группировок прекращения противоправных действий и безоговорочного подчинения закону… будут приняты все предусмотренные законами РСФСР меры»(Citation: 626). 24 октября Москва постановила, что назначенные на 27 октября выборы «не имеют правовой основы и их результаты не могут быть признаны законными», а подготовку других выборов поручила Временному Высшему Совету и депутатам РСФСР от республики(Citation: 625).
    Чеченцы проголосовали всё равно: 27 октября, по данным избирательной комиссии Чеченской Республики, пришли 72 % избирателей, за Джохара Дудаева - 90,1 %(Citation: 707). 1 ноября Джохар Дудаев подписал указ: «Руководствуясь Декларацией о государственном суверенитете республики и волеизъявлением граждан Чеченской Республики, выраженным прямыми и всеобщими выборами, объявить о государственном суверенитете Чеченской Республики с 1 ноября 1991 года»(Citation: 630). 2 ноября Москва ответила постановлением: «Признать проведенные в Чечено-Ингушской Республике 27 октября 1991 года выборы в высший орган государственной власти (Верховный Совет) и Президента республики незаконными, а принятые ими акты не подлежащими исполнению»(Citation: 622). 7 ноября Ельцин в указе № 178 назвал причиной чрезвычайного положения обострение, «вызванное незаконными действиями исполкома Общенационального конгресса чеченского народа и его лидеров, стремящихся путем организации массовых беспорядков, с применением насилия, отстранить от власти законно действующие государственные органы», а пунктом 6 запретил любые выборы: «выборы органов государственной власти и местного самоуправления в течение всего периода чрезвычайного положения не проводятся»(Citation: 274).
    Ни один из этих запретов не сработал: выборы прошли, президент и парламент Чечни работали, а 11 ноября депутаты в Москве отказались утвердить и сам указ(Citation: 275).
