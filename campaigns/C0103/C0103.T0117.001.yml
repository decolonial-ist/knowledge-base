description:
  ru: Искусственное изменение демографического состава населения на оккупированных территориях (например, в разрушенном Мариуполе) путем стимулирования переезда граждан РФ и массовой скупки ими жилья на фоне выдавливания коренных жителей.
  en: Artificial alteration of the demographic composition of the population in the occupied territories (for example, in destroyed Mariupol) by incentivizing the relocation of citizens of the Russian Federation and their mass purchase of housing, against the backdrop of squeezing out the indigenous residents.
  uk: Штучна зміна демографічного складу населення на окупованих територіях (наприклад, у зруйнованому Маріуполі) шляхом стимулювання переїзду громадян РФ та масового скуповування ними житла на тлі витіснення корінних жителів.
