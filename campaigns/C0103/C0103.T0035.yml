description:
  ru: 'Принуждение жителей оккупированных территорий к получению российских паспортов: «политика массового предоставления российского гражданства жителям оккупированных районов Херсонской, Запорожской, Донецкой и Луганской областей усугубила там обстановку принуждения», причем «тем, кто отказывался от российских паспортов, отказывали в доступе к публичным услугам, прежде всего к социальному обеспечению, здравоохранению и образованию, и они рисковали остаться без работы» и «сталкивались с повышенным риском произвольного задержания при пересечении блокпостов»(Citation: 222).'
  en: 'Coercing residents of the occupied territories into taking Russian passports: "the policy of mass conferral of Russian citizenship to residents of occupied areas of Kherson, Zaporizhzhia, Donetsk, and Luhansk regions exacerbated the coercive environment there," and "those who refused Russian passports were denied access to public services, notably social security, healthcare, and education, and risked unemployment" and "faced a heightened risk of arbitrary detention when crossing checkpoints"(Citation: 222).'
  uk: 'Примус мешканців окупованих територій до отримання російських паспортів: «політика масового надання російського громадянства мешканцям окупованих районів Херсонської, Запорізької, Донецької та Луганської областей посилила там атмосферу примусу», причому «тим, хто відмовлявся від російських паспортів, відмовляли в доступі до публічних послуг, насамперед до соціального забезпечення, охорони здоров''я та освіти, і вони ризикували залишитися без роботи» і «стикалися з підвищеним ризиком свавільного затримання під час перетину блокпостів»(Citation: 222).'
