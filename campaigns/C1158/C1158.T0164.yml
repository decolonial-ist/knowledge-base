description:
  ru: 'При истреблении Кишкерой-Юрта 28-31 декабря 1836 отряд Пулло присвоил имущество жителей, включая оружие, снятое с тел убитых: «все имущество жителей и оружие с убитых досталось войскам нашим»(Citation: 126).'
  en: 'In the course of the extermination of Kishkeroy-Yurt on 28-31 December 1836, Pullo''s detachment appropriated the inhabitants'' property, including weapons taken from the bodies of the slain: "all the property of the inhabitants and the weapons taken from the slain fell to our troops"(Citation: 126).'
  uk: 'Під час винищення Кишкерой-Юрта 28-31 грудня 1836 загін Пулло привласнив майно жителів, включно зі зброєю, знятою з тіл убитих: «все майно жителів і зброя з убитих дісталися військам нашим»(Citation: 126).'
