description:
  en: |-
    In late December 1836, Colonel Pullo carried out a punitive raid on the Chechen village of Kishkeroy-Yurt (Keshkeroy) beyond the Gudermes river, to punish its inhabitants for harboring Tashu-Hadji, the leader of the Chechen resistance.
    In April 1836, Nicholas I had demanded that action against Tashu-Hadji be undertaken "not otherwise than with complete confidence of success"(Citation: 105), and on 10 December 1836 Rozen reported to the Minister of War Chernyshev that he "had authorized Col. Pullo to act at once against the unsubmissive Chechen villages"(Citation: 105).
    Over the four days of the raid, the village was exterminated together with 76 inhabitants and defenders, and 40 people were led away into captivity(Citation: 126).
  uk: |-
    Наприкінці грудня 1836 полковник Пулло провів каральну експедицію на чеченське село Кишкерой-Юрт (Кешкерой) за рікою Гудермес на покарання жителів за прийом керівника чеченського опору Ташу-Хаджі.
    У квітні 1836 Микола I вимагав вживати заходів проти Ташу-Хаджі «не інакше, як з цілковитою впевненістю в успіху»(Citation: 105), а 10 грудня 1836 Розен повідомив військового міністра Чернишева, що «дозволив полк.
    Пулло нині ж діяти проти непокірних чеченських сіл»(Citation: 105).
    За чотири дні рейду село було винищене разом із 76 жителями і захисниками, 40 осіб уведено в полон(Citation: 126).
  ru: |-
    В конце декабря 1836 полковник Пулло провёл карательный рейд на чеченскую деревню Кишкерой-Юрт (Кешкерой) за рекой Гудермес в наказание жителей за приём руководителя чеченского сопротивления Ташу-Хаджи.
    В апреле 1836 Николай I потребовал предпринимать действия против Ташу-Хаджи «не иначе, как с совершенною уверенностью в успехе»(Citation: 105), а 10 декабря 1836 Розен сообщил военному министру Чернышеву, что «разрешил полк.
    Пулло ныне же действовать против непокорных чеченских деревень»(Citation: 105).
    За четыре дня рейда деревня была истреблена вместе с 76 жителями и защитниками, 40 человек уведены в плен(Citation: 126).
