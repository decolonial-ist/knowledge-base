description:
  ru: |-
    28 декабря 1836 при внезапном окружении Кишкерой-Юрта войска Пулло убивали жителей, пытавшихся спастись, и семьи в домах: «искавшие спасения в бегстве, были пойманы или истреблены», «жители, запершись в домах с семействами, выбиваемы были штыками», двоих выкурили дымом «от брошенной в трубы соломы»(Citation: 126).
    При занятии деревни найдено 76 тел убитых(Citation: 126).
    Часть жителей вела вооружённую оборону, и среди 76 убитых есть павшие с оружием; техника фиксируется по убийству бегущих и запертых в домах семей.
  en: |-
    On 28 December 1836, during the sudden encirclement of Kishkeroy-Yurt, Pullo's troops killed inhabitants who tried to escape, as well as families in their houses: "those seeking salvation in flight were caught or exterminated", "the inhabitants, having barricaded themselves in their houses with their families, were put to the bayonet", and two were smoked out "by straw thrown into the chimneys"(Citation: 126).
    Upon the occupation of the village, 76 bodies of the slain were found(Citation: 126).
    Some of the inhabitants mounted an armed defense, and among the 76 killed are those who fell bearing arms; the technique is recorded on the basis of the killing of those fleeing and of families trapped in their houses.
  uk: |-
    28 грудня 1836 під час раптового оточення Кишкерой-Юрта війська Пулло вбивали жителів, які намагалися врятуватися, і родини в будинках: «ті, що шукали порятунку у втечі, були спіймані або винищені», «жителі, замкнувшись у будинках з сім'ями, вибивані були багнетами», двох викурили димом «від кинутої в труби соломи»(Citation: 126).
    При занятті села знайдено 76 тіл убитих(Citation: 126).
    Частина жителів вела збройну оборону, і серед 76 убитих є полеглі зі зброєю; техніка фіксується за вбивством тих, хто тікав, і замкнутих у будинках родин.
