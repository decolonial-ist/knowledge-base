description:
  en: |-
    In the course of the extermination of Kishkeroy-Yurt, Pullo's detachment deliberately destroyed the winter stores: the village was burned "with a considerable stock of grain and hay," and the following day part of the detachment "was occupied with the destruction of the hay stored in the surrounding area"(Citation: 126).
    The destruction of grain and fodder stores in the depth of winter left the surviving inhabitants without means to survive it.
  uk: |-
    Під час винищення Кишкерой-Юрта загін Пулло цілеспрямовано знищив зимові запаси: село спалене «зі значним запасом хліба і сіна», а наступного дня частина загону «займалася знищенням заготовленого в околицях сіна»(Citation: 126).
    Знищення запасів хліба і корму в розпал зими залишало вцілілих жителів без засобів пережити її.
  ru: |-
    При истреблении Кишкерой-Юрта отряд Пулло целенаправленно уничтожил зимние запасы: деревня сожжена «с значительным запасом хлеба и сена», а на следующий день часть отряда «занималась истреблением заготовленного в окрестностях сена»(Citation: 126).
    Уничтожение запасов хлеба и корма в разгар зимы оставляло уцелевших жителей без средств пережить её.
