description:
  ru: 'При истреблении Кишкерой-Юрта 28-31 декабря 1836 отряд Пулло увёл в плен 40 жителей: «40 душ обоего пола взято в плен»(Citation: 126).'
  en: 'In the course of the extermination of Kishkeroy-Yurt on 28-31 December 1836, Pullo''s detachment led away 40 inhabitants into captivity: "40 souls of both sexes were taken captive"(Citation: 126).'
  uk: 'Під час винищення Кишкерой-Юрта 28-31 грудня 1836 загін Пулло вивів у полон 40 жителів: «40 душ обох статей взято в полон»(Citation: 126).'
