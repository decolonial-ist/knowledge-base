description:
  ru: |-
    29-31 декабря 1836 отряд Пулло полностью уничтожил Кишкерой-Юрт: «дер.
    Кишкерой, состоящая из 63 дворов, с значительным запасом хлеба и сена, предана огню», а при отходе 31 декабря Пулло «выступил из Кишкерой-Юрта, предав огню дома, оставшиеся не истребленными»(Citation: 126).
  en: 'On 29-31 December 1836, Pullo''s detachment completely destroyed Kishkeroy-Yurt: "the village of Kishkeroy, consisting of 63 households, with a considerable stock of grain and hay, was put to the torch", and on withdrawing on 31 December Pullo "marched out of Kishkeroy-Yurt, having set fire to the houses that remained undestroyed"(Citation: 126).'
  uk: |-
    29-31 грудня 1836 загін Пулло повністю знищив Кишкерой-Юрт: «дер.
    Кишкерой, що складається з 63 дворів, зі значним запасом хліба і сіна, віддана вогню», а при відході 31 грудня Пулло «виступив з Кишкерой-Юрта, віддавши вогню будинки, що залишилися не знищеними»(Citation: 126).
