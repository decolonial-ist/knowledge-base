name:
  ru: 'Истребление жителей Кишкерой-Юрта отрядом Пулло: 76 убитых, 40 пленных, сожжение села с запасами (декабрь 1836)'
  en: 'Extermination of the Inhabitants of Kishkeroy-Yurt by Pullo''s Detachment: 76 Killed, 40 Captured, Village Burned with Its Stores (December 1836)'
  uk: 'Винищення жителів Кишкерой-Юрта загоном Пулло: 76 убитих, 40 полонених, спалення села із запасами (грудень 1836)'
description:
  ru: |-
    В конце декабря 1836 полковник Пулло скрытным зимним рейдом истребил чеченскую деревню Кишкерой-Юрт (Кешкерой) за рекой Гудермес.
    Санкция была выдана заранее: 10 декабря 1836 Розен сообщил военному министру Чернышеву, что «разрешил полк.
    Пулло ныне же действовать против непокорных чеченских деревень»(Citation: 105).
    Предлогом кары объявлено гостеприимство: жители деревни «принимали к себе мятежника Ташова-Хаджия»(Citation: 126).
    Окружённое на рассвете село истреблялось вместе с людьми: бегущие «были пойманы или истреблены», а «жители, запершись в домах с семействами, выбиваемы были штыками»(Citation: 126); попытка Ташу-Хаджи прийти селу на выручку была отбита артиллерией.
    Итог Розен подвёл сам: «При занятии дер.
    Кишкерой-Юрта, найдено в оной 76 тел убитых, а 40 душ обоего пола взято в плен, все имущество жителей и оружие с убитых досталось войскам нашим»(Citation: 126)(Citation: 132).
    Деревня из 63 дворов «с значительным запасом хлеба и сена» была предана огню посреди зимы(Citation: 126).
    Датировка: донесение озаглавлено в сборнике «9 января 1836 г.», но помещено составителями среди документов конца 1836 - начала 1837; рейд почти наверняка состоялся 27-31 декабря 1836, историк Ш. А. Гапуров датирует его декабрём 1835(Citation: 132).
  en: |-
    In late December 1836, Colonel Pullo, in a covert winter raid, exterminated the Chechen village of Kishkeroy-Yurt (Keshkeroy) beyond the Gudermes river.
    Sanction had been given in advance: on 10 December 1836 Rozen reported to the Minister of War Chernyshev that he "had authorized Col. Pullo to act at once against the unsubmissive Chechen villages"(Citation: 105).
    The pretext for the punishment was declared to be hospitality: the village's inhabitants "had harbored the rebel Tashov-Hadji"(Citation: 126).
    Surrounded at dawn, the village was exterminated together with its people: those fleeing "were caught or exterminated", while "the inhabitants, having barricaded themselves in their houses with their families, were put to the bayonet"(Citation: 126); an attempt by Tashu-Hadji to come to the village's relief was repelled by artillery.
    Rozen himself summed up the outcome: "Upon the occupation of the village of Kishkeroy-Yurt, 76 bodies of the slain were found in it, and 40 souls of both sexes were taken captive; all the property of the inhabitants and the weapons taken from the slain fell to our troops"(Citation: 126)(Citation: 132).
    The village of 63 households, "with a considerable stock of grain and hay," was put to the torch in the middle of winter(Citation: 126).
    Dating: the dispatch is dated in the collection "9 January 1836," but the compilers placed it among documents from late 1836 to early 1837; the raid almost certainly took place on 27-31 December 1836, while the historian Sh.
    A. Gapurov dates it to December 1835(Citation: 132).
  uk: |-
    Наприкінці грудня 1836 полковник Пулло прихованим зимовим рейдом винищив чеченське село Кишкерой-Юрт (Кешкерой) за рікою Гудермес.
    Санкцію було видано заздалегідь: 10 грудня 1836 Розен повідомив військового міністра Чернишева, що «дозволив полк.
    Пулло нині ж діяти проти непокірних чеченських сіл»(Citation: 105).
    Приводом кари оголошено гостинність: жителі села «приймали до себе бунтівника Ташова-Хаджія»(Citation: 126).
    Оточене на світанку село винищувалося разом із людьми: ті, що тікали, «були спіймані або винищені», а «жителі, замкнувшись у будинках з сім'ями, вибивані були багнетами»(Citation: 126); спроба Ташу-Хаджі прийти селу на допомогу була відбита артилерією.
    Підсумок підвів сам Розен: «При занятті дер.
    Кишкерой-Юрта, знайдено в оній 76 тіл убитих, а 40 душ обох статей взято в полон, все майно жителів і зброя з убитих дісталися військам нашим»(Citation: 126)(Citation: 132).
    Село з 63 дворів «зі значним запасом хліба і сіна» було віддане вогню посеред зими(Citation: 126).
    Датування: донесення в збірнику озаглавлене «9 січня 1836 р.», але вміщене упорядниками серед документів кінця 1836 - початку 1837; рейд майже напевно відбувся 27-31 грудня 1836, історик Ш. А. Гапуров датує його груднем 1835(Citation: 132).
