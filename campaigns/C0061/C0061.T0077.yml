description:
  ru: |-
    Вооруженное подавление антикрепостнического движения крестьян («Киевская козаччина»): «На подавление «козаччины» правительство бросило регулярные войска и полицию.
    В нескольких сёлах и местечках произошли кровавые столкновения»(Citation: 192).
  en: |-
    The armed suppression of the peasants' anti-serfdom movement (the "Kyiv Cossack movement"): "To suppress the 'Cossack movement' the government threw in regular troops and police.
    Bloody clashes occurred in several villages and towns"(Citation: 192).
  uk: |-
    Збройне придушення антикріпосницького руху селян («Київська козаччина»): «На придушення «козаччини» уряд кинув регулярні війська і поліцію.
    У кількох селах і містечках сталися криваві сутички»(Citation: 192).
