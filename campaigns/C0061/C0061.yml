name:
  en: The Crimean War and the Suppression of the "Kyiv Cossack Movement" (1853–1856)
  uk: Кримська війна та придушення «Київської козаччини» (1853–1856)
  ru: Крымская война и подавление «Киевской козаччины» (1853–1856)
description:
  en: |-
    A grueling geopolitical war of the empire, accompanied by the mass mobilization of the Ukrainian peasantry.
    Nicholas I's manifesto on the state militia and the decrees on its levy of 29 January 1855 (Nos. 28.991–28.993) gave rise to hopes of freedom - even though the Kyiv governorate was not on the list of governorates called up at all(Citation: 449): "the movement for re-Cossackization in March–April engulfed over 500 villages and towns in 8 of the 12 districts of the Kyiv governorate…
    To suppress the 'Cossack movement' the government threw in regular troops and police"(Citation: 192).
  uk: |-
    Важка геополітична війна імперії, що супроводжувалася масовою мобілізацією українського селянства.
    Маніфест Миколи I про державне ополчення та укази про його набір від 29 січня 1855 року (№ 28.991–28.993) породили надії на волю - при тому, що Київської губернії в переліку призваних губерній не було зовсім(Citation: 449): «рух за покозачення в берез.—квіт. охопив понад 500 сіл і містечок у 8 із 12 повітах Київ. губернії…
    На придушення «козаччини» уряд кинув регулярні війська і поліцію»(Citation: 192).
  ru: |-
    Тяжелая геополитическая война империи, сопровождавшаяся массовой мобилизацией украинского крестьянства.
    Манифест Николая I о государственном ополчении и указы о его наборе от 29 января 1855 года (№ 28.991–28.993) породили надежды на волю - притом что Киевской губернии в перечне призываемых губерний не было вовсе(Citation: 449): «движение за оказачивание в марте—апреле охватило более 500 сёл и местечек в 8 из 12 уездов Киевской губернии…
    На подавление «козаччины» правительство бросило регулярные войска и полицию»(Citation: 192).
