description:
  ru: 'Дипломатический аппарат Московского Царства использовал лояльные элиты соседних народов для совместных вооруженных акций против обществ нохчи: историк Я. З. Ахмадов констатирует, что в 1718 году была осуществлена экспедиция на земли нохчи силами «союзных Петру I кабардинских князей»(Citation: 94).'
  en: |-
    The diplomatic apparatus of the Tsardom of Muscovy used loyal elites of neighboring peoples for joint armed actions against the Nokhchi societies: historian Ya.
    Z. Akhmadov states that in 1718 an expedition into the lands of the Nokhchi was carried out by the forces of "Kabardian princes allied with Peter I"(Citation: 94).
  uk: 'Дипломатичний апарат Московського царства використовував лояльні еліти сусідніх народів для спільних збройних акцій проти товариств Нохчі: історик Я. З. Ахмадов констатує, що 1718 року було здійснено експедицію на землі Нохчі силами «союзних Петру I кабардинських князів»(Citation: 94).'
