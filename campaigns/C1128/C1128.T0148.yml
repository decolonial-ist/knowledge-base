description:
  ru: 'Правительство Московского Царства организовывало нападения на территории нохчи для массового захвата пленных и добычи: историк Я. З. Ахмадов констатирует, что в 1718 году состоялась «грабительская экспедиция отрядов донских казаков и союзных Петру I кабардинских князей на «Чеченский уезд» по Сунже и Аргуну»(Citation: 94), в результате чего «было захвачено 800 человек пленных, не считая «пожитков»»(Citation: 94), а в 1721 году астраханский губернатор А. П. Волынский «пригласил донских казаков и совместно с терскими казаками организовал рейды к рекам Аграхани и Аксай против кумыков и чеченцев»(Citation: 94).'
  en: |-
    The government of the Tsardom of Muscovy organized attacks on the territories of the Nokhchi for the mass capture of prisoners and booty: historian Ya.
    Z. Akhmadov states that in 1718 there took place a "predatory expedition of detachments of Don Cossacks and Kabardian princes allied with Peter I into the 'Chechen uezd' along the Sunzha and the Argun"(Citation: 94), as a result of which "800 prisoners were captured, not counting 'belongings'"(Citation: 94), and in 1721 the Astrakhan governor A. P. Volynsky "invited the Don Cossacks and, together with the Terek Cossacks, organized raids to the Agrakhan and Aksai rivers against the Kumyks and Chechens"(Citation: 94).
  uk: 'Уряд Московського царства організовував напади на території Нохчі для масового захоплення полонених і здобичі: історик Я. З. Ахмадов констатує, що 1718 року відбулася «грабіжницька експедиція загонів донських козаків і союзних Петру I кабардинських князів на «Чеченський повіт» по Сунжі та Аргуну»(Citation: 94), внаслідок чого «було захоплено 800 осіб полонених, не рахуючи «пожитків»»(Citation: 94), а 1721 року астраханський губернатор А. П. Волинський «запросив донських козаків і спільно з терськими козаками організував рейди до річок Аграхані та Аксаю проти Кумиків і Чеченців»(Citation: 94).'
