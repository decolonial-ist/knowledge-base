name:
  en: Plundering Expeditions of Cossacks and Allied Princes (1718–1721)
  uk: Грабіжницькі експедиції козаків та союзних князів (1718–1721)
  ru: Грабительские экспедиции казаков и союзных князей (1718–1721)
description:
  en: |-
    In 1718, the government of the Tsardom of Muscovy organized a large-scale invasion of the lands of the Nokhchi: historian Ya.
    Z. Akhmadov states that there occurred “a predatory expedition of detachments of Don Cossacks and Kabardian princes allied with Peter I into the ‘Chechen district’ along the Sunzha and the Argun”(Citation: 94).
    As a result of the raid, “800 captives were taken, not counting ‘belongings’”(Citation: 94).
    In 1721, the armed actions continued: the researcher points out that the Astrakhan governor A. P. Volynsky “invited the Don Cossacks and, together with the Terek Cossacks, organized raids to the Agrakhan and Aksai rivers against the Kumyks and Chechens”(Citation: 94).
  uk: |-
    У 1718 році уряд Московського царства організував масштабне вторгнення на землі Нохчі: історик Я. З. Ахмадов констатує, що відбулася «грабіжницька експедиція загонів донських козаків та союзних Петру I кабардинських князів на „Чеченський повіт“ по Сунжі та Аргуну»(Citation: 94).
    Внаслідок набігу «було захоплено 800 осіб полонених, не рахуючи „пожитків“»(Citation: 94).
    У 1721 році збройні акції тривали: дослідник вказує, що астраханський губернатор А. П. Волинський «запросив донських козаків і спільно з терськими козаками організував рейди до річок Аграхані та Аксаю проти Кумиків і Чеченців»(Citation: 94).
  ru: |-
    В 1718 году правительство Московского Царства организовало масштабное вторжение на земли нохчи: историк Я. З. Ахмадов констатирует, что произошла «грабительская экспедиция отрядов донских казаков и союзных Петру I кабардинских князей на «Чеченский уезд» по Сунже и Аргуну»(Citation: 94).
    В результате набега «было захвачено 800 человек пленных, не считая «пожитков»»(Citation: 94).
    В 1721 году вооруженные акции продолжились: исследователь указывает, что астраханский губернатор А. П. Волынский «пригласил донских казаков и совместно с терскими казаками организовал рейды к рекам Аграхани и Аксай против кумыков и чеченцев»(Citation: 94).
