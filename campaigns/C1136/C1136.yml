name:
  ru: Эксплуатация села Сольжа (Сунженская) как ресурсной базы и его карательное разорение за вооружённый отпор нохчи (1818)
  en: Exploitation of the village of Solzha (Sunzhenskaya) as a resource base and its punitive devastation for the armed resistance of the Nokhchi (1818)
  uk: Експлуатація села Сольжа (Сунженська) як ресурсної бази та його каральне розорення за збройну відсіч Нохчі (1818)
description:
  ru: |-
    В 1818 году, уже после возведения крепости Грозной на отнятой земле, Российская империя использовала близлежащее село Сольжа (Сунженская) как ресурсную базу гарнизона, а затем разорила его, когда жители отказались выдать односельчанина и взялись за оружие.
    Историк Д. А. Хожаев фиксирует разорение Сольжи (Сунженской), последствием которого «большая часть мирных окрестных аулов бежала в горы, и цветущие берега с тех пор надолго опустели»(Citation: 95).
    Имперский генерал Ермолов в своих «Записках» свидетельствует, что прежде требовал от войск щадить село, чтобы крепость «могла получать из неё все необходимые потребности».
    Когда солдаты отнимали у жителя вола, «которого называл он своим», тот выстрелил в солдата; жители отказались его выдать, заявив, «что стрелявшего по солдату не отдадут и будут защищаться, если войска придут».
    Когда начальник корпусного штаба «пошёл сам с несколькими ротами», он «встречен был выстрелами».
    Семьи и имущество были отосланы заранее, оборону держали одни мужчины.
    Войскам велено было отрезать отход — «отхватить отступление в лесу», но защитники отошли раньше.
    Лишь после этого войска вошли в оставленное село и несколько дней вывозили из него «хлеб, фураж и годный лес на строение»(Citation: 96).
  en: |-
    In 1818, after the fortress of Groznaya had already been built on seized land, the Russian Empire used the nearby village of Solzha (Sunzhenskaya) as a resource base for the garrison, and then devastated it when its inhabitants refused to hand over a fellow villager and took up arms.
    Historian D. A. Khozhaev records the devastation of Solzha (Sunzhenskaya), as a consequence of which "most of the peaceful surrounding auls fled to the mountains, and the flourishing riverbanks stood deserted for a long time thereafter"(Citation: 95).
    Imperial general Yermolov testifies in his "Notes" that he had previously ordered the troops to spare the village so that the fortress "could obtain from it all the necessary provisions."
    When soldiers were taking away from a villager an ox "which he called his own," the man shot at a soldier; the inhabitants refused to hand him over, declaring "that they would not give up the man who had shot at the soldier and would defend themselves if the troops came."
    When the chief of the corps staff "went himself with several companies," he "was met with gunfire."
    The families and property had been sent away in advance; the defense was held by the men alone.
    The troops were ordered to cut off the retreat — "to intercept the withdrawal in the forest" — but the defenders had pulled back earlier.
    Only after this did the troops enter the abandoned village, spending several days carting away from it "grain, forage, and timber fit for construction"(Citation: 96).
  uk: |-
    У 1818 році, вже після зведення фортеці Грозної на відібраній землі, Російська імперія використовувала розташоване поруч село Сольжа (Сунженська) як ресурсну базу гарнізону, а потім розорила його, коли жителі відмовилися видати односельця і взялися за зброю.
    Історик Д. А. Хожаєв фіксує розорення Сольжі (Сунженської), наслідком якого стало те, що «більша частина мирних навколишніх аулів утекла в гори, і квітучі береги відтоді надовго спорожніли»(Citation: 95).
    Імперський генерал Єрмолов у своїх «Записках» свідчить, що раніше вимагав від військ щадити село, аби фортеця «могла отримувати з нього всі необхідні потреби».
    Коли солдати відбирали в жителя вола, «якого він називав своїм», той вистрелив у солдата; жителі відмовилися його видати, заявивши, «що того, хто стріляв у солдата, не віддадуть і боронитимуться, якщо війська прийдуть».
    Коли начальник корпусного штабу «пішов сам із кількома ротами», його «зустріли пострілами».
    Сім'ї та майно були відіслані заздалегідь, оборону тримали самі чоловіки.
    Військам було наказано відрізати відхід — «перехопити відступ у лісі», — але захисники відійшли раніше.
    Лише після цього війська увійшли в залишене село і кілька днів вивозили з нього «хліб, фураж і придатний для будівництва ліс»(Citation: 96).
