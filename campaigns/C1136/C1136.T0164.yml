description:
  ru: |-
    Сольжу (Сунженскую), одно из богатейших сёл, Российская империя держала как источник снабжения крепости Грозной, а захватив село силой, несколько дней вывозила его запасы.
    Историк Д. А. Хожаев фиксирует разорение Сольжи (Сунженской), последствием которого «большая часть мирных окрестных аулов бежала в горы, и цветущие берега с тех пор надолго опустели»(Citation: 95).
    Имперский генерал Ермолов в своих «Записках» свидетельствует, что прежде требовал от войск щадить село, чтобы крепость «могла получать из неё все необходимые потребности», а когда войска захватили село, «хлеб, фураж и годный лес на строение вывозились несколько дней»(Citation: 96).
  en: |-
    Solzha (Sunzhenskaya), one of the wealthiest villages, the Russian Empire kept as a source of supply for the fortress of Groznaya, and having seized the village by force, it spent several days carting away its stores.
    Historian D. A. Khozhayev records the ravaging of Solzha (Sunzhenskaya), as a consequence of which “most of the peaceful neighboring auls fled into the mountains, and the flourishing banks were left deserted for a long time thereafter”(Citation: 95).
    Imperial general Yermolov testifies in his “Notes” that he had earlier ordered the troops to spare the village so that the fortress “could obtain from it all necessary supplies,” and when the troops seized the village, “grain, forage, and timber fit for building were carted away for several days”(Citation: 96).
  uk: |-
    Сольжу (Сунженську), одне з найбагатших сіл, Російська імперія тримала як джерело постачання фортеці Грозної, а захопивши село силою, кілька днів вивозила його запаси.
    Історик Д. А. Хожаєв фіксує розорення Сольжі (Сунженської), наслідком якого «більша частина мирних навколишніх аулів утекла в гори, і квітучі береги відтоді надовго спорожніли»(Citation: 95).
    Імперський генерал Єрмолов у своїх «Записках» свідчить, що раніше вимагав від військ щадити село, щоб фортеця «могла отримувати з нього все необхідне», а коли війська захопили село, «хліб, фураж і придатний для будівництва ліс вивозили кілька днів»(Citation: 96).
