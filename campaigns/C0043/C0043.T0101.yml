description:
  en: 'The introduction of censorship over book printing by Peter I''s decree of 5 October 1720: "no new books whatsoever are to be printed except previous church editions, and even those old church books… are to be corrected before printing"(Citation: 143).'
  uk: 'Запровадження цензури на книгодрукування указом Петра I від 5 жовтня 1720 року: «знову жодних книг, крім церковних попередніх видань, не друкувати, та й ті церковні старі книги… виправляти перед друком»(Citation: 143).'
  ru: 'Введение цензуры на книгопечатание указом Петра I от 5 октября 1720 года: «вновь книг никаких, кроме церковных прежних изданий, не печатать, да и оныя церковныя старыя книги… справливать прежде печати»(Citation: 143).'
