name:
  en: Ban on Ukrainian Book Printing (1720)
  uk: Заборона українського книгодрукування (1720)
  ru: Запрет украинского книгопечатания (1720)
description:
  en: |-
    A campaign to introduce censorship and institutional linguistic assimilation.
    Peter I's decree of October 5, 1720 banned the printing of books in the indigenous people's language at the key printing houses: "In the Kyiv-Pechersk and Chernihiv printing houses no new books whatsoever are to be printed except previous church editions, and even those old church books are to be corrected before printing for complete conformity with the Great Russian church books, so that there be no discord or distinct dialect in them"(Citation: 143).
  uk: |-
    Кампанія із запровадження цензури та інституційної мовної асиміляції.
    Указ Петра I від 5 жовтня 1720 року заборонив друк книжок мовою корінного народу в ключових друкарнях: «У Києво-Печерській і Чернігівській друкарнях знову жодних книг, крім церковних попередніх видань, не друкувати, та й ті церковні старі книги для цілковитої згоди з великоросійськими такими ж церковними книгами виправляти перед друком, аби ніякої різниці й осібного наріччя в них не було»(Citation: 143).
  ru: |-
    Кампания по введению цензуры и институциональной языковой ассимиляции.
    Указ Петра I от 5 октября 1720 года запретил печать книг на языке коренного народа в ключевых типографиях: «В Киево-Печерской и Черниговской типографиях вновь книг никаких, кроме церковных прежних изданий, не печатать, да и оныя церковныя старыя книги для совершеннаго согласия с великороссийскими такими ж церковными книгами справливать прежде печати, дабы никакой розни и особливаго наречия в оных не было»(Citation: 143).
