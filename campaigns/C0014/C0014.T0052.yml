description:
  en: |-
    Destruction of the military-economic base of the Lower Dnipro Cossacks.
    The Sich "was a kind of military base housing the fleet, artillery, and arsenal"(Citation: 189) – all of this infrastructure was destroyed or seized during the assault.
  uk: |-
    Зруйнування військово-економічної бази низового козацтва.
    Січ «була своєрідною військ. базою, де містилися флот, артилерія, арсенал»(Citation: 189) – усю цю інфраструктуру було знищено або захоплено під час штурму.
  ru: |-
    Разрушение военно-экономической базы низового казачества.
    Сечь «была своеобразной военной базой, где размещались флот, артиллерия, арсенал»(Citation: 189) – вся эта инфраструктура была уничтожена или захвачена при штурме.
