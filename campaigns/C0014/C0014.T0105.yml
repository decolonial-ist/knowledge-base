description:
  ru: 'Полное уничтожение построек Сечи и соседних укреплений: «жгли и вырезали также соседние курени»; «Все постройки были уничтожены, как писал Меншиков: „Все их места разорить, дабы оное изменническое гнездо веема выкоренить“»(Citation: 3).'
  en: 'Complete destruction of the Sich''s buildings and neighboring fortifications: "the neighboring kurins were also burned and slaughtered"; "All the buildings were destroyed, as Menshikov wrote: ''To lay waste all their places, so that this treasonous nest be utterly uprooted''"(Citation: 3).'
  uk: 'Повне знищення споруд Січі та сусідніх укріплень: «палили й вирізали також сусідні курені»; «Усі будівлі були знищені, як писав Меншиков: „Всі їхні місця розорити, аби оте зрадницьке гніздо цілком викоренити“»(Citation: 3).'
