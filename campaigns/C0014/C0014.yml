name:
  en: Liquidation of the Zaporozhian Sich (1709)
  uk: Ліквідація Запорозької Січі (1709)
  ru: Ликвидация Запорожской Сечи (1709)
description:
  en: |-
    A military operation of Muscovite troops to completely destroy the Zaporozhian (Chortomlyk) Sich as an autonomous military center in revenge for its support of Charles XII: "Having lost the proxy battle for Zaporizhzhia, Peter decided to follow the path of Baturyn — to destroy the Sich"(Citation: 3).
    Contemporaries recorded the empire's goal directly – Orlyk wrote that Moscow intended "to eradicate the Zaporozhian Host of the Lower Dnipro and to efface its very name forever"(Citation: 4).
  uk: |-
    Воєнна операція московських військ із повного зруйнування Запорозької (Чортомлицької) Січі як автономного військового центру в помсту за підтримку Карла XII: «Програвши заочний бій за Запорожжя, Петро вирішив піти шляхом Батурина — знищити Січ»(Citation: 3).
    Сучасники зафіксували мету імперії прямо – Орлик писав, що Москва задумала «Військо Запорозьке Низове викоренити й ім'я того вічно згладити»(Citation: 4).
  ru: |-
    Военная операция московских войск по полному разрушению Запорожской (Чортомлыкской) Сечи как автономного военного центра в отместку за поддержку Карла XII: «Проиграв заочный бой за Запорожье, Петр решил пойти по пути Батурина — уничтожить Сечь»(Citation: 3).
    Современники зафиксировали цель империи прямо – Орлик писал, что Москва задумала «Войско Запорожское Низовое искоренити и имя того вечне згладити»(Citation: 4).
