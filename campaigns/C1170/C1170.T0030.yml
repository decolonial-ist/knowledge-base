description:
  en: |-
    The oblast was recut in 1862, 1869, 1888 and 1899(Citation: 252).
    From 1 May 1888 the Vedeno and Argun okrugs were merged into the Grozny okrug - under the formula quoted by historian Z. Kh.
    Ibragimova, "to shield the Cossacks from the 'corrupting' influence of the highlanders"(Citation: 252).
    The Chechen villages on the right bank of the Terek, which were slated for transfer to the Kizlyar and Pyatigorsk otdels (Cossack divisions), were set apart as a special uchastok (sub-district) and temporarily left under the head of the Grozny okrug; the mountain okrugs were divided into uchastoks, while the Cossack otdels were divided by the pattern of manning military units, into sotnias (Cossack hundreds) and regiments(Citation: 252).
    From 1 January 1899 the oblast was recut once more: four otdels - Pyatigorsk, Mozdok, Kizlyar, Sunzha - and four okrugs: Vladikavkaz, Khasav-Yurt, Nalchik, Grozny(Citation: 252).
  uk: |-
    Область ділили заново в 1862, 1869, 1888 і 1899 роках(Citation: 252).
    З 1 травня 1888 року Веденський і Аргунський округи влито до Грозненського - за формулою, яку наводить історик З. Х. Ібрагімова, «щоб убезпечити козацтво від «розкладницького» впливу горців»(Citation: 252).
    Чеченські селища на правому березі Терека, які передбачалося передати Кізлярському і П'ятигорському відділам, виділили в окрему дільницю і тимчасово залишили у віданні начальника Грозненського округу; горські округи ділилися на дільниці, а козачі відділи - за ознаками комплектування військових частин, на сотні й полки(Citation: 252).
    З 1 січня 1899 року область перекроїли ще раз: чотири відділи - П'ятигорський, Моздокський, Кізлярський, Сунженський - і чотири округи: Владикавказький, Хасав-Юртовський, Нальчицький, Грозненський(Citation: 252).
  ru: |-
    Область делили заново в 1862, 1869, 1888 и 1899 годах(Citation: 252).
    С 1 мая 1888 года Веденский и Аргунский округа влиты в Грозненский - по формуле, которую приводит историк З. Х. Ибрагимова, «чтобы оградить казачество от «разлагающего» влияния горцев»(Citation: 252).
    Чеченские селения на правом берегу Терека, которые предполагалось передать Кизлярскому и Пятигорскому отделам, выделили в особый участок и временно оставили в ведении начальника Грозненского округа; горские округа делились на участки, а казачьи отделы - по признакам комплектования воинских частей, на сотни и полки(Citation: 252).
    С 1 января 1899 года область перекроили ещё раз: четыре отдела - Пятигорский, Моздокский, Кизлярский, Сунженский - и четыре округа: Владикавказский, Хасав-Юртовский, Нальчикский, Грозненский(Citation: 252).
