description:
  ru: |-
    1 апреля 1858 года «Положение об управлении Кавказской Армией» создало при Главном штабе особое отделение по горским народам - историк З. Х. Ибрагимова называет это «первым законодательным утверждением системы «военно-народного управления», фактически сложившейся по мере завоевания края»(Citation: 252).
    В 1859 году, «в связи с реформой местной администрации и введением в действие Положения о Главном управлении наместника Кавказского», Госконтроль был «лишен возможности следить за деятельностью местных властей»: в составе Главного управления наместника учредили особый контрольный департамент, подотчётный не центральному ведомству, а самому начальнику Главного управления(Citation: 252). 16 января 1860 года император Александр II утвердил положение, которым Левое крыло Кавказской линии (цепи имперских укреплений на земле нохчи) переименовано в Терскую область(Citation: 252). 24 мая 1860 года Барятинский, наместник на Кавказе, приказал создать при Главном штабе Кавказской армии «Канцелярию по управлению кавказскими горцами» - позже она называлась «Кавказское горское управление», затем «Кавказское военно-народное управление»(Citation: 252). 25 декабря 1860 года утверждены «временные штаты военно-народного управления Терской области»: область разделена на шесть округов - Кабардинский, Владикавказский, Чеченский, Кумыкский, Ичкеринский и Аргунский(Citation: 252).
  en: |-
    On 1 April 1858 the "Regulation on the Administration of the Caucasus Army" created a special section for the mountain peoples at the Main Staff - historian Z. Kh.
    Ibragimova calls this "the first legislative confirmation of the system of 'military-popular administration' that had in fact taken shape as the land was being conquered"(Citation: 252).
    In 1859, "in connection with the reform of the local administration and the entry into force of the Regulation on the Main Directorate of the Viceroy of the Caucasus", State Control was "deprived of the ability to monitor the activities of the local authorities": within the viceroy's Main Directorate a special control department was set up, answerable not to the central agency but to the head of the Main Directorate himself(Citation: 252).
    On 16 January 1860 Emperor Alexander II approved the regulation by which the Left Wing of the Caucasus Line (the chain of imperial fortifications on Nokhchi land) was renamed the Terek oblast(Citation: 252).
    On 24 May 1860 Baryatinsky, viceroy in the Caucasus, ordered the creation at the Main Staff of the Caucasus Army of a "Chancellery for the Administration of the Caucasus Highlanders" - later it was called the "Caucasus Mountain Administration", then the "Caucasus Military-Popular Administration"(Citation: 252).
    On 25 December 1860 the "provisional staffing tables of the military-popular administration of the Terek oblast" were approved: the oblast was divided into six okrugs (districts) - Kabardian, Vladikavkaz, Chechen, Kumyk, Ichkerian and Argun(Citation: 252).
  uk: |-
    1 квітня 1858 року «Положення про управління Кавказькою Армією» створило при Головному штабі особливе відділення у справах горських народів - історик З. Х. Ібрагімова називає це «першим законодавчим затвердженням системи «військово-народного управління», що фактично склалася в міру завоювання краю»(Citation: 252).
    У 1859 році, «у зв'язку з реформою місцевої адміністрації та введенням у дію Положення про Головне управління намісника Кавказького», Держконтроль був «позбавлений можливості стежити за діяльністю місцевої влади»: у складі Головного управління намісника заснували особливий контрольний департамент, підзвітний не центральному відомству, а самому начальникові Головного управління(Citation: 252). 16 січня 1860 року імператор Олександр II затвердив положення, яким Ліве крило Кавказької лінії (ланцюга імперських укріплень на землі нохчі) перейменовано на Терську область(Citation: 252). 24 травня 1860 року Барятинський, намісник на Кавказі, наказав створити при Головному штабі Кавказької армії «Канцелярію з управління кавказькими горцями» - пізніше вона називалася «Кавказьке горське управління», потім «Кавказьке військово-народне управління»(Citation: 252). 25 грудня 1860 року затверджено «тимчасові штати військово-народного управління Терської області»: область поділено на шість округів - Кабардинський, Владикавказький, Чеченський, Кумицький, Ічкеринський і Аргунський(Citation: 252).
