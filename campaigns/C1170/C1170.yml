name:
  en: '"Military-Popular Administration": the Colonial Regime of the Terek Oblast (1858-1917)'
  uk: '«Військово-народне управління»: колоніальний режим Терської області (1858-1917)'
  ru: '«Военно-народное управление»: колониальный режим Терской области (1858-1917)'
description:
  en: |-
    In 1858-1917 conquered Chechnya lived under a regime the empire itself named "military-popular administration": administrative power over the people lay in the hands of officers of the active army.
    The system was named by Baryatinsky, viceroy in the Caucasus - historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "A. I. Baryatinsky called the system of governing the highlanders that he was creating 'military-popular' and considered it temporary", and add what the name contained: "Contemporaries, without embarrassment, called this system of administration 'military'"(Citation: 125).
    The system was defined by a later viceroy, Vorontsov-Dashkov: it was "based on the concentration of administrative power in the hands of individual officers, under the supreme direction of the commander-in-chief of the Caucasus Army, and on allowing the population to manage its internal affairs according to its own adats" (adats - the customary law of the highlanders)(Citation: 252).
    The imperial general Chernyavsky explained why the regime was needed: "for these savage peoples such privileges are still premature...
    What is needed here is a power that commands, bridles and governs"(Citation: 252).
    Historian D. A. Khozhaev writes of the order thus imposed: "In the restless Terek oblast a 'military-popular' regime was established, which was in essence a state-of-emergency regime"; the outcome of the war he states separately: "A colonial 'military-popular' regime was established in the land"(Citation: 95).
  uk: |-
    У 1858-1917 роках завойована Чечня жила під режимом, який імперія сама назвала «військово-народним управлінням»: адміністративна влада над народом - у руках офіцерів діючої армії.
    Ім'я системі дав Барятинський, намісник на Кавказі, - історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «Створювану ним систему управління горцями А. І. Барятинський назвав «військово-народною» і вважав її тимчасовою», і додають про зміст імені: «Сучасники, не соромлячись, називали цю систему управління «військовою»»(Citation: 125).
    Визначення системі дав пізніший намісник Воронцов-Дашков: вона «заснована на зосередженні адміністративної влади в руках окремих офіцерів, під вищим керівництвом головнокомандувача Кавказької армії та на наданні населенню у внутрішніх справах порядкувати за своїми адатами» (адати - звичаєве право горців)(Citation: 252).
    Необхідність режиму імперський генерал Чернявський пояснював так: «для цих диких народів подібні пільги ще передчасні...
    Тут потрібна сила, що повеліває, приборкує і управляє»(Citation: 252).
    Історик Д. А. Хожаєв пише про запроваджений порядок: «У неспокійній Терській області було встановлено «військово-народний» режим, що був по суті режимом надзвичайного стану»; підсумок війни він формулює окремо: «У краї було встановлено колоніальний «військово-народний» режим»(Citation: 95).
  ru: |-
    В 1858-1917 годах завоёванная Чечня жила под режимом, который империя сама назвала «военно-народным управлением»: административная власть над народом - в руках офицеров действующей армии.
    Имя системе дал Барятинский, наместник на Кавказе, - историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Создаваемую им систему управления горцами А. И. Барятинский назвал «военно-народной» и считал ее временной», и добавляют о содержании имени: «Современники не стесняясь, называли эту систему управления «военной»»(Citation: 125).
    Определение системе дал позднейший наместник Воронцов-Дашков: она «основана на сосредоточении административной власти в руках отдельных офицеров, под высшим руководством главнокомандующего Кавказской армии и на предоставлении населению во внутренних делах ведаться по своим адатам» (адаты - обычное право горцев)(Citation: 252).
    Необходимость режима имперский генерал Чернявский объяснял так: «для этих диких народов подобные льготы ещё рановременны...
    Здесь нужна сила повелевающая, обуздывающая и управляющая»(Citation: 252).
    Историк Д. А. Хожаев пишет о введённом порядке: «В беспокойной Терской области был установлен «военно-народный» режим, являвшийся по сути режимом чрезвычайного положения»; итог войны он формулирует отдельно: «В крае был установлен колониальный «военно-народный» режим»(Citation: 95).
