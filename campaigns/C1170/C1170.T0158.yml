description:
  en: |-
    On 15 March 1873 the coat of arms of the Terek oblast was approved: "In a black shield, a silver wavy bend to the right.
    An Imperial standard on a golden staff.
    The shield is crowned with the ancient Tsar's Crown and surrounded by golden oak leaves joined by the Alexander ribbon"(Citation: 252).
    Historian Z. Kh.
    Ibragimova reads the meaning of the sign thus: the silver bend is the Terek, which had long been a border, and now "both its banks were united by the Imperial standard, and the Terek became fully Russian - such is the basic meaning of this coat of arms"(Citation: 252).
    The draft coat of arms of the city of Grozny was made by B. V. Köhne, an official of the Heraldry Office: on an azure shield a silver mountain between two golden sea lilies, and in the dexter canton - the arms of the Terek oblast(Citation: 252), so that the city's emblem carried the imperial symbol of the oblast.
    The land was marked with the figure of the conqueror as well.
    The first monument to Yermolov in Grozny was "the carefully preserved dugout in which he lived during the founding of the Groznaya fortress"(Citation: 252), and later a bronze bust of the general was set up by the dugout.
    What this sign meant, Ibragimova puts thus: the bust recalled the most tragic years of the conquest of the Caucasus and was a symbol of the dramatic fate of the mountain peoples, and the monument to the general who "with barbaric cruelty exterminated whole peoples in the name of the conquest of the Caucasus" became for Chechens "a kind of 'eyesore'"(Citation: 252).
    The sign outlived the empire: under Soviet rule the monument "was blown up by night with enviable regularity and just as regularly restored by night"(Citation: 252).
  uk: |-
    15 березня 1873 року затверджено герб Терської області: «У чорному щиті, срібна хвиляста перев'язь управо.
    Імператорський штандарт на золотому древку.
    Щит увінчаний давньою Царською Короною і оточений золотим дубовим листям, з'єднаним Александрівською стрічкою»(Citation: 252).
    Сенс знака історик З. Х. Ібрагімова читає так: срібна перев'язь - це Терек, який довго був кордоном, а тепер «обидва його береги були об'єднані Імператорським штандартом, і Терек став повністю російським - такий основний сенс цього герба»(Citation: 252).
    Проєкт герба міста Грозного виконав Б. В. Кене, чиновник герольдії: на лазуровому щиті срібна гора між двома золотими морськими ліліями, а в правій вільній частині - герб Терської області(Citation: 252), тож міський знак ніс на собі імперський символ області.
    Землю мітили й фігурою завойовника.
    Першим пам'ятником Єрмолову в Грозному слугувала «дбайливо збережена землянка, в якій він жив під час заснування фортеці Грозної»(Citation: 252), а пізніше біля землянки став бронзовий бюст генерала.
    Що означав цей знак, Ібрагімова формулює так: бюст нагадував про найтрагічніші роки завоювання Кавказу і був символом драматичної долі горських народів, а пам'ятник генералові, що «з варварською жорстокістю винищував цілі народи в ім'я завоювання Кавказу», став для чеченців «свого роду «більмом на оці»»(Citation: 252).
    Знак пережив імперію: за радянської влади пам'ятник «із завидною періодичністю підривали ночами і так само ночами відновлювали»(Citation: 252).
  ru: |-
    15 марта 1873 года утверждён герб Терской области: «В черном щите, серебряная волнообразная перевязь вправо.
    Императорский штандарт на золотом древке.
    Щит увенчан древней Царской Короной и окружен золотыми дубовыми листьями, соединенными Александровской лентой»(Citation: 252).
    Смысл знака историк З. Х. Ибрагимова читает так: серебряная перевязь - это Терек, который долго был границей, а теперь «оба его берега были объединены Императорским штандартом, и Терек стал полностью российским - таков основной смысл этого герба»(Citation: 252).
    Проект герба города Грозного выполнил Б. В. Кёне, чиновник герольдии: на лазоревом щите серебряная гора между двумя золотыми морскими лилиями, а в правой вольной части - герб Терской области(Citation: 252), так что городской знак нёс на себе имперский символ области.
    Землю метили и фигурой завоевателя.
    Первым памятником Ермолову в Грозном служила «заботливо сохраняемая землянка, в которой он жил при основании крепости Грозной»(Citation: 252), а позже у землянки встал бронзовый бюст генерала.
    Что значил этот знак, Ибрагимова формулирует так: бюст напоминал о самых трагических годах завоевания Кавказа и был символом драматической судьбы горских народов, а памятник генералу, «с варварской жестокостью истреблявшим целые народы во имя завоевания Кавказа», стал для чеченцев «своего рода «бельмом на глазу»»(Citation: 252).
    Знак пережил империю: при советской власти памятник «с завидной периодичностью взрывали по ночам и так же по ночам восстанавливали»(Citation: 252).
