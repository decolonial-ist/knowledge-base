description:
  ru: |-
    «Положение о видах на жительство» 1894 года закрепило сословное неравенство: дворяне, чиновники и купцы получали бессрочные паспортные книжки, приписанные к сельским обществам горцы - книжки на пять лет либо краткосрочные паспорта и билеты на отлучку(Citation: 252).
    Действие режима историк З. Х. Ибрагимова формулирует по материалам области: «Терские горцы, в случае появления своего за Кубанью или в других частях Российской империи без паспортов, считались бродягами и злоумышленниками и как таковые наказывались»; она же пишет: «Паспортная система служила для администрации Терской области излюбленным средством стеснения даже хорошо ей известных лиц»(Citation: 252).
    Внутри области действовал режим отлучек: разрешение отлучиться до месяца давал сельский старшина, на больший срок - начальник округа; самовольная отлучка наказывалась штрафом, арестом или общественными работами, а переселиться из одного общества в другое горец не мог без согласия двух сельских общин — той, которую покидал, и той, куда переходил(Citation: 125).
  en: |-
    The 1894 "Regulation on Residence Permits" enshrined estate inequality: nobles, officials and merchants received passport books of unlimited duration, while highlanders ascribed to village communities received five-year books or short-term passports and bilets (written passes) for absence(Citation: 252).
    Historian Z. Kh.
    Ibragimova states the regime's effect from the oblast's records: "Terek highlanders, should they appear beyond the Kuban or in other parts of the Russian Empire without passports, were considered vagrants and malefactors and were punished as such"; she also writes: "The passport system served the administration of the Terek oblast as a favourite means of constraining even persons well known to it"(Citation: 252).
    Inside the oblast a regime of absences operated: leave of up to a month was granted by the village elder, for a longer term - by the okrug head; unauthorized absence was punished by fine, arrest or public works, and a highlander could not move from one community to another without the consent of two village communities - the one he was leaving and the one he was joining(Citation: 125).
  uk: |-
    «Положення про види на проживання» 1894 року закріпило станову нерівність: дворяни, чиновники та купці отримували безстрокові паспортні книжки, приписані до сільських громад горці - книжки на п'ять років або короткострокові паспорти й білети на відлучку(Citation: 252).
    Дію режиму історик З. Х. Ібрагімова формулює за матеріалами області: «Терські горці, у разі появи своєї за Кубанню або в інших частинах Російської імперії без паспортів, вважалися бродягами і зловмисниками і як такі каралися»; вона ж пише: «Паспортна система слугувала для адміністрації Терської області улюбленим засобом утиску навіть добре їй відомих осіб»(Citation: 252).
    Усередині області діяв режим відлучок: дозвіл відлучитися до місяця давав сільський старшина, на більший строк - начальник округу; самовільна відлучка каралася штрафом, арештом або громадськими роботами, а переселитися з однієї громади до іншої горець не міг без згоди двох сільських громад - тієї, яку залишав, і тієї, куди переходив(Citation: 125).
