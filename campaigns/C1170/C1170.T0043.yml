description:
  en: |-
    The Groznaya fortress, founded by General Yermolov on the Sunzha on 10 June 1818(Citation: 251), became the town of Grozny in 1870(Citation: 125).
    On 21 March 1888, by decree of Emperor Alexander III, the names of peoples were erased from the names of the okrugs of the Terek oblast: the Chechen okrug was renamed the Grozny okrug, the Ingush - the Nazran, the Kabardian - the Nalchik, the Kumyk - the Khasav-Yurt, the Military-Ossetian - the Vladikavkaz(Citation: 252).
    Okrugs named after the peoples living in them received the names of imperial fortresses and slobodas - the map of governance ceased to call the peoples by name.
  uk: |-
    Фортеця Грозна, закладена генералом Єрмоловим на Сунжі 10 червня 1818 року(Citation: 251), у 1870 році стала містом Грозним(Citation: 125). 21 березня 1888 року указом імператора Олександра III з назв округів Терської області стерто імена народів: Чеченський округ перейменовано на Грозненський, Інгуський - на Назрановський, Кабардинський - на Нальчицький, Кумицький - на Хасав-Юртовський, Військово-Осетинський - на Владикавказький(Citation: 252).
    Округи, названі за народами, що в них живуть, отримали імена імперських фортець і слобід - карта управління перестала називати народи на ім'я.
  ru: |-
    Крепость Грозная, заложенная генералом Ермоловым на Сунже 10 июня 1818 года(Citation: 251), в 1870 году стала городом Грозным(Citation: 125). 21 марта 1888 года указом императора Александра III из названий округов Терской области стёрты имена народов: Чеченский округ переименован в Грозненский, Ингушский - в Назрановский, Кабардинский - в Нальчикский, Кумыкский - в Хасав-Юртовский, Военно-Осетинский - во Владикавказский(Citation: 252).
    Округа, названные по живущим в них народам, получили имена имперских крепостей и слобод - карта управления перестала называть народы по имени.
