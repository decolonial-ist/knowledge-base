description:
  ru: |-
    Ещё в 1880 году указом наместника из слободы Шатой высланы все горцы - «вследствие уменьшения русских в слободе» - с запретом впредь селиться(Citation: 252). 14 мая 1893 года началось выселение горцев из городов и слободок области; запреты снимались поэтапно десятилетиями: для Грозного - 18 марта 1901 года, для слободы Воздвиженской - 27 февраля 1906 года, для Ведено и Шатоя - только 10 мая 1916 года(Citation: 252).
    Отмену начальник области обосновывал не правами выселенных - он ходатайствовал об отмене закона 14 мая 1893 года как «служащего тормозом к обрусению племён»(Citation: 252).
    Приказом от 26 августа 1898 года начальник гарнизона укрепления Шатой запретил вход в укрепление без билета - население трёх участков осталось без доступа к почтово-телеграфной конторе, сберегательной кассе и аптеке(Citation: 252).
  en: |-
    As early as 1880, by decree of the viceroy, all highlanders were expelled from the Shatoy sloboda - "owing to the decrease of Russians in the sloboda" - with a ban on settling there henceforth(Citation: 252).
    On 14 May 1893 the eviction of highlanders from the towns and slobodas of the oblast began; the bans were lifted piecemeal over decades: for Grozny - on 18 March 1901, for the Vozdvizhenskaya sloboda - on 27 February 1906, for Vedeno and Shatoy - only on 10 May 1916(Citation: 252).
    The head of the oblast justified the repeal not by the rights of the evicted - he petitioned for the repeal of the law of 14 May 1893 as one "serving as a brake on the Russification of the tribes"(Citation: 252).
    By order of 26 August 1898 the head of the garrison of the Shatoy fortification banned entry into the fortification without a bilet - the population of three uchastoks was left without access to the post and telegraph office, the savings bank and the pharmacy(Citation: 252).
  uk: |-
    Ще 1880 року указом намісника зі слободи Шатой вислано всіх горців - «внаслідок зменшення росіян у слободі» - із забороною надалі селитися(Citation: 252). 14 травня 1893 року почалося виселення горців з міст і слобідок області; заборони знімалися поетапно десятиліттями: для Грозного - 18 березня 1901 року, для слободи Воздвиженської - 27 лютого 1906 року, для Ведена і Шатоя - лише 10 травня 1916 року(Citation: 252).
    Скасування начальник області обґрунтовував не правами виселених - він клопотав про скасування закону 14 травня 1893 року як «такого, що слугує гальмом обрусінню племен»(Citation: 252).
    Наказом від 26 серпня 1898 року начальник гарнізону укріплення Шатой заборонив вхід до укріплення без білета - населення трьох дільниць залишилося без доступу до поштово-телеграфної контори, ощадної каси та аптеки(Citation: 252).
