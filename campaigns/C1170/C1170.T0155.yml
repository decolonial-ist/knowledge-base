description:
  en: |-
    On 17 August 1884 the "Binding Decree on the Sale, Storage and Carrying of Combat Firearms in the Caucasus Krai" was approved: combat rifles - only under police permits, and the sale and purchase of army-pattern weapons were banned(Citation: 252).
    On 1 July 1899 the decree was tightened: previous permits were annulled, annual renewal was required, and weapons without a permit were confiscated and sold for the benefit of the treasury(Citation: 252).
    In 1892, by order of the head of the Terek oblast, all weapons with which highlanders appeared in Russian settlements were confiscated, including weapons brought for sale; from 1893 the authorities were allowed to search homes for weapons(Citation: 252).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov record the contrast: highlander militiamen in imperial service carried weapons at all times, "unlike ordinary highlanders, who could not appear armed outside their villages"(Citation: 125).
  uk: |-
    17 серпня 1884 року затверджено «Обов'язкову постанову про продаж, зберігання і носіння бойової вогнепальної зброї в Кавказькому краї»: бойові рушниці - лише за дозвільними свідоцтвами поліції, продаж і купівлю зброї армійського зразка заборонено(Citation: 252). 1 липня 1899 року постанову посилено: колишні свідоцтва анульовано, вимагалося щорічне переоформлення, зброю без свідоцтва вилучали і продавали в дохід казни(Citation: 252).
    У 1892 році за розпорядженням начальника Терської області конфісковували всю зброю, з якою горці з'являлися в російських населених пунктах, включно з привезеною на продаж; з 1893 року владі дозволено обшуки зброї в домах(Citation: 252).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов фіксують контраст: міліціонери-горці на імперській службі носили зброю постійно, «на відміну від простих горців, які не могли озброєними з'являтися за межами своїх селищ»(Citation: 125).
  ru: |-
    17 августа 1884 года утверждено «Обязательное постановление о продаже, хранении и ношении боевого огнестрельного оружия в Кавказском крае»: боевые ружья - только по разрешительным свидетельствам полиции, продажа и покупка оружия армейского образца запрещены(Citation: 252). 1 июля 1899 года постановление ужесточено: прежние свидетельства аннулированы, требовалось ежегодное переоформление, оружие без свидетельства изымалось и продавалось в доход казны(Citation: 252).
    В 1892 году по распоряжению начальника Терской области конфисковывалось всё оружие, с которым горцы появлялись в русских населённых пунктах, включая привезённое на продажу; с 1893 года властям разрешены обыски оружия в домах(Citation: 252).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов фиксируют контраст: милиционеры-горцы на имперской службе носили оружие постоянно, «в отличие от простых горцев, которые не могли вооруженными появляться за пределами своих селений»(Citation: 125).
