description:
  ru: |-
    На постаменте памятника Хмельницкому (1888) империя отлила программное утверждение о прошлом: на лицевой стороне стояла фраза «Волим под царя восточного, православного», приписываемая Переяславской раде, а на правой - имперская формула «Богдану Хмельницкому – единая неделимая Россия»(Citation: 361).
    Сведённые вместе, они подавали события 1654 года как добровольный и окончательный выбор в пользу единого русского государства, а всю историю Гетманщины - как путь к этому выбору.
  en: |-
    On the pedestal of the Khmelnytsky monument (1888) the empire cast a programmatic statement about the past: on the front side stood the phrase "We will to be under the tsar of the east, the Orthodox one," attributed to the Pereiaslav Rada, and on the right - the imperial formula "To Bohdan Khmelnytsky – one and indivisible Russia"(Citation: 361).
    Brought together, they presented the events of 1654 as a voluntary and final choice in favor of a single Russian state, and the entire history of the Hetmanate as the road to that choice.
  uk: |-
    На постаменті пам'ятника Хмельницькому (1888) імперія відлила програмне твердження про минуле: на лицьовому боці стояла фраза «Волим под царя восточного, православного», приписувана Переяславській раді, а на правому - імперська формула «Богдану Хмельницкому – единая неделимая Россия»(Citation: 361).
    Зведені разом, вони подавали події 1654 року як добровільний і остаточний вибір на користь єдиної російської держави, а всю історію Гетьманщини - як шлях до цього вибору.
