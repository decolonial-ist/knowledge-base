description:
  ru: |-
    Российская империя 11 июля 1888 года открыла на Софийской площади Киева памятник Богдану Хмельницкому - знак «единения» с Москвой: на левой стороне постамента стояли даты «1654-1888», отсчитывавшие историю города от Переяславской рады(Citation: 361).
    Комитет по сооружению возглавлял Михаил Юзефович(Citation: 361) - чиновник киевского учебного округа, автор записки, легшей в основу Эмского указа 1876 года(Citation: 362).
    Совещание, созванное по этой записке и заседавшее с участием Юзефовича, постановило «не допускать ввоза в пределы империи, без особого на то разрешения Главного управления по делам печати, каких бы то ни было книг и брошюр, издаваемых за границею на малорусском наречии», а «печатание и издание в империи оригинальных произведений и переводов на том же наречии воспретить, за исключением лишь: а) исторических документов и памятников и б) произведений изящной словесности» - причём последние допускались только в русском правописании и по рукописи, просмотренной цензурой(Citation: 386).
    По декрету Совнаркома УССР от 7 мая 1919 года о снесении с площадей и улиц памятников, поставленных царям и царским прихвостням, с постамента сбили две надписи из трёх; оставшуюся распорядился снять председатель Киевского губисполкома Гринько - об этом 6 февраля 1925 года записал в дневнике академик Ефремов, - и в итоге боковые плиты заменили на пустые, а на лицевом камне выбили «Богдан Хмельницький 1888»(Citation: 361).
  en: |-
    On 11 July 1888 the Russian Empire unveiled the Bohdan Khmelnytsky monument on Sophia Square in Kyiv - a sign of "unity" with Moscow: on the left side of the pedestal stood the dates "1654-1888," counting the city's history from the Pereiaslav Rada(Citation: 361).
    The committee for its construction was headed by Mikhail Yuzefovich(Citation: 361) - an official of the Kyiv educational district and author of the memorandum that formed the basis of the Ems ukase of 1876(Citation: 362).
    The conference convened over that memorandum, sitting with Yuzefovich's participation, resolved "not to permit the import into the empire, without special authorization of the Main Administration for Press Affairs, of any books or brochures whatsoever published abroad in the Little Russian dialect," and "to forbid the printing and publishing in the empire of original works and translations in that dialect, with the sole exceptions of: a) historical documents and monuments and b) works of belles-lettres" - the latter permitted only in Russian orthography and from a manuscript reviewed by the censorship(Citation: 386).
    Under the decree of the Council of People's Commissars of the Ukrainian SSR of 7 May 1919 on removing from squares and streets the monuments put up to tsars and tsarist minions, two of the three inscriptions were knocked off the pedestal; the remaining one was ordered removed by Hrynko, chairman of the Kyiv gubernia executive committee - academician Yefremov recorded this in his diary on 6 February 1925 - and in the end the side plaques were replaced with blank ones, while "Bohdan Khmelnytskyi 1888" was carved on the front stone(Citation: 361).
  uk: |-
    Російська імперія 11 липня 1888 року відкрила на Софійській площі Києва пам'ятник Богданові Хмельницькому - знак «єднання» з Москвою: на лівому боці постамента стояли дати «1654-1888», що відлічували історію міста від Переяславської ради(Citation: 361).
    Комітет із спорудження очолював Михайло Юзефович(Citation: 361) - чиновник київського навчального округу, автор записки, що лягла в основу Емського указу 1876 року(Citation: 362).
    Нарада, скликана за цією запискою і проведена за участю Юзефовича, постановила «не допускати ввозу в межі імперії, без особливого на те дозволу Головного управління у справах друку, будь-яких книг і брошур, що видаються за кордоном малоруським наріччям», а «друкування й видання в імперії оригінальних творів і перекладів тим самим наріччям заборонити, за винятком лише: а) історичних документів і пам'яток та б) творів красного письменства» - причому останні допускалися лише в російському правописі та за рукописом, переглянутим цензурою(Citation: 386).
    За декретом Раднаркому УСРР від 7 травня 1919 року про знесення з площ і вулиць пам'ятників, поставлених царям і царським посіпакам, з постамента збили два написи з трьох; той, що лишився, розпорядився зняти голова Київського губвиконкому Гринько - про це 6 лютого 1925 року записав у щоденнику академік Єфремов, - і зрештою бічні плити замінили на порожні, а на лицьовому камені вибили «Богдан Хмельницький 1888»(Citation: 361).
