name:
  en: The Bohdan Khmelnytsky Monument (1888)
  uk: Пам'ятник Богданові Хмельницькому (1888)
  ru: Памятник Богдану Хмельницкому (1888)
description:
  en: |-
    In 1888 the Russian Empire put up in central Kyiv a monument to Bohdan Khmelnytsky - a sign of the city's belonging to the empire and of "unity" with Moscow.
    The pedestal bore programmatic inscriptions: "We will to be under the tsar of the east, the Orthodox one" and "To Bohdan Khmelnytsky – one and indivisible Russia"(Citation: 361).
    The monument was unveiled on 11 July 1888 on Sophia Square; the committee for its construction was headed by Mikhail Yuzefovich - an official of the Kyiv educational district and author of the memorandum that formed the basis of the Ems ukase of 1876(Citation: 361)(Citation: 362).
  uk: |-
    Російська імперія 1888 року поставила в центрі Києва пам'ятник Богданові Хмельницькому - знак належності міста до імперії та «єднання» з Москвою.
    Постамент ніс програмні написи: «Волим под царя восточного, православного» і «Богдану Хмельницкому – единая неделимая Россия»(Citation: 361).
    Монумент відкрили 11 липня 1888 року на Софійській площі; комітет із спорудження очолював Михайло Юзефович - чиновник київського навчального округу, автор записки, що лягла в основу Емського указу 1876 року(Citation: 361)(Citation: 362).
  ru: |-
    Российская империя в 1888 году поставила в центре Киева памятник Богдану Хмельницкому - знак принадлежности города к империи и «единения» с Москвой.
    Постамент нёс программные надписи: «Волим под царя восточного, православного» и «Богдану Хмельницкому – единая неделимая Россия»(Citation: 361).
    Монумент открыли 11 июля 1888 года на Софийской площади; комитет по сооружению возглавлял Михаил Юзефович - чиновник киевского учебного округа, автор записки, легшей в основу Эмского указа 1876 года(Citation: 361)(Citation: 362).
