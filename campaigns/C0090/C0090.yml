name:
  en: Information Blockade Around the Chornobyl Disaster (1986)
  uk: Інформаційна блокада навколо Чорнобильської катастрофи (1986)
  ru: Информационная блокада вокруг Чернобыльской катастрофы (1986)
description:
  en: |-
    The ultimate manifestation of the colonial administration's disregard for the lives of the local population.
    After the explosion at the Chornobyl Nuclear Power Plant, the union center concealed the scale of the radiation threat: "the concealment of information about the catastrophe from the public was initiated by the country's leadership," and "the maps of radioactive contamination of lands remained classified until 1990"(Citation: 237).
    People were deprived of the right to protection - "the population was not warned of the danger and was given no recommendations," and, "despite the fact that in Kyiv the radiation dose rate increased more than a hundredfold, neither the May Day demonstration nor the Peace Cycling Race was cancelled"(Citation: 237)(Citation: 38).
  uk: |-
    Найвищий прояв зневаги колоніальної адміністрації до життя місцевого населення.
    Після вибуху на ЧАЕС союзний центр приховував масштаби радіаційної загрози: «приховування від громадськості інформації про катастрофу ініційоване керівництвом країни», а «карти радіоактив. забруднення земель залишалися засекреченими до 1990»(Citation: 237).
    Людей позбавили права на захист - населення «не попереджали про небезпеку і не давали жодних рекомендацій», і, «незважаючи на те, що в Києві у понад сто разів зросла потужність дози опромінення, не відмінили ні Першотравневу демонстрацію, ні Велогонку Миру»(Citation: 237)(Citation: 38).
  ru: |-
    Высшее проявление пренебрежения колониальной администрации к жизни местного населения.
    После взрыва на ЧАЭС союзный центр скрывал масштабы радиационной угрозы: «сокрытие от общественности информации о катастрофе инициировано руководством страны», а «карты радиоактивного загрязнения земель оставались засекреченными до 1990»(Citation: 237).
    Людей лишили права на защиту - населення «не предупреждали об опасности и не давали никаких рекомендаций», и, «несмотря на то, что в Киеве более чем в сто раз выросла мощность дозы облучения, не отменили ни Первомайскую демонстрацию, ни Велогонку Мира»(Citation: 237)(Citation: 38).
