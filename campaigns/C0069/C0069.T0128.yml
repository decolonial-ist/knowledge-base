description:
  ru: 'Силовое подавление протестов и репрессивные меры против национальной самоорганизации того же периода: столыпинское «распоряжение губернаторам… с требованием прекратить регистрацию «инородческих», в т. ч. и украинских, национальных культурно-просветительских обществ»(Citation: 196).'
  en: 'The forcible suppression of protests and repressive measures against national self-organization of the same period: Stolypin''s "instruction to the governors… demanding a halt to the registration of ''alien,'' including Ukrainian, national cultural-educational societies"(Citation: 196).'
  uk: 'Силове придушення протестів і репресивні заходи проти національної самоорганізації того ж періоду: столипінське «розпорядження губернаторам… з вимогою припинити реєстрацію «інородчеських», у т. ч. і українських, нац. культурно-просвітницьких т-в»(Citation: 196).'
