name:
  en: Stolypin Repressions and Mass Displacement (1906–1914)
  uk: Столипінські репресії та масове виселення (1906–1914)
  ru: Столыпинские репрессии и массовое выселение (1906–1914)
description:
  en: |-
    The suppression of protests and an agrarian reform that economically squeezed Ukrainian peasants off their native lands: "The resettlement movement gained great momentum, and during 1906–12 about 1 million people left Ukraine for Asiatic Russia…
    The majority of migrants were landless and land-poor peasants (67%)"(Citation: 196) – nearly a quarter of the resettlers, failing to take root, returned.
  uk: |-
    Придушення протестів та аграрна реформа, що економічно видавлювала українських селян із рідних земель: «Переселенський рух набув великого розмаху і впродовж 1906—12 з України до Азіатської Росії виїхало бл. 1 млн осіб…
    Більшість мігрантів становили безземельні і малоземельні селяни (67%)»(Citation: 196) – майже чверть переселенців, не закріпившись, повернулася назад.
  ru: |-
    Подавление протестов и аграрная реформа, экономически выдавливавшая украинских крестьян с родных земель: «Переселенческое движение приобрело большой размах, и на протяжении 1906—12 из Украины в Азиатскую Россию выехало ок. 1 млн человек…
    Большинство мигрантов составляли безземельные и малоземельные крестьяне (67%)»(Citation: 196) – почти четверть переселенцев, не закрепившись, вернулась назад.
