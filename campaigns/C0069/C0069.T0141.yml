description:
  en: |-
    The economic squeezing of peasants onto the imperial frontier under the guise of free choice: "during 1906–12 about 1 million people left Ukraine for Asiatic Russia.
    The largest number of resettlers came from Left-Bank Ukraine, whose peasantry suffered from land scarcity"(Citation: 196); land and credit were unobtainable at home, while "Low land prices beyond the Urals and encouraging government credits… attracted the poor peasantry and prompted it to migrate"(Citation: 196) – state coercion was disguised as voluntary resettlement.
  uk: |-
    Економічне видавлювання селян на імперський фронтир під виглядом вільного вибору: «впродовж 1906—12 з України до Азіатської Росії виїхало бл. 1 млн осіб.
    Найбільше переселенців прибуло з Лівобережної України, селянство якої страждало від малоземелля»(Citation: 196); землі й кредиту вдома було не отримати, тоді як «Низькі ціни на землю за Уралом, заохочувальні урядові кредити… приваблювали бідне селянство та спонукали його до міграції»(Citation: 196) – державний примус маскувався під добровільне переселення.
  ru: |-
    Экономическое выдавливание крестьян на имперский фронтир под видом свободного выбора: «на протяжении 1906—12 из Украины в Азиатскую Россию выехало ок. 1 млн человек.
    Больше всего переселенцев прибыло из Левобережной Украины, крестьянство которой страдало от малоземелья»(Citation: 196); земли и кредита дома было не получить, тогда как «Низкие цены на землю за Уралом, поощрительные правительственные кредиты… привлекали бедное крестьянство и побуждали его к миграции»(Citation: 196) – государственное принуждение маскировалось под добровольное переселение.
