description:
  ru: |-
    Уничтожение политического руководства, поддержавшего гетмана: за Мазепой пошла «вся (!) генеральная старшина», а из левобережных полковников остались верны царю лишь четверо(Citation: 4).
    Следствие над старшиной велось из царской ставки, где «находясь в Лебедине и Сумах, Петр и Меншиков в январе 1709 года» руководили расправой(Citation: 4).
    Церковное наказание оформили по прямому распоряжению царя - письмом от 31 октября 1708 года (№ 2795) Пётр I предписал митрополиту Стефану Яворскому: «изволте онаго за такое ево дело публично в саборной церкви проклятию предать...»(Citation: 4)(Citation: 394).
  en: |-
    The destruction of the political leadership that supported the hetman: "the entire (!) general starshyna" followed Mazepa, and of the Left-Bank colonels only four remained loyal to the tsar(Citation: 4).
    The investigation of the officers was directed from the tsar's headquarters, where "being at Lebedyn and Sumy, Peter and Menshikov in January 1709" oversaw the reprisals(Citation: 4).
    The ecclesiastical punishment was arranged by the tsar's direct order - by a letter of 31 October 1708 (No. 2795) Peter I instructed metropolitan Stefan Yavorsky: "be pleased to have him, for such a deed of his, publicly cursed in the cathedral church..."(Citation: 4)(Citation: 394).
  uk: |-
    Знищення політичного керівництва, що підтримало гетьмана: за Мазепою пішла «вся (!) генеральна старшина», а з лівобережних полковників залишилися вірними цареві лише четверо(Citation: 4).
    Слідство над старшиною велося з царської ставки, де «перебуваючи в Лебедині й Сумах, Петро і Меншиков у січні 1709 року» керували розправою(Citation: 4).
    Церковне покарання оформили за прямим розпорядженням царя - листом від 31 жовтня 1708 року (№ 2795) Петро I приписав митрополитові Стефану Яворському: «звольте оного за таке його діло публічно в соборній церкві прокляттю віддати...»(Citation: 4)(Citation: 394).
