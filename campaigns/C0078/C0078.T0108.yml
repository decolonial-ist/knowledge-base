description:
  en: |-
    The introduction of the "blackboard" regime - a total economic blockade of settlements.
    The resolution of the Council of People's Commissars of the Ukrainian SSR and the CC of the CP(b)U of December 6, 1932, signed by Chubar and Kosior, prescribed "the immediate cessation of the delivery of goods, the complete cessation of cooperative and state trade on site, and the removal of all available goods from the respective cooperative and state shops," as well as "a complete ban on kolkhoz trade both for kolkhozes and kolkhoz members and for individual farmers"(Citation: 239).
  uk: |-
    Запровадження режиму «чорних дощок» - повної економічної блокади населених пунктів.
    Постанова РНК УСРР і ЦК КП(б)У від 6 грудня 1932 року, підписана Чубарем і Косіором, приписувала «негайне припинення підвозу товарів, повне припинення кооперативної і державної торгівлі на місці та вивіз із відповідних кооперативних і державних крамниць усіх наявних товарів», а також «повна заборона колгоспної торгівлі як для колгоспів, колгоспників, так і одноосібників»(Citation: 239).
  ru: |-
    Введение режима «черных досок» - полной экономической блокады населенных пунктов.
    Постановление СНК УССР и ЦК КП(б)У от 6 декабря 1932 года, подписанное Чубарем и Косиором, предписывало «немедленное прекращение подвоза товаров, полное прекращение кооперативной и государственной торговли на месте и вывоз из соответствующих кооперативных и государственных лавок всех наличных товаров», а также «полное запрещение колхозной торговли как для колхозов, колхозников, так и единоличников»(Citation: 239).
