name:
  en: 'Terror by Famine: The Holodomor (1932–1933)'
  uk: 'Терор голодом: Голодомор (1932–1933)'
  ru: 'Террор голодом: Голодомор (1932–1933)'
description:
  en: |-
    The use of artificial famine as a weapon of mass destruction for the physical and psychological suppression of national resistance.
    The launch of a merciless grain-procurement machine, the confiscation of absolutely all food, the introduction of the "blackboard" regime (a total blockade of settlements)(Citation: 239), and a ban prohibiting peasants from leaving the starving districts: the directive of Stalin and Molotov of January 22, 1933 ordered "not to allow the mass departure of peasants from Ukraine to other regions," declaring the flight of the starving "for bread" a plot "organized by enemies of Soviet power, SRs and agents of Poland"(Citation: 235).
    Physical extermination was accompanied by total psychological terror and show trials(Citation: 22).
  uk: |-
    Застосування штучного голоду як зброї масового ураження для фізичного та психологічного придушення національного опору.
    Запуск машини хлібозаготівель: конфіскація всього продовольства, запровадження режиму «чорних дощок» (повна блокада населених пунктів)(Citation: 239) та заборона селянам виїжджати з голодуючих районів: директива Сталіна і Молотова від 22 січня 1933 року наказувала «не допускати масовий виїзд селян з України в інші краї», оголосивши втечу голодуючих «за хлібом» змовою, яку «організовано ворогами Радянської влади, есерами й агентами Польщі»(Citation: 235).
    Фізичне знищення супроводжувалося тотальним психологічним терором і показовими судами(Citation: 22).
  ru: |-
    Применение искусственного голода как оружия массового поражения для физического и психологического подавления национального сопротивления.
    Запуск машины хлебозаготовок: конфискация всего продовольствия, введение режима «черных досок» (полная блокада населенных пунктов)(Citation: 239) и запрет для крестьян на выезд из голодающих районов: директива Сталина и Молотова от 22 января 1933 года предписывала «не допускать массовый выезд крестьян из Украины в другие края», объявив бегство голодающих «за хлебом» заговором, который «организован врагами Советской власти, эсерами и агентами Польши»(Citation: 235).
    Физическое уничтожение сопровождалось тотальным психологическим террором и показательными судами(Citation: 22).
