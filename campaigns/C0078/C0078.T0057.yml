description:
  en: 'Lethally dangerous exploitation of the labor of Ukrainian peasants, convicted en masse under the "law of five ears of grain" and exiled to corrective labor camps during the Holodomor(Citation: 22).'
  uk: 'Смертельно небезпечна експлуатація праці Українських селян, масово засуджених за «законом про п''ять колосків» і засланих до виправно-трудових таборів у період Голодомору(Citation: 22).'
  ru: 'Смертельно опасная эксплуатация труда украинских крестьян, массово осужденных по «закону о пяти колосках» и сосланных в исправительно-трудовые лагеря в период Голодомора(Citation: 22).'
