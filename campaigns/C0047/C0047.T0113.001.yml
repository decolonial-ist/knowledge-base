description:
  en: 'A total legislative ban on the language: "Not to permit the import into the empire… of any books whatsoever published abroad in the Little Russian dialect"; "To forbid likewise any stage performances, texts to musical scores, and public readings in the same dialect"(Citation: 153).'
  uk: 'Тотальна законодавча заборона мови: «Не допускати ввозу в межі імперії… будь-яких книг, видаваних за кордоном малоруським наріччям»; «Заборонити так само всілякі тим самим наріччям сценічні вистави, тексти до нот і публічні читання»(Citation: 153).'
  ru: 'Тотальный законодательный запрет языка: «Не допускать ввоза в пределы империи… каких бы то ни было книг, издаваемых за границей на малорусском наречии»; «Воспретить равномерно всякие на том же наречии сценические представления, тексты к нотам и публичные чтения»(Citation: 153).'
