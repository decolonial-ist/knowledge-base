description:
  ru: |-
    Послабление, которое на деле было выбором между двумя чужими орфографиями: пересмотр 1881 года разрешил печатать словари, но «под условием печатания их с соблюдением общерусского правописания или правописания, употреблявшегося в Малороссии не позже XVIII в.»(Citation: 386).
    То есть допускались либо орфография метрополии, либо архаичная - современная украинская не допускалась ни в каком виде.
    Тем же документом сценические тексты к нотам разрешили печатать только «при условии общепринятого русского правописания», а спектакли на украинском поставили в зависимость от разрешения администрации: «драматические пьесы, сцены и куплеты на малорусском наречии... могут быть исполняемы на сцене, с особою однако каждый раз разрешения генерал-губернаторов, а в местностях, не подчинённых генерал-губернаторам - с разрешения губернаторов»(Citation: 386).
  en: |-
    A concession that was in fact a choice between two alien orthographies: the 1881 revision allowed dictionaries to be printed, but "on condition of their being printed in conformity with all-Russian orthography, or with the orthography used in Little Russia no later than the 18th century"(Citation: 386).
    That is, either the metropole's orthography or an archaic one was admissible - contemporary Ukrainian orthography was not allowed in any form.
    The same document permitted stage texts to musical scores to be printed only "on condition of generally accepted Russian orthography," and made Ukrainian-language performances dependent on administrative permission: "dramatic plays, scenes and couplets in the Little Russian dialect... may be performed on stage, each time, however, with the special permission of the governors-general, and in localities not subordinate to governors-general - with the permission of the governors"(Citation: 386).
  uk: |-
    Послаблення, що насправді було вибором між двома чужими орфографіями: перегляд 1881 року дозволив друкувати словники, але «за умови друкування їх з дотриманням загальноросійського правопису або правопису, що вживався в Малоросії не пізніше XVIII ст.»(Citation: 386).
    Тобто допускалися або орфографія метрополії, або архаїчна - сучасна українська не допускалася в жодному вигляді.
    Тим самим документом сценічні тексти до нот дозволили друкувати лише «за умови загальноприйнятого російського правопису», а вистави українською поставили в залежність від дозволу адміністрації: «драматичні п'єси, сцени і куплети малоруським наріччям... можуть виконуватися на сцені, щоразу, однак, з особливого дозволу генерал-губернаторів, а в місцевостях, не підпорядкованих генерал-губернаторам, - з дозволу губернаторів»(Citation: 386).
