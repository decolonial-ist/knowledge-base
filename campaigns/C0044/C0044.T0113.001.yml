description:
  ru: 'Массовое изъятие национальной учебной и духовной литературы: «в 1769 г. Св. Синодъ не только не разрѣшилъ печатанія южно-русскихъ букварей, но предписалъ отобрать уже находящіеся на рукахъ, такъ какъ буквари того времени разсматривались какъ церковныя книги»(Citation: 159).'
  en: 'The mass confiscation of national educational and religious literature: "in 1769 the Holy Synod not only refused permission to print South Russian primers, but ordered the confiscation of those already in people''s hands, since the primers of that time were regarded as church books"(Citation: 159).'
  uk: 'Масове вилучення національної навчальної та духовної літератури: «1769 р. Св. Синод не тільки не дозволив друкування південноруських букварів, а й приписав відібрати ті, що вже були на руках, оскільки букварі того часу розглядалися як церковні книги»(Citation: 159).'
