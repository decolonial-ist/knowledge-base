description:
  en: 'The displacement of the local population''s language from the sacred sphere: metropolitan Samuil Myslavsky''s order of 26 October 1784 demanded that students and future priests practice "the reading of church books of every kind, and above all the Bible, acquiring a good and pure pronunciation" - after the Moscow model instead of the Ukrainian church tradition, under the threat of expulsion from the clerical estate(Citation: 415), and in 1786 metropolitan Myslavsky prescribed to the clergy the unification of pronunciation and orthography along the Russian model(Citation: 181).'
  uk: 'Витіснення мови місцевого населення із сакральної сфери: наказ митрополита Самуїла Миславського від 26 жовтня 1784 року вимагав, щоб студенти й майбутні священники вправлялися «в читанні церковних усякого роду книг, а надто Біблії, з набуттям доброї та чистої вимови» - за московським зразком замість української церковної традиції, під загрозою виключення з духовного відомства(Citation: 415), а 1786 року митрополит Миславський приписав духовенству уніфікацію вимови та правопису за російським зразком(Citation: 181).'
  ru: 'Вытеснение языка местного населения из сакральной сферы: наказ митрополита Самуила Миславского от 26 октября 1784 года потребовал, чтобы студенты и будущие священники упражнялись «в чтении церковных всякого рода книг, а паче Библии, с приобретением хорошего и чистаго произношения» - по московскому образцу вместо украинской церковной традиции, под угрозой исключения из духовного ведомства(Citation: 415), а в 1786 году митрополит Миславский предписал духовенству унификацию произношения и правописания по российскому образцу(Citation: 181).'
