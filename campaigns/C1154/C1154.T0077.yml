description:
  ru: |-
    Зимой 1831-1832 годов генерал Вельяминов из лагеря у крепости Грозной направлял войска на чеченские селения в отместку за поддержку восстания: 23 декабря 1831 подполковник Засс, командир Моздокского казачьего полка, разорил хутора по правую сторону Сунжи против села Чертугай, а в феврале 1832 Вельяминов «предпринял экспедицию для наказания Чеченских деревень, лежащих от кр.
    Грозной, вверх по Сунже» - это признаёт имперское обозрение военных действий(Citation: 105).
    Имперский историк Волконский писал о цели набегов: «беспокоить неприятеля и отвлекать внимание его от наших пределов»(Citation: 116).
    Историк Я. З. Ахмадов фиксировал: «Другая большая экспедиция была направлена против чеченских аулов, расположенных по берегам Сунжи»(Citation: 125).
  en: |-
    In the winter of 1831–1832, General Velyaminov, from his camp near the Groznaya fortress, dispatched troops against Chechen settlements in revenge for their support of the uprising: on December 23, 1831, Lieutenant Colonel Zass, commander of the Mozdok Cossack Regiment, devastated the hamlets on the right side of the Sunzha opposite the village of Chertugai, and in February 1832 Velyaminov “undertook an expedition to punish the Chechen villages lying up the Sunzha from the Groznaya fortress” — this is acknowledged by the imperial survey of military operations(Citation: 105).
    The imperial historian Volkonsky wrote of the purpose of the raids: “to harass the enemy and divert his attention from our borders”(Citation: 116).
    The historian Ya.
    Z. Akhmadov recorded: “Another large expedition was directed against the Chechen auls situated along the banks of the Sunzha”(Citation: 125).
  uk: |-
    Взимку 1831–1832 років генерал Вельямінов із табору біля фортеці Грозної спрямовував війська на чеченські селища в помсту за підтримку повстання: 23 грудня 1831 підполковник Засс, командир Моздокського козачого полку, розорив хутори по правий бік Сунжі навпроти села Чертугай, а в лютому 1832 Вельямінов «здійснив експедицію для покарання чеченських сіл, що лежать від фортеці Грозної вгору по Сунжі» — це визнає імперський огляд воєнних дій(Citation: 105).
    Імперський історик Волконський писав про мету набігів: «непокоїти ворога та відвертати його увагу від наших меж»(Citation: 116).
    Історик Я. З. Ахмадов зафіксував: «Інша велика експедиція була спрямована проти чеченських аулів, розташованих на берегах Сунжі»(Citation: 125).
