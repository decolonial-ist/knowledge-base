description:
  en: |-
    On December 23, 1831, during the devastation of the hamlets near the village of Chertugai, Cossacks of the detachment of Lieutenant Colonel Zass, commander of the Mozdok Cossack Regiment, took three women captive.
    The imperial historian Volkonsky wrote: Zass “delivered three captive women to the camp”(Citation: 116).
  uk: |-
    23 грудня 1831 під час розорення хуторів біля села Чертугай козаки загону підполковника Засса, командира Моздокського козачого полку, захопили в полон трьох жінок.
    Імперський історик Волконський писав: Засс «доставив у табір трьох полонених жінок»(Citation: 116).
  ru: |-
    23 декабря 1831 при разорении хуторов у села Чертугай казаки отряда подполковника Засса, командира Моздокского казачьего полка, захватили в плен трёх женщин.
    Имперский историк Волконский писал: Засс «доставил в лагерь трёх пленных женщин»(Citation: 116).
