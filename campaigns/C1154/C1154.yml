name:
  en: 'Velyaminov''s winter raids on Chechen hamlets and villages along the Sunzha: capture of women and devastation of homesteads (1831-1832)'
  uk: 'Зимові набіги Вельямінова на чеченські хутори й села вздовж Сунжі: полонення жінок і розорення дворів (1831-1832)'
  ru: 'Зимние набеги Вельяминова на чеченские хутора и сёла по Сунже: пленение женщин и разорение дворов (1831-1832)'
description:
  en: |-
    In December 1831, General Velyaminov, without disbanding the detachment encamped near the fortress of Groznaya, switched to a tactic of raids on Chechen settlements.
    The imperial historian Volkonsky wrote: Velyaminov “decided to harass the enemy and divert his attention from our borders.
    Thus, on December 23, 1831, he sent on a raid the commander of the Mozdok Cossack Regiment, Lieutenant Colonel Zass, who devastated several Chechen hamlets on the right side of the Sunzha, lying opposite the village of Chertugai, and delivered to the camp three captive women and up to 250 head of cattle.
    In this raid the enemy left 7 bodies on the spot”(Citation: 116).
    In February 1832 the raiding tactic grew into an expedition through the villages standing along the Sunzha River above the fortress of Groznaya.
    The imperial review of military operations admits: “Lieutenant General Velyaminov in February 1832 undertook an expedition to punish the Chechen villages lying up the Sunzha from the fortress of Groznaya”(Citation: 105).
    The historian Ya.
    Z. Akhmadov wrote of the same strike: “Another large expedition was directed against the Chechen auls located along the banks of the Sunzha”(Citation: 125).
  uk: |-
    У грудні 1831 року генерал Вельямінов, не розпускаючи загону, що стояв табором біля фортеці Грозної, перейшов до тактики набігів на чеченські селища.
    Імперський історик Волконський писав: Вельямінов «вирішив непокоїти ворога і відволікати його увагу від наших меж.
    Так, 23 грудня 1831 року він відправив у набіг командира Моздокського козачого полку підполковника Засса, який розорив по правий бік Сунжі кілька чеченських хуторів, що лежали навпроти с.
    Чертугай, і доставив у табір трьох полонених жінок та до 250 голів худоби.
    Під час цього набігу ворог залишив на місці 7 тіл»(Citation: 116).
    У лютому 1832 року набігова тактика переросла в експедицію селами, що стояли по річці Сунжі вище фортеці Грозної.
    Імперський огляд воєнних дій визнає: «ген.-л.
    Вельямінов у лютому 1832 року здійснив експедицію для покарання Чеченських сіл, що лежать від фортеці Грозної вгору по Сунжі»(Citation: 105).
    Історик Я. З. Ахмадов писав про той самий удар: «Інша велика експедиція була спрямована проти чеченських аулів, розташованих на берегах Сунжі»(Citation: 125).
  ru: |-
    В декабре 1831 года генерал Вельяминов, не распуская отряд, стоявший лагерем у крепости Грозной, перешёл к тактике набегов на чеченские селения.
    Имперский историк Волконский писал: Вельяминов «решил беспокоить неприятеля и отвлекать внимание его от наших пределов.
    Так, 23-го декабря 1831 года он направил в набег командира Моздокского казачьего полка подполковника Засса, который разорил по правую сторону Сунжи несколько чеченских хуторов, лежащих против с.
    Чертугая, и доставил в лагерь трёх пленных женщин и до 250 голов скота.
    При этом набеге неприятель оставил на месте 7 тел»(Citation: 116).
    В феврале 1832 набеговая тактика переросла в экспедицию по сёлам, стоявшим по реке Сунже выше крепости Грозной.
    Имперское обозрение военных действий признаёт: «ген.-л.
    Вельяминов в феврале 1832 года предпринял экспедицию для наказания Чеченских деревень, лежащих от кр.
    Грозной, вверх по Сунже»(Citation: 105).
    Историк Я. З. Ахмадов писал о том же ударе: «Другая большая экспедиция была направлена против чеченских аулов, расположенных по берегам Сунжи»(Citation: 125).
