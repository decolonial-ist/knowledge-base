name:
  ru: Уничтожение аула беженцев Узени-Юрт, вымогание заложников с Гельдигена и захват жителей Самашек на жатве (1826-1827)
  en: Destruction of the Refugee Aul of Uzeni-Yurt, Extortion of Hostages from Geldigen, and Capture of Samashki Residents at Harvest (1826-1827)
  uk: Знищення аулу біженців Узені-Юрт, вимагання заручників із Гельдигена та захоплення мешканців Самашок під час жнив (1826-1827)
description:
  ru: |-
    После карательного похода Ермолова, разорившего равнинные сёла нохчи в 1826 году, часть жителей истреблённых сёл отказалась переселяться под контроль завоевателя и укрылась в лесах.
    Имперский историк Потто признаёт: «жители некоторых аулов, истреблённых Ермоловым, укрылись в леса и, не желая выселяться, бросили даже свои поля, засеянные хлебом»(Citation: 78).
    Селение Узени-Юрт на берегу Аргуна стало прибежищем этих людей и опорой карабулакского предводителя Астемира, сподвижника Бейбулата Таймиева в восстании 1825 года.
    В ночь на 10 января 1827 генерал Лаптев, начальник левого фланга Кавказской линии, скрытно вывел на село отряд из 350 линейных казаков с двумя конными орудиями, принудив участвовать и четыреста чеченцев подчинённых обществ.
    Потто писал: они «переплыли Аргун и должны были идти обходной дорогой, чтобы отрезать жителям отступление к лесу»(Citation: 78).
    Предупреждённые всадником жители бежали за Аргун.
    Потто фиксировал: казаки, настигнув бегущих, «схватили... трёх женщин да убили и ранили человек пятнадцать», после чего «деревня Узени-Юрт, со всем имуществом и даже домашним скотом, была уничтожена до основания»(Citation: 78).
    Той же зимой Лаптев вытребовал с селения Гельдиген заложников, отвергнув выкуп за схваченного молодого гельдигенца.
    Потто писал: «Лаптев отверг все предложения и потребовал одного - аманатов»(Citation: 78).
    Летом 1827 сменивший его генерал Энгельгардт устроил засаду на жатве у аула Самашки.
    Потто признаёт: жителей свободно пропустили на поля, затем «всё, что находилось на поле, оказалось оцепленным густой казацкой цепью»; население отпустили, захватив в плен предводителя Тара-Адзуева и семью лидера сопротивления Бакара-Булатова, а хлеб галгаевцев, живших при ауле, «выжгли... на корню»(Citation: 78).
  en: |-
    After Yermolov's punitive campaign, which devastated the lowland villages of the Nokhchi in 1826, some inhabitants of the destroyed villages refused to resettle under the conqueror's control and took refuge in the forests.
    The imperial historian Potto admits: "the inhabitants of some auls destroyed by Yermolov took refuge in the forests and, unwilling to resettle, abandoned even their fields sown with grain"(Citation: 78).
    The village of Uzeni-Yurt on the bank of the Argun became a refuge for these people and a stronghold of the Karabulak leader Astemir, an associate of Beibulat Taimiev in the uprising of 1825.
    On the night of January 10, 1827, General Laptev, commander of the left flank of the Caucasus Line, covertly led against the village a detachment of 350 line Cossacks with two horse-drawn guns, forcing four hundred Chechens from subordinated communities to take part as well.
    Potto wrote: they "swam across the Argun and had to take a roundabout route in order to cut off the inhabitants' retreat to the forest"(Citation: 78).
    Warned by a horseman, the inhabitants fled across the Argun.
    Potto recorded: the Cossacks, overtaking those fleeing, "seized... three women and killed and wounded some fifteen people," after which "the village of Uzeni-Yurt, with all its property and even its livestock, was destroyed to the ground"(Citation: 78).
    That same winter Laptev exacted hostages from the village of Geldigen, rejecting a ransom for a captured young man of Geldigen.
    Potto wrote: "Laptev rejected all offers and demanded one thing - amanats (hostages)"(Citation: 78).
    In the summer of 1827 his successor, General Engelhardt, set an ambush during the harvest near the aul of Samashki.
    Potto admits: the inhabitants were freely allowed onto the fields, and then "everything that was in the field turned out to be encircled by a dense Cossack cordon"; the population was released, while the leader Tara-Adzuev and the family of the resistance leader Bakar-Bulatov were taken prisoner, and the grain of the Galgai, who lived by the aul, was "burned... standing in the field"(Citation: 78).
  uk: |-
    Після карального походу Єрмолова, що розорив рівнинні села Нохчі 1826 року, частина жителів винищених сіл відмовилася переселятися під контроль завойовника й сховалася в лісах.
    Імперський історик Потто визнає: «жителі деяких аулів, винищених Єрмоловим, сховалися в лісах і, не бажаючи виселятися, покинули навіть свої поля, засіяні хлібом»(Citation: 78).
    Селище Узені-Юрт на березі Аргуну стало прихистком цих людей та опорою карабулацького ватажка Астемира, соратника Бейбулата Таймієва в повстанні 1825 року.
    У ніч на 10 січня 1827 року генерал Лаптєв, начальник лівого флангу Кавказької лінії, потай вивів на село загін із 350 лінійних козаків із двома кінними гарматами, змусивши взяти участь і чотириста Чеченців з підкорених товариств.
    Потто писав: вони «перепливли Аргун і мали йти обхідною дорогою, щоб відрізати жителям відступ до лісу»(Citation: 78).
    Попереджені вершником жителі втекли за Аргун.
    Потто фіксував: козаки, наздогнавши втікачів, «схопили... трьох жінок та вбили й поранили осіб п'ятнадцять», після чого «село Узені-Юрт, з усім майном і навіть свійською худобою, було знищене дощенту»(Citation: 78).
    Тієї ж зими Лаптєв вимагав від селища Гельдиген заручників, відкинувши викуп за схопленого молодого гельдигенця.
    Потто писав: «Лаптєв відкинув усі пропозиції й вимагав одного - аманатів»(Citation: 78).
    Улітку 1827 року генерал Енгельгардт, який змінив його, влаштував засідку під час жнив біля аулу Самашки.
    Потто визнає: жителів вільно пропустили на поля, а потім «усе, що перебувало на полі, виявилося оточеним густим козацьким ланцюгом»; населення відпустили, захопивши в полон ватажка Тара-Адзуєва та сім'ю лідера опору Бакара-Булатова, а хліб Галгаївців, які жили при аулі, «випалили... на пні»(Citation: 78).
