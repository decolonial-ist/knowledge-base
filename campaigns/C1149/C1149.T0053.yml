description:
  ru: |-
    При уничтожении Узени-Юрта 10 января 1827 казаки отряда генерала Лаптева, начальника левого фланга Кавказской линии, захватили в плен трёх женщин из числа бегущих жителей.
    Имперский историк Потто фиксировал: казаки «схватили... трёх женщин»(Citation: 78).
    Летом 1827, оцепив засадой население аула Самашки во время жатвы, казаки генерала Энгельгардта, начальника левого фланга Кавказской линии, захватили в плен семьи лидеров сопротивления: предводителя Тара-Адзуева и семью Бакара-Булатова, самому Булатову удалось прорваться через цепь.
    Потто писал: «Тара-Адзуева и семью Булатова увезли с собой»(Citation: 78).
  en: |-
    During the destruction of Uzeni-Yurt on January 10, 1827, Cossacks of the detachment of General Laptev, commander of the left flank of the Caucasian Line, took captive three women from among the fleeing inhabitants.
    The imperial historian Potto recorded: the Cossacks "seized... three women"(Citation: 78).
    In the summer of 1827, having encircled the population of the aul of Samashki in an ambush during the harvest, the Cossacks of General Engelhardt, commander of the left flank of the Caucasian Line, took captive the families of resistance leaders: the leader Tara-Adzuev and the family of Bakar-Bulatov; Bulatov himself managed to break through the cordon.
    Potto wrote: "Tara-Adzuev and Bulatov's family they carried off with them"(Citation: 78).
  uk: |-
    Під час знищення Узені-Юрта 10 січня 1827 року козаки загону генерала Лаптєва, начальника лівого флангу Кавказької лінії, захопили в полон трьох жінок з-поміж мешканців, що тікали.
    Імперський історик Потто фіксував: козаки «схопили... трьох жінок»(Citation: 78).
    Влітку 1827 року, оточивши засідкою населення аулу Самашки під час жнив, козаки генерала Енгельгардта, начальника лівого флангу Кавказької лінії, захопили в полон родини лідерів опору: провідника Тара-Адзуєва та родину Бакара-Булатова; самому Булатову вдалося прорватися крізь ланцюг.
    Потто писав: «Тара-Адзуєва та родину Булатова забрали із собою»(Citation: 78).
