description:
  en: |-
    In the winter of 1826–1827, General Laptev, commander of the left flank of the Caucasian Line, extorted amanats (hostages) from the village of Geldigen, using a captured young man of Geldigen as leverage.
    The young man agreed to a staged "captivity" in order to avert the strike being prepared against the village: the occupation left the village no other way to buy safety than by handing over hostages.
    The imperial historian Potto admits: Laptev, having got the man into his hands, "rejected all offers and demanded one thing only — amanats.
    Willy-nilly this condition had to be accepted, and the people of Geldigen, who had always stood at the head of bloody movements, left in our hands the hostages of their tranquility"(Citation: 78).
  uk: |-
    Узимку 1826–1827 років генерал Лаптєв, начальник лівого флангу Кавказької лінії, витребував із селища Гельдиген аманатів, використавши схопленого молодого гельдигенця як важіль.
    Юнак пішов на постановочний «полон», щоб відвести від села удар, який готувався: окупація не залишила селу іншого способу купити безпеку, крім видачі заручників.
    Імперський історик Потто визнає: Лаптєв, отримавши людину до рук, «відкинув усі пропозиції та зажадав одного — аманатів.
    Хоч-не-хоч довелося прийняти цю умову, і гельдигенці, які завжди стояли на чолі кривавих рухів, залишили в наших руках заручників свого спокою»(Citation: 78).
  ru: |-
    Зимой 1826-1827 генерал Лаптев, начальник левого фланга Кавказской линии, вытребовал с селения Гельдиген аманатов, использовав схваченного молодого гельдигенца как рычаг.
    Юноша пошёл на постановочный «плен», чтобы отвести от села готовившийся удар: оккупация не оставила селу иного способа купить безопасность, кроме выдачи заложников.
    Имперский историк Потто признаёт: Лаптев, получив человека в руки, «отверг все предложения и потребовал одного - аманатов.
    Волей-неволей пришлось принять это условие, и гельдигенцы, всегда стоявшие во главе кровавых движений, оставили в наших руках заложников своего спокойствия»(Citation: 78).
