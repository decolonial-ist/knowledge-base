description:
  en: |-
    On the night of January 10, 1827, General Laptev, commander of the left flank of the Caucasus Line, led a detachment of 350 Line Cossacks with two horse guns and four hundred Chechens of subordinated communities compelled to take part against the village of Uzeni-Yurt - a refuge for the inhabitants of villages ravaged by troops in Yermolov's punitive campaign of 1826 - in order to destroy it as punishment for raids on the Line and in the absence of the Karabulak leader Astemir.
    The imperial historian Potto wrote: «Laptev decided to take advantage of that moment to strike a blow in Astemir's absence... and, quickly assembling a detachment, on the night of the tenth of January led it against Uzdeni-Yurt.
    By dawn the troops already stood before the aul»(Citation: 78).
  uk: |-
    У ніч на 10 січня 1827 генерал Лаптєв, начальник лівого флангу Кавказької лінії, повів загін із 350 лінійних козаків із двома кінними гарматами та чотирьохсот примушених до участі Чеченців із підпорядкованих товариств на селище Узені-Юрт - прихисток жителів сіл, розорених військами в каральному поході Єрмолова 1826 року, - щоб знищити його в покарання за набіги на лінію та за відсутності карабулацького ватажка Астеміра.
    Імперський історик Потто писав: «Лаптєв вирішив скористатися цією хвилиною, щоб за відсутності Астеміра завдати удару... і, швидко зібравши загін, у ніч на десяте січня повів його на Уздені-Юрт.
    До світанку війська стояли вже перед аулом»(Citation: 78).
  ru: |-
    В ночь на 10 января 1827 генерал Лаптев, начальник левого фланга Кавказской линии, повёл отряд из 350 линейных казаков с двумя конными орудиями и четырёхсот принуждённых к участию чеченцев подчинённых обществ на селение Узени-Юрт - прибежище жителей сёл, разорённых войсками в карательном походе Ермолова 1826 года, - чтобы уничтожить его в наказание за набеги на линию и в отсутствие карабулакского предводителя Астемира.
    Имперский историк Потто писал: «Лаптев решил воспользоваться этой минутой, чтобы в отсутствие Астемира нанести удар... и, быстро собрав отряд, в ночь на десятое января повёл его на Уздени-Юрт.
    К рассвету войска стояли уже перед аулом»(Citation: 78).
