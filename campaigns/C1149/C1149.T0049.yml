description:
  ru: |-
    В ночь на 10 января 1827 генерал Лаптев, начальник левого фланга Кавказской линии, принудил четыреста чеченцев подчинённых обществ участвовать в рейде на нохчи-селение Узени-Юрт с боевой задачей против соотечественников.
    Имперский историк Потто писал: они «переплыли Аргун и должны были идти обходной дорогой, чтобы отрезать жителям отступление к лесу»(Citation: 78).
    Летом 1827 генерал Энгельгардт, начальник левого фланга Кавказской линии, заставил участвовать в засаде на жителей Самашек наряду с сотней моздокских казаков, как фиксировал Потто, «столько же мирных чеченцев»(Citation: 78).
    Подчинённость этих обществ удерживалась системой заложников, что документирует та же практика Лаптева по Гельдигену.
  en: |-
    On the night of January 10, 1827, General Laptev, commander of the left flank of the Caucasian Line, forced four hundred Chechens of subordinated communities to take part in a raid on the Nokhchi village of Uzeni-Yurt with a combat mission against their compatriots.
    The imperial historian Potto wrote: they "swam across the Argun and were to go by a roundabout road in order to cut off the inhabitants' retreat to the forest"(Citation: 78).
    In the summer of 1827, General Engelhardt, commander of the left flank of the Caucasian Line, compelled to take part in the ambush on the inhabitants of Samashki, alongside a hundred Mozdok Cossacks, as Potto recorded, "as many peaceable Chechens"(Citation: 78).
    The subjugation of these communities was maintained by a system of hostages, as documented by Laptev's same practice with regard to Geldigen.
  uk: |-
    У ніч на 10 січня 1827 року генерал Лаптєв, начальник лівого флангу Кавказької лінії, примусив чотириста Чеченців підкорених громад брати участь у рейді на нохчі-селище Узені-Юрт із бойовим завданням проти співвітчизників.
    Імперський історик Потто писав: вони «перепливли Аргун і мали йти обхідною дорогою, щоб відрізати мешканцям відступ до лісу»(Citation: 78).
    Влітку 1827 року генерал Енгельгардт, начальник лівого флангу Кавказької лінії, змусив брати участь у засідці на мешканців Самашок поряд із сотнею моздоцьких козаків, як фіксував Потто, «стільки ж мирних Чеченців»(Citation: 78).
    Підкореність цих громад утримувалася системою заручників, що документує та сама практика Лаптєва щодо Гельдигена.
