description:
  en: |-
    On January 10, 1827, the troops of General Laptev, commander of the left flank of the Caucasus Line, razed the village of Uzeni-Yurt on the bank of the Argun, whose inhabitants had fled across the river.
    The imperial historian Potto acknowledges: «the village of Uzeni-Yurt, with all its property... was destroyed to its foundations»(Citation: 78).
    The village had served as home to people whose former auls had been exterminated by troops in Yermolov's punitive campaign of 1826 and who had refused to resettle under the conqueror's control.
  uk: |-
    10 січня 1827 війська генерала Лаптєва, начальника лівого флангу Кавказької лінії, знесли селище Узені-Юрт на березі Аргуна, жителі якого втекли за річку.
    Імперський історик Потто визнає: «село Узені-Юрт, з усім майном... було знищено дощенту»(Citation: 78).
    Селище слугувало домом людям, чиї колишні аули були винищені військами в каральному поході Єрмолова 1826 року і які відмовилися переселятися під контроль завойовника.
  ru: |-
    10 января 1827 войска генерала Лаптева, начальника левого фланга Кавказской линии, снесли селение Узени-Юрт на берегу Аргуна, жители которого бежали за реку.
    Имперский историк Потто признаёт: «деревня Узени-Юрт, со всем имуществом... была уничтожена до основания»(Citation: 78).
    Село служило домом людям, чьи прежние аулы были истреблены войсками в карательном походе Ермолова 1826 года и которые отказались переселяться под контроль завоевателя.
