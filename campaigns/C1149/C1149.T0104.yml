description:
  ru: |-
    На рассвете 10 января 1827 казаки отряда генерала Лаптева, начальника левого фланга Кавказской линии, ворвавшись в селение Узени-Юрт, рубили безоружных жителей, бегущих за Аргун.
    Имперский историк Потто фиксировал: казаки, «едва успевшие настигнуть хвост бежавших, схватили только трёх женщин да убили и ранили человек пятнадцать»(Citation: 78).
    Убитые и раненые - настигнутые в бегстве невооружённые люди.
    Вооружённое сопротивление, как писал тот же Потто, завязали позже лишь те жители, что успели укрыться в лесу.
  en: |-
    At dawn on January 10, 1827, the Cossacks of the detachment of General Laptev, commander of the left flank of the Caucasus Line, having burst into the village of Uzeni-Yurt, cut down unarmed inhabitants fleeing across the Argun.
    The imperial historian Potto recorded: the Cossacks, «having barely managed to overtake the tail of the fleeing, seized only three women and killed and wounded some fifteen people»(Citation: 78).
    The killed and wounded were unarmed people overtaken in flight.
    Armed resistance, as the same Potto wrote, was mounted later only by those inhabitants who had managed to take refuge in the forest.
  uk: |-
    На світанку 10 січня 1827 козаки загону генерала Лаптєва, начальника лівого флангу Кавказької лінії, увірвавшись у селище Узені-Юрт, рубали беззбройних жителів, що тікали за Аргун.
    Імперський історик Потто фіксував: козаки, «що ледве встигли наздогнати хвіст утікачів, схопили лише трьох жінок та вбили й поранили душ п'ятнадцять»(Citation: 78).
    Убиті й поранені - наздогнані у втечі неозброєні люди.
    Збройний опір, як писав той самий Потто, зав'язали пізніше лише ті жителі, що встигли сховатися в лісі.
