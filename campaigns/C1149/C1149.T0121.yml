description:
  ru: |-
    10 января 1827 при сносе селения Узени-Юрт войска генерала Лаптева, начальника левого фланга Кавказской линии, уничтожили домашний скот жителей - основу пропитания крестьянского двора.
    Имперский историк Потто фиксировал: деревня «со всем имуществом и даже домашним скотом, была уничтожена до основания»(Citation: 78).
    Летом 1827 казаки генерала Энгельгардта, начальника левого фланга Кавказской линии, после захвата населения Самашек уничтожили урожай на корню у галгаевцев, живших при ауле на мельницах и хуторах.
    Потто писал: «предварительно они приказали показать себе поля, принадлежавшие тем галгаевцам, которые жили на мельницах, и выжгли их хлеб на корню»(Citation: 78).
    Уничтожение скота зимой и созревшего хлеба в страдную пору лишало людей пропитания на год вперёд.
  en: |-
    On January 10, 1827, during the razing of the village of Uzeni-Yurt, the troops of General Laptev, commander of the left flank of the Caucasian Line, destroyed the inhabitants' livestock — the basis of a peasant household's sustenance.
    The imperial historian Potto recorded: the village, "with all its property and even its livestock, was destroyed to the ground"(Citation: 78).
    In the summer of 1827, the Cossacks of General Engelhardt, commander of the left flank of the Caucasian Line, after seizing the population of Samashki, destroyed the standing crops of the Galgai who lived near the aul at mills and farmsteads.
    Potto wrote: "beforehand they ordered that they be shown the fields belonging to those Galgai who lived at the mills, and burned their grain where it stood"(Citation: 78).
    The destruction of livestock in winter and of ripened grain at harvest time deprived people of sustenance for a year ahead.
  uk: |-
    10 січня 1827 року під час знищення селища Узені-Юрт війська генерала Лаптєва, начальника лівого флангу Кавказької лінії, винищили свійську худобу мешканців — основу прожитку селянського двору.
    Імперський історик Потто фіксував: село «з усім майном і навіть свійською худобою було знищене дощенту»(Citation: 78).
    Влітку 1827 року козаки генерала Енгельгардта, начальника лівого флангу Кавказької лінії, після захоплення населення Самашок знищили врожай на пні в Галгаївців, які жили при аулі на млинах та хуторах.
    Потто писав: «попередньо вони наказали показати собі поля, що належали тим Галгаївцям, які жили на млинах, і випалили їхній хліб на пні»(Citation: 78).
    Знищення худоби взимку та достиглого хліба у жнива позбавляло людей прожитку на рік уперед.
