description:
  ru: |-
    Терское казачье войско Российской империи сдавало отнятые чеченские земли в аренду нефтяным компаниям и жило рентой с чужих недр: в 1899 году на войсковых землях добыто около 21,9 миллиона пудов нефти из 26,22 миллиона общей добычи, и только за этот год компании выплатили войску 631,8 тысячи рублей(Citation: 125).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: крупнейшим собственником нефтеносных участков оказалось именно войско, само разработку оно не вело, а обычные условия аренды составляли 150 рублей в год за десятину (десятина - чуть больше гектара) плюс «от 2 до 6 копеек с каждого пуда добытой нефти»(Citation: 125).
    Историк З. Х. Ибрагимова фиксирует динамику: войсковые капиталы с 1877 по 1900 год выросли с 400 тысяч до 3 миллионов рублей - «Это было результатом получения доходов с нефтеносных земель»(Citation: 251).
    Масштаб задал сам промысел: 27 августа 1895 года скважина №7 Ахвердова дала «фонтан невероятной силы, дававший до 1 млн пудов в сутки...
    Гул и запах нефти были слышны за 15 верст от месторождения»(Citation: 254).
  en: |-
    The Terek Cossack Host of the Russian Empire leased out the seized Chechen lands to oil companies and lived on rent from another people's subsoil: in 1899 about 21.9 million of the 26.22 million puds of total output were extracted on the host's lands, and in that year alone the companies paid the host 631.8 thousand rubles(Citation: 125).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: the largest owner of the oil-bearing plots turned out to be the host itself; it did no extraction of its own, and the usual terms of a lease were 150 rubles a year per desiatina (a desiatina is a little over a hectare) plus "from 2 to 6 kopecks for every pud of oil extracted"(Citation: 125).
    Historian Z. Kh.
    Ibragimova records the dynamic: the host's capital grew from 400 thousand rubles in 1877 to 3 million in 1900 - "This was the result of receiving income from the oil-bearing lands"(Citation: 251).
    The scale was set by the field itself: on 27 August 1895 well No. 7 of Akhverdov's company gave "a gusher of incredible force, yielding up to 1 million puds a day...
    The roar and the smell of oil could be sensed 15 versts from the field"(Citation: 254).
  uk: |-
    Терське козацьке військо Російської імперії здавало відібрані чеченські землі в оренду нафтовим компаніям і жило рентою з чужих надр: у 1899 році на землях війська видобуто близько 21,9 мільйона пудів нафти з 26,22 мільйона загального видобутку, і тільки за цей рік компанії виплатили війську 631,8 тисячі рублів(Citation: 125).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: найбільшим власником нафтоносних ділянок виявилося саме військо, розробки воно само не вело, а звичайні умови оренди становили 150 рублів на рік за десятину (десятина - трохи більше гектара) плюс «від 2 до 6 копійок з кожного пуда видобутої нафти»(Citation: 125).
    Історик З. Х. Ібрагімова фіксує динаміку: військові капітали з 1877 по 1900 рік зросли з 400 тисяч до 3 мільйонів рублів - «Це було результатом отримання доходів з нафтоносних земель»(Citation: 251).
    Масштаб задав сам промисел: 27 серпня 1895 року свердловина №7 Ахвердова дала «фонтан неймовірної сили, що давав до 1 млн пудів на добу...
    Гул і запах нафти було чути за 15 верст від родовища»(Citation: 254).
