description:
  ru: |-
    Российская империя отняла у чеченцев нефтяные колодцы у крепости Грозной и 16 февраля 1845 года закрепила изъятие законом: параграф 154 «Положения о Кавказском линейном войске», утверждённого императором Николаем I, гласил: «в знак особого благоволения…в пользу войска предоставляется всемилостивейше пожалованный ему доход от нефтяных источников близ крепости Грозной»(Citation: 251).
    До изъятия нефть кормила самих чеченцев - историк З. Х. Ибрагимова пишет по документам: в 1788 году чеченский владетель Казбулат «торговал и имел определённый доход с нефтяных колодцев, расположенных в его владениях»; моздокские казаки в прошении 1811 года вспоминали, как нефть «привозилась на продажу... и продавалась вольною ценою»; «Позднее, нефть была изъята у чеченцев и стала собственностью Кавказского линейного полка, который сдавал её в откуп»(Citation: 251).
    За 57 лет откупной системы, с 1833 по 1890 год, войско получило 152 500 рублей серебром чистого дохода(Citation: 251)(Citation: 125).
  en: |-
    The Russian Empire took the oil wells near the Groznaya fortress away from the Chechens and on 16 February 1845 sealed the seizure by law: paragraph 154 of the "Regulations on the Caucasus Line Host", confirmed by Emperor Nicholas I, read: "as a mark of special favor…the host is granted the income most graciously bestowed upon it from the oil springs near the Groznaya fortress"(Citation: 251).
    Before the seizure the oil fed the Chechens themselves - historian Z. Kh.
    Ibragimova writes from the documents: in 1788 the Chechen ruler Kazbulat "traded and had a certain income from the oil wells located in his domains"; the Mozdok Cossacks recalled in a petition of 1811 how oil "was brought for sale... and sold at a free price"; "Later, the oil was taken away from the Chechens and became the property of the Caucasus Line regiment, which farmed it out"(Citation: 251).
    Over the 57 years of the tax-farming system, from 1833 to 1890, the host received 152,500 rubles in silver of net income(Citation: 251)(Citation: 125).
  uk: |-
    Російська імперія відібрала в чеченців нафтові колодязі біля фортеці Грозної і 16 лютого 1845 року закріпила вилучення законом: параграф 154 «Положення про Кавказьке лінійне військо», затвердженого імператором Миколою I, гласив: «на знак особливого благовоління…на користь війська надається всемилостивіше пожалуваний йому дохід від нафтових джерел поблизу фортеці Грозної»(Citation: 251).
    До вилучення нафта годувала самих чеченців - історик З. Х. Ібрагімова пише за документами: у 1788 році чеченський володар Казбулат «торгував і мав певний дохід з нафтових колодязів, розташованих у його володіннях»; моздокські козаки у проханні 1811 року згадували, як нафта «привозилася на продаж... і продавалася вільною ціною»; «Пізніше, нафта була вилучена в чеченців і стала власністю Кавказького лінійного полку, який здавав її у відкуп»(Citation: 251).
    За 57 років відкупної системи, з 1833 по 1890 рік, військо отримало 152 500 рублів сріблом чистого доходу(Citation: 251)(Citation: 125).
