description:
  en: |-
    By orders for the Terek oblast of 15 August 1890 and March 1897 the Russian Empire forbade the Chechen village communities "to enter into any agreements with mining industrialists" without the government's permission - "The guilty, in the person of village officials, were brought to account, and suits were brought in the courts to annul the concluded contracts"(Citation: 251).
    The ground of the ban is formulated by historian Z. Kh.
    Ibragimova: "The aul communities were deprived of the right to lease out oil-bearing plots - the land was granted to them not by right of property but only into use with the right of surface working; its subsoil was considered the property of the treasury"(Citation: 251).
    When the Ministry of Agriculture confirmed rules that allowed peasant communities to lease out their own land for the working of the subsoil, the head of the Terek oblast, General Kakhanov, in 1894 "categorically objected to the extension to the Chechen lands" of these rules - and demanded that, even if the communities' rights were recognized, the resolution on leasing the land be confirmed by the uchastok chief and a third of the income go "to pay the podymnaya tax of the communities concerned"(Citation: 125).
    For the Cossacks the opposite rule was in force: from 1891, when subsoil passed to the treasury, stanitsas were entitled to replacement land or compensation - "For the Chechen communities no reserve land allotments were provided by the state.
    Still less was there any question of material reward"(Citation: 251).
  uk: |-
    Російська імперія наказами по Терській області від 15 серпня 1890 року і березня 1897 року заборонила чеченським сільським громадам «входити ні в які угоди з гірничопромисловцями» без дозволу уряду - «Винних, в особі сільських посадових осіб, притягали до відповідальності і в судах порушували позови про знищення укладених договорів»(Citation: 251).
    Підставу заборони формулює історик З. Х. Ібрагімова: «Аульні громади були позбавлені права здавати в оренду нафтоносні ділянки - земля їм надавалася не на правах власності, а тільки в користування з правом поверхневої розробки, надра її вважалися надбанням скарбниці»(Citation: 251).
    Коли міністерство землеробства затвердило правила, що дозволяли селянським громадам самим здавати землю під розробку надр, начальник Терської області генерал Каханов у 1894 році «категорично заперечував проти поширення на чеченські землі» цих правил - і вимагав, щоб навіть при визнанні прав громад постанова про здачу землі затверджувалася начальником дільниці, а третина доходів ішла «на сплату подимної податі належних громад»(Citation: 125).
    Для козаків діяла зворотна норма: з 1891 року при відході надр у скарбницю станицям належала заміна землі або винагорода - «У чеченських громад запасних земельних наділів державою передбачено не було.
    Тим більше не йшлося про матеріальне заохочення»(Citation: 251).
  ru: |-
    Российская империя приказами по Терской области от 15 августа 1890 года и марта 1897 года запретила чеченским сельским обществам «входить ни в какие соглашения с горнопромышленниками» без разрешения правительства - «Виновных, в лице сельских должностных лиц привлекали к ответственности и в судах возбуждали иски по уничтожению заключённых договоров»(Citation: 251).
    Основание запрета формулирует историк З. Х. Ибрагимова: «Аульные общества были лишены права сдавать в аренду нефтеносные участки - земля им предоставлялась не на правах собственности, а только в пользование с правом поверхностной разработки, недра её считались достоянием казны»(Citation: 251).
    Когда министерство земледелия утвердило правила, позволявшие крестьянским общинам самим сдавать землю под разработку недр, начальник Терской области генерал Каханов в 1894 году «категорически возражал против распространения на чеченские земли» этих правил - и требовал, чтобы даже при признании прав общин приговор о сдаче земли утверждался начальником участка, а треть доходов шла «в уплату подымной подати надлежащих обществ»(Citation: 125).
    Для казаков действовала обратная норма: с 1891 года при отходе недр в казну станицам полагалась замена земли или вознаграждение - «У чеченских обществ запасных земельных наделов государством предусмотрено не было.
    Тем более речь не шла о материальном поощрении»(Citation: 251).
