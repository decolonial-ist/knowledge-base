description:
  ru: |-
    В январе 1918 года, пока войска советской России наступали на Киев, большевики подняли восстание в самом городе.
    В воскресенье 15(28) января рабочие и вооружённые отряды большевиков захватили завод «Арсенал» на Печерске (район Киева)(Citation: 613).
    На следующий день, 16(29) января, Киевский комитет партии большевиков выпустил печатную листовку к рабочим и солдатам города против Генерального секретариата (правительство Украинской Народной Республики при Центральной Раде).
    В ней сказано: «Господа из Генерального секретариата подготовляют здесь, в сердце Украины, разгон Советов рабочих и солдатских депутатов и думают, что найдутся здесь солдаты, которые совершат это черное дело.
    Нет, этому не бывать!»(Citation: 615).
    Листовка звала «на защиту революции» и заканчивалась призывом «Долой контрреволюционеров, сгруппировавшихся в Центральной раде и Генеральном секретариате». 19 января (1 февраля) чрезвычайный комиссар советской России в Украине Орджоникидзе телеграфировал правительству советской России: «В Киеве восстание рабочих и солдат полков Богдана Хмельницкого и Шевченко.
    Арсенал в руках рабочих.
    Сегодня советские войска войдут в Киев»(Citation: 616).
    Восстание внутри города и наступление снаружи стоят в одной телеграмме и в одном расчёте.
  en: |-
    In January 1918, while the troops of Soviet Russia were advancing on Kyiv, the Bolsheviks raised an uprising inside the city itself.
    On Sunday 15 (28) January, workers and armed Bolshevik detachments seized the "Arsenal" plant in Pechersk (a district of Kyiv)(Citation: 613).
    The next day, 16 (29) January, the Kyiv committee of the Bolshevik party issued a printed leaflet to the workers and soldiers of the city against the General Secretariat (the government of the Ukrainian People's Republic under the Central Rada).
    It said: "The gentlemen from the General Secretariat are preparing here, in the heart of Ukraine, the dispersal of the Soviets of Workers' and Soldiers' Deputies and think that soldiers will be found here who will carry out this black deed.
    No, this shall not be!"(Citation: 615).
    The leaflet called "to the defence of the revolution" and ended with the appeal "Down with the counter-revolutionaries grouped in the Central Rada and the General Secretariat".
    On 19 January (1 February) Ordzhonikidze, the extraordinary commissar of Soviet Russia in Ukraine, telegraphed the government of Soviet Russia: "In Kyiv there is an uprising of workers and of soldiers of the Bohdan Khmelnytsky and Shevchenko regiments.
    The Arsenal is in the hands of the workers.
    Today Soviet troops will enter Kyiv"(Citation: 616).
    The uprising inside the city and the offensive from outside stand in one telegram and in one calculation.
  uk: |-
    У січні 1918 року, поки війська радянської Росії наступали на Київ, більшовики підняли повстання в самому місті.
    У неділю 15(28) січня робітники й озброєні загони більшовиків захопили завод «Арсенал» на Печерську (район Києва)(Citation: 613).
    Наступного дня, 16(29) січня, Київський комітет партії більшовиків випустив друковану листівку до робітників і солдатів міста проти Генерального секретаріату (уряд Української Народної Республіки при Центральній Раді).
    У ній сказано: «Панове з Генерального секретаріату готують тут, у серці України, розгін Рад робітничих і солдатських депутатів і думають, що знайдуться тут солдати, які вчинять цю чорну справу.
    Ні, цьому не бути!»(Citation: 615).
    Листівка кликала «на захист революції» й закінчувалася закликом «Геть контрреволюціонерів, що згрупувалися в Центральній раді та Генеральному секретаріаті». 19 січня (1 лютого) надзвичайний комісар радянської Росії в Україні Орджонікідзе телеграфував урядові радянської Росії: «У Києві повстання робітників і солдатів полків Богдана Хмельницького та Шевченка.
    Арсенал у руках робітників.
    Сьогодні радянські війська увійдуть до Києва»(Citation: 616).
    Повстання всередині міста й наступ ззовні стоять в одній телеграмі та в одному розрахунку.
