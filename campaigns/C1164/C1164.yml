name:
  en: Forcing Chechnya into submission after the fall of Akhulgo and suppression of the general uprising of 1840 (1838-1840)
  uk: Примушення Чечні до підкорення після розгрому Ахульго та придушення загального повстання 1840 року (1838-1840)
  ru: Принуждение Чечни к подчинению после разгрома Ахульго и подавление всеобщего восстания 1840 года (1838-1840)
description:
  en: |-
    In November 1838 general Golovin, commander of the Separate Caucasus Corps (the head of the imperial troops and administration in the Caucasus), secretly ordered the assassination of Shamil (Shamil - the imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest), and in May 1839 the troops of general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), invaded Ichkeria (mountainous south-eastern Chechnya).
    After the rout of Akhulgo (Shamil's mountain residence in Dagestan, August 1839) the empire considered the resistance finished off and pressed Chechnya with winter expeditions - armed marches for money, weapons and people through auls already held since 1836 by the system of amanats, tribute and pristavs (campaign C1163).
    Muhammad-Tahir al-Qarakhi, Shamil's chronicler, named the reason why the Chechens called for Shamil: "The reason for this was that even before Shamil's coming the Russians had taken from these lower Chechens, as a tax, one ruble (kurush) from every house and one gun from every ten houses"(Citation: 128).
    In February-March 1840 Chechnya rose - the historian D. A. Khozhaev writes: "All of lowland Chechnya was stirring.
    On the lowland territory of Chechnya occupied by the tsarist colonial troops and subordinated to the Chechen pristav, preparation of an armed uprising began"(Citation: 95).
    The empire answered with punitive marches throughout 1840: the troops of general Galafeyev, who had taken over the left flank of the Caucasus Line, and of general Grabbe burned dozens of auls of Lesser and Greater Chechnya, destroyed crops and stores before winter, and dictated to the insurgents the "Conditions prescribed to submitting highlanders"(Citation: 126) - hostages, an oath, fines, surrender of weapons.
    The calculation of the campaign was admitted by general Golovin himself - in a memorandum of 26 April 1841 on the results of the previous year's expedition: "In vain did we expect that after the destruction, in last year's expedition, of the highlanders' food stores, their villages and various property, hunger, cold and extreme poverty would shake the fierce power of the instigator" ("instigator" - the imperial label for Shamil)(Citation: 129).
    The result of the year was summed up by the imperial historian Yurov: "The results of the exhausting expeditions of 1840 on the left flank of the Caucasus line fell far short of the expectations of His Majesty the Emperor and the high command; even more - we did not manage to improve the ominous situation one whit, and our prestige fell in this part of the region"(Citation: 134).
  uk: |-
    У листопаді 1838 року генерал Головін, командир Окремого Кавказького корпусу (глава імперських військ і адміністрації на Кавказі), таємно замовив убивство Шаміля (Шаміль - імам, керівник опору горців Дагестану і Чечні російському завоюванню), а у травні 1839 року війська генерала Граббе, командувача військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), вторглися в Ічкерію (гірську південно-східну Чечню).
    Після розгрому Ахульго (гірської резиденції Шаміля в Дагестані, серпень 1839 року) імперія вважала опір добитим і дотискала Чечню зимовими експедиціями - збройними походами за грошима, зброєю і людьми по аулах, які з 1836 року вже тримала система аманатів, податей і приставів (кампанія C1163).
    Мухаммед-Тахір аль-Карахі, хроніст Шаміля, назвав причину, з якої чеченці кликали Шаміля: «Причиною ж цьому було те, що ще до приходу Шаміля росіяни взяли з цих нижніх чеченців як податок по одному рублю (куруш) з кожного дому і по одній рушниці з кожних десяти домів»(Citation: 128).
    У лютому-березні 1840 року Чечня піднялася - історик Д. А. Хожаєв пише: «Вся площинна Чечня захвилювалася.
    На окупованій царськими колоніальними військами площинній території Чечні, що підпорядковувалася чеченському приставу, почалася підготовка збройного повстання»(Citation: 95).
    Імперія відповідала каральними походами весь 1840 рік: війська генерала Галафєєва, який прийняв лівий фланг Кавказької лінії, і генерала Граббе спалили десятки аулів Малої і Великої Чечні, знищили посіви і запаси перед зимою, а повсталим продиктували «Умови, приписувані горцям, що підкоряються»(Citation: 126) - заручники, присяга, штрафи, здача зброї.
    Розрахунок кампанії визнав сам генерал Головін - запискою від 26 квітня 1841 року про підсумки торішньої експедиції: «Марно ми очікували, що після знищення в торішній експедиції продовольчих запасів горців, їхніх селищ і різного майна голод, холоднеча і крайні злидні похитнуть люту владу бунтівника» («бунтівник» - імперський ярлик Шаміля)(Citation: 129).
    Підсумок року підбив імперський історик Юров: «Результати виснажливих експедицій 1840-го року на лівому фланзі кавказької лінії далеко не виправдали очікувань Государя Імператора і вищого начальства; навіть більше - нам ні на волос не вдалося поліпшити зловісної обстановки, і наш престиж упав у цій частині краю»(Citation: 134).
  ru: |-
    В ноябре 1838 года генерал Головин, командир Отдельного Кавказского корпуса (глава имперских войск и администрации на Кавказе), секретно заказал убийство Шамиля (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию), а в мае 1839 года войска генерала Граббе, командующего войсками Кавказской линии (цепи имперских укреплений на земле нохчи), вторглись в Ичкерию (горную юго-восточную Чечню).
    После разгрома Ахульго (горной резиденции Шамиля в Дагестане, август 1839 года) империя считала сопротивление добитым и дожимала Чечню зимними экспедициями - вооружёнными походами за деньгами, оружием и людьми по аулам, которые с 1836 года уже держала система аманатов, податей и приставов (кампания C1163).
    Мухаммед-Тахир аль-Карахи, хронист Шамиля, назвал причину, по которой чеченцы звали Шамиля: «Причиной же этому было то, что еще до прихода Шамиля русские взяли с этих нижних чеченцев в качестве налога по одному рублю (куруш) с каждого дома и по одному ружью с каждых десяти домов»(Citation: 128).
    В феврале-марте 1840 года Чечня поднялась - историк Д. А. Хожаев пишет: «Вся плоскостная Чечня заволновалась.
    На оккупированной царскими колониальными войсками плоскостной территории Чечни, подчинявшейся чеченскому приставу, началась подготовка вооруженного восстания»(Citation: 95).
    Империя отвечала карательными походами весь 1840 год: войска генерала Галафеева, принявшего левый фланг Кавказской линии, и генерала Граббе сожгли десятки аулов Малой и Большой Чечни, уничтожили посевы и запасы перед зимой, а восставшим продиктовали «Условия, предписываемые покоряющимся горцам»(Citation: 126) - заложники, присяга, штрафы, сдача оружия.
    Расчёт кампании признал сам генерал Головин - запиской от 26 апреля 1841 года об итогах прошлогодней экспедиции: «Напрасно мы ожидали, что после истребления в прошлогодней экспедиции продовольственных запасов горцев, их селений и разного имущества голод, стужа и крайняя нищета поколебают лютую власть возмутителя» («возмутитель» - имперский ярлык Шамиля)(Citation: 129).
    Итог года подвёл имперский историк Юров: «Результаты утомительных экспедиций 1840-го года на левом фланге кавказской линии далеко не оправдали ожиданий Государя Императора и высшего начальства; даже более - нам ни на волос не удалось улучшить зловещей обстановки, и наш престиж упал в этой части края»(Citation: 134).
