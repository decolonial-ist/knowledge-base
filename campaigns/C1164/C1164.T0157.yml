description:
  ru: |-
    Подавляя восстание 1840 года, империя требовала от чеченцев публичного отказа от сопротивления.
    Генерал Граббе, командующий войсками Кавказской линии (цепи имперских укреплений на земле нохчи), воззванием к восставшим от 14 июня 1840 года потребовал покаяния: «Образумьтесь и спасите себя ныне чистосердечным раскаянием и немедленною покорностью» («покорность» - имперская формула подчинения)(Citation: 126).
    На следующий день, 15 июня 1840 года, он издал «Условия, предписываемые покоряющимся горцам», где пункт 8 предписал восставшим аулам «отказаться от всякого участия в пагубном учении Шамиля» (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию; «пагубное учение» - имперский ярлык мюридизма, религиозного движения сопротивления)(Citation: 126).
  en: |-
    Suppressing the uprising of 1840, the empire demanded of the Chechens a public renunciation of resistance.
    General Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), in an appeal to the insurgents of 14 June 1840 demanded repentance: "Come to your senses and save yourselves now by sincere repentance and immediate submission" ("submission" - the imperial formula of subordination)(Citation: 126).
    The next day, 15 June 1840, he issued the "Conditions prescribed to submitting highlanders", whose point 8 prescribed that the insurgent auls "renounce all participation in the pernicious teaching of Shamil" (Shamil - the imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest; "pernicious teaching" - the imperial label for muridism, the religious movement of the resistance)(Citation: 126).
  uk: |-
    Придушуючи повстання 1840 року, імперія вимагала від чеченців публічної відмови від опору.
    Генерал Граббе, командувач військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), відозвою до повсталих від 14 червня 1840 року зажадав каяття: «Схаменіться і врятуйте себе нині щиросердним каяттям і негайною покірністю» («покірність» - імперська формула підпорядкування)(Citation: 126).
    Наступного дня, 15 червня 1840 року, він видав «Умови, приписувані горцям, що підкоряються», де пункт 8 приписав повсталим аулам «відмовитися від усякої участі в пагубному вченні Шаміля» (Шаміль - імам, керівник опору горців Дагестану і Чечні російському завоюванню; «пагубне вчення» - імперський ярлик мюридизму, релігійного руху опору)(Citation: 126).
