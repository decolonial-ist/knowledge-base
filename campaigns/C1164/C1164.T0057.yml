description:
  en: |-
    The "Conditions prescribed to submitting highlanders", issued by general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), on 15 June 1840, imposed labour duty on the Chechen auls.
    Point 4 prescribed: "in case of a detachment's movement to allot people for building roads and bridges, to keep at the pristav's disposal a sufficient number of people for carrying papers or orders from one aul to another, to give mounted men for escort duty" (pristav - a superintendent over the auls appointed by the empire)(Citation: 126).
  uk: |-
    «Умови, приписувані горцям, що підкоряються», видані генералом Граббе, командувачем військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), 15 червня 1840 року, обклали чеченські аули трудовою повинністю.
    Пункт 4 приписав: «у разі руху загону виділити людей для влаштування доріг і мостів, утримувати при приставі достатнє число людей для перевезення паперів або наказів з одного аулу в інший, давати кінних людей для конвоювання» (пристав - призначений імперією наглядач над аулами)(Citation: 126).
  ru: |-
    «Условия, предписываемые покоряющимся горцам», изданные генералом Граббе, командующим войсками Кавказской линии (цепи имперских укреплений на земле нохчи), 15 июня 1840 года, обложили чеченские аулы трудовой повинностью.
    Пункт 4 предписал: «в случае движения отряда выделить людей для устройства дорог и мостов, содержать при приставе достаточное число людей для перевозки бумаг или приказаний из одного аула в другой, давать конных людей для конвоирования» (пристав - назначенный империей надзиратель над аулами)(Citation: 126).
