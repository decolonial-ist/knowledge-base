description:
  en: |-
    In 1839-1840 the imperial troops burned dozens of Chechen settlements.
    In the May 1839 invasion of Ichkeria (mountainous south-eastern Chechnya) the imperial officer Milyutin, a participant of the march, recorded day by day: "The nearby aul of Balansu was found abandoned by its inhabitants and given to the flames", "All the auls lying on either side of the road (Nake-Yurt, Tsezyn-Irzau, Doba-Yurt) were found abandoned by their inhabitants and given to the flames", and of the rout on 12 May of Sayasan, the residence of sheikh Tashu-Hadji (in 1834-1836 the imam of Chechnya, leader of the Chechen resistance): "The fortification was devastated, and the village given to the flames"(Citation: 137).
    In the January 1840 march the troops of general Pullo, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), wiped out two auls: the imperial historian Yurov - "the auls of Kazbek-Yurt and Batash-Yurt, populated mostly by relatives and namesakes of Shuaib-Mulla, which met the detachment with weapons in hand.
    After a minor skirmish both villages were levelled to the ground"(Citation: 134); historian D. A. Khozhayev adds: "The Russians burned the Benoy hamlet of Gurzhiyn-mokhk and the neighbouring auls of Zandak-Ara and Genderghen, and retreated"(Citation: 95).
    In summer 1840 the detachment of general Galafeyev, who had taken over the troops of the left flank, burned the auls of Lesser Chechnya (the lowland-piedmont western part of Chechnya): historian D. A. Khozhayev lists the destroyed Bolshoy Chechen, Dudu-yurt, Akhshpatoy-Goyta, Chunguroy-yurt, Urus-Martan, Gurak-Roshni, Khazhi-Roshni, Taib and Achkhoy - the troops marched on, "leaving behind them destroyed and burned villages"(Citation: 95); the detachment's journal of military operations confirms the route and adds Peshkhoy-Roshni(Citation: 135).
    In autumn the same detachment burned Greater Chechnya (the lowland eastern part of Chechnya): the imperial survey of 27 October 1840 records - "on 3 and 4 October the troops... burned both villages" (Shali and Germenchuk), "on 7 October the detachment burned 5 hamlets attached to the aul of Shali", and of Said-Yurt, the hamlet of Ersenei and the village of Avtury on 10 October: "gave them to the flames and annihilated the houses and all the property of the inhabitants"(Citation: 126).
    Muhammad Tahir al-Qarakhi, Shamil's chronicler (Shamil - the imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest), recorded that the inhabitants of Shali and Germenchuk abandoned and burned their own villages on Shamil's order long before the troops came: "Shamil ordered them to burn those ancient, well-settled and beautiful villages.
    It was hard for the lower Chechens, but they did it nonetheless" - part of the imperial burnings went through villages already empty; of Said-Yurt he gives the mirror version of the fight: the murids (the imam's disciples and warriors) "fought them and slew a great number of them.
    The murids put the Russians to flight"(Citation: 128).
    In the November marches of general Grabbe, commander of the troops of the Caucasus Line, Gekhi and the auls along the Sunzha were devastated - historian N. I. Pokrovsky: "On 27 October Grabbe marched into Lesser Chechnya, devastated Gekhi, on 4 November laid waste the auls situated along the Sunzha"(Citation: 129); the imperial historian Yurov recorded: "During the rearguard action general Galafeyev managed to take by fighting and annihilate to its foundations the village of Mirti-Irzau", then on 13 November Germenchuk with its hamlets was destroyed, on 15 November - Lachi-Yurt and Indi-Yurt, on 17 November the troops seized and burned Batash-Yurt, the home of Shuaib-Mulla (naib - the deputy of imam Shamil in Greater Chechnya)(Citation: 134).
  uk: |-
    У 1839-1840 роках імперські війська спалили десятки чеченських поселень.
    У травневому вторгненні 1839 року в Ічкерію (гірську південно-східну Чечню) імперський офіцер Мілютін, учасник походу, записав поденно: «Аул Балансу, що знаходився поблизу, знайдено покинутим жителями і віддано вогню», «Усі аули, що лежали по боках дороги (Наке-Юрт, Цезин-Ірзау, Доба-Юрт), знайдено покинутими жителями і віддано вогню», а про розгром 12 травня Саясана, резиденції шейха Ташу-Хаджі (у 1834-1836 роках імама Чечні, керівника чеченського опору): «Укріплення було розорено, а селище віддано вогню»(Citation: 137).
    У січневому поході 1840 року війська генерала Пулло, який командував лівим флангом Кавказької лінії (ланцюга імперських укріплень на землі нохчі), стерли два аули: імперський історик Юров - «аули Казбек-Юрт і Баташ-Юрт, населені здебільшого родичами та однофамільцями Шуаїб-Мулли, які зустріли загін зі зброєю в руках.
    Після незначної перестрілки обидва селища були зрівняні з землею»(Citation: 134); історик Д. А. Хожаєв доповнює: «Росіяни спалили беноївський хутір Гуьржийн-мохк, сусідні з ним аули Зандак-Ара, Гендерген і відступили»(Citation: 95).
    Улітку 1840 року загін генерала Галафєєва, який прийняв війська лівого флангу, палив аули Малої Чечні (рівнинно-передгірної західної частини Чечні): історик Д. А. Хожаєв перелічує знищені Большой Чечен, Дуду-юрт, Ахшпатой-Гойта, Чунгурой-юрт, Урус-Мартан, Гурак-Рошні, Хажі-Рошні, Таїб і Ачхой - війська йшли, «залишаючи за собою зруйновані та спалені селища»(Citation: 95); журнал воєнних дій загону підтверджує маршрут і додає Пешхой-Рошні(Citation: 135).
    Восени той самий загін палив Велику Чечню (рівнинну східну частину Чечні): імперський огляд від 27 жовтня 1840 року записує - «3 і 4 жовтня війська... спалили обидва селища» (Шалі та Герменчук), «7 жовтня загін спалив 5 хуторів, приписаних до аулу Шалі», а 10 жовтня про Саїд-Юрт, хутір Ерсеней і селище Автури: «віддав їх полум'ю і винищив доми і все майно жителів»(Citation: 126).
    Мухаммед-Тахір аль-Карахі, хроніст Шаміля (Шаміль - імам, керівник опору горців Дагестану і Чечні російському завоюванню), записав, що жителі Шалі та Герменчука покинули і спалили свої села самі, за наказом Шаміля, задовго до приходу військ: «Шаміль наказав їм спалити ті старовинні, обжиті й красиві селища.
    Тяжко було нижнім чеченцям, але вони все ж зробили це» - частина імперських спалень ішла вже порожніми селами; про Саїд-Юрт він дає дзеркальну версію бою: мюриди (учні та воїни імама) «зразилися з ними і перебили велике число їх.
    Мюриди обернули росіян на втечу»(Citation: 128).
    У листопадових виходах генерала Граббе, командувача військ Кавказької лінії, розорені Гехі та аули по Сунжі - історик Н. І. Покровський: «27 жовтня Граббе виступив у Малу Чечню, розорив Гехі, 4 листопада спустошив аули, розташовані по Сунжі»(Citation: 129); імперський історик Юров записав: «За час ар'єргардної справи генерал Галафєєв встиг зайняти з бою і винищити до основи с.
    Мірті-Ірзау», потім 13 листопада знищено Герменчук з хуторами, 15 листопада - Лачі-Юрт та Інді-Юрт, 17 листопада війська захопили і спалили Баташ-Юрт, місце проживання Шуаїб-мулли (наїб - намісник імама Шаміля у Великій Чечні)(Citation: 134).
  ru: |-
    В 1839-1840 годах имперские войска сожгли десятки чеченских поселений.
    В майском вторжении 1839 года в Ичкерию (горную юго-восточную Чечню) имперский офицер Милютин, участник похода, записал подённо: «Находившийся поблизости аул Балансу найден покинутым жителями и предан огню», «Все аулы, лежавшие по сторонам дороги (Наке-Юрт, Цезын-Ирзау, Доба-Юрт), найдены были покинутыми жителями и преданы огню», а о разгроме 12 мая Саясана, резиденции шейха Ташу-Хаджи (в 1834-1836 годах имама Чечни, руководителя чеченского сопротивления): «Укрепление было разорено, а селение предано огню»(Citation: 137).
    В январском походе 1840 года войска генерала Пулло, командовавшего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), стёрли два аула: имперский историк Юров - «аулы Казбек-Юрт и Баташ-Юрт, населенные по большей части родственниками и однофамильцами Шуаиб-Муллы, и встретившие отряд с оружием в руках.
    После незначительной перестрелки оба селения были сравнены с землею»(Citation: 134); историк Д. А. Хожаев дополняет: «Русские сожгли беноевский хутор Гуьржийн-мохк, соседние с ним аулы Зандак-Ара, Гендерген и отступили»(Citation: 95).
    Летом 1840 года отряд генерала Галафеева, принявшего войска левого фланга, жёг аулы Малой Чечни (равнинно-предгорной западной части Чечни): историк Д. А. Хожаев перечисляет уничтоженные Большой Чечен, Дуду-юрт, Ахшпатой-Гойта, Чунгурой-юрт, Урус-Мартан, Гурак-Рошни, Хажи-Рошни, Таиб и Ачхой - войска шли, «оставляя за собой разрушенные и сожженные селения»(Citation: 95); журнал военных действий отряда подтверждает маршрут и добавляет Пешхой-Рошни(Citation: 135).
    Осенью тот же отряд жёг Большую Чечню (равнинную восточную часть Чечни): имперский обзор от 27 октября 1840 года записывает - «3 и 4 октября войска... сожгли оба селения» (Шали и Герменчук), «7 октября отряд сжег 5 хуторов, приписаных к аулу Шали», а 10 октября о Саид-Юрте, хуторе Эрсеней и селении Автуры: «предал их пламени и истребил дома и все имущество жителей»(Citation: 126).
    Мухаммед-Тахир аль-Карахи, хронист Шамиля (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию), записал, что жители Шали и Герменчука покинули и сожгли свои сёла сами, по приказу Шамиля, задолго до прихода войск: «Шамиль приказал им сжечь те старинные, обжитые и красивые селения.
    Тяжело было нижним чеченцам, но они все же сделали это» - часть имперских сожжений шла по уже пустым сёлам; о Саид-Юрте он даёт зеркальную версию боя: мюриды (ученики и воины имама) «сразились с ними и перебили большое число их.
    Мюриды обратили русских в бегство»(Citation: 128).
    В ноябрьских выходах генерала Граббе, командующего войсками Кавказской линии, разорены Гехи и аулы по Сунже - историк Н. И. Покровский: «27 октября Граббе выступил в Малую Чечню, разорил Гехи, 4 ноября опустошил аулы, расположенные по Сунже»(Citation: 129); имперский историк Юров записал: «За время арьергардного дела генерал Галафеев успел занять с боя и истребить до основания с.
    Мирти-Ирзау», затем 13 ноября уничтожен Герменчук с хуторами, 15 ноября - Лачи-Юрт и Инди-Юрт, 17 ноября войска захватили и сожгли Баташ-Юрт, место жительства Шуаиб-муллы (наиб - наместник имама Шамиля в Большой Чечне)(Citation: 134).
