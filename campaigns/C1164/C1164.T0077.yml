description:
  ru: |-
    В 1839-1840 годах карательные выходы имперских войск шли по Чечне волнами.
    В мае 1839 года генерал Граббе, командующий войсками Кавказской линии (цепи имперских укреплений на земле нохчи), вторгся в Ичкерию (горную юго-восточную Чечню); цель он назвал сам рапортом военному министру Чернышеву от 10 мая 1839 года: «наказать как это селение [Беной], так и все прочие непокорные деревни»(Citation: 126).
    Итог признал имперский офицер Милютин, участник вторжения: «Сожжение нескольких селений Ауховских и Ичкеринских только озлобило еще более ближайших горцев, а самый конец нашего набега всетаки имел такой вид, как будто они выгнали непрошенных гостей»(Citation: 137).
    Зимой войска генерала Пулло, командовавшего левым флангом Кавказской линии, дважды прошли по подчинившимся аулам: с 18 по 30 декабря 1839 года - 28 аулов Малой Чечни (равнинно-предгорной западной части Чечни), с 26 января 1840 года - аулы по реке Мичик; историк Ш. А. Гапуров пишет об этих походах: «Он поголовно взимал с нищих людей подати, разоружал их, требовал выдачи пленных, заставлял рубить лес»(Citation: 132).
    После восстания кары продолжились: в конце апреля 1840 года войска вышли в Аух (чеченскую область на северо-востоке) - имперский историк Юров записал: «Уничтожив сады и предав сакли огню...» (сакля - дом горца)(Citation: 134); с 6 по 14 июля отряд генерала Галафеева, принявшего войска левого фланга после Пулло, прошёл по Малой Чечне - историк Н. И. Покровский: «С 6 по 14 июля генерал Галафеев прошел по Малой Чечне с огнем и мечом»(Citation: 129); имперскую цель приводит историк Д. А. Хожаев: «примерно наказать присоединившихся к Шамилю» чеченцев (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию)(Citation: 95).
    Осенние походы санкционировал генерал Головин, командир Отдельного Кавказского корпуса, предписанием генералу Граббе от 17 августа 1840 года «употребить войска... для строгого наказания возмутившихся чеченцев»(Citation: 126); план утвердил Николай I через военного министра Чернышева 10 сентября 1840 года(Citation: 135).
    Отряд Галафеева прошёл по Большой Чечне (равнинной восточной части Чечни) с 26 сентября по 18 октября, отряды Граббе - с 27 октября по 5 ноября по Малой и с 10 по 18 ноября по Большой Чечне(Citation: 129).
    Расчёт последней экспедиции историк Н. И. Покровский передаёт по донесениям Граббе: «Он надеялся на оглушительное впечатление от этой экспедиции»(Citation: 129).
  en: |-
    In 1839-1840 punitive marches of imperial troops swept across Chechnya in waves.
    In May 1839 general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), invaded Ichkeria (mountainous south-eastern Chechnya); he named the goal himself in a report to Minister of War Chernyshev of 10 May 1839: "to punish both this village [Benoy] and all other unsubmissive villages"(Citation: 126).
    The imperial officer Milyutin, a participant of the invasion, admitted the outcome: "The burning of several Aukh and Ichkerian villages only embittered the nearest highlanders still more, and the very end of our raid nonetheless looked as if they had driven out uninvited guests"(Citation: 137).
    In winter the troops of general Pullo, who commanded the left flank of the Caucasus Line, twice marched through the auls that had submitted: on 18-30 December 1839 - 28 auls of Lesser Chechnya (the lowland-piedmont western part of Chechnya), from 26 January 1840 - the auls along the Michik river; historian Sh.
    A. Gapurov writes of these marches: "He exacted tribute from the destitute people wholesale, disarmed them, demanded the surrender of captives, forced them to fell timber"(Citation: 132).
    After the uprising the punitive actions continued: in late April 1840 the troops marched into Aukh (the Chechen region in the north-east) - the imperial historian Yurov recorded: "Having destroyed the orchards and given the saklias to the flames..." (saklia - a highlander's house)(Citation: 134); on 6-14 July the detachment of general Galafeyev, who had taken over the troops of the left flank after Pullo, marched across Lesser Chechnya - historian N. I. Pokrovsky: "From 6 to 14 July general Galafeyev passed through Lesser Chechnya with fire and sword"(Citation: 129); historian D. A. Khozhayev cites the imperial goal: to "punish exemplarily" the Chechens "who had joined Shamil" (Shamil - the imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest)(Citation: 95).
    The autumn marches were sanctioned by general Golovin, commander of the Separate Caucasus Corps, in an instruction to general Grabbe of 17 August 1840 "to employ the troops... for the strict punishment of the mutinous Chechens"(Citation: 126); Nicholas I approved the plan through Minister of War Chernyshev on 10 September 1840(Citation: 135).
    Galafeyev's detachment passed through Greater Chechnya (the lowland eastern part of Chechnya) from 26 September to 18 October; Grabbe's detachments - through Lesser Chechnya from 27 October to 5 November and through Greater Chechnya from 10 to 18 November(Citation: 129).
    Historian N. I. Pokrovsky conveys the calculation of the last expedition from Grabbe's dispatches: "He counted on the stunning impression of this expedition"(Citation: 129).
  uk: |-
    У 1839-1840 роках каральні виходи імперських військ ішли Чечнею хвилями.
    У травні 1839 року генерал Граббе, командувач військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), вторгся в Ічкерію (гірську південно-східну Чечню); мету він назвав сам рапортом військовому міністру Чернишову від 10 травня 1839 року: «покарати як це селище [Беной], так і всі інші непокірні села»(Citation: 126).
    Підсумок визнав імперський офіцер Мілютін, учасник вторгнення: «Спалення кількох селищ Ауховських та Ічкеринських тільки озлобило ще більше найближчих горців, а самий кінець нашого набігу все-таки мав такий вигляд, ніби вони вигнали непроханих гостей»(Citation: 137).
    Узимку війська генерала Пулло, який командував лівим флангом Кавказької лінії, двічі пройшли підкореними аулами: з 18 по 30 грудня 1839 року - 28 аулів Малої Чечні (рівнинно-передгірної західної частини Чечні), з 26 січня 1840 року - аули по річці Мічик; історик Ш. А. Гапуров пише про ці походи: «Він поголовно стягував з убогих людей податі, роззброював їх, вимагав видачі полонених, змушував рубати ліс»(Citation: 132).
    Після повстання кари тривали: наприкінці квітня 1840 року війська вийшли в Аух (чеченську область на північному сході) - імперський історик Юров записав: «Знищивши сади і віддавши саклі вогню...» (сакля - дім горця)(Citation: 134); з 6 по 14 липня загін генерала Галафєєва, який прийняв війська лівого флангу після Пулло, пройшов Малою Чечнею - історик Н. І. Покровський: «З 6 по 14 липня генерал Галафєєв пройшов Малою Чечнею з вогнем і мечем»(Citation: 129); імперську мету наводить історик Д. А. Хожаєв: «зразково покарати» чеченців, «що приєдналися до Шаміля» (Шаміль - імам, керівник опору горців Дагестану і Чечні російському завоюванню)(Citation: 95).
    Осінні походи санкціонував генерал Головін, командир Окремого Кавказького корпусу, приписом генералу Граббе від 17 серпня 1840 року «вжити війська... для суворого покарання збунтованих чеченців»(Citation: 126); план затвердив Микола I через військового міністра Чернишова 10 вересня 1840 року(Citation: 135).
    Загін Галафєєва пройшов Великою Чечнею (рівнинною східною частиною Чечні) з 26 вересня по 18 жовтня, загони Граббе - з 27 жовтня по 5 листопада Малою і з 10 по 18 листопада Великою Чечнею(Citation: 129).
    Розрахунок останньої експедиції історик Н. І. Покровський передає за донесеннями Граббе: «Він сподівався на приголомшливе враження від цієї експедиції»(Citation: 129).
