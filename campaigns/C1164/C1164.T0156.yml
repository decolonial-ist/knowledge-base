description:
  en: |-
    The "Conditions prescribed to submitting highlanders", issued by general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), on 15 June 1840, obliged the Chechen auls to refuse shelter to members of the resistance and to hand over people who had escaped the empire's power.
    Point 8 prescribed: "Not to give refuge in their auls to abreks, murids and unsubdued highlanders" (abrek - the imperial label for a highlander declared an outlaw; murids - the imam's disciples and warriors); point 11: "To hand over all Russian prisoners and runaways staying in the mountains" - by runaways the empire meant its own soldiers and serfs who had gone over to the highlanders(Citation: 126).
    Handovers went on even before the decree, under the pressure of the winter expeditions: the imperial historian Yurov recorded of the outcome of the December 1839 march of general Pullo, commander of the left flank of the Caucasus Line, through Lesser Chechnya (the lowland-piedmont western part of Chechnya): "97 abreks, 7 prisoners and two runaways were handed over", and of the January 1840 march along the Michik river - the auls "handed over 30 abreks"(Citation: 134).
  uk: |-
    «Умови, приписувані горцям, що підкоряються», видані генералом Граббе, командувачем військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), 15 червня 1840 року, зобов'язали чеченські аули відмовляти у притулку учасникам опору і видавати людей, які пішли з-під влади імперії.
    Пункт 8 приписав: «Не давати притулку у своїх аулах абрекам, мюридам і непокірним горцям» (абрек - імперський ярлик горця, оголошеного поза законом; мюриди - учні і воїни імама); пункт 11: «Видати всіх російських полонених і збіглих, що перебувають у горах» - збіглими імперія називала своїх солдатів і кріпаків, які пішли до горців(Citation: 126).
    Видачі йшли і до нормативу, під тиском зимових експедицій: імперський історик Юров записав про підсумок грудневого походу 1839 року генерала Пулло, який командував лівим флангом Кавказької лінії, по Малій Чечні (рівнинно-передгірній західній частині Чечні): «видано 97 абреків, 7 полонених і два збіглих», а про січневий похід 1840 року по річці Мічик - аули «видали 30-ть абреків»(Citation: 134).
  ru: |-
    «Условия, предписываемые покоряющимся горцам», изданные генералом Граббе, командующим войсками Кавказской линии (цепи имперских укреплений на земле нохчи), 15 июня 1840 года, обязали чеченские аулы отказывать в убежище участникам сопротивления и выдавать людей, ушедших из-под власти империи.
    Пункт 8 предписал: «Не давать убежища в своих аулах абрекам, мюридам и непокорным горцам» (абрек - имперский ярлык горца, объявленного вне закона; мюриды - ученики и воины имама); пункт 11: «Выдать всех русских пленных и беглых, находящихся в горах» - беглыми империя называла своих солдат и крепостных, ушедших к горцам(Citation: 126).
    Выдачи шли и до норматива, под давлением зимних экспедиций: имперский историк Юров записал об итоге декабрьского похода 1839 года генерала Пулло, командовавшего левым флангом Кавказской линии, по Малой Чечне (равнинно-предгорной западной части Чечни): «выдано 97 абреков, 7 пленных и два беглых», а о январском походе 1840 года по реке Мичик - аулы «выдали 30-ть абреков»(Citation: 134).
