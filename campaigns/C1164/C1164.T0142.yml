description:
  ru: |-
    «Условия, предписываемые покоряющимся горцам», изданные генералом Граббе, командующим войсками Кавказской линии (цепи имперских укреплений на земле нохчи), 15 июня 1840 года, запретили чеченцам свободно выбирать место жизни.
    Пункт 5 предписал: «Не переходить из одного аула в другой для постоянного жительства без дозволения местного начальства»(Citation: 126).
    Право жить на своей земле там, где жили поколениями, империя превратила в выдаваемое начальством разрешение.
  en: |-
    The "Conditions prescribed to submitting highlanders", issued by general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), on 15 June 1840, forbade the Chechens to choose freely where to live.
    Point 5 prescribed: "Not to move from one aul to another for permanent residence without the permission of the local authorities"(Citation: 126).
    The right to live on their own land, where they had lived for generations, the empire turned into a permit issued by the authorities.
  uk: |-
    «Умови, приписувані горцям, що підкоряються», видані генералом Граббе, командувачем військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), 15 червня 1840 року, заборонили чеченцям вільно обирати місце життя.
    Пункт 5 приписав: «Не переходити з одного аулу в інший для постійного проживання без дозволу місцевого начальства»(Citation: 126).
    Право жити на своїй землі там, де жили поколіннями, імперія перетворила на дозвіл, що видається начальством.
