description:
  ru: |-
    В майском вторжении 1839 года в Ичкерию (горную юго-восточную Чечню) имперские войска истязали захваченных.
    Имперский офицер Милютин, участник похода, записал, что пятерых ауховцев (ауховцы - чеченское общество на северо-востоке, у кумыкской границы), захваченных с оружием после боя, 15 мая 1839 года у селения Ярыксу-Аух прогнали сквозь строй (казнь-истязание: человека проводили между шеренгами солдат, и каждый бил его прутом-шпицрутеном): они «подверглись жестокому истязанию прогнанием сквозь строй.
    Солдаты выместили на этих несчастных свою злобу; из пятерых остался жив только один»(Citation: 137).
  en: |-
    During the May 1839 invasion of Ichkeria (mountainous south-eastern Chechnya) the imperial troops tortured their captives.
    The imperial officer Milyutin, a participant of the march, recorded that five Aukhovites (the Aukhovites - a Chechen community in the north-east, by the Kumyk border) captured with weapons after a fight were made to run the gauntlet on 15 May 1839 near the village of Yaryksu-Aukh (an execution-torture: a man was led between two ranks of soldiers, each of whom struck him with a shpitsruten rod): they "were subjected to cruel torture by being driven through the gauntlet.
    The soldiers vented their spite on these unfortunates; of the five only one remained alive"(Citation: 137).
  uk: |-
    У травневому вторгненні 1839 року в Ічкерію (гірську південно-східну Чечню) імперські війська катували захоплених.
    Імперський офіцер Мілютін, учасник походу, записав, що п'ятьох ауховців (ауховці - чеченська громада на північному сході, біля кумицького кордону), захоплених зі зброєю після бою, 15 травня 1839 року біля селища Яриксу-Аух прогнали крізь стрій (кара-катування: людину проводили між шеренгами солдатів, і кожен бив її прутом-шпіцрутеном): вони «зазнали жорстокого катування прогоном крізь стрій.
    Солдати зігнали на цих нещасних свою злобу; з п'ятьох залишився живим тільки один»(Citation: 137).
