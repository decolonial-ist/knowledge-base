description:
  en: |-
    The winter expeditions of general Pullo, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), collected money from the Chechen auls under the name of tribute.
    The imperial historian Yurov tallied the December 1839 march: "In all, during this bloodless military promenade, 3779 rubles and 455 rifles were collected, and 97 abreks, 7 captives and two fugitives were handed over" (abrek - the empire's label for an outlawed highlander)(Citation: 134), and the January 1840 march along the Michik river: the auls "obediently presented 2463 rubles, 545 rifles, cattle for the detachment's provisioning, and handed over 30 abreks"(Citation: 134).
    After the suppression of the uprising the levy was fixed as a fine: point 10 of the "Conditions prescribed to submitting highlanders", issued by general Grabbe, commander of the troops of the Caucasus Line, on 15 June 1840, prescribed "As punishment for participation in Shamil's uprising, to pay a fine of two rams from every saklia" (saklia - a highlander's house; Shamil - the imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest)(Citation: 126).
  uk: |-
    Зимові експедиції генерала Пулло, який командував лівим флангом Кавказької лінії (ланцюга імперських укріплень на землі нохчі), збирали з чеченських аулів гроші під іменем податей.
    Імперський історик Юров підбив рахунок грудневого походу 1839 року: «Усього, за час цієї безкровної воєнної прогулянки, було зібрано 3779 рублів, 455 рушниць, і видано 97 абреків, 7 полонених і два втікачі» (абрек - імперський ярлик горця, оголошеного поза законом)(Citation: 134), а січневого 1840 року по річці Мічик: аули «слухняно представили 2463 рублі, 545 рушниць, худобу для постачання загону і видали 30-ть абреків»(Citation: 134).
    Після придушення повстання обкладення закріпили штрафом: пункт 10 «Умов, приписуваних горцям, що підкоряються», виданих генералом Граббе, командувачем військ Кавказької лінії, 15 червня 1840 року, приписав «Як покарання за участь у повстанні Шаміля, заплатити штраф з кожної саклі по два барани» (сакля - дім горця; Шаміль - імам, керівник опору горців Дагестану і Чечні російському завоюванню)(Citation: 126).
  ru: |-
    Зимние экспедиции генерала Пулло, командовавшего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), собирали с чеченских аулов деньги под именем податей.
    Имперский историк Юров подвёл счёт декабрьского похода 1839 года: «Всего, за время этой бескровной военной прогулки, было собрано 3779 рублей, 455 ружей, и выдано 97 абреков, 7 пленных и два беглых» (абрек - имперский ярлык горца, объявленного вне закона)(Citation: 134), а январского 1840 года по реке Мичик: аулы «послушно представили 2463 рубля, 545 ружей, скот для довольствии отряда и выдали 30-ть абреков»(Citation: 134).
    После подавления восстания обложение закрепили штрафом: пункт 10 «Условий, предписываемых покоряющимся горцам», изданных генералом Граббе, командующим войсками Кавказской линии, 15 июня 1840 года, предписал «В виде наказания за участие в восстании Шамиля, заплатить штрафу с каждой сакли по два барана» (сакля - дом горца; Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию)(Citation: 126).
