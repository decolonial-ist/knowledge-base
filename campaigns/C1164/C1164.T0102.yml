description:
  ru: |-
    «Условия, предписываемые покоряющимся горцам», изданные генералом Граббе, командующим войсками Кавказской линии (цепи имперских укреплений на земле нохчи), 15 июня 1840 года, обязали чеченские аулы отдавать империи в пользование рабочий скот и транспорт своих хозяйств: по первому требованию пристава (назначенного империей надзирателя) выставлять арбы (двухколёсные повозки) и ишаков.
    Пункт 4 предписал: «По требованию пристава выставлять арбы или ишаков для перевозки тяжестей»(Citation: 126).
  en: |-
    The "Conditions prescribed to submitting highlanders", issued by general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), on 15 June 1840, obliged the Chechen auls to hand over the working cattle and transport of their households for the empire's use: at the first demand of the pristav (a superintendent appointed by the empire) to provide arbas (two-wheeled carts) and donkeys.
    Point 4 prescribed: "At the pristav's demand to provide arbas or donkeys for hauling loads"(Citation: 126).
  uk: |-
    «Умови, приписувані горцям, що підкоряються», видані генералом Граббе, командувачем військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), 15 червня 1840 року, зобов'язали чеченські аули віддавати імперії в користування робочу худобу і транспорт своїх господарств: на першу вимогу пристава (призначеного імперією наглядача) виставляти арби (двоколісні вози) та ішаків.
    Пункт 4 приписав: «На вимогу пристава виставляти арби або ішаків для перевезення вантажів»(Citation: 126).
