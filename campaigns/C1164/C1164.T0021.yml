description:
  en: |-
    In 1838-1840 the empire eliminated leaders of the Chechen resistance by contract killings and arrests.
    General Golovin, commander of the Separate Caucasus Corps (head of the empire's troops and administration in the Caucasus), by a secret instruction of 17 November 1838 ordered general Pullo, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), to arrange the assassination of Shamil (Shamil - the imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest): "Among the highlanders devoted to us there will doubtless be daring men who, for a good monetary reward, will undertake to deliver the head of the instigator.
    I charge you to try this measure, secretly offering to kill Shamil... promising a reward of up to 1,000 chervonets" (chervonets - a gold coin of the empire)(Citation: 106).
    In autumn 1839, after the rout of Akhulgo (Shamil's mountain stronghold in Dagestan), Ullu-bey of Erpeli - a highlander in the empire's service, installed as pristav (superintendent appointed by the empire) over the Koysubu community - twice sent poisoners to Shamil in the Chechen village of Vedeno: Shamil's chronicler Muhammad Tahir al-Qarakhi recorded that "Ullubiy sent Shamil's nephew Ibrahim, son of Bartikhan, with poison, together with two companions... while the latter was in the village of Vedeno of the Chechen vilayat" (vilayat - an administrative province of the Imamate)(Citation: 128).
    During the winter expeditions of December 1839 - January 1840 Pullo's troops took from the auls people whom the empire had outlawed: historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write - "In December 1839 major-general Pullo passed through 28 villages without a single shot, collected 4 thousand rubles in silver from the Chechens, confiscated 455 rifles and seized 97 abreks" (abrek - the empire's label for an outlawed highlander)(Citation: 125); in the January march along the Michik the troops took 30 more people(Citation: 134).
  uk: |-
    У 1838-1840 роках імперія усувала керівників чеченського опору замовними вбивствами та арештами.
    Генерал Головін, командир Окремого Кавказького корпусу (глава імперських військ і адміністрації на Кавказі), таємним приписом від 17 листопада 1838 року замовив генералу Пулло, який командував лівим флангом Кавказької лінії (ланцюга імперських укріплень на землі нохчі), вбивство Шаміля (Шаміль - імам, керівник опору горців Дагестану і Чечні російському завоюванню): «З відданих нам горців, без сумніву, знайдуться відважні люди, які, за добру грошову винагороду, візьмуться доставити голову бунтівника.
    Доручаю вам випробувати цей захід, таємно запропонувавши вбити Шаміля... обіцяючи в нагороду до 1.000 червінців» (червінець - золота монета імперії)(Citation: 106).
    Восени 1839 року, після розгрому Ахульго (гірської резиденції Шаміля в Дагестані), Уллу-бей Ерпелінський - горець на імперській службі, поставлений приставом (призначеним імперією наглядачем) над громадою Койсубу, - двічі посилав отруйників до Шаміля в чеченське селище Ведено: хроніст Шаміля Мухаммед-Тахір аль-Карахі записав, що «Уллубій послав з отрутою племінника Шаміля-Ібрахіма, сина Бартіхана, з двома товаришами... коли останній перебував у селищі Ведено Чеченського вілаята» (вілаят - адміністративна область Імамату)(Citation: 128).
    У зимові експедиції грудня 1839 - січня 1840 років війська Пулло вилучали з аулів людей, оголошених імперією поза законом: історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть - «У грудні 1839 р. генерал-майор Пулло пройшов 28 селищ без жодного пострілу, зібрав з чеченців 4 тисячі рублів сріблом, конфіскував 455 рушниць і захопив 97 абреків» (абрек - імперський ярлик горця, оголошеного поза законом)(Citation: 125); у січневому поході по Мічику війська забрали ще 30 людей(Citation: 134).
  ru: |-
    В 1838-1840 годах империя устраняла руководителей чеченского сопротивления заказными убийствами и арестами.
    Генерал Головин, командир Отдельного Кавказского корпуса (глава имперских войск и администрации на Кавказе), секретным предписанием от 17 ноября 1838 года заказал генералу Пулло, командовавшему левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), убийство Шамиля (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию): «Изъ преданныхъ намъ горцевъ, безъ сомнѣнія, найдутся отважные люди, которые, за хорошую денежную награду, возьмутся доставить голову возмутителя.
    Поручаю вамъ испытать эту мѣру, тайно предложивъ убить Шамиля... обѣщая въ награду до 1.000 червонцевъ» (червонец - золотая монета империи)(Citation: 106).
    Осенью 1839 года, после разгрома Ахульго (горной резиденции Шамиля в Дагестане), Уллу-бей Эрпелинский - горец на имперской службе, поставленный приставом (назначенным империей надзирателем) над обществом Койсубу, - дважды посылал отравителей к Шамилю в чеченское селение Ведено: хронист Шамиля Мухаммед-Тахир аль-Карахи записал, что «Уллубий послал с ядом племянника Шамиля-Ибрахима, сына Бартихана, с двумя товарищами... когда последний находился в селении Ведено Чеченского вилаята» (вилаят - административная область Имамата)(Citation: 128).
    В зимние экспедиции декабря 1839 - января 1840 годов войска Пулло изымали из аулов людей, объявленных империей вне закона: историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут - «В декабре 1839 г. генерал-майор Пулло прошел 28 селений без единого выстрела, собрал с чеченцев 4 тысячи рублей серебром, конфисковал 455 ружей и захватил 97 абреков» (абрек - имперский ярлык горца, объявленного вне закона)(Citation: 125); в январском походе по Мичику войска забрали ещё 30 человек(Citation: 134).
