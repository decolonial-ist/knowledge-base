description:
  ru: |-
    Восстание 1840 года снесло власть имперских назначенцев над равнинной Чечнёй - до него подчинившиеся аулы жили под назначенными империей надзирателями-приставами.
    «Условия, предписываемые покоряющимся горцам», изданные генералом Граббе, командующим войсками Кавказской линии (цепи имперских укреплений на земле нохчи), 15 июня 1840 года, переустановили эту власть нормой и достроили её.
    Пункт 3 предписал: «Исполнять все требования и приказания русского пристава, который будет назначен правительством» (пристав - назначенный империей надзиратель над аулами); пункт 6 обязал каждый аул: «Избрать из среды себя одного кадия, который обязан исполнять все приказания пристава» (кадий - мусульманский судья); пункт 7 - старшину в каждом ауле (старшина - глава аульной общины), «который утверждается русским начальством, наблюдает за общественным спокойствием и приводит в исполнение все приказания начальства».
    Сдающийся аул принимался под власть империи только вместе с этой структурой(Citation: 126).
  en: |-
    The uprising of 1840 swept away the power of imperial appointees over lowland Chechnya - before it, the auls that had submitted lived under superintendents-pristavs appointed by the empire.
    The "Conditions prescribed to submitting highlanders", issued by general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), on 15 June 1840, re-established this power as a norm and built it further.
    Point 3 prescribed: "To fulfil all demands and orders of the Russian pristav who will be appointed by the government" (pristav - a superintendent over the auls appointed by the empire); point 6 obliged every aul: "To elect from among themselves one qadi, who is obliged to fulfil all orders of the pristav" (qadi - a Muslim judge); point 7 - an elder in every aul (elder - the head of an aul community), "who is confirmed by the Russian authorities, watches over public tranquillity and carries out all orders of the authorities".
    A surrendering aul was accepted under the empire's power only together with this structure(Citation: 126).
  uk: |-
    Повстання 1840 року знесло владу імперських призначенців над рівнинною Чечнею - до нього аули, що підкорилися, жили під призначеними імперією наглядачами-приставами.
    «Умови, приписувані горцям, що підкоряються», видані генералом Граббе, командувачем військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), 15 червня 1840 року, перевстановили цю владу нормою і добудували її.
    Пункт 3 приписав: «Виконувати всі вимоги і накази російського пристава, який буде призначений урядом» (пристав - призначений імперією наглядач над аулами); пункт 6 зобов'язав кожен аул: «Обрати з-поміж себе одного кадія, який зобов'язаний виконувати всі накази пристава» (кадій - мусульманський суддя); пункт 7 - старшину в кожному аулі (старшина - глава аульної громади), «який затверджується російським начальством, наглядає за громадським спокоєм і приводить у виконання всі накази начальства».
    Аул, що здавався, приймався під владу імперії тільки разом із цією структурою(Citation: 126).
