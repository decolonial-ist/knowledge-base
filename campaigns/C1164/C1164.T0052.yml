description:
  ru: |-
    Империя изымала имущество и землю чеченцев распоряжениями.
    В апреле 1840 года имперское распоряжение предписало «заарестовать ауховские стада, если где только таковые на пастбище в кумыкском владении находятся» (ауховцы - чеченское общество на северо-востоке, у кумыкской границы)(Citation: 126).
    Землю чеченцев империя раздавала лоялистам: письмо современника из Тифлиса, которое приводит историк Н. И. Покровский, называет среди причин восстания 1840 года «наделение князя Бековича Черкасского землями, которыми владели чеченцы» (Бекович-Черкасский - кабардинский князь на российской службе)(Citation: 129).
  en: |-
    The empire seized the Chechens' property and land by decree.
    In April 1840 an imperial directive prescribed "to sequester the Aukh herds wherever they are found at pasture in the Kumyk domain" (the Aukhovites - a Chechen community in the north-east, by the Kumyk border)(Citation: 126).
    The land of the Chechens the empire handed out to loyalists: a contemporary's letter from Tiflis, cited by historian N. I. Pokrovsky, names among the causes of the 1840 uprising "the endowment of prince Bekovich-Cherkassky with lands owned by the Chechens" (Bekovich-Cherkassky - a Kabardian prince in Russian service)(Citation: 129).
  uk: |-
    Імперія вилучала майно і землю чеченців розпорядженнями.
    У квітні 1840 року імперське розпорядження приписало «заарештувати ауховські стада, де тільки такі на пасовищі в кумицькому володінні знаходяться» (ауховці - чеченська громада на північному сході, біля кумицького кордону)(Citation: 126).
    Землю чеченців імперія роздавала лоялістам: лист сучасника з Тифліса, який наводить історик Н. І. Покровський, називає серед причин повстання 1840 року «наділення князя Бековича Черкаського землями, якими володіли чеченці» (Бекович-Черкаський - кабардинський князь на російській службі)(Citation: 129).
