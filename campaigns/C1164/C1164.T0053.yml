description:
  ru: |-
    При уничтожении аула Мирти-Ирзау 4-5 ноября 1840 года (аул на Сунже, куда выселились жители Закан-Юрта и Самашек) войска под командованием генерала Граббе, командующего войсками Кавказской линии (цепи имперских укреплений на земле нохчи), увели в плен чеченские семьи.
    Имперский историк Юров записал: «Нами взято в плен несколько семейств надтеречных чеченцев, в числе 35-ти душ, и отбито 150-т штук рогатого скота» (надтеречные - чеченцы левого берега Терека)(Citation: 134).
    Пленение семей стоит в имперском отчёте одной строкой с угнанным скотом.
  en: |-
    At the destruction of the aul of Mirti-Irzau on 4-5 November 1840 (an aul on the Sunzha where the inhabitants of Zakan-Yurt and Samashki had resettled) the troops under general Grabbe, commander of the troops of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), led away Chechen families into captivity.
    The imperial historian Yurov recorded: "We took captive several families of the Terek-side Chechens, numbering 35 souls, and seized 150 head of horned cattle" (Terek-side - the Chechens of the left bank of the Terek)(Citation: 134).
    The captivity of families stands in the imperial account in one line with the driven-off cattle.
  uk: |-
    При знищенні аулу Мірті-Ірзау 4-5 листопада 1840 року (аул на Сунжі, куди виселилися жителі Закан-Юрта і Самашек) війська під командуванням генерала Граббе, командувача військ Кавказької лінії (ланцюга імперських укріплень на землі нохчі), повели в полон чеченські сім'ї.
    Імперський історик Юров записав: «Нами взято в полон кілька сімейств надтеречних чеченців, у числі 35-ти душ, і відбито 150-т штук рогатої худоби» (надтеречні - чеченці лівого берега Терека)(Citation: 134).
    Полонення сімей стоїть в імперському звіті одним рядком з викраденою худобою.
