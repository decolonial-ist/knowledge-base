description:
  en: 'The occupation administration of the Russian Empire used religious pretexts for expansion: historian Michael Khodarkovsky cites a memorandum by Governor-General P. S. Potemkin, who in 1784 declared that under the pretext of returning the highlanders to the faith and sending priests to them, the empire would be able to shed "the light of divine bliss among all the peoples scattered in the mountains"(Citation: 71).'
  uk: 'Окупаційна адміністрація Російської імперії використовувала релігійні приводи для експансії: історик Майкл Ходарковський (Michael Khodarkovsky) наводить меморандум генерал-губернатора П. С. Потьомкіна, який 1784 року заявляв, що під приводом повернення до віри та відправлення до горців священників імперія зможе пролити «світло божественного блаженства серед усіх народів, розсіяних у горах»(Citation: 71).'
  ru: 'Оккупационная администрация Российской империи использовала религиозные предлоги для экспансии: историк Майкл Ходарковский (Michael Khodarkovsky) приводит меморандум генерал-губернатора П. С. Потемкина, который в 1784 году заявлял, что под предлогом возвращения в веру и отправки к горцам священников империя сможет пролить «свет божественного блаженства среди всех народов, рассеянных в горах»(Citation: 71).'
