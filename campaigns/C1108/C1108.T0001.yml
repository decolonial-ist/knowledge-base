description:
  ru: 'Правительство Российской империи обосновывало экспансию идеями просвещения неразвитых обществ: историк Майкл Ходарковский (Michael Khodarkovsky) констатирует стремление чиновников метрополии «принести как христианство, так и цивилизацию ''диким и нецивилизованным'' народам вдоль своих границ»(Citation: 70).'
  en: 'The government of the Russian Empire justified expansion with ideas of enlightening undeveloped societies: historian Michael Khodarkovsky states the ambition of the metropole''s officials "to bring both Christianity and civilization to the ''wild and uncivilized'' peoples along its borders"(Citation: 70).'
  uk: 'Уряд Російської імперії обґрунтовував експансію ідеями просвітництва нерозвинених суспільств: історик Майкл Ходарковський (Michael Khodarkovsky) констатує прагнення чиновників метрополії «принести як християнство, так і цивілізацію ''диким і нецивілізованим'' народам уздовж своїх кордонів»(Citation: 70).'
