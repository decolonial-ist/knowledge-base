name:
  ru: Навязывание образа отсталости и «цивилизаторская» миссия (1721–1800-е гг.)
  en: Imposition of an Image of Backwardness and the “Civilizing” Mission (1721–1800s)
  uk: Нав’язування образу відсталості та «цивілізаторська» місія (1721–1800-ті рр.)
description:
  ru: |-
    В XVIII веке правительственный аппарат Российской империи начал применять идеи Просвещения и конструирование исторических мифов для идеологического обоснования поглощения территорий.
    Историк Майкл Ходарковский (Michael Khodarkovsky) констатирует, что к середине XVIII века чиновники стали воспринимать свое продвижение как предначертанную судьбой миссию, чтобы «принести как христианство, так и цивилизацию 'диким и нецивилизованным' народам вдоль своих границ»(Citation: 70).
    Местное население целенаправленно наделялось образом отсталости: исследователь указывает, что в документах администрации горцы описывались как «непостоянны и вероломны», а их действия объяснялись ссылками на их «хищное ремесло, к которому они предрасположены самой своей природой и воспитанием»(Citation: 71).
    Параллельно конструировались фиктивные основания для контроля: автор фиксирует, что в 1748 и 1770-х годах Коллегия иностранных дел фабриковала отчеты о том, что коренное население Кавказа в прошлом якобы исповедовало христианство, чтобы оспорить претензии других держав и «узаконить свои усилия по их 'рехристианизации'»(Citation: 71).
    Опираясь на эту базу, в 1784 году имперские наместники утверждали, что с отправкой миссионеров они смогут распространить влияние и пролить «свет божественного блаженства среди всех народов, рассеянных в горах»(Citation: 71).
  en: |-
    In the 18th century, the governmental apparatus of the Russian Empire began employing Enlightenment ideas and the construction of historical myths to ideologically justify the absorption of territories.
    Historian Michael Khodarkovsky states that by the mid-18th century officials had come to perceive their advance as a mission preordained by destiny to “bring both Christianity and civilization to the ‘wild and uncivilized’ peoples along its borders”(Citation: 70).
    The local population was deliberately assigned an image of backwardness: the researcher points out that in the administration’s documents the Highlanders were described as “inconstant and treacherous,” and their actions were explained by references to their “predatory craft, to which they are predisposed by their very nature and upbringing”(Citation: 71).
    In parallel, fictitious grounds for control were being constructed: the author records that in 1748 and the 1770s the Collegium of Foreign Affairs fabricated reports claiming that the Indigenous population of the Caucasus had allegedly professed Christianity in the past, in order to contest the claims of other powers and “legitimize its efforts at their ‘re-Christianization’”(Citation: 71).
    Building on this foundation, in 1784 the imperial governors asserted that, with the dispatch of missionaries, they would be able to spread their influence and shed “the light of divine bliss among all the peoples scattered in the mountains”(Citation: 71).
  uk: |-
    У XVIII столітті урядовий апарат Російської імперії почав застосовувати ідеї Просвітництва та конструювання історичних міфів для ідеологічного обґрунтування поглинання територій.
    Історик Майкл Ходарковський (Michael Khodarkovsky) констатує, що до середини XVIII століття чиновники стали сприймати своє просування як визначену долею місію, щоб «принести як християнство, так і цивілізацію „диким і нецивілізованим“ народам уздовж своїх кордонів»(Citation: 70).
    Місцеве населення цілеспрямовано наділялося образом відсталості: дослідник вказує, що в документах адміністрації Горців описували як «непостійних і віроломних», а їхні дії пояснювали посиланнями на їхнє «хижацьке ремесло, до якого вони схильні самою своєю природою та вихованням»(Citation: 71).
    Паралельно конструювалися фіктивні підстави для контролю: автор фіксує, що в 1748 та 1770-х роках Колегія іноземних справ фабрикувала звіти про те, що корінне населення Кавказу в минулому нібито сповідувало християнство, щоб оскаржити претензії інших держав і «узаконити свої зусилля з їхньої „рехристиянізації“»(Citation: 71).
    Спираючись на цю базу, у 1784 році імперські намісники стверджували, що з відправленням місіонерів вони зможуть поширити вплив і пролити «світло божественного блаженства серед усіх народів, розсіяних у горах»(Citation: 71).
