description:
  ru: |-
    «Уже в августе 1877 г. были высланы первые 150 жителей селений Зандак и Даттых, небольшие партии ссыльных отправлялись всю осень»(Citation: 125).
    «Весной следующего, 1878 г., из Терской области выслано еще 110 семей, а из Дагестана - 660 семейств.
    Большая часть высланных умерла уже в первые месяцы ссылки.
    Известно также, что свыше 500 чеченцев были приговорены к пожизненным каторжным работам»(Citation: 125).
    Историк З. Х. Ибрагимова даёт счёт по одной губернии: «из 1625 горцев, выселенных в 1878 году в Новгородскую губернию, в первые месяцы умерли 429 (из них 118 мужчин, остальные - женщины) и 74 были признаны безнадёжно больными»(Citation: 251).
    Условия описал журналист Ю. Полуянский, посетивший ссыльных: «В Череповце горцы помещены в полуразвалившейся, давно необитаемой лачуге...
    Из пятидесяти человек уже умерло до тридцати, преимущественно дети, от чахотки и брюшного тифа...
    На пропитание взрослым отпускают ежедневно по 6 копеек, детям по 3 копейки»(Citation: 251).
    Внутри Чечни горные сёла сгонялись на равнину: «Из указанной местности почти поголовно выселены селения Мехкеты, Хатуни и Таузень»(Citation: 125); план поголовного выселения салатавцев «до 3000 душ» в северные губернии урезан до 200 человек только из-за нехватки конвоя(Citation: 253).
  en: |-
    "Already in August 1877 the first 150 inhabitants of the villages of Zandak and Dattykh were deported; small parties of exiles were being sent off throughout the autumn"(Citation: 125).
    "In the spring of the following year, 1878, another 110 families were deported from the Terek oblast, and 660 families from Dagestan.
    Most of the deportees died within the first months of exile.
    It is also known that over 500 Chechens were sentenced to lifelong katorga labor"(Citation: 125).
    Historian Z. Kh.
    Ibragimova gives the count for a single governorate: "of the 1625 highlanders deported in 1878 to the Novgorod governorate, 429 died within the first months (118 of them men, the rest - women) and 74 were declared hopelessly ill"(Citation: 251).
    The conditions were described by journalist Yu.
    Poluyansky, who visited the exiles: "In Cherepovets the highlanders are housed in a half-ruined, long-uninhabited hovel...
    Of the fifty people, up to thirty have already died, mostly children, of consumption and typhoid fever...
    For subsistence the adults are allotted 6 kopecks a day, the children 3 kopecks"(Citation: 251).
    Within Chechnya, mountain villages were being driven down onto the plain: "From the locality indicated, the villages of Mekhkety, Khatuni and Tauzen have been deported almost to a man"(Citation: 125); the plan for the wholesale deportation of the Salatavians, "up to 3000 souls," to the northern governorates was cut down to 200 people only for lack of escort troops(Citation: 253).
  uk: |-
    «Уже в серпні 1877 р. було вислано перших 150 жителів селищ Зандак і Даттих, невеликі партії засланців відправлялися всю осінь»(Citation: 125).
    «Навесні наступного, 1878 р., з Терської області вислано ще 110 сімей, а з Дагестану - 660 родин.
    Більша частина висланих померла вже в перші місяці заслання.
    Відомо також, що понад 500 чеченців було засуджено до довічних каторжних робіт»(Citation: 125).
    Історик З. Х. Ібрагімова подає рахунок по одній губернії: «з 1625 горців, виселених 1878 року до Новгородської губернії, у перші місяці померли 429 (з них 118 чоловіків, решта - жінки) і 74 було визнано безнадійно хворими»(Citation: 251).
    Умови описав журналіст Ю. Полуянський, який відвідав засланців: «У Череповці горців розміщено в напівзруйнованій, давно нежилій халупі...
    Із п'ятдесяти осіб уже померло до тридцяти, переважно діти, від сухот і черевного тифу...
    На прожиток дорослим відпускають щодня по 6 копійок, дітям по 3 копійки»(Citation: 251).
    Усередині Чечні гірські села зганяли на рівнину: «Із зазначеної місцевості майже поголовно виселено селища Мехкети, Хатуні й Таузень»(Citation: 125); план поголовного виселення салатавців «до 3000 душ» у північні губернії урізано до 200 осіб лише через нестачу конвою(Citation: 253).
