description:
  en: |-
    Svistunov, head of the Terek oblast, wrote to Smekalov on 18 August 1877: "As for Benoy and Zandak, they must be deported to Siberia to a man, or, if these scoundrels refuse, all of them must be killed off in winter like cockroaches and destroyed by famine"(Citation: 253); the same directive of Svistunov is quoted by historian D. A. Khozhaev(Citation: 95).
    In the imperial publication of the correspondence (letter to Smekalov of 18 August 1877, No. 226) the formula reads: "to freeze them all out in winter, like cockroaches, and destroy them by famine"(Citation: 261).
    The food base was being destroyed from the very first days: on 13 April 1877, merely for letting the detachment of Alibek-Haji, leader of the uprising, pass through the village, "the hayfields and maize fields of the inhabitants [of Benoy] were completely burned by the tsarist troops"(Citation: 251).
    Colonel Batyanov, according to historian Z. Kh.
    Ibragimova, "widely applied the destruction of stores of grain and hay," believing that this made many "come to their senses"(Citation: 251).
    In Cheberloy the troops stood for about 20 days - "All this time they were ruining the fields of the Cheberloy villages.
    Their inhabitants meanwhile were in such a state as if the greatest of floods had struck them"(Citation: 125).
  uk: |-
    Свистунов, начальник Терської області, писав Смєкалову 18 серпня 1877 року: «Беной же і Зандак треба поголовно виселити до Сибіру, або, якщо ці негідники не забажають, виморити всіх узимку як тарганів і знищити голодом»(Citation: 253); цю саму директиву Свистунова наводить історик Д. А. Хожаєв(Citation: 95).
    В імперській публікації листування (лист Смєкалову від 18 серпня 1877 року, №226) формула читається: «виморозити всіх узимку, як тарганів, і знищити голодом»(Citation: 261).
    Продовольчу базу знищували з перших днів: 13 квітня 1877 року за один лише пропуск загону Алібека-Хаджі, керівника повстання, через село «покоси й кукурудзяні поля жителів [Беноя] були повністю спалені царськими військами»(Citation: 251).
    Полковник Батьянов, за істориком З. Х. Ібрагімовою, «широко застосовував знищення запасів хліба та сіна», вважаючи, що це змушує «одуматися» багатьох(Citation: 251).
    У Чеберлої війська простояли близько 20 днів - «Увесь цей час вони псували поля чеберлоївських селищ.
    Жителі ж їхні перебували тоді в такому стані, наче б уразила їх найбільша повінь»(Citation: 125).
  ru: |-
    Свистунов, начальник Терской области, писал Смекалову 18 августа 1877 года: «Беной же и Зандак надо поголовно выселить в Сибирь, или, если эти подлецы не пожелают, выморить всех зимой как тараканов и уничтожить голодом»(Citation: 253); эту же директиву Свистунова приводит историк Д. А. Хожаев(Citation: 95).
    В имперской публикации переписки (письмо Смекалову от 18 августа 1877 года, №226) формула читается: «выморозить всѣхъ зимою, какъ таракановъ и уничтожить голодомъ»(Citation: 261).
    Продовольственную базу уничтожали с первых дней: 13 апреля 1877 года за один лишь пропуск отряда Алибека-Хаджи, руководителя восстания, через село «покосы и кукурузные поля жителей [Беноя] были полностью сожжены царскими войсками»(Citation: 251).
    Полковник Батьянов, по историку З. Х. Ибрагимовой, «широко применял уничтожение запасов хлеба и сена», считая, что это заставляет «одуматься» многих(Citation: 251).
    В Чеберлое войска простояли около 20 дней - «Все это время они портили поля чеберлоевских селений.
    Жители же их находились тогда в таком состоянии, словно бы поразило их величайшее наводнение»(Citation: 125).
