description:
  en: 'The order of Colonel Lokhvitsky of 17 July 1877 for the Cheberloy uchastok obliged the punished themselves to cut a road for the troops into their own mountains: "the entire uchastok is to be obliged right now, within the very shortest time, to make a wide forest clearing (proseka) from the Bosoevskaya mountain to the Sharo-Argun river over a stretch of upwards of 6 versts" (a verst is slightly over a kilometer)(Citation: 253).'
  uk: 'Наказ полковника Лохвицького від 17 липня 1877 року по Чеберлоївській дільниці зобов''язав покараних самих прорубати військам дорогу у свої гори: «усю дільницю зобов''язати тепер же в найкоротший строк зробити широку просіку від Босоєвської гори до р. Шаро-Аргун на просторі понад 6-ть верст» (верста - трохи більше кілометра)(Citation: 253).'
  ru: 'Приказ полковника Лохвицкого от 17 июля 1877 года по Чеберлоевскому участку обязал наказанных самих прорубить войскам дорогу в свои горы: «весь участок обязать теперь же в самый краткий срок сделать широкую просеку от Босоевской горы к р. Шаро-Аргуну на пространство слишком 6-ть верст» (верста - чуть больше километра)(Citation: 253).'
