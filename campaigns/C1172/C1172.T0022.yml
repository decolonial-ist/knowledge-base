description:
  en: |-
    In the instructions of Svistunov, head of the Terek oblast, to General Smekalov one demand was invariably repeated: "advance at least little by little, mercilessly destroying everything and everyone before you...
    Our forces will keep arriving; just mow down everything without pity, beat and hang without mercy" - the instructions are quoted by historian A. I. Ismailova from the imperial publication "Materials for the Description of the Russo-Turkish War of 1877-78"(Citation: 253).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov record: at the final stage the punitive forces "acted in full accordance" with this order(Citation: 125).
  uk: |-
    У розпорядженнях Свистунова, начальника Терської області, генералові Смєкалову незмінно повторювалася вимога: «просувайтеся хоч потроху вперед, нещадно знищуючи перед собою все і всіх...
    Сили наші все прибуватимуть; тільки без жалю косіть усе, бийте і вішайте нещадно» - розпорядження наводить історик А. І. Ісмаїлова за імперським виданням «Матеріали для опису російсько-турецької війни 1877-78 рр.»(Citation: 253).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов фіксують: на завершальному етапі карателі «діяли в повній відповідності» з цим наказом(Citation: 125).
  ru: |-
    В распоряжениях Свистунова, начальника Терской области, генералу Смекалову неизменно повторялось требование: «продвигайтесь хотя понемногу вперед, беспощадно уничтожая перед собой все и всех...
    Силы наши все будут прибывать; только без сожаления косите все, бейте и вешайте беспощадно» - распоряжения приводит историк А. И. Исмаилова по имперскому изданию «Материалы для описания русско-турецкой войны 1877-78 гг.»(Citation: 253).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов фиксируют: на заключительном этапе каратели «действовали в полном соответствии» с этим приказом(Citation: 125).
