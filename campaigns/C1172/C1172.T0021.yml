description:
  ru: |-
    Военно-полевой суд заседал в Грозном 4-6 марта 1878 года: «Из 17 лиц судимых 11 были приговорены к смертной казни, в том числе Алибек-хаджи, Ума Дуев, один из его сыновей и Дада Залмаев»(Citation: 125); историк З. Х. Ибрагимова считает 18 судимых и 13 приговорённых, остальных - к 20 годам каторги(Citation: 251).
    Историк Д. А. Хожаев пишет: «9 марта 1878 года в 6 часов утра в городе Грозном на ярмарочной площади они были повешены и зарыты в общей яме» - и даёт поимённый список одиннадцати(Citation: 95); Ахмадов и Хасмагомадов добавляют: казнь прошла «при гробовом молчании и явном сочувствии к казнимым собравшихся горожан»(Citation: 125).
    Участник подавления, присутствовавший на казни, признал: «Меня поразило спокойствие, с которым эти люди умирали»(Citation: 251).
    Тела, зарытые властью в общей яме, чеченцы ночью тайно перезахоронили по мусульманскому обряду - историк Д. А. Хожаев передаёт предание о кладбище у Самашек, историк З. Х. Ибрагимова - о Тыртовой роще под Грозным(Citation: 95)(Citation: 251).
  en: |-
    The field court-martial sat in Grozny on 4-6 March 1878: "Of the 17 persons tried, 11 were sentenced to death, among them Alibek-Haji, Uma Duev, one of his sons, and Dada Zalmaev"(Citation: 125); historian Z. Kh.
    Ibragimova counts 18 tried and 13 sentenced to death, the rest - to 20 years of katorga (penal labor)(Citation: 251).
    Historian D. A. Khozhaev writes: "On 9 March 1878, at 6 o'clock in the morning, in the town of Grozny, on the fairground square, they were hanged and buried in a common pit" - and gives the list of the eleven by name(Citation: 95); Akhmadov and Khasmagomadov add: the execution took place "amid dead silence and the evident sympathy of the assembled townspeople for those being executed"(Citation: 125).
    A participant in the suppression who was present at the execution admitted: "I was struck by the calm with which these people died"(Citation: 251).
    The bodies, buried by the authorities in a common pit, were secretly reburied by Chechens at night according to Muslim rites - historian D. A. Khozhaev relays the tradition of a cemetery near Samashki, historian Z. Kh.
    Ibragimova - of the Tyrtov grove near Grozny(Citation: 95)(Citation: 251).
  uk: |-
    Військово-польовий суд засідав у Грозному 4-6 березня 1878 року: «Із 17 підсудних 11 було засуджено до смертної кари, зокрема Алібек-Хаджі, Ума Дуєв, один із його синів і Дада Залмаєв»(Citation: 125); історик З. Х. Ібрагімова рахує 18 підсудних і 13 засуджених, решту - до 20 років каторги(Citation: 251).
    Історик Д. А. Хожаєв пише: «9 березня 1878 року о 6 годині ранку в місті Грозному на ярмарковій площі їх було повішено й зарито в спільній ямі» - і подає поіменний список одинадцятьох(Citation: 95); Ахмадов і Хасмагомадов додають: страта пройшла «при гробовому мовчанні та явному співчутті зібраних городян до страчуваних»(Citation: 125).
    Учасник придушення, присутній на страті, визнав: «Мене вразив спокій, з яким ці люди помирали»(Citation: 251).
    Тіла, зариті владою у спільній ямі, чеченці вночі таємно перепоховали за мусульманським обрядом - історик Д. А. Хожаєв передає переказ про кладовище біля Самашок, історик З. Х. Ібрагімова - про гай Тиртова під Грозним(Citation: 95)(Citation: 251).
