description:
  ru: |-
    Свистунов, начальник Терской области, предписал начальнику Аргунского округа 20 августа 1877 года: «В случае не только принятия мятежников каким-либо аулом, но малейшего в нем беспорядка или ослушания властям, вы будете присылать в Грозный аманатов такого аула, а я их буду расстреливать» (аманат - человек, которого империя забирала из общины как заложника)(Citation: 253).
    Полковник Батьянов, по историку З. Х. Ибрагимовой, заявлял, что полагает «полезною мерою расстрелять из числа аманатов по пять человек каждого отложившегося аула»(Citation: 251).
  en: |-
    Svistunov, head of the Terek oblast, ordered the head of the Argun okrug on 20 August 1877: "In the event not only of any aul receiving the mutineers, but of the slightest disorder in it or disobedience to the authorities, you will send the amanats of that aul to Grozny, and I will have them shot" (amanat - a person the empire took from a community as a hostage)(Citation: 253).
    Colonel Batyanov, according to historian Z. Kh.
    Ibragimova, declared that he considered it "a useful measure to shoot five of the amanats of every aul that had broken away"(Citation: 251).
  uk: |-
    Свистунов, начальник Терської області, приписав начальникові Аргунського округу 20 серпня 1877 року: «У разі не тільки прийняття заколотників яким-небудь аулом, а й найменшого в ньому безладу чи непослуху владі, ви надсилатимете до Грозного аманатів такого аулу, а я їх розстрілюватиму» (аманат - людина, яку імперія забирала з громади як заручника)(Citation: 253).
    Полковник Батьянов, за істориком З. Х. Ібрагімовою, заявляв, що вважає «корисним заходом розстріляти з числа аманатів по п'ять осіб кожного аулу, що відпав»(Citation: 251).
