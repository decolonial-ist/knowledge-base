description:
  ru: 'По итогам подавления восстания 1877 года империя отбирала землю горных обществ: историк З. Х. Ибрагимова фиксирует - «Тысячи жителей горных селений были переселены на плоскость, земли их конфисковывались»(Citation: 251).'
  en: |-
    Following the suppression of the 1877 uprising the empire took away the land of the mountain communities: historian Z. Kh.
    Ibragimova records - "Thousands of inhabitants of mountain villages were resettled onto the plain; their lands were confiscated"(Citation: 251).
  uk: 'За підсумками придушення повстання 1877 року імперія відбирала землю гірських громад: історик З. Х. Ібрагімова фіксує - «Тисячі жителів гірських селищ було переселено на рівнину, землі їхні конфісковувалися»(Citation: 251).'
