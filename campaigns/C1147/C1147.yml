name:
  ru: Массовое убийство старшин, созванных на показательную экзекуцию в Герзель-ауле (1825)
  en: Mass Killing of Elders Summoned to a Demonstrative Execution at Gerzel-Aul (1825)
  uk: Масове вбивство старшин, скликаних на показову екзекуцію в Герзель-аулі (1825)
description:
  ru: |-
    В июле 1825 года, в разгар восстания Бейбулата Таймиева, Российская империя истребила старшин, созванных под предлогом разбирательства.
    Историк Д. А. Хожаев пишет, что после пятидневной осады Герзель-аульского укрепления повстанцами «царские генералы решили устроить показательную экзекуцию для устрашения горцев»: в укрепление были вызваны «318 человек из уважаемых людей аксаевских (кумыкских и чеченских) селений», которых генерал Лисаневич, «выкликая поочередно собравшихся, на кумыкском языке угрожал им, подвергал оскорблениям»(Citation: 95).
    Когда генерал Греков попытался «нанести оскорбление действием» чеченцу мулле Учару-хаджи из села Майртуп, тот убил Грекова кинжалом и смертельно ранил Лисаневича, после чего «после команды Лисаневича „Коли!" началось массовое истребление солдатами всех безоружных горцев, бывших в укреплении»(Citation: 95).
    Имперский историк Потто подтверждает, что оба генерала «пали от руки фанатика», после чего «снова загорелся мятеж с удвоенной силой»(Citation: 75).
  en: |-
    In July 1825, at the height of Beibulat Taimiev’s uprising, the Russian Empire exterminated elders summoned under the pretext of an inquiry.
    The historian D. A. Khozhaev writes that after the insurgents’ five-day siege of the Gerzel-Aul fortification, “the tsarist generals decided to stage a demonstrative execution to intimidate the highlanders”: summoned to the fortification were “318 respected men of the Aksai (Kumyk and Chechen) villages,” whom General Lisanevich, “calling out those assembled one by one, threatened in the Kumyk language and subjected to insults”(Citation: 95).
    When General Grekov attempted to “inflict a physical insult” on the Chechen mullah Uchar-Hadji from the village of Mairtup, the latter killed Grekov with a dagger and mortally wounded Lisanevich, after which, “upon Lisanevich’s command ‘Stab them!’, the mass extermination by the soldiers of all the unarmed highlanders present in the fortification began”(Citation: 95).
    The imperial historian Potto confirms that both generals “fell at the hand of a fanatic,” after which “the mutiny flared up again with redoubled force”(Citation: 75).
  uk: |-
    У липні 1825 року, у розпал повстання Бейбулата Таймієва, Російська імперія винищила старшин, скликаних під приводом розгляду.
    Історик Д. А. Хожаєв пише, що після п’ятиденної облоги Герзель-аульського укріплення повстанцями «царські генерали вирішили влаштувати показову екзекуцію для залякування горців»: до укріплення були викликані «318 осіб із шанованих людей аксаївських (кумицьких і чеченських) селищ», яким генерал Лисаневич, «викликаючи по черзі присутніх, кумицькою мовою погрожував, піддавав образам»(Citation: 95).
    Коли генерал Греков спробував «завдати образи дією» Чеченцю муллі Учару-хаджі з села Майртуп, той убив Грекова кинджалом і смертельно поранив Лисаневича, після чого «після команди Лисаневича „Коли!“ почалося масове винищення солдатами всіх беззбройних горців, які були в укріпленні»(Citation: 95).
    Імперський історик Потто підтверджує, що обидва генерали «загинули від руки фанатика», після чого «знову спалахнув заколот із подвоєною силою»(Citation: 75).
