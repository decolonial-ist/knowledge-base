description:
  ru: |-
    Российская империя устраняла руководящий слой сопротивления, заманив его под предлогом разбирательства.
    Историк Д. А. Хожаев пишет, что под видом «показательной экзекуции» в Герзель-аульское укрепление были вызваны «318 человек из уважаемых людей аксаевских (кумыкских и чеченских) селений» — старшины и почитаемые люди обществ, которых генерал Лисаневич «выкликая поочередно собравшихся», после убийства генералов скомандовал истребить: «после команды Лисаневича „Коли!" началось массовое истребление солдатами всех безоружных горцев, бывших в укреплении»(Citation: 95).
  en: |-
    The Russian Empire eliminated the leadership stratum of the resistance by luring it in under the pretext of an inquiry.
    Historian D. A. Khozhaev writes that under the guise of a «demonstrative execution», «318 respected men from the Aksai (Kumyk and Chechen) villages» — elders and revered men of the communities — were summoned to the Gerzel-aul fortification; General Lisanevich, «calling out those assembled one by one», after the killing of the generals ordered their extermination: «after Lisanevich's command „Stab them!" the mass extermination by the soldiers of all the unarmed highlanders present in the fortification began»(Citation: 95).
  uk: |-
    Російська імперія усувала керівний прошарок опору, заманивши його під приводом розгляду.
    Історик Д. А. Хожаєв пише, що під виглядом «показової екзекуції» до Герзель-аульського укріплення були викликані «318 осіб із шанованих людей аксаївських (кумицьких і чеченських) селищ» — старшини та шановані люди громад, яких генерал Лисаневич, «викликаючи по черзі зібраних», після вбивства генералів скомандував винищити: «після команди Лисаневича „Коли!" почалося масове винищення солдатами всіх беззбройних горців, які були в укріпленні»(Citation: 95).
