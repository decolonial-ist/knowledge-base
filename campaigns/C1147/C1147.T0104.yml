description:
  en: |-
    The Russian Empire exterminated unarmed people whom it had itself convened under the pretext of an inquiry.
    Historian D. A. Khozhaev writes that after General Grekov attempted «to inflict a physical insult» on the Chechen mullah Uchar-Hadji from the village of Mayrtup and was killed by him, «after Lisanevich's command „Stab them! the mass extermination by the soldiers of all the unarmed highlanders present in the fortification began»(Citation: 95).
    The imperial historian Potto confirms that both generals «fell at the hand of a fanatic»(Citation: 75)."
  uk: |-
    Російська імперія винищувала беззбройних людей, яких сама ж скликала під приводом розгляду.
    Історик Д. А. Хожаєв пише, що після того як генерал Греков спробував «завдати образи дією» Чеченцеві муллі Учару-хаджі з села Майртуп і був ним убитий, «після команди Лисаневича „Коли! почалося масове винищення солдатами всіх беззбройних горців, які були в укріпленні»(Citation: 95).
    Імперський історик Потто підтверджує, що обидва генерали «загинули від руки фанатика»(Citation: 75)."
  ru: |-
    Российская империя истребляла безоружных людей, ею же созванных под предлогом разбирательства.
    Историк Д. А. Хожаев пишет, что после того как генерал Греков попытался «нанести оскорбление действием» чеченцу мулле Учару-хаджи из села Майртуп и был им убит, «после команды Лисаневича „Коли! началось массовое истребление солдатами всех безоружных горцев, бывших в укреплении»(Citation: 95).
    Имперский историк Потто подтверждает, что оба генерала «пали от руки фанатика»(Citation: 75)."
