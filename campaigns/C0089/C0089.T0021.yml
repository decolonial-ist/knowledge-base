description:
  ru: |-
    Массовые аресты членов Украинской Хельсинкской группы и фабрикация уголовных дел: Василь Стус «12 января 1972 арестован вместе с другими украинскими литераторами-правозащитниками: И.Светличным, Е.Сверстюком, Игорем и Ириной Калинцами», а после вступления в Хельсинкскую группу в октябре 1979 года был «14 мая 1980 арестован вторично» и осужден на 10 лет заключения и 5 лет ссылки(Citation: 196).
    Он «умер в карцере лагеря особого режима ВС-389/36» и был похоронен «в безымянной могиле под № 9 на лагерном кладбище»(Citation: 196).
  en: |-
    Mass arrests of members of the Ukrainian Helsinki Group and the fabrication of criminal cases: Vasyl Stus was "arrested on January 12, 1972 together with other Ukrainian writer-human rights defenders: I. Svitlychny, Ye.
    Sverstiuk, Ihor and Iryna Kalynets," and after joining the Helsinki Group in October 1979 he was "arrested a second time on May 14, 1980" and sentenced to 10 years of imprisonment and 5 years of exile(Citation: 196).
    He "died in the punishment cell of special-regime camp VS-389/36" and was buried "in a nameless grave under No. 9 in the camp cemetery"(Citation: 196).
  uk: |-
    Масові арешти членів Української Гельсінської групи та фабрикація кримінальних справ: Василь Стус «12 січня 1972 заарештований разом з ін. укр. літераторами-правозахисниками: І.Світличним, Є.Сверстюком, Ігорем та Іриною Калинцями», а після вступу до Гельсінської групи в жовтні 1979 року був «14 травня 1980 заарештований вдруге» і засуджений на 10 років ув'язнення та 5 років заслання(Citation: 196).
    Він «помер у карцері табору особливого режиму ВС-389/36» і був похований «в безіменній могилі під № 9 на табірному кладовищі»(Citation: 196).
