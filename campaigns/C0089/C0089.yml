name:
  en: The "General Pogrom" of Human Rights Defenders and Punitive Psychiatry (1972–1985)
  uk: «Генеральний погром» правозахисників і каральна психіатрія (1972–1985)
  ru: «Генеральный погром» правозащитников и карательная психиатрия (1972–1985)
description:
  en: |-
    The apogee of repressions under V. Shcherbytsky.
    Mass arrests of members of the Ukrainian Helsinki Group and of dissidents: emblematic is the fate of the poet Vasyl Stus, arrested in 1972 "together with other Ukrainian writer-human rights defenders" and a second time in 1980 - for his participation in the Helsinki Group(Citation: 196).
    To neutralize dissenters, punitive psychiatry was applied on a mass scale - declaring healthy people insane in order to isolate them indefinitely and subject them to torture by medication(Citation: 31).
    Many human rights defenders never regained their freedom: Stus "died in the punishment cell of special-regime camp VS-389/36" on the night of September 3–4, 1985(Citation: 196).
  uk: |-
    Апогей репресій за В. Щербицького.
    Масові арешти членів Української Гельсінської групи та дисидентів: показовою є доля поета Василя Стуса, заарештованого 1972 року «разом з ін. укр. літераторами-правозахисниками» і вдруге 1980-го - вже за участь у Гельсінській групі(Citation: 196).
    Для нейтралізації інакодумців масово застосовувалася каральна психіатрія - оголошення здорових людей божевільними для їх безстрокової ізоляції та медикаментозних тортур(Citation: 31).
    Багато правозахисників так і не вийшли на волю: Стус «помер у карцері табору особливого режиму ВС-389/36» у ніч з 3 на 4 вересня 1985 року(Citation: 196).
  ru: |-
    Апогей репрессий при В. Щербицком.
    Массовые аресты членов Украинской Хельсинкской группы и диссидентов: показательна судьба поэта Василя Стуса, арестованного в 1972 году «вместе с другими украинскими литераторами-правозащитниками» и вторично в 1980-м - уже за участие в Хельсинкской группе(Citation: 196).
    Для нейтрализации инакомыслящих массово применялась карательная психиатрия - объявление здоровых людей сумасшедшими для их бессрочной изоляции и медикаментозных пыток(Citation: 31).
    Многие правозащитники так и не вышли на свободу: Стус «умер в карцере лагеря особого режима ВС-389/36» в ночь с 3 на 4 сентября 1985 года(Citation: 196).
