description:
  ru: |-
    Использование политических судебных процессов, допросов и административного давления КГБ на подписантов «Письма 139» для создания атмосферы страха в культурной среде: «Начались административные репрессии против „подписантов“, кагэбистское давление.
    По Киеву и Украине пошли слухи о существовании подпольной террористической бандеровской организации, управляемой западными спецслужбами»(Citation: 188).
  en: |-
    Use of political trials, interrogations, and administrative pressure by the KGB on the signatories of the "Letter of 139" to create an atmosphere of fear in cultural circles: "Administrative repressions against the 'signatories' began, along with KGB pressure.
    Rumors spread across Kyiv and Ukraine about the existence of an underground terrorist Banderite organization run by Western intelligence services"(Citation: 188).
  uk: |-
    Використання політичних судових процесів, допитів та адміністративного тиску КДБ на підписантів «Листа 139» для створення атмосфери страху в культурному середовищі: «Почалися адміністративні репресії проти „підписанців“, кагебістський тиск.
    Києвом і Україною пішли чутки про існування підпільної терористичної бандерівської організації, керованої західними спецслужбами»(Citation: 188).
