description:
  ru: 'Использование Советом народных комиссаров местных большевистских ячеек в качестве легальной политической силы, которая должна была выступить от имени украинского пролетариата против Центральной Рады(Citation: 25).'
  en: 'Use by the Council of People''s Commissars of local Bolshevik cells as a legal political force that was to speak on behalf of the Ukrainian proletariat against the Central Rada(Citation: 25).'
  uk: 'Використання Радою народних комісарів місцевих більшовицьких осередків як легальної політичної сили, що мала виступити від імені українського пролетаріату проти Центральної Ради(Citation: 25).'
