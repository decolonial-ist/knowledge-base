name:
  ru: Провал политического захвата УНР в Киеве (ноябрь – декабрь 1917)
  en: Failure of the Political Seizure of the UNR in Kyiv (November – December 1917)
  uk: Провал політичного захоплення УНР у Києві (листопад – грудень 1917)
description:
  ru: |-
    Первая попытка Советской России (Российской Советской Республики) ликвидировать независимость Украины путем перехвата власти на Всеукраинском съезде советов.
    Большевистское правительство (СНК) планировало внедрить своих делегатов, искусственно создать большинство и легально проголосовать за передачу власти подконтрольным Советам.
    Украинское руководство распознало угрозу и мобилизовало своих сторонников, оставив делегатов агрессора в абсолютном меньшинстве и сорвав захват(Citation: 22)(Citation: 25).
  en: |-
    The first attempt by Soviet Russia (the Russian Soviet Republic) to liquidate Ukraine's independence by hijacking power at the All-Ukrainian Congress of Soviets.
    The Bolshevik government (the Sovnarkom) planned to plant its delegates, artificially create a majority, and legally vote to transfer power to the Soviets under its control.
    The Ukrainian leadership recognized the threat and mobilized its supporters, leaving the aggressor's delegates in an absolute minority and thwarting the takeover(Citation: 22)(Citation: 25).
  uk: |-
    Перша спроба Радянської Росії (Російської Радянської Республіки) ліквідувати незалежність України шляхом перехоплення влади на Всеукраїнському з'їзді рад.
    Більшовицький уряд (РНК) планував впровадити своїх делегатів, штучно створити більшість і легально проголосувати за передання влади підконтрольним радам.
    Українське керівництво розпізнало загрозу й мобілізувало своїх прихильників, залишивши делегатів агресора в абсолютній меншості та зірвавши захоплення(Citation: 22)(Citation: 25).
