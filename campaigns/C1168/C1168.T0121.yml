description:
  ru: |-
    Историк Н. И. Покровский пишет о Малой Чечне (равнинно-предгорной западной части Чечни): её жители «еще в начале пятидесятых годов были загнаны русскими войсками в горные трущобы и обречены на голод» (кампания C1166)(Citation: 129).
    Просеки продолжали ту же работу: «Расчистка гехинской просеки дает Евдокимову возможность опустошить поля тех из малочеченцев, которые еще не принесли покорности, скрываясь в горах»(Citation: 129).
    Выбор, который оставляла политика, сформулирован в рапорте генерала Евдокимова, командовавшего Чеченским отрядом, от 25 марта 1857 года: бегство в горы - или выход «къ намъ на поляны»(Citation: 109); голод в горах делал первый путь смертельным.
  en: |-
    Historian N. I. Pokrovsky writes of Lesser Chechnya (the lowland-piedmont western part of Chechnya): its inhabitants "as early as the beginning of the fifties had been driven by Russian troops into the mountain wilds and doomed to starvation" (campaign C1166)(Citation: 129).
    The clearings continued the same work: "The clearing of the Gekhi proseka gives Yevdokimov the opportunity to lay waste the fields of those of the Lesser Chechnya people who had not yet brought submission, hiding in the mountains"(Citation: 129).
    The choice the policy left open is formulated in the report of General Yevdokimov, who commanded the Chechen Detachment, of 25 March 1857: flight into the mountains - or coming out "to us onto the glades"(Citation: 109); famine in the mountains made the first path lethal.
  uk: |-
    Історик М. І. Покровський пише про Малу Чечню (рівнинно-передгірну західну частину Чечні): її жителі «ще на початку п'ятдесятих років були загнані російськими військами в гірські нетрі й приречені на голод» (кампанія C1166)(Citation: 129).
    Просіки продовжували ту саму роботу: «Розчищення гехінської просіки дає Євдокимову можливість спустошити поля тих із малочеченців, які ще не принесли покірності, ховаючись у горах»(Citation: 129).
    Вибір, який залишала політика, сформульовано в рапорті генерала Євдокимова, який командував Чеченським загоном, від 25 березня 1857 року: втеча в гори - або вихід «до нас на галявини»(Citation: 109); голод у горах робив перший шлях смертельним.
