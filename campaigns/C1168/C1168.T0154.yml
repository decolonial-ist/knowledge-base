description:
  en: |-
    In November 1858 General Yevdokimov, by his own journal, "found it more advantageous to put the peaceful native population to use": naib (district governor under the imam) Saib-Dulla with more than two thousand armed Chechens forced into surrender the auls of the upper Fortanga and Assa, which "handed over to Saib-Dulla 27 Russian captives and amanats from the best families" (an amanat - a person the empire took from a community as a hostage)(Citation: 109).
    Former naibs of the Imamate the authorities preserved for future service: Colonel Belik, according to Yevdokimov's report of 8 September 1858 cited by historian N. I. Pokrovsky, "was instilling order and establishing the first principles of administration in the newly submitting societies; victims persecuted by the people sought refuge with him"(Citation: 129).
    On 4 July 1859, according to historian D. A. Khozhayev, Chechen elders came to Baryatinsky, commander-in-chief of the Caucasus Army: "a Chechen deputation of honored men, among whom were the former naibs Talkhig, Eski, Edil, Duba, Umalat, appeared at the Groznaya fortress before Prince Baryatinsky" - that is Talkhig Shalinsky, naib of Greater Chechnya and chief of the Imamate's artillery, and Duba Vashendaroyevsky, naib of Lesser Chechnya; the naibs who went over "received tsarist ranks, awards, and were appointed naibs of the same districts where they had once served Shamil"(Citation: 95).
    On 19 August 1859 commander-in-chief Baryatinsky gave "preliminary consent to the allotment of lands in Chechnya and on the Kumyk plain" to Sub-lieutenant Askhanov, Lieutenant colonel Chermoyev and Penzulayev(Citation: 126).
    Historian N. I. Pokrovsky summed up the outcome: "the heads of the tsarist administration in Chechnya and Dagestan after 1859 are persons well known to us as Shamil's naibs"(Citation: 129).
  uk: |-
    У листопаді 1858 року генерал Євдокимов, за власним журналом, «знайшов вигіднішим ужити в діло мирне тубільне населення»: наїб (управитель округу при імамі) Саїб-Дулла з понад двома тисячами озброєних чеченців примусив до здачі аули верхів'їв Фортанги й Асси, які «видали Саїб-Дуллі 27 чол. російських полонених і аманатів із найкращих фамілій» (аманат - людина, яку імперія забирала з громади як заручника)(Citation: 109).
    Колишніх наїбів імамату влада берегла для майбутньої служби: полковник Бєлік, за рапортом Євдокимова від 8 вересня 1858 року, який цитує історик М. І. Покровський, «наводив порядок і встановлював перші начала управління в товариствах, що знову покоряються; жертви, переслідувані народом, шукали в нього притулку»(Citation: 129). 4 липня 1859 року, за істориком Д. А. Хожаєвим, чеченські старшини прийшли до головнокомандувача Кавказької армії Барятинського: «чеченська депутація почесних осіб, серед яких були колишні наїби Талхіг, Ескі, Еділ, Дуба, Умалат, з'явилася у фортецю Грозну до князя Барятинського» - це Талхіг Шалінський, наїб Великої Чечні й начальник артилерії імамату, і Дуба Вашендароєвський, наїб Малої Чечні; наїби, що перейшли, «отримали царські чини, нагороди і були призначені наїбами тих самих дільниць, де колись вони служили Шамілю»(Citation: 95). 19 серпня 1859 року головнокомандувач Барятинський дав «попередню згоду на відведення земель у Чечні і на Кумицькій площині» підпоручикові Асханову, підполковникові Чермоєву і Пензулаєву(Citation: 126).
    Підсумок підбив історик М. І. Покровський: «головами царської адміністрації в Чечні і Дагестані після 1859 р. виступають особи, добре знайомі нам як наїби Шаміля»(Citation: 129).
  ru: |-
    В ноябре 1858 года генерал Евдокимов, по собственному журналу, «нашелъ болѣе выгоднымъ употребить въ дѣло мирное туземное населеніе»: наиб (управляющий округом при имаме) Саиб-Дулла с двумя с лишним тысячами вооружённых чеченцев принудил к сдаче аулы верховьев Фортанги и Ассы, которые «выдали Саибъ-Дуллѣ 27 чел. русскихъ плѣнныхъ и аманатовъ изъ лучшихъ фамилій» (аманат - человек, которого империя забирала из общины как заложника)(Citation: 109).
    Бывших наибов имамата власть берегла для будущей службы: полковник Белик, по рапорту Евдокимова от 8 сентября 1858 года, который цитирует историк Н. И. Покровский, «водворял порядок и устанавливал первые начала управления во вновь покоряющихся обществах; жертвы, преследуемые народом, искали у него убежища»(Citation: 129). 4 июля 1859 года, по историку Д. А. Хожаеву, чеченские старшины пришли к главнокомандующему Кавказской армией Барятинскому: «чеченская депутация почетных лиц, среди которых были бывшие наибы Талхиг, Эски, Эдил, Дуба, Умалат, явилась в крепость Грозную к князю Барятинскому» - это Талхиг Шалинский, наиб Большой Чечни и начальник артиллерии имамата, и Дуба Вашендароевский, наиб Малой Чечни; перешедшие наибы «получили царские чины, награды и были назначены наибами тех же участков, где когда-то они служили Шамилю»(Citation: 95). 19 августа 1859 года главнокомандующий Барятинский дал «предварительное согласие на отвод земель в Чечне и на Кумыкской плоскости» подпоручику Асханову, подполковнику Чермоеву и Пензулаеву(Citation: 126).
    Итог подвёл историк Н. И. Покровский: «главами царской администрации в Чечне и Дагестане после 1859 г. выступают лица, хорошо знакомые нам как наибы Шамиля»(Citation: 129).
