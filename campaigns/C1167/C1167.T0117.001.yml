description:
  en: |-
    Cossack stanitsas continued to rise on the sites of Chechen auls: in 1856-1857 on the site of the village Churt-Togi the stanitsa Petropavlovskaya was planted - historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov give the pair in their general series: "the village of Churt-Togi - the stanitsa Petropavlovskaya (1856)"(Citation: 125).
    The method was confirmed in writing the same year by General Muravyov, commander-in-chief in the Caucasus: "to consolidate our dominion by stanitsas moved forward - is a method already tried with profit, and it should not be changed"(Citation: 125).
  uk: |-
    Козачі станиці продовжували вставати на місцях чеченських аулів: у 1856-1857 роках на місці селища Чурт-Тогі поставлено станицю Петропавловську - історики Я. З. Ахмадов і Е. Х. Хасмагомадов дають пару в загальному ряду: «селище Чурт-Тогі - станиця Петропавловська (1856 р.)»(Citation: 125).
    Метод того ж року підтвердив письмово генерал Муравйов, головнокомандувач на Кавказі: «зміцнювати панування наше переселюваними вперед станицями - є спосіб, уже з користю випробуваний, і його не слід змінювати»(Citation: 125).
  ru: |-
    Казачьи станицы продолжали вставать на местах чеченских аулов: в 1856-1857 годах на месте селения Чурт-Тоги поставлена станица Петропавловская - историки Я. З. Ахмадов и Э. Х. Хасмагомадов дают пару в общем ряду: «селение Чурт-Тоги - станица Петропавловская (1856 г.)»(Citation: 125).
    Метод в том же году подтвердил письменно генерал Муравьёв, главнокомандующий на Кавказе: «упрочивать владычество наше переселяемыми вперед станицами - есть способ, уже с пользой испытанный, и его не следует изменять»(Citation: 125).
