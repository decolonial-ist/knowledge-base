description:
  ru: |-
    Даже принимая перебежчиков из верхушки имамата, империя страховалась заложниками.
    Когда в начале февраля 1854 года на имперскую сторону переходил Умаев, наиб Малой Чечни (наместник имама Шамиля, руководителя сопротивления горцев Дагестана и Чечни российскому завоеванию), пристав (назначенный империей надзиратель) потребовал гарантию - подполковник Предемиров рапортом генералу Вревскому от 6 февраля 1854 года: «опасаясь со стороны его измены и не желая через то понести из-за него потерю в людях, я потребовал, чтобы он предварительно дал аманат. 3-го февраля был доставлен в аманаты к приставу сын Эндирея» (аманат - человек, которого империя забирала из общины как заложника)(Citation: 126).
    Ребёнок наиба стал платой за право отца сдаться.
  en: |-
    Even when receiving defectors from the top of the Imamate, the empire insured itself with hostages.
    When at the beginning of February 1854 Umayev, naib of Lesser Chechnya (a deputy of Imam Shamil, leader of the highlanders' resistance of Dagestan and Chechnya to the Russian conquest), was coming over to the imperial side, the pristav (an imperial superintendent) demanded a guarantee - Lieutenant Colonel Predemirov, in a report to General Vrevsky of 6 February 1854: "fearing treason on his part and not wishing thereby to suffer a loss in men because of him, I demanded that he first give an amanat.
    On 3 February the son of Endirey was delivered as an amanat to the pristav" (an amanat is a person whom the empire took from a community as a hostage)(Citation: 126).
    The naib's child became the price of the father's right to surrender.
  uk: |-
    Навіть приймаючи перебіжчиків з верхівки імамату, імперія страхувалася заручниками.
    Коли на початку лютого 1854 року на імперський бік переходив Умаєв, наїб Малої Чечні (намісник імама Шаміля, керівника опору горців Дагестану і Чечні російському завоюванню), пристав (призначений імперією наглядач) зажадав гарантію - підполковник Предеміров рапортом генералу Вревському від 6 лютого 1854 року: «побоюючись з його боку зради і не бажаючи через те зазнати через нього втрати в людях, я зажадав, щоб він попередньо дав аманата. 3-го лютого був доставлений в аманати до пристава син Ендірея» (аманат - людина, яку імперія забирала з громади як заручника)(Citation: 126).
    Дитина наїба стала платою за право батька здатися.
