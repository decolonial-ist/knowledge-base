description:
  en: |-
    At the destruction of the aul Khan-Kala, also known as Syurin-Kort, the troops of the march of Baryatinsky, who commanded on the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), entered the inhabitants and their cattle as their booty.
    Imperial historian Volkonsky drew up the account: "three hundred fifty Syurin-Kort people and more than three thousand head of horned cattle became our asset, our, so to speak, property"(Citation: 119).
  uk: |-
    При знищенні аулу Хан-Кала, він же Сюрін-Корт, війська походу Барятинського, який командував на лівому фланзі Кавказької лінії (ланцюга імперських укріплень на землі нохчі), записали жителів та їхню худобу собі у здобич.
    Імперський історик Волконський підбив рахунок: «триста п’ятдесят людей сюрін-кортців і понад три тисячі голів рогатої худоби стали нашим надбанням, нашою, так би мовити, власністю»(Citation: 119).
  ru: |-
    При уничтожении аула Хан-Кала, он же Сюрин-Корт, войска похода Барятинского, командовавшего на левом фланге Кавказской линии (цепи имперских укреплений на земле нохчи), записали жителей и их скот себе в добычу.
    Имперский историк Волконский подвёл счёт: «триста пятьдесят человек сюрин-кортцев и более трех тысяч голов рогатого скота сделались нашим достоянием, нашею, так сказать, собственностью»(Citation: 119).
