description:
  en: |-
    The bought-over naibs conducted reconnaissance for the empire and took part in planning the marches.
    Imperial historian Volkonsky writes of Bata Shamurzayev, a naib of Shamil (deputy of the Imam, leader of the highlanders' resistance of Dagestan and Chechnya to the Russian conquest) who had gone over to the empire: Bata "had his agents everywhere, informing him of all Shamil's movements," and the winter expedition of 1852 "was undertaken and conducted by Prince Baryatinsky" on Bata's directions; "The chief of the detachment did not conceal that for the successful taking of the auls he owed much to Bata as well"(Citation: 119).
    Baryatinsky, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), in a letter to Vorontsov, viceroy in the Caucasus, of 4 June 1852 confirmed: "Bata has passed on to me much of interest concerning Shamil's secret intrigues among the Ossetians"(Citation: 129).
    In July 1856 Yusuf-Hadji Safarov, a former counselor of the Imamate, defected to the empire and offered his knowledge to Baryatinsky in writing: "I know much about Shamil and his troops...
    I hope to be useful to the Russian government and I guarantee to destroy everything I made at Shamil's, because the master of the house knows best what goes on in it"(Citation: 125).
  uk: |-
    Перекуплені наїби вели для імперії розвідку і брали участь у плануванні походів.
    Імперський історик Волконський пише про Бату Шамурзаєва, наїба Шаміля (намісника імама, керівника опору горців Дагестану і Чечні російському завоюванню), що перейшов до імперії: Бата «мав повсюди своїх агентів, які повідомляли йому про всі рухи Шаміля», а зимова експедиція 1852 року «була розпочата і ведена князем Барятинським» за вказівками Бати; «Начальник загону не приховував, що успішним узяттям аулів він багато завдячує і Баті»(Citation: 119).
    Барятинський, що командував на лівому фланзі Кавказької лінії (ланцюга імперських укріплень на землі нохчі), листом Воронцову, наміснику на Кавказі, від 4 червня 1852 року підтверджував: «Бата мені передав багато цікавого щодо секретних інтриг Шаміля в осетинів»(Citation: 129).
    У липні 1856 року до імперії перебіг Юсуф-Хаджі Сафаров, колишній радник імамату, і письмово запропонував свої знання Барятинському: «Знаю багато про Шаміля та його війська... сподіваюся бути корисним російському урядові і ручаюся знищити все зроблене мною у Шаміля, бо господар дому краще знає, що в ньому робиться»(Citation: 125).
  ru: |-
    Перекупленные наибы вели для империи разведку и участвовали в планировании походов.
    Имперский историк Волконский пишет о Бате Шамурзаеве, перешедшем к империи наибе Шамиля (наместнике имама, руководителя сопротивления горцев Дагестана и Чечни российскому завоеванию): Бата «имел повсюду своих агентов, сообщавших ему обо всех движениях Шамиля», а зимняя экспедиция 1852 года «была предпринята и ведена князем Барятинским» по указаниям Баты; «Начальник отряда не скрывал, что успешным взятием аулов он много обязан и Бате»(Citation: 119).
    Барятинский, командовавший на левом фланге Кавказской линии (цепи имперских укреплений на земле нохчи), письмом Воронцову, наместнику на Кавказе, от 4 июня 1852 года подтверждал: «Бата мне передал много интересного относительно секретных происков Шамиля у осетин»(Citation: 129).
    В июле 1856 года к империи перебежал Юсуф-Хаджи Сафаров, бывший советник имамата, и письменно предложил свои знания Барятинскому: «Знаю многое о Шамиле и его войсках... надеюсь быть полезным русскому правительству и ручаюсь уничтожить все сделанное мною у Шамиля, потому что хозяин дома лучше знает, что в нем делается»(Citation: 125).
