description:
  en: 'The clearings took from the Chechens the land that fed them, and the empire entered this seizure on its books: the order of Vorontsov, viceroy in the Caucasus, for the Separate Caucasus Corps of 5 January 1853 counted the result of the Qachqalyq clearing: "The construction of this clearing took away from the unsubdued Chechens a significant quantity of land, which could feed up to 1,500 souls"(Citation: 107).'
  uk: 'Просіки відбирали в чеченців землю, що їх годувала, і імперія записувала це відбирання собі в актив: наказ Воронцова, намісника на Кавказі, по Окремому Кавказькому корпусу від 5 січня 1853 року рахував підсумок качкаликівської просіки: «Улаштування цієї просіки відібрало в непокірних чеченців значну кількість землі, яка могла прогодувати до 1,500 душ»(Citation: 107).'
  ru: 'Просеки отнимали у чеченцев кормившую их землю, и империя записывала этот отъём себе в актив: приказ Воронцова, наместника на Кавказе, по Отдельному Кавказскому корпусу от 5 января 1853 года считал итог качкалыковской просеки: «Устройство этой просѣки отняло у непокорныхъ Чеченцевъ значительное количество земли, которое могло прокормить до 1,500 душъ»(Citation: 107).'
