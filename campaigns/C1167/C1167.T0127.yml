description:
  en: |-
    Burning and famine drove Chechen families from their land under the empire's power - and the empire kept count of those carried off.
    On 23 March 1852 the column of General Baklanov carried off the inhabitants of two auls: imperial historian Volkonsky counts - "There were two hundred fifty-eight souls of both sexes and all ages: fifty-one families from Mazlagash and sixteen families from Gurdali"(Citation: 119); the mechanics of the choice he conveyed in the words of contemporaries about the naibs - deputies of Imam Shamil: "the naibs pluck them, we pluck them and will go on plucking... they resolved to choose the lesser of two evils, i.e. to resettle to us"(Citation: 119).
    After the destruction of Khan-Kala in December 1852, Baryatinsky, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), counted in a report of 10 February 1853: of roughly 500 inhabitants, 350 were brought to the Groznaya fortress, "the total loss of the inhabitants must be put at around 100 people" - the fate of that hundred, by the report's own admission, "is not known with exactness"(Citation: 107).
    In January 1854, after the devastation of the auls along the Dzhalka, "418 families of Chechens" were evicted(Citation: 108), and the order of General Muravyov, commander-in-chief in the Caucasus, of 19 July 1855 counts the result: "more than 1 thousand Chechen families have resettled into our submissive auls"(Citation: 108).
    The plan for 1856 posed the choice bluntly: the Chechens were "to choose one of two things - to submit, or to move out farther into the interior of the Black Mountains"(Citation: 108).
  uk: |-
    Спалення і голод гнали чеченські родини з їхньої землі під владу імперії - й імперія вела рахунок виведеним. 23 березня 1852 року колона генерала Бакланова вивела жителів двох аулів: імперський історик Волконський рахує - «Їх було двісті п'ятдесят вісім душ обох статей і всякого віку: п'ятдесят одна родина з Мазлагаша і шістнадцять родин із Гурдалі»(Citation: 119); механіку вибору він же передав словами сучасників про наїбів - намісників імама Шаміля: «скубуть їх наїби, скубемо і будемо скубти... зважилися з двох лих вибирати краще, тобто переселитися до нас»(Citation: 119).
    Після знищення Хан-Кали в грудні 1852 року Барятинський, що командував на лівому фланзі Кавказької лінії (ланцюга імперських укріплень на землі нохчі), рапортом від 10 лютого 1853 року рахував: із приблизно 500 жителів 350 приведені у фортецю Грозну, «загальну втрату жителів слід покладати в числі близько 100 людей» - доля цієї сотні, за визнанням самого рапорту, «достеменно невідома»(Citation: 107).
    У січні 1854 року після розорення аулів по Джалці виселені «418 сімей чеченців»(Citation: 108), а наказ генерала Муравйова, головнокомандувача на Кавказі, від 19 липня 1855 року рахує підсумок: «понад 1 тис. чеченських родин переселилися в наші покірні аули»(Citation: 108).
    План на 1856 рік ставив вибір прямо: чеченцям «обрати одне з двох - підкоритися, або виселитися далі вглиб Чорних гір»(Citation: 108).
  ru: |-
    Сожжение и голод гнали чеченские семьи с их земли под власть империи - и империя вела счёт уведённым. 23 марта 1852 года колонна генерала Бакланова увела жителей двух аулов: имперский историк Волконский считает - «Их было двести пятьдесят восемь душ обоего пола и возраста: пятьдесят одно семейство из Мазлагаша и шестнадцать семейств из Гурдали»(Citation: 119); механику выбора он же передал словами современников о наибах - наместниках имама Шамиля: «щиплют их наибы, щиплем и будем щипать... решились из двух зол выбирать лучшее, т.е. переселиться к нам»(Citation: 119).
    После уничтожения Хан-Калы в декабре 1852 года Барятинский, командовавший на левом фланге Кавказской линии (цепи имперских укреплений на земле нохчи), рапортом от 10 февраля 1853 года считал: из примерно 500 жителей 350 приведены в крепость Грозную, «общую потерю жителей должно полагать въ числѣ около 100 чел.» - судьба этой сотни, по признанию самого рапорта, «въ точности неизвѣстна»(Citation: 107).
    В январе 1854 года после разорения аулов по Джалке выселены «418 сем.
    Чеченцевъ»(Citation: 108), а приказ генерала Муравьёва, главнокомандующего на Кавказе, от 19 июля 1855 года считает итог: «болѣе 1 т. Чеченскихъ семействъ переселились въ наши покорные аулы»(Citation: 108).
    План на 1856 год ставил выбор прямо: чеченцам «избрать одно изъ двухъ - покориться, или выселиться далѣе во внутрь Черныхъ горъ»(Citation: 108).
