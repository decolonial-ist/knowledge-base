description:
  ru: |-
    Период 1852-1856 годов прошёл сериями карательных выходов по Большой Чечне (равнинной восточной части Чечни) и её окраинам. 4 января 1852 года в крепости Воздвиженской собрался отряд Барятинского, командовавшего на левом фланге Кавказской линии (цепи имперских укреплений на земле нохчи): имперский историк Волконский, участник похода, считает «свыше десяти тысяч штыков, около полторы тысячи кавалерии, 24 орудия», а задачу передаёт так - «разбить неприятельские скопища, уничтожить все средства продовольствия жителей и неприятеля, и потом действовать сообразно с обстоятельствами»(Citation: 119).
    Восточнее выходы шли до 1856 года: генерал Бакланов записал в мемуарах о «сильном бою при истреблении аулов Денги-Юрт и Али-Юрт» 25 февраля 1853 года(Citation: 131).
    Наградную механику походов разоблачил изнутри имперский офицер Полторацкий: солдаты Кабардинского полка заняли оставленные чеченцами окопы на Мичике без потерь, и их «направили в тот же день брать аулы Гурдалой и Аса-Юрт, где им удалось потерять несколько убитых и раненых, что было необходимо, так как штурм окопов обошелся им без единой царапины»(Citation: 122) - аулы атаковали ради потерь для наградного представления.
  en: |-
    The period 1852-1856 passed in series of punitive sorties across Greater Chechnya (the lowland eastern part of Chechnya) and its fringes.
    On 4 January 1852 the detachment of Baryatinsky, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), assembled in the Vozdvizhenskaya fortress: imperial historian Volkonsky, a participant in the march, counts "over ten thousand bayonets, about one and a half thousand cavalry, 24 guns," and conveys the task thus - "to smash the enemy hordes, destroy all means of subsistence of the inhabitants and the enemy, and then act according to circumstances"(Citation: 119).
    Farther east the sorties continued until 1856: General Baklanov recorded in his memoirs a "hard fight at the annihilation of the auls Dengi-Yurt and Ali-Yurt" on 25 February 1853(Citation: 131).
    The award mechanics of the marches was exposed from inside by imperial officer Poltoratsky: the soldiers of the Kabardinsky regiment took the trenches abandoned by the Chechens on the Michik without losses, and they "were sent the same day to take the auls Gurdaloy and Asa-Yurt, where they managed to lose several killed and wounded, which was necessary, since the storming of the trenches had cost them not a single scratch"(Citation: 122) - the auls were attacked for the sake of losses for an award recommendation.
  uk: |-
    Період 1852-1856 років пройшов серіями каральних виходів по Великій Чечні (рівнинній східній частині Чечні) та її околицях. 4 січня 1852 року у фортеці Воздвиженській зібрався загін Барятинського, що командував на лівому фланзі Кавказької лінії (ланцюга імперських укріплень на землі нохчі): імперський історик Волконський, учасник походу, рахує «понад десять тисяч багнетів, близько півтори тисячі кавалерії, 24 гармати», а завдання передає так - «розбити ворожі скупчення, знищити всі засоби продовольства жителів і ворога, і потім діяти відповідно до обставин»(Citation: 119).
    Східніше виходи тривали до 1856 року: генерал Бакланов записав у мемуарах про «сильний бій при винищенні аулів Денгі-Юрт і Алі-Юрт» 25 лютого 1853 року(Citation: 131).
    Нагородну механіку походів викрив зсередини імперський офіцер Полторацький: солдати Кабардинського полку зайняли залишені чеченцями окопи на Мічику без втрат, і їх «направили того ж дня брати аули Гурдалой і Аса-Юрт, де їм вдалося втратити кількох убитих і поранених, що було необхідно, бо штурм окопів обійшовся їм без жодної подряпини»(Citation: 122) - аули атакували заради втрат для нагородного подання.
