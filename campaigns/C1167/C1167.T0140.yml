description:
  en: |-
    The empire felled the Qachqalyq forest, the shield of eastern Chechnya, in a month and a half.
    General Baklanov, the executor, recorded in his memoirs: "On 5 January 1852 I concentrated... three battalions of infantry... set about felling the forest; within a month I reached the Michuk... having cleared by 16 February 1852 the forest 100 sazhens from the bank, and 300 sazhens along the river" (a sazhen is slightly more than two meters)(Citation: 131).
    The result was recorded by imperial historian Volkonsky: "the ancient, dense forest that had served the highlanders as their chief defense and protection fell forever, and the Qachqalyq ridge was laid bare"(Citation: 119).
    The calculation was set out in writing by Vorontsov, viceroy and commander-in-chief in the Caucasus, in a letter to the Emperor of 1-20 March 1854, as he was handing over affairs before his leave.
    The felling he described as a system of many years: "This important business, well begun by Gen. Freytag and then strongly advanced by the annual expeditions for the felling of forests by Generals Nesterov, Kozlovsky and Prince Baryatinsky"(Citation: 107), and the result he reckoned thus: the Chechens, forced off the plain into the Black Mountains, would not be able to feed themselves there and "must in a short time come over to us, or declare submission where they are; then the weak population of the Ichkerians alone will not be able to hold out"(Citation: 107).
  uk: |-
    Імперія звела Качкаликівський ліс, захист східної Чечні, за півтора місяця.
    Генерал Бакланов, виконавець, записав у мемуарах: «5-го січня 1852 р. я зосередив... три батальйони піхоти... взявся до рубки лісу; протягом місяця дійшов до Мічука... очистивши до 16-го лютого 1852 р. ліс від берега на 100, а по річці на 300 сажнів» (сажень - трохи більше двох метрів)(Citation: 131).
    Підсумок записав імперський історик Волконський: «віковий, дрімучий ліс, що служив горцям головним захистом і обороною, впав назавжди, і качкаликівський хребет оголився»(Citation: 119).
    Розрахунок виклав письмово Воронцов, намісник і головнокомандувач на Кавказі, - листом імператору від 1-20 березня 1854 року, здаючи справи перед відпусткою.
    Рубку він описав як багаторічну систему: «Це важливе діло, добре почате ген. Фрейтагом і потім сильно посунуте щорічними експедиціями для рубки лісів ген.-ми Нестеровим, Козловським і кн.
    Барятинським»(Citation: 107), а підсумок рахував так: витіснені з рівнини в Чорні гори чеченці не зможуть там прогодуватися і «незабаром повинні до нас перейти, або оголосити покірність на місцях; тоді слабке населення ічкеринців саме не буде в змозі триматися»(Citation: 107).
  ru: |-
    Империя вырубила Качкалыковский лес, защиту восточной Чечни, за полтора месяца.
    Генерал Бакланов, исполнитель, записал в мемуарах: «5-го января 1852 г. я сосредоточил... три баталиона пехоты... приступил к рубке леса; в течение месяца дошёл до Мичука... очистив к 16-му февралю 1852 г. лес от берега на 100, а по реке на 300 сажен» (сажень - чуть больше двух метров)(Citation: 131).
    Итог записал имперский историк Волконский: «вековой, дремучий лес, служившей горцам главною защитою и обороною, пал навсегда, и качкалыковский хребет обнажился»(Citation: 119).
    Расчёт изложил письменно Воронцов, наместник и главнокомандующий на Кавказе, - письмом императору от 1-20 марта 1854 года, сдавая дела перед отпуском.
    Рубку он описал как многолетнюю систему: «Это важное дѣло, хорошо начатое ген. Фрейтагомъ и потомъ сильно подвинутое ежегодными экспедиціями для рубки лѣсовъ ген.-ми Нестеровымъ, Козловскимъ и кн.
    Барятинскимъ»(Citation: 107), а итог считал так: вытесненные с равнины в Чёрные горы чеченцы не смогут там прокормиться и «въ скоромъ времени должны къ намъ перейти, или объявить покорность на мѣстахъ; тогда слабое населеніе Ичкеринцевъ одно не будетъ въ состояніи держаться»(Citation: 107).
