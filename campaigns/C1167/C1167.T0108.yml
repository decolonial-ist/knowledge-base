description:
  ru: |-
    Голодную стратегию дополняла блокада торговли.
    Воронцов, наместник и главнокомандующий на Кавказе, письмом Барятинскому, командовавшему на левом фланге Кавказской линии (цепи имперских укреплений на земле нохчи), от 21 марта 1852 года вместе с угрозой «мы им не позволим ни сеять, ни косить» предписывал стеснить продажу соли тем, кто не подчинился империи; письмо приводит историк Н. И. Покровский(Citation: 129).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов передают по хронике дагестанского автора Геничутлинского блокаду соли, железа и бязи (хлопчатой ткани)(Citation: 125).
    В годы Крымской войны империя блокаду не ослабила: те же историки пишут - «До 200 тысяч солдат и офицеров уверенно блокируют районы действия горцев на Северном Кавказе - даже тяжелые поражения в Крыму не заставили российское командование ослабить эту блокаду»(Citation: 125).
  en: |-
    The famine strategy was supplemented by a trade blockade.
    Vorontsov, viceroy and commander-in-chief in the Caucasus, in a letter to Baryatinsky, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), of 21 March 1852, together with the threat "we will not allow them to sow or to mow," prescribed restricting the sale of salt to those who had not submitted to the empire; the letter is cited by historian N. I. Pokrovsky(Citation: 129).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov convey, after the chronicle of the Dagestani author Genichutlinsky, a blockade of salt, iron and coarse cotton cloth(Citation: 125).
    In the years of the Crimean War the empire did not loosen the blockade: the same historians write - "Up to 200 thousand soldiers and officers confidently blockade the areas of the highlanders' operations in the North Caucasus - even the heavy defeats in the Crimea did not make the Russian command loosen this blockade"(Citation: 125).
  uk: |-
    Голодну стратегію доповнювала блокада торгівлі.
    Воронцов, намісник і головнокомандувач на Кавказі, листом Барятинському, що командував на лівому фланзі Кавказької лінії (ланцюга імперських укріплень на землі нохчі), від 21 березня 1852 року разом із погрозою «ми їм не дозволимо ні сіяти, ні косити» приписував обмежити продаж солі тим, хто не підкорився імперії; лист наводить історик М. І. Покровський(Citation: 129).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов передають за хронікою дагестанського автора Генічутлінського блокаду солі, заліза та бязі (бавовняної тканини)(Citation: 125).
    У роки Кримської війни імперія блокаду не послабила: ті самі історики пишуть - «До 200 тисяч солдатів і офіцерів упевнено блокують райони дій горців на Північному Кавказі - навіть тяжкі поразки в Криму не змусили російське командування послабити цю блокаду»(Citation: 125).
