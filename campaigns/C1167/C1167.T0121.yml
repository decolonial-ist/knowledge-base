description:
  en: |-
    Famine was the planned aim of the policy of 1852-1857 - the empire wrote about it in orders and reports.
    On 29 July 1852, near the aul Belgatoy, the column, by the record of imperial historian Volkonsky, "finding there the same stores of hay as the day before, annihilated them to the last stalk"(Citation: 119).
    Baryatinsky, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), in a letter to Vorontsov, viceroy in the Caucasus, of 16 August 1852, calculated the effect on the Dagestani cavalry of Imam Shamil, leader of the highlanders' resistance of Dagestan and Chechnya to the Russian conquest: "in the coming winter expedition Shamil can have almost no Tavlin cavalry in Chechnya, because there will be nothing to feed it with"(Citation: 129).
    The doctrine was sealed by Vorontsov in an official letter (otnosheniye) to Minister of War Chernyshev of 28 August 1852: the Chechens, deprived of crops and hay, "must - either resettle into our bounds, or go into the very depth of the mountains"(Citation: 107).
    General Olshevsky summed up the practice in his notes: "The destruction of grain crops... compelled the Chechens to submit to us sooner than any other measures, resettling into our bounds"(Citation: 129).
    The result was recorded by historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov: "in 1856-1857 a famine set in in Chechnya such as the Chechens had almost never known"(Citation: 125).
  uk: |-
    Голод був спланованою метою політики 1852-1857 років - імперія писала про це в наказах і звітах. 29 липня 1852 року біля аулу Белгатой колона, за записом імперського історика Волконського, «знайшовши там такі самі запаси сіна, як і напередодні, винищила їх до останнього стебельця»(Citation: 119).
    Барятинський, що командував на лівому фланзі Кавказької лінії (ланцюга імперських укріплень на землі нохчі), листом Воронцову, наміснику на Кавказі, від 16 серпня 1852 року рахував ефект для дагестанської кінноти імама Шаміля, керівника опору горців Дагестану і Чечні російському завоюванню: «у майбутню зимову експедицію Шаміль майже не може мати в Чечні тавлінської кавалерії, бо нічим буде її продовольствувати»(Citation: 129).
    Доктрину закріпив Воронцов службовим листом (отношенієм) військовому міністрові Чернишову від 28 серпня 1852 року: позбавлені посівів і сіна чеченці «повинні - або переселитися в наші межі, або піти в саму глиб гір»(Citation: 107).
    Генерал Ольшевський підбив підсумок практиці в записках: «Знищення хлібних посівів... змушувало чеченців швидше за інші заходи підкорятися нам, переселяючись у наші межі»(Citation: 129).
    Результат зафіксували історики Я. З. Ахмадов і Е. Х. Хасмагомадов: «у 1856-1857 рр. у Чечні настав голод, якого чеченці майже ніколи не знали»(Citation: 125).
  ru: |-
    Голод был спланированной целью политики 1852-1857 годов - империя писала об этом в приказах и отчётах. 29 июля 1852 года у аула Белгатой колонна, по записи имперского историка Волконского, «найдя там такие же запасы сена, как и накануне, истребила их до последнего стебелька»(Citation: 119).
    Барятинский, командовавший на левом фланге Кавказской линии (цепи имперских укреплений на земле нохчи), письмом Воронцову, наместнику на Кавказе, от 16 августа 1852 года считал эффект для дагестанской конницы имама Шамиля, руководителя сопротивления горцев Дагестана и Чечни российскому завоеванию: «в предстоящую зимнюю экспедицию Шамиль почти не может иметь в Чечне тавлинской кавалерии, потому что нечем ее будет продовольствовать»(Citation: 129).
    Доктрину закрепил Воронцов отношением военному министру Чернышеву от 28 августа 1852 года: лишённые посевов и сена чеченцы «должны - или переселиться въ наши предѣлы, или уйти въ самую глубь горъ»(Citation: 107).
    Генерал Ольшевский подвёл итог практике в записках: «Уничтожение хлебных посевов... заставляло чеченцев скорее других мер покоряться нам, переселяясь в наши пределы»(Citation: 129).
    Результат зафиксировали историки Я. З. Ахмадов и Э. Х. Хасмагомадов: «в 1856-1857 гг. в Чечне наступил голод, которого чеченцы почти никогда не знали»(Citation: 125).
