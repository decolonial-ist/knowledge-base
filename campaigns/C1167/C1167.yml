name:
  en: '"Neither plow nor sow": the pogrom of Chechnya, organized famine, the buying-up of elites and the institutions of subjugation (1852-1857)'
  uk: '«Ні орати, ні сіяти»: погром Чечні, організований голод, перекупівля еліт та інститути підкорення (1852-1857)'
  ru: '«Ни пахать, ни сеять»: погром Чечни, организованный голод, перекупка элит и институты подчинения (1852-1857)'
description:
  en: |-
    In 1852-1857 the empire used famine to force Greater Chechnya (the lowland eastern part of Chechnya) into submission or off its land.
    The period was opened by the winter expedition of Baryatinsky, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi) - imperial historian Volkonsky, its participant, published his account under the title "The Pogrom of Chechnya"; the task of the detachment of more than ten thousand bayonets he recorded thus: "to smash the enemy hordes, destroy all means of subsistence of the inhabitants and the enemy, and then act according to circumstances"(Citation: 119).
    The destruction of food became doctrine: Vorontsov, viceroy and commander-in-chief in the Caucasus, in an official letter (otnosheniye) to Minister of War Chernyshev of 28 August 1852, reported that the Chechens, deprived of crops and hay, "must - either resettle into our bounds, or go into the very depth of the mountains"(Citation: 107).
    Back in March Vorontsov wrote to Baryatinsky: "we will not allow them to sow or to mow, unless they declare submission" - the letter of 21 March 1852 is cited by historian N. I. Pokrovsky(Citation: 129); historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov convey the same policy in the formula of the proclamations - the command warned the Chechens that it would let them "neither plow nor sow," and conclude: "This promise was kept in the literal sense, and in 1856-1857 a famine set in in Chechnya such as the Chechens had almost never known"(Citation: 125).
    In the same period the empire was buying up the leadership of the resistance - Bata Shamurzayev, a naib of Shamil (deputy of the Imam, leader of the highlanders' resistance of Dagestan and Chechnya to the Russian conquest), who went over to the empire in the autumn of 1851, received a rank, a pension and land "as an example for other potential defectors"(Citation: 125) - and was building institutions of subordination: in 1852 in the Groznaya fortress the "Chechen People's Court" was instituted, which worked out the "Rules for the Governance of Submissive Chechens"(Citation: 125).
  uk: |-
    У 1852-1857 роках імперія голодом примушувала Велику Чечню (рівнинну східну частину Чечні) до підпорядкування або відходу з землі.
    Період відкрила зимова експедиція Барятинського, що командував на лівому фланзі Кавказької лінії (ланцюга імперських укріплень на землі нохчі), - імперський історик Волконський, її учасник, видав свою розповідь під заголовком «Погром Чечні»; завдання загону в понад десять тисяч багнетів він записав так: «розбити ворожі скупчення, знищити всі засоби продовольства жителів і ворога, і потім діяти відповідно до обставин»(Citation: 119).
    Знищення їжі стало доктриною: Воронцов, намісник і головнокомандувач на Кавказі, службовим листом (отношенієм) військовому міністрові Чернишову від 28 серпня 1852 року доповів, що позбавлені посівів і сіна чеченці «повинні - або переселитися в наші межі, або піти в саму глиб гір»(Citation: 107).
    Ще в березні Воронцов писав Барятинському: «ми їм не дозволимо ні сіяти, ні косити, якщо вони не виявлять покірності» - лист від 21 березня 1852 року наводить історик М. І. Покровський(Citation: 129); історики Я. З. Ахмадов і Е. Х. Хасмагомадов передають ту саму політику формулою прокламацій - командування попереджало чеченців, що не дозволить їм «ні орати, ні сіяти», і підсумовують: «Цю обіцянку було дотримано в буквальному сенсі, і в 1856-1857 рр. у Чечні настав голод, якого чеченці майже ніколи не знали»(Citation: 125).
    Тим самим періодом імперія перекуповувала верхівку опору - Бата Шамурзаєв, наїб Шаміля (намісник імама, керівника опору горців Дагестану і Чечні російському завоюванню), що перейшов до імперії восени 1851 року, отримав чин, пенсію і землю «як приклад для інших потенційних перебіжчиків»(Citation: 125) - і будувала інститути підпорядкування: у 1852 році у фортеці Грозній засновано «Чеченський народний суд», що виробив «Правила для управління покірними чеченцями»(Citation: 125).
  ru: |-
    В 1852-1857 годах империя голодом принуждала Большую Чечню (равнинную восточную часть Чечни) к подчинению или уходу с земли.
    Период открыла зимняя экспедиция Барятинского, командовавшего на левом фланге Кавказской линии (цепи имперских укреплений на земле нохчи), - имперский историк Волконский, её участник, издал свой рассказ под заглавием «Погром Чечни»; задачу отряда в десять с лишним тысяч штыков он записал так: «разбить неприятельские скопища, уничтожить все средства продовольствия жителей и неприятеля, и потом действовать сообразно с обстоятельствами»(Citation: 119).
    Уничтожение еды стало доктриной: Воронцов, наместник и главнокомандующий на Кавказе, отношением военному министру Чернышеву от 28 августа 1852 года доложил, что лишённые посевов и сена чеченцы «должны - или переселиться въ наши предѣлы, или уйти въ самую глубь горъ»(Citation: 107).
    Ещё в марте Воронцов писал Барятинскому: «мы им не позволим ни сеять, ни косить, если они не изъявят покорности» - письмо от 21 марта 1852 года приводит историк Н. И. Покровский(Citation: 129); историки Я. З. Ахмадов и Э. Х. Хасмагомадов передают ту же политику формулой прокламаций - командование предупреждало чеченцев, что не позволит им «ни пахать, ни сеять», и заключают: «Это обещание было сдержано в буквальном смысле, и в 1856-1857 гг. в Чечне наступил голод, которого чеченцы почти никогда не знали»(Citation: 125).
    Тем же периодом империя перекупала верхушку сопротивления - Бата Шамурзаев, наиб Шамиля (наместник имама, руководителя сопротивления горцев Дагестана и Чечни российскому завоеванию), перешедший к империи осенью 1851 года, получил чин, пенсию и землю «в качестве примера для других потенциальных перебежчиков»(Citation: 125) - и строила институты подчинения: в 1852 году в крепости Грозной учреждён «Чеченский народный суд», выработавший «Правила для управления покорными чеченцами»(Citation: 125).
