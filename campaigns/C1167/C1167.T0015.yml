description:
  en: |-
    The empire demonstratively rewarded defectors from the leadership of the resistance with ranks, money and land.
    Bata Shamurzayev, a naib of Shamil (deputy of the Imam, leader of the highlanders' resistance of Dagestan and Chechnya to the Russian conquest), went over to the empire in the autumn of 1851 and received rewards.
    Baryatinsky, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi), in a letter to Vorontsov, viceroy in the Caucasus, of 24 February 1852, requested - "what a great reward Bata deserves, and I ask you to pardon him, then for Avtur to return him his rank and a pension of 400 rubles a year; I also ask you for an officer's rank for his son... who has often served us as a guide"(Citation: 129).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "Bata Shamurzayev took an active part in the war against the Imam, was promoted to captain and awarded 500 desiatinas of land... as an example for other potential defectors"(Citation: 125).
    Through Bata, Vorontsov, viceroy in the Caucasus, conveyed ultimatums to the Chechens - in a letter to Baryatinsky of 21 March 1852: "I asked Bata to insistently repeat to the inhabitants of the northern part of Greater Chechnya that we will not allow them to sow or to mow, unless they declare submission"(Citation: 129).
    Imperial historian Volkonsky admitted the system of bribery plainly: the empire acted "through their own co-religionists and persons like Bati Shamurzov," and "not with words alone, but with something more enticing and substantial - especially in the times of Vorontsov and Baryatinsky"(Citation: 119).
  uk: |-
    Імперія демонстративно винагороджувала перебіжчиків з верхівки опору чинами, грошима і землею.
    Бата Шамурзаєв, наїб Шаміля (намісник імама, керівника опору горців Дагестану і Чечні російському завоюванню), перейшов до імперії восени 1851 року й отримав нагороди.
    Барятинський, що командував на лівому фланзі Кавказької лінії (ланцюга імперських укріплень на землі нохчі), листом Воронцову, наміснику на Кавказі, від 24 лютого 1852 року просив - «яку велику нагороду заслуговує Бата, і я прошу у вас для нього прощення, потім за Автур повернути йому чин і пенсію в 400 рублів на рік; також прошу у вас для його сина... який часто служив нам провідником, офіцерського чину»(Citation: 129).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «Бата Шамурзаєв активно брав участь у війні проти імама, був зроблений капітаном і нагороджений 500 десятинами землі... як приклад для інших потенційних перебіжчиків»(Citation: 125).
    Через Бату Воронцов, намісник на Кавказі, передавав чеченцям ультиматуми - листом Барятинському від 21 березня 1852 року: «Я просив Бату наполегливо товкти жителям північної частини Великої Чечні, що ми їм не дозволимо ні сіяти, ні косити, якщо вони не виявлять покірності»(Citation: 129).
    Імперський історик Волконський визнав систему підкупу прямо: імперія діяла «через їхніх же одновірців і осіб, подібних до Батія Шамурзова», причому «не самими лише словами, а й чимось більш звабливим і суттєвим - особливо за часів Воронцова і Барятинського»(Citation: 119).
  ru: |-
    Империя демонстративно вознаграждала перебежчиков из верхушки сопротивления чинами, деньгами и землёй.
    Бата Шамурзаев, наиб Шамиля (наместник имама, руководителя сопротивления горцев Дагестана и Чечни российскому завоеванию), перешёл к империи осенью 1851 года и получил награды.
    Барятинский, командовавший на левом фланге Кавказской линии (цепи имперских укреплений на земле нохчи), письмом Воронцову, наместнику на Кавказе, от 24 февраля 1852 года просил - «какую большую награду заслуживает Бата, и я прошу у вас для него прощения, затем за Автур возвратить ему чин и пенсию в 400 рублей в год; также прошу у вас для его сына... который часто служил нам проводником, офицерского чина»(Citation: 129).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Бата Шамурзаев активно участвовал в войне против имама, был произведен в капитаны и награжден 500 десятинами земли... в качестве примера для других потенциальных перебежчиков»(Citation: 125).
    Через Бату Воронцов, наместник на Кавказе, передавал чеченцам ультиматумы - письмом Барятинскому от 21 марта 1852 года: «Я просил Бату настоятельно твердить жителям северной части Большой Чечни, что мы им не позволим ни сеять, ни косить, если они не изъявят покорности»(Citation: 129).
    Имперский историк Волконский признал систему подкупа прямо: империя действовала «чрез их же одноверцев и лиц, подобных Батию Шамурзову», причём «не одними только словами, но и чем-либо более заманчивым и существенным - в особенности во времена Воронцова и Барятинского»(Citation: 119).
