description:
  en: |-
    Over the captured part of Chechnya the empire built its own governing institutions.
    Historian N. I. Pokrovsky writes of the project of Baryatinsky, who commanded the left flank of the Caucasus Line (the chain of imperial fortifications on the land of the Nokhchi): "the statute on the governance of the Chechens worked out by Baryatinsky, partially reviving justice by the adats: tsarism feared the sharia court...
    This 'Statute' was confirmed by Nicholas I and put into effect" (adats are the customary law of the highlanders; sharia is the Islamic law on which the court of the Imamate was built)(Citation: 129).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov describe the implementation: "As early as 1852 in the Groznaya fortress the so-called 'Chechen People's Court' was instituted, headed by a Russian staff officer... as a counterweight to sharia, implanted in Chechnya by Imam Shamil, the Russian authorities strove to strengthen the influence of customary law - the adats"; the first chairman of the "Chechen" court was the Russian colonel Bartolomey, the interpreters - Bata Shamurzayev and Kasim Kurumov, and the execution of sentences was controlled by the "Administration of the Chechen People" with the right of coercion(Citation: 125).
    The court also worked out a written code of subordination - the "Rules for the Governance of Submissive Chechens": articles "providing punishment for disobedience to the authorities, for harboring abreks, for contact with 'unpacified' compatriots, the conditions of 'coming out with submission' from the territory of the Imamate" ("unpacified" in the imperial lexicon means those who had not submitted to the empire; abrek is the imperial label for a highlander outside the law); in 1854 the "Rules" were supplemented(Citation: 125).
    The result was recorded from inside by General Muravyov, commander-in-chief in the Caucasus - in February 1855 he wrote from the Groznaya fortress to General Yermolov, who had commanded in the Caucasus in the past: "Here five naibstvos have already been instituted, there is a pristav and a court established in imitation of your Kabardin court" (a naibstvo is an imperial administrative unit copied from the institution of the deputies of Imam Shamil, leader of the highlanders' resistance of Dagestan and Chechnya to the Russian conquest; a pristav is an imperial superintendent)(Citation: 108).
  uk: |-
    Над захопленою частиною Чечні імперія вибудувала власні управлінські інститути.
    Історик М. І. Покровський пише про проєкт Барятинського, що командував на лівому фланзі Кавказької лінії (ланцюга імперських укріплень на землі нохчі): «розроблене Барятинським положення про управління чеченцями, що частково відроджувало суд за адатами: царизм боявся шаріатського суду...
    Це "Положення" було затверджено Миколою I і введено в дію» (адати - звичаєве право горців; шаріат - ісламське право, на якому будувався суд імамату)(Citation: 129).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов описують виконання: «Ще в 1852 р. у фортеці Грозна було засновано так званий "Чеченський народний суд" на чолі з російським штаб-офіцером... на противагу шаріату, насаджуваному в Чечні імамом Шамілем, російська влада прагнула посилити вплив звичаєвого права - адатів»; першим головою «чеченського» суду був російський полковник Бартоломей, перекладачами - Бата Шамурзаєв і Касім Курумов, а виконання вироків контролювало «Управління чеченського народу» з правом примусу(Citation: 125).
    Суд виробив і писаний кодекс підпорядкування - «Правила для управління покірними чеченцями»: статті «що передбачали покарання за непокору владі, переховування абреків, зв'язок з "немирними" співвітчизниками, умови "виходу з покірністю" з території імамату» («немирні» - в імперському лексиконі ті, хто не підпорядкувався імперії; абрек - імперське тавро горця поза законом); у 1854 році «Правила» доповнені(Citation: 125).
    Підсумок зафіксував зсередини генерал Муравйов, головнокомандувач на Кавказі, - у лютому 1855 року він писав із фортеці Грозної генералу Єрмолову, що командував на Кавказі в минулому: «Уже тут засновано п'ять наїбств, є пристав і суд, установлений в наслідування вашого Кабардинського суду» (наїбство - імперська адміністративна одиниця, скопійована з інституту намісників імама Шаміля, керівника опору горців Дагестану і Чечні російському завоюванню; пристав - призначений імперією наглядач)(Citation: 108).
  ru: |-
    Над захваченной частью Чечни империя выстроила собственные управляющие институты.
    Историк Н. И. Покровский пишет о проекте Барятинского, командовавшего на левом фланге Кавказской линии (цепи имперских укреплений на земле нохчи): «разработанное Барятинским положение об управлении чеченцами, частично возрождавшее суд по адатам: царизм боялся шариатского суда...
    "Положение" это было утверждено Николаем I и введено в действие» (адаты - обычное право горцев; шариат - исламское право, на котором строился суд имамата)(Citation: 129).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов описывают исполнение: «Еще в 1852 г. в крепости Грозная был учрежден так называемый "Чеченский народный суд" во главе с российским штаб-офицером... в противовес шариату, насаждаемому в Чечне имамом Шамилем, российские власти стремились усилить влияние обычного права - адатов»; первым председателем «чеченского» суда был российский полковник Бартоломей, переводчиками - Бата Шамурзаев и Касим Курумов, а исполнение приговоров контролировало «Управление чеченского народа» с правом принуждения(Citation: 125).
    Суд выработал и писаный кодекс подчинения - «Правила для управления покорными чеченцами»: статьи «предусматривавшие наказание за неповиновение властям, укрывательство абреков, связь с "немирными" соотечественниками, условия "выхода с покорностью" с территории имамата» («немирные» - в имперском лексиконе не подчинившиеся империи; абрек - имперский ярлык горца вне закона); в 1854 году «Правила» дополнены(Citation: 125).
    Итог зафиксировал изнутри генерал Муравьёв, главнокомандующий на Кавказе, - в феврале 1855 года он писал из крепости Грозной генералу Ермолову, командовавшему на Кавказе в прошлом: «Уже здѣсь учреждено пять наибствъ, есть приставъ и судъ, установленный въ подражаніе вашего Кабардинскаго суда» (наибство - имперская административная единица, скопированная с института наместников имама Шамиля, руководителя сопротивления горцев Дагестана и Чечни российскому завоеванию; пристав - назначенный империей надзиратель)(Citation: 108).
