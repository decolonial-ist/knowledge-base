name:
  en: Financial Russification of Schools (1978–1983)
  uk: Фінансова русифікація шкіл (1978–1983)
  ru: Финансовая русификация школ (1978–1983)
description:
  en: 'The Soviet Union introduced a system of direct material incentives for assimilation: pursuant to the resolution of the USSR Council of Ministers of 13 October 1978 No. 835 "On measures for the further improvement of the study and teaching of the Russian language in the union republics," the Council of Ministers of the Ukrainian SSR, by its resolution of 2 November 1978 No. 518, introduced the study of Russian from the first grades of Ukrainian schools starting with the 1980/81 school year(Citation: 464); the all-Union conference "The Russian Language — the Language of Friendship and Cooperation of the Peoples of the USSR" (Tashkent, 22–24 May 1979) spelled out Russification measures down to kindergartens(Citation: 181); the resolution of the CPSU Central Committee and the USSR Council of Ministers of 26 May 1983 No. 473 "On additional measures for improving the study of the Russian language in general-education schools and other educational institutions of the union republics" and the resolution of the Central Committee of the Communist Party of Ukraine and the Council of Ministers of the Ukrainian SSR of 10 June 1983 raised the salary rates of Russian-language teachers by 15 percent from 1984(Citation: 181)(Citation: 417).'
  uk: 'Радянський Союз запроваджує систему прямого матеріального стимулювання асиміляції: на виконання постанови Ради Міністрів СРСР від 13 жовтня 1978 року № 835 «Про заходи по дальшому удосконаленню вивчення і викладання російської мови в союзних республіках» Рада Міністрів УРСР постановою від 2 листопада 1978 року № 518 запровадила вивчення російської мови з перших класів українських шкіл з 1980/81 навчального року(Citation: 464); всесоюзна конференція «Російська мова - мова дружби і співробітництва народів СРСР» (Ташкент, 22–24 травня 1979 року) розписала заходи русифікації аж до дитячих садків(Citation: 181); постанова ЦК КПРС і Ради Міністрів СРСР від 26 травня 1983 року № 473 «Про додаткові заходи по поліпшенню вивчення російської мови в загальноосвітніх школах та інших навчальних закладах союзних республік» і постанова ЦК Компартії України та Ради Міністрів УРСР від 10 червня 1983 року підняли з 1984 року на 15 процентів ставки вчителів російської мови(Citation: 181)(Citation: 417).'
  ru: 'Советский Союз вводит систему прямого материального стимулирования ассимиляции: во исполнение постановления Совета Министров СССР от 13 октября 1978 года № 835 «О мерах по дальнейшему совершенствованию изучения и преподавания русского языка в союзных республиках» Совет Министров УССР постановлением от 2 ноября 1978 года № 518 ввёл изучение русского языка с первых классов украинских школ с 1980/81 учебного года(Citation: 464); всесоюзная конференция «Русский язык — язык дружбы и сотрудничества народов СССР» (Ташкент, 22–24 мая 1979 года) расписала меры русификации вплоть до детских садов(Citation: 181); постановление ЦК КПСС и Совета Министров СССР от 26 мая 1983 года № 473 «О дополнительных мерах по улучшению изучения русского языка в общеобразовательных школах и других учебных заведениях союзных республик» и постановление ЦК Компартии Украины и Совета Министров УССР от 10 июня 1983 года подняли с 1984 года на 15 процентов ставки учителей русского языка(Citation: 181)(Citation: 417).'
