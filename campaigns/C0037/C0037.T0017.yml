description:
  ru: 'Захват и включение в состав империи Правобережной Украины, Волыни и Подолья: Россия получила «Киевское, Брацлавское и Подольское воеводства и восточную половину Волынского воеводства», а по третьему разделу – «западную часть Волынского воеводства, западные части Холмской земли и Белзского воеводства»(Citation: 195).'
  en: 'The seizure and incorporation into the empire of Right-Bank Ukraine, Volhynia, and Podillia: Russia received "the Kyiv, Bratslav, and Podillia voivodeships and the eastern half of the Volhynian voivodeship," and under the third partition – "the western part of the Volhynian voivodeship, the western parts of the Kholm land and the Belz voivodeship"(Citation: 195).'
  uk: 'Захоплення та включення до складу імперії Правобережної України, Волині й Поділля: Росія отримала «Київське, Брацлавське і Подільське воєводства та сх. половину Волин. воєводства», а за третім поділом до Росії відійшли «зх. частина Волин. воєводства, зх. частини Холмської землі й Белзького воєводства»(Citation: 195).'
