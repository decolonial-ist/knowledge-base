name:
  en: Second and Third Partitions of the Polish-Lithuanian Commonwealth (1793–1795)
  uk: Другий і третій поділи Речі Посполитої (1793–1795)
  ru: Второй и третий разделы Речи Посполитой (1793–1795)
description:
  en: |-
    The Russian Empire's collusion with the Hohenzollern and Habsburg monarchies to dismember a neighboring state.
    Under the second partition, "Russia received the central part of Belarus, the Kyiv, Bratslav, and Podillia voivodeships, and the eastern half of the Volhynian voivodeship – in total 250 thousand km2 and over 3 million inhabitants," and after the third, "the Polish state ceased to exist"(Citation: 195).
  uk: |-
    Змова Російської імперії з монархіями Гогенцоллернів і Габсбургів щодо розчленування сусідньої держави.
    За другим поділом «Росія дістала центр. частину Білорусі, Київське, Брацлавське і Подільське воєводства та сх. половину Волин. воєводства — разом 250 тис. км2 і понад 3 млн жителів», а після третього «Польс. д-ва перестала існувати»(Citation: 195).
  ru: |-
    Сговор Российской империи с монархиями Гогенцоллернов и Габсбургов по расчленению соседнего государства.
    По второму разделу «Россия получила центральную часть Беларуси, Киевское, Брацлавское и Подольское воеводства и восточную половину Волынского воеводства — вместе 250 тыс. км2 и более 3 млн жителей», а после третьего «Польское государство перестало существовать»(Citation: 195).
