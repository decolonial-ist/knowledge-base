description:
  en: 'The diplomatic collusion of the great powers behind the backs of the peoples of the dismembered republic: "Russia carried out the second partition of Poland jointly with Prussia"(Citation: 195); all three monarchies took part in the third – the fate of the Right Bank was decided in St. Petersburg, Berlin, and Vienna.'
  uk: 'Дипломатична змова великих держав за спинами народів розчленовуваної республіки: «Другий поділ Польщі Росія здійснила спільно з Пруссією»(Citation: 195), у третьому брали участь усі три монархії – долю Правобережжя вирішували в Петербурзі, Берліні та Відні.'
  ru: 'Дипломатический сговор великих держав за спиной народов расчленяемой республики: «Второй раздел Польши Россия осуществила совместно с Пруссией»(Citation: 195), в третьем участвовали все три монархии – судьбу Правобережья решали в Петербурге, Берлине и Вене.'
