description:
  en: |-
    The Russian Empire set neighboring Indigenous peoples against the Nokhchi in order to weaken Chechen resistance through their enmity.
    In July 1810, while pursuing a retreating Chechen party, the commanding general Ivelich, according to the imperial historian Potto, «talked the nearest Ingush auls, in view of the prospect of great gain, into cutting off its retreat»; the incited Ingush attacked the Chechens, and the latter «suffered such a loss that they abandoned even the body of their leader on the battlefield»(Citation: 74).
    The commander of the Caucasian Line, General Delpozzo, reported that the peaceful elders who had pledged to act against the Chechens were «promised rewards according to their merits»(Citation: 100).
  uk: |-
    Російська імперія нацьковувала сусідні корінні народи на Нохчі, щоб їхньою ворожнечею послаблювати чеченський опір.
    У липні 1810 року, переслідуючи чеченську партію, що відступала, командувач генерал Івеліч, за свідченням імперського історика Потто, «підмовив найближчі аули Інгушів, з огляду на можливість великої наживи, відрізати їй відступ»; нацьковані Інгуші напали на Чеченців, і ті «зазнали такої втрати, що покинули на місці бою навіть тіло свого ватажка»(Citation: 74).
    Командувач Кавказької лінії генерал Дельпоццо доносив, що мирним старшинам, які зобов'язалися діяти проти Чеченців, «обіцяно винагородити по заслугах»(Citation: 100).
  ru: |-
    Российская империя натравливала соседние коренные народы на нохчи, чтобы их враждой ослаблять чеченское сопротивление.
    В июле 1810 года, преследуя отступавшую чеченскую партию, командующий генерал Ивелич, по свидетельству имперского историка Потто, «подговорил ближайшие аулы ингушей, ввиду возможности большой наживы, отрезать ей отступление»; натравленные ингуши напали на чеченцев, и те «понесли такую потерю, что бросили на месте сражения даже тело своего предводителя»(Citation: 74).
    Командующий Кавказской линией генерал Дельпоццо доносил, что мирным старшинам, обязавшимся действовать против чеченцев, «обещано вознаградить по заслугам»(Citation: 100).
