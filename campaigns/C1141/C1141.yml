name:
  ru: 'Закрепление в Чечне: подкуп старшин, экономический контроль и стравливание соседей (1809-1811)'
  en: 'Consolidation in Chechnya: Bribery of Elders, Economic Control, and Setting Neighbors against One Another (1809-1811)'
  uk: 'Закріплення в Чечні: підкуп старшин, економічний контроль і нацьковування сусідів (1809-1811)'
description:
  ru: |-
    В 1809-1811 годах Российская империя закрепляла власть над землями нохчи подкупом старшин, контролем над продажей хлеба и соли и натравливанием соседних народов на чеченцев.
    Для склонения чеченцев к подчинению главнокомандующий на Кавказе генерал Тормасов предписывал выдать чеченским старшинам и духовенству «по 250, а другим по 150 р. с. единовременно, на что потребную сумму, всего 1,400 р.»(Citation: 100).
    Продажу чеченцам хлеба и соли империя замкнула на подконтрольные меновые дворы под карантином, учреждённые «для мирных Чеченцев в Науре… для горских Чеченцев в Лащурине»(Citation: 100)(Citation: 66).
    В прокламации обитателям Чеченской земли генерал Тормасов возложил вину за разорение 1807 года на самих жителей — «сами вы были причиною постигшего вас в третьем году несчастия» — и пригрозил новым вторжением, «чтобы внести к виновным меч и пламя»(Citation: 100).
  en: |-
    In 1809-1811, the Russian Empire consolidated its power over the lands of the Nokhchi through the bribery of elders, control over the sale of grain and salt, and the setting of neighboring peoples against the Chechens.
    To incline the Chechens to submission, the commander-in-chief in the Caucasus, General Tormasov, ordered that Chechen elders and clergy be paid «250, and others 150 silver rubles each, as a one-time payment, for which the required sum, 1,400 r. in total»(Citation: 100).
    The empire funneled the sale of grain and salt to the Chechens through controlled barter yards under quarantine, established «for the peaceful Chechens in Naur… for the mountain Chechens in Lashchurin»(Citation: 100)(Citation: 66).
    In a proclamation to the inhabitants of the Chechen land, General Tormasov laid the blame for the devastation of 1807 on the inhabitants themselves — «you yourselves were the cause of the misfortune that befell you the year before last» — and threatened a new invasion, «to bring sword and flame upon the guilty»(Citation: 100).
  uk: |-
    У 1809-1811 роках Російська імперія закріплювала владу над землями Нохчі підкупом старшин, контролем над продажем хліба та солі і нацьковуванням сусідніх народів на Чеченців.
    Щоб схилити Чеченців до підпорядкування, головнокомандувач на Кавказі генерал Тормасов приписував видати чеченським старшинам і духовенству «по 250, а іншим по 150 р. с. одноразово, на що потрібну суму, всього 1,400 р.»(Citation: 100).
    Продаж Чеченцям хліба й солі імперія замкнула на підконтрольні мінові двори під карантином, засновані «для мирних Чеченців у Наурі… для гірських Чеченців у Лащурині»(Citation: 100)(Citation: 66).
    У прокламації мешканцям Чеченської землі генерал Тормасов поклав провину за розорення 1807 року на самих жителів — «самі ви були причиною нещастя, що спіткало вас позаторік» — і погрозив новим вторгненням, «щоб внести до винних меч і полум'я»(Citation: 100).
