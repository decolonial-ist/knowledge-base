description:
  ru: |-
    Российская империя покупала лояльность старшин нохчи, чтобы их руками склонить чеченцев к подчинению.
    Для этого главнокомандующий на Кавказе генерал Тормасов через есаула Чернова предписывал выдать чеченским старшинам и духовенству «по 250, а другим по 150 р. с. единовременно, на что потребную сумму, всего 1,400 р.»(Citation: 100).
    Историк Я. З. Ахмадов отмечает, что колониальная власть в целом действовала, опираясь на социальные верхи, «подкупая их всевозможными наградами и льготами за их службу в пользу России»(Citation: 66).
    Историк Д. А. Хожаев приводит ту же формулу с прямым указанием источника денег: главнокомандующий на Кавказе генерал Тормасов соглашался «склонить главнейших чеченских старшин и их духовенство… дать по 250, а другим по 150 рублей серебром, собрать же означенные деньги от их же деревень», то есть подкуп верхов оплачивался изъятием с самих чеченских селений(Citation: 95).
  en: |-
    The Russian Empire bought the loyalty of the Nokhchi elders in order to use them to incline the Chechens toward submission.
    To this end, the commander-in-chief in the Caucasus, General Tormasov, through Esaul Chernov, ordered that the Chechen elders and clergy be given «250 rubles each, and others 150 silver rubles each, as a one-time payment, for which the required sum, 1,400 r. in total»(Citation: 100).
    Historian Ya.
    Z. Akhmadov notes that the colonial authorities generally acted by relying on the social elite, «bribing them with all manner of rewards and privileges for their service to the benefit of Russia»(Citation: 66).
    Historian D. A. Khozhaev cites the same formula with a direct indication of where the money came from: the commander-in-chief in the Caucasus, General Tormasov, agreed «to win over the principal Chechen elders and their clergy… to give 250, and others 150 silver rubles each, and to collect the said money from their own villages» — that is, the bribery of the elite was paid for by exactions from the Chechen villages themselves(Citation: 95).
  uk: |-
    Російська імперія купувала лояльність старшин Нохчі, щоб їхніми руками схилити Чеченців до підпорядкування.
    Для цього головнокомандувач на Кавказі генерал Тормасов через осавула Чернова приписував видати чеченським старшинам і духовенству «по 250, а іншим по 150 руб. сріблом одноразово, на що потрібну суму, всього 1,400 руб.»(Citation: 100).
    Історик Я. З. Ахмадов зазначає, що колоніальна влада загалом діяла, спираючись на соціальну верхівку, «підкуповуючи їх усілякими нагородами й пільгами за їхню службу на користь Росії»(Citation: 66).
    Історик Д. А. Хожаєв наводить ту саму формулу з прямою вказівкою на джерело грошей: головнокомандувач на Кавказі генерал Тормасов погоджувався «схилити найголовніших чеченських старшин та їхнє духовенство… дати по 250, а іншим по 150 рублів сріблом, а означені гроші зібрати з їхніх же сіл», тобто підкуп верхівки оплачувався вилученням із самих чеченських селищ(Citation: 95).
