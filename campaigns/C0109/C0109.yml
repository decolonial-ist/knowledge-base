name:
  ru: «Исторический путь» (1909–1911)
  en: The "Historical Path" (1909–1911)
  uk: «Історичний шлях» (1909–1911)
description:
  ru: |-
    Киевский отдел Императорского русского военно-исторического общества застраивал центр Киева монументами «деятелей русской истории» и вытеснил с отведённого места памятник Шевченко, который город уже решил поставить.
    Очередь из восьми имперских монументов - от княгини Ольги до летописца Нестора - подал запиской от 7 апреля 1910 года секретарь отдела полковник Стелецкий(Citation: 429).
    Программа «исторического пути» выросла из письма попечителя учебного округа Зилова генерал-губернатору Трепову: против «русского правительственного заведения» ставить Шевченко не следует, «необходимо было бы соорудить памятник одному из деятелей русской истории»(Citation: 429).
    Единственным поставленным монументом очереди стала княгиня Ольга (4 сентября 1911 года) - на площадке, которую город в 1909 году отвёл под памятник Шевченко и которую дума в 1911 году отдала обществу, отменив собственное решение(Citation: 429).
  en: |-
    The Kyiv section of the Imperial Russian Military-Historical Society was filling central Kyiv with monuments to "figures of Russian history" and pushed the Shevchenko monument, which the city had already decided to put up, off its allotted site.
    The queue of eight imperial monuments - from princess Olha to Nestor the chronicler - was submitted in a memorandum of 7 April 1910 by colonel Steletsky, the section's secretary(Citation: 429).
    The "historical path" program grew out of a letter from Zilov, the trustee of the educational district, to governor-general Trepov: Shevchenko should not be placed opposite a "Russian governmental institution," and "it would be necessary to put up a monument to one of the figures of Russian history"(Citation: 429).
    The only monument of the queue actually put up was princess Olha (4 September 1911) - on the site the city had allotted in 1909 for the Shevchenko monument and which the duma gave to the society in 1911, overturning its own decision(Citation: 429).
  uk: |-
    Київський відділ Імператорського російського воєнно-історичного товариства забудовував центр Києва монументами «діячів російської історії» і витіснив з відведеного місця пам'ятник Шевченкові, який місто вже вирішило поставити.
    Чергу з восьми імперських монументів - від княгині Ольги до літописця Нестора - подав запискою від 7 квітня 1910 року секретар відділу полковник Стелецький(Citation: 429).
    Програма «історичного шляху» виросла з листа попечителя навчального округу Зілова генерал-губернаторові Трепову: навпроти «російського урядового закладу» ставити Шевченка не слід, «необхідно було б спорудити пам'ятник одному з діячів російської історії»(Citation: 429).
    Єдиним поставленим монументом черги стала княгиня Ольга (4 вересня 1911 року) - на майданчику, який місто 1909 року відвело під пам'ятник Шевченкові і який дума 1911 року віддала товариству, скасувавши власне рішення(Citation: 429).
