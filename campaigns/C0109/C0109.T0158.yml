description:
  en: |-
    In 1911 the Russian Empire put up a monument to princess Olha in Kyiv - on a site the city had allotted two years earlier for a monument to Shevchenko.
    In May 1909, the Kyiv city duma allotted the square on Mykhailivska Square for a monument to Taras Shevchenko(Citation: 429).
    Zilov, the trustee of the Kyiv educational district, wrote confidentially to governor-general Trepov that Shevchenko should not be placed opposite a "Russian governmental institution" and that "it would be necessary to put up a monument to one of the figures of Russian history"(Citation: 429).
    Out of this letter grew the program of the "historical path": on 7 April 1910, colonel Steletsky, secretary of the Kyiv section of the Imperial Russian Military-Historical Society, submitted a memorandum with a queue of eight monuments - princess Olha, Oleh, Yaroslav, Volodymyr, Volodymyr Monomakh, Sviatoslav, "prehistoric Kyiv" and Nestor the chronicler(Citation: 429).
    On 15 March 1911, the duma, with 68 of 72 councilors present, gave the society the site between St. Sophia Cathedral and St. Michael's Monastery - 46 votes against 22 - and at the same session overturned its own decision of 1909, moving the site of the future Shevchenko monument to the Karavaivska intersection: 41 against 24(Citation: 429).
    At first the duma rejected the concrete design as insufficiently "artistically monumental," and a month later permitted only a temporary model to be put up(Citation: 429) - that is, they agreed to place a makeshift on the seized site, so long as it was occupied.
    The monument was unveiled on 4 September 1911: princess Olha in the center, to the left the apostle Andrew pointing at the Kyiv hills, to the right the seated Cyril and Methodius(Citation: 424)(Citation: 425).
    The model was sculpted by Ivan Kavaleridze and Petro Snitkin, the architect was Valerian Rykov, and the project was led by the sculptor Fedir Balavensky(Citation: 428); the historian Ihor Hyrych notes the paradox - the author of the imperial monument turned out to be "one of the 'Ukrainomaniacs' - a future outstanding sculptor and film director, and then a beginning artist, Ivan Kavaleridze"(Citation: 409).
    Cast on the pedestal was: "A Gift of the Sovereign Emperor to the City of Kyiv.
    In the Year of Our Lord 1911" - the tsar's cabinet did indeed give ten thousand rubles for the monument, and the Kyiv merchant Mohylevsky contributed another thousand(Citation: 424)(Citation: 429).
    Below, on the pedestal of the princess herself, stood: "She was the first from Rus to enter the Kingdom of Heaven; her the sons of Rus praise as their initiator"(Citation: 424) - the baptism of Rus was being written into the imperial genealogy right on the stone.
    In 1919 the statue was thrown off its pedestal and buried, split in two, beneath the monument itself; in March 1923 the remaining figures were removed, and in March 1926 the communal department of Kyiv ordered the concrete cleared away for good(Citation: 424)(Citation: 429).
    In 1996 the statue was dug out from under the flowerbed and the monument was recreated from the old sketches, this time in marble(Citation: 428).
  uk: |-
    Російська імперія 1911 року поставила в Києві пам'ятник княгині Ользі - на місці, яке місто двома роками раніше відвело під пам'ятник Шевченкові.
    У травні 1909 року київська дума відвела під пам'ятник Тарасові Шевченку сквер на Михайлівській площі(Citation: 429).
    Попечитель київського навчального округу Зілов конфіденційно написав генерал-губернаторові Трепову, що навпроти «російського урядового закладу» ставити Шевченка не слід і «необхідно було б спорудити пам'ятник одному з діячів російської історії»(Citation: 429).
    З цього листа виросла програма «історичного шляху»: 7 квітня 1910 року секретар київського відділу Імператорського російського воєнно-історичного товариства полковник Стелецький подав записку з чергою з восьми монументів - княгиня Ольга, Олег, Ярослав, Володимир, Володимир Мономах, Святослав, «доісторичний Київ» і літописець Нестор(Citation: 429). 15 березня 1911 року дума, за присутності 68 гласних із 72, віддала товариству майданчик між Софійським собором і Михайлівським монастирем - 46 голосів проти 22 - і тим само засіданням скасувала власне рішення 1909 року, перенісши місце майбутнього Шевченка на перехрестя Караваївської: 41 проти 24(Citation: 429).
    Спершу дума відхилила бетонний проєкт як недостатньо «художньо-монументальний», а через місяць дозволила поставити лише тимчасову модель(Citation: 429) - тобто на відібране місце погодилися поставити тимчасовку, аби воно було зайняте.
    Пам'ятник відкрили 4 вересня 1911 року: княгиня Ольга в центрі, ліворуч апостол Андрій, що вказує на київські гори, праворуч сидячі Кирило та Мефодій(Citation: 424)(Citation: 425).
    Ліпили модель скульптори Іван Кавалерідзе і Петро Сніткін, архітектором був Валеріан Риков, керував проєктом скульптор Федір Балавенський(Citation: 428); історик Ігор Гирич відзначає парадокс: автором імперського монумента виявився «один з „украиноманов” – майбутній видатний скульптор і кінорежисер, а тоді мистець-початківець Іван Кавалерідзе»(Citation: 409).
    На постаменті було відлито: «Дар Государя Императора городу Киеву.
    Лето от Р. Х. 1911» - десять тисяч рублів на пам'ятник справді дав царський кабінет, ще тисячу вніс київський купець Могилевський(Citation: 424)(Citation: 429).
    Нижче, на постаменті самої княгині, стояло: «Сия первая вниде в Царство Небесное от Руси, сию бо хвалят рустие сынове яко начальницу»(Citation: 424) - хрещення Русі записувалося в імперський родовід просто на камені. 1919 року статую скинули з постаменту й закопали розколотою надвоє під самим пам'ятником, у березні 1923 року зняли решту фігур, а в березні 1926 року комунальний відділ Києва розпорядився прибрати бетон остаточно(Citation: 424)(Citation: 429). 1996 року статую відкопали з-під клумби і пам'ятник відтворили за старими ескізами, цього разу в мармурі(Citation: 428).
  ru: |-
    Российская империя в 1911 году поставила в Киеве памятник княгине Ольге - на месте, которое город двумя годами раньше отвёл под памятник Шевченко.
    В мае 1909 года киевская дума отвела под памятник Тарасу Шевченко сквер на Михайловской площади(Citation: 429).
    Попечитель киевского учебного округа Зилов написал генерал-губернатору Трепову конфиденциально, что против «русского правительственного заведения» ставить Шевченко не следует и «необходимо было бы соорудить памятник одному из деятелей русской истории»(Citation: 429).
    Из этого письма выросла программа «исторического пути»: 7 апреля 1910 года секретарь киевского отдела Императорского русского военно-исторического общества полковник Стелецкий подал записку с очередью из восьми монументов - княгиня Ольга, Олег, Ярослав, Владимир, Владимир Мономах, Святослав, «доисторический Киев» и летописец Нестор(Citation: 429). 15 марта 1911 года дума, при 68 гласных из 72, отдала обществу площадку между Софийским собором и Михайловским монастырём - 46 голосов против 22 - и тем же заседанием отменила собственное решение 1909 года, перенеся место будущего Шевченко на перекрёсток Караваевской: 41 против 24(Citation: 429).
    Сначала дума отклонила бетонный проект как недостаточно «художественно-монументальный», а через месяц разрешила поставить лишь временную модель(Citation: 429) - то есть на отобранное место согласились поставить времянку, лишь бы оно было занято.
    Памятник открыли 4 сентября 1911 года: княгиня Ольга в центре, слева апостол Андрей, указывающий на киевские горы, справа сидящие Кирилл и Мефодий(Citation: 424)(Citation: 425).
    Лепили модель скульпторы Иван Кавалеридзе и Пётр Сниткин, архитектором был Валериан Рыков, руководил проектом скульптор Фёдор Балавенский(Citation: 428); историк Игорь Гирич отмечает парадокс - автором имперского монумента оказался «один из „украиноманов“, будущий выдающийся скульптор и кинорежиссёр, а тогда начинающий художник Иван Кавалеридзе»(Citation: 409).
    На постаменте было отлито: «Дар Государя Императора городу Киеву.
    Лето от Р. Х. 1911» - десять тысяч рублей на памятник и вправду дал царский кабинет, ещё тысячу внёс киевский купец Могилевский(Citation: 424)(Citation: 429).
    Ниже, на постаменте самой княгини, стояло: «Сия первая вниде в Царство Небесное от Руси, сию бо хвалят рустие сынове яко начальницу»(Citation: 424) - крещение Руси записывалось в имперскую родословную прямо на камне.
    В 1919 году статую сбросили с постамента и закопали расколотой надвое под самим памятником, в марте 1923 года сняли остальные фигуры, а в марте 1926 года коммунальный отдел Киева распорядился убрать бетон окончательно(Citation: 424)(Citation: 429).
    В 1996 году статую отрыли из-под клумбы и памятник воссоздали по старым эскизам, на этот раз в мраморе(Citation: 428).
