description:
  ru: |-
    Разоружая Чечню, войска СССР разрушали сёла, не выполнившие ультиматум, вплоть до полного сноса: аул Хакмеды - свыше 300 дворов - уничтожен целиком, в ауле Дай разрушено 20 домов, Урус-Мартан трое суток стоял под артиллерийским огнём и авиаударами.
    Уцелевший спутник имама Нажмуддина Гоцинского - духовного главы сопротивления в Дагестане и Чечне, за которым войска шли в горы, - рассказывал в 1936 году в варшавском журнале «Северный Кавказ»: «Затем огонь был перенесен на ближайшие аулы, из которых аул Хакмеды (свыше 300 дворов) был совершенно разрушен»(Citation: 484).
    Аул Дай, центр сопротивления пятого боевого участка, историк А. Ю. Лашков описывает по документам военного архива: «От обстрела и бомбометаний аул Дай существенно пострадал: 20 домов оказались разрушенными, были немногочисленные человеческие жертвы»(Citation: 477).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «...аул Урус-Мартан подвергался артобстрелу и авиаударам трое суток, аул Дай бомбили трижды, два дня артиллерия обстреливала аулы общества Зумсой»(Citation: 125).
  en: |-
    Disarming Chechnya, the troops of the USSR destroyed the villages that had not met the ultimatum, up to complete demolition: the aul of Khakmedy - more than 300 households - was destroyed entirely, in the aul of Dai 20 houses were destroyed, Urus-Martan stood for three days under artillery fire and air strikes.
    A surviving companion of imam Nazhmuddin Gotsinsky - the spiritual head of the resistance in Dagestan and Chechnya, whom the troops pursued into the mountains - related in 1936 in the Warsaw journal Severny Kavkaz: "Then the fire was transferred to the nearest auls, of which the aul of Khakmedy (more than 300 households) was completely destroyed"(Citation: 484).
    The aul of Dai, the center of resistance of the fifth combat sector, historian A. Yu.
    Lashkov describes from the documents of the military archive: "From the shelling and bombings the aul of Dai suffered substantially: 20 houses turned out destroyed, there were a small number of human casualties"(Citation: 477).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "...the aul of Urus-Martan was subjected to artillery shelling and air strikes for three days, the aul of Dai was bombed three times, for two days artillery shelled the auls of the Zumsoy society"(Citation: 125).
  uk: |-
    Роззброюючи Чечню, війська СРСР руйнували села, що не виконали ультиматуму, аж до повного знесення: аул Хакмеди - понад 300 дворів - знищено цілком, в аулі Дай зруйновано 20 будинків, Урус-Мартан три доби стояв під артилерійським вогнем і авіаударами.
    Вцілілий супутник імама Нажмуддіна Гоцинського - духовного глави опору в Дагестані та Чечні, за яким війська йшли в гори, - розповідав 1936 року у варшавському журналі «Северный Кавказ»: «Потім вогонь було перенесено на найближчі аули, з яких аул Хакмеди (понад 300 дворів) було цілковито зруйновано»(Citation: 484).
    Аул Дай, центр опору п'ятої бойової дільниці, історик А. Ю. Лашков описує за документами військового архіву: «Від обстрілу і бомбометань аул Дай істотно постраждав: 20 будинків виявилися зруйнованими, були нечисленні людські жертви»(Citation: 477).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «...аул Урус-Мартан зазнавав артобстрілу й авіаударів три доби, аул Дай бомбили тричі, два дні артилерія обстрілювала аули товариства Зумсой»(Citation: 125).
