description:
  ru: |-
    31 июля 1925 года Реввоенсовет СССР объяснил готовящуюся операцию свойствами целого народа - в приказе сказано: «Чеченская область является очагом уголовного бандитизма, распространяемого на соседние с Чечней районы...
    В массе своей чеченцы склонны к бандитизму, как к главному источнику легкой наживы, чему способствует наличие большого количества оружия.
    Нагорная Чечня является убежищем для наиболее закоренелых врагов Советской власти»(Citation: 259).
    Ярлык из приказа перешёл в рабочую номенклатуру операции: инструкция от 4 августа 1925 года, утверждённая командующим Северо-Кавказским военным округом Уборевичем, членом Реввоенсовета округа Володиным и полномочным представителем ОГПУ (политической полиции, предшественницы современной ФСБ) по краю Евдокимовым, ставит людей в один ряд с винтовками и «изымает» их одним глаголом - пункт 8 инструкции гласит: «В случае выполнения условий сдачи оружия поголовный обыск не производится, а только изымается бандитский и порочный элемент»(Citation: 479).
    Так преступность объявлена свойством народа, а его люди - «элементом», подлежащим изъятию.
  en: |-
    On 31 July 1925 the Revolutionary Military Council of the USSR explained the operation being prepared by the properties of an entire people - the order says: "The Chechen oblast is a hotbed of criminal banditry spreading to the districts neighboring Chechnya...
    In their mass the Chechens are inclined to banditry as the main source of easy gain, which is furthered by the presence of a large quantity of weapons.
    Mountain Chechnya is a refuge for the most hardened enemies of Soviet power"(Citation: 259).
    The label from the order passed into the operation's working nomenclature: the instruction of 4 August 1925, approved by Uborevich, commander of the North Caucasus Military District, Volodin, member of the district's Revolutionary Military Council, and Yevdokimov, plenipotentiary representative of the OGPU (the political police, a predecessor of today's FSB) for the krai, puts people in one row with rifles and "removes" them with a single verb - point 8 of the instruction reads: "If the conditions of the surrender of weapons are fulfilled, no house-to-house search is conducted, and only the bandit and vicious element is removed"(Citation: 479).
    Thus criminality was declared a property of the people, and its men - an "element" subject to removal.
  uk: |-
    31 липня 1925 року Реввійськрада СРСР пояснила підготовлювану операцію властивостями цілого народу - в наказі сказано: «Чеченська область є осередком кримінального бандитизму, що поширюється на сусідні з Чечнею райони...
    У масі своїй чеченці схильні до бандитизму як до головного джерела легкої наживи, чому сприяє наявність великої кількості зброї.
    Нагірна Чечня є притулком для найзапекліших ворогів Радянської влади»(Citation: 259).
    Ярлик з наказу перейшов у робочу номенклатуру операції: інструкція від 4 серпня 1925 року, затверджена командувачем Північно-Кавказького військового округу Уборевичем, членом Реввійськради округу Володіним і повноважним представником ОГПУ (політичної поліції, попередниці сучасної ФСБ) по краю Євдокимовим, ставить людей в один ряд з гвинтівками і «вилучає» їх одним дієсловом - пункт 8 інструкції гласить: «У разі виконання умов здачі зброї поголовний обшук не проводиться, а лише вилучається бандитський і порочний елемент»(Citation: 479).
    Так злочинність оголошено властивістю народу, а його людей - «елементом», що підлягає вилученню.
