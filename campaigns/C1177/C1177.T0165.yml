description:
  ru: |-
    Целью артиллерии и авиации зачастую становились не военные объекты, а жилые населённые пункты целиком: инструкция от 4 августа 1925 года, утверждённая командующим Северо-Кавказским военным округом Уборевичем, членом Реввоенсовета округа Володиным и полномочным представителем ОГПУ (политической полиции, предшественницы современной ФСБ) по краю Евдокимовым, предписывала - «Если население аула в установленный срок целиком не выполнит требования о сдаче оружия или выполнит частично, то командование отрядом, в качестве угрозы, открывает артиллерийский огонь (а за отсутствием артиллерии-пулеметный) в течении 10 минут на высокие разрывы и полу-поражения», и добавляла: «в зависимости от обстановки предупредительный огонь, как мера воздействия, может открываться и несколько раз»(Citation: 479); ни военного объекта, ни цели внутри села документ не называет вовсе.
    Из 242 разоружённых селений 101 попало под ружейно-пулемётный и артиллерийский обстрел, 16 - под удары с воздуха(Citation: 125); по подсчёту историка Е. Ф. Жупиковой, «На 16 аулов, где скрывались руководители повстанцев, было сброшено 104 пудовых бомбы [около 1,7 тонны]»(Citation: 257).
    Пудовая авиабомба - это около 16 килограммов, вес мины современного 120-мм миномёта; в среднем на аул пришлось по шесть-семь таких бомб.
    Авиацией распоряжался начальник ВВС округа Петрожицкий, и историк Т. У. Эльбуздукаева перечисляет цели поимённо: «В ходе проведения операции самолеты 3-го, а с 6 сентября — и 5-го авиационных отрядов наносили авиаудары по аулам Зумсой, Дай, Тагир Хой, Акки Боуги, Ошни, Химой, Нижелой, Рагехой, Урус-Мартан и Ножай-Юрт»(Citation: 259).
    Как выглядел «предупредительный огонь» в одном ауле, видно из донесения по Ачхой-Мартану 25 августа 1925 года: «по аулу было выпущено 15 шрапнелей сперва на высокий разрыв четыре затем на поражение.
    После того, как было ранено две чеченки, жители начали отдавать оружие»(Citation: 481).
    Историк А. Ю. Лашков пишет об ударе по аулу Дай: «Первоначально из-за сильного тумана авиаудару ошибочно подверглось соседнее селение Чубахкимерой»(Citation: 477).
  en: |-
    The targets of the artillery and aviation were often not military objectives but inhabited settlements as such: the instruction of 4 August 1925, approved by Uborevich, commander of the North Caucasus Military District, Volodin, member of the district's Revolutionary Military Council, and Yevdokimov, plenipotentiary representative of the OGPU (the political police, a predecessor of today's FSB) for the krai, prescribed - "If the population of the aul does not fulfil the demand to surrender weapons in the established time in full, or fulfils it partially, the detachment command, by way of threat, opens artillery fire (or, in the absence of artillery, machine-gun fire) for 10 minutes with high bursts and half-strikes", and added: "depending on the situation the warning fire, as a measure of influence, may be opened several times as well"(Citation: 479); the document names no military objective and no target inside the village at all.
    Of the 242 disarmed settlements 101 came under rifle, machine-gun and artillery fire, 16 under strikes from the air(Citation: 125); by the count of historian E. F. Zhupikova, "104 one-pud bombs [about 1.7 tonnes] were dropped on the 16 auls where the leaders of the insurgents were hiding"(Citation: 257).
    A one-pud aerial bomb is about 16 kilograms, the weight of a round of a modern 120 mm mortar; on average six to seven such bombs fell per aul.
    The aviation was directed by Petrozhitsky, chief of the district's air force, and historian T. U. Elbuzdukayeva lists the targets by name: "In the course of the operation the aircraft of the 3rd, and from 6 September also of the 5th aviation detachments delivered air strikes on the auls of Zumsoy, Dai, Tagir Khoy, Akki Bougi, Oshni, Khimoy, Nizheloy, Ragekhoy, Urus-Martan and Nozhay-Yurt"(Citation: 259).
    What the "warning fire" looked like in a single aul can be seen from the dispatch on Achkhoy-Martan of 25 August 1925: "15 shrapnel rounds were fired at the aul, first four with a high burst, then to strike.
    After two Chechen women had been wounded, the inhabitants began to hand over their weapons"(Citation: 481).
    Historian A. Yu.
    Lashkov writes of the strike on the aul of Dai: "Initially, because of heavy fog, the neighboring settlement of Chubakhkimeroy was mistakenly subjected to the air strike"(Citation: 477).
  uk: |-
    Ціллю артилерії та авіації часто ставали не військові об'єкти, а житлові населені пункти цілком: інструкція від 4 серпня 1925 року, затверджена командувачем Північно-Кавказького військового округу Уборевичем, членом Реввійськради округу Володіним і повноважним представником ОГПУ (політичної поліції, попередниці сучасної ФСБ) по краю Євдокимовим, приписувала - «Якщо населення аулу у встановлений строк цілком не виконає вимоги про здачу зброї або виконає частково, то командування загоном, як загрозу, відкриває артилерійський вогонь (а за відсутності артилерії - кулеметний) протягом 10 хвилин на високі розриви і напів-ураження», і додавала: «залежно від обстановки попереджувальний вогонь, як захід впливу, може відкриватися і кілька разів»(Citation: 479); ні військового об'єкта, ні цілі всередині села документ не називає зовсім.
    З 242 роззброєних селищ 101 потрапило під рушнично-кулеметний і артилерійський обстріл, 16 - під удари з повітря(Citation: 125); за підрахунком історика Є. Ф. Жупікової, «На 16 аулів, де переховувалися керівники повстанців, було скинуто 104 пудові бомби [близько 1,7 тонни]»(Citation: 257).
    Пудова авіабомба - це близько 16 кілограмів, вага міни сучасного 120-мм міномета; у середньому на аул припало по шість-сім таких бомб.
    Авіацією розпоряджався начальник ВПС округу Петрожицький, а історик Т. У. Ельбуздукаєва перелічує цілі поіменно: «У ході проведення операції літаки 3-го, а з 6 вересня - і 5-го авіаційних загонів завдавали авіаударів по аулах Зумсой, Дай, Тагір Хой, Аккі Боугі, Ошні, Хімой, Ніжелой, Рагехой, Урус-Мартан і Ножай-Юрт»(Citation: 259).
    Як виглядав «попереджувальний вогонь» в одному аулі, видно з донесення по Ачхой-Мартану 25 серпня 1925 року: «по аулу було випущено 15 шрапнелей спершу на високий розрив чотири потім на ураження.
    Після того, як було поранено двох чеченок, жителі почали віддавати зброю»(Citation: 481).
    Історик А. Ю. Лашков пише про удар по аулу Дай: «Спочатку через сильний туман авіаудару помилково зазнало сусіднє селище Чубахкімерой»(Citation: 477).
