description:
  ru: |-
    За два месяца операции 1925 года СССР арестовал и расстрелял лидеров сопротивления Чечни и Дагестана.
    Имама Нажмуддина Гоцинского, духовного главу сопротивления в Дагестане и Чечне, ОГПУ (политическая полиция, предшественница современной ФСБ) арестовало 5 сентября 1925 года.
    Место его укрытия выдали под угрозой обстрела сёл старики-заложники Шароевского района.
    В тот же день командующий Северо-Кавказским военным округом Уборевич, полномочный представитель ОГПУ по краю Евдокимов и член Реввоенсовета округа Володин доложили в Москву: «Операция в Шароевском районе закончилась удачно.
    После 5 дней репрессий, агентурной работы сегодня в 14 часов через самолеты получено донесение, что Гоцинский взят»(Citation: 477); арестовала его оперативная группа ГПУ под командованием М. Ушаева(Citation: 125).
    Историк Т. У. Эльбуздукаева пишет: «В срочном порядке Н. Гоцинский был вывезен в Ростов-на-Дону, где 15 октября 1925 г. был приговорен к расстрелу»(Citation: 259).
    Аресты предусмотрены и инструкцией о разоружении от 4 августа 1925 года - она допускает: «производство арестов влиятельных лиц аула, реакционно настроенных», с оговоркой прибегать к этой мере «как к крайней, с соблюдением максимального такта»(Citation: 479).
    Под обстрелом сдавались и невиновные: историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут, что в Урус-Мартане «после артиллерийских и авиационных обстрелов селения, сдались властям шейхи Солса-хаджи Яндаров и Билу-хаджи Гайтаев, вскоре, кстати, отпущенные вследствие полной невиновности»(Citation: 125).
  en: |-
    In the two months of the operation of 1925 the USSR arrested and shot the leaders of the resistance of Chechnya and Dagestan.
    Imam Nazhmuddin Gotsinsky, the spiritual head of the resistance in Dagestan and Chechnya, was arrested by the OGPU (the political police, a predecessor of today's FSB) on 5 September 1925.
    His hiding place was given up by the old men held hostage in the Sharoy district under the threat of the shelling of their villages.
    On the same day Uborevich, commander of the North Caucasus Military District, Yevdokimov, plenipotentiary representative of the OGPU for the krai, and Volodin, member of the district's Revolutionary Military Council, reported to Moscow: "The operation in the Sharoy district has ended successfully.
    After 5 days of repressions and agent work, today at 14 hours a report was received through the aircraft that Gotsinsky has been taken"(Citation: 477); he was arrested by an operational group of the GPU under the command of M. Ushaev(Citation: 125).
    Historian T. U. Elbuzdukayeva writes: "N. Gotsinsky was urgently taken to Rostov-on-Don, where on 15 October 1925 he was sentenced to be shot"(Citation: 259).
    Arrests are provided for by the disarmament instruction of 4 August 1925 as well - it allows "the conduct of arrests of influential persons of the aul, reactionarily disposed", with the proviso to resort to this measure "as an extreme one, with the observance of maximum tact"(Citation: 479).
    Under shelling even the innocent surrendered: historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write that in Urus-Martan, "after the artillery and aviation shelling of the settlement, the sheikhs Solsa-Haji Yandarov and Bilu-Haji Gaytayev surrendered to the authorities - soon, incidentally, released owing to their complete innocence"(Citation: 125).
  uk: |-
    За два місяці операції 1925 року СРСР заарештував і розстріляв лідерів опору Чечні та Дагестану.
    Імама Нажмуддіна Гоцинського, духовного главу опору в Дагестані та Чечні, ОГПУ (політична поліція, попередниця сучасної ФСБ) заарештувало 5 вересня 1925 року.
    Місце його укриття видали під загрозою обстрілу сіл старі-заручники Шароєвського району.
    Того ж дня командувач Північно-Кавказького військового округу Уборевич, повноважний представник ОГПУ по краю Євдокимов і член Реввійськради округу Володін доповіли в Москву: «Операція в Шароєвському районі закінчилася вдало.
    Після 5 днів репресій, агентурної роботи сьогодні о 14 годині через літаки отримано донесення, що Гоцинського взято»(Citation: 477); заарештувала його оперативна група ГПУ під командуванням М. Ушаєва(Citation: 125).
    Історик Т. У. Ельбуздукаєва пише: «У терміновому порядку Н. Гоцинського було вивезено в Ростов-на-Дону, де 15 жовтня 1925 р. його було засуджено до розстрілу»(Citation: 259).
    Арешти передбачені й інструкцією про роззброєння від 4 серпня 1925 року - вона допускає: «проведення арештів впливових осіб аулу, реакційно налаштованих», із застереженням вдаватися до цього заходу «як до крайнього, з дотриманням максимального такту»(Citation: 479).
    Під обстрілом здавалися й невинуваті: історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть, що в Урус-Мартані «після артилерійських і авіаційних обстрілів селища, здалися владі шейхи Солса-хаджі Яндаров і Білу-хаджі Гайтаєв, невдовзі, до речі, відпущені внаслідок повної невинуватості»(Citation: 125).
