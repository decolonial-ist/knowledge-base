description:
  en: |-
    The documents of its staff described a military operation with artillery shelling as the bringing of peace: the "Main Tasks of the Special Operational Groups of the OGPU in the Operation in the Chechen Autonomous Oblast", approved by Yevdokimov, plenipotentiary representative of the OGPU (the political police, a predecessor of today's FSB) for the krai, Uborevich, commander of the North Caucasus Military District, and Volodin, member of the district's Revolutionary Military Council, open with the words that the mass operation "in its final result must bring general pacification to Chechnya and create the appropriate conditions for the peaceful Soviet-economic construction of the oblast"(Citation: 479).
    The same frame was prescribed to be spoken aloud in every aul: under the disarmament instruction of 4 August 1925 the representatives of the authorities, having entered a village surrounded by troops, announced to the assembly the purpose of their coming - "the removal of weapons with a view to the Chechen authorities securing a normal working life for the toiling population", and the artillery shelling was given a name within this frame: "warning fire as a measure of influence"(Citation: 479).
    The organizer of the operation, Mikoyan, secretary of the North Caucasus krai committee of the party, brought this picture to its final formula in his memoirs: "It was a brilliant operation without any bloodshed"(Citation: 483) - in the same chapter he himself describes the Chechen old men taken hostage by the Chekists and the shelling of a Chechen village by the troops of the USSR.
  uk: |-
    Військову операцію з артобстрілами документи її штабу описали як принесення миру: «Основні завдання Особливих оперативних груп ОГПУ при операції в Чеченській Автономній області», затверджені повноважним представником ОГПУ (політичної поліції, попередниці сучасної ФСБ) по краю Євдокимовим, командувачем Північно-Кавказького військового округу Уборевичем і членом Реввійськради округу Володіним, відкриваються словами про те, що масова операція «у кінцевому своєму результаті має принести загальне умиротворення Чечні і створити відповідну обстановку для мирного радянсько-господарського будівництва області»(Citation: 479).
    Ту саму рамку належало промовляти вголос у кожному аулі: за інструкцією про роззброєння від 4 серпня 1925 року представники влади, увійшовши в оточене військами село, оголошували сходу мету приходу - «вилучення зброї з метою забезпечення чеченською владою нормального трудового життя трудящого населення», а артобстрілу в цій рамці дано ім'я: «попереджувальний вогонь, як захід впливу»(Citation: 479).
    Організатор операції, секретар Північно-Кавказького крайкому партії Мікоян, довів цю картину до підсумкової формули в мемуарах: «Це була блискуча операція без жодного кровопролиття»(Citation: 483) - у тій самій главі він сам описує чеченських старих, узятих чекістами в заручники, і обстріл чеченського села військами СРСР.
  ru: |-
    Войсковую операцию с артобстрелами документы её штаба описали как принесение мира: «Основные задачи Особых оперативных групп ОГПУ при операции в Чеченской Автономной области», утверждённые полномочным представителем ОГПУ (политической полиции, предшественницы современной ФСБ) по краю Евдокимовым, командующим Северо-Кавказским военным округом Уборевичем и членом Реввоенсовета округа Володиным, открываются словами о том, что массовая операция «в конечном своем результате должна принести общее умиротворение Чечне и создать соответствующую обстановку для мирного советско-хозяйственного строительства области»(Citation: 479).
    Ту же рамку предписывалось произносить вслух в каждом ауле: по инструкции о разоружении от 4 августа 1925 года представители власти, войдя в окружённое войсками село, объявляли сходу цель прихода - «изъятие оружия в видах обеспечения чеченской властью нормальной трудовой жизни трудящегося населения», а артобстрелу в этой рамке дано имя: «предупредительный огонь, как мера воздействия»(Citation: 479).
    Организатор операции, секретарь Северо-Кавказского крайкома партии Микоян, довёл эту картину до итоговой формулы в мемуарах: «Это была блестящая операция без всякого кровопролития»(Citation: 483) - в той же главе он сам описывает чеченских стариков, взятых чекистами в заложники, и обстрел чеченского села войсками СССР.
