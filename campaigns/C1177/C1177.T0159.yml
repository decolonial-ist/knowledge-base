description:
  ru: |-
    Ещё до операции сельские сходы вместе с ревкомами (невыборными комитетами, поставленными вместо избранных Советов, - кампания C1176) составляли списки «порочного элемента» - жителей, замеченных в грабежах; историк Е. Ф. Жупикова пишет: «Они и их родственники несли материальную ответственность за все случаи хищений на территории Чечни»(Citation: 257) - родственники платили за чужие кражи по факту родства и записи в списке.
    Выйти из списка можно было только присягой с обязательством доносить: «Если "порочный элемент" приносил присягу в том, что в течение года не будет грабить и будет доносить на воров, его из списка исключали»(Citation: 257).
    Когда войска дошли до гор, той же категорией считали разрушенное: по итогу бомбардировок 16 аулов «взорвали 119 домов "порочного элемента"»(Citation: 257); историки Я. З. Ахмадов и Э. Х. Хасмагомадов подтверждают число - «взорвано 119 домов»(Citation: 125): дом взрывали за то, что его хозяин значился в списке.
  en: |-
    Even before the operation the village assemblies together with the revkoms (unelected committees installed in place of elected Soviets - campaign C1176) drew up lists of the "vicious element" - inhabitants noted in robberies; historian E. F. Zhupikova writes: "They and their relatives bore material responsibility for all cases of theft on the territory of Chechnya"(Citation: 257) - the relatives paid for others' thefts by the fact of kinship and an entry in the list.
    One could leave the list only by an oath with an obligation to inform: "If the 'vicious element' took an oath that for a year he would not rob and would inform on thieves, he was struck from the list"(Citation: 257).
    When the troops reached the mountains, the destroyed was counted by the same category: as the result of the bombing of 16 auls "119 houses of the 'vicious element' were blown up"(Citation: 257); historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov confirm the number - "119 houses were blown up"(Citation: 125): a house was blown up because its owner was entered in the list.
  uk: |-
    Ще до операції сільські сходи разом з ревкомами (невиборними комітетами, поставленими замість обраних Рад, - кампанія C1176) складали списки «порочного елементу» - жителів, помічених у грабежах; історик Є. Ф. Жупікова пише: «Вони та їхні родичі несли матеріальну відповідальність за всі випадки розкрадань на території Чечні»(Citation: 257) - родичі платили за чужі крадіжки за фактом споріднення і запису в списку.
    Вийти зі списку можна було тільки присягою із зобов'язанням доносити: «Якщо "порочний елемент" приносив присягу в тому, що протягом року не грабуватиме і доноситиме на злодіїв, його зі списку виключали»(Citation: 257).
    Коли війська дійшли до гір, тією ж категорією рахували зруйноване: за підсумком бомбардувань 16 аулів «підірвали 119 будинків "порочного елементу"»(Citation: 257); історики Я. З. Ахмадов і Е. Х. Хасмагомадов підтверджують число - «підірвано 119 будинків»(Citation: 125): будинок підривали за те, що його господар значився в списку.
