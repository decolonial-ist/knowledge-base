description:
  en: |-
    Over the three weeks of the operation, from 25 August to 12 September 1925, the troops of the USSR took from the inhabitants of Chechnya 25299 rifles, 4319 revolvers and pistols, a machine gun and about 80 thousand cartridges(Citation: 125); the OGPU (the political police, a predecessor of today's FSB) reported to Stalin in rounded numbers: "In Chechnya during the operation 24000 rifles, 4000 revolvers, about 70000 cartridges, 2 machine guns were removed"(Citation: 476), while Mikoyan, secretary of the North Caucasus krai committee of the party and one of the operation's organizers, counted in his memoirs "more than 30 thousand rifles, more than 10 machine guns"(Citation: 483).
    By the assessment of historian E. F. Zhupikova, what was removed amounted to "approximately 75% of what the population had before the start of the operation and approximately half of the weapons removed in all the highland oblasts"(Citation: 257).
    Under the disarmament instruction of 4 August 1925 the inhabitants were announced "the exact figure of the firearms and ammunition subject to removal", taken from the OGPU questionnaires, and given no more than two hours to surrender them(Citation: 479); Mikoyan describes the same quota with the words "they would present each village with the demand to surrender all weapons in the quantity known from agent intelligence"(Citation: 483).
    The taking of weapons began even before the troops went in, with the inhabitants divided up by lists: from those entered in the lists of the "vicious element" and their relatives "the local revkoms took the weapons away, while registering those of the remaining inhabitants"(Citation: 257).
    The inhabitants themselves asked to give up their weapons without shelling: in early September 1925 the delegates of the Goity society Eski Karlagov, Khatu Dobriyev and Dzhabi Otgayev appealed to the district's Revolutionary Military Council with a request: "Now, at the disarmament, which we consider right, we ask that this be taken into account and petition that an exception be made by allowing the voluntary surrender of weapons without the taking of repressive measures"; the answer came by telegram, "most urgent", over the signatures of Uborevich, commander of the North Caucasus Military District, Volodin, member of the district's Revolutionary Military Council, and Yevdokimov, plenipotentiary representative of the OGPU for the krai: "The Red Army knows well the revolutionary services of the village of Goity.
    The surrender of weapons must be carried out voluntarily on 9 September with delivery of the weapons to Grozny.
    The weapons necessary for self-defense will be left to the aul of Goity"(Citation: 480).
  uk: |-
    За три тижні операції, з 25 серпня по 12 вересня 1925 року, війська СРСР забрали в жителів Чечні 25299 гвинтівок, 4319 револьверів і пістолетів, кулемет і близько 80 тисяч набоїв(Citation: 125); ОГПУ (політична поліція, попередниця сучасної ФСБ) доповіло Сталіну округлено: «У Чечні під час операції вилучено 24000 гвинтівок, 4000 револьверів, близько 70000 набоїв, 2 кулемети»(Citation: 476), а секретар Північно-Кавказького крайкому партії Мікоян, один з організаторів операції, у мемуарах нарахував «понад 30 тис. гвинтівок, понад 10 кулеметів»(Citation: 483).
    За оцінкою історика Є. Ф. Жупікової, вилучене становило «приблизно 75% наявного в населення до початку операції і приблизно половину зброї, вилученої в усіх горських областях»(Citation: 257).
    За інструкцією про роззброєння від 4 серпня 1925 року жителям оголошували «точну цифру вогнепальної зброї і припасів до неї, що підлягають вилученню», взяту з анкет ОГПУ, і давали на здачу не більше двох годин(Citation: 479); Мікоян описує ту саму рознарядку словами «висунуть кожному селу вимогу здати всю зброю в тій кількості, яка була відома за агентурними даними»(Citation: 483).
    Відбирати зброю почали ще до введення військ, розділивши жителів списками: у занесених до списків «порочного елементу» та їхніх родичів «зброю місцеві ревкоми відбирали, а в решти жителів реєстрували»(Citation: 257).
    Віддати зброю без обстрілу просили самі жителі: на початку вересня 1925 року делегати Гойтинського товариства Ескі Карлагов, Хату Добрієв і Джабі Отгаєв звернулися до Реввійськради округу з проханням: «Тепер при роззброєнні, яке ми вважаємо правильним, ми просимо взяти це до уваги і клопочемо зробити виняток, допустивши добровільну здачу зброї без вжиття репресивних заходів»; відповідь прийшла телеграмою «вельми терміновою» за підписами командувача Північно-Кавказького військового округу Уборевича, члена Реввійськради округу Володіна і повноважного представника ОГПУ по краю Євдокимова: «Революційні заслуги селища Гойти Червона Армія добре знає.
    Здача зброї має бути проведена добровільно 9 вересня з доставкою зброї в Грозний.
    Необхідну зброю для самооборони аулу Гойти буде залишено»(Citation: 480).
  ru: |-
    За три недели операции, с 25 августа по 12 сентября 1925 года, войска СССР забрали у жителей Чечни 25299 винтовок, 4319 револьверов и пистолетов, пулемёт и около 80 тысяч патронов(Citation: 125); ОГПУ (политическая полиция, предшественница современной ФСБ) доложило Сталину округлённо: «В Чечне во время операции изъято 24000 винтовок, 4000 револьверов, около 70000 патронов, 2 пулемета»(Citation: 476), а секретарь Северо-Кавказского крайкома партии Микоян, один из организаторов операции, в мемуарах насчитал «более 30 тыс. винтовок, более 10 пулеметов»(Citation: 483).
    По оценке историка Е. Ф. Жупиковой, изъятое составило «примерно 75% имевшегося у населения до начала операции и примерно половину оружия, изъятого во всех горских областях»(Citation: 257).
    По инструкции о разоружении от 4 августа 1925 года жителям объявляли «точная цифра подлежащего изъятию огнестрельного оружия и припасов к нему», взятая из анкет ОГПУ, и давали на сдачу не больше двух часов(Citation: 479); Микоян описывает ту же разнарядку словами «предъявят каждому селу требование сдать все оружие в том количестве, которое было известно по агентурным данным»(Citation: 483).
    Отбирать оружие начали ещё до ввода войск, разделив жителей списками: у занесённых в списки «порочного элемента» и их родственников «оружие местные ревкомы отбирали, а у остальных жителей регистрировали»(Citation: 257).
    Отдать оружие без обстрела просили сами жители: в начале сентября 1925 года делегаты Гойтинского общества Ески Карлагов, Хату Добриев и Джаби Отгаев обратились в Реввоенсовет округа с просьбой: «Теперь при разоружении, которое мы считаем правильным мы просим принять это во внимание и ходатайствуем сделать исключением допустив добровольную сдачу оружия без принятия репрессивных мер»; ответ пришёл телеграммой «весьма срочной» за подписями командующего Северо-Кавказским военным округом Уборевича, члена Реввоенсовета округа Володина и полномочного представителя ОГПУ по краю Евдокимова: «Революционные заслуги селения Гойты Красная Армия хорошо знает.
    Сдача оружия должна быть произведена добровольно 9 сентября с доставкой оружия Грозный.
    Необходимое оружие для самообороны аулу Гойты будет оставлено»(Citation: 480).
