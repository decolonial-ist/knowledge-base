name:
  ru: 'Разоружение Чечни: войсковая операция с артобстрелами и бомбардировками аулов (1925)'
  en: 'The disarmament of Chechnya: a military operation with artillery shelling and bombing of auls (1925)'
  uk: 'Роззброєння Чечні: військова операція з артобстрілами та бомбардуваннями аулів (1925)'
description:
  ru: |-
    К 1925 году советская власть стояла в Чечне пятый год и оставалась во многом номинальной: пять лет советизации (кампания C1176) - ревкомы вместо выборных Советов, аресты шейхов, два частичных разоружения - не дали Москве контроля над народом, в горах укрывался имам Нажмуддин Гоцинский - духовный глава вооружённого сопротивления в Дагестане и Чечне, а характеристика Горного района, составленная штабом будущей операции, признавала: «За Шаро-Аргуном советской власти не существует»(Citation: 480).
    Москва же вела курс на изъятие власти у автономий - историк Т. У. Эльбуздукаева пишет: «Непрекращающийся бандитизм и повстанческие движения на Северном Кавказе воспринимались московской властью как убедительный аргумент в пользу ее централизаторских усилий, процесса перехода автономного суверенитета из кавказских в московские руки»(Citation: 259).
    Этим курсом и стала операция 1925 года: СССР отобрал оружие у населения Чечни силами армии и ОГПУ (политической полиции, предшественницы современной ФСБ) - с 25 августа войска прошли 242 селения, 101 из них обстреляли из [артиллерийских] орудий и пулемётов, 16 разбомбили с самолётов, арестовали больше 300 человек и почти всех расстреляли без суда.
    Войска под видом манёвров входили в область, окружали аул за аулом, созывали сход, предъявляли ультиматум о сдаче оружия по готовой разнарядке и при невыполнении открывали огонь по селению; о целях Эльбуздукаева пишет: центрами операции штаб заранее определил горные общества, «где предположительно находился [глава сопротивления] Н. Гоцинский»(Citation: 259).
    Инструкция от 4 августа 1925 года, утверждённая командующим Северо-Кавказским военным округом (СКВО) Уборевичем, предписывала при невыполнении ультиматума открывать по селению артиллерийский огонь на десять минут и разрешала повторять его несколько раз(Citation: 479).
    Обман тоже был назначен документом: приказом от 31 июля 1925 года штаб Рабоче-крестьянской Красной армии (РККА) одобрил Уборевичу манёвры в Чечне и тем же документом назначил разоружение: «Вместе с тем, - говорилось в приказе, - пользуясь сосредоточением значительного количества войск, на территории Чечни (район предстоящих маневров) командование СКВО по согласованию с ППОГПУ [полномочным представительством ОГПУ] на Северном Кавказе намечает провести разоружение и изъятие бандитского элемента, что по ряду политических признаков является весьма своевременным»(Citation: 256).
    Санкцию дал лично Сталин: в июле 1925 года секретарь Северо-Кавказского крайкома партии Микоян(Citation: 478) встретился с ним в Сочи и после разговора телеграфировал в Москву Молотову: «Политическое положение в Чечне обострилось.
    Сталин дал личное согласие на необходимость операции»(Citation: 259).
    Через много лет Микоян подвёл в мемуарах итог: «Эта операция коренным образом очистила воздух Чечни»(Citation: 483).
  en: |-
    By 1925 Soviet power had stood in Chechnya for its fifth year and remained largely nominal: five years of Sovietization (campaign C1176) - revkoms (revolutionary committees) instead of elected Soviets, arrests of sheikhs, two partial disarmaments - had not given Moscow control over the people, imam Nazhmuddin Gotsinsky, the spiritual head of the armed resistance in Dagestan and Chechnya, was sheltering in the mountains, and the profile of the Mountain district drawn up by the staff of the future operation admitted: "Beyond the Sharo-Argun Soviet power does not exist"(Citation: 480).
    Moscow, meanwhile, was steering a course toward taking power away from the autonomies - historian T. U. Elbuzdukayeva writes: "The unceasing banditry and insurgent movements in the North Caucasus were perceived by the Moscow authorities as a convincing argument in favor of its centralizing efforts, the process of transferring autonomous sovereignty from Caucasian into Moscow hands"(Citation: 259).
    The operation of 1925 became that course in action: the USSR took away the weapons of Chechnya's population with the forces of the army and the OGPU (the political police, a predecessor of today's FSB) - from 25 August the troops passed through 242 settlements, shelled 101 of them with [artillery] guns and machine guns, bombed 16 from aircraft, arrested more than 300 people and shot nearly all of them without trial.
    Under the guise of maneuvers the troops entered the oblast, surrounded aul after aul, convened the village assembly, presented an ultimatum to surrender weapons according to a ready-made quota, and opened fire on the settlement if it was not met; of the aims Elbuzdukayeva writes: as the centers of the operation the staff had designated in advance the mountain societies "where N. Gotsinsky [the head of the resistance] was presumed to be"(Citation: 259).
    The instruction of 4 August 1925, approved by Uborevich, commander of the North Caucasus Military District (SKVO), prescribed, should the ultimatum not be met, opening artillery fire on the settlement for ten minutes, and allowed repeating it several times(Citation: 479).
    The deception, too, was assigned by document: by an order of 31 July 1925 the staff of the Workers' and Peasants' Red Army (RKKA) approved Uborevich's maneuvers in Chechnya and with the same document assigned the disarmament: "At the same time," the order said, "taking advantage of the concentration of a significant number of troops on the territory of Chechnya (the district of the forthcoming maneuvers), the command of the SKVO, in coordination with the PPOGPU [the plenipotentiary representation of the OGPU] in the North Caucasus, plans to carry out a disarmament and a removal of the bandit element, which by a number of political indications is highly timely"(Citation: 256).
    The sanction was given by Stalin personally: in July 1925 Mikoyan, secretary of the North Caucasus krai committee of the party(Citation: 478), met him in Sochi and after the conversation telegraphed to Molotov in Moscow: "The political situation in Chechnya has become aggravated.
    Stalin has given his personal consent to the necessity of the operation"(Citation: 259).
    Many years later Mikoyan summed it up in his memoirs: "This operation fundamentally cleared the air of Chechnya"(Citation: 483).
  uk: |-
    До 1925 року радянська влада стояла в Чечні п'ятий рік і залишалася багато в чому номінальною: п'ять років радянізації (кампанія C1176) - ревкоми замість виборних Рад, арешти шейхів, два часткові роззброєння - не дали Москві контролю над народом, у горах переховувався імам Нажмуддін Гоцинський - духовний глава збройного опору в Дагестані та Чечні, а характеристика Гірського району, складена штабом майбутньої операції, визнавала: «За Шаро-Аргуном радянської влади не існує»(Citation: 480).
    Москва ж вела курс на вилучення влади в автономій - історик Т. У. Ельбуздукаєва пише: «Безперервний бандитизм і повстанські рухи на Північному Кавказі сприймалися московською владою як переконливий аргумент на користь її централізаторських зусиль, процесу переходу автономного суверенітету з кавказьких у московські руки»(Citation: 259).
    Цим курсом і стала операція 1925 року: СРСР відібрав зброю в населення Чечні силами армії та ОГПУ (політичної поліції, попередниці сучасної ФСБ) - з 25 серпня війська пройшли 242 селища, 101 з них обстріляли з гармат і кулеметів, 16 розбомбили з літаків, заарештували понад 300 людей і майже всіх розстріляли без суду.
    Війська під виглядом маневрів входили в область, оточували аул за аулом, скликали схід, висували ультиматум про здачу зброї за готовою рознарядкою і при невиконанні відкривали вогонь по селищу; про цілі Ельбуздукаєва пише: центрами операції штаб заздалегідь визначив гірські товариства, «де ймовірно перебував [глава опору] Н. Гоцинський»(Citation: 259).
    Інструкція від 4 серпня 1925 року, затверджена командувачем Північно-Кавказького військового округу (СКВО) Уборевичем, приписувала при невиконанні ультиматуму відкривати по селищу артилерійський вогонь на десять хвилин і дозволяла повторювати його кілька разів(Citation: 479).
    Обман теж був призначений документом: наказом від 31 липня 1925 року штаб Робітничо-селянської Червоної армії (РСЧА) схвалив Уборевичу маневри в Чечні і тим самим документом призначив роззброєння: «Разом з тим, - говорилося в наказі, - користуючись зосередженням значної кількості військ, на території Чечні (район майбутніх маневрів) командування СКВО за погодженням з ППОГПУ [повноважним представництвом ОГПУ] на Північному Кавказі планує провести роззброєння і вилучення бандитського елементу, що за низкою політичних ознак є вельми своєчасним»(Citation: 256).
    Санкцію дав особисто Сталін: у липні 1925 року секретар Північно-Кавказького крайкому партії Мікоян(Citation: 478) зустрівся з ним у Сочі і після розмови телеграфував у Москву Молотову: «Політичне становище в Чечні загострилося.
    Сталін дав особисту згоду на необхідність операції»(Citation: 259).
    Через багато років Мікоян підбив у мемуарах підсумок: «Ця операція докорінно очистила повітря Чечні»(Citation: 483).
