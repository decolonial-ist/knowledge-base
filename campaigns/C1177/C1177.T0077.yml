description:
  ru: |-
    По сопротивляющимся сёлам войска шли рейдами с поголовными обысками и арестами.
    Инструкция о массовых обысках, изданная к операции штабом ОГПУ (политической полиции, предшественницы современной ФСБ), велела оцеплять дома, задерживать и обыскивать всех, кто в них находится, а об арестах говорит пунктами 7 и 8: «Все противодействующие в той или иной мере успешному проведению массовой операции привлекаются к ответственности и арестовываются», «Злостные укрыватели оружия арестовываются»; о взятом при обыске тот же документ говорит: «При обысках и арестах забирается только лишь вся переписка в том числе и переписка на арабском языке, а также всё найденное при обыске оружие»(Citation: 479).
    Информационный отдел ОГПУ подытожил операцию в «Обзоре политического состояния СССР за сентябрь 1925 г.» с грифом «Совершенно секретно» словами «С нашей стороны потери 20 человек»(Citation: 476), а об убитых и раненых в обстрелянных и разбомблённых аулах не сообщил ничего.
    Счёт потерь за всю операцию историки Я. З. Ахмадов и Э. Х. Хасмагомадов приводят по журнальной публикации 1995 года: шесть убитых мирных жителей, 30 раненых, ещё 12 убитых отнесены к «бандитам», при потерях самих войск в пять человек убитыми и девять ранеными(Citation: 125).
  en: |-
    Through the resisting villages the troops moved in raids with house-to-house searches and arrests.
    The instruction on mass searches, issued for the operation by the staff of the OGPU (the political police, a predecessor of today's FSB), ordered houses to be cordoned off and everyone found in them to be detained and searched, and speaks of arrests in points 7 and 8: "All who counteract in one measure or another the successful conduct of the mass operation are brought to account and arrested", "Malicious concealers of weapons are arrested"; of what was taken during a search the same document says: "During searches and arrests only all correspondence is taken, including correspondence in the Arabic language, as well as all weapons found during the search"(Citation: 479).
    The information department of the OGPU, in its "Survey of the Political Condition of the USSR for September 1925" stamped "Top Secret", summed up the operation with the words "On our side losses are 20 men"(Citation: 476), and reported nothing about the killed and wounded in the shelled and bombed auls.
    The count of losses for the operation as a whole is given by historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov from a journal publication of 1995: six killed civilians, 30 wounded, a further 12 killed assigned to the "bandits", with the troops' own losses at five killed and nine wounded(Citation: 125).
  uk: |-
    Селами, що чинили опір, війська йшли рейдами з поголовними обшуками та арештами.
    Інструкція про масові обшуки, видана до операції штабом ОГПУ (політичної поліції, попередниці сучасної ФСБ), веліла оточувати будинки, затримувати й обшукувати всіх, хто в них перебуває, а про арешти говорить пунктами 7 і 8: «Усі, хто протидіє тією чи іншою мірою успішному проведенню масової операції, притягаються до відповідальності і заарештовуються», «Злісні переховувачі зброї заарештовуються»; про взяте при обшуку той самий документ говорить: «При обшуках і арештах забирається тільки лише все листування, у тому числі й листування арабською мовою, а також уся знайдена при обшуку зброя»(Citation: 479).
    Інформаційний відділ ОГПУ підсумував операцію в «Огляді політичного стану СРСР за вересень 1925 р.» з грифом «Цілком таємно» словами «З нашого боку втрати 20 осіб»(Citation: 476), а про вбитих і поранених в обстріляних і розбомблених аулах не повідомив нічого.
    Рахунок втрат за всю операцію історики Я. З. Ахмадов і Е. Х. Хасмагомадов наводять за журнальною публікацією 1995 року: шестеро вбитих мирних жителів, 30 поранених, ще 12 вбитих віднесено до «бандитів», при втратах самих військ у п'ять осіб убитими і дев'ять пораненими(Citation: 125).
