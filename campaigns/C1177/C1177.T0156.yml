description:
  ru: |-
    8 сентября 1925 года советская авиация сбросила на Ножай-Юрт восемь пудовых - по 16 килограммов, как мина современного 120-мм миномёта - бомб, чтобы принудить село выдать бывшего начальника окружной милиции Гибертиева(Citation: 482).
    Так же принуждали Урус-Мартан: историк А. Ю. Лашков пишет, что после артиллерийского огня и бомбовых ударов «руководство Урус-Мартана пошло на уступки и выдало бандитов 9 сентября»(Citation: 477).
    О представителях местной власти инструкция о массовых обысках, изданная к операции штабом ОГПУ (политической полиции, предшественницы современной ФСБ), говорит: они привлекаются к изъятию как «обязанные указать жилища лиц, подлежащих изъятию, а также тех лиц (родственников и проч.), где подлежащее изъятию лицо может укрываться»(Citation: 479) - исполнителем изъятия делали саму общину.
    Цену этого требования называет историк Е. Ф. Жупикова: «В силу горского обычая гостеприимства, население Чечни, даже если оно враждебно относилось к руководителям повстанцев и главарям бандитов, не могло выдать их властям.
    Нарушение обычая опозорило бы горца на много поколений и грозило бы кровной местью его роду со стороны выданного им человека»(Citation: 257).
  en: |-
    On 8 September 1925 Soviet aviation dropped eight one-pud bombs - 16 kilograms each, like a round of a modern 120 mm mortar - on Nozhay-Yurt, to force the village to hand over Gibertiev, the former head of the district militia(Citation: 482).
    Urus-Martan was coerced in the same way: historian A. Yu.
    Lashkov writes that after artillery fire and bomb strikes "the leadership of Urus-Martan yielded and handed over the bandits on 9 September"(Citation: 477).
    Of the representatives of the local authorities the instruction on mass searches, issued for the operation by the staff of the OGPU (the political police, a predecessor of today's FSB), says: they are brought into the removal as those "obliged to point out the dwellings of persons subject to removal, as well as those persons (relatives and others) with whom the person subject to removal may be hiding"(Citation: 479) - the community itself was made the executor of the removal.
    The price of this demand is named by historian E. F. Zhupikova: "By force of the highland custom of hospitality, the population of Chechnya, even if it was hostile to the leaders of the insurgents and the chiefs of the bandits, could not hand them over to the authorities.
    Breaking the custom would have disgraced the highlander for many generations and would have threatened his clan with blood vengeance from the man he had handed over"(Citation: 257).
  uk: |-
    8 вересня 1925 року радянська авіація скинула на Ножай-Юрт вісім пудових - по 16 кілограмів, як міна сучасного 120-мм міномета - бомб, щоб примусити село видати колишнього начальника окружної міліції Гібертієва(Citation: 482).
    Так само примушували Урус-Мартан: історик А. Ю. Лашков пише, що після артилерійського вогню і бомбових ударів «керівництво Урус-Мартана пішло на поступки і видало бандитів 9 вересня»(Citation: 477).
    Про представників місцевої влади інструкція про масові обшуки, видана до операції штабом ОГПУ (політичної поліції, попередниці сучасної ФСБ), говорить: їх залучають до вилучення як «зобов'язаних вказати житла осіб, що підлягають вилученню, а також тих осіб (родичів та ін.), у яких особа, що підлягає вилученню, може переховуватися»(Citation: 479) - виконавцем вилучення робили саму громаду.
    Ціну цієї вимоги називає історик Є. Ф. Жупікова: «Через горський звичай гостинності населення Чечні, навіть якщо воно вороже ставилося до керівників повстанців і ватажків бандитів, не могло видати їх владі.
    Порушення звичаю зганьбило б горця на багато поколінь і загрожувало б кровною помстою його роду з боку виданої ним людини»(Citation: 257).
