description:
  en: |-
    The Regular Army of the Russian Empire drove the population of the destroyed villages off their lands, which passed into the conqueror’s possession.
    Historian D. A. Khozhayev records that the inhabitants of the eight villages near Groznaya were “driven off the lands”(Citation: 95).
    Imperial general Yermolov wrote to Emperor Alexander I that if the population refused to submit, they would be offered “to withdraw and join the other brigands,” and then “all the lands will remain at our disposal”(Citation: 95).
  uk: |-
    Регулярна армія Російської імперії зганяла населення знищених селищ з його земель, які переходили в розпорядження завойовника.
    Історик Д. А. Хожаєв фіксує, що мешканців восьми селищ під Грозною було «зігнано з земель»(Citation: 95).
    Імперський генерал Єрмолов писав імператорові Олександру I, що в разі відмови підкоритися населенню запропонують «піти й приєднатися до інших розбійників», і тоді «всі землі залишаться в нашому розпорядженні»(Citation: 95).
  ru: |-
    Регулярная армия Российской империи сгоняла население уничтоженных селений с его земель, которые переходили в распоряжение завоевателя.
    Историк Д. А. Хожаев фиксирует, что жители восьми селений под Грозной были «согнаны с земель»(Citation: 95).
    Имперский генерал Ермолов писал императору Александру I, что при отказе подчиниться население предложат «удалиться и присоединиться к прочим разбойникам», и тогда «все земли останутся в распоряжении нашем»(Citation: 95).
