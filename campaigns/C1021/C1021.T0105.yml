description:
  en: |-
    The Regular Army of the Russian Empire demolished Chechen villages to clear ground for a fortress.
    Historian D. A. Khozhayev records the destruction of eight villages: to make way for Groznaya, “eight flourishing Chechen villages (Bugun-Yurt, Amirkhan-Kichu, Kuli-Yurt, Sorochan-Yurt, Sunzha, N. Chechen, Topli, Alkhanchu) were destroyed”(Citation: 95).
  uk: |-
    Регулярна армія Російської імперії зносила чеченські селища, щоб розчистити місце під фортецю.
    Історик Д. А. Хожаєв фіксує знищення восьми селищ: під Грозну «вісім квітучих чеченських селищ (Бугун-юрт, Амірхан-кічу, Кулі-юрт, Сорочан-юрт, Сунжа, Н. Чечен, Топлі, Алханчу) були знищені»(Citation: 95).
  ru: |-
    Регулярная армия Российской империи сносила чеченские селения, чтобы расчистить место под крепость.
    Историк Д. А. Хожаев фиксирует уничтожение восьми селений: под Грозную «восемь цветущих чеченских селений (Бугун-юрт, Амирхан-кичу, Кули-юрт, Сорочан-юрт, Сунжа, Н. Чечен, Топли, Алкханчу) были уничтожены»(Citation: 95).
