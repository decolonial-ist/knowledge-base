description:
  en: |-
    The Regular Army of the Russian Empire, having moved troops onto the Sunzha and occupied Chechen land, demanded that the elders of Chechen villages renew their oath of submission under threat of reprisal as against “open enemies.”
    Imperial general Yermolov testifies in his “Notes” that in May 1818 “the elders of almost all the principal Chechen villages were summoned to me,” to the military camp, and he demanded “that henceforth such [depredations] no longer be committed, and in confirmation they must renew their old oath of submission and return the captives held by them”(Citation: 96).
    The demand went unfulfilled: the elders “promised nothing”(Citation: 96).
  uk: |-
    Регулярна армія Російської імперії, ввівши війська на Сунжу та зайнявши чеченську землю, вимагала від старшин чеченських селищ поновити присягу імперії під загрозою розправи як з «явними ворогами».
    Імперський генерал Єрмолов у своїх «Записках» свідчить, що в травні 1818 року «старшини майже всіх найголовніших чеченських сіл були скликані до мене», у військовий табір, і він зажадав, «щоб надалі таких [хижацтв] не чинили, і на підтвердження вони мають поновити давню присягу на покору, повернути утримуваних у них полонених»(Citation: 96).
    Вимога залишилася невиконаною: старшини «нічого не обіцяли»(Citation: 96).
  ru: |-
    Регулярная армия Российской империи, введя войска на Сунжу и заняв чеченскую землю, требовала от старшин чеченских селений возобновить присягу империи под угрозой расправы как с «явными неприятелями».
    Имперский генерал Ермолов в своих «Записках» свидетельствует, что в мае 1818 года «старшины почти всех главнейших деревень чеченских были созваны ко мне», в военный лагерь, и он потребовал, «чтобы впредь оных [хищничеств] делаемо не было, и в удостоверение должны они возобновить давнюю присягу на покорность, возвратить содержащихся у них пленных»(Citation: 96).
    Требование осталось неисполненным: старшины «ничего не обещали»(Citation: 96).
