description:
  en: |-
    The Regular Army of the Russian Empire shifted the cost of the imposed military service onto the Indigenous population itself.
    Imperial general Yermolov testifies in his “Notes” that the men levied by requisition were sent out “with their own arms and at their own expense”(Citation: 96).
  uk: |-
    Регулярна армія Російської імперії перекладала утримання нав’язаної військової служби на саме корінне населення.
    Імперський генерал Єрмолов у своїх «Записках» свідчить, що виставлювані за нарядом люди висилалися «з власним озброєнням і на своєму утриманні»(Citation: 96).
  ru: |-
    Регулярная армия Российской империи перекладывала содержание навязанной военной службы на само коренное население.
    Имперский генерал Ермолов в своих «Записках» свидетельствует, что выставляемые по наряду люди высылались «с собственным вооружением и на своем содержании»(Citation: 96).
