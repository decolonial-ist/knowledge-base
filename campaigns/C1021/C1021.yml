name:
  en: Destruction of the Nokhchi Villages along the Sunzha and Construction of the Groznaya Fortress in Their Place (1817–1818)
  uk: Знищення присунженських селищ Нохчі та зведення фортеці Грозної на їхньому місці (1817–1818)
  ru: Уничтожение присунженских селений нохчи и возведение крепости Грозной на их месте (1817–1818)
description:
  en: |-
    Between 1817 and 1818, the Russian Empire forcibly moved the fortified line from the Terek to the Sunzha and secured the seized territory of the Nokhchi communities by building a fortress, accompanying this with the driving off of the population, the taking of hostages, and coercion into submission.
    Historian D. A. Khozhaev records that the relocation of the line "squeezed unsubdued Chechnya with new fortresses and fortifications," while the fortress of Groznaya was built "on Chechen land," where "eight flourishing Chechen villages… were destroyed, and the population driven off its lands"(Citation: 95).
    Imperial general Yermolov, commander of the Caucasus Corps, testifies in his "Notes" to the deployment of troops ("on May 24 the entire detachment crossed over… moved from the Terek to the Sunzha River"), to the demand that the elders "renew their long-standing oath of submission," and to the taking of amanats (hostages) "from their villages"(Citation: 96).
    Imperial historian Potto confirms the founding of the fortress on June 10, 1818, "with six bastions, which Yermolov named Groznaya"(Citation: 75).
  uk: |-
    У період з 1817 по 1818 рік Російська імперія силою переносила укріплену лінію з Терека на Сунжу та закріплювала зайняту територію товариств Нохчі будівництвом фортеці, супроводжуючи це зігнанням населення, захопленням заручників і примусом до підпорядкування.
    Історик Д. А. Хожаєв фіксує, що перенесення лінії «стискало непокірну Чечню новими фортецями та укріпленнями», а фортеця Грозна будувалася «на чеченській землі», де «вісім квітучих чеченських селищ… були знищені, а населення зігнане з земель»(Citation: 95).
    Імперський генерал Єрмолов, командувач Кавказького корпусу, у своїх «Записках» свідчить про введення військ («24 травня переправився весь загін… перейшов від Терека на річку Сунжу»), про вимогу до старшин «поновити давню присягу на покірність» і про взяття аманатів «від їхніх селищ»(Citation: 96).
    Імперський історик Потто підтверджує закладення фортеці 10 червня 1818 року «на шість бастіонів, яку Єрмолов назвав Грозною»(Citation: 75).
  ru: |-
    В период с 1817 по 1818 год Российская империя силой переносила укрепленную линию с Терека на Сунжу и закрепляла занятую территорию обществ нохчи строительством крепости, сопровождая это сгоном населения, захватом заложников и принуждением к подчинению.
    Историк Д. А. Хожаев фиксирует, что перенос линии «сжимал непокорную Чечню новыми крепостями и укреплениями», а крепость Грозная строилась «на чеченской земле», где «восемь цветущих чеченских селений… были уничтожены, а население согнано с земель»(Citation: 95).
    Имперский генерал Ермолов, командующий Кавказским корпусом, в своих «Записках» свидетельствует о вводе войск («24-го мая переправился весь отряд… перешел от Терека на реку Сунжу»), о требовании к старшинам «возобновить давнюю присягу на покорность» и о взятии аманатов «от их селений»(Citation: 96).
    Имперский историк Потто подтверждает закладку крепости 10 июня 1818 года «о шести бастионах, которую Ермолов назвал Грозной»(Citation: 75).
