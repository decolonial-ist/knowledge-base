description:
  ru: |-
    Регулярная армия Российской империи вводила войска на земли нохчи между Тереком и Сунжой, чтобы силой перенести передовую укрепленную линию вглубь чеченской территории и поставить край под военный контроль.
    Историк Д. А. Хожаев определяет смысл переноса линии как сжатие не подчинившейся Чечни «новыми крепостями и укреплениями»(Citation: 95).
    Имперский генерал Ермолов, в «Записках» свидетельствует о вводе войск: «24-го мая переправился весь отряд… в один марш перешел от Терека на реку Сунжу»(Citation: 96).
  en: |-
    The Regular Army of the Russian Empire moved troops onto the Nokhchi lands between the Terek and the Sunzha in order to forcibly shift the forward fortified line deep into Chechen territory and place the region under military control.
    Historian D. A. Khozhaev defines the meaning of moving the line as squeezing Chechnya that had not submitted «with new fortresses and fortifications»(Citation: 95).
    The imperial general Yermolov, in his «Notes», attests to the deployment of troops: «on May 24 the entire detachment crossed over… in a single march it moved from the Terek to the Sunzha River»(Citation: 96).
  uk: |-
    Регулярна армія Російської імперії вводила війська на землі Нохчі між Тереком і Сунжею, щоб силою перенести передову укріплену лінію вглиб чеченської території й поставити край під військовий контроль.
    Історик Д. А. Хожаєв визначає сенс перенесення лінії як стискання Чечні, що не підкорилася, «новими фортецями та укріпленнями»(Citation: 95).
    Імперський генерал Єрмолов у «Записках» свідчить про введення військ: «24-го травня переправився весь загін… одним маршем перейшов від Терека на річку Сунжу»(Citation: 96).
