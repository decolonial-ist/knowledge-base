description:
  ru: |-
    Регулярная армия Российской империи возводила на занятой территории крепость как опорный пункт, чтобы держать под огнем подступы к чеченским землям и отрезать жителей от их земель.
    Историк Д. А. Хожаев фиксирует, что крепость строилась «на чеченской земле»(Citation: 95).
    Имперский генерал Ермолов в своих «Записках» свидетельствует, что крепость, «стесняя жителей во владении лучшими землями… недалеко от входа чрез урочище Хан-Кале, названа Грозною», а земляные работы были окончены к половине октября 1818 года(Citation: 96).
    Имперский историк Потто подтверждает закладку 10 июня 1818 года: «при громе пушек, заложена была сильная крепость о шести бастионах, которую Ермолов назвал Грозной»(Citation: 75).
    Ещё в всеподданнейшем рапорте ноября 1817 года Ермолов прямо называл цель сунженских крепостей: «Надобно занять р. Сунжу и по течению ея устроить крепости: тогда Чеченцы стеснены будут в своих горах, лишатся земли удобной для возделывания и пастбищных мест, на которых во все зимнее время они укрывают стада свои от жестокого в горах климата»(Citation: 103).
  en: |-
    The Regular Army of the Russian Empire built a fortress on the occupied territory as a stronghold, in order to keep the approaches to the Chechen lands under fire and cut the inhabitants off from their lands.
    Historian D. A. Khozhaev records that the fortress was built «on Chechen land»(Citation: 95).
    The imperial general Yermolov attests in his «Notes» that the fortress, «constraining the inhabitants in their possession of the best lands… not far from the entrance through the Khan-Kale gorge, was named Groznaya», and that the earthworks were completed by mid-October 1818(Citation: 96).
    The imperial historian Potto confirms the founding on June 10, 1818: «to the thunder of cannon, a strong fortress of six bastions was laid, which Yermolov named Groznaya»(Citation: 75).
    As early as his most humble report of November 1817, Yermolov directly named the purpose of the Sunzha fortresses: «We must occupy the Sunzha River and build fortresses along its course: then the Chechens will be confined in their mountains, deprived of land suitable for cultivation and of the pasture grounds where throughout the winter they shelter their herds from the harsh mountain climate»(Citation: 103).
  uk: |-
    Регулярна армія Російської імперії зводила на зайнятій території фортецю як опорний пункт, щоб тримати під вогнем підступи до чеченських земель і відрізати жителів від їхніх земель.
    Історик Д. А. Хожаєв фіксує, що фортеця будувалася «на чеченській землі»(Citation: 95).
    Імперський генерал Єрмолов у своїх «Записках» свідчить, що фортеця, «утискаючи жителів у володінні найкращими землями… недалеко від входу через урочище Хан-Кале, названа Грозною», а земляні роботи були закінчені до половини жовтня 1818 року(Citation: 96).
    Імперський історик Потто підтверджує закладення 10 червня 1818 року: «під грім гармат було закладено сильну фортецю на шість бастіонів, яку Єрмолов назвав Грозною»(Citation: 75).
    Ще у всепідданішому рапорті листопада 1817 року Єрмолов прямо називав мету сунженських фортець: «Треба зайняти р. Сунжу і по її течії влаштувати фортеці: тоді Чеченці будуть стиснуті у своїх горах, позбудуться землі, придатної для обробітку, і пасовищних місць, на яких увесь зимовий час вони ховають свої стада від жорстокого в горах клімату»(Citation: 103).
