description:
  en: 'The legal codification of the country''s split into two parts, with the Right Bank turned into a buffer zone: "Under the terms of the Eternal Peace, the Right Bank remained with Poland... it was agreed and resolved that those places are to remain deserted, as they now are"(Citation: 4)(Citation: 3).'
  uk: 'Юридична фіксація розколу країни на дві частини з перетворенням Правобережжя на буферну зону: «За умовами Вічного миру Правобережжя залишилося за Польщею... домовилися й постановили, що ті місця мають залишатися пустими, як нині є»(Citation: 4)(Citation: 3).'
  ru: 'Юридическая фиксация раскола страны на две части с превращением Правобережья в буферную зону: «По условиям Вечного мира Правобережье осталось за Польшей... договорили и постановили, что те места оставатись имеют пусты, так как ныне суть»(Citation: 4)(Citation: 3).'
