description:
  en: |-
    The diplomatic entrenchment of spiritual expansion: Moscow secured the inclusion in the treaty of an article on the position of the Orthodox in the Commonwealth – the 1686 treaty ordered the Polish side "to inflict no oppression and no coercion toward the Roman faith or the Union"(Citation: 162) – and arrogated to itself the role of protector of Orthodoxy on Polish lands, relying on the Kyiv metropolitanate already subordinated to Moscow.
    The treaty also secured an ecclesiastical lever: the Orthodox eparchies in the Commonwealth "according to their spiritual rank and custom, are to receive blessing and ordination from the Metropolitan of Kyiv; and this shall harm none of them in the favor of His Royal Majesty"(Citation: 333) - while the Kyiv metropolitanate was already subordinated to Moscow.
  uk: |-
    Дипломатичне закріплення духовної експансії: Москва домоглася включення до договору статті про становище православних у Речі Посполитій – договір 1686 року приписував польській стороні «ніякого утиску і до віри Римської та до Унії примусу чинити не велить»(Citation: 162) – і привласнила собі роль покровителя православ'я на польських землях, спираючись на вже підпорядковану Москві київську митрополію.
    Договір закріплював і церковний важіль: православні єпархії в Речі Посполитій «за духовним їхнім чином і звичаєм, мали приймати благословення і рукоположення від Київського Митрополита; і то нікому з них у милості Його Королівської Величності шкодити не має»(Citation: 333) - а київська митрополія була вже підпорядкована Москві.
  ru: |-
    Дипломатическое закрепление духовной экспансии: Москва добилась включения в договор статьи о положении православных в Речи Посполитой – договор 1686 года предписывал польской стороне «никакого утеснения и к вере Римской и к Унии принуждения чинить не велить»(Citation: 162) – и присвоила себе роль покровителя православия на польских землях, опираясь на уже подчиненную Москве киевскую митрополию.
    Договор закреплял и церковный рычаг: православным епархиям в Речи Посполитой «по духовному ихъ чину и обыкновенію, довелось пріимати благословеніе и рукоположеніе отъ Кіевскаго Митрополита; и то никому изъ нихъ въ милости Его Королевскаго Величества вредити не имеетъ»(Citation: 333) - а киевская митрополия была уже подчинена Москве.
