description:
  ru: |-
    Российская империя совершала карательные рейды за Терек, чтобы силой принудить нохчи к подчинению.
    Имперский историк Потто пишет, что полковник Эристов «вторично перешел за Терек и, после упорного боя, истребил несколько селений по Сунже»(Citation: 74).
    Карательный, а не оборонительный характер этих рейдов признавала и сама имперская верхушка.
    Главнокомандующий генерал Ртищев осуждал «подобные экспедиции» и требовал располагать горцев «не оружием, а ласковым обхождением»(Citation: 74).
    Император Александр I, узнав «об очередном набеге на мирную Чечню полковника Эристова», особым рескриптом велел «водворить спокойствие на Кавказской линии дружелюбием и ласковым снисхождением»(Citation: 95).
  en: |-
    The Russian Empire carried out punitive raids beyond the Terek in order to force the Nokhchi into submission.
    The imperial historian Potto writes that Colonel Eristov «crossed the Terek a second time and, after a stubborn battle, destroyed several villages along the Sunzha»(Citation: 74).
    The punitive, rather than defensive, character of these raids was acknowledged by the imperial leadership itself.
    Commander-in-chief General Rtishchev condemned «such expeditions» and demanded that the mountaineers be won over «not by arms, but by kind treatment»(Citation: 74).
    Emperor Alexander I, upon learning «of yet another raid on peaceful Chechnya by Colonel Eristov», ordered by a special rescript «to establish tranquility on the Caucasian Line through friendliness and gentle indulgence»(Citation: 95).
  uk: |-
    Російська імперія здійснювала каральні рейди за Терек, щоб силою примусити Нохчі до підпорядкування.
    Імперський історик Потто пише, що полковник Ерістов «вдруге перейшов за Терек і, після впертого бою, винищив кілька селищ по Сунжі»(Citation: 74).
    Каральний, а не оборонний характер цих рейдів визнавала й сама імперська верхівка.
    Головнокомандувач генерал Ртищев засуджував «подібні експедиції» і вимагав прихиляти горців «не зброєю, а ласкавим поводженням»(Citation: 74).
    Імператор Олександр I, дізнавшись «про черговий набіг на мирну Чечню полковника Ерістова», особливим рескриптом наказав «запровадити спокій на Кавказькій лінії дружелюбністю та ласкавою поблажливістю»(Citation: 95).
