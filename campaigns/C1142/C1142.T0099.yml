description:
  ru: |-
    Российская империя разорением селений силой принуждала нохчи к выдаче заложников.
    Имперский историк Потто пишет, что после того как полковник Эристов разорил присунженские селения, нохчи «дали аманатов, обещая больше не тревожить русских границ»(Citation: 74).
  en: |-
    The Russian Empire used the devastation of villages to force the Nokhchi to hand over hostages.
    The imperial historian Potto writes that after Colonel Eristov had laid waste to the villages along the Sunzha, the Nokhchi «gave amanats (hostages), promising to trouble the Russian borders no more»(Citation: 74).
  uk: |-
    Російська імперія розоренням селищ силою примушувала Нохчі до видачі заручників.
    Імперський історик Потто пише, що після того, як полковник Ерістов розорив присунженські селища, Нохчі «дали аманатів, обіцяючи більше не турбувати російських кордонів»(Citation: 74).
