description:
  en: |-
    The Russian Empire razed and burned Nokhchi villages.
    The imperial historian Potto writes that Colonel Eristov, having crossed the Terek, after a stubborn battle burned and razed «several villages along the Sunzha»(Citation: 74).
  uk: |-
    Російська імперія зносила й палила селища Нохчі.
    Імперський історик Потто пише, що полковник Ерістов, перейшовши за Терек, після впертого бою спалив і зніс «кілька селищ по Сунжі»(Citation: 74).
  ru: |-
    Российская империя сносила и жгла селения нохчи.
    Имперский историк Потто пишет, что полковник Эристов, перейдя за Терек, после упорного боя сжёг и снёс «несколько селений по Сунже»(Citation: 74).
