name:
  ru: Карательное разорение присунженских селений нохчи и стравливание против них соседних народов при Ртищеве (1813-1816)
  en: Punitive devastation of the Nokhchi villages along the Sunzha and pitting neighboring peoples against them under Rtishchev (1813-1816)
  uk: Каральне розорення присунженських селищ Нохчі та нацьковування проти них сусідніх народів за Ртіщева (1813-1816)
description:
  ru: |-
    В 1812-1814 годах Россия воевала с Наполеоном и больших походов вглубь Чечни не вела.
    Войсками на Тереке командовал генерал Ртищев, который крупных походов избегал, но рейды за Терек при нём продолжались.
    Полковник Эристов дважды переходил Терек и разорял чеченские сёла; во второй раз он «истребил несколько селений по Сунже» и силой вынудил нохчи отдать аманатов(Citation: 74).
    Эти набеги осуждала даже сама имперская верхушка.
    Генерал Ртищев требовал располагать горцев «не оружием, а ласковым обхождением»(Citation: 74), а император Александр I, узнав «об очередном набеге на мирную Чечню полковника Эристова», особым рескриптом велел «водворить спокойствие на Кавказской линии дружелюбием и ласковым снисхождением», то есть счёл рейд неоправданным(Citation: 95).
    Набеги от этого не прекратились.
    Помимо рейдов, империя натравливала на чеченцев соседние народы.
    В 1816 году нохчи во главе с Бейбулатом Таймиевым взяли в плен майора Швецова(Citation: 95), и в ответ командующий на Тереке генерал Дельпоццо письмом понудил кумыкских владельцев Эндирея, Аксая и Костека пойти войной на чеченцев, требуя «положить предел разбойничьему народу»(Citation: 101).
    Кумыкские владельцы подписали «Обязательства», в которых обязались воевать с чеченцами, убивать их или выдавать русским и не пропускать к ним никаких товаров(Citation: 101).
    Своих войск Дельпоццо при этом не снимал и в том же рапорте предлагал держать их на Сунже, «пока не истреблю зверской их свободы и независимости»(Citation: 101).
  en: |-
    In 1812-1814 Russia was at war with Napoleon and conducted no major campaigns deep into Chechnya.
    The troops on the Terek were commanded by General Rtishchev, who avoided large campaigns, but raids across the Terek continued under him.
    Colonel Eristov twice crossed the Terek and devastated Chechen villages; the second time he "exterminated several villages along the Sunzha" and forced the Nokhchi to give up amanats (hostages)(Citation: 74).
    Even the imperial leadership itself condemned these raids.
    General Rtishchev demanded that the highlanders be won over "not by arms, but by kind treatment"(Citation: 74), and Emperor Alexander I, upon learning "of yet another raid on peaceful Chechnya by Colonel Eristov," ordered by special rescript "to establish tranquility on the Caucasus Line through friendliness and kind indulgence," that is, he deemed the raid unjustified(Citation: 95).
    The raids did not stop because of this.
    Beyond the raids, the empire incited neighboring peoples against the Chechens.
    In 1816 the Nokhchi, led by Beibulat Taimiev, took Major Shvetsov prisoner(Citation: 95), and in response the commander on the Terek, General Delpozzo, by letter compelled the Kumyk lords of Endirey, Aksai, and Kostek to go to war against the Chechens, demanding that they "put an end to the brigand people"(Citation: 101).
    The Kumyk lords signed "Obligations" in which they undertook to make war on the Chechens, to kill them or hand them over to the Russians, and to let no goods through to them(Citation: 101).
    At the same time Delpozzo did not withdraw his own troops, and in the same report proposed keeping them on the Sunzha "until I exterminate their beastly freedom and independence"(Citation: 101).
  uk: |-
    У 1812-1814 роках Росія воювала з Наполеоном і великих походів углиб Чечні не вела.
    Військами на Тереку командував генерал Ртіщев, який великих походів уникав, але рейди за Терек за нього тривали.
    Полковник Ерістов двічі переходив Терек і розоряв чеченські села; вдруге він «винищив кілька селищ по Сунжі» та силою змусив Нохчі віддати аманатів(Citation: 74).
    Ці набіги засуджувала навіть сама імперська верхівка.
    Генерал Ртіщев вимагав прихиляти горців «не зброєю, а ласкавим поводженням»(Citation: 74), а імператор Олександр I, дізнавшись «про черговий набіг на мирну Чечню полковника Ерістова», особливим рескриптом наказав «запровадити спокій на Кавказькій лінії дружелюбністю та ласкавою поблажливістю», тобто визнав рейд невиправданим(Citation: 95).
    Набіги від цього не припинилися.
    Крім рейдів, імперія нацьковувала на Чеченців сусідні народи.
    У 1816 році Нохчі на чолі з Бейбулатом Таймієвим узяли в полон майора Швецова(Citation: 95), і у відповідь командувач на Тереку генерал Дельпоццо листом спонукав кумицьких володарів Ендірея, Аксая і Костека піти війною на Чеченців, вимагаючи «покласти край розбійницькому народові»(Citation: 101).
    Кумицькі володарі підписали «Зобов'язання», в яких зобов'язалися воювати з Чеченцями, вбивати їх або видавати Росіянам і не пропускати до них жодних товарів(Citation: 101).
    Своїх військ Дельпоццо при цьому не знімав і в тому ж рапорті пропонував тримати їх на Сунжі, «доки не винищу звірячої їхньої свободи та незалежності»(Citation: 101).
