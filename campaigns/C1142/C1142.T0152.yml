description:
  ru: |-
    Российская империя натравливала на нохчи соседние народы, чтобы их враждой ослаблять чеченцев.
    В 1816 году нохчи во главе с Бейбулатом Таймиевым взяли в плен майора Швецова(Citation: 95).
    В ответ командующий на Тереке генерал Дельпоццо письмом к кумыкским владельцам Эндирея, Аксая и Костека понуждал их пойти войной на чеченцев: «прошу вас, советую, приказываю вам составить из себя одну думу, одну волю, возвратить немедленно силою оружия пленного майора Швецова, положить предел разбойничьему народу… сделать такое постановление, которое бы довело Чеченцев до слабости, повиновения нам, совершенного рабства пред вами»(Citation: 101).
    Кумыкские владельцы подписали «Обязательства», в которых обязались «прекратить все взаимные вражды… и составить братство», «никого из Чеченцев… не принимать… но везде, где ни с оной встретится, убить или представить живого ближайшему Российскому начальству», и не пропускать к ним никаких товаров(Citation: 101).
  en: |-
    The Russian Empire set neighboring peoples against the Nokhchi in order to weaken the Chechens through their enmity.
    In 1816, the Nokhchi led by Beibulat Taimiev took Major Shvetsov prisoner(Citation: 95).
    In response, the commander on the Terek, General Delpozzo, in a letter to the Kumyk lords of Endirey, Aksai, and Kostek, pressed them to go to war against the Chechens: «I ask you, I advise you, I order you to form among yourselves one council, one will, to return immediately by force of arms the captive Major Shvetsov, to put an end to the brigand people… to adopt such a resolution as would reduce the Chechens to weakness, to obedience to us, to complete slavery before you»(Citation: 101).
    The Kumyk lords signed «Obligations» in which they pledged «to cease all mutual enmities… and to form a brotherhood», «to receive none of the Chechens… but wherever any of them is encountered, to kill him or deliver him alive to the nearest Russian authorities», and to let no goods pass through to them(Citation: 101).
  uk: |-
    Російська імперія нацьковувала на Нохчі сусідні народи, щоб їхньою ворожнечею послаблювати Чеченців. 1816 року Нохчі на чолі з Бейбулатом Таймієвим узяли в полон майора Швецова(Citation: 95).
    У відповідь командувач на Тереку генерал Дельпоццо листом до кумицьких володарів Ендірея, Аксая та Костека спонукав їх піти війною на Чеченців: «прошу вас, раджу, наказую вам скласти з себе одну думу, одну волю, негайно повернути силою зброї полоненого майора Швецова, покласти край розбійницькому народові… ухвалити таку постанову, яка довела б Чеченців до слабкості, покори нам, цілковитого рабства перед вами»(Citation: 101).
    Кумицькі володарі підписали «Зобов'язання», в яких зобов'язалися «припинити всі взаємні ворожнечі… і скласти братство», «нікого з Чеченців… не приймати… але скрізь, де хто з них трапиться, вбити або представити живим найближчому російському начальству», і не пропускати до них жодних товарів(Citation: 101).
