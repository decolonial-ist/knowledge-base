description:
  ru: 'Стирание исторических названий казацких южных территорий, использованных как плацдарм для аннексии Крыма: манифест Екатерины II от 3 августа 1775 года истребил «самого названия Запорожских казаков», а их земли влил в имперский конструкт – «причисляя их по способности к Новороссийской Губернии»(Citation: 147).'
  en: 'The erasure of the historical names of the Cossack southern territories used as a springboard for the annexation of Crimea: Catherine II''s manifesto of 3 August 1775 extirpated "the very name of the Zaporozhian Cossacks" and poured their lands into an imperial construct – "assigning them as convenient to the Novorossiysk Governorate"(Citation: 147).'
  uk: 'Стирання історичних назв козацьких південних територій, використаних як плацдарм для анексії Криму: маніфест Катерини II від 3 серпня 1775 року винищив «самої назви Запорозьких козаків», а їхні землі влив в імперський конструкт – «зараховуючи їх за придатністю до Новоросійської Губернії»(Citation: 147).'
