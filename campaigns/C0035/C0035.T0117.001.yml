description:
  en: 'The colonization of the steppes adjacent to Crimea with settlers to create a loyal rear: as early as 1752, New Serbia was formed from Serbs – "officially – to guard the southern frontiers from Tatar and Turkish raids, but in fact – to subdue the Zaporozhians"(Citation: 196), and in 1776 Potemkin directly ordered "not to return fugitives"(Citation: 195), accelerating the settlement of the south.'
  uk: 'Колонізація прилеглих до Криму степів переселенцями для створення лояльного тилу: ще 1752 року із сербів було утворено Нову Сербію – «офіційно — для охорони пд. рубежів від татар. і турец. нападів, а фактично — для приборкання запорожців»(Citation: 196), а Потьомкін 1776 року прямо наказав «втікачів не повертати»(Citation: 195), прискорюючи заселення півдня.'
  ru: 'Колонизация прилегающих к Крыму степей переселенцами для создания лояльного тыла: еще в 1752 году из сербов была образована Новая Сербия – «официально — для охраны южных рубежей от татарских и турецких нападений, а фактически — для обуздания запорожцев»(Citation: 196), а Потемкин в 1776 году прямо приказал «беглецов не возвращать»(Citation: 195), ускоряя заселение юга.'
