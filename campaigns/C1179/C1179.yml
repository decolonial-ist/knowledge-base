name:
  ru: Большой террор в Чечено-Ингушетии (1937-1940)
  en: The Great Terror in Chechen-Ingushetia (1937-1940)
  uk: Великий терор у Чечено-Інгушетії (1937-1940)
description:
  ru: |-
    К 1937 году Чечня прошла разоружение (кампания C1177) и принудительное сведение крестьянских хозяйств в колхозы («коллективизацию») с карательными экспедициями против восставших аулов (кампания C1178).
    В 1934 году колонизатор слил область с Ингушетией в объединённую Чечено-Ингушскую автономную область, а в 1936-м переименовал её в Чечено-Ингушскую Автономную Советскую Социалистическую Республику (ЧИАССР); сегодня оккупант называет эти земли Чеченской Республикой и Республикой Ингушетия в составе России.
    По этой республике, как и по другим частям СССР, прошёл Большой террор: так историки называют массовые аресты и расстрелы 1937-1938 годов, для которых Москва назначила каждой республике и области своё число.
    Репрессии начались с постановления высшего органа оккупационной власти («Политбюро ЦК ВКП(б)») «Об антисоветских элементах» от 2 июля 1937 года за подписью Сталина(Citation: 258). 11 июля 1937 года Политбюро отдельным решением утвердило количество людей, которых по республике необходимо расстрелять, - отдельно по крестьянам, которых колонизатор посчитал «зажиточными» («кулаки»), отдельно по «уголовникам»; историк Г. И. Какагасанов приводит это так: «кулаков - 862 чел., уголовников - 555 чел.»(Citation: 258). 30 июля народный комиссар (министр) внутренних дел СССР Ежов издал оперативный приказ № 00447 «Об операции по репрессированию бывших кулаков, уголовников и других антисоветских элементов»; в нём по ЧИАССР записано: 500 человек - расстрелять («первая категория» приказа), 1500 - заключить в лагеря («вторая категория»)(Citation: 545).
    Уже к середине августа 1937 года арестованных было больше, чем записано в приказе, а 1 марта 1938 года Москва назначила республике новое число - 10 108 человек, которых предписано было арестовать и осудить(Citation: 544).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «по разным оценкам в 30-х - начале 40-х гг. жертвами сталинского террора стали не менее 30-40 тысяч чеченцев и ингушей»(Citation: 125).
    Дело «буржуазно-националистического центра» - 137 бывших ответственных работников республики - чекистские следователи, как пишет чеченский историк А. Г. Авторханов, создавали три года; военный трибунал судил арестованных в 1940 году(Citation: 369).
  en: |-
    By 1937 Chechnya had been through disarmament (campaign C1177) and the forced merging of peasant households into kolkhozes ("collectivization") with punitive expeditions against insurgent auls (campaign C1178).
    In 1934 the colonizer merged the oblast with Ingushetia into the united Chechen-Ingush Autonomous Oblast, and in 1936 renamed it the Chechen-Ingush Autonomous Soviet Socialist Republic (ChIASSR); today the occupier calls these lands the Chechen Republic and the Republic of Ingushetia within Russia.
    Through this republic, as through other parts of the USSR, passed the Great Terror: that is what historians call the mass arrests and executions of 1937-1938, for which Moscow assigned each republic and oblast its own number.
    The repressions began with the resolution of the supreme organ of the occupation power (the "Politburo of the TsK VKP(b)") "On anti-Soviet elements" of 2 July 1937, signed by Stalin(Citation: 258).
    On 11 July 1937 the Politburo, by a separate decision, approved the number of people to be shot in the republic - separately for peasants whom the colonizer deemed "well-off" ("kulaks") and for "criminals"; the historian G. I. Kakagasanov cites it thus: "kulaks - 862 pers., criminals - 555 pers."(Citation: 258).
    On 30 July Yezhov, the People's Commissar (minister) of Internal Affairs of the USSR, issued operational order No. 00447 "On the operation to repress former kulaks, criminals and other anti-Soviet elements"; for the ChIASSR it records: 500 people - to be shot (the order's "first category"), 1,500 - to be confined in camps (the "second category")(Citation: 545).
    Already by mid-August 1937 the arrested were more numerous than recorded in the order, and on 1 March 1938 Moscow assigned the republic a new number - 10,108 people ordered arrested and convicted(Citation: 544).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "by various estimates, in the '30s - early '40s no fewer than 30-40 thousand Chechens and Ingush became victims of the Stalinist terror"(Citation: 125).
    The case of the "bourgeois-nationalist center" - 137 former senior officials of the republic - the Chekist investigators, as the Chechen historian A. G. Avtorkhanov writes, spent three years fabricating; the military tribunal tried the arrested in 1940(Citation: 369).
  uk: |-
    До 1937 року Чечня пройшла роззброєння (кампанія C1177) і примусове зведення селянських господарств у колгоспи («колективізацію») з каральними експедиціями проти повсталих аулів (кампанія C1178).
    У 1934 році колонізатор злив область з Інгушетією в об'єднану Чечено-Інгуську автономну область, а в 1936-му перейменував її на Чечено-Інгуську Автономну Радянську Соціалістичну Республіку (ЧІАСРР); сьогодні окупант називає ці землі Чеченською Республікою та Республікою Інгушетія у складі Росії.
    Цією республікою, як і іншими частинами СРСР, пройшов Великий терор: так історики називають масові арешти й розстріли 1937-1938 років, для яких Москва призначила кожній республіці й області своє число.
    Репресії почалися з постанови найвищого органу окупаційної влади («Політбюро ЦК ВКП(б)») «Про антирадянські елементи» від 2 липня 1937 року за підписом Сталіна(Citation: 258). 11 липня 1937 року Політбюро окремим рішенням затвердило кількість людей, яких по республіці необхідно розстріляти, - окремо по селянах, яких колонізатор вважав «заможними» («куркулі»), окремо по «кримінальниках»; історик Г. І. Какагасанов наводить це так: «куркулів - 862 чол., кримінальників - 555 чол.»(Citation: 258). 30 липня народний комісар (міністр) внутрішніх справ СРСР Єжов видав оперативний наказ № 00447 «Про операцію з репресування колишніх куркулів, кримінальників та інших антирадянських елементів»; у ньому по ЧІАСРР записано: 500 людей - розстріляти («перша категорія» наказу), 1500 - ув'язнити в таборах («друга категорія»)(Citation: 545).
    Уже до середини серпня 1937 року заарештованих було більше, ніж записано в наказі, а 1 березня 1938 року Москва призначила республіці нове число - 10 108 людей, яких приписано було заарештувати й засудити(Citation: 544).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «за різними оцінками у 30-х - на початку 40-х рр. жертвами сталінського терору стали не менше 30-40 тисяч чеченців та інгушів»(Citation: 125).
    Справу «буржуазно-націоналістичного центру» - 137 колишніх відповідальних працівників республіки - чекістські слідчі, як пише чеченський історик А. Г. Авторханов, створювали три роки; військовий трибунал судив заарештованих у 1940 році(Citation: 369).
