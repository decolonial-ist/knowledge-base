description:
  en: |-
    An extrajudicial organ - the "troika" - passed sentences in Chechen-Ingushetia under operational order No. 00447 of Yezhov, the People's Commissar (minister) of Internal Affairs of the USSR, of 30 July 1937, and Yezhov confirmed the troika's composition in the text of the order: "I confirm the following personal composition of the republican, krai and oblast troikas: ...
    Chechen-Ingush ASSR: chairman - Dementyev; members Yegorov, Vakhayev"(Citation: 545) - Dementyev, People's Commissar (minister) of Internal Affairs of the republic; Yegorov, first secretary of the oblast committee of the party; and Vakhayev, second secretary.
    The historian G. I. Kakagasanov describes the institution: "An extrajudicial organ created for carrying out punitive policy...
    Its composition included: the head of the OGPU, the secretary of the party organization, the prosecutor of the republic, krai or oblast"(Citation: 258).
    The troika's procedure and its regime of secrecy are prescribed in the text of the order: the troikas examine "the materials on each arrested person or group of arrested persons", and first-category sentences are carried out "with the obligatory full preservation in secrecy of the time and place of the carrying out of the sentence"(Citation: 545).
    The NKVD (the People's Commissariat (ministry) of Internal Affairs - successor of the OGPU and a predecessor of today's FSB) did not inform the families of the condemned of the execution; Kakagasanov writes: "More often this took place under the formula 'convicted without the right of correspondence', which meant 'execution by shooting'"(Citation: 258).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov describe also "conviction by albums" - sentencing in absentia on a brief docket, "without acquaintance with the criminal case itself"(Citation: 125): that procedure was set by the orders of the "national lines" of the terror, beginning with NKVD order No. 00485.
    The investigation of the case of the "bourgeois-nationalist center" lasted, by the count of the Chechen historian A. G. Avtorkhanov - a contemporary of the events who wrote in emigration - exactly three years(Citation: 369).
    The Chekists chose not to try 137 people in a single trial and split the "center" into three groups: into the first they gathered the Soviet-party leadership of the republic - Ali Gorchkhanov, Abdul-Khalim Salamov, Khasi Vakhayev, Khamid Okuyev and Tuchaev; into the second - non-party men whom the investigation called the cultural-ideological leadership - Khalid Yandarov, Akhmat Matsiev, Abdurakhman Avtorkhanov, D. Malsagov, Magomed Mamakayev; into the third - a "terrorist group", into which "the Chekists gathered, by the logic of things, young people alone"(Citation: 369).
    The groups came before the military tribunal of the North Caucasus Military District; Avtorkhanov writes: "of the roughly 120 people who reached the trial alive, only one - the former mullah Akhmat Tuchaev - admitted his guilt.
    All the rest declared with one voice that all the crimes imputed to them were an invention, and their 'sincere confessions' false and fabricated from beginning to end", "The entire charge and the evidence in the case were built exclusively on this personal testimony extracted by torture", "There was no other material evidence or witness testimony to substantiate the charge" - and the tribunal passed its guilty verdict on the first group "solely on the basis of the testimony of one defendant – A. Tuchaev"(Citation: 369).
    The tribunal sentenced Abdul-Khalim Salamov, Ali Gorchkhanov and Tuchaev to be shot, the rest - to prison terms of 7 to 25 years(Citation: 369).
    From the death cell Tuchaev submitted a petition for clemency addressed to Kalinin, chairman of the Presidium of the Supreme Soviet of the USSR, and wrote in it: he had confessed to crimes he had not committed because only so had the NKVD promised to free his family and spare his life(Citation: 369).
    Moscow commuted the death sentences of all three and reduced the terms of the others; the "terrorist group" the same tribunal released in its entirety, the case of the "culture-ideologists" it "did not accept for proceedings at all", and those who sat without "cases" the Chekists put through the Special Board - the NKVD's own departmental "court", which passed sentences with no trial and no defendant present(Citation: 369).
  uk: |-
    Позасудовий орган - «трійка» - виносив у Чечено-Інгушетії вироки за оперативним наказом народного комісара (міністра) внутрішніх справ СРСР Єжова № 00447 від 30 липня 1937 року, і склад трійки Єжов затвердив текстом наказу: «Затверджую такий персональний склад республіканських, крайових і обласних трійок: ...
    Чечено-Інгуська АРСР: голова - Дементьєв; члени Єгоров, Вахаєв»(Citation: 545) - народний комісар (міністр) внутрішніх справ республіки Дементьєв, перший секретар обласного комітету партії Єгоров і другий секретар Вахаєв.
    Історик Г. І. Какагасанов описує інститут: «Позасудовий орган, створений для проведення каральної політики...
    До її складу входили: начальник ОГПУ, секретар парторганізації, прокурор республіки, краю, області»(Citation: 258).
    Порядок роботи трійки і режим таємниці прописані в тексті наказу: трійки розглядають «матеріали на кожного заарештованого або групу заарештованих», а вироки першої категорії виконуються, як приписує наказ, «з обов'язковим повним збереженням у таємниці часу і місця приведення вироку у виконання»(Citation: 545).
    Про розстріл рідним засуджених НКВД (Народний комісаріат (міністерство) внутрішніх справ - наступник ОГПУ і попередник сучасної ФСБ) не повідомляв; Какагасанов пише: «Частіше це відбувалося під формулюванням «засуджений без права листування», що означало «розстріл»»(Citation: 258).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов описують і «засудження за альбомами» - вироки заочно, за короткою довідкою, «без ознайомлення із самою кримінальною справою»(Citation: 125): такий порядок заданий наказами за «національними лініями» терору, починаючи з наказу НКВД № 00485.
    Слідство у справі «буржуазно-націоналістичного центру» йшло, за рахунком чеченського історика А. Г. Авторханова - сучасника подій, який писав в еміграції, - рівно три роки(Citation: 369).
    Судити 137 людей одним процесом чекісти не стали і розбили «центр» на три групи: у першу зібрали радянсько-партійне керівництво республіки - Алі Горчханова, Абдул-Халіма Саламова, Хасі Вахаєва, Хаміда Окуєва і Тучаєва; у другу - безпартійних, яких слідство називало культурно-ідеологічним керівництвом, - Халіда Яндарова, Ахмата Мацієва, Абдурахмана Авторханова, Д. Мальсагова, Магомеда Мамакаєва; у третю - «терористичну групу», куди «чекісти набрали за логікою речей саму молодь»(Citation: 369).
    Групи постали перед військовим трибуналом Північнокавказького військового округу; Авторханов пише: «з тих, хто дійшов живими до суду, близько 120 людей, винним себе визнав лише один колишній мулла Ахмат Тучаєв.
    Усі решта в один голос заявили, що всі інкриміновані їм злочини – вигадка, а їхні «щирі зізнання» є неправдивими й вигаданими від початку до кінця», «Усе звинувачення і докази у справі будувалися виключно на цих вимушених тортурами особистих показаннях», «Інших речових доказів або показань свідків для обґрунтування звинувачення не було» - і обвинувальний вирок першій групі трибунал виніс «єдино на підставі показань одного підсудного – А.Тучаєва»(Citation: 369).
    Трибунал засудив Абдул-Халіма Саламова, Алі Горчханова і Тучаєва до розстрілу, решту - до тюремного ув'язнення від 7 до 25 років(Citation: 369).
    Зі смертної камери Тучаєв подав клопотання про помилування на ім'я голови Президії Верховної Ради СРСР Калініна і написав у ньому: він зізнавався у нескоєних злочинах, бо лише так НКВД обіцяв звільнити його сім'ю і зберегти йому життя(Citation: 369).
    Москва замінила розстріл усім трьом і знизила строки решті; «терористичну групу» той самий трибунал звільнив цілком, справу «культурників-ідеологів» «взагалі не прийняв до провадження», а тих, хто сидів без «справ», чекісти пропустили через Особливу нараду - відомчий «суд» самого НКВД, який виносив вироки без процесу і без підсудного(Citation: 369).
  ru: |-
    Внесудебный орган - «тройка» - выносил в Чечено-Ингушетии приговоры по оперативному приказу народного комиссара (министра) внутренних дел СССР Ежова № 00447 от 30 июля 1937 года, и состав тройки Ежов утвердил текстом приказа: «Утверждаю следующий персональный состав республиканских, краевых и областных троек: ...
    Чечено-Ингушская АССР: председатель - Дементьев; члены Егоров, Вахаев»(Citation: 545) - народный комиссар (министр) внутренних дел республики Дементьев, первый секретарь областного комитета партии Егоров и второй секретарь Вахаев.
    Историк Г. И. Какагасанов описывает институт: «Внесудебный орган, созданный для проведения карательной политики...
    В её состав входили: начальник ОГПУ, секретарь парторганизации, прокурор республики, края, области»(Citation: 258).
    Порядок работы тройки и режим тайны прописаны в тексте приказа: тройки рассматривают «материалы на каждого арестованного или группу арестованных», а приговоры первой категории приводятся в исполнение «с обязательным полным сохранением в тайне времени и места приведения приговора в исполнение»(Citation: 545).
    О расстреле родным осуждённых НКВД (Народный комиссариат (министерство) внутренних дел - преемник ОГПУ и предшественник современной ФСБ) не сообщал; Какагасанов пишет: «Чаще это происходило под формулировкой «осужден без права переписки», что означало «расстрел»»(Citation: 258).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов описывают и «осуждение по альбомам» - заочное вынесение приговоров по краткой справке, «без ознакомления с самим уголовным делом»(Citation: 125): такой порядок задан приказами по «национальным линиям» террора, начиная с приказа НКВД № 00485.
    Следствие по делу «буржуазно-националистического центра» шло, по счёту чеченского историка А. Г. Авторханова - современника событий, писавшего в эмиграции, - ровно три года(Citation: 369).
    Судить 137 человек одним процессом чекисты не стали и разбили «центр» на три группы: в первую собрали советско-партийное руководство республики - Али Горчханова, Абдул-Халима Саламова, Хаси Вахаева, Хамида Окуева и Тучаева; во вторую - беспартийных, которых следствие называло культурно-идеологическим руководством, - Халида Яндарова, Ахмата Мациева, Абдурахмана Авторханова, Д. Мальсагова, Магомеда Мамакаева; в третью - «террористическую группу», куда «чекисты набрали по логике вещей одну молодежь»(Citation: 369).
    Группы предстали перед военным трибуналом Северокавказского военного округа; Авторханов пишет: «из дошедших живыми до суда около 120 человек виновным себя признал только один бывший мулла Ахмат Тучаев.
    Все остальные в один голос заявили, что все инкриминируемые им преступления – выдумка и их «искренние признания» являются ложными и вымышленными от начала до конца», «Все обвинение и доказательства по делу строились исключительно на этих вынужденных пытками личных показаниях», «Других вещественных доказательств или свидетельских показаний для обоснования обвинения не было» - и приговор первой группе трибунал вынес «единственно на основании показаний одного подсудимого – А.Тучаева»(Citation: 369).
    Трибунал приговорил Абдул-Халима Саламова, Али Горчханова и Тучаева к расстрелу, остальных - к тюремному заключению от 7 до 25 лет(Citation: 369).
    Из смертной камеры Тучаев подал ходатайство о помиловании на имя председателя Президиума Верховного Совета СССР Калинина и написал в нём: он признавался в несовершённых преступлениях, потому что только так НКВД обещал освободить его семью и сохранить ему жизнь(Citation: 369).
    Москва заменила расстрел всем троим и снизила сроки остальным; «террористическую группу» тот же трибунал освободил целиком, дело «культурников-идеологов» «вообще не принял к производству», а тех, кто сидел без «дел», чекисты пропустили через Особое совещание - ведомственный «суд» самого НКВД, который выносил приговоры без процесса и без подсудимого(Citation: 369).
