description:
  ru: |-
    13 ноября 1937 года бюро областного комитета партии («обком ВКП(б)») утвердило два не подлежащих огласке списка: № 25/97 - об изъятии литературы, изданной в республике, - и № 31/107 - об изъятии книг в обязательном порядке из библиотек и книготорговой сети; под запрет попали произведения 29 авторов, среди которых историк К. Г. Дендиев называет Д. Мадаева, Х. Яндарова, Н. Музаева, Д. Мальсагова и Х. Ошаева(Citation: 544).
    Первые чеченские литературные произведения появились в начале 1920-х годов(Citation: 125) - колонизатор изымал и запрещал литературу, которой не было и двадцати лет.
  en: |-
    On 13 November 1937 the bureau of the oblast committee of the party (the "obkom VKP(b)") approved two lists not subject to disclosure: No. 25/97 - on the removal of literature published in the republic - and No. 31/107 - on the mandatory removal of books from libraries and the book trade; the ban covered the works of 29 authors, among whom the historian K. G. Dendiev names D. Madayev, Kh.
    Yandarov, N. Muzayev, D. Malsagov and Kh.
    Oshaev(Citation: 544).
    The first Chechen literary works had appeared in the early 1920s(Citation: 125) - the colonizer was removing and banning a literature not yet twenty years old.
  uk: |-
    13 листопада 1937 року бюро обласного комітету партії («обком ВКП(б)») затвердило два списки, що не підлягали розголошенню: № 25/97 - про вилучення літератури, виданої в республіці, - і № 31/107 - про вилучення книжок в обов'язковому порядку з бібліотек і книготорговельної мережі; під заборону потрапили твори 29 авторів, серед яких історик К. Г. Дендієв називає Д. Мадаєва, Х. Яндарова, Н. Музаєва, Д. Мальсагова і Х. Ошаєва(Citation: 544).
    Перші чеченські літературні твори з'явилися на початку 1920-х років(Citation: 125) - колонізатор вилучав і забороняв літературу, якій не було й двадцяти років.
