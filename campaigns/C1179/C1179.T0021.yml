description:
  en: |-
    The Chechen historian A. G. Avtorkhanov, who worked in Chechnya in those years and later wrote about it in emigration, writes: "At the beginning of October 1937, accompanied by a large Chekist staff, there arrived in Chechen-Ingushetia a candidate member of the Politburo, chairman of the Party Collegium of the KPK under the TsK and Yezhov's deputy – Shkiryatov"(Citation: 369).
    Shkiryatov convened an enlarged plenum of the oblast committee of the party in the Lenin House of Culture in Grozny - by the archival protocols the plenum ran on 8-10 October 1937, with 194 participants(Citation: 544) - and summoned there also the senior officials of the city and the districts.
    Avtorkhanov continues: "Shkiryatov gave the order to arrest all Chechens and Ingush who were members of the Chechen-Ingush oblast committee"(Citation: 369).
    The Chekists arrested them right there, in the hall of the plenum.
    Avtorkhanov writes of what followed: "Then Shkiryatov's order was extended to all Chechen-Ingush officials, from the chairman of the republic's government down to the chairman of a village soviet"(Citation: 369).
    In October and November 1937 the NKVD (a predecessor of today's FSB) arrested Ali Gorchkhanov, chairman of the government of the republic; Abdul-Khalim Salamov, his deputy; Khasi Vakhayev, second secretary of the oblast committee; Magomed Mamakayev, head of the culture and propaganda department of the oblast committee; Khamid Okuyev, People's Commissar (minister) of education; Musa Khaniev, chairman of the Supreme Court; Khasan Mekhtiev, prosecutor of the republic; and Said Baduev, chairman of the Union of Soviet Writers.
    Avtorkhanov writes also of the lower floors: "Arrested were also the chairmen of the district executive committees (in the Chechen-Ingush republic there were up to 28 districts), almost all chairmen of village Soviets, of kolkhozes, and their party organizers"(Citation: 369).
    Of the 23 heads of the district NKVD departments only Goytiev was a Chechen, and the NKVD arrested him too.
    The NKVD arrested, and the party organs removed from office - historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "In all, in October 1937, 30 of the 76 members and candidate members of the Chechen-Ingush obkom were repressed, including all the Chechens and Ingush; 20 of the 28 secretaries of district party committees; 77 members of district committees and 192 senior officials of the rural districts of the republic"(Citation: 125); in 1938 the colonizer removed almost all heads of the district land departments, 19 chairmen of district executive committees and 22 secretaries of district committees(Citation: 125).
  uk: |-
    Чеченський історик А. Г. Авторханов, який працював у ті роки в Чечні й писав про це в еміграції, пише: «На початку жовтня 1937 року в супроводі великого чекістського штабу в Чечено-Інгушетію прибув кандидат у члени Політбюро, голова партколегії при КПК при ЦК і заступник Єжова – Шкірятов»(Citation: 369).
    Шкірятов зібрав у грозненському Домі культури імені Леніна розширений пленум обласного комітету партії - за архівними протоколами пленум ішов 8-10 жовтня 1937 року, учасників було 194(Citation: 544) - і покликав туди ж відповідальних працівників міста й районів.
    Авторханов продовжує: «Шкірятов дав наказ про арешт усіх чеченців та інгушів, які є членами Чечено-Інгуського обласного комітету»(Citation: 369).
    Чекісти заарештували їх тут же, в залі пленуму.
    Авторханов пише про продовження: «Потім наказ Шкірятова був поширений і на всіх чечено-інгуських працівників, від голови республіканського уряду до голови сільради»(Citation: 369).
    У жовтні й листопаді 1937 року НКВД (попередник сучасної ФСБ) заарештував голову уряду республіки Алі Горчханова, його заступника Абдул-Халіма Саламова, другого секретаря обласного комітету Хасі Вахаєва, завідувача відділу культури і пропаганди обласного комітету Магомеда Мамакаєва, народного комісара (міністра) освіти Хаміда Окуєва, голову Верховного суду Мусу Ханієва, прокурора республіки Хасана Мехтієва і голову Спілки радянських письменників Саїда Бадуєва.
    Авторханов пише і про нижні поверхи: «Заарештовані були також голови районних виконавчих комітетів (у Чечено-Інгуській республіці було до 28 районів), майже всі голови сільських Рад, колгоспів та їхні партійні організатори»(Citation: 369).
    З 23 начальників районних відділів НКВД чеченцем був лише Гойтієв, і НКВД заарештував його теж.
    НКВД арештовував, а партійні органи знімали з посад - історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «Усього в жовтні 1937 р. було репресовано 30 із 76 членів і кандидатів у члени Чечено-Інгуського обкому, включно з усіма чеченцями та інгушами; 20 із 28 секретарів районних партійних комітетів; 77 членів райкомів і 192 керівних працівники сільських районів республіки»(Citation: 125); у 1938 році колонізатор зняв майже всіх завідувачів земельних відділів районів, 19 голів райвиконкомів і 22 секретарів райкомів(Citation: 125).
  ru: |-
    Чеченский историк А. Г. Авторханов, работавший в те годы в Чечне и писавший об этом в эмиграции, пишет: «В начале октября 1937 года в сопровождении большого чекистского штаба в Чечено-Ингушетию прибыл кандидат в члены Политбюро, председатель партколлегии при КПК при ЦК и заместитель Ежова – Шкирятов»(Citation: 369).
    Шкирятов собрал в грозненском Доме культуры имени Ленина расширенный пленум областного комитета партии - по архивным протоколам пленум шёл 8-10 октября 1937 года, участников было 194(Citation: 544) - и позвал туда же ответственных работников города и районов.
    Авторханов продолжает: «Шкирятов дал приказ об аресте всех чеченцев и ингушей, являющихся членами Чечено-Ингушского областного комитета»(Citation: 369).
    Чекисты арестовали их тут же, в зале пленума.
    Авторханов пишет о продолжении: «Потом приказ Шкирятова был распространен и на всех чечено-ингушских работников, от председателя республиканского правительства до председателя сельсовета»(Citation: 369).
    В октябре и ноябре 1937 года НКВД (предшественник современной ФСБ) арестовал председателя правительства республики Али Горчханова, его заместителя Абдул-Халима Саламова, второго секретаря областного комитета Хаси Вахаева, заведующего отделом культуры и пропаганды областного комитета Магомеда Мамакаева, народного комиссара (министра) просвещения Хамида Окуева, председателя Верховного суда Мусу Ханиева, прокурора республики Хасана Мехтиева и председателя Союза советских писателей Саида Бадуева.
    Авторханов пишет и о нижних этажах: «Арестованы были также председатели районных исполнительных комитетов (в Чечено-Ингушской республике было до 28 районов), почти все председатели сельских Советов, колхозов и их партийные организаторы»(Citation: 369).
    Из 23 начальников районных отделов НКВД чеченцем был только Гойтиев, и НКВД арестовал его тоже.
    НКВД арестовывал, а партийные органы снимали с должностей - историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «Всего в октябре 1937 г. было репрессировано 30 из 76 членов и кандидатов в члены Чечено-Ингушского обкома, включая всех чеченцев и ингушей; 20 из 28 секретарей районных партийных комитетов; 77 членов райкомов и 192 руководящих работников сельских районов республики»(Citation: 125); в 1938 году колонизатор снял почти всех заведующих земельными отделами районов, 19 председателей райисполкомов и 22 секретарей райкомов(Citation: 125).
