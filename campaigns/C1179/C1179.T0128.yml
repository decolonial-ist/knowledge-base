description:
  ru: |-
    Колонизатор репрессировал почти весь Союз писателей Чечено-Ингушетии. 20 ноября 1937 года бюро областного комитета партии («обком ВКП(б)») распустило правление писателей республики - формулировка постановления: «как оказавшееся засоренным враждебными буржуазно-националистическими элементами /Арсанов, Мамакаев, Айсханов и другие/»(Citation: 544).
    Один из осуждённых, Халид Ошаев, писал в 1961 году осетинскому писателю Хаджи-Мурату Мугуеву: «из 12 членов союза писателей Чечено-Ингушетии было арестовано 9 человек, осуждено 7 человек, расстреляно 4.
    Сам я, член Союза писателей с 1934 года, просидел в заключении 13 лет, 2 года сидел в одиночном заключении»(Citation: 546).
  en: |-
    The colonizer repressed almost the entire Union of Writers of Chechen-Ingushetia.
    On 20 November 1937 the bureau of the oblast committee of the party (the "obkom VKP(b)") dissolved the board of the writers of the republic - the resolution's wording: "as having proved clogged with hostile bourgeois-nationalist elements /Arsanov, Mamakayev, Aiskhanov and others/"(Citation: 544).
    One of the convicted, Khalid Oshaev, wrote in 1961 to the Ossetian writer Khadzhi-Murat Muguev: "of the 12 members of the union of writers of Chechen-Ingushetia 9 people were arrested, 7 convicted, 4 shot.
    I myself, a member of the Union of Writers since 1934, spent 13 years in confinement, and for 2 years was held in solitary confinement"(Citation: 546).
  uk: |-
    Колонізатор репресував майже всю Спілку письменників Чечено-Інгушетії. 20 листопада 1937 року бюро обласного комітету партії («обком ВКП(б)») розпустило правління письменників республіки - формулювання постанови: «як таке, що виявилося засміченим ворожими буржуазно-націоналістичними елементами /Арсанов, Мамакаєв, Айсханов та інші/»(Citation: 544).
    Один із засуджених, Халід Ошаєв, писав у 1961 році осетинському письменникові Хаджі-Мурату Мугуєву: «з 12 членів спілки письменників Чечено-Інгушетії було заарештовано 9 людей, засуджено 7 людей, розстріляно 4.
    Сам я, член Спілки письменників з 1934 року, просидів в ув'язненні 13 років, 2 роки сидів в одиночному ув'язненні»(Citation: 546).
