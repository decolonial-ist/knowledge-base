description:
  en: |-
    Torture of the arrested was officially sanctioned by the Central Committee of the Bolshevik party (the TsK VKP(b)).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write: "...against all those arrested under political articles torture was widely applied, officially permitted as measures of 'physical influence'"; Stalin's letter, circulated to party organs in January 1939, said: "The TsK VKP(b) explains that the application of physical influence in the practice of the NKVD was permitted from 1937 with the sanction of the TsK VKP(b)"(Citation: 125).
    One of the executors in the republic was Porubay, named in a 1938 memorandum of the oblast committee of the party as deputy People's Commissar (minister) of Internal Affairs of the republic.
    After the change of course he was put on trial - the charge: he "applied perverted methods of conducting the investigation and coerced the arrested into giving knowingly false testimony", and on the cases he falsified the troika passed death sentences(Citation: 544).
    The Chechen historian A. G. Avtorkhanov, who worked in Chechnya in those years and later wrote about it in emigration, writes that the investigation of the case of the "bourgeois-nationalist center" lasted three years, and describes its methods: "The investigation was conducted with the application of the physical tortures usual for the whole USSR, with a certain supplement for the specific 'national character'"(Citation: 369).
    Avtorkhanov names those whom the Chekists tortured to death: "During this investigation there were tortured to death: the former chairman of the oblast executive committee D. Machukayev, the former head of the obkom culture-and-propaganda department M. Gisayev, the former secretary of the Ingush obkom VKP(b) Idris Zyazikov, and others"(Citation: 369).
    He writes also of those whom torture drove to suicide: "Unable to endure the regime of torture, the following committed suicide: the chairman of the planning commission of the republic M. Islamov, the secretary of a district party committee M. Bektemirov"(Citation: 369).
    Avtorkhanov writes of the result: "By way of this unheard-of inquisition, named the 'preliminary investigation', the Chekists forced up to 90 percent of the members of the 'bourgeois-nationalist center' to sign and even to compose 'sincere confessions' of crimes they had, of course, not committed"(Citation: 369).
    Abdul-Khalim Salamov, deputy chairman of the government of the republic, under torture signed "sincere handwritten testimony" about the delivery into the republic from England through Turkey of 50 mountain guns, 1,000 machine guns, 200 thousand rifles, 5 million cartridges, 10 thousand shells and grenades for an armed uprising; there too he wrote that England had promised to support that uprising from the air.
    He also named the exact place where the weapons were buried in the mountains; Avtorkhanov writes: "the Chekists dug up all the indicated mountain gorges.
    Naturally they found nothing, but the beatings continued, with demands to point out the true place where the weapons were buried"(Citation: 369).
    The defendants showed the tribunal the marks of torture; Avtorkhanov writes: "The defendants, pointing to the scars of inflicted wounds, to knocked-out teeth, to mutilated parts of the organism (one had even been castrated during interrogation), declared that they had signed their false testimony under the influence of these physical tortures and in the hope that the day of trial, or of death, would thus be brought nearer"(Citation: 369).
  uk: |-
    Тортури заарештованих були офіційно дозволені Центральним комітетом більшовицької партії (ЦК ВКП(б)).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть: «...проти всіх заарештованих за політичними статтями широко застосовувалися тортури, офіційно дозволені як заходи «фізичного впливу»»; у листі Сталіна, розісланому в партійні органи в січні 1939 року, говорилося: «ЦК ВКП(б) роз'яснює, що застосування фізичного впливу в практиці НКВД було допущено з 1937 р. з дозволу ЦК ВКП(б)»(Citation: 125).
    Один із виконавців у республіці - Порубай, у записці обласного комітету партії 1938 року названий заступником народного комісара (міністра) внутрішніх справ республіки.
    Після зміни курсу його судили - звинувачення: «застосовував спотворені методи ведення слідства і примушував заарештованих до давання завідомо неправдивих показань», а за сфальсифікованими ним справами трійка виносила розстрільні вироки(Citation: 544).
    Чеченський історик А. Г. Авторханов, який працював у ті роки в Чечні й писав про це в еміграції, пише, що слідство у справі «буржуазно-націоналістичного центру» йшло три роки, і описує його методи: «Слідство велося із застосуванням звичайних для всього СРСР методів фізичних тортур з деякою добавкою для специфічного «національного характеру»»(Citation: 369).
    Авторханов називає тих, кого чекісти замучили на смерть: «Під час цього слідства до смерті були замучені: колишній голова обласного виконавчого комітету Д.Мачукаєв, колишній завкультпропом обкому М.Гісаєв, колишній секретар Інгуського обкому ВКП(б) Ідріс Зязіков та інші»(Citation: 369).
    Він пише і про тих, кого тортури довели до самогубства: «Не витримавши режиму тортур, покінчили самогубством: голова планової комісії республіки М.Ісламов, секретар райкому партії М.Бектеміров»(Citation: 369).
    Авторханов пише про результат: «Шляхом цієї нечуваної інквізиції, названої «попереднім слідством», чекісти змусили до 90 відсотків членів «буржуазно-націоналістичного центру» підписувати і навіть складати «щирі зізнання» у злочинах, яких вони, зрозуміло, не скоювали»(Citation: 369).
    Заступник голови уряду республіки Абдул-Халім Саламов під тортурами підписав «щирі власноручні показання» про доставку в республіку з Англії через Туреччину 50 гірських гармат, 1000 кулеметів, 200 тисяч гвинтівок, 5 мільйонів патронів, 10 тисяч снарядів і гранат для збройного повстання; там само він написав, що Англія обіцяла підтримати це повстання з повітря.
    Він назвав і точне місце, де ця зброя закопана в горах; Авторханов пише: «чекісти перерили всі вказані ущелини гір.
    При цьому, звісно, нічого не знайшли, але побиття тривали з вимогами вказати справжнє місце, де закопана ця зброя»(Citation: 369).
    Підсудні показали трибуналові сліди тортур; Авторханов пише: «Підсудні, вказуючи на шрами від завданих ран, на вибиті зуби, понівечені частини організму (одного навіть було кастровано під час допиту), заявили, що свої неправдиві показання вони підписали під впливом цих фізичних тортур і в надії, що таким чином буде прискорений день суду, або смерті»(Citation: 369).
  ru: |-
    Пытки арестованных были официально разрешены Центральным комитетом большевистской партии (ЦК ВКП(б)).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут: «...против всех арестованных по политическим статьям широко применялись пытки, официально разрешенные как меры «физического воздействия»»; в письме Сталина, разосланном в партийные органы в январе 1939 года, говорилось: «ЦК ВКП(б) разъясняет, что применение физического воздействия в практике НКВД было допущено с 1937 г. с разрешения ЦК ВКП(б)»(Citation: 125).
    Один из исполнителей в республике - Порубай, в записке областного комитета партии 1938 года названный заместителем народного комиссара (министра) внутренних дел республики.
    После смены курса его судили - обвинение: «применял извращенные методы ведения следствия и принуждал арестованных к даче заведомо ложных показаний», а по сфальсифицированным им делам тройка выносила расстрельные приговоры(Citation: 544).
    Чеченский историк А. Г. Авторханов, работавший в те годы в Чечне и писавший об этом в эмиграции, пишет, что следствие по делу «буржуазно-националистического центра» шло три года, и описывает его методы: «Следствие велось с применением обычных для всего СССР методов физических пыток с некоторой добавкой для специфического «национального характера»»(Citation: 369).
    Авторханов называет тех, кого чекисты замучили насмерть: «Во время этого следствия до смерти были замучены: бывший председатель областного исполнительного комитета Д.Мачукаев, бывший завкультпропом обкома М.Гисаев, бывший секретарь Ингушского обкома ВКП(б) Идрис Зязиков и другие»(Citation: 369).
    Он пишет и о тех, кого пытки довели до самоубийства: «Не выдержав режима пыток, покончили самоубийством: председатель плановой комиссии республики М.Исламов, секретарь райкома партии М.Бектемиров»(Citation: 369).
    Авторханов пишет о результате: «Путем этой неслыханной инквизиции, названной «предварительным следствием», чекисты заставили до 90 процентов членов «буржуазно-националистического центра» подписывать и даже сочинять «искренние признания» в преступлениях, которых они, разумеется, не совершали»(Citation: 369).
    Заместитель председателя правительства республики Абдул-Халим Саламов под пытками подписал «искренние собственноручные показания» о доставке в республику из Англии через Турцию 50 горных орудий, 1000 пулемётов, 200 тысяч винтовок, 5 миллионов патронов, 10 тысяч снарядов и гранат для вооружённого восстания; там же он написал, что Англия обещала поддержать это восстание с воздуха.
    Он назвал и точное место, где это оружие зарыто в горах; Авторханов пишет: «чекисты изрыли все указанные ущелья гор.
    При этом, конечно, ничего не нашли, но избиения продолжались с требованиями указать подлинное место, где зарыто это оружие»(Citation: 369).
    Подсудимые показали трибуналу следы пыток; Авторханов пишет: «Подсудимые, указывая на шрамы от нанесенных ран, на выбитые зубы, изуродованные части организма (один даже был кастрирован во время допроса), заявили, что свои ложные показания они подписали под влиянием этих физических пыток и в надежде, что таким образом будет ускорен день суда, или смерти»(Citation: 369).
