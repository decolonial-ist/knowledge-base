description:
  ru: |-
    11 июля 1937 года оккупационные власти утвердили число «подлежащих расстрелу» людей в Чечне: 862 «кулака» (крестьяне, которых колонизатор посчитал «зажиточными») и 555 «уголовников» - итого 1417 человек(Citation: 544); в оперативном приказе народного комиссара (министра) внутренних дел СССР Ежова № 00447 от 30 июля по ЧИАССР записано: 500 человек - расстрелять («первая категория» приказа)(Citation: 545).
    Историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут о расстрелянных писателях: «из 12 членов Чечено-Ингушского Союза писателей были арестованы 9, осуждены 7, в том числе четверо - С. Бадуев, А. Дудаев, Ш. Айсханов, С. Озиев - приговорены к расстрелу»(Citation: 125).
    НКВД (предшественник современной ФСБ) арестовал одного из этих четверых - писателя Абди Дудаева - 24 ноября 1937 года «без санкции прокурора», со стандартным обвинением в «антисоветской агитации», а 2 декабря по решению «тройки при НКВД ЧИАССР» чекисты его расстреляли - восемь дней от ареста до убийства; в заключении по делу от 13 мая 1958 года сказано: «Следствие по делу Дудаева проводилось с нарушением закона, очные ставки со свидетелями не проводились»(Citation: 544).
    Москва лично утверждала списки задержанных на расстрел: Сталин, Молотов и Жданов подписали список от 7 декабря 1937 года, и 28 декабря Военная коллегия Верховного суда СССР вынесла по нему 32 смертных приговора(Citation: 544); 12 сентября 1938 года Политбюро утвердило новый список подлежащих её суду: из 61 подследственного 50 шли по делу «буржуазно-националистического центра», и 55 из них значились «в расстрельной статье»(Citation: 544). 29 июня 1938 года Военная коллегия осудила на разные сроки большую группу технической интеллигенции республики, а 30 человек приговорила к расстрелу - чекисты расстреляли их в тот же день(Citation: 544).
    В обвинении по делу Порубая - заместителя народного комиссара (министра) внутренних дел республики, которого судили после смены курса, - сказано: «Сфальсифицировал следственные дела на Хамзатханова, Алиева, Хасиева, Кадилова, Ухуева, Мутушева, все эти лица решением тройки осуждены к ВМН» - «ВМН» означало расстрел(Citation: 544).
    Чекисты сбрасывали тела убитых в две ямы-траншеи на центральном кладбище Грозного - историк Т. У. Эльбуздукаева пишет: туда «в октябре, ноябре и декабре 1937 г.» сбрасывали «тела расстрелянных»(Citation: 544).
    А. Божедомов вскрыл захоронение летом 1990 года - раскопками с участием членов Чечено-Ингушского «Мемориала» и работников краеведческого музея(Citation: 544).
  en: |-
    On 11 July 1937 the occupation authorities approved the number of people "subject to shooting" in Chechnya: 862 "kulaks" (peasants whom the colonizer deemed "well-off") and 555 "criminals" - 1,417 people in all(Citation: 544); operational order No. 00447 of Yezhov, the People's Commissar (minister) of Internal Affairs of the USSR, of 30 July records for the ChIASSR: 500 people - to be shot (the order's "first category")(Citation: 545).
    Historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write of the executed writers: "of the 12 members of the Chechen-Ingush Union of Writers 9 were arrested, 7 convicted, among them four - S. Baduev, A. Dudayev, Sh.
    Aiskhanov, S. Oziev - sentenced to be shot"(Citation: 125).
    The NKVD (a predecessor of today's FSB) arrested one of those four - the writer Abdi Dudayev - on 24 November 1937 "without the prosecutor's sanction", on the standard charge of "anti-Soviet agitation", and on 2 December, by decision of the "troika under the NKVD of the ChIASSR", the Chekists shot him - eight days from arrest to killing; the finding on his case of 13 May 1958 states: "The investigation of Dudayev's case was conducted in violation of the law; confrontations with witnesses were not held"(Citation: 544).
    Moscow personally confirmed the lists of detainees for shooting: Stalin, Molotov and Zhdanov signed the list of 7 December 1937, and on 28 December the Military Collegium of the Supreme Court of the USSR passed 32 death sentences on it(Citation: 544); on 12 September 1938 the Politburo confirmed a new list of those subject to its court: of the 61 under investigation, 50 went under the case of the "bourgeois-nationalist center", and 55 of them stood "in the shooting article"(Citation: 544).
    On 29 June 1938 the Military Collegium sentenced a large group of the republic's technical intelligentsia to various terms, and 30 people to be shot - the Chekists shot them the same day(Citation: 544).
    The indictment in the case of Porubay - deputy People's Commissar (minister) of Internal Affairs of the republic, put on trial after the change of course - states: "Falsified the investigative cases of Khamzatkhanov, Aliev, Khasiev, Kadilov, Ukhuev, Mutushev; all these persons were sentenced by decision of the troika to VMN" - "VMN" meant execution by shooting(Citation: 544).
    The Chekists dumped the bodies of the killed into two trench-pits at the central cemetery of Grozny - the historian T. U. Elbuzdukayeva writes: there, "in October, November and December 1937", they dumped "the bodies of the shot"(Citation: 544).
    A. Bozhedomov opened the burial in the summer of 1990 - by excavations with the participation of members of the Chechen-Ingush "Memorial" and staff of the museum of local history(Citation: 544).
  uk: |-
    11 липня 1937 року окупаційна влада затвердила число «що підлягають розстрілу» людей у Чечні: 862 «куркулі» (селяни, яких колонізатор вважав «заможними») і 555 «кримінальників» - разом 1417 людей(Citation: 544); в оперативному наказі народного комісара (міністра) внутрішніх справ СРСР Єжова № 00447 від 30 липня по ЧІАСРР записано: 500 людей - розстріляти («перша категорія» наказу)(Citation: 545).
    Історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть про розстріляних письменників: «з 12 членів Чечено-Інгуської Спілки письменників були заарештовані 9, засуджені 7, зокрема четверо - С. Бадуєв, А. Дудаєв, Ш. Айсханов, С. Озієв - засуджені до розстрілу»(Citation: 125).
    НКВД (попередник сучасної ФСБ) заарештував одного з цих чотирьох - письменника Абді Дудаєва - 24 листопада 1937 року «без санкції прокурора», зі стандартним звинуваченням в «антирадянській агітації», а 2 грудня за рішенням «трійки при НКВД ЧІАСРР» чекісти його розстріляли - вісім днів від арешту до вбивства; у висновку в справі від 13 травня 1958 року сказано: «Слідство у справі Дудаєва проводилося з порушенням закону, очні ставки зі свідками не проводилися»(Citation: 544).
    Москва особисто затверджувала списки затриманих на розстріл: Сталін, Молотов і Жданов підписали список від 7 грудня 1937 року, і 28 грудня Військова колегія Верховного суду СРСР винесла за ним 32 смертні вироки(Citation: 544); 12 вересня 1938 року Політбюро затвердило новий список тих, хто підлягав її суду: з 61 підслідного 50 ішли у справі «буржуазно-націоналістичного центру», і 55 з них значилися «в розстрільній статті»(Citation: 544). 29 червня 1938 року Військова колегія засудила на різні строки велику групу технічної інтелігенції республіки, а 30 людей засудила до розстрілу - чекісти розстріляли їх того ж дня(Citation: 544).
    У звинуваченні у справі Порубая - заступника народного комісара (міністра) внутрішніх справ республіки, якого судили після зміни курсу, - сказано: «Сфальсифікував слідчі справи на Хамзатханова, Алієва, Хасієва, Каділова, Ухуєва, Мутушева, всі ці особи рішенням трійки засуджені до ВМН» - «ВМН» означало розстріл(Citation: 544).
    Чекісти скидали тіла вбитих у дві ями-траншеї на центральному цвинтарі Грозного - історик Т. У. Ельбуздукаєва пише: туди «в жовтні, листопаді і грудні 1937 р.» скидали «тіла розстріляних»(Citation: 544).
    А. Божедомов розкрив поховання влітку 1990 року - розкопками за участю членів Чечено-Інгуського «Меморіалу» і працівників краєзнавчого музею(Citation: 544).
