description:
  ru: |-
    Наутро после ночных арестов 31 июля 1937 года бюро областного комитета партии постановило: провести во всех колхозах собрания «с разъяснением политической обстановки в деревне», а до 5 августа - районные и комсомольские собрания «об итогах операции»(Citation: 544). 3 августа 1937 года Центральный комитет большевистской партии (ЦК ВКП(б)) телеграммой № 1178 обязал областные комитеты партии: организовать «в каждой области по районам 2-3 открытых показательных процесса» над назначенными «вредителями сельского хозяйства» - «широко осветив ход судебных процессов в местной печати»(Citation: 544).
    Газета «Грозненский рабочий» освещала открытые суды с августа 1937 года - 20 августа под заголовком: «Суд над бывшими руководителями Чечингторга»(Citation: 544).
    С 11 сентября 1937 года та же газета печатала обличения волнами, день за днём: 11 сентября: «Распутать буржуазно-националистический клубок» - с отчётом о собрании, где «из 587 членов и 132 кандидатов партии, присутствовавших на собрании... выступило 520 человек»; 15 сентября: «Враги чечено-ингушского народа: выкорчевать и до конца разгромить банду буржуазных националистов»; 16 сентября: «Враги народа хозяйничают в Чечингиздате: волчью шайку возглавляет махровый националист Арсанукаев»; 17 сентября: «Разоблачить и разгромить подлую банду буржуазных националистов! - таков общий голос парторганизаций Чечено-Ингушетии»; людей газета обличала поимённо - Горчханова, Саламова, Мехтиева, Вахаева, Окуева, Ханиева, Мациева, Яндарова(Citation: 544). 27 сентября газета напечатала анонс: «Вредители зерна: к предстоящим процессам» - за три дня до репортажа о самом суде; 12 октября под заголовком: «Суд над вредителями с Артемовского элеватора» - газета отчиталась: «переполнившие зал рабочие и домохозяйки встретили приговор бурными аплодисментами»; 3 ноября под заголовком: «Суд над вредителями 2-го нефтеперегонного завода»(Citation: 544).
    В марте 1938 года участники митинга в Октябрьском районе Грозного требовали от Военной коллегии Верховного суда СССР расстрела «взбесившихся фашистских собак»(Citation: 544), «Грозненский рабочий» 11 марта напечатал открытое письмо пионеров грозненской школы № 3 с требованием «физического уничтожения озверелых врагов народа»(Citation: 547), а о суде 16-26 марта историк К. Г. Дендиев пишет: разбирательство по делу «Буржуазно-националистической троцкистско-бухаринской контрреволюционной группы Абастова, Кебиева, Зармаева и др.»
    «слушалось в открытом заседании, с участием государственного обвинителя и органа защиты», а обвинительное заключение напечатал «Грозненский рабочий»(Citation: 544).
  en: |-
    On the morning after the night arrests of 31 July 1937 the bureau of the oblast committee of the party resolved: to hold meetings in all kolkhozes "with an explanation of the political situation in the countryside", and by 5 August - district and Komsomol meetings "on the results of the operation"(Citation: 544).
    On 3 August 1937 the Central Committee of the Bolshevik party (the TsK VKP(b)), by telegram No. 1178, obliged the oblast committees of the party: to organize "in each oblast, by districts, 2-3 open show trials" of assigned "wreckers of agriculture" - "covering the course of the trials widely in the local press"(Citation: 544).
    The newspaper "Groznensky Rabochy" ["The Grozny Worker"] covered the open trials from August 1937 - on 20 August under the headline: "The Trial of the Former Managers of Chechingtorg"(Citation: 544).
    From 11 September 1937 the same newspaper printed denunciations in waves, day after day: 11 September: "Untangle the Bourgeois-Nationalist Tangle" - with a report on a meeting at which "of the 587 members and 132 candidate members of the party present at the meeting... 520 people spoke"; 15 September: "Enemies of the Chechen-Ingush People: Root Out and Smash to the End the Band of Bourgeois Nationalists"; 16 September: "Enemies of the People Have the Run of Chechingizdat: the Wolf Pack Is Headed by the Dyed-in-the-Wool Nationalist Arsanukayev"; 17 September: "Expose and Smash the Vile Band of Bourgeois Nationalists! - Such Is the Common Voice of the Party Organizations of Chechen-Ingushetia"; the newspaper denounced people by name - Gorchkhanov, Salamov, Mekhtiev, Vakhayev, Okuyev, Khaniev, Matsiev, Yandarov(Citation: 544).
    On 27 September the newspaper printed an announcement: "Wreckers of Grain: Toward the Coming Trials" - three days before the report on the trial itself; on 12 October, under the headline: "The Trial of the Wreckers from the Artemovsky Elevator" - the newspaper reported: "the workers and housewives who filled the hall met the verdict with stormy applause"; on 3 November, under the headline: "The Trial of the Wreckers of the Second Oil Refinery"(Citation: 544).
    In March 1938 the participants of a rally in the Oktyabrsky district of Grozny demanded of the Military Collegium of the Supreme Court of the USSR the shooting of "rabid fascist dogs"(Citation: 544), "Groznensky Rabochy" on 11 March printed an open letter of the Pioneers of Grozny school No. 3 demanding "the physical annihilation of the bestial enemies of the people"(Citation: 547), and of the trial of 16-26 March the historian K. G. Dendiev writes: the proceedings in the case of the "Bourgeois-nationalist Trotskyite-Bukharinite counter-revolutionary group of Abastov, Kebiev, Zarmayev and others" "were heard in open session, with the participation of a state prosecutor and an organ of the defense", and the indictment was printed by "Groznensky Rabochy"(Citation: 544).
  uk: |-
    Наступного ранку після нічних арештів 31 липня 1937 року бюро обласного комітету партії постановило: провести в усіх колгоспах збори «з роз'ясненням політичної обстановки на селі», а до 5 серпня - районні та комсомольські збори «про підсумки операції»(Citation: 544). 3 серпня 1937 року Центральний комітет більшовицької партії (ЦК ВКП(б)) телеграмою № 1178 зобов'язав обласні комітети партії: організувати «в кожній області по районах 2-3 відкриті показові процеси» над призначеними «шкідниками сільського господарства» - «широко висвітливши хід судових процесів у місцевій пресі»(Citation: 544).
    Газета «Грозненский рабочий» висвітлювала відкриті суди з серпня 1937 року - 20 серпня під заголовком: «Суд над колишніми керівниками Чечінгторгу»(Citation: 544).
    З 11 вересня 1937 року та сама газета друкувала викриття хвилями, день за днем: 11 вересня: «Розплутати буржуазно-націоналістичний клубок» - зі звітом про збори, де «з 587 членів і 132 кандидатів партії, присутніх на зборах... виступило 520 людей»; 15 вересня: «Вороги чечено-інгуського народу: викорчувати і до кінця розгромити банду буржуазних націоналістів»; 16 вересня: «Вороги народу хазяйнують у Чечінгвидаві: вовчу зграю очолює махровий націоналіст Арсанукаєв»; 17 вересня: «Викрити і розгромити підлу банду буржуазних націоналістів! - такий спільний голос парторганізацій Чечено-Інгушетії»; людей газета викривала поіменно - Горчханова, Саламова, Мехтієва, Вахаєва, Окуєва, Ханієва, Мацієва, Яндарова(Citation: 544). 27 вересня газета надрукувала анонс: «Шкідники зерна: до майбутніх процесів» - за три дні до репортажу про сам суд; 12 жовтня під заголовком: «Суд над шкідниками з Артемівського елеватора» - газета відзвітувала: «робітники і домогосподарки, що переповнили залу, зустріли вирок бурхливими оплесками»; 3 листопада під заголовком: «Суд над шкідниками 2-го нафтопереробного заводу»(Citation: 544).
    У березні 1938 року учасники мітингу в Жовтневому районі Грозного вимагали від Військової колегії Верховного суду СРСР розстрілу «скажених фашистських собак»(Citation: 544), «Грозненский рабочий» 11 березня надрукував відкритий лист піонерів грозненської школи № 3 з вимогою «фізичного знищення озвірілих ворогів народу»(Citation: 547), а про суд 16-26 березня історик К. Г. Дендієв пише: розгляд справи «Буржуазно-націоналістичної троцькістсько-бухарінської контрреволюційної групи Абастова, Кебієва, Зармаєва та ін.»
    «слухався у відкритому засіданні, за участю державного обвинувача й органу захисту», а обвинувальний висновок надрукував «Грозненский рабочий»(Citation: 544).
