description:
  ru: |-
    С лета 1937 до ноября 1938 года НКВД (политическая полиция, предшественница современной ФСБ) арестовывал в республике людей по категориям и числам, назначенным в оперативном приказе народного комиссара (министра) внутренних дел СССР Ежова № 00447 от 30 июля 1937 года.
    Чеченский историк А. Г. Авторханов, работавший в те годы в Чечне и писавший об этом в эмиграции, описал начало операции: «В ночь с 31 июля на 1 августа 1937 года по ранее составленным НКВД спискам была проведена по всем аулам и районам так называемая «генеральная операция по изъятию антисоветских элементов»»; чекисты свозили арестованных в Грозный - в центральный гараж «Грознефти», в клуб имени Сталина, в дом предварительного заключения республиканской милиции(Citation: 369).
    Авторханов называет «до 14 тысяч человек» арестованных за первую волну; в опубликованной сводке о ходе операции на середину августа - около 2,4 тысячи арестованных по всей республике, и разделены они в ней по назначенным составам: 888 «кулаков» (крестьян, которых колонизатор посчитал «зажиточными»), 831 «уголовников», 682 «контрреволюционного элемента»(Citation: 544).
    Начальник Гудермесского районного отдела НКВД Гридасов ответил сотруднику, спросившему, как арестовать человека, если материала на него нет: «Материал всегда найдется, лишь бы на нем была кавказская шапка!»(Citation: 369).
    Аресты продолжались до ноября 1938 года: осенью 1937 года Москва подняла назначенное по республике число до 3200 человек, а 1 марта 1938 года назначила новое - 10 108 человек, из которых тройка осудила 6767(Citation: 544). 8 сентября 1937 года газета «Правда» напечатала статью специального корреспондента Кузовкина под заголовком: «Буржуазно-националистический клубок в Чечено-Ингушетии»(Citation: 544).
    Авторханов излагает её содержание: автор статьи «доказывал, что в Чечено-Ингушетии в партийном руководстве и во главе правительства сидят «буржуазные националисты», которые ведут чечено-ингушский народ по антисоветскому пути», а газета и автор призывали не названного по имени судью: «до конца распутать буржуазно-националистический клубок»(Citation: 369).
    Авторханов пишет о том, что следователи изготовили из арестованных: «В течение трех лет чекистские следователи создавали дело «буржуазно-националистической, контрреволюционно-повстанческой, бухаринско-троцкистской, террористическо-шпионской, антисоветской, вредительской организации» – буквально так гласила многоэтажная формула обвинения для головки арестованных»(Citation: 369).
    В эту «головку», которую чекисты назвали «буржуазно-националистическим центром Чечни и Ингушетии», следствие вписало 137 бывших ответственных работников республики.
    Следствие записало в эти 137 и Абдурахмана Авторханова, находившегося тогда на учёбе в Москве: оно вписывало людей в дело независимо от того, где они были и что делали(Citation: 125).
    Каждому из них следствие вменило статью 58 - измену Родине, подготовку вооружённого восстания, вредительство, террористические акты, диверсию, антисоветскую агитацию, членство в антисоветской организации и саботаж.
    По обвинению «центр» действовал в союзе с такими же «центрами» Дагестана, Осетии, Кабардино-Балкарии, Карачая, Адыгеи и Черкесии и готовил, как пишет Авторханов, «провозглашение «Северокавказской федеративной республики» под протекторатом Турции и Англии», а связь между всеми ими держал «Московский межнациональный центр»(Citation: 369).
  en: |-
    From the summer of 1937 to November 1938 the NKVD (the political police, a predecessor of today's FSB) arrested people in the republic by the categories and numbers assigned in operational order No. 00447 of Yezhov, the People's Commissar (minister) of Internal Affairs of the USSR, of 30 July 1937.
    The Chechen historian A. G. Avtorkhanov, who worked in Chechnya in those years and later wrote about it in emigration, described the beginning of the operation: "On the night of 31 July to 1 August 1937, by lists drawn up beforehand by the NKVD, the so-called 'general operation for the removal of anti-Soviet elements' was carried out across all auls and districts"; the Chekists hauled the arrested to Grozny - to the central garage of "Grozneft", to the Stalin club, to the pre-trial detention house of the republic's militia(Citation: 369).
    Avtorkhanov names "up to 14 thousand people" arrested in the first wave; the published operational summary on the course of the operation gives, for mid-August, about 2.4 thousand arrested across the whole republic, divided in it by the assigned categories: 888 "kulaks" (peasants whom the colonizer deemed "well-off"), 831 "criminals", 682 of the "counter-revolutionary element"(Citation: 544).
    Gridasov, head of the Gudermes district department of the NKVD, answered an officer who asked how to arrest a man when there was no material on him: "Material will always be found, so long as he wears a Caucasian hat!"(Citation: 369).
    The arrests went on until November 1938: in the autumn of 1937 Moscow raised the number assigned to the republic to 3,200 people, and on 1 March 1938 assigned a new one - 10,108 people, of whom the troika convicted 6,767(Citation: 544).
    On 8 September 1937 the newspaper "Pravda" printed an article by its special correspondent Kuzovkin under the headline: "The Bourgeois-Nationalist Tangle in Chechen-Ingushetia"(Citation: 544).
    Avtorkhanov relates its content: the author of the article "proved that in Chechen-Ingushetia 'bourgeois nationalists' sit in the party leadership and at the head of the government, leading the Chechen-Ingush people down an anti-Soviet path", and the newspaper and the author called on a judge not named by name: "to untangle the bourgeois-nationalist tangle to the end"(Citation: 369).
    Avtorkhanov writes of what the investigators manufactured out of the arrested: "Over the course of three years the Chekist investigators created the case of a 'bourgeois-nationalist, counter-revolutionary-insurgent, Bukharinite-Trotskyite, terrorist-espionage, anti-Soviet, wrecking organization' – literally so ran the many-storeyed formula of the charge for the top layer of the arrested"(Citation: 369).
    Into this "top layer", which the Chekists named the "bourgeois-nationalist center of Chechnya and Ingushetia", the investigation wrote 137 former senior officials of the republic.
    The investigation entered among these 137 also Abdurakhman Avtorkhanov, who was then studying in Moscow: it wrote people into the case regardless of where they were and what they did(Citation: 125).
    To each of them the investigation imputed Article 58 - treason against the Motherland, preparation of an armed uprising, wrecking, terrorist acts, diversion, anti-Soviet agitation, membership in an anti-Soviet organization, and sabotage.
    According to the charge, the "center" acted in alliance with identical "centers" of Dagestan, Ossetia, Kabardino-Balkaria, Karachay, Adygea and Circassia and was preparing, as Avtorkhanov writes, "the proclamation of a 'North Caucasus federative republic' under the protectorate of Turkey and England", with the "Moscow inter-national center" holding the liaison between them all(Citation: 369).
  uk: |-
    З літа 1937 до листопада 1938 року НКВД (політична поліція, попередниця сучасної ФСБ) арештовував у республіці людей за категоріями й числами, призначеними в оперативному наказі народного комісара (міністра) внутрішніх справ СРСР Єжова № 00447 від 30 липня 1937 року.
    Чеченський історик А. Г. Авторханов, який працював у ті роки в Чечні й писав про це в еміграції, описав початок операції: «У ніч з 31 липня на 1 серпня 1937 року за заздалегідь складеними НКВД списками була проведена по всіх аулах і районах так звана «генеральна операція з вилучення антирадянських елементів»»; чекісти звозили заарештованих до Грозного - в центральний гараж «Грознафти», у клуб імені Сталіна, у дім попереднього ув'язнення республіканської міліції(Citation: 369).
    Авторханов називає «до 14 тисяч людей» заарештованих за першу хвилю; в опублікованому оперативному зведенні про хід операції на середину серпня - близько 2,4 тисячі заарештованих по всій республіці, і розділені вони в ньому за призначеними складами: 888 «куркулів» (селян, яких колонізатор вважав «заможними»), 831 «кримінальник», 682 «контрреволюційного елементу»(Citation: 544).
    Начальник Гудермеського районного відділу НКВД Грідасов відповів співробітникові, який спитав, як заарештувати людину, якщо матеріалу на неї немає: «Матеріал завжди знайдеться, аби на ньому була кавказька шапка!»(Citation: 369).
    Арешти тривали до листопада 1938 року: восени 1937 року Москва підняла призначене по республіці число до 3200 людей, а 1 березня 1938 року призначила нове - 10 108 людей, з яких трійка засудила 6767(Citation: 544). 8 вересня 1937 року газета «Правда» надрукувала статтю спеціального кореспондента Кузовкіна під заголовком: «Буржуазно-націоналістичний клубок у Чечено-Інгушетії»(Citation: 544).
    Авторханов викладає її зміст: автор статті «доводив, що в Чечено-Інгушетії в партійному керівництві та на чолі уряду сидять «буржуазні націоналісти», які ведуть чечено-інгуський народ антирадянським шляхом», а газета й автор закликали не названого на ім'я суддю: «до кінця розплутати буржуазно-націоналістичний клубок»(Citation: 369).
    Авторханов пише про те, що слідчі виготовили із заарештованих: «Протягом трьох років чекістські слідчі створювали справу «буржуазно-націоналістичної, контрреволюційно-повстанської, бухарінсько-троцькістської, терористично-шпигунської, антирадянської, шкідницької організації» – буквально так звучала багатоповерхова формула звинувачення для верхівки заарештованих»(Citation: 369).
    У цю «верхівку», яку чекісти назвали «буржуазно-націоналістичним центром Чечні та Інгушетії», слідство вписало 137 колишніх відповідальних працівників республіки.
    Слідство записало в ці 137 і Абдурахмана Авторханова, який перебував тоді на навчанні в Москві: воно вписувало людей у справу незалежно від того, де вони були і що робили(Citation: 125).
    Кожному з них слідство поставило статтю 58 - зраду Батьківщини, підготовку збройного повстання, шкідництво, терористичні акти, диверсію, антирадянську агітацію, членство в антирадянській організації і саботаж.
    За звинуваченням «центр» діяв у союзі з такими самими «центрами» Дагестану, Осетії, Кабардино-Балкарії, Карачаю, Адигеї та Черкесії і готував, як пише Авторханов, «проголошення «Північнокавказької федеративної республіки» під протекторатом Туреччини та Англії», а зв'язок між усіма ними тримав «Московський міжнаціональний центр»(Citation: 369).
