description:
  en: |-
    Within the amanat-and-tribute system of Pullo, commander of the left flank of the Caucasus Line (a chain of imperial fortifications on the land of the Nokhchi), the troops destroyed the Chechen forests - the environment of life and the protection of the Chechen communities.
    Pullo reported in a memorandum of 1840: "we cleared all the forests to the distance of a gunshot on both sides of the road, in the direction from the Groznaya fortress through Martan, Achkhoy and Kurchali to the Military-Georgian road, and in the other direction through Germenchuk, Geldygen and along the Michik into highland Chechnya, altogether over a stretch of 165 versts" (the listed names are Chechen villages and rivers from the Groznaya fortress to mountain Chechnya; a verst is slightly over a kilometer)(Citation: 126).
    The Chechen writer Abuzar Aydamirov records the continuation of the clearing (a strip cut through the forest for the passage of troops) from the Groznaya fortress toward the village of Shali in 1837(Citation: 127).
  uk: |-
    У рамках аманатсько-податної системи Пулло, командувача лівого флангу Кавказької лінії (ланцюга імперських укріплень на землі нохчі), війська знищували чеченські ліси - середовище життя і захист чеченських товариств.
    Пулло в доповідній записці 1840 року відзвітував: «розчистили всі ліси на відстані рушничного пострілу по обидва боки дороги, у напрямку від фортеці Грозної через Мартан, Ачхой і Курчалі до Військово-Грузинської дороги, а в інший бік через Герменчук, Гельдиген і по Мічику в нагірну Чечню, всього на протязі 165 верст» (перелічені чеченські селища і ріки від фортеці Грозної до гірської Чечні; верста - трохи більше кілометра)(Citation: 126).
    Чеченський письменник Абузар Айдаміров фіксує продовження просіки (вирубаної в лісі смуги для проходу військ) від фортеці Грозної до селища Шалі в 1837 році(Citation: 127).
  ru: |-
    В рамках аманатско-податной системы Пулло, командующего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), войска уничтожали чеченские леса - среду жизни и защиту чеченских обществ.
    Пулло в докладной записке 1840 года отчитался: «расчистили все леса на расстоянии ружейного выстрела по обеим сторонам дороги, по направлению от кр.
    Грозной через Мартан, Ачхой и Курчали к Военно-Грузинской дороге, а в другую сторону через Герменчук, Гельдыген и по Мичику в нагорную Чечню, всего на протяжении 165 верст» (перечислены чеченские селения и реки от крепости Грозной до горной Чечни; верста - чуть больше километра)(Citation: 126).
    Чеченский писатель Абузар Айдамиров фиксирует продолжение просеки (вырубленной в лесу полосы для прохода войск) от крепости Грозной к селению Шали в 1837 году(Citation: 127).
