description:
  en: |-
    The amanat-and-tribute system of Pullo, commander of the left flank of the Caucasus Line (a chain of imperial fortifications on the land of the Nokhchi), imposed a tribute on the seized auls of Chechnya.
    Pullo in a memorandum of 1840: "As the highland communities were subjugated, each handed over amanats, paid a tribute of one silver ruble per saklia, handed over all Russian captives held by it" (saklia - a highlander's house: the tribute was levied on every house; amanats - hostages whom the empire took away from the auls to control them)(Citation: 126).
    The 1840 register of the highland peoples, published in the documentary collection «Движение горцев северо-восточного Кавказа в 20-50 гг.
    XIX века» together with Pullo's memorandum, calls the tribute a punishment outright: the Qachqalyq people, the Michik Chechens and the Aukhovites (Chechen communities of eastern Chechnya) "pay a tribute imposed on them as punishment for repeated revolts", and the Chechens living beyond the Sunzha river, "as punishment for revolt, have been burdened with a tribute"(Citation: 126).
    The money was squeezed out regularly: general Grabbe, commander of the troops of the Caucasus Line and Pullo's superior, in a report to the empire's Minister of War Chernyshev of 23 March 1840, named the regular payment of tributes a sign of the "tranquility" that had set in - the report lists the "regular payment of tributes and duties" weeks before the uprising(Citation: 106).
    Muhammad Tahir al-Qarakhi, the chronicler of Shamil (Shamil - imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest), named this exaction - one ruble from every house and one gun from every ten houses - as the reason the Chechens called upon Shamil.
  uk: |-
    Аманатсько-податна система Пулло, командувача лівого флангу Кавказької лінії (ланцюга імперських укріплень на землі нохчі), обклала захоплені імперією аули Чечні податтю.
    Пулло в доповідній записці 1840 року: «У міру підкорення горських товариств кожне видавало аманатів, платило подать по рублю срібл. із саклі, видавало всіх наявних у нього російських полонених» (сакля - дім горця: подать бралася з кожного дому; аманати - заручники, яких імперія забирала в аулів для контролю над ними)(Citation: 126).
    Відомість горським народам 1840 року, опублікована у збірнику документів «Движение горцев северо-восточного Кавказа в 20-50 гг.
    XIX века» разом з доповідною запискою Пулло, прямо називає подать покаранням: качкаликівці, мічиковські чеченці й ауховці (чеченські товариства східної Чечні) «платять подать, якою обкладені в покарання за неодноразові повстання», а чеченці, що живуть за рікою Сунжею, «в покарання за повстання, обкладені податтю»(Citation: 126).
    Гроші вичавлювалися справно: генерал Граббе, командувач військ Кавказької лінії і начальник Пулло, рапортом військовому міністру імперії Чернишову від 23 березня 1840 року назвав справну сплату податей ознакою «спокою», що настав, - рапорт перелічує «справну сплату податей і повинностей» за лічені тижні до повстання(Citation: 106).
    Мухаммед-Тахір аль-Карахі, хроніст Шаміля (Шаміль - імам, керівник спротиву горців Дагестану і Чечні російському завоюванню), назвав цей побір - по рублю з кожного дому і по рушниці з кожних десяти домів - причиною, з якої чеченці кликали Шаміля.
  ru: |-
    Аманатско-податная система Пулло, командующего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), обложила захваченные империей аулы Чечни податью.
    Пулло в докладной записке 1840 года: «По мере покорения горских обществ каждое выдавало аманатов, платило подать по рублю сер. с сакли, выдавало всех находящихся у него русских пленных» (сакля - дом горца: подать бралась с каждого дома; аманаты - заложники, которых империя забирала у аулов для контроля над ними)(Citation: 126).
    Ведомость горским народам 1840 года, опубликованная в сборнике документов «Движение горцев северо-восточного Кавказа в 20-50 гг.
    XIX века» вместе с докладной запиской Пулло, прямо называет подать наказанием: качкалыковцы, мичиковские чеченцы и ауховцы (чеченские общества восточной Чечни) «платят подать, которою обложены в наказание за неоднократные возмущения», а чеченцы, живущие за рекой Сунжей, «в наказание за возмущение, обложены податью»(Citation: 126).
    Деньги выжимались исправно: генерал Граббе, командующий войсками Кавказской линии и начальник Пулло, рапортом военному министру империи Чернышеву от 23 марта 1840 года назвал исправную уплату податей признаком наступившего «спокойствия» - рапорт перечисляет «исправномъ платежѣ податей и повинностей» за считанные недели до восстания(Citation: 106).
    Мухаммед-Тахир аль-Карахи, хронист Шамиля (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию), назвал этот побор - по рублю с каждого дома и по ружью с каждых десяти домов - причиной, по которой чеченцы звали Шамиля.
