description:
  en: |-
    The method of the amanat-and-tribute system of Pullo, commander of the left flank of the Caucasus Line (a chain of imperial fortifications on the land of the Nokhchi), was deliberately induced fear.
    Pullo described it plainly in a memorandum of 1840: "by threatening all the unsubmissive communities with the annihilation of their property, I instilled in them such fear, brought them to such a state, that one after another they began to submit.
    From 1834 to 1840 the auls of the Michik people, the Aukhovites and the Salatavians that had broken away, of Greater and Lesser Chechnya, and the never-subjugated villages of the Ichkerians and the Gumbetovians recognized the authority of the Russian government" (the listed names are highland communities of Chechnya and neighboring Dagestan)(Citation: 126).
    Fear was not a side effect but a declared instrument: Pullo credits the submission of the communities as the direct result of threats of annihilation.
  uk: |-
    Методом аманатсько-податної системи Пулло, командувача лівого флангу Кавказької лінії (ланцюга імперських укріплень на землі нохчі), був навмисно наведений страх.
    Пулло в доповідній записці 1840 року описав це прямо: «погрожуючи всім непокірним товариствам і винищенням їхнього майна, я навів на них такий страх, привів їх у такий стан, що одні за одними почали підкорятися.
    З 1834 року по 1840 рік аули мічиковців, ауховців і салатавців, що відклалися, Великої і Малої Чечні і ніколи не підкорені селища ічкеринців і гумбетовців визнали владу російського уряду» (перелічені горські товариства Чечні і сусіднього Дагестану)(Citation: 126).
    Страх був не побічним ефектом, а заявленим інструментом: підпорядкування товариств Пулло ставить собі в заслугу як прямий результат погроз винищення.
  ru: |-
    Методом аманатско-податной системы Пулло, командующего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), был намеренно наводимый страх.
    Пулло в докладной записке 1840 года описал это прямо: «угрожая всем непокорным обществам и истреблением их имущества, я навел на них такой страх, привел их в такое положение, что одни за другими начали покоряться.
    С 1834 года по 1840 год отложившиеся аулы мичиковцев, ауховцев и салатавцев, Большой и Малой Чечни и никогда непокоренные селения ичкеринцев и гумбетовцев признали власть русского правительства» (перечислены горские общества Чечни и соседнего Дагестана)(Citation: 126).
    Страх был не побочным эффектом, а заявленным инструментом: подчинение обществ Пулло ставит в заслугу как прямой результат угроз истребления.
