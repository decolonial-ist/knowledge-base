description:
  en: |-
    The amanat-and-tribute system of Pullo, commander of the left flank of the Caucasus Line (a chain of imperial fortifications on the land of the Nokhchi), created within Chechen society a privileged layer with power over its compatriots.
    The offices of the overseers appointed by the empire over the auls (the pristavs) were handed by the empire to Chechens themselves: the imperial historian Yurov writes that the pristavs "were chosen predominantly, if not exclusively, from among the militiamen" - from the highland militia, armed units of highlanders in the empire's service(Citation: 134).
    The historian N. I. Pokrovsky showed the mechanics of the split: the office of pristav was unpaid, so only "certain representatives of strong families" could take it, and they "took advantage of the opportunity to use their power for further accumulation"; "by creating in Chechnya a local administration, Chechen by nationality, tsarism hoped to create at the same time the Chechen 'aristocracy' it so needed"(Citation: 129).
    The empire gave part of the society power and privileges over the rest and bound this layer to itself, not to the people: the handing of offices to the "strong families" is documented; the calculation of growing a loyal "aristocracy" was formulated by the historian N. I. Pokrovsky.
  uk: |-
    Аманатсько-податна система Пулло, командувача лівого флангу Кавказької лінії (ланцюга імперських укріплень на землі нохчі), створила всередині чеченського суспільства привілейований шар із владою над співвітчизниками.
    Посади призначених імперією наглядачів над аулами (приставів) імперія роздавала самим чеченцям: імперський історик Юров пише, що пристави «були обрані переважно, якщо не виключно, з міліціонерів» - з горської міліції, озброєних загонів горців на службі імперії(Citation: 134).
    Історик Н. І. Покровський показав механіку розколу: посада пристава не оплачувалася, тому обійняти її могли «тільки деякі представники сильних родин», і вони «користувалися слушною нагодою, щоб ужити свою владу для подальшого накопичення»; «створюючи в Чечні місцеву, за національністю чеченську, адміністрацію, царизм сподівався створити водночас і таку необхідну йому чеченську «аристократію»»(Citation: 129).
    Імперія дала частині суспільства владу і привілеї над рештою і прив'язала цей шар до себе, а не до народу: роздача посад «сильним родинам» задокументована; розрахунок на вирощування лояльної «аристократії» сформульований істориком Н. І. Покровським.
  ru: |-
    Аманатско-податная система Пулло, командующего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), создала внутри чеченского общества привилегированный слой с властью над соотечественниками.
    Должности назначенных империей надзирателей над аулами (приставов) империя раздавала самим чеченцам: имперский историк Юров пишет, что пристава «были выбраны преимущественно, если не исключительно, из милиционеров» - из горской милиции, вооружённых отрядов горцев на службе империи(Citation: 134).
    Историк Н. И. Покровский показал механику раскола: должность пристава не оплачивалась, поэтому занять её могли «только некоторые представители сильных семей», и они «пользовались удобным случаем, чтобы употребить свою власть для дальнейшего накопления»; «создавая в Чечне местную, по национальности чеченскую, администрацию, царизм надеялся создать в то же время и столь необходимую ему чеченскую «аристократию»»(Citation: 129).
    Империя дала части общества власть и привилегии над остальными и привязала этот слой к себе, а не к народу: раздача должностей «сильным семьям» документирована; расчёт на выращивание лояльной «аристократии» сформулирован историком Н. И. Покровским.
