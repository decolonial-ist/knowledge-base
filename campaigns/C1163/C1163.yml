name:
  en: The amanat-and-tribute system of colonel Pullo in the seized auls of Chechnya (1836-1840)
  uk: Аманатсько-податна система полковника Пулло у захоплених аулах Чечні (1836-1840)
  ru: Аманатско-податная система полковника Пулло в захваченных аулах Чечни (1836-1840)
description:
  en: |-
    From September 1836 to February 1840 Pullo, commander of the Sunzha Line and then of the left flank of the Caucasus Line (a chain of imperial fortifications on the land of the Nokhchi), built in the auls of Chechnya seized by the empire a system of coercion made of seven interlocking institutions: amanat hostages taken from the most respected families, a tribute of one silver ruble per saklia (house), pristavs - superintendents appointed by the empire, a ban on selling bread to the "nemirnye" (auls that had not submitted to the empire) and on pasturing their cattle on the plain, confiscation of weapons, forced felling of forests and clearings stretching 165 versts, and punishments "according to the degree of guilt" - up to the destruction of the villages themselves.
    Handing over the command, Pullo summed it up in a memorandum of 1840: "by threatening all the unsubmissive communities with the annihilation of their property, I instilled in them such fear, brought them to such a state, that one after another they began to submit"(Citation: 126).
    The system ended in an uprising.
    Hadji-Ali, a companion and chronicler of Shamil (Shamil - imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest), recorded: "As the oppressions of general Pullo over the Chechens intensified, so grew the requests of the latter to Shamil to come and free them"(Citation: 123).
    The imperial historian Yurov admitted both the cause and the culprit: "we ourselves assisted Shamil as only his true friends could have done"; "Rumors about the true causes of the uprising of Chechnya reached the attention of the Sovereign Emperor", after which general Grabbe, commander of the troops of the Caucasus Line and Pullo's superior, deemed it necessary "to immediately remove, under a plausible pretext, major-general Pullo from the administration of the left flank"(Citation: 134).
    In February 1840 lowland Chechnya rose and called upon Shamil - the system collapsed together with the career of its builder.
  uk: |-
    З вересня 1836 року по лютий 1840 року Пулло, командувач Сунженської лінії, а потім лівого флангу Кавказької лінії (ланцюга імперських укріплень на землі нохчі), вибудував у захоплених імперією аулах Чечні систему примусу із семи зчеплених інститутів: заручники-аманати з найшанованіших родин, подать по рублю сріблом із саклі (дому), призначені імперією наглядачі-пристави, заборона продавати хліб «немирним» (аулам, що не підкорилися імперії) і пасти їхню худобу на рівнині, вилучення зброї, примусова рубка лісу і просіки на 165 верст, кари «за ступенем провини» - аж до знищення самих поселень.
    Здаючи командування, Пулло підбив підсумок у доповідній записці 1840 року: «погрожуючи всім непокірним товариствам і винищенням їхнього майна, я навів на них такий страх, привів їх у такий стан, що одні за одними почали підкорятися»(Citation: 126).
    Система закінчилася повстанням.
    Гаджі-Алі, супутник і хроніст Шаміля (Шаміль - імам, керівник спротиву горців Дагестану і Чечні російському завоюванню), записав: «У міру того, як посилювалися утиски генерала Пулло над чеченцями, збільшувалися й прохання останніх до Шаміля, щоб він прийшов звільнити їх»(Citation: 123).
    Імперський історик Юров визнав і причину, і винуватця: «ми самі посприяли Шамілю, як тільки могли б це зробити справжні його друзі»; «Чутки про справжні причини повстання Чечні дійшли до відома Государя Імператора», після чого генерал Граббе, командувач військ Кавказької лінії і начальник Пулло, визнав за необхідне «негайно усунути, під пристойним приводом, генерал-майора Пулло від управління лівим флангом»(Citation: 134).
    У лютому 1840 року площинна Чечня піднялася і закликала Шаміля - система впала разом із кар'єрою її будівничого.
  ru: |-
    С сентября 1836 года по февраль 1840 года Пулло, командующий Сунженской линией, а затем левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), выстроил в захваченных империей аулах Чечни систему принуждения из семи сцепленных институтов: заложники-аманаты из самых уважаемых семейств, подать по рублю серебром с сакли (дома), назначенные империей надзиратели-приставы, запрет продавать хлеб «немирным» (не подчинившимся империи аулам) и пасти их скот на равнине, изъятие оружия, принудительная рубка леса и просеки на 165 вёрст, кары «по степени вины» - вплоть до уничтожения самих поселений.
    Сдавая командование, Пулло подвёл итог в докладной записке 1840 года: «угрожая всем непокорным обществам и истреблением их имущества, я навел на них такой страх, привел их в такое положение, что одни за другими начали покоряться»(Citation: 126).
    Система закончилась восстанием.
    Гаджи-Али, спутник и хронист Шамиля (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию), записал: «По мере того, как усиливались притеснения генерала Пулло над чеченцами, увеличивались и просьбы последних к Шамилю, чтобы он пришел освободить их»(Citation: 123).
    Имперский историк Юров признал и причину, и виновника: «мы сами посодействовали Шамилю, как только могли бы это сделать истинные его друзья»; «Слухи об истинных причинах восстания Чечни дошли до сведения Государя Императора», после чего генерал Граббе, командующий войсками Кавказской линии и начальник Пулло, счёл необходимым «немедленно удалить, под благовидным предлогом, генерал-маиора Пулло от управления левым флангом»(Citation: 134).
    В феврале 1840 года плоскостная Чечня поднялась и призвала Шамиля - система рухнула вместе с карьерой её строителя.
