description:
  ru: |-
    Назначенные империей надзиратели над аулами (пристава) в аманатско-податной системе Пулло, командующего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), систематически грабили жителей захваченных аулов Чечни под видом сборов.
    Имперский историк Юров описал механизм - пристава жили с поборов, поскольку «не все пристава получали жалованье»: у чеченцев «под предлогом взимания податей и штрафов, отбиралось лучшее оружие и другие совершенно безвредные, но ценные вещи повседневного обихода; случалось, что ни в чем неповинных людей арестовывали по наущению простых и часто неблагонамеренных переводчиков... во время же экспедиций допускались принудительные сборы»(Citation: 134).
    Империя знала и не слушала: историки Я. З. Ахмадов и Э. Х. Хасмагомадов пишут по архивным документам, что двое чеченских старшин привезли кабардинскому князю Бековичу-Черкасскому, служившему империи и влиятельному на реке Терек, «прошение от многих чеченцев составленное, в коем они жалуются на притеснения и несправедливости генерал-майора Пулло» - князь отказался прошение принять(Citation: 125); по Юрову, чеченцы «приготовили было на него прошение, но не осмелились пустить его в ход из боязни, что генерал этот по-прежнему останется их начальником»(Citation: 134).
    Имперский обзор «Край в политическом и военном отношениях», направленный военным министром империи Чернышевым генералу Нейдгарту, который вскоре возглавил имперские войска на Кавказе, 2 апреля 1842 года, подвёл итог: «пользуясь злоупотреблениями, поборами и негодованием, происшедшим от отобрания оружия, Шамиль мало-помалу возмутил всю Чечню» (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию)(Citation: 129).
  en: |-
    The overseers appointed by the empire over the auls (the pristavs), within the amanat-and-tribute system of Pullo, commander of the left flank of the Caucasus Line (a chain of imperial fortifications on the land of the Nokhchi), systematically robbed the inhabitants of the seized auls of Chechnya under the guise of collections.
    The imperial historian Yurov described the mechanism - the pristavs lived off exactions, since "not all pristavs received a salary": from the Chechens, "under the pretext of collecting tributes and fines, the best weapons were taken away, and other entirely harmless but valuable articles of everyday use; it happened that people innocent of anything were arrested at the prompting of simple and often ill-intentioned interpreters... and during expeditions forced collections were permitted"(Citation: 134).
    The empire knew and would not listen: the historians Ya.
    Z. Akhmadov and E. Kh.
    Khasmagomadov write from archival documents that two Chechen elders brought to the Kabardian prince Bekovich-Cherkassky, who served the empire and was influential on the Terek river, "a petition drawn up on behalf of many Chechens, in which they complain of the oppressions and injustices of major-general Pullo" - the prince refused to accept the petition(Citation: 125); according to Yurov, the Chechens "had prepared a petition against him, but did not dare to set it in motion for fear that this general would remain their superior as before"(Citation: 134).
    The empire's survey "The Region in Political and Military Respects", sent by the empire's Minister of War Chernyshev to general Neidhardt, who soon headed the empire's troops in the Caucasus, on 2 April 1842, summed it up: "taking advantage of the abuses, the exactions and the indignation arising from the confiscation of weapons, Shamil little by little stirred all Chechnya to revolt" (Shamil - imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest)(Citation: 129).
  uk: |-
    Призначені імперією наглядачі над аулами (пристави) в аманатсько-податній системі Пулло, командувача лівого флангу Кавказької лінії (ланцюга імперських укріплень на землі нохчі), систематично грабували жителів захоплених аулів Чечні під виглядом зборів.
    Імперський історик Юров описав механізм - пристави жили з поборів, оскільки «не всі пристави отримували жалування»: у чеченців «під приводом стягнення податей і штрафів відбиралася найкраща зброя та інші цілком нешкідливі, але цінні речі повсякденного вжитку; траплялося, що ні в чому не винних людей арештовували за намовою простих і часто неблагонамірених перекладачів... під час же експедицій допускалися примусові збори»(Citation: 134).
    Імперія знала і не слухала: історики Я. З. Ахмадов і Е. Х. Хасмагомадов пишуть за архівними документами, що двоє чеченських старшин привезли кабардинському князю Бековичу-Черкаському, який служив імперії і був впливовим на річці Терек, «прохання, складене від багатьох чеченців, у якому вони скаржаться на утиски і несправедливості генерал-майора Пулло» - князь відмовився прохання прийняти(Citation: 125); за Юровим, чеченці «приготували було на нього прохання, але не наважилися пустити його в хід з остраху, що генерал цей, як і раніше, залишиться їхнім начальником»(Citation: 134).
    Імперський огляд «Край у політичному і військовому відношеннях», направлений військовим міністром імперії Чернишовим генералу Нейдгарту, який невдовзі очолив імперські війська на Кавказі, 2 квітня 1842 року, підбив підсумок: «користуючись зловживаннями, поборами і обуренням, що виникло від відібрання зброї, Шаміль мало-помалу збурив усю Чечню» (Шаміль - імам, керівник спротиву горців Дагестану і Чечні російському завоюванню)(Citation: 129).
