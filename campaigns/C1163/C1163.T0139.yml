description:
  en: |-
    The amanat-and-tribute system of Pullo, commander of the left flank of the Caucasus Line (a chain of imperial fortifications on the land of the Nokhchi), was anchored by new fortifications on Chechen land.
    The Chechen writer Abuzar Aydamirov records the founding of the Umakhan-Yurt fortification on the Sunzha river in 1837(Citation: 127).
    The plan of general Golovin, commander of the Separate Caucasus Corps (the head of the empire's troops in the Caucasus), for 1840 prescribed "to build a fortification at Cherkey and near old Aksai (at Gerzel-aul)" - Gerzel-aul stands on the border of Chechnya and the Kumyk plain; the construction went on all winter: the imperial historian Yurov writes that in March 1840 Pullo was personally "at Gerzel-aul to bring it into a better defensive condition", and the fortification "was finished after a fashion"(Citation: 134).
  uk: |-
    Аманатсько-податну систему Пулло, командувача лівого флангу Кавказької лінії (ланцюга імперських укріплень на землі нохчі), закріплювали нові укріплення на чеченській землі.
    Чеченський письменник Абузар Айдаміров фіксує закладення укріплення Умахан-Юрт на річці Сунжі в 1837 році(Citation: 127).
    План генерала Головіна, командира Окремого Кавказького корпусу (голови імперських військ на Кавказі), на 1840 рік приписував «звести укріплення біля Черкея і поблизу старого Аксая (при Герзель-аулі)» - Герзель-аул стоїть на межі Чечні і Кумицької рівнини; будівництво йшло всю зиму: імперський історик Юров пише, що в березні 1840 року Пулло особисто перебував «у Герзель-аулі для приведення його в кращий оборонний стан», і укріплення «вдалося закінчити з гріхом пополам»(Citation: 134).
  ru: |-
    Аманатско-податную систему Пулло, командующего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), закрепляли новые укрепления на чеченской земле.
    Чеченский писатель Абузар Айдамиров фиксирует закладку укрепления Умахан-Юрт на реке Сунже в 1837 году(Citation: 127).
    План генерала Головина, командира Отдельного Кавказского корпуса (главы имперских войск на Кавказе), на 1840 год предписывал «возвести укрепление у Черкея и близь старого Аксая (при Герзель-ауле)» - Герзель-аул стоит на границе Чечни и Кумыкской равнины; строительство шло всю зиму: имперский историк Юров пишет, что в марте 1840 года Пулло лично находился «в Герзель-ауле для приведения его в лучшее оборонительное состояние», и укрепление «удалось окончить с грехом пополам»(Citation: 134).
