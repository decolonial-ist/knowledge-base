description:
  ru: |-
    Аманатско-податная система Пулло, командующего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), держалась на карательных выходах войск против захваченных аулов Чечни.
    Пулло в докладной записке 1840 года описал практику: «являлся я неожиданно перед изумленным населением самых отдаленных аулов и по степени вины селения или истреблял оное или довольствовался наложением пени, взиманием аманатов и арестованием наиболее виновных лиц» (пеня - денежный штраф; аманаты - заложники, которых империя забирала у аулов; «истребление» селения в имперском лексиконе - уничтожение построек и имущества, не жителей); аулы, заподозренные в связях с сопротивлением, «были немедленно наказываемы пенями, арестованием неблагонамеренных людей, а в крайних случаях даже истреблением аулов»(Citation: 126).
    Кара - административная рутина системы: уничтожение поселения стоит в одном ряду с пенями и арестами как ступень наказания.
  en: |-
    The amanat-and-tribute system of Pullo, commander of the left flank of the Caucasus Line (a chain of imperial fortifications on the land of the Nokhchi), rested on punitive sorties of the troops against the seized auls of Chechnya.
    Pullo described the practice in a memorandum of 1840: "I would appear unexpectedly before the astonished population of the most remote auls and, according to the degree of the village's guilt, either annihilated it or contented myself with imposing a fine, taking amanats and arresting the most guilty persons" (a fine here is a monetary penalty; amanats - hostages whom the empire took away from the auls; the "annihilation" of a village in the imperial lexicon means the destruction of its buildings and property, not of its inhabitants); auls suspected of ties with the resistance "were immediately punished with fines, with the arrest of ill-intentioned people, and in extreme cases even with the annihilation of auls"(Citation: 126).
    Punishment is the administrative routine of the system: the destruction of a village stands in one row with fines and arrests as a grade of punishment.
  uk: |-
    Аманатсько-податна система Пулло, командувача лівого флангу Кавказької лінії (ланцюга імперських укріплень на землі нохчі), трималася на каральних виходах військ проти захоплених аулів Чечні.
    Пулло в доповідній записці 1840 року описав практику: «з'являвся я несподівано перед враженим населенням найвіддаленіших аулів і за ступенем провини селища або винищував його, або задовольнявся накладенням пені, стягненням аманатів і арештом найбільш винних осіб» (пеня - грошовий штраф; аманати - заручники, яких імперія забирала в аулів; «винищення» селища в імперському лексиконі - знищення будівель і майна, не жителів); аули, запідозрені у зв'язках зі спротивом, «були негайно карані пенями, арештом неблагонамірених людей, а в крайніх випадках навіть винищенням аулів»(Citation: 126).
    Кара - адміністративна рутина системи: знищення поселення стоїть в одному ряду з пенями й арештами як ступінь покарання.
