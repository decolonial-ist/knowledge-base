description:
  ru: |-
    Частью аманатско-податной системы Пулло, командующего левым флангом Кавказской линии (цепи имперских укреплений на земле нохчи), был режим экономической блокады не подчинившихся аулов Чечни.
    Пулло в докладной записке 1840 года: назначенные империей надзиратели над аулами (приставы) и войска «прекратили сношения покорных с непокорными и запрещали первым продавать хлеб немирным и пасти их скот на своих полях» («немирные» - в имперском лексиконе аулы, не подчинившиеся империи)(Citation: 126).
    Разрешённая торговля была загнана под контроль: «В Кизляре и на некоторых других пунктах открылись торжища» - обмен шёл только в пунктах, контролируемых империей(Citation: 126).
    Действие блокады признали её же авторы: генерал Граббе, командующий войсками Кавказской линии и начальник Пулло, рапортом военному министру империи Чернышеву от 23 марта 1840 года писал, что горные аулы «не могли уже имѣть хлѣбопашества и пастбища на равнинѣ», что «усугубило еще бѣдственное положеніе жителей нагорной Чечни»; часть жителей думала подчиниться «для отвращенія голода», другие решили «избавиться отъ Русскаго ига»(Citation: 106).
    В составленном в 1840 году плане завоевания горцев левого фланга («Предположеніе... къ покоренію племенъ») Граббе сформулировал механизм действия блокады: надзор приставов «непокорнымъ... угрожалъ голодомъ.
    Шамиль воспользовался этимъ расположеніемъ умовъ» (Шамиль - имам, руководитель сопротивления горцев Дагестана и Чечни российскому завоеванию)(Citation: 106).
  en: |-
    Part of the amanat-and-tribute system of Pullo, commander of the left flank of the Caucasus Line (a chain of imperial fortifications on the land of the Nokhchi), was a regime of economic blockade of the auls of Chechnya that had not submitted.
    Pullo in a memorandum of 1840: the overseers appointed by the empire over the auls (the pristavs) and the troops "cut off the relations of the submitted with the unsubdued and forbade the former to sell bread to the nemirnye and to pasture their cattle on their fields" ("nemirnye" - in the imperial lexicon, auls that had not submitted to the empire)(Citation: 126).
    The permitted trade was driven under control: "In Kizlyar and at some other points trading fairs opened" - exchange took place only at points controlled by the empire(Citation: 126).
    The workings of the blockade were admitted by its own authors: general Grabbe, commander of the troops of the Caucasus Line and Pullo's superior, in a report to the empire's Minister of War Chernyshev of 23 March 1840, wrote that the mountain auls "could no longer have tillage and pasture on the plain", which "further aggravated the distressed condition of the inhabitants of highland Chechnya"; some of the inhabitants thought of submitting "to avert famine", others resolved "to rid themselves of the Russian yoke"(Citation: 106).
    In a plan for the conquest of the highlanders of the left flank drawn up in 1840 (the "Proposition... for the subjugation of the tribes"), Grabbe formulated how the blockade worked: the pristavs' surveillance "threatened the unsubdued with famine.
    Shamil took advantage of this disposition of minds" (Shamil - imam, leader of the resistance of the highlanders of Dagestan and Chechnya to the Russian conquest)(Citation: 106).
  uk: |-
    Частиною аманатсько-податної системи Пулло, командувача лівого флангу Кавказької лінії (ланцюга імперських укріплень на землі нохчі), був режим економічної блокади аулів Чечні, що не підпорядкувалися.
    Пулло в доповідній записці 1840 року: призначені імперією наглядачі над аулами (пристави) і війська «припинили зносини покірних з непокірними і забороняли першим продавати хліб немирним і пасти їхню худобу на своїх полях» («немирні» - в імперському лексиконі аули, що не підпорядкувалися імперії)(Citation: 126).
    Дозволена торгівля була загнана під контроль: «У Кизлярі і на деяких інших пунктах відкрилися торжища» - обмін йшов тільки в пунктах, контрольованих імперією(Citation: 126).
    Дію блокади визнали її ж автори: генерал Граббе, командувач військ Кавказької лінії і начальник Пулло, рапортом військовому міністру імперії Чернишову від 23 березня 1840 року писав, що гірські аули «не могли вже мати хліборобства і пасовищ на рівнині», що «посилило ще бідування жителів нагірної Чечні»; частина жителів думала підпорядкуватися «для відвернення голоду», інші вирішили «позбутися Російського іга»(Citation: 106).
    У складеному 1840 року плані завоювання горців лівого флангу («Припущення... до підкорення племен») Граббе сформулював механізм дії блокади: нагляд приставів «непокірним... загрожував голодом.
    Шаміль скористався цим настроєм умів» (Шаміль - імам, керівник спротиву горців Дагестану і Чечні російському завоюванню)(Citation: 106).
