description:
  ru: 'Центральная власть Московского Царства использовала назначенного правителя для юридического подчинения региона: в 1676 году Посольский приказ направил предписание кабардинскому князю Каспулату Муцаловичу Черкасскому о необходимости прибытия в Терский город «для приведения к присяге населения Северного Кавказа царям Ивану и Петру Алексеевичам»(Citation: 92).'
  en: 'The central authorities of the Tsardom of Muscovy used an appointed ruler for the legal subordination of the region: in 1676 the Posolsky Prikaz sent an instruction to the Kabardian prince Kaspulat Mutsalovich Cherkassky on the necessity of arriving at the Terek town «to administer the oath of the population of the North Caucasus to Tsars Ivan and Peter Alekseevich»(Citation: 92).'
  uk: 'Центральна влада Московського царства використовувала призначеного правителя для юридичного підпорядкування регіону: у 1676 році Посольський приказ надіслав припис кабардинському князеві Каспулату Муцаловичу Черкаському про необхідність прибуття в Терське місто «для приведення до присяги населення Північного Кавказу царям Івану та Петру Олексійовичам»(Citation: 92).'
