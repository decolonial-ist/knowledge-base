description:
  ru: 'Назначенная подконтрольная администрация направляла подчиненных нохчи (окочан) для участия в Крымских походах метрополии: в отписке кабардинского князя Каспулата Муцаловича Черкасского в Посольский приказ от 1675 года констатируется, что для похода в крымские улусы в его распоряжении находились «окоченям 190 человеком»(Citation: 92); историк И. Х. Тхамокова дополняет, что в 1675 году в Крыму вместе с князем воевали отряды «с узденями, с новокрещенами и «окочанами»»(Citation: 85).'
  en: |-
    The appointed controlled administration sent subordinated Nokhchi (Okochans) to take part in the metropole's Crimean campaigns: a dispatch from the Kabardian prince Kaspulat Mutsalovich Cherkassky to the Posolsky Prikaz in 1675 states that for the campaign against the Crimean ulusy he had at his disposal «190 Okochan men»(Citation: 92); the historian I. Kh.
    Tkhamokova adds that in 1675 detachments fought in Crimea alongside the prince «with uzdens, with the newly baptized, and with «Okochans»»(Citation: 85).
  uk: 'Призначена підконтрольна адміністрація направляла підпорядкованих Нохчі (Окочан) для участі в Кримських походах метрополії: у відписці кабардинського князя Каспулата Муцаловича Черкаського до Посольського приказу від 1675 року констатовано, що для походу на кримські улуси в його розпорядженні перебували «Окочан 190 людей»(Citation: 92); історикиня І. Х. Тхамокова додає, що 1675 року в Криму разом із князем воювали загони «з узденями, з новохрещенами та «Окочанами»»(Citation: 85).'
