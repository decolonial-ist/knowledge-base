name:
  en: Establishment of Alien Governance and the Mobilization of the Nokhchi for the Crimean Campaigns (1661–1676)
  uk: Встановлення чужорідного управління та мобілізація Нохчі в Кримські походи (1661–1676)
  ru: Установление чужеродного управления и мобилизация нохчи в Крымские походы (1661–1676)
description:
  en: |-
    The occupation administration of the Tsardom of Muscovy maintained a regime that deprived the subordinated societies of the Nokhchi (the Okochans) of autonomy in the Terek town, prolonging the power over them of a loyal foreign ruler for their subsequent mobilization.
    In 1661, Tsar Aleksei Mikhailovich issued a charter of grant to the Kabardian prince Kaspulat Mutsalovich Cherkassky, officially prescribing that he «be prince over the Okochans and over the Cherkasses who serve us, the great sovereign, on the Terek, and administer and judge them in military organization and in all our affairs»(Citation: 82).
    Having received control, the appointed ruler became an instrument for implementing imperial objectives: in 1676, the central apparatus of the Ambassadorial Prikaz sent an instruction to Prince Kaspulat Mutsalovich Cherkassky on the need to arrive at the Terek «to administer the oath of allegiance of the population of the North Caucasus to Tsars Ivan and Peter Alekseevich»(Citation: 92).
    In the same period, the subordinated Nokhchi were forcibly thrown into the metropole's military campaigns against the Crimean Khanate.
    A dispatch from Prince Kaspulat Mutsalovich Cherkassky to the Ambassadorial Prikaz of 1675 states that for the campaign into the Crimean uluses he had at his disposal various fighting men, including «190 Okochan men»(Citation: 92), and the historian I. Kh.
    Tkhamokova confirms that in 1675 detachments fought in Crimea that included men «with uzdens, with the newly baptized, and with «Okochans»»(Citation: 85).
  uk: |-
    Окупаційна адміністрація Московського царства підтримувала режим позбавлення підпорядкованих суспільств Нохчі (Окочан) самостійності в Терському місті, пролонгувавши владу над ними лояльного іноземного правителя для їхньої подальшої мобілізації.
    У 1661 році цар Олексій Михайлович видав жалувану грамоту кабардинському князеві Каспулату Муцаловичу Черкаському, офіційно приписавши йому «над Окочанами і над Черкасами, які нам, великому государю, служать на Терку, бути князем, і їх у ратній справі та в усіх наших ділах відати й судити»(Citation: 82).
    Отримавши контроль, призначений правитель став інструментом реалізації імперських завдань: у 1676 році центральний апарат Посольського приказу направив припис князеві Каспулату Муцаловичу Черкаському про необхідність прибуття на Терек «для приведення до присяги населення Північного Кавказу царям Івану і Петру Олексійовичам»(Citation: 92).
    У той самий період підпорядковані Нохчі були примусово кинуті у воєнні походи метрополії проти Кримського ханства.
    У відписці князя Каспулата Муцаловича Черкаського до Посольського приказу від 1675 року констатується, що для походу в кримські улуси в його розпорядженні перебували різні ратні люди, зокрема «Окочан 190 чоловік»(Citation: 92), а історик І. Х. Тхамокова підтверджує, що в 1675 році в Криму воювали загони, у яких були «з узденями, з новохрещеними і «Окочанами»»(Citation: 85).
  ru: |-
    Оккупационная администрация Московского Царства поддерживала режим лишения подчиненных обществ нохчи (окочан) самостоятельности в Терском городе, пролонгировав власть над ними лояльного иностранного правителя для их последующей мобилизации.
    В 1661 году царь Алексей Михайлович издал жалованную грамоту кабардинскому князю Каспулату Муцаловичу Черкасскому, официально предписав ему «над окочаны и над черкасы, которые нам, великому государю, служат на Терке, быти князем, и их в ратном строенье и во всяких наших делех ведать и судить»(Citation: 82).
    Получив контроль, назначенный правитель стал инструментом реализации имперских задач: в 1676 году центральный аппарат Посольского приказа направил предписание князю Каспулату Муцаловичу Черкасскому о необходимости прибытия на Терек «для приведения к присяге населения Северного Кавказа царям Ивану и Петру Алексеевичам»(Citation: 92).
    В этот же период подчиненные нохчи были принудительно брошены в военные походы метрополии против Крымского ханства.
    В отписке князя Каспулата Муцаловича Черкасского в Посольский приказ от 1675 года констатируется, что для похода в крымские улусы в его распоряжении находились различные ратные люди, в том числе «окоченям 190 человеком»(Citation: 92), а историк И. Х. Тхамокова подтверждает, что в 1675 году в Крыму воевали отряды, в которых были «с узденями, с новокрещенами и «окочанами»»(Citation: 85).
