description:
  ru: |-
    В 1835-1836 годах полковник Пулло, начальник Сунженской укреплённой линии, вёл систематические экспедиции против чеченских селений, поддерживавших имама Ташу-Хаджи.
    Имперское обозрение военных действий признаёт: попытки Ташу-Хаджи «своевременно были предупреждаемы экспедициями начальника Сунженской линии полк.
    Пулло, наносившими полное разорение жителям»(Citation: 105). 23 августа 1836 Пулло скрытным ночным маршем вывел отряд к аулу Зандак на реке Яман-су.
    Корпусный командир Розен доносил военному министру о цели: «для поколебания влияния Ташев-Хаджи и укрощения волнения между Чеченцами и наведения на них страха, решился предпринять движения для наказания жителей дер.
    Зандак»(Citation: 105).
  en: |-
    In 1835–1836, Colonel Pullo, chief of the Sunzha fortified line, conducted systematic expeditions against Chechen villages that supported Imam Tashu-Hajji.
    The imperial review of military operations acknowledges: Tashu-Hajji’s attempts “were preempted in good time by the expeditions of the chief of the Sunzha line, Col. Pullo, which inflicted utter ruin on the residents”(Citation: 105).
    On August 23, 1836, Pullo led a detachment by a covert night march to the aul of Zandak on the Yaman-su River.
    Corps commander Rosen reported to the Minister of War on the objective: “in order to shake the influence of Tashev-Hajji and to quell the unrest among the Chechens and instill fear in them, I resolved to undertake movements to punish the residents of the village of Zandak”(Citation: 105).
  uk: |-
    У 1835–1836 роках полковник Пулло, начальник Сунженської укріпленої лінії, вів систематичні експедиції проти чеченських селищ, які підтримували імама Ташу-Хаджі.
    Імперський огляд воєнних дій визнає: спроби Ташу-Хаджі «своєчасно попереджалися експедиціями начальника Сунженської лінії полк.
    Пулло, що завдавали жителям цілковитого розорення»(Citation: 105). 23 серпня 1836 року Пулло прихованим нічним маршем вивів загін до аулу Зандак на річці Яман-су.
    Корпусний командир Розен доносив військовому міністрові про мету: «щоб похитнути вплив Ташев-Хаджі та приборкати хвилювання між Чеченцями й навести на них страх, вирішив здійснити рухи для покарання жителів с.
    Зандак»(Citation: 105).
