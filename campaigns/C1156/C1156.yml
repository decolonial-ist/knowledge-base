name:
  ru: 'Тайная разведка Чечни топографами Розена и разорение Зандака отрядом Пулло: пленение 31 жителя и угон скота (1835-1836)'
  en: 'Covert reconnaissance of Chechnya by Rosen''s topographers and the devastation of Zandak by Pullo''s detachment: capture of 31 inhabitants and seizure of livestock (1835-1836)'
  uk: 'Таємна розвідка Чечні топографами Розена та розорення Зандака загоном Пулло: полон 31 жителя і викрадення худоби (1835-1836)'
description:
  ru: |-
    В 1835-1836 годах империя сочетала в Чечне систематические карательные экспедиции с тайной разведкой территории.
    Корпусный командир Розен в отчёте императору признаёт практику скрытного изучения не подчинившихся земель: предприятия «состояли или в собрании топографических сведений... или в скрытных обозрениях земель неприязненных нам горцев»; «в 1836 году, для обозрения прямого пути, идущего из Кахетии в Чечню, послан был топограф, который, пройдя чрез снеговой хребет, вышел на Кавказскую Линию в кр.
    Грозную, а оттуда чрез Чечню, земли Кистинцев и Дидойцев, возвратился в Кахетию»; тогда же «послан был мною из Владикавказа л.-гв.
    Гренадерского полка прап. кн.
    Уцмиев с топографом, чрез Чечню, в Андию»(Citation: 105).
    Против движения имама Ташу-Хаджи полковник Пулло, начальник Сунженской укреплённой линии, вёл постоянные экспедиции; имперское обозрение военных действий признаёт: попытки Ташу-Хаджи «своевременно были предупреждаемы экспедициями начальника Сунженской линии полк.
    Пулло, наносившими полное разорение жителям»(Citation: 105). 23 августа 1836 отряд Пулло скрытным ночным маршем вышел к аулу Зандак на реке Яман-су, где находился Ташу-Хаджи.
    Розен доносил военному министру: Пулло «для поколебания влияния Ташев-Хаджи и укрощения волнения между Чеченцами и наведения на них страха, решился предпринять движения для наказания жителей дер.
    Зандак»; «внезапное появление наших войск навело ужас на жителей»; пехота, вытеснив защитников, захватила «в плен 31 душу мужского и женского пола.
    Кроме того в добычу нашим войскам досталось имущество жителей и 384 штуки рогатого скота»; перед отступлением истреблены дома мюридов и «других главнейших приверженцев Ташев-Хаджи»(Citation: 105).
    Чеченский писатель Абузар Айдамиров в «Хронологии истории Чечено-Ингушетии» фиксировал: «Карательная экспедиция полковника Пулло в аулы на р. Яман-Су.
    Уничтожение аула Зандак.
    Отступление отряда Пулло под натиском Ташав-хаджи в крепость Внезапную»(Citation: 127).
  en: |-
    In 1835–1836 the empire combined systematic punitive expeditions in Chechnya with covert reconnaissance of the territory.
    Corps commander Rosen, in a report to the emperor, admits the practice of clandestine study of unsubdued lands: the undertakings "consisted either in the collection of topographical information... or in covert surveys of the lands of the mountaineers hostile to us"; "in 1836, to survey the direct route leading from Kakheti to Chechnya, a topographer was sent, who, having crossed the snowy ridge, came out onto the Caucasian Line at the fortress of Groznaya, and from there, through Chechnya and the lands of the Kists and the Didoi, returned to Kakheti"; at the same time "I sent from Vladikavkaz Ensign Prince Utsmiev of the Life Guards Grenadier Regiment with a topographer, through Chechnya, to Andia"(Citation: 105).
    Against the movement of Imam Tashu-Hajji, Colonel Pullo, commander of the Sunzha fortified line, conducted constant expeditions; the imperial review of military operations admits: Tashu-Hajji's attempts "were forestalled in good time by the expeditions of the commander of the Sunzha Line, Colonel Pullo, which inflicted total ruin on the inhabitants"(Citation: 105).
    On August 23, 1836, Pullo's detachment, in a covert night march, reached the aul of Zandak on the Yaman-su River, where Tashu-Hajji was staying.
    Rosen reported to the minister of war: Pullo, "in order to shake the influence of Tashev-Hajji, to quell the unrest among the Chechens, and to instill fear in them, resolved to undertake movements to punish the inhabitants of the village of Zandak"; "the sudden appearance of our troops struck terror into the inhabitants"; the infantry, having driven out the defenders, seized "31 souls of male and female sex as prisoners.
    In addition, the property of the inhabitants and 384 head of horned cattle fell to our troops as booty"; before the withdrawal, the houses of the murids and of "other principal adherents of Tashev-Hajji" were annihilated(Citation: 105).
    The Chechen writer Abuzar Aydamirov, in his "Chronology of the History of Checheno-Ingushetia," recorded: "Punitive expedition of Colonel Pullo to the auls on the Yaman-Su River.
    Destruction of the aul of Zandak.
    Retreat of Pullo's detachment, under the pressure of Tashav-Hajji, to the fortress of Vnezapnaya"(Citation: 127).
  uk: |-
    У 1835–1836 роках імперія поєднувала в Чечні систематичні каральні експедиції з таємною розвідкою території.
    Корпусний командир Розен у звіті імператорові визнає практику прихованого вивчення непокірних земель: заходи «полягали або у зборі топографічних відомостей... або в прихованих оглядах земель неприязних нам горців»; «1836 року, для огляду прямого шляху, що йде з Кахетії в Чечню, послано було топографа, який, пройшовши через сніговий хребет, вийшов на Кавказьку лінію у кр.
    Грозну, а звідти через Чечню, землі Кістинців і Дідойців, повернувся в Кахетію»; тоді ж «послано було мною з Владикавказа л.-гв.
    Гренадерського полку прап. кн.
    Уцмієва з топографом, через Чечню, в Андію»(Citation: 105).
    Проти руху імама Ташу-Хаджі полковник Пулло, начальник Сунженської укріпленої лінії, вів постійні експедиції; імперський огляд воєнних дій визнає: спроби Ташу-Хаджі «своєчасно попереджалися експедиціями начальника Сунженської лінії полк.
    Пулло, що завдавали цілковитого розорення жителям»(Citation: 105). 23 серпня 1836 загін Пулло прихованим нічним маршем вийшов до аулу Зандак на річці Яман-су, де перебував Ташу-Хаджі.
    Розен доповідав військовому міністрові: Пулло, «для похитнення впливу Ташев-Хаджі та приборкання хвилювання між Чеченцями й наведення на них страху, зважився здійснити рухи для покарання жителів с.
    Зандак»; «раптова поява наших військ навела жах на жителів»; піхота, витіснивши захисників, захопила «в полон 31 душу чоловічої та жіночої статі.
    Крім того, у здобич нашим військам дісталося майно жителів і 384 голови рогатої худоби»; перед відступом винищено будинки мюридів та «інших найголовніших прихильників Ташев-Хаджі»(Citation: 105).
    Чеченський письменник Абузар Айдаміров у «Хронології історії Чечено-Інгушетії» фіксував: «Каральна експедиція полковника Пулло в аули на р. Яман-Су.
    Знищення аулу Зандак.
    Відступ загону Пулло під натиском Ташав-хаджі у фортецю Внезапну»(Citation: 127).
