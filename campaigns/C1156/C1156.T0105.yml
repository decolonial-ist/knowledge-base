description:
  ru: |-
    23 августа 1836 отряд полковника Пулло, начальника Сунженской укреплённой линии, разорил аул Зандак на реке Яман-су.
    Корпусный командир Розен доносил военному министру об истреблении в ауле домов мюридов и «других главнейших приверженцев Ташев-Хаджи»(Citation: 105).
    Чеченский писатель Абузар Айдамиров в «Хронологии истории Чечено-Ингушетии» фиксировал: «Карательная экспедиция полковника Пулло в аулы на р. Яман-Су.
    Уничтожение аула Зандак»(Citation: 127).
  en: |-
    On August 23, 1836, the detachment of Colonel Pullo, chief of the Sunzha fortified line, ravaged the aul of Zandak on the Yaman-su River.
    Corps commander Rosen reported to the Minister of War on the destruction in the aul of the houses of murids and of “other principal adherents of Tashev-Hajji”(Citation: 105).
    The Chechen writer Abuzar Aydamirov, in his “Chronology of the History of Checheno-Ingushetia,” recorded: “Punitive expedition of Colonel Pullo to the auls on the Yaman-Su River.
    Destruction of the aul of Zandak”(Citation: 127).
  uk: |-
    23 серпня 1836 року загін полковника Пулло, начальника Сунженської укріпленої лінії, розорив аул Зандак на річці Яман-су.
    Корпусний командир Розен доносив військовому міністрові про знищення в аулі будинків мюридів та «інших найголовніших прихильників Ташев-Хаджі»(Citation: 105).
    Чеченський письменник Абузар Айдаміров у «Хронології історії Чечено-Інгушетії» фіксував: «Каральна експедиція полковника Пулло в аули на р. Яман-Су.
    Знищення аулу Зандак»(Citation: 127).
