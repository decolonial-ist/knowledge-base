description:
  ru: |-
    27 августа 1836 полковник Пулло принял в крепости Грозной вынужденную «покорность» аула Зандак на реке Яман-су, разорённого его отрядом 23 августа 1836 (кампания C1156).
    Подчинение было спроектировано самим разорением: в рапорте генералу Петрову от 27 августа 1836 Пулло признал: «Будучи же уверен, что жители Зандака по общим правилам чеченцев после наказания станут просить покорности, и считая таковую полезным для правительства, я не приказал жечь деревни»(Citation: 126).
    Тем же рапортом он зафиксировал состояние, в котором село шло к подчинению: разорение «привело как жителей деревни, так и всех живущих в окрестности оной в страх и уныние»(Citation: 126).
    Старшины прислали «просьбою о принятии их в покорность русскому правительству», и подданство было оформлено на условиях, продиктованных империей: верность, полный разрыв с руководителем чеченского сопротивления Ташу-Хаджи, запрет собраний, выдача русских пленных в обмен на жителей Зандака, захваченных при разорении, и установленная подать(Citation: 126).
    Факт и дату оформления Розен зафиксировал в донесении военному министру: «27-го августа старшины Зандаковские явились к командующему Сунженскою линиею с изъявлением покорности, которая установленным порядком и принята от них»(Citation: 105).
  en: |-
    On 27 August 1836, Colonel Pullo accepted at the Groznaya fortress the forced "submission" of the aul of Zandak on the Yaman-su river, devastated by his detachment on 23 August 1836 (campaign C1156).
    The subordination was engineered by the devastation itself: in a report to General Petrov dated 27 August 1836, Pullo admitted: "Being certain that the inhabitants of Zandak, following the common custom of the Chechens, would ask for submission after punishment, and considering such submission useful for the government, I did not order the village burned"(Citation: 126).
    The same report recorded the state in which the village went to its subordination: the devastation "brought both the inhabitants of the village and all those living in its vicinity into fear and despondency"(Citation: 126).
    The elders sent "a plea to be accepted into submission to the Russian government", and subjecthood was formalized on terms dictated by the empire: loyalty, a complete break with Tashu-Hadji, the leader of the Chechen resistance, a ban on assemblies, the handover of Russian captives in exchange for the inhabitants of Zandak seized during the devastation, and the established tribute(Citation: 126).
    Rozen recorded the fact and the date of the formalization in a dispatch to the Minister of War: "On 27 August the Zandak elders appeared before the commander of the Sunzha Line declaring their submission, which was accepted from them in the established order"(Citation: 105).
  uk: |-
    27 серпня 1836 полковник Пулло прийняв у фортеці Грозній вимушену «покірність» аулу Зандак на річці Яман-су, зруйнованого його загоном 23 серпня 1836 (кампанія C1156).
    Підпорядкування було спроєктоване самим руйнуванням: у рапорті генералу Петрову від 27 серпня 1836 Пулло визнав: «Будучи ж упевнений, що жителі Зандака за загальними правилами чеченців після покарання проситимуть покірності, і вважаючи таку корисною для уряду, я не наказав палити села»(Citation: 126).
    Тим же рапортом він зафіксував стан, у якому село йшло до підпорядкування: руйнування «привело як жителів села, так і всіх, хто живе в його околицях, у страх і зневіру»(Citation: 126).
    Старшини прислали «прохання про прийняття їх у покірність російському урядові», і підданство було оформлено на умовах, продиктованих імперією: вірність, повний розрив із керівником чеченського опору Ташу-Хаджі, заборона зібрань, видача російських полонених в обмін на жителів Зандака, захоплених під час руйнування, і встановлена подать(Citation: 126).
    Факт і дату оформлення Розен зафіксував у донесенні військовому міністру: «27-го серпня старшини Зандаківські з'явилися до командувача Сунженською лінією з виявленням покірності, яку встановленим порядком і прийнято від них»(Citation: 105).
