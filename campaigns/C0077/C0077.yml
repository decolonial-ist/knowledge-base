name:
  en: Forced Collectivization and Dekulakization (1928–1932)
  uk: Насильницька колективізація та розкуркулення (1928–1932)
  ru: Насильственная коллективизация и раскулачивание (1928–1932)
description:
  en: |-
    An assault on the traditional way of life of the Ukrainian village, which remained the principal bearer of national identity and economic independence.
    Under the slogans of socialist modernization, Moscow proclaimed the course of "the liquidation of the kulaks as a class": the secret Politburo resolution of January 30, 1930 ordered "to confiscate from the kulaks of these districts the means of production, livestock, farm and residential buildings, processing enterprises, fodder and seed stocks" and to send "60,000 to concentration camps and subject 150,000 kulaks to deportation to remote districts," of which for Ukraine - 15 thousand to concentration camps and 30–35 thousand to deportation(Citation: 240).
    Peasants who put up resistance were dispossessed en masse and deported to Siberia and the North(Citation: 22).
  uk: |-
    Наступ на традиційний уклад українського села, що залишалося головним носієм національної ідентичності та економічної самостійності.
    Під гаслами соціалістичної модернізації Москва проголосила курс «ліквідації куркульства як класу»: секретна постанова Політбюро від 30 січня 1930 року наказувала «конфіскувати в куркулів цих районів засоби виробництва, худобу, господарські та житлові будівлі, підприємства з переробки, кормові й насіннєві запаси» і направити «у концтабори 60000 і піддати виселенню у віддалені райони — 150000 куркулів», з них по Україні - 15 тисяч до концтаборів і 30–35 тисяч на висилку(Citation: 240).
    Селян, які чинили опір, масово розкуркулювали й депортували до Сибіру та на Північ(Citation: 22).
  ru: |-
    Наступление на традиционный уклад украинского села, остававшегося главным носителем национальной идентичности и экономической самостоятельности.
    Под лозунгами социалистической модернизации Москва провозгласила курс «ликвидации кулачества как класса»: секретное постановление Политбюро от 30 января 1930 года приказывало «конфисковать у кулаков этих районов средства производства, скот, хозяйственные и жилые постройки, предприятия по переработке, кормовые и семенные запасы» и направить «в концлагеря 60000 и подвергнуть выселению в отдаленные районы — 150000 кулаков», из них по Украине - 15 тысяч в концлагеря и 30–35 тысяч на высылку(Citation: 240).
    Крестьяне, оказывавшие сопротивление, массово раскулачивались и депортировались в Сибирь и на Север(Citation: 22).
