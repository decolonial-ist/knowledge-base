description:
  ru: 'Массовые аресты крестьян в ходе кампании раскулачивания: согласно директивам 1930 года, помимо депортаций, десятки тысяч человек отправлялись непосредственно в концентрационные лагеря для изоляции(Citation: 22).'
  en: 'Mass arrests of peasants during the dekulakization campaign: according to the 1930 directives, in addition to deportations, tens of thousands of people were sent directly to concentration camps for isolation(Citation: 22).'
  uk: 'Масові арешти селян під час кампанії розкуркулення: згідно з директивами 1930 року, окрім депортацій, десятки тисяч людей відправляли безпосередньо до концентраційних таборів для ізоляції(Citation: 22).'
