description:
  ru: 'Массовое лишение имущества и принудительное выселение сотен тысяч крестьян, оказывавших сопротивление (так называемых «куркулей»), в отдаленные спецпоселения Сибири и Севера(Citation: 22).'
  en: 'Mass dispossession and forced deportation of hundreds of thousands of resisting peasants (the so-called "kurkuls") to remote special settlements in Siberia and the North(Citation: 22).'
  uk: 'Масове позбавлення майна та примусове виселення сотень тисяч селян, які чинили опір (так званих «куркулів»), до віддалених спецпоселень Сибіру та Півночі(Citation: 22).'
