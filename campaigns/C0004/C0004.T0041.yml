description:
  ru: |-
    После силового принуждения к подписанию договора Москва перешла к прямой оккупации жизненного пространства автономии.
    Статьи закрепили расширение военного присутствия: «Кроме Киева, царские воеводы вводились в Переяслав, Чернигов, Нежин, Брацлав и Умань»(Citation: 195) – гарнизоны с воеводами обеспечивали физический контроль над территорией изнутри.
  en: |-
    After forcing the signing of the treaty, Moscow moved to the direct occupation of the autonomy's living space.
    The articles codified the expansion of the military presence: "besides Kyiv, tsarist voivodes were introduced into Pereiaslav, Chernihiv, Nizhyn, Bratslav, and Uman"(Citation: 195) – garrisons headed by voivodes ensured physical control over the territory from within.
  uk: |-
    Після силового примусу до підписання договору Москва перейшла до прямої окупації життєвого простору автономії.
    Статті закріпили розширення військової присутності: «Крім Києва, царські воєводи вводилися до Переяслава, Чернігова, Ніжина, Брацлава та Умані»(Citation: 195) – гарнізони з воєводами забезпечували фізичний контроль над територією зсередини.
