  uk: Переяславські статті (1659)
description:
  ru: |-
    Навязывание нового кабального договора Юрию Хмельницкому под давлением московских войск.
    Договор ликвидировал самостоятельность: «Украинское государство утрачивало самостоятельность и получало статус политической автономии в составе Российского государства»(Citation: 195).
  en: |-
    The imposition of a new enslaving treaty on Yurii Khmelnytsky under the pressure of Muscovite troops.
    The treaty abolished independence: "the Ukrainian state lost its independence and acquired the status of a political autonomy within the Russian state"(Citation: 195).
  uk: |-
    Нав'язування нового кабального договору Юрієві Хмельницькому під тиском московських військ.
    Договір ліквідовував самостійність: «Укр. д-ва втрачала самостійність і набувала статусу політ. автономії в складі Рос. держави»(Citation: 195).
