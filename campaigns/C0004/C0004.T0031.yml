description:
  ru: |-
    Воспользовавшись политическим кризисом и окружив лидеров автономии своими войсками, царство принудило их к подписанию нового, абсолютно кабального договора.
    Статьи превращали конфедеративную связь с Москвой в федеративную: «Переяславские статьи переводили конфедеративные связи Украины с Россией в форму федерации.
    Украинское государство утрачивало самостоятельность и получало статус политической автономии в составе Российского государства»(Citation: 195).
    Сама основа договора была подложной: «кн.
    Трубецкой воспользовался своим военным превосходством над Ю.Хмельницким, отклонил Жердевские статьи и принудил украинскую сторону принять 14 пунктов т. н. давних статей 1654 (которые в действительности являли собой фальсификат договора 1654)»(Citation: 195).
    Сами 14 навязанных пунктов опубликованы в «Собрании государственных грамот и договоров»(Citation: 398).
  en: |-
    Taking advantage of the political crisis and having surrounded the autonomy's leaders with its troops, the tsardom forced them to sign a new, utterly enslaving treaty.
    The articles turned the confederative bond with Moscow into a federative one: "the Pereiaslav Articles converted Ukraine's confederative ties with Russia into the form of a federation.
    The Ukrainian state lost its independence and acquired the status of a political autonomy within the Russian state"(Citation: 195).
    The very basis of the treaty was forged: "Prince Trubetskoy took advantage of his military superiority over Yu.
    Khmelnytsky, rejected the Zherdiv Articles and forced the Ukrainian side to accept 14 points of the so-called old articles of 1654 (which in reality constituted a falsification of the 1654 treaty)"(Citation: 195).
    The 14 imposed points themselves are published in the "Collection of State Charters and Treaties"(Citation: 398).
  uk: |-
    Скориставшись політичною кризою та оточивши лідерів автономії своїми військами, царство примусило їх підписати новий, абсолютно кабальний договір.
    Статті перетворювали конфедеративний зв'язок із Москвою на федеративний: «П[ереяславські] с[татті] переводили конфедеративні зв'язки України з Росією у форму федерації.
    Укр. д-ва втрачала самостійність і набувала статусу політ. автономії в складі Рос. держави»(Citation: 195).
    Сама основа договору була підробленою: «кн.
    О.Трубецькой скористався своєю воєнною перевагою над Ю.Хмельницьким, відхилив Жердівські статті і змусив укр. сторону прийняти 14 пунктів т. зв. давніх статей 1654 (що насправді являли собою фальсифікат договору 1654)»(Citation: 195).
    Самі 14 нав'язаних пунктів опубліковано в «Собрании государственных грамот и договоров»(Citation: 398).
