name:
  ru: Дипломатическая атака против расширения НАТО (2008)
  en: Diplomatic Attack Against NATO Enlargement (2008)
  uk: Дипломатична атака проти розширення НАТО (2008)
description:
  ru: |-
    Дипломатический шантаж со стороны В. Путина вокруг саммита НАТО в Бухаресте с целью заблокировать предоставление Украине Плана действий относительно членства (ПДЧ).
    Через два дня после саммита, на встрече с Дж.
    Бушем в Сочи, российский лидер отрицал украинскую государственность - Украина, по его словам, «не является нацией, сложившейся естественным образом», а представляет собой «искусственную страну, созданную ещё в советские времена»(Citation: 220) - и прямо угрожал ее расколом: «страна может просто развалиться», добавив, что, опираясь на антинатовские силы, «Россия будет постоянно создавать там проблемы»(Citation: 220).
    Ещё на самом саммите, по пересказу источника «Коммерсанта», Путин заявил Бушу: «Ты же понимаешь, Джордж, что Украина — это даже не государство!» - фактически пригрозив, «что Россия может начать отторжение Крыма и Восточной Украины»(Citation: 318).
  en: |-
    Diplomatic blackmail by V. Putin around the NATO summit in Bucharest aimed at blocking the granting of a Membership Action Plan (MAP) to Ukraine.
    Two days after the summit, at a meeting with G. Bush in Sochi, the Russian leader denied Ukrainian statehood - Ukraine, in his words, "is not a nation built in a natural manner" but "an artificial country created back in Soviet times"(Citation: 220) - and directly threatened its rupture: "the country could just split apart," adding that, relying on anti-NATO forces, "Russia would be creating problems there all the time"(Citation: 220).
    At the summit itself, as retold by Kommersant's source, Putin told Bush: "You understand, George, that Ukraine is not even a state!" - in effect threatening "that Russia could begin the severance of Crimea and Eastern Ukraine"(Citation: 318).
  uk: |-
    Дипломатичний шантаж з боку В. Путіна навколо саміту НАТО в Бухаресті з метою заблокувати надання Україні Плану дій щодо членства (ПДЧ).
    Через два дні після саміту, на зустрічі з Дж.
    Бушем у Сочі, російський лідер заперечував українську державність - Україна, за його словами, «не є нацією, що склалася природним чином», а являє собою «штучну країну, створену ще за радянських часів»(Citation: 220) - і прямо погрожував її розколом: «країна може просто розпастися», додавши, що, спираючись на антинатовські сили, «Росія постійно створюватиме там проблеми»(Citation: 220).
    Ще на самому саміті, за переказом джерела «Коммерсанта», Путін заявив Бушу: «Ти ж розумієш, Джордже, що Україна - це навіть не держава!» - фактично погрозивши, «що Росія може почати відторгнення Криму і Східної України»(Citation: 318).
