description:
  ru: |-
    Попытка договориться с лидером США в обход Киева, чтобы заблокировать евроатлантическую интеграцию Украины под угрозой ее расчленения: вступление Украины в НАТО создаст «поле конфликта для вас и нас, долгосрочную конфронтацию», а Москва, опираясь на антинатовские силы, «будет работать над тем, чтобы лишить НАТО возможности расширяться.
    Россия будет постоянно создавать там проблемы»(Citation: 220).
    По пересказу источника «Коммерсанта» с самого саммита: «Ты же понимаешь, Джордж, что Украина — это даже не государство!
    Что такое Украина?
    Часть ее территорий — это Восточная Европа, а часть, и значительная, подарена нами!» - с прозрачным намёком, «что Россия может начать отторжение Крыма и Восточной Украины»(Citation: 318).
  en: |-
    An attempt to strike a deal with the US leader over Kyiv's head in order to block Ukraine's Euro-Atlantic integration under the threat of its dismemberment: Ukraine's accession to NATO would create "a field of conflict for you and us, long-term confrontation," while Moscow, relying on anti-NATO forces, "would be working on stripping NATO of the possibility of enlarging.
    Russia would be creating problems there all the time"(Citation: 220).
    As retold by Kommersant's source from the summit itself: "You understand, George, that Ukraine is not even a state!
    What is Ukraine?
    Part of its territory is Eastern Europe, and part - a considerable part - was gifted by us!" - with a transparent hint "that Russia could begin the severance of Crimea and Eastern Ukraine"(Citation: 318).
  uk: |-
    Спроба домовитися з лідером США в обхід Києва, щоб заблокувати євроатлантичну інтеграцію України під загрозою її розчленування: вступ України до НАТО створить «поле конфлікту для вас і нас, довгострокову конфронтацію», а Москва, спираючись на антинатовські сили, «працюватиме над тим, щоб позбавити НАТО можливості розширюватися.
    Росія постійно створюватиме там проблеми»(Citation: 220).
    За переказом джерела «Коммерсанта» із самого саміту: «Ти ж розумієш, Джордже, що Україна - це навіть не держава!
    Що таке Україна?
    Частина її територій - це Східна Європа, а частина, і значна, подарована нами!» - із прозорим натяком, «що Росія може почати відторгнення Криму і Східної України»(Citation: 318).
