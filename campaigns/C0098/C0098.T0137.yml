description:
  en: |-
    The deliberate injection of false historical narratives into the international arena: Ukraine, according to the Russian leader, "is not a nation built in a natural manner" and "an artificial country created back in Soviet times," and its territories were supposedly gifts - "In the 1920s and 1930s Ukraine obtained territory from Russia -- that's the eastern part of the country.
    In 1956, the Crimean peninsula was transferred to Ukraine"(Citation: 220).
    From this the thesis of its possible disintegration was derived: "the country could just split apart"(Citation: 220).
  uk: |-
    Цілеспрямований вкид хибних історичних наративів на міжнародній арені: Україна, за версією російського лідера, «не є нацією, що склалася природним чином», а являє собою «штучну країну, створену ще за радянських часів», а її території нібито подаровані - «у 1920-ті та 1930-ті роки Україна отримала територію від Росії - це східна частина країни. 1956 року Кримський півострів було передано Україні»(Citation: 220).
    Звідси виводилася теза про її можливий розпад: «країна може просто розпастися»(Citation: 220).
  ru: |-
    Целенаправленный вброс ложных исторических нарративов на международной арене: Украина, по версии российского лидера, «не является нацией, сложившейся естественным образом», а представляет собой «искусственную страну, созданную ещё в советские времена», а ее территории якобы подарены - «в 1920-е и 1930-е годы Украина получила территорию от России - это восточная часть страны.
    В 1956 году Крымский полуостров был передан Украине»(Citation: 220).
    Отсюда выводился тезис о ее возможном распаде: «страна может просто развалиться»(Citation: 220).
