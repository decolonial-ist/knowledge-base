description:
  en: |-
    The material sign of the "merging of nations" was put up in Pereiaslav in the Kyiv region, the city of the Pereiaslav Rada: "on 8 October 1961, a majestic monument in honor of the 300th anniversary of the reunification of Ukraine with Russia was unveiled on B. Khmelnytsky Square"(Citation: 363).
    The authorities unveiled the sign themselves: according to the newsreel Radianska Ukraina No. 49, the opening rally was addressed by Petro Shelest, first secretary of the Kyiv obkom of the CPU, and Pankratov, a secretary of the Moscow obkom of the party - the metropole spoke at the unveiling in its own voice(Citation: 467).
    The composition consisted of two female figures representing Ukraine and Russia and three bas-reliefs with medallions: "a torch, 1654; a hammer and sickle in the rays of the sun, 1917; the Order of Victory, 1945"(Citation: 364).
    The sign's purpose is recorded in its own protection passport: "The monument is a symbol of the eternal, unbreakable friendship and the indestructible monolithic unity of the fraternal peoples - Ukrainian and Russian…"(Citation: 365).
    Four years after the unveiling, the sign was taken under state protection by the resolution of the Council of Ministers of the Ukrainian SSR of 21 July 1965 No. 711 "On the approval of the list of monuments of art, history and archaeology of the Ukrainian SSR"(Citation: 387)(Citation: 367).
    The pedestal bore the inscription "Forever together - forever with the Russian people"; in early December 2021 it was removed by unknown persons(Citation: 469), and the monument itself was dismantled on 7 July 2022 - by an order of the Ministry of Culture that struck the monument, protection No. 5894-Ko, off the register "due to the loss of the subject of protection"(Citation: 366).
  uk: |-
    Матеріальний знак «злиття націй» поставлено в Переяславі на Київщині, місті Переяславської ради: «8 жовтня 1961 року на площі Б. Хмельницького відкрито величний монумент на честь 300-річчя возз'єднання України з Росією»(Citation: 363).
    Відкривала знак сама влада: за кіножурналом «Радянська Україна» № 49, на мітингу відкриття виступали перший секретар Київського обкому КПУ Петро Шелест і секретар Московського обкому партії Панкратов - метрополія говорила на відкритті власним голосом(Citation: 467).
    Композицію складали дві жіночі постаті, що зображували Україну та Росію, і три барельєфи з медальйонами «факел 1654; серп і молот у променях сонця 1917, орден Перемоги 1945 р.»(Citation: 364).
    Призначення знака записане в його ж охоронному паспорті: «Монумент є символом вічної, непорушної дружби і незламної монолітної єдності братніх народів – українського і російського…»(Citation: 365).
    Через чотири роки після відкриття знак узяли під державну охорону постановою Ради Міністрів УРСР від 21 липня 1965 року № 711 «Про затвердження списку пам'яток мистецтва, історії та археології Української РСР»(Citation: 387)(Citation: 367).
    На постаменті стояв напис «Навіки разом – навіки з російським народом»; на початку грудня 2021 року його зняли невідомі(Citation: 469), а монумент демонтували 7 липня 2022-го - за наказом Міністерства культури, який вилучив пам'ятку, охоронний № 5894-Ко, з реєстру «у зв'язку з втратою предмета охорони»(Citation: 366).
  ru: |-
    Материальный знак «слияния наций» поставлен в Переяславе на Киевщине, городе Переяславской рады: «8 октября 1961 года на площади Б. Хмельницкого открыт величественный монумент в честь 300-летия воссоединения Украины с Россией»(Citation: 363).
    Открывала знак сама власть: по киножурналу «Радянська Україна» № 49, на митинге открытия выступали первый секретарь Киевского обкома КПУ Пётр Шелест и секретарь Московского обкома партии Панкратов - метрополия говорила на открытии собственным голосом(Citation: 467).
    Композицию составляли две женские фигуры, изображавшие Украину и Россию, и три барельефа с медальонами «факел 1654; серп и молот в лучах солнца 1917, орден Победы 1945 г.»(Citation: 364).
    Назначение знака записано в его же охранном паспорте: «Монумент является символом вечной, нерушимой дружбы и несокрушимого монолитного единства братских народов - украинского и русского…»(Citation: 365).
    Через четыре года после открытия знак взяли под государственную охрану постановлением Совета Министров УССР от 21 июля 1965 года № 711 «Об утверждении списка памятников искусства, истории и археологии Украинской ССР»(Citation: 387)(Citation: 367).
    На постаменте стояла надпись «Навеки вместе - навеки с русским народом»; в начале декабря 2021 года её сняли неизвестные(Citation: 469), а монумент демонтировали 7 июля 2022-го - по приказу Министерства культуры, исключившему памятник, охранный № 5894-Ко, из реестра «в связи с утратой предмета охраны»(Citation: 366).
