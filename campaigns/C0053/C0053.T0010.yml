description:
  ru: 'Идеологическая установка на стирание наций: Третья программа КПСС, принятая XXII съездом в октябре 1961 года, объявила «новый этап в развитии национальных отношений в СССР, характеризующийся дальнейшим сближением наций и достижением их полного единства», а «стирание национальных различий, в особенности языковых различий» назвала лишь «значительно более длительным процессом, чем стирание классовых граней»(Citation: 463).'
  en: 'The ideological course toward erasing nations: the Third Program of the CPSU, adopted by the 22nd Congress in October 1961, announced "a new stage in the development of national relations in the USSR, characterized by the further drawing together of nations and the achievement of their complete unity," and called "the effacement of national distinctions, especially of language distinctions," merely "a considerably longer process than the effacement of class boundaries"(Citation: 463).'
  uk: 'Ідеологічна установка на стирання націй: Третя програма КПРС, ухвалена XXII з''їздом у жовтні 1961 року, оголосила «новий етап у розвитку національних відносин у СРСР, що характеризується дальшим зближенням націй і досягненням їх повної єдності», а «стирання національних відмінностей, особливо мовних відмінностей» назвала лише «значно тривалішим процесом, ніж стирання класових граней»(Citation: 463).'
