name:
  ru: Создание единого «советского народа» (1958–1970)
  en: Creation of a Single "Soviet People" (1958–1970)
  uk: Створення єдиного «радянського народу» (1958–1970)
description:
  ru: |-
    Официальная кампания СССР по стиранию национальных особенностей: Старт дал Закон СССР «Об укреплении связи школы с жизнью и о дальнейшем развитии системы народного образования в СССР» от 24 декабря 1958 года: прямой нормы о языке он не содержал, отдав вопрос республикам(Citation: 404); республиканский Закон УРСР от 17 апреля 1959 года статьёй 9 сделал выбор языка обучения делом родителей(Citation: 459).
    Третья программа КПСС, принятая XXII съездом в октябре 1961 года, провозгласила «новый этап в развитии национальных отношений в СССР, характеризующийся дальнейшим сближением наций и достижением их полного единства» - вплоть до «стирания национальных различий, в особенности языковых различий»(Citation: 463).
  en: |-
    The USSR's official campaign to erase national distinctions: The start was given by the USSR Law "On Strengthening the Connection of School with Life and on the Further Development of the System of Public Education in the USSR" of December 24, 1958: it contained no direct norm on language, leaving the matter to the republics(Citation: 404); the republican Law of the Ukrainian SSR of April 17, 1959, by its Article 9, made the choice of the language of instruction a matter for parents(Citation: 459).
    The Third Program of the CPSU, adopted by the 22nd Congress in October 1961, proclaimed "a new stage in the development of national relations in the USSR, characterized by the further drawing together of nations and the achievement of their complete unity" - up to and including "the effacement of national distinctions, especially of language distinctions"(Citation: 463).
  uk: |-
    Офіційна кампанія СРСР зі стирання національних особливостей: Старт дав Закон СРСР «Про зміцнення зв'язку школи з життям і про дальший розвиток системи народної освіти в СРСР» від 24 грудня 1958 року: прямої норми про мову він не містив, віддавши питання республікам(Citation: 404); республіканський Закон УРСР від 17 квітня 1959 року статтею 9 зробив вибір мови навчання справою батьків(Citation: 459).
    Третя програма КПРС, ухвалена XXII з'їздом у жовтні 1961 року, проголосила «новий етап у розвитку національних відносин у СРСР, що характеризується дальшим зближенням націй і досягненням їх повної єдності» - аж до «стирання національних відмінностей, особливо мовних відмінностей»(Citation: 463).
