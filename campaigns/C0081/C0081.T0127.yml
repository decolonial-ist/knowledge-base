description:
  ru: |-
    Массовое принудительное выселение по разнарядке: «согласно постановлениям Совета народных комиссаров от 5 декабря 1939 и 2 марта 1940 административному переселению подлежали служащие бывших государственных учреждений, органов суда, полиции, армии, коммерсанты, польские осадники, помещики, владельцы заводов и фабрик и их семьи»; всего «вывезено в отдалённые регионы СССР до 1 млн 250 тыс. человек»(Citation: 191).
    Волны были раздельными: осадников выселяли по постановлению СНК СССР от 5 декабря 1939 года № 2010-558сс - его текст остаётся в закрытом Архиве Президента РФ (фонд 93), а порядок операции известен по Инструкции НКВД, утверждённой 29 декабря 1939 года(Citation: 402); семьи офицеров, полицейских и тюремщиков выселялись по постановлению от 2 марта 1940 года № 289-127сс(Citation: 401).
  en: |-
    Mass forced resettlement by quota: "under the resolutions of the Council of People's Commissars of December 5, 1939 and March 2, 1940, subject to administrative resettlement were the employees of the former state institutions, courts, police, army, merchants, Polish settlers, landowners, owners of plants and factories, and their families"; in total "up to 1,250,000 people were removed to remote regions of the USSR"(Citation: 191).
    The waves were separate: the osadniks were deported under the USSR Sovnarkom resolution of December 5, 1939, no. 2010-558ss - its text remains in the closed Archive of the President of the Russian Federation (fond 93), while the mechanics of the operation are known from the NKVD Instruction approved on December 29, 1939(Citation: 402); the families of officers, policemen and prison guards were deported under the resolution of March 2, 1940, no. 289-127ss(Citation: 401).
  uk: |-
    Масове примусове виселення за розверсткою: «згідно з постановами Ради народних комісарів від 5 грудня 1939 та 2 березня 1940 адміністративному переселенню підлягали службовці колишніх державних установ, органів суду, поліції, армії, комерсанти, польські осадники, поміщики, власники заводів і фабрик та їх родини»; загалом «вивезено у віддалені регіони СРСР до 1 млн 250 тис. осіб»(Citation: 191).
    Хвилі були окремими: осадників виселяли за постановою РНК СРСР від 5 грудня 1939 року № 2010-558сс - її текст залишається в закритому Архіві Президента РФ (фонд 93), а порядок операції відомий з Інструкції НКВС, затвердженої 29 грудня 1939 року(Citation: 402); родини офіцерів, поліцейських і тюремників виселяли за постановою від 2 березня 1940 року № 289-127сс(Citation: 401).
