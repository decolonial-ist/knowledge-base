name:
  en: Annexation and Sovietization of Western Ukraine (1939–1941)
  uk: Анексія та радянізація Західної України (1939–1941)
  ru: Аннексия и советизация Западной Украины (1939–1941)
description:
  en: |-
    The collusion of two totalitarian regimes (the Molotov–Ribbentrop Pact), which led to the USSR's invasion of Poland and the seizure of Western Ukraine.
    To legitimize the occupation, the "People's Assembly of Western Ukraine 1939" was staged, which "on October 27 in Lviv… adopted the Declaration on the reunification of Western Ukraine with the Ukrainian SSR"(Citation: 185).
    Then came the mass deportations: "Between September 1939 and June 1941, up to 1,250,000 people (about 10% of the population) were removed from these lands and Western Belarus… to remote regions of the USSR"(Citation: 191).
  uk: |-
    Змова двох тоталітарних режимів (пакт Молотова – Ріббентропа), що призвела до вторгнення СРСР у Польщу й захоплення Західної України.
    Для легітимізації окупації організовано «Народні збори Західної України 1939», які «27 жовт. у Львові… ухвалили Декларацію про возз'єднання Зх.
    України з Укр.
    РСР»(Citation: 185).
    Далі почалися масові депортації: «Впродовж вересня 1939 — червня 1941 із цих земель та Західної Білорусі… вивезено у віддалені регіони СРСР до 1 млн 250 тис. осіб (близько 10 % населення)»(Citation: 191).
  ru: |-
    Сговор двух тоталитарных режимов (пакт Молотова – Риббентропа), приведший к вторжению СССР в Польшу и захвату Западной Украины.
    Для легитимизации оккупации организованы «Народное собрание Западной Украины 1939», которые «27 октября во Львове… приняли Декларацию о воссоединении Западной Украины с Украинской ССР»(Citation: 185).
    Затем начались массовые депортации: «На протяжении сентября 1939 — июня 1941 с этих земель и Западной Беларуси… вывезено в отдалённые регионы СССР до 1 млн 250 тыс. человек (около 10 % населения)»(Citation: 191).
