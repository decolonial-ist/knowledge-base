description:
  ru: |-
    Знак нового порядка ставится в первые же недели: советские войска заняли Львов 22 сентября 1939 года(Citation: 454), а уже в октябре в центре города, на островке посреди нынешнего проспекта Свободы, вырос монумент Сталинской конституции - огромная вертикальная композиция из колонн, перевитых красными знамёнами, на деревянном каркасе, с пятью скульптурными группами (красноармеец, рабочий, мать с ребёнком, студентка и старый гуцул с мальчиком) и надписями на украинском, польском и еврейском языках, символизировавшими «дружбу народов» по статьям сталинской конституции(Citation: 453)(Citation: 468).
    У знака есть названные авторы: скульптор Сергей Литвиненко и киевский художник Михаил Дмитренко, прибывший во Львов в 1939 году в «десанте» советских художников, чьей задачей было насаждение соцреализма; возможно, авторы лишь приспособили к месту проект, изготовленный в Москве, а исполняли его скульпторы Евгений Дзындра и Андрей Коверко(Citation: 453).
    Монумент простоял до 30 июня 1941 года и исчез с приходом немцев(Citation: 453).
  en: |-
    The sign of the new order goes up within the very first weeks: Soviet troops took Lviv on 22 September 1939(Citation: 454), and already in October, in the city center, on the islet in the middle of today's Svobody Avenue, rose the monument to the Stalin Constitution - a huge vertical composition of columns entwined with red banners, on a wooden frame, with five sculptural groups (a Red Army soldier, a worker, a mother with a child, a female student, and an old Hutsul with a boy) and inscriptions in Ukrainian, Polish and Yiddish symbolizing the "friendship of peoples" according to the articles of the Stalin constitution(Citation: 453)(Citation: 468).
    The sign has named authors: the sculptor Serhii Lytvynenko and the Kyiv artist Mykhailo Dmytrenko, who arrived in Lviv in 1939 in the "landing party" of Soviet artists whose task was the implantation of socialist realism; possibly the authors merely adapted to the site a design produced in Moscow, and it was executed by the sculptors Yevhen Dzyndra and Andrii Koverko(Citation: 453).
    The monument stood until 30 June 1941 and vanished with the arrival of the Germans(Citation: 453).
  uk: |-
    Знак нового порядку ставлять у перші ж тижні: радянські війська зайняли Львів 22 вересня 1939 року(Citation: 454), а вже в жовтні в центрі міста, на острівці посеред нинішнього проспекту Свободи, виріс монумент Сталінської конституції - величезна вертикальна композиція з колон, перевитих червоними знаменами, на дерев'яному каркасі, з п'ятьма скульптурними групами (червоноармієць, робітник, мати з дитиною, студентка і старий гуцул із хлопчиком) та написами українською, польською і єврейською мовами, що символізували «дружбу народів» за статтями сталінської конституції(Citation: 453)(Citation: 468).
    Знак має названих авторів: скульптора Сергія Литвиненка і київського художника Михайла Дмитренка, який прибув до Львова 1939 року в «десанті» радянських художників, чиїм завданням було насадження соцреалізму; можливо, автори лише пристосували до місця проєкт, виготовлений у Москві, а виконували його скульптори Євген Дзиндра та Андрій Коверко(Citation: 453).
    Монумент простояв до 30 червня 1941 року і зник із приходом німців(Citation: 453).
