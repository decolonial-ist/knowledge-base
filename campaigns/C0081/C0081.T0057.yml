description:
  en: 'The transfer of hundreds of thousands of people into special settlements and camps as a system of forced labor: in under two years "up to 1,250,000 people (about 10% of the population) were removed to remote regions of the USSR"(Citation: 191) – the deportees were assigned to labor in remote regions with no right to leave.'
  uk: 'Переміщення сотень тисяч людей до спецпоселень і таборів як система примусової праці: за неповні два роки «вивезено у віддалені регіони СРСР до 1 млн 250 тис. осіб (близько 10 % населення)»(Citation: 191) – вислані скеровувалися на роботи у віддалені регіони без права виїзду.'
  ru: 'Перемещение сотен тысяч людей в спецпоселения и лагеря как система принудительного труда: за неполные два года «вывезено в отдалённые регионы СССР до 1 млн 250 тыс. человек (около 10 % населения)»(Citation: 191) – высланные направлялись на работы в отдаленные регионы без права выезда.'
