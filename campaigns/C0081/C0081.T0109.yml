description:
  en: 'The staging of a no-alternative "People''s Assembly" under the control of occupation troops to give the seizure legal form: "On October 27 in Lviv, the People''s Assembly of Western Ukraine of 1939 adopted the Declaration on the reunification of Western Ukraine with the Ukrainian SSR, and on November 1 the Supreme Soviet of the USSR passed the law admitting Western Ukraine, as part of the Ukrainian SSR, into the USSR"(Citation: 185).'
  uk: |-
    Організація безальтернативних «Народних зборів» під контролем окупаційних військ для юридичного оформлення захоплення: «27 жовт. у Львові Народні збори Західної України 1939 ухвалили Декларацію про возз'єднання Зх.
    України з Укр.
    РСР, а 1 листоп.
    ВР СРСР прийняла закон про введення Зх.
    України у складі УРСР до СРСР»(Citation: 185).
  ru: 'Организация безальтернативных «Народных сборов» под контролем оккупационных войск для юридического оформления захвата: «27 октября во Львове Народное собрание Западной Украины 1939 приняло Декларацию о воссоединении Западной Украины с Украинской ССР, а 1 ноября ВС СССР принял закон о включении Западной Украины в составе УССР в СССР»(Citation: 185).'
