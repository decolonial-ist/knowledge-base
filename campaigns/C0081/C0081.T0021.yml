description:
  en: 'The neutralization of the politically active stratum through mass arrests: immediately after the "People''s Assembly" came "the arrests of leading figures of the Ukrainian intelligentsia, by lists prepared in advance, drawn up in the Soviet consulate"(Citation: 315); "in all, in 1939—1941 the NKVD organs arrested 21,982 Poles, 23,163 Ukrainians and 13,160 Jews"(Citation: 315), and those arrested faced execution, prison or the GULAG camps: "in total, during 1939—1941, between 16 and 35 thousand OUN members were shot or imprisoned"(Citation: 315).'
  uk: 'Нейтралізація політично активного шару через масові арешти: одразу після «Народних зборів» відбулися «арешти провідних діячів української інтелігенції, за здалегідь підготованими списками, складеними у радянському консульстві»(Citation: 315); «всього в 1939—1941 рр. органами НКВД було заарештовано 21 982 поляки, 23 163 українців, 13 160 євреїв»(Citation: 315), а заарештованих чекали розстріл, тюрма або табори ГУЛАГу: «Загалом протягом 1939—1941 рр. було розстріляно та ув''язнено від 16 тис. до 35 тис. членів ОУН»(Citation: 315).'
  ru: 'Нейтрализация политически активного слоя через массовые аресты: сразу после «Народного собрания» прошли «аресты ведущих деятелей украинской интеллигенции, по заранее подготовленным спискам, составленным в советском консульстве»(Citation: 315); «всего в 1939—1941 гг. органами НКВД было арестовано 21 982 поляка, 23 163 украинца, 13 160 евреев»(Citation: 315), а арестованных ждали расстрел, тюрьма или лагеря ГУЛАГа: «в целом на протяжении 1939—1941 гг. было расстреляно и заключено от 16 тыс. до 35 тыс. членов ОУН»(Citation: 315).'
