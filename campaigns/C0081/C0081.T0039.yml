description:
  ru: |-
    Раздел Восточной Европы за спиной её народов: секретный протокол установил, что «В случае территориально-политического переустройства областей, входящих в состав Польского государства, граница сфер интересов Германии и СССР будет приблизительно проходить по линии рек Нарева, Вислы и Сана»(Citation: 166).
    Полвека спустя Съезд народных депутатов СССР «признает секретные протоколы юридически несостоятельными и недействительными с момента их подписания»(Citation: 172).
    Вторжение прикрывалось нотой Молотова польскому послу Гжибовскому (17 сентября 1939): «Польское государство и его правительство фактически перестали существовать»(Citation: 165).
  en: |-
    The partition of Eastern Europe behind the backs of its peoples: the secret protocol established that "in the event of a territorial-political rearrangement of the areas belonging to the Polish state, the boundary of the spheres of interest of Germany and the USSR shall run approximately along the line of the rivers Narew, Vistula, and San"(Citation: 166).
    Half a century later the Congress of People's Deputies of the USSR "recognizes the secret protocols as legally untenable and invalid from the moment of their signing"(Citation: 172).
    The invasion was covered by Molotov's note to the Polish ambassador Grzybowski (17 September 1939): "the Polish state and its government have in fact ceased to exist"(Citation: 165).
  uk: |-
    Поділ Східної Європи за спиною її народів: секретний протокол установив, що «У разі територіально-політичної перебудови областей, що входять до складу Польської держави, кордон сфер інтересів Німеччини і СРСР проходитиме приблизно по лінії річок Нарев, Вісла і Сян»(Citation: 166).
    Пів століття по тому З'їзд народних депутатів СРСР «визнає секретні протоколи юридично неспроможними і недійсними з моменту їх підписання»(Citation: 172).
    Вторгнення прикривалося нотою Молотова польському послу Гжибовському (17 вересня 1939): «Польська держава та її уряд фактично перестали існувати»(Citation: 165).
