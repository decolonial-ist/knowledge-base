description:
  ru: |-
    Тотальный идеологический контроль над искусством и прессой, запрет произведений и шельмование писателей за мнимый «буржуазный национализм».
    Кампания завершилась приговором по делу Еврейского антифашистского комитета: «18 июля 1952 Военная коллегия Верховного Суда СССР вынесла смертный приговор 13 лицам, в т. ч. 5 выходцам из Украины, известным еврейским писателям и поэтам»(Citation: 189).
  en: |-
    Total ideological control over art and the press, the banning of works and the vilification of writers for alleged "bourgeois nationalism."
    The campaign culminated in the verdict in the case of the Jewish Anti-Fascist Committee: "on July 18, 1952 the Military Collegium of the USSR Supreme Court passed death sentences on 13 people, including 5 natives of Ukraine, well-known Jewish writers and poets"(Citation: 189).
  uk: |-
    Тотальний ідеологічний контроль над мистецтвом і пресою, заборона творів і цькування письменників за уявний «буржуазний націоналізм».
    Кампанія завершилася вироком у справі Єврейського антифашистського комітету: «18 лип. 1952 Військ. колегія Верховного Суду СРСР винесла смертний вирок 13 особам, у т. ч. 5 вихідцям з України, відомим єврейс. письменникам і поетам»(Citation: 189).
