description:
  ru: 'Сфабрикованные репрессии против деятелей украинской и еврейской интеллигенции: по делу Еврейского антифашистского комитета «18 июля 1952 Военная коллегия Верховного Суда СССР вынесла смертный приговор 13 лицам, в т. ч. 5 выходцам из Украины, известным еврейским писателям и поэтам Д.Бергельсону, Д.Гофштейну, Л.Квитко, П.Маркишу, И.Феферу. 12 августа 1952 все они были казнены»(Citation: 189).'
  en: |-
    Fabricated repressions against figures of the Ukrainian and Jewish intelligentsia: in the case of the Jewish Anti-Fascist Committee, "on July 18, 1952 the Military Collegium of the USSR Supreme Court passed death sentences on 13 people, including 5 natives of Ukraine, the well-known Jewish writers and poets D. Bergelson, D. Hofshtein, L. Kvitko, P. Markish, I. Fefer.
    On August 12, 1952 they were all executed"(Citation: 189).
  uk: 'Сфабриковані репресії проти діячів української та єврейської інтелігенції: у справі Єврейського антифашистського комітету «18 лип. 1952 Військ. колегія Верховного Суду СРСР винесла смертний вирок 13 особам, у т. ч. 5 вихідцям з України, відомим єврейс. письменникам і поетам Д.Бергельсону, Д.Гофштейну, Л.Квітко, П.Маркішу, І.Феферу. 12 серп. 1952 всі вони були страчені»(Citation: 189).'
