description:
  ru: 'Карательные отряды физически истребляли местное население: в челобитной царю Михаилу Федоровичу кабардинский князь Сунчалей Янглычевич Черкасский отчитывался, что в поселениях они «иных многих лю[дей] побили»(Citation: 82).'
  en: 'The punitive detachments physically exterminated the local population: in a petition to Tsar Mikhail Fyodorovich, the Kabardian prince Sunchaley Yanglychevich Cherkassky reported that in the settlements they «slew many other peo[ple]»(Citation: 82).'
  uk: 'Каральні загони фізично винищували місцеве населення: у чолобитній цареві Михайлу Федоровичу кабардинський князь Сунчалей Янгличевич Черкаський звітував, що в поселеннях вони «інших багатьох лю[дей] побили»(Citation: 82).'
