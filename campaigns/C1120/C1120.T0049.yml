description:
  en: 'The occupation administration of Tersky Town mobilized the metropole''s subordinate allies: in a petition to Tsar Mikhail Fyodorovich, the Kabardian prince Sholokh reported that «the voivode Mikita Dmitreevich Velyaminov sent me... with my father on your sovereign''s service... against your sovereign''s disobedient ones — the Michkiz people, against their kabaks»(Citation: 82).'
  uk: 'Окупаційна адміністрація Терського міста мобілізувала підпорядкованих союзників метрополії: у чолобитній цареві Михайлу Федоровичу кабардинський князь Шолох звітував, що «посилав мене... воєвода Микита Дмитрійович Вельямінов з батьком моїм на твою государеву службу... на твоїх государевих непослушників — на мічкіських людей, на їхні кабаки»(Citation: 82).'
  ru: 'Оккупационная администрация Терского города мобилизовала подчиненных союзников метрополии: в челобитной царю Михаилу Федоровичу кабардинский князь Шолох отчитывался, что «посылал меня... воевода Микита Дмитреевич Вельяминов с отцом моим на твою государеву службу... на твоих государевых непослушников на мичкиских людей, на их кабаки»(Citation: 82).'
