description:
  ru: 'Оккупационная администрация Терского города целенаправленно организовала поход для силового наказания: в своей челобитной царю Михаилу Федоровичу кабардинский князь Шолох отчитывался, что терский воевода послал вооруженные отряды именно «на твоих государевых непослушников на мичкиских людей, на их кабаки»(Citation: 82).'
  en: 'The occupation administration of Tersky Town deliberately organized a campaign of violent punishment: in his petition to Tsar Mikhail Fyodorovich, the Kabardian prince Sholokh reported that the Terek voivode sent the armed detachments precisely «against your sovereign''s disobedient ones — the Michkiz people, against their kabaks»(Citation: 82).'
  uk: 'Окупаційна адміністрація Терського міста цілеспрямовано організувала похід для силового покарання: у своїй чолобитній цареві Михайлу Федоровичу кабардинський князь Шолох звітував, що терський воєвода послав збройні загони саме «на твоїх государевих непослушників — на мічкіських людей, на їхні кабаки»(Citation: 82).'
