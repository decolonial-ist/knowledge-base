name:
  en: Punitive campaign and the devastation of the Nokhchi mountain communities (1617–1618)
  uk: Каральний похід і розорення гірських спільнот Нохчі (1617–1618)
  ru: Карательный поход и разорение горных обществ нохчи (1617–1618)
description:
  en: |-
    The occupation administration of the town of Terki undertook an armed invasion of the mountain lands of the Nokhchi.
    Historian E. N. Kusheva states that the 1618 military campaign of the Terek detachments into the mountains took place «at the request of «the Uvar Nutsal prince and his brother Suleman-murza and the Cherny prince's son Turlov-murza»»(Citation: 83).
    Kusheva adds that «In 1621, the serving Kabardian prince Sunchaley Yanglychevich Cherkassky and his son Prince Sholokh referred in their petitions to their participation in the campaign of the Terek fighting men into the mountains that took place in 1618»(Citation: 83).
    Preparation for the operation included forced mobilization: in a petition to Tsar Mikhail Fedorovich, the Kabardian prince Sholokh reported that «voivode Mikita Dmitreevich Velyaminov sent me... together with my father on your sovereign's service... against your sovereign's disobedient ones, the Michkiz people, against their kabaks»(Citation: 82).
    Having made the crossing «through the mountains and along mountain crevices, through impassable places»(Citation: 82), the detachments descended upon the settlements.
    In a similar document, the Kabardian prince Sunchaley Yanglychevich Cherkassky reported that they «burned down and utterly devastated many Shibut, and Kalkan, and Erokhan, and Michkiz kabaks, and took many captives, and killed many other peo[ple]»(Citation: 82).
    Kusheva states that after the detachments «had made war upon «the Shibut, and Kalkan, and Erokhan, and Michkiz kabaks»», the Indigenous population was forced into submission: ««the Shibut, and Kalkan, and Erokhan, and Michkiz people... acknowledged their guilt»»(Citation: 83), as a result of which the mountaineers «petitioned in submission and gave the shert (oath) and amanats to the town of Terki»(Citation: 82).
  uk: |-
    Окупаційна адміністрація Терського міста здійснила збройне вторгнення на гірські землі Нохчі.
    Історик Е. Н. Кушева констатує, що воєнний похід терських загонів 1618 року в гори відбувся «на прохання «уварського Нуцала князя і брата його Сулемана-мурзи та сина Чорного князя Турлова-мурзи»»(Citation: 83).
    Кушева додає, що «У 1621 р. служилий кабардинський князь Сунчалей Янгличевич Черкаський та його син князь Шолох у чолобитних посилалися на свою участь у поході терських ратних людей у гори, що відбувся 1618 р.»(Citation: 83).
    Підготовка до операції включала примусову мобілізацію: у чолобитній цареві Михайлу Федоровичу кабардинський князь Шолох звітував, що «посилав мене... воєвода Микита Дмитрович Вельямінов разом із батьком моїм на твою государеву службу... на твоїх государевих непослушників, на мічкіських людей, на їхні кабаки»(Citation: 82).
    Здійснивши перехід «через гори і гірськими розколинами, непрохідними місцями»(Citation: 82), загони обрушилися на поселення.
    В аналогічному документі кабардинський князь Сунчалей Янгличевич Черкаський доповідав, що вони «шибуцькі, і калканські, і ероханські, і мічкіські численні кабаки спалили і дощенту розорили, і численний полон захопили, а інших багатьох лю[дей] побили»(Citation: 82).
    Кушева констатує, що після того як загонами «було повойовано «шибуцькі, і калканські, і ероханські, і мічкіські кабаки»», корінне населення було примушене до підкорення: ««шибуцькі, і калканські, і ероханські, і мічкіські люди... провину свою визнали»»(Citation: 83), унаслідок чого горці «добили чолом і шерть та аманатів дали в Терське місто»(Citation: 82).
  ru: |-
    Оккупационная администрация Терского города предприняла вооруженное вторжение на горные земли нохчи.
    Историк Е. Н. Кушева констатирует, что военный поход терских отрядов 1618 года в горы состоялся «по просьбе «уварского Нуцала князя и брата его Сулемана мурзы и Черново князя сына Турлова мурзы»»(Citation: 83).
    Кушева дополняет, что «В 1621 г. служилый кабардинский князь Сунчалей Янглычевич Черкасский и сын его князь Шолох в челобитных ссылались на свое участие в походе терских ратных людей в горы, состоявшемся в 1618 г.»(Citation: 83).
    Подготовка к операции включала принудительную мобилизацию: в челобитной царю Михаилу Федоровичу кабардинский князь Шолох отчитывался, что «посылал меня... воевода Микита Дмитреевич Вельяминов с отцом моим на твою государеву службу... на твоих государевых непослушников на мичкиских людей, на их кабаки»(Citation: 82).
    Совершив переход «через горы и горскими расселинами, непроходимыми месты»(Citation: 82), отряды обрушились на поселения.
    В аналогичном документе кабардинский князь Сунчалей Янглычевич Черкасский докладывал, что они «шибуцкие и калканские и ероханские и мичкиские многие кабаки повыжгли и совсем разорили и многой полон поймали, а иных многих лю[дей] побили»(Citation: 82).
    Кушева констатирует, что после того как отрядами «был повоеваны «шибутцкие, и калканские, и ероханские, и мичкиские кабаки»», коренное население было принуждено к подчинению: ««шибутцкие, и калканские, и ероханские, и мичкиские люди... вину свою принесли»»(Citation: 83), в результате чего горцы «добили челом и шерть и аманаты дали в Терской город»(Citation: 82).
