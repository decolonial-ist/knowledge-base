description:
  ru: 'Карательные отряды грабили и обращали население в рабство: в челобитной царю Михаилу Федоровичу кабардинский князь Сунчалей Янглычевич Черкасский отчитывался, что они аулы «совсем разорили и многой полон поймали»(Citation: 82).'
  en: 'The punitive detachments plundered and enslaved the population: in a petition to Tsar Mikhail Fyodorovich, the Kabardian prince Sunchaley Yanglychevich Cherkassky reported that they «utterly ruined» the auls «and took many captives»(Citation: 82).'
  uk: 'Каральні загони грабували та обертали населення в рабство: у чолобитній цареві Михайлу Федоровичу кабардинський князь Сунчалей Янгличевич Черкаський звітував, що аули вони «зовсім розорили і багато полону взяли»(Citation: 82).'
