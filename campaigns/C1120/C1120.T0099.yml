description:
  ru: 'В результате разорения поселений подчиненные общества выдали людей оккупационной администрации: в челобитной царю Михаилу Федоровичу кабардинский князь Сунчалей Янглычевич Черкасский фиксирует, что они «аманаты дали в Терской город»(Citation: 82).'
  en: 'As a result of the devastation of their settlements, the subordinated communities handed people over to the occupation administration: in a petition to Tsar Mikhail Fyodorovich, the Kabardian prince Sunchaley Yanglychevich Cherkassky records that they «gave amanats (hostages) to Tersky Town»(Citation: 82).'
  uk: 'Внаслідок розорення поселень підпорядковані громади видали людей окупаційній адміністрації: у чолобитній цареві Михайлу Федоровичу кабардинський князь Сунчалей Янгличевич Черкаський фіксує, що вони «аманатів дали в Терське місто»(Citation: 82).'
