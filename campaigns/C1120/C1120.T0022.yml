description:
  ru: 'Оккупационная администрация Терского города применяла массовое устрашающее насилие: в челобитной царю Михаилу Федоровичу кабардинский князь Сунчалей Янглычевич Черкасский докладывал, что военные отряды «шибуцкие и калканские и ероханские и мичкиские многие кабаки повыжгли и совсем разорили»(Citation: 82) и «многих лю[дей] побили»(Citation: 82).'
  en: 'The occupation administration of Tersky Town employed mass terrorizing violence: in a petition to Tsar Mikhail Fyodorovich, the Kabardian prince Sunchaley Yanglychevich Cherkassky reported that the military detachments «burned down and utterly ruined many Shibut and Kalkan and Erokhan and Michkiz kabaks»(Citation: 82) and «slew many peo[ple]»(Citation: 82).'
  uk: 'Окупаційна адміністрація Терського міста застосовувала масове залякувальне насильство: у чолобитній цареві Михайлу Федоровичу кабардинський князь Сунчалей Янгличевич Черкаський доповідав, що військові загони «шибуцькі і калканські і ероханські і мічкіські многі кабаки повипалювали і зовсім розорили»(Citation: 82) та «багатьох лю[дей] побили»(Citation: 82).'
