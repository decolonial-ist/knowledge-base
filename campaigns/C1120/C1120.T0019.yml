description:
  en: 'The occupation administration of Tersky Town dispatched armed detachments which, as the Kabardian prince Sunchaley Yanglychevich Cherkassky and his son the Kabardian prince Sholokh reported to Tsar Mikhail Fyodorovich, made their way «across the mountains and through mountain crevices, impassable places»(Citation: 82) in order to suppress the defiant communities.'
  uk: 'Окупаційна адміністрація Терського міста направила збройні загони, які, як доповідали цареві Михайлу Федоровичу кабардинський князь Сунчалей Янгличевич Черкаський та його син кабардинський князь Шолох, здійснили перехід «через гори та гірськими розколинами, непрохідними місцями»(Citation: 82) для придушення громад, що не підкорилися.'
  ru: 'Оккупационная администрация Терского города направила вооруженные отряды, которые, как докладывали царю Михаилу Федоровичу кабардинский князь Сунчалей Янглычевич Черкасский и его сын кабардинский князь Шолох, совершили переход «через горы и горскими расселинами, непроходимыми месты»(Citation: 82) для подавления не подчинившихся обществ.'
