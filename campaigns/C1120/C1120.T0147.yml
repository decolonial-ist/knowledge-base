description:
  ru: 'Под прямой военной угрозой горские общества вынужденно капитулировали: в челобитной царю Михаилу Федоровичу кабардинский князь Сунчалей Янглычевич Черкасский докладывал, что горцы «вину свою принесли... добили челом и шерть... дали»(Citation: 82).'
  en: 'Under direct military threat, the mountain communities were forced to capitulate: in a petition to Tsar Mikhail Fyodorovich, the Kabardian prince Sunchaley Yanglychevich Cherkassky reported that the mountaineers «brought their guilt... petitioned humbly and gave... the shert (oath of allegiance)»(Citation: 82).'
  uk: 'Під прямою воєнною загрозою гірські громади вимушено капітулювали: у чолобитній цареві Михайлу Федоровичу кабардинський князь Сунчалей Янгличевич Черкаський доповідав, що горці «вину свою принесли... добили чолом і шерть... дали»(Citation: 82).'
