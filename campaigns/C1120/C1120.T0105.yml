description:
  ru: 'В ходе карательного похода военные отряды полностью сожгли аулы: в челобитной царю Михаилу Федоровичу кабардинский князь Сунчалей Янглычевич Черкасский докладывал, что они «шибуцкие и калканские и ероханские и мичкиские многие кабаки повыжгли и совсем разорили»(Citation: 82).'
  en: 'During the punitive campaign, the military detachments burned entire auls to the ground: in a petition to Tsar Mikhail Fyodorovich, the Kabardian prince Sunchaley Yanglychevich Cherkassky reported that they «burned down and utterly ruined many Shibut and Kalkan and Erokhan and Michkiz kabaks»(Citation: 82).'
  uk: 'Під час карального походу військові загони повністю спалили аули: у чолобитній цареві Михайлу Федоровичу кабардинський князь Сунчалей Янгличевич Черкаський доповідав, що вони «шибуцькі і калканські і ероханські і мічкіські многі кабаки повипалювали і зовсім розорили»(Citation: 82).'
