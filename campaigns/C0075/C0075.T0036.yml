description:
  ru: 'Перехват Москвой прямого контроля над карательным аппаратом путем решения о ликвидации самостоятельной Всеукраинской ЧК (ВУЧК) в августе 1919 года и назначения своего спецкомиссара Я. Петерса(Citation: 22).'
  en: |-
    Moscow's seizure of direct control over the punitive apparatus through the decision to liquidate the independent All-Ukrainian Cheka (VUChK) in August 1919 and the appointment of its own special commissar, Ya.
    Peters(Citation: 22).
  uk: 'Перехоплення Москвою прямого контролю над каральним апаратом шляхом рішення про ліквідацію самостійної Всеукраїнської ЧК (ВУЧК) у серпні 1919 року та призначення свого спецкомісара Я. Петерса(Citation: 22).'
