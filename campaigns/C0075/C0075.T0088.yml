description:
  ru: 'Использование формата «союзного договора» от 1 июня 1919 года и 28 декабря 1920 года не для создания равноправной федерации, а как инструмента для легализации прямого жесткого управления из Москвы(Citation: 22).'
  en: 'Use of the "union treaty" format of June 1, 1919, and December 28, 1920, not to create an equal federation but as an instrument for legalizing direct, rigid rule from Moscow(Citation: 22).'
  uk: 'Використання формату «союзного договору» від 1 червня 1919 року та 28 грудня 1920 року не для створення рівноправної федерації, а як інструменту для легалізації прямого жорсткого управління з Москви(Citation: 22).'
