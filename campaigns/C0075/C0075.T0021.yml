description:
  en: 'Coercion of legal Ukrainian parties into self-dissolution (in particular, the Borotbists in the spring of 1920) and their absorption by the CP(b)U through political blackmail and the bribery of their leaders with official posts(Citation: 22).'
  uk: 'Примус до саморозпуску легальних українських партій (зокрема боротьбистів навесні 1920 року) та їх поглинання КП(б)У шляхом політичного шантажу і підкупу їхніх лідерів посадами(Citation: 22).'
  ru: 'Принуждение к самороспуску легальных украинских партий (в частности боротьбистов весной 1920 года) и их поглощение КП(б)У путем политического шантажа и подкупа их лидеров должностями(Citation: 22).'
