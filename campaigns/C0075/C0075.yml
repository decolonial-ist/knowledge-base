name:
  en: Institutional Absorption through a "Military-Political Union" (1919–1921)
  uk: Інституційне поглинання через «військово-політичний союз» (1919–1921)
  ru: Институциональное поглощение через «военно-политический союз» (1919–1921)
description:
  en: |-
    The final destruction of Ukrainian sovereignty through the imposition of treaties on a so-called military-political union.
    While formally preserving the status of an independent republic, the leadership of the RSFSR de facto brought the key Ukrainian agencies — military, financial, economic, and transport — under its direct control.
    On March 18, 1921, Soviet Russia and Soviet Ukraine signed the Treaty of Riga with Poland and divided the Ukrainian lands.
    Poland, the ally of the Ukrainian People's Republic (UNR) under the Treaty of Warsaw, signed peace with Soviet Ukraine, recognizing it as a state(Citation: 196)(Citation: 22)(Citation: 25).
  uk: |-
    Остаточне знищення українського суверенітету шляхом нав'язування договорів про так званий військово-політичний союз.
    Формально зберігаючи статус незалежної республіки, керівництво РРФСР де-факто перевело під свій прямий контроль ключові українські відомства — військове, фінансове, економічне та транспортне. 18 березня 1921 року радянська Росія і радянська Україна підписали з Польщею Ризький мирний договір і поділили українські землі.
    Польща, союзник Української Народної Республіки (УНР) за Варшавським договором, підписала мир з радянською Україною, визнавши її державою(Citation: 196)(Citation: 22)(Citation: 25).
  ru: |-
    Окончательное уничтожение украинского суверенитета путем навязывания договоров о так называемом военно-политическом союзе.
    Формально сохраняя статус независимой республики, руководство РСФСР де-факто перевело под свой прямой контроль ключевые украинские ведомства — военное, финансовое, экономическое и транспортное. 18 марта 1921 года советская Россия и советская Украина подписали с Польшей Рижский мирный договор и поделили украинские земли.
    Польша, союзник Украинской Народной Республики (УНР) по Варшавскому договору, подписала мир с советской Украиной, признав её государством(Citation: 196)(Citation: 22)(Citation: 25).
