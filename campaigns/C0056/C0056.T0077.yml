description:
  en: 'The use of the regular army to suppress the peasants'' anti-serfdom uprising in Sloboda Ukraine (the Shebelynka uprising of 1829) – one in a series of revolts caused by the "servile condition" of the military settlements'' inhabitants(Citation: 185).'
  uk: 'Використання регулярної армії для придушення антикріпосницького виступу селян на Слобожанщині (Шебелинське повстання 1829 року) – одного з низки повстань, спричинених «підневільним становищем» мешканців військових поселень(Citation: 185).'
  ru: 'Использование регулярной армии для подавления антикрепостнического выступления крестьян на Слобожанщине (Шебелинское восстание 1829 года) – одного из череды восстаний, вызванных «подневольным положением» жителей военных поселений(Citation: 185).'
