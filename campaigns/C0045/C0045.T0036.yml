description:
  ru: 'Отмена традиционного местного самоуправления: «Окончательная ликвидация магдебургского права … в городах Центральной и Левобережной Украины – в 1831 (в Киеве – 1834)»(Citation: 194) – города переводились на общеимперское городовое устройство.'
  en: 'The abolition of traditional local self-government: "The final liquidation of Magdeburg law… in the cities of Central and Left-Bank Ukraine – in 1831 (in Kyiv – 1834)"(Citation: 194) – the cities were transferred to the empire-wide municipal order.'
  uk: |-
    Скасування традиційного місцевого самоврядування: «Остаточна ліквідація М[агдебурзького] п[рава] … в містах Центр. і Лівобереж.
    України – у 1831 (у Києві – 1834)»(Citation: 194) – міста переводилися на загальноімперський міський устрій.
