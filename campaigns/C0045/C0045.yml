name:
  en: Abolition of Magdeburg Rights (1831)
  uk: Скасування Магдебурзького права (1831)
  ru: Отмена Магдебургского права (1831)
description:
  en: 'The abolition of the traditional system of municipal self-government: "The final liquidation of Magdeburg law on the western Ukrainian lands took place in 1786, and in the cities of Central and Left-Bank Ukraine – in 1831 (in Kyiv – 1834)"(Citation: 194) – the final stage of embedding the cities into the imperial administrative-judicial system, begun as early as the reforms of the 1780s.'
  uk: |-
    Скасування традиційної системи місцевого самоврядування в містах: «Остаточна ліквідація М[агдебурзького] п[рава] на західноукр. землях відбулася 1786, а в містах Центр. і Лівобереж.
    України – у 1831 (у Києві – 1834)»(Citation: 194) – фінальний етап вбудовування міст в імперську адміністративно-судову систему, розпочатого ще реформами 1780-х років.
  ru: 'Упразднение традиционной системы местного самоуправления в городах: «Окончательная ликвидация магдебургского права на западноукраинских землях произошла в 1786, а в городах Центральной и Левобережной Украины – в 1831 (в Киеве – 1834)»(Citation: 194) – финальный этап встраивания городов в имперскую административно-судебную систему, начатого еще реформами 1780-х годов.'
