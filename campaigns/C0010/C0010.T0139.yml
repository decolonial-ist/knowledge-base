description:
  ru: |-
    Развертывание сети военных баз (Новобогородицкая, Каменный Затон) возле Запорожской Сечи.
    Под предлогом защиты Москва устанавливала жесткий военный контроль: «Запорожцы... как условие для любой присяги выдвигали разрушение Каменного Затона»(Citation: 4)(Citation: 3).
  en: |-
    The deployment of a network of military bases (Novobohorodytska, Kamianyi Zaton) near the Zaporozhian Sich.
    Under the pretext of protection, Moscow was establishing rigid military control: "The Zaporozhians... put forward the destruction of Kamianyi Zaton as a condition for any oath of allegiance"(Citation: 4)(Citation: 3).
  uk: |-
    Розгортання мережі військових баз (Новобогородицька, Кам'яний Затон) біля Запорозької Січі.
    Під приводом захисту Москва встановлювала жорсткий військовий контроль: «Запорожці... як умову для будь-якої присяги висували зруйнування Кам'яного Затону»(Citation: 4)(Citation: 3).
