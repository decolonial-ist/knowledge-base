description:
  ru: 'Раздача высших имперских наград для покупки лояльности гетмана на фоне ресурсного истощения Украины: Петр I «изволили мя нареши славного чина святого первозванного Христова апостола Андрея кавалером»(Citation: 4)(Citation: 3).'
  en: 'The distribution of the highest imperial awards to buy the hetman''s loyalty against the backdrop of Ukraine''s resource exhaustion: Peter I "deigned to name me a knight of the glorious order of the holy first-called apostle of Christ, Andrew"(Citation: 4)(Citation: 3).'
  uk: 'Роздача найвищих імперських нагород для купівлі лояльності гетьмана на тлі ресурсного виснаження України: Петро I «зволили мене наректи славного чину святого первозваного Христового апостола Андрія кавалером»(Citation: 4)(Citation: 3).'
