description:
  ru: 'Перекладывание финансового и логистического бремени имперских войн на плечи автономии: «Корм охочим войскам поставляли посполитые, они же заготавливали на зиму сено для войсковой артиллерии»(Citation: 4)(Citation: 3).'
  en: 'Shifting the financial and logistical burden of imperial wars onto the autonomy''s shoulders: "The commoners supplied provisions for the volunteer troops, and they also stocked hay for the winter for the host''s artillery"(Citation: 4)(Citation: 3).'
  uk: 'Перекладання фінансового та логістичного тягаря імперських воєн на плечі автономії: «Корм охочим військам постачали посполиті, вони ж заготовляли на зиму сіно для військової артилерії»(Citation: 4)(Citation: 3).'
