name:
  en: Economic Exploitation and Creation of Dependency of the Nokhchi (1617–1622)
  uk: Економічна експлуатація та створення залежності Нохчі (1617–1622)
  ru: Экономическая эксплуатация и создание зависимости нохчи (1617–1622)
description:
  en: |-
    The occupation administration of the Tsardom of Muscovy in the town of Terki used the subordinated Nokhchi (Okochans) to carry out state tasks while artificially keeping them in a state of economic dependency.
    In their petition to Tsar Mikhail Fedorovich, the Okochan murza Kokhostrov Biytemirov and the serving Okochans of the town of Terki reported constant coercion into military action: «against your sovereign's disobedient ones we fight, we, your sovereign's kholops, not sparing our heads; for you, sovereign, we shed our blood and lay down our heads»(Citation: 82).
    At the same time, the metropole deliberately withheld basic subsistence resources from the Indigenous population for five years.
    A memorandum from the Ambassadorial Prikaz to the Prikaz of the Kazan Palace records: «the sovereign's grain allowance for the past years — for the 125th, and the 126th, and the 127th, and the 128th, and the 129th year — was not given to them»(Citation: 82).
    The result was the exhaustion of the population: Biytemirov reported that they «have been left without grain, have utterly perished from hunger and every hardship and have fallen, sovereign, into great debt, and we are dying a death of starvation together with our wives and children»(Citation: 82).
    To resolve the crisis, the leader of the Nokhchi set out for Moscow, but perished while returning to the Caucasus.
    A memorandum from the Ambassadorial Prikaz states that «Kokhostrov-murza together with his man drowned in the Oka River»(Citation: 82), while representatives of the metropole resolved to confiscate the property of the deceased: «his clothing and all his belongings were taken into our treasury»(Citation: 82).
    The delegate's death was used to further curtail the rights of the Nokhchi.
    In a petition submitted to Tsar Mikhail Fedorovich, the Okochan murza Chepan Kokhostrov indicated that in the incident «the sovereign's charter of grant was lost together with him»(Citation: 82), as a result of which the occupation administration artificially lowered the status of his family in order to impose obligations upon it: an official extract of the Ambassadorial Prikaz records that the heirs were «made equal in everything with the Okochans, with the plowing people, and carts and wagons are taken from them», whereas previously from them «no taxes whatsoever had been taken»(Citation: 82).
  uk: |-
    Окупаційна адміністрація Московського царства в Терському місті використовувала підкорених Нохчі (Окочан) для виконання державних завдань, штучно утримуючи їх у стані економічної залежності.
    У своїй чолобитній цареві Михайлу Федоровичу окоцький мурза Кохостров Бійтеміров та служилі Окочани Терського міста звітували про постійний примус до воєнних дій: «з твоїми государевими непослушниками б'ємося ми, холопи твої государеві, не шкодуючи голів своїх, за тебе, государю, кров свою проливаємо і голови свої складаємо»(Citation: 82).
    При цьому метрополія навмисно не видавала корінному населенню базових ресурсів для життєзабезпечення впродовж п'яти років.
    У пам'яті з Посольського приказу до приказу Казанського палацу зафіксовано: «государевого хлібного жалування за минулі роки — за 125-й, і за 126-й, і за 127-й, і за 128-й, і за 129-й рік — їм не дано»(Citation: 82).
    Результатом стало виснаження населення: Бійтеміров доповідав, що вони «стали безхлібні, від голоду та всякої нужди вкрай загинули й заборгували, государю, великим боргом, і помираємо з жінками й дітьми голодною смертю»(Citation: 82).
    Для розв'язання кризи очільник Нохчі вирушив до Москви, однак під час повернення на Кавказ загинув.
    У пам'яті з Посольського приказу констатується, що «Кохостров-мурза зі своєю людиною втонув у річці Оці»(Citation: 82), при цьому представники метрополії постановили конфіскувати майно загиблого: «одяг його і всяке майно взяли до нашої казни»(Citation: 82).
    Смерть делегата була використана для подальшого обмеження прав Нохчі.
    У поданій цареві Михайлу Федоровичу чолобитній окоцький мурза Чепан Кохостров зазначав, що під час інциденту «государева жалувана грамота пропала разом із ним»(Citation: 82), унаслідок чого окупаційна адміністрація штучно понизила статус його родини для обкладення повинностями: у доповідній виписці Посольського приказу зафіксовано, що спадкоємців було «зрівняно в усьому з Окочанами, з орними людьми, і підводи й вози з них беруть», тоді як раніше з них «жодних податей не бралося»(Citation: 82).
  ru: |-
    Оккупационная администрация Московского Царства в Терском городе использовала подчиненных нохчи (окочан) для выполнения государственных задач, искусственно удерживая их в состоянии экономической зависимости.
    В своей челобитной царю Михаилу Федоровичу окоцкий мурза Кохостров Бийтемиров и служилые окочане Терского города отчитывались о постоянном принуждении к военным действиям: «с твоими государевы непослушники бьемся мы, холопи твои государевы, не щадя голов своих, за себя, государя, кровь свою проливаем и головы свои складываем»(Citation: 82).
    При этом метрополия преднамеренно не выдавала коренному населению базовые ресурсы для жизнеобеспечения на протяжении пяти лет.
    В памяти из Посольского приказа в приказ Казанского дворца фиксируется: «государева де им хлебново жалованья на прошлые годы на 125-й, и на 126-й, и на 127-й, и на 128-й, и на 129-й год не дано»(Citation: 82).
    Результатом стало истощение населения: Бийтемиров докладывал, что они «стали безхлебны, от голоду и от всякие нужи в конец погибли и одолжали, государь, великим долгом и помираем з женишками и з детишка голодною смертью»(Citation: 82).
    Для разрешения кризиса предводитель нохчи отправился в Москву, однако во время возвращения на Кавказ погиб.
    В памяти из Посольского приказа констатируется, что «Кохостров-мурза с человеком своим в Оке реке утонул»(Citation: 82), при этом представители метрополии постановили конфисковать имущество погибшего: «платье его и всякую рухлядь взяли в нашу казну»(Citation: 82).
    Смерть делегата была использована для дальнейшего ущемления прав нохчи.
    В поданной царю Михаилу Федоровичу челобитной окоцкий мурза Чепан Кохостров указывал, что при инциденте «государева жаловальная грамота пропала с ним же»(Citation: 82), в результате чего оккупационная администрация искусственно понизила статус его семьи для обложения повинностями: в докладной выписке Посольского приказа фиксируется, что наследники были «сверстаны во всем с окочаны, с пахотными людьми, и подводы и телеги с них емлют», тогда как ранее с них «никаких податей не имывано»(Citation: 82).
