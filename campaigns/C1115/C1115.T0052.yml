description:
  ru: 'Представители метрополии конфисковали личное имущество погибшего делегата нохчи в государственную казну: в памяти из Посольского приказа в приказ Казанского дворца предписывалось расследовать гибель утонувшего окоцкого мурзы Кохострова Бийтемирова, а найденное «платье его и всякую рухлядь взяли в нашу казну»(Citation: 82).'
  en: 'Representatives of the metropole confiscated the personal property of a deceased Nokhchi delegate into the state treasury: a memorandum from the Posolsky Prikaz to the Prikaz of the Kazan Palace prescribed an investigation into the death of the drowned Okotsky murza Kokhostrov Biytemirov, while of what was found they «took his clothing and all his goods into our treasury»(Citation: 82).'
  uk: 'Представники метрополії конфіскували особисте майно загиблого делегата Нохчі до державної скарбниці: у пам''яті з Посольського приказу до приказу Казанського палацу приписувалося розслідувати загибель окоцького мурзи Кохострова Бійтемірова, який утонув, а зі знайденого «плаття його і всяку рухлядь взяли в нашу казну»(Citation: 82).'
