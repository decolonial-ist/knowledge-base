description:
  ru: 'Администрация метрополии не оплачивала принудительный труд и удерживала продовольствие на протяжении пяти лет: в памяти из Посольского приказа в приказ Казанского дворца фиксируется жалоба о том, что подчиненным окочанам Терского города «государева де им хлебново жалованья на прошлые годы на 125-й, и на 126-й, и на 127-й, и на 128-й, и на 129-й год не дано»(Citation: 82).'
  en: 'The metropole''s administration did not pay for forced labor and withheld food provisions for five years: a memorandum from the Posolsky Prikaz (Ambassadorial Office) to the Prikaz of the Kazan Palace records a complaint that the subordinate Okochans of Tersky Town «were not given the sovereign''s grain allowance for the past years — for the 125th, and the 126th, and the 127th, and the 128th, and the 129th year»(Citation: 82).'
  uk: 'Адміністрація метрополії не оплачувала примусову працю та утримувала продовольство протягом п''яти років: у пам''яті з Посольського приказу до приказу Казанського палацу зафіксовано скаргу про те, що підпорядкованим Окочанам Терського міста «государевого хлібного жалування за минулі роки — за 125-й, і за 126-й, і за 127-й, і за 128-й, і за 129-й рік — не дано»(Citation: 82).'
