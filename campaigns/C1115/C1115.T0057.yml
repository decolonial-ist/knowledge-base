description:
  en: 'The occupation administration deliberately exhausted the Indigenous population materially, forcing them to perform compulsory service at their own expense: in a petition submitted to Tsar Mikhail Fyodorovich, the Okotsky murza Kokhostrov Biytemirov and the serving Okochans of Tersky Town reported that, because their allowance went unpaid, they «were left without grain, have utterly perished from hunger and every hardship, have fallen, sovereign, into great debt, and are dying a death of starvation together with our wives and little children»(Citation: 82).'
  uk: 'Окупаційна адміністрація цілеспрямовано виснажувала корінне населення матеріально, змушуючи нести примусову службу власним коштом: у поданій цареві Михайлу Федоровичу чолобитній окоцький мурза Кохостров Бійтеміров та служилі Окочани Терського міста доповідали, що через невиплату жалування вони «стали безхлібні, від голоду і від усякої нужди вкрай загинули і заборгували, государю, великим боргом, і помираємо з жінками і з дітьми голодною смертю»(Citation: 82).'
  ru: 'Оккупационная администрация целенаправленно истощала коренное население материально, заставляя нести принудительную службу за свой счет: в поданной царю Михаилу Федоровичу челобитной окоцкий мурза Кохостров Бийтемиров и служилые окочане Терского города докладывали, что из-за невыплаты жалованья они «стали безхлебны, от голоду и от всякие нужи в конец погибли и одолжали, государь, великим долгом и помираем з женишками и з детишка голодною смертью»(Citation: 82).'
