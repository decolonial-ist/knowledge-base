description:
  en: |-
    An armed seizure of power: the GKChP statement of 18 August 1991 announced the transfer of the USSR president's powers: "In connection with the impossibility, for reasons of health, of Mikhail Sergeevich Gorbachev performing the duties of President of the USSR and the transfer… of the powers of the President of the USSR to Vice-President Gennady Ivanovich Yanayev… to form the State Committee for the State of Emergency in the USSR"(Citation: 176).
    The putsch was timed to derail the treaty-based reconstitution of the Union: "The formation of the GKChP was preceded by the so-called Novo-Ogaryovo process - negotiations begun on April 23, 1991 by USSR President Gorbachev at his suburban residence of Novo-Ogaryovo with the leaders of the union republics on the signing of a new Union Treaty"(Citation: 213) - the coup cut this process short.
  uk: |-
    Збройне захоплення влади: заява ГКЧП від 18 серпня 1991 року оголосила про перехід повноважень президента СРСР: «У зв'язку з неможливістю за станом здоров'я виконання Горбачовим Михайлом Сергійовичем обов'язків Президента СРСР і переходом… повноважень Президента Союзу РСР до віцепрезидента СРСР Янаєва Геннадія Івановича… утворити Державний комітет з надзвичайного стану в СРСР (ГКЧП СРСР)»(Citation: 176).
    Путч було приурочено до зриву договірного перезаснування Союзу: «Утворенню ГКЧП передував так званий новоогарьовський процес - започатковані 23 квітня 1991 переговори президента СРСР М.Горбачова в його заміській резиденції Ново-Огарьово з керівниками союзних республік про підписання нового Союзного договору»(Citation: 213) - переворот обірвав цей процес.
  ru: |-
    Вооруженный захват власти: заявление ГКЧП от 18 августа 1991 года объявило о переходе полномочий президента СССР: «В связи с невозможностью по состоянию здоровья исполнения Горбачевым Михаилом Сергеевичем обязанностей Президента СССР и переходом… полномочий Президента Союза ССР к вице-президенту СССР Янаеву Геннадию Ивановичу… образовать Государственный комитет по чрезвычайному положению в СССР (ГКЧП СССР)»(Citation: 176).
    Путч был приурочен к срыву договорного переучреждения Союза: «Образованию ГКЧП предшествовал так называемый новоогарёвский процесс - начатые 23 апреля 1991 года переговоры президента СССР Горбачёва в его загородной резиденции Ново-Огарёво с руководителями союзных республик о подписании нового Союзного договора»(Citation: 213) - переворот оборвал этот процесс.
