description:
  ru: |-
    В ходе истребления Малой Чечни экспедицией Фезе в январе 1837 года войска брали заложников с аулов, поставленных перед выбором между подчинением и участью соседей.
    По журналу экспедиции, представленному Розеном военному министру Чернышеву 11 февраля 1837, 26 января в Ачхое взяты 6 аманатов «из семейств почетнейших старшин», в Пхан-кичу - 4 (аманат - человек, которого империя забирала у общины как гарантию подчинения; журнал оформляет изъятие людей словом «выдали»)(Citation: 105).
    Заложники из самых влиятельных семей делали каждую общину ответственной перед империей жизнями своих людей.
  en: |-
    In the course of the annihilation of Lesser Chechnya by Feze's expedition in January 1837, the troops took hostages from auls faced with the choice between subjugation and the fate of their neighbors.
    According to the expedition journal presented by Rozen to Minister of War Chernyshev on 11 February 1837, on 26 January 6 amanats "from the families of the most honored elders" were taken in Achkhoy, and 4 in Phan-kichu (amanat - a person whom the empire took from a community as a guarantee of subjugation; the journal frames the seizure of people with the word "handed over")(Citation: 105).
    Hostages from the most influential families made every community answerable to the empire with the lives of its own people.
  uk: |-
    Під час винищення Малої Чечні експедицією Фезе в січні 1837 року війська брали заручників з аулів, поставлених перед вибором між підкоренням і долею сусідів.
    За журналом експедиції, представленим Розеном військовому міністру Чернишову 11 лютого 1837, 26 січня в Ачхої взято 6 аманатів «із сімейств найповажніших старшин», у Пхан-кічу - 4 (аманат - людина, яку імперія забирала в громади як гарантію підкорення; журнал оформлює вилучення людей словом «видали»)(Citation: 105).
    Заручники з найвпливовіших сімей робили кожну громаду відповідальною перед імперією життями своїх людей.
