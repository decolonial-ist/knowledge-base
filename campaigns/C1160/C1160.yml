name:
  ru: 'Истребление Малой Чечни экспедицией Фезе: 92 пленных, более тысячи сожжённых саклей (январь 1837)'
  en: 'Annihilation of Lesser Chechnya by Feze''s Expedition: 92 Captives, More Than a Thousand Saklias Burned (January 1837)'
  uk: 'Винищення Малої Чечні експедицією Фезе: 92 полонених, понад тисяча спалених сакель (січень 1837)'
description:
  ru: |-
    23-29 января 1837 года командование российского Кавказского корпуса направило из крепости Грозной в Малую Чечню (равнинно-предгорную западную часть Чечни) отряд генерала Фезе - 3249 человек при 12 орудиях.
    Цель похода Розен сформулировал в рапорте военному министру Чернышеву от 11 февраля 1837: «для наказания уклонившихся от повиновения Чеченцев западной части Чечни»(Citation: 105).
    Приложенный к рапорту журнал экспедиции записывает ход недели день за днём: в ночь на 24 января окружён Шалаж-юрт - село взято «без выстрела, положив на месте 14 душ», 67 жителей уведены в плен, село сожжено; 25 января Фезе отправил колонны «для открытия и уничтожения народонаселения в густых лесах вверх по обоим берегам р. Шалажи»; всего за поход взято в плен 92 человека, «на обратном пути сожжено более тысячи саклей по Мартанскому и несколько сот по Тенгинскому ущельям» (сакля - дом горца), истреблены запасы хлеба и сена посреди зимы(Citation: 105).
    В отряде империя вела горцев против горцев - 800 всадников осетинской и ингушской милиции (милиция - вспомогательные отряды из горцев на имперской службе): журнал экспедиции называет в колонне полковника Широкого «сотню козаков и 800 всадников из Осетин и Ингуш»(Citation: 105).
    С аула Ачхой, в который войска вошли на четвёртый день истребления соседей, по записи того же журнала взяты присяга «в покорности» и шесть заложников-аманатов (аманат - человек, которого империя забирала у общины как гарантию подчинения)(Citation: 105).
  en: |-
    On 23-29 January 1837, the command of the Russian Caucasus Corps sent from the Groznaya fortress into Lesser Chechnya (the lowland-piedmont western part of Chechnya) a detachment under General Feze - 3249 men with 12 guns.
    Rozen stated the purpose of the campaign in a report to Minister of War Chernyshev of 11 February 1837: "to punish the Chechens of the western part of Chechnya who have evaded obedience"(Citation: 105).
    The expedition journal appended to the report records the week day by day: on the night of 24 January Shalazh-yurt was surrounded - the village was taken "without a shot, laying 14 souls on the spot", 67 inhabitants were led away into captivity, and the village was burned; on 25 January Feze dispatched columns "to discover and destroy the population in the dense forests up both banks of the Shalazha river"; in all, 92 people were taken captive over the campaign, "on the way back more than a thousand saklias were burned along the Martan and Tengin gorges" (saklia - a highlander's house), and the stores of grain and hay were destroyed in the middle of winter(Citation: 105).
    Within the detachment the empire led highlanders against highlanders - 800 horsemen of the Ossetian and Ingush militia (militia - auxiliary units of highlanders in the empire's service): the expedition journal lists in Colonel Shiroky's column "a hundred Cossacks and 800 horsemen of Ossetians and Ingush"(Citation: 105).
    From the aul of Achkhoy, which the troops entered on the fourth day of the annihilation of its neighbors, by the record of the same journal an oath "of submission" and six hostages-amanats were taken (amanat - a person whom the empire took from a community as a guarantee of subordination)(Citation: 105).
  uk: |-
    23-29 січня 1837 року командування російського Кавказького корпусу направило з фортеці Грозна до Малої Чечні (рівнинно-передгірної західної частини Чечні) загін генерала Фезе - 3249 осіб при 12 гарматах.
    Мету походу Розен сформулював у рапорті військовому міністру Чернишову від 11 лютого 1837: «для покарання чеченців західної частини Чечні, що ухилилися від покори»(Citation: 105).
    Доданий до рапорту журнал експедиції записує хід тижня день за днем: у ніч на 24 січня оточено Шалаж-юрт - село взяте «без пострілу, поклавши на місці 14 душ», 67 жителів уведено в полон, село спалене; 25 січня Фезе відправив колони «для відкриття і знищення народонаселення в густих лісах вгору по обох берегах р. Шалажі»; загалом за похід узято в полон 92 особи, «на зворотному шляху спалено понад тисячу сакель по Мартанському і кілька сот по Тенгінському ущелинах» (сакля - дім горця), знищено запаси хліба і сіна посеред зими(Citation: 105).
    У загоні імперія вела горців проти горців - 800 вершників осетинської та інгуської міліції (міліція - допоміжні загони з горців на імперській службі): журнал експедиції називає в колоні полковника Широкого «сотню козаків і 800 вершників з осетинів та інгушів»(Citation: 105).
    З аулу Ачхой, до якого війська увійшли на четвертий день винищення сусідів, за записом того ж журналу взято присягу «в покірності» і шість заручників-аманатів (аманат - людина, яку імперія забирала в громади як гарантію підпорядкування)(Citation: 105).
