description:
  ru: |-
    Завершая истребление Малой Чечни, войска Фезе уничтожили и еду уцелевших: 29 января 1837 года, по журналу экспедиции при рапорте Розена военному министру Чернышеву от 11 февраля 1837, «отряд до полудня довершил истребление жилищ и запасов хлеба и сена по Мартанскому ущелью»(Citation: 105).
    Уничтожение продовольствия и корма посреди зимы оставляло выживших без средств пережить её.
  en: |-
    Completing the annihilation of Lesser Chechnya, Feze's troops destroyed the survivors' food as well: on 29 January 1837, according to the expedition journal appended to Rozen's report to Minister of War Chernyshev of 11 February 1837, "by noon the detachment completed the destruction of the dwellings and of the stores of grain and hay along the Martan gorge"(Citation: 105).
    The destruction of food and fodder in the middle of winter left the survivors without means to live through it.
  uk: |-
    Завершуючи винищення Малої Чечні, війська Фезе знищили і їжу вцілілих: 29 січня 1837 року, за журналом експедиції при рапорті Розена військовому міністру Чернишову від 11 лютого 1837, «загін до полудня довершив винищення жител і запасів хліба та сіна по Мартанському ущелині»(Citation: 105).
    Знищення продовольства і корму посеред зими залишало тих, хто вижив, без засобів пережити її.
