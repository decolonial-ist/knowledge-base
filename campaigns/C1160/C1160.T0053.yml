description:
  en: |-
    During the annihilation of Lesser Chechnya by Feze's expedition on 23-29 January 1837, the troops led 92 inhabitants away into captivity.
    The expedition journal, presented by Rozen to Minister of War Chernyshev on 11 February 1837, counts by episode: at the taking of Shalazh-yurt "67 souls were taken captive", at Urus-Martan "13 souls were captured", at Khankharik-Roshnya and Birzul the detachment "took 12 souls captive"(Citation: 105).
  uk: |-
    Під час винищення Малої Чечні експедицією Фезе 23-29 січня 1837 року війська увели в полон 92 жителів.
    Журнал експедиції, представлений Розеном військовому міністру Чернишову 11 лютого 1837, рахує за епізодами: при взятті Шалаж-юрта «в полон узято 67 душ», біля Урус-Мартана «захоплено в полон 13 душ», біля Ханхарик-Рошні та Бірзуля загін «узяв у полон 12 душ»(Citation: 105).
  ru: |-
    При истреблении Малой Чечни экспедицией Фезе 23-29 января 1837 года войска увели в плен 92 жителя.
    Журнал экспедиции, представленный Розеном военному министру Чернышеву 11 февраля 1837, считает по эпизодам: при взятии Шалаж-юрта «в плен взято 67 душ», у Урус-Мартана «захвачено в плен 13 душ», у Ханхарик-Рошни и Бирзуля отряд «взял в плен 12 душ»(Citation: 105).
