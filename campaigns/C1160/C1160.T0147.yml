description:
  ru: |-
    26 января 1837 года, на четвёртый день истребления Малой Чечни экспедицией Фезе - через два дня после взятия соседнего Шалаж-юрта с 14 убитыми - войска, войдя в аул Ачхой, взяли с него присягу «в покорности» и 6 аманатов (аманат - человек, которого империя забирала у общины как гарантию подчинения)(Citation: 105).
    Рамку журнал экспедиции, представленный Розеном военному министру Чернышеву 11 февраля 1837, проговаривает сам: «войска следуют к ним не для наказания их, но собственно для утверждения в покорности»(Citation: 105) - закрепление подчинения под военным давлением, оформленное империей как добровольный акт подчинившихся.
  en: |-
    On 26 January 1837, on the fourth day of the annihilation of Lesser Chechnya by Feze's expedition - two days after the taking of neighboring Shalazh-yurt with 14 killed - the troops, entering the aul of Achkhoy, took from it an oath "of submission" and 6 amanats (amanat - a person whom the empire took from a community as a guarantee of subordination)(Citation: 105).
    The frame is spelled out by the expedition journal itself, presented by Rozen to Minister of War Chernyshev on 11 February 1837: "the troops are proceeding to them not to punish them, but properly to confirm them in submission"(Citation: 105) - subordination secured under military pressure and framed by the empire as a voluntary act of those who had submitted.
  uk: |-
    26 січня 1837 року, на четвертий день винищення Малої Чечні експедицією Фезе - через два дні після взяття сусіднього Шалаж-юрта з 14 убитими - війська, увійшовши в аул Ачхой, взяли з нього присягу «в покірності» і 6 аманатів (аманат - людина, яку імперія забирала в громади як гарантію підпорядкування)(Citation: 105).
    Рамку журнал експедиції, представлений Розеном військовому міністру Чернишову 11 лютого 1837, проговорює сам: «війська прямують до них не для покарання їх, а власне для утвердження в покірності»(Citation: 105) - закріплення підпорядкування під військовим тиском, оформлене імперією як добровільний акт тих, хто підпорядкувався.
