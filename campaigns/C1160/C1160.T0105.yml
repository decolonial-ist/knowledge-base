description:
  en: |-
    Feze's expedition through Lesser Chechnya on 23-29 January 1837 destroyed housing and livelihood outright.
    The expedition journal, presented by Rozen to Minister of War Chernyshev on 11 February 1837, records: "Having burned Shalazh-yurt", the troops "destroyed the winter quarters... and the dwellings of the Chechens on both banks of the Shalazha", and "on the way back more than a thousand saklias were burned along the Martan and Tengin gorges" (saklia - a highlander's house)(Citation: 105).
  uk: |-
    Експедиція Фезе по Малій Чечні 23-29 січня 1837 року знищувала житло і господарство дощенту.
    Журнал експедиції, представлений Розеном військовому міністру Чернишову 11 лютого 1837, фіксує: «Спаливши Шалаж-юрт», війська «винищили зимівники... і житла чеченців по обох берегах Шалажі», а «на зворотному шляху спалено понад тисячу сакель по Мартанському і кілька сот по Тенгінському ущелинах» (сакля - дім горця)(Citation: 105).
  ru: |-
    Экспедиция Фезе по Малой Чечне 23-29 января 1837 года уничтожала жильё и хозяйство подчистую.
    Журнал экспедиции, представленный Розеном военному министру Чернышеву 11 февраля 1837, фиксирует: «Сжегши Шалаж-юрт», войска «истребили зимовники... и жилища Чеченцев по обоим берегам Шалажи», а «на обратном пути сожжено более тысячи саклей по Мартанскому и несколько сот по Тенгинскому ущельям» (сакля - дом горца)(Citation: 105).
