description:
  ru: |-
    Многолетняя силовая кампания против крестьянского движения на Подолье: «в 1833—39 действовало специальное следствие по делу Кармалюка и его сообщников — «Галузинецкая комиссия»…
    За время её деятельности по обвинению или по подозрению в связях с Кармалюком проходило ок. 20 тыс. человек»(Citation: 192).
  en: |-
    A years-long campaign of force against the peasant movement in Podillia: "In 1833–39 a special investigation into the case of Karmaliuk and his associates operated – the 'Haluzyntsi commission'…
    During its activity, about 20 thousand people passed through it as accused or suspected of ties with Karmaliuk"(Citation: 192).
  uk: |-
    Багаторічна силова кампанія проти селянського руху на Поділлі: «1833—39 діяло спец. слідство в справі К. та його спільників — «Галузинецька комісія»…
    За час її діяльності за обвинуваченням або за підозрою у зв'язках із К. проходило бл. 20 тис. осіб»(Citation: 192).
