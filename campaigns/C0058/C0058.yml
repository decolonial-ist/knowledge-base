name:
  ru: Подавление гайдамацкого восстания Устима Кармалюка (до 1835)
  en: Suppression of the Haidamak Uprising of Ustym Karmaliuk (until 1835)
  uk: Придушення гайдамацького повстання Устима Кармалюка (до 1835)
description:
  ru: |-
    Многолетняя карательная кампания Российской империи против восстания бесправных украинских крестьян под предводительством Кармалюка.
    Сам он «не раз был схвачен, четыре раза приговорён к сибирской каторге, откуда бежал, преодолевая тысячи вёрст пешком», и был «Убит выстрелом из засады»(Citation: 192).
  en: |-
    A years-long punitive campaign of the Russian Empire against the uprising of rightless Ukrainian peasants led by Karmaliuk.
    He himself "was captured more than once, four times sentenced to Siberian hard labor, from which he escaped, covering thousands of versts on foot," and was "killed by a shot from ambush"(Citation: 192).
  uk: |-
    Багаторічна каральна кампанія Російської імперії проти повстання безправних українських селян під проводом Кармалюка.
    Сам він «не раз був схоплений, чотири рази засуджений до сибірської каторги, звідки тікав, долаючи тисячі верст пішки», і був «Вбитий пострілом із засідки»(Citation: 192).
