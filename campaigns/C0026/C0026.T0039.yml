description:
  ru: |-
    Кулуарный раздел Украины по Днепру: «Вечным миром» 1686 года Москва официально уступила Правобережье Варшаве, без участия и согласия самих украинцев.
    Судьбу правобережного казачества решали внешние столицы: запрет 1699 года стал реализацией этого раздела, против которого казаки Палия «Вопреки условиям „Вечного мира“ 1686» продолжали борьбу за объединение обоих берегов(Citation: 195).
  en: |-
    The backroom partition of Ukraine along the Dnipro: by the "Eternal Peace" of 1686 Moscow officially ceded the Right Bank to Warsaw, without the participation or consent of Ukrainians themselves.
    The fate of the Right-Bank Cossacks was decided by foreign capitals: the ban of 1699 implemented this partition, against which Palii's Cossacks, "contrary to the terms of the 'Eternal Peace' of 1686," continued the struggle to unite both banks(Citation: 195).
  uk: |-
    Кулуарний поділ України по Дніпру: «Вічним миром» 1686 року Москва офіційно поступилася Правобережжям Варшаві, без участі та згоди самих українців.
    Долю правобережного козацтва вирішували чужі столиці: заборона 1699 року стала реалізацією цього поділу, проти якого козаки Палія «Усупереч умовам „Вічного миру“ 1686» продовжували боротьбу за об'єднання обох берегів(Citation: 195).
