description:
  ru: 'Стирание памяти о национальных героях: «В январе 1914 года министр внутренних дел Николай Маклаков подписал циркуляр, которым по всем губерниям империи запретил „публичные чествования малороссийского писателя Тараса Шевченко“»(Citation: 205).'
  en: 'The erasure of the memory of national heroes: "In January 1914, minister of internal affairs Nikolai Maklakov signed a circular by which he forbade throughout all governorates of the empire ''public celebrations of the Little Russian writer Taras Shevchenko''"(Citation: 205).'
  uk: 'Стирання пам''яті про національних героїв: «У січні 1914 року міністр внутрішніх справ Микола Маклаков підписав циркуляр, яким по всіх губерніях імперії заборонив „публічні вшанування малоросійського письменника Тараса Шевченка“»(Citation: 205).'
