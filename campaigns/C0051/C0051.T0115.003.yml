description:
  ru: 'Запрет на посещение культурных мероприятий: попечитель округа «издал инструкцию, в которой определил посещение учащейся молодёжью украинских театральных спектаклей столь же недопустимым, как пребывание в бильярдных или пивных»(Citation: 200).'
  en: 'The ban on attending cultural events: the district curator "issued an instruction in which he declared students'' attendance of Ukrainian theatrical performances as inadmissible as spending time in billiard halls or beer houses"(Citation: 200).'
  uk: 'Заборона відвідувати культурні заходи: попечитель округу «видав інструкцію, в якій визначив відвідання учнівською молоддю українських театральних вистав так само неприпустимим, як перебування у більярдних чи пивних»(Citation: 200).'
