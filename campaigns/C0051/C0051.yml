name:
  ru: Запрет культуры и прессы перед Первой мировой войной (1913–1914)
  en: Ban on Culture and the Press Before World War I (1913–1914)
  uk: Заборона культури та преси напередодні Першої світової війни (1913–1914)
description:
  ru: 'Российская империя продолжает уничтожать культуру коренного народа накануне войны: попечитель киевского округа Деревицкий в 1913 году «издал инструкцию, в которой определил посещение учащейся молодёжью украинских театральных спектаклей столь же недопустимым, как пребывание в бильярдных или пивных, а в 1914-м категорически запретил во всех учебных заведениях киевского округа отмечать 100-летний юбилей Тараса Шевченко»(Citation: 200); с началом войны Николай II именным указом от 20 июля 1914 года ввёл военную цензуру с правом командования «приостанавливать повременные издания»(Citation: 416) - военные власти Киевского военного округа в тот же день закрыли единственную украинскую ежедневную газету «Рада»(Citation: 431).'
  en: 'The Russian Empire continued destroying the indigenous people''s culture on the eve of the war: the curator of the Kyiv school district, Derevytsky, in 1913 "issued an instruction in which he declared students'' attendance of Ukrainian theatrical performances as inadmissible as spending time in billiard halls or beer houses, and in 1914 categorically forbade all educational institutions of the Kyiv district to mark the 100th jubilee of Taras Shevchenko"(Citation: 200); with the outbreak of the war, Nicholas II by a personal decree of 20 July 1914 introduced military censorship with the command''s right "to suspend periodical publications"(Citation: 416) - and that very day the military authorities of the Kyiv military district closed the only Ukrainian daily newspaper, "Rada"(Citation: 431).'
  uk: 'Російська імперія продовжує нищити культуру корінного народу напередодні війни: попечитель київського округу Деревицький 1913 року «видав інструкцію, в якій визначив відвідання учнівською молоддю українських театральних вистав так само неприпустимим, як перебування у більярдних чи пивних, а у 1914-му категорично заборонив в усіх навчальних закладах київського округу відзначати 100-річний ювілей Тараса Шевченка»(Citation: 200); з початком війни Микола II іменним указом від 20 липня 1914 року запровадив воєнну цензуру з правом командування «призупиняти періодичні видання»(Citation: 416) - військова влада Київської військової округи того ж дня закрила єдину українську щоденну газету «Рада»(Citation: 431).'
