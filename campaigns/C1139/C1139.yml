name:
  ru: Неудачная попытка подкупа старшин нохчи экономическими посулами в обмен на подданство (1806)
  en: Failed Attempt to Bribe Nokhchi Elders with Economic Promises in Exchange for Allegiance (1806)
  uk: Невдала спроба підкупу старшин Нохчі економічними обіцянками в обмін на підданство (1806)
description:
  ru: |-
    Российская империя через главнокомандующего на Кавказе генерала Гудовича обратилась к старшинам нохчи с обвещением, предлагая экономические выгоды за принятие подданства и прекращение вооружённого сопротивления: за подчинение старшинам обещали допуск к соли, чтобы им «дозволено будет брать из здешних соляных озёр по билетам безвозвратно с заплатою весьма малой постановленной цены», и право «перегонять скот на сию сторону Терека и пользоваться свободно по пустопорозжим пастбищным местам»(Citation: 99).
    Подданство принято не было; к концу года империя перешла к подготовке вооружённого вторжения, начавшегося в феврале следующего года.
  en: |-
    The Russian Empire, through the commander-in-chief in the Caucasus, General Gudovich, addressed the Nokhchi elders with a proclamation offering economic benefits in exchange for accepting allegiance and ceasing armed resistance: for submission, the elders were promised access to salt, so that they «will be permitted to take from the local salt lakes by tickets, irrevocably, with payment of a very small fixed price», and the right «to drive cattle to this side of the Terek and freely use the vacant pasture lands»(Citation: 99).
    Allegiance was not accepted; by the end of the year the empire moved to preparing an armed invasion, which began in February of the following year.
  uk: |-
    Російська імперія через головнокомандувача на Кавказі генерала Гудовича звернулася до старшин Нохчі з оголошенням, пропонуючи економічні вигоди за прийняття підданства та припинення збройного опору: за покірність старшинам обіцяли допуск до солі, щоб їм «дозволено буде брати з тутешніх соляних озер за білетами безповоротно зі сплатою вельми малої встановленої ціни», та право «переганяти худобу на цей бік Терека і вільно користуватися пустопорожніми пасовищними місцями»(Citation: 99).
    Підданства прийнято не було; наприкінці року імперія перейшла до підготовки збройного вторгнення, що почалося в лютому наступного року.
