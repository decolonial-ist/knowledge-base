description:
  en: |-
    The Russian Empire, through the commander-in-chief in the Caucasus, General Gudovich, addressed the elders of the Nokhchi with a proclamation offering economic benefits in exchange for accepting subjecthood and ceasing armed resistance.
    For submission, the elders were promised access to salt: they would be “permitted to take salt from the local salt lakes by tickets, irrevocably, paying a very small fixed price,” as well as the right “to drive livestock to this side of the Terek and freely use the vacant pasture lands.”
    The proclamation was conveyed to Chechen society and its elders (Kusu Al-Temir, Masarai, Idut), but subjecthood was not accepted; at the beginning of the following year the empire proceeded to armed invasion.(Citation: 99).
    The same offer is independently recorded by the imperial historian Dubrovin: the commander-in-chief in the Caucasus, General Gudovich, “promised… to release salt in unlimited quantity, for the most trifling payment; to permit the driving of livestock for pasture in wintertime to the left bank of the Terek River… and, finally, to make them equal to Russian subjects”(Citation: 114).
  uk: |-
    Російська імперія через головнокомандувача на Кавказі генерала Гудовича звернулася до старшин Нохчі з оголошенням, пропонуючи економічні вигоди за прийняття підданства і припинення збройного опору.
    За покірність старшинам обіцяли доступ до солі: їм «дозволено буде брати з тутешніх соляних озер за квитками безповоротно зі сплатою вельми малої встановленої ціни», а також право «переганяти худобу на цей бік Терека і вільно користуватися порожніми пасовищними місцями».
    Оголошення було доведено до чеченського суспільства та його старшин (Кусу Аль-Темір, Масарай, Ідут), однак підданство прийняте не було; на початку наступного року імперія перейшла до збройного вторгнення.(Citation: 99).
    Ту саму пропозицію незалежно фіксує імперський історик Дубровін: головнокомандувач на Кавказі генерал Гудович «обіцяв… відпускати сіль у необмеженій кількості, за найнікчемнішу плату; дозволити переганяти худобу на випас у зимовий час на лівий берег річки Терек… і, нарешті, зрівняти їх із російськими підданими»(Citation: 114).
  ru: |-
    Российская империя через главнокомандующего на Кавказе генерала Гудовича обратилась к старшинам нохчи с обвещением, предлагая экономические выгоды за принятие подданства и прекращение вооруженного сопротивления.
    За подчинение старшинам обещали допуск к соли: им «дозволено будет брать из здешних соляных озер по билетам безвозвратно с заплатою весьма малой постановленной цены», а также право «перегонять скот на сию сторону Терека и пользоваться свободно по пустопорозжим пастбищным местам».
    Обвещение было доведено до чеченского общества и его старшин (Кусу Аль-Темир, Масарай, Идут), однако подданство принято не было; в начале следующего года империя перешла к вооруженному вторжению.(Citation: 99).
    То же предложение независимо фиксирует имперский историк Дубровин: главнокомандующий на Кавказе генерал Гудович «обещал… отпускать соль в неограниченном размере, за самую ничтожную плату; дозволить перегонять скот для пастьбы в зимнее время на левый берег реки Терека… и, наконец, сравнять их с русскими подданными»(Citation: 114).
