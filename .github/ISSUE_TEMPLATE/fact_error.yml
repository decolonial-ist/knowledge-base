name: Ошибка факта / Помилка факту / Factual error
description: Неверная дата, число, имя, место или событие / Хибна дата, число, ім'я, місце чи подія / A wrong date, number, name, place or event
labels: [fact]
body:
  - type: input
    id: where
    attributes:
      label: Где / Де / Where
      description: Идентификатор файла и фраза / Ідентифікатор файлу і фраза / File id and sentence, e.g. campaigns/C1193/C1193.T0023.yml, «12 декабря 1994 года…»
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что не так / Що не так / What is wrong
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Источник / Джерело / Source
      description: Документ, книга, доклад, ссылка - чем это подтверждается / Документ, книга, доповідь, посилання - чим це підтверджується / A document, book, report or link that supports it
    validations:
      required: true
