name: Нет источника / Немає джерела / Missing source
description: Утверждение без сноски или сноска не подтверждает сказанное / Твердження без зноски або зноска не підтверджує сказане / A claim without a citation, or the citation does not support it
labels: [source]
body:
  - type: input
    id: where
    attributes:
      label: Где / Де / Where
      description: Идентификатор файла и фраза / Ідентифікатор файлу і фраза / File id and sentence
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что именно не подтверждено / Що саме не підтверджено / What is unsupported
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Известный вам источник, если есть / Відоме вам джерело, якщо є / A source you know, if any
