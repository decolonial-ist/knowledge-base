name: New material / Новий матеріал / Новый материал
description: A document or publication worth adding to the source archive / Документ або публікація, яку варто завести в архів джерел / Документ или публикация, которую стоит завести в архив источников
labels: [material]
body:
  - type: input
    id: title
    attributes:
      label: Title, author, year / Назва, автор, рік / Название, автор, год
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Link / Посилання / Ссылка
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What it supports and where it is needed / Що підтверджує і де знадобиться / Что подтверждает и где пригодится
    validations:
      required: true
