# После merge в main: проставить modified / version изменённым сущностям (роль autostamp.gs таблицы).
# Коммитит в main от имени github-actions; свой же коммит повторно не штампует (меняются только мета-поля).
name: stamp-meta

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: stamp changed entity files
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- tactics techniques actors tools campaigns | grep '\.yml$' || true)
          if [ -n "$CHANGED" ]; then python scripts/stamp_meta.py $CHANGED; fi
      - name: materials index from the archive registry
        run: python scripts/materials_index.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A tactics techniques actors tools campaigns MATERIALS.md
          git diff --cached --quiet || git commit -m "meta: modified/version для изменённых сущностей"
          git push
